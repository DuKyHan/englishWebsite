ed", "tense"], "answer": 0, "ipas": ["/ˈkɒnsntreɪt/", "/ˌself əˈweər/", "/strest/", "/tens/"], "vis": ["tập trung", "tự nhận thức", "bị căng thẳng", "căng thẳng (adj)"], "explanation": "Âm \"e\" trong \"concentrate\" phát âm /ə/, ba từ còn lại phát âm /e/."}, {"q": "9. Find the word which has a different sound in the part underlined.", "options": ["embarrassed", "depressed", "helpline", "empathize"], "answer": 2, "ipas": ["/ɪmˈbærəst/", "/dɪˈprest/", "/ˈhelplaɪn/", "/ˈempəθaɪz/"], "vis": ["xấu hổ", "chán nản", "đường dây trợ giúp", "đồng cảm"], "explanation": "Âm \"e\" trong \"helpline\" phát âm /e/, các từ \"embarrassed, depressed\" phát âm /ɪ/."}, {"q": "10. Find the word which has a different sound in the part underlined.", "options": ["embarrass", "missing", "classmate", "pressure"], "answer": 3, "ipas": ["/ɪmˈbærəs/", "/ˈmɪsɪŋ/", "/ˈklɑːsmeɪt/", "/ˈpreʃər/"], "vis": ["làm xấu hổ", "đang thiếu", "bạn cùng lớp", "áp lực"], "explanation": "\"ss\" trong \"pressure\" phát âm /ʃ/ (s nặng), ba từ còn lại phát âm /s/."}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Choose the word whose stress is not the same as that of the other three.", "options": ["worried", "cognitive", "concentrate", "frustrated"], "answer": 3, "ipas": ["/ˈwʌrid/", "/ˈkɒɡnətɪv/", "/ˈkɒnsntreɪt/", "/frʌˈstreɪtɪd/"], "vis": ["lo lắng", "thuộc nhận thức", "tập trung", "thất vọng, bực bội"], "explanation": "\"frustrated\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "2. Choose the word whose stress is not the same as that of the other three.", "options": ["wonderful", "emergency", "adulthood", "indicator"], "answer": 1, "ipas": ["/ˈwʌndəfl/", "/ɪˈmɜːdʒənsi/", "/əˈdʌlthʊd/", "/ˈɪndɪkeɪtər/"], "vis": ["tuyệt vời", "trường hợp khẩn cấp", "tuổi trưởng thành", "chỉ số, người chỉ dẫn"], "explanation": "\"emergency\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "3. Choose the word whose stress is not the same as that of the other three.", "options": ["adolescence", "independence", "discipline", "metropolitan"], "answer": 2, "ipas": ["/ˌædəˈlesns/", "/ˌɪndɪˈpendəns/", "/ˈdɪsəplɪn/", "/ˌmetrəˈpɒlɪtən/"], "vis": ["tuổi vị thành niên", "sự độc lập", "kỷ luật", "thuộc đô thị lớn"], "explanation": "\"discipline\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 3."}, {"q": "4. Choose the word whose stress is not the same as that of the other three.", "options": ["worried", "relaxed", "resolved", "aware"], "answer": 0, "ipas": ["/ˈwʌrid/", "/rɪˈlækst/", "/rɪˈzɒlvd/", "/əˈweər/"], "vis": ["lo lắng", "thư giãn", "đã giải quyết", "nhận thức được"], "explanation": "\"worried\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "5. Choose the word whose stress is not the same as that of the other three.", "options": ["relate", "contain", "boredom", "informed"], "answer": 2, "ipas": ["/rɪˈleɪt/", "/kənˈteɪn/", "/ˈbɔːdəm/", "/ɪnˈfɔːmd/"], "vis": ["liên quan", "chứa đựng", "sự buồn chán", "được biết tin"], "explanation": "\"boredom\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "6. Choose the word whose stress is not the same as that of the other three.", "options": ["cognitive", "adulthood", "confident", "encourage"], "answer": 3, "ipas": ["/ˈkɒɡnətɪv/", "/əˈdʌlthʊd/", "/ˈkɒnfɪdənt/", "/ɪnˈkʌrɪdʒ/"], "vis": ["thuộc nhận thức", "tuổi trưởng thành", "tự tin", "khuyến khích"], "explanation": "\"encourage\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "7. Choose the word whose stress is not the same as that of the other three.", "options": ["delighted", "manage", "convince", "depress"], "answer": 1, "ipas": ["/dɪˈlaɪtɪd/", "/ˈmænɪdʒ/", "/kənˈvɪns/", "/dɪˈpres/"], "vis": ["vui sướng", "quản lý", "thuyết phục", "làm chán nản"], "explanation": "\"manage\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "8. Choose the word whose stress is not the same as that of the other three.", "options": ["confident", "abandon", "depressed", "important"], "answer": 0, "ipas": ["/ˈkɒnfɪdənt/", "/əˈbændən/", "/dɪˈprest/", "/ɪmˈpɔːtnt/"], "vis": ["tự tin", "từ bỏ", "chán nản", "quan trọng"], "explanation": "\"confident\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "9. Choose the word whose stress is not the same as that of the other three.", "options": ["communicate", "disappointed", "preparation", "adolescence"], "answer": 0, "ipas": ["/kəˈmjuːnɪkeɪt/", "/ˌdɪsəˈpɔɪntɪd/", "/ˌprepəˈreɪʃn/", "/ˌædəˈlesns/"], "vis": ["giao tiếp", "thất vọng", "sự chuẩn bị", "tuổi vị thành niên"], "explanation": "\"communicate\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3."}, {"q": "10. Choose the word whose stress is not the same as that of the other three.", "options": ["pressure", "decision", "friendship", "guidance"], "answer": 1, "ipas": ["/ˈpreʃər/", "/dɪˈsɪʒn/", "/ˈfrendʃɪp/", "/ˈɡaɪdns/"], "vis": ["áp lực", "quyết định", "tình bạn", "sự hướng dẫn"], "explanation": "\"decision\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. Mono wants to become a singer; _________, he can't sing or play any instruments.", "options": ["therefore", "however", "because", "although"], "answer": 1, "explanation": "Hai mệnh đề mang ý đối lập (muốn thành ca sĩ nhưng không hát/chơi nhạc cụ được) → however.", "vis": ["vì vậy (sai — không phải quan hệ kết quả)", "tuy nhiên (đúng)", "bởi vì (sai — cần mệnh đề, không đứng giữa 2 câu độc lập kiểu này)", "mặc dù (sai — cần đứng đầu mệnh đề phụ)"], "tags": ["grammar"]}, {"q": "2. We often post many questions to discuss on a/an _______ after school.", "options": ["forum", "market", "club", "office"], "answer": 0, "explanation": "\"forum\" = diễn đàn — nơi để đăng câu hỏi thảo luận.", "vis": ["diễn đàn (đúng)", "chợ (sai nghĩa)", "câu lạc bộ (sai nghĩa)", "văn phòng (sai nghĩa)"], "tags": ["vocab"]}, {"q": "3. Parents should give teens some freedom, _________ they should also set limits.", "options": ["so", "but", "for", "however"], "answer": 1, "explanation": "Hai mệnh đề đối lập trong CÙNG một câu (nối bằng dấu phẩy) → dùng liên từ kết hợp \"but\".", "vis": ["vì vậy (sai quan hệ)", "nhưng (đúng)", "vì, bởi (sai quan hệ)", "tuy nhiên (sai — \"however\" không nối trực tiếp bằng dấu phẩy đơn giữa 2 mệnh đề)"], "tags": ["grammar"]}, {"q": "4. Nam often ________ to her Instagram account to chat with her sister in Ha Noi.", "options": ["logs on", "connects", "uploads", "checks"], "answer": 0, "explanation": "\"log on to\" = đăng nhập vào (tài khoản).", "vis": ["đăng nhập (đúng)", "kết nối (sai — không đi với \"to account\" theo cách này)", "tải lên (sai nghĩa)", "kiểm tra (sai nghĩa)"], "tags": ["vocab"]}, {"q": "5. Lan ______ with some friends, so she can't concentrate on the lesson now.", "options": ["is chatting", "chatted", "chatting", "will chat"], "answer": 0, "explanation": "Sự việc đang diễn ra ngay lúc nói (\"now\") → thì hiện tại tiếp diễn: is chatting.", "vis": ["đang nhắn tin (đúng)", "đã nhắn tin (quá khứ, sai thì)", "nhắn tin (V-ing, thiếu trợ động từ, sai)", "sẽ nhắn tin (tương lai, sai)"], "tags": ["grammar"]}, {"q": "6. She wanted to prepare for the exam; ______, she turned off her mobile phone.", "options": ["so", "but", "however", "therefore"], "answer": 3, "explanation": "Đứng sau dấu chấm phẩy, trước dấu phẩy, chỉ KẾT QUẢ → therefore (trạng từ liên kết).", "vis": ["vì vậy (sai vị trí ngữ pháp — \"so\" không đứng sau dấu ;)", "nhưng (sai quan hệ — không đối lập)", "tuy nhiên (sai quan hệ — không đối lập)", "do đó (đúng)"], "tags": ["grammar"]}, {"q": "7. Mr Buong decided______a new laptop last week.", "options": ["buy", "bought", "buying", "to buy"], "answer": 3, "explanation": "Cấu trúc: decide + to V.", "vis": ["mua (nguyên mẫu, sai)", "đã mua (sai)", "mua (V-ing, sai)", "mua (to-V, đúng)"], "tags": ["grammar"]}, {"q": "8. She worked hard, _______she passed the exam easily.", "options": ["so", "because", "if", "although"], "answer": 0, "explanation": "Mệnh đề sau chỉ KẾT QUẢ của việc học chăm chỉ → so.", "vis": ["vì vậy (đúng)", "bởi vì (sai quan hệ — đây không phải nguyên nhân)", "nếu (sai nghĩa)", "mặc dù (sai quan hệ)"], "tags": ["grammar"]}, {"q": "9. Mr. Quang used the facebook _______10 p.m last night.", "options": ["on", "in", "at", "for"], "answer": 2, "explanation": "Dùng giới từ \"at\" trước mốc giờ cụ thể.", "vis": ["vào (dùng cho ngày/thứ, sai)", "trong (sai)", "vào lúc (đúng — dùng cho giờ)", "trong khoảng (sai)"], "tags": ["grammar"]}, {"q": "10. Ba is tired _______he stayed up late watching the clips on Tiktok last night.", "options": ["because", "as", "since", "A, B, C are correct"], "answer": 3, "explanation": "\"because\", \"as\", \"since\" đều có nghĩa \"bởi vì\" và đều dùng được ở đây.", "vis": ["bởi vì (đúng nhưng chưa đủ)", "vì, bởi (đúng nhưng chưa đủ)", "vì, bởi (đúng nhưng chưa đủ)", "cả A, B, C đều đúng (đúng nhất)"], "tags": ["grammar"]}, {"q": "11. He isn't going to the concert………….the tickets are too expensive.", "options": ["Though", "in spite of", "because", "because of"], "answer": 2, "explanation": "Sau chỗ trống là một MỆNH ĐỀ (S+V: \"the tickets are too expensive\") → dùng \"because\".", "vis": ["mặc dù (sai — cần mệnh đề đối lập, ở đây là nguyên nhân)", "mặc dù (sai — đi với cụm danh từ, không phải mệnh đề)", "bởi vì (đúng — đi với mệnh đề)", "bởi vì (sai — đi với cụm danh từ, không phải mệnh đề)"], "tags": ["grammar"]}, {"q": "12. No one in the volunteer group is ______Jack is.", "options": ["more active as", "as active than", "more active", "so active as"], "answer": 3, "explanation": "Cấu trúc so sánh bằng ở thể phủ định: not... so/as + adj + as.", "vis": ["sai cấu trúc (trộn lẫn 2 dạng)", "sai cấu trúc (trộn lẫn 2 dạng)", "thiếu \"as\" nên chưa hoàn chỉnh so sánh bằng", "tích cực bằng (đúng — so sánh bằng)"], "tags": ["grammar"]}, {"q": "13. There is nothing _____________ than going swimming in hot weather.", "options": ["gooder", "good", "better", "more goodly"], "answer": 2, "explanation": "So sánh hơn bất quy tắc của \"good\" là \"better\".", "vis": ["sai — không tồn tại dạng này", "tốt (nguyên thể, sai vì cần so sánh hơn)", "tốt hơn (đúng)", "sai — không tồn tại dạng này"], "tags": ["grammar"]}, {"q": "14. Lam is very sensitive, _________you shouldn't comment on his new shoes.", "options": ["but", "therefore", "however", "so"], "answer": 3, "explanation": "Mệnh đề sau chỉ KẾT QUẢ (vì nhạy cảm nên đừng bình luận) → so.", "vis": ["nhưng (sai quan hệ)", "do đó (sai vị trí — cần dấu ; trước \"therefore\", ở đây chỉ có dấu phẩy)", "tuy nhiên (sai quan hệ)", "vì vậy (đúng)"], "tags": ["grammar"]}, {"q": "15. Mr Buong likes showing off his new things;_________, he often posts pictures on social media.", "options": ["because", "therefore", "although", "but"], "answer": 1, "explanation": "Đứng sau dấu chấm phẩy, chỉ KẾT QUẢ (thích khoe nên hay đăng ảnh) → therefore.", "vis": ["bởi vì (sai — cần mệnh đề, đây là 2 câu độc lập)", "do đó (đúng)", "mặc dù (sai quan hệ)", "nhưng (sai quan hệ)"], "tags": ["grammar"]}, {"q": "16. Nowadays, many people like to spend their free time ________ the Internet.", "options": ["surfing", "surf", "are surfing", "to surf"], "answer": 0, "explanation": "Cấu trúc: spend time + V-ing.", "vis": ["lướt (V-ing, đúng)", "lướt (nguyên mẫu, sai)", "đang lướt (sai cấu trúc)", "lướt (to-V, sai)"], "tags": ["grammar"]}, {"q": "17. Ba wanted ________ with his family on a day trip to his home village.", "options": ["to join", "join", "joining", "will join"], "answer": 0, "explanation": "Cấu trúc: want + to V.", "vis": ["tham gia (to-V, đúng)", "tham gia (nguyên mẫu, sai)", "tham gia (V-ing, sai)", "sẽ tham gia (sai)"], "tags": ["grammar"]}, {"q": "18. Every road user ________ obey traffic rules strictly to prevent accidents.", "options": ["ought", "must", "could", "may"], "answer": 1, "explanation": "\"must\" diễn tả sự bắt buộc phải tuân thủ luật lệ giao thông.", "vis": ["nên (thiếu \"to\" sau ought, sai cấu trúc)", "phải (đúng — bắt buộc)", "có thể (sai nghĩa — chỉ khả năng)", "có thể (sai nghĩa — chỉ sự cho phép)"], "tags": ["grammar"]}, {"q": "19. Listening to folk songs ________ me a great pleasure and I feel very stressed.", "options": ["give", "are giving", "gave", "gives"], "answer": 3, "explanation": "Chủ ngữ là danh động từ \"Listening\" (số ít) → động từ chia số ít: gives.", "vis": ["cho (thiếu -s, sai)", "đang cho (sai thì)", "đã cho (sai thì)", "cho (đúng — chia đúng ngôi số ít)"], "tags": ["grammar"]}, {"q": "20. My principal is always ________ first person to arrive at the school every morning.", "options": ["a", "an", "the", "Ø (no article)"], "answer": 2, "explanation": "Dùng mạo từ \"the\" trước số thứ tự/tính từ so sánh nhất (the first).", "vis": ["một (sai — không dùng \"a\" trước số thứ tự)", "một (sai — không dùng \"an\" trước phụ âm)", "(đúng — mạo từ xác định trước \"first\")", "không mạo từ (sai — cần \"the\")"], "tags": ["grammar"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "1. The women actively ___________________ in the creation of the artwork.", "hint": "(PARTICIPATE)", "answer": "participated", "explanation": "Cần ĐỘNG TỪ chia thì quá khứ (câu kể lại một việc đã xảy ra) → participated.", "vi": "Những người phụ nữ đã tích cực tham gia vào việc tạo ra tác phẩm nghệ thuật.", "family": ["participate (v): tham gia", "participation (n): sự tham gia", "participant (n): người tham dự"]}, {"q": "2. We were very pleased with the high level of ________________ in the charity events.", "hint": "(PARTICIPATE)", "answer": "participation", "explanation": "Sau \"level of\" cần DANH TỪ → participation (sự tham gia).", "vi": "Chúng tôi rất hài lòng với mức độ tham gia cao trong các sự kiện từ thiện.", "family": ["participate (v): tham gia", "participation (n): sự tham gia", "participant (n): người tham dự"]}, {"q": "3. The games is an international sporting event with more than three thousand ____________.", "hint": "(PARTICIPATE)", "answer": "participants", "explanation": "Sau số đếm \"three thousand\" cần DANH TỪ SỐ NHIỀU chỉ người → participants.", "vi": "Giải đấu là sự kiện thể thao quốc tế với hơn ba nghìn người tham dự.", "family": ["participate (v): tham gia", "participation (n): sự tham gia", "participant (n): người tham dự"]}, {"q": "4. The interview showed her as a self-assured and ___________________ student.", "hint": "(MATURITY)", "answer": "mature", "explanation": "Bổ nghĩa cho \"student\", song song với tính từ \"self-assured\" → cần TÍNH TỪ → mature.", "vi": "Buổi phỏng vấn cho thấy cô ấy là một học sinh tự tin và chín chắn.", "family": ["mature (adj): chín chắn, trưởng thành", "maturity (n): sự trưởng thành"]}, {"q": "5. It's time for him to match his _________ with his golf and realise he's not going to win every time.", "hint": "(MATURE)", "answer": "maturity", "explanation": "Sau tính từ sở hữu \"his\" cần DANH TỪ → maturity (sự trưởng thành).", "vi": "Đã đến lúc anh ấy cần trưởng thành hơn trong môn golf và nhận ra mình không thể thắng mọi lúc.", "family": ["mature (adj): chín chắn, trưởng thành", "maturity (n): sự trưởng thành"]}, {"q": "6. When _____________, we release cortisone into the body, and this increases the appetite.", "hint": "(STRESS)", "answer": "stressed", "explanation": "Chỉ trạng thái con người bị căng thẳng → TÍNH TỪ đuôi -ed → stressed.", "vi": "Khi bị căng thẳng, cơ thể chúng ta tiết ra cortisone, làm tăng cảm giác thèm ăn.", "family": ["stress (n): sự căng thẳng", "stressed (adj): bị căng thẳng", "stressful (adj): gây ra căng thẳng"]}, {"q": "7. She's very good at coping in ___________________ situations.", "hint": "(STRESS)", "answer": "stressful", "explanation": "Bổ nghĩa cho danh từ \"situations\" (tình huống gây ra căng thẳng) → stressful.", "vi": "Cô ấy rất giỏi ứng phó trong những tình huống căng thẳng.", "family": ["stress (n): sự căng thẳng", "stressed (adj): bị căng thẳng", "stressful (adj): gây ra căng thẳng"]}, {"q": "8. There was a general air of ___________________ in the crowd.", "hint": "(EXPECT)", "answer": "expectation", "explanation": "Sau giới từ \"of\" cần DANH TỪ → expectation (sự mong chờ).", "vi": "Có một bầu không khí mong chờ chung trong đám đông.", "family": ["expect (v): mong đợi", "expectancy (n): tình trạng mong chờ", "expectation (n): sự mong chờ", "expectant (adj): có tính mong chờ", "expected (adj): hy vọng, mong đợi", "unexpected (adj): bất ngờ, thình lình", "expectantly (adv): một cách mong đợi", "unexpectedly (adv): một cách bất ngờ"]}, {"q": "9. The article was written before the election resulted in the clear ___________________ of a Labour victory.", "hint": "(EXPECT)", "answer": "expectation", "explanation": "Sau tính từ \"clear\" cần DANH TỪ → expectation.", "vi": "Bài báo được viết trước khi cuộc bầu cử dẫn đến sự kì vọng rõ ràng về chiến thắng của Đảng Lao động.", "family": ["expect (v): mong đợi", "expectancy (n): tình trạng mong chờ", "expectation (n): sự mong chờ", "expectant (adj): có tính mong chờ", "expected (adj): hy vọng, mong đợi", "unexpected (adj): bất ngờ, thình lình", "expectantly (adv): một cách mong đợi", "unexpectedly (adv): một cách bất ngờ"]}, {"q": "10. He looked ___________________ at Sarah, but she didn't speak.", "hint": "(EXPECT)", "answer": "expectantly", "explanation": "Bổ nghĩa cho động từ \"looked\" cần TRẠNG TỪ → expectantly (nhìn một cách mong đợi).", "vi": "Anh ấy nhìn Sarah một cách đầy mong đợi, nhưng cô ấy không nói gì.", "family": ["expect (v): mong đợi", "expectancy (n): tình trạng mong chờ", "expectation (n): sự mong chờ", "expectant (adj): có tính mong chờ", "expected (adj): hy vọng, mong đợi", "unexpected (adj): bất ngờ, thình lình", "expectantly (adv): một cách mong đợi", "unexpectedly (adv): một cách bất ngờ"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "A) Social networking", "html": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively.", "vi": "Mạng xã hội là công nghệ ngày càng trở nên phổ biến vì tính thân thiện với người dùng. Các trang mạng xã hội như Facebook, Instagram, Twitter,... cho phép mọi người giao tiếp với nhau bất kể khoảng cách. Khi nhìn vào mặt tích cực, mạng xã hội có nhiều lợi ích. Tuy nhiên bên cạnh những lợi ích rõ ràng đó, mạng xã hội cũng bị xem là một trong những tác nhân gây hại nhất cho xã hội. Nếu không sử dụng mạng xã hội có trách nhiệm, nó có thể gây ảnh hưởng xấu đến người dùng. Tóm lại, mạng xã hội có cả lợi và hại — có hại khi dùng quá mức nhưng hữu ích nếu dùng đúng cách."}, "questions": [{"q": "1.", "options": ["excited", "unpopular", "popular", "interesting"], "answer": 2, "vis": ["hào hứng", "không phổ biến", "phổ biến (đúng)", "thú vị"], "explanation": "\"popular\" hợp nghĩa với bối cảnh mạng xã hội ngày càng phổ biến."}, {"q": "2.", "options": ["enable", "connects", "connecting", "cannot"], "answer": 0, "vis": ["cho phép (đúng — enable sb to do sth)", "kết nối (sai chủ ngữ số nhiều)", "đang kết nối (sai dạng)", "không thể (sai nghĩa)"], "explanation": "Cấu trúc \"enable sb to do sth\" = cho phép ai làm gì."}, {"q": "3.", "options": ["at", "for", "in", "on"], "answer": 0, "vis": ["vào (đúng — look at)", "cho", "trong", "trên"], "explanation": "Cụm từ \"look at\" = nhìn vào, xem xét."}, {"q": "4.", "options": ["is", "are", "isn't", "aren't"], "answer": 1, "vis": ["là (số ít, sai)", "có (số nhiều, đúng)", "không phải (số ít, sai)", "không có (số nhiều, sai nghĩa)"], "explanation": "\"several advantages\" là danh từ số nhiều → dùng \"are\"."}, {"q": "5.", "options": ["because", "Although", "If", "While"], "answer": 2, "vis": ["bởi vì (sai — không phải câu điều kiện)", "mặc dù (sai nghĩa)", "nếu (đúng — câu điều kiện loại 1)", "trong khi (sai nghĩa)"], "explanation": "Câu điều kiện loại 1: \"If social media is not used responsibly, it can...\"."}, {"q": "6.", "options": ["harmless", "better", "benefits", "harmful"], "answer": 3, "vis": ["vô hại (sai nghĩa, trái ngược)", "tốt hơn (sai nghĩa)", "lợi ích (sai từ loại)", "có hại (đúng)"], "explanation": "Dùng quá mức (excessively) sẽ gây hại (harmful)."}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "B) Getting around Singapore", "html": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way.", "vi": "Khi ở Singapore, bạn có thể di chuyển bằng taxi, xe buýt, hoặc tàu điện ngầm. Tôi thích tàu điện ngầm hơn vì nó nhanh, dễ và rẻ. Có nhiều xe buýt và taxi ở Singapore nên không thể lái xe nhanh và không dừng nhiều, đặc biệt vào sáng thứ Hai. Vì vậy tàu điện ngầm thường nhanh hơn taxi hoặc xe buýt. Nếu bạn không rành Singapore, sẽ khó tìm đúng xe buýt cần đi. Bạn có thể đi taxi, nhưng đắt hơn tàu điện ngầm hoặc xe buýt. Trên tàu điện ngầm có bản đồ tốt ghi tên các trạm và chỉ cách đến đó. Vì thế, rất dễ để tìm đường."}, "questions": [{"q": "1.", "options": ["by", "in", "at", "on"], "answer": 0, "vis": ["bằng (đúng — by taxi)", "trong", "tại", "trên"], "explanation": "Cụm \"by taxi\" = bằng xe taxi."}, {"q": "2.", "options": ["quick", "quickly", "quicker", "quickest"], "answer": 1, "vis": ["nhanh (tính từ, sai)", "nhanh chóng (trạng từ, đúng — bổ nghĩa cho \"drive\")", "nhanh hơn (sai)", "nhanh nhất (sai)"], "explanation": "Động từ \"drive\" cần trạng từ \"quickly\" bổ nghĩa."}, {"q": "3.", "options": ["at", "on", "for", "in"], "answer": 1, "vis": ["vào lúc (sai — dùng cho giờ)", "vào (đúng — on Monday morning)", "trong (sai)", "trong (sai)"], "explanation": "Dùng giới từ \"on\" trước thứ trong tuần."}, {"q": "4.", "options": ["so", "like", "than", "as"], "answer": 2, "vis": ["vì vậy (sai từ loại)", "giống như (sai)", "hơn (đúng — so sánh hơn)", "như (sai)"], "explanation": "Cấu trúc so sánh hơn \"quicker than\"."}, {"q": "5.", "options": ["who", "what", "when", "how"], "answer": 3, "vis": ["ai (sai nghĩa)", "cái gì (sai nghĩa)", "khi nào (sai nghĩa)", "làm thế nào (đúng)"], "explanation": "\"how to get to them\" = làm thế nào để đi đến đó."}, {"q": "6.", "options": ["Therefore", "so", "Although", "However"], "answer": 0, "vis": ["vì thế (đúng)", "vì vậy (sai — không viết hoa đầu câu kiểu này)", "mặc dù (sai quan hệ)", "tuy nhiên (sai quan hệ)"], "explanation": "\"Therefore\" (vì thế) chỉ kết quả của việc có bản đồ tốt."}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "C) Mandi's story", "html": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\"", "vi": "Tôi tên Mandi. Ba tháng trước, tôi đến một buổi disco và gặp một chàng trai tên Tom. Tôi đoán anh ấy lớn tuổi hơn tôi, nhưng tôi thích anh ấy và nghĩ điều đó không quan trọng. Anh ấy nói mình 18 tuổi, tôi nói dối là 16 (thật ra tôi chỉ mới 13). Sau đó chúng tôi hẹn gặp lại, đi ăn hamburger, và có những khoảnh khắc vui vẻ. Mọi thứ diễn ra tốt đẹp, nhưng tôi phải nói dối bố mẹ về việc mình đi đâu và với ai. Tôi biết nếu bố mẹ biết tuổi thật của Tom, họ sẽ ngăn tôi gặp anh ấy. Giờ tôi thực sự không biết phải làm gì, cảm thấy lo lắng và rối bời, cần lời khuyên ngay. — Trích thư gửi đường dây trợ giúp của một tạp chí dành cho thanh thiếu niên."}, "questions": [{"q": "1. Mandi met Tom at a disco three months ago.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Three months ago, I went to a disco where I met a boy called Tom.\" → Đúng."}, {"q": "2. Mandi told Tom that she was thirteen years old.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: Mandi thực ra 13 tuổi nhưng nói dối Tom là 16 tuổi (\"I told him I was 16\") → Sai."}, {"q": "3. Mandi has to lie to her parents when she goes out with Tom.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"I've had to lie to my parents about where I'm going and who with\" → Đúng."}, {"q": "4. Mandi is asking for advice because she is worried about her situation.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"I'm really worried... I need some advice now.\" → Đúng."}, {"q": "5. Why has Mandi written this?", "options": ["to describe her boyfriend", "to explain a problem", "to defend her actions", "to prove how clever she is"], "answer": 1, "explanation": "Mandi viết thư để kể về rắc rối của mình và xin lời khuyên."}, {"q": "6. Who is she writing to?", "options": ["her parents", "a teenage magazine", "her boyfriend", "a school friend"], "answer": 1, "explanation": "Cuối bài ghi rõ: \"From the helpline on the magazine for teens.\""}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "D) Facebook and students", "html": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way.", "vi": "Với khoảng 2.96 tỷ người dùng tính đến năm 2022, Facebook chắc chắn là một trong những mạng xã hội được yêu thích nhất thế giới. Học sinh sử dụng Facebook cho nhiều mục đích, bao gồm giải trí và học tập. Đó là kênh thư giãn để giải tỏa cảm xúc tiêu cực, chia sẻ kỷ niệm, xem clip vui để giảm căng thẳng. Ngoài ra, học sinh dễ dàng kết nối với người có cùng sở thích qua các trang Facebook. Thứ hai, Facebook — được coi là nền tảng kiến thức lớn nhất — giúp người học tiếp cận tài liệu học miễn phí và hỏi kiến thức chuyên sâu từ người dùng khác. Bên cạnh đó, rất tiện lợi khi tạo nhóm chat trên Messenger để chia sẻ bài giảng, chuẩn bị thuyết trình và làm bài tập cùng nhau. Tóm lại, Facebook có thể góp phần vào thành tích học tập của học sinh nếu biết tận dụng đúng cách."}, "questions": [{"q": "1. Facebook had approximately 2.96 billion users in 2022.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"With approximately 2.96 billion users as of 2022...\" → Đúng."}, {"q": "2. Students only use Facebook for entertainment purposes.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: học sinh dùng Facebook cho cả giải trí lẫn học tập (\"including entertainment or academic learning\") → Sai."}, {"q": "3. Facebook allows students to connect with people who have similar interests.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"they can easily connect with those who have the same interests...\" → Đúng."}, {"q": "4. Students cannot use Facebook Messenger to prepare for presentations or do assignments together.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nói ngược lại: rất tiện lợi để chuẩn bị thuyết trình và làm bài tập cùng nhau qua Messenger → Sai."}, {"q": "5. What does the word \"it\" in line 4 mean?", "options": ["Facebook", "Entertainment", "School life", "The student"], "answer": 0, "explanation": "\"it\" thay thế cho danh từ chỉ nền tảng Facebook được nhắc ở câu trước."}, {"q": "6. According to the passage, where can students find like-minded ones?", "options": ["Facebook Messenger", "Facebook comments", "Facebook pages", "Facebook wall"], "answer": 2, "explanation": "Bài đọc: \"...through various Facebook pages where they enjoy reading top comments...\"."}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "1.", "original": "Jack has a new laptop; however, he never logs on his account on the Facebook.", "starter": "Although", "answer": "Jack has a new laptop, he never logs on his account on Facebook", "accepted": null, "explanation": "S1; however, S2 → Although S1, S2 — nối 2 ý đối lập bằng \"although\" thay vì \"however\".", "vi": "Mặc dù Jack có laptop mới, cậu ấy không bao giờ đăng nhập tài khoản Facebook.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"q": "2.", "original": "Lan wants to study better, so she turns off her mobile phone.", "starter": "Because", "answer": "Lan wants to study better, she turns off her mobile phone", "accepted": null, "explanation": "S1, so S2 → Because S1, S2 (S2 là kết quả của việc S1).", "vi": "Vì Lan muốn học tốt hơn nên cô ấy tắt điện thoại.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"q": "3.", "original": "Tuan is hard-working, so he often gets good marks on exams.", "starter": "Because", "answer": "Tuan is hard-working, he often gets good marks on exams", "accepted": null, "explanation": "S1, so S2 → Because S1, S2. (Lưu ý: câu gốc trong đề cương có lỗi đánh máy \"Tuan is hard\", đã sửa thành \"Tuan is hard-working\" cho đúng nghĩa và ngữ pháp.)", "vi": "Vì Tuấn chăm chỉ nên cậu ấy thường đạt điểm cao trong các kỳ thi.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"q": "4.", "original": "Mono bought a lot of books, for he likes reading.", "starter": "Mono bought a lot of books", "answer": "because he likes reading", "accepted": null, "explanation": "S1, for S2 (lý do) → S1 because S2. \"for\" mang nghĩa \"vì\" trong văn viết trang trọng, chuyển thành \"because\" thông dụng hơn.", "vi": "Mono mua nhiều sách vì cậu ấy thích đọc.", "note": "S1, for S2 (lý do) → S1 because S2"}, {"q": "5.", "original": "Quan is a club member; however he never participates in any activities.", "starter": "Although", "answer": "Quan is a club member, he never participates in any activities", "accepted": null, "explanation": "S1; however, S2 → Although S1, S2.", "vi": "Mặc dù Quân là thành viên câu lạc bộ, cậu ấy không bao giờ tham gia hoạt động nào.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"q": "6.", "original": "Phong didn't study hard, so he didn't pass the entrance exam.", "starter": "Because", "answer": "Phong didn't study hard, he didn't pass the entrance exam", "accepted": null, "explanation": "S1, so S2 → Because S1, S2.", "vi": "Bởi vì Phong không học chăm, cậu ấy đã trượt kỳ thi tuyển sinh.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"q": "7.", "original": "He has a smart phone, but he never logs on his account on Facebook.", "starter": "Although", "answer": "he has a smart phone, he never logs on his account on Facebook", "accepted": null, "explanation": "S1, but S2 → Although S1, S2.", "vi": "Mặc dù có điện thoại thông minh, cậu ấy không bao giờ đăng nhập Facebook.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"q": "8.", "original": "She first disagreed to join our journey. She changed her mind later. (however)", "starter": "She first disagreed to join our journey;", "answer": "however, she changed her mind later", "accepted": null, "explanation": "Câu1. Câu2. (however) → Câu1; however, câu2. — trạng từ liên kết \"however\" đứng sau dấu chấm phẩy, trước dấu phẩy.", "vi": "Ban đầu cô ấy không đồng ý tham gia chuyến đi của chúng tôi; tuy nhiên, sau đó cô ấy đã đổi ý.", "note": "Câu1. Câu2. (+ liên từ gợi ý) → Câu1; liên từ, câu2."}, {"q": "9.", "original": "I was ill yesterday. I could not come. (therefore)", "starter": "I was ill yesterday;", "answer": "therefore, I could not come", "accepted": null, "explanation": "Câu1. Câu2. (therefore) → Câu1; therefore, câu2. — \"therefore\" chỉ kết quả.", "vi": "Hôm qua tôi bị ốm; do đó, tôi không thể đến.", "note": "Câu1. Câu2. (+ liên từ gợi ý) → Câu1; liên từ, câu2."}, {"q": "10.", "original": "We will have five days off this holiday. It is preceded by a couple of weekends. (moreover)", "starter": "We will have five days off this holiday;", "answer": "moreover, it is preceded by a couple of weekends", "accepted": null, "explanation": "Câu1. Câu2. (moreover) → Câu1; moreover, câu2. — \"moreover\" bổ sung thêm thông tin.", "vi": "Chúng ta sẽ được nghỉ 5 ngày dịp này; hơn thế nữa, kỳ nghỉ còn được nối liền với 2 cuối tuần.", "note": "Câu1. Câu2. (+ liên từ gợi ý) → Câu1; liên từ, câu2."}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"pressure\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "pressure", "ipa": "/ˈpreʃə(r)/", "pos": "noun", "senses": [{"def": "the act of trying to persuade or force somebody to do something", "examples": ["He backed down under pressure from his colleagues.", "The company is under pressure to increase its profits.", "Teachers are under constant pressure to improve exam results.", "She put pressure on him to sign the contract.", "There is growing pressure for changes in the law."]}], "vi": "<b>pressure</b> /ˈpreʃə(r)/ (danh từ)<br>hành động cố gắng thuyết phục hoặc ép buộc ai đó làm gì.<br>• Anh ấy đã nhượng bộ trước áp lực từ đồng nghiệp.<br>• Công ty đang chịu áp lực phải tăng lợi nhuận.<br>• Giáo viên liên tục chịu áp lực phải cải thiện kết quả thi.<br>• Cô ấy gây áp lực để anh ta ký hợp đồng.<br>• Có áp lực ngày càng tăng đòi thay đổi luật."}, "questions": [{"q": "A. There is ______________ from the public for the government to lower taxes this year.", "answer": "growing pressure", "explanation": "Dựa vào ví dụ: growing pressure.", "vi": "Có áp lực ngày càng tăng từ công chúng đòi chính phủ giảm thuế năm nay."}, {"q": "B. The manager had to change his mind because he was ______________ from the team.", "answer": "under pressure", "explanation": "Dựa vào ví dụ: under pressure.", "vi": "Người quản lý phải đổi ý vì chịu áp lực từ đội nhóm."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"bully\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "bully", "ipa": "/ˈbʊli/", "pos": "verb", "senses": [{"def": "to frighten or hurt a weaker person; to use your strength or power to make somebody do something", "examples": ["Bullying is a problem in many schools — some students bully their classmates.", "He was bullied into signing the contract by his boss.", "She refused to be bullied by threats of violence.", "The older boys used to cyberbully younger students on social media."]}], "vi": "<b>bully</b> /ˈbʊli/ (động từ)<br>làm ai sợ hãi hoặc bị tổn thương; dùng sức mạnh/quyền lực để ép ai đó làm gì.<br>• Bắt nạt là vấn đề ở nhiều trường học — một số học sinh bắt nạt bạn cùng lớp.<br>• Anh ta bị ép ký hợp đồng bởi sếp của mình.<br>• Cô ấy từ chối bị đe dọa bằng bạo lực.<br>• Các anh lớn từng bắt nạt qua mạng các em nhỏ hơn trên mạng xã hội."}, "questions": [{"q": "A. With the rise of smartphones, it has become easier for teenagers to _______________________, which causes severe mental health issues.", "answer": "cyberbully younger students", "explanation": "Dựa vào ví dụ: cyberbully younger students.", "vi": "Với sự phổ biến của điện thoại thông minh, việc bắt nạt qua mạng các học sinh nhỏ tuổi hơn trở nên dễ dàng hơn, gây ra các vấn đề tâm lý nghiêm trọng."}, {"q": "B. The school has a strict rule against students who try to _______________________ during break time.", "answer": "bully", "explanation": "Điền động từ \"bully\" (bắt nạt) theo đúng nghĩa từ điển.", "vi": "Nhà trường có quy định nghiêm ngặt đối với học sinh cố tình bắt nạt bạn khác trong giờ ra chơi."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "15. What does this sign tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫⛏️🌳</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">TREE PLANTING ZONE — DO NOT DIG</p></div>", "options": ["You must use heavy machinery to remove trees.", "You should not cut down any big plants here.", "You should plant new green trees in this area.", "You should not dig up the ground in this area."], "answer": 3, "vis": ["Bạn phải dùng máy móc hạng nặng để loại bỏ cây cối.", "Bạn không nên chặt cây to ở đây.", "Bạn nên trồng cây xanh mới ở khu vực này.", "Bạn không nên đào xới đất ở khu vực này."], "explanation": "Biển báo \"Tree planting zone — Do not dig\" (khu vực trồng cây — không được đào xới)."}, {"q": "16. What does this notification from the school library mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫💻🔇</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">NO COMPUTERS — SILENT STUDY AREA</p></div>", "options": ["You can return or check out reference books.", "You are allowed to talk quietly with your peers.", "You cannot use the computer devices at this time.", "You can read newspapers loudly with your friends."], "answer": 2, "vis": ["Bạn có thể trả hoặc mượn sách tham khảo.", "Bạn được phép nói chuyện nhỏ với bạn bè.", "Bạn không được dùng máy tính lúc này.", "Bạn có thể đọc báo to cùng bạn bè."], "explanation": "Biển \"No computers — Silent study area\" → không dùng máy tính trong khu vực học im lặng."}, {"q": "17. What does this sign tell you?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-rose-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫😡💬</div><p class=\"text-[11px] font-black text-center text-rose-700 leading-tight\">BE KIND — NO BULLYING ON THIS FORUM</p></div>", "options": ["Teenagers should use nice words and avoid bullying on the forum.", "You must share your personal account with other people.", "You are allowed to fight online.", "Only school pupils can see this notice."], "answer": 0, "vis": ["Thanh thiếu niên nên dùng lời hay và tránh bắt nạt trên diễn đàn.", "Bạn phải chia sẻ tài khoản cá nhân cho người khác.", "Bạn được phép cãi vã trên mạng.", "Chỉ học sinh trường mới xem được thông báo này."], "explanation": "Biển báo yêu cầu trên diễn đàn cần tử tế, không bạo lực/bắt nạt."}, {"q": "18. What does this notice mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔧📚🚪</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">LIBRARY CLOSED JUNE 7 — REPAIR WORK</p></div>", "options": ["The library will permanently shut down from June.", "Students cannot enter the library on June 7 due to repair work.", "The library will be open normally on June 7.", "You can return books late without paying any fee."], "answer": 1, "vis": ["Thư viện sẽ đóng cửa vĩnh viễn từ tháng 6.", "Học sinh không được vào thư viện ngày 7/6 vì sửa chữa.", "Thư viện mở cửa bình thường ngày 7/6.", "Bạn có thể trả sách trễ mà không mất phí."], "explanation": "Biển báo thông báo thư viện đóng cửa để bảo trì vào ngày 7/6."}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 3", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 3 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>boy</b> <span class='text-slate-400'>/bɔɪ/</span> · <b class='text-slate-500'>coin</b> <span class='text-slate-400'>/kɔɪn/</span> · <b class='text-slate-500'>foil</b> <span class='text-slate-400'>/fɔɪl/</span> · <b class='text-emerald-700'>assure</b> <span class='text-slate-400'>/əˈʃʊər/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"assure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-emerald-700'>insurance</b> <span class='text-slate-400'>/ɪnˈʃʊərəns/</span> · <b class='text-slate-500'>toil</b> <span class='text-slate-400'>/tɔɪl/</span> · <b class='text-slate-500'>voice</b> <span class='text-slate-400'>/vɔɪs/</span> · <b class='text-slate-500'>enjoy</b> <span class='text-slate-400'>/ɪnˈdʒɔɪ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"insurance\" phát âm /ʊə/ hoặc /ʃʊə/, ba từ còn lại phát âm /ɔɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>oil</b> <span class='text-slate-400'>/ɔɪl/</span> · <b class='text-slate-500'>boil</b> <span class='text-slate-400'>/bɔɪl/</span> · <b class='text-emerald-700'>poor</b> <span class='text-slate-400'>/pʊər/</span> · <b class='text-slate-500'>toy</b> <span class='text-slate-400'>/tɔɪ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"poor\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>joy</b> <span class='text-slate-400'>/dʒɔɪ/</span> · <b class='text-emerald-700'>sure</b> <span class='text-slate-400'>/ʃʊər/</span> · <b class='text-slate-500'>point</b> <span class='text-slate-400'>/pɔɪnt/</span> · <b class='text-slate-500'>destroy</b> <span class='text-slate-400'>/dɪˈstrɔɪ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"sure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>skill</b> <span class='text-slate-400'>/skɪl/</span> · <b class='text-slate-500'>house-keeping</b> <span class='text-slate-400'>/ˈhaʊskiːpɪŋ/</span> · <b class='text-emerald-700'>tense</b> <span class='text-slate-400'>/tens/</span> · <b class='text-slate-500'>decision</b> <span class='text-slate-400'>/dɪˈsɪʒn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"tense\" phát âm /e/, ba từ còn lại chứa âm /ɪ/ hoặc /i/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-slate-500'>advice</b> <span class='text-slate-400'>/ədˈvaɪs/</span> · <b class='text-emerald-700'>decision</b> <span class='text-slate-400'>/dɪˈsɪʒn/</span> · <b class='text-slate-500'>delighted</b> <span class='text-slate-400'>/dɪˈlaɪtɪd/</span> · <b class='text-slate-500'>helpline</b> <span class='text-slate-400'>/ˈhelplaɪn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"decision\" phát âm /ɪ/ (i ngắn), ba từ còn lại phát âm /aɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>7. <b class='text-slate-500'>study</b> <span class='text-slate-400'>/ˈstʌdi/</span> · <b class='text-slate-500'>adulthood</b> <span class='text-slate-400'>/əˈdʌlthʊd/</span> · <b class='text-emerald-700'>columnist</b> <span class='text-slate-400'>/ˈkɒləmnɪst/</span> · <b class='text-slate-500'>frustrated</b> <span class='text-slate-400'>/frʌˈstreɪtɪd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 Âm \"u\" trong \"columnist\" phát âm /ə/, ba từ còn lại phát âm /ʌ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>8. <b class='text-emerald-700'>concentrate</b> <span class='text-slate-400'>/ˈkɒnsntreɪt/</span> · <b class='text-slate-500'>self-aware</b> <span class='text-slate-400'>/ˌself əˈweər/</span> · <b class='text-slate-500'>stressed</b> <span class='text-slate-400'>/strest/</span> · <b class='text-slate-500'>tense</b> <span class='text-slate-400'>/tens/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 Âm \"e\" trong \"concentrate\" phát âm /ə/, ba từ còn lại phát âm /e/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>9. <b class='text-slate-500'>embarrassed</b> <span class='text-slate-400'>/ɪmˈbærəst/</span> · <b class='text-slate-500'>depressed</b> <span class='text-slate-400'>/dɪˈprest/</span> · <b class='text-emerald-700'>helpline</b> <span class='text-slate-400'>/ˈhelplaɪn/</span> · <b class='text-slate-500'>empathize</b> <span class='text-slate-400'>/ˈempəθaɪz/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 Âm \"e\" trong \"helpline\" phát âm /e/, các từ \"embarrassed, depressed\" phát âm /ɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>10. <b class='text-slate-500'>embarrass</b> <span class='text-slate-400'>/ɪmˈbærəs/</span> · <b class='text-slate-500'>missing</b> <span class='text-slate-400'>/ˈmɪsɪŋ/</span> · <b class='text-slate-500'>classmate</b> <span class='text-slate-400'>/ˈklɑːsmeɪt/</span> · <b class='text-emerald-700'>pressure</b> <span class='text-slate-400'>/ˈpreʃər/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"ss\" trong \"pressure\" phát âm /ʃ/ (s nặng), ba từ còn lại phát âm /s/.</p></div></div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Trọng âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>worried</b> <span class='text-slate-400'>/ˈwʌrid/</span> · <b class='text-slate-500'>cognitive</b> <span class='text-slate-400'>/ˈkɒɡnətɪv/</span> · <b class='text-slate-500'>concentrate</b> <span class='text-slate-400'>/ˈkɒnsntreɪt/</span> · <b class='text-emerald-700'>frustrated</b> <span class='text-slate-400'>/frʌˈstreɪtɪd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"frustrated\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>wonderful</b> <span class='text-slate-400'>/ˈwʌndəfl/</span> · <b class='text-emerald-700'>emergency</b> <span class='text-slate-400'>/ɪˈmɜːdʒənsi/</span> · <b class='text-slate-500'>adulthood</b> <span class='text-slate-400'>/əˈdʌlthʊd/</span> · <b class='text-slate-500'>indicator</b> <span class='text-slate-400'>/ˈɪndɪkeɪtər/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"emergency\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>adolescence</b> <span class='text-slate-400'>/ˌædəˈlesns/</span> · <b class='text-slate-500'>independence</b> <span class='text-slate-400'>/ˌɪndɪˈpendəns/</span> · <b class='text-emerald-700'>discipline</b> <span class='text-slate-400'>/ˈdɪsəplɪn/</span> · <b class='text-slate-500'>metropolitan</b> <span class='text-slate-400'>/ˌmetrəˈpɒlɪtən/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"discipline\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 3.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-emerald-700'>worried</b> <span class='text-slate-400'>/ˈwʌrid/</span> · <b class='text-slate-500'>relaxed</b> <span class='text-slate-400'>/rɪˈlækst/</span> · <b class='text-slate-500'>resolved</b> <span class='text-slate-400'>/rɪˈzɒlvd/</span> · <b class='text-slate-500'>aware</b> <span class='text-slate-400'>/əˈweər/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"worried\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>relate</b> <span class='text-slate-400'>/rɪˈleɪt/</span> · <b class='text-slate-500'>contain</b> <span class='text-slate-400'>/kənˈteɪn/</span> · <b class='text-emerald-700'>boredom</b> <span class='text-slate-400'>/ˈbɔːdəm/</span> · <b class='text-slate-500'>informed</b> <span class='text-slate-400'>/ɪnˈfɔːmd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"boredom\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-slate-500'>cognitive</b> <span class='text-slate-400'>/ˈkɒɡnətɪv/</span> · <b class='text-slate-500'>adulthood</b> <span class='text-slate-400'>/əˈdʌlthʊd/</span> · <b class='text-slate-500'>confident</b> <span class='text-slate-400'>/ˈkɒnfɪdənt/</span> · <b class='text-emerald-700'>encourage</b> <span class='text-slate-400'>/ɪnˈkʌrɪdʒ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"encourage\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>7. <b class='text-slate-500'>delighted</b> <span class='text-slate-400'>/dɪˈlaɪtɪd/</span> · <b class='text-emerald-700'>manage</b> <span class='text-slate-400'>/ˈmænɪdʒ/</span> · <b class='text-slate-500'>convince</b> <span class='text-slate-400'>/kənˈvɪns/</span> · <b class='text-slate-500'>depress</b> <span class='text-slate-400'>/dɪˈpres/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"manage\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>8. <b class='text-emerald-700'>confident</b> <span class='text-slate-400'>/ˈkɒnfɪdənt/</span> · <b class='text-slate-500'>abandon</b> <span class='text-slate-400'>/əˈbændən/</span> · <b class='text-slate-500'>depressed</b> <span class='text-slate-400'>/dɪˈprest/</span> · <b class='text-slate-500'>important</b> <span class='text-slate-400'>/ɪmˈpɔːtnt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"confident\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>9. <b class='text-emerald-700'>communicate</b> <span class='text-slate-400'>/kəˈmjuːnɪkeɪt/</span> · <b class='text-slate-500'>disappointed</b> <span class='text-slate-400'>/ˌdɪsəˈpɔɪntɪd/</span> · <b class='text-slate-500'>preparation</b> <span class='text-slate-400'>/ˌprepəˈreɪʃn/</span> · <b class='text-slate-500'>adolescence</b> <span class='text-slate-400'>/ˌædəˈlesns/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"communicate\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>10. <b class='text-slate-500'>pressure</b> <span class='text-slate-400'>/ˈpreʃər/</span> · <b class='text-emerald-700'>decision</b> <span class='text-slate-400'>/dɪˈsɪʒn/</span> · <b class='text-slate-500'>friendship</b> <span class='text-slate-400'>/ˈfrendʃɪp/</span> · <b class='text-slate-500'>guidance</b> <span class='text-slate-400'>/ˈɡaɪdns/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"decision\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>Câu đơn và câu ghép (Simple &amp; Compound Sentences)</p>\n    <p class=\"text-sm text-slate-700 mb-2\"><b>Câu đơn (simple sentence)</b> chỉ có 1 mệnh đề độc lập. <b>Câu ghép (compound sentence)</b> gồm 2 mệnh đề độc lập (mỗi mệnh đề tự nó là 1 câu đúng ngữ pháp) nối với nhau.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Liên từ kết hợp (FANBOYS)</th><th class=\"border px-2 py-1\">Ý nghĩa</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">for</td><td class=\"border px-2 py-1\">vì (nêu lý do, trang trọng)</td><td class=\"border px-2 py-1 italic\">She left early, for she was tired. <span class=\"not-italic text-slate-500\">— Cô ấy về sớm vì mệt.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">and</td><td class=\"border px-2 py-1\">và (bổ sung)</td><td class=\"border px-2 py-1 italic\">He sings, and she dances. <span class=\"not-italic text-slate-500\">— Anh ấy hát, và cô ấy nhảy.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">but</td><td class=\"border px-2 py-1\">nhưng (đối lập)</td><td class=\"border px-2 py-1 italic\">She is young, but she is wise. <span class=\"not-italic text-slate-500\">— Cô ấy trẻ nhưng khôn ngoan.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">so</td><td class=\"border px-2 py-1\">vì vậy (kết quả)</td><td class=\"border px-2 py-1 italic\">He was late, so he ran. <span class=\"not-italic text-slate-500\">— Cậu ấy trễ nên đã chạy.</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Trước liên từ kết hợp (and/but/so/for) khi nối 2 mệnh đề độc lập, luôn có DẤU PHẨY.</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-link mr-1\"></i>Trạng từ liên kết (Conjunctive Adverbs)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng để nối 2 câu độc lập, đứng sau dấu <b>chấm phẩy (;)</b> và trước dấu <b>phẩy (,)</b>: <b>S1; conjunctive adverb, S2.</b></p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trạng từ liên kết</th><th class=\"border px-2 py-1\">Ý nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">however</td><td class=\"border px-2 py-1\">tuy nhiên (đối lập)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">therefore</td><td class=\"border px-2 py-1\">do đó, vì thế (kết quả)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">moreover</td><td class=\"border px-2 py-1\">hơn thế nữa (bổ sung)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">otherwise</td><td class=\"border px-2 py-1\">nếu không thì</td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-circle-minus mr-1\"></i>Liên từ phụ thuộc \"Although\" (dù, mặc dù)</p>\n    <p class=\"text-sm text-slate-700\">\\\"Although\\\" đứng ĐẦU mệnh đề phụ (mệnh đề chứa ý bị nhượng bộ), có thể đứng đầu câu hoặc giữa câu: <b>Although + S1 + V1, S2 + V2.</b> hoặc <b>S2 + V2 + although + S1 + V1.</b></p>\n    <p class=\"text-sm text-slate-700 mt-1 italic\">VD: Although it rained, we went out. = We went out although it rained. <span class=\"not-italic text-slate-500\">(Mặc dù trời mưa, chúng tôi vẫn đi ra ngoài.)</span></p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>He is tired, however he kept working.</s> ❌ → <b>He is tired; however, he kept working.</b> ✅ — trạng từ liên kết cần dấu chấm phẩy trước và dấu phẩy sau, không dùng dấu phẩy đơn.</li>\n      <li><s>Although it rained, but we went out.</s> ❌ → <b>Although it rained, we went out.</b> ✅ — không dùng cả \\\"although\\\" và \\\"but\\\" cùng lúc trong 1 câu.</li>\n      <li><s>He worked hard therefore he passed.</s> ❌ → <b>He worked hard; therefore, he passed.</b> ✅ — thiếu dấu câu bắt buộc quanh trạng từ liên kết.</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S1, but/however S2 = Although S1, S2\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">S1, but/however S2<br>= Although S1, S2</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S1, so S2 = Because S1, S2\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">S1, so S2<br>= Because S1, S2</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S1, for S2 (reason) = S1 because S2\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 3</p>\n      <p class=\"text-sm text-slate-700\">S1, for S2 (lý do)<br>= S1 because S2</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Câu1. Câu2. = Câu1; conjunctive adverb, câu2.\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 4</p>\n      <p class=\"text-sm text-slate-700\">Câu1. Câu2.<br>= Câu1; conjunctive adverb, câu2.</p>\n    </div>\n  </div>\n\n  <div class=\"bg-amber-50 border border-amber-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-amber-800 mb-2\"><i class=\"fa-solid fa-lightbulb mr-1\"></i>Áp dụng phương pháp 6 bước (xem tab \"Cách viết lại câu\") vào bài này</p>\n    <p class=\"text-sm text-slate-700\">Ví dụ: <i>\"Jack has a new laptop; however, he never logs on his account on Facebook.\"</i> → nhận diện quan hệ ĐỐI LẬP → dùng \\\"Although\\\" thay cho \\\"however\\\" → chuyển 2 mệnh đề độc lập thành 1 câu phức, bỏ dấu chấm phẩy, thêm dấu phẩy: <b>Although Jack has a new laptop, he never logs on his account on Facebook.</b></p>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Ngữ pháp</p>\n  <div id=\"miniquiz-grammar\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-grammar\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Word Formation</p>\n  <div id=\"miniquiz-wf\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-wf\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n<div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. account</span><span class='text-slate-400 text-xs'>(n) /əˈkaʊnt/</span><span class='text-slate-500 text-xs ml-auto'>tài khoản</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. browse</span><span class='text-slate-400 text-xs'>(v) /braʊz/</span><span class='text-slate-500 text-xs ml-auto'>đọc lướt, tìm (trên mạng)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. bully</span><span class='text-slate-400 text-xs'>(v) /ˈbʊli/</span><span class='text-slate-500 text-xs ml-auto'>bắt nạt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. bullying</span><span class='text-slate-400 text-xs'>(n) /ˈbʊliɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>sự bắt nạt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. concentrate</span><span class='text-slate-400 text-xs'>(v) /ˈkɒnsntreɪt/</span><span class='text-slate-500 text-xs ml-auto'>tập trung (vào)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. connect</span><span class='text-slate-400 text-xs'>(v) /kəˈnekt/</span><span class='text-slate-500 text-xs ml-auto'>kết nối</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. craft</span><span class='text-slate-400 text-xs'>(n) /krɑːft/</span><span class='text-slate-500 text-xs ml-auto'>(nghề, đồ, kĩ nghệ) thủ công</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. enjoyable</span><span class='text-slate-400 text-xs'>(adj) /ɪnˈdʒɔɪəbl/</span><span class='text-slate-500 text-xs ml-auto'>thú vị, gây hứng thú</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. expectation</span><span class='text-slate-400 text-xs'>(n) /ˌekspekˈteɪʃn/</span><span class='text-slate-500 text-xs ml-auto'>sự mong chờ, kì vọng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. focused</span><span class='text-slate-400 text-xs'>(adj) /ˈfəʊkəst/</span><span class='text-slate-500 text-xs ml-auto'>chuyên tâm, tập trung</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. forum</span><span class='text-slate-400 text-xs'>(n) /ˈfɔːrəm/</span><span class='text-slate-500 text-xs ml-auto'>diễn đàn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. log on to</span><span class='text-slate-400 text-xs'>(v) /lɒɡ ɒn tə/</span><span class='text-slate-500 text-xs ml-auto'>đăng nhập</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. mature</span><span class='text-slate-400 text-xs'>(adj) /məˈtʃʊə/</span><span class='text-slate-500 text-xs ml-auto'>chín chắn, trưởng thành</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. media</span><span class='text-slate-400 text-xs'>(n) /ˈmiːdiə/</span><span class='text-slate-500 text-xs ml-auto'>(phương tiện) truyền thông</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. midterm</span><span class='text-slate-400 text-xs'>(adj) /ˌmɪdˈtɜːm/</span><span class='text-slate-500 text-xs ml-auto'>giữa kì</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. notification</span><span class='text-slate-400 text-xs'>(n) /ˌnəʊtɪfɪˈkeɪʃn/</span><span class='text-slate-500 text-xs ml-auto'>sự thông báo</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. peer</span><span class='text-slate-400 text-xs'>(n) /pɪə/</span><span class='text-slate-500 text-xs ml-auto'>người ngang hàng, bạn đồng lứa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. pressure</span><span class='text-slate-400 text-xs'>(n) /ˈpreʃə/</span><span class='text-slate-500 text-xs ml-auto'>áp lực</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. schoolwork</span><span class='text-slate-400 text-xs'>(n) /ˈskuːlwɜːk/</span><span class='text-slate-500 text-xs ml-auto'>bài làm trên lớp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. session</span><span class='text-slate-400 text-xs'>(n) /ˈseʃn/</span><span class='text-slate-500 text-xs ml-auto'>tiết học</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. stress</span><span class='text-slate-400 text-xs'>(n) /stres/</span><span class='text-slate-500 text-xs ml-auto'>căng thẳng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. stressful</span><span class='text-slate-400 text-xs'>(adj) /ˈstresfl/</span><span class='text-slate-500 text-xs ml-auto'>căng thẳng, tạo áp lực</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>23. upload</span><span class='text-slate-400 text-xs'>(v) /ˌʌpˈləʊd/</span><span class='text-slate-500 text-xs ml-auto'>tải lên</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>24. eco-friendly</span><span class='text-slate-400 text-xs'>(adj) /ˌiːkəʊ ˈfrendli/</span><span class='text-slate-500 text-xs ml-auto'>thân thiện với môi trường</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>25. website</span><span class='text-slate-400 text-xs'>(n) /ˈwebsaɪt/</span><span class='text-slate-500 text-xs ml-auto'>trang mạng</span></div></div></div>"}], "miniQuizzes": {"sEs": [{"q": "Từ nào có đuôi \"-s\" phát âm khác với 3 từ còn lại?", "options": ["books", "cats", "buses", "maps"], "answer": 2, "explanation": "\"buses\" tận cùng bằng /s/ → thêm \"-es\" đọc /ɪz/. Ba từ còn lại tận cùng phụ âm vô thanh (k, t, p) → đọc /s/."}, {"q": "Từ nào có đuôi \"-s\" phát âm là /z/?", "options": ["plays", "helps", "asks", "laughs"], "answer": 0, "explanation": "\"plays\" tận cùng nguyên âm + phụ âm hữu thanh → đọc /z/. Ba từ còn lại tận cùng phụ âm vô thanh → đọc /s/."}, {"q": "Từ nào có đuôi \"-es\" phát âm là /ɪz/?", "options": ["loves", "washes", "drinks", "hopes"], "answer": 1, "explanation": "\"washes\" tận cùng bằng /ʃ/ (âm \"sh\") → thêm \"-es\" đọc /ɪz/. Ba từ còn lại đọc /z/ hoặc /s/."}, {"q": "Từ nào có đuôi \"-s/-es\" phát âm KHÁC với 3 từ còn lại?", "options": ["dishes", "boxes", "cups", "watches"], "answer": 2, "explanation": "\"cups\" tận cùng phụ âm vô thanh /p/ → đọc /s/. Ba từ còn lại tận c
