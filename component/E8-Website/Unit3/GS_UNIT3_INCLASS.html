<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{ --accent:#1d4ed8; --accent2:#0891b2; }
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#f5f3ff; }
  .hero-gradient{ background: linear-gradient(135deg, #7c2d12 0%, #ea580c 55%, #f59e0b 100%); }
  .tab-btn{ transition: all .2s ease; }
  .tab-btn.active{ background: linear-gradient(135deg, #7c2d12, #f59e0b); color:#fff; box-shadow:0 4px 14px rgba(124,45,18,.35); transform:translateY(-1px); }
  .task-card{ transition: box-shadow .2s, transform .2s; }
  .task-card:hover{ transform: translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  .mcq-detail-hidden{ display:none; }
  .show-mcq-detail .mcq-detail-hidden{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:var(--accent); }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .voice-ok{ color:#16a34a; } .voice-warn{ color:#d97706; }

  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
  table.border-collapse td, table.border-collapse th{ border:1px solid #e2e8f0; }
</style>

<script>
const DATA = {"unit": 3, "sections": [{"roman": "", "navLabel": "Lý thuyết", "title": "Từ vựng - Ngữ pháp - Hướng dẫn Word Form", "icon": "lightbulb", "type": "info", "info": "<div class='mb-5'><p class=\"text-sm text-slate-500 italic mb-3\">Ôn lại từ vựng, ngữ pháp trọng tâm và cách làm dạng bài Word Form trước khi luyện tập.</p></div><div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. account</span><span class='text-slate-400 text-xs'>(n) /əˈkaʊnt/</span><span class='text-slate-500 text-xs ml-auto'>tài khoản</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. browse</span><span class='text-slate-400 text-xs'>(v) /braʊz/</span><span class='text-slate-500 text-xs ml-auto'>đọc lướt, tìm (trên mạng)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. bully</span><span class='text-slate-400 text-xs'>(v) /ˈbʊli/</span><span class='text-slate-500 text-xs ml-auto'>bắt nạt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. bullying</span><span class='text-slate-400 text-xs'>(n) /ˈbʊliɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>sự bắt nạt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. concentrate</span><span class='text-slate-400 text-xs'>(v) /ˈkɒnsntreɪt/</span><span class='text-slate-500 text-xs ml-auto'>tập trung (vào)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. connect</span><span class='text-slate-400 text-xs'>(v) /kəˈnekt/</span><span class='text-slate-500 text-xs ml-auto'>kết nối</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. craft</span><span class='text-slate-400 text-xs'>(n) /krɑːft/</span><span class='text-slate-500 text-xs ml-auto'>(nghề, đồ, kĩ nghệ) thủ công</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. enjoyable</span><span class='text-slate-400 text-xs'>(adj) /ɪnˈdʒɔɪəbl/</span><span class='text-slate-500 text-xs ml-auto'>thú vị, gây hứng thú</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. expectation</span><span class='text-slate-400 text-xs'>(n) /ˌekspekˈteɪʃn/</span><span class='text-slate-500 text-xs ml-auto'>sự mong chờ, kì vọng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. focused</span><span class='text-slate-400 text-xs'>(adj) /ˈfəʊkəst/</span><span class='text-slate-500 text-xs ml-auto'>chuyên tâm, tập trung</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. forum</span><span class='text-slate-400 text-xs'>(n) /ˈfɔːrəm/</span><span class='text-slate-500 text-xs ml-auto'>diễn đàn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. log on to</span><span class='text-slate-400 text-xs'>(v) /lɒɡ ɒn tə/</span><span class='text-slate-500 text-xs ml-auto'>đăng nhập</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. mature</span><span class='text-slate-400 text-xs'>(adj) /məˈtʃʊə/</span><span class='text-slate-500 text-xs ml-auto'>chín chắn, trưởng thành</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. media</span><span class='text-slate-400 text-xs'>(n) /ˈmiːdiə/</span><span class='text-slate-500 text-xs ml-auto'>(phương tiện) truyền thông</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. midterm</span><span class='text-slate-400 text-xs'>(adj) /ˌmɪdˈtɜːm/</span><span class='text-slate-500 text-xs ml-auto'>giữa kì</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. notification</span><span class='text-slate-400 text-xs'>(n) /ˌnəʊtɪfɪˈkeɪʃn/</span><span class='text-slate-500 text-xs ml-auto'>sự thông báo</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. peer</span><span class='text-slate-400 text-xs'>(n) /pɪə/</span><span class='text-slate-500 text-xs ml-auto'>người ngang hàng, bạn đồng lứa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. pressure</span><span class='text-slate-400 text-xs'>(n) /ˈpreʃə/</span><span class='text-slate-500 text-xs ml-auto'>áp lực</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. schoolwork</span><span class='text-slate-400 text-xs'>(n) /ˈskuːlwɜːk/</span><span class='text-slate-500 text-xs ml-auto'>bài làm trên lớp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. session</span><span class='text-slate-400 text-xs'>(n) /ˈseʃn/</span><span class='text-slate-500 text-xs ml-auto'>tiết học</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. stress</span><span class='text-slate-400 text-xs'>(n) /stres/</span><span class='text-slate-500 text-xs ml-auto'>căng thẳng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. stressful</span><span class='text-slate-400 text-xs'>(adj) /ˈstresfl/</span><span class='text-slate-500 text-xs ml-auto'>căng thẳng, tạo áp lực</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>23. upload</span><span class='text-slate-400 text-xs'>(v) /ˌʌpˈləʊd/</span><span class='text-slate-500 text-xs ml-auto'>tải lên</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>24. eco-friendly</span><span class='text-slate-400 text-xs'>(adj) /ˌiːkəʊ ˈfrendli/</span><span class='text-slate-500 text-xs ml-auto'>thân thiện với môi trường</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>25. website</span><span class='text-slate-400 text-xs'>(n) /ˈwebsaɪt/</span><span class='text-slate-500 text-xs ml-auto'>trang mạng</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>Câu đơn và câu ghép (Simple &amp; Compound Sentences)</p>\n    <p class=\"text-sm text-slate-700 mb-2\"><b>Câu đơn (simple sentence)</b> chỉ có 1 mệnh đề độc lập. <b>Câu ghép (compound sentence)</b> gồm 2 mệnh đề độc lập (mỗi mệnh đề tự nó là 1 câu đúng ngữ pháp) nối với nhau.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Liên từ kết hợp (FANBOYS)</th><th class=\"border px-2 py-1\">Ý nghĩa</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">for</td><td class=\"border px-2 py-1\">vì (nêu lý do, trang trọng)</td><td class=\"border px-2 py-1 italic\">She left early, for she was tired. <span class=\"not-italic text-slate-500\">— Cô ấy về sớm vì mệt.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">and</td><td class=\"border px-2 py-1\">và (bổ sung)</td><td class=\"border px-2 py-1 italic\">He sings, and she dances. <span class=\"not-italic text-slate-500\">— Anh ấy hát, và cô ấy nhảy.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">but</td><td class=\"border px-2 py-1\">nhưng (đối lập)</td><td class=\"border px-2 py-1 italic\">She is young, but she is wise. <span class=\"not-italic text-slate-500\">— Cô ấy trẻ nhưng khôn ngoan.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">so</td><td class=\"border px-2 py-1\">vì vậy (kết quả)</td><td class=\"border px-2 py-1 italic\">He was late, so he ran. <span class=\"not-italic text-slate-500\">— Cậu ấy trễ nên đã chạy.</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Trước liên từ kết hợp (and/but/so/for) khi nối 2 mệnh đề độc lập, luôn có DẤU PHẨY.</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-link mr-1\"></i>Trạng từ liên kết (Conjunctive Adverbs)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng để nối 2 câu độc lập, đứng sau dấu <b>chấm phẩy (;)</b> và trước dấu <b>phẩy (,)</b>: <b>S1; conjunctive adverb, S2.</b></p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trạng từ liên kết</th><th class=\"border px-2 py-1\">Ý nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">however</td><td class=\"border px-2 py-1\">tuy nhiên (đối lập)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">therefore</td><td class=\"border px-2 py-1\">do đó, vì thế (kết quả)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">moreover</td><td class=\"border px-2 py-1\">hơn thế nữa (bổ sung)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">otherwise</td><td class=\"border px-2 py-1\">nếu không thì</td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-circle-minus mr-1\"></i>Liên từ phụ thuộc \"Although\" (dù, mặc dù)</p>\n    <p class=\"text-sm text-slate-700\">\\\"Although\\\" đứng ĐẦU mệnh đề phụ (mệnh đề chứa ý bị nhượng bộ), có thể đứng đầu câu hoặc giữa câu: <b>Although + S1 + V1, S2 + V2.</b> hoặc <b>S2 + V2 + although + S1 + V1.</b></p>\n    <p class=\"text-sm text-slate-700 mt-1 italic\">VD: Although it rained, we went out. = We went out although it rained. <span class=\"not-italic text-slate-500\">(Mặc dù trời mưa, chúng tôi vẫn đi ra ngoài.)</span></p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>He is tired, however he kept working.</s> ❌ → <b>He is tired; however, he kept working.</b> ✅ — trạng từ liên kết cần dấu chấm phẩy trước và dấu phẩy sau, không dùng dấu phẩy đơn.</li>\n      <li><s>Although it rained, but we went out.</s> ❌ → <b>Although it rained, we went out.</b> ✅ — không dùng cả \\\"although\\\" và \\\"but\\\" cùng lúc trong 1 câu.</li>\n      <li><s>He worked hard therefore he passed.</s> ❌ → <b>He worked hard; therefore, he passed.</b> ✅ — thiếu dấu câu bắt buộc quanh trạng từ liên kết.</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S1, but/however S2 = Although S1, S2\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">S1, but/however S2<br>= Although S1, S2</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S1, so S2 = Because S1, S2\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">S1, so S2<br>= Because S1, S2</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S1, for S2 (reason) = S1 because S2\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 3</p>\n      <p class=\"text-sm text-slate-700\">S1, for S2 (lý do)<br>= S1 because S2</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Câu1. Câu2. = Câu1; conjunctive adverb, câu2.\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 4</p>\n      <p class=\"text-sm text-slate-700\">Câu1. Câu2.<br>= Câu1; conjunctive adverb, câu2.</p>\n    </div>\n  </div>\n\n  <div class=\"bg-amber-50 border border-amber-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-amber-800 mb-2\"><i class=\"fa-solid fa-lightbulb mr-1\"></i>Áp dụng phương pháp 6 bước (xem tab \"Cách viết lại câu\") vào bài này</p>\n    <p class=\"text-sm text-slate-700\">Ví dụ: <i>\"Jack has a new laptop; however, he never logs on his account on Facebook.\"</i> → nhận diện quan hệ ĐỐI LẬP → dùng \\\"Although\\\" thay cho \\\"however\\\" → chuyển 2 mệnh đề độc lập thành 1 câu phức, bỏ dấu chấm phẩy, thêm dấu phẩy: <b>Although Jack has a new laptop, he never logs on his account on Facebook.</b></p>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Find the word which has a different sound in the part underlined.", "options": ["boy", "coin", "foil", "assure"], "answer": 3, "ipas": ["/bɔɪ/", "/kɔɪn/", "/fɔɪl/", "/əˈʃʊər/"], "vis": ["con trai", "đồng xu", "giấy bạc", "đảm bảo"], "explanation": "\"assure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/."}, {"q": "2. Find the word which has a different sound in the part underlined.", "options": ["insurance", "toil", "voice", "enjoy"], "answer": 0, "ipas": ["/ɪnˈʃʊərəns/", "/tɔɪl/", "/vɔɪs/", "/ɪnˈdʒɔɪ/"], "vis": ["bảo hiểm", "làm v
