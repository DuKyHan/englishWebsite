class='text-slate-400'>/ˈvɪlɪdʒ/</span> · <b class='text-slate-500'>bamboo</b> <span class='text-slate-400'>/bæmˈbuː/</span> · <b class='text-slate-500'>away</b> <span class='text-slate-400'>/əˈweɪ/</span> · <b class='text-slate-500'>obey</b> <span class='text-slate-400'>/oʊˈbeɪ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"village\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>7. <b class='text-slate-500'>custom</b> <span class='text-slate-400'>/ˈkʌstəm/</span> · <b class='text-slate-500'>worship</b> <span class='text-slate-400'>/ˈwɜːrʃɪp/</span> · <b class='text-emerald-700'>maintain</b> <span class='text-slate-400'>/meɪnˈteɪn/</span> · <b class='text-slate-500'>midnight</b> <span class='text-slate-400'>/ˈmɪdnaɪt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>8. <b class='text-emerald-700'>respect</b> <span class='text-slate-400'>/rɪˈspekt/</span> · <b class='text-slate-500'>mention</b> <span class='text-slate-400'>/ˈmenʃn/</span> · <b class='text-slate-500'>expert</b> <span class='text-slate-400'>/ˈekspɜːrt/</span> · <b class='text-slate-500'>worship</b> <span class='text-slate-400'>/ˈwɜːrʃɪp/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"respect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>9. <b class='text-slate-500'>pagoda</b> <span class='text-slate-400'>/pəˈɡoʊdə/</span> · <b class='text-emerald-700'>complement</b> <span class='text-slate-400'>/ˈkɒmplɪmənt/</span> · <b class='text-slate-500'>society</b> <span class='text-slate-400'>/səˈsaɪəti/</span> · <b class='text-slate-500'>tradition</b> <span class='text-slate-400'>/trəˈdɪʃn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"complement\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>10. <b class='text-slate-500'>custom</b> <span class='text-slate-400'>/ˈkʌstəm/</span> · <b class='text-emerald-700'>explain</b> <span class='text-slate-400'>/ɪkˈspleɪn/</span> · <b class='text-slate-500'>chopstick</b> <span class='text-slate-400'>/ˈtʃɒpstɪk/</span> · <b class='text-slate-500'>manner</b> <span class='text-slate-400'>/ˈmænər/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"explain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Mạo từ bất định (a / an)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng trước danh từ số ít đếm được khi được nhắc lần đầu, không cụ thể, hoặc mang nghĩa \"một\" bất kỳ. Việc chọn a/an phụ thuộc vào ÂM (cách phát âm), không phải chữ viết.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Mạo từ</th><th class=\"border px-2 py-1\">Quy tắc</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">a</td><td class=\"border px-2 py-1\">Trước từ bắt đầu bằng PHỤ ÂM hoặc nguyên âm phát âm /j/</td><td class=\"border px-2 py-1 italic\">a cat, a uniform, a one-dollar bill</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">an</td><td class=\"border px-2 py-1\">Trước từ bắt đầu bằng NGUYÊN ÂM hoặc \"h\" câm</td><td class=\"border px-2 py-1 italic\">an elephant, an hour, an MP</td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Dùng đặc biệt: chỉ nghề nghiệp (He is a doctor); câu cảm thán (What a lovely day!); chỉ giá/tốc độ/tần suất (50 miles an hour, twice a week).</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>2. Mạo từ xác định (the)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng trước danh từ đã xác định, cụ thể, hoặc đã được nhắc tới trước đó (cả người nói và người nghe đều biết).</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trường hợp bắt buộc dùng \"the\"</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n      <tr><td class=\"border px-2 py-1\">Duy nhất (thế giới/bối cảnh)</td><td class=\"border px-2 py-1 italic\">the Sun, the President</td></tr>\n      <tr><td class=\"border px-2 py-1\">Danh từ đã nhắc lại</td><td class=\"border px-2 py-1 italic\">I bought a book. The book is about history.</td></tr>\n      <tr><td class=\"border px-2 py-1\">Trước so sánh nhất, từ chỉ thứ tự (first, only, last)</td><td class=\"border px-2 py-1 italic\">the best student, the first time</td></tr>\n      <tr><td class=\"border px-2 py-1\">Chỉ một nhóm/loài chung</td><td class=\"border px-2 py-1 italic\">the whale, the invention of the telephone</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên địa lý (sông, biển, dãy núi, quần đảo)</td><td class=\"border px-2 py-1 italic\">the Mekong River, the Himalayas</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên nước số nhiều/có Republic, Kingdom, States</td><td class=\"border px-2 py-1 italic\">the United States, the Netherlands</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên nhạc cụ (khi chơi)</td><td class=\"border px-2 py-1 italic\">play the piano</td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ban mr-1\"></i>3. Không dùng mạo từ (Zero article — Ø)</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trường hợp</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n      <tr><td class=\"border px-2 py-1\">Danh từ số nhiều/không đếm được, nghĩa chung chung</td><td class=\"border px-2 py-1 italic\">Ø Water is necessary for life.</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên riêng (người, nước, thành phố, hồ, núi, đường, công viên)</td><td class=\"border px-2 py-1 italic\">Ø Paris is beautiful.</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên bữa ăn (nói chung)</td><td class=\"border px-2 py-1 italic\">We have Ø breakfast at 7.</td></tr>\n      <tr><td class=\"border px-2 py-1\">Phương tiện đi lại/giao tiếp (by + N)</td><td class=\"border px-2 py-1 italic\">go Ø by bus</td></tr>\n      <tr><td class=\"border px-2 py-1\">Địa điểm công cộng khi nói về MỤC ĐÍCH CHÍNH</td><td class=\"border px-2 py-1 italic\">go to Ø school (đi học)</td></tr>\n      <tr><td class=\"border px-2 py-1\">Mùa, tháng, ngày (nói chung)</td><td class=\"border px-2 py-1 italic\">Ø Summer is my favorite season.</td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 So sánh: <b>go to Ø school</b> (đi học — mục đích chính) khác <b>go to THE school</b> (đến trường vì lý do khác, VD thăm trường).</p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>She is an university student.</s> ❌ → <b>She is a university student.</b> ✅ — \"university\" bắt đầu bằng âm /j/, dùng \"a\".</li>\n      <li><s>I need a information.</s> ❌ → <b>I need some information.</b> ✅ — danh từ không đếm được không dùng với \"a/an\".</li>\n      <li><s>He goes to the school every day to study.</s> ❌ → <b>He goes to school every day to study.</b> ✅ — mục đích chính (đi học) không dùng \"the\".</li>\n      <li><s>The Water is necessary for life.</s> ❌ → <b>Water is necessary for life.</b> ✅ — nghĩa chung chung không dùng \"the\".</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + have/has a tradition of + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">S + have/has a tradition of + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + have/has the/a custom of + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">S + have/has the/a custom of + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + had better (not) + V (nguyên mẫu không to)\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 3</p>\n      <p class=\"text-sm text-slate-700\">S + had better (not) + V (không \"to\")</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + take(s) place = People + organize/hold/celebrate + O\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 4</p>\n      <p class=\"text-sm text-slate-700\">S + take(s) place<br>= People + organize/hold + O</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Ngữ pháp</p>\n  <div id=\"miniquiz-grammar\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-grammar\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Word Formation</p>\n  <div id=\"miniquiz-wf\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-wf\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n<div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. custom</span><span class='text-slate-400 text-xs'>(n) /ˈkʌstəm/</span><span class='text-slate-500 text-xs ml-auto'>phong tục</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. tradition</span><span class='text-slate-400 text-xs'>(n) /trəˈdɪʃən/</span><span class='text-slate-500 text-xs ml-auto'>truyền thống</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. decoration</span><span class='text-slate-400 text-xs'>(n) /ˌdekəˈreɪʃən/</span><span class='text-slate-500 text-xs ml-auto'>sự trang trí, đồ trang trí</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. decorate</span><span class='text-slate-400 text-xs'>(v) /ˈdekəreɪt/</span><span class='text-slate-500 text-xs ml-auto'>trang trí</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. decorative</span><span class='text-slate-400 text-xs'>(adj) /ˈdekərətɪv/</span><span class='text-slate-500 text-xs ml-auto'>mang tính trang trí</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. decorative items</span><span class='text-slate-400 text-xs'>(n.phr) /ˈdekərətɪv ˈaɪtəmz/</span><span class='text-slate-500 text-xs ml-auto'>đồ trang trí</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. kumquat tree</span><span class='text-slate-400 text-xs'>(n.phr) /ˈkʌmkwɒt triː/</span><span class='text-slate-500 text-xs ml-auto'>cây quất</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. peach blossoms</span><span class='text-slate-400 text-xs'>(n.phr) /piːtʃ ˈblɒsəmz/</span><span class='text-slate-500 text-xs ml-auto'>hoa đào</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. bamboo pole</span><span class='text-slate-400 text-xs'>(n.phr) /ˌbæmˈbuː pəʊl/</span><span class='text-slate-500 text-xs ml-auto'>cây nêu</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. ornamental tree</span><span class='text-slate-400 text-xs'>(n.phr) /ˌɔːnəˈmentl triː/</span><span class='text-slate-500 text-xs ml-auto'>cây cảnh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. bell</span><span class='text-slate-400 text-xs'>(n) /bel/</span><span class='text-slate-500 text-xs ml-auto'>cái chuông</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. lantern</span><span class='text-slate-400 text-xs'>(n) /ˈlæntən/</span><span class='text-slate-500 text-xs ml-auto'>đèn lồng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. carp</span><span class='text-slate-400 text-xs'>(n) /kɑːp/</span><span class='text-slate-500 text-xs ml-auto'>cá chép</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. offering</span><span class='text-slate-400 text-xs'>(n) /ˈɒfərɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>lễ vật, vật cúng tế</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. admire</span><span class='text-slate-400 text-xs'>(v) /ədˈmaɪə(r)/</span><span class='text-slate-500 text-xs ml-auto'>chiêm ngưỡng, ngưỡng mộ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. chase away</span><span class='text-slate-400 text-xs'>(phr.v) /tʃeɪs əˈweɪ/</span><span class='text-slate-500 text-xs ml-auto'>xua đuổi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. pray</span><span class='text-slate-400 text-xs'>(v) /preɪ/</span><span class='text-slate-500 text-xs ml-auto'>cầu nguyện, khấn vái</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. place</span><span class='text-slate-400 text-xs'>(v) /pleɪs/</span><span class='text-slate-500 text-xs ml-auto'>đặt, để</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. hang</span><span class='text-slate-400 text-xs'>(v) /hæŋ/</span><span class='text-slate-500 text-xs ml-auto'>treo</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. release</span><span class='text-slate-400 text-xs'>(v) /rɪˈliːs/</span><span class='text-slate-500 text-xs ml-auto'>thả, phóng thích</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. lucky</span><span class='text-slate-400 text-xs'>(adj) /ˈlʌki/</span><span class='text-slate-500 text-xs ml-auto'>may mắn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. bad luck</span><span class='text-slate-400 text-xs'>(n.phr) /ˌbæd ˈlʌk/</span><span class='text-slate-500 text-xs ml-auto'>vận rủi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>23. bad spirit</span><span class='text-slate-400 text-xs'>(n.phr) /ˌbæd ˈspɪrɪt/</span><span class='text-slate-500 text-xs ml-auto'>tà ma</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>24. longevity</span><span class='text-slate-400 text-xs'>(n) /lɒnˈdʒevəti/</span><span class='text-slate-500 text-xs ml-auto'>tuổi thọ, sự trường thọ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>25. ceremony</span><span class='text-slate-400 text-xs'>(n) /ˈserəməni/</span><span class='text-slate-500 text-xs ml-auto'>nghi lễ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>26. family bonding</span><span class='text-slate-400 text-xs'>(n.phr) /ˈfæməli ˈbɒndɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>sự gắn kết gia đình</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>27. reunion</span><span class='text-slate-400 text-xs'>(n) /riːˈjuːniən/</span><span class='text-slate-500 text-xs ml-auto'>sự đoàn tụ, sum họp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>28. festival</span><span class='text-slate-400 text-xs'>(n) /ˈfestɪvl/</span><span class='text-slate-500 text-xs ml-auto'>lễ hội</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>29. festival goer</span><span class='text-slate-400 text-xs'>(n.phr) /ˈfestɪvl ˈɡəʊə(r)/</span><span class='text-slate-500 text-xs ml-auto'>người đi lễ hội</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>30. monk</span><span class='text-slate-400 text-xs'>(n) /mʌŋk/</span><span class='text-slate-500 text-xs ml-auto'>nhà sư</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>31. mar function normalize(s){ return (s||'').trim().toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d"]/g,'').replace(/[.,!?;:]/g,'').replace(/\s+/g,' '); }
function optionLetter(i){ return ['A','B','C','D'][i]; }
function shuffleArr(a){ return a.slice().sort(()=>Math.random()-0.5); }

function widthFor(ref){ const l=(ref||'').length; return l<7?'w-24':l<16?'w-40':'w-full'; }

let audioUnlocked=false, cachedVoices=[], chosenVoice=null;
const PREFERRED_VOICE_NAMES = [
  'Google US English','Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)','Samantha',
  'Microsoft Zira Desktop - English (United States)','Google UK English Female','Alex'
];
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true;
  try{ const Ctx=window.AudioContext||window.webkitAudioContext; if(Ctx){ const ctx=new Ctx(); const buf=ctx.createBuffer(1,1,22050); const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0);} }catch(e){}
  try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  loadVoices();
}
document.addEventListener('touchstart', unlockAudio, {once:true, passive:true});
document.addEventListener('click', unlockAudio, {once:true});
function pickBestVoice(){
  if(!cachedVoices.length) return null;
  for(const name of PREFERRED_VOICE_NAMES){ const v=cachedVoices.find(x=>x.name===name); if(v) return v; }
  const usEn = cachedVoices.filter(v=>/en[-_]us/i.test(v.lang));
  if(usEn.length){ const local = usEn.find(v=>v.localService); return local||usEn[0]; }
  const anyEn = cachedVoices.find(v=>/^en/i.test(v.lang));
  return anyEn||null;
}
function loadVoices(){
  cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  chosenVoice = pickBestVoice();
}
if('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,300); setTimeout(loadVoices,1000); }
let resumeInterval=null;
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if(resumeInterval){ clearInterval(resumeInterval); resumeInterval=null; }
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.88; u.pitch=1;
    if(!cachedVoices.length) loadVoices();
    if(chosenVoice) u.voice=chosenVoice;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>{btn.classList.remove('speaking'); if(resumeInterval){clearInterval(resumeInterval);resumeInterval=null;}}; }
    window.speechSynthesis.speak(u);
    resumeInterval=setInterval(()=>{ if(window.speechSynthesis.speaking){ window.speechSynthesis.pause(); window.speechSynthesis.resume(); } else { clearInterval(resumeInterval); resumeInterval=null; } },4000);
  }catch(e){}
}

function feedbackHTML(ok, answerLabel, explanation, vi, note){
  const okLine = ok? `<span class="text-emerald-700 font-bold">✅ Chính xác!</span>` : `<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án đúng: <b>${answerLabel}</b>`;
  const expLine = explanation? `<br><span class="text-blue-700">💡 ${explanation}</span>` : '';
  const viLine = vi? `<span class="text-slate-500">📖 Nghĩa: <i>${vi}</i></span>` : '';
  const noteLine = note? `<br><span class="text-violet-600">📐 Công thức: <b>${note}</b></span>` : '';
  if(note){ return (viLine?viLine+'<br>':'') + okLine + expLine + noteLine; }
  return okLine + expLine + (viLine?'<br>'+viLine:'') + noteLine;
}

function renderDict(d, idx){
  if(!d) return '';
  const viBlock = d.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-amber-300 text-amber-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-amber-300 text-slate-600">${d.vi}</p>` : '';
  return `<div class="dict-box mb-4"><p class="font-extrabold text-amber-800 mb-1"><i class="fa-solid fa-book-bookmark mr-1"></i>${d.word} <span class="font-normal italic">${d.ipa||''}</span> <span class="font-normal">(${d.pos||''})</span></p>${d.senses.map(x=>`<p class="mb-1">✱ ${x.def}</p>${(x.examples||[]).map(e=>`<p class="ml-4 italic text-slate-600">• ${e}</p>`).join('')}`).join('')}${viBlock}</div>`;
}

function renderSection(s, idx){
  if(s.type==='info'){
    return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">
      <h2 class="text-xl md:text-2xl font-extrabold text-indigo-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'lightbulb'} text-amber-400"></i> ${s.title}</h2>
      ${s.info}
    </section>`;
  }
  let inner = `<h2 class="text-xl md:text-2xl font-extrabold text-indigo-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'circle-check'} text-amber-400"></i> ${s.roman}. ${s.title}</h2>`;
  if(s.instructions) inner += `<p class="text-sm text-slate-500 mb-3 italic">${s.instructions}</p>`;
  inner += renderPassage(s.passage, idx);
  inner += renderDict(s.dict, idx);

  inner += `<div class="space-y-4">`;
  s.questions.forEach((q,i)=>{
    inner += `<div class="task-card bg-white rounded-2xl shadow-md p-4" id="qblock_${idx}_${i}">`;
    if(q.image) inner += `<div class="mb-3">${q.image}</div>`;
    inner += `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${q.q}</p>`;
    if(s.type==='mcq'){
      inner += `<div class="grid sm:grid-cols-2 gap-2">`;
      q.options.forEach((opt,j)=>{
        const ipa = q.ipas ? q.ipas[j] : null;
        const optVi = q.vis ? q.vis[j] : null;
        const cleanWord = opt.replace(/<[^>]+>/g,'');
        const wordBlock = (ipa || optVi)
          ? `<span class="flex flex-col leading-tight"><span>${opt}</span>${ipa?`<span class="text-[10px] text-slate-400 font-normal mcq-detail-hidden">${ipa}</span>`:''}${optVi?`<span class="text-[10px] text-emerald-500 font-normal italic mcq-detail-hidden">${optVi}</span>`:''}</span>
             <button type="button" data-w="${cleanWord}" onclick="event.stopPropagation();event.preventDefault();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:scale-110 transition flex items-center justify-center ml-auto shrink-0 mcq-detail-hidden" title="Nghe phát âm" aria-label="Nghe phát âm ${cleanWord}"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`
          : `<span>${opt}</span>`;
        inner += `<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="opt_${idx}_${i}_${j}" onclick="selectMcq(${idx},${i},${j})">
          <input type="radio" name="mcq_${idx}_${i}" class="accent-indigo-700" style="display:none">
          <span class="font-black text-indigo-700">${optionLetter(j)}.</span> ${wordBlock}
        </label>`;
      });
      inner += `</div>`;
    } else if(s.type==='fill'){
      const w = widthFor(q.answer);
      const famBlock = q.family ? `<div class="wordfam-box mt-2">${q.family.map(f=>`<div>• ${f}</div>`).join('')}</div>` : '';
      inner += `<div class="flex items-center gap-2 flex-wrap">`;
      if(q.hint) inner += `<span class="blank-tag text-xs">${q.hint}</span>`;
      inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input ${w} px-3 py-1.5 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false"></div>${famBlock}`;
    } else if(s.type==='sentence'){
      const instantAttr = s.instant ? ` oninput="gradeOneSentence(${idx},${i})"` : '';
      if(q.starter){
        inner += `<p class="text-slate-700 text-sm mb-2">${q.original}</p>
        <div class="flex items-center gap-3 w-full flex-wrap">
          <span class="text-slate-800 font-extrabold text-base whitespace-nowrap">${q.starter}</span>
          <input type="text" id="inp_${idx}_${i}" class="answer-input flex-1 min-w-[180px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false"${instantAttr}>
        </div>`;
      } else {
        inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Viết câu trả lời..." autocomplete="off" spellcheck="false"${instantAttr}>`;
      }
    }
    inner += `<div class="explanation-box mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm text-blue-800" id="fb_${idx}_${i}"></div>`;
    inner += `</div>`;
  });
  inner += `</div>`;

  inner += `<div class="flex flex-wrap gap-2 mt-5">
    <button onclick="checkSection(${idx})" class="bg-gradient-to-r from-indigo-900 to-pink-600 text-white font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>
    <button onclick="revealSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-eye mr-1"></i>Xem đáp án</button>
    <button onclick="resetSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-rotate-left mr-1"></i>Làm lại</button>
    <span id="score_${idx}" class="hidden ml-auto self-center font-extrabold text-emerald-600 text-sm score-badge"></span>
  </div>`;

  return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">${inner}</section>`;
}

function buildMain(){
  const main=document.getElementById('mainWrap');
  main.innerHTML = DATA.sections.map((s,i)=>renderSection(s,i)).join('');
}

function togglePassageVI(idx){ const el=document.getElementById(`passage_vi_${idx}`); if(el) el.classList.toggle('vi-hidden'); }
function selectMcq(idx,i,j){
  const q=DATA.sections[idx].questions[i];
  document.querySelectorAll(`[id^="opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${idx}_${i}_${j}`).classList.add('selected');
  document.getElementById(`opt_${idx}_${i}_${j}`).dataset.chosen = j;
  if(DATA.sections[idx].instant){ gradeOneMcq(idx,i); }
}

function gradeOneMcq(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const qblock=document.getElementById(`qblock_${idx}_${i}`);
  if(qblock) qblock.classList.add('show-mcq-detail');
  const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
  const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
  const ok = chosen === q.answer;
  const answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
  q.options.forEach((o,j)=>{
    const el=document.getElementById(`opt_${idx}_${i}_${j}`);
    el.classList.remove('correct-opt','wrong-opt');
    if(j===q.answer) el.classList.add('correct-opt');
    else if(j===chosen) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function gradeOneSentence(idx,i){
  const q=DATA.sections[idx].questions[i];
  const inp=document.getElementById(`inp_${idx}_${i}`);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(!inp || !fb) return;
  const raw=inp.value.trim();
  if(raw===''){
    inp.classList.remove('correct-input','wrong-input');
    fb.classList.remove('show'); fb.innerHTML='';
    return;
  }
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function checkSection(idx){
  const s=DATA.sections[idx];
  let correct=0;
  s.questions.forEach((q,i)=>{
    let ok=false, answerLabel='';
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='mcq'){
      const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
      const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
      ok = chosen === q.answer;
      answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
        else if(j===chosen) el.classList.add('wrong-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      const val=normalize(inp.value);
      const acc=(q.accepted||[q.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.classList.remove('correct-input','wrong-input');
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = q.answer;
    }
    if(ok) correct++;
    fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
    fb.classList.add('show');
  });
  const total=s.questions.length;
  scores[idx]={correct,total};
  const scoreEl=document.getElementById(`score_${idx}`);
  scoreEl.textContent = `🏆 Điểm: ${correct}/${total}`;
  scoreEl.classList.remove('hidden');
  completedTasks.add(idx);
  updateProgress();
  if(completedTasks.size===TOTAL_TASKS) setTimeout(showCompletion,500);
}

function revealSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    let answerLabel = s.type==='mcq' ? `${optionLetter(q.answer)}. ${q.options[q.answer]}` : q.answer;
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    }
    fb.innerHTML = `👁️ Đáp án: <b>${answerLabel}</b>` + (q.explanation?`<br><span class="text-blue-700">💡 ${q.explanation}</span>`:'') + (q.vi?`<br><span class="text-slate-500">📖 Nghĩa: <i>${q.vi}</i></span>`:'') + (q.note?`<br><span class="text-violet-600">📐 Công thức: <b>${q.note}</b></span>`:'');
    fb.classList.add('show');
  });
}

function resetSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt','selected');
        delete el.dataset.chosen;
      });
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    }
    const qblock=document.getElementById(`qblock_${idx}_${i}`);
    if(qblock) qblock.classList.remove('show-mcq-detail');
    const fb=document.getElementById(`fb_${idx}_${i}`);
    fb.classList.remove('show'); fb.innerHTML='';
  });
  const scoreEl=document.getElementById(`score_${idx}`); scoreEl.classList.add('hidden');
  completedTasks.delete(idx); delete scores[idx]; updateProgress();
}

function showTab(idx){
  document.querySelectorAll('.section-page').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-slate-600');});
  document.getElementById(`tab-${idx}`).classList.add('active');
  const btn=document.getElementById(`navbtn_${idx}`);
  btn.classList.add('active'); btn.classList.remove('text-slate-600');
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=completedTasks.size;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TASKS} phần`;
  document.getElementById('progressBar').style.width = `${(done/TOTAL_TASKS)*100}%`;
}

function showCompletion(){
  fireConfetti();
  const banner=document.getElementById('completionBanner');
  banner.classList.remove('hidden'); banner.classList.add('show');
  let c=0,t=0; Object.values(scores).forEach(s=>{c+=s.correct; t+=s.total;});
  document.getElementById('finalScoreDisplay').textContent = `🎯 ${c} / ${t} câu đúng`;
}
function closeBanner(){ const b=document.getElementById('completionBanner'); b.classList.remove('show'); b.classList.add('hidden'); }

function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}


function renderMiniQuizzes(){
  Object.keys(DATA.miniQuizzes||{}).forEach(key=>{
    const wrap = document.getElementById('miniquiz-'+key);
    if(!wrap) return;
    wrap.innerHTML = DATA.miniQuizzes[key].map((q,i)=>`
      <div id="mqwrap_${key}_${i}">
        <p class="text-sm font-bold text-slate-800 mb-1.5">${i+1}. ${q.q}</p>
        <div class="grid sm:grid-cols-2 gap-2">${q.options.map((o,j)=>`<label class="option-label rounded-lg px-3 py-1.5 text-xs font-semibold" id="mq_${key}_${i}_${j}" onclick="answerMiniQuiz('${key}',${i},${j})"><span class="font-black text-emerald-700">${optionLetter(j)}.</span> ${o}</label>`).join('')}</div>
        <div class="mt-1 text-xs hidden bg-blue-50 border border-blue-200 rounded-lg px-2 py-1.5 text-blue-800" id="mq_fb_${key}_${i}"></div>
      </div>`).join('');
  });
}
const MINI_QUIZ_SCORE = {};
function answerMiniQuiz(key,i,j){
  const wrapEl = document.getElementById(`mqwrap_${key}_${i}`);
  if(wrapEl.dataset.answered) return;
  wrapEl.dataset.answered = '1';
  const q = DATA.miniQuizzes[key][i];
  const ok = j===q.answer;
  q.options.forEach((o,k)=>{
    const el=document.getElementById(`mq_${key}_${i}_${k}`);
    el.onclick=null;
    if(k===q.answer) el.classList.add('correct-opt');
    else if(k===j) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`mq_fb_${key}_${i}`);
  fb.classList.remove('hidden');
  fb.innerHTML = (ok?'<span class="text-emerald-700 font-bold">✅ Chính xác!</span>':`<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án: <b>${optionLetter(q.answer)}. ${q.options[q.answer]}</b>`) + (q.explanation?`<br>💡 ${q.explanation}`:'') + (q.vi?`<br>📖 <i>${q.vi}</i>`:'');
  if(!MINI_QUIZ_SCORE[key]) MINI_QUIZ_SCORE[key] = {correct:0, answered:0};
  MINI_QUIZ_SCORE[key].answered++;
  if(ok) MINI_QUIZ_SCORE[key].correct++;
  const scoreEl = document.getElementById(`miniquiz-score-${key}`);
  if(scoreEl) scoreEl.textContent = `🏆 ${MINI_QUIZ_SCORE[key].correct}/${MINI_QUIZ_SCORE[key].answered} đã trả lời`;
}

buildNav();
buildMain();
updateProgress();
renderMiniQuizzes();
</script>
</body>
</html>
