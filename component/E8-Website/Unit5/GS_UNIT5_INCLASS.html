  * { box-sizing: border-box; }

  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }

  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }

  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }

  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .voice-ok{ color:#16a34a; } .voice-warn{ color:#d97706; }

  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }

'text-slate-500 text-xs ml-auto'>sự may mắn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>45. bonding</span><span class='text-slate-400 text-xs'>(n) /ˈbɒndɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>sự gắn kết</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>46. manner</span><span class='text-slate-400 text-xs'>(n) /ˈmænə(r)/</span><span class='text-slate-500 text-xs ml-auto'>cách cư xử, thái độ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>47. Sa Dec flower village</span><span class='text-slate-400 text-xs'>(n.phr) /sɑː ˈdek ˈflaʊər ˈvɪlɪdʒ/</span><span class='text-slate-500 text-xs ml-auto'>làng hoa Sa Đéc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>48. maintain</span><span class='text-slate-400 text-xs'>(v) /meɪnˈteɪn/</span><span class='text-slate-500 text-xs ml-auto'>duy trì</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Mạo từ bất định (a / an)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng trước danh từ số ít đếm được khi được nhắc lần đầu, không cụ thể, hoặc mang nghĩa \"một\" bất kỳ. Việc chọn a/an phụ thuộc vào ÂM (cách phát âm), không phải chữ viết.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Mạo từ</th><th class=\"border px-2 py-1\">Quy tắc</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">a</td><td class=\"border px-2 py-1\">Trước từ bắt đầu bằng PHỤ ÂM hoặc nguyên âm phát âm /j/</td><td class=\"border px-2 py-1 italic\">a cat, a uniform, a one-dollar bill</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">an</td><td class=\"border px-2 py-1\">Trước từ bắt đầu bằng NGUYÊN ÂM hoặc \"h\" câm</td><td class=\"border px-2 py-1 italic\">an elephant, an hour, an MP</td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Dùng đặc biệt: chỉ nghề nghiệp (He is a doctor); câu cảm thán (What a lovely day!); chỉ giá/tốc độ/tần suất (50 miles an hour, twice a week).</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>2. Mạo từ xác định (the)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng trước danh từ đã xác định, cụ thể, hoặc đã được nhắc tới trước đó (cả người nói và người nghe đều biết).</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trường hợp bắt buộc dùng \"the\"</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n      <tr><td class=\"border px-2 py-1\">Duy nhất (thế giới/bối cảnh)</td><td class=\"border px-2 py-1 italic\">the Sun, the President</td></tr>\n      <tr><td class=\"border px-2 py-1\">Danh từ đã nhắc lại</td><td class=\"border px-2 py-1 italic\">I bought a book. The book is about history.</td></tr>\n      <tr><td class=\"border px-2 py-1\">Trước so sánh nhất, từ chỉ thứ tự (first, only, last)</td><td class=\"border px-2 py-1 italic\">the best student, the first time</td></tr>\n      <tr><td class=\"border px-2 py-1\">Chỉ một nhóm/loài chung</td><td class=\"border px-2 py-1 italic\">the whale, the invention of the telephone</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên địa lý (sông, biển, dãy núi, quần đảo)</td><td class=\"border px-2 py-1 italic\">the Mekong River, the Himalayas</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên nước số nhiều/có Republic, Kingdom, States</td><td class=\"border px-2 py-1 italic\">the United States, the Netherlands</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên nhạc cụ (khi chơi)</td><td class=\"border px-2 py-1 italic\">play the piano</td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ban mr-1\"></i>3. Không dùng mạo từ (Zero article — Ø)</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trường hợp</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n      <tr><td class=\"border px-2 py-1\">Danh từ số nhiều/không đếm được, nghĩa chung chung</td><td class=\"border px-2 py-1 italic\">Ø Water is necessary for life.</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên riêng (người, nước, thành phố, hồ, núi, đường, công viên)</td><td class=\"border px-2 py-1 italic\">Ø Paris is beautiful.</td></tr>\n      <tr><td class=\"border px-2 py-1\">Tên bữa ăn (nói chung)</td><td class=\"border px-2 py-1 italic\">We have Ø breakfast at 7.</td></tr>\n      <tr><td class=\"border px-2 py-1\">Phương tiện đi lại/giao tiếp (by + N)</td><td class=\"border px-2 py-1 italic\">go Ø by bus</td></tr>\n      <tr><td class=\"border px-2 py-1\">Địa điểm công cộng khi nói về MỤC ĐÍCH CHÍNH</td><td class=\"border px-2 py-1 italic\">go to Ø school (đi học)</td></tr>\n      <tr><td class=\"border px-2 py-1\">Mùa, tháng, ngày (nói chung)</td><td class=\"border px-2 py-1 italic\">Ø Summer is my favorite season.</td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 So sánh: <b>go to Ø school</b> (đi học — mục đích chính) khác <b>go to THE school</b> (đến trường vì lý do khác, VD thăm trường).</p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>She is an university student.</s> ❌ → <b>She is a university student.</b> ✅ — \"university\" bắt đầu bằng âm /j/, dùng \"a\".</li>\n      <li><s>I need a information.</s> ❌ → <b>I need some information.</b> ✅ — danh từ không đếm được không dùng với \"a/an\".</li>\n      <li><s>He goes to the school every day to study.</s> ❌ → <b>He goes to school every day to study.</b> ✅ — mục đích chính (đi học) không dùng \"the\".</li>\n      <li><s>The Water is necessary for life.</s> ❌ → <b>Water is necessary for life.</b> ✅ — nghĩa chung chung không dùng \"the\".</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + have/has a tradition of + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">S + have/has a tradition of + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + have/has the/a custom of + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">S + have/has the/a custom of + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + had better (not) + V (nguyên mẫu không to)\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 3</p>\n      <p class=\"text-sm text-slate-700\">S + had better (not) + V (không \"to\")</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + take(s) place = People + organize/hold/celebrate + O\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 4</p>\n      <p class=\"text-sm text-slate-700\">S + take(s) place<br>= People + organize/hold + O</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["carp", "article", "party", "tradition"], "answer": 3, "ipas": ["/kɑːp/", "/ˈɑːrtɪkl/", "/ˈpɑːrti/", "/trəˈdɪʃn/"], "vis": ["cá chép", "bài báo", "bữa tiệc", "truyền thống"], "explanation": "\"tradition\" có \"a\" phát âm /ə/, ba từ còn lại phát âm /ɑː/."}, {"q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["connect", "cook", "dance", "control"], "answer": 2, "ipas": ["/kəˈnekt/", "/kʊk/", "/dæns/", "/kənˈtroʊl/"], "vis": ["kết nối", "nấu ăn", "nhảy múa", "kiểm soát"], "explanation": "\"dance\" có \"c\" phát âm /s/, ba từ còn lại phát âm /k/."}, {"q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["pass", "palm", "sharp", "man"], "answer": 3, "ipas": ["/pæs/", "/pɑːm/", "/ʃɑːrp/", "/mæn/"], "vis": ["đi qua", "lòng bàn tay", "sắc bén", "đàn ông"], "explanation": "\"man\" phát âm /æ/, ba từ còn lại phát âm /ɑː/."}, {"q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["custom", "correct", "clockwise", "opinion"], "answer": 0, "ipas": ["/ˈkʌstəm/", "/kəˈrekt/", "/ˈklɒkwaɪz/", "/əˈpɪnjən/"], "vis": ["phong tục", "đúng, sửa", "theo chiều kim đồng hồ", "ý kiến"], "explanation": "\"custom\" có \"c\" đầu phát âm /k/ nhưng trọng tâm khác biệt về nguyên âm — theo đáp án chính thức khác 3 từ còn lại."}, {"q": "5. Which word has the underlined part pronounced differently from that of the others?", "options": ["kidding", "generate", "sponge", "oblige"], "answer": 0, "ipas": ["/ˈkɪdɪŋ/", "/ˈdʒenəreɪt/", "/spʌndʒ/", "/əˈblaɪdʒ/"], "vis": ["đùa giỡn", "tạo ra", "miếng bọt biển", "bắt buộc"], "explanation": "\"kidding\" có \"g\" phát âm /ɡ/, ba từ còn lại phát âm /dʒ/."}, {"q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["design", "preserve", "basic", "physical"], "answer": 2, "ipas": ["/dɪˈzaɪn/", "/prɪˈzɜːrv/", "/ˈbeɪsɪk/", "/ˈfɪzɪkl/"], "vis": ["thiết kế", "bảo tồn", "cơ bản", "thuộc về thể chất"], "explanation": "\"basic\" có \"s\" phát âm /s/, ba từ còn lại phát âm /z/."}, {"q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["cousin", "interesting", "link", "fond"], "answer": 2, "ipas": ["/ˈkʌzn/", "/ˈɪntrəstɪŋ/", "/lɪŋk/", "/fɒnd/"], "vis": ["anh chị em họ", "thú vị", "liên kết", "yêu thích"], "explanation": "\"link\" phát âm /ɪ/ (nguyên âm ngắn khác biệt), ba từ còn lại chung nhóm âm khác theo đáp án chính thức."}, {"q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["lantern", "important", "money", "thank"], "answer": 3, "ipas": ["/ˈlæntərn/", "/ɪmˈpɔːrtnt/", "/ˈmʌni/", "/θæŋk/"], "vis": ["đèn lồng", "quan trọng", "tiền", "cảm ơn"], "explanation": "\"thank\" có \"th\" phát âm /θ/ (âm cắn lưỡi), khác biệt với phụ âm mũi ở 3 từ còn lại."}, {"q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["many", "take", "place", "wake"], "answer": 0, "ipas": ["/ˈmeni/", "/teɪk/", "/pleɪs/", "/weɪk/"], "vis": ["nhiều", "lấy", "đặt, nơi chốn", "thức dậy"], "explanation": "\"many\" có \"a\" phát âm /e/, ba từ còn lại phát âm /eɪ/."}, {"q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["occupation", "occasion", "shake", "miraculous"], "answer": 3, "ipas": ["/ˌɒkjuˈpeɪʃn/", "/əˈkeɪʒn/", "/ʃeɪk/", "/mɪˈrækjələs/"], "vis": ["nghề nghiệp", "dịp, cơ hội", "lay, rung", "kỳ diệu"], "explanation": "\"miraculous\" có \"a\" phát âm /æ/, ba từ còn lại phát âm /eɪ/."}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has a different stress pattern from that of the others?", "options": ["holiday", "decorate", "offering", "addition"], "answer": 3, "ipas": ["/ˈhɒlədeɪ/", "/ˈdekəreɪt/", "/ˈɒfərɪŋ/", "/əˈdɪʃn/"], "vis": ["ngày nghỉ lễ", "trang trí", "lễ vật", "sự thêm vào"], "explanation": "\"addition\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "2. Which word has a different stress pattern from that of the others?", "options": ["laughter", "prepare", "chopstick", "heaven"], "answer": 1, "ipas": ["/ˈlæftər/", "/prɪˈper/", "/ˈtʃɒpstɪk/", "/ˈhevn/"], "vis": ["tiếng cười", "chuẩn bị", "đũa", "thiên đàng"], "explanation": "\"prepare\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "3. Which word has a different stress pattern from that of the others?", "options": ["resident", "cutlery", "ancestor", "permission"], "answer": 3, "ipas": ["/ˈrezɪdənt/", "/ˈkʌtləri/", "/ˈænsestər/", "/pərˈmɪʃn/"], "vis": ["cư dân", "dao dĩa", "tổ tiên", "sự cho phép"], "explanation": "\"permission\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "4. Which word has a different stress pattern from that of the others?", "options": ["generation", "presentation", "necessity", "obligation"], "answer": 2, "ipas": ["/ˌdʒenəˈreɪʃn/", "/ˌpreznˈteɪʃn/", "/nəˈsesəti/", "/ˌɒblɪˈɡeɪʃn/"], "vis": ["thế hệ", "sự trình bày", "sự cần thiết", "nghĩa vụ"], "explanation": "\"necessity\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3."}, {"q": "5. Which word has a different stress pattern from that of the others?", "options": ["festival", "contestant", "atmosphere", "family"], "answer": 1, "ipas": ["/ˈfestɪvl/", "/kənˈtestənt/", "/ˈætməsfɪr/", "/ˈfæməli/"], "vis": ["lễ hội", "thí sinh", "bầu không khí", "gia đình"], "explanation": "\"contestant\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "6. Which word has a different stress pattern from that of the others?", "options": ["village", "bamboo", "away", "obey"], "answer": 0, "ipas": ["/ˈvɪlɪdʒ/", "/bæmˈbuː/", "/əˈweɪ/", "/oʊˈbeɪ/"], "vis": ["làng", "tre", "đi xa", "vâng lời"], "explanation": "\"village\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "7. Which word has a different stress pattern from that of the others?", "options": ["custom", "worship", "maintain", "midnight"], "answer": 2, "ipas": ["/ˈkʌstəm/", "/ˈwɜːrʃɪp/", "/meɪnˈteɪn/", "/ˈmɪdnaɪt/"], "vis": ["phong tục", "thờ cúng", "duy trì", "nửa đêm"], "explanation": "\"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "8. Which word has a different stress pattern from that of the others?", "options": ["respect", "mention", "expert", "worship"], "answer": 0, "ipas": ["/rɪˈspekt/", "/ˈmenʃn/", "/ˈekspɜːrt/", "/ˈwɜːrʃɪp/"], "vis": ["tôn trọng", "đề cập", "chuyên gia", "thờ cúng"], "explanation": "\"respect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "9. Which word has a different stress pattern from that of the others?", "options": ["pagoda", "complement", "society", "tradition"], "answer": 1, "ipas": ["/pəˈɡoʊdə/", "/ˈkɒmplɪmənt/", "/səˈsaɪəti/", "/trəˈdɪʃn/"], "vis": ["ngôi chùa", "bổ ngữ", "xã hội", "truyền thống"], "explanation": "\"complement\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "10. Which word has a different stress pattern from that of the others?", "options": ["custom", "explain", "chopstick", "manner"], "answer": 1, "ipas": ["/ˈkʌstəm/", "/ɪkˈspleɪn/", "/ˈtʃɒpstɪk/", "/ˈmænər/"], "vis": ["phong tục", "giải thích", "đũa", "cách cư xử"], "explanation": "\"explain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. Kung Fu and Karate are my favorite ________.", "options": ["lion dance", "table manners", "martial arts", "flower village"], "answer": 2, "explanation": "\"martial arts\" = võ thuật — Kung Fu, Karate đều thuộc nhóm này.", "vis": ["múa lân", "phép tắc ăn uống", "võ thuật (đúng)", "làng hoa"], "tags": ["vocab"]}, {"q": "2. The Vietnamese New Year ________ from the first day of the first month of the Lunar calendar for at least three days.", "options": ["take after", "take off", "take up", "take place"], "answer": 3, "explanation": "\"take place\" = diễn ra — hợp nghĩa với thời gian bắt đầu và kéo dài của Tết.", "vis": ["giống ai đó", "cởi ra, cất cánh", "bắt đầu làm", "diễn ra (đúng)"], "tags": ["vocab"]}, {"q": "3. Taking care of the family is ________ considered women's duty in many Eastern countries.", "options": ["traditional", "traditionally", "tradition", "traditionalism"], "answer": 1, "explanation": "Bổ nghĩa cho động từ bị động \"is considered\" cần TRẠNG TỪ → traditionally.", "vis": ["thuộc truyền thống (tính từ, sai)", "theo truyền thống (đúng, trạng từ)", "truyền thống (danh từ, sai)", "chủ nghĩa truyền thống (sai)"], "tags": ["grammar"]}, {"q": "4. It's considered good manners ________ younger generations in the family to invite elders to eat before starting a meal.", "options": ["at", "up", "on", "for"], "answer": 3, "explanation": "Cấu trúc: it's + adj + for sb + to V.", "vis": ["tại", "lên", "trên", "cho (đúng — for sb to V)"], "tags": ["grammar"]}, {"q": "5. We have a ________ every New Year's Day.", "options": ["martial arts", "table manners", "chase away", "family reunion"], "answer": 3, "explanation": "\"family reunion\" = sự đoàn tụ gia đình — hợp nghĩa với ngày đầu năm mới.", "vis": ["võ thuật", "phép tắc ăn uống", "xua đuổi", "đoàn tụ gia đình (đúng)"], "tags": ["vocab"]}, {"q": "6. It's the ________ in that country for women to get married in white.", "options": ["habit", "custom", "costume", "hobby"], "answer": 1, "explanation": "\"custom\" = phong tục (của một cộng đồng/quốc gia), khác \"habit\" (thói quen cá nhân).", "vis": ["thói quen cá nhân", "phong tục (đúng)", "trang phục", "sở thích"], "tags": ["vocab"]}, {"q": "7. They ________ presents under the Christmas trees on Christmas day.", "options": ["maintain", "place", "release", "pray"], "answer": 1, "explanation": "\"place presents\" = đặt quà — hợp nghĩa với việc đặt quà dưới cây thông.", "vis": ["duy trì", "đặt (đúng)", "thả, phóng thích", "cầu nguyện"], "tags": ["vocab"]}, {"q": "8. People in Hanoi ________ to give Ong Cong Ong Tao a ride to Heaven.", "options": ["release carps", "unicorn dance", "release lanterns", "bad spirit"], "answer": 0, "explanation": "Tục thả cá chép để tiễn ông Công ông Táo về trời → release carps.", "vis": ["thả cá chép (đúng)", "múa lân", "thả đèn lồng", "tà ma"], "tags": ["vocab"]}, {"q": "9. Shaking hands is the most popular way ________ greeting in Britain.", "options": ["at", "of", "against", "to"], "answer": 1, "explanation": "Cấu trúc: a way of + V-ing.", "vis": ["tại", "của (đúng — a way of)", "chống lại", "đến"], "tags": ["grammar"]}, {"q": "10. How many people were there at the family ________ last weekend?", "options": ["reunion", "union", "unit", "united"], "answer": 0, "explanation": "\"family reunion\" = sự đoàn tụ gia đình.", "vis": ["đoàn tụ (đúng)", "liên minh", "đơn vị", "đã đoàn kết"], "tags": ["vocab"]}, {"q": "11. We should buy some ________ for the house before Tet.", "options": ["decoratively", "decorate", "decorations", "decorative"], "answer": 2, "explanation": "Sau \"some\" cần DANH TỪ số nhiều → decorations (đồ trang trí).", "vis": ["một cách trang trí (trạng từ, sai)", "trang trí (động từ, sai)", "đồ trang trí (đúng)", "mang tính trang trí (tính từ, sai)"], "tags": ["grammar"]}, {"q": "12. In Maori culture, it's the _________ for people to press their noses when it comes to greeting.", "options": ["customer", "customize", "customary", "custom"], "answer": 2, "explanation": "\"it's customary for sb to V\" = theo lệ thường/tập quán thì ai đó làm gì.", "vis": ["khách hàng", "tùy chỉnh", "theo tập quán (đúng)", "phong tục (danh từ, không hợp cấu trúc \"the ___ for\")"], "tags": ["vocab"]}, {"q": "13. Many young people don't ________ the tradition of living with their parents when they are eighteen.", "options": ["try", "follow", "obey", "take"], "answer": 1, "explanation": "\"follow a tradition\" = tuân theo/làm theo truyền thống.", "vis": ["thử", "tuân theo (đúng)", "vâng lời (không hợp collocation với tradition)", "lấy"], "tags": ["vocab"]}, {"q": "14. In Japan, take ________ your shoes at the entrance to all home, and most businesses and hotels.", "options": ["off", "at", "in", "to"], "answer": 0, "explanation": "\"take off your shoes\" = cởi giày ra.", "vis": ["cởi ra (đúng)", "tại", "trong", "đến"], "tags": ["vocab"]}, {"q": "15. Many people visit ________ to take pictures with the blooming flowers.", "options": ["flower villages", "Buddhist temples", "ornamental tree", "kumquat tree"], "answer": 0, "explanation": "\"flower villages\" = làng hoa — nơi có nhiều hoa nở để chụp ảnh.", "vis": ["làng hoa (đúng)", "chùa Phật giáo", "cây cảnh", "cây quất"], "tags": ["vocab"]}, {"q": "16. We ________ the Spring Festival on the 15th of January in the lunar calendar.", "options": ["occur", "hold", "happen", "take place"], "answer": 1, "explanation": "\"hold a festival\" = tổ chức lễ hội (chủ động), khác \"occur/happen/take place\" (tự xảy ra, không có tân ngữ).", "vis": ["tự xảy ra (nội động từ, sai)", "tổ chức (đúng — ngoại động từ)", "tự xảy ra (nội động từ, sai)", "diễn ra (nội động từ, sai)"], "tags": ["grammar"]}, {"q": "17. Festivals are important because they keep some village traditions ________.", "options": ["alive", "lively", "living", "live"], "answer": 0, "explanation": "\"keep sth alive\" = giữ cho cái gì tồn tại/sống động.", "vis": ["còn tồn tại (đúng — keep...alive)", "sinh động (tính từ khác nghĩa)", "đang sống", "trực tiếp"], "tags": ["vocab"]}, {"q": "18. The Japanese perform ________ during New Year celebrations.", "options": ["bamboo dance", "flower village", "lion dance", "festival goer"], "answer": 2, "explanation": "\"lion dance\" = múa lân — biểu diễn phổ biến dịp năm mới ở Nhật.", "vis": ["múa tre", "làng hoa", "múa lân (đúng)", "người đi lễ hội"], "tags": ["vocab"]}, {"q": "19. Linda fell in love with Peter without knowing about his real ________ status.", "options": ["social", "socialability", "society", "socialable"], "answer": 0, "explanation": "Bổ nghĩa cho danh từ \"status\" cần TÍNH TỪ → social.", "vis": ["thuộc xã hội (đúng, tính từ)", "sai chính tả", "xã hội (danh từ, sai)", "sai chính tả"], "tags": ["grammar"]}, {"q": "20. Tet's ________ is the longest holiday which may last up to seven to nine days.", "options": ["celebration", "celebratory", "celebrated", "celebrate"], "answer": 0, "explanation": "Làm chủ ngữ của câu cần DANH TỪ → celebration.", "vis": ["lễ kỷ niệm (đúng, danh từ)", "có tính chất kỷ niệm (tính từ)", "đã kỷ niệm (quá khứ)", "kỷ niệm (động từ)"], "tags": ["grammar"]}, {"q": "21. Thank you. That was ________ very nice lunch.", "options": ["the", "a", "an", "Ø"], "answer": 1, "explanation": "\"nice\" bắt đầu bằng phụ âm /n/ → dùng \"a\", và đây là danh từ đếm được số ít được nhắc lần đầu.", "vis": ["xác định (sai)", "một (đúng)", "một (trước nguyên âm, sai)", "không mạo từ (sai)"], "tags": ["grammar"]}, {"q": "22. He majors in ________ English.", "options": ["a", "Ø", "the", "an"], "answer": 1, "explanation": "Tên môn học/ngôn ngữ chung chung không dùng mạo từ.", "vis": ["một (sai)", "không mạo từ (đúng)", "xác định (sai)", "một, trước nguyên âm (sai)"], "tags": ["grammar"]}, {"q": "23. We often watch ________ television.", "options": ["a", "an", "the", "x"], "answer": 3, "explanation": "\"watch television\" (xem TV nói chung) không dùng mạo từ.", "vis": ["một (sai)", "một, trước nguyên âm (sai)", "xác định (sai)", "không mạo từ (đúng)"], "tags": ["grammar"]}, {"q": "24. My aunt has ________ interesting novel.", "options": ["an", "Ø", "the", "a"], "answer": 0, "explanation": "\"interesting\" bắt đầu bằng nguyên âm → dùng \"an\".", "vis": ["một, trước nguyên âm (đúng)", "không mạo từ (sai)", "xác định (sai)", "một, trước phụ âm (sai)"], "tags": ["grammar"]}, {"q": "25. ________ used razor blade is useless.", "options": ["The", "A", "Ø", "An"], "answer": 1, "explanation": "\"used\" bắt đầu bằng phụ âm /j/ (như \"u\" trong uniform) → dùng \"a\".", "vis": ["xác định (sai)", "một (đúng)", "không mạo từ (sai)", "một, trước nguyên âm (sai)"], "tags": ["grammar"]}, {"q": "26. We had ________ meal in a restaurant.", "options": ["the", "an", "Ø", "a"], "answer": 3, "explanation": "Danh từ số ít đếm được, nhắc lần đầu, không xác định → a.", "vis": ["xác định (sai)", "một, trước nguyên âm (sai)", "không mạo từ (sai)", "một (đúng)"], "tags": ["grammar"]}, {"q": "27. Can you turn off ________ television, please?", "options": ["the", "a", "an", "Ø"], "answer": 0, "explanation": "Chỉ CÁI TIVI CỤ THỂ trong phòng (đã xác định) → the.", "vis": ["xác định (đúng)", "một (sai)", "một, trước nguyên âm (sai)", "không mạo từ (sai)"], "tags": ["grammar"]}, {"q": "28. He tried to park his car but ________ space wasn't big enough.", "options": ["the", "Ø", "a", "an"], "answer": 0, "explanation": "Chỗ đỗ xe CỤ THỂ đang nói tới (đã xác định trong ngữ cảnh) → the.", "vis": ["xác định (đúng)", "không mạo từ (sai)", "một (sai)", "một, trước nguyên âm (sai)"], "tags": ["grammar"]}, {"q": "29. We live at ________ third house from the church.", "options": ["Ø", "an", "a", "the"], "answer": 3, "explanation": "Trước số thứ tự (third) → the.", "vis": ["không mạo từ (sai)", "một, trước nguyên âm (sai)", "một (sai)", "xác định (đúng — trước số thứ tự)"], "tags": ["grammar"]}, {"q": "30. Where can ________ people buy everything they need?", "options": ["Ø", "a", "an", "the"], "answer": 0, "explanation": "Danh từ số nhiều mang nghĩa chung chung → không mạo từ.", "vis": ["không mạo từ (đúng)", "một (sai — people số nhiều)", "một, trước nguyên âm (sai)", "xác định (sai — nghĩa chung)"], "tags": ["grammar"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "1. Wearing new clothes on Tet is a long-standing _______________ in Vietnam.", "hint": "(traditional)", "answer": "tradition", "explanation": "Sau \"a long-standing\" cần DANH TỪ → tradition (không phải tính từ traditional).", "vi": "Mặc quần áo mới vào dịp Tết là một truyền thống lâu đời ở Việt Nam.", "family": ["tradition (n): truyền thống", "traditional (adj): thuộc về truyền thống", "traditionally (adv): một cách truyền thống"]}, {"q": "2. The whole town was full of _______________ and happiness during the New Year.", "hint": "(festive)", "answer": "festivity", "explanation": "Sau \"full of\" và song song với \"happiness\" (danh từ) cần DANH TỪ → festivity.", "vi": "Cả thị trấn tràn ngập không khí lễ hội và niềm vui trong dịp năm mới.", "family": ["festival (n): lễ hội", "festive (adj): mang tính lễ hội, vui tươi", "festivity (n): không khí lễ hội"]}, {"q": "3. It's important to _______________ the beautiful customs of our ancestors.", "hint": "(maintenance)", "answer": "maintain", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → maintain (không phải danh từ maintenance).", "vi": "Điều quan trọng là duy trì những phong tục đẹp của tổ tiên chúng ta.", "family": ["maintain (v): duy trì", "maintenance (n): sự duy trì, bảo trì", "maintainable (adj): có thể duy trì được"]}, {"q": "4. Children should talk _______________ to their grandparents and elders.", "hint": "(respect)", "answer": "respectfully", "explanation": "Bổ nghĩa cho động từ \"talk\" cần TRẠNG TỪ → respectfully.", "vi": "Trẻ em nên nói chuyện lễ phép với ông bà và người lớn tuổi.", "family": ["respect (n/v): sự tôn trọng; tôn trọng", "respectful (adj): tỏ vẻ tôn trọng, lễ phép", "respectfully (adv): một cách tôn trọng", "respectable (adj): đáng kính trọng", "respective (adj): tương ứng, riêng từng cái", "respectively (adv): tương ứng, lần lượt"]}, {"q": "5. They were willing to show their _______________ of the new rules.", "hint": "(accept)", "answer": "acceptance", "explanation": "Sau tính từ sở hữu \"their\" cần DANH TỪ → acceptance.", "vi": "Họ sẵn lòng thể hiện sự chấp nhận các quy định mới.", "family": ["accept (v): chấp nhận", "acceptance (n): sự chấp nhận", "acceptable (adj): có thể chấp nhận được", "unacceptable (adj): không thể chấp nhận được"]}, {"q": "6. The children looked at the folk artists with great _______________.", "hint": "(admire)", "answer": "admiration", "explanation": "Sau \"with great\" cần DANH TỪ → admiration (sự ngưỡng mộ).", "vi": "Bọn trẻ nhìn các nghệ nhân dân gian với sự ngưỡng mộ lớn.", "family": ["admire (v): ngưỡng mộ, chiêm ngưỡng", "admiration (n): sự ngưỡng mộ", "admirable (adj): đáng ngưỡng mộ", "admirably (adv): một cách đáng ngưỡng mộ"]}, {"q": "7. Whether a custom is good or bad is always _______________.", "hint": "(contest)", "answer": "contestable", "explanation": "Sau \"is always\" cần TÍNH TỪ → contestable (có thể tranh cãi).", "vi": "Một phong tục là tốt hay xấu luôn là điều có thể tranh cãi.", "family": ["contest (n/v): cuộc thi; tranh cãi", "contestant (n): thí sinh", "contestable (adj): có thể tranh cãi được"]}, {"q": "8. The lanterns were hung _______________ across the street for the Mid-Autumn Festival.", "hint": "(decoration)", "answer": "decoratively", "explanation": "Bổ nghĩa cho động từ \"hung\" cần TRẠNG TỪ → decoratively.", "vi": "Những chiếc đèn lồng được treo trang trí khắp phố cho Tết Trung thu.", "family": ["decorate (v): trang trí", "decoration (n): sự trang trí, đồ trang trí", "decorator (n): người trang trí", "decorative (adj): mang tính trang trí", "decoratively (adv): một cách trang trí"]}, {"q": "9. I felt _______________ to help my neighbor prepare the Tet feast.", "hint": "(obligation)", "answer": "obliged", "explanation": "Sau \"felt\" cần TÍNH TỪ chỉ cảm giác → obliged (cảm thấy có nghĩa vụ).", "vi": "Tôi cảm thấy có trách nhiệm phải giúp hàng xóm chuẩn bị mâm cỗ Tết.", "family": ["oblige (v): bắt buộc, ép buộc", "obligation (n): nghĩa vụ, bổn phận", "obligatory (adj): bắt buộc", "obliged (adj): cảm thấy biết ơn/có nghĩa vụ"]}, {"q": "10. The best way to learn about other cultures is to _______________ with local people.", "hint": "(social)", "answer": "socialize", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → socialize (giao lưu, hòa nhập).", "vi": "Cách tốt nhất để tìm hiểu văn hóa khác là giao lưu với người dân địa phương.", "family": ["society (n): xã hội", "social (adj): thuộc về xã hội", "socially (adv): về mặt xã hội", "socialize (v): giao lưu, hòa nhập"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "A) Tet food", "html": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home.", "vi": "Tết là lễ hội lớn nhất Việt Nam. Để đón Tết, người Việt làm nhiều món ăn truyền thống ngon. Món quan trọng nhất gồm bánh chưng, giò, gà luộc, nem cuốn và xôi. Bánh chưng làm từ gạo nếp, thịt lợn, đậu xanh và gia vị, gói trong lá dong; vì thế bánh cần chuẩn bị công phu. Bánh có thể để lâu dù thời tiết ẩm dịp Tết. Các món quan trọng khác để cúng tổ tiên là giò, nem cuốn, xôi. Vì giò khó làm nên người ta thường mua từ nơi cung cấp uy tín. Còn xôi và nem cuốn dễ làm hơn, cần được ăn ngay sau khi nấu nên thường được làm tại nhà."}, "questions": [{"q": "1.", "options": ["celebrate", "join", "take part in", "participate"], "answer": 0, "vis": ["đón, mừng (đúng)", "tham gia", "tham gia (cụm)", "tham gia"], "explanation": "\"celebrate Tet\" = đón/mừng Tết."}, {"q": "2.", "options": ["delicious", "traditional", "spicy", "tradition"], "answer": 1, "vis": ["ngon", "truyền thống (đúng)", "cay", "truyền thống (danh từ, sai từ loại)"], "explanation": "\"traditional foods\" = món ăn truyền thống."}, {"q": "3.", "options": ["because", "while", "therefore", "however"], "answer": 2, "vis": ["bởi vì", "trong khi", "vì vậy (đúng — chỉ kết quả)", "tuy nhiên"], "explanation": "\"therefore\" chỉ kết quả của việc bánh làm cầu kỳ → cần nhiều công chuẩn bị."}, {"q": "4.", "options": ["to make", "making", "make", "makes"], "answer": 0, "vis": ["làm (to-V, đúng — difficult to V)", "làm (V-ing, sai)", "làm (nguyên mẫu, sai)", "làm (chia số ít, sai)"], "explanation": "Cấu trúc: difficult + to V."}, {"q": "5.", "options": ["touched", "smelled", "looked", "served"], "answer": 3, "vis": ["chạm vào", "ngửi", "nhìn", "phục vụ, dọn ra (đúng)"], "explanation": "\"served immediately\" = được dọn/ăn ngay lập tức."}, {"q": "6.", "options": ["to", "for", "at", "in"], "answer": 2, "vis": ["đến", "cho", "tại (đúng — at home)", "trong"], "explanation": "\"at home\" = tại nhà."}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "B) Wedding traditions around the world", "html": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony.", "vi": "Một phong tục đáng yêu của Pháp là chiếc cốc hai quai gọi là \"coup de marriage\". Chiếc cốc được lưu giữ để dùng từ thế hệ này sang thế hệ khác; tất nhiên, phong tục nâng ly chúc mừng nhau đã có từ lâu, nhưng chiếc cốc hai quai tạo điểm nhấn đặc biệt cho đám cưới ngày nay. Cho tới gần đây, những chiếc cốc này rất khó tìm. Uống chung một cốc thể hiện sự \"gắn kết\". Trong đám cưới Đức, cô dâu chú rể cầm nến trang trí hoa và ruy băng. Truyền thống đẹp này có thể đưa vào đám cưới hiện đại, với cặp đôi đặt nến đã mang tới bàn thờ cạnh nến hợp nhất. Những cây nến này sau đó được dùng để thắp sáng nến hợp nhất vào cuối buổi lễ. Hoa luôn đóng vai trò quan trọng trong đám cưới Ấn Độ. Một truyền thống lâu đời được truyền từ thế hệ này sang thế hệ khác là anh trai chú rể rắc cánh hoa lên đầu cặp đôi sau lời thề và vào cuối buổi lễ."}, "questions": [{"q": "1.", "options": ["generation", "ancestor", "ceremony", "worshiper"], "answer": 0, "vis": ["thế hệ (đúng)", "tổ tiên", "nghi lễ", "người thờ cúng"], "explanation": "\"from one generation to another\" = từ thế hệ này sang thế hệ khác."}, {"q": "2.", "options": ["some", "the", "a", "an"], "answer": 1, "vis": ["một vài", "xác định (đúng — chỉ phong tục đã biết)", "một", "một, trước nguyên âm"], "explanation": "\"the custom\" — phong tục cụ thể được nhắc tới, dùng \"the\"."}, {"q": "3.", "options": ["have been", "were", "had been", "are"], "answer": 1, "vis": ["đã (hiện tại hoàn thành, sai thì)", "đã từng (quá khứ đơn, đúng — until recently)", "đã từng (quá khứ hoàn thành, sai)", "hiện tại, sai thì"], "explanation": "\"Until recently\" gợi ý thì quá khứ đơn → were."}, {"q": "4.", "options": ["reunion", "festival", "tradition", "worship"], "answer": 2, "vis": ["đoàn tụ", "lễ hội", "truyền thống (đúng)", "thờ cúng"], "explanation": "\"this beautiful old tradition\" = truyền thống đẹp cổ xưa này."}, {"q": "5.", "options": ["to light", "lighting", "light", "lighted"], "answer": 0, "vis": ["để thắp sáng (to-V, đúng — used to V mục đích)", "V-ing, sai", "nguyên mẫu, sai", "đã thắp, sai"], "explanation": "Cấu trúc \"be used to V\" (mục đích: được dùng để làm gì) → to light."}, {"q": "6.", "options": ["import", "important", "importance", "importantly"], "answer": 1, "vis": ["nhập khẩu (sai từ loại)", "quan trọng (đúng, tính từ)", "tầm quan trọng (danh từ, sai)", "một cách quan trọng (trạng từ, sai)"], "explanation": "Bổ nghĩa cho danh từ \"part\" cần TÍNH TỪ → important."}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Something old, something new", "html": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married.", "vi": "Dù có nhiều kiểu đám cưới khác nhau ở Mỹ, hầu hết vẫn theo một số truyền thống nhất định. Một trong số đó là câu nói cổ có từ thế kỷ 19 ở Anh về những gì cô dâu nên mặc/mang theo: \"Cái gì đó cũ, cái gì đó mới, cái gì đó mượn, cái gì đó xanh.\" Cô dâu mặc đồ cũ để nhớ về gia đình và quá khứ. Một số cô dâu mặc váy cưới của mẹ hoặc trang sức của mẹ. Đồ mới tượng trưng cho may mắn và hy vọng về tương lai hạnh phúc — thường là đôi giày mới. Đồ mượn (khăn tay của bạn, khăn voan cưới của bạn đã kết hôn) thể hiện cô dâu có bạn bè và gia đình sẵn lòng giúp đỡ. Đồ xanh là biểu tượng của niềm tin và lòng chung thủy giữa cặp đôi — ngày nay một số cô dâu sáng tạo bằng cách sơn móng tay xanh nhạt hoặc đeo nịt tất xanh. Một truyền thống khác nói rằng chú rể nên lấy chiếc nịt tất sau lễ cưới và ném cho các chàng trai độc thân — ai bắt được sẽ là người kết hôn tiếp theo."}, "questions": [{"q": "1. The saying \"something old, something new, something borrowed, something blue\" dates back to 19th century England.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"an old saying that dates back to 19th century England\" → Đúng."}, {"q": "2. A bride wears something new to remind her of her family and the past.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"something OLD\" (không phải new) dùng để nhớ về gia đình và quá khứ → Sai."}, {"q": "3. Something borrowed shows that the bride has friends and family who are willing to help her.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Something borrowed... means the bride has friends and family who are willing to help her\" → Đúng."}, {"q": "4. The man who catches the garter will be the last person to get married.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: người bắt được nịt tất sẽ là người kết hôn TIẾP THEO, không phải cuối cùng → Sai."}, {"q": "5. Which of the following is a good title for the text?", "options": ["Various types of weddings.", "A wedding tradition and its meaning.", "What should be worn on your wedding day.", "How to plan a traditional wedding."], "answer": 1, "explanation": "Bài đọc chủ yếu giải thích ý nghĩa của một truyền thống cưới cụ thể."}, {"q": "6. Why do some brides wear a blue garter on their leg?", "options": ["Because too many brides paint their fingernails a light blue color.", "Because it is a symbol of trust and faith between the bride and the groom.", "To show how the couple can be lucky in their marriage.", "To show how popular something blue is in a wedding."], "answer": 1, "explanation": "Bài đọc: \"Something blue is a symbol of trust and faith between the couple.\""}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Gift-giving customs in Viet Nam", "html": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate.", "vi": "Việc tặng quà rất quan trọng ở Việt Nam vì ý nghĩa của các mối quan hệ giữa người với người trong văn hóa Việt. Trước hết, không khuyến khích tham nhũng — có ranh giới rõ giữa tặng quà và hối lộ. Tuy nhiên, việc trao đổi quà nhỏ trong các dịp như kỷ niệm, Tết,... để thể hiện sự tôn trọng, tình yêu thương, sự trân trọng hay lòng biết ơn là phổ biến. Phong tục tặng quà phụ thuộc vào hoàn cảnh: nếu là quà riêng cho một đối tác Việt Nam thì nên tặng vào dịp riêng tư; nếu là quà cho cả văn phòng/công ty thì nên tặng sau cuộc họp với toàn bộ nhân viên. Không nên gói quà bằng giấy đen vì màu này không may mắn, gắn với tang lễ ở Việt Nam. Nên tránh các món quà tượng trưng cho việc cắt như kéo, dao, vật sắc nhọn vì chúng mang nghĩa cắt đứt mối quan hệ. Người Việt có thể mở hoặc không mở quà ngay khi nhận — tùy vào họ quyết định. Bạn cũng sẽ nhận quà và nên theo ý chủ nhà xem có nên mở ngay hay không. Dù mở lúc nào hay là quà gì, lời cảm ơn chân thành luôn cần thiết."}, "questions": [{"q": "1. Personal relationships play an important role in gift-giving customs in Viet Nam.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Gift-giving is important... because of the significance of interpersonal relationships\" → Đúng."}, {"q": "2. It is acceptable to wrap a gift in black paper in Viet Nam.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Do not wrap a gift in black paper because this color is unlucky\" → Sai."}, {"q": "3. Sharp objects such as scissors or knives should be avoided as gifts because they symbolize cutting the relationship.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Gifts that symbolize cutting... should be avoided because they mean the cutting of the relationship\" → Đúng."}, {"q": "4. Vietnamese people are always required to open a gift immediately in front of the giver.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Vietnamese may or may not open these gifts when they are received; leave the option to them\" → Sai."}, {"q": "5. According to the passage, why is gift-giving important in Viet Nam?", "options": ["Because it helps to establish a friendship.", "Because it's common in Vietnamese culture.", "Because it's the best way to build up a stable relationship.", "Because personal relationships play a vital role in Vietnamese culture."], "answer": 3, "explanation": "Bài đọc mở đầu: \"Gift-giving is important in Viet Nam because of the significance of interpersonal relationships...\"."}, {"q": "6. Which of the following is NOT true about gift-giving customs in Viet Nam?", "options": ["Gift-giving is a good way of strengthening relationships.", "Gifts for your partners should be given at private occasions.", "You should avoid giving anything sharp.", "It is considered rude not to open the gift in front of the giver."], "answer": 3, "explanation": "Bài đọc nói ngược lại: người Việt có thể KHÔNG mở quà ngay trước mặt người tặng, không có gì bất lịch sự cả."}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "1.", "original": "There's a tradition that English people drink a lot of tea.", "starter": "English people follow", "answer": "the tradition of drinking a lot of tea", "accepted": null, "explanation": "There's a tradition that S + V = S + follow(s) the tradition of + V-ing", "vi": "Người Anh có truyền thống uống rất nhiều trà.", "note": "There's a tradition that S + V = S + follow(s) the tradition of + V-ing"}, {"q": "2.", "original": "Last year we went to Thailand on Tet holiday.", "starter": "Last year we broke with tradition by", "answer": "going to Thailand on Tet holiday", "accepted": null, "explanation": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing", "vi": "Năm ngoái chúng tôi đã phá vỡ truyền thống bằng cách đi Thái Lan vào dịp Tết.", "note": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing"}, {"q": "3.", "original": "The Vietnamese have the custom of worshipping ancestors.", "starter": "In Viet Nam there is", "answer": "a custom of worshipping ancestors", "accepted": null, "explanation": "S + have/has the custom of + V-ing = There + is/are + a custom of + V-ing", "vi": "Ở Việt Nam có phong tục thờ cúng tổ tiên.", "note": "S + have/has the custom of + V-ing = There + is/are + a custom of + V-ing"}, {"q": "4.", "original": "It's the custom for Vietnamese parents to celebrate their baby's first month.", "starter": "Vietnamese parents have", "answer": "the custom of celebrating their baby's first month", "accepted": null, "explanation": "It's the custom for sb to V = sb + have/has the custom of + V-ing", "vi": "Cha mẹ Việt Nam có phong tục tổ chức lễ đầy tháng cho con.", "note": "It's the custom for sb to V = sb + have/has the • Họ vẫn theo phong tục ghim tiền lên váy cô dâu.<br>• Ở đây có phong tục đặt hoa lên mộ vào lễ Phục sinh.<br>• phong tục tặng quà vào Giáng sinh."}, "questions": [{"q": "A. Every Tet, Vietnamese people _______________________ visiting their relatives and giving lucky money to children.", "answer": "follow the custom of", "explanation": "Dựa vào ví dụ: follow the custom of.", "vi": "Mỗi dịp Tết, người Việt theo phong tục thăm họ hàng và mừng tuổi trẻ em."}, {"q": "B. _______________________ here for the bride to wear a red ao dai on her wedding day.", "answer": "It is the custom", "explanation": "Dựa vào ví dụ: It is the custom.", "vi": "Ở đây có phong tục cô dâu mặc áo dài đỏ trong ngày cưới."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"tradition\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "tradition", "ipa": "/trəˈdɪʃn/", "pos": "noun", "senses": [{"def": "[countable, uncountable] a belief, custom or way of doing something that has existed for a long time among a particular group of people; a set of these beliefs or customs", "examples": ["This region is steeped in tradition.", "He is carrying on the family tradition of public service.", "They break with tradition and got married quietly."]}], "vi": "<b>tradition</b> /trəˈdɪʃn/ (danh từ)<br>niềm tin, phong tục hoặc cách làm việc đã tồn tại lâu đời trong một nhóm người cụ thể.<br>• Vùng này thấm đẫm truyền thống.<br>• Anh ấy tiếp nối truyền thống gia đình về phục vụ cộng đồng.<br>• Họ phá vỡ truyền thống và kết hôn lặng lẽ."}, "questions": [{"q": "A. Nam is _______________________ of making Chung cakes every Tet.", "answer": "carrying on the family tradition", "explanation": "Dựa vào ví dụ: carrying on the family tradition.", "vi": "Nam đang tiếp nối truyền thống gia đình làm bánh chưng mỗi dịp Tết."}, {"q": "B. This year, our class decided to _______________________ and celebrate Christmas at the beach instead of at school.", "answer": "break with tradition", "explanation": "Dựa vào ví dụ: break with tradition.", "vi": "Năm nay, lớp chúng tôi quyết định phá vỡ truyền thống và đón Giáng sinh ở biển thay vì ở trường."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">⚠️💧🚶</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">CAUTION — WET FLOOR</p></div>", "options": ["The floor is wet, so you should walk carefully.", "You are responsible for cleaning this floor.", "You are not allowed to use this floor for walking.", "It is safe to run fast in this area."], "answer": 0, "vis": ["Sàn ướt, bạn nên đi cẩn thận.", "Bạn có trách nhiệm lau sàn này.", "Bạn không được phép đi trên sàn này.", "An toàn để chạy nhanh ở khu vực này."], "explanation": "Biển báo \"Caution — Wet floor\" → sàn ướt, cần đi cẩn thận."}, {"q": "2. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔄🚗⭕</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">ROUNDABOUT — GO AROUND</p></div>", "options": ["All vehicles must drive through the center of the circle.", "You must drive straight ahead at the intersection.", "Vehicles must travel on top of the traffic circle.", "Drivers are required to move around the traffic circle."], "answer": 3, "vis": ["Mọi xe phải đi xuyên qua tâm vòng xuyến.", "Bạn phải đi thẳng tại giao lộ.", "Xe phải đi trên đỉnh bùng binh.", "Tài xế phải đi vòng quanh bùng binh (đúng)."], "explanation": "Biển báo bùng binh (roundabout) → phải đi vòng quanh."}, {"q": "3. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-rose-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🐕⚠️</div><p class=\"text-[11px] font-black text-center text-rose-700 leading-tight\">CAUTION — DOG ON PREMISES</p></div>", "options": ["You need to walk the dog in this area.", "You should be cautious because there is a dog here.", "Do not provide food for the animal.", "It's safe to interact with the dog."], "answer": 1, "vis": ["Bạn cần dắt chó đi dạo ở khu vực này.", "Bạn nên cẩn thận vì có chó ở đây (đúng).", "Không cho động vật ăn.", "An toàn để tiếp xúc với chó."], "explanation": "Biển \"Caution — dog on premises\" → cẩn thận vì có chó."}, {"q": "4. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🧤✅</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">GLOVES MUST BE WORN</p></div>", "options": ["It's a good idea to wear gloves in this place.", "Hand protection is mandatory before entering this place.", "Remember to bring your own gloves to this zone.", "You don't have to wear gloves in this place."], "answer": 1, "vis": ["Nên đeo găng tay ở nơi này.", "Bắt buộc phải bảo vệ tay trước khi vào nơi này (đúng).", "Nhớ mang găng tay riêng đến khu vực này.", "Bạn không cần đeo găng tay ở nơi này."], "explanation": "Biển báo bắt buộc đeo găng tay."}, {"q": "5. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫✂️🔪</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO SHARP OBJECTS ON BOARD</p></div>", "options": ["You can't buy sharp objects like scissors or knives during the flight.", "Using both scissors and knives at the same time is prohibited on the plane.", "You can't bring any sharp objects on the plane.", "You can't use scissors or knives because they are sharp."], "answer": 2, "vis": ["Bạn không thể mua vật sắc nhọn như kéo, dao trong chuyến bay.", "Cấm dùng cả kéo và dao cùng lúc trên máy bay.", "Bạn không được mang bất kỳ vật sắc nhọn nào lên máy bay (đúng).", "Bạn không được dùng kéo hay dao vì chúng sắc."], "explanation": "Biển báo cấm mang vật sắc nhọn lên máy bay."}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 5", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 5 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>carp</b> <span class='text-slate-400'>/kɑːp/</span> · <b class='text-slate-500'>article</b> <span class='text-slate-400'>/ˈɑːrtɪkl/</span> · <b class='text-slate-500'>party</b> <span class='text-slate-400'>/ˈpɑːrti/</span> · <b class='text-emerald-700'>tradition</b> <span class='text-slate-400'>/trəˈdɪʃn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"tradition\" có \"a\" phát âm /ə/, ba từ còn lại phát âm /ɑː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>connect</b> <span class='text-slate-400'>/kəˈnekt/</span> · <b class='text-slate-500'>cook</b> <span class='text-slate-400'>/kʊk/</span> · <b class='text-emerald-700'>dance</b> <span class='text-slate-400'>/dæns/</span> · <b class='text-slate-500'>control</b> <span class='text-slate-400'>/kənˈtroʊl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"dance\" có \"c\" phát âm /s/, ba từ còn lại phát âm /k/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>pass</b> <span class='text-slate-400'>/pæs/</span> · <b class='text-slate-500'>palm</b> <span class='text-slate-400'>/pɑːm/</span> · <b class='text-slate-500'>sharp</b> <span class='text-slate-400'>/ʃɑːrp/</span> · <b class='text-emerald-700'>man</b> <span class='text-slate-400'>/mæn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"man\" phát âm /æ/, ba từ còn lại phát âm /ɑː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-emerald-700'>custom</b> <span class='text-slate-400'>/ˈkʌstəm/</span> · <b class='text-slate-500'>correct</b> <span class='text-slate-400'>/kəˈrekt/</span> · <b class='text-slate-500'>clockwise</b> <span class='text-slate-400'>/ˈklɒkwaɪz/</span> · <b class='text-slate-500'>opinion</b> <span class='text-slate-400'>/əˈpɪnjən/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"custom\" có \"c\" đầu phát âm /k/ nhưng trọng tâm khác biệt về nguyên âm — theo đáp án chính thức khác 3 từ còn lại.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-emerald-700'>kidding</b> <span class='text-slate-400'>/ˈkɪdɪŋ/</span> · <b class='text-slate-500'>generate</b> <span class='text-slate-400'>/ˈdʒenəreɪt/</span> · <b class='text-slate-500'>sponge</b> <span class='text-slate-400'>/spʌndʒ/</span> · <b class='text-slate-500'>oblige</b> <span class='text-slate-400'>/əˈblaɪdʒ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"kidding\" có \"g\" phát âm /ɡ/, ba từ còn lại phát âm /dʒ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-slate-500'>design</b> <span class='text-slate-400'>/dɪˈzaɪn/</span> · <b class='text-slate-500'>preserve</b> <span class='text-slate-400'>/prɪˈzɜːrv/</span> · <b class='text-emerald-700'>basic</b> <span class='text-slate-400'>/ˈbeɪsɪk/</span> · <b class='text-slate-500'>physical</b> <span class='text-slate-400'>/ˈfɪzɪkl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"basic\" có \"s\" phát âm /s/, ba từ còn lại phát âm /z/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>7. <b class='text-slate-500'>cousin</b> <span class='text-slate-400'>/ˈkʌzn/</span> · <b class='text-slate-500'>interesting</b> <span class='text-slate-400'>/ˈɪntrəstɪŋ/</span> · <b class='text-emerald-700'>link</b> <span class='text-slate-400'>/lɪŋk/</span> · <b class='text-slate-500'>fond</b> <span class='text-slate-400'>/fɒnd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"link\" phát âm /ɪ/ (nguyên âm ngắn khác biệt), ba từ còn lại chung nhóm âm khác theo đáp án chính thức.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>8. <b class='text-slate-500'>lantern</b> <span class='text-slate-400'>/ˈlæntərn/</span> · <b class='text-slate-500'>important</b> <span class='text-slate-400'>/ɪmˈpɔːrtnt/</span> · <b class='text-slate-500'>money</b> <span class='text-slate-400'>/ˈmʌni/</span> · <b class='text-emerald-700'>thank</b> <span class='text-slate-400'>/θæŋk/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"thank\" có \"th\" phát âm /θ/ (âm cắn lưỡi), khác biệt với phụ âm mũi ở 3 từ còn lại.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>9. <b class='text-emerald-700'>many</b> <span class='text-slate-400'>/ˈmeni/</span> · <b class='text-slate-500'>take</b> <
