<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đề 3 và Đề 4 Anh 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-column app (max 640px). Home = lesson path in 4 bands (matrix parts); lesson = card + sticky check bar; results = score + review list. */
:root{
  --bg:#F3F7F4; --surface:#FFFFFF; --sunk:#E8EFEA; --ink:#1C2B26; --muted:#5A6B64; --line:#D5E0DA;
  --accent:#0F8B6C; --accent-d:#0A6B53; --accent-soft:#D6F0E7;
  --sun:#F5A524; --sun-d:#C77F0A; --sun-soft:#FFF1D6;
  --good:#2E9E4F; --good-d:#22783B; --good-soft:#DDF5E3;
  --bad:#D9434A; --bad-d:#A93035; --bad-soft:#FCE3E4;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A17; --surface:#18241F; --sunk:#22312B; --ink:#E7F0EC; --muted:#9FB2AA; --line:#2E3F38;
  --accent:#2BBF97; --accent-d:#1E8E70; --accent-soft:#163A30;
  --sun:#F7B443; --sun-d:#B9800F; --sun-soft:#3A2E14;
  --good:#45C26A; --good-d:#2D8C4A; --good-soft:#173322;
  --bad:#F06A70; --bad-d:#B8434A; --bad-soft:#3B1D20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A17; --surface:#18241F; --sunk:#22312B; --ink:#E7F0EC; --muted:#9FB2AA; --line:#2E3F38;
  --accent:#2BBF97; --accent-d:#1E8E70; --accent-soft:#163A30;
  --sun:#F7B443; --sun-d:#B9800F; --sun-soft:#3A2E14;
  --good:#45C26A; --good-d:#2D8C4A; --good-soft:#173322;
  --bad:#F06A70; --bad-d:#B8434A; --bad-soft:#3B1D20; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:15px;
  background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn[disabled]{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--accent);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);box-shadow:0 4px 0 var(--sun-d);color:#2A1B00}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.good{background:var(--good);box-shadow:0 4px 0 var(--good-d)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:24px;color:var(--accent)}
.brand small{color:var(--muted);font-weight:700;font-size:13px}
.icon{width:18px;height:18px;flex:none}
/* hero */
.hero{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:22px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:20px}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-weight:700}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.exgrid.two{grid-template-columns:1fr 1fr}
.exbtn{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.exbtn b{font-family:var(--display);font-size:20px;color:var(--accent)}
.exbtn span{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.testcard{background:var(--sun-soft);border-color:var(--sun)}
.testcard p{margin:6px 0 12px}
/* path */
.band{border-radius:var(--r);padding:14px 16px;color:#fff;margin:26px 0 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap}
.band h2{font-size:22px}
.band p{margin:2px 0 0;font-weight:700;opacity:.9;font-size:14px}
.band .part{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
.b-all{background:#0F8B6C}.b-d3{background:#2F6FD0}.b-d4{background:#B35BC9}.b-phon{background:#0F8B6C}.b-mcq{background:#2F6FD0}.b-read{background:#B35BC9}.b-write{background:#D9762B}
.path{display:flex;flex-direction:column;gap:18px;align-items:center}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:180px;max-width:100%}
.node .disc{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:700;color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,.22);position:relative;transition:transform .08s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.node .disc.todo{filter:saturate(.35) brightness(1.05)}
.node .label{font-weight:800;font-size:14px;text-align:center;line-height:1.25}
.node .meta{font-size:12px;color:var(--muted);font-weight:700;text-align:center}
.node .crown{position:absolute;right:-6px;top:-6px;background:var(--sun);color:#2A1B00;font-size:12px;font-family:var(--body);font-weight:800;border-radius:999px;padding:2px 7px;border:2px solid var(--surface)}
.stars{display:flex;gap:2px;justify-content:center}
.stars svg{width:14px;height:14px}
/* lesson */
.lessontop{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;align-items:center;gap:12px;padding-block:10px}
.x{border:0;background:none;padding:6px;border-radius:10px;color:var(--muted)}
.bar{flex:1;height:16px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--good);border-radius:999px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.combo{font-weight:800;color:var(--sun-d);display:flex;align-items:center;gap:4px;min-width:44px;justify-content:flex-end;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .combo{color:var(--sun)}
.qkind{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--accent);margin:10px 0 4px}
.redo{color:var(--bad);margin-left:8px}
.prompt{font-family:var(--display);font-size:22px;font-weight:600;margin:0 0 14px;line-height:1.35}
.prompt.small{font-size:19px}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;max-height:34vh;overflow:auto;font-size:15px}
.passage p{margin:0 0 8px;text-indent:1.2em}
.passage summary{font-weight:800;cursor:pointer;color:var(--accent)}
.blank{background:var(--sunk);border-radius:6px;padding:0 6px;font-weight:800;white-space:nowrap}
.blank.cur{background:var(--sun);color:#2A1B00}
.signimg{display:block;margin:0 auto 14px;max-height:180px;width:auto;border-radius:10px;border:2px solid var(--line);background:#fff}
.entry{background:var(--surface);border:2px dashed var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:15px}
.entry b.hw{font-size:18px}
.entry ul{margin:6px 0 0;padding-left:20px}
.entry li{font-style:italic}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 14px;font-size:17px;font-weight:700;min-width:0}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.opt u{text-decoration-thickness:2px;text-underline-offset:3px;color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-family:var(--display);font-size:20px}
.typebox{display:flex;flex-direction:column;gap:8px}
.typebox input{border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px;font:inherit;font-size:18px;font-weight:700;background:var(--surface);color:var(--ink)}
.cue{font-weight:800;color:var(--accent)}
.build .line{min-height:64px;border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.build .start{font-weight:800;font-size:17px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;min-height:52px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-weight:700;font-size:17px}
.tile.used{visibility:hidden}
/* footer + sheet */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:10}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot .btn{min-width:150px}
.foot.ok{background:var(--good-soft);border-color:var(--good)}
.foot.no{background:var(--bad-soft);border-color:var(--bad)}
.fb{flex:1;min-width:0}
.fb h3{font-size:22px;display:flex;align-items:center;gap:8px}
.foot.ok .fb h3{color:var(--good)} .foot.no .fb h3{color:var(--bad)}
.fb .ans{font-weight:800;margin-top:4px}
.fb .ex{font-size:15px;margin-top:4px;max-height:30vh;overflow:auto}
/* results */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.tile-stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.tile-stat b{display:block;font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.tile-stat span{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.big{font-family:var(--display);font-size:64px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.kbars{display:grid;gap:8px;margin:8px 0 18px}
.kb{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-weight:700;font-size:14px}
.kb .tr{height:12px;background:var(--sunk);border-radius:999px;overflow:hidden}
.kb .tr i{display:block;height:100%;background:var(--good)}
.kb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.review{display:grid;gap:10px}
.rv{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--bad);border-radius:12px;padding:12px 14px;font-size:15px}
.rv.okrv{border-left-color:var(--good)}
.rv .q{font-weight:800}
.rv .your{color:var(--bad);font-weight:700}
.rv .cor{color:var(--good-d);font-weight:800}
:root[data-theme="dark"] .rv .cor{color:var(--good)}
.rv .ex{color:var(--muted);margin-top:4px}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th,table.st td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.st td.n,table.st th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.hidden{display:none!important}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:800;z-index:50}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pop{animation:pop .22s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.prompt{font-size:20px}.opt{font-size:16px}.foot .btn{min-width:0;flex:1}.kb{grid-template-columns:90px 1fr 46px}}
</style>
</head>
<body>


<div class="app" id="app"></div>
<div class="foot hidden" id="foot"><div class="in" id="footIn"></div></div>

<script>

ing"], "ans": 1, "expl": "load sth with sth: chất (hàng) lên xe. unload = dỡ hàng xuống (không đi với “with timber”).", "no": 7}, {"t": "choice", "kind": "mcq", "prompt": "Mono wants to become a singer; ____________, he can’t sing or play any instruments.", "opts": ["because", "therefore", "however", "although"], "ans": 2, "expl": "Hai ý trái ngược (muốn làm ca sĩ – không biết hát), có dấu “;” và “,” → however (tuy nhiên).", "no": 8}, {"t": "choice", "kind": "mcq", "prompt": "Mr Quang used Facebook ____________ 10 p.m. last night.", "opts": ["for", "at", "in", "on"], "ans": 1, "expl": "at + giờ cụ thể: at 10 p.m.", "no": 9}, {"t": "choice", "kind": "mcq", "prompt": "My grandparents live in a small village where the pace of life is slow and ____________.", "opts": ["crowded", "noisy", "peaceful", "busy"], "ans": 2, "expl": "Nhịp sống chậm ở làng quê → peaceful (yên bình). Ba từ còn lại mô tả thành phố.", "no": 10}, {"t": "choice", "kind": "mcq", "prompt": "After the harvest, the farmers ____________ the rice in the sun before selling it.", "opts": ["dry", "ride", "grow", "water"], "ans": 0, "expl": "dry the rice: phơi lúa (sau khi thu hoạch, trước khi bán).", "no": 11}, {"t": "choice", "kind": "mcq", "prompt": "I’m not good at maths, so I always feel under a lot of ____________ before maths tests.", "opts": ["pressing", "pleasure", "pressure", "press"], "ans": 2, "expl": "be/feel under pressure: chịu áp lực.", "no": 12}, {"t": "choice", "kind": "mcq", "prompt": "Lan is very ____________ at making paper flowers; she has made more than 100 of them.", "opts": ["fond", "good", "keen", "interested"], "ans": 1, "expl": "be good at + V-ing: giỏi làm gì. (interested in, keen on, fond of – sai giới từ.)", "no": 13}, {"t": "choice", "kind": "mcq", "prompt": "Student A: You look nice today.   Student B: ____________", "opts": ["I don’t think so.", "I’m fine, thank you.", "I beg your pardon.", "Do you really think so? Thanks."], "ans": 3, "expl": "Đáp lại lời khen một cách lịch e to sit at the front.", "Children are not allowed to sit here."], "ans": 1, "expl": "“reserved for children”: dành riêng cho trẻ em.", "ref": "Unit 1", "no": 16}]}, {"id": "d3-III", "sec": "d3", "keep": true, "icon": "III", "title": "Phần III. Đọc điền từ", "sub": "Câu 17 – 22 · 1,5 điểm · Unit 1 – family time", "qs": [{"t": "choice", "kind": "gap", "no": 17, "blank": 17, "prompt": "Chọn đáp án đúng cho chỗ trống (17).", "opts": ["spend", "spends", "to spend", "spending"], "ans": 3, "expl": "enjoy + V-ing → spending."}, {"t": "choice", "kind": "gap", "no": 18, "blank": 18, "prompt": "Chọn đáp án đúng cho chỗ trống (18).", "opts": ["on", "from", "with", "to"], "ans": 2, "expl": "connect with sb: gắn kết với ai."}, {"t": "choice", "kind": "gap", "no": 19, "blank": 19, "prompt": "Chọn đáp án đúng cho chỗ trống (19).", "opts": ["water pollution", "air pollution", "environmental pollution", "fresh air"], "ans": 3, "expl": "Đạp xe về làng quê để tận hưởng không khí trong lành (fresh air)."}, {"t": "choice", "kind": "gap", "no": 20, "blank": 20, "prompt": "Chọn đáp án đúng cho chỗ trống (20).", "opts": ["cooking", "cooks", "eat", "cook"], "ans": 3, "expl": "Song song với “prepare” sau chủ ngữ “we” → cook."}, {"t": "choice", "kind": "gap", "no": 21, "blank": 21, "prompt": "Chọn đáp án đúng cho chỗ trống (21).", "opts": ["medal", "prize", "gift", "award"], "ans": 1, "expl": "win the first prize: đạt giải nhất."}, {"t": "choice", "kind": "gap", "no": 22, "blank": 22, "prompt": "Chọn đáp án đúng cho chỗ trống (22).", "opts": ["connecting", "connection", "connected", "connect"], "ans": 3, "expl": "a way to + V nguyên mẫu → connect."}], "passage": ["Some teenagers enjoy (17) ______ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect (18) ______ them.", "At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the (19) ______. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and (20) ______. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook.", "The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first (21) ______ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to (22) ______ with them."]}, {"id": "d3-IV", "sec": "d3", "keep": true, "icon": "IV", "title": "Phần IV. Đọc True / False", "sub": "Câu 23 – 28 · 1,5 điểm · Unit 3 – teenagers and stress", "qs": [{"t": "tf", "kind": "tf", "prompt": "Many teenagers feel stressed only because of exams.", "ans": 1, "expl": "Bài nêu ba lí do: “schoolwork, exams and pressure from their parents” → không chỉ vì kì thi.", "no": 23}, {"t": "tf", "kind": "tf", "prompt": "Spending too much time on social media can make teenagers feel more tired.", "ans": 0, "expl": "“this often makes them feel more tired.”", "no": 24}, {"t": "tf", "kind": "tf", "prompt": "Experts advise teenagers to keep their problems to themselves.", "ans": 1, "expl": "Chuyên gia khuyên “talk to someone they trust” → nên chia sẻ, không giữ trong lòng.", "no": 25}, {"t": "tf", "kind": "tf", "prompt": "Minh joined the school music club last year.", "ans": 0, "expl": "“Minh … joined the school music club last year.”", "no": 26}, {"t": "choice", "kind": "tfmc", "prompt": "According to the passage, how can parents and teachers help teenagers?", "opts": ["By giving them more homework.", "By buying them new phones.", "By letting them play computer games.", "By listening to them."], "ans": 3, "expl": "“Parents and teachers can also help by listening to them.”", "no": 27}, {"t": "choice", "kind": "tfmc", "prompt": "What is the passage mainly about?", "opts": ["Why social media is useful for students.", "How teenagers can deal with stress and problems.", "Why teenagers should play computer games.", "How to join a music club in Da Nang."], "ans": 1, "expl": "Cả bài nói về nguyên nhân căng thẳng và cách giải quyết (chia sẻ, tham gia câu lạc bộ).", "no": 28}], "passage": ["Being a teenager is not always easy. Many teenagers in Viet Nam feel stressed because of schoolwork, exams and pressure from their parents. Some of them spend too much time on social media to forget their problems, but this often makes them feel more tired. Experts say that teenagers should talk to someone they trust when they have problems. Parents and teachers can also help by listening to them instead of only giving advice.", "Joining a club is another good idea. In clubs, teenagers can make new friends, learn new skills and become more confident. For example, Minh, a 14-year-old student from Da Nang, joined the school music club last year. He says he feels much happier now because he can share his interests with other members. He also has less time for computer games, so he sleeps better."]}, {"id": "d3-V", "sec": "d3", "keep": true, "icon": "V", "title": "Phần V. Word form", "sub": "Câu 29 – 34 · 1,5 điểm", "qs": [{"t": "type", "kind": "wf", "prompt": "I think badminton is an easy sport which helps to improve my muscle _____.", "cue": "STRONG", "ans": ["strength"], "expl": "Sau danh từ “muscle” (muscle strength) cần danh từ → strength (sức mạnh).", "no": 29}, {"t": "type", "kind": "wf", "prompt": "My brother is a famous _____ ; he makes everyone laugh on TV.", "cue": "COMEDY", "ans": ["comedian"], "expl": "Sau “a famous” cần danh từ chỉ người (làm mọi người cười) → comedian (diễn viên hài).", "no": 30}, {"t": "type", "kind": "wf", "prompt": "Modern _____ methods have helped to significantly increase crop yields in this region.", "cue": "FARM", "ans": ["farming"], "expl": "Danh từ ghép “farming methods” (phương pháp canh tác).", "no": 31}, {"t": "type", "kind": "wf", "prompt": "The  "keep": true, "icon": "III", "title": "Phần III. Đọc điền từ", "sub": "Câu 17 – 22 · 1,5 điểm · Unit 3 – social media", "qs": [{"t": "choice", "kind": "gap", "no": 17, "blank": 17, "prompt": "Chọn đáp án đúng cho chỗ trống (17).", "opts": ["popularly", "popularize", "popular", "popularity"], "ans": 2, "expl": "Sau “very” cần tính từ → popular (phổ biến)."}, {"t": "choice", "kind": "gap", "no": 18, "blank": 18, "prompt": "Chọn đáp án đúng cho chỗ trống (18).", "opts": ["out", "on", "at", "off"], "ans": 1, "expl": "log on to (Facebook): đăng nhập vào. log off / log out = đăng xuất, không đi với “to … to chat”."}, {"t": "choice", "kind": "gap", "no": 19, "blank": 19, "prompt": "Chọn đáp án đúng cho chỗ trống (19).", "opts": ["do", "make", "keep", "take"], "ans": 2, "expl": "keep in touch with sb: giữ liên lạc với ai; help sb + V."}, {"t": "choice", "kind": "gap", "no": 20, "blank": 20, "prompt": "Chọn đáp án đúng cho chỗ trống (20).", "opts": ["However", "Therefore", "So", "Because"], "ans": 0, "expl": "Câu trước nói ích lợi, câu sau nói tác hại → However, (tuy nhiên)."}, {"t": "choice", "kind": "gap", "no": 21, "blank": 21, "prompt": "Chọn đáp án đúng cho chỗ trống (21).", "opts": ["although", "but", "because", "so"], "ans": 2, "expl": "“stay up late watching videos” là nguyên nhân của “tired and stressed” → because."}, {"t": "choice", "kind": "gap", "no": 22, "blank": 22, "prompt": "Chọn đáp án đúng cho chỗ trống (22).", "opts": ["wisdom", "wiser", "wisely", "wise"], "ans": 2, "expl": "Bổ nghĩa cho động từ “use (my phone)” → trạng từ wisely (một cách khôn ngoan)."}], "passage": ["Nowadays, social media is very (17) ______ among teenagers. Most of them log (18) ______ to Facebook or TikTok every day to chat with friends and share photos. Social media helps them (19) ______ in touch with friends who live far away. (20) ______, spending too much time online can be harmful. Many teens feel tired and stressed (21) ______ they stay up late watching videos. My parents advise me to use my phone (22) ______ and spend more time on sports and club activities."]}, {"id": "d4-IV", "sec": "d4", "keep": true, "icon": "IV", "title": "Phần IV. Đọc True / False", "sub": "Câu 23 – 28 · 1,5 điểm · Unit 2 – British countryside", "qs": [{"t": "tf", "kind": "tf", "prompt": "The British countryside is known only for its beautiful scenery without any contrasts.", "ans": 1, "expl": "Bài nói “well known for its many contrasts” → có nhiều sự tương phản.", "no": 23}, {"t": "tf", "kind": "tf", "prompt": "National parks in Britain are protected from development by the government.", "ans": 0, "expl": "“National parks which are protected from development by the government…”", "no": 24}, {"t": "tf", "kind": "tf", "prompt": "Most farmland in Britain is owned by the government.", "ans": 1, "expl": "“Most farmland is now owned by individual people or independent companies.”", "no": 25}, {"t": "tf", "kind": "tf", "prompt": "Today, many people living in rural areas travel to work in towns every day.", "ans": 0, "expl": "“Many of them commute to work in towns.” (commute = đi làm hằng ngày).", "no": 26}, {"t": "choice", "kind": "tfmc", "prompt": "What is the main idea of the passage?", "opts": ["The reasons why national parks are famous.", "The contrasts, features, and lifestyle in the British countryside.", "The best outdoor activities for British people.", "The history of British farmland ownership."], "ans": 1, "expl": "Bài nói về sự tương phản, đặc điểm và lối sống ở vùng quê nước Anh.", "no": 27}, {"t": "choice", "kind": "tfmc", "prompt": "According to the passage, what do British people usually associate the countryside with?", "opts": ["Farmland, open spaces, and green fields enclosed by hedges or stone walls.", "Large forests without any farms.", "Only national parks and wild coastlines.", "Modern buildings and busy roads."], "ans": 0, "expl": "“British people often associate the countryside with farmland, open spaces… green fields enclosed by hedges or stone walls.”", "no": 28}], "passage": ["Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland.", "Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."]}, {"id": "d4-V", "sec": "d4", "keep": true, "icon": "V", "title": "Phần V. Word form", "sub": "Câu 29 – 34 · 1,5 điểm", "qs": [{"t": "type", "kind": "wf", "prompt": "Video games are a popular form of _____ for teenagers.", "cue": "ENTERTAIN", "ans": ["entertainment"], "expl": "Sau giới từ “of” cần danh từ → entertainment (sự giải trí).", "no": 29}, {"t": "type", "kind": "wf", "prompt": "Doing exercise every day keeps my grandmother healthy and _____.", "cue": "ACT", "ans": ["active"], "expl": "Song song với tính từ “healthy” (keep sb + adj) → active (năng động).", "no": 30}, {"t": "type", "kind": "wf", "prompt": "My friends _____ lots of ancient coins last year.", "cue": "COLLECT", "ans": ["collected"], "expl": "Sau chủ ngữ cần động từ; “last year” → quá khứ: collected (đã sưu tầm).", "no": 31}, {"t": "type", "kind": "wf", "prompt": "The local people were surprisingly _____ towards the tourists, which made everyone feel uncomfortable.", "cue": "FRIEND", "ans": ["unfriendly"], "expl": "Sau “were” cần tính từ; vế sau “uncomfortable” mang nghĩa tiêu cực → unfriendly (không thân thiện).", "no": 32}, {"t": "type", "kind": "wf", "prompt": "The Games is an international sporting event with more than three thousand _____.", "cue": "PARTICIPATE", "ans": ["participants"], "expl": "Sau số đếm “three thousand” cần danh từ số nhiều chỉ người → participants.", "no": 33}, {"t": "type", "kind": "wf", "prompt": "_____ in school clubs helps teenagers develop their social skills.", "cue": "PARTICIPATE", "ans": ["Participation"], "expl": "Làm chủ ngữ của câu (động từ “helps” số ít) → danh từ: Participation (sự tham gia).", "no": 34}]}, {"id": "d4-VI", "sec": "d4", "keep": true, "icon": "VI", "title": "Phần VI. Tra từ điển", "sub": "Câu 35 – 36 · 0,5 điểm", "qs": [{"t": "type", "kind": "dict", "prompt": "There is _____ from the public for the government to lower taxes this year.", "entry": {"word": "pressure", "ipa": "/ˈpreʃə(r)/", "pos": "noun", "def": "[uncountable] the act of trying to persuade or force somebody to do something", "ex": ["He backed down <b>under pressure from<\/b> his colleagues.", "The company is <b>under pressure<\/b> to increase its profits.", "She <b>put pressure on<\/b> him to sign the contract.", "There is <b>growing pressure<\/b> for changes in the law."]}, "ans": ["growing pressure"], "expl": "Tìm trong mục từ “pressure” cụm in đậm hợp nghĩa: <b>growing pressure<\/b>.", "no": 35}, {"t": "type", "kind": "dict", "prompt": "The manager had to change his mind because he was _____ from the team.", "entry": {"word": "pressure", "ipa": "/ˈpreʃə(r)/", "pos": "noun", "def": "[uncountable] the act of trying to persuade or force somebody to do something", "ex": ["He backed down <b>under pressure from<\/b> his colleagues.", "The company is <b>under pressure<\/b> to increase its profits.", "She <b>put pressure on<\/b> him to sign the contract.", "There is <b>growing pressure<\/b> for changes in the law."]}, "ans": ["under pressure"], "expl": "Tìm trong mục từ “pressure” cụm in đậm hợp nghĩa: <b>under pressure<\/b>.", "no": 36}]}, {"id": "d4-VII", "sec": "d4", "keep": true, "icon": "VII", "title": "Phần VII. Viết lại câu", "sub": "Câu 37 – 40 · 1,0 điểm", "qs": [{"t": "build", "kind": "trans", "prompt": "Lan loves taking photos of the countryside.", "start": "Lan is fond", "full": "Lan is fond of taking photos of the countryside.", "alts": [], "expl": "love + V-ing = be fond of + V-ing. Nhớ giới từ “of”.", "no": 37, "tokens": ["of", "taking", "photos", "of", "the", "countryside."], "distract": ["on", "in", "to"], "answers": ["Lan is fond of taking photos of the countryside."]}, {"t": "build", "kind": "trans", "prompt": "It took him two hours to fix his broken bicycle yesterday.", "start": "He spent", "full": "He spent two hours fixing his broken bicycle yesterday.", "alts": [], "expl": "It took + O + time + to V = S + spent + time + V-ing. him → He; to fix → fixing.", "no": 38, "tokens": ["two", "hours", "fixing", "his", "broken", "bicycle", "yesterday."], "distract": ["to", "fix", "took"], "answers": ["He spent two hours fixing his broken bicycle yesterday."]}, {"t": "build", "kind": "trans", "prompt": "Living in the city is convenient; however, it is very noisy.", "start": "Although", "full": "Although living in the city is convenient, it is very noisy.", "alts": [], "expl": "S1; however, S2 = Although S1, S2. Bỏ “however” và dấu chấm phẩy.", "no": 39, "tokens": ["living", "in", "the", "city", "is", "convenient,", "it", "is", "very", "noisy."], "distract": ["however", "but", "so"], "answers": ["Although living in the city is convenient, it is very noisy."]}, {"t": "build", "kind": "trans", "prompt": "My father is a safer driver than my brother.", "start": "My father drives", "full": "My father drives more safely than my brother.", "alts": [], "expl": "safer (adj) → more safely (adv); driver → drives.", "no": 40, "tokens": ["more", "safely", "than", "my", "brother."], "distract": ["safe", "safer", "well"], "answers": ["My father drives more safely than my brother."]}]}, {"id": "all-I", "sec": "all", "keep": true, "icon": "I", "title": "Phần I. Ngữ âm, từ vựng, ngữ pháp", "sub": "Phát âm, trọng âm, trắc nghiệm", "qs": [{"t": "choice", "kind": "pron", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["pictur<u>es<\/u>", "brush<u>es<\/u>", "bus<u>es<\/u>", "watch<u>es<\/u>"], "ans": 0, "expl": "“pictures” đọc /z/; các từ còn lại tận cùng bằng âm /tʃ/, /s/, /ʃ/ nên -es đọc /ɪz/.", "no": 1, "html": true, "src": "Đề 3"}, {"t": "choice", "kind": "pron", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["need<u>ed<\/u>", "decid<u>ed<\/u>", "visit<u>ed<\/u>", "play<u>ed<\/u>"], "ans": 3, "expl": "“played” đọc /d/; các từ còn lại tận cùng bằng /t/, /d/ nên -ed đọc /ɪd/.", "no": 2, "html": true, "src": "Đề 3"}, {"t": "choice", "kind": "pron", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["<u>oi<\/u>l", "b<u>oi<\/u>l", "t<u>oy<\/u>", "p<u>oo<\/u>r"], "ans": 3, "expl": "“poor” đọc /ʊə/ (hoặc /ɔː/); oi, oy đọc /ɔɪ/.", "no": 1, "html": true, "src": "Đề 4"}, {"t": "choice", "kind": "pron", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["<u>ch<\/u>ess", "<u>ch<\/u>ildren", "<u>ch<\/u>at", "s<u>ch<\/u>ool"], "ans": 3, "expl": "“school” đọc /k/; các từ còn lại đọc /tʃ/.", "no": 2, "html": true, "src": "Đề 4"}, {"t": "choice", "kind": "stress", "prompt": "Chọn từ có trọng âm khác các từ còn lại.", "opts": ["orchard", "ferry", "cattle", "collect"], "ans": 3, "expl": "collect /kəˈlekt/ nhấn âm 2; cattle, ferry, orchard nhấn âm 1.", "no": 3, "html": true, "src": "Đề 3"}, {"t": "choice", "kind": "stress", "prompt": "Chọn từ có trọng âm khác các từ còn lại.", "opts": ["nomad", "picturesque", "cultivate", "harvest"], "ans": 1, "expl": "picturesque /ˌpɪktʃəˈresk/ nhấn âm 3; cultivate, harvest, nomad nhấn âm 1.", "no": 4, "html": true, "src": "Đề 3"}, {"t": "choice", "kind": "stress", "prompt": "Chọn từ có trọng âm khác các từ còn lại.", "opts": ["guidance", "pressure", "decision", "friendship"], "ans": 2, "expl": "decision /dɪˈsɪʒn/ nhấn âm 2; các từ còn lại nhấn âm 1.", "no": 3, "html": true, "src": "Đề 4"}, {"t": "choice", "kind": "stress", "prompt": "Chọn từ có trọng âm khác các từ còn lại.", "opts": ["adolescence", "independent", "disappointed", "teenager"], "ans": 3, "expl": "teenager /ˈtiːneɪdʒə/ nhấn âm 1; các từ còn lại nhấn âm 3.", "no": 4, "html": true, "src": "Đề 4"}, {"t": "choice", "kind": "mcq", "prompt": "About 16% of them love ____________ swimming.", "opts": ["went", "going", "to going", "go"], "ans": 1, "expl": "love + V-ing → going. (to going sai cấu trúc.)", "no": 5, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "____________ do you do with your friends in your free time?", "opts": ["Who", "When", "How", "What"], "ans": 3, "expl": "Hỏi về hoạt động (do …) → What (cái gì).", "no": 6, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "The workers are ____________ a truck with timber.", "opts": ["unloading", "loading", "filling", "taking"], "ans": 1, "expl": "load sth with sth: chất (hàng) lên xe. unload = dỡ hàng xuống (không đi với “with timber”).", "no": 7, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "Mono wants to become a singer; ____________, he can’t sing or play any instruments.", "opts": ["because", "therefore", "however", "although"], "ans": 2, "expl": "Hai ý trái ngược (muốn làm ca sĩ – không biết hát), có dấu “;” và “,” → however (tuy nhiên).", "no": 8, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "Mr Quang used Facebook ____________ 10 p.m. last night.", "opts": ["for", "at", "in", "on"], "ans": 1, "expl": "at + giờ cụ thể: at 10 p.m.", "no": 9, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "My grandparents live in a small village where the pace of life is slow and ____________.", "opts": ["crowded", "noisy", "peaceful", "busy"], "ans": 2, "expl": "Nhịp sống chậm ở làng quê → peaceful (yên bình). Ba từ còn lại mô tả thành phố.", "no": 10, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "After the harvest, the farmers ____________ the rice in the sun before selling it.", "opts": ["dry", "ride", "grow", "water"], "ans": 0, "expl": "dry the rice: phơi lúa (sau khi thu hoạch, trước khi bán).", "no": 11, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "I’m not good at maths, so I always feel under a lot of ____________ before maths tests.", "opts": ["pressing", "pleasure", "pressure", "press"], "ans": 2, "expl": "be/feel under pressure: chịu áp lực.", "no": 12, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "Lan is very ____________ at making paper flowers; she has made more than 100 of them.", "opts": ["fond", "good", "keen", "interested"], "ans": 1, "expl": "be good at + V-ing: giỏi làm gì. (interested in, keen on, fond of – sai giới từ.)", "no": 13, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "Student A: You look nice today.   Student B: ____________", "opts": ["I don’t think so.", "I’m fine, thank you.", "I beg your pardon.", "Do you really think so? Thanks."], "ans": 3, "expl": "Đáp lại lời khen một cách lịch sự: “Do you really think so? Thanks.”", "no": 14, "src": "Đề 3"}, {"t": "choice", "kind": "mcq", "prompt": "A lot of young families in Viet Nam prefer ____________ time doing outdoor activities together.", "opts": ["spent", "spend", "spending", "to spending"], "ans": 2, "expl": "prefer + V-ing → spending. (to spending sai.)", "no": 5, "src": "Đề 4"}, {"t": "choice", "kind": "mcq", "prompt": "The teacher told his students ____________ laughing.", "opts": ["stopping", "stopped", "stop", "to stop"], "ans": 3, "expl": "tell sb + to V: bảo ai làm gì → to stop.", "no": 6, "src": "Đề 4"}, {"t": "choice", "kind": "mcq", "prompt": "We often post many questions to discuss on a/an /* ---------- storage (per student, this browser only) ---------- */
function blank(){ return {name:'', xp:0, lessons:{}, exams:{}, miss:{}, pending:{}, runs:[], sound:true}; }

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e) {}

/* ---------- sound ---------- */
let actx = null;
function beep(ok){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime + i*0.09);
      g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.06, actx.currentTime + i*0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i*0.09 + 0.16);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + i*0.09); o.stop(actx.currentTime + i*0.09 + 0.18);
    });
  } catch(e) {}
}

function totalStats(){
  let att=0, done=0; for (const id in S.lessons){ done++; att += S.lessons[id].attempts||0; }

}

function qById(qid){ const [lid, i] = qid.split('#'); const l = LESSON[lid]; return l ? {lesson:l, q:l.qs[+i], idx:+i} : null; }

function makeItem(lid, idx, perm){
  const l = LESSON[lid]; let q = l.qs[idx];
  if (perm && q.opts) q = Object.assign({}, q, {opts: perm.map(k => q.opts[k]), ans: perm.indexOf(q.ans)});
  return {lid, idx, q, lesson:l, redo:false};
}
function startExam(n){
  const ex = DATA.exams[n];
  begin({mode:'test', examId:ex.id, title:ex.title, items: ex.items.map(it => makeItem(it.lid, it.idx, it.perm))});
}
function startLesson(lid){
  const l = LESSON[lid];
  const keepOrder = l.sec === 'read' || l.keep;
  let order = l.qs.map((_, i) => i); if (!keepOrder) order = shuffle(order);
  begin({mode:'lesson', title:l.title, lid, items: order.map(i => makeItem(lid, i))});
}
function pick(arr, n){ return shuffle(arr).slice(0, n); }
function startTest(){
  const items = [];
  const all = (pred) => DATA.lessons.filter(pred).flatMap(l => l.qs.map((_, i) => [l.id, i]));
  const add = list => list.forEach(([lid, i]) => items.push(makeItem(lid, i)));
  add(pick(all(l => l.id.startsWith('pron')), 2));
  add(pick(all(l => l.id.startsWith('stress')), 2));
  add(pick(all(l => l.id.startsWith('mcq')), 10));
  add(pick(all(l => l.id === 'sign'), 2));
  const gap = pick(['gap-1','gap-2'], 1)[0]; add(LESSON[gap].qs.map((_, i) => [gap, i]));
  const tf = pick(['tf-1','tf-2'], 1)[0]; add(LESSON[tf].qs.map((_, i) => [tf, i]));
  add(pick(all(l => l.id.startsWith('wf')), 6));
  const d = Math.floor(Math.random()*4)*2; add([['dict', d], ['dict', d+1]]);
  ['tr-1','tr-2','tr-3','tr-4'].forEach(t => add(pick(LESSON[t].qs.map((_, i) => [t, i]), 1)));
  begin({mode:'test', title:'Thi thử 40 câu', items});
}
function startReview(){
  const ids = Object.keys(S.pending).filter(qById);
  if (!ids.length){ toast('Chưa có câu sai nào để ôn'); return; }
  begin({mode:'review', title:'Ôn câu sai', items: shuffle(ids).slice(0, 20).map(id => { const [l, i] = id.split('#'); return makeItem(l, +i); })});
}
function begin(cfg){
  R = Object.assign(cfg, {pos:0, firstTotal:cfg.items.length, results:[], combo:0, bestCombo:0, t0:Date.now(), answered:false});
  renderQ();
}

/* ---------- question render ---------- */
let cur = null; // current answer state
function renderQ(){
  const it = R.items[R.pos]; const q = it.q, l = it.lesson;
  cur = {sel:null, text:'', built:[]};
  const done = R.results.length; const pct = Math.round(100 * done / R.firstTotal);
  const app = $('#app');
  let body = '';
  const PSG = q.passage || l.passage;
  if (PSG && (q.kind === 'gap' || q.kind === 'tf' || q.kind === 'tfmc')){
    const ps = PSG.map(p => '<p>' + esc(p).replace(/\((\d+)\)\s*_+/g, (m, n) => `<span class="blank ${q.blank==n?'cur':''}">(${n}) ______</span>`) + '</p>').join('');
    body += `<details class="passage" open><summary>Đoạn văn – ${esc(q.psub || l.sub)}</summary>${ps}</details>`;
  }
  if (q.img) body += `<img class="signimg" src="${q.img}" alt="Biển báo">`;
  if (q.entry){
    const e = q.entry;
    body += `<div class="entry"><b class="hw">${esc(e.word)}</b> ${esc(e.ipa)} <i>${esc(e.pos)}</i><div>${esc(e.def)}</div><ul>${e.ex.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  }
  const promptHtml = q.kind === 'trans' ? `Viết lại câu sao cho nghĩa không đổi:<br><span style="font-weight:700">${esc(q.prompt)}</span>` : esc(q.prompt).replace(/_{3,}/g, '<span class="blank">_____</span>');
  body += `<p class="prompt ${q.prompt.length>90?'small':''}">${promptHtml}${q.cue?` <span class="cue">(${esc(q.cue)})</span>`:''}</p>`;
  if (q.t === 'choice'){
    body += `<div class="opts" role="listbox">${q.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span class="t">${LET[i]}. ${q.html ? o : esc(o)}</span></button>`).join('')}</div>`;
  } else if (q.t === 'tf'){
    body += `<div class="opts tf"><button class="opt" data-i="0"><span class="t">True</span></button><button class="opt" data-i="1"><span class="t">False</span></button></div>`;
  } else if (q.t === 'type'){
    body += `<div class="typebox"><label for="ans" class="muted" style="font-weight:800;font-size:13px">${q.kind==='wf'?'VIẾT DẠNG ĐÚNG CỦA TỪ':'VIẾT CỤM 2 – 3 TỪ'}</label><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời…"></div>`;
  } else if (q.t === 'build'){
    const bank = shuffle(q.tokens.map((t, i) => ({t, id:'a'+i})).concat(q.distract.map((t, i) => ({t, id:'d'+i}))));
    cur.bank = bank;
    body += `<div class="build"><div class="line" id="line"><span class="start">→ ${esc(q.start)}</span></div><div class="tiles" id="bank">${bank.map(b => `<button class="tile" data-id="${b.id}">${esc(b.t)}</button>`).join('')}</div></div>`;
  }
  app.innerHTML = `
    <div class="lessontop"><button class="x" id="quit" aria-label="Thoát">${ICON.x}</button>
      <div class="bar" aria-label="Tiến độ"><i style="width:${pct}%"></i></div>
      <span class="combo" title="Chuỗi trả lời đúng">${R.mode==='test' ? `${done}/${R.firstTotal}` : (R.combo>=2 ? ICON.flame + R.combo : '')}</span></div>
    <div class="qkind">${q.src ? q.src + ' · ' : ''}${q.no ? 'Câu ' + q.no + ' · ' : ''}${KINDNAME[q.kind]||''}${it.redo?'<span class="redo">· Làm lại câu sai</span>':''}${R.mode!=='lesson'?` <span class="muted">· ${esc(l.title)}</span>`:''}</div>
    <div class="pop">${body}</div>`;
  $('#quit').onclick = quitConfirm;
  if (q.t === 'choice' || q.t === 'tf'){
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (R.answered) return; cur.sel = +b.dataset.i; app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b)); setCheck(true); });
  } else if (q.t === 'type'){
    const inp = $('#ans'); inp.addEventListener('input', () => { cur.text = inp.value; setCheck(inp.value.trim().length > 0); });
    setTimeout(() => inp.focus(), 50);
  } else if (q.t === 'build'){
    const line = $('#line'), bank = $('#bank');
    bank.querySelectorAll('.tile').forEach(t => t.onclick = () => {
      if (R.answered) return;
      const b = cur.bank.find(x => x.id === t.dataset.id); cur.built.push(b); t.classList.add('used');
      const nt = document.createElement('button'); nt.className = 'tile'; nt.textContent = b.t;
      nt.onclick = () => { if (R.answered) return; cur.built = cur.built.filter(x => x !== b); nt.remove(); t.classList.remove('used'); setCheck(cur.built.length > 0); };
      line.appendChild(nt); setCheck(true);
    });
  }
  showFoot('check'); setCheck(false);
  window.scrollTo(0, 0);
}
function quitConfirm(){
  const f = $('#foot'); f.className = 'foot'; f.classList.remove('hidden');
  $('#footIn').innerHTML = `<div class="fb"><h3>Thoát bài?</h3><div class="ex">Kết quả bài đang làm sẽ không được lưu.</div></div><div class="row"><button class="btn ghost" id="stay">Làm tiếp</button><button class="btn bad" id="leave">Thoát</button></div>`;
  $('#stay').onclick = () => { if (R.answered) showFeedback(R.lastOk); else { showFoot('check'); setCheck(isReady()); } };
  $('#leave').onclick = () => { R = null; home(); };
}
function isReady(){ const q = R.items[R.pos].q; return q.t==='type' ? cur.text.trim().length>0 : q.t==='build' ? cur.built.length>0 : cur.sel!=null; }

/* ---------- footer ---------- */
function hideFoot(){ $('#foot').classList.add('hidden'); }
function showFoot(kind){
  const f = $('#foot'); f.className = 'foot';
  $('#footIn').innerHTML = `<button class="btn ghost" id="skip">Bỏ qua</button><button class="btn" id="chk">Kiểm tra</button>`;
  $('#chk').onclick = check; $('#skip').onclick = () => check(true);
}
function setCheck(on){ const b = $('#chk'); if (b) b.disabled = !on; }

/* ---------- check ---------- */
function answerText(q, it){
  if (q.t === 'choice') return `${LET[q.ans]}. ${q.opts[q.ans].replace(/<\/?u>/g,'')}`;
  if (q.t === 'tf') return q.ans === 0 ? 'True' : 'False';
  if (q.t === 'type') return q.ans[0];
  if (q.t === 'build') return q.full;
}
function userText(q, skipped){
  if (skipped) return '(bỏ qua)';
  if (q.t === 'choice') return cur.sel==null ? '(bỏ qua)' : `${LET[cur.sel]}. ${q.opts[cur.sel].replace(/<\/?u>/g,'')}`;
  if (q.t === 'tf') return cur.sel===0 ? 'True' : cur.sel===1 ? 'False' : '(bỏ qua)';
  if (q.t === 'type') return cur.text.trim() || '(bỏ qua)';
  if (q.t === 'build') return cur.built.length ? q.start + ' ' + cur.built.map(b=>b.t).join(' ') : '(bỏ qua)';
}
function check(skipped){
  if (R.answered) return;
  const it = R.items[R.pos], q = it.q;
  let ok = false;
  if (skipped !== true){
    if (q.t === 'choice' || q.t === 'tf') ok = cur.sel === q.ans;
    else if (q.t === 'type') ok = q.ans.some(a => norm(a) === norm(cur.text));
    else if (q.t === 'build') ok = norm(cur.built.map(b=>b.t).join(' ')) === norm(q.tokens.join(' '));
  }
  R.answered = true; R.lastOk = ok;
  const qid = it.lid + '#' + it.idx;
  if (!it.redo){
    R.results.push({qid, ok, your:userText(q, skipped===true), kind:q.kind, q});
    if (ok){ R.combo++; R.bestCombo = Math.max(R.bestCombo, R.combo); if (R.mode!=='test') S.xp += 10; if (S.pending[qid]) delete S.pending[qid]; }
    else { R.combo = 0; S.miss[qid] = (S.miss[qid]||0) + 1; S.pending[qid] = 1; }
    save();
  } else if (ok && S.pending[qid]) { /* redo inside the same lesson does not clear pending; keeps it for later review */ }
  if (!ok && !it.redo && R.mode === 'lesson'){ R.items.push(Object.assign({}, it, {redo:true})); }
  if (R.mode === 'test'){ next(); return; }
  // mark choices
  if (q.t === 'choice' || q.t === 'tf'){
    document.querySelectorAll('.opt').forEach(b => { const i = +b.dataset.i; b.disabled = true; if (i === q.ans) b.classList.add('right'); else if (i === cur.sel) b.classList.add('wrong'); });
  }
  if (q.t === 'type'){ const inp = $('#ans'); inp.disabled = true; inp.style.borderColor = ok ? 'var(--good)' : 'var(--bad)'; }
  beep(ok);
  if (!ok){ const p = $('.pop'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }
  showFeedback(ok);
}
function showFeedback(ok){
  const it = R.items[R.pos], q = it.q;
  const f = $('#foot'); f.className = 'foot ' + (ok ? 'ok' : 'no');
  const praise = ['Tuyệt vời!', 'Chính xác!', 'Giỏi quá!', 'Đúng rồi!'][Math.floor(Math.random()*4)];
  $('#footIn').innerHTML = `<div class="fb"><h3>${ok ? ICON.check + praise : ICON.x + 'Chưa đúng'}</h3>
    ${ok ? '' : `<div class="ans">Đáp án: ${esc(answerText(q, it))}</div>`}
    <div class="ex">${q.expl}</div></div>
    <button class="btn ${ok?'good':'bad'}" id="nxt">Tiếp tục</button>`;
  $('#nxt').onclick = next; $('#nxt').focus();
}
function next(){
  R.answered = false; R.pos++;
  if (R.pos >= R.items.length) finish(); else renderQ();
}

/* ================= RESULTS ================= */
function finish(){
  hideFoot();
  const res = R.results, n = res.length, c = res.filter(r => r.ok).length;
  const pct = n ? Math.round(100*c/n) : 0;
  const score = R.mode === 'test' ? (c*0.25) : (10*c/n);
  const secs = Math.round((Date.now()-R.t0)/1000);
  const bonus = R.mode === 'test' ? c*10 : 20; S.xp += bonus;
  if (R.mode === 'lesson'){
    const st = S.lessons[R.lid] || {best:0, attempts:0};
    st.attempts++; st.best = Math.max(st.best, pct); st.last = pct; st.wrong = n - c; S.lessons[R.lid] = st;
  }
  if (R.examId){ const ex = S.exams[R.examId] || {best:0, attempts:0}; ex.attempts++; ex.best = Math.max(ex.best, score); ex.last = score; S.exams[R.examId] = ex; }
  S.runs.unshift({t:Date.now(), title:R.title, mode:R.mode, c, n, score:+score.toFixed(2)}); S.runs = S.runs.slice(0, 30);
  save();
  // per-kind bars
  const byK = {}; res.forEach(r => { const k = KINDNAME[r.kind]; byK[k] = byK[k] || {c:0, n:0}; byK[k].n++; if (r.ok) byK[k].c++; });
  const wrong = res.filter(r => !r.ok);
  const showAll = R.mode === 'test';
  const list = showAll ? res : wrong;
  const app = $('#app');
  app.innerHTML = `
    <div class="top"><div class="brand"><h1>${esc(R.title)}</h1><small>${esc(S.name || 'Học sinh')} · ${new Date().toLocaleString('vi-VN')}</small></div></div>
    <div class="panel" style="text-align:center">
      <div class="muted" style="font-weight:800;letter-spacing:.08em;font-size:13px">ĐIỂM (THANG 10)</div>
      <div class="big">${score.toFixed(R.mode==='test'?2:1).replace('.', ',')}</div>
      <div style="font-weight:800;margin-top:4px">${pct>=80?'Rất tốt! Giữ phong độ nhé.':pct>=50?'Khá ổn, ôn lại các câu sai bên dưới.':'Cần ôn thêm – đọc kĩ giải thích từng câu.'}</div>
    </div>
    <div class="score">
      <div class="tile-stat"><b style="color:var(--good)">${c}</b><span>Câu đúng</span></div>
      <div class="tile-stat"><b style="color:var(--bad)">${n-c}</b><span>Câu sai</span></div>
      <div class="tile-stat"><b>${pct}%</b><span>Chính xác</span></div>
      <div class="tile-stat"><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>Thời gian</span></div>
      <div class="tile-stat"><b style="color:var(--sun-d)">+${bonus + (R.mode==='test'?0:c*10)}</b><span>XP</span></div>
    </div>
    <h2 style="font-size:20px;margin-top:8px">Kết quả theo dạng bài</h2>
    <div class="kbars">${Object.entries(byK).map(([k,v]) => `<div class="kb"><span>${k}</span><span class="tr"><i style="width:${100*v.c/v.n}%"></i></span><span class="n">${v.c}/${v.n}</span></div>`).join('')}</div>
    <div class="row" style="margin-bottom:18px">
      ${wrong.length ? `<button class="btn bad" id="again">Luyện lại ${wrong.length} câu sai</button>` : ''}
      ${R.mode==='lesson' ? `<button class="btn ghost" id="redoL">Làm lại bài</button>` : ''}
      <button class="btn ghost" id="copy">Sao chép kết quả</button>
      <button class="btn" id="homeB">Về lộ trình</button>
    </div>
    <h2 style="font-size:20px">${showAll ? 'Đáp án và giải thích' : (wrong.length ? 'Các câu làm sai' : 'Không sai câu nào!')}</h2>
    <div class="review" style="margin-top:10px">${list.map((r, i) => {
      const x0 = qById(r.qid); const q = r.q || x0.q, lesson = x0.lesson;
      const qtext = q.kind==='trans' ? q.prompt + ' → ' + q.start + ' …' : q.kind==='gap' ? `(${q.blank}) ` + q.opts.map((o,j)=>LET[j]+'. '+o).join('  ') : q.prompt + (q.cue?` (${q.cue})`:'') + (q.opts && q.kind!=='gap' ? ' — ' + q.opts.map((o,j)=>LET[j]+'. '+o.replace(/<\/?u>/g,'')).join('  ') : '');
      return `<div class="rv ${r.ok?'okrv':''}"><div class="muted" style="font-size:12px;font-weight:800">${i+1}. ${esc(lesson.title)} · ${KINDNAME[q.kind]}</div>
        <div class="q">${esc(qtext)}</div>
        ${r.ok ? `<div class="cor">✓ ${esc(r.your)}</div>` : `<div class="your">Em chọn: ${esc(r.your)}</div><div class="cor">Đáp án: ${esc(answerText(q))}</div>`}
        <div class="ex">${q.expl}</div></div>`; }).join('')}</div>`;
  const wrongIds = wrong.map(r => r.qid);
  const lid = R.lid, mode = R.mode;
  if ($('#again')) $('#again').onclick = () => begin({mode:'review', title:'Luyện lại câu sai', items: shuffle(wrongIds).map(id => { const [l, i] = id.split('#'); return makeItem(l, +i); })});
  if ($('#redoL')) $('#redoL').onclick = () => startLesson(lid);
  $('#homeB').onclick = home;
  $('#copy').onclick = () => {
    const txt = `${S.name || 'Học sinh'} – ${R.title}\nĐiểm: ${score.toFixed(2)}/10 – Đúng ${c}/${n} (${pct}%)\nCâu sai: ${wrong.length ? wrong.map(r => { const x = qById(r.qid); return x.lesson.title + ' câu ' + (x.idx+1); }).join('; ') : 'không có'}`;
    const ok = () => toast('Đã sao chép kết quả');
    try { navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt)); } catch(e) { fallbackCopy(txt); }
  };
  window.scrollTo(0, 0);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.width = '100%'; ta.rows = 4;
  $('#app').insertBefore(ta, $('#app').children[1]); ta.select(); toast('Bôi đen sẵn – nhấn Ctrl+C để sao chép');
}

    </tbody></table></div>

    <div class="tw"><table class="st"><thead><tr><th>Thời gian</th><th>Bài</th><th class="n">Đúng</th><th class="n">Điểm</th></tr></thead><tbody>
    ${S.runs.length ? S.runs.map(r => `<tr><td>${new Date(r.t).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(r.title)}</td><td class="n">${r.c}/${r.n}</td><td class="n">${String(r.score).replace('.',',')}</td></tr>`).join('') : '<tr><td colspan="4" class="muted">Chưa có lượt làm bài.</td></tr>'}

    <div id="resetZone" style="margin-top:22px"><button class="btn ghost" id="reset">Xoá toàn bộ tiến độ</button></div>`;
  $('#back').onclick = home;
  $('#reset').onclick = () => {
    $('#resetZone').innerHTML = `<div class="panel" style="border-color:var(--bad)"><b>Xoá XP, điểm và thống kê câu sai trên trình duyệt này?</b><div class="row" style="margin-top:10px"><button class="btn ghost" id="no">Huỷ</button><button class="btn bad" id="yes">Xoá</button></div></div>`;
    $('#no').onclick = statsView;
    $('#yes').onclick = () => { const nm = S.name; S = blank(); S.name = nm; save(); toast('Đã xoá tiến độ'); statsView(); };
  };
  window.scrollTo(0, 0);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!R || $('#foot').classList.contains('hidden')) return;
  const q = R.items[R.pos] && R.items[R.pos].q; if (!q) return;
  if (e.key === 'Enter'){
    e.preventDefault();
    const nx = $('#nxt'), ck = $('#chk');
    if (nx) nx.click(); else if (ck && !ck.disabled) ck.click();
    return;
  }
  if (!R.answered && (q.t === 'choice' || q.t === 'tf') && /^[1-4]$/.test(e.key)){
    const b = document.querySelector(`.opt[data-i="${+e.key-1}"]`); if (b) b.click();
  }
});

home();
</script>
