{"part":"A CLOSER LOOK 2 · Grammar: Yes/No & Wh-questions; Countable/Uncountable nouns","roman":"AL2.1","navLabel":"AL2 Ex1","title":"Ex 1. Change the sentences into Yes/No questions","icon":"scale-balanced","instructions":"","type":"mcq","instant":true,
 "ruleBox":"<b>📌 Remember!</b><br><b>Yes/No questions</b> (câu hỏi Có/Không): đảo trợ động từ (do/does/did/will...) hoặc động từ \"to be\" lên trước chủ ngữ. Trả lời bằng Yes hoặc No.<br>Ví dụ: <i>Mua sap is a popular folk dance of the Thai people.</i> → <i>Is mua sap a popular folk dance of the Thai people?</i><br><br><b>Wh-questions</b>: Wh-word (What/Who/Where/When/Why/Which/How) + trợ động từ + S + V?<br>Ví dụ: <i>Where can we find the most beautiful terraced fields?</i> — In Mu Cang Chai.",
 "questions":[
  {"q":"1. Women play an important role in a Jrai family.","qvi":"Phụ nữ đóng vai trò quan trọng trong một gia đình người Jrai.","options":["Do women play an important role in a Jrai family?","Does women play an important role in a Jrai family?","Are women play an important role in a Jrai family?"],"answer":0,"explanation":"Chủ ngữ số nhiều \"women\", thì hiện tại đơn → dùng \"Do\".","vi":"Câu gốc: Phụ nữ đóng vai trò quan trọng trong gia đình người Jrai. — Câu hỏi đúng: Phụ nữ có đóng vai trò quan trọng trong gia đình người Jrai không?"},
  {"q":"2. Mua sap is a popular folk dance of the Thai people.","qvi":"Múa sạp là một điệu múa dân gian phổ biến của người Thái.","options":["Does mua sap is a popular folk dance of the Thai people?","Is mua sap a popular folk dance of the Thai people?","Is mua sap popular folk dance of the Thai people?"],"answer":1,"explanation":"Câu gốc dùng động từ \"to be\" (is) → đảo \"is\" lên trước chủ ngữ.","vi":"Câu gốc: Múa sạp là một điệu múa dân gian phổ biến của người Thái. — Câu hỏi đúng: Múa sạp có phải là một điệu múa dân gian phổ biến của người Thái không?"},
  {"q":"3. We didn't have boarding schools for minority students in 1950.","qvi":"Chúng tôi đã không có trường nội trú cho học sinh dân tộc thiểu số vào năm 1950.","options":["Did we have boarding schools for minority students in 1950?","Do we have boarding schools for minority students in 1950?","Have we boarding schools for minority students in 1950?"],"answer":0,"explanation":"Thì quá khứ đơn → dùng \"Did\" + động từ nguyên thể.","vi":"Câu gốc: Chúng ta đã không có trường nội trú cho học sinh dân tộc thiểu số vào năm 1950. — Câu hỏi đúng: Chúng ta đã có trường nội trú cho học sinh dân tộc thiểu số vào năm 1950 không?"},

  {"q":"5. We will watch a documentary about the Khmer.","qvi":"Chúng tôi sẽ xem một bộ phim tài liệu về người Khmer.","options":["Will we watch a documentary about the Khmer?","Do we will watch a documentary about the Khmer?","Are we watch a documentary about the Khmer?"],"answer":0,"explanation":"Thì tương lai đơn dùng \"will\" → đảo \"will\" lên trước chủ ngữ.","vi":"Câu gốc: Chúng ta sẽ xem một bộ phim tài liệu về người Khmer. — Câu hỏi đúng: Chúng ta sẽ xem một bộ phim tài liệu về người Khmer phải không?"}
 ]},
{"part":"A CLOSER LOOK 2 · Grammar: Yes/No & Wh-questions; Countable/Uncountable nouns","roman":"AL2.2","navLabel":"AL2 Ex2","title":"Ex 2. Choose the correct question word and its answer","icon":"circle-question","instructions":"Chọn từ để hỏi (Wh-word) phù hợp và câu trả lời tương ứng.","type":"mcq","instant":true,

{"part":"A CLOSER LOOK 2 · Grammar: Yes/No & Wh-questions; Countable/Uncountable nouns","roman":"AL2.3","navLabel":"AL2 Ex3","title":"Ex 3. Read the passage and classify the underlined nouns as C (Countable) or U (Uncountable)","icon":"scale-balanced","instructions":"Đọc đoạn văn: \"Some minority groups are farmers. They do not have much land and they use simple farming techniques to grow crops...\" rồi phân loại các danh từ dưới đây.","type":"mcq","instant":true,
 "ruleBox":"<b>📌 Remember!</b><br><b>Danh từ đếm được (Countable nouns)</b>: có dạng số ít và số nhiều (thêm -s/-es), dùng với a/an (số ít) hoặc many/a few/số đếm (số nhiều).<br>Ví dụ: <i>many ethnic groups</i>, <i>a few villages</i>.<br><br><b>Danh từ không đếm được (Uncountable nouns)</b>: không có dạng số nhiều (không thêm -s), dùng với much/a little.<br>Ví dụ: <i>much rice</i>, <i>a little land</i>.<br><br>Ví dụ trong câu: <i>There are many ethnic groups living in the mountains.</i> (nhiều dân tộc); <i>Farmers there don't have much land for growing rice.</i> (không nhiều đất); <i>We need a little more rice for the harvest festival.</i> (một chút gạo).",
 "questions":[

  {"q":"3. techniques","qvi":"techniques (trong đoạn văn: các kỹ thuật canh tác đơn giản) — kỹ thuật.","options":["C","U"],"answer":0,"explanation":"techniques (các kỹ thuật) — đếm được.","vi":"techniques = các kỹ thuật (danh từ đếm được)."},
  {"q":"4. trees","qvi":"trees (trong đoạn văn: các cây trồng) — cây.","options":["C","U"],"answer":0,"explanation":"trees (các cây) — đếm được.","vi":"trees = các cây (danh từ đếm được)."},
  {"q":"5. ash","qvi":"ash (trong đoạn văn: tro dùng để bón đất) — tro.","options":["C","U"],"answer":1,"explanation":"ash (tro) — không đếm được.","vi":"ash = tro (danh từ không đếm được)."},

 ]},

const completedTasks = new Set();

const TOTAL_TASKS = DATA.sections.length;

function normalize(str){
  return (str||'').trim().toLowerCase()
    .replace(/['']/g,"'")
    .replace(/["""]/g,'')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ');
}
function widthFor(ref){ const l=(ref||'').length; return l<7?'w-24':l<16?'w-40':'w-full'; }

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)){ alert('Trình duyệt của bạn không hỗ trợ phát âm tự động. Hãy thử Chrome, Edge hoặc Safari.'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>btn.classList.remove('speaking'); u.onerror=()=>btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function buildNav(){
  const nav=document.getElementById('navWrap');
  let lastPart=null; let html='';
  DATA.sections.forEach((s,i)=>{
    if(s.part!==lastPart){
      if(lastPart!==null) html += `<div class="navgroup-sep"></div>`;
      lastPart=s.part;
    }
    html += `<button class="tab-btn text-sm font-bold px-3 py-2 rounded-full text-slate-600${i===0?' active':''}" id="navbtn_${i}" onclick="showTab(${i})" title="${s.part||''}">${s.roman}</button>`;
  });
  nav.innerHTML = html;
  document.getElementById('progressText').textContent = `0 / ${TOTAL_TASKS} phần`;
}

function optionLetter(i){ return ['A','B','C','D','E','F'][i]; }

function isCorrectAnswer(q, chosen){
  if(chosen===-1 || chosen===undefined || chosen===null) return false;
  if(Array.isArray(q.answer)) return q.answer.includes(chosen);
  return chosen === q.answer;
}
function correctAnswerLabel(q){
  if(Array.isArray(q.answer)) return q.answer.map(a=>`${optionLetter(a)}. ${q.options[a]}`).join(' hoặc ');
  return `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
}
function markOptions(idx,i,q,chosen){
  q.options.forEach((o,j)=>{
    const el=document.getElementById(`opt_${idx}_${i}_${j}`);
    if(!el) return;
    el.classList.remove('correct-opt','wrong-opt');
    const isCorrectOpt = Array.isArray(q.answer) ? q.answer.includes(j) : j===q.answer;
    if(isCorrectOpt) el.classList.add('correct-opt');
    else if(j===chosen) el.classList.add('wrong-opt');
  });
}

function renderPassage(p, idx){
  if(!p) return '';
  const viBlock = p.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-violet-200 text-violet-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-violet-200 italic text-slate-500">${p.vi}</p>` : '';
  return `<div class="passage-box mb-4"><p class="font-extrabold text-violet-900 mb-2"><i class="fa-solid fa-book mr-1"></i>${p.title||''}</p><p id="passage_en_${idx}">${p.html}</p>${viBlock}</div>`;
}
function renderDict(d, idx){
  if(!d) return '';
  const viBlock = d.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-amber-300 text-amber-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-amber-300 text-slate-600">${d.vi}</p>` : '';
  return `<div class="dict-box mb-4"><p class="font-extrabold text-amber-800 mb-1"><i class="fa-solid fa-book-bookmark mr-1"></i>${d.word} <span class="font-normal italic">${d.ipa||''}</span> <span class="font-normal">${d.pos?('('+d.pos+')'):''}</span></p>${d.senses.map(x=>`<p class="mb-1">✱ ${x.def}</p>${(x.examples||[]).map(e=>`<p class="ml-4 italic text-slate-600">• ${e}</p>`).join('')}`).join('')}${viBlock}</div>`;
}
function renderRuleBox(rb){
  if(!rb) return '';
  return `<div class="rule-box mb-4"><i class="fa-solid fa-lightbulb mr-1 text-blue-500"></i>${rb}</div>`;
}

function renderSection(s, idx){
  let inner = `<p class="part-label">${s.part||''}</p>`;
  inner += `<h2 class="text-xl md:text-2xl font-extrabold text-violet-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'circle-check'} text-pink-500"></i> ${s.roman}. ${s.title}</h2>`;
  if(s.instructions) inner += `<p class="text-sm text-slate-500 mb-3 italic">${s.instructions}</p>`;
  inner += renderRuleBox(s.ruleBox);
  inner += renderPassage(s.passage, idx);
  inner += renderDict(s.dict, idx);

  inner += `<div class="space-y-4">`;
  s.questions.forEach((q,i)=>{
    inner += `<div class="task-card bg-white rounded-2xl shadow-md p-4" id="qblock_${idx}_${i}">`;
    if(q.image) inner += `<div class="mb-3">${q.image}</div>`;
    inner += `<p class="font-bold text-slate-800 mb-2 whitespace-pre-line"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${q.q}</p>`;
    if(q.qvi) inner += `<p class="text-xs text-slate-400 italic mb-2">${q.qvi}</p>`;
    if(s.type==='mcq'){
      inner += `<div class="grid sm:grid-cols-2 gap-2">`;
      q.options.forEach((opt,j)=>{
        const ipa = q.ipas ? q.ipas[j] : null;
        const optVi = q.vis ? q.vis[j] : null;
        const cleanWord = opt.replace(/<[^>]+>/g,'');
        const wordBlock = (ipa || optVi)
          ? `<span class="flex flex-col leading-tight"><span>${opt}</span>${ipa?`<span class="text-[10px] text-slate-400 font-normal mcq-detail-hidden">${ipa}</span>`:''}${optVi?`<span class="text-[10px] text-emerald-500 font-normal italic mcq-detail-hidden">${optVi}</span>`:''}</span>
             <button type="button" data-w="${cleanWord}" onclick="event.stopPropagation();event.preventDefault();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-violet-100 text-violet-700 hover:bg-violet-200 hover:scale-110 transition flex items-center justify-center ml-auto shrink-0 mcq-detail-hidden" title="Nghe phát âm" aria-label="Nghe phát âm ${cleanWord}"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`
          : `<span>${opt}</span>`;
        inner += `<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="opt_${idx}_${i}_${j}" onclick="selectMcq(${idx},${i},${j})">
          <input type="radio" name="mcq_${idx}_${i}" class="accent-violet-700" style="display:none">
          <span class="font-black text-violet-700">${optionLetter(j)}.</span> ${wordBlock}
        </label>`;
      });
      inner += `</div>`;
    } else if(s.type==='fill'){
      const w = widthFor(q.answer);
      const famBlock = q.family ? `<div class="wordfam-box mt-2">${q.family.map(f=>`<div>• ${f}</div>`).join('')}</div>` : '';
      inner += `<div class="flex items-center gap-2 flex-wrap">`;
      if(q.hint) inner += `<span class="blank-tag text-xs">${q.hint}</span>`;
      inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input ${w} px-3 py-1.5 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false"></div>${famBlock}`;
    } else if(s.type==='sentence'){
      const instantAttr = s.instant ? ` oninput="gradeOneSentence(${idx},${i})"` : '';
      if(q.starter){
        inner += `<div class="flex items-center gap-3 w-full flex-wrap">
          <span class="text-slate-800 font-extrabold text-base whitespace-nowrap">${q.starter}</span>
          <input type="text" id="inp_${idx}_${i}" class="answer-input flex-1 min-w-[180px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false"${instantAttr}>
        </div>`;
      } else {
        inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Viết câu trả lời..." autocomplete="off" spellcheck="false"${instantAttr}>`;
      }
    } else if(s.type==='essay'){
      const starterBlock = q.starter ? `<p class="text-slate-800 font-extrabold text-sm mb-2">${q.starter} ...</p>` : '';
      inner += `${starterBlock}<textarea id="inp_${idx}_${i}" rows="6" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Viết câu trả lời của em vào đây..."></textarea>`;
    }
    inner += `<div class="explanation-box mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm text-blue-800" id="fb_${idx}_${i}"></div>`;
    inner += `</div>`;
  });
  inner += `</div>`;

  inner += `<div class="flex flex-wrap gap-2 mt-5">
    <button onclick="checkSection(${idx})" class="bg-gradient-to-r from-violet-900 to-pink-600 text-white font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>
    <button onclick="revealSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-eye mr-1"></i>Xem đáp án</button>
    <button onclick="resetSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-rotate-left mr-1"></i>Làm lại</button>
    <span id="score_${idx}" class="hidden ml-auto self-center font-extrabold text-emerald-600 text-sm score-badge"></span>
  </div>`;

  return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">${inner}</section>`;
}

function buildMain(){
  const main=document.getElementById('mainWrap');
  main.innerHTML = DATA.sections.map((s,i)=>renderSection(s,i)).join('');
}

function togglePassageVI(idx){ const el=document.getElementById(`passage_vi_${idx}`); if(el) el.classList.toggle('vi-hidden'); }
function selectMcq(idx,i,j){
  document.querySelectorAll(`[id^="opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${idx}_${i}_${j}`).classList.add('selected');
  document.getElementById(`opt_${idx}_${i}_${j}`).dataset.chosen = j;
  if(DATA.sections[idx].instant){ gradeOneMcq(idx,i); }
}

function gradeOneMcq(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const qblock=document.getElementById(`qblock_${idx}_${i}`);
  if(qblock) qblock.classList.add('show-mcq-detail');
  const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
  const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
  const ok = isCorrectAnswer(q, chosen);
  markOptions(idx,i,q,chosen);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, correctAnswerLabel(q), q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function gradeOneSentence(idx,i){
  const q=DATA.sections[idx].questions[i];
  const inp=document.getElementById(`inp_${idx}_${i}`);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(!inp || !fb) return;
  const raw=inp.value.trim();
  if(raw===''){
    inp.classList.remove('correct-input','wrong-input');
    fb.classList.remove('show'); fb.innerHTML='';
    return;
  }
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function feedbackHTML(ok, answerLabel, explanation, vi, note){
  const okLine = ok? `<span class="text-emerald-700 font-bold">✅ Chính xác!</span>` : `<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án đúng: <b>${answerLabel}</b>`;
  const expLine = explanation? `<br><span class="text-blue-700">💡 ${explanation}</span>` : '';
  const viLine = vi? `<span class="text-slate-500">📖 Nghĩa: <i>${vi}</i></span>` : '';
  const noteLine = note? `<br><span class="text-violet-600">📐 Công thức: <b>${note}</b></span>` : '';
  if(note){
    return (viLine?viLine+'<br>':'') + okLine + expLine + noteLine;
  }
  return okLine + expLine + (viLine?'<br>'+viLine:'') + noteLine;
}

function checkSection(idx){
  const s=DATA.sections[idx];
  let correct=0;
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='essay'){
      const ta=document.getElementById(`inp_${idx}_${i}`);
      fb.innerHTML = `<span class="text-green-700 font-bold">✍️ Cảm ơn em đã hoàn thành bài viết!</span><br><span class="text-blue-700">💡 Đoạn văn / câu trả lời gợi ý:</span><br><span class="text-slate-600 italic whitespace-pre-line">${q.sample}</span>`;
      fb.classList.add('show');
      correct++;
      return;
    }
    let ok=false, answerLabel='';
    if(s.type==='mcq'){
      const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
      const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
      ok = isCorrectAnswer(q, chosen);
      answerLabel = correctAnswerLabel(q);
      markOptions(idx,i,q,chosen);
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      const val=normalize(inp.value);
      const acc=(q.accepted||[q.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.classList.remove('correct-input','wrong-input');
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = q.answer;
    }
    if(ok) correct++;
    fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
    fb.classList.add('show');
  });
  const total=s.questions.length;
  scores[idx]={correct,total};
  const scoreEl=document.getElementById(`score_${idx}`);
  scoreEl.textContent = `🏆 Điểm: ${correct}/${total}`;
  scoreEl.classList.remove('hidden');
  completedTasks.add(idx);
  updateProgress();
  if(completedTasks.size===TOTAL_TASKS) setTimeout(showCompletion,500);
}

function revealSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='essay'){
      fb.innerHTML = `👁️ Câu trả lời gợi ý:<br><span class="text-slate-600 italic whitespace-pre-line">${q.sample}</span>`;
      fb.classList.add('show');
      return;
    }
    let answerLabel = s.type==='mcq' ? correctAnswerLabel(q) : q.answer;
    if(s.type==='mcq'){
      markOptions(idx,i,q,-1);
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    }
    fb.innerHTML = `👁️ Đáp án: <b>${answerLabel}</b>` + (q.explanation?`<br><span class="text-blue-700">💡 ${q.explanation}</span>`:'') + (q.vi?`<br><span class="text-slate-500">📖 Nghĩa: <i>${q.vi}</i></span>`:'') + (q.note?`<br><span class="text-violet-600">📐 Công thức: <b>${q.note}</b></span>`:'');
    fb.classList.add('show');
  });
}

function resetSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt','selected');
        delete el.dataset.chosen;
      });
    } else if(s.type==='essay'){
      const ta=document.getElementById(`inp_${idx}_${i}`);
      if(ta){ ta.value=''; }
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    }
    const qblock=document.getElementById(`qblock_${idx}_${i}`);
    if(qblock) qblock.classList.remove('show-mcq-detail');
    const fb=document.getElementById(`fb_${idx}_${i}`);
    fb.classList.remove('show'); fb.innerHTML='';
  });
  const scoreEl=document.getElementById(`score_${idx}`); scoreEl.classList.add('hidden');
  completedTasks.delete(idx); delete scores[idx]; updateProgress();
}

function showTab(idx){
  document.querySelectorAll('.section-page').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-slate-600');});
  document.getElementById(`tab-${idx}`).classList.add('active');
  const btn=document.getElementById(`navbtn_${idx}`);
  btn.classList.add('active'); btn.classList.remove('text-slate-600');
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=completedTasks.size;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TASKS} phần`;
  document.getElementById('progressBar').style.width = `${(done/TOTAL_TASKS)*100}%`;
}

function showCompletion(){
  fireConfetti();
  const banner=document.getElementById('completionBanner');
  banner.classList.remove('hidden'); banner.classList.add('show');
  let c=0,t=0; Object.values(scores).forEach(s=>{c+=s.correct; t+=s.total;});
  document.getElementById('finalScoreDisplay').textContent = `🎯 ${c} / ${t} câu đúng`;
}
function closeBanner(){ const b=document.getElementById('completionBanner'); b.classList.remove('show'); b.classList.add('hidden'); }
function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); wrap.innerHTML='';
  const colors=['#4c1d95','#7c3aed','#db2777','#ec4899','#f59e0b','#22c55e'];
  for(let i=0;i<90;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

buildNav();
buildMain();
updateProgress();
</script>
</body>
</html>
