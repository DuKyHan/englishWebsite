  {"q":"4. She is not feeling very well this week because of all the ___________ from her schoolwork.","answer":"pressure","vi":"Đáp án: pressure = áp lực. Cả câu: Tuần này cô ấy cảm thấy không được khỏe lắm vì tất cả áp lực từ bài vở."},
  {"q":"5. The coach of our ___________ tells us to drink plenty of water during our practice sessions.","answer":"sports club","accepted":["sports club"],"vi":"Đáp án: sports club = câu lạc bộ thể thao. Cả câu: Huấn luyện viên của câu lạc bộ thể thao chúng tôi bảo chúng tôi uống nhiều nước trong các buổi tập."}
 ]},
{"part":"GETTING STARTED · It's great to see you again!","roman":"GS.5","navLabel":"GS Ex5","title":"Ex 5. Work in pairs. Ask and answer the questions below","icon":"comment-dots","instructions":"Hỏi - đáp với bạn cùng cặp, sau đó viết lại câu trả lời của em vào ô bên dưới (bài nói cá nhân, không có đáp án cố định).","type":"essay",

{"part":"A CLOSER LOOK 2 · Grammar: Simple & Compound Sentences","roman":"AL2.1","navLabel":"AL2 Ex1","title":"Ex 1. Tick the simple sentences","icon":"scale-balanced","instructions":"","type":"mcq","instant":true,
 "ruleBox":"<b>📌 Remember!</b><br>Một <b>câu đơn (simple sentence)</b> chỉ có 1 mệnh đề độc lập.<br>Ví dụ: <i>Minh has some problems with his schoolwork.</i><br><br>Một <b>câu ghép (compound sentence)</b> có 2 mệnh đề độc lập trở lên, nối với nhau bằng:<br>– <b>liên từ kết hợp</b> (coordinating conjunction): <b>for, and, nor, but, or, yet, so</b>.<br>Ví dụ: <i>Mai bought many books, but she likes chess more.</i><br>– <b>trạng từ liên kết</b> (conjunctive adverb): <b>however, therefore, otherwise</b> (thường đứng sau dấu \";\" và trước dấu \",\").<br>Ví dụ: <i>Mark is hard-working; therefore, he usually gets high scores on exams.</i>",
 "questions":[
  {"q":"1. We work together on different projects.","options":["Là câu đơn (Simple)","Không phải câu đơn"],"answer":0,"explanation":"Câu chỉ có 1 mệnh đề (1 chủ ngữ, 1 động từ chính) → câu đơn.","vi":"Chúng tôi cùng nhau làm việc trên các dự án khác nhau."},
  {"q":"2. Teens need good friends and tolerant teachers at schools.","options":["Là câu đơn (Simple)","Không phải câu đơn"],"answer":0,"explanation":"\"and\" ở đây nối 2 danh từ (good friends / tolerant teachers), không nối 2 mệnh đề → vẫn là câu đơn.","vi":"Thanh thiếu niên cần những người bạn tốt và giáo viên khoan dung ở trường."},
  {"q":"3. She plays chess very well, and she won the first prize last year.","options":["Là câu đơn (Simple)","Không phải câu đơn"],"answer":1,"explanation":"Có 2 mệnh đề độc lập nối bằng \"and\" → đây là câu ghép, không phải câu đơn.","vi":"Cô ấy chơi cờ vua rất giỏi, và cô ấy đã đoạt giải nhất năm ngoái."},
  {"q":"4. Sports activities at school help me relax.","options":["Là câu đơn (Simple)","Không phải câu đơn"],"answer":0,"explanation":"Chỉ có 1 mệnh đề → câu đơn.","vi":"Các hoạt động thể thao ở trường giúp tôi thư giãn."},
  {"q":"5. Teens should learn teamwork, and they should also have communication skills.","options":["Là câu đơn (Simple)","Không phải câu đơn"],"answer":1,"explanation":"Có 2 mệnh đề độc lập nối bằng \"and\" → đây là câu ghép, không phải câu đơn.","vi":"Thanh thiếu niên nên học kỹ năng làm việc nhóm, và họ cũng nên có kỹ năng giao tiếp."}
 ]},
{"part":"A CLOSER LOOK 2 · Grammar: Simple & Compound Sentences","roman":"AL2.2","navLabel":"AL2 Ex2","title":"Ex 2. Write S for simple sentences and C for compound sentences","icon":"scale-balanced","instructions":"Viết S (câu đơn) hoặc C (câu ghép) cho mỗi câu.","type":"mcq","instant":true,
 "ruleBox":"<b>📌 Nhắc lại công thức:</b><br><b>Câu đơn (S – Simple sentence)</b> = chỉ có 1 mệnh đề độc lập (1 chủ ngữ + 1 cụm động từ chính), dù có thể có \"and/or\" nối 2 danh từ/tính từ/động từ với nhau.<br><b>Câu ghép (C – Compound sentence)</b> = 2 mệnh đề độc lập trở lên, nối bằng: <b>for, and, nor, but, or, yet, so</b> (có dấu phẩy trước) hoặc <b>however, therefore, otherwise</b> (có dấu \";\" trước và dấu \",\" sau).<br>💡 Mẹo: che phần sau liên từ lại — nếu phần còn lại vẫn có đủ chủ ngữ + động từ và có nghĩa trọn vẹn, đó là 2 mệnh đề độc lập → câu ghép.",
 "questions":[
  {"q":"1. Teenagers are often very active and talkative.","options":["S","C"],"answer":0,"explanation":"\"and\" nối 2 tính từ (active / talkative), không nối 2 mệnh đề → câu đơn (S).","vi":"Thanh thiếu niên thường rất năng động và hoạt ngôn."},
  {"q":"2. He often chats with his friends on Facebook Messenger.","options":["S","C"],"answer":0,"explanation":"Chỉ có 1 mệnh đề (1 chủ ngữ \"He\", 1 động từ chính \"chats\") → câu đơn (S).","vi":"Cậu ấy thường trò chuyện với bạn bè qua Facebook Messenger."},
  {"q":"3. She is a smart student, and she is an active member of our club.","options":["S","C"],"answer":1,"explanation":"Có 2 mệnh đề độc lập nối bằng \"and\" → câu ghép (C).","vi":"Cô ấy là học sinh giỏi, và cô ấy là thành viên tích cực của câu lạc bộ chúng tôi."},
  {"q":"4. My friends and I joined a sports competition last year.","options":["S","C"],"answer":0,"explanation":"\"and\" nối 2 chủ ngữ (My friends / I), chỉ có 1 mệnh đề → câu đơn (S).","vi":"Bạn bè tôi và tôi đã tham gia một cuộc thi thể thao năm ngoái."},
  {"q":"5. He is a club member, but he never participates in any of the activities.","options":["S","C"],"answer":1,"explanation":"Có 2 mệnh đề độc lập nối bằng \"but\" → câu ghép (C).","vi":"Cậu ấy là thành viên câu lạc bộ, nhưng cậu ấy không bao giờ tham gia bất kỳ hoạt động nào."}
 ]},
{"part":"A CLOSER LOOK 2 · Grammar: Simple & Compound Sentences","roman":"AL2.3","navLabel":"AL2 Ex3","title":"Ex 3. Choose the correct answer A, B, or C","icon":"circle-check","instructions":"Chọn liên từ hoặc trạng từ liên kết phù hợp.","type":"mcq","instant":true,
 "ruleBox":"<b>📌 Bảng ý nghĩa các từ nối câu ghép:</b><br><b>and</b> = và (bổ sung ý) · <b>but</b> = nhưng (tương phản) · <b>or</b> = hoặc (lựa chọn) · <b>so</b> = nên (kết quả) · <b>for</b> = bởi vì (lý do, khá trang trọng, đứng đầu vế giải thích) · <b>yet</b> = nhưng mà (tương phản, nhấn mạnh hơn \"but\") · <b>nor</b> = cũng không (dùng sau ý phủ định).<br><b>however</b> = tuy nhiên (tương phản) · <b>therefore</b> = vì vậy (kết quả) · <b>otherwise</b> = nếu không thì (hậu quả nếu KHÔNG làm theo vế trước).<br>Công thức: <i>Mệnh đề 1, + and/but/or/so/for/yet/nor + mệnh đề 2.</i> &nbsp;|&nbsp; <i>Mệnh đề 1; + however/therefore/otherwise, + mệnh đề 2.</i>",
 "questions":[
  {"q":"1. Parents should give teens some freedom, ___________ they should also set limits.","options":["for","so","but"],"answer":2,"explanation":"\"but\" thể hiện sự tương phản: cho tự do NHƯNG cũng cần đặt giới hạn.","vi":"Bố mẹ nên cho thanh thiếu niên một chút tự do, nhưng họ cũng nên đặt ra giới hạn."},
  {"q":"2. We don't cheat on exams, ___________ it is a wrong thing to do.","options":["or","for","and"],"answer":1,"explanation":"\"for\" ở đây mang nghĩa \"bởi vì\" (lý do).","vi":"Chúng tôi không gian lận trong thi cử, bởi vì đó là một việc làm sai trái."},
  {"q":"3. Lan wanted to join the school music club; ___________ she can't sing or play any instruments.","options":["however","otherwise","therefore"],"answer":0,"explanation":"\"however\" thể hiện sự tương phản: muốn tham gia NHƯNG lại không biết hát/chơi nhạc cụ.","vi":"Lan muốn tham gia câu lạc bộ âm nhạc của trường; tuy nhiên, cô ấy không biết hát hay chơi nhạc cụ nào."},
  {"q":"4. Schoolwork causes teens a lot of pressure; ___________ they also feel pressure from their parents.","options":["and","but","or"],"answer":0,"explanation":"\"and\" thể hiện sự bổ sung ý (cũng chịu áp lực từ bố mẹ nữa).","vi":"Bài vở gây cho thanh thiếu niên rất nhiều áp lực; và họ cũng cảm thấy áp lực từ bố mẹ."},
  {"q":"5. She wanted to prepare for the exam; ___________ she turned off her mobile phone.","options":["otherwise","however","therefore"],"answer":2,"explanation":"\"therefore\" thể hiện kết quả: vì muốn ôn thi NÊN đã tắt điện thoại.","vi":"Cô ấy muốn chuẩn bị cho kỳ thi; vì vậy, cô ấy đã tắt điện thoại di động."}
 ]},
{"part":"A CLOSER LOOK 2 · Grammar: Simple & Compound Sentences","roman":"AL2.4","navLabel":"AL2 Ex4","title":"Ex 4. Combine the two sentences to make compound sentences","icon":"link","instructions":"Dùng mỗi từ trong khung đúng 1 lần: or, but, so, therefore, otherwise. 💡 Sau khi hoàn thành, thử chơi trò chơi nhóm ở Ex5 SGK: \"Which group has the most sentences?\" — các nhóm thi đặt càng nhiều câu ghép đúng càng tốt.","type":"sentence",
 "ruleBox":"<b>📌 Dấu câu khi nối 2 câu:</b><br><b>or / but / so</b> → đặt dấu <b>phẩy (,)</b> ngay TRƯỚC từ nối: <i>..., or/but/so + mệnh đề 2.</i><br><b>therefore / otherwise</b> → đặt dấu <b>chấm phẩy (;)</b> TRƯỚC và dấu <b>phẩy (,)</b> NGAY SAU: <i>...; therefore/otherwise, + mệnh đề 2.</i><br>Nghĩa: or = hoặc · but = nhưng · so = nên (kết quả) · therefore = vì vậy (kết quả, trang trọng hơn \"so\") · otherwise = nếu không thì (hậu quả nếu không làm theo vế trước).",
 "questions":[
  {"q":"1. Phong has to study harder. He may fail the exam. (otherwise)","starter":"Phong has to study harder,","answer":"otherwise he may fail the exam","accepted":["otherwise he may fail the exam","otherwise, he may fail the exam"],"vi":"Phong phải học chăm chỉ hơn, nếu không cậu ấy có thể trượt kỳ thi."},
  {"q":"2. She is very sensitive. Don't comment on her new hairstyle. (therefore)","starter":"She is very sensitive;","answer":"therefore, don't comment on her new hairstyle","accepted":["therefore, don't comment on her new hairstyle","therefore don't comment on her new hairstyle"],"vi":"Cô ấy rất nhạy cảm; vì vậy đừng bình luận về kiểu tóc mới của cô ấy."},
  {"q":"3. Mi wants to have more friends. She doesn't connect well with others. (but)","starter":"Mi wants to have more friends,","answer":"but she doesn't connect well with others","accepted":["but she doesn't connect well with others"],"vi":"Mi muốn có nhiều bạn hơn, nhưng cô ấy không kết nối tốt với người khác."},
  {"q":"4. Students can work in groups. Students can work in pairs. (or)","starter":"Students can work in groups,","answer":"or they can work in pairs","accepted":["or they can work in pairs","or students can work in pairs"],"vi":"Học sinh có thể làm việc theo nhóm, hoặc có thể làm việc theo cặp."},
  {"q":"5. My friend likes showing off her new things. She often posts pictures on social media. (so)","starter":"My friend likes showing off her new things,","answer":"so she often posts pictures on social media","accepted":["so she often posts pictures on social media"],"vi":"Bạn tôi thích khoe đồ mới, nên cô ấy thường đăng ảnh lên mạng xã hội."}
 ]},

/* ============== COMMUNICATION ============== */
{"part":"COMMUNICATION · Everyday English: Making requests","roman":"COM.1","navLabel":"COM Ex1","title":"Ex 1. Listen and read. Pay attention to the highlighted sentences","icon":"comments","instructions":"Đọc hội thoại, chú ý các mẫu câu yêu cầu lịch sự \"Can/Could you tell me...?\", sau đó trả lời câu hỏi.","type":"mcq","instant":true,
 "ruleBox":"<b>📌 Công thức lời yêu cầu lịch sự (Making requests):</b><br><b>Can/Could you tell me + (câu hỏi gián tiếp)?</b><br>– Khi câu hỏi gốc có từ để hỏi (what/where/when/who/why/how): giữ nguyên từ hỏi, đổi trật tự thành câu KHẲNG ĐỊNH (không đảo động từ).<br>&nbsp;&nbsp;VD: <i>What time does it meet?</i> → <b>Could you tell me what time it meets?</b><br>– Khi câu hỏi gốc là câu hỏi Yes/No: dùng <b>if/whether</b>.<br>&nbsp;&nbsp;VD: <i>Does it meet on Mondays?</i> → <b>Could you tell me if/whether it meets on Mondays?</b><br>💬 \"Could you...?\" lịch sự hơn một chút so với \"Can you...?\", nhưng cả hai đều dùng được trong giao tiếp hằng ngày.",
 "passage": REQUEST_DIALOGUE,
 "questions":[
  {"q":"1. What club is the student asking about?","options":["The chess club","The music club","The sports club"],"answer":1,"explanation":"\"Can you tell me more about the music club, please?\"","vi":"Bạn học sinh đang hỏi về câu lạc bộ nào? → câu lạc bộ âm nhạc."},

const completedTasks = new Set();

const TOTAL_TASKS = DATA.sections.length;

function normalize(str){
  return (str||'').trim().toLowerCase()
    .replace(/['']/g,"'")
    .replace(/["""]/g,'')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ');
}
function widthFor(ref){ const l=(ref||'').length; return l<7?'w-24':l<16?'w-40':'w-full'; }

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)){ alert('Trình duyệt của bạn không hỗ trợ phát âm tự động. Hãy thử Chrome, Edge hoặc Safari.'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>btn.classList.remove('speaking'); u.onerror=()=>btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function buildNav(){
  const nav=document.getElementById('navWrap');
  let lastPart=null; let html='';
  DATA.sections.forEach((s,i)=>{

      lastPart=s.part;

    html += `<button class="tab-btn text-sm font-bold px-3 py-2 rounded-full text-slate-600${i===0?' active':''}" id="navbtn_${i}" onclick="showTab(${i})" title="${s.part||''}">${s.roman}</button>`;
  });
  nav.innerHTML = html;
  document.getElementById('progressText').textContent = `0 / ${TOTAL_TASKS} phần`;
}

function optionLetter(i){ return ['A','B','C','D','E','F'][i]; }

function isCorrectAnswer(q, chosen){
  if(chosen===-1 || chosen===undefined || chosen===null) return false;
  if(Array.isArray(q.answer)) return q.answer.includes(chosen);
  return chosen === q.answer;
}
function correctAnswerLabel(q){
  if(Array.isArray(q.answer)) return q.answer.map(a=>`${optionLetter(a)}. ${q.options[a]}`).join(' hoặc ');
  return `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
}
function markOptions(idx,i,q,chosen){
  q.options.forEach((o,j)=>{
    const el=document.getElementById(`opt_${idx}_${i}_${j}`);
    if(!el) return;
    el.classList.remove('correct-opt','wrong-opt');
    const isCorrectOpt = Array.isArray(q.answer) ? q.answer.includes(j) : j===q.answer;
    if(isCorrectOpt) el.classList.add('correct-opt');
    else if(j===chosen) el.classList.add('wrong-opt');
  });
}

function stripForSpeech(html){
  return (html||'')
    .replace(/<br\s*\/?>/gi, '. ')
    .replace(/<[^>]+>/g, '')
    .replace(/&amp;/g,'&').replace(/&nbsp;/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function renderPassage(p, idx){
  if(!p) return '';
  const viBlock = p.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-violet-200 text-violet-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-violet-200 italic text-slate-500">${p.vi}</p>` : '';
  const speakBlock = `<button type="button" data-w="${stripForSpeech(p.html).replace(/"/g,'&quot;')}" onclick="speak(this.dataset.w,this)" class="speak-btn text-xs font-bold bg-white border border-violet-200 text-violet-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2 mr-2"><i class="fa-solid fa-volume-high mr-1"></i>Nghe cả bài</button>`;
  return `<div class="passage-box mb-4"><p class="font-extrabold text-violet-900 mb-2"><i class="fa-solid fa-book mr-1"></i>${p.title||''}</p><p id="passage_en_${idx}">${p.html}</p><div class="flex flex-wrap items-center">${speakBlock}${viBlock}</div></div>`;
}
function renderDict(d, idx){
  if(!d) return '';
  const viBlock = d.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-amber-300 text-amber-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-amber-300 text-slate-600">${d.vi}</p>` : '';
  const wordSpeak = `<button type="button" data-w="${(d.word||'').replace(/"/g,'&quot;')}" onclick="speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-amber-100 text-amber-700 hover:bg-amber-200 hover:scale-110 transition inline-flex items-center justify-center ml-1 align-middle" title="Nghe phát âm"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`;
  return `<div class="dict-box mb-4"><p class="font-extrabold text-amber-800 mb-1"><i class="fa-solid fa-book-bookmark mr-1"></i>${d.word} ${wordSpeak} <span class="font-normal italic">${d.ipa||''}</span> <span class="font-normal">${d.pos?('('+d.pos+')'):''}</span></p>${d.senses.map(x=>`<p class="mb-1">✱ ${x.def}</p>${(x.examples||[]).map(e=>`<p class="ml-4 italic text-slate-600">• ${e}</p>`).join('')}`).join('')}${viBlock}</div>`;
}
function renderRuleBox(rb){
  if(!rb) return '';
  return `<div class="rule-box mb-4"><i class="fa-solid fa-lightbulb mr-1 text-blue-500"></i>${rb}</div>`;
}

function renderSection(s, idx){
  let inner = `<p class="part-label">${s.part||''}</p>`;
  inner += `<h2 class="text-xl md:text-2xl font-extrabold text-violet-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'circle-check'} text-pink-500"></i> ${s.roman}. ${s.title}</h2>`;
  if(s.instructions) inner += `<p class="text-sm text-slate-500 mb-3 italic">${s.instructions}</p>`;
  inner += renderRuleBox(s.ruleBox);
  inner += renderPassage(s.passage, idx);
  inner += renderDict(s.dict, idx);

  inner += `<div class="space-y-4">`;
  s.questions.forEach((q,i)=>{
    inner += `<div class="task-card bg-white rounded-2xl shadow-md p-4" id="qblock_${idx}_${i}">`;
    if(q.image) inner += `<div class="mb-3">${q.image}</div>`;
    const qSpeakText = stripForSpeech(q.q).replace(/"/g,'&quot;');
    const qSpeakBtn = `<button type="button" data-w="${qSpeakText}" onclick="event.stopPropagation();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-violet-100 text-violet-700 hover:bg-violet-200 hover:scale-110 transition inline-flex items-center justify-center align-middle ml-1" title="Nghe câu hỏi" aria-label="Nghe câu hỏi"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`;
    inner += `<p class="font-bold text-slate-800 mb-2 whitespace-pre-line"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${q.q}${qSpeakBtn}</p>`;
    if(s.type==='mcq'){
      inner += `<div class="grid sm:grid-cols-2 gap-2">`;
      q.options.forEach((opt,j)=>{
        const ipa = q.ipas ? q.ipas[j] : null;
        const optVi = q.vis ? q.vis[j] : null;
        const cleanWord = opt.replace(/<[^>]+>/g,'').replace(/"/g,'&quot;');
        const wordBlock = `<span class="flex flex-col leading-tight"><span>${opt}</span>${ipa?`<span class="text-[10px] text-slate-400 font-normal mcq-detail-hidden">${ipa}</span>`:''}${optVi?`<span class="text-[10px] text-emerald-500 font-normal italic mcq-detail-hidden">${optVi}</span>`:''}</span>
             <button type="button" data-w="${cleanWord}" onclick="event.stopPropagation();event.preventDefault();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-violet-100 text-violet-700 hover:bg-violet-200 hover:scale-110 transition flex items-center justify-center ml-auto shrink-0" title="Nghe phát âm" aria-label="Nghe phát âm ${cleanWord}"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`;
        inner += `<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="opt_${idx}_${i}_${j}" onclick="selectMcq(${idx},${i},${j})">
          <input type="radio" name="mcq_${idx}_${i}" class="accent-violet-700" style="display:none">
          <span class="font-black text-violet-700">${optionLetter(j)}.</span> ${wordBlock}
        </label>`;
      });
      inner += `</div>`;
    } else if(s.type==='fill'){

      const famBlock = q.family ? `<div class="wordfam-box mt-2">${q.family.map(f=>`<div>• ${f}</div>`).join('')}</div>` : '';

    } else if(s.type==='sentence'){

        inner += `<div class="flex items-center gap-3 w-full flex-wrap">
          <span class="text-slate-800 font-extrabold text-base whitespace-nowrap">${q.starter}</span>

        </div>`;
      } else {
        inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Viết câu trả lời..." autocomplete="off" spellcheck="false"${instantAttr}>`;
      }
    } else if(s.type==='essay'){
      const starterBlock = q.starter ? `<p class="text-slate-800 font-extrabold text-sm mb-2">${q.starter} ...</p>` : '';

      inner += `${starterBlock}${viNote}<textarea id="inp_${idx}_${i}" rows="6" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Viết câu trả lời của em vào đây..."></textarea>`;

function togglePassageVI(idx){ const el=document.getElementById(`passage_vi_${idx}`); if(el) el.classList.toggle('vi-hidden'); }
function selectMcq(idx,i,j){
  document.querySelectorAll(`[id^="opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${idx}_${i}_${j}`).classList.add('selected');
  document.getElementById(`opt_${idx}_${i}_${j}`).dataset.chosen = j;
  if(DATA.sections[idx].instant){ gradeOneMcq(idx,i); }
}

function gradeOneMcq(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const qblock=document.getElementById(`qblock_${idx}_${i}`);
  if(qblock) qblock.classList.add('show-mcq-detail');
  const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
  const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
  const ok = isCorrectAnswer(q, chosen);
  markOptions(idx,i,q,chosen);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, correctAnswerLabel(q), q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function gradeOneSentence(idx,i){
  const q=DATA.sections[idx].questions[i];
  const inp=document.getElementById(`inp_${idx}_${i}`);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(!inp || !fb) return;
  const raw=inp.value.trim();
  if(raw===''){
    inp.classList.remove('correct-input','wrong-input');
    fb.classList.remove('show'); fb.innerHTML='';
    return;
  }
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function feedbackHTML(ok, answerLabel, explanation, vi, note){
  const okLine = ok? `<span class="text-emerald-700 font-bold">✅ Chính xác!</span>` : `<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án đúng: <b>${answerLabel}</b>`;
  const expLine = explanation? `<br><span class="text-blue-700">💡 ${explanation}</span>` : '';
  const viLine = vi? `<span class="text-slate-500">📖 Nghĩa: <i>${vi}</i></span>` : '';
  const noteLine = note? `<br><span class="text-violet-600">📐 Công thức: <b>${note}</b></span>` : '';
  if(note){
    return (viLine?viLine+'<br>':'') + okLine + expLine + noteLine;
  }
  return okLine + expLine + (viLine?'<br>'+viLine:'') + noteLine;
}

function checkSection(idx){
  const s=DATA.sections[idx];
  let correct=0;
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='essay'){
      const ta=document.getElementById(`inp_${idx}_${i}`);
      fb.innerHTML = `<span class="text-green-700 font-bold">✍️ Cảm ơn em đã hoàn thành bài viết!</span><br><span class="text-blue-700">💡 Đoạn văn / câu trả lời gợi ý:</span><br><span class="text-slate-600 italic whitespace-pre-line">${q.sample}</span>`;
      fb.classList.add('show');
      correct++;
      return;
    }
    let ok=false, answerLabel='';
    if(s.type==='mcq'){
      const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
      const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
      ok = isCorrectAnswer(q, chosen);
      answerLabel = correctAnswerLabel(q);
      markOptions(idx,i,q,chosen);
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      const val=normalize(inp.value);
      const acc=(q.accepted||[q.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.classList.remove('correct-input','wrong-input');
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = q.answer;
    }
    if(ok) correct++;
    fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
    fb.classList.add('show');
  });
  const total=s.questions.length;
  scores[idx]={correct,total};
  const scoreEl=document.getElementById(`score_${idx}`);
  scoreEl.textContent = `🏆 Điểm: ${correct}/${total}`;
  scoreEl.classList.remove('hidden');
  completedTasks.add(idx);
  updateProgress();
  if(completedTasks.size===TOTAL_TASKS) setTimeout(showCompletion,500);
}

function revealSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='essay'){
      fb.innerHTML = `👁️ Câu trả lời gợi ý:<br><span class="text-slate-600 italic whitespace-pre-line">${q.sample}</span>`;
      fb.classList.add('show');
      return;
    }
    let answerLabel = s.type==='mcq' ? correctAnswerLabel(q) : q.answer;
    if(s.type==='mcq'){
      markOptions(idx,i,q,-1);
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    }
    fb.innerHTML = `👁️ Đáp án: <b>${answerLabel}</b>` + (q.explanation?`<br><span class="text-blue-700">💡 ${q.explanation}</span>`:'') + (q.vi?`<br><span class="text-slate-500">📖 Nghĩa: <i>${q.vi}</i></span>`:'') + (q.note?`<br><span class="text-violet-600">📐 Công thức: <b>${q.note}</b></span>`:'');
    fb.classList.add('show');
  });
}

function resetSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt','selected');
        delete el.dataset.chosen;
      });
    } else if(s.type==='essay'){
      const ta=document.getElementById(`inp_${idx}_${i}`);
      if(ta){ ta.value=''; }
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    }
    const qblock=document.getElementById(`qblock_${idx}_${i}`);
    if(qblock) qblock.classList.remove('show-mcq-detail');
    const fb=document.getElementById(`fb_${idx}_${i}`);
    fb.classList.remove('show'); fb.innerHTML='';
  });
  const scoreEl=document.getElementById(`score_${idx}`); scoreEl.classList.add('hidden');
  completedTasks.delete(idx); delete scores[idx]; updateProgress();
}

function showTab(idx){
  document.querySelectorAll('.section-page').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-slate-600');});
  document.getElementById(`tab-${idx}`).classList.add('active');
  const btn=document.getElementById(`navbtn_${idx}`);
  btn.classList.add('active'); btn.classList.remove('text-slate-600');
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=completedTasks.size;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TASKS} phần`;
  document.getElementById('progressBar').style.width = `${(done/TOTAL_TASKS)*100}%`;
}

function showCompletion(){
  fireConfetti();
  const banner=document.getElementById('completionBanner');
  banner.classList.remove('hidden'); banner.classList.add('show');
  let c=0,t=0; Object.values(scores).forEach(s=>{c+=s.correct; t+=s.total;});
  document.getElementById('finalScoreDisplay').textContent = `🎯 ${c} / ${t} câu đúng`;
}
function closeBanner(){ const b=document.getElementById('completionBanner'); b.classList.remove('show'); b.classList.add('hidden'); }
function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); wrap.innerHTML='';
  const colors=['#4c1d95','#7c3aed','#db2777','#ec4899','#f59e0b','#22c55e'];
  for(let i=0;i<90;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

buildNav();
buildMain();
updateProgress();
</script>
</body>
</html>
