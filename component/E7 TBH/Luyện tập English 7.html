<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện tập English 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE everyday classroom practice, cheerful but readable from the back row
   IDEA a Duolingo lesson: chunky pressable tiles, one question at a time, green/red verdict bar
   PICTURE the question card itself, large, with the answer tiles as the working object
   COLOUR feather green lead, sky blue for selection and audio, red for mistakes, sun yellow for lessons
   TYPE Nunito 800/900 for everything, sized by one scale the teacher controls (A- / A+)
   LAYOUT top bar with parts, progress strip, centred card; reading parts split passage | question on wide screens */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#131f24);--card:light-dark(#ffffff,#1a2b33);--ink:light-dark(#3c3c3c,#f1f7fb);--mute:light-dark(#777777,#9fb3bd);--line:light-dark(#e5e5e5,#37464f);--soft:light-dark(#f7f7f7,#202f36);
--green:#58cc02;--green-d:#46a302;--green-bg:light-dark(#d7ffb8,#1f3a14);--green-ink:light-dark(#58a700,#79d634);
--blue:#1cb0f6;--blue-d:#1899d6;--blue-bg:light-dark(#ddf4ff,#13344a);--red:#ff4b4b;--red-d:#ea2b2b;--red-bg:light-dark(#ffdfe0,#3d1d22);--red-ink:light-dark(#ea2b2b,#ff7878);
--yellow:#ffc800;--yellow-bg:light-dark(#fff5d3,#3a3212);--z:20px}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{font-size:var(--z);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:700 1rem/1.45 Nunito,"Segoe UI",Arial,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;padding:.45rem max(2vw,16px);border-bottom:2px solid var(--line);background:var(--bg)}
.brand{font-weight:900;color:var(--green);font-size:1.05rem;white-space:nowrap}
.tabs{display:flex;gap:.35rem;overflow-x:auto;flex:1 1 auto;padding:.2rem}
.tab{flex:none;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:.8rem;padding:.25rem .7rem;font-weight:800;font-size:.8rem;color:var(--mute)}
.tab.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.tab .ok{color:var(--green-ink);margin-left:.3rem}
.tools{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.tool{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:.7rem;min-width:2.3rem;height:2.3rem;padding:0 .55rem;font-weight:900;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
.tool.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.tool svg{width:1.1rem;height:1.1rem}
select.tool{appearance:none;font:inherit;font-size:.8rem}
main{flex:1 1 auto;overflow:auto;padding:.7rem max(2vw,16px) 1rem}
.wrap{max-width:72rem;margin:0 auto}
.bar{display:flex;align-items:center;gap:.8rem}
.prog{flex:1;height:1rem;border-radius:1rem;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:1rem;transition:width .3s}
.count{font-weight:900;color:var(--mute);font-size:.85rem;white-space:nowrap}
.score{font-weight:900;color:var(--green-ink);white-space:nowrap;font-size:.85rem}
.dots{display:flex;flex-wrap:wrap;gap:.25rem;margin:.5rem 0 .6rem}
.dot{width:1.6rem;height:1.6rem;border-radius:.5rem;border:2px solid var(--line);background:var(--card);font-size:.65rem;font-weight:900;color:var(--mute);padding:0}
.dot.les{background:var(--yellow-bg);border-color:var(--yellow);color:#b38b00}
.dot.r{background:var(--green);border-color:var(--green-d);color:#fff}
.dot.w{background:var(--red);border-color:var(--red-d);color:#fff}
.dot.cur{outline:3px solid var(--blue);outline-offset:1px}
.secT{font-size:1.35rem;font-weight:900;line-height:1.1;margin:.1rem 0 .6rem;text-wrap:balance}
.secT small{display:block;font-size:.8rem;color:var(--mute);font-weight:800;margin-bottom:.2rem}
.q{font-size:1.5rem;font-weight:800;line-height:1.35;margin:.2rem 0 1rem}
.blank{display:inline-block;min-width:4.5em;border-bottom:.18rem solid var(--mute);margin:0 .15em;text-align:center;color:var(--blue)}
.blank.r{color:var(--green-ink);border-color:var(--green)}
.blank.w{color:var(--red-ink);border-color:var(--red)}
.root{color:var(--blue);white-space:nowrap}
.say{width:3.2rem;height:3.2rem;border-radius:1rem;border:0;background:var(--blue);box-shadow:0 .25rem 0 var(--blue-d);color:#fff;display:inline-grid;place-items:center;flex:none}
.say:active{transform:translateY(.2rem);box-shadow:none}
.say svg{width:1.7rem;height:1.7rem}
.qrow{display:flex;gap:.9rem;align-items:flex-start}
.qrow .q{flex:1}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.opt{position:relative;text-align:left;border:2px solid var(--line);border-bottom-width:.3rem;border-radius:1rem;background:var(--card);padding:.8rem 1rem .8rem 3.1rem;font-size:1.2rem;font-weight:800;min-height:3.6rem}
.opt b{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1.6rem;height:1.6rem;border:2px solid var(--line);border-radius:.45rem;display:grid;place-items:center;font-size:.75rem;color:var(--mute)}
.opt:hover{background:var(--soft)}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.opt.sel b{border-color:var(--blue);color:var(--blue)}
.opt.r{border-color:var(--green);background:var(--green-bg);color:var(--green-ink)}
.opt.w{border-color:var(--red);background:var(--red-bg);color:var(--red-ink)}
.opt u{text-decoration-thickness:.15em;text-underline-offset:.2em}
.opt .mini{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);width:2.2rem;height:2.2rem;border-radius:.7rem;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--blue)}
.opt .mini svg{width:1.2rem;height:1.2rem}
.sound .opt{padding-right:3.4rem;font-size:1.45rem}
.sign{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.sign img{width:min(16rem,60vw);height:auto;border-radius:1rem;border:2px solid var(--line);background:#fff;padding:.6rem}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.4rem;align-items:start}
.pass{background:var(--soft);border:2px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;font-size:1.05rem;font-weight:700;line-height:1.6;max-height:62vh;overflow:auto}
.pass p{margin:0 0 .6rem}
.pass h4{margin:0 0 .4rem;font-size:1.05rem;color:var(--blue)}
.pass .gap{display:inline-block;min-width:3.2em;padding:0 .35em;border-radius:.4rem;border:2px dashed var(--mute);text-align:center;color:var(--mute);font-weight:900}
.pass .gap.now{border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue)}
.pass .gap.done{border:0;background:var(--green-bg);color:var(--green-ink)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.5rem}
.ph span{font-weight:900;color:var(--mute);font-size:.85rem}
.trq{margin:-.4rem 0 1rem;color:var(--mute);font-style:italic;font-size:1.05rem}
.src{font-size:1.35rem;font-weight:800;margin:0 0 .4rem}
.chunks{color:var(--mute);font-size:1rem;margin-bottom:1rem}
.line{min-height:4.2rem;border-bottom:2px solid var(--line);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem 0;margin-bottom:1.2rem}
.line.r{border-color:var(--green)}.line.w{border-color:var(--red)}
.fixed{font-size:1.25rem;font-weight:900;color:var(--mute);padding:.3rem .2rem}
.bank{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:.28rem;border-radius:.9rem;background:var(--card);padding:.45rem .85rem;font-size:1.25rem;font-weight:800}
.tile.used{color:transparent;background:var(--line);border-color:var(--line)}
.lesson{border:2px solid var(--yellow);border-radius:1.2rem;overflow:hidden;background:var(--card)}
.lesson h2{margin:0;background:var(--yellow);color:#3c3c3c;padding:.7rem 1.1rem;font-size:1.3rem;font-weight:900}
.lesson .in{padding:.8rem 1.2rem 1rem;font-size:1.08rem;columns:2 26rem;column-gap:2rem}
.lesson h3{margin:.7rem 0 .3rem;font-size:1.05rem;color:var(--blue);break-after:avoid}
.lesson p{margin:.2rem 0;break-inside:avoid}
.lesson .li{padding-left:1.1rem;text-indent:-1.1rem}
.lesson .ex{padding-left:1.1rem;color:var(--mute);font-style:italic}
.lesson .fx{background:var(--blue-bg);color:var(--ink);border-left:.35rem solid var(--blue);padding:.35rem .7rem;border-radius:.4rem;font-weight:900;margin:.35rem 0}
.tbl{overflow-x:auto;padding:0 1.2rem 1.2rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:2px solid var(--line);padding:.35rem .55rem;text-align:left}
th{background:var(--blue-bg)}
td:first-child{font-weight:900}
.fb{flex:none;border-top:2px solid var(--line);background:var(--bg);padding:.7rem max(2vw,16px)}
.fb.r{background:var(--green-bg);border-color:transparent}
.fb.w{background:var(--red-bg);border-color:transparent}
.fbin{max-width:72rem;margin:0 auto;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.msg{flex:1 1 34rem;max-height:34vh;overflow:auto}
.msg h3{margin:0 0 .15rem;font-size:1.2rem;font-weight:900}
.fb.r h3{color:var(--green-ink)}.fb.w h3{color:var(--red-ink)}
.msg p{margin:.1rem 0;font-size:.95rem}
.msg .k{font-weight:900}
.btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.big{border:0;border-radius:1rem;padding:.6rem 1.2rem;font-size:.85rem;font-weight:900;letter-spacing:.02em;text-transform:uppercase;background:var(--green);color:#fff;box-shadow:0 .25rem 0 var(--green-d);min-height:3rem}
.big:disabled{background:var(--line);color:var(--mute);box-shadow:0 .25rem 0 var(--line);cursor:default}
.big.red{background:var(--red);box-shadow:0 .25rem 0 var(--red-d)}
.big.ghost{background:var(--card);color:var(--mute);border:2px solid var(--line);box-shadow:0 .25rem 0 var(--line)}
.big.blue{background:var(--blue);box-shadow:0 .25rem 0 var(--blue-d)}
.big:active:not(:disabled){transform:translateY(.2rem);box-shadow:none}
.done{text-align:center;padding:1.5rem 0}
.done .num{font-size:4rem;font-weight:900;color:var(--green);line-height:1}
.done .wl{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:1rem 0}
.note{color:var(--mute);font-size:.8rem;margin-top:1.4rem}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.prog i{transition:none}}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}.pass{max-height:none}}
@media (max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}.q{font-size:1.25rem}.brand{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">English 7 · Ôn tập HK1</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <button class="tool" id="zDown" title="Thu nhỏ chữ (-)">A−</button>
    <button class="tool" id="zUp" title="Phóng to chữ (+)">A+</button>
    <select class="tool" id="rate" title="Tốc độ đọc">
      <option value="0.6">Đọc chậm</option><option value="0.8" selected>Đọc vừa</option><option value="1">Đọc thường</option>
    </select>
    <select class="tool" id="accent" title="Giọng đọc">
      <option value="en-US">Giọng Mỹ</option><option value="en-GB">Giọng Anh</option>
    </select>
    <button class="tool" id="trBtn" title="Luôn hiện dịch nghĩa (T)">Dịch</button>
    <button class="tool on" id="sfxBtn" title="Âm báo đúng/sai">Âm báo</button>
    <button class="tool" id="fsBtn" title="Toàn màn hình (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>
<main id="main"><div class="wrap">
  <div class="bar"><div class="prog"><i id="progI"></i></div><span class="count" id="count"></span><span class="score" id="score"></span></div>
  <div class="dots" id="dots"></div>
  <div id="stage"></div>
  <p class="note">Phím tắt: 1–4 chọn đáp án · Enter kiểm tra / tiếp tục · Space nghe · ← → chuyển câu · T bật dịch · F toàn màn hình · +/− cỡ chữ</p>
</div></main>
<footer class="fb" id="fb"><div class="fbin"><div class="msg" id="msg"></div><div class="btns" id="btns"></div></div></footer>
<script>
{
const DATA = [{"id": "p1", "name": "Phần I", "title": "Trắc nghiệm từ vựng – ngữ pháp", "steps": [{"k": "lesson", "title": "Kiến thức & cách làm – Phần I", "lines": ["#CÁCH LÀM", "- Bước 1: Đọc cả câu, đừng chỉ đọc chỗ trống. Gạch chân từ gợi ý (last year, ago, but…).", "- Bước 2: Xác định câu hỏi kiểm tra gì: từ vựng, thì động từ, liên từ, giới từ hay hội thoại.", "- Bước 3: Loại các đáp án sai nghĩa hoặc sai ngữ pháp, chọn đáp án còn lại.", "#1. THÌ QUÁ KHỨ ĐƠN (Past simple)", "- Dùng khi: việc đã xảy ra và kết thúc trong quá khứ.", "- Công thức: (+) S + V-ed / V cột 2   (–) S + didn’t + V   (?) Did + S + V?", "- Dấu hiệu: yesterday, last week / month / year, … ago, in 2020.", "> Ví dụ: Last summer, we planted trees along the river. (Mùa hè năm ngoái, chúng tôi đã trồng cây dọc bờ sông.)", "- Động từ bất quy tắc hay gặp: go → went, do → did, have → had, give → gave, take → took, make → made.", "#2. LIÊN TỪ (and / but / so / or)", "- and = và (thêm ý)   - but = nhưng (hai ý trái ngược)   - so = vì vậy (kết quả)   - or = hoặc / nếu không thì", "> Ví dụ: I like music, but my brother doesn’t. · It was late, so we went home. · Hurry up, or you’ll be late.", "#3. SOME / ANY", "- some: câu khẳng định và lời mời (I have some apples. Would you like some tea?)", "- any: câu phủ định và câu hỏi (I don’t have any milk. Do you have any eggs?)", "#4. CỤM TỪ CỐ ĐỊNH HAY GẶP", "- be made from (làm từ) · share sth with sb (chia sẻ với) · be different from (khác với) · encourage sb to V (khuyến khích ai làm gì) · be good for (tốt cho)", "#5. HỘI THOẠI", "- Trả lời theo trợ động từ của câu hỏi: Do you…? → Yes, I do / No, I don’t.  Are you…? → Yes, I am / No, I’m not.", "- What’s your hobby? → It’s + V-ing (It’s drawing)."]}, {"k": "mc", "n": 1, "q": "What __________ do I need to cook an omelette?", "opts": ["foods", "materials", "menus", "ingredients"], "ans": 3, "say": "What ingredients do I need to cook an omelette?", "tr": "Tôi cần những nguyên liệu gì để nấu món trứng tráng?", "ex": "ingredient = nguyên liệu nấu ăn; food = thức ăn; material = vật liệu (gỗ, nhựa…); menu = thực đơn."}, {"k": "mc", "n": 2, "q": "I do not have __________ oranges, but I have __________ apples.", "opts": ["any/any", "some/any", "any/some", "a/some"], "ans": 2, "say": "I do not have any oranges, but I have some apples.", "tr": "Tôi không có quả cam nào, nhưng tôi có vài quả táo.", "ex": "Câu phủ định (do not have) → any; câu khẳng định (I have) → some."}, {"k": "mc", "n": 3, "q": "The art club will ___________ students’ paintings next Friday.", "opts": ["prefer", "celebrate", "exhibit", "compel"], "ans": 2, "say": "The art club will exhibit students’ paintings next Friday.", "tr": "Câu lạc bộ mỹ thuật sẽ trưng bày tranh của học sinh vào thứ Sáu tới.", "ex": "exhibit = trưng bày; prefer = thích hơn; celebrate = kỷ niệm; compel = bắt buộc."}, {"k": "mc", "n": 4, "q": "The room is very __________, so we can hear every small sound.", "opts": ["quiet", "loud", "famous", "recent"], "ans": 0, "say": "The room is very quiet, so we can hear every small sound.", "tr": "Căn phòng rất yên tĩnh, nên chúng tôi nghe được mọi tiếng động nhỏ.", "ex": "Vế sau “nghe được mọi tiếng động nhỏ” → phòng phải quiet (yên tĩnh); loud = ồn ào."}, {"k": "mc", "n": 5, "q": "Tom and his friends __________ the plants in their neighbourhood every weekend.", "opts": ["clean", "water", "donate", "pick up"], "ans": 1, "say": "Tom and his friends water the plants in their neighbourhood every weekend.", "tr": "Tom và các bạn tưới cây trong khu phố mỗi cuối tuần.", "ex": "water the plants = tưới cây (Unit 3); clean = lau dọn; donate = quyên góp; pick up = nhặt."}, {"k": "mc", "n": 6, "q": "To prevent __________, you should eat well and keep your body warm.", "opts": ["flu", "toothache", "sunburn", "obesity"], "ans": 0, "say": "To prevent flu, you should eat well and keep your body warm.", "tr": "Để phòng cúm, bạn nên ăn uống tốt và giữ ấm cơ thể.", "ex": "“Giữ ấm cơ thể” → phòng flu (cúm); toothache = đau răng; sunburn = cháy nắng; obesity = béo phì."}, {"k": "mc", "n": 7, "q": "Last year, our school __________ hundreds of books to children in a rural village.", "opts": ["has donated", "donated", "donates", "to donate"], "ans": 1, "say": "Last year, our school donated hundreds of books to children in a rural village.", "tr": "Năm ngoái, trường chúng tôi đã quyên góp hàng trăm cuốn sách cho trẻ em ở một làng quê.", "ex": "Dấu hiệu “Last year” → quá khứ đơn: V-ed (donated)."}, {"k": "mc", "n": 8, "q": "Nam wants to lose weight, __________ he still eats a lot of junk food.", "opts": ["so", "and", "but", "for"], "ans": 2, "say": "Nam wants to lose weight, but he still eats a lot of junk food.", "tr": "Nam muốn giảm cân, nhưng cậu ấy vẫn ăn nhiều đồ ăn vặt.", "ex": "Hai vế trái ngược nhau → but (nhưng); so = vì vậy; and = và; for = vì."}, {"k": "mc", "n": 9, "q": "Cakes in Viet Nam are made __________ butter, eggs and flour.", "opts": ["in", "of", "by", "from"], "ans": 3, "say": "Cakes in Viet Nam are made from butter, eggs and flour.", "tr": "Bánh ngọt ở Việt Nam được làm từ bơ, trứng và bột mì.", "ex": "be made from = được làm từ (nguyên liệu biến đổi, không nhìn thấy nữa); be made of = làm bằng (vẫn thấy chất liệu)."}, {"k": "mc", "n": 10, "q": "Chi: “Do you like going fishing?” – Duy: “_______________.”", "opts": ["Yes, I do.", "See you again.", "Sorry. I’m busy.", "It’s a great idea."], "ans": 0, "say": "Chi: “Do you like going fishing?” – Duy: “Yes, I do.”", "tr": "Chi: “Bạn có thích đi câu cá không?” – Duy: “Có, mình thích.”", "ex": "Câu hỏi bắt đầu bằng Do you…? → trả lời Yes, I do / No, I don’t."}, {"k": "mc", "n": 11, "q": "What __________ drink do you like most?", "opts": ["nation", "foreign", "foreigner", "favourite"], "ans": 3, "say": "What favourite drink do you like most?", "tr": "Đồ uống yêu thích nhất của bạn là gì?", "ex": "favourite + danh từ = … yêu thích; foreign = nước ngoài; nation = quốc gia."}, {"k": "mc", "n": 12, "q": "My parents always __________ me to learn English.", "opts": ["found", "celebrate", "encourage", "grow"], "ans": 2, "say": "My parents always encourage me to learn English.", "tr": "Bố mẹ tôi luôn khuyến khích tôi học tiếng Anh.", "ex": "encourage sb to V = khuyến khích ai làm gì."}, {"k": "mc", "n": 13, "q": "The students painted a __________ of their English teacher.", "opts": ["portrait", "puppet", "parade", "anthem"], "ans": 0, "say": "The students painted a portrait of their English teacher.", "tr": "Các học sinh vẽ một bức chân dung cô giáo tiếng Anh.", "ex": "portrait = tranh chân dung; puppet = con rối; parade = cuộc diễu hành; anthem = quốc ca."}, {"k": "mc", "n": 14, "q": "Traditional music is an important part of our cultural __________.", "opts": ["traffic", "heritage", "disease", "shopping"], "ans": 1, "say": "Traditional music is an important part of our cultural heritage.", "tr": "Âm nhạc truyền thống là một phần quan trọng của di sản văn hóa.", "ex": "cultural heritage = di sản văn hóa; traffic = giao thông; disease = bệnh."}, {"k": "mc", "n": 15, "q": "The charity provides food and clothes for __________ people.", "opts": ["exact", "homeless", "public", "proud"], "ans": 1, "say": "The charity provides food and clothes for homeless people.", "tr": "Tổ chức từ thiện cung cấp đồ ăn và quần áo cho người vô gia cư.", "ex": "homeless people = người vô gia cư (Unit 3); proud = tự hào; public = công cộng."}, {"k": "mc", "n": 16, "q": "Tofu and soybeans are good sources of __________.", "opts": ["calories", "acne", "viruses", "protein"], "ans": 3, "say": "Tofu and soybeans are good sources of protein.", "tr": "Đậu phụ và đậu nành là nguồn đạm tốt.", "ex": "protein = chất đạm; calories = ca-lo; acne = mụn; virus = vi-rút."}, {"k": "mc", "n": 17, "q": "Three years ago, my sister and I __________ to Phong Nha Cave with my family.", "opts": ["go", "will go", "went", "are going"], "ans": 2, "say": "Three years ago, my sister and I went to Phong Nha Cave with my family.", "tr": "Ba năm trước, chị tôi và tôi đã đi động Phong Nha cùng gia đình.", "ex": "Dấu hiệu “three years ago” → quá khứ đơn; go → went (động từ bất quy tắc)."}, {"k": "mc", "n": 18, "q": "Don’t stay up too late, __________ you may feel tired the next day.", "opts": ["so", "and", "but", "or"], "ans": 3, "say": "Don’t stay up too late, or you may feel tired the next day.", "tr": "Đừng thức quá khuya, nếu không bạn có thể thấy mệt vào ngày hôm sau.", "ex": "Câu mệnh lệnh + or = …, nếu không thì… (or chỉ hậu quả)."}, {"k": "mc", "n": 19, "q": "I often share my hobby __________ my friends.", "opts": ["with", "at", "on", "in"], "ans": 0, "say": "I often share my hobby with my friends.", "tr": "Tôi thường chia sẻ sở thích với bạn bè.", "ex": "share sth with sb = chia sẻ cái gì với ai."}, {"k": "mc", "n": 20, "q": "Minh: “What’s your hobby, Chuong?” – Chuong: “__________________.”", "opts": ["I’m twelve.", "It’s drawing.", "I love that.", "It’s very funny."], "ans": 1, "say": "Minh: “What’s your hobby, Chuong?” – Chuong: “It’s drawing.”", "tr": "Minh: “Sở thích của bạn là gì, Chương?” – Chương: “Là vẽ tranh.”", "ex": "Hỏi What’s your hobby? → trả lời It’s + V-ing / My hobby is + V-ing."}, {"k": "mc", "n": 21, "q": "How many __________ of yogurt do you need?", "opts": ["cartons", "cups", "pieces", "bars"], "ans": 1, "say": "How many cups of yogurt do you need?", "tr": "Bạn cần bao nhiêu cốc sữa chua?", "ex": "a cup of yogurt = một cốc sữa chua; piece dùng cho bánh, bar dùng cho chocolate, carton dùng cho sữa hộp giấy."}, {"k": "mc", "n": 22, "q": "My teachers often use a __________ to show images and slides on a screen.", "opts": ["projector", "paragraph", "timetable", "laboratory"], "ans": 0, "say": "My teachers often use a projector to show images and slides on a screen.", "tr": "Thầy cô thường dùng máy chiếu để chiếu hình ảnh và slide lên màn hình.", "ex": "projector = máy chiếu; paragraph = đoạn văn; timetable = thời khóa biểu; laboratory = phòng thí nghiệm."}, {"k": "mc", "n": 23, "q": "The little girl’s __________ of her kitten is very beautiful.", "opts": ["parade", "music", "drawing", "anthem"], "ans": 2, "say": "The little girl’s drawing of her kitten is very beautiful.", "tr": "Bức vẽ con mèo con của cô bé rất đẹp.", "ex": "Sau sở hữu cách (girl’s) cần danh từ; drawing = bức vẽ (hợp nghĩa “of her kitten”)."}, {"k": "mc", "n": 24, "q": "The school __________ its 50th anniversary with a music show last month.", "opts": ["preferred", "considered", "compelled", "celebrated"], "ans": 3, "say": "The school celebrated its 50th anniversary with a music show last month.", "tr": "Trường đã kỷ niệm 50 năm thành lập bằng một buổi biểu diễn âm nhạc tháng trước.", "ex": "celebrate + anniversary = kỷ niệm ngày thành lập; “last month” → quá khứ đơn."}, {"k": "mc", "n": 25, "q": "Volunteers visited the __________ home to talk with elderly people.", "opts": ["nursing", "mountain", "private", "rural"], "ans": 0, "say": "Volunteers visited the nursing home to talk with elderly people.", "tr": "Tình nguyện viên đến viện dưỡng lão để trò chuyện với người cao tuổi.", "ex": "nursing home = viện dưỡng lão (nơi chăm sóc người già)."}, {"k": "mc", "n": 26, "q": "Acne is a common skin __________ among teenagers.", "opts": ["expert", "condition", "calorie", "shape"], "ans": 1, "say": "Acne is a common skin condition among teenagers.", "tr": "Mụn trứng cá là một tình trạng da phổ biến ở tuổi thiếu niên.", "ex": "skin condition = bệnh/tình trạng về da; expert = chuyên gia; shape = hình dáng."}, {"k": "mc", "n": 27, "q": "Last year, I _______ to visit a children’s village in Yen Bai with my teachers and friends.", "opts": ["go", "to go", "goes", "went"], "ans": 3, "say": "Last year, I went to visit a children’s village in Yen Bai with my teachers and friends.", "tr": "Năm ngoái, tôi đã đi thăm một làng trẻ em ở Yên Bái cùng thầy cô và bạn bè.", "ex": "Dấu hiệu “Last year” → quá khứ đơn: went."}, {"k": "mc", "n": 28, "q": "Huong wants to lose her weight, __________ she still eats a lot of junk food.", "opts": ["so", "and", "but", "for"], "ans": 2, "say": "Huong wants to lose her weight, but she still eats a lot of junk food.", "tr": "Hương muốn giảm cân, nhưng cô ấy vẫn ăn nhiều đồ ăn vặt.", "ex": "Giống câu 8: hai ý trái ngược → but."}, {"k": "mc", "n": 29, "q": "My hobby is different __________ my sister’s.", "opts": ["from", "with", "of", "by"], "ans": 0, "say": "My hobby is different from my sister’s.", "tr": "Sở thích của tôi khác với sở thích của chị tôi.", "ex": "be different from = khác với."}, {"k": "mc", "n": 30, "q": "Hang: “Are you free this afternoon, Ngân?” – Ngân: “________________.”", "opts": ["Great.", "Thanks a lot.", "No, I hate it.", "Yes, I am."], "ans": 3, "say": "Hang: “Are you free this afternoon, Ngân?” – Ngân: “Yes, I am.”", "tr": "Hằng: “Chiều nay bạn rảnh không, Ngân?” – Ngân: “Có, mình rảnh.”", "ex": "Câu hỏi Are you…? → trả lời Yes, I am / No, I’m not."}]}, {"id": "p2", "name": "Phần II", "title": "Đọc biển báo", "steps": [{"k": "lesson", "title": "Kiến thức & cách làm – Phần II", "lines": ["#CÁCH LÀM", "- Bước 1: Đọc chữ trên biển (QUIET PLEASE, KEEP CLEAN…). Chữ thường đã nói gần hết ý nghĩa.", "- Bước 2: Nhìn hình dạng và màu sắc của biển để biết là cấm, cảnh báo hay hướng dẫn.", "- Bước 3: Chọn câu đúng cả hành động lẫn đồ vật trong hình (xe đạp ≠ xe máy ≠ ô tô).", "#Ý NGHĨA HÌNH DẠNG BIỂN", "- Vòng tròn đỏ có gạch chéo = CẤM → No + V-ing / You mustn’t + V / Don’t + V.", "> Ví dụ: No smoking. = You mustn’t smoke here.", "- Tam giác vàng = CẢNH BÁO → Be careful / Watch out.", "- Biển xanh, trắng không gạch = BẮT BUỘC hoặc HƯỚNG DẪN → You must / You should + V.", "#TỪ VỰNG BIỂN BÁO", "- quiet (yên lặng) · allergy (dị ứng) · helmet (mũ bảo hiểm) · seat belt (dây an toàn) · environment (môi trường) · volunteer (tình nguyện viên) · wanted (cần tìm, cần tuyển)"]}, {"k": "mc", "n": 1, "q": "What does the sign say?", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKMAAACNCAYAAADbysrGAAAAAXNSR0IArs4c6Q  Joongih, however, does not have one favourite type. If a song comes on the radio and {9} his attention, he finds out the name of the artist or group. Then he {10} the song and saves it. After some time, songs from many different genres become part of what he listens to in his {11} time. Both boys enjoy music, {12} their tastes are not exactly the same.", "WHO INVENTED POPCORN?\nPopcorn is a delicacy that was developed by the Indians of North America, dated back {13} of years. Besides eating popped corn, the Indians also used popped corn in {14}, necklaces and in religious ceremonies. According to most sources, a deerskin bag full {15} popcorn was served at the first Thanksgiving dinner at Plymouth Rock in {16}.\nPopcorn’s popularity grew during the Depression of the 1930s people realized that a little popcorn could {17} a long way. But its success was clinched when movie {18} across the continent started serving the snack. By 1947, 85 percent of movie houses were selling popcorn at their concession stands."], "fill": {"1": "eat", "2": "for", "3": "water", "4": "playing", "5": "much", "6": "difference", "7": "favourite", "8": "good", "9": "catches", "10": "downloads", "11": "free", "12": "but", "13": "thousands", "14": "headdress", "15": "of", "16": "1621", "17": "go", "18": "theatres"}}, {"id": "p4", "name": "Phần IV", "title": "Đọc hiểu True / False", "steps": [{"k": "lesson", "title": "Kiến thức & cách làm – Phần IV", "lines": ["#CÁCH LÀM CÂU TRUE / FALSE", "- Bước 1: Đọc câu hỏi trước, gạch chân từ khóa (tên người, thời gian, con số, hành động).", "- Bước 2: Tìm trong bài câu chứa từ khóa đó.", "- Bước 3: So sánh từng chi tiết. Chỉ cần sai một chi tiết là False.", "> Ví dụ: Bài: “My uncle gave me a model kit.” · Câu hỏi: “Minh’s aunt gave him a model kit.” → False (uncle ≠ aunt).", "#BẪY THƯỜNG GẶP", "- Đổi người (uncle → aunt), đổi thời gian (June → July), đổi hành động (donated → sold), đổi số lượng (many hours → a few minutes).", "- Từ tuyệt đối: never, always, only, all → thường là False nếu bài chỉ nói “some”, “sometimes”.", "#CÁCH LÀM CÂU TRẮC NGHIỆM", "- What is the passage mainly about? → chọn ý bao quát cả bài, không chọn chi tiết nhỏ.", "- Which … is NOT mentioned? → đánh dấu các ý có trong bài, đáp án còn lại là đúng.", "- How often…? → tìm từ chỉ tần suất: every Sunday = once a week; twice a week = hai lần một tuần.", "#CẤU TRÚC HAY GẶP TRONG BÀI ĐỌC", "- It takes + sb + thời gian + to V = ai đó mất bao lâu để làm gì   (It takes me two weeks to finish a model.)", "- like A better than B = prefer A to B = thích A hơn B", "- not a piece of cake = không dễ · take part in = tham gia"]}, {"k": "mc", "n": 1, "p": 0, "q": "Minh started making models two years ago.", "opts": ["True", "False"], "ans": 0, "say": "Minh started making models two years ago.", "tr": "Minh bắt đầu làm mô hình từ hai năm trước.", "ex": "Bài viết: “I started it two years ago” → True."}, {"k": "mc", "n": 2, "p": 0, "q": "Minh’s aunt gave him a model kit on his birthday.", "opts": ["True", "False"], "ans": 1, "say": "Minh’s aunt gave him a model kit on his birthday.", "tr": "Dì/cô của Minh tặng cậu bộ mô hình vào ngày sinh nhật.", "ex": "Người tặng là uncle (chú/bác), không phải aunt → False."}, {"k": "mc", "n": 3, "p": 0, "q": "Minh spends a lot of money on his hobby.", "opts": ["True", "False"], "ans": 1, "say": "Minh spends a lot of money on his hobby.", "tr": "Minh tốn nhiều tiền cho sở thích của mình.", "ex": "“It doesn’t cost much money because I reuse old things” → False."}, {"k": "mc", "n": 4, "p": 0, "q": "Minh’s younger sister sometimes helps him paint the models.", "opts": ["True", "False"], "ans": 0, "say": "Minh’s younger sister sometimes helps him paint the models.", "tr": "Em gái Minh thỉnh thoảng giúp cậu sơn mô hình.", "ex": "“My younger sister sometimes helps me paint the models” → True."}, {"k": "mc", "n": 5, "p": 0, "q": "It takes Minh about ______ to finish a big model.", "opts": ["two days", "two weeks", "two years", "one month"], "ans": 1, "say": "It takes Minh about two weeks to finish a big model.", "tr": "Minh mất khoảng hai tuần để làm xong một mô hình lớn.", "ex": "“It takes me about two weeks to finish a big model”; cấu trúc It takes sb + thời gian + to V."}, {"k": "mc", "n": 6, "p": 0, "q": "What is the passage mainly about?", "opts": ["Minh’s family", "a school contest", "Minh’s hobby", "painting models"], "ans": 2, "say": "What is the passage mainly about?", "tr": "Bài đọc chủ yếu nói về điều gì? → Sở thích của Minh.", "ex": "Cả bài xoay quanh sở thích làm mô hình; các ý khác chỉ là chi tiết nhỏ."}, {"k": "mc", "n": 7, "p": 1, "q": "Most members of Green Hands are teenagers.", "opts": ["True", "False"], "ans": 0, "say": "Most members of Green Hands are teenagers.", "tr": "Phần lớn thành viên của Green Hands là thanh thiếu niên.", "ex": "“most of them are teenagers” → True."}, {"k": "mc", "n": 8, "p": 1, "q": "The group planted trees along the river in July.", "opts": ["True", "False"], "ans": 1, "say": "The group planted trees along the river in July.", "tr": "Nhóm trồng cây dọc bờ sông vào tháng Bảy.", "ex": "Trồng cây vào June (tháng Sáu); tháng Bảy đi viện dưỡng lão → False."}, {"k": "mc", "n": 9, "p": 1, "q": "The volunteers sold old clothes and books to children in a mountainous area.", "opts": ["True", "False"], "ans": 1, "say": "The volunteers sold old clothes and books to children in a mountainous area.", "tr": "Các tình nguyện viên bán quần áo và sách cũ cho trẻ em vùng núi.", "ex": "Họ donated (tặng), không phải sold (bán) → False."}, {"k": "mc", "n": 10, "p": 1, "q": "Volunteering helped the writer learn teamwork and communication skills.", "opts": ["True", "False"], "ans": 0, "say": "Volunteering helped the writer learn teamwork and communication skills.", "tr": "Hoạt động tình nguyện giúp tác giả học kỹ năng làm việc nhóm và giao tiếp.", "ex": "“helped me learn many skills, such as teamwork and communication” → True."}, {"k": "mc", "n": 11, "p": 1, "q": "How often did the writer tutor the street children?", "opts": ["once a week", "twice a week", "every day", "once a month"], "ans": 0, "say": "How often did the writer tutor the street children?", "tr": "Tác giả dạy kèm trẻ đường phố bao lâu một lần? → Mỗi tuần một lần.", "ex": "“every Sunday morning” = mỗi sáng Chủ nhật = once a week."}, {"k": "mc", "n": 12, "p": 1, "q": "Which activity is NOT mentioned in the passage?", "opts": ["cleaning streets", "planting trees", "painting murals", "donating blankets"], "ans": 2, "say": "Which activity is NOT mentioned in the passage?", "tr": "Hoạt động nào KHÔNG được nhắc đến? → Vẽ tranh tường.", "ex": "Bài có dọn đường, trồng cây, tặng chăn; không có painting murals."}, {"k": "mc", "n": 13, "p": 2, "q": "Most Vietnamese people eat phở in the morning.", "opts": ["True", "False"], "ans": 0, "say": "Most Vietnamese people eat phở in the morning.", "tr": "Phần lớn người Việt ăn phở vào buổi sáng.", "ex": "“most Vietnamese people eat it in the morning” → True."}, {"k": "mc", "n": 14, "p": 2, "q": "Cooks stew beef bones for only a few minutes to make the broth.", "opts": ["True", "False"], "ans": 1, "say": "Cooks stew beef bones for only a few minutes to make the broth.", "tr": "Đầu bếp hầm xương bò chỉ vài phút để nấu nước dùng.", "ex": "Bài viết: hầm “for many hours” (nhiều giờ) → False."}, {"k": "mc", "n": 15, "p": 2, "q": "People never add fish sauce to phở.", "opts": ["True", "False"], "ans": 1, "say": "People never add fish sauce to phở.", "tr": "Người ta không bao giờ cho nước mắm vào phở.", "ex": "“Some people also like to add a little fish sauce” → False (bẫy từ never)."}, {"k": "mc", "n": 16, "p": 2, "q": "The writer prefers beef phở to chicken phở.", "opts": ["True", "False"], "ans": 0, "say": "The writer prefers beef phở to chicken phở.", "tr": "Tác giả thích phở bò hơn phở gà.", "ex": "“I like beef phở better than chicken phở” = prefer beef phở to chicken phở → True."}, {"k": "mc", "n": 17, "p": 2, "q": "Which ingredient is NOT used to make the broth?", "opts": ["beef bones", "onions", "ginger", "lime"], "ans": 3, "say": "Which ingredient is NOT used to make the broth?", "tr": "Nguyên liệu nào KHÔNG dùng để nấu nước dùng? → Chanh.", "ex": "Nước dùng gồm xương bò, hành, gừng, gia vị; chanh (lime) chỉ ăn kèm."}, {"k": "mc", "n": 18, "p": 2, "q": "Which word best describes phở in the passage?", "opts": ["expensive", "popular", "unhealthy", "spicy"], "ans": 1, "say": "Which word best describes phở in the passage?", "tr": "Từ nào mô tả phở đúng nhất trong bài? → Phổ biến.", "ex": "“one of the most popular dishes in Viet Nam”."}], "passages": ["Hi, I’m Minh. I’m in grade 7, and my hobby is making models. I started it two years ago when my uncle gave me a model kit of a ship on my birthday. Now I usually make models of houses, cars and planes from cardboard, glue and old paper. It doesn’t cost much money because I reuse old things. Making models is not a piece of cake. It takes me about two weeks to finish a big model, so I have to be very patient. My younger sister sometimes helps me paint the models, but she doesn’t like cutting the cardboard. I think this hobby is very useful. It helps me relax after school and makes me more creative. Last month, I took part in a model competition at my school and won second prize. In the future, I want to share my hobby with my classmates and start a small model club.", "Last summer, I joined a volunteer group called Green Hands in my neighbourhood. Our group has about thirty members, and most of them are teenagers. We did many useful activities. In June, we cleaned up the streets and planted trees along the river. In July, we visited a nursing home and spent time with the elderly people there. We read books, played board games and listened to their stories. In August, we collected old clothes, books and blankets and donated them to children in a mountainous area. I also tutored two street children in Maths every Sunday morning. At first, I was very shy, but I soon felt more confident. Volunteering helped me learn many skills, such as teamwork and communication. I felt very proud because I could make a difference in my community. This summer, I’m going to volunteer with Green Hands again.", "Phở is one of the most popular dishes in Viet Nam. People can eat it for breakfast, lunch or dinner, but most Vietnamese people eat it in the morning. There are two main kinds of phở: beef noodle soup and chicken noodle soup. The most important part of phở is the broth. To make a good broth, cooks stew beef bones with onions, ginger and some spices for many hours. Then they put rice noodles into a bowl, add some slices of beef or chicken and pour the hot broth over them. People often eat phở with fresh herbs, lime and chilli. Some people also like to add a little fish sauce. My mum cooks phở for my family every Sunday. It takes her about six hours to prepare it, but we all love it. I like beef phở better than chicken phở because it is tastier. Today, phở is also famous in many countries around the world."], "ptr": ["Chào, mình là Minh, học lớp 7, sở thích là làm mô hình. Mình bắt đầu từ hai năm trước khi chú tặng một bộ mô hình tàu thủy vào sinh nhật. Giờ mình thường làm mô hình nhà, ô tô, máy bay từ bìa các-tông, keo và giấy cũ. Sở thích này không tốn nhiều tiền vì mình tái sử dụng đồ cũ. Làm mô hình không dễ chút nào: một mô hình lớn mất khoảng hai tuần nên mình phải rất kiên nhẫn. Em gái thỉnh thoảng giúp mình sơn nhưng không thích cắt bìa. Mình thấy sở thích này rất có ích: giúp thư giãn sau giờ học và sáng tạo hơn. Tháng trước mình thi làm mô hình ở trường và đạt giải nhì. Sau này mình muốn chia sẻ sở thích với các bạn cùng lớp và lập một câu lạc bộ mô hình nhỏ.", "Hè năm ngoái, mình tham gia nhóm tình nguyện Green Hands trong khu phố. Nhóm có khoảng ba mươi thành viên, phần lớn là thanh thiếu niên. Tháng Sáu, chúng mình dọn dẹp đường phố và trồng cây dọc bờ sông. Tháng Bảy, chúng mình đến viện dưỡng lão, đọc sách, chơi cờ và nghe các cụ kể chuyện. Tháng Tám, chúng mình thu gom quần áo, sách và chăn cũ để tặng trẻ em vùng núi. Mình còn dạy kèm Toán cho hai em bé đường phố mỗi sáng Chủ nhật. Lúc đầu mình rất ngại nhưng dần tự tin hơn. Tình nguyện giúp mình học được kỹ năng làm việc nhóm và giao tiếp. Mình rất tự hào vì đã tạo ra sự khác biệt cho cộng đồng. Hè này mình sẽ lại tham gia Green Hands.", "Phở là một trong những món phổ biến nhất ở Việt Nam. Người ta có thể ăn vào bữa sáng, trưa hay tối, nhưng phần lớn ăn vào buổi sáng. Có hai loại chính: phở bò và phở gà. Phần quan trọng nhất là nước dùng: đầu bếp hầm xương bò với hành, gừng và gia vị trong nhiều giờ. Sau đó cho bánh phở vào bát, thêm vài lát thịt bò hoặc gà rồi chan nước dùng nóng. Người ta thường ăn kèm rau thơm, chanh và ớt; một số người thêm chút nước mắm. Mẹ mình nấu phở cho cả nhà mỗi Chủ nhật, mất khoảng sáu tiếng nhưng ai cũng thích. Mình thích phở bò hơn phở gà vì ngon hơn. Ngày nay phở còn nổi tiếng ở nhiều nước trên thế giới."]}, {"id": "p5", "name": "Phần V", "title": "Chia dạng đúng của từ", "steps": [{"k": "lesson", "title": "Kiến thức & cách làm – Phần V", "lines": ["#CÁCH LÀM (3 BƯỚC)", "- Bước 1: Nhìn từ đứng trước và sau chỗ trống.", "- Bước 2: Xác định cần danh từ, tính từ, trạng từ hay động từ (bảng dưới).", "- Bước 3: Đổi từ trong ngoặc sang đúng loại; kiểm tra số nhiều (-s) và chia động từ.", "#VỊ TRÍ CỦA TỪ LOẠI", "- DANH TỪ: sau a / an / the, sau tính từ, sau my / your / his…, sau many. > outdoor activities, your health, a talented actor", "- TÍNH TỪ: trước danh từ; sau be, feel, look; sau very / really / so; sau the most. > musical talent, very useful, felt relaxed, the most famous", "- TRẠNG TỪ (-ly): bổ nghĩa cho động từ thường; đứng đầu câu trước dấu phẩy. > brush your teeth regularly, Traditionally, …", "- ĐỘNG TỪ: sau chủ ngữ; sau do / does / can / should. Chủ ngữ ngôi 3 số ít ở hiện tại đơn → thêm -s. > he collects, How do you relax?", "#HẬU TỐ (ĐUÔI TỪ) GIÚP NHẬN BIẾT", "- Danh từ: -tion, -ity, -er / -or / -ian (chỉ người), -ment, -th   (collection, activity, actor, musician, health)", "- Tính từ: -ful, -al, -ous, -y, -ing, -ed   (useful, traditional, famous, tasty, relaxing, relaxed)", "- Trạng từ: tính từ + -ly   (regular → regularly, traditional → traditionally)", "- Nghĩa phủ định: thêm un-   (interesting → uninteresting)", "#-ING HAY -ED?", "- -ing: mô tả sự vật, sự việc (a relaxing bath, an interesting book).", "- -ed: mô tả cảm xúc của người (I feel relaxed, I’m interested in music)."], "table": [["Gốc", "Danh từ", "Danh từ chỉ người", "Tính từ", "Trạng từ"], ["act (hành động)", "activity", "actor / actress", "active", "actively"], ["collect (sưu tầm)", "collection", "collector", "–", "–"], ["donate (quyên góp)", "donation", "donor", "–", "–"], ["relax (thư giãn)", "relaxation", "–", "relaxing / relaxed", "–"], ["use (dùng)", "use", "user", "useful", "usefully"], ["care (quan tâm)", "care", "–", "careful", "carefully"], ["interest (sự thích thú)", "interest", "–", "interesting / interested / uninteresting", "–"], ["music (âm nhạc)", "music", "musician", "musical", "–"], ["health (sức khỏe)", "health", "–", "healthy", "healthily"], ["tradition (truyền thống)", "tradition", "–", "traditional", "traditionally"], ["fame (danh tiếng)", "fame", "–", "famous", "–"], ["taste (vị)", "taste", "–", "tasty", "–"], ["regular (đều đặn)", "–", "–", "regular", "regularly"]]}, {"k": "mc", "n": 1, "q": "Mozart showed great ______ talent when he was just a little boy.", "root": "music", "opts": ["musically", "musician", "musical", "music"], "ans": 2, "say": "Mozart showed great musical talent when he was just a little boy.", "tr": "Mozart đã thể hiện tài năng âm nhạc tuyệt vời khi mới là cậu bé.", "ex": "Trước danh từ talent cần tính từ: music → musical."}, {"k": "mc", "n": 2, "q": "Your advice was very ______, saving me a lot of time.", "root": "use", "opts": ["user", "usefully", "use", "useful"], "ans": 3, "say": "Your advice was very useful, saving me a lot of time.", "tr": "Lời khuyên của bạn rất hữu ích, giúp tôi tiết kiệm nhiều thời gian.", "ex": "Sau very cần tính từ: use → useful."}, {"k": "mc", "n": 3, "q": "Our school organizes many outdoor ______ for students in the summer.", "root": "act", "opts": ["actors", "activities", "actively", "active"], "ans": 1, "say": "Our school organizes many outdoor activities for students in the summer.", "tr": "Trường chúng tôi tổ chức nhiều hoạt động ngoài trời cho học sinh vào mùa hè.", "ex": "Sau many + tính từ outdoor cần danh từ số nhiều: act → activities."}, {"k": "mc", "n": 4, "q": "He is fond of baseball stickers, he ______ hundreds of them every year.", "root": "collector", "opts": ["collecting", "collector", "collects", "collection"], "ans": 2, "say": "He is fond of baseball stickers, he collects hundreds of them every year.", "tr": "Cậu ấy thích hình dán bóng chày, mỗi năm cậu sưu tầm hàng trăm cái.", "ex": "Sau chủ ngữ he cần động từ, hiện tại đơn ngôi 3 số ít: collects."}, {"k": "mc", "n": 5, "q": "If you brush your teeth ______, you will prevent tooth decay.", "root": "regular", "opts": ["regularity", "regularly", "regular", "irregular"], "ans": 1, "say": "If you brush your teeth regularly, you will prevent tooth decay.", "tr": "Nếu bạn đánh răng đều đặn, bạn sẽ ngăn được sâu răng.", "ex": "Bổ nghĩa cho động từ brush cần trạng từ: regular → regularly."}, {"k": "mc", "n": 6, "q": "Smoking cigarettes causes serious damage to your ______.", "root": "healthy", "opts": ["healthily", "unhealthy", "health", "healthy"], "ans": 2, "say": "Smoking cigarettes causes serious damage to your health.", "tr": "Hút thuốc lá gây tổn hại nghiêm trọng cho sức khỏe của bạn.", "ex": "Sau tính từ sở hữu your cần danh từ: healthy → health."}, {"k": "mc", "n": 7, "q": "Our school organizes many outdoor ______ for students every weekend.", "root": "act", "opts": ["active", "act", "actors", "activities"], "ans": 3, "say": "Our school organizes many outdoor activities for students every weekend.", "tr": "Trường chúng tôi tổ chức nhiều hoạt động ngoài trời cho học sinh mỗi cuối tuần.", "ex": "Giống câu 3: activities."}, {"k": "mc", "n": 8, "q": "The dancers are wearing ______ Hungarian costume on stage.", "root": "traditionally", "opts": ["traditions", "traditional", "traditionally", "tradition"], "ans": 1, "say": "The dancers are wearing traditional Hungarian costume on stage.", "tr": "Các vũ công đang mặc trang phục truyền thống Hungary trên sân khấu.", "ex": "Trước cụm danh từ Hungarian costume cần tính từ: traditional."}, {"k": "mc", "n": 9, "q": "Trinh Cong Son was a talented ______ with hundreds of timeless songs.", "root": "music", "opts": ["musical", "music", "musician", "musically"], "ans": 2, "say": "Trinh Cong Son was a talented musician with hundreds of timeless songs.", "tr": "Trịnh Công Sơn là một nhạc sĩ tài năng với hàng trăm bài hát bất hủ.", "ex": "Sau a talented cần danh từ chỉ người: musician (nhạc sĩ)."}, {"k": "mc", "n": 10, "q": "My brother meet his friends ______ for coffee.", "root": "regular", "opts": ["regular", "irregular", "regularity", "regularly"], "ans": 3, "say": "My brother meet his friends regularly for coffee.", "tr": "Anh tôi thường xuyên gặp bạn bè đi uống cà phê.", "ex": "Bổ nghĩa cho động từ meet → regularly. (Đề gốc viết “meet”, đúng phải là meets.)"}, {"k": "mc", "n": 11, "q": "Taking a hot bath is a very ______ way to end a stressful day.", "root": "relax", "opts": ["relaxation", "relaxing", "relaxed", "relax"], "ans": 1, "say": "Taking a hot bath is a very relaxing way to end a stressful day.", "tr": "Tắm nước nóng là cách rất thư giãn để kết thúc một ngày căng thẳng.", "ex": "Tính từ -ing mô tả sự việc (a way) → relaxing."}, {"k": "mc", "n": 12, "q": "The charity organization ______ food and warm clothes for homeless people.", "root": "collect", "opts": ["collecting", "collection", "collector", "collects"], "ans": 3, "say": "The charity organization collects food and warm clothes for homeless people.", "tr": "Tổ chức từ thiện thu gom đồ ăn và quần áo ấm cho người vô gia cư.", "ex": "Chủ ngữ số ít the organization → collects."}, {"k": "mc", "n": 13, "q": "Johnny Depp is a very successful and talented ______.", "root": "act", "opts": ["actively", "activity", "actor", "active"], "ans": 2, "say": "Johnny Depp is a very successful and talented actor.", "tr": "Johnny Depp là một diễn viên rất thành công và tài năng.", "ex": "Sau a … talented cần danh từ chỉ người: actor."}, {"k": "mc", "n": 14, "q": "You should take better care of your ______ by eating more vegetables and fruit.", "root": "healthy", "opts": ["healthy", "unhealthy", "health", "healthily"], "ans": 2, "say": "You should take better care of your health by eating more vegetables and fruit.", "tr": "Bạn nên chăm sóc sức khỏe tốt hơn bằng cách ăn nhiều rau và trái cây.", "ex": "take care of + your + danh từ: health."}, {"k": "mc", "n": 15, "q": "She brushes her teeth ______ after every meal to prevent tooth decay.", "root": "regular", "opts": ["regular", "irregular", "regularity", "regularly"], "ans": 3, "say": "She brushes her teeth regularly after every meal to prevent tooth decay.", "tr": "Cô ấy đánh răng đều đặn sau mỗi bữa ăn để ngăn sâu răng.", "ex": "Bổ nghĩa cho động từ brushes: regularly."}, {"k": "mc", "n": 16, "q": "Every afternoon, Mr. Hung ______ eggs from the chickens in his backyard.", "root": "collector", "opts": ["collects", "collector", "collection", "collecting"], "ans": 0, "say": "Every afternoon, Mr. Hung collects eggs from the chickens in his backyard.", "tr": "Mỗi chiều, ông Hùng nhặt trứng gà ở sân sau.", "ex": "Chủ ngữ Mr. Hung số ít, thói quen (every afternoon) → collects."}, {"k": "mc", "n": 17, "q": "We felt very ______ after a long vacation at the beautiful beach.", "root": "relax", "opts": ["relaxed", "relaxation", "relaxing", "relax"], "ans": 0, "say": "We felt very relaxed after a long vacation at the beautiful beach.", "tr": "Chúng tôi thấy rất thư thái sau kỳ nghỉ dài ở bãi biển đẹp.", "ex": "Sau felt, chỉ cảm xúc của người → tính từ -ed: relaxed."}, {"k": "mc", "n": 18, "q": "This English dictionary is really ______ for students.", "root": "use", "opts": ["use", "useful", "user", "usefully"], "ans": 1, "say": "This English dictionary is really useful for students.", "tr": "Cuốn từ điển tiếng Anh này thật sự hữu ích cho học sinh.", "ex": "Sau really (bổ nghĩa cho is) cần tính từ: useful."}, {"k": "mc", "n": 19, "q": "Can you play any ______ instrument, Mai?", "root": "musician", "opts": ["musically", "musical", "music", "musician"], "ans": 1, "say": "Can you play any musical instrument, Mai?", "tr": "Mai, bạn có chơi được nhạc cụ nào không?", "ex": "musical instrument = nhạc cụ; trước danh từ cần tính từ."}, {"k": "mc", "n": 20, "q": "She often ______ old clothes for poor old people and children.", "root": "donation", "opts": ["donating", "donation", "donor", "donates"], "ans": 3, "say": "She often donates old clothes for poor old people and children.", "tr": "Cô ấy thường quyên góp quần áo cũ cho người già và trẻ em nghèo.", "ex": "Chủ ngữ she + often → động từ thêm -s: donates."}, {"k": "mc", "n": 21, "q": "Be ______! There is a warning sign about electricity here.", "root": "care", "opts": ["careful", "care", "carefully", "caring"], "ans": 0, "say": "Be careful! There is a warning sign about electricity here.", "tr": "Hãy cẩn thận! Ở đây có biển cảnh báo về điện.", "ex": "Be + tính từ: careful (cẩn thận)."}, {"k": "mc", "n": 22, "q": "What an ______ book! I really love it after I read it.", "root": "interest", "opts": ["interested", "interesting", "interestingly", "interest"], "ans": 1, "say": "What an interesting book! I really love it after I read it.", "tr": "Thật là một cuốn sách thú vị! Tôi rất thích sau khi đọc.", "ex": "What an + adj + N!; tính từ -ing mô tả vật: interesting."}, {"k": "mc", "n": 23, "q": "My sister doesn’t like Math. She thinks it’s ______ to her.", "root": "interest", "opts": ["interest", "interesting", "interested", "uninteresting"], "ans": 3, "say": "My sister doesn’t like Math. She thinks it’s uninteresting to her.", "tr": "Chị tôi không thích môn Toán. Chị ấy nghĩ nó chán.", "ex": "Ý tiêu cực (doesn’t like) → thêm tiền tố un-: uninteresting."}, {"k": "mc", "n": 24, "q": "How do you ______ after a hard-working day?", "root": "relax", "opts": ["relaxed", "relax", "relaxation", "relaxing"], "ans": 1, "say": "How do you relax after a hard-working day?", "tr": "Bạn thư giãn thế nào sau một ngày làm việc vất vả?", "ex": "Sau do you cần động từ nguyên mẫu: relax."}, {"k": "mc", "n": 25, "q": "Phở is one the most ______ food in Viet Nam.", "root": "fame", "opts": ["famously", "famous", "fame", "fames"], "ans": 1, "say": "Phở is one the most famous food in Viet Nam.", "tr": "Phở là một trong những món ăn nổi tiếng nhất ở Việt Nam.", "ex": "the most + tính từ (so sánh nhất): fame → famous."}, {"k": "mc", "n": 26, "q": "Folk music is a ______ music of a country or a group of people.", "root": "tradition", "opts": ["traditions", "tradition", "traditionally", "traditional"], "ans": 3, "say": "Folk music is a traditional music of a country or a group of people.", "tr": "Nhạc dân gian là âm nhạc truyền thống của một nước hoặc một nhóm người.", "ex": "Trước danh từ music cần tính từ: traditional."}, {"k": "mc", "n": 27, "q": "“Áo dài” is a ______ dress of Viet Nam.", "root": "tradition", "opts": ["traditional", "tradition", "traditions", "traditionally"], "ans": 0, "say": "“Áo dài” is a traditional dress of Viet Nam.", "tr": "Áo dài là trang phục truyền thống của Việt Nam.", "ex": "Trước danh từ dress: traditional."}, {"k": "mc", "n": 28, "q": "Our country has a lot of ______ food and music.", "root": "tradition", "opts": ["traditional", "tradition", "traditionally", "traditions"], "ans": 0, "say": "Our country has a lot of traditional food and music.", "tr": "Nước ta có nhiều món ăn và âm nhạc truyền thống.", "ex": "Trước danh từ food and music: traditional."}, {"k": "mc", "n": 29, "q": "______, people return home and gather with their family at Tết.", "root": "tradition", "opts": ["Tradition", "Traditional", "Traditions", "Traditionally"], "ans": 3, "say": "Traditionally, people return home and gather with their family at Tết.", "tr": "Theo truyền thống, mọi người về nhà và quây quần bên gia đình vào dịp Tết.", "ex": "Đứng đầu câu, trước dấu phẩy, bổ nghĩa cả câu → trạng từ: Traditionally."}, {"k": "mc", "n": 30, "q": "I really enjoy yellow sticky rice. It is very ______.", "root": "taste", "opts": ["taste", "tasty", "tastes", "tastily"], "ans": 1, "say": "I really enjoy yellow sticky rice. It is very tasty.", "tr": "Tôi rất thích xôi vò. Nó rất ngon.", "ex": "Sau very cần tính từ: taste → tasty (đề đã điền sẵn)."}]}, {"id": "p6", "name": "Phần VI", "title": "Sắp xếp từ thành câu", "steps": [{"k": "lesson", "title": "Kiến thức & cách làm – Phần VI", "lines": ["#CÁCH LÀM", "- Bước 1: Tìm chủ ngữ (thường đã cho sẵn sau dấu →).", "- Bước 2: Tìm động từ đã chia (helps, comes from, are…) hoặc động từ khuyết thiếu (can, should) + V.", "- Bước 3: Ghép tân ngữ, rồi nơi chốn, cuối cùng là thời gian.", "#CÔNG THỨC TRẬT TỰ CÂU", "* Chủ ngữ + (trạng từ tần suất) + Động từ + Tân ngữ + Nơi chốn + Thời gian", "> Ví dụ: My mum / often / cooks / phở / at home / on Sundays. → My mum often cooks phở at home on Sundays.", "#LƯU Ý", "- Trạng từ tần suất (always, usually, often, sometimes) đứng TRƯỚC động từ thường, SAU động từ to be.", "- can / should + V nguyên mẫu   (We should clean up…)", "- help + sb + V nguyên mẫu   (It helps you concentrate.)", "- V-ing có thể làm chủ ngữ   (Using a phone before bedtime…)", "- Địa danh nhỏ trước, lớn sau   (Bac Ninh in Viet Nam)", "- be famous for (nổi tiếng về) · come from (bắt nguồn từ)"]}, {"k": "build", "n": 1, "prefix": "", "tiles": ["Using", "our sleep", "before bedtime", "can", "a phone", "affect"], "answer": "Using a phone before bedtime can affect our sleep.", "end": ".", "say": "Using a phone before bedtime can affect our sleep.", "tr": "Dùng điện thoại trước giờ ngủ có thể ảnh hưởng đến giấc ngủ của chúng ta.", "ex": "V-ing làm chủ ngữ (Using a phone) + can + V (affect) + tân ngữ.", "src": "Using / our sleep / before bedtime / can / a phone / affect / . /"}, {"k": "build", "n": 2, "prefix": "", "tiles": ["comes from", "Quan Ho singing", "Bac Ninh", "Viet Nam", "in"], "answer": "Quan Ho singing comes from Bac Ninh in Viet Nam.", "end": ".", "say": "Quan Ho singing comes from Bac Ninh in Viet Nam.", "tr": "Hát Quan họ bắt nguồn từ Bắc Ninh, Việt Nam.", "ex": "come from = bắt nguồn từ; địa danh nhỏ đứng trước, lớn đứng sau (Bac Ninh in Viet Nam).", "src": "comes from / Quan Ho singing / . / Bac Ninh / Viet Nam / in /"}, {"k": "build", "n": 3, "prefix": "", "tiles": ["often", "helps", "poor people", "Our school", "in the neighbourhood"], "answer": "Our school often helps poor people in the neighbourhood.", "end": ".", "say": "Our school often helps poor people in the neighbourhood.", "tr": "Trường chúng tôi thường giúp đỡ người nghèo trong khu phố.", "ex": "S + often + V(s) + O + nơi chốn; trạng từ tần suất đứng trước động từ thường.", "src": "often / helps / poor people / Our school / in the neighbourhood / . /"}, {"k": "build", "n": 4, "prefix": "", "tiles": ["helps you", "A healthy breakfast", "school", "concentrate", "better at"], "answer": "A healthy breakfast helps you concentrate better at school.", "end": ".", "say": "A healthy breakfast helps you concentrate better at school.", "tr": "Bữa sáng lành mạnh giúp bạn tập trung tốt hơn ở trường.", "ex": "help + sb + V nguyên mẫu (helps you concentrate).", "src": "helps you / A healthy breakfast /school / concentrate / better at / . /"}, {"k": "build", "n": 5, "prefix": "", "tiles": ["clean up", "We", "the streets", "should", "every weekend"], "answer": "We should clean up the streets every weekend.", "end": ".", "say": "We should clean up the streets every weekend.", "tr": "Chúng ta nên dọn dẹp đường phố mỗi cuối tuần.", "ex": "should + V nguyên mẫu; trạng ngữ thời gian đặt cuối câu.", "src": "clean up / We / the streets / should / every weekend / . /"}, {"k": "build", "n": 6, "prefix": "", "tiles": ["Dong Ho paintings", "colours", "for", "their beautiful", "are famous"], "answer": "Dong Ho paintings are famous for their beautiful colours.", "end": ".", "say": "Dong Ho paintings are famous for their beautiful colours.", "tr": "Tranh Đông Hồ nổi tiếng với màu sắc đẹp.", "ex": "be famous for = nổi tiếng về.", "src": "Dong Ho paintings / colours / for / their beautiful / . / are famous /"}]}, {"id": "p7", "name": "Phần VII", "title": "Viết lại câu (4 dạng)", "steps": [{"k": "lesson", "title": "Kiến thức & cách làm – Phần VII", "lines": ["#CÁCH LÀM", "- Bước 1: Đọc câu gốc, xác định câu thuộc dạng nào trong 4 dạng dưới đây.", "- Bước 2: Nhìn phần đầu câu cho sẵn sau dấu → để chọn đúng công thức.", "- Bước 3: Viết lại, giữ nguyên nghĩa và các từ còn lại. Kiểm tra dạng động từ (V nguyên mẫu hay V-ing)."]}, {"k": "lesson", "title": "DẠNG 1: RỦ RÊ, ĐỀ NGHỊ", "lines": ["* Let’s + V nguyên mẫu …", "* Why don’t we + V nguyên mẫu …?", "* What about / How about + V-ing …?", "#Ba cấu trúc trên cùng nghĩa: “Chúng ta hãy…”, “…thì sao?”", "> Ví dụ 1: Let’s go swimming. → What about going swimming?", "> Ví dụ 2: How about watching a film? → Why don’t we watch a film?", "- Lưu ý: sau What about / How about → V-ing; sau Why don’t we → V nguyên mẫu. Có hai động từ thì đổi cả hai (read and listen → reading and listening)."]}, {"k": "build", "n": 1, "src": "Let’s skip rope in the playground after school.", "prefix": "What about", "tiles": ["skipping", "rope", "in", "the", "playground", "after", "school", "skip", "to"], "answer": "What about skipping rope in the playground after school?", "end": "?", "alt": [], "say": "What about skipping rope in the playground after school?", "tr": "Chơi nhảy dây ở sân trường sau giờ học thì sao?", "ex": "Let’s + V = What about / How about + V-ing.", "type": "Dạng 1"}, {"k": "build", "n": 2, "src": "Why don’t we read books and listen to music this evening?", "prefix": "What about", "tiles": ["reading", "books", "and", "listening", "to", "music", "this", "evening", "read", "listen"], "answer": "What about reading books and listening to music this evening?", "end": "?", "alt": [], "say": "What about reading books and listening to music this evening?", "tr": "Tối nay đọc sách và nghe nhạc thì sao?", "ex": "Why don’t we + V? = What about + V-ing? (cả hai động từ đều đổi sang V-ing).", "type": "Dạng 1"}, {"k": "build", "n": 3, "src": "How about practicing playing the guitar after dinner?", "prefix": "Why don’t", "tiles": ["we", "practise", "playing", "the", "guitar", "after", "dinner", "practising", "to"], "answer": "Why don’t we practise playing the guitar after dinner?", "end": "?", "alt": ["we practice playing the guitar after dinner"], "say": "Why don’t we practise playing the guitar after dinner?", "tr": "Sao chúng ta không tập chơi ghi-ta sau bữa tối nhỉ?", "ex": "How about + V-ing? = Why don’t we + V nguyên mẫu? (practise = practice).", "type": "Dạng 1"}, {"k": "lesson", "title": "DẠNG 2: LỜI KHUYÊN", "lines": ["* It’s a good idea (for sb) to + V = sb + should + V", "* It’s not a good idea (for sb) to + V = sb + shouldn’t + V", "> Ví dụ 1: It’s a good idea to drink more water. → You should drink more water.", "> Ví dụ 2: It’s not a good idea for students to stay up late. → Students shouldn’t stay up late.", "- Lưu ý: người trong “for sb” trở thành chủ ngữ. Không có “for sb” thì dùng You."]}, {"k": "build", "n": 4, "src": "It’s not a good idea for children to eat snacks before meals.", "prefix": "Children", "tiles": ["shouldn’t", "eat", "snacks", "before", "meals", "should", "to"], "answer": "Children shouldn’t eat snacks before meals.", "end": ".", "alt": [], "say": "Children shouldn’t eat snacks before meals.", "tr": "Trẻ em không nên ăn vặt trước bữa ăn.", "ex": "It’s not a good idea for sb to V = sb shouldn’t + V.", "type": "Dạng 2"}, {"k": "build", "n": 5, "src": "It’s not a good idea to use your smartphone while doing homework.", "prefix": "You shouldn’t", "tiles": ["use", "your", "smartphone", "while", "doing", "homework", "to", "using"], "answer": "You shouldn’t use your smartphone while doing homework.", "end": ".", "alt": [], "say": "You shouldn’t use your smartphone while doing homework.", "tr": "Bạn không nên dùng điện thoại khi làm bài tập về nhà.", "ex": "It’s not a good idea to V = You shouldn’t + V.", "type": "Dạng 2"}, {"k": "build", "n": 6, "src": "It’s a good idea to join a sports club to stay healthy.", "prefix": "You should", "tiles": ["join", "a", "sports", "club", "to", "stay", "healthy", "joining", "shouldn’t"], "answer": "You should join a sports club to stay healthy.", "end": ".", "alt": [], "say": "You should join a sports club to stay healthy.", "tr": "Bạn nên tham gia câu lạc bộ thể thao để khỏe mạnh.", "ex": "It’s a good idea to V = You should + V.", "type": "Dạng 2"}, {"k": "lesson", "title": "DẠNG 3: THÍCH CÁI NÀY HƠN CÁI KIA", "lines": ["* S + like + A + better than + B", "* = S + prefer + A + to + B   (A và B cùng dạng V-ing hoặc danh từ)", "> Ví dụ 1: Mai likes reading better than watching TV. → Mai prefers reading to watching TV.", "> Ví dụ 2: I prefer tea to coffee. → I like tea better than coffee.", "- Lưu ý: sau prefer dùng “to”, KHÔNG dùng “than”. Chủ ngữ ngôi 3 số ít: likes / prefers."]}, {"k": "build", "n": 7, "src": "Lan likes cooking better than doing the washing-up.", "prefix": "Lan prefers", "tiles": ["cooking", "to", "doing", "the", "washing-up", "than", "better"], "answer": "Lan prefers cooking to doing the washing-up.", "end": ".", "alt": [], "say": "Lan prefers cooking to doing the washing-up.", "tr": "Lan thích nấu ăn hơn rửa bát.", "ex": "like A better than B = prefer A to B (A, B đều V-ing).", "type": "Dạng 3"}, {"k": "build", "n": 8, "src": "Nam likes taking photos better than drawing pictures.", "prefix": "Nam prefers", "tiles": ["taking", "photos", "to", "drawing", "pictures", "than", "better"], "answer": "Nam prefers taking photos to drawing pictures.", "end": ".", "alt": [], "say": "Nam prefers taking photos to drawing pictures.", "tr": "Nam thích chụp ảnh hơn vẽ tranh.", "ex": "like A better than B = prefer A to B.", "type": "Dạng 3"}, {"k": "build", "n": 9, "src": "My classmates prefer doing sports to surfing the Internet.", "prefix": "My classmates like", "tiles": ["doing", "sports", "better", "than", "surfing", "the", "Internet", "to", "prefer"], "answer": "My classmates like doing sports better than surfing the Internet.", "end": ".", "alt": [], "say": "My classmates like doing sports better than surfing the Internet.", "tr": "Các bạn cùng lớp tôi thích chơi thể thao hơn lướt mạng.", "ex": "prefer A to B = like A better than B (chiều ngược lại của câu 3, 7).", "type": "Dạng 3"}, {"k": "lesson", "title": "DẠNG 4: SO SÁNH HƠN → SO SÁNH KHÔNG BẰNG", "lines": ["* A + is + adj-er / more + adj + than + B", "* = B + isn’t + as + adj + as + A   (đổi chỗ A và B, giữ nguyên tính từ gốc)", "> Ví dụ 1: My bag is heavier than your bag. → Your bag isn’t as heavy as my bag.", "> Ví dụ 2: Maths is more difficult than English. → English isn’t as difficult as Maths.", "- Lưu ý: bỏ -er và bỏ “more”, dùng tính từ gốc (cheaper → cheap, more expensive → expensive)."]}, {"k": "build", "n": 10, "src": "This book is more expensive than that one.", "prefix": "That book isn’t", "tiles": ["as", "expensive", "as", "this", "one", "more", "than"], "answer": "That book isn’t as expensive as this one.", "end": ".", "alt": [], "say": "That book isn’t as expensive as this one.", "tr": "Cuốn sách kia không đắt bằng cuốn này.", "ex": "A is more + adj than B = B isn’t as + adj + as A.", "type": "Dạng 4"}, {"k": "build", "n": 11, "src": "Watching a film at home is cheaper than watching it at the cinema.", "prefix": "Watching a film at the cinema is not", "tiles": ["as", "cheap", "as", "watching", "it", "at", "home", "cheaper", "than"], "answer": zing, beHIND)", "#CÁCH LÀM", "- Đọc to từng từ, ghi phiên âm phần gạch chân hoặc đánh dấu âm tiết được nhấn, rồi tìm từ khác ba từ còn lại."]}, {"k": "sound", "n": 1, "q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "opts": ["wash[ed]", "want[ed]", "visit[ed]", "start[ed]"], "ans": 0, "ex": "washed /t/; wanted, visited, started /ɪd/. Sau âm /ʃ/ → -ed đọc /t/; sau /t/ → /ɪd/."}, {"k": "sound", "n": 2, "q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "opts": ["f[i]t", "mus[i]c", "l[i]ke", "d[i]ffer"], "ans": 2, "ex": "like /aɪ/; fit, music, differ /ɪ/."}, {"k": "sound", "n": 3, "q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "opts": ["need[ed]", "collect[ed]", "laugh[ed]", "decid[ed]"], "ans": 2, "ex": "laughed /t/ (gh đọc /f/); needed, collected, decided /ɪd/."}, {"k": "sound", "n": 4, "q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "opts": ["r[i]ce", "spr[i]ng", "m[i]neral", "dr[i]nk"], "ans": 0, "ex": "rice /aɪ/; spring, mineral, drink /ɪ/."}, {"k": "sound", "n": 5, "q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "opts": ["play[ed]", "enjoy[ed]", "call[ed]", "stopp[ed]"], "ans": 3, "ex": "stopped /t/ (sau /p/); played, enjoyed, called /d/."}, {"k": "sound", "n": 6, "q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "opts": ["beh[i]nd", "art[i]st", "vis[i]t", "favour[i]te"], "ans": 0, "ex": "behind /aɪ/; artist, visit, favourite /ɪ/."}, {"k": "sound", "n": 7, "q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "opts": ["ma[ch]ine", "[ch]ef", "[sh]are", "kit[ch]en"], "ans": 3, "ex": "machine, chef (ch gốc tiếng Pháp) và share đều đọc /ʃ/; kitchen đọc /tʃ/ → D. (Đề đã sửa B. church thành B. chef.)"}, {"k": "sound", "n": 8, "q": "Chọn từ có phần gạch chân phát âm khác các từ còn lại.", "opts": ["l[i]ve", "l[i]ne", "l[i]ght", "l[i]fe"], "ans": 0, "ex": "live (động từ: sống) /ɪ/; line, light, life /aɪ/."}, {"k": "sound", "n": 9, "q": "Chọn từ có trọng âm khác các từ còn lại.",   if (sec().ptr && x.p != null) m += `<details><summary class="k" style="cursor:pointer">Dịch cả bài đọc</summary><p>${esc(sec().ptr[x.p])}</p></details>`;
  $('#msg').innerHTML = m;
  $('#btns').innerHTML = `${x.k !== 'sound' && x.k !== 'cloze' ? `<button class="big blue" id="sayA">Nghe câu đúng</button>` : ''}<button class="big ghost" id="retry">Làm lại câu</button><button class="big ${ok ? '' : 'red'}" id="next">Tiếp tục</button>`;
}

/* ---------- actions ---------- */
function go(sIdx, stepIdx) {
  st.sec = sIdx; st.step = Math.max(0, Math.min(stepIdx, sec().steps.length));
  cur = {sel: null, built: [], checked: false};
  try { history.replaceState(null, '', '#' + sec().id); } catch (e) {}
  render(); $('#main').scrollTop = 0;
}
function check(reveal) {
  const x = step();
  let ok;
  if (reveal) { ok = false; if (x.k === 'build') cur.built = x.solution.slice(); else cur.sel = x.ans; }
  else if (x.k === 'build') {
    const got = norm((x.prefix ? x.prefix + ' ' : '') + cur.built.map(i => x.tiles[i]).join(' '));
    ok = [x.answer, ...(x.alt || []).map(a => x.prefix + ' ' + a)].some(a => norm(a) === got);
  } else ok = cur.sel === x.ans;
  cur.checked = true;
  st.ans[key()] = {ok: reveal ? false : ok, sel: cur.sel, built: cur.built.slice(), rev: !!reveal};
  store.set('ans', st.ans);
  if (!reveal) tone(ok);
  render();
  if (!ok && !reveal) { const c = $('#stage .line, #stage .opts'); if (c) c.classList.add('shake'); }
  const vis = $('#stage .line, #stage .opts'); if (vis) vis.scrollIntoView({block: 'nearest'});
  if (x.k === 'sound') speak(plainWord(x.opts[x.ans]));
  else if (x.say && (ok || reveal)) speak(x.say);
}
function next() { go(st.sec, st.step + 1); }
function sayQuestion() {
  const x = step(); if (!x) return;
  if (x.k === 'build') return speak(cur.checked ? x.say : x.src && x.prefix ? x.src : x.say);
  if (x.k === 'sound') return speak(x.opts.map(plainWord).join(', '));
  if (x.k === 'cloze') return sayPassage();
  speak(cur.checked ? x.say : x.q + (x.img ? '' : ''));
}
function sayPassage() {
  const s = sec(), x = step(); if (x.p == null) return;
  const t = s.passages[x.p].replace(/\{(\d+)\}/g, (m, n) => { const i = s.steps.findIndex(z => z.n === +n && z.k === 'cloze'); return st.ans[s.id + ':' + i] ? s.fill[n] : ' ... '; });
  speak(t);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,.mini'); if (!t) return;
  if (t.classList.contains('mini')) { e.stopPropagation(); return speak(plainWord(step().opts[+t.dataset.w])); }
  if (t.dataset.s != null) return go(+t.dataset.s, 0);
  if (t.dataset.i != null) return go(st.sec, +t.dataset.i);
  if (t.dataset.o != null && !cur.checked) { cur.sel = +t.dataset.o; render(); if (step().k === 'sound') speak(plainWord(step().opts[cur.sel])); return; }
  if (t.dataset.t != null && !cur.checked) { const ti = +t.dataset.t; if (!cur.built.includes(ti)) { cur.built.push(ti); render(); } return; }
  if (t.dataset.b != null && !cur.checked) { cur.built.splice(+t.dataset.b, 1); render(); return; }
  switch (t.id) {
    case 'check': return check(false);
    case 'reveal': return check(true);
    case 'next': return next();
    case 'prev': return go(st.sec, st.step - 1);
    case 'retry': delete st.ans[key()]; store.set('ans', st.ans); cur = {sel: null, built: [], checked: false}; return render();
    case 'sayQ': return sayQuestion();
    case 'sayP': return sayPassage();
    case 'sayA': return speak(step().say);
    case 'reset': sec().steps.forEach((x, i) => delete st.ans[sec().id + ':' + i]); store.set('ans', st.ans); return go(st.sec, 0);
    case 'nextSec': return go(st.sec + 1, 0);
    case 'zUp': return zoom(2);
    case 'zDown': return zoom(-2);
    case 'trBtn': st.showTr = !st.showTr; store.set('tr', st.showTr); t.classList.toggle('on', st.showTr); return render();
    case 'sfxBtn': st.sfx = !st.sfx; store.set('sfx', st.sfx); t.classList.toggle('on', st.sfx); return;
    case 'fsBtn': return toggleFs();
  }
});
function zoom(d) { st.z = Math.max(14, Math.min(40, st.z + d)); document.documentElement.style.setProperty('--z', st.z + 'px'); store.set('z', st.z); }
function toggleFs() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }
document.addEventListener('keydown', e => {
  if (e.target.matches('select,input,textarea')) return;
  const x = step();
  if (e.key >= '1' && e.key <= '4' && x && x.opts && !cur.checked && +e.key <= x.opts.length) { cur.sel = +e.key - 1; render(); if (x.k === 'sound') speak(plainWord(x.opts[cur.sel])); }
  else if (e.key === 'Enter') { e.preventDefault(); if (!x || x.k === 'lesson' || cur.checked) { if (st.step < sec().steps.length) next(); } else if ($('#check') && !$('#check').disabled) check(false); }
  else if (e.key === ' ') { e.preventDefault(); sayQuestion(); }
  else if (e.key === 'ArrowRight') go(st.sec, st.step + 1);
  else if (e.key === 'ArrowLeft') go(st.sec, st.step - 1);
  else if (e.key === 't' || e.key === 'T') $('#trBtn').click();
  else if (e.key === 'f' || e.key === 'F') toggleFs();
  else if (e.key === '+' || e.key === '=') zoom(2);
  else if (e.key === '-') zoom(-2);
  else if (e.key === 'Backspace' && x && x.k === 'build' && !cur.checked && cur.built.length) { cur.built.pop(); render(); }
});

/* ---------- prepare build steps ---------- */
function seeded(n) { let s = n * 9973 + 7; return () => (s = s * 16807 % 2147483647) / 2147483647; }
DATA.forEach((s, si) => s.steps.forEach((x, i) => {
  if (x.k !== 'build') return;
  const r = seeded(si * 100 + i);
  x.order = x.tiles.map((_, k) => k).sort(() => r() - .5);
  const target = norm(x.answer).split(' '); const pre = x.prefix ? norm(x.prefix).split(' ').length : 0;
  const words = target.slice(pre); const used = new Set(); const sol = [];
  let pos = 0;
  while (pos < words.length) {
    let found = -1, len = 0;
    x.tiles.forEach((tl, k) => { if (used.has(k)) return; const tw = norm(tl).split(' '); if (tw.length > len && tw.every((w, j) => words[pos + j] === w)) { found = k; len = tw.length; } });
    if (found < 0) break; used.add(found); sol.push(found); pos += len;
  }
  x.solution = sol;
}));

document.documentElement.style.setProperty('--z', st.z + 'px');
$('#trBtn').classList.toggle('on', st.showTr);
$('#sfxBtn').classList.toggle('on', st.sfx);
const h = location.hash.slice(1); const hi = DATA.findIndex(s => s.id === h);
go(hi >= 0 ? hi : 0, 0);
addEventListener('hashchange', () => { const j = DATA.findIndex(s => s.id === location.hash.slice(1)); if (j >= 0 && j !== st.sec) go(j, 0); });
}
</script>
</body>
