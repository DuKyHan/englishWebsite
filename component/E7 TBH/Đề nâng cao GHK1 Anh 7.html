<title>Đề nâng cao GHK1 Anh 7</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:wght@600;700&display=swap">
<style>
/* Layout: exam paper column (max 820px). Home = grid of exam cards; exam view = parts I–VII like the printed test, sticky bottom bar with progress and submit. */
:root{
  --bg:#F4F6F9; --paper:#FFFFFF; --ink:#1B2433; --muted:#5B6576; --line:#D7DEE8;
  --navy:#1F3864; --navy-soft:#DCE6F2; --green:#385623; --green-soft:#E2EFDA; --green-pale:#F3F8EF;
  --good:#2E8B4A; --good-soft:#DFF3E5; --bad:#C2413B; --bad-soft:#FBE4E2; --sun:#E0A100; --sun-soft:#FFF4D6;
  --display:"Lora",Georgia,"Times New Roman",serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151D; --paper:#171E29; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2B3545;
  --navy:#9DB8E8; --navy-soft:#1E2B42; --green:#9CCB7A; --green-soft:#1D2C1A; --green-pale:#18231A;
  --good:#5BC27A; --good-soft:#163222; --bad:#F07C75; --bad-soft:#3A1C1B; --sun:#F2C14E; --sun-soft:#3A2F12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151D; --paper:#171E29; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2B3545;
  --navy:#9DB8E8; --navy-soft:#1E2B42; --green:#9CCB7A; --green-soft:#1D2C1A; --green-pale:#18231A;
  --good:#5BC27A; --good-soft:#163222; --bad:#F07C75; --bad-soft:#3A1C1B; --sun:#F2C14E; --sun-soft:#3A2F12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--navy)}
.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--display);color:var(--navy);font-size:19px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.timer{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;font-size:15px}
main{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
h1,h2,h3{font-family:var(--display);color:var(--navy);margin:0;text-wrap:balance}
h1{font-size:24px} h2{font-size:20px}
p{margin:6px 0}
.muted{color:var(--muted)}
.tip{background:var(--sun-soft);border-radius:10px;padding:10px 14px;font-size:15px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.ex{border:1px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--paper);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.ex:hover{border-color:var(--navy)}
.ex b{font-family:var(--display);font-size:21px;color:var(--navy)}
.ex span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex.rand{background:var(--green-pale);border-color:var(--green)}
.ex.rand b{color:var(--green)}
.ex .badge{align-self:flex-start;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--navy-soft);color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}
th{background:var(--navy-soft);color:var(--navy)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
/* exam paper */
.part{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.ph{background:var(--navy-soft);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ph h3{font-size:16px;font-family:var(--body);font-weight:700}
.ph span{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap}
.pinstr{padding:8px 16px 0;font-size:14px;font-style:italic;color:var(--muted)}
.passage{margin:10px 16px;padding:12px 14px;background:var(--green-pale);border-radius:10px;font-size:15px}
.passage p{text-indent:1.4em;margin:0 0 8px;text-align:justify}
.gap{font-weight:700;color:var(--navy);white-space:nowrap}
.entry{margin:10px 16px;padding:10px 14px;border:1px dashed var(--green);border-radius:10px;background:var(--green-pale);font-size:15px}
.entry ul{margin:4px 0 0;padding-left:20px}
.entry li{font-style:italic}
.q{padding:10px 16px;border-top:1px solid var(--line);scroll-margin-top:80px}
.stem{display:flex;gap:10px;align-items:flex-start}
.qn{flex:none;min-width:34px;height:26px;padding:0 6px;border-radius:7px;background:var(--navy-soft);color:var(--navy);font-weight:700;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.q.answered .qn{background:var(--navy);color:var(--paper)}
.st{min-width:0;padding-top:1px}
.sign{display:block;max-height:130px;width:auto;border-radius:8px;border:1px solid var(--line);background:#fff;margin:2px 0 6px}
.opts{display:grid;gap:6px;margin:8px 0 2px 44px}
.opts.short{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.tf{grid-template-columns:repeat(2,minmax(0,160px))}
.opt{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);border-bottom-width:3px;background:var(--paper);border-radius:9px;padding:6px 10px;min-width:0;font-size:15px}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt u{text-decoration-thickness:2px;text-underline-offset:3px}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt.sel .k{background:var(--navy);color:var(--paper)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.typ{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 2px 44px}
.typ .prefix{font-weight:600}
.typ input{flex:1;min-width:160px;border:1px solid var(--line);border-bottom-width:3px;border-radius:9px;padding:7px 10px;font:inherit;background:var(--paper);color:var(--ink)}
.typ input.okk{border-color:var(--good);background:var(--good-soft)}
.typ input.bad{border-color:var(--bad);background:var(--bad-soft)}
.cue{color:var(--green)}
.fb{margin:8px 0 2px 44px;padding:8px 12px;border-radius:9px;font-size:14px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb .t{font-weight:700}
.fb.good .t{color:var(--good)} .fb.bad .t{color:var(--bad)}
.hideok .q.correct{display:none}
/* bottom bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--navy);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.foot .bar{flex:1;min-width:120px;height:10px;background:var(--navy-soft);border-radius:99px;overflow:hidden}
.foot .bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .3s}
.foot .cnt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--navy);color:var(--paper)}
.btn.green{background:var(--green);color:var(--paper)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* result */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.big{font-family:var(--display);font-size:56px;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--navy-soft);border-radius:99px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--good)}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wl a{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--bad-soft);color:var(--bad);text-decoration:none;font-weight:700}
.confirm{background:var(--sun-soft);border-radius:10px;padding:10px 12px;font-size:14px}
@media (max-width:560px){
  .opts,.typ,.fb{margin-left:0}
  .opts.short{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.prof{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.prof label{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}.prof input{flex:none;width:100%;box-sizing:border-box}
.perr{color:var(--bad);font-weight:600;margin:8px 0 0}
.chunk{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:2px 2px;background:var(--navy-soft);color:var(--ink);font-weight:500}
.say{border:0;background:var(--navy-soft);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:14px;margin:0 2px}
</style>

the party either.", "start": "Lan and", "answers": ["Lan and her brother didn’t go to the party.", "Lan and her brother did not go to the party."], "expl": "Hai chủ ngữ cùng (không) làm một việc → A and B + didn’t + V.", "full": "Lan and her brother didn’t go to the party."}]}, "d1-gap": {"id": "d1-gap", "title": "Điền từ", "sub": "", "passage": ["Do you have a hobby? Many experts say that a hobby can (1) ______ your life better. First of all, hobbies help you relax after hours of (2) ______ at school. When you focus on something you love, you forget about your worries. Secondly, some hobbies, such as gardening or cycling, keep you physically (3) ______. Others, like playing chess or doing puzzles, train your brain. Hobbies are also a great way to make friends (4) ______ you can meet people with the same interests in clubs. However, you should not spend too much time on your hobby (5) ______ forget your homework. Choose a hobby that suits you, and enjoy (6) ______ it!"], "qs": [{"t": "choice", "kind": "gap", "prompt": "", "opts": ["get", "take", "make", "do"], "ans": 2, "expl": "<b>make<\/b> + O + adj: make your life better = làm cuộc sống tốt hơn.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["study", "studied", "studying", "studies"], "ans": 2, "expl": "Sau giới từ of → V-ing: hours of <b>studying<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["action", "actively", "activity", "active"], "ans": 3, "expl": "keep + O + adj: keep you physically <b>active<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["because", "so", "but", "although"], "ans": 0, "expl": "Vế sau giải thích LÝ DO kết bạn được → <b>because<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["and", "so", "but", "or"], "ans": 0, "expl": "Hai hành động cùng chiều (dành quá nhiều thời gian VÀ quên bài) → <b>and<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["done", "doing", "do", "to do"], "ans": 1, "expl": "enjoy + V-ing → enjoy <b>doing<\/b> it.", "img": null, "fixed": false, "html": true}]}, "d1-tf": {"id": "d1-tf", "title": "Đọc hiểu", "sub": "", "passage": ["Linh used to be a very unhealthy girl. She hardly ever did exercise, and she ate a lot of crisps and sweets while watching TV. She often felt tired and caught colds easily. Last year, her doctor told her to change her lifestyle. Since then, Linh has changed a lot. Now she gets up at six and goes jogging with her father for thirty minutes. She has replaced sweets with fresh fruit, and she drinks at least two litres of water a day. She still watches TV, but only for one hour in the evening. As a result, she has lost five kilos and she rarely gets ill. Linh says that the most difficult thing was giving up sweets, but now she does not miss them at all."], "qs": [{"t": "tf", "kind": "tf", "prompt": "Linh used to do a lot of exercise.", "ans": 1, "expl": "“She hardly ever did exercise.” → hầu như không tập."}, {"t": "tf", "kind": "tf", "prompt": "Her doctor advised her to change her lifestyle.", "ans": 0, "expl": "“her doctor told her to change her lifestyle.”"}, {"t": "tf", "kind": "tf", "prompt": "Linh goes jogging alone every morning.", "ans": 1, "expl": "“goes jogging with her father” → chạy cùng bố."}, {"t": "tf", "kind": "tf", "prompt": "She now watches TV for only one hour in the evening.", "ans": 0, "expl": "“She still watches TV, but only for one hour in the evening.”"}, {"t": "choice", "kind": "tfmc", "prompt": "What is the result of Linh’s new lifestyle?", "opts": ["She feels tired all day.", "She has lost weight and rarely gets ill.", "She often catches colds.", "She has gained five kilos."], "ans": 1, "expl": "“she has lost five kilos and she rarely gets ill.”", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "tfmc", "prompt": "The word “them” in the last sentence refers to ________.", "opts": ["colds", "kilos", "vegetables", "sweets"], "ans": 3, "expl": "“giving up sweets, but now she does not miss <b>them<\/b>” → them = sweets.", "img": null, "fixed": false, "html": true}]}, "d2": {"id": "d2", "title": "Đề 2", "sub": "", "passage": null, "qs": [{"t": "choice", "kind": "pron", "prompt": "", "opts": ["play<u>ed<\/u>", "enjoy<u>ed<\/u>", "relax<u>ed<\/u>", "stay<u>ed<\/u>"], "ans": 2, "expl": "relaxed /rɪˈlækst/: âm cuối /s/ (x = /ks/) → /t/; played, enjoyed, stayed → /d/.", "fixed": false, "html": true}, {"t": "choice", "kind": "pron", "prompt": "", "opts": ["<u>a<\/u>lone", "<u>a<\/u>ctive", "<u>a<\/u>head", "<u>a<\/u>wake"], "ans": 1, "expl": "active /ˈæktɪv/: a được nhấn → /æ/; alone, ahead, awake: a không nhấn → /ə/.", "fixed": false, "html": true}, {"t": "choice", "kind": "stress", "prompt": "", "opts": ["obesity", "activity", "community", "vegetable"], "ans": 3, "expl": "ˈvegetable nhấn âm 1; oˈbesity, acˈtivity, comˈmunity nhấn âm 2 (âm trước -ity).", "fixed": false, "html": true}, {"t": "choice", "kind": "stress", "prompt": "", "opts": ["allergy", "avoid", "protein", "fitness"], "ans": 1, "expl": "aˈvoid (động từ) nhấn âm 2; ˈallergy, ˈprotein, ˈfitness nhấn âm 1.", "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "You should eat more food that is ________ in fibre, such as beans and vegetables.", "opts": ["rich", "low", "poor", "lack"], "ans": 0, "expl": "be <b>rich in<\/b> = giàu (chất gì).", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "She has a ________ throat, so she can’t sing today.", "opts": ["hurt", "sore", "ache", "pain"], "ans": 1, "expl": "a <b>sore throat<\/b> = đau họng.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "Junk food contains a lot of ________, so eating too much of it can make you fat.", "opts": ["fibre", "vitamins", "minerals", "calories"], "ans": 3, "expl": "Nhiều <b>calories<\/b> (ca-lo) → dễ béo.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "Some kinds of seafood can cause ________ in people who are sensitive to them.", "opts": ["sunburn", "allergies", "toothache", "obesity"], "ans": 1, "expl": "Nhạy cảm với hải sản → <b>allergies<\/b> (dị ứng).", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "Doctors advise teenagers to do at least 60 minutes of physical ________ every day.", "opts": ["action", "activity", "active", "actor"], "ans": 1, "expl": "physical + danh từ → physical <b>activity<\/b> = hoạt động thể chất.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "Washing your hands with soap is a simple way to ________ the spread of germs.", "opts": ["produce", "protect", "provide", "prevent"], "ans": 3, "expl": "<b>prevent<\/b> the spread = ngăn chặn sự lây lan.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "How often ________ your sister ________ to the dentist?", "opts": ["does – go", "do – go", "is – going", "does – goes"], "ans": 0, "expl": "Câu hỏi hiện tại đơn: How often + <b>does<\/b> + S số ít + <b>V nguyên mẫu<\/b>?", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "He wants to stay healthy, ________ he goes swimming three times a week.", "opts": ["so", "but", "because", "or"], "ans": 0, "expl": "Muốn khỏe (nguyên nhân) → đi bơi (kết quả) → <b>so<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "My little brother is afraid ________ going to the dentist.", "opts": ["at", "with", "for", "of"], "ans": 3, "expl": "be afraid <b>of<\/b> + V-ing.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "- I think we should eat less fast food. - ________", "opts": ["Yes, please.", "I agree with you.", "Thank you.", "I luntary", "ans": ["volunteers"], "pos": "n", "expl": "Thousands of + danh từ số nhiều chỉ người → <b>volunteers<\/b>."}, {"t": "type", "kind": "wf", "prompt": "Her opinion about healthy food _____ from mine.", "cue": "different", "ans": ["differs"], "pos": "v", "expl": "Cần động từ; chủ ngữ số ít → <b>differs<\/b> from = khác với."}, {"t": "type", "kind": "wf", "prompt": "You should brush your teeth _____ – at least twice a day.", "cue": "regular", "ans": ["regularly"], "pos": "adv", "expl": "Bổ nghĩa cho động từ brush → trạng từ <b>regularly<\/b>."}, {"t": "build", "kind": "rearr", "prompt": "help / Green vegetables / strong / your body / and healthy / stay / .", "start": "Green vegetables", "answers": ["Green vegetables help your body stay strong and healthy."], "expl": "Hiện tại đơn: S (số nhiều) + help + O + V + adj.", "full": "Green vegetables help your body stay strong and healthy."}, {"t": "build", "kind": "rearr", "prompt": "a lot of / because / Nam / junk food / put on weight / ate / he / .", "start": "Nam", "answers": ["Nam put on weight because he ate a lot of junk food."], "expl": "Quá khứ đơn: S + V2 + because + S + V2 + O.", "full": "Nam put on weight because he ate a lot of junk food."}, {"t": "build", "kind": "trans", "prompt": "Do you enjoy cooking for your family?", "start": "Are you", "answers": ["Are you keen on cooking for your family?", "Are you fond of cooking for your family?", "Are you interested in cooking for your family?", "Are you into cooking for your family?"], "expl": "Do you enjoy + V-ing? = Are you keen on / fond of / interested in + V-ing?", "full": "Are you keen on cooking for your family?"}, {"t": "build", "kind": "trans", "prompt": "It’s not a good idea to eat late at night.", "start": "You shouldn’t", "answers": ["You shouldn’t eat late at night.", "You should not eat late at night."], "expl": "It’s not a good idea to + V = You shouldn’t + V.", "full": "You shouldn’t eat late at night."}, {"t": "build", "kind": "trans", "prompt": "Let’s join the volunteer club this summer.", "start": "How", "answers": ["How about joining the volunteer club this summer?", "What about joining the volunteer club this summer?"], "expl": "Let’s + V = How about / What about + V-ing?", "full": "How about joining the volunteer club this summer?"}, {"t": "build", "kind": "trans", "prompt": "My mother goes to the market. Then she cooks lunch for us.", "start": "My mother", "answers": ["My mother goes to the market and cooks lunch for us.", "My mother goes to the market and then cooks lunch for us."], "expl": "Cùng chủ ngữ, hai hành động nối tiếp → S + V1 and V2.", "full": "My mother goes to the market and cooks lunch for us."}]}, "d2-gap": {"id": "d2-gap", "title": "Điền từ", "sub": "", "passage": ["Staying healthy is not difficult if you follow some simple tips. First, you should eat a balanced diet with plenty of fruit and vegetables. Try to (1) ______ junk food and soft drinks because they contain too much sugar and fat. Second, drink enough water every day. Water helps your body (2) ______ properly. Third, take regular exercise. You don’t need to go to the gym; walking, cycling or even dancing is good (3) ______ you. Fourth, get enough sleep. Teenagers need about eight to nine hours of sleep a night, (4) ______ many of them go to bed too late. Finally, keep yourself clean. Wash your hands (5) ______ before meals to prevent diseases. If you follow these tips, you will feel (6) ______ and happier."], "qs": [{"t": "choice", "kind": "gap", "prompt": "", "opts": ["keep", "prevent", "avoid", "enjoy"], "ans": 2, "expl": "<b>avoid<\/b> junk food = tránh đồ ăn vặt (vì nhiều đường, mỡ).", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["works", "working", "work", "worked"], "ans": 2, "expl": "help + O + V nguyên mẫu → help your body <b>work<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["at", "with", "for", "to"], "ans": 2, "expl": "be good <b>for<\/b> sb = tốt cho ai.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["so", "or", "but", "because"], "ans": 2, "expl": "Cần ngủ 8–9 tiếng >< nhiều bạn ngủ muộn → <b>but<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["carefully", "care", "careful", "careless"], "ans": 0, "expl": "Bổ nghĩa cho động từ wash → trạng từ <b>carefully<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["health", "healthy", "healthily", "healthier"], "ans": 3, "expl": "feel + tính từ, song song với “happier” → so sánh hơn <b>healthier<\/b>.", "img": null, "fixed": false, "html": true}]}, "d2-tf": {"id": "d2-tf", "title": "Đọc hiểu", "sub": "", "passage": ["Every summer, hundreds of students in our city join the “Green Summer” campaign. The campaign started in 2015 with only fifty volunteers, but it has become more and more popular. Volunteers are divided into small groups. Some groups go to remote villages to teach children English and Maths. Others help farmers repair roads and build small bridges. Volunteers have to bring their own clothes and medicine, and they often stay in local people’s houses. Life there is quite hard: there is no air conditioner, and sometimes there is no electricity at night. However, most volunteers say that it is the most meaningful summer of their lives. They learn how to live independently, and they understand that they are luckier than many other children."], "qs": [{"t": "tf", "kind": "tf", "prompt": "The Green Summer campaign started with hundreds of volunteers.", "ans": 1, "expl": "“started in 2015 with only fifty volunteers.”"}, {"t": "tf", "kind": "tf", "prompt": "Some volunteers teach children in remote villages.", "ans": 0, "expl": "“Some groups go to remote villages to teach children English and Maths.”"}, {"t": "tf", "kind": "tf", "prompt": "Volunteers stay in hotels during the campaign.", "ans": 1, "expl": "“they often stay in local people’s houses.”"}, {"t": "tf", "kind": "tf", "prompt": "Life in the villages is not easy for the volunteers.", "ans": 0, "expl": "“Life there is quite hard.”"}, {"t": "choice", "kind": "tfmc", "prompt": "What do volunteers NOT do in the campaign?", "opts": ["sell farm products", "teach English and Maths", "repair roads", "build small bridges"], "ans": 0, "expl": "Bài nói dạy học, sửa đường, xây cầu; không nói bán nông sản.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "tfmc", "prompt": "What do volunteers learn from the campaign?", "opts": ["how to live independently", "how to make money", "how to build houses", "how to use an air conditioner"], "ans": 0, "expl": "“They learn how to live independently.”", "img": null, "fixed": false, "html": true}]}, "d3": {"id": "d3", "title": "Đề 3", "sub": "", "passage": null, "qs": [{"t": "choice", "kind": "pron", "prompt": "", "opts": ["need<u>ed<\/u>", "start<u>ed<\/u>", "join<u>ed<\/u>", "add<u>ed<\/u>"], "ans": 2, "expl": "joined /dʒɔɪnd/ → /d/; needed, started, added tận cùng /d/, /t/ → /ɪd/.", "fixed": false, "html": true}, {"t": "choice", "kind": "pron", "prompt": "", "opts": ["p<u>i<\/u>cture", "f<u>i<\/u>tness", "pr<u>i<\/u>vate", "l<u>i<\/u>sten"], "ans": 2, "expl": "private /ˈpraɪvət/: i → /aɪ/; picture, fitness, listen: i → /ɪ/.", "fixed": false, "html": true}, {"t": "choice", "kind": "stress", "prompt": "", "opts": ["elderly", "charity", "donation", "orphanage"], "ans": 2, "expl": "doˈnation nhấn âm 2 (âm trước -tion); ˈelderly, ˈcharity, ˈorphanage nhấn âm 1.", "fixed": false, "html": true}, {"t": "choice", "kind": "stress", "prompt": "", "opts": ["remote", "village", "project", "donor"], "ans": 0, "expl": "reˈmote nhấn âm 2; ˈvillage, ˈproject (danh từ), ˈdonor nhấn âm 1.", "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "The volunteers spent the whole morning ________ rubbish on the b ": "<b>while<\/b> = trong khi (họ đang chọn đồ).", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["because", "so", "or", "but"], "ans": 3, "expl": "Cuộc sống khó khăn >< luôn mỉm cười → <b>but<\/b>.", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "gap", "prompt": "", "opts": ["kindness", "unkind", "kindly", "kind"], "ans": 0, "expl": "an act of + danh từ → <b>kindness<\/b> (lòng tốt).", "img": null, "fixed": false, "html": true}]}, "d3-tf": {"id": "d3-tf", "title": "Đọc hiểu", "sub": "", "passage": ["Nowadays, many teenagers spend most of their free time on smartphones. However, my cousin Huy is different. He is crazy about birdwatching. Every Sunday morning, he cycles to a park near the river with his binoculars and a notebook. He sits quietly for hours and writes down the names of the birds he sees. So far, he has recorded more than forty kinds of birds. Huy says that birdwatching teaches him to be patient, and it helps him learn a lot about nature. At first, his parents thought it was a strange hobby, but now they support him. Last month, they bought him a good camera so that he could take photos of rare birds. Huy hopes to become a scientist who protects wild animals in the future."], "qs": [{"t": "tf", "kind": "tf", "prompt": "Huy spends most of his free time on his smartphone.", "ans": 1, "expl": "“many teenagers spend… on smartphones. However, my cousin Huy is different.”"}, {"t": "tf", "kind": "tf", "prompt": "He goes birdwatching every Sunday morning.", "ans": 0, "expl": "“Every Sunday morning, he cycles to a park…”"}, {"t": "tf", "kind": "tf", "prompt": "His parents have always liked his hobby.", "ans": 1, "expl": "“At first, his parents thought it was a strange hobby.”"}, {"t": "tf", "kind": "tf", "prompt": "Huy’s parents gave him a camera last month.", "ans": 0, "expl": "“Last month, they bought him a good camera.”"}, {"t": "choice", "kind": "tfmc", "prompt": "According to the passage, birdwatching helps Huy ________.", "opts": ["learn about nature and be patient", "make a lot of money", "play sports better", "become famous"], "ans": 0, "expl": "“teaches him to be patient, and it helps him learn a lot about nature.”", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "tfmc", "prompt": "What does Huy want to be in the future?", "opts": ["a photographer", "a park keeper", "a scientist who protects wild animals", "a bird seller"], "ans": 2, "expl": "“Huy hopes to become a scientist who protects wild animals.”", "img": null, "fixed": false, "html": true}]}, "d4": {"id": "d4", "title": "Đề 4", "sub": "", "passage": null, "qs": [{"t": "choice", "kind": "pron", "prompt": "", "opts": ["laugh<u>ed<\/u>", "wash<u>ed<\/u>", "kiss<u>ed<\/u>", "plann<u>ed<\/u>"], "ans": 3, "expl": "planned /plænd/ → /d/; laughed /f/, washed /ʃ/, kissed /s/ → /t/.", "fixed": false, "html": true}, {"t": "choice", "kind": "pron", "prompt": "", "opts": ["s<u>u<\/u>pport", "s<u>u<\/u>bject", "s<u>u<\/u>ggest", "s<u>u<\/u>ccess"], "ans": 1, "expl": "subject /ˈsʌbdʒɪkt/: u được nhấn → /ʌ/; support, suggest, success: u không nhấn → /ə/.", "fixed": false, "html": true}, {"t": "choice", "kind": "stress", "prompt": "", "opts": ["medicine", "allergy", "exercise", "tomato"], "ans": 3, "expl": "toˈmato nhấn âm 2; ˈmedicine, ˈallergy, ˈexercise nhấn âm 1.", "fixed": false, "html": true}, {"t": "choice", "kind": "stress", "prompt": "", "opts": ["enjoy", "hobby", "comic", "fishing"], "ans": 0, "expl": "enˈjoy (động từ) nhấn âm 2; ˈhobby, ˈcomic, ˈfishing nhấn âm 1.", "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "My sister is good at ________; she has made a lot of beautiful bracelets from small beads.", "opts": ["making jewellery", "baking", "knitting", "gardening"], "ans": 0, "expl": "Làm vòng tay từ hạt cườm → <b>making jewellery<\/b> (làm đồ trang sức).", "img": null, "fixed": false, "html": true}, {"t": "choice", "kind": "mcq", "prompt": "Ar const f2 = x => x.toFixed(2).replace('.', ',');
function boardText(last){

function copyText(t, msg){
  const done = () => { if (msg) msg.textContent = 'Đã sao chép – dán vào Zalo / Messenger gửi cô.'; };
  const fall = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done(); };
  try { navigator.clipboard.writeText(t).then(done, fall); } catch (e) { fall(); }
}
function speak(t){ try { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
function sayText(q){
  if (q.t === 'choice') return strip(q.opts[q.ans]);
  if (q.t === 'tf') return q.ans === 0 ? 'True' : 'False';
  if (q.kind === 'trans' || q.kind === 'rearr') return q.answers[0];
  return q.ans[0];
}

}
function optsHtml(q, perm, n){
  const order = perm || [0, 1, 2, 3];
  const short = q.opts.every(o => strip(o).length <= 16);
  return `<div class="opts${short ? ' short' : ''}">${order.map((orig, pos) => `<button type="button" class="opt" data-orig="${orig}"><span class="k">${LET[pos]}</span><span>${q.html ? q.opts[orig] : esc(q.opts[orig])}</span></button>`).join('')}</div>`;
}
function renderExam(){
  const c = S.cur; const app = $('#app');
  let html = `<div class="card"><div class="row" style="justify-content:space-between"><div><h1>${examTitle(c.examId)}</h1><p class="muted">${esc((S.profile||{}).name||'')} · ${esc((S.profile||{}).cls||'')} · 40 câu · 60 phút · thứ tự đáp án đã được đảo</p></div><button class="btn ghost" id="back" type="button">Danh sách đề</button></div><div id="result"></div></div>`;
  let n = 0;
  PARTS.forEach(([code, instr, from, to, pts]) => {
    html += `<section class="part"><div class="ph"><h3>${code}. ${instr}</h3><span>Câu ${from}–${to} · ${pts}</span></div>`;
    let shownPassage = null, shownEntry = null;
    for (let k = from; k <= to; k++){
      const [lid, idx] = c.items[k - 1]; const q = Q(lid, idx); const L = DATA.lessons[lid];
      if (L.passage && L.passage !== shownPassage && (q.kind === 'gap' || q.kind === 'tf' || q.kind === 'tfmc')){
        shownPassage = L.passage;
        html += `<div class="passage">${L.passage.map(p => '<p>' + esc(p).replace(/\((\d)\)\s*_+/g, (m, d) => `<span class="gap">(${from - 1 + +d}) ______</span>`) + '</p>').join('')}</div>`;
      }
      if (q.entry && q.entry.word !== shownEntry){
        shownEntry = q.entry.word; const e = q.entry;
        html += `<div class="entry"><b>${esc(e.word)}</b> ${esc(e.ipa)} <i>${esc(e.pos)}</i><div>${esc(e.def)}</div><ul>${e.ex.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
      }
      html += qHtml(q, k, c.perms[k - 1]);
    }
    html += '</section>';
  });
  app.innerHTML = html;
  $('#back').onclick = home;
  // restore answers
  $$('.q').forEach(el => {
    const k = +el.dataset.k, v = c.ans[k];
    if (el.dataset.t === 'choice'){
      $$('.opt', el).forEach(b => b.onclick = () => { if (S.cur.submitted) return; S.cur.ans[k] = +b.dataset.orig; save(); markSel(el, k); updateFoot(); });
      markSel(el, k);
    } else {
      const inp = $('input', el); if (v != null) inp.value = v;
      inp.addEventListener('input', () => { S.cur.ans[k] = inp.value; save(); el.classList.toggle('answered', inp.value.trim().length > 0); updateFoot(); });
      el.classList.toggle('answered', !!(v && String(v).trim()));
    }
  });
  if (c.submitted) grade(true); else { updateFoot(); }
  startTimer();
  window.scrollTo(0, 0);
}
function qHtml(q, k, perm){
  let stem = '', body = '';
  if (q.kind === 'pron') stem = 'Which word has the underlined part pronounced differently from that of the others?';
  else if (q.kind === 'stress') stem = 'Which word has a different stress pattern from that of the others?';
  else if (q.kind === 'gap') stem = `Choose the best option for blank (${k}).`;
  else if (q.kind === 'trans') stem = esc(q.prompt);
  else if (q.kind === 'rearr') stem = esc(q.prompt).split(' / ').map(x => `<span class="chunk">${x}</span>`).join(' ');
  else stem = esc(q.prompt).replace(/_{3,}/g, '<span class="gap">______</span>').replace(/\s{4,}Student B:/, '<br>Student B:');
  if (q.img) stem = `<img class="sign" src="${q.img}" alt="Biển báo">` + stem;
  if (q.cue) stem += ` <b class="cue">(${esc(q.cue)})</b>`;
  if (q.t === 'choice') body = optsHtml(q, perm, k);
  else if (q.t === 'tf') body = `<div class="opts tf"><button type="button" class="opt" data-orig="0"><span class="k">T</span><span>True</span></button><button type="button" class="opt" data-orig="1"><span class="k">F</span><span>False</span></button></div>`;
  else {
    const pre = (q.kind === 'trans' || q.kind === 'rearr') ? `<span class="prefix">→ ${esc(q.start)}</span>` : '';
    body = `<div class="typ">${pre}<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${(q.kind === 'trans' || q.kind === 'rearr') ? 'Viết tiếp câu…' : q.kind === 'dict' ? 'Cụm 2–3 từ' : 'Dạng đúng của từ'}" aria-label="Câu ${k}"></div>`;
  }
  const t = (q.t === 'choice' || q.t === 'tf') ? 'choice' : 'text';
  return `<div class="q" id="k${k}" data-k="${k}" data-t="${t}"><div class="stem"><span class="qn">${k}</span><div class="st">${stem}</div></div>${body}<div class="fb" hidden></div></div>`;
}
function markSel(el, k){
  const v = S.cur.ans[k];
  $$('.opt', el).forEach(b => b.classList.toggle('sel', v != null && +b.dataset.orig === v));
  el.classList.toggle('answered', v != null);
}
function answeredCount(){ const c = S.cur; let a = 0; for (let k = 1; k <= 40; k++){ const v = c.ans[k]; if (v != null && String(v).trim() !== '') a++; } return a; }
function updateFoot(){
  const f = $('#foot'); f.hidden = false; const a = answeredCount();
  $('#footIn').innerHTML = `<div class="bar"><i style="width:${100 * a / 40}%"></i></div><span class="cnt">${a}/40 câu</span><button class="btn green" id="submit" type="button">Nộp bài</button>`;
  $('#submit').onclick = () => {
    const left = 40 - answeredCount();
    if (left > 0){
      $('#footIn').innerHTML = `<span class="confirm">Còn <b>${left}</b> câu chưa làm. Nộp bài luôn?</span><div class="row"><button class="btn ghost" id="cont" type="button">Làm tiếp</button><button class="btn green" id="go" type="button">Nộp bài</button></div>`;
      $('#cont').onclick = updateFoot; $('#go').onclick = () => grade(false);
    } else grade(false);
  };
}

/* ---------- grading ---------- */
function isRight(q, v){
  if (v == null || String(v).trim() === '') return false;
  if (q.t === 'choice' || q.t === 'tf') return +v === q.ans;
  if (q.kind === 'trans' || q.kind === 'rearr') return q.answers.some(a => [norm(v), norm(q.start + ' ' + v)].includes(norm(a)));
  return q.ans.some(a => norm(a) === norm(v));
}
function rightText(q, perm){
  if (q.t === 'choice'){ const pos = (perm || [0, 1, 2, 3]).indexOf(q.ans); return `${LET[pos]}. ${strip(q.opts[q.ans])}`; }
  if (q.t === 'tf') return q.ans === 0 ? 'True' : 'False';
  if (q.kind === 'trans' || q.kind === 'rearr') return q.answers[0];
  return q.ans[0];
}
function grade(restoring){
  const c = S.cur;
  if (!c.submitted){ c.submitted = true; c.elapsed = Date.now() - c.t0; }
  let right = 0; const byPart = {}, wrong = [];
  for (let k = 1; k <= 40; k++){
    const [lid, idx] = c.items[k - 1]; const q = Q(lid, idx); const v = c.ans[k]; const ok = isRight(q, v);
    if (ok) right++; else wrong.push(k);
    const part = PARTS.find(p => k >= p[2] && k <= p[3])[0];
    byPart[part] = byPart[part] || {c: 0, n: 0}; byPart[part].n++; if (ok) byPart[part].c++;
    const el = $('#k' + k); el.classList.toggle('correct', ok);
    if (q.t === 'choice' || q.t === 'tf'){
      $$('.opt', el).forEach(b => { const o = +b.dataset.orig; b.disabled = true; b.classList.remove('sel'); b.classList.toggle('right', o === q.ans); b.classList.toggle('wrong', v != null && o === +v && o !== q.ans); });
    } else { const inp = $('input', el); inp.disabled = true; inp.classList.add(ok ? 'okk' : 'bad'); }
    const fb = $('.fb', el); fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'bad');
    const blank = v == null || String(v).trim() === '';
    fb.innerHTML = `<span class="t">${ok ? '✓ Đúng.' : blank ? '✗ Chưa làm.' : '✗ Sai.'}</span>${ok ? '' : ` Đáp án: <b>${esc(rightText(q, c.perms[k - 1]))}</b>${/[.?!]$/.test(rightText(q, c.perms[k - 1])) ? '' : '.'}`} <button type="button" class="say" data-k="${k}" aria-label="Nghe đáp án">🔊</button> ${q.expl}`;
    $('.say', fb).onclick = () => speak(sayText(q));
  }
  const score = right * 0.25;
  if (!restoring){
    const st = S.stats[c.examId] || {n: 0, best: 0, last: 0}; st.n++; st.best = Math.max(st.best, score); st.last = score; S.stats[c.examId] = st;
  }
  save();
  const secs = Math.floor(c.elapsed / 1000);
  $('#result').innerHTML = `<div style="text-align:center;margin-top:14px"><div class="muted" style="font-weight:700;font-size:13px;letter-spacing:.06em">ĐIỂM (THANG 10)</div><div class="big">${score.toFixed(2).replace('.', ',')}</div><div style="font-weight:600">${score >= 8 ? 'Rất tốt! Em đã nắm vững bài.' : score >= 5 ? 'Khá ổn – xem lại các câu sai và giải thích bên dưới.' : 'Cần ôn thêm – đọc kĩ giải thích từng câu rồi làm lại.'}</div></div>
    <div class="score"><div class="tile"><b style="color:var(--good)">${right}</b><span>Câu đúng</span></div><div class="tile"><b style="color:var(--bad)">${40 - right}</b><span>Câu sai</span></div><div class="tile"><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b><span>Thời gian</span></div></div>
    <div class="tw"><table><thead><tr><th>Phần</th><th class="n">Đúng</th><th>Tỉ lệ</th></tr></thead><tbody>${PARTS.map(p => { const b = byPart[p[0]]; return `<tr><td>Phần ${p[0]} (câu ${p[2]}–${p[3]})</td><td class="n">${b.c}/${b.n}</td><td><div class="meter"><i style="width:${100 * b.c / b.n}%"></i></div></td></tr>`; }).join('')}</tbody></table></div>
    ${wrong.length ? `<p style="margin-top:10px"><b>Câu sai:</b></p><div class="wl">${wrong.map(k => `<a href="#k${k}">Câu ${k}</a>`).join('')}</div>` : '<p style="margin-top:10px"><b>Không sai câu nào!</b></p>'}
    <div class="row" style="margin-top:14px"><button class="btn green" id="copyRes" type="button">Sao chép kết quả gửi cô</button><span class="muted" id="copyMsg2"></span></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="again" type="button">Làm lại đề này (đảo đáp án mới)</button><button class="btn ghost" id="onlyWrong" type="button">Chỉ xem câu sai</button></div>`;
  $('#again').onclick = () => newAttempt(c.examId);
  $('#copyRes').onclick = () => copyText(boardText(examTitle(c.examId) + ' (lần này): ' + f2(score) + '/10 · đúng ' + right + '/40 · thời gian ' + Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0') + (wrong.length ? ' · câu sai: ' + wrong.join(', ') : '')), $('#copyMsg2'));
  $('#onlyWrong').onclick = e => { const on = document.body.classList.toggle('hideok'); e.target.textContent = on ? 'Xem tất cả câu' : 'Chỉ xem câu sai'; };
  $('#footIn').innerHTML = `<span class="cnt">Điểm: ${score.toFixed(2).replace('.', ',')} · đúng ${right}/40</span><div class="row"><button class="btn ghost" id="fHome" type="button">Danh sách đề</button><button class="btn" id="fAgain" type="button">Làm lại (đảo đáp án)</button></div>`;
  $('#foot').hidden = false;
  $('#fHome').onclick = home; $('#fAgain').onclick = () => newAttempt(c.examId);
  if (!restoring) $('#result').scrollIntoView({block: 'start'});
}

if (S.cur && S.cur.items && !S.cur.submitted) home(); else home();
</script>
