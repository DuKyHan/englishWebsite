<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm tra từ vựng và ngữ pháp – Unit 4 – English 7</title>
<style>
:root{--bg:#fff;--cd:#f4f7fb;--tx:#232a35;--mu:#667085;--bd:#d6dde8;--nv:#1f3864;--ac:#2f6fdb;--ok:#2e9d3f;--okb:#e0f5e3;--no:#d93636;--nob:#fde4e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181f;--cd:#1d232d;--tx:#e8edf3;--mu:#9aa6b5;--bd:#344052;--nv:#9db8ee;--ac:#6ea1ff;--okb:#1a3a22;--nob:#40201f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.4}
#app{max-width:860px;margin:0 auto;padding:12px}h1{font-size:21px;color:var(--nv);margin:4px 0 4px}h2{font-size:18px;color:var(--nv);border-bottom:2px solid var(--nv);padding-bottom:3px;margin:22px 0 8px}
.mu{color:var(--mu);font-size:14px}.info{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.info input{flex:1;min-width:140px}
input{width:100%;padding:8px 10px;border:2px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}input:focus{outline:none;border-color:var(--ac)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar b{color:var(--nv)}
.btn{border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;padding:10px 18px;cursor:pointer}.btn.g{background:var(--bg);color:var(--tx);border:2px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
.it{display:flex;flex-direction:column;gap:3px;padding:6px 8px;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}.it.ok{background:var(--okb);border-color:var(--ok)}.it.no{background:var(--nob);border-color:var(--no)}
.it .t{font-size:15px}.it .t b{color:var(--nv);margin-right:4px}.ans{font-size:14px;color:var(--no);font-weight:700}
.box{border:2px solid var(--nv);border-radius:10px;padding:8px 12px;text-align:center;font-weight:700;font-size:15px;margin-bottom:8px}
.res{background:var(--cd);border:2px solid var(--nv);border-radius:14px;padding:16px;text-align:center;margin:12px 0}.res .big{font-size:42px;font-weight:700;color:var(--nv)}.res table{margin:10px auto;border-collapse:collapse}.res td{padding:3px 14px;border-bottom:1px solid var(--bd)}
.sent{width:100%}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
</style></head><body><div id="app"></div>
<script>
var A=[["academic","adj","thuộc học thuật"],["anthem","n","bài hát ca ngợi, quốc ca"],["artist","n","nghệ sĩ, họa sĩ"],["appear","v","xuất hiện"],["colour","n","màu sắc"],["choose","v","lựa chọn"],["carpenter","n","thợ mộc"],["curriculum","n","chương trình học"],["compel","v","ép, buộc ai làm gì"],["celebrate","v","tổ chức ăn mừng, kỷ niệm"],["consider","v","cân nhắc"],["critic","n","nhà phê bình"],["definitely","adv","chắc chắn, hoàn toàn"],["exhibit","v","triển lãm, trưng bày"],["educate","v","giáo dục, dạy"],["excellent","adj","xuất sắc"],["folk tale","n","truyện dân gian"],["fantastic","adj","tuyệt vời"],["fame","n","danh tiếng"],["famous","adj","nổi tiếng"],["important","adj","quan trọng"],["live","adj/adv","trực tiếp"],["loud","adj","to, ồn (âm thanh)"],["music","n","âm nhạc"],["necessary","adj","cần thiết"],["origin","n","nguồn gốc"],["paint","v","vẽ (tranh), sơn"],["plan","n/v","kế hoạch; dự định"],["portrait","n","bức chân dung"],["photo","n","bức ảnh"],["prefer","v","thích hơn"],["puppet","n","con rối"],["perform","v","trình diễn, biểu diễn"],["pleasure","n","niềm vui"],["parade","n","cuộc diễu hành"],["quiet","adj","yên tĩnh"],["recent","adj","gần đây"],["rural","adj","thuộc nông thôn"],["audience","n","khán giả"],["art gallery","n","phòng trưng bày tranh"],["band","n","ban nhạc"],["composer","n","nhà soạn nhạc"],["concert","n","buổi hòa nhạc"],["instrument","n","nhạc cụ"],["museum","n","bảo tàng"],["orchestra","n","dàn nhạc giao hưởng"],["painting","n","bức tranh"],["sculpture","n","tác phẩm điêu khắc"],["talent show","n","cuộc thi tài năng"],["heritage","n","di sản"],["water puppetry","n","múa rối nước"],["classical music","n","nhạc cổ điển"],["genre","n","thể loại"],["spare time","n","thời gian rảnh"]];
var B=[["The ___ of water puppetry goes back about a thousand years.","origin"],["Everyone stood up when the national ___ was played.","anthem"],["The museum will ___ ancient paintings this month.","exhibit"],["The film ___ gave the movie five stars.","critic"],["She painted a ___ of her grandmother.","portrait"],["The children laughed at the funny ___.","puppet"],["My grandmother tells me a ___ every night.","folk tale"],["We often ___ Tet with our families.","celebrate"],["Stars began to ___ in the sky.","appear"],["You can ___ any song you like.","choose"],["Nobody can ___ you to sing.","compel"],["Schools ___ children and teach them life skills.","educate"],["I ___ pop music to classical music.","prefer"],["We have a ___ to visit the art gallery.","plan"],["Please be ___ in the library.","quiet"],["The music was too ___, so I couldn’t talk.","loud"],["We watched the match ___ on TV.","live"],["Her ___ painting is about the sea.","recent"],["It is ___ to practise every day.","necessary"],["Music is an ___ part of my life.","important"],["I will ___ come to your concert.","definitely"],["The singer won ___ after her first song.","fame"],["Mai gets excellent ___ results at school.","academic"],["Many folk songs come from ___ areas.","rural"],["Her piano performance was ___.","excellent"]];
var C=[["This guitar is ___ expensive as that one.","as"],["The old hall is not ___ big as the new one.","as/so"],["Nam plays the piano as ___ as his teacher.","well"],["I have as ___ friends as you.","many"],["She doesn’t have as ___ free time as me.","much"],["My taste in music is different ___ yours.","from"],["Her voice is ___ to her mother’s.","similar"],["He looks ___ a famous singer.","like"],["Lan has ___ guitar as Mai.","the same"],["I prefer pop music ___ rock music.","to"],["The two songs are ___. They sound exactly alike.","the same"],["Your ideas are ___ from mine. We never agree.","different"],["He sings as ___ as a professional.","beautifully"],["This show isn’t as ___ as that one. (interest)","interesting"],["Mai’s dress is the same ___ Hoa’s.","as"],["Which do you ___, tea or coffee?","prefer"],["The red painting is not ___ colourful as the blue one.","as/so"],["My brother runs as ___ as me.","fast"],["Life in the countryside is ___ from life in the city.","different"],["She prefers watching films ___ reading books.","to"]];
var KEEP=["origin","anthem","exhibit","critic","portrait","folk tale","celebrate","compel","necessary","definitely"];B=B.filter(function(x){return KEEP.indexOf(x[1])>=0});
var app=document.getElementById("app"),T0=25*60,left,tm,done;
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function hint(w){return w.split(" ").map(function(x){return x[0]+" "+Array(x.length).join("_ ").trim()}).join("   ")}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function build(){done=false;left=T0;var AA=sh(A),BB=sh(B),CC=C,h='<h1>🎵 Kiểm tra từ vựng và ngữ pháp – Unit 4</h1><div class="mu">English 7 (Global Success) · 84 câu · 25 phút · mỗi câu 1 điểm</div><div class="info"><input id="nm" placeholder="Họ và tên"><input id="cl" placeholder="Lớp"></div>';
h+='<div class="bar"><span>⏱ <b id="tm">25:00</b></span><span>Đã làm <b id="cnt">0</b>/84</span><button class="btn" style="margin-left:auto" onclick="sub(false)">Nộp bài</button></div><div id="res"></div>';
h+='<h2>A. Vocabulary (54 câu)</h2><div class="mu" style="margin-bottom:6px">Viết từ tiếng Anh. Gợi ý: chữ cái đầu và số chữ cái.</div><div class="grid">';
AA.forEach(function(a,i){h+='<div class="it" data-k="A'+i+'" data-a="'+a[0]+'"><div class="t"><b>'+(i+1)+'.</b>'+a[2]+' <span class="mu">('+a[1]+')</span></div><input placeholder="'+hint(a[0])+'" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'});
h+='</div><h2>B. Sentences (10 câu)</h2><div class="box">'+B.map(function(x){return x[1]}).sort().join(" · ")+'</div><div class="grid">';
BB.forEach(function(b,i){h+='<div class="it" data-a="'+b[1]+'"><div class="t"><b>'+(i+1)+'.</b>'+esc(b[0]).replace("___","______")+'</div><input autocomplete="off" autocapitalize="off" spellcheck="false"></div>'});
h+='</div><h2>C. Grammar (20 câu)</h2><div class="mu" style="margin-bottom:6px">Điền MỘT từ hoặc cụm từ phù hợp (as, so, the same, from, to, like, similar, different, many, much, well…).</div><div class="grid">';
CC.forEach(function(c,i){h+='<div class="it" data-a="'+c[1]+'"><div class="t"><b>'+(i+1)+'.</b>'+esc(c[0]).replace("___","______")+'</div><input autocomplete="off" autocapitalize="off" spellcheck="false"></div>'});
h+='</div><div class="row" style="margin:20px 0"><button class="btn" onclick="sub(false)">Nộp bài</button></div>';app.innerHTML=h;
app.addEventListener("input",cnt);clearInterval(tm);tm=setInterval(tick,1000)}
function cnt(){var n=0;document.querySelectorAll(".it input").forEach(function(i){if(i.value.trim())n++});document.getElementById("cnt").textContent=n}
function tick(){if(done)return;left--;var m=Math.floor(left/60),s=left%60;document.getElementById("tm").textContent=m+":"+(s<10?"0":"")+s;if(left<=0)sub(true)}
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim()}
function sub(auto){if(done)return;var un=0;document.querySelectorAll(".it input").forEach(function(i){if(!i.value.trim())un++});
if(!auto&&un>0&&!confirm("Còn "+un+" câu chưa làm. Nộp bài ngay?"))return;
done=true;clearInterval(tm);var sc=[0,0,0],tt=[54,10,20],items=document.querySelectorAll(".it");
items.forEach(function(it,k){var sec=k<54?0:k<64?1:2,inp=it.querySelector("input"),ok=false,acc=it.dataset.a.split("/");
acc.forEach(function(x){if(norm(inp.value)==x)ok=true});inp.disabled=true;it.classList.add(ok?"ok":"no");if(ok)sc[sec]++;
if(!ok)it.insertAdjacentHTML("beforeend",'<div class="ans">✘ Đáp án: '+acc.join(" / ")+'</div>')});
var tot=sc[0]+sc[1]+sc[2],g=(tot*10/84).toFixed(1),m=tot>=76?"🏆 Xuất sắc!":tot>=63?"👏 Giỏi!":tot>=42?"👍 Khá, cần ôn thêm.":"💪 Cần ôn lại từ vựng và ngữ pháp.";
var nm=document.getElementById("nm").value.trim(),cl=document.getElementById("cl").value.trim();
document.getElementById("res").innerHTML='<div class="res"><div class="mu">'+esc(nm)+(cl?" – lớp "+esc(cl):"")+'</div><div class="big">'+tot+' / 84</div><div>Điểm hệ 10: <b>'+g+'</b> &nbsp; '+m+'</div><table><tr><td>A. Vocabulary</td><td><b>'+sc[0]+'/54</b></td></tr><tr><td>B. Sentences</td><td><b>'+sc[1]+'/10</b></td></tr><tr><td>C. Grammar</td><td><b>'+sc[2]+'/20</b></td></tr></table><div class="mu">Các câu sai được tô đỏ kèm đáp án đúng bên dưới.</div><div class="row"><button class="btn" onclick="build();scrollTo(0,0)">Làm lại (đề xáo trộn)</button></div></div>';
scrollTo(0,0)}
build();
</script></body></html>
