(đúng)"],"explanation":"Tính từ ngắn \"easy\" (kết thúc bằng y) → easier.","vi":""},{"q":"3. English is thought to be ___ than Math.","options":["harder","the more hard","hardest","the hardest"],"answer":0,"vis":["khó hơn (đúng)","sai (thừa \"the more\", hard là tính từ ngắn)","sai (so sánh nhất, không phù hợp có \"than\")","sai (so sánh nhất, không phù hợp có \"than\")"],"explanation":"Tính từ ngắn \"hard\" → so sánh hơn: harder.","vi":""},{"q":"4. My house is ___ hers.","options":["cheap than","cheaper","more cheap than","cheaper than"],"answer":3,"vis":["thiếu đuôi so sánh","thiếu \"than\"","sai (thừa \"more\" với tính từ ngắn)","rẻ hơn (đúng)"],"explanation":"Tính từ ngắn \"cheap\" → cheaper than.","vi":""},{"q":"5. Her office is ___ away than mine.","options":["father","more far","farther","farer"],"answer":2,"vis":["sai chính tả (father ≠ farther)","sai (thừa \"more\", far có dạng so sánh riêng)","xa hơn (đúng, dạng bất quy tắc của far)","sai (không tồn tại)"],"explanation":"\"far\" có so sánh hơn bất quy tắc: farther/further.","vi":""},{"q":"6. Tom is ___ than David.","options":["handsome","the more handsome","more handsome","the most handsome"],"answer":2,"vis":["thiếu so sánh","thừa \"the\" (so sánh hơn không dùng \"the\")","đẹp trai hơn (đúng, tính từ dài + more)","sai (so sánh nhất, không phù hợp có \"than\")"],"explanation":"Tính từ dài \"handsome\" → more handsome.","vi":""},{"q":"7. He did the test ___ I did.","options":["as bad as","badder than","more badly than","worse than"],"answer":3,"vis":["sai nghĩa (so sánh bằng, không phải hơn)","sai (bad không thêm -er)","sai (dạng trạng từ không chuẩn cho so sánh này)","tệ hơn (đúng, dạng bất quy tắc của badly/bad)"],"explanation":"\"badly\" so sánh hơn bất quy tắc: worse than.","vi":""},{"q":"8. A boat is ___ than a plane.","options":["slower","slowest","more slow","more slower"],"answer":0,"vis":["chậm hơn (đúng)","sai (so sánh nhất, không phù hợp có \"than\")","sai (tính từ ngắn không dùng \"more\")","sai (thừa \"more\" và \"-er\" cùng lúc)"],"explanation":"Tính từ ngắn \"slow\" → slower.","vi":""},{"q":"9. My new sofa is ___ than the old one.","options":["more comfortable","comfortably","more comfortabler","comfortable"],"answer":0,"vis":["thoải mái hơn (đúng, tính từ dài + more)","sai từ loại (trạng từ)","sai (thừa \"more\" và \"-er\" cùng lúc)","thiếu so sánh"],"explanation":"Tính từ dài \"comfortable\" → more comfortable.","vi":""},{"q":"10. My sister dances ___ than me.","options":["gooder","weller","better","more good"],"answer":2,"vis":["sai (không tồn tại)","sai (không tồn tại)","tốt hơn (đúng, dạng bất quy tắc của well)","sai (well là trạng từ, không phải good)"],"explanation":"Trạng từ \"well\" so sánh hơn bất quy tắc: better.","vi":""},{"q":"11. This road is ___ than that road.","options":["narrower","narrow","the most narrow","more narrower"],"answer":0,"vis":["hẹp hơn (đúng)","thiếu so sánh","sai (so sánh nhất, không phù hợp có \"than\")","sai (thừa \"more\" và \"-er\" cùng lúc)"],"explanation":"Tính từ ngắn \"narrow\" → narrower.","vi":""},{"q":"12. He drives ___ his brother.","options":["more careful than","more carefully","more carefully than","as career as"],"answer":2,"vis":["sai từ loại (tính từ, cần trạng từ bổ nghĩa cho \"drives\")","thiếu \"than\"","cẩn thận hơn (đúng, trạng từ dài + more...than)","sai nghĩa (so sánh bằng, không phải hơn)"],"explanation":"Trạng từ dài \"carefully\" bổ nghĩa động từ \"drives\" → more carefully than.","vi":""},{"q":"13. It was ___ day of the year.","options":["the colder","the coldest","coldest","colder"],"answer":1,"vis":["sai (so sánh hơn, cần so sánh nhất)","lạnh nhất (đúng, so sánh nhất có \"the\")","thiếu \"the\"","sai (so sánh hơn, cần so sánh nhất)"],"explanation":"So sánh nhất trong cả năm → the coldest.","vi":""},{"q":"14. She is ___ student in my class.","options":["most hard-working","more hard-working","the most hard-working","as hard-working"],"answer":2,"vis":["thiếu \"the\"","sai (so sánh hơn, cần so sánh nhất)","chăm chỉ nhất (đúng, so sánh nhất có \"the\")","sai nghĩa (so sánh bằng)"],"explanation":"So sánh nhất trong cả lớp → the most hard-working.","vi":""},{"q":"15. Jupiter is ___ planet in the solar system.","options":["the biggest","the bigger","bigger","biggest"],"answer":0,"vis":["lớn nhất (đúng, so sánh nhất có \"the\")","sai (so sánh hơn, cần so sánh nhất)","sai (so sánh hơn, cần so sánh nhất)","thiếu \"the\""],"explanation":"So sánh nhất trong cả hệ mặt trời → the biggest.","vi":""},{"q":"16. Yoga help us learn ___ to co-ordinate breathing and movement.","options":["what","when","why","how"],"answer":3,"vis":["sai nghĩa","sai nghĩa","sai nghĩa","cách (đúng, học CÁCH phối hợp)"],"explanation":"\"learn how to do something\" = học cách làm gì.","vi":""},{"q":"17. Teenagers enjoy ___ to music and ___ out with friends.","options":["listen - hang","to listen – to hang","listening - hang","listening - hanging"],"answer":3,"vis":["sai cấu trúc (enjoy + V nguyên mẫu, sai)","sai cấu trúc (enjoy không đi với to-V)","sai (thiếu -ing ở vế 2, không song song)","đúng, \"enjoy + V-ing\" cho cả hai vế song song"],"explanation":"\"enjoy + V-ing\" → listening…hanging (song song).","vi":""},{"q":"18. ___ should children do yoga too?","options":["Why","When","What","How"],"answer":0,"vis":["tại sao (đúng, hỏi lý do)","sai nghĩa","sai nghĩa","sai nghĩa"],"explanation":"Hỏi về lý do → Why.","vi":""},{"q":"19. Don’t worry. It is ___ to travel to that village even at night.","options":["safe","unsafe","difficult","inconvenient"],"answer":0,"vis":["an toàn (đúng, trấn an \"đừng lo\")","không an toàn (trái nghĩa với ý trấn an)","khó khăn (sai nghĩa văn cảnh)","bất tiện (sai nghĩa văn cảnh)"],"explanation":"\"Don't worry\" gợi ý điều tích cực tiếp theo → safe.","vi":""},{"q":"20. Life in a small town is ___ than that in a big city.","options":["peaceful","much peaceful","less peaceful","much more peaceful"],"answer":3,"vis":["thiếu so sánh","sai cấu trúc (much bổ nghĩa cho so sánh, không phải tính từ thường)","yên bình hơn (nghĩa ngược, ít phù hợp hơn với thị trấn nhỏ)","yên bình hơn nhiều (đúng, much + more + adj + than)"],"explanation":"\"much more + adj + than\" nhấn mạnh sự so sánh hơn.","vi":""},{"q":"21. The boys often help their parents to ___ water from the village well.","options":["gather","collect","give","find"],"answer":1,"vis":["sai nghĩa (gather hợp với vật thể rời rạc, không phải nước)","lấy, múc (đúng, collect water)","sai nghĩa","sai nghĩa"],"explanation":"\"collect water\" = lấy/múc nước.","vi":""},{"q":"22. In the Central Highlands, the biggest and tallest house in the village is the ___ house.","options":["communication","community","communal","commune"],"answer":2,"vis":["danh từ (sai từ loại, cần tính từ)","danh từ (sai từ loại)","thuộc cộng đồng (đúng, tính từ + house)","danh từ (sai từ loại)"],"explanation":"Cần tính từ đứng trước danh từ \"house\" → communal.","vi":""},{"q":"23. The Viet people have many ___ customs and crafts.","options":["tradition","traditional","culture","customary"],"answer":1,"vis":["danh từ (sai từ loại, cần tính từ)","mang tính truyền thống (đúng, tính từ)","danh từ (sai từ loại)","sai nghĩa (thường lặp nghĩa với custom)"],"explanation":"Cần tính từ bổ nghĩa cho \"customs and crafts\" → traditional.","vi":""},{"q":"24. ___ month is the Hoa Ban Festival of the Thai people held in?","options":["When","Which","How many","How often"],"answer":1,"vis":["sai (When không đi được với \"month\" theo cấu trúc này)","tháng nào (đúng, hỏi lựa chọn cụ thể + danh từ)","sai nghĩa (hỏi số lượng)","sai nghĩa (hỏi tần suất)"],"explanation":"\"Which + danh từ\" = cái nào, tháng nào.","vi":""},{"q":"25. The ___ on display in Da Nang Museum of Cham Sculpture are very interesting.","options":["items","goods","products","shows"],"answer":0,"vis":["hiện vật (đúng, trưng bày trong bảo tàng)","hàng hóa (sai nghĩa, không phù hợp bảo tàng)","sản phẩm (sai nghĩa)","buổi trình diễn (sai nghĩa)"],"explanation":"\"items on display\" = hiện vật trưng bày.","vi":""},{"q":"26. I went on a trip to the countryside and had my first experience ___ farm work.","options":["on","with","for","of"],"answer":3,"vis":["sai giới từ","sai giới từ","sai giới từ","của (đúng, \"experience of\" = trải nghiệm về)"],"explanation":"\"experience of something\" = trải nghiệm về điều gì đó.","vi":""},{"q":"27. We usually spend our holiday in the village ___ our grandparents live.","options":["what","where","which","when"],"answer":1,"vis":["sai từ (what không dùng làm đại từ quan hệ chỉ nơi chốn)","nơi mà (đúng, đại từ quan hệ chỉ nơi chốn)","sai từ (which chỉ vật, không chỉ nơi chốn theo cách này)","sai từ (when chỉ thời gian)"],"explanation":"\"where\" = đại từ quan hệ chỉ nơi chốn (the village).","vi":""},{"q":"28. I think country life is so boring and ___ because you’re not close to shops and services.","options":["unhealthy","inconvenient","comfortable","peaceful"],"answer":1,"vis":["sai nghĩa (không liên quan đến khoảng cách tới cửa hàng)","bất tiện (đúng, xa cửa hàng/dịch vụ → bất tiện)","trái nghĩa với \"boring\"","trái nghĩa với ý tiêu cực của câu"],"explanation":"Xa cửa hàng và dịch vụ → bất tiện (inconvenient).","vi":""},{"q":"29. On the farm, uncle Duong showed us how to ___ cucumbers.","options":["plough","produce","pick","put up"],"answer":2,"vis":["cày (sai nghĩa, không phù hợp với dưa chuột)","sản xuất (sai nghĩa, không phải hành động thu hoạch cụ thể)","hái (đúng, hái dưa chuột)","dựng lên (sai nghĩa)"],"explanation":"\"pick cucumbers\" = hái dưa chuột.","vi":""},{"q":"30. Mongolian children start to learn ___ before they can walk.","options":["horse riding","riding horse","ride horse","horse ridden"],"answer":0,"vis":["cưỡi ngựa (đúng, danh động từ ghép)","sai cấu trúc (thiếu mạo từ/thứ tự sai)","sai cấu trúc (thiếu \"a/the\" trước horse)","sai (dạng quá khứ phân từ không phù hợp)"],"explanation":"\"learn + danh động từ\" → learn horse riding.","vi":""},{"q":"31. On the side of the road, a herd boy was herding ___","options":["kites","hay","cattle","blackberries"],"answer":2,"vis":["sai nghĩa (không thể \"chăn\" diều)","sai nghĩa (không thể \"chăn\" cỏ khô)","gia súc (đúng, \"herd\" = chăn dắt gia súc)","sai nghĩa (không thể \"chăn\" quả mâm xôi)"],"explanation":"\"herd\" = chăn dắt (gia súc: cattle, sheep…) → cattle.","vi":""},{"q":"32. Mongolian children learn to ride when they are ___ as three years old.","options":["as young","younger","younger than","so young"],"answer":0,"vis":["nhỏ tuổi bằng (đúng, cấu trúc as…as)","sai cấu trúc (không đi với \"as…as\")","sai cấu trúc","sai cấu trúc (so + adj không đi với \"as\")"],"explanation":"Cấu trúc so sánh bằng \"as + adj + as\" → as young as three years old.","vi":""},{"q":"33. Does your new stereo play music ___ than your old one did?","options":["louder","more loudly","loudlier","more louder"],"answer":1,"vis":["sai từ loại (tính từ, cần trạng từ bổ nghĩa cho \"play\")","to hơn (đúng, trạng từ dài + more)","sai (không tồn tại)","sai (thừa \"more\" và \"-er\" cùng lúc)"],"explanation":"Trạng từ dài \"loudly\" → more loudly.","vi":""},{"q":"34. Countryside is not polluted ___ you can breathe fresh air there.","options":["although","however","therefore","as"],"answer":2,"vis":["sai quan hệ (tương phản, không phù hợp)","sai (không nối được 2 mệnh đề trong 1 câu)","vì vậy (đúng, quan hệ nhân quả)","sai nghĩa (as = vì/khi, ít phù hợp bằng therefore ở đây)"],"explanation":"Quan hệ nhân quả (không ô nhiễm → thở được khí trong lành) → therefore.","vi":""},{"q":"35. ‘Children in my village often fly their kites in dry rice fields.’ ‘___’","options":["It’s right up my street!","That’s awesome.","Exactly what I want.","How interesting!"],"answer":3,"vis":["sai ngữ cảnh (thành ngữ chỉ sở thích cá nhân)","có thể dùng nhưng ít trang trọng/phù hợp hơn trong ngữ cảnh này","sai ngữ cảnh (không phù hợp phản hồi một thông tin)","thú vị thật đấy! (đúng, phản hồi tự nhiên trước thông tin thú vị)"],"explanation":"Phản ứng tự nhiên trước một thông tin thú vị vừa nghe → How interesting!","vi":""},{"q":"36. We are all hooked ___ making star lanterns.","options":["in","off","on","to"],"answer":2,"vis":["sai giới từ","sai giới từ","mê, nghiện (đúng, \"hooked on\" = say mê)","sai giới từ"],"explanation":"\"be hooked on something\" = say mê, nghiện điều gì đó.","vi":""},{"q":"37. Their family have moved to the city ___ 2001.","options":["horn","for","in","since"],"answer":3,"vis":["sai chính tả (horn ≠ born, và không phù hợp nghĩa)","sai (for + khoảng thời gian, không phải mốc thời gian)","sai (in + năm nhưng không phù hợp với \"have moved\" - hiện tại hoàn thành)","từ, kể từ (đúng, since + mốc thời gian + hiện tại hoàn thành)"],"explanation":"\"since + mốc thời gian\" đi với thì hiện tại hoàn thành → since 2001.","vi":""},{"q":"38. The Kinh have the largest number of people, ___ for 86% of the population.","options":["holding","taking","accounting","numbering"],"answer":2,"vis":["sai cụm từ","sai cụm từ","chiếm (đúng, \"account for\" = chiếm tỉ lệ)","sai cụm từ"],"explanation":"\"account for a percentage\" = chiếm một tỉ lệ phần trăm.","vi":""},{"q":"39. I’m tired of ___ in the city. It’s too busy, noisy and dirty.","options":["live","to live","to be lived","living"],"answer":3,"vis":["sai cấu trúc (tired of + V-ing)","sai cấu trúc (tired of không đi với to-V)","sai cấu trúc và nghĩa (bị động không phù hợp)","sống (đúng, \"be tired of + V-ing\")"],"explanation":"\"be tired of + V-ing\" = chán/mệt vì việc gì → living.","vi":""},{"q":"40. ___ drop that mobile phone and do your homework?","options":["Why don’t you","How about","Would you mind","When did you"],"answer":0,"vis":["sao bạn không... (đúng, gợi ý/đề nghị)","sai cấu trúc (how about + V-ing, không phải V nguyên mẫu)","sai cấu trúc (would you mind + V-ing)","sai nghĩa (hỏi thời gian, không phải đề nghị)"],"explanation":"\"Why don't you + V?\" = gợi ý ai đó làm gì.","vi":""},{"q":"41. The Hmong of Sa Pa are called Black Hmong ___ their mainly black clothing.","options":["because of","in spite of","in order to","according to"],"answer":0,"vis":["bởi vì (đúng, lý do được gọi tên)","mặc dù (sai nghĩa)","để mà (sai nghĩa, thiếu mục đích)","theo như (sai nghĩa)"],"explanation":"\"because of + N\" = bởi vì (lý do).","vi":""},{"q":"42. People in rural areas live ___ than those in cities.","options":["simplier","more simply","more simple","simpler"],"answer":1,"vis":["sai (không tồn tại, simply không thêm -er)","đơn giản hơn (đúng, trạng từ dài + more)","sai từ loại (tính từ, cần trạng từ bổ nghĩa cho \"live\")","sai (simpler là dạng tính từ, không phải trạng từ)"],"explanation":"Trạng từ \"simply\" bổ nghĩa động từ \"live\" → more simply.","vi":""},{"q":"43. The highlands of northern Vietnam are home to the 1.5 million-strong Tay, ___ minority group.","options":["Vietnam’s largest","the Vietnam’s largest","a Vietnam’s largest","the largest Vietnam"],"answer":0,"vis":["lớn nhất của Việt Nam (đúng, sở hữu cách + so sánh nhất)","sai (thừa \"the\" trước sở hữu cách)","sai (mạo từ \"a\" không phù hợp với so sánh nhất)","sai trật tự từ"],"explanation":"Sở hữu cách + so sánh nhất: Vietnam's largest minority group.","vi":""},{"q":"44. ___ is the Nung’s clothing? ~ Indigo.","options":["What","Which group","What colour","Whose"],"answer":2,"vis":["sai (câu trả lời là màu sắc cụ thể, cần rõ hơn)","sai nghĩa","màu gì (đúng, câu trả lời \"Indigo\" là màu chàm)","sai nghĩa (hỏi sở hữu)"],"explanation":"Câu trả lời là một màu sắc (Indigo) → hỏi bằng What colour.","vi":""},{"q":"45. ‘I find it hard to build a toy car.’ ‘But ___’","options":["my pleasure","it’s my fault.","it sounds great!","it’s right up your street!"],"answer":3,"vis":["sai ngữ cảnh (đáp lại lời cảm ơn)","sai ngữ cảnh (nhận lỗi, không phù hợp)","sai ngữ cảnh (không phản hồi đúng ý than khó)","đúng sở trường của bạn mà! (đúng, thành ngữ nghĩa là hợp với sở thích/sở trường)"],"explanation":"\"it's right up your street\" = việc đó hợp với sở trường/sở thích của bạn.","vi":""},{"q":"46. We often spend a lot of time talking with our ___ during Tet holiday.","options":["relation","relationship","relatives","relative"],"answer":2,"vis":["sai (nghĩa: mối quan hệ, không phải người)","sai (nghĩa: mối quan hệ, không phải người)","người thân (đúng, danh từ số nhiều chỉ người)","sai (số ít, không phù hợp với \"a lot of time\" nói chung)"],"explanation":"\"relatives\" (số nhiều) = người thân, họ hàng.","vi":""},{"q":"47. ___ people in the countryside are not rich, they often have a peaceful and happy life.","options":["Because","although","Despite","When"],"answer":1,"vis":["sai (quan hệ nhân quả, không phù hợp ý nghịch)","mặc dù (đúng, quan hệ tương phản)","sai cấu trúc (despite + N/V-ing, không phải mệnh đề đầy đủ)","sai nghĩa (thời gian, không phù hợp)"],"explanation":"Quan hệ tương phản (không giàu nhưng vẫn hạnh phúc) → although.","vi":""},{"q":"48. Except for some minor changes, life in my hometown has generally remained at a slow ___","options":["speed","rhythm","pace","both B & C"],"answer":2,"vis":["sai nghĩa (speed thường chỉ tốc độ vật lý, không phù hợp \"pace of life\")","nhịp điệu (cũng có thể dùng, nhưng ít phổ biến bằng \"pace\" trong cụm cố định)","nhịp độ (đúng, \"a slow pace of life\" là cụm từ cố định phổ biến nhất)","chỉ chọn 1 đáp án chính xác nhất theo cụm từ thông dụng"],"explanation":"\"a slow pace of life\" là cụm từ cố định phổ biến nhất để diễn tả nhịp sống chậm.","vi":""},{"q":"49. Which one do you prefer, life in the ___ area or life in a modern town?","options":["far","further","distance","remote"],"answer":3,"vis":["sai từ loại (không đi trực tiếp trước \"area\" theo cách này)","sai từ loại","sai từ loại (danh từ, cần tính từ)","xa xôi, hẻo lánh (đúng, tính từ + area)"],"explanation":"\"remote area\" = khu vực xa xôi, hẻo lánh.","vi":""},{"q":"50. I have stayed in a ___ area for two weeks. The transportation was very inconvenient and there was no entertainment center to relax.","options":["rural","urban","outskirts","suburb"],"answer":0,"vis":["nông thôn (đúng, giao thông bất tiện, không có khu giải trí)","thành thị (trái nghĩa với ý bất tiện, thiếu giải trí)","danh từ (sai từ loại, cần tính từ)","danh từ (sai từ loại, cần tính từ)"],"explanation":"Giao thông bất tiện, không có khu giải trí → vùng nông thôn (rural).","vi":""}]},{"roman":"IV","navLabel":"Word Forms","icon":"font","title":"Chia dạng đúng của từ (Word Forms)","instructions":"Cho dạng đúng của từ trong ngoặc để hoàn thành câu.","type":"fill","instant":true,"questions":[{"q":"1. Iceland is considered the most _______ country in the world.","hint":"(PEACE)","answer":"peaceful","family":["peace (n): hòa bình","peaceful (adj): yên bình"],"note":"danh từ → tính từ đuôi -ful","vi":"Iceland được coi là quốc gia yên bình nhất thế giới.","explanation":"PEACE → peaceful."},{"q":"2. A _______ lifestyle has its advantages and disadvantages.","hint":"(NOMAD)","answer":"nomadic","family":["nomad (n): người du mục","nomadic (adj): thuộc về du mục"],"note":"danh từ → tính từ đuôi -ic","vi":"Lối sống du mục có những ưu điểm và nhược điểm riêng.","explanation":"NOMAD → nomadic."},{"q":"3. My brother has been a stamp _______ for several years.","hint":"(COLLECT)","answer":"collector","family":["collect (v): thu thập","collector (n): người sưu tầm"],"note":"động từ → danh từ chỉ người đuôi -or","vi":"Anh trai tôi đã là người sưu tầm tem trong nhiều năm.","explanation":"COLLECT → collector."},{"q":"4. It is a/an _______ place to hold a picnic because it is too far from the road.","hint":"(CONVENIENCE)","answer":"inconvenient","family":["convenience (n): sự thuận tiện","convenient (adj): thuận tiện","inconvenient (adj): bất tiện"],"note":"danh từ → tính từ phủ định đuôi in-","vi":"Đó là một nơi bất tiện để tổ chức dã ngoại vì nó quá xa đường lớn.","explanation":"CONVENIENCE → inconvenient."},{"q":"5. Drinking water in some areas may be _______.","hint":"(SAFE)","answer":"unsafe","family":["safe (adj): an toàn","unsafe (adj): không an toàn"],"note":"thêm tiền tố phủ định un-","vi":"Nước uống ở một số khu vực có thể không an toàn.","explanation":"SAFE → unsafe."},{"q":"6. During my stay in the village, I was _______ with several local farmers.","hint":"(FRIEND)","answer":"friendly","family":["friend (n): bạn bè","friendly (adj): thân thiện"],"note":"danh từ → tính từ đuôi -ly","vi":"Trong thời gian ở làng, tôi đã thân thiết với vài nông dân địa phương.","explanation":"FRIEND → friendly."},{"q":"7. Encouraging children to eat and drink _______ is very important.","hint":"(HEALTH)","answer":"healthily","family":["health (n): sức khỏe","healthy (adj): khỏe mạnh, lành mạnh","healthily (adv): một cách lành mạnh"],"note":"danh từ → trạng từ đuôi -ily","vi":"Khuyến khích trẻ ăn uống lành mạnh là điều rất quan trọng.","explanation":"HEALTH → healthily."},{"q":"8. Local people in the village often wear their _______ costume during the festivals.","hint":"(TRADITION)","answer":"traditional","family":["tradition (n): truyền thống","traditional (adj): mang tính truyền thống"],"note":"danh từ → tính từ đuôi -al","vi":"Người dân địa phương thường mặc trang phục truyền thống trong lễ hội.","explanation":"TRADITION → traditional."},{"q":"9. Please give _______ to that charity to help the homeless after the flood.","hint":"(GENEROUS)","answer":"generously","family":["generous (adj): hào phóng","generously (adv): một cách hào phóng"],"note":"tính từ → trạng từ đuôi -ly","vi":"Hãy quyên góp hào phóng cho quỹ từ thiện đó để giúp người vô gia cư sau lũ lụt.","explanation":"GENEROUS → generously."},{"q":"10. The baby slept very _______ because the bed was really comfortable.","hint":"(SOUND)","answer":"soundly","family":["sound (adj): sâu, ngon (giấc)","soundly (adv): một cách say sưa, sâu"],"note":"tính từ → trạng từ đuôi -ly","vi":"Em bé ngủ rất say vì chiếc giường thực sự thoải mái.","explanation":"SOUND → soundly."},{"q":"11. People in my country are very open and _______. I like to go there when I have free time.","hint":"(FRIEND)","answer":"friendly","family":["friend (n): bạn bè","friendly (adj): thân thiện"],"note":"danh từ → tính từ đuôi -ly","vi":"Người dân ở đất nước tôi rất cởi mở và thân thiện. Tôi thích đến đó khi rảnh.","explanation":"FRIEND → friendly."},{"q":"12. Some of my _______ live in the countryside.","hint":"(RELATE)","answer":"relatives","family":["relate (v): liên quan","relative (n): người họ hàng","relatives (n, số nhiều): những người họ hàng"],"note":"động từ → danh từ số nhiều chỉ người","vi":"Một số người họ hàng của tôi sống ở vùng quê.","explanation":"RELATE → relatives."},{"q":"13. Some people say that the country is more _______ for the people who are retired.","hint":"(SUIT)","answer":"suitable","family":["suit (v): phù hợp","suitable (adj): thích hợp"],"note":"động từ → tính từ đuôi -able","vi":"Một số người nói rằng vùng quê phù hợp hơn cho người đã nghỉ hưu.","explanation":"SUIT → suitable."},{"q":"14. Entertainment is difficult to find in the country, _______ in the evening.","hint":"(PARTICULAR)","answer":"particularly","family":["particular (adj): cụ thể, đặc biệt","particularly (adv): đặc biệt là"],"note":"tính từ → trạng từ đuôi -ly","vi":"Giải trí khó tìm ở vùng quê, đặc biệt là vào buổi tối.","explanation":"PARTICULAR → particularly."},{"q":"15. Natural disasters can _______ destroy a harvest and leave the farmers with little or no money until the following year.","hint":"(EASY)","answer":"easily","family":["easy (adj): dễ dàng","easily (adv): một cách dễ dàng"],"note":"tính từ → trạng từ đuôi -ily","vi":"Thiên tai có thể dễ dàng phá hủy một vụ mùa và khiến nông dân gần như không có tiền cho đến năm sau.","explanation":"EASY → easily."},{"q":"16. The pollution in our city is much _______ than it used to be.","hint":"(BAD)","answer":"worse","family":["bad (adj): tệ","worse (adj, so sánh hơn): tệ hơn"],"note":"so sánh hơn bất quy tắc","vi":"Ô nhiễm ở thành phố chúng tôi tệ hơn nhiều so với trước đây.","explanation":"BAD → worse."},{"q":"17. These trousers are too wide. Do you have any that are _______?","hint":"(NARROW)","answer":"narrower","family":["narrow (adj): hẹp","narrower (adj, so sánh hơn): hẹp hơn"],"note":"tính từ ngắn → so sánh hơn +er","vi":"Chiếc quần này quá rộng. Bạn có cái nào hẹp hơn không?","explanation":"NARROW → narrower."},{"q":"18. My mother always gets up _______ than everybody else in the house.","hint":"(EARLY)","answer":"earlier","family":["early (adv): sớm","earlier (adv, so sánh hơn): sớm hơn"],"note":"trạng từ kết thúc bằng y → đổi y thành i + er","vi":"Mẹ tôi luôn dậy sớm hơn mọi người khác trong nhà.","explanation":"EARLY → earlier."},{"q":"19. Max finished the homework _______ than anyone else in the class.","hint":"(FAST)","answer":"faster","family":["fast (adv): nhanh","faster (adv, so sánh hơn): nhanh hơn"],"note":"trạng từ ngắn → so sánh hơn +er","vi":"Max làm xong bài tập nhanh hơn bất kỳ ai khác trong lớp.","explanation":"FAST → faster."},{"q":"20. Get rid of the sorrow! You will do it _______ next time.","hint":"(GOOD)","answer":"better","family":["good (adj): tốt","better (adv, so sánh hơn của well): tốt hơn"],"note":"so sánh hơn bất quy tắc (well → better)","vi":"Hãy bỏ qua nỗi buồn! Lần sau bạn sẽ làm tốt hơn.","explanation":"GOOD → better."}]},{"roman":"V","navLabel":"Chia động từ 1","icon":"pen","title":"Chia đúng dạng của động từ","instructions":"Viết dạng đúng của động từ trong ngoặc.","type":"fill","instant":true,"questions":[{"q":"1. It (be) ___ often hot in summer.","answer":"is","vi":"Trời thường nóng vào mùa hè.","explanation":"Sự thật hiển nhiên, chủ ngữ \"It\" + hiện tại đơn → is."},{"q":"2. The children often go (swim) ___ in rivers after school.","answer":"swimming","vi":"Bọn trẻ thường đi bơi ở sông sau giờ học.","explanation":"\"go + V-ing\" (đi làm hoạt động gì) → swimming."},{"q":"3. It is necessary (water) ___ the flowers twice a day.","answer":"to water","vi":"Cần thiết phải tưới hoa hai lần một ngày.","explanation":"\"It is necessary + to V\" → to water."},{"q":"4. Farmers are always busy with (harvest) ___ their crops.","answer":"harvesting","vi":"Nông dân luôn bận rộn với việc thu hoạch mùa màng.","explanation":"\"be busy with + V-ing\" → harvesting."},{"q":"5. Mai (love) ___ (listen) ___ to the morning sounds in the countryside.","answer":"loves / listening","vi":"Mai thích nghe những âm thanh buổi sáng ở vùng quê.","explanation":"Chủ ngữ số ít + hiện tại đơn: loves; \"love + V-ing\" → listening.","accepted":["loves / listening","loves/listening","loves, listening"]},{"q":"6. My father always (make) ___ important decisions in my family.","answer":"makes","vi":"Bố tôi luôn là người đưa ra các quyết định quan trọng trong gia đình.","explanation":"Chủ ngữ số ít + hiện tại đơn → makes."},{"q":"7. In summer afternoons, children often (fly) ___ kites especially when it (be) ___ windy.","answer":"fly / is","vi":"Vào những buổi chiều mùa hè, trẻ em thường thả diều, đặc biệt khi trời có gió.","explanation":"Chủ ngữ số nhiều \"children\" → fly; \"it\" + hiện tại đơn của be → is.","accepted":["fly / is","fly/is","fly, is"]},{"q":"8. We sometimes (gather) ___ around the campfire and (listen) ___ to the elderly tell stories about my village's heroes.","answer":"Gather / listen","vi":"Đôi khi chúng tôi quây quần quanh đống lửa trại và nghe người già kể chuyện về những anh hùng của làng.","explanation":"Chủ ngữ số nhiều \"We\" + hiện tại đơn → gather / listen.","accepted":["Gather / listen","Gather/listen","Gather, listen"]}]},{"roman":"VI","navLabel":"Chia động từ 2","icon":"pen-fancy","title":"Thì hiện tại đơn","instructions":"Cho dạng đúng của động từ trong ngoặc (thì hiện tại đơn).","type":"fill","instant":true,"questions":[{"q":"1. H5N1 virus (harm) ___ human body very quickly.","answer":"harms","vi":"Vi rút H5N1 gây hại cho cơ thể người rất nhanh.","explanation":"Chủ ngữ số ít (H5N1 virus) + hiện tại đơn → harms."},{"q":"2. Vegetarians (live) ___ on vegetables, fruit and nuts.","answer":"live","vi":"Người ăn chay sống chủ yếu bằng rau, trái cây và các loại hạt.","explanation":"Chủ ngữ số nhiều (Vegetarians) + hiện tại đơn → live."},{"q":"3. Tina (sometimes, miss) ___ the bus to school.","answer":"sometimes misses","vi":"Đôi khi Tina lỡ chuyến xe buýt đến trường.","explanation":"Chủ ngữ số ít (Tina) + hiện tại đơn, trạng từ tần suất đứng trước động từ thường → sometimes misses."},{"q":"4. She (not like) ___ housework at weekends.","answer":"doesn't like","vi":"Cô ấy không thích làm việc nhà vào cuối tuần.","explanation":"Chủ ngữ số ít + phủ định hiện tại đơn → doesn't like."},{"q":"5. They (eat) ___ two eggs every day. That (not be) ___ good for their health.","answer":"eat / isn't","vi":"Họ ăn hai quả trứng mỗi ngày. Điều đó không tốt cho sức khỏe của họ.","explanation":"Chủ ngữ số nhiều (They) → eat; chủ ngữ số ít (That) + phủ định → isn't.","accepted":["eat / isn't","eat/isn't","eat, isn't"]},{"q":"6. My mother and I usually (cook) ___ meals for my family but my father (seldom, cook) ___.","answer":"cook / seldom cooks","vi":"Mẹ tôi và tôi thường nấu ăn cho gia đình nhưng bố tôi hiếm khi nấu.","explanation":"Chủ ngữ số nhiều → cook; chủ ngữ số ít (my father) + trạng từ tần suất → seldom cooks.","accepted":["cook / seldom cooks","cook/seldom cooks","cook, seldom cooks"]},{"q":"7. Hoa and Ba sometimes (not water) ___ the flowers in their garden.","answer":"don't water","vi":"Đôi khi Hoa và Ba không tưới hoa trong vườn của họ.","explanation":"Chủ ngữ số nhiều + phủ định hiện tại đơn → don't water."},{"q":"8. My brother (spend) ___ half an hour (do) ___ his homework everyday.","answer":"spends / doing","vi":"Anh trai tôi dành nửa tiếng để làm bài tập về nhà mỗi ngày.","explanation":"Chủ ngữ số ít + hiện tại đơn → spends; \"spend time + V-ing\" → doing.","accepted":["spends / doing","spends/doing","spends, doing"]}]},{"roman":"VII","navLabel":"Chia động từ 3","icon":"pen-ruler","title":"V-ing hay To-infinitive?","instructions":"Viết dạng đúng (V-ing hoặc to-infinitive) của động từ trong ngoặc.","type":"fill","instant":true,"questions":[{"q":"1. John adores (play) ___ badminton in the winter.","answer":"playing","vi":"John rất thích chơi cầu lông vào mùa đông.","explanation":"\"adore + V-ing\" → playing."},{"q":"2. My father sometimes goes (hunt) ___ in the forests. He'd like to find some more food for our family.","answer":"hunting","vi":"Thỉnh thoảng bố tôi đi săn trong rừng. Ông muốn tìm thêm thức ăn cho gia đình.","explanation":"\"go + V-ing\" → hunting."},{"q":"3. The boy (pick) ___ up a stone and threw it into the river.","answer":"picked","vi":"Cậu bé nhặt một hòn đá lên và ném nó xuống sông.","explanation":"Song song với \"threw\" (quá khứ đơn) → picked."},{"q":"4. He (collect) ___ stamps from many countries since he (be) ___ eight.","answer":"has collected / was","vi":"Anh ấy đã sưu tầm tem từ nhiều nước kể từ khi anh ấy lên tám.","explanation":"\"since + mệnh đề quá khứ\" đi với hiện tại hoàn thành ở mệnh đề chính → has collected; was.","accepted":["has collected / was","has collected/was","has collected, was"]},{"q":"5. Which sports do you like (play) ___?","answer":"playing","vi":"Bạn thích chơi những môn thể thao nào?","explanation":"\"like + V-ing/to V\" → playing (hoặc to play).","accepted":["playing","to play"]},{"q":"6. Hoa's teacher wants her (spend) ___ more time on math.","answer":"to spend","vi":"Cô giáo của Hoa muốn cô ấy dành nhiều thời gian hơn cho môn Toán.","explanation":"\"want somebody + to V\" → to spend."},{"q":"7. I promise I (try) ___ my best next semester.","answer":"will try","vi":"Tôi hứa tôi sẽ cố gắng hết sức vào học kỳ tới.","explanation":"Lời hứa về tương lai → will try."},{"q":"8. Sandra needs (improve) ___ her English writing.","answer":"to improve","vi":"Sandra cần cải thiện kỹ năng viết tiếng Anh của mình.","explanation":"\"need + to V\" → to improve."},{"q":"9. You should (underline) ___ the word you want (learn) ___.","answer":"underline / to learn","vi":"Bạn nên gạch chân từ mà bạn muốn học.","explanation":"\"should + V nguyên mẫu\" → underline; \"want + to V\" → to learn.","accepted":["underline / to learn","underline/to learn","underline, to learn"]},{"q":"10. Can you help me (move) ___ this table?","answer":"move","vi":"Bạn có thể giúp tôi di chuyển cái bàn này không?","explanation":"\"help somebody + V nguyên mẫu (hoặc to V)\" → move.","accepted":["move","to move"]},{"q":"11. Nam always (get) ___ grade A in Physics, but last semester he (get) ___ B.","answer":"gets / got","vi":"Nam luôn đạt điểm A môn Vật lý, nhưng học kỳ trước cậu ấy được điểm B.","explanation":"Hiện tại đơn (always) → gets; quá khứ đơn (last semester) → got.","accepted":["gets / got","gets/got","gets, got"]},{"q":"12. They were proud of (be) ___ so successful.","answer":"being","vi":"Họ tự hào vì đã rất thành công.","explanation":"\"proud of + V-ing\" → being."}]},{"roman":"VIII","navLabel":"Sửa lỗi 1","icon":"wrench","title":"Tìm lỗi sai (A, B, C hoặc D)","instructions":"Tìm và chọn phần gạch chân có lỗi sai trong mỗi câu.","type":"mcq","instant":true,"questions":[{"q":"1. Farzana <u>did</u> <u>poor</u> on her algebra quiz <u>because</u> she couldn’t concentrate <u>well</u>.","options":["did","poor","because","well"],"answer":1,"vis":["đã làm","sai — cần trạng từ: poorly","bởi vì","tốt"],"explanation":"Cần trạng từ bổ nghĩa cho động từ \"did\" → poor phải sửa thành poorly."},{"q":"2. The test was <u>more</u> difficult <u>than I expected</u>. I <u>could</u> finish it <u>at least</u> 20 minutes early.","options":["more","than I expected","could","at least"],"answer":0,"vis":["sai — đề dễ hơn dự kiến nên mới xong sớm, cần \"less\"","hơn tôi mong đợi","có thể","ít nhất"],"explanation":"Đề thi DỄ hơn dự kiến nên mới có thể làm xong sớm → more phải sửa thành less."},{"q":"3. <u>Although</u> the island has <u>no</u> clean water and <u>electric</u>, it attracts lots of <u>tourists</u>.","options":["Although","no","electric","tourists"],"answer":2,"vis":["mặc dù","không có","sai — cần danh từ: electricity","khách du lịch"],"explanation":"Cần danh từ song song với \"clean water\" → electric phải sửa thành electricity."},{"q":"4. The bee can <u>easy</u> sting <u>anyone</u> coming <u>close to</u> their <u>beehives</u>.","options":["easy","anyone","close to","beehives"],"answer":0,"vis":["sai — cần trạng từ bổ nghĩa cho \"sting\": easily","bất kỳ ai","đến gần","tổ ong"],"explanation":"Cần trạng từ bổ nghĩa cho động từ \"sting\" → easy phải sửa thành easily."},{"q":"5. I love <u>farm work</u>, such as <u>digging holes</u>, <u>sowing seeds</u> and I <u>pick fruit</u>.","options":["farm work","digging holes","sowing seeds","pick fruit"],"answer":3,"vis":["việc đồng áng","đào hố","gieo hạt","sai — cần V-ing song song: picking fruit"],"explanation":"Cấu trúc song song 3 danh động từ (digging, sowing, …) → pick fruit phải sửa thành picking fruit."},{"q":"6. She is <u>boring with</u> the silent <u>surrounding</u> because she <u>used</u> to <u>live</u> in a big city.","options":["boring with","surrounding","used","live"],"answer":0,"vis":["sai — cô ấy CẢM THẤY chán nên cần \"bored with\"","môi trường xung quanh","đã từng","sống"],"explanation":"Diễn tả cảm giác của người → boring with phải sửa thành bored with."},{"q":"7. <u>Life</u> in the countryside is <u>much</u> peaceful and <u>the life</u> is also <u>slower</u>.","options":["Life","much","the life","slower"],"answer":1,"vis":["cuộc sống","sai — so sánh hơn cần \"more\"","cuộc sống đó","chậm hơn"],"explanation":"So sánh hơn với tính từ dài \"peaceful\" → much phải sửa thành more."},{"q":"8. <u>Nomadic</u> children learn <u>riding</u> a horse <u>when</u> they are very <u>small</u>.","options":["Nomadic","riding","when","small"],"answer":1,"vis":["thuộc du mục","sai — \"learn\" đi với to-V: to ride","khi","nhỏ"],"explanation":"\"learn to do something\" = học làm gì → riding phải sửa thành to ride."},{"q":"9. After <u>a few weeks</u> of lessons I <u>could dance</u> <u>gracefully</u> <u>than before</u>.","options":["a few weeks","could dance","gracefully","than before"],"answer":2,"vis":["một vài tuần","có thể nhảy","sai — so sánh hơn cần \"more gracefully\"","hơn trước đây"],"explanation":"So sánh hơn với trạng từ dài \"gracefully\" (có \"than before\") → gracefully phải sửa thành more gracefully."},{"q":"10. Steve <u>works</u> <u>more happy</u> <u>than</u> he <u>used to</u>.","options":["works","more happy","than","used to"],"answer":1,"vis":["làm việc","sai — tính từ ngắn tận cùng \"y\" cần đổi y→i+er: happier","hơn","đã từng"],"explanation":"Tính từ ngắn \"happy\" (kết thúc bằng y) → so sánh hơn: happier (không dùng \"more\")."}]},{"roman":"IX","navLabel":"Sửa lỗi 2","icon":"file-pen","title":"Tìm và sửa 10 lỗi sai trong đoạn văn","instructions":"Đọc đoạn văn. Mỗi câu có một lỗi sai. Gõ từ ĐÚNG vào ô trống.","type":"fill","instant":true,"passage":{"title":"A trip to the countryside (đoạn văn gốc – có lỗi)","html":"Last summer Tuan invited me go to his village in Thai Binh Province with his father.<br><br>It’s harvest time, so all people there were very busy. The villagers got up very early and go to the field to cut rice, load it onto buffalo-drawn carts or tractor and drove it home. Tuan’s father helped his parents on the farm work. Tuan and I followed his father to go to the fields. There was so many space and I love the vast open space, the fresh air and the feel of freedom in the countryside. We would run around the fields and shout out loudly without disturbing anybody. I have never saw any interesting place like this. In the afternoon, some of Tuan’s cousins take us to the fields to fly kites – It’s was so exciting!<br><br>In the next morning, Tuan and I went to the market with his grandmother. There were many interesting thing there. Locals seld their home-made products and many fresh fruits such as bananas, oranges, apples and they also sold animals such as chickens, geese, ducks, cats, dogs and pigs. I enjoyed the atmosphere there.<br><br>The trip to the countryside gave me my first experience of farm work: cutting rice, dry rice, planting vegetables, collecting potatoes. It’s really unforgettable!","vi":"Mùa hè năm ngoái, Tuấn mời tôi về làng của cậu ấy ở tỉnh Thái Bình cùng với bố cậu ấy.<br><br>Lúc đó là mùa gặt, nên mọi người ở đó đều rất bận rộn. Dân làng dậy rất sớm và ra đồng cắt lúa, chất lên xe trâu kéo hoặc máy kéo rồi chở về nhà. Bố của Tuấn giúp ông bà làm việc đồng áng. Tuấn và tôi theo bố cậu ấy ra đồng. Có rất nhiều không gian và tôi yêu thích khoảng không rộng lớn, không khí trong lành và cảm giác tự do ở vùng quê. Chúng tôi chạy khắp cánh đồng và hét lên thật to mà không làm phiền ai. Tôi chưa bao giờ thấy một nơi thú vị như thế này. Buổi chiều, vài người anh chị em họ của Tuấn đưa chúng tôi ra đồng thả diều – thật là thú vị!<br><br>Sáng hôm sau, Tuấn và tôi cùng bà của cậu ấy đi chợ. Có rất nhiều thứ thú vị ở đó. Người dân địa phương bán các sản phẩm tự làm và nhiều loại trái cây tươi như chuối, cam, táo, và họ cũng bán các loại gia súc gia cầm như gà, ngỗng, vịt, mèo, chó và lợn. Tôi rất thích không khí ở đó.<br><br>Chuyến đi về vùng quê đã cho tôi trải nghiệm đầu tiên về công việc đồng áng: cắt lúa, phơi lúa, trồng rau, thu hoạch khoai tây. Thật sự là một trải nghiệm khó quên!"},"questions":[{"q":"1. Last summer Tuan invited me go to his village in Thai Binh Province with his father.  →  Sửa: ___","answer":"to go","explanation":"\"invite somebody + to V\" → go phải sửa thành to go.","vi":"Mùa hè năm ngoái, Tuấn mời tôi về làng của cậu ấy ở tỉnh Thái Bình."},{"q":"2. The villagers got up very early and go to the field to cut rice…  →  Sửa: ___","answer":"went","explanation":"Song song với \"got up\" (quá khứ đơn) → go phải sửa thành went.","vi":"Dân làng dậy rất sớm và ra đồng cắt lúa…"},{"q":"3. Tuan’s father helped his parents on the farm work.  →  Sửa: ___","answer":"with","explanation":"\"help somebody with something\" = giúp ai làm việc gì → on phải sửa thành with.","vi":"Bố của Tuấn giúp ông bà làm việc đồng áng."},{"q":"4. There was so many space and I love the vast open space…  →  Sửa: ___","answer":"much","explanation":"\"space\" là danh từ không đếm được → many phải sửa thành much.","vi":"Có rất nhiều không gian và tôi yêu thích khoảng không rộng lớn…"},{"q":"5. …the fresh air and the feel of freedom in the countryside.  →  Sửa: ___","answer":"feeling","explanation":"Cần danh từ \"feeling\" (cảm giác) thay vì động từ \"feel\" → feel phải sửa thành feeling.","vi":"…không khí trong lành và cảm giác tự do ở vùng quê."},{"q":"6. I have never saw any interesting place like this.  →  Sửa: ___","answer":"seen","explanation":"Hiện tại hoàn thành \"have never + P2\" → saw phải sửa thành seen.","vi":"Tôi chưa bao giờ thấy một nơi thú vị như thế này."},{"q":"7. In the afternoon, some of Tuan’s cousins take us to the fields to fly kites.  →  Sửa: ___","answer":"took","explanation":"Câu chuyện kể ở thì quá khứ → take phải sửa thành took.","vi":"Buổi chiều, vài người anh chị em họ của Tuấn đưa chúng tôi ra đồng thả diều."},{"q":"8. There were many interesting thing there.  →  Sửa: ___","answer":"things","explanation":"Sau \"many\" cần danh từ số nhiều → thing phải sửa thành things.","vi":"Có rất nhiều thứ thú vị ở đó."},{"q":"9. Locals seld their home-made products and many fresh fruits…  →  Sửa: ___","answer":"sold","explanation":"Lỗi chính tả/chia động từ, quá khứ của \"sell\" → seld phải sửa thành sold.","vi":"Người dân địa phương bán các sản phẩm tự làm và nhiều loại trái cây tươi…"},{"q":"10. …my first experience of farm work: cutting rice, dry rice, planting vegetables, collecting potatoes.  →  Sửa: ___","answer":"drying","explanation":"Cấu trúc song song 4 danh động từ (cutting, …, planting, collecting) → dry phải sửa thành drying.","vi":"…trải nghiệm đầu tiên về công việc đồng áng: cắt lúa, phơi lúa, trồng rau, thu hoạch khoai tây."}]},{"roman":"X","navLabel":"Đọc hiểu 1","icon":"book-open","title":"Đọc hiểu – My village (Điền từ)","instructions":"Đọc đoạn văn và điền một từ thích hợp vào mỗi chỗ trống.","type":"fill","instant":true,"passage":{"title":"My village","html":"My grandmother told me that our village <b>(1)</b> ___ very poor many years ago. The villagers had to work hard in the fields all day but they could not earn enough for their living. Their lives were very simple. Many people had to <b>(2)</b> ___ in houses made of straw and mud. Nowadays my village has <b>(3)</b> ___ a lot. People live in big brick houses. In the evening, they can listen to the <b>(4)</b> ___ on the radio or watch TV for entertainment.<br><br>All people in my village try their best to make their living better. They raise and resurface the roads <b>(5)</b> ___ the roads will not be muddy and flooded after it rains. They widen the roads so cars and lorries can get to the village easily. They build a medical centre so people’s health can be looked <b>(6)</b> ___ at any time. They build a new school so their <b>(7)</b> ___ have better learning conditions. They build a bridge <b>(8)</b> ___ the river so villagers have a shorter way to town. They also build a football ground so their children can <b>(9)</b> ___ sports.<br><br>And they grow cash crops so people can export the crops and have more money. I would like to become an agricultural engineer in the future so I can apply new technology to our farming and do more for the village <b>(10)</b> ___ our parents did.","vi":"Bà tôi kể rằng làng chúng tôi <b>(1)</b> ___ rất nghèo nhiều năm trước. Dân làng phải làm việc vất vả ngoài đồng cả ngày nhưng vẫn không đủ sống. Cuộc sống của họ rất đơn giản. Nhiều người phải <b>(2)</b> ___ sống trong những căn nhà làm bằng rơm và bùn. Ngày nay làng tôi đã <b>(3)</b> ___ thay đổi rất nhiều. Người dân sống trong những ngôi nhà gạch lớn. Buổi tối, họ có thể nghe <b>(4)</b> ___ tin tức trên đài hoặc xem TV để giải trí.<br><br>Mọi người trong làng tôi đều cố gắng hết sức để cuộc sống tốt hơn. Họ nâng cấp và trải lại mặt đường <b>(5)</b> ___ để đường không bị lầy lội và ngập sau khi mưa. Họ mở rộng đường để xe hơi và xe tải có thể vào làng dễ dàng. Họ xây một trạm y tế để sức khỏe người dân có thể được chăm sóc <b>(6)</b> ___ bất cứ lúc nào. Họ xây một ngôi trường mới để <b>(7)</b> ___ con em có điều kiện học tập tốt hơn. Họ xây một cây cầu <b>(8)</b> ___ bắc qua sông để dân làng có đường ngắn hơn ra thị trấn. Họ cũng xây một sân bóng đá để trẻ em có thể <b>(9)</b> ___ chơi thể thao.<br><br>Và họ trồng cây công nghiệp để người dân có thể xuất khẩu và có thêm thu nhập. Tôi muốn trở thành một kỹ sư nông nghiệp trong tương lai để có thể áp dụng công nghệ mới vào nông nghiệp và làm được nhiều hơn cho ngôi làng <b>(10)</b> ___ so với những gì bố mẹ tôi đã làm."},"questions":[{"q":"1. Fill in blank number 1.","answer":"was","explanation":"Mốc thời gian quá khứ \"many years ago\" → quá khứ đơn của \"be\": was."},{"q":"2. Fill in blank number 2.","answer":"live","explanation":"\"have to + V nguyên mẫu\" → live (sống trong nhà làm bằng rơm và bùn)."},{"q":"3. Fill in blank number 3.","answer":"changed","explanation":"\"has + P2\" (hiện tại hoàn thành) → changed (đã thay đổi)."},{"q":"4. Fill in blank number 4.","answer":"news","explanation":"\"listen to the news\" = nghe tin tức (trên đài)."},{"q":"5. Fill in blank number 5.","answer":"so","explanation":"\"so that\" (rút gọn \"so\") = để mà → mục đích của việc nâng cấp đường."},{"q":"6. Fill in blank number 6.","answer":"after","explanation":"\"look after\" = chăm sóc → looked after."},{"q":"7. Fill in blank number 7.","answer":"children","explanation":"Chủ ngữ số nhiều, chỉ con em trong làng → children."},{"q":"8. Fill in blank number 8.","answer":"over","explanation":"\"a bridge over the river\" = cây cầu bắc qua sông."},{"q":"9. Fill in blank number 9.","answer":"play/do","explanation":"\"play/do sports\" = chơi thể thao."},{"q":"10. Fill in blank number 10.","answer":"than","explanation":"So sánh \"more...than\" = nhiều hơn so với → than." u thú vị về vùng quê. Sau khi ăn trái cây và bánh ngọt, họ chào tạm biệt và ra về."},"questions":[{"q":"1. How did Nick and his classmates go to Uncle Brown's farm?","answer":"They went there by bus.","accepted":["they went there by bus"],"vi":"Họ đã đi đến đó bằng xe buýt."},{"q":"2. What does his uncle grow on his farm?","answer":"He grows wheat, vegetables and potatoes.","accepted":["he grows wheat vegetables and potatoes"],"vi":"Ông ấy trồng lúa mì, rau và khoai tây."},{"q":"3. What can a tractor do?","answer":"It can plough and break soil, distribute manure and plant potatoes.","accepted":["it can plough and break soil distribute manure and plant potatoes"],"vi":"Nó có thể cày và làm tơi đất, rải phân và trồng khoai tây."},{"q":"4. What is typical of a combine harvester?","answer":"A combine harvester can cut and thresh corn at the same time.","accepted":["a combine harvester can cut and thresh corn at the same time"],"vi":"Máy gặt đập liên hợp có thể cắt và tuốt lúa cùng một lúc."},{"q":"5. Which kinds of cattle are raised on Uncle Brown's farm?","answer":"Horses, sheep and cows are raised on Uncle Brown's farm.","accepted":["horses sheep and cows are raised on uncle brown's farm"],"vi":"Ngựa, cừu và bò được nuôi ở nông trại của chú Brown."}]},{"roman":"XII","navLabel":"Đọc hiểu 3","icon":"book-open","title":"Đọc hiểu – My parents, the farmers","instructions":"Đọc đoạn văn và chọn đáp án đúng nhất A, B, C hoặc D cho mỗi chỗ trống.","type":"mcq","instant":true,"passage":{"title":"My parents, the farmers","html":"My parents are farmers. They work very <b>(1)</b> ___ on the paddy fields. They usually get <b>(2)</b> ___ very early in the morning. After <b>(3)</b> ___ breakfast, they feed the buffaloes, pigs, chickens, ducks and they <b>(4)</b> ___ the eggs. From about eight, they work on the field. They <b>(5)</b> ___ rice but their <b>(6)</b> ___ is vegetables.<br><br>From eleven thirty to one thirty, they rest and have lunch. They continue to work until five in   <div class="theory-card bg-white rounded-xl p-4 mb-3" style="border-left-color:#f59e0b;box-shadow:0 2px 8px rgba(0,0,0,.05)">
    <h4 class="font-extrabold text-amber-600 mb-2"><i class="fa-solid fa-circle-info mr-2 text-amber-500"></i>I. COMPARATIVE ADJECTIVES <span class="text-sm font-semibold text-slate-500">(So sánh hơn của tính từ)</span></h4>
    <p class="text-sm text-slate-600 mb-2">Dùng để so sánh giữa người/vật này với người/vật khác.</p>
    <div class="grid sm:grid-cols-2 gap-2 text-sm text-slate-700">
      <div class="bg-amber-50 rounded-lg p-2 border border-amber-200"><b>Tính từ ngắn:</b> S + be + adj + <b>er</b> + than + N/Pronoun<br><i>China is bigger than India.</i></div>
      <div class="bg-amber-50 rounded-lg p-2 border border-amber-200"><b>Tính từ dài:</b> S + be + <b>more</b> + adj + than + N/Pronoun<br><i>Gold is more valuable than silver.</i></div>
    </div>
  </div>

  <div class="theory-card bg-white rounded-xl p-4 mb-3" style="border-left-color:#ec4899;box-shadow:0 2px 8px rgba(0,0,0,.05)">
    <h4 class="font-extrabold text-pink-600 mb-2"><i class="fa-solid fa-link mr-2"></i>II. COMPARATIVE ADVERBS <span class="text-sm font-semibold text-slate-500">(So sánh hơn của trạng từ)</span></h4>
    <div class="grid sm:grid-cols-2 gap-2 text-sm text-slate-700 mb-3">
      <div class="bg-pink-50 rounded-lg p-2 border border-pink-200"><b>Trạng từ ngắn</b> (1 âm tiết: hard, fast, near, far…): S + V + adv + <b>er</b> + than<br><i>They work harder than I do.</i></div>
      <div class="bg-pink-50 rounded-lg p-2 border border-pink-200"><b>Trạng từ dài</b> (2+ âm tiết: quickly, carefully…): S + V + <b>more/less</b> + adv + than<br><i>My friend did the test more carefully than I did.</i></div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-xs border-collapse text-center">
        <thead><tr class="bg-violet-50 text-violet-700"><th class="p-2">So sánh bằng</th><th class="p-2">So sánh hơn</th><th class="p-2">So sánh nhất</th></tr></thead>
        <tbody>
          <tr class="border-b border-slate-100"><td class="p-1.5">quickly</td><td class="p-1.5">more quickly</td><td class="p-1.5">most quickly</td></tr>
          <tr class="border-b border-slate-100"><td class="p-1.5">hard</td><td class="p-1.5">harder</td><td class="p-1.5">hardest</td></tr>
          <tr class="border-b border-slate-100"><td class="p-1.5">early</td><td class="p-1.5">earlier</td><td class="p-1.5">earliest</td></tr>
        </tbody>
      </table>
    </div>
    <p class="text-xs text-slate-500 mt-2">* Trạng từ kết thúc bằng "y" → đổi y thành i rồi thêm er/est: early → earlier → earliest.</p>
  </div>

  <div class="bg-violet-50 rounded-xl p-3 text-sm text-violet-800 mb-3">
    <b>Một số dạng bất quy tắc thường gặp:</b>
    <div class="grid sm:grid-cols-2 gap-2 mt-2 text-xs">
      <div class="bg-white rounded-lg px-2 py-1.5 border border-violet-200">well → better → best</div>
      <div class="bg-white rounded-lg px-2 py-1.5 border border-violet-200">badly → worse → worst</div>
      <div class="bg-white rounded-lg px-2 py-1.5 border border-violet-200">little → less → least</div>
      <div class="bg-white rounded-lg px-2 py-1.5 border border-violet-200">much → more → most</div>
      <div class="bg-white rounded-lg px-2 py-1.5 border border-violet-200">far → farther/further → farthest/furthest</div>
      <div class="bg-white rounded-lg px-2 py-1.5 border border-violet-200">good → better → best</div>
    </div>
  </div>

  <div class="bg-gradient-to-r from-rose-50 to-pink-50 border border-rose-200 rounded-2xl p-4 mb-3">
    <h4 class="font-extrabold text-rose-700 mb-2"><i class="fa-solid fa-triangle-exclamation mr-2 text-rose-500"></i>Lỗi thường gặp</h4>
    <ul class="space-y-1 text-sm text-rose-900">
      <li>❌ Dùng cả "more" và "-er" cùng lúc: <s>more slower</s> → <b>slower</b> hoặc <b>more slow</b> (chỉ chọn một).</li>
      <li>❌ Thêm "the" trước so sánh hơn (chỉ dùng "the" cho so sánh NHẤT): <s>the bigger</s> → <b>bigger</b>.</li>
      <li>❌ Dùng tính từ để bổ nghĩa động từ (cần trạng từ): <s>drives more careful</s> → <b>drives more carefully</b>.</li>
      <li>❌ Nhầm "well" (trạng từ) với "good" (tính từ) khi so sánh: <s>more good</s> → <b>better</b>.</li>
    </ul>
  </div>

  <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-4">
    <h4 class="font-extrabold text-amber-700 mb-2"><i class="fa-solid fa-bolt mr-2 text-amber-500"></i>Mẹo nhớ nhanh</h4>
    <ul class="space-y-1 text-sm text-amber-900">
      <li>🔑 Tính từ/trạng từ 1 âm tiết (hoặc 2 âm tiết tận cùng bằng "y") → thêm <b>-er</b>.</li>
      <li>🔑 Tính từ/trạng từ 2+ âm tiết → dùng <b>more/less</b> phía trước.</li>
      <li>🔑 So sánh NHẤT luôn có "the" đứng trước; so sánh HƠN thì KHÔNG.</li>
      <li>🔑 Ghi nhớ các dạng bất quy tắc: good/well → better; bad/badly → worse; far → farther/further.</li>
    </ul>
  </div>
</div>
`;
function normalize(str){
  return (str||'').trim().toLowerCase()
    .replace(/[‘’]/g,"'")
    .replace(/["“”]/g,'')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ');
}
function widthFor(ref){ const l=(ref||'').length; return l<7?'w-32':l<16?'w-40':'w-full'; }

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)){ alert('Trình duyệt của bạn không hỗ trợ phát âm tự động. Hãy thử Chrome, Edge hoặc Safari.'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>btn.classList.remove('speaking'); u.onerror=()=>btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function fillFromBank(idx, bi){
  const chip = document.getElementById(`bankchip_${idx}_${bi}`);

  const word = DATA.sections[idx].bank[bi];
  const inputs = Array.from(document.querySelectorAll(`#tab-${idx} input.answer-input[id^="inp_${idx}_"]`));
  const target = inputs.find(inp => inp.value.trim()==='');

  target.value = word;

  chip.classList.add('used');

function releaseBankChipIfChanged(idx,i){

function togglePassageVI(idx){ const el=document.getElementById(`passage_vi_${idx}`); if(el) el.classList.toggle('vi-hidden'); }
function selectMcq(idx,i,j){
  const q=DATA.sections[idx].questions[i];
  document.querySelectorAll(`[id^="opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${idx}_${i}_${j}`).classList.add('selected');
  document.getElementById(`opt_${idx}_${i}_${j}`).dataset.chosen = j;
  if(DATA.sections[idx].instant){ gradeOneMcq(idx,i); }
}

function gradeOneMcq(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const qblock=document.getElementById(`qblock_${idx}_${i}`);
  if(qblock) qblock.classList.add('show-mcq-detail');
  const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
  const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
  const ok = chosen === q.answer;
  const answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
  q.options.forEach((o,j)=>{
    const el=document.getElementById(`opt_${idx}_${i}_${j}`);
    el.classList.remove('correct-opt','wrong-opt');
    if(j===q.answer) el.classList.add('correct-opt');
    else if(j===chosen) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function gradeOneSentence(idx,i){
  const q=DATA.sections[idx].questions[i];
  const inp=document.getElementById(`inp_${idx}_${i}`);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(!inp || !fb) return;
  const raw=inp.value.trim();
  if(raw===''){
    inp.classList.remove('correct-input','wrong-input');
    fb.classList.remove('show'); fb.innerHTML='';
    return;
  }
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function selectTF(idx,i,val){
  const tBtn=document.getElementById(`tfT_${idx}_${i}`);
  const fBtn=document.getElementById(`tfF_${idx}_${i}`);
  tfState[`${idx}_${i}`] = val;
  if(tBtn) tBtn.classList.remove('tf-selected-T');
  if(fBtn) fBtn.classList.remove('tf-selected-F');
  if(val && tBtn) tBtn.classList.add('tf-selected-T');
  if(!val && fBtn) fBtn.classList.add('tf-selected-F');
}

function addChip(idx,i,j){
  const key = `${idx}_${i}`;
  if(!reorderState[key]) reorderState[key] = [];
  const chip = document.getElementById(`chip_${idx}_${i}_${j}`);
  if(!chip || chip.classList.contains('used')) return;
  chip.classList.add('used');
  reorderState[key].push(j);
  renderReorderLine(idx,i);
  const totalWords = DATA.sections[idx].questions[i].words.length;
  if(DATA.sections[idx].instant && reorderState[key].length===totalWords){ gradeOneSentence(idx,i); }
}
function removeChip(idx,i,pos){
  const key = `${idx}_${i}`;
  if(!reorderState[key]) return;
  const j = reorderState[key][pos];
  reorderState[key].splice(pos,1);
  const chip = document.getElementById(`chip_${idx}_${i}_${j}`);
  if(chip) chip.classList.remove('used');
  renderReorderLine(idx,i);
  const inp=document.getElementById(`inp_${idx}_${i}`);
  if(inp){ inp.classList.remove('correct-input','wrong-input'); }
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(fb){ fb.classList.remove('show'); fb.innerHTML=''; }
}
function clearChips(idx,i){
  const key = `${idx}_${i}`;
  (reorderState[key]||[]).forEach(j=>{
    const chip = document.getElementById(`chip_${idx}_${i}_${j}`);
    if(chip) chip.classList.remove('used');
  });
  reorderState[key] = [];
  renderReorderLine(idx,i);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(fb){ fb.classList.remove('show'); fb.innerHTML=''; }
}
function renderReorderLine(idx,i){
  const key = `${idx}_${i}`;
  const words = DATA.sections[idx].questions[i].words;
  const line = document.getElementById(`line_${idx}_${i}`);
  const inp = document.getElementById(`inp_${idx}_${i}`);
  const seq = reorderState[key]||[];
  if(!seq.length){
    line.innerHTML = `<span class="text-slate-400 text-sm italic">Nhấp vào các từ bên trên theo đúng thứ tự…</span>`;
  } else {
    line.innerHTML = seq.map((wi,pos)=>`<span class="word-chip bg-lime-500 text-white font-bold text-sm px-3 py-1.5 rounded-xl" onclick="removeChip(${idx},${i},${pos})">${words[wi]}</span>`).join('');
  }
  if(inp) inp.value = seq.map(wi=>words[wi]).join(' ');
}

function feedbackHTML(ok, answerLabel, explanation, vi, note){
  const okLine = ok? `<span class="text-emerald-700 font-bold">✅ Chính xác!</span>` : `<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án đúng: <b>${answerLabel}</b>`;
  const expLine = explanation? `<br><span class="text-blue-700">💡 ${explanation}</span>` : '';
  const viLine = vi? `<span class="text-slate-500">📖 Nghĩa: <i>${vi}</i></span>` : '';
  const noteLine = note? `<br><span class="text-violet-600">📐 Công thức: <b>${note}</b></span>` : '';
  if(note){
    return (viLine?viLine+'<br>':'') + okLine + expLine + noteLine;
  }
  return okLine + expLine + (viLine?'<br>'+viLine:'') + noteLine;
}

function checkSection(idx){
  const s=DATA.sections[idx];
  let correct=0;
  s.questions.forEach((q,i)=>{
    let ok=false, answerLabel='';
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='mcq'){
      const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
      const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
      ok = chosen === q.answer;
      answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
        else if(j===chosen) el.classList.add('wrong-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else if(s.type==='truefalse_correct'){
      const key = `${idx}_${i}`;
      const chosen = tfState[key];
      const tBtn=document.getElementById(`tfT_${idx}_${i}`);
      const fBtn=document.getElementById(`tfF_${idx}_${i}`);
      const inp=document.getElementById(`inp_${idx}_${i}`);
      let corrOk = true;
      if(q.correct === false){
        const cv = normalize(inp.value);
        const cacc = (q.accepted||[q.correction]).map(normalize);
        corrOk = cv!=='' && cacc.includes(cv);
        inp.classList.remove('correct-input','wrong-input');
        inp.classList.add(corrOk?'correct-input':'wrong-input');
      } else {
        inp.classList.remove('correct-input','wrong-input');
      }
      tBtn.classList.remove('tf-correct','tf-wrong');
      fBtn.classList.remove('tf-correct','tf-wrong');
      if(q.correct) tBtn.classList.add('tf-correct'); else fBtn.classList.add('tf-correct');
      if(chosen!==undefined && chosen!==q.correct){ (chosen?tBtn:fBtn).classList.add('tf-wrong'); }
      ok = (chosen===q.correct) && corrOk;
      answerLabel = `${q.correct?'ĐÚNG (✓)':'SAI (✗)'}${q.correction?' → '+q.correction:''}`;
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      const val=normalize(inp.value);
      const acc=(q.accepted||[q.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.classList.remove('correct-input','wrong-input');
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = q.answer;
    }
    if(ok) correct++;
    fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
    fb.classList.add('show');
  });
  const total=s.questions.length;
  scores[idx]={correct,total};
  const scoreEl=document.getElementById(`score_${idx}`);
  scoreEl.textContent = `🏆 Điểm: ${correct}/${total}`;
  scoreEl.classList.remove('hidden');
  completedTasks.add(idx);
  updateProgress();
  if(completedTasks.size===TOTAL_TASKS) setTimeout(showCompletion,500);
}

function revealSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    let answerLabel;
    if(s.type==='mcq'){
      answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else if(s.type==='truefalse_correct'){
      answerLabel = `${q.correct?'ĐÚNG (✓)':'SAI (✗)'}${q.correction?' → '+q.correction:''}`;
      const tBtn=document.getElementById(`tfT_${idx}_${i}`);
      const fBtn=document.getElementById(`tfF_${idx}_${i}`);
      tBtn.classList.remove('tf-correct','tf-wrong'); fBtn.classList.remove('tf-correct','tf-wrong');
      if(q.correct) tBtn.classList.add('tf-correct'); else fBtn.classList.add('tf-correct');
    } else {
      answerLabel = q.answer;
    }
    fb.innerHTML = `👁️ Đáp án: <b>${answerLabel}</b>` + (q.explanation?`<br><span class="text-blue-700">💡 ${q.explanation}</span>`:'') + (q.vi?`<br><span class="text-slate-500">📖 Nghĩa: <i>${q.vi}</i></span>`:'') + (q.note?`<br><span class="text-violet-600">📐 Công thức: <b>${q.note}</b></span>`:'');
    fb.classList.add('show');
  });
}

function resetSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt','selected');
        delete el.dataset.chosen;
      });
    } else if(s.type==='reorder'){
      clearChips(idx,i);
    } else if(s.type==='truefalse_correct'){
      const key = `${idx}_${i}`;
      delete tfState[key];
      const tBtn=document.getElementById(`tfT_${idx}_${i}`);
      const fBtn=document.getElementById(`tfF_${idx}_${i}`);
      if(tBtn) tBtn.classList.remove('tf-selected-T','tf-correct','tf-wrong');
      if(fBtn) fBtn.classList.remove('tf-selected-F','tf-correct','tf-wrong');
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    }
    const qblock=document.getElementById(`qblock_${idx}_${i}`);
    if(qblock) qblock.classList.remove('show-mcq-detail');
    const fb=document.getElementById(`fb_${idx}_${i}`);
    fb.classList.remove('show'); fb.innerHTML='';
  });
  document.querySelectorAll(`#tab-${idx} .bank-chip`).forEach(c=>c.classList.remove('used'));
  const scoreEl=document.getElementById(`score_${idx}`); scoreEl.classList.add('hidden');
  completedTasks.delete(idx); delete scores[idx]; updateProgress();
}

function showTab(idx){
  document.querySelectorAll('.section-page').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-slate-600');});
  document.getElementById(`tab-${idx}`).classList.add('active');
  const btnId = idx==='theory' ? 'navbtn_theory' : idx==='writing' ? 'navbtn_writing' : `navbtn_${idx}`;
  const btn=document.getElementById(btnId);
  btn.classList.add('active'); btn.classList.remove('text-slate-600');
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=completedTasks.size;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TASKS} phần`;
  document.getElementById('progressBar').style.width = `${(done/TOTAL_TASKS)*100}%`;
}

function showCompletion(){
  fireConfetti();
  const banner=document.getElementById('completionBanner');
  banner.classList.remove('hidden'); banner.classList.add('show');
  let c=0,t=0; Object.values(scores).forEach(s=>{c+=s.correct; t+=s.total;});
  document.getElementById('finalScoreDisplay').textContent = `🎯 ${c} / ${t} câu đúng`;
}
function closeBanner(){ const b=document.getElementById('completionBanner'); b.classList.remove('show'); b.classList.add('hidden'); }
function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); wrap.innerHTML='';
  const colors=['#ea580c','#db2777','#8b5cf6','#f59e0b','#ec4899','#a855f7'];
  for(let i=0;i<90;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

buildNav();
buildMain();
updateProgress();


function toggleModelEssay(){ document.getElementById('model-essay').classList.toggle('vi-hidden'); }
(function(){
  const essay = document.getElementById('essay-input');
  if(essay){
    essay.addEventListener('input', () => {
      const words = essay.value.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('essay-count').textContent = `Số từ: ${words}`;
    });
  }
})();
</script>
