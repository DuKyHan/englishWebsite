g âm chính rơi vào âm tiết khác với các từ còn lại."},{"q":"13. Choose the word whose main stressed syllable is placed differently from that of the others.","options":["respect","mention","expert","worship"],"answer":3,"ipas":["/rɪˈspekt/","/ˈmenʃn/","/ˈekspɜːt/","/ˈwɜːʃɪp/"],"vis":["sự tôn trọng","đề cập","chuyên gia","sự tôn thờ"],"vi":"Chọn từ có trọng âm chính rơi vào âm tiết khác với các từ còn lại."},{"q":"14. Choose the word whose main stressed syllable is placed differently from that of the others.","options":["pagoda","complement","society","tradition"],"answer":0,"ipas":["/pəˈɡəʊdə/","/ˈkɒmplɪmənt/","/səˈsaɪəti/","/trəˈdɪʃn/"],"vis":["ngôi chùa","phần bổ sung","xã hội","truyền thống"],"vi":"Chọn từ có trọng âm chính rơi vào âm tiết khác với các từ còn lại."},{"q":"15. Choose the word whose main stressed syllable is placed differently from that of the others.","options":["custom","explain","chopstick","manner"],"answer":1,"ipas":["/ˈkʌstəm/","/ɪkˈspleɪn/","/ˈtʃɒpstɪk/","/ˈmænə(r)/"],"vis":["phong tục","giải thích","đôi đũa","cách cư xử"],"vi":"Chọn từ có trọng âm chính rơi vào âm tiết khác với các từ còn lại."}]},{"roman":"III","navLabel":"Trắc nghiệm","icon":"list-check","title":"Chọn đáp án đúng (Multiple Choice)","instructions":"Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu.","type":"mcq","instant":true,"questions":[{"q":"1. My parents usually _______ work very early.","options":["go to","going to","went","to go"],"answer":0,"vis":["đi làm","đi làm (V-ing sai)","đã đi làm (sai thì)","đi làm (to-V sai)"],"explanation":"\"usually\" + V nguyên mẫu (go) → go to work.","vi":""},{"q":"2. There is a computer ___ the middle ___ the room.","options":["in / of","in / in","on / of","on / in"],"answer":0,"vis":["ở giữa / của","sai giới từ 2","sai giới từ 1","sai cả hai"],"explanation":"\"in the middle of\" = ở giữa (của).","vi":""},{"q":"3. Nam ______ tidy his room every day.","options":["should","must","ought to","need to"],"answer":1,"vis":["nên (chưa đủ mạnh)","phải (bắt buộc, đúng)","nên (ought to + V, ít phù hợp văn cảnh)","cần"],"explanation":"Ngữ cảnh nhấn mạnh nghĩa vụ bắt buộc → must.","vi":""},{"q":"4. Nga ________ have a holiday in Da Lat next summer.","options":["is going","will to","are going to","is going to"],"answer":3,"vis":["thiếu \"to\"","sai cấu trúc (will to không tồn tại)","sai chủ ngữ số nhiều","sẽ (đúng, be going to)"],"explanation":"\"be going to\" diễn tả dự định trong tương lai, chủ ngữ Nga (số ít) → is going to.","vi":""},{"q":"5. Lan isn’t __________to go to school today.","options":["enough well","enough good","well enough","good enough"],"answer":2,"vis":["sai trật tự","sai trật tự + sai từ loại","khỏe đủ (đúng, adj/adv + enough)","tốt đủ (sai, cần trạng từ well)"],"explanation":"Cấu trúc \"adj/adv + enough\" → well enough.","vi":""},{"q":"6. Boys and girls, you’ll have to do this experiment _________ this afternoon.","options":["yourself","yourselves","himself","themselves"],"answer":1,"vis":["chính bạn (số ít, sai vì chủ ngữ số nhiều)","chính các bạn (đúng, số nhiều)","chính anh ấy (sai chủ ngữ)","chính họ (sai chủ ngữ, không phải người nghe)"],"explanation":"Chủ ngữ \"you\" (số nhiều, các em) → yourselves.","vi":""},{"q":"7. We must put all the small objects such as beads out _______ children’s reach.","options":["of","in","on","to"],"answer":0,"vis":["\"out of reach\" = ngoài tầm với (đúng)","sai giới từ","sai giới từ","sai giới từ"],"explanation":"\"out of somebody's reach\" = ngoài tầm với của ai.","vi":""},{"q":"8. You are too thin. You _________eat much more meat.","options":["ought","ought not","ought to","ought not to"],"answer":2,"vis":["thiếu \"to\"","sai nghĩa (phủ định)","nên (đúng, ought to + V)","sai nghĩa (phủ định)"],"explanation":"\"ought to\" = nên, phù hợp với lời khuyên tích cực (ăn nhiều thịt hơn).","vi":""},{"q":"9. I and my pen friend ___________ Ho Chi Minh’s Mausoleum last Sunday.","options":["visit","visited","visits","visiting"],"answer":1,"vis":["sai thì (hiện tại)","đã thăm (đúng, quá khứ vì có \"last Sunday\")","sai (thêm s cho số ít)","sai dạng từ"],"explanation":"\"last Sunday\" → thì quá khứ đơn → visited.","vi":""},{"q":"10. Let us ___________ to the school’s library next Monday.","options":["going","to go","to going","go"],"answer":3,"vis":["sai dạng từ","sai cấu trúc","sai cấu trúc","đi (đúng, let us + V nguyên mẫu)"],"explanation":"\"Let us/Let's\" + V nguyên mẫu → go.","vi":""},{"q":"11. Peter doesn’t talk much in public. He’s rather _________","options":["kind","sociable","humorous","reserved"],"answer":3,"vis":["tốt bụng (sai nghĩa)","hòa đồng (trái nghĩa với câu)","hài hước (sai nghĩa)","kín đáo, ít nói (đúng, phù hợp câu)"],"explanation":"Người ít nói nơi công cộng → reserved (kín đáo, dè dặt).","vi":""},{"q":"12. You must not let children play in the street because it is__________","options":["suitable","dangerous","safe","careful"],"answer":1,"vis":["phù hợp (sai nghĩa)","nguy hiểm (đúng, lý do cấm)","an toàn (trái nghĩa với câu)","cẩn thận (sai từ loại cho vật)"],"explanation":"Lý do cấm trẻ chơi ngoài đường là vì nguy hiểm → dangerous.","vi":""},{"q":"13. He’ll come over to pick you up.","options":["over / up","over / on","in / up","on / in"],"answer":0,"vis":["đến / lên (đúng, come over…pick up)","sai giới từ 2","sai giới từ 1","sai cả hai"],"explanation":"\"come over\" = ghé qua; \"pick somebody up\" = đón ai.","vi":""},{"q":"14. The sun always __________ in the East and ___________ in the West.","options":["rise/ set","rises/ set","rises/ sets","has risen/ set"],"answer":2,"vis":["sai chia động từ 1","sai chia động từ 2","mọc/lặn (đúng, thì hiện tại đơn chia theo chủ ngữ số ít)","sai thì"],"explanation":"Sự thật hiển nhiên dùng hiện tại đơn, chủ ngữ số ít (the sun) → rises/sets.","vi":""},{"q":"15. He spends most of his time ___________ charity work.","options":["to do","did","doing","with doing"],"answer":2,"vis":["sai cấu trúc","sai dạng từ","làm (đúng, spend time V-ing)","thừa giới từ"],"explanation":"\"spend time + V-ing\" → doing.","vi":""},{"q":"16. You _____________miss any of the meetings. They’re always very useful.","options":["needn’t","should","shouldn’t","can"],"answer":2,"vis":["không cần (sai nghĩa, ngược lại)","nên (chưa đủ mạnh, thiếu phủ định)","không nên (đúng, khuyên không nên bỏ lỡ)","có thể (sai nghĩa)"],"explanation":"Vì các cuộc họp rất hữu ích → khuyên không nên bỏ lỡ → shouldn't.","vi":""},{"q":"17. She is famous ___________her intelligence. She designs many special styles for Ao dai.","options":["in","for","with","into"],"answer":1,"vis":["sai giới từ","nổi tiếng vì (đúng, famous for)","sai giới từ","sai giới từ"],"explanation":"\"be famous for\" = nổi tiếng vì.","vi":""},{"q":"18. I think someone ________talk to the boss. We can’t work extra hours on Saturday.","options":["have to","should","don’t have to","shouldn’t"],"answer":1,"vis":["phải (chưa hợp văn cảnh đề nghị)","nên (đúng, lời đề nghị)","không cần (sai nghĩa)","không nên (sai nghĩa)"],"explanation":"Đưa ra lời đề nghị/khuyên → should.","vi":""},{"q":"19. We reached the house after ________for almost an hour.","options":["cycled","to cycle","cycling","cycle"],"answer":2,"vis":["sai dạng từ","sai cấu trúc","đạp xe (đúng, after + V-ing)","sai dạng từ"],"explanation":"Sau giới từ \"after\" cần V-ing → cycling.","vi":""},{"q":"20. At school, the teachers and students ____________follow the rules.","options":["has to","have to","need to","haven’t to"],"answer":1,"vis":["sai chia (số nhiều)","phải (đúng, chủ ngữ số nhiều)","cần (không sai nhưng have to phù hợp hơn với ngữ cảnh nội quy)","sai cấu trúc (không tồn tại)"],"explanation":"Chủ ngữ số nhiều (the teachers and students) + have to diễn tả nội quy bắt buộc.","vi":""},{"q":"21. He ________try to be a bit more punctual. It’s rude to be late here.","options":["shouldn’t","should","couldn’t","was able to"],"answer":1,"vis":["không nên (sai nghĩa, ngược lại)","nên (đúng, lời khuyên)","không thể (sai nghĩa)","đã có thể (sai thì)"],"explanation":"Lời khuyên nên đúng giờ hơn → should.","vi":""},{"q":"22. Would you like to go __________a walk ______the park this afternoon?","options":["to – at","for – at","to – in","for – in"],"answer":3,"vis":["sai giới từ cả hai","sai giới từ 2","sai giới từ 1","đi dạo / trong công viên (đúng)"],"explanation":"\"go for a walk\" = đi dạo; \"in the park\" = trong công viên.","vi":""},{"q":"23. The buses were very ________this morning. We can’t go to the church with you in time.","options":["crowd","crowded","full","busy"],"answer":1,"vis":["sai từ loại (danh từ/động từ)","đông đúc (đúng, tính từ)","đầy (sai nghĩa cho xe buýt đông người)","bận rộn (sai nghĩa)"],"explanation":"Mô tả xe buýt đông người → crowded (tính từ).","vi":""},{"q":"24. We _________wear uniform at school from Monday to Saturday. That’s good way and equal to everyone.","options":["have to","haven’t to","could","must"],"answer":0,"vis":["phải (đúng, nội quy)","sai cấu trúc (không tồn tại)","có thể (sai nghĩa, không phải bắt buộc)","phải (cũng đúng nghĩa nhưng have to hợp với nội quy nhà trường hơn)"],"explanation":"Nội quy nhà trường → have to (sự bắt buộc từ bên ngoài).","vi":""},{"q":"25. Anna __________change her hair style because the old one doesn’t suit her any more.","options":["could","has to","have to","doesn’t have to"],"answer":3,"vis":["có thể (sai, không diễn tả nhu cầu)","sai chủ ngữ (thiếu \"to\" đã có nhưng ý phủ định)","sai chia động từ","không cần (đúng, phủ định)"],"explanation":"Ngữ cảnh không bắt buộc thay đổi kiểu tóc → doesn't have to.","vi":""},{"q":"26. The wai is the traditional _____ of people in Thailand.","options":["goodbye","hello","greeting","greetings"],"answer":2,"vis":["lời tạm biệt (sai nghĩa)","lời chào (sai, cần danh từ số ít phù hợp \"a traditional...\")","lời chào (đúng, danh từ số ít)","lời chào (sai, số nhiều không hợp mạo từ \"the\")"],"explanation":"\"the wai\" là một kiểu chào (greeting) truyền thống của người Thái.","vi":""},{"q":"27. When two Maori people meet, they _____ each other’s noses.","options":["touch","feel","take","kiss"],"answer":0,"vis":["chạm (đúng, phong tục hongi của Maori)","cảm nhận (sai nghĩa)","lấy (sai nghĩa)","hôn (sai, đây là chạm mũi không phải hôn)"],"explanation":"Người Maori chào nhau bằng cách chạm/cọ mũi (hongi) → touch.","vi":""},{"q":"28. Do you know the ______ way to welcome people in Tibet?","options":["custom","customer","customary","tradition"],"answer":2,"vis":["phong tục (danh từ, sai từ loại)","khách hàng (sai nghĩa)","theo thông lệ, theo phong tục (đúng, tính từ)","truyền thống (danh từ, sai từ loại)"],"explanation":"Cần tính từ đứng trước danh từ \"way\" → customary.","vi":""},{"q":"29. The xoe dance is a spiritual _____of Thai ethnic people.","options":["customs","tradition","habit","dance"],"answer":1,"vis":["phong tục (số nhiều, sai vì cần số ít sau mạo từ \"a\")","truyền thống (đúng, danh từ số ít)","thói quen (sai nghĩa văn cảnh)","điệu nhảy (lặp nghĩa với \"dance\" trong câu)"],"explanation":"\"a spiritual tradition\" = một truyền thống tâm linh.","vi":""},{"q":"30. In Viet Nam you shouldn’t use only the first name to _____ people older than you.","options":["speak","talk","say","address"],"answer":3,"vis":["nói (nội động từ, sai cấu trúc)","nói chuyện (sai cấu trúc, cần tân ngữ trực tiếp)","nói (sai cấu trúc)","xưng hô, gọi (đúng, address + somebody)"],"explanation":"\"address somebody\" = xưng hô/gọi ai đó.","vi":""},{"q":"31. We are going to prepare sticky rice served with grilled chicken for the _____ celebration.","options":["five colours","five-colours","five-colour","five-coloured"],"answer":3,"vis":["sai (danh từ ghép không nối gạch ngang)","sai (tính từ ghép không thêm s)","sai (thiếu hậu tố \"-ed\")","năm màu (đúng, tính từ ghép: number-noun-ed)"],"explanation":"Tính từ ghép mô tả có 5 màu → five-coloured (danh từ + ed làm tính từ).","vi":""},{"q":"32. A tradition is something special that is _____ through the generations.","options":["passed","passed to","passed down","passed out"],"answer":2,"vis":["thiếu giới từ phù hợp","sai giới từ","truyền lại (đúng, pass down = truyền qua các thế hệ)","phát ra, ngất xỉu (sai nghĩa)"],"explanation":"\"pass down\" = truyền lại (từ thế hệ này sang thế hệ khác).","vi":""},{"q":"33. According to the _____ in England, we have to use a knife and fork at dinner.","options":["table ways","table manners","behaviours","differences"],"answer":1,"vis":["sai cụm từ (không tồn tại)","phép tắc ăn uống (đúng)","hành vi (thiếu tính cụ thể về bàn ăn)","sự khác biệt (sai nghĩa)"],"explanation":"\"table manners\" = phép tắc ăn uống trên bàn ăn.","vi":""},{"q":"34. We have to _____ our shoes when we go inside a pagoda.","options":["take off","give off","turn off","put on"],"answer":0,"vis":["cởi ra (đúng)","tỏa ra (sai nghĩa)","tắt (sai nghĩa, dùng cho thiết bị)","mặc/mang vào (trái nghĩa với câu)"],"explanation":"\"take off\" = cởi/bỏ ra (giày dép, quần áo).","vi":""},{"q":"35. In Australia, you shouldn’t _____ on a person’s accent.","options":["comment","criticize","hate","dislike"],"answer":0,"vis":["bình luận (đúng, comment on)","chỉ trích (sai cấu trúc, không đi với \"on\")","ghét (sai cấu trúc)","không thích (sai cấu trúc)"],"explanation":"\"comment on something\" = bình luận về điều gì đó.","vi":""},{"q":"36. You look really tired. You _________ take a few days off and have a holiday.","options":["should","must","have to","can"],"answer":0,"vis":["nên (đúng, lời khuyên nhẹ nhàng)","phải (quá mạnh cho một lời khuyên)","phải (do hoàn cảnh, không phù hợp)","có thể (chưa đủ nhấn mạnh lời khuyên)"],"explanation":"Đưa ra lời khuyên vì trông mệt mỏi → should.","vi":""},{"q":"37. In Vietnam, you _________ take a deep bow as you do in Japan.","options":["mustn’t","don’t have to","should","shouldn’t"],"answer":1,"vis":["không được phép (sai nghĩa, cúi chào không bị cấm)","không cần (đúng, không bắt buộc như ở Nhật)","nên (sai nghĩa, câu muốn nói không cần thiết)","không nên (sai nghĩa)"],"explanation":"Ở Việt Nam không bắt buộc cúi chào sâu như Nhật Bản → don't have to.","vi":""},{"q":"38. Sorry, but my train is at 6.00. I _________ leave now.","options":["shouldn’t","ought to","mustn’t","have to"],"answer":3,"vis":["không nên (sai nghĩa)","nên (chưa đủ mạnh cho sự cấp bách)","không được phép (sai nghĩa)","phải (đúng, cần thiết vì giờ tàu chạy)"],"explanation":"Giờ tàu chạy tạo ra sự cần thiết phải rời đi → have to.","vi":""},{"q":"39. You _________ look at other students’ work. It’s against the rules.","options":["shouldn’t","don’t have to","mustn’t","can’t"],"answer":2,"vis":["không nên (chưa đủ mạnh, đây là luật cấm)","không cần (sai nghĩa)","không được phép (đúng, vi phạm nội quy = cấm)","không thể (sai nghĩa, đây là quy định chứ không phải khả năng)"],"explanation":"\"against the rules\" = vi phạm nội quy → cấm đoán mạnh → mustn't.","vi":""},{"q":"40. The airline only allows two pieces of luggage. You _________ pack too much!","options":["shouldn’t","mustn’t","don’t have to","couldn’t"],"answer":0,"vis":["không nên (đúng, lời khuyên tránh đóng gói quá nhiều)","không được phép (quá mạnh so với văn cảnh khuyên nhủ)","không cần (sai nghĩa)","đã không thể (sai thì)"],"explanation":"Lời khuyên nhẹ nhàng tránh đóng gói quá nhiều đồ → shouldn't.","vi":""},{"q":"41. John can’t come because he _________ work tomorrow.","options":["should","can","must","has to"],"answer":3,"vis":["nên (sai nghĩa)","có thể (sai nghĩa)","phải (gần đúng nhưng has to hợp lý do khách quan hơn)","phải (đúng, has to vì lý do công việc)"],"explanation":"Lý do khách quan (công việc) khiến anh ấy không thể đến → has to.","vi":""},{"q":"42. I know they enjoy their work, but they______ work at the weekends. It’s not good for them.","options":["shouldn’t","don’t have to","mustn’t","have to"],"answer":0,"vis":["không nên (đúng, lời khuyên vì sức khỏe)","không cần (sai nghĩa, câu muốn nói lời khuyên)","không được phép (quá mạnh)","phải (trái nghĩa với ý câu)"],"explanation":"Lời khuyên không nên làm việc cuối tuần vì không tốt cho họ → shouldn't.","vi":""},{"q":"43. Elderly people _________ be treated with great respect","options":["shouldn’t","should","aren’t obliged to","mustn’t"],"answer":1,"vis":["không nên (sai nghĩa, ngược lại)","nên (đúng, thể hiện điều nên làm)","không bị bắt buộc phải (sai nghĩa)","không được phép (sai nghĩa)"],"explanation":"Người già nên được đối xử tôn trọng → should.","vi":""},{"q":"44. He _________ use chopsticks for spring roll. It is finger food.","options":["must","has to","doesn’t have to","should"],"answer":2,"vis":["phải (sai nghĩa, món này ăn bằng tay)","phải (sai nghĩa)","không cần (đúng, vì là món ăn bốc tay)","nên (chưa đủ, ý câu là không cần thiết)"],"explanation":"Món ăn bằng tay (finger food) → không cần dùng đũa → doesn't have to.","vi":""},{"q":"45. Everyone _________ wear a helmet when riding a motorbike. It’s mandatory according to traffic law.","options":["isn’t allowed to","must","can","shouldn’t"],"answer":1,"vis":["không được phép (sai nghĩa, ngược lại)","phải (đúng, luật bắt buộc)","có thể (chưa đủ mạnh cho luật bắt buộc)","không nên (sai nghĩa)"],"explanation":"\"mandatory\" (bắt buộc theo luật) → must.","vi":""},{"q":"46. It’s Vietnamese tradition to_____ with families at Tet.","options":["back","reunite","relate","bow"],"answer":1,"vis":["quay lại (sai nghĩa)","đoàn tụ (đúng)","liên quan (sai nghĩa)","cúi chào (sai nghĩa)"],"explanation":"Truyền thống Tết là đoàn tụ gia đình → reunite.","vi":""},{"q":"47. In American culture,_____ is very important.","options":["punctual","punctually","punctuality","punctualities"],"answer":2,"vis":["đúng giờ (tính từ, sai từ loại cần danh từ)","đúng giờ (trạng từ, sai từ loại)","tính đúng giờ (đúng, danh từ số ít làm chủ ngữ)","sai (danh từ không đếm được, không có số nhiều)"],"explanation":"Cần danh từ làm chủ ngữ của câu → punctuality.","vi":""},{"q":"48. Language, religion, food and art are just some_____ of the various aspects of culture.","options":["features","faces","ways","products"],"answer":0,"vis":["đặc điểm (đúng)","khuôn mặt (sai nghĩa)","cách thức (sai nghĩa)","sản phẩm (sai nghĩa)"],"explanation":"Đây là những đặc điểm (features) của văn hóa.","vi":""},{"q":"49. Shoes must always be removed before_____ a Japanese home.","options":["entrance","enters","enter","entering"],"answer":3,"vis":["sai từ loại (danh từ)","sai (chia động từ không phù hợp sau giới từ)","sai (nguyên mẫu không đi sau giới từ)","đi vào (đúng, sau giới từ before + V-ing)"],"explanation":"Sau giới từ \"before\" cần V-ing → entering.","vi":""},{"q":"50. In Russia, Father Frost brings presents for children_____ New Year’s Day.","options":["in","on","At","for"],"answer":1,"vis":["sai giới từ (dùng cho tháng/năm)","vào (đúng, dùng cho ngày cụ thể)","sai viết hoa/giới từ dùng cho giờ","sai giới từ"],"explanation":"Giới từ \"on\" dùng trước ngày cụ thể (New Year's Day).","vi":""}]},{"roman":"IV","navLabel":"Word Forms","icon":"font","title":"Chia dạng đúng của từ (Word Forms)","instructions":"Cho dạng đúng của từ trong ngoặc để hoàn thành câu.","type":"fill","instant":true,"questions":[{"q":"1. _____ when dining, South Koreans use cushions to sit on the floor and eat from a low table.","hint":"(TRADITION)","answer":"Traditionally","family":["tradition (n): truyền thống","traditional (adj): mang tính truyền thống","traditionally (adv): theo truyền thống"],"note":"danh từ → trạng từ đuôi -ly","vi":"Theo truyền thống, khi dùng bữa, người Hàn Quốc dùng đệm để ngồi trên sàn và ăn ở bàn thấp.","explanation":"TRADITION → Traditionally."},{"q":"2. The wai is the traditional form of ________ in Thailand.","hint":"(GREET)","answer":"greeting","family":["greet (v): chào","greeting (n): lời chào"],"note":"động từ → danh từ đuôi -ing","vi":"Wai là hình thức chào truyền thống ở Thái Lan.","explanation":"GREET → greeting."},{"q":"3. They weren’t _____________ to live with their parents after the wedding.","hint":"(OBLIGATION)","answer":"obliged","family":["obligation (n): nghĩa vụ","oblige (v): bắt buộc","obliged (adj/P2): bị bắt buộc"],"note":"danh từ → tính từ/quá khứ phân từ đuôi -ed","vi":"Họ không bị bắt buộc phải sống chung với cha mẹ sau khi cưới.","explanation":"OBLIGATION → obliged."},{"q":"4. It is considered ___________ to address an elder with his or her given name.","hint":"(POLITE)","answer":"impolite","family":["polite (adj): lịch sự","impolite (adj): bất lịch sự"],"note":"thêm tiền tố phủ định im-","vi":"Việc gọi tên riêng của người lớn tuổi được coi là bất lịch sự.","explanation":"POLITE → impolite."},{"q":"5. Is that woman the ___________ of the party?","hint":"(HOST)","answer":"hostess","family":["host (n): chủ nhà (nam)","hostess (n): chủ nhà (nữ)"],"note":"danh từ nam → danh từ nữ đuôi -ess","vi":"Người phụ nữ đó có phải là chủ nhà của bữa tiệc không?","explanation":"HOST → hostess."},{"q":"6. The children in our family are always _______ to their elders.","hint":"(RESPECT)","answer":"respectful","family":["respect (n/v): sự tôn trọng, tôn trọng","respectful (adj): tôn trọng, lễ phép"],"note":"danh từ/động từ → tính từ đuôi -ful","vi":"Trẻ em trong gia đình chúng tôi luôn lễ phép với người lớn.","explanation":"RESPECT → respectful."},{"q":"7. Custom _____________ from tradition in some aspects such as scale and time.","hint":"(DIFFERENT)","answer":"differs","family":["different (adj): khác biệt","differ (v): khác nhau","differs (v, chia ngôi 3 số ít): khác nhau"],"note":"tính từ → động từ, chia theo chủ ngữ số ít","vi":"Phong tục khác với truyền thống ở một số khía cạnh như quy mô và thời gian.","explanation":"DIFFERENT → differs."},{"q":"8. Don’t use your personal chopsticks to get food from the _____________ dish.","hint":"(SERVE)","answer":"serving","family":["serve (v): phục vụ, múc (thức ăn)","serving (adj/n): (đĩa) dùng để phục vụ chung"],"note":"động từ → tính từ/danh động từ đuôi -ing","vi":"Đừng dùng đũa cá nhân để gắp thức ăn từ đĩa dùng chung.","explanation":"SERVE → serving."},{"q":"9. Many families have three _____________, which create unique cultural features.","hint":"(GENERATE)","answer":"generations","family":["generate (v): tạo ra","generation (n): thế hệ","generations (n, số nhiều): các thế hệ"],"note":"động từ → danh từ số nhiều đuôi -ion/-s","vi":"Nhiều gia đình có ba thế hệ, tạo nên những nét văn hóa độc đáo.","explanation":"GENERATE → generations."},{"q":"10. We have lots of customs and it can get a bit _____________ for visitors.","hint":"(CONFUSE)","answer":"confusing","family":["confuse (v): làm bối rối","confusing (adj): gây bối rối"],"note":"động từ → tính từ đuôi -ing","vi":"Chúng tôi có rất nhiều phong tục và điều đó có thể gây bối rối cho du khách.","explanation":"CONFUSE → confusing."},{"q":"11. What is the __________ between a custom and a tradition?","hint":"(SIMILAR)","answer":"similarity","family":["similar (adj): tương tự","similarity (n): sự tương đồng"],"note":"tính từ → danh từ đuôi -ity","vi":"Điểm tương đồng giữa phong tục và truyền thống là gì?","explanation":"SIMILAR → similarity."},{"q":"12. In Viet Nam, we usually wait for the ____________ person to sit down before you sit down.","hint":"(OLD)","answer":"eldest","family":["old (adj): già, lớn tuổi","elder (adj, so sánh hơn): lớn tuổi hơn","eldest (adj, so sánh nhất): lớn tuổi nhất"],"note":"tính từ → so sánh nhất bất quy tắc","vi":"Ở Việt Nam, chúng ta thường đợi người lớn tuổi nhất ngồi xuống trước khi mình ngồi.","explanation":"OLD → eldest."},{"q":"13. Is he _________________ to break the customs of her family?","hint":"(PERMISSION)","answer":"permitted","family":["permission (n): sự cho phép","permit (v): cho phép","permitted (adj/P2): được cho phép"],"note":"danh từ → động từ/quá khứ phân từ đuôi -ed","vi":"Anh ấy có được phép phá vỡ phong tục của gia đình cô ấy không?","explanation":"PERMISSION → permitted."},{"q":"14. Today, we are going to discuss the ______________ of traditions.","hint":"(NECESSARY)","answer":"necessity","family":["necessary (adj): cần thiết","necessity (n): sự cần thiết"],"note":"tính từ → danh từ đuôi -ity","vi":"Hôm nay, chúng ta sẽ thảo luận về sự cần thiết của các truyền thống.","explanation":"NECESSARY → necessity."},{"q":"15. The offspring will follow the customs without _____________.","hint":"(OBLIGE)","answer":"obligation","family":["oblige (v): bắt buộc","obligation (n): nghĩa vụ, sự ép buộc"],"note":"động từ → danh từ đuôi -ation","vi":"Con cháu sẽ làm theo phong tục mà không bị ép buộc.","explanation":"OBLIGE → obligation."},{"q":"16. My dad is the _____________ of this wedding anniversary party.","hint":"(HOST)","answer":"host","family":["host (n): chủ nhà (nam)","hostess (n): chủ nhà (nữ)"],"note":"giữ nguyên danh từ (chủ ngữ nam → host, không phải hostess)","vi":"Bố tôi là chủ nhà của bữa tiệc kỷ niệm ngày cưới này.","explanation":"HOST → host."},{"q":"17. Do you have to follow the traditions _____________?","hint":"(STRICT)","answer":"strictly","family":["strict (adj): nghiêm ngặt","strictly (adv): một cách nghiêm ngặt"],"note":"tính từ → trạng từ đuôi -ly","vi":"Bạn có phải tuân theo truyền thống một cách nghiêm ngặt không?","explanation":"STRICT → strictly."},{"q":"18. She was taught a lot _____________ skills by my parents.","hint":"(SOCIETY)","answer":"social","family":["society (n): xã hội","social (adj): thuộc về xã hội"],"note":"danh từ → tính từ đuôi -al","vi":"Cô ấy đã được bố mẹ tôi dạy cho rất nhiều kỹ năng xã hội.","explanation":"SOCIETY → social."},{"q":"19. In some ethnic groups, the elderly _____________ their next generations to accept the customs.","hint":"(OBLIGATION)","answer":"oblige","family":["obligation (n): nghĩa vụ","oblige (v): bắt buộc (ai làm gì)"],"note":"danh từ → động từ (chia theo chủ ngữ số nhiều)","vi":"Ở một số nhóm dân tộc, người già bắt buộc thế hệ sau phải chấp nhận phong tục.","explanation":"OBLIGATION → oblige."},{"q":"20. We were impressed by the _____________ of Ha Long Bay.","hint":"(BEAUTIFUL)","answer":"beauty","family":["beautiful (adj): đẹp","beauty (n): vẻ đẹp"],"note":"tính từ → danh từ","vi":"Chúng tôi ấn tượng với vẻ đẹp của Vịnh Hạ Long.","explanation":"BEAUTIFUL → beauty."}]},{"roman":"V","navLabel":"Chia động từ 1","icon":"pen","title":"Should (not) / (Not) Have to","instructions":"Hoàn thành câu với should (not) hoặc (not) have to.","type":"fill","instant":true,"questions":[{"q":"1. We __________ leave too late tomorrow if we want to reach the beach before lunch.","answer":"shouldn't","vi":"Lời khuyên không nên rời đi quá muộn để đến bãi biển trước giờ ăn trưa.","explanation":"Đây là lời khuyên → shouldn't."},{"q":"2. Ken and Liz _________ revise their lessons tonight as they have to take a test tomorrow.","answer":"have to","vi":"Ken và Liz phải ôn bài tối nay vì mai họ phải làm bài kiểm tra.","explanation":"Sự cần thiết do hoàn cảnh bên ngoài (có bài kiểm tra) → have to."},{"q":"3. We ______ bring something to Kate's party. I'll feel really embarrassed otherwise.","answer":"should","vi":"Chúng ta nên mang gì đó đến bữa tiệc của Kate. Nếu không tôi sẽ thấy ngại.","explanation":"Lời khuyên nên làm → should."},{"q":"4. He _______ write with his right hand because his father doesn't allow him to write with left hand.","answer":"has to","vi":"Cậu ấy phải viết bằng tay phải vì bố không cho phép viết tay trái.","explanation":"Sự bắt buộc do người khác áp đặt → has to."},{"q":"5. Victoria _________ read the newspaper as she wants to find a job.","answer":"has to","vi":"Victoria phải đọc báo vì cô ấy muốn tìm việc làm.","explanation":"Sự cần thiết xuất phát từ mục đích cá nhân → has to."},{"q":"6. That model on the TV is too skinny. I think she_________ eat more.","answer":"should","vi":"Người mẫu đó trên TV quá gầy. Tôi nghĩ cô ấy nên ăn nhiều hơn.","explanation":"Lời khuyên → should."},{"q":"7. Frank and Joey are having a fine art examination tomorrow, so they _______practice drawing today.","answer":"have to","vi":"Frank và Joey có kỳ thi mỹ thuật vào ngày mai, nên hôm nay họ phải luyện vẽ.","explanation":"Sự cần thiết do có kỳ thi → have to."},{"q":"8. Lizzie _______ ask Bryan to help her with her studies. He did the same course last year.","answer":"should","vi":"Lizzie nên nhờ Bryan giúp việc học. Anh ấy đã học khóa đó năm ngoái rồi.","explanation":"Lời khuyên → should."},{"q":"9. Pregnant women ___________ smoke as it can damage the baby.","answer":"shouldn't","vi":"Phụ nữ mang thai không nên hút thuốc vì có thể gây hại cho em bé.","explanation":"Lời khuyên không nên → shouldn't."},{"q":"10. You ____________ take part in the meeting tonight if you don't want to.","answer":"don't have to","vi":"Bạn không cần tham dự cuộc họp tối nay nếu bạn không muốn.","explanation":"Không có sự bắt buộc → don't have to."}]},{"roman":"VI","navLabel":"Chia động từ 2","icon":"pen-fancy","title":"Chia đúng dạng của động từ","instructions":"Viết dạng đúng của động từ trong ngoặc.","type":"fill","instant":true,"questions":[{"q":"1. Worshipping (take) ___ place regularly on particular days, such as festivals and the death day of the ancestor.","answer":"takes","vi":"Việc thờ cúng diễn ra thường xuyên vào những ngày nhất định, như lễ hội và ngày giỗ của tổ tiên.","explanation":"Chủ ngữ số ít (Worshipping) + hiện tại đơn diễn tả sự thật/thói quen → takes."},{"q":"2. \"Banh Chung\" (be) ___ a traditional and irreplaceable cake of Vietnamese people in the Tet Holidays.","answer":"is","vi":"\"Bánh Chưng\" là một loại bánh truyền thống và không thể thay thế của người Việt trong dịp Tết.","explanation":"Chủ ngữ số ít + hiện tại đơn → is."},{"q":"3. The convention of giving \"li xi\" (have) ___ its roots in the folklore about the ogre called Tuy.","answer":"has","vi":"Tục lì xì có nguồn gốc từ truyện dân gian về con quỷ tên Tuy.","explanation":"Chủ ngữ số ít (the convention) + hiện tại đơn → has."},{"q":"4. Adults (give) ___ red lucky pockets to children as a token of luck and best wishes.","answer":"give","vi":"Người lớn tặng bao lì xì đỏ cho trẻ em như một biểu tượng của may mắn và lời chúc tốt đẹp.","explanation":"Chủ ngữ số nhiều (Adults) + hiện tại đơn → give."},{"q":"5. South Koreans prefer (do) ___ business with people with whom they have a personal connection.","answer":"doing","vi":"Người Hàn Quốc thích làm ăn với những người mà họ có mối quan hệ cá nhân.","explanation":"\"prefer\" + V-ing → doing."},{"q":"6. Thais generally (use) ___ first rather than surnames, with the honorific title Khun before the name.","answer":"use","vi":"Người Thái thường dùng tên riêng thay vì họ, kèm tước hiệu tôn kính Khun trước tên.","explanation":"Chủ ngữ số nhiều (Thais) + hiện tại đơn → use."},{"q":"7. Traditionally, children (live) ___ with their parents until marriage.","answer":"live","vi":"Theo truyền thống, con cái sống cùng cha mẹ cho đến khi kết hôn.","explanation":"Chủ ngữ số nhiều (children) + hiện tại đơn → live."},{"q":"8. The extended family (provide) ___ both emotional and financial support.","answer":"provide","vi":"Gia đình lớn (đại gia đình) cung cấp cả sự hỗ trợ tinh thần lẫn tài chính.","explanation":"\"The extended family\" mang nghĩa tập thể số nhiều → provide."},{"q":"9. The British (exchange) ___ gifts between family members and close friends for birthdays and Christmas.","answer":"exchange","vi":"Người Anh trao đổi quà tặng giữa các thành viên gia đình và bạn bè thân thiết vào dịp sinh nhật và Giáng sinh.","explanation":"\"The British\" (số nhiều) + hiện tại đơn → exchange."},{"q":"10. It is the custom for Polish (applaud) ___ when the plane (land) ___.","answer":"to applaud / lands","vi":"Đó là phong tục của người Ba Lan vỗ tay khi máy bay hạ cánh.","explanation":"\"custom for somebody + to V\" → to applaud; mệnh đề \"when\" diễn tả sự thật → hiện tại đơn: lands.","accepted":["to applaud / lands","to applaud/lands","to applaud, lands"]}]},{"roman":"VII","navLabel":"Chia động từ 3","icon":"pen-ruler","title":"Have to / Must / Should","instructions":"Điền have to, must hoặc should để hoàn thành câu.","type":"fill","instant":true,"questions":[{"q":"1. If a man marries a Scot woman, he _____ welcome her with eggs and sauces on her face.","answer":"has to","vi":"Nếu một người đàn ông cưới một phụ nữ Scotland, anh ta phải chào đón cô ấy bằng trứng và nước sốt trên mặt.","explanation":"Phong tục bắt buộc theo hoàn cảnh cụ thể → has to."},{"q":"2. When going to some African countries, you _____ touch hands to greeting people.","answer":"should","vi":"Khi đến một số nước châu Phi, bạn nên chạm tay để chào người khác.","explanation":"Lời khuyên về phong tục nên làm → should."},{"q":"3. In the northern part of Mozambique, people _____ greet their hands three times and say hello.","answer":"must / have to","vi":"Ở phía bắc Mozambique, người ta phải vỗ tay ba lần và nói xin chào.","explanation":"Phong tục bắt buộc → must/have to.","accepted":["must / have to","must","have to"]},{"q":"4. Living in the Central African Republic, you _____ slap their right hands together and grasp each other's middle finger if you see a good friend.","answer":"must","vi":"Sống ở Cộng hòa Trung Phi, bạn phải vỗ tay phải vào nhau và nắm ngón giữa của nhau nếu gặp bạn thân.","explanation":"Phong tục bắt buộc → must."},{"q":"5. In La Tomatina, the participants _____ throw tomatoes to other purely for fun.","answer":"have to","vi":"Trong lễ hội La Tomatina, người tham gia phải ném cà chua vào nhau chỉ để vui.","explanation":"Quy định của lễ hội bắt buộc → have to."},{"q":"6. Meeting the native Maori people, you _____ rub your noses to theirs in a sign of trust and closeness.","answer":"must","vi":"Khi gặp người Maori bản địa, bạn phải cọ mũi vào mũi họ như một dấu hiệu tin tưởng và thân thiết.","explanation":"Phong tục bắt buộc → must."},{"q":"7. It is the custom that children _____ ask the adults' permission before leaving the dining table.","answer":"should","vi":"Theo phong tục, trẻ em nên xin phép người lớn trước khi rời bàn ăn.","explanation":"Lời khuyên/quy tắc ứng xử nên làm → should."},{"q":"8. My father says I _____ go home at 9 p.m.","answer":"have to","vi":"Bố tôi bảo tôi phải về nhà lúc 9 giờ tối.","explanation":"Sự bắt buộc do người khác áp đặt → have to."},{"q":"9. You _____ drive on the left hand in London.","answer":"must","vi":"Bạn phải lái xe bên trái ở London.","explanation":"Luật giao thông bắt buộc → must."},{"q":"10. When eating in India, you _____ use the right hand.","answer":"have to","vi":"Khi ăn ở Ấn Độ, bạn phải dùng tay phải.","explanation":"Phong tục bắt buộc → have to."}]},{"roman":"VIII","navLabel":"Sửa lỗi 1","icon":"wrench","title":"Tìm lỗi sai (A, B, C hoặc D)","instructions":"Tìm và chọn phần gạch chân có lỗi sai trong mỗi câu.","type":"mcq","instant":true,"questions":[{"q":"1. Some people <u>think</u> young people <u>should</u> <u>to follow</u> the tradition <u>of</u> the society.","options":["think","should","to follow","of"],"answer":2,"vis":["nghĩ rằng","nên","theo (sai — sau \"should\" dùng V nguyên mẫu, bỏ \"to\": follow)","của"],"explanation":"Sau động từ khiếm khuyết \"should\" dùng V nguyên mẫu (không \"to\") → to follow phải sửa thành follow."},{"q":"2. <u>According for</u> tradition, the first person <u>to enter</u> the house on New Year’s Eve <u>brings</u> either good luck <u>or</u> bad luck.","options":["According for","to enter","brings","or"],"answer":0,"vis":["theo như (sai — cần \"According to\")","để bước vào","mang lại","hoặc"],"explanation":"\"According to\" = theo như → According for phải sửa thành According to."},{"q":"3. The <u>traditional</u> Vietnamese <u>wedding</u> is one of the most important <u>ceremony</u> in Vietnamese <u>culture</u>.","options":["traditional","wedding","ceremony","culture"],"answer":2,"vis":["truyền thống","đám cưới","nghi lễ (sai — \"one of the most + adj + N số nhiều\": ceremonies)","văn hóa"],"explanation":"\"one of the most + adj + danh từ số nhiều\" → ceremony phải sửa thành ceremonies."},{"q":"4. The Japanese <u>are</u> familiar <u>with</u> the western custom <u>to eat</u> a turkey dinner <u>for</u> Christmas.","options":["are","with","to eat","for"],"answer":2,"vis":["thì","với","để ăn (sai — \"custom of V-ing\": of eating)","vào dịp"],"explanation":"\"a custom of doing something\" → to eat phải sửa thành of eating."},{"q":"5. <u>In</u> Vietnam the engagement <u>is</u> sometimes considered <u>much</u> important <u>than</u> the wedding.","options":["In","is","much","than"],"answer":2,"vis":["ở","thì","nhiều (sai — so sánh hơn cần \"more important\")","hơn"],"explanation":"So sánh hơn với tính từ dài \"important\" → much phải sửa thành more."},{"q":"6. <u>Dressing</u> <u>well</u> is important in South Korea; it is <u>considered</u> a sign of <u>respectful</u>.","options":["Dressing","well","considered","respectful"],"answer":3,"vis":["ăn mặc","đẹp, chỉn chu","được coi là","sự tôn trọng (sai — sau \"a sign of\" cần danh từ: respect)"],"explanation":"\"a sign of + danh từ\" → respectful phải sửa thành respect."},{"q":"7. In India, you <u>shouldn't</u> never use your left hand <u>to eat</u> because <u>it's</u> considered <u>is respectful</u>.","options":["shouldn't","to eat","it's","is respectful"],"answer":0,"vis":["không nên (sai — trùng phủ định với \"never\", cần \"should\")","để ăn","nó là (viết tắt của it is)","là lịch sự, tôn trọng"],"explanation":"Không dùng hai từ phủ định cùng lúc (\"shouldn't\" + \"never\") → shouldn't phải sửa thành should."},{"q":"8. He asked me <u>anxiously</u> what he <u>has to</u> do when <u>visiting</u> a <u>Vietnamese home</u>.","options":["anxiously","has to","visiting","Vietnamese home"],"answer":1,"vis":["một cách lo lắng","phải (sai thì — lời nói gián tiếp cần lùi thì: had to)","khi đến thăm","ngôi nhà Việt Nam"],"explanation":"Câu tường thuật (reported speech) cần lùi thì → has to phải sửa thành had to."},{"q":"9. Another <u>typical</u> musical <u>instrument</u> of the Raglai is <u>the flat</u> gong called <u>Ma La</u>.","options":["typical","instrument","the flat","Ma La"],"answer":3,"vis":["tiêu biểu, điển hình","nhạc cụ","phẳng, dẹt","Mã La (sai — cần thêm mạo từ: the Ma La)"],"explanation":"Tên riêng của nhạc cụ cần có mạo từ xác định \"the\" đi kèm → Ma La phải sửa thành the Ma La."},{"q":"10. I want <u>to visit</u> the Vietnam Museum <u>of</u> Ethnology <u>to learn</u> <u>for</u> 54 ethnic minority groups.","options":["to visit","of","to learn","for"],"answer":3,"vis":["để tham quan","của","để tìm hiểu","sai giới từ — cần \"about\": learn about"],"explanation":"\"learn about something\" = tìm hiểu về → for phải sửa thành about."},{"q":"11. Xo Dang men <u>are</u> good at <u>architecture</u>, <u>sculpting</u>, and <u>paint</u>.","options":["are","architecture","sculpting","paint"],"answer":3,"vis":["thì","kiến trúc","điêu khắc","vẽ tranh (sai — cần V-ing để song song cấu trúc: painting)"],"explanation":"Cấu trúc song song 3 danh động từ (architecture, sculpting, …) → paint phải sửa thành painting."},{"q":"12. I <u>go</u> to see Peter <u>yesterday evening</u>, but he <u>was</u> not <u>at home</u>.","options":["go","yesterday evening","was","at home"],"answer":0,"vis":["đi (sai thì — có mốc thời gian quá khứ \"yesterday evening\": went)","tối hôm qua","thì (quá khứ của is)","ở nhà"],"explanation":"Có mốc thời gian quá khứ \"yesterday evening\" → go phải sửa thành went."},{"q":"13. She <u>was talking</u> to <u>a strangers</u> when I <u>came to</u> <u>the restaurant</u>.","options":["was talking","a strangers","came to","the restaurant"],"answer":1,"vis":["đang nói chuyện","một người lạ (sai — sau mạo từ \"a\" cần danh từ số ít: a stranger)","đã đến","nhà hàng"],"explanation":"Sau mạo từ \"a\" cần danh từ số ít → a strangers phải sửa thành a stranger."},{"q":"14. <u>What</u> were you <u>doing</u> <u>in 6 p.m</u> <u>yesterday</u>?","options":["What","doing","in 6 p.m","yesterday"],"answer":2,"vis":["cái gì","đang làm","sai giới từ — giờ cụ thể cần \"at\": at 6 p.m.","hôm qua"],"explanation":"Giới từ chỉ giờ cụ thể dùng \"at\" → in 6 p.m. phải sửa thành at 6 p.m."},{"q":"15. Why <u>you leave</u> the baby <u>alone at</u> <u>home</u> to <u>go to the movies</u>?","options":["you leave","alone at","home","go to the movies"],"answer":0,"vis":["bạn để (sai trật tự câu hỏi — cần trợ động từ: did you leave)","một mình ở","nhà","đi xem phim"],"explanation":"Câu hỏi Wh- với động từ thường ở quá khứ cần trợ động từ \"did\" → you leave phải sửa thành did you leave."}]},{"roman":"IX","navLabel":"Sửa lỗi 2","icon":"file-pen","title":"Tìm và sửa 5 lỗi sai trong đoạn văn","instructions":"Đọc đoạn văn. Mỗi câu có một lỗi sai. Gõ từ ĐÚNG vào ô trống.","type":"fill","instant":true,"passage":{"title":"Chopsticks (đoạn văn gốc – có lỗi)","html":"Depending on the restaurant you decide upon for that evening, you may be require to use chopsticks. If for some reasons you aren’t too adept with chopsticks, try to learn before pass through immigration. It’s really not that hard. One false assumption among many Japanese that’s slowly being dispelled by time are the “uniqueness” of Japan. Japan is a island nation; Japan is the only country that has four seasons; foreigners can’t understand Japan; only Japanese can use chopsticks properly.<br><br>I cannot count the number of times I’ve been told how to use Japanese chopsticks but I couldn’t use perfectly. If you’re dining in a Japanese, don’t be surprised if you receive a look of amazement at your ability to eat like a Japanese.","vi":"Tùy vào nhà hàng bạn chọn cho buổi tối hôm đó, bạn có thể sẽ phải dùng đũa. Nếu vì lý do nào đó bạn chưa thành thạo dùng đũa, hãy cố học trước khi qua cửa nhập cảnh. Thực ra điều đó không khó lắm. Một quan niệm sai lầm mà nhiều người Nhật đang dần từ bỏ theo thời gian là sự \"độc nhất vô nhị\" của Nhật Bản. Nhật Bản là một quốc đảo; Nhật Bản là quốc gia duy nhất có bốn mùa; người nước ngoài không thể hiểu được Nhật Bản; chỉ người Nhật mới có thể dùng đũa thành thạo.<br><br>Tôi không đếm xuể số lần được chỉ cách dùng đũa kiểu Nhật nhưng tôi vẫn không thể dùng thành thạo. Nếu bạn đi ăn cùng một người Nhật, đừng ngạc nhiên nếu bạn nhận được ánh nhìn kinh ngạc trước khả năng ăn uống như người Nhật của bạn."},"questions":[{"q":"1. you may be require to use chopsticks.  →  Sửa: ___","answer":"required","explanation":"\"be required to do something\" (bị động, dạng quá khứ phân từ) → require phải sửa thành required.","vi":"Bạn có thể sẽ phải (được yêu cầu) dùng đũa."},{"q":"2. try to learn before pass through immigration.  →  Sửa: ___","answer":"passing","explanation":"Sau giới từ \"before\" cần V-ing → pass phải sửa thành passing.","vi":"Hãy cố học trước khi qua cửa nhập cảnh."},{"q":"3. One false assumption among many Japanese that’s slowly being dispelled by time are the “uniqueness” of Japan.  →  Sửa: ___","answer":"is","explanation":"Chủ ngữ chính của câu là \"One false assumption\" (số ít) → are phải sửa thành is.","vi":"Một quan niệm sai lầm mà nhiều người Nhật đang dần từ bỏ theo thời gian là sự \"độc nhất vô nhị\" của Nhật Bản."},{"q":"4. Japan is a island nation.  →  Sửa: ___","answer":"an","explanation":"Trước danh từ bắt đầu bằng nguyên âm (island) dùng mạo từ \"an\" → a phải sửa thành an.","vi":"Nhật Bản là một quốc đảo."},{"q":"5. If you’re dining in a Japanese, don’t be surprised…  →  Sửa: ___","answer":"with","explanation":"\"dine with somebody\" = dùng bữa cùng ai → in phải sửa thành with.","vi":"Nếu bạn đi ăn cùng một người Nhật, đừng ngạc nhiên…"}]},{"roman":"X","navLabel":"Đọc hiểu 1","icon":"book-open","title":"Đọc hiểu – Jeans (Điền từ)","instructions":"Đọc đoạn văn và điền một từ thích hợp vào mỗi chỗ trống.","type":"fill","instant":true,"passage":{"title":"Jeans","html":"Jeans are very popular with young people all <b>(1)</b> ___ the world. Some people say that jeans are the “uniform” of youth but they haven’t always been <b>(2)</b> ___. The story of jeans started almost two hundred years <b>(3)</b> ___. People in Genoa, Italy made pants. The cloth made in Genoa <b>(4)</b> ___ called “jeanos”. The pants were called “Jeans”. In 1850, a salesman in California began selling pants made <b>(5)</b> ___ canvas. His name was Levi Strauss. Because they were so strong, “Levi’s pants” became popular <b>(6)</b> ___ gold miners, farmers and cowboys. Six years <b>(7)</b> ___, Levis began making his pants with blue cotton clothes <b>(8)</b> ___ denim. Soon after, factory workers <b>(9)</b> ___ the United States and Europe began <b>(10)</b> ___ Jeans. Young people usually didn’t wear them.","vi":"Quần jeans rất được ưa chuộng với giới trẻ khắp thế giới. Một số người nói rằng quần jeans là \"đồng phục\" của tuổi trẻ nhưng không phải lúc nào chúng cũng phổ biến như vậy. Câu chuyện về quần jeans bắt đầu từ gần hai trăm năm trước. Người dân ở Genoa, Ý làm ra những chiếc quần này. Loại vải được sản xuất ở Genoa được gọi là \"jeanos\". Những chiếc quần được gọi là \"Jeans\". Năm 1850, một người bán hàng ở California bắt đầu bán quần làm bằng vải bạt. Ông tên là Levi Strauss. Vì chúng rất bền, \"quần Levi's\" trở nên phổ biến với các thợ mỏ vàng, nông dân và cao bồi. Sáu năm sau, Levis bắt đầu may quần bằng vải cotton xanh gọi là denim. Ngay sau đó, công nhân nhà máy ở Mỹ và châu Âu bắt đầu mặc quần Jeans. Giới trẻ khi đó thường không mặc chúng."},"questions":[{"q":"1. Fill in blank number 1.","answer":"over","explanation":"Giới từ \"all over the world\" = khắp thế giới."},{"q":"2. Fill in blank number 2.","answer":"popular","explanation":"\"they haven't always been popular\" = chúng không phải lúc nào cũng phổ biến."},{"q":"3. Fill in blank number 3.","answer":"ago","explanation":"Mốc thời gian trong quá khứ dùng \"ago\" (cách đây)."},{"q":"4. Fill in blank number 4.","answer":"was","explanation":"Chủ ngữ số ít (the cloth) + thì quá khứ đơn của \"be\" → was."},{"q":"5. Fill in blank number 5.","answer":"of","explanation":"\"made of + chất liệu\" → made of canvas (làm bằng vải bạt)."},{"q":"6. Fill in blank number 6.","answer":"with","explanation":"\"popular with somebody\" = được ưa chuộng bởi ai đó."},{"q":"7. Fill in blank number 7.","answer":"later","explanation":"\"six years later\" = sáu năm sau đó."},{"q":"8. Fill in blank number 8.","answer":"called","explanation":"\"clothes called denim\" = loại vải được gọi là denim (phân từ bị động)."},{"q":"9. Fill in blank number 9.","answer":"in","explanation":"\"factory workers in the United States and Europe\" = công nhân nhà máy ở Mỹ và châu Âu."},{"q":"10. Fill in blank number 10.","answer":"wearing","explanation":"\"began + V-ing\" → began wearing Jeans."}]},{"roman":"XI","navLabel":"Đọc hiểu 2","icon":"book-open","title":"Đọc hiểu – Taking off shoes in Japan","instructions":"Đọc đoạn văn và xác định các câu sau là Đúng (T) hay Sai (F).","type":"mcq","instant":true,"passage":{"title":"Taking off shoes in Japan","html":"In Japan, take off your shoes at the entrance to all homes, and most businesses and hotels. Usually a rack will be provided to store your shoes, and a pair of guest slippers will be put nearby; many Japanese bring a pair of indoor slippers just in case, though.<br><br>Never wear slippers when you need to step onto a tatami mat (used in most Japanese homes and hotels), and be careful to remove the toilet slippers waiting for you in the bathroom. It is extremely bad form, for example, to reenter the main room of a house wearing slippers that have been running across a dirty area.<br><br>Unlike in western cultures, the Japanese bath is used after you have washed and rinsed and feel like soaking in extra-hot water for 10, 20, 30 minutes. If you happen to be invited into a Japanese household, you will be given the honor of using the bath first, usually before dinner. Be extra careful so as not to dirty the water in any way because of its importance.","vi":"Ở Nhật Bản, hãy cởi giày ở lối vào của mọi ngôi nhà, hầu hết các cơ sở kinh doanh và khách sạn. Thường sẽ có một giá để giày và một đôi dép khách để gần đó; nhiều người Nhật vẫn mang theo dép đi trong nhà phòng khi cần.<br><br>Không bao giờ mang dép khi bước lên chiếu tatami (dùng trong hầu hết nhà và khách sạn Nhật), và nhớ cởi bỏ dép nhà vệ sinh chờ sẵn trong phòng tắm. Việc mang dép đã đi qua khu vực bẩn trở lại phòng chính là rất bất lịch sự.<br><br>Khác với văn hóa phương Tây, bồn tắm của người Nhật được dùng SAU KHI bạn đã tắm rửa và tráng người sạch sẽ, để ngâm mình trong nước rất nóng khoảng 10, 20, 30 phút. Nếu bạn được mời đến nhà một gia đình Nhật Bản, bạn sẽ được vinh dự tắm trước, thường là trước bữa tối. Hãy cẩn thận để không làm bẩn nước vì tầm quan trọng của nó."},"questions":[{"q":"1. Only take off your shoes when you enter a Japanese house.","options":["Đúng (True)","Sai (False)"],"answer":1,"explanation":"Bài đọc nói bạn cũng phải cởi giày ở hầu hết cơ sở kinh doanh và khách sạn, không chỉ ở nhà → Sai."},{"q":"2. Be careful with your slippers when you come back to the main room.","options":["Đúng (True)","Sai (False)"],"answer":0,"explanation":"Bài đọc nói việc mang dép bẩn quay lại phòng chính là rất bất lịch sự, nên cần cẩn thận → Đúng."},{"q":"3. You mustn’t wear slippers stepping onto a tatami mat.","options":["Đúng (True)","Sai (False)"],"answer":0,"explanation":"Bài đọc nói \"Never wear slippers when you need to step onto a tatami mat\" → Đúng."},{"q":"4. The Japanese bath is also used for washing and rinsing.","options":["Đúng (True)","Sai (False)"],"answer":1,"explanation":"Bài đọc nói bồn tắm được dùng SAU KHI đã tắm rửa và tráng người, không phải để tắm rửa → Sai."},{"q":"5. The bath plays an important part in the Japanese life.","options":["Đúng (True)","Sai (False)"],"answer":0,"explanation":"Bài đọc nhấn mạnh sự quan trọng và nghi thức xoay quanh việc tắm (được tắm trước, cẩn thận không làm bẩn nước) → Đúng."}]},{"roman":"XII","navLabel":"Đọc hiểu 3","icon":"comments","title":"Đọc hiểu – Ancestor Worship","instructions":"Task 1 (câu 1-5): Nối từ ở cột A với định nghĩa ở cột B — chọn chữ cái tương ứng. Task 2 (câu 6-10): Đọc đoạn văn và trả lời câu hỏi.","type":"sentence","instant":true,"passage":{"title":"Ancestor Worship","html":"Ancestor worship is a religious practice based on the belief that one’s ancestors possess supernatural powers, such as gods, angels, saints, or demons.<br><br>Ancestor worship in some cultures honors the deeds, memories, and sacrifice of the dead. Much of the worship includes visiting the ancestors at their graves, making offerings to them to provide for their welfare in the afterlife.<br><br>Spirit money (also called Hell Notes) is sometimes burned as an offering to ancestors as well for the afterlife. The living may regard the ancestors as “guardian angels” to them, perhaps protecting them from serious accidents, or guiding their path in life.<br><br>Families burn incense every day on the domestic ancestral altar. In China, the family altar houses the family spirit tablets. On the outer surface of the spirit tablet is engraved the year of the death, his full name, and the name of the son who erects the tablet.<br><br>Anniversary rites take place on the death date of each major deceased member of the family every year. Sacrificial food is offered, and living members of the family participate in the ceremony in ritual order based on age and generation.","vi":"Thờ cúng tổ tiên là một tín ngưỡng tôn giáo dựa trên niềm tin rằng tổ tiên của một người có sức mạnh siêu nhiên, giống như các vị thần, thiên thần, thánh, hay linh hồn.<br><br>Ở một số nền văn hóa, thờ cúng tổ tiên là để tôn vinh công lao, ký ức và sự hi sinh của người đã khuất. Phần lớn việc thờ cúng bao gồm viếng mộ tổ tiên, dâng lễ vật để chăm lo cho họ ở thế giới bên kia.<br><br>Tiền vàng mã (còn gọi là Hell Notes) đôi khi được đốt như một lễ vật dâng cho tổ tiên ở thế giới bên kia. Người sống có thể xem tổ tiên như những \"thiên thần hộ mệnh\", có thể bảo vệ họ khỏi tai nạn nghiêm trọng, hoặc dẫn dắt con đường đời của họ.<br><br>Các gia đình đốt hương mỗi ngày trên bàn thờ tổ tiên trong nhà. Ở Trung Quốc, bàn thờ gia đình chứa các bài vị của tổ tiên. Trên bề mặt ngoài của bài vị có khắc năm mất, họ tên đầy đủ, và tên của người con lập bài vị.<br><br>Lễ giỗ diễn ra vào ngày mất của mỗi thành viên lớn đã khuất trong gia đình hằng năm. Đồ cúng được dâng lên, và các thành viên còn sống tham gia buổi lễ theo thứ tự nghi thức dựa trên tuổi tác và thế hệ."},"questions":[{"q":"1. practice → đáp án nào ở cột B?","answer":4,"vi":"Đáp án E: sự thực hành, làm điều gì đó nhiều lần.","type":"mcq","options":["A","B","C","D","E"]},{"q":"2. deed → đáp án nào ở cột B?","answer":2,"vi":"Đáp án C: hành động, việc làm.","type":"mcq","options":["A","B","C","D","E"]},{"q":"3. afterlife → đáp án nào ở cột B?","answer":0,"vi":"Đáp án A: kiếp sau, thế giới bên kia.","type":"mcq","options":["A","B","C","D","E"]},{"q":"4. incense → đáp án nào ở cột B?","answer":1,"vi":"Đáp án B: hương, nhang.","type":"mcq","options":["A","B","C","D","E"]},{"q":"5. rite → đáp án nào ở cột B?","answer":3,"vi":"Đáp án D: nghi lễ.","type":"mcq","options":["A","B","C","D","E"]},{"q":"6. Why does ancestor worship become a religious practice?","answer":"Because people believe that their ancestors possess supernatural powers.","accepted":["because people believe that their ancestors possess supernatural powers"],"vi":"Vì người ta tin rằng tổ tiên của họ có sức mạnh siêu nhiên."},{"q":"7. What are the activities of the worship?","answer":"They are: visiting the ancestors at their graves, making offerings to them to provide for their welfare in the afterlife, and burning incense every day on the domestic ancestral altar.","accepted":["they are: visiting the ancestors at their graves making offerings to them to provide for their welfare in the afterlife and burning incense every day on the domestic ancestral altar"],"vi":"Đó là: viếng mộ tổ tiên, dâng lễ vật chăm lo cho họ ở thế giới bên kia, và đốt hương mỗi ngày trên bàn thờ tổ tiên."},{"q":"8. Why do people burn spirit money for their dead ancestors?","answer":"Because they believe that their ancestors may use the money in the afterlife.","accepted":["because they believe that their ancestors may use the money in the afterlife"],"vi":"Vì họ tin rằng tổ tiên có thể dùng số tiền đó ở thế giới bên kia."},{"q":"9. What can we see on the spirit tablet?","answer":"We can see the year of the death, his full name, and the name of the son who erects the tablet.","accepted":["we can see the year of the death his full name and the name of the son who erects the tablet"],"vi":"Chúng ta có thể thấy năm mất, họ tên đầy đủ, và tên người con lập bài vị."},{"q":"10. When do anniversary rites for the major deceased member of the family take place?","answer":"They take place on the death date of the ancestors every year.","accepted":["they take place on the death date of the ancestors every year"],"vi":"Lễ giỗ diễn ra vào ngày mất của tổ tiên hằng năm."}],"refTable":"<div class=\"task-card bg-white rounded-2xl shadow-md p-4 mb-4\">\n  <p class=\"text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide\"><i class=\"fa-solid fa-table-list mr-1\"></i>Task 1: Match a word in column A with a definition in column B</p>\n  <div class=\"grid sm:grid-cols-2 gap-3 text-sm\">\n    <div><p class=\"font-bold text-pink-700 mb-1 text-center\">A</p><table class=\"w-full border-collapse border border-slate-200 rounded-lg overflow-hidden\"><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-slate-400 w-8\">1</td><td class=\"p-2 font-semibold text-slate-800\">practice</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-slate-400 w-8\">2</td><td class=\"p-2 font-semibold text-slate-800\">deed</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-slate-400 w-8\">3</td><td class=\"p-2 font-semibold text-slate-800\">afterlife</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-slate-400 w-8\">4</td><td class=\"p-2 font-semibold text-slate-800\">incense</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-slate-400 w-8\">5</td><td class=\"p-2 font-semibold text-slate-800\">rite</td></tr></table></div>\n    <div><p class=\"font-bold text-pink-700 mb-1 text-center\">B</p><table class=\"w-full border-collapse border border-slate-200 rounded-lg overflow-hidden\"><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-pink-700 w-8\">A</td><td class=\"p-2 text-slate-700\">the life which some people believe begins after death</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-pink-700 w-8\">B</td><td class=\"p-2 text-slate-700\">substance that produces a sweet smell when burned, especially in religious ceremonies</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-pink-700 w-8\">C</td><td class=\"p-2 text-slate-700\">an action</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-pink-700 w-8\">D</td><td class=\"p-2 text-slate-700\">a ceremony, often for religious purposes</td></tr><tr class=\"border-b border-slate-100\"><td class=\"p-2 font-bold text-pink-700 w-8\">E</td><td class=\"p-2 text-slate-700\">doing something many times</td></tr></table></div>\n  </div>\n</div>"},{"roman":"XIII","navLabel":"Viết lời khuyên","icon":"link","title":"Cho lời khuyên với Should/Shouldn't","instructions":"Frank đang nấu ăn. Hãy cho anh ấy lời khuyên với should/shouldn't.","type":"sentence","instant":true,"questions":[{"q":"1.","original":"1. Don’t leave the beef in the oven for more than one hour.","answer":"He shouldn’t","accepted":["he shouldn’t"],"vi":"Đừng để thịt bò trong lò quá một tiếng.","suffix":"leave the beef in the oven for more than one hour."},{"q":"2.","original":"2. Cut the onions as thin as possible.","answer":"He should cut","accepted":["he should cut"],"vi":"Nên thái hành càng mỏng càng tốt.","suffix":"the onions as thin as possible."},{"q":"3.","original":"3. Use fresh herbs and fresh vegetables.","answer":"He should use","accepted":["he should use"],"vi":"Nên dùng rau thơm và rau củ tươi.","suffix":"fresh herbs and fresh vegetables."},{"q":"4.","original":"4. Don’t put in too much salt and chilies.","answer":"He shouldn’t put","accepted":["he shouldn’t put"],"vi":"Đừng cho quá nhiều muối và ớt.","suffix":"in too much salt and chilies."},{"q":"5.","original":"5. Wait until the water boils before you put the vegetables into it.","answer":"He should wait","accepted":["he should wait"],"vi":"Nên đợi nước sôi trước khi cho rau vào.","suffix":"until the water boils before he puts the vegetables into it."},{"q":"6.","original":"6. Heat the oven before you put the beef in.","answer":"He should heat","accepted":["he should heat"],"vi":"Nên làm nóng lò trước khi cho thịt bò vào.","suffix":"the oven before he puts the beef in."},{"q":"7.","original":"7. Cut the beef into a lot of equal slices.","answer":"He shouldn’t cut","accepted":["he shouldn’t cut"],"vi":"Đừng cắt thịt bò thành quá nhiều lát bằng nhau.","suffix":"the beef into a lot of equal slices."}]},{"roman":"XIV","navLabel":"Viết câu hoàn chỉnh","icon":"sitemap","title":"Viết thành câu hoàn chỉnh","instructions":"Dùng các cụm từ gợi ý để viết thành câu hoàn chỉnh.","type":"reorder","instant":true,"questions":[{"q":"1.","words":["If","you","want","work","the USA,","you should learn","speak English.","to","in","to"],"answer":"If you want to work in the USA, you should learn to speak English.","accepted":["if you want to work in the usa you should learn to speak english"],"vi":"Nếu bạn muốn làm việc ở Mỹ, bạn nên học nói tiếng Anh."},{"q":"2.","words":["You should not","give","someone","clock","as","present.","a","a"],"answer":"You should not give someone a clock as a present.","accepted":["you should not give someone a clock as a present"],"vi":"Bạn không nên tặng ai đó một chiếc đồng hồ làm quà."},{"q":"3.","words":["You","ill.","You should not","go","school","today.","are","to"],"answer":"You are ill. You should not go to school today.","accepted":["you are ill you should not go to school today"],"vi":"Bạn đang ốm. Bạn không nên đi học hôm nay."},{"q":"4.","words":["Tomorrow","Sunday.","So","I","not have","go","school.","is","do","to"],"answer":"Tomorrow is Sunday. So I do not have to go to school.","accepted":["tomorrow is sunday so i do not have to go to school"],"vi":"Ngày mai là Chủ nhật. Vì vậy tôi không cần phải đi học."},{"q":"5.","words":["I","think","people","should","recycle","more","paper","glass.","and"],"answer":"I think people should recycle more paper and glass.","accepted":["i think people should recycle more paper and glass"],"vi":"Tôi nghĩ mọi người nên tái chế nhiều giấy và thủy tinh hơn."},{"q":"6.","words":["The","museum","free.","You","not","have","pay.","is","do","to"],"answer":"The museum is free. You do not have to pay.","accepted":["the museum is free you do not have to pay"],"vi":"Bảo tàng miễn phí. Bạn không cần phải trả tiền."},{"q":"7.","words":["I","have","wear","uniform","when","I","at school.","to","a","am"],"answer":"I have to wear a uniform when I am at school.","accepted":["i have to wear a uniform when i am at school"],"vi":"Tôi đã phải mặc đồng phục khi còn đi học."},{"q":"8.","words":["If","you","see","Pauline,","you","should","polite","her.","be","to"],"answer":"If you see Pauline, you should be polite to her.","accepted":["if you see pauline you should be polite to her"],"vi":"Nếu bạn gặp Pauline, bạn nên lịch sự với cô ấy."},{"q":"9.","words":["You","should not","smoke.","It","bad","you.","is","for"],"answer":"You should not smoke. It is bad for you.","accepted":["you should not smoke it is bad for you"],"vi":"Bạn không nên hút thuốc. Nó có hại cho bạn."},{"q":"10.","words":["We","have","be","on time","the meeting.","to","for"],"answer":"We have to be on time for the meeting.","accepted":["we have to be on time for the meeting"],"vi":"Chúng ta phải đến đúng giờ cho cuộc họp."}]},{"roman":"XV","navLabel":"Viết lại câu","icon":"puzzle-piece","title":"Viết lại câu","instructions":"Viết lại câu thứ hai sao cho nghĩa không đổi so với câu thứ nhất.","type":"sentence","instant":true,"questions":[{"q":"1.","original":"She couldn't afford to buy the car.","starter":"The car is too","answer":"expensive for her to buy.","accepted":["expensive for her to buy"],"vi":"Chiếc xe quá đắt để cô ấy mua được."},{"q":"2.","original":"I would like you to help me to put the chair away.","starter":"Do you mind","answer":"helping me to put the chair away?","accepted":["helping me to put the chair away"],"vi":"Bạn có phiền giúp tôi cất cái ghế đi không?"},{"q":"3.","original":"If I were you, I wouldn't sweep the house on the first day of Tet.","starter":"You","answer":"shouldn't sweep the house on the first day of Tet.","accepted":["shouldn't sweep the house on the first day of tet"],"vi":"Bạn không nên quét nhà vào ngày mùng một Tết."},{"q":"4.","original":"Is it really necessary for us to finish the work today?","starter":"Do we","answer":"have to finish the work today?","accepted":["have to finish the work today","need to finish the work today"],"vi":"Chúng ta có thực sự phải hoàn thành công việc hôm nay không?"},{"q":"5.","original":"Learning about other cultures is one of my interests.","starter":"I'm","answer":"interested in learning about other cultures.","accepted":["interested in learning about other cultures"],"vi":"Tôi thích tìm hiểu về các nền văn hóa khác."},{"q":"6.","original":"Unless he phones her immediately, he won't get any information.","starter":"If","answer":"he doesn't phone her immediately, he won't get any information.","accepted":["he doesn't phone her immediately he won't get any information"],"vi":"Nếu anh ấy không gọi điện cho cô ấy ngay, anh ấy sẽ không có được thông tin gì."},{"q":"7.","original":"It's very difficult to leave here after such a long time.","starter":"It isn't","answer":"easy to leave here after such a long time.","accepted":["easy to leave here after such a long time"],"vi":"Thật không dễ dàng để rời khỏi đây sau một thời gian dài như vậy."},{"q":"8.","original":"Let's get together and talk about our presentation before we do it in class.","starter":"Why","answer":"don't we get together and talk about our presentation before we do it in class?","accepted":["don't we get together and talk about our presentation before we do it in class"],"vi":"Sao chúng ta không tụ tập lại và bàn về bài thuyết trình trước khi làm ở lớp nhỉ?"}]}]};

ta-w="permitted" onclick="event.stopPropagation();speak(this.dataset.w,this)" class="speak-btn inline-flex w-4 h-4 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 hover:scale-110 transition items-center justify-center align-middle ml-1" title="Nghe phát âm"><i class="fa-solid fa-volume-high text-[8px]"></i></button> (adj): được cho phép</div></div></div></div><div class="task-card bg-white rounded-2xl shadow-md p-4 md:p-6 mt-4"><h3 class="text-lg font-extrabold text-pink-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-graduation-cap text-amber-500"></i>III) GRAMMAR <span class="text-sm font-semibold text-slate-500">(Should/Shouldn't &amp; Have to)</span></h3>

      <i>I shouldn't have eaten so much cake!</i> <span class="text-slate-400">(Đáng lẽ tôi không nên ăn nhiều bánh như vậy!)</span>

      <span class="text-slate-400">(*S chỉ áp dụng dạng "have to" với I/you/we/they; dùng "has to" với he/she/it)</span>

      <li>❌ Nhầm <b>mustn't</b> (không được phép/cấm) với <b>don't have to</b> (không cần thiết).</li>

      <li>🔑 <b>Don't have to</b>: không cần thiết (có thể làm hoặc không).</li>

function normalize(str){
  return (str||'').trim().toLowerCase()
    .replace(/[‘’]/g,"'")
    .replace(/["“”]/g,'')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ');
}
function widthFor(ref){ const l=(ref||'').length; return l<7?'w-32':l<16?'w-40':'w-full'; }

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)){ alert('Trình duyệt của bạn không hỗ trợ phát âm tự động. Hãy thử Chrome, Edge hoặc Safari.'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>btn.classList.remove('speaking'); u.onerror=()=>btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function optionLetter(i){ return String.fromCharCode(65+i); }

function renderPassage(p, idx){
  if(!p) return '';
  const viBlock = p.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-pink-200 text-pink-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-pink-200 italic text-slate-500">${p.vi}</p>` : '';
  return `<div class="passage-box mb-4"><p class="font-extrabold text-pink-700 mb-2"><i class="fa-solid fa-book mr-1"></i>${p.title||''}</p><p id="passage_en_${idx}">${p.html}</p>${viBlock}
    <p class="text-[11px] text-slate-400 mt-2"><i class="fa-solid fa-circle-info mr-1"></i>Di chuột vào từ gạch chân để xem nghĩa.</p></div>`;
}
function renderDict(d, idx){
  if(!d) return '';
  const viBlock = d.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-amber-300 text-amber-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-amber-300 text-slate-600">${d.vi}</p>` : '';
  return `<div class="dict-box mb-4"><p class="font-extrabold text-amber-800 mb-1"><i class="fa-solid fa-book-bookmark mr-1"></i>${d.word} <span class="font-normal italic">${d.ipa||''}</span> <span class="font-normal">(${d.pos||''})</span></p>${d.senses.map(x=>`<p class="mb-1">✱ ${x.def}</p>${(x.examples||[]).map(e=>`<p class="ml-4 italic text-slate-600">• ${e}</p>`).join('')}`).join('')}${viBlock}</div>`;
}
function renderBank(bank, idx, clickable){
  if(!bank || !bank.length) return '';
  const hint = clickable ? ' <span class="normal-case font-normal text-slate-400">(bấm để điền)</span>' : '';
  return `<div class="mb-4"><p class="text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide"><i class="fa-solid fa-list-ul mr-1"></i>Liên từ cho sẵn${hint}</p>
    <div class="grid grid-cols-2 sm:grid-cols-5 border-2 border-slate-800 rounded-lg overflow-hidden text-sm font-bold text-slate-800">
      ${bank.map((w,bi)=>clickable
        ? `<div class="bank-chip px-3 py-2 text-center border border-slate-300 bg-white" id="bankchip_${idx}_${bi}" onclick="fillFromBank(${idx},${bi})">${w}</div>`
        : `<div class="px-3 py-2 text-center border border-slate-300 bg-white">${w}</div>`
      ).join('')}
    </div>
  </div>`;
}
function fillFromBank(idx, bi){
  const chip = document.getElementById(`bankchip_${idx}_${bi}`);
  if(!chip || chip.classList.contains('used')) return;
  const word = DATA.sections[idx].bank[bi];
  const inputs = Array.from(document.querySelectorAll(`#tab-${idx} input.answer-input[id^="inp_${idx}_"]`));
  const target = inputs.find(inp => inp.value.trim()==='');
  if(!target) return;
  target.value = word;
  target.dataset.bankChip = bi;
  chip.classList.add('used');
}
function releaseBankChipIfChanged(idx,i){
  const inp=document.getElementById(`inp_${idx}_${i}`);
  if(!inp || inp.dataset.bankChip===undefined) return;
  const bi=inp.dataset.bankChip;
  delete inp.dataset.bankChip;
  const chip=document.getElementById(`bankchip_${idx}_${bi}`);
  if(chip) chip.classList.remove('used');
}

             <button type="button" data-w="${cleanWord}" onclick="event.stopPropagation();event.preventDefault();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-pink-100 text-pink-700 hover:bg-pink-200 hover:scale-110 transition flex items-center justify-center ml-auto shrink-0 mcq-detail-hidden" title="Nghe phát âm" aria-label="Nghe phát âm ${cleanWord}"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`

      }
    } else if(qType==='truefalse_correct'){
      inner += `<div class="flex gap-3 mb-2">
        <button type="button" class="tf-btn px-5 py-1.5 rounded-full font-bold text-sm border-2 border-emerald-300 text-emerald-700 hover:bg-emerald-50" id="tfT_${idx}_${i}" onclick="selectTF(${idx},${i},true)">✓ ĐÚNG</button>

      </div>
      <input type="text" id="inp_${idx}_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Nếu SAI, viết lại cả câu cho đúng…" autocomplete="off" spellcheck="false">`;
    } else if(qType==='reorder'){
      const promptBlock = q.prompt ? `<p class="text-slate-500 text-sm mb-2 italic">${q.prompt}</p>` : '';
      const chips = q.words.map((w,j)=>`<span class="word-chip bg-white border-2 border-lime-300 text-lime-700 font-bold text-sm px-3 py-1.5 rounded-xl shadow-sm" id="chip_${idx}_${i}_${j}" onclick="addChip(${idx},${i},${j})">${w}</span>`).join('');
      inner += `${promptBlock}
        <div class="flex flex-wrap gap-2 mb-3">${chips}</div>
        <div class="answer-line flex flex-wrap gap-2 items-center bg-lime-50 border-2 border-dashed border-lime-300 rounded-xl p-3" id="line_${idx}_${i}"></div>
        <div class="flex gap-2 mt-2">
          <button type="button" onclick="clearChips(${idx},${i})" class="text-xs font-bold text-slate-500 hover:text-rose-600 transition"><i class="fa-solid fa-eraser mr-1"></i>Xóa hết</button>
        </div>
        <input type="hidden" id="inp_${idx}_${i}" value="">`;
    }
    inner += `<div class="explanation-box mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm text-blue-800" id="fb_${idx}_${i}"></div>`;
    inner += `</div>`;
  });
  inner += `</div>`;

  inner += `<div class="flex flex-wrap gap-2 mt-5">
    <button onclick="checkSection(${idx})" class="bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>
    <button onclick="revealSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-eye mr-1"></i>Xem đáp án</button>
    <button onclick="resetSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-rotate-left mr-1"></i>Làm lại</button>
    <span id="score_${idx}" class="hidden ml-auto self-center font-extrabold text-emerald-600 text-sm score-badge"></span>
  </div>`;

  return `<section id="tab-${idx}" class="section-page space-y-4">${inner}</section>`;
}

function buildMain(){

  DATA.sections.forEach((s,idx)=>{
