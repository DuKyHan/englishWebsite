một người → dùng đại từ phản thân \"himself\".","vi":""},{"q":"3. Children _______ drink milk every day. - It’s good for them.","options":["must","ought","don’t have to","must not"],"answer":0,"vis":["phải (đúng, nhấn mạnh nên làm vì tốt cho trẻ)","thiếu \"to\" (sai cấu trúc)","không cần (sai nghĩa, ngược ý câu)","không được phép (sai nghĩa)"],"explanation":"Nhấn mạnh việc nên làm vì lợi ích sức khỏe → must.","vi":""},{"q":"4. I think Angela _______ to buy that coat, it’s really lovely.","options":["must","ought","should","have"],"answer":1,"vis":["phải + to (sai cấu trúc must không đi với to)","nên (đúng, ought to + V)","nên (should không cần thêm to phía sau, câu đã có sẵn to buy)","có (sai nghĩa)"],"explanation":"\"ought to + V\" = nên làm gì → ought to buy.","vi":""},{"q":"5. We’ll go swimming today _______it’s hot.","options":["so","because","so that","then"],"answer":1,"vis":["vì vậy (sai, cần liên từ chỉ lý do)","bởi vì (đúng, chỉ lý do)","để mà (sai nghĩa)","rồi thì (sai từ loại)"],"explanation":"\"because\" = bởi vì, giải thích lý do đi bơi.","vi":""},{"q":"6. Let me _______ your bag.","options":["carry","to carry","to carrying","carrying"],"answer":0,"vis":["mang (đúng, let + O + V nguyên mẫu)","sai cấu trúc (let không đi với to-V)","sai cấu trúc","sai cấu trúc"],"explanation":"\"let somebody + V nguyên mẫu\" → carry.","vi":""},{"q":"7. I tried _______her name but I couldn’t.","options":["remember","to remember","remembering","to remembering"],"answer":1,"vis":["sai (thiếu to)","để nhớ (đúng, \"try to V\" = cố gắng làm gì)","cố nhớ lại (nghĩa khác: thử làm gì đó xem sao)","sai cấu trúc"],"explanation":"\"try to V\" = cố gắng làm (nhưng không thành công) → to remember.","vi":""},{"q":"8. We live in the room _______the store.","options":["above","on","over","up"],"answer":0,"vis":["phía trên (đúng, ở tầng trên cửa hàng)","trên bề mặt (sai nghĩa)","ở trên, phía trên bề mặt (ít phù hợp hơn above cho vị trí tầng)","lên (sai từ loại)"],"explanation":"\"above\" = ở phía trên (tầng trên) một địa điểm.","vi":""},{"q":"9. It’ll take me an hour to do the household_______.","options":["work","chores","job","exercises"],"answer":1,"vis":["công việc chung chung (sai, cần từ chuyên biệt)","việc vặt trong nhà (đúng, household chores)","công việc (không đi với household theo cách này)","bài tập (sai nghĩa)"],"explanation":"\"household chores\" = việc nhà, việc vặt trong nhà.","vi":""},{"q":"10. The _____ put too much salt in the food.","options":["cook","cooker","stove","oven"],"answer":0,"vis":["người đầu bếp (đúng, người nêm nếm món ăn)","nồi cơm điện (sai, đồ vật không thể tự cho muối)","bếp lò (sai, đồ vật)","lò nướng (sai, đồ vật)"],"explanation":"Cần danh từ chỉ NGƯỜI thực hiện hành động cho muối → the cook.","vi":""},{"q":"11. The Gong Festival is held_______ in the Central Highlands.","options":["year","which","annual","annually"],"answer":3,"vis":["sai từ loại (danh từ)","sai (đại từ quan hệ, không phù hợp)","sai từ loại (tính từ, cần trạng từ bổ nghĩa cho động từ)","hằng năm (đúng, trạng từ bổ nghĩa cho \"is held\")"],"explanation":"Cần trạng từ bổ nghĩa cho động từ \"is held\" → annually.","vi":""},{"q":"12. ______________does Hoa Ban Festival take place? - In Lai Chau.","options":["What","Where","When","How"],"answer":1,"vis":["sai (câu trả lời chỉ địa điểm)","ở đâu (đúng, trả lời \"In Lai Chau\" chỉ nơi chốn)","khi nào (sai, câu trả lời không phải thời gian)","như thế nào (sai)"],"explanation":"Câu trả lời \"In Lai Chau\" chỉ địa điểm → hỏi bằng Where.","vi":""},{"q":"13. It is typical of the cultural life of_______ Thai people.","options":["some","a","the","Ø (không mạo từ)"],"answer":2,"vis":["một số (sai nghĩa, không xác định)","sai (Thai people số nhiều, không dùng a)","của người Thái (đúng, nhóm dân tộc xác định dùng \"the\")","thiếu mạo từ cần thiết"],"explanation":"Nhóm dân tộc cụ thể, xác định → dùng \"the\" + Thai people.","vi":""},{"q":"14. ______do the cattle provide for the nomads? - Dairy products, meat, and clothing.","options":["What","Where","Why","How"],"answer":0,"vis":["cái gì (đúng, câu trả lời liệt kê sự vật)","ở đâu (sai, câu trả lời không phải nơi chốn)","tại sao (sai, câu trả lời không phải lý do)","như thế nào (sai)"],"explanation":"Câu trả lời liệt kê các sự vật (dairy products, meat, clothing) → hỏi bằng What.","vi":""},{"q":"15. The crops_______on the weather.","options":["depend heavy","depend heavily","affect heavy","affect heavily"],"answer":1,"vis":["sai (depend on cần trạng từ, không phải tính từ)","phụ thuộc nhiều vào (đúng, depend heavily on)","sai động từ (affect không đi với on)","sai động từ và từ loại"],"explanation":"\"depend heavily on\" = phụ thuộc nhiều vào.","vi":""},{"q":"16. Mai studies Maths a little bit_______.","options":["bad","badly","good","smartly"],"answer":1,"vis":["sai từ loại (tính từ, cần trạng từ)","kém (đúng, trạng từ bổ nghĩa cho động từ study)","sai từ loại (tính từ)","thông minh (sai nghĩa văn cảnh, không hợp logic với \"a little bit\")"],"explanation":"Trạng từ bổ nghĩa cho động từ \"studies\" → badly.","vi":""},{"q":"17. During the festival, they fly many_______kites in different shapes and sizes.","options":["colour","colourless","colourful","colouring"],"answer":2,"vis":["danh từ (sai từ loại, cần tính từ)","không màu (sai nghĩa, trái nghĩa với \"different shapes and sizes\" đầy màu sắc)","đầy màu sắc (đúng, tính từ mô tả kites)","sai từ loại (danh động từ)"],"explanation":"Cần tính từ mô tả \"kites\" → colourful.","vi":""},{"q":"18. An old woman was_______the goats up the mountainside.","options":["riding","taking","herding","running"],"answer":2,"vis":["đang cưỡi (sai nghĩa, không hợp với \"goats\")","đang mang (chưa rõ nghĩa cho việc chăn dê)","đang chăn dắt (đúng, herd = chăn dắt gia súc)","đang chạy (sai nghĩa)"],"explanation":"\"herd\" = chăn dắt (gia súc) → herding the goats.","vi":""},{"q":"19. ________is the festival celebrated? – Every year.","options":["When","How often","How","What"],"answer":1,"vis":["khi nào (chưa đủ cụ thể cho tần suất lặp lại)","có thường xuyên không (đúng, trả lời \"Every year\" chỉ tần suất)","như thế nào (sai)","cái gì (sai)"],"explanation":"Câu trả lời \"Every year\" chỉ tần suất → hỏi bằng How often.","vi":""},{"q":"20. There are no high buildings to block_______in our village.","options":["view","a view","some view","the view"],"answer":3,"vis":["thiếu mạo từ","sai (view cụ thể, xác định)","sai (some không phù hợp với danh từ số ít cụ thể)","tầm nhìn (đúng, view cụ thể của làng, danh từ xác định)"],"explanation":"\"the view\" = tầm nhìn (cụ thể, đã được xác định) của làng.","vi":""},{"q":"21. Nick would like to know something about the ______groups of Viet Nam when he visited the Museum of Ethnology.","options":["culture","cultural","cultured","culturology"],"answer":1,"vis":["danh từ (sai từ loại, cần tính từ)","thuộc về văn hóa (đúng, tính từ bổ nghĩa cho \"groups\")","có văn hóa, lịch lãm (sai nghĩa)","danh từ (không tồn tại phổ biến, sai)"],"explanation":"Cần tính từ đứng trước danh từ \"groups\" → cultural.","vi":""},{"q":"22. He is surprised…….that there are 54 ethnic groups in our country.","options":["to understand","to study","to know","find"],"answer":2,"vis":["để hiểu (sai nghĩa, không phù hợp \"surprised\")","để học (sai nghĩa)","để biết (đúng, \"surprised to know\" = ngạc nhiên khi biết)","sai cấu trúc (thiếu to)"],"explanation":"\"surprised to know\" = ngạc nhiên khi biết được điều gì.","vi":""},{"q":"23. The Viet (or Kinh) have_____ number of people, accounting for about 86% of the population.","options":["large","the large","the largest","larger"],"answer":2,"vis":["sai (thiếu mạo từ và so sánh)","sai (chưa phải so sánh nhất)","đông dân số nhất (đúng, so sánh nhất vì 86% là tỉ lệ cao nhất)","đông hơn (so sánh hơn, chưa đủ nhấn mạnh mức cao nhất)"],"explanation":"86% dân số là tỉ lệ cao nhất → dùng so sánh nhất: the largest.","vi":""},{"q":"24. Nick was told that ethnic minority peoples have their own ways______ life and traditions.","options":["of","on","in","at"],"answer":0,"vis":["của (đúng, \"way of life\" = cách sống)","sai giới từ","sai giới từ","sai giới từ"],"explanation":"\"way of life\" = cách sống, lối sống.","vi":""},{"q":"25. The terraced fields of Sa Pa have entered______ the Top 11 most beautiful terraces in the world according to Touropia.","options":["in","on","at","of"],"answer":0,"vis":["vào (đúng, \"enter into/in a list\" = lọt vào danh sách)","sai giới từ","sai giới từ","sai giới từ"],"explanation":"\"enter in the Top…\" = lọt vào top…","vi":""},{"q":"26. Gathering and hunting still play an important role in the _____.of the Laha.","options":["economic","economy","economical","economize"],"answer":1,"vis":["tính từ (sai từ loại, cần danh từ)","nền kinh tế (đúng, danh từ sau mạo từ \"the\")","tính từ (tiết kiệm, sai từ loại)","động từ (sai từ loại)"],"explanation":"Sau mạo từ \"the\" cần danh từ → economy.","vi":""},{"q":"27. _____.ethnic group has a large population, the Tay or the Ede?","options":["What","Why","Which","Who"],"answer":2,"vis":["cái gì (sai, câu hỏi lựa chọn giữa 2 đối tượng cụ thể)","tại sao (sai nghĩa)","cái nào (đúng, hỏi lựa chọn giữa Tay và Ede)","ai (sai, hỏi về nhóm dân tộc không phải người)"],"explanation":"Câu hỏi lựa chọn giữa 2 phương án cụ thể (the Tay or the Ede) → Which.","vi":""},{"q":"28. Ethnic peoples in the mountains have a simple way of farming. They use basic tools to______ the farm work.","options":["check","work","make","do"],"answer":3,"vis":["kiểm tra (sai nghĩa)","làm việc (nội động từ, sai cấu trúc với tân ngữ \"the farm work\")","làm ra, tạo ra (sai nghĩa, không hợp với \"work\")","làm (đúng, \"do the work\" = làm công việc)"],"explanation":"\"do the (farm) work\" = làm công việc (đồng áng).","vi":""},{"q":"29. Many ethnic minority students have to _____ a long way to their schools every day","options":["travel","ride","pass","get"],"answer":0,"vis":["đi (một quãng đường) (đúng, travel a long way)","cưỡi, đi xe (sai cấu trúc với \"a long way\")","đi qua (sai nghĩa)","đến (sai cấu trúc)"],"explanation":"\"travel a long way\" = đi một quãng đường dài.","vi":""},{"q":"30. People_____ some far-away mountainous regions still keep their traditional way of life.","options":["on","in","of","at"],"answer":1,"vis":["sai giới từ","ở, tại (đúng, \"people in a region\" = người dân ở vùng nào đó)","sai giới từ","sai giới từ"],"explanation":"\"people in + địa điểm\" = người dân sống ở khu vực đó.","vi":""},{"q":"31. The Gong Festival is held ______________ in the Central Highlands.","options":["year","yearly","annual","annually"],"answer":3,"vis":["sai từ loại (danh từ)","hằng năm (trạng từ, cũng đúng nghĩa nhưng annually phổ biến hơn trong văn phong trang trọng)","sai từ loại (tính từ, cần trạng từ)","hằng năm (đúng, trạng từ bổ nghĩa cho \"is held\")"],"explanation":"Cần trạng từ bổ nghĩa cho động từ \"is held\" → annually.","vi":""},{"q":"32. ____________ does Hoa Ban Festival take place? – In Lai Chau.","options":["What","Where","When","How"],"answer":1,"vis":["sai (câu trả lời chỉ địa điểm)","ở đâu (đúng)","khi nào (sai)","như thế nào (sai)"],"explanation":"Câu trả lời \"In Lai Chau\" chỉ địa điểm → Where.","vi":""},{"q":"33. It is typical of the cultural life of _____ Thai people.","options":["some","a","the","Ø"],"answer":2,"vis":["một số (sai nghĩa)","sai (số nhiều, không dùng a)","của người Thái (đúng)","thiếu mạo từ cần thiết"],"explanation":"Nhóm dân tộc cụ thể → dùng \"the\".","vi":""},{"q":"34. _____do the cattle provide for the nomads? – Dairy products, meat and clothing.","options":["What","Where","Why","How"],"answer":0,"vis":["cái gì (đúng)","ở đâu (sai)","tại sao (sai)","như thế nào (sai)"],"explanation":"Câu trả lời liệt kê sự vật → What.","vi":""},{"q":"35. The crops _____on the weather.","options":["depend heavy","depend heavily","affect heavy","affect heavily"],"answer":1,"vis":["sai cấu trúc","phụ thuộc nhiều vào (đúng)","sai động từ","sai động từ và từ loại"],"explanation":"\"depend heavily on\" = phụ thuộc nhiều vào.","vi":""},{"q":"36. Mai studies Maths a little bit _____.","options":["bad","badly","good","smartly"],"answer":1,"vis":["sai từ loại","kém (đúng)","sai từ loại","sai nghĩa văn cảnh"],"explanation":"Trạng từ bổ nghĩa cho động từ → badly.","vi":""},{"q":"37. During the festival, they fly many_____ kites in different shapes and sizes.","options":["colour","colourless","colourful","colouring"],"answer":2,"vis":["sai từ loại","sai nghĩa","đầy màu sắc (đúng)","sai từ loại"],"explanation":"Cần tính từ mô tả kites → colourful.","vi":""},{"q":"38. An old woman was_____the goats up the mountainside.","options":["riding","taking","herding","running"],"answer":2,"vis":["sai nghĩa","chưa rõ nghĩa","đang chăn dắt (đúng)","sai nghĩa"],"explanation":"\"herd\" = chăn dắt gia súc.","vi":""},{"q":"39. _____is the festival celebrated? – Every year.","options":["When","How often","How","What"],"answer":1,"vis":["chưa đủ cụ thể","có thường xuyên không (đúng)","sai nghĩa","sai nghĩa"],"explanation":"Câu trả lời chỉ tần suất → How often.","vi":""},{"q":"40. There are no high buildings to block_____in our village.","options":["view","a view","some view","the view"],"answer":3,"vis":["thiếu mạo từ","sai (chưa xác định)","sai (không phù hợp)","tầm nhìn (đúng, xác định)"],"explanation":"\"the view\" = tầm nhìn xác định của làng.","vi":""},{"q":"41. The Dao in the Sapa area is famous ________ its “love market.”","options":["for","in","with","to"],"answer":0,"vis":["nổi tiếng vì (đúng, \"be famous for\")","sai giới từ","sai giới từ (\"famous with\" không tồn tại)","sai giới từ"],"explanation":"\"be famous for\" = nổi tiếng vì điều gì đó.","vi":""},{"q":"42. The Thai live ________ farming on their burnt-over land and wet-rice terraced fields.","options":["in","on","out","up"],"answer":1,"vis":["sai giới từ","sống nhờ vào (đúng, \"live on farming\" = sinh sống bằng nghề nông)","sai giới từ","sai giới từ (\"live up farming\" không tồn tại)"],"explanation":"\"live on something\" = sống nhờ/dựa vào (nghề gì đó) để sinh sống.","vi":""},{"q":"43. The ________ house is a place where villagers gather for festivals and rituals.","options":["terraced","splendid","communal","thatched"],"answer":2,"vis":["ruộng bậc thang (sai nghĩa, không phải nhà)","tráng lệ (sai nghĩa văn cảnh)","nhà cộng đồng, nhà rông (đúng, nơi dân làng tụ họp)","nhà lợp tranh (sai nghĩa, không liên quan đến việc tụ họp)"],"explanation":"\"communal house\" = nhà cộng đồng/nhà rông, nơi tụ họp lễ hội.","vi":""},{"q":"44. There were lots of interesting folk games, _______ Kenny stayed a little longer to join them.","options":["but","because","however","so"],"answer":3,"vis":["nhưng (sai, không phải quan hệ tương phản)","bởi vì (sai chiều quan hệ nhân quả)","tuy nhiên (sai, không nối được 2 mệnh đề trong 1 câu)","vì vậy (đúng, quan hệ nhân quả: trò chơi hay nên Kenny ở lại lâu hơn)"],"explanation":"Quan hệ nhân quả (trò chơi hay → Kenny ở lại lâu hơn) → so.","vi":""},{"q":"45. ‘________ dress in red and black costume?’ ‘The Dao’","options":["What","Which","Who","When"],"answer":0,"vis":["cái gì/nhóm nào (đúng, hỏi về nhóm dân tộc, trả lời tên riêng)","cái nào (cũng có thể dùng nhưng \"what\" phổ biến hơn khi hỏi mở, không giới hạn lựa chọn có sẵn)","ai (sai, hỏi về nhóm dân tộc chứ không phải cá nhân)","khi nào (sai nghĩa)"],"explanation":"Câu trả lời là tên một dân tộc (\"The Dao\") → hỏi bằng What.","vi":""},{"q":"46. What colour is ________ symbol of good luck for the Hoa?","options":["a","an","-","some"],"answer":0,"vis":["một (đúng, \"symbol\" bắt đầu bằng phụ âm)","sai (an chỉ dùng trước nguyên âm)","thiếu mạo từ cần thiết","một số (sai, symbol số ít cụ thể)"],"explanation":"\"symbol\" bắt đầu bằng phụ âm /s/ → dùng \"a\".","vi":""},{"q":"47. ________ in terraced fields is the main economic activity of ethnic people in Sapa.","options":["Fishing","Rice cultivation","Hunting","Gathering"],"answer":1,"vis":["đánh bắt cá (sai nghĩa, không liên quan ruộng bậc thang)","trồng lúa (đúng, hoạt động chính trên ruộng bậc thang)","săn bắt (sai nghĩa)","hái lượm (sai nghĩa)"],"explanation":"Hoạt động kinh tế chính trên ruộng bậc thang → Rice cultivation.","vi":""},{"q":"48. ________ ethnic Khmer live in ________ Mekong Delta of Vietnam.","options":["The / -","The / a","A / the","The / the"],"answer":0,"vis":["Người Khmer / (không mạo từ) (theo đáp án chính thức)","sai (Mekong Delta là địa danh xác định, không dùng \"a\")","sai (thiếu mạo từ trước \"ethnic Khmer\")","Người Khmer / vùng đồng bằng (cách dùng phổ biến khác cũng hợp lý)"],"explanation":"\"The Khmer\" (nhóm dân tộc, có \"the\"); tên vùng đồng bằng theo đáp án chính thức không dùng mạo từ.","vi":""},{"q":"49. The Vietnam Museum of Ethnology ________ by the architect Ha Duc Linh, a member of the Tay ethnic group.","options":["designed","has designed","was designed","was designing"],"answer":2,"vis":["sai (chủ động, cần bị động)","sai (chủ động hoàn thành)","được thiết kế bởi (đúng, bị động quá khứ)","sai thì (quá khứ tiếp diễn)"],"explanation":"Bảo tàng ĐƯỢC thiết kế bởi kiến trúc sư → bị động quá khứ: was designed.","vi":""},{"q":"50. ‘I have just taken an elephant ride in Buon Don.’ ‘________ How interesting!’","options":["Certainly.","Really?","Terrible.","Exactly."],"answer":1,"vis":["chắc chắn rồi (sai ngữ cảnh, không phải phản hồi ngạc nhiên)","thật á? (đúng, thể hiện sự ngạc nhiên thích thú trước khi khen \"How interesting!\")","kinh khủng (sai nghĩa, trái ngược với \"How interesting\")","chính xác (sai ngữ cảnh, không dùng để phản hồi một trải nghiệm cá nhân)"],"explanation":"Phản ứng ngạc nhiên thích thú trước một trải nghiệm thú vị → Really?","vi":""}]},{"roman":"IV","navLabel":"Word Forms","icon":"font","title":"Chia dạng đúng của từ (Word Forms)","instructions":"Cho dạng đúng của từ trong ngoặc để hoàn thành câu.","type":"fill","instant":true,"questions":[{"q":"1. Nga eats more _______ than Tung does because she likes fast food.","hint":"(HEALTHY)","answer":"unhealthily","family":["healthy (adj): khỏe mạnh, lành mạnh","unhealthy (adj): không lành mạnh","unhealthily (adv): một cách không lành mạnh"],"note":"tính từ → trạng từ phủ định đuôi -ily","vi":"Nga ăn uống thiếu lành mạnh hơn Tùng vì cô ấy thích đồ ăn nhanh.","explanation":"HEALTHY → unhealthily."},{"q":"2. Viet Nam is a _______ country with different peoples, religions and traditions.","hint":"(CULTURAL)","answer":"multicultural","family":["cultural (adj): thuộc về văn hóa","multicultural (adj): đa văn hóa"],"note":"thêm tiền tố multi- (đa)","vi":"Việt Nam là một đất nước đa văn hóa với nhiều dân tộc, tôn giáo và truyền thống khác nhau.","explanation":"CULTURAL → multicultural."},{"q":"3. Most of the Central Highlands is _______.","hint":"(MOUNTAIN)","answer":"mountainous","family":["mountain (n): núi","mountainous (adj): có nhiều núi, thuộc vùng núi"],"note":"danh từ → tính từ đuôi -ous","vi":"Phần lớn Tây Nguyên là vùng núi.","explanation":"MOUNTAIN → mountainous."},{"q":"4. The _______ houses of many ethnic groups are used to worship the ancestors.","hint":"(COMMUNE)","answer":"communal","family":["commune (n): xã, cộng đồng","communal (adj): thuộc về cộng đồng, chung"],"note":"danh từ → tính từ đuôi -al","vi":"Nhà cộng đồng của nhiều dân tộc được dùng để thờ cúng tổ tiên.","explanation":"COMMUNE → communal."},{"q":"5. To become friendlier, you should _______ with your workmates.","hint":"(SOCIALISATION)","answer":"socialise","family":["socialisation (n): sự giao lưu, hòa nhập xã hội","socialise (v): giao lưu, kết bạn"],"note":"danh từ → động từ","vi":"Để trở nên thân thiện hơn, bạn nên giao lưu với đồng nghiệp.","explanation":"SOCIALISATION → socialise."},{"q":"6. Paul used to be _______ to soft drinks, but now he seldom drinks them.","hint":"(ADDICTION)","answer":"addicted","family":["addiction (n): sự nghiện","addicted (adj/P2): nghiện, bị nghiện"],"note":"danh từ → tính từ/quá khứ phân từ đuôi -ed","vi":"Paul từng nghiện nước ngọt, nhưng giờ anh ấy hiếm khi uống.","explanation":"ADDICTION → addicted."},{"q":"7. Like my aunt, I want to become a professional dog _______.","hint":"(TRAIN)","answer":"trainer","family":["train (v): huấn luyện","trainer (n): người huấn luyện"],"note":"động từ → danh từ chỉ người đuôi -er","vi":"Giống như dì tôi, tôi muốn trở thành người huấn luyện chó chuyên nghiệp.","explanation":"TRAIN → trainer."},{"q":"8. I am _______ of her hometown with a lot of paddy fields.","hint":"(ENVY)","answer":"envious","family":["envy (n/v): sự ghen tị, ghen tị","envious (adj): ghen tị, thèm muốn"],"note":"danh từ/động từ → tính từ đuôi -ous","vi":"Tôi ghen tị với quê hương của cô ấy có nhiều ruộng lúa.","explanation":"ENVY → envious."},{"q":"9. The cattle are herded to a new pasture by the _______.","hint":"(NOMADIC)","answer":"nomads","family":["nomadic (adj): du mục","nomad (n): người du mục","nomads (n, số nhiều): những người du mục"],"note":"tính từ → danh từ số nhiều","vi":"Đàn gia súc được chăn dắt đến đồng cỏ mới bởi những người du mục.","explanation":"NOMADIC → nomads."},{"q":"10. Do villagers today dress _______ as in the past?","hint":"(TRADITION)","answer":"traditionally","family":["tradition (n): truyền thống","traditional (adj): mang tính truyền thống","traditionally (adv): theo truyền thống"],"note":"danh từ → trạng từ đuôi -ly","vi":"Ngày nay dân làng có ăn mặc theo truyền thống như trước đây không?","explanation":"TRADITION → traditionally."},{"q":"11. Do you think the ethnic _______ people have their own customs and traditions?","hint":"(MINOR)","answer":"minority","family":["minor (adj): nhỏ, thứ yếu","minority (n): thiểu số"],"note":"tính từ → danh từ đuôi -ity (dùng như tính từ ghép \"ethnic minority\")","vi":"Bạn có nghĩ người dân tộc thiểu số có phong tục và truyền thống riêng không?","explanation":"MINOR → minority."},{"q":"12. Which ethnic group has the smallest _______ in Viet Nam.","hint":"(POPULATE)","answer":"Population","family":["populate (v): sinh sống, cư trú tại","population (n): dân số"],"note":"động từ → danh từ đuôi -ion","vi":"Dân tộc nào có dân số nhỏ nhất ở Việt Nam?","explanation":"POPULATE → Population."},{"q":"13. Some ethnic peoples in the mountainous regions still keep their _________ way of farming.","hint":"(TRADITION)","answer":"Traditional","family":["tradition (n): truyền thống","traditional (adj): mang tính truyền thống"],"note":"danh từ → tính từ đuôi -al","vi":"Một số dân tộc ở vùng núi vẫn giữ cách canh tác truyền thống của họ.","explanation":"TRADITION → Traditional."},{"q":"14. Which do you think is more _______, the Tay’s or Nung’s costume?","hint":"(COLOR)","answer":"colourful","family":["colour (n): màu sắc","colourful (adj): đầy màu sắc, sặc sỡ"],"note":"danh từ → tính từ đuôi -ful","vi":"Bạn nghĩ trang phục của người Tày hay người Nùng sặc sỡ hơn?","explanation":"COLOR → colourful."},{"q":"15. If you go to Sa Pa, you should try some _______ of the local people sold at the market.","hint":"(SPECIAL)","answer":"Specialties","family":["special (adj): đặc biệt","speciality/specialty (n): đặc sản","specialties (n, số nhiều): những món đặc sản"],"note":"tính từ → danh từ số nhiều đuôi -ty","vi":"Nếu đến Sa Pa, bạn nên thử một số đặc sản của người dân địa phương bán ở chợ.","explanation":"SPECIAL → Specialties."},{"q":"16. Five-coloured sticky rice is a traditional ___________ of Tay people.","hint":"(SPECIAL)","answer":"speciality","family":["special (adj): đặc biệt","speciality/specialty (n): đặc sản"],"note":"tính từ → danh từ đuôi -ty","vi":"Xôi ngũ sắc là một đặc sản truyền thống của người Tày.","explanation":"SPECIAL → speciality."},{"q":"17. H’mong people live in the northern ___ region of Vietnam.","hint":"(MOUNTAIN)","answer":"mountainous","family":["mountain (n): núi","mountainous (adj): có nhiều núi, thuộc vùng núi"],"note":"danh từ → tính từ đuôi -ous","vi":"Người H'mông sống ở vùng núi phía bắc Việt Nam.","explanation":"MOUNTAIN → mountainous."},{"q":"18. The Tai are known for their ___________ garments and their houses on stilts.","hint":"(WEAVE)","answer":"Woven","family":["weave (v): dệt","woven (adj/P2): được dệt"],"note":"động từ → tính từ/quá khứ phân từ bất quy tắc","vi":"Người Thái nổi tiếng với trang phục dệt tay và nhà sàn của họ.","explanation":"WEAVE → Woven."},{"q":"19. The ___________ you can find in Sapa include the Hmong, Dao, and Tay.","hint":"(ETHNIC)","answer":"ethnicities","family":["ethnic (adj): thuộc dân tộc","ethnicity (n): dân tộc, sắc tộc","ethnicities (n, số nhiều): các dân tộc"],"note":"tính từ → danh từ số nhiều đuôi -ity","vi":"Các dân tộc bạn có thể tìm thấy ở Sa Pa bao gồm người Hmông, Dao và Tày.","explanation":"ETHNIC → ethnicities."},{"q":"20. Muong people are ___________ more closely related to the Tai people.","hint":"(CULTURE)","answer":"culturally","family":["culture (n): văn hóa","cultural (adj): thuộc về văn hóa","culturally (adv): về mặt văn hóa"],"note":"danh từ → trạng từ đuôi -ly","vi":"Người Mường có quan hệ gần gũi hơn về mặt văn hóa với người Thái.","explanation":"CULTURE → culturally."}]},{"roman":"V","navLabel":"Chia động từ 1","icon":"pen","title":"Chia đúng dạng của động từ","instructions":"Viết dạng đúng của động từ trong ngoặc.","type":"fill","instant":true,"questions":[{"q":"1. YMoan is a famous singer for (sing) ___ songs about the Central Highlands ethnic people.","answer":"singing","vi":"Y Moan là ca sĩ nổi tiếng với các bài hát về người dân tộc Tây Nguyên.","explanation":"\"famous for + V-ing\" → singing."},{"q":"2. There are always cultural (differ) ___ in every country in all over the world.","answer":"differences","vi":"Luôn có những khác biệt văn hóa ở mọi quốc gia trên khắp thế giới.","explanation":"Cần danh từ số nhiều sau tính từ \"cultural\" → differences."},{"q":"3. Maya, an ethnic girl, always wants to (become) ___ an English teacher in the near future.","answer":"become","vi":"Maya, một cô gái dân tộc, luôn muốn trở thành giáo viên tiếng Anh trong tương lai gần.","explanation":"\"want to + V nguyên mẫu\" → become."},{"q":"4. He hates (go) ___ out in winter because it is really cold.","answer":"going","vi":"Anh ấy ghét ra ngoài vào mùa đông vì trời rất lạnh.","explanation":"\"hate + V-ing\" → going."},{"q":"5. While people in Hanoi love (drink) ___ lemon tea, people in Ho Chi Minh city like (drink) ___ coffee.","answer":"drinking / drinking","vi":"Trong khi người Hà Nội thích uống trà chanh, người Sài Gòn lại thích uống cà phê.","explanation":"\"love/like + V-ing\" → drinking / drinking.","accepted":["drinking / drinking","drinking/drinking","drinking, drinking"]},{"q":"6. Long prefers (buy) ___ a self-woven scarf to shoes.","answer":"buying","vi":"Long thích mua một chiếc khăn tự dệt hơn là giày.","explanation":"\"prefer + V-ing + to + N/V-ing\" → buying."},{"q":"7. Do you mind (close) ___ the windows because it is too cold?","answer":"closing","vi":"Bạn có phiền đóng cửa sổ lại vì trời quá lạnh không?","explanation":"\"mind + V-ing\" → closing."},{"q":"8. Would you like to (eat) ___ some coconut candies?","answer":"eat","vi":"Bạn có muốn ăn ít kẹo dừa không?","explanation":"\"would like to + V nguyên mẫu\" → eat."},{"q":"9. Do you like (go) ___ to Da Nang with my team?","answer":"going","vi":"Bạn có thích đi Đà Nẵng cùng đội của tôi không?","explanation":"\"like + V-ing\" → going."},{"q":"10. Many people say that Vietnamese coffee is (strong) ___ than others.","answer":"stronger","vi":"Nhiều người nói rằng cà phê Việt Nam đậm hơn các loại khác.","explanation":"So sánh hơn với tính từ ngắn + er → stronger."}]},{"roman":"VI","navLabel":"Chia động từ 2","icon":"pen-fancy","title":"V-ing hay To-infinitive?","instructions":"Viết dạng đúng (V-ing hoặc to-infinitive) của động từ trong ngoặc.","type":"fill","instant":true,"questions":[{"q":"1. He delayed (tell) ___ her the news, waiting for the right moment.","answer":"telling","vi":"Anh ấy trì hoãn việc báo tin cho cô ấy, chờ đợi thời điểm thích hợp.","explanation":"\"delay + V-ing\" → telling."},{"q":"2. I demand (see) ___ the manager.","answer":"to see","vi":"Tôi yêu cầu được gặp người quản lý.","explanation":"\"demand + to V\" → to see."},{"q":"3. My father offered (take) ___ us to the airport.","answer":"to take","vi":"Bố tôi đề nghị đưa chúng tôi ra sân bay.","explanation":"\"offer + to V\" → to take."},{"q":"4. I haven't missed (smoke) ___ like I expected to.","answer":"smoking","vi":"Tôi không nhớ việc hút thuốc như tôi đã tưởng.","explanation":"\"miss + V-ing\" → smoking."},{"q":"5. We've had to postpone (go) ___ to France because the children are ill.","answer":"going","vi":"Chúng tôi phải hoãn chuyến đi Pháp vì bọn trẻ bị ốm.","explanation":"\"postpone + V-ing\" → going."},{"q":"6. I hate (interrupt) ___, but it's time we left.","answer":"to interrupt","vi":"Tôi ghét phải làm gián đoạn, nhưng đã đến lúc chúng ta phải đi rồi.","explanation":"\"hate + to V\" (lịch sự, trang trọng) → to interrupt."},{"q":"7. She admitted to (have) ___ stolen the car.","answer":"having","vi":"Cô ấy thừa nhận đã ăn cắp chiếc xe.","explanation":"\"admit to + V-ing\" → having (having stolen: hoàn thành trước đó)."},{"q":"8. Katie chose (stay) ___ away from work that day.","answer":"to stay","vi":"Katie đã chọn nghỉ làm hôm đó.","explanation":"\"choose + to V\" → to stay."},{"q":"9. Hurry up! We're waiting (go) ___.","answer":"to go","vi":"Nhanh lên! Chúng tôi đang đợi để đi.","explanation":"\"wait + to V\" → to go."},{"q":"10. I don't appreciate (be) ___ treated like a second-class citizen.","answer":"being","vi":"Tôi không thích bị đối xử như công dân hạng hai.","explanation":"\"appreciate + V-ing\" → being (bị động: being treated)."}]},{"roman":"VII","navLabel":"Chia động từ 3","icon":"pen-ruler","title":"Chia đúng thì của động từ (đoạn văn)","instructions":"Đọc đoạn văn và chia đúng thì của động từ trong ngoặc cho mỗi chỗ trống.","type":"fill","instant":true,"passage":{"title":"Mountain climbing (đoạn văn)","html":"Last year, I <b>(1)</b> ___ (go) mountain climbing for the first time. It was exciting and terrifying at the same time. We <b>(2)</b> ___ (move) slowly and carefully, and it <b>(3)</b> ___ (take) three days to get to the top. When we climbed onto the summit, we <b>(4)</b> ___ (find) another group of climbers. They <b>(5)</b> ___ (arrive) several hours ahead of us. They <b>(6)</b> ___ (have) dinner and listening to Beethoven. We <b>(7)</b> ___ (laugh) and they <b>(8)</b> ___ (invite) us to join them. The climb <b>(9)</b> ___ (be), to say the least, an unforgettable experience.","vi":"Năm ngoái, tôi <b>(1)</b> ___ đã đi leo núi lần đầu tiên. Đó vừa là một trải nghiệm thú vị vừa đáng sợ. Chúng tôi <b>(2)</b> ___ di chuyển chậm rãi và cẩn thận, và <b>(3)</b> ___ phải mất ba ngày để lên đến đỉnh. Khi chúng tôi lên tới đỉnh, chúng tôi <b>(4)</b> ___ thấy một nhóm leo núi khác. Họ <b>(5)</b> ___ đã đến trước chúng tôi vài tiếng. Họ <b>(6)</b> ___ đang ăn tối và nghe nhạc Beethoven. Chúng tôi <b>(7)</b> ___ cười, và họ <b>(8)</b> ___ mời chúng tôi tham gia cùng. Nói một cách ngắn gọn, chuyến leo núi đó <b>(9)</b> ___ là một trải nghiệm khó quên."},"questions":[{"q":"1. Fill in the correct tense for blank number 1.","answer":"went","explanation":"Mốc thời gian quá khứ \"Last year\" → quá khứ đơn: went."},{"q":"2. Fill in the correct tense for blank number 2.","answer":"moved","explanation":"Hành động nối tiếp trong quá khứ → quá khứ đơn: moved."},{"q":"3. Fill in the correct tense for blank number 3.","answer":"took","explanation":"Quá khứ đơn diễn tả sự việc đã xảy ra → took."},{"q":"4. Fill in the correct tense for blank number 4.","answer":"found","explanation":"Hành động xảy ra sau khi leo lên đỉnh → quá khứ đơn: found."},{"q":"5. Fill in the correct tense for blank number 5.","answer":"arrived","explanation":"Hành động xảy ra trước hành động \"found\" (đã đến trước đó) → quá khứ đơn: arrived (có thể xem là quá khứ hoàn thành trong văn cảnh nhưng câu chuyện dùng quá khứ đơn xuyên suốt)."},{"q":"6. Fill in the correct tense for blank number 6.","answer":"were having","explanation":"Hành động đang diễn ra khi nhóm kia đến (song song với \"listening\") → quá khứ tiếp diễn: were having."},{"q":"7. Fill in the correct tense for blank number 7.","answer":"laughed","explanation":"Quá khứ đơn, hành động xảy ra một lần → laughed."},{"q":"8. Fill in the correct tense for blank number 8.","answer":"invited","explanation":"Quá khứ đơn → invited."},{"q":"9. Fill in the correct tense for blank number 9.","answer":"was","explanation":"Chủ ngữ số ít \"The climb\" + quá khứ đơn của \"be\" → was."}]},{"roman":"VIII","navLabel":"Sửa lỗi 1","icon":"wrench","title":"Tìm lỗi sai (A, B, C hoặc D)","instructions":"Tìm và chọn phần gạch chân có lỗi sai trong mỗi câu.","type":"mcq","instant":true,"questions":[{"q":"1. We’ve <u>listed</u> lots of <u>better</u> things <u>to do</u> instead of <u>watch</u> TV.","options":["listed","better","to do","watch"],"answer":3,"vis":["đã liệt kê","tốt hơn","để làm","xem (sai — sau \"instead of\" cần V-ing: watching)"],"explanation":"Sau giới từ \"instead of\" cần V-ing → watch phải sửa thành watching."},{"q":"2. The <u>clothing</u> of <u>one group</u> is quite <u>differently from</u> that <u>of other</u> groups.","options":["clothing","one group","differently from","of other"],"answer":2,"vis":["trang phục","một nhóm","khác biệt (sai — sau \"quite\" cần tính từ: different from)","của các nhóm khác"],"explanation":"Sau \"is quite\" cần tính từ, không phải trạng từ → differently from phải sửa thành different from."},{"q":"3. When you play <u>game online</u>, be <u>careful</u> <u>when</u> you make friends <u>to</u> strangers.","options":["game online","careful","when","to"],"answer":3,"vis":["chơi game trực tuyến","cẩn thận","khi","sai giới từ — cần \"with\": make friends with"],"explanation":"\"make friends with somebody\" = kết bạn với ai → to phải sửa thành with."},{"q":"4. She <u>goes</u> to <u>the</u> dance club <u>with</u> her friends every <u>evening Sunday</u>.","options":["goes","the","with","evening Sunday"],"answer":3,"vis":["đi (thường xuyên)","(mạo từ)","cùng với","sai trật tự — cần \"Sunday evening\""],"explanation":"Trật tự đúng là \"ngày + buổi\" → evening Sunday phải sửa thành Sunday evening."},{"q":"5. Han <u>lives</u> in <u>an</u> <u>cottage</u> house in Cuc Phuong <u>national</u> park.","options":["lives","an","cottage","national"],"answer":1,"vis":["sống","sai — \"cottage\" bắt đầu bằng phụ âm, cần \"a\"","nhà nhỏ, nhà tranh","quốc gia"],"explanation":"\"cottage\" bắt đầu bằng phụ âm /k/ → an phải sửa thành a."},{"q":"6. <u>Playing</u> team sports <u>gives</u> you <u>much</u> fun than <u>individual</u> sports.","options":["Playing","gives","much","individual"],"answer":2,"vis":["chơi","mang lại","sai — so sánh hơn cần \"more\"","cá nhân"],"explanation":"So sánh hơn với danh từ \"fun\" → much phải sửa thành more."},{"q":"7. They found the games more <u>difficulty</u> <u>to</u> win <u>than</u> they <u>had expected</u>.","options":["difficulty","to","than","had expected"],"answer":0,"vis":["sai — sau \"more\" cần tính từ: difficult","để","hơn","đã mong đợi"],"explanation":"\"more + tính từ\" → difficulty phải sửa thành difficult."},{"q":"8. <u>Wonderful</u> family <u>days</u> <u>out are</u> some <u>of most</u> special memories.","options":["Wonderful","days","out are","of most"],"answer":3,"vis":["tuyệt vời","những ngày","ra ngoài, là","sai — so sánh nhất cần \"the most\""],"explanation":"So sánh nhất \"some of the most\" → of most phải sửa thành of the most."},{"q":"9. Co Tu people love <u>to share</u> with guests <u>about</u> their <u>live</u> and <u>tradition</u>.","options":["to share","about","live","tradition"],"answer":2,"vis":["chia sẻ","về","sai — cần danh từ: life","truyền thống"],"explanation":"Cần danh từ song song với \"tradition\" → live phải sửa thành life."},{"q":"10. <u>Do you know</u> that an average person <u>check</u> Facebook <u>over 30</u> <u>hours a week</u>?","options":["Do you know","check","over 30","hours a week"],"answer":1,"vis":["bạn có biết","sai — chủ ngữ số ít \"a person\" cần chia \"checks\"","hơn 30","giờ mỗi tuần"],"explanation":"Chủ ngữ số ít \"an average person\" + hiện tại đơn → check phải sửa thành checks."},{"q":"11. <u>Most ethnic</u> groups <u>live in</u> rural areas, <u>growing rice</u> and practising <u>slash-and-burn farm</u>.","options":["Most ethnic","live in","growing rice","slash-and-burn farm"],"answer":3,"vis":["hầu hết các dân tộc","sống ở","trồng lúa","sai — cần V-ing song song: slash-and-burn farming"],"explanation":"Cấu trúc song song với \"growing\" → farm phải sửa thành farming."},{"q":"12. <u>The Muong</u> people are <u>the ethnic</u> minority who live <u>in the</u> mountainous regions <u>of Vietnam</u>.","options":["The Muong","the ethnic","in the","of Vietnam"],"answer":1,"vis":["người Mường","sai — cần mạo từ \"an\" (số ít, chưa xác định): an ethnic","ở","của Việt Nam"],"explanation":"\"are + an ethnic minority\" (số ít, chưa xác định trước đó) → the ethnic phải sửa thành an ethnic."},{"q":"13. We have <u>recently</u> visited <u>some of</u> the <u>remote</u> communities in the <u>north</u> highlands.","options":["recently","some of","remote","north"],"answer":3,"vis":["gần đây","một số trong số","xa xôi, hẻo lánh","sai — cần tính từ: northern"],"explanation":"Cần tính từ đứng trước danh từ \"highlands\" → north phải sửa thành northern."},{"q":"14. <u>Youth</u> Ngai women <u>did not</u> receive <u>the</u> inheritance after <u>their</u> parents died.","options":["Youth","did not","the","their"],"answer":0,"vis":["sai — cần tính từ: Young","đã không","(mạo từ)","của họ"],"explanation":"Cần tính từ đứng trước danh từ \"Ngai women\" → Youth phải sửa thành Young."},{"q":"15. <u>The</u> Ta Oi managed <u>preserving</u> their <u>proverbs</u>, folk songs, and <u>stories</u>.","options":["The","preserving","proverbs","stories"],"answer":1,"vis":["(mạo từ)","sai — \"manage\" đi với to-V: to preserve","tục ngữ","những câu chuyện"],"explanation":"\"manage to do something\" = xoay xở làm được gì → preserving phải sửa thành to preserve."}]},{"roman":"IX","navLabel":"Sửa lỗi 2","icon":"file-pen","title":"Tìm và sửa 5 lỗi sai trong đoạn văn","instructions":"Đọc đoạn văn. Mỗi câu có một lỗi sai. Gõ từ ĐÚNG vào ô trống.","type":"fill","instant":true,"passage":{"title":"Computer games (đoạn văn gốc – có lỗi)","html":"Children love to play computer games. Some people say that many of them are addicted to game. If you become addicting, all you can think about is computer games and you cannot spend a day without playing. Of course, playing games on the computer is great way to spending time and have fun. But there are also bad sides to it as well.<br><br>First of all, you do not get enough exercise because you do not have to move your body much when play games. Second, your eyesight becomes badly because your eyes are fixed on the computer screen for too long. This is why it is not hard to find children wearing glasses around these days. Third, you do not get to spend much time with your family because you are spending all of your time in front of the computer.<br><br>Playing computer games is not such a bad thing. But too much playing can cause problems. How much hours do you spend in front of the computer? Why not take this opportunity to cut down on computer games.","vi":"Trẻ em thích chơi trò chơi máy tính. Một số người nói rằng nhiều em bị nghiện trò chơi. Nếu bạn trở nên nghiện, tất cả những gì bạn có thể nghĩ đến là trò chơi máy tính và bạn không thể trải qua một ngày mà không chơi. Tất nhiên, chơi trò chơi trên máy tính là cách tuyệt vời để tiêu khiển thời gian và giải trí. Nhưng cũng có những mặt xấu của nó.<br><br>Trước hết, bạn không vận động đủ vì bạn không cần di chuyển cơ thể nhiều khi chơi trò chơi. Thứ hai, thị lực của bạn trở nên kém đi vì mắt bạn phải nhìn vào màn hình máy tính quá lâu. Đó là lý do tại sao ngày nay không khó để bắt gặp trẻ em đeo kính. Thứ ba, bạn không có nhiều thời gian dành cho gia đình vì bạn dành hết thời gian trước máy tính.<br><br>Chơi trò chơi máy tính không hẳn là một điều xấu. Nhưng chơi quá nhiều có thể gây ra vấn đề. Bạn dành bao nhiêu giờ trước máy tính? Sao không nhân cơ hội này để giảm bớt việc chơi game?"},"questions":[{"q":"1. If you become addicting, all you can think about is computer games…  →  Sửa: ___","answer":"addicted","explanation":"\"become + tính từ\" → addicting phải sửa thành addicted.","vi":"Nếu bạn trở nên nghiện, tất cả những gì bạn có thể nghĩ đến là trò chơi máy tính…"},{"q":"2. …playing games on the computer is great way to spending time and have fun.  →  Sửa: ___","answer":"spend","explanation":"Sau \"to\" (mục đích) cần V nguyên mẫu → spending phải sửa thành spend.","vi":"…chơi trò chơi trên máy tính là cách tuyệt vời để tiêu khiển thời gian và giải trí."},{"q":"3. …you do not have to move your body much when play games.  →  Sửa: ___","answer":"playing","explanation":"Sau liên từ \"when\" (dùng như giới từ ở đây, trước danh động từ) cần V-ing → play phải sửa thành playing.","vi":"…bạn không cần di chuyển cơ thể nhiều khi chơi trò chơi."},{"q":"4. Second, your eyesight becomes badly because your eyes are fixed on the computer screen for too long.  →  Sửa: ___","answer":"bad","explanation":"\"become + tính từ\" (không phải trạng từ) → badly phải sửa thành bad.","vi":"Thứ hai, thị lực của bạn trở nên kém đi vì mắt bạn phải nhìn vào màn hình máy tính quá lâu."},{"q":"5. How much hours do you spend in front of the computer?  →  Sửa: ___","answer":"many","explanation":"\"hours\" là danh từ đếm được số nhiều → much phải sửa thành many.","vi":"Bạn dành bao nhiêu giờ trước máy tính?"}]},{"roman":"X","navLabel":"Đọc hiểu 1","icon":"book-open","title":"Đọc hiểu – Ruou can","instructions":"Đọc đoạn văn và chọn đáp án đúng.","type":"mcq","instant":true,"passage":{"title":"Ruou can (tube wine)","html":"Ruou can, also known as tube wine in English, is a unique drink that can be found in the mountainous regions of Central Vietnam like Tay Nguyen. It’s made from rice and other herbs. The recipe differs in various ethnic minority groups depending on what is available in their surroundings. The ingredients are kept in a ceramic jar for a month. Using a thin bamboo straw, people drink ruou can directly from the jar. This drink is commonly served during a special celebration such as weddings, New Year festivals…. People often gather around the wine jar and drink together while singing and dancing. It’s considered an honour in many ethnic groups to be offered this kind of rice wine.","vi":"Rượu cần, còn được gọi là \"tube wine\" trong tiếng Anh, là một loại thức uống độc đáo có thể tìm thấy ở các vùng núi miền Trung Việt Nam như Tây Nguyên. Nó được làm từ gạo và các loại thảo mộc khác. Công thức khác nhau tùy theo từng dân tộc thiểu số, phụ thuộc vào những gì có sẵn xung quanh họ. Nguyên liệu được ủ trong một chum sành trong một tháng. Dùng một ống hút tre mỏng, người ta uống rượu cần trực tiếp từ chum. Thức uống này thường được phục vụ trong những dịp lễ đặc biệt như đám cưới, lễ hội năm mới… Mọi người thường tụ tập quanh chum rượu và cùng uống trong khi hát và nhảy múa. Được mời loại rượu gạo này được xem là một vinh dự ở nhiều dân tộc."},"questions":[{"q":"1. What does the writer call ruou can in the passage?","options":["Tube wine.","A kind of rice wine.","A and B are correct.","A and B are incorrect."],"answer":2,"explanation":"Bài đọc gọi rượu cần là \"tube wine\" và cũng ngầm hiểu là một loại rượu gạo (làm từ gạo) → cả A và B đều đúng.","vis":["rượu ống (đúng, cách gọi trong bài)","một loại rượu gạo (đúng, cũng được ngầm hiểu trong bài)","cả A và B đều đúng (đáp án đúng nhất)","cả A và B đều sai"]},{"q":"2. What are the ingredients of ruou can?","options":["Medical herbs.","Some kinds of rice.","Rice and some local plants.","Rice and woody plants."],"answer":2,"explanation":"Rượu cần được làm từ gạo và các loại thảo mộc (herbs) có sẵn tại địa phương → rice and some local plants.","vis":["thảo dược y học (sai — quá cụ thể, bài chỉ nói \"herbs\" chung chung)","một số loại gạo (thiếu, chưa đủ vì còn có thảo mộc)","gạo và một số loại cây địa phương (đúng)","gạo và cây thân gỗ (sai nghĩa, không có trong bài)"]},{"q":"3. Which of the following is TRUE about the recipe of ruou can?","options":["This kind of wine is made in one month.","The ingredients are kept in a jar made of metal.","The recipe of ruou can in every area is the same.","People have to buy ingredients from other regions to make ruou can."],"answer":0,"explanation":"Bài đọc nói nguyên liệu được ủ trong chum khoảng một tháng → câu A đúng.","vis":["loại rượu này được ủ trong một tháng (đúng)","nguyên liệu được giữ trong chum làm bằng kim loại (sai — bài nói chum sành/gốm)","công thức rượu cần ở mọi vùng đều giống nhau (sai — bài nói công thức khác nhau tùy vùng)","người ta phải mua nguyên liệu từ vùng khác (sai — bài nói dùng nguyên liệu sẵn có tại chỗ)"]},{"q":"4. According to the writer, when do mountainous residents drink ruou can?","options":["Before singing and dancing.","Every one month.","When they climb to a mountain.","When they celebrate special events."],"answer":3,"explanation":"Rượu cần được phục vụ trong những dịp lễ đặc biệt (weddings, New Year festivals) → khi họ ăn mừng các sự kiện đặc biệt.","vis":["trước khi hát và nhảy múa (sai, không phải mốc thời gian được nói đến)","mỗi một tháng (sai — nhầm với thời gian ủ rượu)","khi họ leo núi (sai, không có trong bài)","khi họ ăn mừng những dịp đặc biệt (đúng)"]},{"q":"5. Which of the following is NOT stated in the passage?","options":["People drink ruou can from the same jar.","Ruou can is sold around the country.","Ruou can is usually made in mountainous regions.","Being served ruou can is an honour."],"answer":1,"explanation":"Bài đọc không hề đề cập đến việc rượu cần được bán khắp cả nước → đây là thông tin KHÔNG được nêu.","vis":["mọi người uống rượu cần từ cùng một chum (có nêu trong bài)","rượu cần được bán khắp cả nước (KHÔNG được nêu trong bài — đáp án đúng)","rượu cần thường được làm ở vùng núi (có nêu trong bài)","được mời rượu cần là một vinh dự (có nêu trong bài)"]}]},{"roman":"XI","navLabel":"Đọc hiểu 2","icon":"book-open","title":"Đọc hiểu – Traditional markets","instructions":"Đọc đoạn văn và chọn đáp án đúng nhất A, B, C hoặc D.","type":"mcq","instant":true,"passage":{"title":"Traditional markets in Viet Nam","html":"In Viet Nam, a market is a trading place, but many markets are not only about buying and selling things. They reflect the life of the community. A traditional market is a social gathering point for people of all ages and it is a new and exciting experience for children, a trading place for local craftsmen, and a chance for young people to meet. People go to the traditional market not only to buy and sell things but also to eat, drink, play games and socialize.<br><br>For example, if you go to Sa Pa Market, in the highlands in the north of Viet Nam, you can see people wear their nicest clothes and spend all day long at the market. They buy things, play the flute, dance and sing. This is also a time to meet, make friends or look for lovers. That is why this kind of gathering is also called “love market”.<br><br>Some other countryside markets in the Mekong Delta are held on boats. Most of the goods are sold at a floating market. The most exciting time is in the early morning, when boats arrive loaded up with agricultural products.","vi":"Ở Việt Nam, chợ là nơi buôn bán, nhưng nhiều khu chợ không chỉ đơn thuần là mua bán. Chúng phản ánh đời sống của cộng đồng. Một khu chợ truyền thống là điểm tụ họp xã hội cho mọi lứa tuổi, là một trải nghiệm mới mẻ và thú vị đối với trẻ em, là nơi buôn bán cho những người thợ thủ công địa phương, và là cơ hội để các bạn trẻ gặp gỡ nhau. Người ta đến chợ truyền thống không chỉ để mua bán mà còn để ăn uống, chơi trò chơi và giao lưu.<br><br>Ví dụ, nếu bạn đến chợ Sa Pa, ở vùng cao phía bắc Việt Nam, bạn sẽ thấy mọi người mặc quần áo đẹp nhất và dành cả ngày ở chợ. Họ mua sắm, thổi sáo, nhảy múa và ca hát. Đây cũng là dịp để gặp gỡ, kết bạn hoặc tìm người yêu. Đó là lý do vì sao kiểu tụ họp này còn được gọi là \"chợ tình\".<br><br>Một số chợ vùng quê khác ở Đồng bằng sông Cửu Long được họp trên thuyền. Hầu hết hàng hóa được bán tại chợ nổi. Thời điểm nhộn nhịp nhất là vào sáng sớm, khi thuyền bè chở đầy nông sản cập bến."},"questions":[{"q":"1. In Viet Nam, all markets are_______","options":["only trading places","only about buying things","only about selling things","not only about buying and selling things"],"answer":3,"explanation":"Bài đọc nói chợ không chỉ là nơi mua bán mà còn phản ánh đời sống cộng đồng → not only about buying and selling things.","vis":["chỉ là nơi buôn bán (sai)","chỉ về việc mua đồ (sai)","chỉ về việc bán đồ (sai)","không chỉ về việc mua và bán (đúng)"]},{"q":"2. A traditional market is a social gathering point for ________","options":["young people","people of all ages","local craftsmen","children"],"answer":1,"explanation":"Bài đọc nói chợ truyền thống là điểm tụ họp cho mọi lứa tuổi → people of all ages.","vis":["người trẻ tuổi (chưa đủ, chỉ là một phần)","mọi lứa tuổi (đúng)","thợ thủ công địa phương (chưa đủ, chỉ là một phần)","trẻ em (chưa đủ, chỉ là một phần)"]},{"q":"3. What can people do at the traditional market?","options":["Sell and buy things only.","Buy and sell things, eat, drink and play games.","Buy things and eat.","Buy and sell things, eat, drink, play games and socialize."],"answer":3,"explanation":"Bài đọc liệt kê đầy đủ: mua bán, ăn uống, chơi trò chơi và giao lưu → đáp án D đầy đủ nhất.","vis":["chỉ mua và bán (thiếu)","mua bán, ăn uống và chơi trò chơi (thiếu, chưa đủ)","mua đồ và ăn uống (thiếu)","mua bán, ăn uống, chơi trò chơi và giao lưu (đúng, đầy đủ nhất)"]},{"q":"4. What do the ethnic people who go to Sa Pa Market do?","options":["They wear their nicest clothes, buy things, play the flute, dance and sing.","They ride on a horse and sing.","They drink a lot of wine and dance.","They buy the nicest clothes at the market and look for lovers."],"answer":0,"explanation":"Bài đọc mô tả: mặc quần áo đẹp, mua sắm, thổi sáo, nhảy múa và ca hát.","vis":["họ mặc quần áo đẹp nhất, mua sắm, thổi sáo, nhảy múa và ca hát (đúng)","họ cưỡi ngựa và hát (sai, không có trong bài)","họ uống nhiều rượu và nhảy múa (sai, không có trong bài)","họ mua quần áo đẹp nhất ở chợ và tìm người yêu (sai, chi tiết không chính xác)"]},{"q":"5. Some of the markets in the Mekong Delta are held _____ are called floating markets.","options":["along the roads","on the paddy fields","on boats","in the morning"],"answer":2,"explanation":"Bài đọc nói chợ ở Đồng bằng sông Cửu Long được họp trên thuyền → on boats, gọi là chợ nổi.","vis":["dọc theo đường (sai)","trên ruộng lúa (sai)","trên thuyền (đúng)","vào buổi sáng (sai, đây là thời điểm nhộn nhịp nhất chứ không phải nơi họp chợ)"]}]},{"roman":"XII","navLabel":"Đọc hiểu 3","icon":"comments","title":"Đọc hiểu – Mary and Hoa's conversation","instructions":"Đọc đoạn hội thoại và trả lời các câu hỏi.","type":"sentence","instant":true,"passage":{"title":"Mary and Hoa's conversation","html":"Mary: Hi, Hoa.<br>Hoa: Hi, Mary.<br>Mary: Where did you go last Sunday, Hoa?<br>Hoa: I went to Sa Pa with my family.<br>Mary: Really? Where is it?<br>Hoa: It’s in Lao Cai Province, in the north of Viet Nam.<br>Mary: How did you go there?<br>Hoa: We went by car. It took us only three hours to get there. We went by the new road from Ha Noi to Lao Cai. It’s really a good road.<br>Mary: What did you do there?<br>Hoa: We visited the villages where the minority people live, the beautiful scenery there, and at last we visited Sa Pa Market.<br>Mary: What is the market like?<br>Hoa: Oh, it is an open-air market. Local people in colourful clothing are smiling as they sell their local products. The goods there are diverse.<br>Mary: That sounds really interesting.<br>Hoa: You can also buy a nice costume of the ethnic group.<br>Mary: I’d like to go there one day.","vi":"Mary: Chào Hoa.<br>Hoa: Chào Mary.<br>Mary: Chủ nhật vừa rồi bạn đi đâu vậy, Hoa?<br>Hoa: Mình đã đi Sa Pa cùng gia đình.<br>Mary: Thật à? Nó ở đâu vậy?<br>Hoa: Nó ở tỉnh Lào Cai, phía bắc Việt Nam.<br>Mary: Bạn đi bằng cách nào?<br>Hoa: Bọn mình đi bằng ô tô. Chỉ mất ba tiếng để đến nơi. Bọn mình đi theo con đường mới từ Hà Nội đến Lào Cai. Đường rất đẹp.<br>Mary: Bạn đã làm gì ở đó?<br>Hoa: Bọn mình đã thăm các bản làng nơi người dân tộc thiểu số sinh sống, ngắm cảnh đẹp ở đó, và cuối cùng ghé thăm chợ Sa Pa.<br>Mary: Chợ đó như thế nào?<br>Hoa: À, đó là một khu chợ ngoài trời. Người dân địa phương mặc trang phục đầy màu sắc, tươi cười khi bán các sản phẩm địa phương. Hàng hóa ở đó rất đa dạng.<br>Mary: Nghe thú vị thật đấy.<br>Hoa: Bạn cũng có thể mua một bộ trang phục đẹp của dân tộc đó.<br>Mary: Mình cũng muốn đến đó một ngày nào đó."},"questions":[{"q":"1. Where did Hoa go last Sunday?","answer":"She went to Sa Pa.","accepted":["she went to sa pa"],"vi":"Cô ấy đã đi Sa Pa."},{"q":"2. How long does it take Hoa to go to Lao Cai by car?","answer":"It took her only three hours.","accepted":["it took her only three hours"],"vi":"Chỉ mất ba tiếng."},{"q":"3. What did Hoa do in Sa Pa?","answer":"She visited the villages where the minority people live, the beautiful scenery there, and at last she visited Sa Pa Market.","accepted":["she visited the villages where the minority people live the beautiful scenery there and at last she visited sa pa market"],"vi":"Cô ấy thăm các bản làng của người dân tộc thiểu số, ngắm cảnh đẹp, và cuối cùng ghé chợ Sa Pa."},{"q":"4. What can people buy at Sa Pa Market?","answer":"People can buy local products and nice costumes of the ethnic group.","accepted":["people can buy local products and nice costumes of the ethnic group"],"vi":"Người ta có thể mua các sản phẩm địa phương và trang phục đẹp của dân tộc đó."},{"q":"5. When would Mary like to go there?","answer":"She would like to go there one day.","accepted":["she would like to go there one day"],"vi":"Cô ấy muốn đến đó một ngày nào đó."}]},{"roman":"XIII","navLabel":"Đặt câu hỏi","icon":"link","title":"Đặt câu hỏi cho phần được gạch chân","instructions":"Đặt câu hỏi cho phần được gạch chân trong mỗi câu.","type":"sentence","instant":true,"questions":[{"q":"1. I went to the cinema with my cousins. <span class=\"text-slate-400\">(gạch chân: \"my cousins\")</span>","answer":"Who did you go to the cinema with?","accepted":["who did you go to the cinema with"],"vi":"Tôi đã đi xem phim cùng với anh chị em họ của tôi."},{"q":"2. I stayed in New Zealand for six months. <span class=\"text-slate-400\">(gạch chân: \"for six months\")</span>","answer":"How long did you stay in New Zealand?","accepted":["how long did you stay in new zealand"],"vi":"Tôi đã ở New Zealand trong sáu tháng."},{"q":"3. She called the firemen because her cat stuck in a tree. <span class=\"text-slate-400\">(gạch chân: \"because her cat stuck in a tree\")</span>","answer":"Why did she call the firemen?","accepted":["why did she call the firemen"],"vi":"Cô ấy gọi lính cứu hỏa vì con mèo của cô ấy bị mắc kẹt trên cây."},{"q":"4. I bought two kilos of oranges. <span class=\"text-slate-400\">(gạch chân: \"two\")</span>","answer":"How many kilos of oranges did you buy?","accepted":["how many kilos of oranges did you buy"],"vi":"Tôi đã mua hai cân cam."},{"q":"5. John wrote about his grandparents. <span class=\"text-slate-400\">(gạch chân: \"his grandparents\")</span>","answer":"Who did John write about?","accepted":["who did john write about"],"vi":"John đã viết về ông bà của cậu ấy."},{"q":"6. I watched a very good film on TV last night. <span class=\"text-slate-400\">(gạch chân: \"watched a very good film on TV\")</span>","answer":"What did you do last night?","accepted":["what did you do last night"],"vi":"Tối qua tôi đã xem một bộ phim rất hay trên TV."},{"q":"7. She made some coffee for her mother. <span class=\"text-slate-400\">(gạch chân: \"some coffee\")</span>","answer":"What did she make for her mother?","accepted":["what did she make for her mother"],"vi":"Cô ấy đã pha ít cà phê cho mẹ mình."},{"q":"8. Susan gave the money to her brother. <span class=\"text-slate-400\">(gạch chân: \"her brother\")</span>","answer":"Who did Susan give the money to?","accepted":["who did susan give the money to"],"vi":"Susan đã đưa tiền cho anh trai của cô ấy."},{"q":"9. We went to school by bus. <span class=\"text-slate-400\">(gạch chân: \"by bus\")</span>","answer":"How did you go to school?","accepted":["how did you go to school"],"vi":"Chúng tôi đã đến trường bằng xe buýt."},{"q":"10. I was tired yesterday evening because I worked very hard. <span class=\"text-slate-400\">(gạch chân: \"because I worked very hard\")</span>","answer":"Why were you tired yesterday evening?","accepted":["why were you tired yesterday evening"],"vi":"Tôi mệt vào tối hôm qua vì tôi đã làm việc rất vất vả."}]},{"roman":"XIV","navLabel":"Viết lại câu","icon":"sitemap","title":"Viết lại câu","instructions":"Viết lại câu thứ hai sao cho nghĩa không đổi so với câu thứ nhất.","type":"sentence","instant":true,"questions":[{"q":"1.","original":"Your village is so beautiful!","starter":"What","answer":"a beautiful village!","accepted":["a beautiful village!"],"vi":"Ngôi làng của bạn thật đẹp!"},{"q":"2.","original":"How long is it since you built this stilt house?","starter":"When","answer":"did you build this stilt house?","accepted":["did you build this stilt house"],"vi":"Bạn đã xây ngôi nhà sàn này khi nào?"},{"q":"3.","original":"Living in a big city is more convenient than living in a village.","starter":"It's","answer":"more convenient to live in a big city than to live in a village.","accepted":["more convenient to live in a big city than to live in a village"],"vi":"Sống ở thành phố lớn tiện lợi hơn sống ở làng quê."},{"q":"4.","original":"Where does he live?","starter":"What","answer":"is his address?","accepted":["is his address"],"vi":"Địa chỉ của anh ấy là gì?"},{"q":"5.","original":"Although the villagers are quite poor, they live a happy and healthy way.","starter":"In spite of","answer":"being poor, the villagers live a happy and healthy way.","accepted":["being poor the villagers live a happy and healthy way","their poverty, the villagers live a happy and healthy way"],"vi":"Mặc dù nghèo, dân làng vẫn sống một cuộc sống hạnh phúc và khỏe mạnh."},{"q":"6.","original":"What did the local people say?","starter":"Could you tell me","answer":"what the local people said?","accepted":["what the local people said"],"vi":"Bạn có thể cho tôi biết người dân địa phương đã nói gì không?"},{"q":"7.","original":"Romantic films interest me more than war films.","starter":"I find","answer":"romantic films more interesting than war films.","accepted":["romantic films more interesting than war films"],"vi":"Tôi thấy phim tình cảm thú vị hơn phim chiến tranh."},{"q":"8.","original":"A lot of people take the train from Oxford to London every day.","starter":"A lot of people travel","answer":"from Oxford to London by train every day.","accepted":["from oxford to london by train every day"],"vi":"Nhiều người đi từ Oxford đến London bằng tàu hỏa mỗi ngày."},{"q":"9.","original":"How about asking the local people for help?","starter":"Why","answer":"don't we ask the local people for help?","accepted":["don't we ask the local people for help","not ask the local people for help?"],"vi":"Sao chúng ta không nhờ người dân địa phương giúp đỡ nhỉ?"},{"q":"10.","original":"Is there an ancestral altar in the La Chi's largest apartment?","starter":"Does","answer":"the La Chi's largest apartment have an ancestral altar?","accepted":["the la chi's largest apartment have an ancestral altar"],"vi":"Căn nhà lớn nhất của người La Chí có bàn thờ tổ tiên không?"}]},{"roman":"XV","navLabel":"Sắp xếp câu","icon":"puzzle-piece","title":"Sắp xếp từ thành câu hoàn chỉnh","instructions":"Sắp xếp các từ/cụm từ gợi ý   <div class="theory-card bg-white rounded-xl p-4 mb-3" style="border-left-color:#f59e0b;box-shadow:0 2px 8px rgba(0,0,0,.05)">
    <h4 class="font-extrabold text-amber-600 mb-2"><i class="fa-solid fa-circle-info mr-2 text-amber-500"></i>I. WH- QUESTION WORDS <span class="text-sm font-semibold text-slate-500">(Các từ để hỏi)</span></h4>
    <p class="text-sm text-slate-600 mb-2">Câu hỏi Wh- là câu hỏi mà câu trả lời không thể chỉ là yes/no, mà phải trả lời đúng nội dung mà từ để hỏi yêu cầu.</p>
    <div class="grid sm:grid-cols-2 gap-2 text-sm text-slate-700 mb-3">

      <div class="bg-amber-50 rounded-lg p-2 border border-amber-200"><b>What</b> (cái gì) — hỏi về sự vật, sự việc<br><i>What is your favourite programme?</i></div>
      <div class="bg-amber-50 rounded-lg p-2 border border-amber-200"><b>When</b> (khi nào) — hỏi về thời gian<br><i>When does the film start?</i></div>
      <div class="bg-amber-50 rounded-lg p-2 border border-amber-200"><b>Where</b> (ở đâu) — hỏi về địa điểm<br><i>Where is my book?</i></div>
      <div class="bg-amber-50 rounded-lg p-2 border border-amber-200"><b>Why</b> (tại sao) — hỏi về lý do<br><i>Why do you like this programme?</i></div>
      <div class="bg-amber-50 rounded-lg p-2 border border-amber-200"><b>How</b> (như thế nào) — hỏi về cách thức, chất lượng<br><i>How is the game show?</i></div>
    </div>
    <div class="bg-violet-50 rounded-xl p-3 text-sm text-violet-800 mb-3">
      <b>"How" kết hợp với tính từ:</b>
      <ul class="mt-1 space-y-1 list-disc pl-5">
        <li><b>How long</b> (bao lâu, dài bao nhiêu) — <i>How long does this film last?</i></li>
        <li><b>How much/many</b> (bao nhiêu) — <i>How many hours a day do you watch TV?</i></li>
        <li><b>How often</b> (có thường xuyên không) — <i>How often do you watch the documentary?</i></li>
      </ul>
    </div>
    <div class="space-y-2 text-sm text-slate-700">
      <div class="bg-white border border-amber-200 rounded-lg p-3"><b>Từ hỏi làm chủ ngữ:</b> Wh + V + …?<br><i>Who holds this event?</i> → <i>Mr. Tom holds this event.</i></div>
      <div class="bg-white border border-amber-200 rounded-lg p-3"><b>Từ hỏi không làm chủ ngữ:</b> Wh- + trợ động từ + S + V…?<br><i>When do you go to the movie theatre?</i> → <i>I go at about 8 pm.</i></div>

    <p class="text-sm text-slate-600 mb-2">Mạo từ đứng trước danh từ, cho biết danh từ đó xác định hay không xác định.</p>
    <ul class="text-sm text-slate-700 space-y-2 list-disc pl-5 mb-3">
      <li><b>A</b> đứng trước danh từ số ít bắt đầu bằng PHỤ ÂM (âm, không phải chữ cái).<br><i>a game, a boat, a university</i> <span class="text-slate-400">(university bắt đầu bằng âm /j/)</span></li>
      <li><b>An</b> đứng trước danh từ số ít bắt đầu bằng NGUYÊN ÂM hoặc âm câm.<br><i>an egg, an apple, an hour, an honour</i> <span class="text-slate-400">(h câm)</span></li>
      <li><b>The</b> dùng khi vật/nhóm vật là duy nhất, đã được nhắc đến trước đó, hoặc được xác định rõ bằng cụm từ/mệnh đề.<br><i>The sun; the girl in uniform; the mechanic that I met.</i></li>
      <li><b>The</b> + so sánh cực cấp / first, second, only…<br><i>The first day; the best time; the only way.</i></li>
      <li><b>The</b> + tính từ tượng trưng cho một nhóm người.<br><i>The old (người già); the rich and the poor.</i></li>
      <li><b>The</b> trước tên riêng chỉ biển, sông, quần đảo, dãy núi, sa mạc, tên nước số nhiều.<br><i>The Pacific; the Netherlands; the Alps.</i></li>
      <li>KHÔNG dùng "the" trước tên quốc gia (số ít), châu lục, tên núi/hồ đơn, sau tính từ sở hữu, trước bữa ăn, trước phương tiện đi lại (khi không nhấn mạnh mục đích cụ thể).<br><i>Europe; my friend (không nói "my the friend"); have lunch; go to school by bicycle.</i></li>
    </ul>
  </div>

  <div class="bg-gradient-to-r from-rose-50 to-pink-50 border border-rose-200 rounded-2xl p-4 mb-3">

      <li>❌ Dùng <b>What</b> khi câu trả lời chỉ nơi chốn → phải dùng <b>Where</b>.</li>
      <li>❌ Nhầm <b>a</b>/<b>an</b> theo CHỮ CÁI thay vì theo ÂM đầu tiên: <s>a hour</s> → <b>an hour</b>.</li>
      <li>❌ Thêm "the" trước tên quốc gia số ít: <s>the Vietnam</s> → <b>Vietnam</b>.</li>
      <li>❌ Quên "the" trước so sánh nhất: <s>largest</s> → <b>the largest</b>.</li>
    </ul>

  <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-4">

    <ul class="space-y-1 text-sm text-amber-900">
      <li>🔑 Câu trả lời chỉ NGƯỜI → Who; chỉ VẬT/VIỆC → What; chỉ NƠI → Where; chỉ LÝ DO → Why; chỉ TẦN SUẤT → How often.</li>
      <li>🔑 A/An dựa vào ÂM ĐỌC, không phải chữ cái đầu tiên.</li>
      <li>🔑 The dùng khi cả người nói và người nghe đều biết chính xác đang nói về vật/người nào.</li>
    </ul>
  </div>

function normalize(str){
  return (str||'').trim().toLowerCase()
    .replace(/[‘’]/g,"'")
    .replace(/["“”]/g,'')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ');
}
function widthFor(ref){ const l=(ref||'').length; return l<7?'w-32':l<16?'w-40':'w-full'; }

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)){ alert('Trình duyệt của bạn không hỗ trợ phát âm tự động. Hãy thử Chrome, Edge hoặc Safari.'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>btn.classList.remove('speaking'); u.onerror=()=>btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function renderBank(bank, idx, clickable){
  if(!bank || !bank.length) return '';
  const hint = clickable ? ' <span class="normal-case font-normal text-slate-400">(bấm để điền)</span>' : '';
  return `<div class="mb-4"><p class="text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide"><i class="fa-solid fa-list-ul mr-1"></i>Liên từ cho sẵn${hint}</p>
    <div class="grid grid-cols-2 sm:grid-cols-5 border-2 border-slate-800 rounded-lg overflow-hidden text-sm font-bold text-slate-800">
      ${bank.map((w,bi)=>clickable
        ? `<div class="bank-chip px-3 py-2 text-center border border-slate-300 bg-white" id="bankchip_${idx}_${bi}" onclick="fillFromBank(${idx},${bi})">${w}</div>`
        : `<div class="px-3 py-2 text-center border border-slate-300 bg-white">${w}</div>`
      ).join('')}
    </div>
  </div>`;
}
function fillFromBank(idx, bi){
  const chip = document.getElementById(`bankchip_${idx}_${bi}`);
  if(!chip || chip.classList.contains('used')) return;
  const word = DATA.sections[idx].bank[bi];
  const inputs = Array.from(document.querySelectorAll(`#tab-${idx} input.answer-input[id^="inp_${idx}_"]`));
  const target = inputs.find(inp => inp.value.trim()==='');
  if(!target) return;
  target.value = word;
  target.dataset.bankChip = bi;
  chip.classList.add('used');
}
function releaseBankChipIfChanged(idx,i){
  const inp=document.getElementById(`inp_${idx}_${i}`);
  if(!inp || inp.dataset.bankChip===undefined) return;
  const bi=inp.dataset.bankChip;
  delete inp.dataset.bankChip;
  const chip=document.getElementById(`bankchip_${idx}_${bi}`);
  if(chip) chip.classList.remove('used');
}

function renderSection(s, idx){
  let inner = `<h2 class="text-xl md:text-2xl font-extrabold text-pink-700 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'circle-check'} text-amber-400"></i> ${s.roman}. ${s.title}</h2>`;
  if(s.instructions) inner += `<p class="text-sm text-slate-500 mb-3 italic">${s.instructions}</p>`;
  inner += renderPassage(s.passage, idx);
  inner += renderDict(s.dict, idx);
  inner += renderBank(s.bank, idx, s.type==='fill');

  inner += `<div class="space-y-4">`;
  s.questions.forEach((q,i)=>{
    inner += `<div class="task-card bg-white rounded-2xl shadow-md p-4" id="qblock_${idx}_${i}">`;
    if(q.image) inner += `<div class="mb-3">${q.image}</div>`;
    inner += `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${q.q}</p>`;
    if(s.type==='mcq'){
      inner += `<div class="grid sm:grid-cols-2 gap-2">`;

        const cleanWord = opt.replace(/<[^>]+>/g,'');
        const wordBlock = (ipa || optVi)
          ? `<span class="flex flex-col leading-tight"><span>${opt}</span>${ipa?`<span class="text-[10px] text-slate-400 font-normal mcq-detail-hidden">${ipa}</span>`:''}${optVi?`<span class="text-[10px] text-emerald-500 font-normal italic mcq-detail-hidden">${optVi}</span>`:''}</span>
             <button type="button" data-w="${cleanWord}" onclick="event.stopPropagation();event.preventDefault();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-pink-100 text-pink-700 hover:bg-pink-200 hover:scale-110 transition flex items-center justify-center ml-auto shrink-0 mcq-detail-hidden" title="Nghe phát âm" aria-label="Nghe phát âm ${cleanWord}"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`

        inner += `<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="opt_${idx}_${i}_${j}" onclick="selectMcq(${idx},${i},${j})">

      const famBlock = q.family ? `<div class="wordfam-box mt-2">${q.family.map(f=>`<div>• ${f}</div>`).join('')}</div>` : '';
      inner += `<div class="flex items-center gap-2 flex-wrap">`;

      const bankAttr = s.bank ? ` oninput="releaseBankChipIfChanged(${idx},${i})"` : '';
      inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input ${w} px-3 py-1.5 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false"${bankAttr}></div>${famBlock}`;
    } else if(s.type==='sentence'){

      const origBlock = q.original ? `<p class="text-slate-700 text-sm mb-2">${q.original}</p>` : '';
      if(q.starter){
        inner += `${origBlock}
        <div class="flex items-center gap-3 w-full flex-wrap">
          <span class="text-slate-800 font-extrabold text-base whitespace-nowrap">${q.starter}</span>
          <input type="text" id="inp_${idx}_${i}" class="answer-input flex-1 min-w-[180px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false"${instantAttr}>

        <input type="hidden" id="inp_${idx}_${i}" value="">`;
    }
    inner += `<div class="explanation-box mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm text-blue-800" id="fb_${idx}_${i}"></div>`;
    inner += `</div>`;
  });
  inner += `</div>`;

  inner += `<div class="flex flex-wrap gap-2 mt-5">
    <button onclick="checkSection(${idx})" class="bg-gradient-to-r from-orange-500 to-pink-600 text-white font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>
    <button onclick="revealSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-eye mr-1"></i>Xem đáp án</button>
    <button onclick="resetSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-rotate-left mr-1"></i>Làm lại</button>
    <span id="score_${idx}" class="hidden ml-auto self-center font-extrabold text-emerald-600 text-sm score-badge"></span>
  </div>`;

  return `<section id="tab-${idx}" class="section-page space-y-4">${inner}</section>`;
}
