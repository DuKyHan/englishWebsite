ve to (bắt buộc).","vis":["phải (đúng, chủ ngữ \"we\")","đang có (sai nghĩa)","phải (sai chủ ngữ số ít)","sai ngữ pháp"]},{"q":"4. In Viet Nam, you ___ use only the first name to address people older than you.","options":["should","must","shouldn't","have to"],"answer":2,"vi":"Ở Việt Nam, bạn không nên chỉ dùng tên riêng để gọi người lớn tuổi hơn.","explanation":"Ý cấm đoán, khuyên không nên làm → shouldn't.","vis":["nên (sai, cần cấm đoán mạnh hơn)","phải (sai nghĩa)","không nên (đúng)","phải (sai nghĩa)"]},{"q":"5. At the Mid-Autumn Festival, kids can sing, dance, and enjoy moon-cakes. ___, every child likes it very much.","options":["However","Moreover","Because","Therefore"],"answer":3,"vi":"Vào Tết Trung Thu, trẻ em có thể hát, múa và thưởng thức bánh trung thu. Vì vậy, đứa trẻ nào cũng rất thích ngày này.","explanation":"Quan hệ nhân quả → Therefore.","vis":["tuy nhiên (sai, không phải ý tương phản)","hơn nữa (sai)","bởi vì (sai, không nối được 2 câu)","vì vậy (đúng)"]},{"q":"6. In 2010, Ha Noi ___ its 1000th anniversary.","options":["celebrated","commemorated","worshipped","remembered"],"answer":0,"vi":"Năm 2010, Hà Nội đã kỷ niệm 1000 năm thành lập.","explanation":"\"celebrate an anniversary\" = kỷ niệm một dịp lễ.","vis":["đã kỷ niệm (đúng)","đã tưởng niệm (sai collocation)","đã thờ cúng (sai nghĩa)","đã nhớ (sai nghĩa)"]},{"q":"7. Tet is an occasion for family ___ in Viet Nam.","options":["visitings","meeting","reunions","seeings"],"answer":2,"vi":"Tết là dịp để gia đình đoàn tụ ở Việt Nam.","explanation":"\"family reunion\" = sự đoàn tụ gia đình (danh từ).","vis":["sai, không tồn tại dạng này","cuộc gặp (sai từ)","sự đoàn tụ (đúng)","sai, không tồn tại"]},{"q":"8. ___ spring comes, many Vietnamese villages prepare for a new festival season.","options":["While","When","Nevertheless","However"],"answer":1,"vi":"Khi mùa xuân đến, nhiều làng quê Việt Nam chuẩn bị cho mùa lễ hội mới.","explanation":"Mốc thời gian → When.","vis":["trong khi (sai, không hợp mốc thời gian)","khi (đúng)","tuy nhiên (sai)","tuy nhiên (sai)"]},{"q":"9. The flight ___ at 6.10 has been delayed.","options":["leave","which leaves","leaving","B&C"],"answer":3,"vi":"Chuyến bay khởi hành lúc 6h10 đã bị hoãn.","explanation":"Mệnh đề quan hệ rút gọn \"which leaves\" = \"leaving\" đều đúng → B&C.","vis":["rời đi (sai chia)","mà khởi hành (đúng, mệnh đề quan hệ)","đang khởi hành (đúng, dạng rút gọn)","cả B và C đều đúng (đúng)"]},{"q":"10. This is the first time she ___ rice paddies.","options":["will see","sees","has seen","saw"],"answer":2,"vi":"Đây là lần đầu tiên cô ấy thấy ruộng lúa.","explanation":"\"This is the first time\" + hiện tại hoàn thành → has seen.","vis":["sẽ thấy (sai thì)","thấy (sai thì)","đã thấy (đúng, \"first time\" + hiện tại hoàn thành)","đã thấy (sai thì)"]},{"q":"11. Would you mind ___ I borrowed your dictionary?","options":["if","when","that","Ø"],"answer":0,"vi":"Bạn có phiền nếu tôi mượn từ điển của bạn không?","explanation":"\"Would you mind if + S + V (quá khứ)?\" → if.","vis":["nếu (đúng, \"would you mind if\")","khi (sai)","rằng (sai)","không có gì (sai)"]},{"q":"12. We ___ lots of photos on vacation last summer.","options":["had","took","did","made"],"answer":1,"vi":"Chúng tôi đã chụp rất nhiều ảnh trong kỳ nghỉ hè năm ngoái.","explanation":"\"take photos\" = chụp ảnh → took.","vis":["có (sai nghĩa)","đã chụp (đúng, \"take photos\")","đã làm (sai nghĩa)","đã làm (sai nghĩa)"]},{"q":"13. The animal ___ in the forest fire was a wild pig.","options":["hurt","hurted","hurts","hurting"],"answer":0,"vi":"Con vật bị thương trong đám cháy rừng là một con lợn rừng.","explanation":"Mệnh đề rút gọn bị động (P2) bổ nghĩa \"the animal\" → hurt (P2 bất quy tắc).","vis":["bị thương (đúng, quá khứ phân từ bất quy tắc)","sai, không tồn tại","bị thương (sai chia)","đang bị thương (sai)"]},{"q":"14. Would you mind ___ the window?","options":["to close","closing","about closing","closed"],"answer":1,"vi":"Bạn có phiền đóng cửa sổ giúp mình không?","explanation":"\"mind\" + V-ing → closing.","vis":["đóng (sai cấu trúc, \"mind\" + V-ing)","đóng (đúng)","sai cụm từ","đã đóng (sai)"]},{"q":"15. Welcome ___ Springfield!","options":["at","to","in","for"],"answer":1,"vi":"Chào mừng đến với Springfield!","explanation":"\"Welcome to\" = chào mừng đến với.","vis":["tại (sai giới từ)","đến (đúng, \"welcome to\")","trong (sai giới từ)","cho (sai giới từ)"]},{"q":"16. Accommodation in London ___ very expensive.","options":["is","are","has","have"],"answer":0,"vi":"Chỗ ở tại London rất đắt đỏ.","explanation":"\"accommodation\" là danh từ không đếm được, số ít → is.","vis":["là (đúng, \"accommodation\" không đếm được số ít)","là (sai số)","có (sai nghĩa)","có (sai nghĩa)"]},{"q":"17. The road ___ down to the sea is very rough.","options":["goes","going","to go","gone"],"answer":0,"vi":"Con đường dẫn xuống biển rất gồ ghề.","explanation":"Động từ chính của câu, chủ ngữ số ít \"the road\" → goes.","vis":["dẫn đến (đúng, động từ chính số ít)","đang dẫn (sai)","để đi (sai)","đã đi (sai)"]},{"q":"18. ___ is a large hole in the side of a mountain or under the ground.","options":["Waterfall","Cave","Bay","Lake"],"answer":1,"vi":"Hang động là một lỗ hổng lớn trong sườn núi hoặc dưới lòng đất.","explanation":"Định nghĩa khớp với \"cave\" (hang động).","vis":["thác nước (sai nghĩa)","hang động (đúng)","vịnh (sai nghĩa)","hồ (sai nghĩa)"]},{"q":"19. The vase ___ on the shelf is very beautiful.","options":["stands","standing","is standing","stood"],"answer":0,"vi":"Chiếc bình đứng trên kệ rất đẹp.","explanation":"Động từ chính, chủ ngữ số ít \"the vase\" → stands.","vis":["đứng (đúng, động từ chính số ít)","đang đứng (sai)","đang đứng (sai thì ở đây)","đã đứng (sai thì)"]},{"q":"20. Do you mind if I ___ your atlas for a minute?","options":["borrow","will borrow","am going to borrow","borrowed"],"answer":0,"vi":"Bạn có phiền nếu tôi mượn tập bản đồ của bạn một lát không?","explanation":"\"Do you mind if + S + V (hiện tại)?\" → borrow.","vis":["mượn (đúng, \"do you mind if\" + hiện tại)","sẽ mượn (sai thì)","sắp mượn (sai thì)","đã mượn (sai thì)"]},{"q":"21. The Christian Festival of Easter celebrates the return of Christ from the dead, ___the festival is actually named after the goddess of the sun.","options":["if","but","however","moreover"],"answer":1,"vi":"Lễ Phục Sinh của Kitô giáo kỷ niệm sự trở lại từ cõi chết của Chúa, nhưng lễ hội này thực ra được đặt tên theo nữ thần mặt trời.","explanation":"Ý tương phản, nối 2 mệnh đề trong 1 câu → but.","vis":["nếu (sai nghĩa)","nhưng (đúng, ý tương phản trong 1 câu)","tuy nhiên (sai, cần liên từ nối mệnh đề)","hơn nữa (sai)"]},{"q":"22. After a long and exhausting journey, they arrived home___________.","options":["finally","by the end","at the end","at last"],"answer":3,"vi":"Sau một chuyến đi dài và mệt mỏi, cuối cùng họ cũng về đến nhà.","explanation":"\"at last\" = cuối cùng (phù hợp cuối câu).","vis":["cuối cùng (sai vị trí)","đến cuối (sai cụm từ)","vào cuối (sai cụm từ)","cuối cùng (đúng)"]},{"q":"23. I couldn't hear what he said ________ he was muttering under his breath.","options":["because","Although","in spite of","if"],"answer":0,"vi":"Tôi không thể nghe được anh ấy nói gì vì anh ấy đang lẩm bẩm.","explanation":"Nêu lý do, theo sau là mệnh đề → because.","vis":["bởi vì (đúng, nêu lý do)","mặc dù (sai, không hợp cấu trúc câu)","mặc dù (sai, theo sau là danh từ)","nếu (sai nghĩa)"]},{"q":"24. Children need a caring environment to develop_________ mentally_________ physically.","options":["and - and","both – and","the – the","in - and"],"answer":1,"vi":"Trẻ em cần một môi trường quan tâm để phát triển cả về tinh thần lẫn thể chất.","explanation":"\"both...and...\" = cả...và... .","vis":["sai cấu trúc","cả...và... (đúng)","sai cấu trúc","sai cấu trúc"]},{"q":"25. We do not have many carnivals in Viet Nam; ___________We have many special traditional festivals.","options":["moreover","while","nevertheless","although"],"answer":2,"vi":"Chúng ta không có nhiều lễ hội hóa trang ở Việt Nam; tuy nhiên chúng ta có nhiều lễ hội truyền thống đặc biệt.","explanation":"Ý tương phản sau dấu chấm phẩy → nevertheless.","vis":["hơn nữa (sai)","trong khi (sai, không hợp sau dấu chấm phẩy đối lập)","tuy nhiên (đúng)","mặc dù (sai, cần liên từ phụ thuộc)"]},{"q":"26. I was promised a luxury weekend by my husband _________, I am not satisfied.","options":["Despite","Because","Although","However"],"answer":3,"vi":"Tôi được chồng hứa cho một kỳ cuối tuần sang trọng. Tuy nhiên, tôi vẫn không hài lòng.","explanation":"Trạng từ liên kết đứng đầu câu mới, có dấu phẩy theo sau → However.","vis":["mặc dù (sai, theo sau danh từ)","bởi vì (sai)","mặc dù (sai, cần liên từ phụ thuộc)","tuy nhiên (đúng)"]},{"q":"27. _________ you study harder, you won't be able to pass the examination.","options":["Unless","Because","If","Without"],"answer":0,"vi":"Trừ khi bạn học chăm chỉ hơn, bạn sẽ không thể vượt qua kỳ thi.","explanation":"\"Unless\" = \"if...not\" → trừ khi.","vis":["trừ khi (đúng)","bởi vì (sai nghĩa)","nếu (sai, ý nghĩa ngược lại yêu cầu)","không có (sai từ loại)"]},{"q":"28. My sister has been living in Da Lat for 2 years,_________, she has never been to Than Tho Lake.","options":["however","although","If","because"],"answer":0,"vi":"Chị tôi đã sống ở Đà Lạt được 2 năm, tuy nhiên chị ấy chưa từng đến Hồ Than Thở.","explanation":"Ý tương phản giữa 2 mệnh đề độc lập, có dấu phẩy → however.","vis":["tuy nhiên (đúng)","mặc dù (sai, không nối được 2 câu độc lập kiểu này)","nếu (sai nghĩa)","bởi vì (sai nghĩa)"]},{"q":"29. __________ Vietnamese IJSO delegation was attending the 11th Olympiad in Argentina, we had a chance to meet many friends all over the world and visit different beauty spots there.","options":["When","Despite","Although","If"],"answer":0,"vi":"Khi đoàn IJSO Việt Nam tham dự kỳ Olympiad lần thứ 11 tại Argentina, chúng tôi đã có cơ hội gặp gỡ nhiều bạn bè khắp thế giới và tham quan nhiều thắng cảnh đẹp ở đó.","explanation":"Mốc thời gian xảy ra đồng thời → When.","vis":["khi (đúng, mốc thời gian)","mặc dù (sai, theo sau danh từ)","mặc dù (sai nghĩa)","nếu (sai nghĩa)"]},{"q":"30. When the first Chinese restaurants opened in Greece, it was very difficult to get fresh__________ of Chinese vegetables.","options":["provisions","materials","supplies","ingredients"],"answer":2,"vi":"Khi những nhà hàng Trung Hoa đầu tiên mở cửa ở Hy Lạp, rất khó để có được nguồn cung cấp rau củ Trung Hoa tươi.","explanation":"\"supplies of\" = nguồn cung cấp.","vis":["nguồn cung cấp lương thực (sai nghĩa)","vật liệu (sai nghĩa)","nguồn cung cấp (đúng)","nguyên liệu (sai nghĩa)"]},{"q":"31. ___ different regions and religions have a variety in marital arrangements, the arranged marriage is a traditional feature of every community.","options":["Because","Although","While","When"],"answer":1,"vi":"Mặc dù các vùng miền và tôn giáo khác nhau có sự đa dạng trong cách sắp đặt hôn nhân, hôn nhân sắp đặt vẫn là nét truyền thống của mọi cộng đồng.","explanation":"Ý nhượng bộ → Although.","vis":["bởi vì (sai, không phải quan hệ nhân quả)","mặc dù (đúng, ý nhượng bộ)","trong khi (sai nghĩa)","khi (sai nghĩa)"]},{"q":"32. The Vietnamese are influenced by Buddhist theology and Confucian philosophy, ___they believe in fate in marriage.","options":["and","but","so","yet"],"answer":2,"vi":"Người Việt chịu ảnh hưởng của thần học Phật giáo và triết học Nho giáo, vì vậy họ tin vào duyên số trong hôn nhân.","explanation":"Quan hệ nhân quả → so.","vis":["và (sai, không phải bổ sung ý)","nhưng (sai, không phải tương phản)","vì vậy (đúng, kết quả)","nhưng (sai)"]},{"q":"33. Always take your shoes off before you enter a temple in India,___you will be considered impolite.","options":["otherwise","therefore","however","moreover"],"answer":0,"vi":"Luôn cởi giày trước khi vào đền ở Ấn Độ, nếu không bạn sẽ bị coi là bất lịch sự.","explanation":"\"otherwise\" = nếu không thì (nêu hậu quả nếu không làm theo).","vis":["nếu không thì (đúng)","vì vậy (sai)","tuy nhiên (sai)","hơn nữa (sai)"]},{"q":"34. \"Giao Thua\" is the most sacred time of the year;___,the first houseguest to offer the first greeting is very important.","options":["moreover","nevertheless","so","therefore"],"answer":3,"vi":"Giao thừa là thời khắc thiêng liêng nhất trong năm; do đó, người khách đầu tiên đến chúc mừng rất quan trọng.","explanation":"Quan hệ nhân quả sau dấu chấm phẩy → therefore.","vis":["hơn nữa (sai)","tuy nhiên (sai)","vì vậy (sai vị trí)","do đó (đúng)"]},{"q":"35. The five-fruit tray on the altar symbolizes the gratitude of the Vietnamese to their ancestors;\t,it demonstrates their hope for a life of plenty.","options":["and","moreover","therefore","however"],"answer":1,"vi":"Mâm ngũ quả trên bàn thờ tượng trưng cho lòng biết ơn của người Việt với tổ tiên; hơn nữa, nó thể hiện hy vọng về một cuộc sống sung túc.","explanation":"Bổ sung thêm ý → moreover.","vis":["và (sai, cần từ nối mạnh hơn)","hơn nữa (đúng)","vì vậy (sai, không phải kết quả)","tuy nhiên (sai)"]},{"q":"36. The Hung King Temple Festival___from the 8th to the 11th day of the third lunar month in Phu Tho.","options":["takes","takes part","takes place","takes turn"],"answer":2,"vi":"Lễ hội Đền Hùng diễn ra từ ngày 8 đến 11 tháng 3 âm lịch tại Phú Thọ.","explanation":"\"take place\" = diễn ra.","vis":["lấy (sai cụm từ)","tham gia (sai cụm từ, thiếu \"in\")","diễn ra (đúng)","sai cụm từ"]},{"q":"37. During the Buddhist Festival, visitors join the procession and make offerings to ___Buddha at the pagoda.","options":["think about","consider","worship","believe"],"answer":2,"vi":"Trong lễ hội Phật giáo, du khách tham gia đám rước và dâng lễ vật để thờ cúng Đức Phật tại chùa.","explanation":"\"worship\" = thờ cúng.","vis":["nghĩ về (sai nghĩa)","xem xét (sai nghĩa)","thờ cúng (đúng)","tin (sai nghĩa)"]},{"q":"38. I think the Kate Festival is a really joyful festival which___many activities.","options":["contains","holds","features","includes in"],"answer":2,"vi":"Tôi nghĩ lễ hội Katê là một lễ hội thực sự vui vẻ với nhiều hoạt động đặc sắc.","explanation":"\"feature\" = có đặc điểm nổi bật là.","vis":["chứa (sai nghĩa nhẹ)","giữ/tổ chức (sai nghĩa nhẹ)","có đặc điểm nổi bật (đúng)","sai cấu trúc, thừa \"in\""]},{"q":"39. In Viet Nam, the ___ we mostly use is chopsticks.","options":["cut","cutting","cutlery","cutlet"],"answer":2,"vi":"Ở Việt Nam, dụng cụ ăn uống mà chúng ta chủ yếu dùng là đũa.","explanation":"\"cutlery\" = dao muỗng nĩa/dụng cụ ăn uống.","vis":["cắt (sai từ loại)","việc cắt (sai nghĩa)","dao muỗng nĩa (đúng)","miếng thịt cốt-lết (sai nghĩa)"]},{"q":"40. You shouldn't___your promise to the children.","options":["break","cut","keep","save"],"answer":0,"vi":"Bạn không nên thất hứa với bọn trẻ.","explanation":"\"break a promise\" = thất hứa.","vis":["phá vỡ (đúng, \"break a promise\")","cắt (sai nghĩa)","giữ (sai, trái nghĩa yêu cầu)","tiết kiệm (sai nghĩa)"]},{"q":"41. Mid-Autumn Festival not only recalls the family love, _________ is also a festival for both children and adults in Vietnam.","options":["and","but","yet","therefore"],"answer":1,"vi":"Tết Trung Thu không chỉ gợi nhớ tình cảm gia đình, mà còn là lễ hội cho cả trẻ em và người lớn ở Việt Nam.","explanation":"\"not only...but also...\" = không những...mà còn.","vis":["và (sai, không hợp \"not only...but also\")","nhưng (đúng, \"not only...but also\")","nhưng (sai)","vì vậy (sai)"]},{"q":"42. Tran Temple Festival lasts from the 15th-20th of lunar August. _________, visitors all over the country eagerly go on a pilgrimage far prior to the day.","options":["Nevertheless","Otherwise","Therefore","Moreover"],"answer":0,"vi":"Lễ hội Đền Trần kéo dài từ 15-20 tháng 8 âm lịch. Tuy nhiên, du khách khắp cả nước đã háo hức hành hương từ rất lâu trước ngày đó.","explanation":"Ý tương phản với câu trước → Nevertheless.","vis":["tuy nhiên (đúng, ý tương phản)","nếu không thì (sai)","vì vậy (sai)","hơn nữa (sai)"]},{"q":"43. _________ the main worship event is taking place at Hung Temple, 100 lanterns are released into the sky.","options":["Because","Even though","While","If"],"answer":2,"vi":"Trong khi sự kiện thờ cúng chính diễn ra tại Đền Hùng, 100 chiếc đèn trời được thả lên trời.","explanation":"Hai hành động diễn ra đồng thời → While.","vis":["bởi vì (sai, không diễn tả đồng thời)","mặc dù (sai nghĩa)","trong khi (đúng, 2 hành động đồng thời)","nếu (sai nghĩa)"]},{"q":"44. Lim Festival is among the most impressive festivals, ceremonies ______ singing events.","options":["or","but","yet","and"],"answer":3,"vi":"Lễ hội Lim là một trong những lễ hội ấn tượng nhất, với các nghi lễ và các sự kiện hát hò.","explanation":"Liệt kê, bổ sung → and.","vis":["hoặc (sai)","nhưng (sai)","nhưng (sai)","và (đúng, liệt kê bổ sung)"]},{"q":"45. The navigation of the boat, called ghe ngo, requires great skills ________ it can easily be flipped.","options":["therefore","because","when","although"],"answer":1,"vi":"Việc điều khiển chiếc thuyền gọi là ghe ngo đòi hỏi kỹ năng cao vì nó rất dễ bị lật.","explanation":"Nêu lý do → because.","vis":["vì vậy (sai)","bởi vì (đúng, nêu lý do)","khi (sai nghĩa)","mặc dù (sai nghĩa)"]},{"q":"46. _________ you consider yourself a culture enthusiast, Hue Arts Festival is a must.","options":["If","Though","Because","As"],"answer":0,"vi":"Nếu bạn tự coi mình là người yêu thích văn hóa, Festival Huế là điều không thể bỏ lỡ.","explanation":"Điều kiện → If.","vis":["nếu (đúng, điều kiện)","mặc dù (sai nghĩa)","bởi vì (sai nghĩa)","vì/khi (sai nghĩa)"]},{"q":"47. The festival only lasted for three days; ______ they spent nearly a month preparing for it.","options":["when","moreover","otherwise","however"],"answer":3,"vi":"Lễ hội chỉ kéo dài ba ngày; tuy nhiên họ đã dành gần một tháng để chuẩn bị cho nó.","explanation":"Ý tương phản sau dấu chấm phẩy → however.","vis":["khi (sai nghĩa)","hơn nữa (sai)","nếu không thì (sai)","tuy nhiên (đúng)"]},{"q":"48. In Quang Ninh, you can go to Yen Tu Mountain to attend the Yen Tu Festival, _________ you can visit Ha Long Bay.","options":["so","yet","or","otherwise"],"answer":2,"vi":"Ở Quảng Ninh, bạn có thể đến núi Yên Tử để dự lễ hội Yên Tử, hoặc bạn có thể thăm vịnh Hạ Long.","explanation":"Lựa chọn → or.","vis":["vì vậy (sai nghĩa)","nhưng (sai)","hoặc (đúng, lựa chọn)","nếu không thì (sai)"]},{"q":"49. _________ there are loads of festivals in Vietnam, Tet or Tet Nguyen Dan is the most important one.","options":["Since","Although","When","As long as"],"answer":1,"vi":"Mặc dù có rất nhiều lễ hội ở Việt Nam, Tết Nguyên Đán vẫn là lễ hội quan trọng nhất.","explanation":"Ý nhượng bộ → Although.","vis":["bởi vì (sai, không phải nhượng bộ)","mặc dù (đúng, ý nhượng bộ)","khi (sai nghĩa)","miễn là (sai nghĩa)"]},{"q":"50. Festival visitors can take part in cultural activities, such as visiting art galleries, historical places and parks. _________, they can taste exotic food and dishes.","options":["Moreover","Therefore","However","Otherwise"],"answer":0,"vi":"Du khách lễ hội có thể tham gia các hoạt động văn hóa như thăm phòng tranh, di tích lịch sử và công viên. Hơn nữa, họ có thể thưởng thức các món ăn lạ.","explanation":"Bổ sung thêm ý → Moreover.","vis":["hơn nữa (đúng, bổ sung ý)","vì vậy (sai)","tuy nhiên (sai)","nếu không thì (sai)"]}]},{"roman":"IV","navLabel":"Word Forms","icon":"font","title":"Chia dạng đúng của từ (Word Forms)","instructions":"Cho dạng đúng của từ trong NGOẶC để hoàn thành câu.","type":"fill","instant":true,"questions":[{"q":"1. To make Chung cake, the rice and green bean has to be______ in water for a day to make it stickier.","hint":"(SOAK)","answer":"soaked","family":["soak (v): ngâm","soaked (adj/P2): đã được ngâm"],"vi":"Để làm bánh chưng, gạo và đậu xanh phải được ngâm trong nước một ngày cho dẻo hơn.","note":"động từ → tính từ/quá khứ phân từ đuôi -ed (bị động)","explanation":"SOAK → soaked."},{"q":"2. Vietnamese families plan their________ around their children on Tet holiday.","hint":"(ACTIVITY)","answer":"activities","family":["activity (n): hoạt động","activities (n, số nhiều): các hoạt động"],"vi":"Các gia đình Việt Nam lên kế hoạch các hoạt động xoay quanh con cái vào dịp Tết.","note":"danh từ số ít → số nhiều","explanation":"ACTIVITY → activities."},{"q":"3. Parents would use the Mid-Autumn Festival as an opportunity to show their love and ________ for their children.","hint":"(APPRECIATE)","answer":"appreciation","family":["appreciate (v): trân trọng","appreciation (n): sự trân trọng"],"vi":"Cha mẹ dùng Tết Trung Thu như cơ hội để thể hiện tình yêu và sự trân trọng dành cho con cái.","note":"động từ → danh từ đuôi -ion","explanation":"APPRECIATE → appreciation."},{"q":"4. Lanterns represent_______ while the procession symbolizes success in school.","hint":"(BRIGHT)","answer":"brightness","family":["bright (adj): sáng","brightness (n): sự sáng sủa"],"vi":"Đèn lồng tượng trưng cho sự sáng sủa trong khi đám rước tượng trưng cho thành công học tập.","note":"tính từ → danh từ đuôi -ness","explanation":"BRIGHT → brightness."},{"q":"5. I am writing to express my ________ of my stay at the Eden Hotel in London last weekend.","hint":"(SATISFY)","answer":"dissatisfaction","family":["satisfy (v): làm hài lòng","dissatisfaction (n): sự không hài lòng"],"vi":"Tôi viết thư này để bày tỏ sự không hài lòng về kỳ nghỉ của tôi tại khách sạn Eden ở London tuần trước.","note":"động từ → danh từ phủ định (dis- + -faction)","explanation":"SATISFY → dissatisfaction."},{"q":"6. At the end of the service, a lot of ____________ streamed down to the altar.","hint":"(WORSHIP)","answer":"worshippers","family":["worship (v): thờ cúng","worshippers (n, số nhiều): những người thờ cúng"],"vi":"Cuối buổi lễ, rất nhiều người thờ cúng đổ về bàn thờ.","note":"động từ → danh từ chỉ người đuôi -er","explanation":"WORSHIP → worshippers."},{"q":"7. _________ lanterns feature special heritage night at Hoi An.","hint":"(FLOAT)","answer":"Floating","family":["float (v): thả trôi","floating (adj/V-ing): trôi nổi"],"vi":"Đèn hoa đăng thả trôi là điểm nhấn đặc biệt trong đêm di sản tại Hội An.","note":"động từ → tính từ/V-ing","explanation":"FLOAT → Floating."},{"q":"8. __________activities are official procession, sporting events and singing.","hint":"(FESTIVAL)","answer":"Festive","family":["festival (n): lễ hội","festive (adj): mang không khí lễ hội"],"vi":"Các hoạt động mang không khí lễ hội gồm đám rước chính thức, các sự kiện thể thao và ca hát.","note":"danh từ → tính từ đuôi -ive","explanation":"FESTIVAL → Festive."},{"q":"9. __________for the Lunar New Year begin weeks before the festival.","hint":"(PREPARE)","answer":"Preparations","family":["prepare (v): chuẩn bị","preparations (n, số nhiều): sự chuẩn bị"],"vi":"Công tác chuẩn bị cho Tết Nguyên Đán bắt đầu từ nhiều tuần trước lễ hội.","note":"động từ → danh từ đuôi -ation","explanation":"PREPARE → Preparations."},{"q":"10. Tet is the privileged occasion for family members to _________.","hint":"(REUNION)","answer":"reunite","family":["reunion (n): sự đoàn tụ","reunite (v): đoàn tụ lại"],"vi":"Tết là dịp đặc biệt để các thành viên gia đình đoàn tụ.","note":"danh từ → động từ (tiền tố re-)","explanation":"REUNION → reunite."},{"q":"11. Hung King Temple Festival is held in __________ of Vietnam's first kings.","hint":"(COMMEMORATE)","answer":"commemoration","family":["commemorate (v): tưởng niệm","commemoration (n): sự tưởng niệm"],"vi":"Lễ hội Đền Hùng được tổ chức để tưởng niệm các vị vua đầu tiên của Việt Nam.","note":"động từ → danh từ đuôi -ion","explanation":"COMMEMORATE → commemoration."},{"q":"12. The tribe has different ________ masks for each ceremony.","hint":"(CEREMONY)","answer":"ceremonial","family":["ceremony (n): nghi lễ","ceremonial (adj): mang tính nghi lễ"],"vi":"Bộ tộc có những chiếc mặt nạ nghi lễ khác nhau cho mỗi buổi lễ.","note":"danh từ → tính từ đuôi -al","explanation":"CEREMONY → ceremonial."},{"q":"13. _________ of culture can be achieved by keeping cultural elements, such as food, clothing, shelter, and language.","hint":"(PRESERVE)","answer":"Preservation","family":["preserve (v): bảo tồn","preservation (n): sự bảo tồn"],"vi":"Sự bảo tồn văn hóa có thể đạt được bằng cách giữ gìn các yếu tố văn hóa như ẩm thực, trang phục, nơi ở và ngôn ngữ.","note":"động từ → danh từ đuôi -ation","explanation":"PRESERVE → Preservation."},{"q":"14. The Whale Festival is _______ of the many different festivals in villages in Vietnam.","hint":"(TYPE)","answer":"typical","family":["type (n): loại","typical (adj): điển hình"],"vi":"Lễ hội Cá Voi là một lễ hội điển hình trong số nhiều lễ hội khác nhau ở các làng quê Việt Nam.","note":"danh từ → tính từ đuôi -ical","explanation":"TYPE → typical."},{"q":"15. Hat Xoan is a folk song ___________ in festivals and worshipping genie.","hint":"(PERFORMANCE)","answer":"performed","family":["performance (n): sự biểu diễn","performed (P2): được biểu diễn"],"vi":"Hát Xoan là một loại dân ca được biểu diễn trong các lễ hội và khi thờ cúng thần linh.","note":"danh từ → động từ dạng bị động (P2)","explanation":"PERFORMANCE → performed."},{"q":"16. When Alice heard footsteps, she was ____________ and started to run.","hint":"(FRIGHT)","answer":"frightened","family":["fright (n): sự sợ hãi","frightened (adj): sợ hãi"],"vi":"Khi Alice nghe thấy tiếng bước chân, cô sợ hãi và bắt đầu chạy.","note":"danh từ → tính từ đuôi -ed (diễn tả cảm giác)","explanation":"FRIGHT → frightened."},{"q":"17. Cinderella's stepmother was ____________ and treated her ________.","hint":"(KIND-BAD)","answer":"unkind - badly","family":["kind (adj): tốt bụng","unkind (adj): không tốt bụng","bad (adj): tệ","badly (adv): một cách tệ bạc"],"vi":"Mẹ kế của Lọ Lem không tốt bụng và đối xử tệ bạc với cô.","note":"tính từ phủ định (un-) và tính từ → trạng từ đuôi -ly","explanation":"KIND-BAD → unkind - badly."},{"q":"18. Jack is very bright, but he's also ____________ of his accomplishments at school.","hint":"(BOAST)","answer":"boastful","family":["boast (v): khoe khoang","boastful (adj): hay khoe khoang"],"vi":"Jack rất thông minh, nhưng cậu ấy cũng hay khoe khoang về thành tích của mình ở trường.","note":"động từ → tính từ đuôi -ful","explanation":"BOAST → boastful."},{"q":"19. When Jack was going to the market, he met a __________.","hint":"(MAGIC)","answer":"magician","family":["magic (n): phép thuật","magician (n): pháp sư, ảo thuật gia"],"vi":"Khi Jack đang đi ra chợ, cậu gặp một pháp sư.","note":"danh từ → danh từ chỉ người đuôi -ian","explanation":"MAGIC → magician."},{"q":"20. She smiled __________, waved, and vanished into thin air.","hint":"(WICKED)","answer":"wickedly","family":["wicked (adj): độc ác","wickedly (adv): một cách độc ác"],"vi":"Cô ta mỉm cười một cách độc ác, vẫy tay, rồi biến mất không dấu vết.","note":"tính từ → trạng từ đuôi -ly","explanation":"WICKED → wickedly."}]},{"roman":"V","navLabel":"Chia động từ 1","icon":"pen","title":"Chia đúng dạng của động từ (thì hỗn hợp)","instructions":"Cho dạng đúng của động từ trong ngoặc để hoàn thành câu.","type":"fill","instant":true,"questions":[{"q":"1. My mother always tells me that I have to (be) ___ home by 9 p.m.","answer":"be","vi":"Mẹ tôi luôn bảo tôi phải về nhà trước 9 giờ tối.","explanation":"Sau \"have to\" dùng động từ nguyên mẫu → be."},{"q":"2. When I came, the whole family (have) ___ dinner around a big dining table.","answer":"was having","vi":"Khi tôi đến, cả gia đình đang ăn tối quanh chiếc bàn ăn lớn.","explanation":"Hành động đang diễn ra bị 1 hành động khác xen vào (came) → quá khứ tiếp diễn: was having."},{"q":"3. Children should (take) ___ things from adults with both hands.","answer":"take","vi":"Trẻ em nên nhận đồ từ người lớn bằng cả hai tay.","explanation":"Sau \"should\" dùng động từ nguyên mẫu → take."},{"q":"4. In Australia, you mustn't (comment) ___ on a person's accent.","answer":"comment","vi":"Ở Úc, bạn không được bình luận về giọng nói của người khác.","explanation":"Sau \"mustn't\" dùng động từ nguyên mẫu → comment."},{"q":"5. Laura lives in a big city. If she ___ (live) in the country, she ___ (have) a dog.","answer":"lived / would have","vi":"Laura sống ở thành phố lớn. Nếu cô ấy sống ở nông thôn, cô ấy sẽ nuôi một con chó.","explanation":"Câu điều kiện loại 2: if + quá khứ đơn (lived), mệnh đề chính would + V (would have).","accepted":["lived / would have"]},{"q":"6. I ___ (learn) Italian for the past three years.","answer":"have learnt","vi":"Tôi đã học tiếng Ý được ba năm nay.","explanation":"Hành động bắt đầu trong quá khứ, kéo dài đến hiện tại → hiện tại hoàn thành (tiếp diễn): have learnt/have been learning.","accepted":["have learnt","have learned","have been learning"]},{"q":"7. If I were you, I ___ (not / buy) that book.","answer":"wouldn't buy","vi":"Nếu tôi là bạn, tôi sẽ không mua cuốn sách đó.","explanation":"Câu điều kiện loại 2 → mệnh đề chính would not + V: wouldn't buy.","accepted":["wouldn't buy","would not buy"]},{"q":"8. What ___ the children (see) in the zoo yesterday?","answer":"did the children see","vi":"Hôm qua bọn trẻ đã thấy gì ở sở thú?","explanation":"Câu hỏi Wh- ở quá khứ đơn → did + S + V nguyên mẫu: did...see.","accepted":["did the children see","did the children  see"]},{"q":"9. They prefer ___ (play) in a swimming pool all day.","answer":"playing","vi":"Họ thích bơi trong hồ bơi cả ngày hơn.","explanation":"\"prefer\" + V-ing → playing."},{"q":"10. The doctor will be ready in ten minutes. Take a seat while you (wait) ___.","answer":"are waiting","vi":"Bác sĩ sẽ sẵn sàng trong mười phút nữa. Hãy ngồi trong khi bạn đang chờ.","explanation":"Hành động đang diễn ra ở hiện tại → hiện tại tiếp diễn: are waiting."}]},{"roman":"VI","navLabel":"Chia động từ 2","icon":"pen-fancy","title":"Chia động từ ở quá khứ đơn hoặc quá khứ tiếp diễn","instructions":"Viết dạng đúng của động từ trong ngoặc (quá khứ đơn hoặc quá khứ tiếp diễn).","type":"fill","instant":true,"questions":[{"q":"1. The woodcutter (work) ___ in the woods. He (hear) ___ a loud scream from a small cottage.","answer":"was working / heard","vi":"Người tiều phu đang làm việc trong rừng. Anh nghe thấy một tiếng thét lớn từ một túp lều nhỏ.","explanation":"Hành động đang diễn ra (was working) bị hành động ngắn (heard) xen vào → quá khứ tiếp diễn + quá khứ đơn."},{"q":"2. Hans Christian Andersen (grow up) ___ in a Danish village and (move) ___ to the big city in 1900s.","answer":"grew up / moved","vi":"Hans Christian Andersen lớn lên ở một ngôi làng Đan Mạch và chuyển đến thành phố lớn vào những năm 1900.","explanation":"Hai hành động nối tiếp, đã hoàn tất trong quá khứ → quá khứ đơn."},{"q":"3. Cinderella (have to) ___ work hard all day since her father died.","answer":"had to","vi":"Lọ Lem phải làm việc vất vả cả ngày kể từ khi cha cô mất.","explanation":"Hành động kéo dài trong quá khứ → quá khứ đơn: had to."},{"q":"4. Cinderella (dress) ___ in rags with a dusty gray face from the cinders while her stepsisters always (dress) ___ splendid and elegant clothes.","answer":"dressed / dressed","vi":"Lọ Lem mặc quần áo rách rưới với khuôn mặt lấm lem tro bụi trong khi các chị kế của cô luôn mặc những bộ quần áo lộng lẫy, sang trọng.","explanation":"Hai hành động song song, mang tính miêu tả trạng thái → quá khứ đơn."},{"q":"5. I (see) ___ the accident when I (wait) ___ for the taxi.","answer":"saw / was waiting","vi":"Tôi đã thấy vụ tai nạn khi tôi đang chờ taxi.","explanation":"Hành động ngắn (saw) xen vào hành động đang diễn ra (was waiting)."},{"q":"6. While people (talk) ___ to each other, he (read) ___ his book.","answer":"were talking / was reading","vi":"Trong khi mọi người đang nói chuyện với nhau, anh ấy đang đọc sách.","explanation":"Hai hành động song song đang diễn ra → quá khứ tiếp diễn."},{"q":"7. Who ___ she (dance) with at the party last night?","answer":"did she dance","vi":"Cô ấy đã khiêu vũ với ai tại bữa tiệc tối qua?","explanation":"Câu hỏi ở quá khứ đơn → did + S + V nguyên mẫu."},{"q":"8. While we (play) ___ basketball in the park, Mary (fall) ___ over.","answer":"were playing / fell","vi":"Trong khi chúng tôi đang chơi bóng rổ ở công viên, Mary bị ngã.","explanation":"Hành động đang diễn ra (were playing) bị hành động ngắn (fell) xen vào."},{"q":"9. When Cinderella (run) ___ she (loose) ___ one of her slippers.","answer":"was running / lost","vi":"Khi Lọ Lem đang chạy, cô làm rơi một chiếc giày.","explanation":"Hành động đang diễn ra (was running) bị hành động ngắn (lost) xen vào."},{"q":"10. Someone (knock) ___ the door at midnight yesterday.","answer":"was knocking","vi":"Có ai đó đang gõ cửa lúc nửa đêm hôm qua.","explanation":"Hành động đang diễn ra tại một thời điểm cụ thể trong quá khứ → quá khứ tiếp diễn."}]},{"roman":"VII","navLabel":"Chia động từ 3","icon":"pen-ruler","title":"Chia động từ ở quá khứ hoàn thành hoặc quá khứ đơn","instructions":"Viết dạng đúng của động từ trong ngoặc (quá khứ hoàn thành hoặc quá khứ đơn).","type":"fill","instant":true,"questions":[{"q":"1. When she (finish) ___ her work, she (go) ___ to the cinema.","answer":"had finished / went","vi":"Khi cô ấy làm xong việc, cô ấy đã đi xem phim.","explanation":"had finished = đã làm xong; went = đã đi. Hành động xảy ra trước → quá khứ hoàn thành: had finished; hành động sau → quá khứ đơn: went."},{"q":"2. He (not eat) ___ until his parents (come) ___ home.","answer":"hadn't eaten / came","vi":"Anh ấy đã không ăn cho đến khi bố mẹ anh về nhà.","explanation":"hadn't eaten = đã không ăn; came = đã về. Hành động kéo dài đến trước một mốc → quá khứ hoàn thành: hadn't eaten; mốc thời gian → quá khứ đơn: came."},{"q":"3. She (tell) ___ me she never (meet) ___ him.","answer":"told / had met","vi":"Cô ấy nói với tôi rằng cô chưa từng gặp anh ta trước đó.","explanation":"told = đã nói; had met = đã từng gặp. Hành động xảy ra trước hành động kể lại (told) → quá khứ hoàn thành: had met."},{"q":"4. He (do) ___ her homework before he (go) ___ out.","answer":"had done / went","vi":"Anh ấy đã làm xong bài tập trước khi ra ngoài.","explanation":"had done = đã làm xong; went = đã đi. Hành động xảy ra trước → quá khứ hoàn thành: had done; hành động sau → quá khứ đơn: went."},{"q":"5. The lights (go) ___ out the moment he (get) ___ into the cinema.","answer":"went / got","vi":"Đèn tắt đúng lúc anh ấy bước vào rạp chiếu phim.","explanation":"went = đã tắt; got = đã bước vào. Hai hành động gần như đồng thời, nhấn mạnh trình tự tức thời → quá khứ đơn cả hai."},{"q":"6. Hardly ___ the holiday (begin) when they (leave) ___ the town.","answer":"had...begun / left","vi":"Kỳ nghỉ vừa mới bắt đầu thì họ đã rời khỏi thị trấn.","explanation":"had begun = đã bắt đầu; left = đã rời đi. \"Hardly...when\" → mệnh đề trước dùng quá khứ hoàn thành (had begun), mệnh đề sau dùng quá khứ đơn (left).","accepted":["had begun / left","had...begun / left"]},{"q":"7. They (be) ___ out for an hour when it (start) ___ to rain.","answer":"had been / started","vi":"Họ đã ở ngoài được một giờ thì trời bắt đầu mưa.","explanation":"had been = đã ở ngoài; started = đã bắt đầu. Hành động kéo dài trước một mốc → quá khứ hoàn thành: had been; mốc thời gian → quá khứ đơn: started."},{"q":"8. They (leave) ___ the shop as soon as they (buy) ___ everything they (need) ___.","answer":"left / had bought / needed","vi":"Họ rời khỏi cửa hàng ngay khi mua xong mọi thứ họ cần.","explanation":"left = đã rời khỏi; had bought = đã mua xong; needed = cần đến. \"as soon as\": mua xong trước (had bought) → rời đi sau (left); \"cần\" là trạng thái nền → quá khứ đơn: needed."},{"q":"9. The house (burn) ___ to the ground by the time the firemen (arrive) ___.","answer":"had burned / arrived","vi":"Ngôi nhà đã cháy rụi trước khi lính cứu hỏa đến.","explanation":"had burned = đã cháy rụi; arrived = đã đến. \"by the time\" → hành động xảy ra trước dùng quá khứ hoàn thành: had burned/burnt; mốc thời gian dùng quá khứ đơn: arrived.","accepted":["had burned / arrived","had burnt / arrived"]},{"q":"10. As he (do) ___ a lot of work that day he (be) ___ very tired.","answer":"had done / was","vi":"Vì đã làm rất nhiều việc hôm đó nên anh ấy rất mệt.","explanation":"had done = đã làm; was = đã (rất mệt). Hành động xảy ra trước → quá khứ hoàn thành: had done; trạng thái kết quả → quá khứ đơn: was."}]},{"roman":"VIII","navLabel":"Sửa lỗi 1","icon":"wrench","title":"Tìm lỗi sai (A, B, C hoặc D)","instructions":"Tìm phần gạch chân sai trong mỗi câu.","type":"mcq","instant":true,"questions":[{"q":"1. The ritual is <u>made</u> in order <u>to thank</u> the Sun Goddess <u>for</u> the <u>rice harvest</u>.","options":["made","to thank","for","rice harvest"],"answer":0,"vi":"Nghi lễ được thực hiện để tạ ơn Nữ thần Mặt trời vì mùa lúa bội thu.","explanation":"\"perform a ritual\" = thực hiện nghi lễ (không dùng \"make\") → made phải sửa thành performed.","vis":["làm (sai — cần \"performed\")","để cảm ơn","vì","mùa lúa"]},{"q":"2. I <u>found</u> it very <u>excited</u> to take part <u>in</u> the spring festival <u>of</u> Bai Dinh Pagoda.","options":["found","excited","in","of"],"answer":1,"vi":"Tôi thấy rất thú vị khi tham gia lễ hội mùa xuân của chùa Bái Đính.","explanation":"Vật gây cảm giác → tính từ đuôi -ing → excited phải sửa thành exciting.","vis":["thấy","cảm thấy phấn khích (sai — cần \"exciting\")","trong việc","của"]},{"q":"3. I like <u>both</u> the green <u>or</u> the blue T-shirt, <u>but</u> I don't have <u>enough</u> money to buy two T-shirts.","options":["both","or","but","enough"],"answer":1,"vi":"Tôi thích cả áo thun xanh lá và áo thun xanh dương, nhưng tôi không có đủ tiền để mua hai chiếc áo.","explanation":"\"both A and B\" → or phải sửa thành and.","vis":["cả hai","hoặc (sai — cần \"and\")","nhưng","đủ"]},{"q":"4. Your marks <u>in English</u> are low <u>although</u> you <u>don't</u> study <u>hard enough</u>.","options":["in English","although","don't","hard enough"],"answer":1,"vi":"Điểm tiếng Anh của bạn thấp vì bạn học không đủ chăm chỉ.","explanation":"Nêu nguyên nhân, không phải nhượng bộ → although phải sửa thành because.","vis":["môn tiếng Anh","mặc dù (sai — cần \"because\")","không","đủ chăm chỉ"]},{"q":"5. <u>Which festival</u> <u>do</u> you like <u>much</u>, Huong Pagoda <u>or</u> Hung Temple?","options":["Which festival","do","much","or"],"answer":2,"vi":"Bạn thích lễ hội nào hơn, chùa Hương hay đền Hùng?","explanation":"So sánh giữa 2 đối tượng → much phải sửa thành more.","vis":["lễ hội nào","trợ động từ nghi vấn","nhiều (sai — cần \"more\")","hay"]},{"q":"6. We <u>follow</u> a custom <u>to buy</u> lanterns <u>and</u> moon cakes <u>at</u> Mid-Autumn Festival.","options":["follow","to buy","and","at"],"answer":1,"vi":"Chúng tôi theo phong tục mua đèn lồng và bánh trung thu vào dịp Tết Trung Thu.","explanation":"\"a custom of + V-ing\" → to buy phải sửa thành of buying.","vis":["theo","để mua (sai — cần \"of buying\")","và","vào"]},{"q":"7. Before Tet, Vietnamese people <u>are</u> busy <u>cleaning</u> and <u>decorating</u> their houses and <u>they cook</u> traditional foods.","options":["are","cleaning","decorating","they cook"],"answer":3,"vi":"Trước Tết, người Việt Nam bận rộn dọn dẹp, trang trí nhà cửa và nấu các món ăn truyền thống.","explanation":"Song song với cleaning, decorating (V-ing) → they cook phải sửa thành cooking.","vis":["thì/là","dọn dẹp","trang trí","họ nấu (sai — cần \"cooking\")"]},{"q":"8. <u>Until</u> recently, people <u>talk</u> to each other <u>instead of</u> relying on texting and e-mail <u>to communicate</u> with their peers.","options":["Until","talk","instead of","to communicate"],"answer":1,"vi":"Cho đến gần đây, người ta vẫn nói chuyện trực tiếp với nhau thay vì dựa vào nhắn tin và email để giao tiếp với bạn bè.","explanation":"\"Until recently\" là dấu hiệu quá khứ đơn → talk phải sửa thành talked.","vis":["cho đến","nói chuyện (sai — cần \"talked\")","thay vì","để giao tiếp"]},{"q":"9. She <u>was offered</u> the prestigious job, <u>however</u> she <u>turned it down</u> because she did not want <u>to move to</u> Texas.","options":["was offered","however","turned it down","to move to"],"answer":1,"vi":"Cô ấy được đề nghị công việc danh giá đó, nhưng cô đã từ chối vì không muốn chuyển đến Texas.","explanation":"Nối 2 mệnh đề trong cùng 1 câu, ý tương phản → however phải sửa thành but.","vis":["được đề nghị","tuy nhiên (sai — cần \"but\")","đã từ chối","chuyển đến"]},{"q":"10. It <u>started</u> to rain <u>hardly</u> while we <u>were playing</u> some folk games <u>at the</u> festival.","options":["started","hardly","were playing","at the"],"answer":1,"vi":"Trời bắt đầu mưa to trong khi chúng tôi đang chơi vài trò chơi dân gian tại lễ hội.","explanation":"\"rain hard\" = mưa to → hardly (hầu như không) phải sửa thành hard.","vis":["bắt đầu","hầu như không (sai — cần \"hard\")","đang chơi","tại"]},{"q":"11. He <u>hated</u> being <u>in the army</u> <u>when</u> he had <u>to obey</u> commands.","options":["hated","in the army","when","to obey"],"answer":2,"vi":"Anh ấy ghét việc ở trong quân đội vì phải tuân theo mệnh lệnh.","explanation":"Nêu lý do → when phải sửa thành because.","vis":["ghét","trong quân đội","khi (sai — cần \"because\")","phải tuân theo"]},{"q":"12. He <u>must be</u> <u>about 60</u> <u>whereas</u> his wife <u>look</u> about 30.","options":["must be","about 60","whereas","look"],"answer":3,"vi":"Anh ấy chắc khoảng 60 tuổi trong khi vợ anh ấy trông chỉ khoảng 30.","explanation":"Chủ ngữ số ít \"his wife\" → look phải sửa thành looks.","vis":["chắc là","khoảng 60","trong khi","trông (sai — cần \"looks\")"]},{"q":"13. You <u>better</u> take <u>the keys</u> <u>in case</u> I'm <u>out</u>.","options":["better","the keys","in case","out"],"answer":0,"vi":"Bạn nên mang theo chìa khóa phòng khi tôi ra ngoài.","explanation":"Cấu trúc khuyên nhủ đầy đủ là \"had better\" → better phải sửa thành had better.","vis":["nên (sai — cần \"had better\")","chìa khóa","phòng khi","ra ngoài"]},{"q":"14. I <u>went</u> to <u>the post office</u> <u>immediately</u> <u>since</u> I left you.","options":["went","the post office","immediately","since"],"answer":3,"vi":"Tôi đã đến bưu điện ngay khi tôi rời khỏi chỗ bạn.","explanation":"Diễn tả mốc thời gian tức thì → since phải sửa thành when.","vis":["đã đi","bưu điện","ngay lập tức","kể từ khi (sai — cần \"when\")"]},{"q":"15. <u>Shouldn't</u> we <u>wait</u> <u>until</u> Antony <u>here</u>?","options":["Shouldn't","wait","until","here"],"answer":0,"vi":"Chúng ta nên đợi cho đến khi Antony đến đây chứ?","explanation":"Câu đề nghị mang nghĩa khẳng định → Shouldn't phải sửa thành Should.","vis":["không nên (sai — cần \"Should\")","chờ","cho đến khi","ở đây"]}]},{"roman":"IX","navLabel":"Sửa lỗi 2","icon":"file-pen","title":"Tìm và sửa 5 lỗi sai trong đoạn văn","instructions":"Đọc đoạn văn. Mỗi câu có một lỗi sai. Gõ từ ĐÚNG vào ô trống.","type":"fill","instant":true,"passage":{"title":"Đoạn văn gốc (có lỗi)","html":"Tet's preparations and celebrations used to be spread over months, but nowadays the holiday is much shorter. A great deal of excitement still builds in well before Tet. Street are decorated on coloured lights and red banner. Shop are full with goods. People are busy buying gifts, cleaning and decorating their house and cooking traditional foods.<br><br>Homes are often decorated plants and flowers at this time. Peach blossom is traditional at Tet in the North while apricot blossom is traditional in the South. The kumquat tree in its ripe deep orange fruits is popular throughout the country. One of Tet's most special food is banh chung, which is made up sticky rice, green beans and fatty pork. Mut, which is candied fruits such as sugared apples, plums or tomatoes, is also popular.","vi":"Việc chuẩn bị và ăn mừng Tết trước đây thường kéo dài suốt nhiều tháng, nhưng ngày nay kỳ nghỉ đã ngắn hơn nhiều. Không khí háo hức vẫn dâng lên từ rất lâu trước Tết. Đường phố được trang trí bằng đèn màu và băng rôn đỏ. Cửa hàng đầy ắp hàng hóa. Mọi người bận rộn mua sắm quà cáp, dọn dẹp và trang trí nhà cửa cùng nấu các món ăn truyền thống.<br><br>Nhà cửa thường được trang trí bằng cây cối và hoa vào dịp này. Hoa đào là loài hoa truyền thống của Tết ở miền Bắc trong khi hoa mai là loài hoa truyền thống ở miền Nam. Cây quất với những trái chín cam đậm được ưa chuộng khắp cả nước. Một trong những món ăn đặc biệt nhất của Tết là bánh chưng, được làm từ gạo nếp, đậu xanh và thịt mỡ. Mứt, là loại trái cây sên đường như táo, mận hoặc cà chua, cũng rất được ưa chuộng."},"questions":[{"q":"1. A great deal of excitement still builds in well before Tet.  →  Sửa: ___","answer":"up","vi":"Rất nhiều sự háo hức vẫn dâng lên từ rất lâu trước Tết.","explanation":"\"build up\" = dâng lên, tích tụ dần → in phải sửa thành up."},{"q":"2. Street are decorated on coloured lights and red banner.  →  Sửa: ___","answer":"with","vi":"Đường phố được trang trí bằng đèn màu và băng rôn đỏ.","explanation":"\"decorate with\" = trang trí bằng → on phải sửa thành with."},{"q":"3. Shop are full with goods.  →  Sửa: ___","answer":"of","vi":"Các cửa hàng đầy ắp hàng hóa.","explanation":"\"full of\" = đầy ắp → with phải sửa thành of."},{"q":"4. The kumquat tree in its ripe deep orange fruits is popular throughout the country.  →  Sửa: ___","answer":"with","vi":"Cây quất với những trái chín cam đậm được ưa chuộng khắp cả nước.","explanation":"\"a tree with its fruits\" → in phải sửa thành with."},{"q":"5. One of Tet's most special food is banh chung, which is made up sticky rice, green beans and fatty pork.  →  Sửa: ___","answer":"from","vi":"Một trong những món ăn đặc biệt nhất của Tết là bánh chưng, được làm từ gạo nếp, đậu xanh và thịt mỡ.","explanation":"\"made from\" = được làm từ → up phải sửa thành from."}]},{"roman":"X","navLabel":"Đọc hiểu 1","icon":"book-open","title":"Đọc hiểu – Mid-Autumn Festival (Đúng/Sai)","instructions":"Đọc đoạn văn và xác định các câu sau là Đúng (T) hay Sai (F).","type":"mcq","instant":true,"passage":{"title":"Mid-Autumn Festival","html":"In Viet Nam, Tet Trung Thu or the Mid-Autumn Festival is one of the most popular family holidays. It is held on the 15th day of the August lunar month. Vietnamese families plan their activities around their children on this special day. In a Vietnamese folklore, parents were working so hard to prepare for the harvest that they left the children playing by themselves. To make up for lost time, parents would use the Mid-Autumn Festival as an opportunity to show their love and appreciation for their children. Appropriately the Mid-Autumn Festival is also called the Children's Festival. In the United States, this tradition continues in many Vietnamese-American communities. Trung Thu activities are often centered on children and education. Parents buy lanterns for their children so that they can participate in a candlelit lantern procession at dawn. Lanterns represent brightness while the procession symbolizes success in school. Vietnamese markets sell a variety of lanterns, but the most popular children's lantern is the star lantern. Other children's activities include arts and crafts in which children make face masks and lanterns. Children also perform traditional Vietnamese dances for adults and participate in contests for prizes and scholarships. Unicorn dancers are also very popular in Trung Thu festivities.<br><br>Like the Chinese, Vietnamese parents tell their children fairy tales and serve mooncakes and other special treats under the silvery moon. A favorite folklore is about a carp that wanted to become a dragon. The carp worked and worked and eventually transformed itself into a dragon. This is the story behind the mythical symbol, Cá Hóa Rồng. Parents use this story to encourage their children to work hard so that they can become whomever they want to be.","vi":"Ở Việt Nam, Tết Trung Thu là một trong những ngày lễ gia đình phổ biến nhất. Nó được tổ chức vào ngày 15 tháng 8 âm lịch. Các gia đình Việt Nam lên kế hoạch các hoạt động xoay quanh con cái vào ngày đặc biệt này. Theo một truyền thuyết Việt Nam, cha mẹ từng làm việc vất vả để chuẩn bị cho mùa gặt đến nỗi để con cái tự chơi một mình. Để bù đắp cho khoảng thời gian đã mất, cha mẹ dùng Tết Trung Thu như một cơ hội để thể hiện tình yêu và sự trân trọng dành cho con cái. Vì vậy Tết Trung Thu còn được gọi là Tết Thiếu Nhi. Ở Hoa Kỳ, truyền thống này vẫn tiếp tục trong nhiều cộng đồng người Việt. Các hoạt động Trung Thu thường xoay quanh trẻ em và giáo dục. Cha mẹ mua đèn lồng cho con để chúng tham gia đoàn rước đèn lúc bình minh. Đèn lồng tượng trưng cho sự sáng sủa còn đám rước tượng trưng cho thành công học tập. Chợ Việt Nam bán nhiều loại đèn lồng, nhưng loại phổ biến nhất với trẻ em là đèn ông sao. Các hoạt động khác của trẻ em gồm làm thủ công, trong đó trẻ tự làm mặt nạ và đèn lồng. Trẻ em cũng biểu diễn các điệu múa truyền thống Việt Nam cho người lớn xem và tham gia các cuộc thi để giành giải thưởng và học bổng. Múa lân cũng rất phổ biến trong dịp Trung Thu.<br><br>Giống người Hoa, cha mẹ Việt Nam kể chuyện cổ tích cho con và mời bánh trung thu cùng các món đặc biệt khác dưới ánh trăng bạc. Một câu chuyện cổ được yêu thích là về một con cá chép muốn hóa thành rồng. Con cá chép nỗ lực không ngừng và cuối cùng đã biến thành rồng. Đây là câu chuyện đằng sau biểu tượng huyền thoại Cá Hóa Rồng. Cha mẹ dùng câu chuyện này để khuyến khích con cái chăm chỉ để có thể trở thành bất cứ ai chúng muốn."},"questions":[{"q":"1. In Viet Nam, the Mid-Autumn Festival is held on the 15th day of every month.","options":["Đúng (True)","Sai (False)"],"answer":1,"vi":"Ở Việt Nam, Tết Trung Thu được tổ chức vào ngày 15 của mỗi tháng.","explanation":"Bài đọc nói lễ hội diễn ra vào ngày 15 tháng 8 ÂM LỊCH, không phải mỗi tháng → Sai."},{"q":"2. To make up for lost time, parents would use the Mid-Autumn Festival as an opportunity to show their love and appreciation for their children.","options":["Đúng (True)","Sai (False)"],"answer":0,"vi":"Để bù đắp thời gian đã mất, cha mẹ dùng Tết Trung Thu làm cơ hội thể hiện tình yêu và sự trân trọng dành cho con cái.","explanation":"Câu này được nêu chính xác trong bài đọc → Đúng."},{"q":"3. Lanterns represent brightness while the procession symbolizes success in school.","options":["Đúng (True)","Sai (False)"],"answer":0,"vi":"Đèn lồng tượng trưng cho sự sáng sủa còn đám rước tượng trưng cho thành công học tập.","explanation":"Câu này được nêu chính xác trong bài đọc → Đúng."},{"q":"4. It's difficult for children to buy lanterns in Vietnamese markets.","options":["Đúng (True)","Sai (False)"],"answer":1,"vi":"Trẻ em khó mà mua được đèn lồng ở chợ Việt Nam.","explanation":"Bài đọc nói chợ BÁN nhiều loại đèn lồng, không hề khó mua → Sai."},{"q":"5. In Mid-Autumn Festival, Vietnamese parents tell their children fairy tales and serve mooncakes and other special treats under the silvery moon.","options":["Đúng (True)","Sai (False)"],"answer":1,"vi":"Vào Tết Trung Thu, cha mẹ Việt Nam kể chuyện cổ tích cho con và mời bánh trung thu cùng các món đặc biệt khác dưới ánh trăng bạc.","explanation":"Theo đáp án gốc của tài liệu, câu này được đánh giá là Sai."}]},{"roman":"XI","navLabel":"Đọc hiểu 2","icon":"book-open","title":"Đọc hiểu – The Rice-cooking Festival","instructions":"Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi chỗ trống.","type":"mcq","instant":true,"passage":{"title":"The Rice-cooking Festival","html":"The Rice-cooking <b>(1)</b> ___ was held in the communal house yard about one kilometer away from a <b>(2)</b> ___. There were three <b>(3)</b> ___: water fetching, fire-making and rice-cooking. The festival <b>(4)</b> ___ one day. In the water-fetching <b>(5)</b> ___, one person from each team had <b>(6)</b> ___ to the river to get the <b>(7)</b> ___. In the fire-making contest, two team members had to make fire in the <b>(8)</b> ___ way. They tried to rub pieces of <b>(9)</b> ___ together to make the fire. Six people from each team <b>(10)</b> ___ in the Rice-cooking Festival. They had to separate the rice from the husk and then cook the rice.","vi":"Lễ hội <b>(1)</b> ___ Thi nấu cơm được tổ chức tại sân đình cách một <b>(2)</b> ___ ngôi làng khoảng một cây số. Có ba <b>(3)</b> ___ cuộc thi: lấy nước, nhóm lửa và nấu cơm. Lễ hội <b>(4)</b> ___ diễn ra trong một ngày. Trong phần <b>(5)</b> ___ thi lấy nước, mỗi đội cử một người <b>(6)</b> ___ phải chạy ra sông để lấy <b>(7)</b> ___ nước. Trong phần thi nhóm lửa, hai thành viên mỗi đội phải nhóm lửa theo cách <b>(8)</b> ___ truyền thống. Họ cọ những mảnh <b>(9)</b> ___ tre với nhau để tạo ra lửa. Sáu người mỗi đội <b>(10)</b> ___ tham gia phần thi nấu cơm. Họ phải tách gạo khỏi trấu rồi nấu cơm."},"questions":[{"q":"The Rice-cooking (1) ___ was held in the communal house yard.","options":["holiday","contest","festival","competition"],"answer":2,"vi":"Lễ hội Thi nấu cơm được tổ chức tại sân đình.","explanation":"\"festival\" phù hợp với tên gọi lễ hội truyền thống này.","vis":["ngày lễ (sai nghĩa, quá chung chung)","cuộc thi (sai, chưa hợp văn cảnh)","lễ hội (đúng, tên gọi lễ hội)","cuộc thi đua (sai nghĩa)"]},{"q":"...about one kilometer away from a (2) ___.","options":["mountain","city","house","river"],"answer":3,"vi":"...cách một con sông khoảng một cây số.","explanation":"Sân đình cách một dòng sông khoảng 1km (phù hợp phần thi lấy nước sau đó) → river.","vis":["núi (sai nghĩa)","thành phố (sai nghĩa)","nhà (sai nghĩa)","sông (đúng)"]},{"q":"There were three (3) ___: water fetching, fire-making and rice-cooking.","options":["holidays","contests","festivals","competitions"],"answer":3,"vi":"Có ba cuộc thi: lấy nước, nhóm lửa và nấu cơm.","explanation":"Ba nội dung thi đấu → competitions.","vis":["những ngày lễ (sai nghĩa)","những cuộc thi (sai từ)","những lễ hội (sai, lặp ý)","những cuộc thi đua (đúng)"]},{"q":"The festival (4) ___ one day.","options":["takes","took","taking","take"],"answer":1,"vi":"Lễ hội diễn ra trong một ngày.","explanation":"Toàn bài kể chuyện ở thì quá khứ → took.","vis":["diễn ra (hiện tại đơn, sai thì)","đã diễn ra (đúng, quá khứ đơn)","đang diễn ra (sai)","diễn ra (sai chia)"]},{"q":"In the water-fetching (5) ___, one person from each team had to run to the river.","options":["contest","contests","test","tests"],"answer":0,"vi":"Trong phần thi lấy nước, mỗi đội cử một người.","explanation":"Danh từ số ít sau mạo từ \"the\" → contest.","vis":["cuộc thi (đúng, danh từ số ít sau \"the\")","những cuộc thi (sai số nhiều)","bài kiểm tra (sai nghĩa)","những bài kiểm tra (sai nghĩa)"]},{"q":"...one person from each team had (6) ___ to the river to get the water.","options":["to run","run","ran","running"],"answer":0,"vi":"...phải chạy ra sông để lấy nước.","explanation":"\"had to\" + V nguyên mẫu → to run.","vis":["chạy (đúng, \"had to run\")","chạy (sai dạng)","đã chạy (sai dạng, thừa vì đã có \"had\")","đang chạy (sai dạng)"]},{"q":"...to the river to get the (7) ___.","options":["bamboo","rice","fire","water"],"answer":3,"vi":"...ra sông để lấy nước.","explanation":"Phần thi \"water fetching\" (lấy nước) → water.","vis":["tre (sai nghĩa ở đây)","gạo (sai nghĩa)","lửa (sai nghĩa)","nước (đúng, \"get the water\")"]},{"q":"...two team members had to make fire in the (8) ___ way.","options":["strange","tradition","traditional","tradition"],"answer":2,"vi":"...hai thành viên phải nhóm lửa theo cách truyền thống.","explanation":"Tính từ bổ nghĩa cho \"way\" → traditional.","vis":["kỳ lạ (sai nghĩa)","truyền thống (danh từ, sai từ loại)","truyền thống (tính từ, đúng)","truyền thống (danh từ, sai từ loại)"]},{"q":"They tried to rub pieces of (9) ___ together to make the fire.","options":["bamboo","rice","fire","water"],"answer":0,"vi":"Họ cọ những mảnh tre với nhau để tạo ra lửa.","explanation":"Vật liệu cọ để tạo lửa → bamboo (tre).","vis":["tre (đúng, \"rub pieces of bamboo\")","gạo (sai nghĩa)","lửa (sai nghĩa, đây là kết quả chứ không phải vật liệu)","nước (sai nghĩa)"]},{"q":"Six people from each team (10) ___ in the Rice-cooking Festival.","options":["participates","participate","participating","participated"],"answer":1,"vi":"Sáu người mỗi đội tham gia phần thi nấu cơm.","explanation":"Theo đáp án gốc của tài liệu → participate.","vis":["tham gia (sai chia, chủ ngữ số nhiều)","tham gia (đúng theo đáp án gốc)","đang tham gia (sai dạng)","đã tham gia (sai dạng theo đáp án gốc)"]}]},{"roman":"XII","navLabel":"Đọc hội thoại","icon":"comments","title":"Đọc hiểu – Chol Chnam Thmay Festival","instructions":"Đọc đoạn văn và trả lời các câu hỏi.","type":"sentence","instant":true,"passage":{"title":"Chol Chnam Thmay Festival","html":"This holiday is the New Year festival in ancient calendar of Khmer people. Held in mid-April, the festival occurs in 3 days (4 days for the leap year). People prepare new clothes, food and drinks for whole festival days. They also repair, clean and decorate their house. Everyone is excited to care for holiday.<br><br>At night of New Year's Eve, every family prepares a lavish meal, burns incense and candles to welcome the new god, farewell the old god. On the altar, they present 5 flower branches, 5 candles, 5 incense, 5 cereal seeds and fruit crops. They pray for health and luck in the New Year.<br><br>On the first New Year - Chol Sangkran Chmay, major activities are bathing, dressing nice, bringing sacrifice gifts to the temple in good time which has been selected.<br><br>On Wonbof day - the second day, they make rice offerings and cover the sand mountain. People cook rice and bring it to the temple in the morning and the afternoon.<br><br>On Lom Sak day - the third day, they do Buddha bathing and monk-bathing ceremony. In the morning, people bring breakfast to monks and listen to the sermon. At noon, they burn the lamps, offer sacrifice gifts and bring fragrant water to bathe Buddha statues. After the ceremony at the temple, the monks go to the grave to pray for the souls of those who died.","vi":"Đây là lễ hội năm mới theo lịch cổ truyền của người Khmer. Được tổ chức vào giữa tháng 4, lễ hội diễn ra trong 3 ngày (4 ngày vào năm nhuận). Người dân chuẩn bị quần áo mới, thức ăn và đồ uống cho cả những ngày lễ hội. Họ cũng sửa sang, dọn dẹp và trang trí nhà cửa. Mọi người đều háo hức chuẩn bị cho ngày lễ.<br><br>Vào đêm giao thừa, mỗi gia đình chuẩn bị một bữa ăn thịnh soạn, đốt hương và nến để đón vị thần mới, tiễn vị thần cũ. Trên bàn thờ, họ bày 5 cành hoa, 5 cây nến, 5 nén hương, 5 loại hạt ngũ cốc và trái cây. Họ cầu nguyện cho sức khỏe và may mắn trong năm mới.<br><br>Vào ngày Tết đầu tiên - Chol Sangkran Chmay, các hoạt động chính là tắm rửa, ăn mặc đẹp, mang lễ vật đến chùa vào giờ tốt đã chọn.<br><br>Vào ngày Wonbof - ngày thứ hai, họ dâng cơm và đắp núi cát. Người dân nấu cơm và mang đến chùa vào buổi sáng và buổi chiều.<br><br>Vào ngày Lom Sak - ngày thứ ba, họ làm lễ tắm Phật và tắm sư. Buổi sáng, người dân mang đồ ăn sáng đến cho các nhà sư và nghe giảng đạo. Buổi trưa, họ thắp đèn, dâng lễ vật và mang nước thơm để tắm tượng Phật. Sau lễ ở chùa, các nhà sư đến mộ để cầu nguyện cho linh hồn người đã khuất."},"questions":[{"q":"1. What is the festival?","answer":"It is Chol Chnam Thmay Festival.","accepted":["it is chol chnam thmay festival"],"vi":"Câu hỏi: Lễ hội đó là gì? → Trả lời: Đó là lễ hội Chol Chnam Thmay."},{"q":"2. When is it held? And how long does it last?","answer":"It is held in mid-April, in 3 days (4 days for the leap year).","accepted":["it is held in mid-april in 3 days (4 days for the leap year)"],"vi":"Câu hỏi: Lễ hội được tổ chức khi nào? Kéo dài bao lâu? → Trả lời: Vào giữa tháng 4, kéo dài 3 ngày (4 ngày vào năm nhuận)."},{"q":"3. What do people prepare to celebrate the festival?","answer":"They prepare new clothes, food and drinks for whole festival days, and they also repair, clean and decorate their house.","accepted":["they prepare new clothes food and drinks for whole festival days and they also repair clean and decorate their house"],"vi":"Câu hỏi: Người dân chuẩn bị gì để đón lễ hội? → Trả lời: Quần áo mới, thức ăn, đồ uống, và sửa sang, dọn dẹp, trang trí nhà cửa."},{"q":"4. How do Khmer people prepare the altar at night of New Year's Eve?","answer":"On the altar, they present 5 flower branches, 5 candles, 5 incense, 5 cereal seeds and fruit crops.","accepted":["on the altar they present 5 flower branches 5 candles 5 incense 5 cereal seeds and fruit crops"],"vi":"Câu hỏi: Người Khmer chuẩn bị bàn thờ đêm giao thừa thế nào? → Trả lời: Bày 5 cành hoa, 5 cây nến, 5 nén hương, 5 loại hạt ngũ cốc và trái cây."},{"q":"5. What do people do on the first New Year Day?","answer":"Major activities are bathing, dressing nice, bringing sacrifice gifts to the temple in good time which has been selected.","accepted":["major activities are bathing dressing nice bringing sacrifice gifts to the temple in good time which has been selected"],"vi":"Câu hỏi: Người dân làm gì vào ngày Tết đầu tiên? → Trả lời: Tắm rửa, ăn mặc đẹp, mang lễ vật đến chùa vào giờ tốt đã chọn."},{"q":"6. When do people cook rice and bring it to the temple?","answer":"They cook rice and bring it to the temple on the second New Year day.","accepted":["they cook rice and bring it to the temple on the second new year day"],"vi":"Câu hỏi: Khi nào người dân nấu cơm mang đến chùa? → Trả lời: Vào ngày Tết thứ hai."},{"q":"7. When do they do Buddha bathing and monk-bathing ceremony?","answer":"They do Buddha bathing and monk-bathing ceremony on the third day.","accepted":["they do buddha bathing and monk-bathing ceremony on the third day"],"vi":"Câu hỏi: Khi nào họ làm lễ tắm Phật và tắm sư? → Trả lời: Vào ngày thứ ba."},{"q":"8. What do the monks do after doing Buddha bathing and monk-bathing ceremony?","answer":"They go to the grave to pray for the souls of those who died.","accepted":["they go to the grave to pray for the souls of those who died"],"vi":"Câu hỏi: Các nhà sư làm gì sau lễ tắm Phật và tắm sư? → Trả lời: Họ đến mộ để cầu nguyện cho linh hồn người đã khuất."}]},{"roman":"XIII","navLabel":"Viết câu ghép","icon":"link","title":"Nối hai câu đơn th n excellent recently. (but)","answer":"I should practice more for the competition but my health hasn't been excellent recently.","accepted":["i should practice more for the competition but my health hasn't been excellent recently"],"vi":"Tôi nên luyện tập nhiều hơn cho cuộc thi nhưng sức khỏe của tôi gần đây không được tốt lắm."},{"q":"8. You can go to the movies with me. You can go to the concert alone. (or)","answer":"You can go to the movies with me or you can go to the concert alone.","accepted":["you can go to the movies with me or you can go to the concert alone"],"vi":"Bạn có thể đi xem phim với tôi hoặc bạn có thể đi xem hòa nhạc một mình."}]},{"roman":"XIV","navLabel":"Viết câu phức","icon":"sitemap","title":"Nối câu bằng liên từ phụ thuộc thành câu phức","instructions":"Nối hai câu đơn thành một câu phức, dùng liên từ phụ thuộc phù hợp.","type":"sentence","instant":true,"questions":[{"q":"1. I'm going to the bank. I need some money.","answer":"I'm going to the bank because I need some money.","accepted":["i'm going to the bank because i need some money"],"vi":"Tôi đang đến ngân hàng vì tôi cần một ít tiền."},{"q":"2. I made lunch. I got home.","answer":"I made lunch when I got home.","accepted":["i made lunch when i got home"],"vi":"Tôi đã nấu bữa trưa khi tôi về đến nhà."},{"q":"3. It's raining. She's going for a walk in the park.","answer":"Although it's raining, she's going for a walk in the park.","accepted":["although it's raining she's going for a walk in the park"],"vi":"Mặc dù trời đang mưa, cô ấy vẫn đi dạo trong công viên."},{"q":"4. She finishes her homework soon. She will fail the class.","answer":"Unless she finishes her homework soon, she will fail the class.","accepted":["unless she finishes her homework soon she will fail the class"],"vi":"Trừ khi cô ấy làm xong bài tập sớm, cô ấy sẽ trượt môn học."},{"q":"5. He decided to trust Tim. He was an honest man.","answer":"He decided to trust Tim because he was an honest man.","accepted":["he decided to trust tim because he was an honest man"],"vi":"Anh ấy quyết định tin tưởng Tim vì anh ấy là một người trung thực."},{"q":"6. We went to school. She decided to investigate the situation.","answer":"When we went to school, she decided to investigate the situation.","accepted":["when we went to school she decided to investigate the situation"],"vi":"Khi chúng tôi đến trường, cô ấy quyết định điều tra tình huống đó."},{"q":"7. Jennifer decided to leave Tom. He was too worried about his job.","answer":"Jennifer decided to leave Tom because he was too worried about his job.","accepted":["jennifer decided to leave tom because he was too worried about his job"],"vi":"Jennifer quyết định rời bỏ Tom vì anh ấy quá lo lắng về công việc của mình."},{"q":"8. Dennis bought a new jacket. He had received one as a gift last week.","answer":"Dennis bought a new jacket although he had received one as a gift last week.","accepted":["dennis bought a new jacket although he had received one as a gift last week"],"vi":"Dennis đã mua một chiếc áo khoác mới mặc dù anh ấy đã nhận được một chiếc làm quà tuần trước."},{"q":"9. Brandley claims that there will be trouble. He doesn't complete the job.","answer":"Brandley claims that there will be trouble if he doesn't complete the job.","accepted":["brandley claims that there will be trouble if he doesn't complete the job"],"vi":"Brandley khẳng định sẽ có rắc rối nếu anh ấy không hoàn thành công việc."},{"q":"10. Janice will have finished the report. The time you receive the letter.","answer":"Janice will have finished the report by the time you receive the letter.","accepted":["janice will have finished the report by the time you receive the letter"],"vi":"Janice sẽ hoàn thành báo cáo trước khi bạn nhận được lá thư."}]},{"roman":"XV","navLabel":"Sắp xếp câu","icon":"puzzle-piece","title":"Sắp xếp từ/cụm từ thành câu hoàn chỉnh","instructions":"Dùng các từ gợi ý để viết thành câu hoàn chỉnh (có thể thêm từ hoặc thay đổi cho phù hợp).","type" NTENCES &amp; CONJUNCTIONS <span class="text-sm font-semibold text-slate-500">(Các loại câu &amp; Liên từ)</span></h3>

  <div class="theory-card bg-white rounded-xl p-4 mb-3" style="border-left-color:#f59e0b;box-shadow:0 2px 8px rgba(0,0,0,.05)">
    <h4 class="font-extrabold text-amber-600 mb-2"><i class="fa-solid fa-circle-info mr-2 text-amber-500"></i>I. SIMPLE SENTENCES <span class="text-sm font-semibold text-slate-500">(Câu đơn)</span></h4>
    <p class="text-sm text-slate-600 mb-2">Câu đơn là loại câu đơn giản nhất trong tiếng Anh. Câu đơn chỉ bao gồm một mệnh đề độc lập, được dùng để miêu tả một sự vật, hiện tượng, ý tưởng hoặc đưa ra nghi vấn, thắc mắc.</p>
    <ul class="text-sm text-slate-700 space-y-2 list-disc pl-5">
      <li>Câu đơn giản là một câu chỉ chứa 1 mệnh đề gồm chủ ngữ và vị ngữ.<br><i>Learning English is important nowadays.</i> <span class="text-slate-400">(Ngày nay việc học tiếng Anh rất quan trọng.)</span></li>
      <li>Một câu đơn có thể có nhiều hơn một chủ ngữ.<br><i>Mary and Tom are playing tennis.</i> <span class="text-slate-400">(Mary và Tom đang chơi tennis.)</span></li>
      <li>Một câu đơn có thể có nhiều động từ.<br><i>I play some video games and learn English on my computer.</i> <span class="text-slate-400">(Tôi chơi game và học tiếng Anh trên máy tính.)</span></li>
      <li>Một câu đơn có thể có 2 chủ ngữ và 2 động từ.<br><i>My sister and I play some video games and learn English on our computer.</i> <span class="text-slate-400">(Chị tôi và tôi chơi game và học tiếng Anh trên máy tính.)</span></li>
    </ul>
  </div>

  <div class="theory-card bg-white rounded-xl p-4 mb-3" style="border-left-color:#ec4899;box-shadow:0 2px 8px rgba(0,0,0,.05)">
    <h4 class="font-extrabold text-pink-600 mb-2"><i class="fa-solid fa-link mr-2"></i>II. COMPOUND SENTENCES <span class="text-sm font-semibold text-slate-500">(Câu ghép)</span></h4>
    <p class="text-sm text-slate-600 mb-2">Là câu chứa từ hai mệnh đề độc lập trở lên, diễn tả các ý chính có tầm quan trọng ngang nhau. Chúng ta sử dụng các cách sau để nối hai mệnh đề:</p>
    <div class="space-y-2 text-sm text-slate-700">
      <div class="bg-pink-50 border border-pink-200 rounded-lg p-3"><b class="text-pink-700">Sử dụng dấu chấm phẩy (;)</b><br><i>I met David yesterday; he's just come out of hospital.</i> <span class="text-slate-400">(Hôm qua tôi gặp David; anh ta vừa ra khỏi bệnh viện.)</span></div>
      <div class="bg-white border border-pink-200 rounded-lg p-3"><b class="text-pink-700">Sử dụng dấu phẩy và một liên từ đẳng lập</b><br><i>He loves her but she doesn't love him.</i> <span class="text-slate-400">(Anh ấy yêu cô ấy, nhưng cô ấy thì không.)</span><br><i>We missed the bus, so we came to work late.</i> <span class="text-slate-400">(Chúng tôi lỡ chuyến xe, vì vậy chúng tôi đi làm muộn.)</span></div>
      <div class="bg-pink-50 border border-pink-200 rounded-lg p-3"><b class="text-pink-700">Sử dụng dấu chấm phẩy và một liên từ trạng từ (however, therefore, nevertheless…) theo sau là dấu phẩy</b><br><i>Peter didn't study; therefore, he failed the test.</i> <span class="text-slate-400">(Peter đã không học bài. Do đó cậu ấy thi trượt.)</span></div>
    </div>
  </div>

function normalize(str){
  return (str||'').trim().toLowerCase()
    .replace(/[‘’]/g,"'")
    .replace(/["“”]/g,'')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ');
}
function widthFor(ref){ const l=(ref||'').length; return l<7?'w-32':l<16?'w-40':'w-full'; }

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)){ alert('Trình duyệt của bạn không hỗ trợ phát âm tự động. Hãy thử Chrome, Edge hoặc Safari.'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>btn.classList.remove('speaking'); u.onerror=()=>btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function renderDict(d, idx){
  if(!d) return '';

function renderBank(bank, idx, clickable){
  if(!bank || !bank.length) return '';
  const hint = clickable ? ' <span class="normal-case font-normal text-slate-400">(bấm để điền)</span>' : '';
  return `<div class="mb-4"><p class="text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide"><i class="fa-solid fa-list-ul mr-1"></i>Liên từ cho sẵn${hint}</p>
    <div class="grid grid-cols-2 sm:grid-cols-5 border-2 border-slate-800 rounded-lg overflow-hidden text-sm font-bold text-slate-800">
      ${bank.map((w,bi)=>clickable
        ? `<div class="bank-chip px-3 py-2 text-center border border-slate-300 bg-white" id="bankchip_${idx}_${bi}" onclick="fillFromBank(${idx},${bi})">${w}</div>`
        : `<div class="px-3 py-2 text-center border border-slate-300 bg-white">${w}</div>`
      ).join('')}
    </div>
  </div>`;
}
function fillFromBank(idx, bi){
  const chip = document.getElementById(`bankchip_${idx}_${bi}`);
  if(!chip || chip.classList.contains('used')) return;
  const word = DATA.sections[idx].bank[bi];
  const inputs = Array.from(document.querySelectorAll(`#tab-${idx} input.answer-input[id^="inp_${idx}_"]`));
  const target = inputs.find(inp => inp.value.trim()==='');
  if(!target) return;
  target.value = word;
  target.dataset.bankChip = bi;
  chip.classList.add('used');
}
function releaseBankChipIfChanged(idx,i){
  const inp=document.getElementById(`inp_${idx}_${i}`);
  if(!inp || inp.dataset.bankChip===undefined) return;
  const bi=inp.dataset.bankChip;
  delete inp.dataset.bankChip;
  const chip=document.getElementById(`bankchip_${idx}_${bi}`);
  if(chip) chip.classList.remove('used');
}
