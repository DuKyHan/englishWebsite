<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{
    --green:#58cc02; --green-dark:#4aa302; --blue:#1cb0f6; --accent:#b91c1c; --accent-dark:#7f1d1d;

  .footer-bar{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:#fff; border-top:2px solid #e5e5e5; padding: .8rem 1rem calc(.8rem + env(safe-area-inset-bottom)); }

  .btn3d{ border-bottom:4px solid; transition: transform .06s, border-bottom-width .06s; cursor:pointer; }
  .btn3d:active{ transform: translateY(3px); border-bottom-width:1px; }
  .btn-green{ background:var(--green); border-color:var(--green-dark); color:#fff; }
  .btn-green:disabled{ background:#e5e5e5; border-color:#d0d0d0; color:#afafaf; cursor:not-allowed; }
  .btn-accent{ background:var(--accent); border-color:var(--accent-dark); color:#fff; }
  .btn-white{ background:#fff; border-color:#e5e5e5; color:#4b4b4b; }
  .btn-red{ background:#fff; border-color:#e5e5e5; color:var(--red); }

  .group-label{ max-width:480px; margin:1.6rem auto .4rem; padding:0 1rem; font-weight:900; font-size:.78rem; letter-spacing:.04em; color:var(--accent-dark); text-transform:uppercase; display:flex; align-items:center; gap:.5rem; }
  .group-label::after{ content:''; flex:1; height:2px; background:#fde3d0; }

  .path-wrap{ max-width:480px; margin:0 auto; padding: 1rem 1rem 2rem; position:relative; }
  .stage-node{ width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; border-bottom:6px solid; position:relative; transition:transform .15s; flex-shrink:0; }
  .stage-node:active{ transform: scale(.94); }
  .stage-node.status-mastered{ background:var(--gold); border-color:var(--gold-dark); }
  .stage-node.status-in_progress{ background:var(--accent); border-color:var(--accent-dark); }
  .stage-node.status-needs_practice{ background:var(--red); border-color:#c53030; }
  .stage-node.status-not_started{ background:#fff; border-color:#e5e5e5; color:#afafaf; }
  .stage-row{ display:flex; align-items:center; gap:1rem; margin-bottom:2.2rem; }
  .stage-row.right{ flex-direction:row-reverse; }
  .status-dot{ position:absolute; bottom:-6px; right:-6px; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.75rem; background:#fff; border:2px solid #e5e5e5; }

  .opt-card{ border:2px solid #e5e5e5; border-bottom-width:4px; border-radius:1rem; padding:.9rem 1rem; cursor:pointer; transition: all .12s; font-weight:800; }
  .opt-card:active{ transform: translateY(2px); }
  .opt-card.selected{ border-color:var(--blue); background:#ddf4ff; }
  .opt-card.correct{ border-color:var(--green-dark); background:#d7ffb8; color:#4b4b4b; }
  .opt-card.wrong{ border-color:#c53030; background:#ffdfe0; color:#4b4b4b; }
  .opt-card.dim{ opacity:.5; }

  .xp-pill{ background:rgba(255,255,255,.18); border:2px solid #ffe08a; color:#fff; border-radius:999px; padding:.15rem .7rem; font-weight:900; font-size:.8rem; }
  .streak-pill{ background:rgba(255,255,255,.18); border:2px solid #fff; color:#fff; border-radius:999px; padding:.15rem .7rem; font-weight:900; font-size:.8rem; }
  .progress-track{ background:#e5e5e5; border-radius:999px; height:14px; overflow:hidden; }
  .progress-track.on-dark{ background:rgba(255,255,255,.25); }
  .progress-fill{ background:var(--accent); height:100%; transition: width .4s ease; }
  .progress-fill.on-dark{ background:#ffe08a; }
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }
  .pop-in{ animation: popIn .3s cubic-bezier(.36,1.6,.6,1) forwards; }

  .screen{ display:none; }

  .badge-chip{ background:#fff; border:2px solid var(--gold); border-radius:1rem; padding:.6rem; text-align:center; }
  .passage-toggle-box{ background:#fff7ed; border:2px solid #fed7aa; border-radius:1rem; padding:.8rem 1rem; margin-bottom:1rem; font-size:.92rem; line-height:1.8; }
  .passage-vi-box{ background:#fefce8; border:2px solid #fde68a; border-radius:1rem; padding:.8rem 1rem; margin-top:.5rem; font-size:.92rem; line-height:1.8; display:none; }
  .passage-vi-box.show{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }

const PASSAGES = {
  tet_coming: {
    id:"tet_coming", title:"Tet is Coming! (Getting Started)",
    html:"<b>Elena:</b> Hi Trang! I heard Tet is coming soon. What are people busy doing these days?<br><b>Trang:</b> Yes, Tet is our biggest festival! Families are busy shopping for flowers and decorations.<br><b>Elena:</b> I saw so many beautiful flowers at the market. Where do all these flowers come from?<br><b>Trang:</b> Many of them come from Sa Dec Flower Village in Dong Thap. It's famous for growing all kinds of ornamental flowers, especially chrysanthemums and marigolds.<br><b>Elena:</b> Wow! What about those peach blossom trees and kumquat trees I keep seeing everywhere?<br><b>Trang:</b> Ah, those mostly come from Nhat Tan Village in Ha Noi. It's well-known for its beautiful peach blossoms, while kumquat trees usually come from the Tu Lien area nearby.<br><b>Elena:</b> I also saw some villagers putting up a tall bamboo pole in front of the communal house. What's that for?<br><b>Trang:</b> That's called 'cay neu', a bamboo pole. People erect it in front of the dinh, or communal house, to ward off evil spirits and welcome good luck for the new year.<br><b>Elena:</b> That's fascinating! I can't wait to see more Tet customs.",
    vi:"<b>Elena:</b> Chào Trang! Mình nghe nói Tết sắp đến rồi. Mọi người đang bận rộn làm gì vậy?<br><b>Trang:</b> Đúng vậy, Tết là lễ hội lớn nhất của chúng mình! Các gia đình đang bận đi mua hoa và đồ trang trí.<br><b>Elena:</b> Mình thấy rất nhiều hoa đẹp ở chợ. Những bông hoa này đến từ đâu vậy?<br><b>Trang:</b> Nhiều loại đến từ Làng hoa Sa Đéc ở Đồng Tháp. Nơi đó nổi tiếng trồng đủ loại hoa cảnh, đặc biệt là hoa cúc và hoa vạn thọ.<br><b>Elena:</b> Ồ! Thế còn những cây đào và cây quất mình thấy khắp nơi thì sao?<br><b>Trang:</b> À, phần lớn đến từ làng Nhật Tân ở Hà Nội. Nơi đó nổi tiếng với hoa đào đẹp, còn cây quất thường đến từ khu vực Tứ Liên gần đó.<br><b>Elena:</b> Mình cũng thấy vài người dân dựng một cây tre cao trước đình làng. Đó là để làm gì vậy?<br><b>Trang:</b> Đó gọi là 'cây nêu'. Người ta dựng nó trước đình làng để xua đuổi tà ma và đón may mắn cho năm mới.<br><b>Elena:</b> Thú vị quá! Mình không thể chờ để xem thêm các phong tục ngày Tết."
  },
  village_festival: {
    id:"village_festival", title:"A Village Festival Day (Skills 1 - Reading)",
    html:"Every summer, my village by the Red River holds an exciting festival called 'A Village Festival Day'. The festival begins early in the morning with a boat race. Teams of young men from different hamlets row their long wooden boats as fast as they can, while villagers stand along the riverbank, cheering loudly for their favourite team. After the boat race, everyone gathers for the most popular event of the day: duck-catching. Live ducks are released into a pond, and competitors jump in to try to catch them with their bare hands. It is great fun to watch people slipping and splashing in the muddy water! In the afternoon, there are folk games, singing performances, and food stalls selling local specialities. By the end of the day, everyone goes home tired but happy, already looking forward to next year's festival.",
    vi:"Mỗi mùa hè, làng tôi bên sông Hồng lại tổ chức một lễ hội thú vị mang tên 'Ngày hội làng'. Lễ hội bắt đầu từ sáng sớm với cuộc đua thuyền. Các đội thanh niên từ những xóm khác nhau chèo những chiếc thuyền gỗ dài thật nhanh, trong khi dân làng đứng dọc bờ sông reo hò cổ vũ cho đội mình yêu thích. Sau cuộc đua thuyền, mọi người tập trung lại để xem hoạt động được yêu thích nhất trong ngày: bắt vịt. Những con vịt sống được thả xuống ao, và người chơi nhảy xuống cố bắt chúng bằng tay không. Thật vui khi xem mọi người trượt ngã và té nước trong bùn lầy! Buổi chiều có các trò chơi dân gian, tiết mục ca hát và các quầy hàng bán đặc sản địa phương. Đến cuối ngày, ai nấy đều về nhà mệt nhưng vui, và đã mong chờ lễ hội năm sau."
  },
  ok_om_bok: {
    id:"ok_om_bok", title:"Ok Om Bok - the Moon Worshipping Festival (Skills 2 - Listening)",
    html:"Ok Om Bok, also known as the Moon Worshipping Festival, is one of the most important festivals of the Khmer people in the Mekong Delta. It usually takes place in November, at the end of the harvest season. On the night of the festival, families prepare a tray of rice flakes, fruit, and cakes, and set it under the moonlight to thank the Moon God for a good harvest. Children sit around the tray and are fed rice flakes by the elders while making wishes for good luck. The festival also features exciting boat races, known as Ngo boat races, along the river, as well as lantern releasing and traditional Khmer folk performances.",
    vi:"Ok Om Bok, hay còn gọi là Lễ hội Cúng Trăng, là một trong những lễ hội quan trọng nhất của người Khmer ở đồng bằng sông Cửu Long. Lễ hội thường diễn ra vào tháng Mười Một, khi mùa thu hoạch kết thúc. Vào đêm lễ hội, các gia đình chuẩn bị một mâm cốm dẹp, trái cây và bánh, đặt dưới ánh trăng để tạ ơn Thần Mặt Trăng đã cho một vụ mùa bội thu. Trẻ em ngồi quanh mâm lễ và được người lớn đút cốm dẹp trong khi cầu mong những điều may mắn. Lễ hội còn có các cuộc đua ghe Ngo sôi động trên sông, cùng với thả đèn và các tiết mục văn nghệ dân gian Khmer truyền thống."
  },
  longevity: {
    id:"longevity", title:"A Longevity Celebration (SBT Reading D2)",
    html:"On the fifth day of Tet, Binh An Village holds a longevity celebration for elderly people over 70. This tradition has continued for centuries in the village. In the morning, everyone dresses nicely and walks to the village temple. According to tradition, the elderly wear traditional ao dai. They sit at the most honourable place. The village leaders congratulate them. They offer each elder a 'longevity flag' and a bunch of flowers. Then, each family takes photographs with their elders. At noon, families hold a home party for their elders. It is customary for the family members to cook for their elders. The traditional dishes served are five-colour sticky rice, steamed chicken, spring rolls, and deep-fried fish.",
    vi:"Vào ngày mùng 5 Tết, làng Bình An tổ chức lễ mừng thọ cho những người trên 70 tuổi. Truyền thống này đã được duy trì qua nhiều thế kỷ. Buổi sáng, mọi người ăn mặc chỉnh tề và đi bộ đến đình làng. Theo truyền thống, người cao tuổi mặc áo dài. Họ ngồi ở vị trí trang trọng nhất. Các vị lãnh đạo làng chúc mừng họ. Họ tặng mỗi cụ một 'lá cờ trường thọ' và một bó hoa. Sau đó, mỗi gia đình chụp ảnh cùng người cao tuổi của mình. Buổi trưa, các gia đình tổ chức tiệc tại nhà cho người cao tuổi. Theo phong tục, con cháu trong gia đình sẽ nấu ăn cho các cụ. Các món ăn truyền thống gồm xôi ngũ sắc, gà luộc, nem cuốn và cá rán."
  },
  british: {
    id:"british", title:"Popular Traditions in Britain (SBT Reading D3)",
    html:"When one thinks of the British, one often imagines people drinking tea and eating fish and chips. But there are many other traditions that British people have maintained for centuries. Pancake Day is also called Shrove Tuesday, and it is a day people make pancakes. They hold a pancake race. Runners wear a traditional apron and scarf and carry a pan with a pancake in it. They have to flip the pancake as they run. Christmas is on 25th December, but people prepare for it long before the event. Christmas trees are everywhere. People decorate the trees and place gifts under them. They cook traditional foods, wear their best clothes, and have family reunions. On New Year's Eve, crowds gather at Trafalgar Square or Piccadilly Circus to wait for the start of the new year. At midnight, there is a huge fireworks celebration over the London Eye, followed by Big Ben ringing in the New Year.",
    vi:"Khi nghĩ về người Anh, ta thường hình dung cảnh họ uống trà và ăn cá tẩm bột chiên khoai tây (fish and chips). Nhưng còn nhiều truyền thống khác mà người Anh đã gìn giữ qua nhiều thế kỷ. Ngày Pancake còn gọi là Shrove Tuesday, là ngày người ta làm bánh kếp. Họ tổ chức cuộc đua bánh kếp: người chạy mặc tạp dề và khăn quàng truyền thống, cầm chảo có bánh kếp bên trong và phải lật bánh khi chạy. Giáng sinh diễn ra ngày 25/12 nhưng người ta chuẩn bị từ rất lâu trước đó: cây thông xuất hiện khắp nơi, được trang trí và đặt quà bên dưới; người ta nấu món truyền thống, mặc đẹp và sum họp gia đình. Vào đêm Giao thừa, đám đông tụ tập ở Quảng trường Trafalgar hoặc Piccadilly Circus chờ đón năm mới. Đúng nửa đêm có màn bắn pháo hoa trên khu vực London Eye, tiếp theo là tiếng chuông Big Ben điểm giờ."
  },
  kate: {
    id:"kate", title:"The Kate Festival (SBT Reading D1)",
    html:"The Kate Festival is the most important festival of the Cham in Viet Nam. It is held for three days at the beginning of October. The main ceremony takes place in Po Rome, Po Nagar, and Po Klong Garai towers in Ninh Thuan Province. The festival helps people remember Cham heroes and worship their ancestors. It is also a time for people to relax, visit each other, and wish others good luck. For festival goers, it is a great opportunity to experience the beauty in the Cham culture. The ceremony starts with people calling their ancestors and gods. Then, they pray for health and prosperity. The festival follows with traditional music and dance performances. The festival is full of sounds and colours, and is a wonderful time for both the locals and visitors.",
    vi:"Lễ hội Katê là lễ hội quan trọng nhất của người Chăm ở Việt Nam. Lễ hội diễn ra trong ba ngày vào đầu tháng Mười. Lễ chính được tổ chức tại các tháp Po Rome, Po Nagar và Po Klong Garai ở tỉnh Ninh Thuận. Lễ hội giúp người dân tưởng nhớ các anh hùng người Chăm và thờ cúng tổ tiên của họ. Đây cũng là dịp để mọi người nghỉ ngơi, thăm hỏi nhau và chúc nhau may mắn. Đối với người tham dự, đây là cơ hội tuyệt vời để trải nghiệm vẻ đẹp của văn hóa Chăm. Buổi lễ bắt đầu bằng việc mọi người khấn gọi tổ tiên và các vị thần. Sau đó, họ cầu sức khỏe và thịnh vượng. Lễ hội tiếp nối bằng các tiết mục âm nhạc và múa truyền thống. Lễ hội tràn ngập âm thanh và màu sắc, là khoảng thời gian tuyệt vời cho cả người dân địa phương và du khách."
  }
};

/* ---------------- Utility ---------------- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }

/* ---------------- Speech (iOS-safe) ---------------- */
let cachedVoices=[]; let voicesReady=false;
if('speechSynthesis' in window){
  const refresh=()=>{ cachedVoices=window.speechSynthesis.getVoices()||[]; if(cachedVoices.length) voicesReady=true; };
  window.speechSynthesis.onvoiceschanged=refresh; refresh();
  let tries=0; const t=setInterval(()=>{ refresh(); tries++; if(voicesReady||tries>10) clearInterval(t); },300);
}
function pickEnVoice(){
  const voices = cachedVoices.length?cachedVoices:(window.speechSynthesis.getVoices()||[]);
  return voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)) || null;
}
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-US'; u.rate=0.92; u.pitch=1; u.volume=1;
      const en=pickEnVoice(); if(en) u.voice=en;
      if(btn){ btn.classList.add('speaking'); const stop=()=>btn.classList.remove('speaking'); u.onend=stop; u.onerror=stop; }
      window.speechSynthesis.speak(u);
    },60);
  }catch(e){}
}

  s2: {icon:'🧩', label:'Cao thủ mạo từ'},
  s3: {icon:'📖', label:'Mọt sách SGK'},
  s4: {icon:'📕', label:'Mọt sách SBT'},
  s5: {icon:'🏆', label:'Nhà vô địch Unit 5'},
  mistake_fixer: {icon:'🔥', label:'Người sửa lỗi'},
  unit_master: {icon:'⭐', label:'Bậc thầy Unit 5'},
};
function awardBadge(key){
  if(!state.progress.badges.includes(key)){ state.progress.badges.push(key); return true; }
  return false;
}

/* ---------------- Session builders ---------------- */
function buildPoolSession(stageDef){
  let pool=[];
  stageDef.categories.forEach(c=>pool=pool.concat(itemsForCategory(c)));
  return sample(pool, stageDef.count);
}
function buildMixedSession(stageDef){
  const perCat = Math.ceil(stageDef.count / stageDef.categories.length);
  let pool=[];
  stageDef.categories.forEach(c=> pool=pool.concat(sample(itemsForCategory(c), perCat)) );
  return shuffle(pool).slice(0, stageDef.count);
}
function buildMistakeSession(){
  const ids = Object.keys(state.progress.mistakes).filter(id=> ITEM_BANK[id] && state.progress.mistakes[id].box < 3);
  return shuffle(ids.map(id=>ITEM_BANK[id]));
}
function withIntroCards(items){
  const seen=new Set(); const intros=[];
  items.forEach(it=>{
    if(it.passageId && !seen.has(it.passageId)){
      seen.add(it.passageId);
      const p = PASSAGES[it.passageId];
      if(p) intros.push({ id:'intro_'+it.passageId, type:'intro', passage:p });
    }
  });
  return intros.concat(items);
}

/* ---------------- STAGE SESSION START ---------------- */
function startStage(key){
  const def = STAGE_DEFS.find(s=>s.key===key);
  let items=[];
  if(def.kind==='reading'){
    items = withIntroCards(buildPoolSession(def));
  } else if(def.kind==='mixed'){
    items = buildMixedSession(def);
  } else if(def.kind==='mistakes'){
    items = buildMistakeSession();
  } else {
    items = buildPoolSession(def);
  }
  if(def.kind==='mistakes' && items.length===0){
    alert('🎉 Tuyệt vời! Bạn hiện không có câu nào cần sửa lỗi. Hãy tiếp tục luyện tập các phần khác nhé!');
    return;
  }
  state.session = { stageKey:key, items, idx:0, correct:0, wrong:0, streak:0, xpEarned:0,
    catStats:{}, isMistakeMode: def.kind==='mistakes', mistakesFixed:0 };
  state.answered=false; state.selection=null;
  state.screen='player';
  render();
}

/* ---------------- PLAYER ---------------- */
function currentItem(){ return state.session ? state.session.items[state.session.idx] : null; }

function render(){
  const app=document.getElementById('app');
  if(state.screen==='home') app.innerHTML = renderHome();
  else if(state.screen==='player') app.innerHTML = renderPlayer();
  else if(state.screen==='summary') app.innerHTML = renderSummary();
  else if(state.screen==='mastery') app.innerHTML = renderMastery();
  window.scrollTo({top:0});
}

/* ---------------- HOME ---------------- */
function stageIcon(status){
  if(status==='mastered') return '⭐';
  if(status==='in_progress') return '🕓';
  if(status==='needs_practice') return '❗';
  return '';
}
function renderHome(){
  const p=state.progress;
  let lastGroup=null;
  const rows = STAGE_DEFS.map((s,i)=>{
    const st = p.stages[s.key];
    const dot = stageIcon(st.status);
    const align = i%2===0 ? '' : 'right';
    let groupHtml='';
    if(s.groupLabel && s.groupLabel!==lastGroup){ groupHtml = `<div class="group-label">${s.groupLabel}</div>`; lastGroup=s.groupLabel; }
    return `${groupHtml}<div class="stage-row ${align}">
      <button onclick="startStage('${s.key}')" class="stage-node status-${st.status} tappable">
        <span>${s.icon}</span>
        ${dot?`<span class="status-dot">${dot}</span>`:''}
      </button>
      <div class="flex-1">
        <p class="font-extrabold text-sm text-slate-700">${s.title}</p>
        <p class="text-[11px] text-slate-400">${s.subtitle||''}</p>
        <p class="text-xs text-slate-400">${st.attempts>0 ? `Độ chính xác tốt nhất: ${st.bestAccuracy}%` : 'Chưa bắt đầu'}</p>
      </div>
    </div>`;
  }).join('');

  const badgeChips = p.badges.map(k=>{
    const b=BADGE_DEFS[k]; if(!b) return '';
    return `<div class="badge-chip"><div class="text-2xl">${b.icon}</div><div class="text-[10px] font-bold text-amber-700 mt-1">${b.label}</div></div>`;
  }).join('');

  return `
  <div class="topbar flex items-center justify-between">
    <div>
      <h1 class="font-baloo text-lg font-extrabold">🏮 Unit 5 Quest</h1>
      <p class="text-[11px] opacity-80 -mt-1">Customs and Traditions · Ôn tập tương tác</p>
    </div>
    <div class="flex items-center gap-2">
      <span class="xp-pill"><i class="fa-solid fa-bolt mr-1"></i>${p.xp} XP</span>
      <span class="streak-pill"><i class="fa-solid fa-fire mr-1"></i>${p.bestStreak}</span>
    </div>
  </div>
  <div class="path-wrap">
    ${rows}
  </div>
  ${p.badges.length?`<div class="max-w-md mx-auto px-4 pb-4"><p class="text-xs font-black text-slate-400 uppercase mb-2">Huy hiệu đã đạt</p><div class="grid grid-cols-4 gap-2">${badgeChips}</div></div>`:''}
  <div class="max-w-md mx-auto px-4 pb-10 text-center">
    <button onclick="confirmReset()" class="text-xs text-slate-400 underline">🔄 Đặt lại tiến trình học tập</button>
  </div>`;
}

function confirmReset(){
  if(confirm('Bạn có chắc muốn xoá toàn bộ tiến trình (XP, sao, lỗi sai đã lưu)? Hành động này không thể hoàn tác.')){
    resetProgress();
  }
}

function renderPlayer(){
  const s=state.session; const item=currentItem();
  const total=s.items.length;
  const pct = Math.round((s.idx/total)*100);
  return `
  <div class="topbar">
    <div class="flex items-center gap-3 max-w-xl mx-auto">
      <button onclick="exitPlayer()" class="text-xl"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex-1 progress-track on-dark"><div class="progress-fill on-dark" style="width:${pct}%"></div></div>
      <span class="streak-pill text-xs"><i class="fa-solid fa-fire mr-1"></i>${s.streak}</span>
    </div>
  </div>
  <div class="max-w-xl mx-auto px-4 py-6" id="cardArea">
    ${renderQuestionCard(item)}
  </div>
  <div class="footer-bar" id="footerArea">
    ${renderFooter(item)}
  </div>`;
}

function passageToggleBlock(passageId, uniq){
  const p = PASSAGES[passageId];
  if(!p) return '';
  const viBtn = p.vi ? `<button type="button" onclick="document.getElementById('pgvi_${uniq}').classList.toggle('show')" class="text-xs font-bold bg-white border-2 border-amber-200 text-amber-700 px-3 py-1.5 rounded-full ml-2">
      <i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt
    </button>` : '';
  const viBox = p.vi ? `<div id="pgvi_${uniq}" class="passage-vi-box"><b>🇻🇳 Bản dịch</b><br>${p.vi}</div>` : '';
  return `<div class="mb-3">
    <button type="button" onclick="document.getElementById('pg_${uniq}').classList.toggle('hidden')" class="text-xs font-bold bg-white border-2 border-red-200 text-red-700 px-3 py-1.5 rounded-full">
      <i class="fa-solid fa-book-open mr-1"></i>Xem lại đoạn văn
    </button>${viBtn}
    <div id="pg_${uniq}" class="passage-toggle-box hidden mt-2"><b>${p.title}</b><br>${p.html}</div>
    ${viBox}
  </div>`;
}

function renderQuestionCard(item){
  if(item.type==='intro') return renderIntroCard(item);
  const uniq = item.id;
  let body='';
  const opts = item.type==='tf' ? ['True','False'] : item.options;
  body = `<div class="grid gap-2 mt-4">${opts.map((o,i)=>{
    let cls='opt-card';
    if(state.answered){
      if(i===item.answer) cls+=' correct';
      else if(i===state.selection) cls+=' wrong';
      else cls+=' dim';
    } else if(state.selection===i){ cls+=' selected'; }
    const label = item.type==='tf' ? (i===0?'✅ True':'❌ False') : `<span class="text-red-500">${['A','B','C','D'][i]}.</span> ${o}`;
    return `<div class="${cls}" onclick="${state.answered?'':'selectOption('+i+')'}">${label}</div>`;
  }).join('')}</div>`;
  const passageBlock = item.passageId ? passageToggleBlock(item.passageId, uniq) : '';
  const catTag = {vocab:'📚 Từ vựng', grammar:'🧩 Ngữ pháp (Mạo từ)', reading_sgk:'📖 Đọc hiểu SGK', reading_sbt:'📕 Đọc hiểu SBT'}[item.category] || '';
  return `
    <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-1">${catTag}</p>
    ${passageBlock}
    <p class="text-lg font-extrabold text-slate-800 leading-snug">${item.q}
      <button type="button" onclick="event.stopPropagation();speak('${item.q.replace(/<[^>]+>/g,'').replace(/'/g,"\\'")}', this)" class="speak-btn inline-flex w-7 h-7 rounded-full bg-red-100 text-red-700 items-center justify-center align-middle ml-1"><i class="fa-solid fa-volume-high text-xs"></i></button>
    </p>
    ${body}
  `;
}

function renderIntroCard(item){
  const p = item.passage;
  const viBtn = p.vi ? `<button type="button" onclick="document.getElementById('introvi_${p.id}').classList.toggle('show')" class="text-xs font-bold bg-white border-2 border-amber-200 text-amber-700 px-3 py-1.5 rounded-full mb-2">
      <i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt
    </button>` : '';
  const viBox = p.vi ? `<div id="introvi_${p.id}" class="passage-vi-box"><b>🇻🇳 Bản dịch</b><br>${p.vi}</div>` : '';
  return `<p class="text-xs font-black uppercase tracking-wide text-red-400 mb-2"><i class="fa-solid fa-book-open mr-1"></i>Đọc trước khi luyện tập</p>
  <div class="passage-toggle-box"><b>${p.title}</b>
    <button type="button" onclick="event.stopPropagation();speak('${p.html.replace(/<[^>]+>/g,' ').replace(/'/g,"\\'")}', this)" class="speak-btn inline-flex w-7 h-7 rounded-full bg-red-100 text-red-700 items-center justify-center align-middle ml-1"><i class="fa-solid fa-volume-high text-xs"></i></button>
    <br>${p.html}</div>
  <div class="mt-2">${viBtn}${viBox}</div>`;
}

/* ---------------- FOOTER / ANSWER CHECKING ---------------- */
function renderFooter(item){
  if(item.type==='intro'){
    return `<button onclick="continueNext()" class="btn3d btn-green w-full max-w-xl mx-auto block py-3 rounded-2xl font-black text-lg"><i class="fa-solid fa-arrow-right mr-1"></i>Bắt đầu luyện tập</button>`;
  }
  if(!state.answered){
    const canCheck = state.selection!==null && state.selection!==undefined;
    return `<button onclick="checkAnswer()" class="btn3d btn-green w-full max-w-xl mx-auto block py-3 rounded-2xl font-black text-lg" ${canCheck?'':'disabled'}><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>`;
  } else {
    const ok = state.selection===item.answer;
    const cont = `<button onclick="continueNext()" class="btn3d ${ok?'btn-green':'btn-accent'} w-full max-w-xl mx-auto block py-3 rounded-2xl font-black text-lg">Tiếp tục <i class="fa-solid fa-arrow-right ml-1"></i></button>`;
    const exp = item.explanation ? `<p class="text-sm ${ok?'text-emerald-700':'text-rose-600'} font-bold mb-1">${ok?'✅ Chính xác!':'❌ Chưa đúng.'} ${item.explanation}</p>` : `<p class="text-sm ${ok?'text-emerald-700':'text-rose-600'} font-bold mb-1">${ok?'✅ Chính xác!':'❌ Chưa đúng.'}</p>`;
    const viLine = item.vi ? `<p class="text-xs text-slate-400 italic mb-2">${item.vi}</p>` : '';
    return `<div class="max-w-xl mx-auto"><div class="${ok?'text-emerald-700':'text-rose-600'}">${exp}${viLine}</div>${cont}</div>`;
  }
}

function selectOption(i){ if(state.answered) return; state.selection=i; render(); }

function checkAnswer(){
  const item=currentItem();
  const ok = state.selection===item.answer;
  state.answered=true;
  finalizeAnswer(item, ok);
  render();
}

function finalizeAnswer(item, ok){
  const s=state.session;
  if(ok){ s.correct++; s.streak++; if(s.streak>state.progress.bestStreak) state.progress.bestStreak=s.streak; }
  else { s.wrong++; s.streak=0; }
  s.catStats[item.category] = s.catStats[item.category] || {correct:0,total:0};
  s.catStats[item.category].total++;
  if(ok) s.catStats[item.category].correct++;

  let xp = ok ? 10 : 2;
  state.progress.xp += xp; s.xpEarned += xp;

  const hadMistakesBefore = Object.keys(state.progress.mistakes).length>0;
  if(s.isMistakeMode){
    const mb = state.progress.mistakes[item.id];
    if(ok){
      if(mb){ mb.box = (mb.box||0)+1; if(mb.box>=3){ delete state.progress.mistakes[item.id]; s.mistakesFixed++; state.progress.xp+=15; s.xpEarned+=15; } }
    } else {
      if(mb) mb.box = 0;
    }
  } else {
    if(!ok){
      const existing = state.progress.mistakes[item.id];
      state.progress.mistakes[item.id] = { box:0, timesWrong: (existing?existing.timesWrong:0)+1, category:item.category };
    } else if(state.progress.mistakes[item.id]){
      state.progress.mistakes[item.id].box = (state.progress.mistakes[item.id].box||0)+1;
      if(state.progress.mistakes[item.id].box>=3){ delete state.progress.mistakes[item.id]; s.mistakesFixed++; }
    }
  }
  if(hadMistakesBefore) checkMistakeFixerBadge();
  saveProgress();
}

function checkMistakeFixerBadge(){
  if(Object.keys(state.progress.mistakes).length===0){
    awardBadge('mistake_fixer');
  }
}

function continueNext(){
  const s=state.session;
  s.idx++;
  state.answered=false; state.selection=null;
  if(s.idx>=s.items.length){ finishSession(); return; }
  render();
}

function exitPlayer(){
  state.screen='home'; state.session=null; render();
}

/* ---------------- SESSION FINISH / SUMMARY ---------------- */
function finishSession(){
  const s=state.session;
  const scored = s.correct+s.wrong;
  const accuracy = scored>0 ? Math.round((s.correct/scored)*100) : 100;
  let stars = 1;
  if(accuracy>=90) stars=3; else if(accuracy>=70) stars=2; else stars=1;
  if(scored===0) stars=3;

  if(!s.isMistakeMode){
    const stProg = state.progress.stages[s.stageKey];
    stProg.attempts++;
    stProg.bestAccuracy = Math.max(stProg.bestAccuracy, accuracy);
    stProg.stars = Math.max(stProg.stars, stars);
    const wasMastered = stProg.status==='mastered';
    if(accuracy>=80) stProg.status='mastered';
    else if(accuracy>=40) stProg.status='in_progress';
    else stProg.status='needs_practice';
    if(stProg.status==='mastered' && !wasMastered){
      if(awardBadge(s.stageKey)){ state.progress.xp += 50; s.xpEarned+=50; }
    }
    state.progress.xp += 20; s.xpEarned += 20;
  }
  checkUnitMastery();
  saveProgress();
  state.screen='summary';
  render();
  if((s.correct+s.wrong)>0 && s.correct===(s.correct+s.wrong)) fireConfetti();
}

function checkUnitMastery(){
  const coreStages = ['s1','s2','s3','s4','s5'];
  const allMastered = coreStages.every(k=>state.progress.stages[k].status==='mastered');
  const noMistakes = Object.keys(state.progress.mistakes).length===0;
  if(allMastered && noMistakes){
    if(awardBadge('unit_master')){ state.progress.xp += 100; }
  }
}

function renderSummary(){
  const s=state.session;
  const scored=s.correct+s.wrong;
  const accuracy = scored>0 ? Math.round((s.correct/scored)*100) : 100;
  let stars=1; if(accuracy>=90) stars=3; else if(accuracy>=70) stars=2; if(scored===0) stars=3;
  const starHtml = [0,1,2].map(i=>`<i class="fa-solid fa-star text-4xl ${i<stars?'text-amber-400':'text-slate-200'}"></i>`).join(' ');

  const catNames={vocab:'📚 Từ vựng', grammar:'🧩 Ngữ pháp', reading_sgk:'📖 Đọc hiểu SGK', reading_sbt:'📕 Đọc hiểu SBT'};
  const catBlock = Object.keys(s.catStats).length>1 ? `<div class="space-y-2 mt-4">${Object.keys(s.catStats).map(c=>{
    const cs=s.catStats[c]; const pct=Math.round((cs.correct/cs.total)*100);
    return `<div><div class="flex justify-between text-xs font-bold text-slate-500 mb-1"><span>${catNames[c]||c}</span><span>${cs.correct}/${cs.total}</span></div>
    <div class="progress-track" style="height:8px"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
  }).join('')}</div>` : '';

  const mistakeFixedLine = s.isMistakeMode && s.mistakesFixed>0 ? `<p class="text-emerald-600 font-bold text-sm mt-2">🔥 Đã sửa xong ${s.mistakesFixed} lỗi!</p>` : '';

  let title = '🎉 Hoàn thành!';
  if(accuracy>=90) title='🌟 Xuất sắc!';
  else if(accuracy>=70) title='💪 Làm tốt lắm!';
  else title="🔁 Cố lên, luyện thêm nhé!";

  return `<div class="max-w-md mx-auto px-4 py-10 text-center pop-in">
    <p class="text-5xl mb-2">${accuracy>=90?'🏆':accuracy>=70?'🎉':'💪'}</p>
    <h2 class="font-baloo text-2xl font-extrabold text-slate-800 mb-1">${title}</h2>
    <div class="my-3">${starHtml}</div>
    <p class="text-slate-500 font-bold">Độ chính xác: <span class="text-slate-800">${accuracy}%</span> (${s.correct}/${scored||0} câu đúng)</p>
    <p class="xp-pill inline-block mt-3" style="background:#fff7d6;border-color:#ca8a04;color:#7c5a00;">
      <i class="fa-solid fa-bolt mr-1"></i>+${s.xpEarned} XP</p>
    ${mistakeFixedLine}
    ${catBlock}
    <div class="mt-8 space-y-3">
      <button onclick="goHomeFromSummary()" class="btn3d btn-green w-full py-3 rounded-2xl font-black text-lg">Về trang chủ</button>
      <button onclick="retryStage()" class="btn3d btn-white w-full py-3 rounded-2xl font-black text-lg">Làm lại</button>
    </div>
  </div>`;
}

function goHomeFromSummary(){
  const showMastery = state.progress.badges.includes('unit_master') && !state.__masteryShown;
  if(showMastery){ state.__masteryShown=true; state.screen='mastery'; state.session=null; render(); fireConfetti(); return; }
  state.screen='home'; state.session=null; render();
}
function retryStage(){ const key=state.session.stageKey; state.screen='home'; startStage(key); }

/* ---------------- MASTERY SCREEN ---------------- */
function renderMastery(){
  return `<div class="max-w-md mx-auto px-4 py-16 text-center pop-in">
    <p class="text-7xl mb-3">🏆</p>
    <h2 class="font-baloo text-3xl font-extrabold text-amber-600 mb-2">BẠN ĐÃ CHINH PHỤC<br>UNIT 5: CUSTOMS AND TRADITIONS!</h2>
    <p class="text-slate-500 mb-6">Bạn đã hoàn thành xuất sắc tất cả các chặng và không còn lỗi sai nào. Thật tuyệt vời!</p>
    <p class="xp-pill inline-block mb-6" style="background:#fff7d6;border-color:#ca8a04;color:#7c5a00;"><i class="fa-solid fa-bolt mr-1"></i>Tổng ${state.progress.xp} XP</p>
    <button onclick="state.screen='home'; render();" class="btn3d btn-green w-full py-3 rounded-2xl font-black text-lg">Về trang chủ</button>
  </div>`;
}

/* ---------------- Confetti ---------------- */
function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7f1d1d','#b91c1c','#dc2626','#ca8a04','#f59e0b','#facc15'];
  for(let i=0;i<100;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

/* ---------------- INIT ---------------- */
render();
</script>
</body>
</html>
