<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{
    --purple:#6d28d9; --purple-dark:#4c1d95; --pink:#db2777; --pink-dark:#9d174d;
    --green:#58cc02; --green-dark:#4aa302; --blue:#1cb0f6; --gold:#ffc800; --red:#ff4b4b; --gray:#e5e5e5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family:'Nunito',sans-serif; background:#faf5ff; margin:0; overscroll-behavior-y: none; color:#3c3c3c; }
  button, .tappable, [onclick]{ touch-action: manipulation; -webkit-user-select:none; user-select:none; }
  input, textarea{ -webkit-user-select:text; user-select:text; font-size:16px !important; }
  h1,h2,h3,.font-baloo{ font-family:'Baloo 2','Baloo_2',sans-serif; }

  #app{ min-height:100vh; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
  .topbar{ position:sticky; top:0; z-index:40; background:#fff; border-bottom:2px solid #e5e5e5; padding: calc(.6rem + env(safe-area-inset-top)) 1rem .6rem; }
  .footer-bar{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:#fff; border-top:2px solid #e5e5e5; padding: .8rem 1rem calc(.8rem + env(safe-area-inset-bottom)); }

  .hero-gradient{ background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 55%, #db2777 100%); }

  .btn3d{ border-bottom:4px solid; transition: transform .06s, border-bottom-width .06s; cursor:pointer; }
  .btn3d:active{ transform: translateY(3px); border-bottom-width:1px; }
  .btn-green{ background:var(--green); border-color:var(--green-dark); color:#fff; }
  .btn-green:disabled{ background:#e5e5e5; border-color:#d0d0d0; color:#afafaf; cursor:not-allowed; }
  .btn-purple{ background:var(--purple); border-color:var(--purple-dark); color:#fff; }
  .btn-white{ background:#fff; border-color:#e5e5e5; color:#4b4b4b; }
  .btn-red{ background:#fff; border-color:#e5e5e5; color:var(--red); }

  .path-wrap{ max-width:480px; margin:0 auto; padding: 1.5rem 1rem 3rem; position:relative; }
  .group-label{ text-align:center; font-weight:900; font-size:.85rem; letter-spacing:.02em; color:#6d28d9; background:#f3e8ff; border:2px solid #ddd6fe; border-radius:999px; padding:.4rem 1rem; margin: 1.4rem auto .8rem; max-width:fit-content; }
  .stage-node{ width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2rem; border-bottom:6px solid; position:relative; transition:transform .15s; flex-shrink:0; }
  .stage-node:active{ transform: scale(.94); }
  .stage-node.status-mastered{ background:var(--gold); border-color:#c99400; }
  .stage-node.status-in_progress{ background:var(--purple); border-color:#4c1d95; }
  .stage-node.status-needs_practice{ background:var(--red); border-color:#c53030; }
  .stage-node.status-not_started{ background:#fff; border-color:#e5e5e5; color:#afafaf; }
  .stage-row{ display:flex; align-items:center; gap:1rem; margin-bottom:1.6rem; }
  .stage-row.right{ flex-direction:row-reverse; }
  .status-dot{ position:absolute; bottom:-6px; right:-6px; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.75rem; background:#fff; border:2px solid #e5e5e5; }

  .opt-card{ border:2px solid #e5e5e5; border-bottom-width:4px; border-radius:1rem; padding:.9rem 1rem; cursor:pointer; transition: all .12s; font-weight:800; }
  .opt-card:active{ transform: translateY(2px); }
  .opt-card.selected{ border-color:var(--blue); background:#ddf4ff; }
  .opt-card.correct{ border-color:var(--green-dark); background:#d7ffb8; color:#4b4b4b; }
  .opt-card.wrong{ border-color:#c53030; background:#ffdfe0; color:#4b4b4b; }
  .opt-card.dim{ opacity:.5; }

  .feedback-banner{ position:fixed; left:0; right:0; bottom:0; z-index:60; }
  .xp-pill{ background:#fff7d6; border:2px solid var(--gold); color:#8a6d00; border-radius:999px; padding:.15rem .7rem; font-weight:900; font-size:.8rem; }
  .streak-pill{ background:#fdf0ff; border:2px solid var(--purple); color:#5b21b6; border-radius:999px; padding:.15rem .7rem; font-weight:900; font-size:.8rem; }
  .progress-track{ background:#e5e5e5; border-radius:999px; height:14px; overflow:hidden; }
  .progress-fill{ background:var(--purple); height:100%; transition: width .4s ease; }
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }
  .pop-in{ animation: popIn .3s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.6); opacity:0;} to{transform:scale(1); opacity:1;} }
  .screen{ display:none; }
  .screen.active{ display:block; }
  .badge-chip{ background:#fff; border:2px solid var(--gold); border-radius:1rem; padding:.6rem; text-align:center; }
  .passage-toggle-box{ background:#f5f3ff; border:2px solid #ddd6fe; border-radius:1rem; padding:.8rem 1rem; margin-bottom:1rem; font-size:.92rem; line-height:1.8; }
  .passage-vi-box{ background:#fffbeb; border:2px solid #fde68a; border-radius:1rem; padding:.8rem 1rem; margin-top:.5rem; font-size:.92rem; line-height:1.8; display:none; }
  .passage-vi-box.show{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .hero-emoji{ position:absolute; opacity:.12; pointer-events:none; }
</style>

<script>
// ============================================================
// UNIT 4 REVIEW GAME — "Ethnic groups of Viet Nam"
// Standalone MCQ/TF-only review game (Vocabulary + Grammar + SGK/SBT Reading)
// Content sourced from GS8_Unit4_InClass_Practice.html (SGK) and
// GS8_Unit4_Workbook_Practice.html (SBT). All items are type "mcq" or "tf".
// ============================================================

/* ---------------- 1. VOCABULARY ITEM BANK (22 items) ---------------- */
const VOCAB_ITEMS = [
  {id:"v01", type:"mcq", category:"vocab", q:"\"communal house\" nghĩa là gì?", options:["nhà rông, nhà sinh hoạt cộng đồng","nhà sàn","cầu thang","cái cồng, chiêng"], answer:0, explanation:"\"communal house\" (nhà rông) là ngôi nhà lớn nhất, cao nhất, là trung tâm sinh hoạt của cả làng (của người Ba Na, Ê Đê).", vi:"communal house = nhà rông"},
  {id:"v02", type:"mcq", category:"vocab", q:"\"trang phục\" trong tiếng Anh là gì?", options:["costume","statue","harvest","soil"], answer:0, explanation:"costume = trang phục, ví dụ trang phục truyền thống của các dân tộc.", vi:"trang phục = costume"},
  {id:"v03", type:"mcq", category:"vocab", q:"Từ nào có nghĩa là \"cây trồng, vụ mùa\"?", options:["crop","livestock","feature","post"], answer:0, explanation:"crop = cây trồng/vụ mùa, ví dụ \"Rice is the main crop.\"", vi:"crop = cây trồng, vụ mùa"},
  {id:"v04", type:"mcq", category:"vocab", q:"Điền từ thích hợp: There are 54 ______ groups in Viet Nam.", options:["ethnic","minority","folk","wooden"], answer:0, explanation:"\"ethnic groups\" = các dân tộc — Việt Nam có 54 dân tộc.", vi:"ethnic group = (nhóm) dân tộc"},
  {id:"v05", type:"mcq", category:"vocab", q:"\"feature\" nghĩa là gì?", options:["nét, đặc điểm","tượng","cột nhà","đất"], answer:0, explanation:"feature = nét, đặc điểm, ví dụ \"the unique features of a culture\".", vi:"feature = nét, đặc điểm"},
  {id:"v06", type:"mcq", category:"vocab", q:"\"cái sáo\" trong tiếng Anh là gì?", options:["flute","gong","statue","staircase"], answer:0, explanation:"flute = cái sáo, một nhạc cụ dân gian phổ biến.", vi:"cái sáo = flute"},
  {id:"v07", type:"mcq", category:"vocab", q:"Điền từ thích hợp: Mua sap is a popular ______ dance of the Thai people.", options:["folk","wooden","terraced","ethnic"], answer:0, explanation:"\"folk dance\" = điệu múa dân gian.", vi:"folk = (thuộc) dân gian"},
  {id:"v08", type:"mcq", category:"vocab", q:"Từ nào chỉ nhạc cụ bằng đồng, hình tròn, gõ để phát ra âm thanh?", options:["gong","flute","staircase","post"], answer:0, explanation:"gong = cái cồng, chiêng — nhạc cụ truyền thống của nhiều dân tộc Tây Nguyên.", vi:"gong = cái cồng, chiêng"},
  {id:"v09", type:"mcq", category:"vocab", q:"\"harvest\" nghĩa là gì?", options:["vụ thu hoạch, mùa màng","gia súc","cột nhà","đất"], answer:0, explanation:"harvest = vụ thu hoạch, ví dụ \"Farmers celebrate a good harvest every year.\"", vi:"harvest = vụ thu hoạch, mùa màng"},
  {id:"v10", type:"mcq", category:"vocab", q:"\"vùng cao nguyên\" trong tiếng Anh là gì?", options:["highland","lowland","forest","field"], answer:0, explanation:"highland = vùng cao, cao nguyên — nơi nhiều dân tộc thiểu số sinh sống.", vi:"vùng cao nguyên = highland"},
  {id:"v11", type:"mcq", category:"vocab", q:"Từ nào có nghĩa \"gia súc\"?", options:["livestock","crop","harvest","soil"], answer:0, explanation:"livestock = gia súc (trâu, bò, lợn...).", vi:"livestock = gia súc"},
  {id:"v12", type:"mcq", category:"vocab", q:"\"dân tộc thiểu số\" trong tiếng Anh là gì?", options:["ethnic minority","communal house","stilt house","terraced field"], answer:0, explanation:"ethnic minority = dân tộc thiểu số, nhóm dân cư nhỏ hơn dân tộc Kinh.", vi:"dân tộc thiểu số = ethnic minority"},
  {id:"v13", type:"mcq", category:"vocab", q:"Điền từ thích hợp: Their stilt house ______ a large rice field. (nhìn ra)", options:["overlooks","raises","weaves","harvests"], answer:0, explanation:"overlook = nhìn ra, hướng ra — \"Our house overlooks terraced fields.\"", vi:"overlook = nhìn ra, hướng ra"},
  {id:"v14", type:"mcq", category:"vocab", q:"Trong cụm \"stilt house\", từ \"post\" nghĩa là gì?", options:["cột (nhà)","cầu thang","mái nhà","tượng"], answer:0, explanation:"post = cột nhà — nhà sàn đứng trên những cây cột cao.", vi:"post = cột (nhà)"},
  {id:"v15", type:"mcq", category:"vocab", q:"Điền từ thích hợp: The Cham in Ninh Thuan ______ sheep and cows. (chăn nuôi)", options:["raise","weave","overlook","harvest"], answer:0, explanation:"raise = chăn nuôi — \"The Cham raise sheep and cows.\"", vi:"raise = chăn nuôi"},
  {id:"v16", type:"mcq", category:"vocab", q:"\"soil\" nghĩa là gì?", options:["đất (trồng trọt)","cây trồng","gia súc","cột nhà"], answer:0, explanation:"soil = đất trồng trọt, ví dụ \"The soil in the highlands is good for growing coffee.\"", vi:"soil = đất (trồng trọt)"},
  {id:"v17", type:"mcq", category:"vocab", q:"\"cầu thang\" trong tiếng Anh là gì?", options:["staircase","post","statue","loom"], answer:0, explanation:"staircase = cầu thang — người ta leo cầu thang 7 hoặc 9 bậc để vào nhà sàn.", vi:"cầu thang = staircase"},
  {id:"v18", type:"mcq", category:"vocab", q:"Từ nào có nghĩa \"tượng\"?", options:["statue","costume","gong","flute"], answer:0, explanation:"statue = tượng, ví dụ tượng gỗ trang trí ở nhà mồ của người Jrai.", vi:"statue = tượng"},
  {id:"v19", type:"mcq", category:"vocab", q:"\"nhà sàn\" trong tiếng Anh là gì?", options:["stilt house","communal house","terraced field","staircase"], answer:0, explanation:"stilt house = nhà sàn, ngôi nhà đứng trên các cột cao.", vi:"nhà sàn = stilt house"},
  {id:"v20", type:"mcq", category:"vocab", q:"Điền từ thích hợp: Farmers grow rice on ______ fields in the mountains. (bậc thang)", options:["terraced","wooden","folk","ethnic"], answer:0, explanation:"terraced (field) = (ruộng) bậc thang — ruộng xếp thành bậc trên sườn núi.", vi:"terraced field = ruộng bậc thang"},
  {id:"v21", type:"mcq", category:"vocab", q:"\"dệt\" trong tiếng Anh là gì?", options:["weave","raise","overlook","harvest"], answer:0, explanation:"weave = dệt, ví dụ dệt vải trên khung cửi.", vi:"dệt = weave"},
  {id:"v22", type:"mcq", category:"vocab", q:"\"wooden\" nghĩa là gì?", options:["bằng gỗ","bằng bạc","bằng đá","bằng tre"], answer:0, explanation:"wooden = bằng gỗ, ví dụ \"wooden statue\" (tượng gỗ).", vi:"wooden = bằng gỗ"},
];

/* ---------------- 2. GRAMMAR ITEM BANK (22 items) ---------------- */
const GRAMMAR_ITEMS = [
  // --- Yes/No & Wh-questions (11) ---
  {id:"g01", type:"mcq", category:"grammar", q:"Chọn câu hỏi Yes/No đúng cho câu: \"Women play an important role in a Jrai family.\"", options:["Do women play an important role in a Jrai family?","Does women play an important role in a Jrai family?","Are women play an important role in a Jrai family?","Women do play an important role in a Jrai family?"], answer:0, explanation:"Chủ ngữ số nhiều \"women\", thì hiện tại đơn, động từ thường (\"play\") → dùng trợ động từ \"Do\".", vi:"Phụ nữ đóng vai trò quan trọng trong một gia đình người Jrai."},
  {id:"g02", type:"mcq", category:"grammar", q:"Chọn câu hỏi Yes/No đúng cho câu: \"Mua sap is a popular folk dance of the Thai people.\"", options:["Does mua sap is a popular folk dance of the Thai people?","Is mua sap a popular folk dance of the Thai people?","Is mua sap popular folk dance of the Thai people?","Do mua sap a popular folk dance of the Thai people?"], answer:1, explanation:"Câu gốc dùng động từ \"to be\" (is) → chỉ cần đảo \"is\" lên trước chủ ngữ, không thêm do/does.", vi:"Múa sạp là một điệu múa dân gian phổ biến của người Thái."},
  {id:"g03", type:"mcq", category:"grammar", q:"Chọn câu hỏi Yes/No đúng cho câu: \"We didn't have boarding schools for minority students in 1950.\"", options:["Did we have boarding schools for minority students in 1950?","Do we have boarding schools for minority students in 1950?","Have we boarding schools for minority students in 1950?","Were we have boarding schools for minority students in 1950?"], answer:0, explanation:"Thì quá khứ đơn → dùng trợ động từ \"Did\" + S + V (nguyên thể).", vi:"Chúng ta đã không có trường nội trú cho học sinh dân tộc thiểu số vào năm 1950."},
  {id:"g04", type:"mcq", category:"grammar", q:"Chọn câu hỏi Yes/No đúng cho câu: \"We will watch a documentary about the Khmer.\"", options:["Will we watch a documentary about the Khmer?","Do we will watch a documentary about the Khmer?","Are we watch a documentary about the Khmer?","Shall we watching a documentary about the Khmer?"], answer:0, explanation:"Thì tương lai đơn dùng \"will\" → đảo \"will\" lên trước chủ ngữ.", vi:"Chúng ta sẽ xem một bộ phim tài liệu về người Khmer."},
  {id:"g05", type:"mcq", category:"grammar", q:"______ do you like best about Sa Pa? – I like its local markets best.", options:["What","Who","How","Which"], answer:0, explanation:"Hỏi về sự vật (điều gì) → dùng \"What\".", vi:"Bạn thích điều gì nhất về Sa Pa? – Tôi thích chợ phiên nhất."},
  {id:"g06", type:"mcq", category:"grammar", q:"______ can we find the most beautiful terraced fields? – In Mu Cang Chai.", options:["When","Where","Why","What"], answer:1, explanation:"Hỏi về địa điểm → dùng \"Where\".", vi:"Chúng ta có thể tìm thấy ruộng bậc thang đẹp nhất ở đâu? – Ở Mù Cang Chải."},
  {id:"g07", type:"mcq", category:"grammar", q:"______ is the Ban Flower Festival? – It's in spring.", options:["When","Where","What","Which"], answer:0, explanation:"Hỏi về thời gian → dùng \"When\".", vi:"Lễ hội Hoa Ban diễn ra khi nào? – Vào mùa xuân."},
  {id:"g08", type:"mcq", category:"grammar", q:"How ______ is an average stilt house? – About 5-6 metres tall.", options:["what","tall","why","which"], answer:1, explanation:"Hỏi về chiều cao/mức độ → dùng \"How tall\".", vi:"Một ngôi nhà sàn trung bình cao bao nhiêu? – Khoảng 5-6 mét."},
  {id:"g09", type:"mcq", category:"grammar", q:"______ festival is more important for the Kinh: the Mid-Autumn or the Lunar New Year? – The Lunar New Year.", options:["Which","What","Where","When"], answer:0, explanation:"Hỏi để lựa chọn giữa hai điều đã nêu → dùng \"Which\".", vi:"Lễ hội nào quan trọng hơn đối với người Kinh: Trung Thu hay Tết Nguyên Đán? – Tết Nguyên Đán."},
  {id:"g10", type:"tf", category:"grammar", q:"Khi câu gốc dùng động từ \"to be\" (is/are/was/were), ta chỉ cần đảo \"to be\" lên trước chủ ngữ để tạo câu hỏi Yes/No, KHÔNG cần thêm do/does/did.", answer:0, explanation:"Đúng. Ví dụ: \"Mua sap is popular.\" → \"Is mua sap popular?\" (không dùng \"Does mua sap is...\").", vi:"Quy tắc: câu có \"to be\" → chỉ đảo \"to be\", không thêm trợ động từ do/does/did."},
  {id:"g11", type:"tf", category:"grammar", q:"Câu hỏi Wh-question (What, Where, When, Why...) chỉ có thể được trả lời bằng \"Yes\" hoặc \"No\".", answer:1, explanation:"Sai. Wh-questions cần một câu trả lời cụ thể (thông tin), còn Yes/No questions mới trả lời bằng Yes/No.", vi:"Wh-question cần câu trả lời có thông tin cụ thể, không phải Yes/No."},
  // --- Countable/uncountable nouns + quantifiers (11) ---
  {id:"g12", type:"mcq", category:"grammar", q:"Từ nào trong các từ sau là danh từ KHÔNG đếm được?", options:["land","group","tree","village"], answer:0, explanation:"\"land\" (đất đai) không có dạng số nhiều, không đếm được.", vi:"land = đất đai (danh từ không đếm được)"},
  {id:"g13", type:"mcq", category:"grammar", q:"Từ nào trong các từ sau là danh từ ĐẾM ĐƯỢC?", options:["crop","ash","soil","rice"], answer:0, explanation:"\"crop\" (cây trồng, vụ mùa) có dạng số nhiều: a crop, crops.", vi:"crop = cây trồng, vụ mùa (danh từ đếm được)"},
  {id:"g14", type:"mcq", category:"grammar", q:"My uncle has ______ coffee plantation in Kon Tum.", options:["a","an","some","much"], answer:0, explanation:"\"coffee plantation\" là danh từ số ít bắt đầu bằng phụ âm → dùng \"a\".", vi:"Chú tôi có một đồn điền cà phê ở Kon Tum."},
  {id:"g15", type:"mcq", category:"grammar", q:"How ______ ethnic groups live on the Hoang Lien Son mountain range?", options:["many","much","a little","any"], answer:0, explanation:"\"many\" đi với danh từ đếm được số nhiều (ethnic groups).", vi:"Có bao nhiêu dân tộc sinh sống trên dãy núi Hoàng Liên Sơn?"},
  {id:"g16", type:"mcq", category:"grammar", q:"There are only ______ waterwheels left in my village.", options:["a few","much","a little","many of"], answer:0, explanation:"\"a few\" (một vài) đi với danh từ đếm được số nhiều (waterwheels).", vi:"Chỉ còn một vài chiếc guồng nước ở làng tôi."},

const ITEM_BANK = {};
ALL_ITEMS.forEach(it=>{ ITEM_BANK[it.id]=it; });
const CATEGORY_IDS = { vocab:[], grammar:[], reading_sgk:[], reading_sbt:[] };

/* ---------------- Utility ---------------- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }

/* ---------------- Speech (Web Speech API) ---------------- */
let cachedVoices=[]; let voicesReady=false;
if('speechSynthesis' in window){
  const refresh=()=>{ cachedVoices=window.speechSynthesis.getVoices()||[]; if(cachedVoices.length) voicesReady=true; };
  window.speechSynthesis.onvoiceschanged=refresh; refresh();
  let tries=0; const t=setInterval(()=>{ refresh(); tries++; if(voicesReady||tries>10) clearInterval(t); },300);
}
function pickEnVoice(){
  const voices = cachedVoices.length?cachedVoices:(window.speechSynthesis.getVoices()||[]);
  return voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang)) || null;
}
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-US'; u.rate=0.92; u.pitch=1; u.volume=1;
      const en=pickEnVoice(); if(en) u.voice=en;
      if(btn){ btn.classList.add('speaking'); const stop=()=>btn.classList.remove('speaking'); u.onend=stop; u.onerror=stop; }
      window.speechSynthesis.speak(u);
    },60);
  }catch(e){}
}

/* ---------------- Storage ---------------- */
const STORAGE_KEY = 'u4_review_game_v1';
function defaultProgress(){
  const stages={}; STAGE_DEFS.forEach(s=>stages[s.key]={status:'not_started', bestAccuracy:0, attempts:0, stars:0});
  return { xp:0, bestStreak:0, badges:[], stages, mistakes:{}, createdAt:Date.now() };
}
function loadProgress(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultProgress();
    const parsed=JSON.parse(raw);
    const def=defaultProgress();
    return Object.assign(def, parsed, { stages:Object.assign(def.stages, parsed.stages||{}) });
  }catch(e){ return defaultProgress(); }
}
function saveProgress(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress)); }catch(e){} }
function resetProgress(){ state.progress=defaultProgress(); saveProgress(); state.screen='home'; render(); }

function awardBadge(key){
  if(!state.progress.badges.includes(key)){ state.progress.badges.push(key); return true; }
  return false;
}

/* ---------------- Item pool helpers ---------------- */
function itemsForCategory(cat){ return (CATEGORY_IDS[cat]||[]).map(id=>ITEM_BANK[id]); }
function buildPoolSession(stageDef){
  let pool=[];
  stageDef.categories.forEach(c=>pool=pool.concat(itemsForCategory(c)));
  return shuffle(pool).slice(0, stageDef.count || pool.length);
}
function buildMixedSession(stageDef){
  const perCat = Math.ceil(stageDef.count / stageDef.categories.length);
  let pool=[];
  stageDef.categories.forEach(c=> pool=pool.concat(sample(itemsForCategory(c), perCat)) );
  return shuffle(pool).slice(0, stageDef.count);
}
function buildMistakeSession(){
  const ids = Object.keys(state.progress.mistakes).filter(id=> ITEM_BANK[id] && state.progress.mistakes[id].box < 3);
  return shuffle(ids.map(id=>ITEM_BANK[id]));
}
function withIntroCards(items){
  const seen=new Set(); const intros=[];
  items.forEach(it=>{
    if(it.passageId && !seen.has(it.passageId)){
      seen.add(it.passageId);
      const p = READING_SGK_PASSAGES[it.passageId] || READING_SBT_PASSAGES[it.passageId];
      if(p) intros.push({ id:'intro_'+it.passageId, type:'intro', passage:p });
    }
  });
  return intros.concat(items);
}

/* ---------------- STAGE SESSION START ---------------- */
function startStage(key){
  const def = STAGE_DEFS.find(s=>s.key===key);
  let items=[];
  if(def.kind==='reading'){
    items = withIntroCards(buildPoolSession(def));
  } else if(def.kind==='mixed'){
    items = buildMixedSession(def);
  } else if(def.kind==='mistakes'){
    items = buildMistakeSession();
  } else {
    items = buildPoolSession(def);
  }
  if(def.kind==='mistakes' && items.length===0){
    alert('🎉 Tuyệt vời! Bạn hiện không có câu nào cần sửa lỗi. Hãy tiếp tục luyện tập các phần khác nhé!');
    return;
  }
  state.session = { stageKey:key, items, idx:0, correct:0, wrong:0, streak:0, xpEarned:0,
    catStats:{}, isMistakeMode: def.kind==='mistakes', mistakesFixed:0 };
  state.answered=false; state.selection=null;
  state.screen='player';
  render();
}

function passageToggleBlock(passageId, uniq){

    </button>` : '';
  const viBox = p.vi ? `<div id="pgvi_${uniq}" class="passage-vi-box"><b>🇻🇳 Bản dịch</b><br>${p.vi}</div>` : '';

function renderQuestionCard(item){
  if(item.type==='intro') return renderIntroCard(item);
  const uniq = item.id;
  let body='';
  if(item.type==='mcq' || item.type==='tf'){
    const opts = item.type==='tf' ? ['True','False'] : item.options;
    body = `<div class="grid gap-2 mt-4">${opts.map((o,i)=>{
      let cls='opt-card';
      if(state.answered){
        if(i===item.answer) cls+=' correct';
        else if(i===state.selection) cls+=' wrong';
        else cls+=' dim';
      } else if(state.selection===i){ cls+=' selected'; }
      const label = item.type==='tf' ? (i===0?'✅ True':'❌ False') : `<span class="text-indigo-500">${['A','B','C','D'][i]}.</span> ${o}`;
      return `<div class="${cls}" onclick="${state.answered?'':'selectOption('+i+')'}">${label}</div>`;
    }).join('')}</div>`;
  }
  const passageBlock = item.passageId ? passageToggleBlock(item.passageId, uniq) : '';
  const catTag = {vocab:'🧵 Từ vựng', grammar:'🧠 Ngữ pháp', reading_sgk:'🏡 Đọc hiểu SGK', reading_sbt:'🥁 Đọc hiểu SBT'}[item.category] || '';

  return `
    <p class="text-xs font-black uppercase tracking-wide text-slate-400 mb-1">${catTag}</p>
    ${passageBlock}
    <p class="text-lg font-extrabold text-slate-800 leading-snug">${item.q}${speakBtn}</p>
    ${body}
  `;
}

function renderIntroCard(item){
  const p = item.passage;
  const viBtn = p.vi ? `<button type="button" onclick="document.getElementById('introvi_${p.id}').classList.toggle('show')" class="text-xs font-bold bg-white border-2 border-amber-200 text-amber-700 px-3 py-1.5 rounded-full mb-2">

    <br>${p.html}</div>
  <div class="mt-2">${viBtn}${viBox}</div>`;
}

/* ---------------- FOOTER / ANSWER CHECKING ---------------- */
function renderFooter(item){
  if(item.type==='intro'){
    return `<button onclick="continueNext()" class="btn3d btn-green w-full max-w-xl mx-auto block py-3 rounded-2xl font-black text-lg"><i class="fa-solid fa-arrow-right mr-1"></i>Bắt đầu luyện tập</button>`;
  }
  if(!state.answered){
    const canCheck = state.selection!==null && state.selection!==undefined;
    return `<button onclick="checkAnswer()" class="btn3d btn-green w-full max-w-xl mx-auto block py-3 rounded-2xl font-black text-lg" ${canCheck?'':'disabled'}><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>`;
  } else {
    const ok = computeOk(item);
    const cont = `<button onclick="continueNext()" class="btn3d ${ok?'btn-green':'btn-red'} w-full max-w-xl mx-auto block py-3 rounded-2xl font-black text-lg">Tiếp tục <i class="fa-solid fa-arrow-right ml-1"></i></button>`;
    const exp = item.explanation ? `<p class="text-sm ${ok?'text-emerald-700':'text-rose-600'} font-bold mb-1">${ok?'✅ Chính xác!':'❌ Chưa đúng.'} ${item.explanation}</p>` : `<p class="text-sm ${ok?'text-emerald-700':'text-rose-600'} font-bold mb-1">${ok?'✅ Chính xác!':'❌ Chưa đúng.'}</p>`;
    const viLine = item.vi ? `<p class="text-xs text-slate-400 italic mb-2">📖 ${item.vi}</p>` : '';
    return `<div class="max-w-xl mx-auto"><div>${exp}${viLine}</div>${cont}</div>`;
  }
}

function computeOk(item){
  if(item.type==='mcq' || item.type==='tf') return state.selection===item.answer;
  return false;
}

function selectOption(i){ if(state.answered) return; state.selection=i; render(); }

function checkAnswer(){
  const item=currentItem();
  let ok=false;
  if(item.type==='mcq' || item.type==='tf'){
    ok = state.selection===item.answer;
    state.answered=true;
    finalizeAnswer(item, ok, state.selection);
  }
  render();
}

function finalizeAnswer(item, ok, selectionSnapshot){
  const s=state.session;
  if(ok){ s.correct++; s.streak++; if(s.streak>state.progress.bestStreak) state.progress.bestStreak=s.streak; }
  else { s.wrong++; s.streak=0; }
  s.catStats[item.category] = s.catStats[item.category] || {correct:0,total:0};
  s.catStats[item.category].total++;
  if(ok) s.catStats[item.category].correct++;

  let xp = ok ? 10 : 2;
  state.progress.xp += xp; s.xpEarned += xp;

  const hadMistakesBefore = Object.keys(state.progress.mistakes).length>0;
  if(s.isMistakeMode){
    const mb = state.progress.mistakes[item.id];
    if(ok){
      if(mb){ mb.box = (mb.box||0)+1; if(mb.box>=3){ delete state.progress.mistakes[item.id]; s.mistakesFixed++; state.progress.xp+=15; s.xpEarned+=15; } }
    } else {
      if(mb) mb.box = 0;
    }
  } else {
    if(!ok){
      const existing = state.progress.mistakes[item.id];
      state.progress.mistakes[item.id] = { box:0, timesWrong: (existing?existing.timesWrong:0)+1, category:item.category };
    } else if(state.progress.mistakes[item.id]){
      state.progress.mistakes[item.id].box = (state.progress.mistakes[item.id].box||0)+1;
      if(state.progress.mistakes[item.id].box>=3){ delete state.progress.mistakes[item.id]; s.mistakesFixed++; }
    }
  }
  if(hadMistakesBefore) checkMistakeFixerBadge();
  saveProgress();
}

function checkMistakeFixerBadge(){
  if(Object.keys(state.progress.mistakes).length===0){
    awardBadge('mistake_fixer');
  }
}

function continueNext(){
  const s=state.session;
  s.idx++;
  state.answered=false; state.selection=null;
  if(s.idx>=s.items.length){ finishSession(); return; }
  render();
}

function exitPlayer(){
  state.screen='home'; state.session=null; render();
}

/* ---------------- SESSION FINISH / SUMMARY ---------------- */
function finishSession(){
  const s=state.session;
  const scored = s.correct+s.wrong;
  const accuracy = scored>0 ? Math.round((s.correct/scored)*100) : 100;
  let stars = 1;
  if(accuracy>=90) stars=3; else if(accuracy>=70) stars=2; else stars=1;
  if(scored===0) stars=3;

  if(!s.isMistakeMode){
    const stProg = state.progress.stages[s.stageKey];
    stProg.attempts++;
    stProg.bestAccuracy = Math.max(stProg.bestAccuracy, accuracy);
    stProg.stars = Math.max(stProg.stars, stars);
    const wasMastered = stProg.status==='mastered';
    if(accuracy>=80) stProg.status='mastered';
    else if(accuracy>=40) stProg.status='in_progress';
    else stProg.status='needs_practice';
    if(stProg.status==='mastered' && !wasMastered){
      if(awardBadge(s.stageKey)){ state.progress.xp += 50; s.xpEarned+=50; }
    }
    state.progress.xp += 20; s.xpEarned += 20;
  }
  checkUnitMastery();
  saveProgress();
  state.screen='summary';
  render();
}

function checkUnitMastery(){
  const coreStages = ['vocab','grammar','reading_sgk','reading_sbt','mixed'];
  const allMastered = coreStages.every(k=>state.progress.stages[k].status==='mastered');
  const noMistakes = Object.keys(state.progress.mistakes).length===0;
  if(allMastered && noMistakes){
    if(awardBadge('unit_master')){ state.progress.xp += 100; }
  }
}

function renderSummary(){
  const s=state.session;
  const scored=s.correct+s.wrong;
  const accuracy = scored>0 ? Math.round((s.correct/scored)*100) : 100;
  let stars=1; if(accuracy>=90) stars=3; else if(accuracy>=70) stars=2; if(scored===0) stars=3;
  const starHtml = [0,1,2].map(i=>`<i class="fa-solid fa-star text-4xl ${i<stars?'text-amber-400':'text-slate-200'}"></i>`).join(' ');

  const catNames={vocab:'🧵 Từ vựng', grammar:'🧠 Ngữ pháp', reading_sgk:'🏡 Đọc hiểu SGK', reading_sbt:'🥁 Đọc hiểu SBT'};
  const catBlock = Object.keys(s.catStats).length>1 ? `<div class="space-y-2 mt-4">${Object.keys(s.catStats).map(c=>{
    const cs=s.catStats[c]; const pct=Math.round((cs.correct/cs.total)*100);
    return `<div><div class="flex justify-between text-xs font-bold text-slate-500 mb-1"><span>${catNames[c]||c}</span><span>${cs.correct}/${cs.total}</span></div>
    <div class="progress-track" style="height:8px"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
  }).join('')}</div>` : '';

  const mistakeFixedLine = s.isMistakeMode && s.mistakesFixed>0 ? `<p class="text-emerald-600 font-bold text-sm mt-2">🎯 Đã sửa xong ${s.mistakesFixed} lỗi!</p>` : '';

  let title = '🎉 Hoàn thành!';
  if(accuracy>=90) title='🌟 Xuất sắc!';
  else if(accuracy>=70) title='💪 Làm tốt lắm!';
  else title="🔁 Cố lên, luyện thêm nhé!";

  return `<div class="max-w-md mx-auto px-4 py-10 text-center pop-in">
    <p class="text-5xl mb-2">${accuracy>=90?'🏆':accuracy>=70?'🎉':'💪'}</p>
    <h2 class="font-baloo text-2xl font-extrabold text-slate-800 mb-1">${title}</h2>
    <div class="my-3">${starHtml}</div>
    <p class="text-slate-500 font-bold">Độ chính xác: <span class="text-slate-800">${accuracy}%</span> (${s.correct}/${scored||0} câu đúng)</p>
    <p class="xp-pill inline-block mt-3"><i class="fa-solid fa-bolt mr-1"></i>+${s.xpEarned} XP</p>
    ${mistakeFixedLine}
    ${catBlock}
    <div class="mt-8 space-y-3">
      <button onclick="goHomeFromSummary()" class="btn3d btn-purple w-full py-3 rounded-2xl font-black text-lg">Về trang chủ</button>
      <button onclick="retryStage()" class="btn3d btn-white w-full py-3 rounded-2xl font-black text-lg">Làm lại</button>
    </div>
  </div>`;
}

function goHomeFromSummary(){
  const showMastery = state.progress.badges.includes('unit_master') && !state.__masteryShown;
  if(showMastery){ state.__masteryShown=true; state.screen='mastery'; state.session=null; render(); fireConfetti(); return; }
  state.screen='home'; state.session=null; render();
}
function retryStage(){ const key=state.session.stageKey; state.screen='home'; startStage(key); }

/* ---------------- MASTERY SCREEN ---------------- */
function renderMastery(){
  fireConfetti();
  return `<div class="max-w-md mx-auto px-4 py-16 text-center pop-in">
    <p class="text-7xl mb-3">🏆</p>
    <h2 class="font-baloo text-2xl md:text-3xl font-extrabold text-amber-500 mb-2">BẠN ĐÃ CHINH PHỤC<br>UNIT 4: ETHNIC GROUPS OF VIET NAM!</h2>
    <p class="text-slate-500 mb-6">Bạn đã hoàn thành xuất sắc tất cả các chặng và không còn lỗi sai nào. Thật tuyệt vời!</p>
    <p class="xp-pill inline-block mb-6"><i class="fa-solid fa-bolt mr-1"></i>Tổng ${state.progress.xp} XP</p>
    <button onclick="state.screen='home'; render();" class="btn3d btn-purple w-full py-3 rounded-2xl font-black text-lg">Về trang chủ</button>
  </div>`;
}

/* ---------------- Confetti ---------------- */
function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); wrap.innerHTML='';
  const colors=['#4c1d95','#7c3aed','#db2777','#ec4899','#f59e0b','#22c55e'];
  for(let i=0;i<100;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

/* ---------------- INIT ---------------- */
render();
</script>
