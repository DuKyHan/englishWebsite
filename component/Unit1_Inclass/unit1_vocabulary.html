<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 1 - My Hobbies: Vocabulary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:469px;overflow:hidden;background:#eef2ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1e1b4b}
.wrap{width:100%;max-width:1128px;height:469px;margin:0 auto;padding:16px 22px;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;color:#4338ca}
.sub{font-size:13px;color:#6b7280;margin-top:2px}
.counter{font-weight:600;color:#4338ca;background:#e0e7ff;padding:4px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.progress{height:6px;background:#c7d2fe;border-radius:6px;overflow:hidden}
.bar{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);width:0;transition:width .3s}
.main{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:16px;min-height:0}
.card{background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(67,56,202,.12);padding:20px 26px;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;font-weight:700}
.word{font-size:34px;font-weight:700;color:#312e81;line-height:1.15;margin-top:6px;word-break:break-word}
.phon{font-family:"Doulos SIL","Lucida Sans Unicode","Segoe UI",Arial,sans-serif;color:#6b7280;font-size:16px;margin-top:6px}
.pos{display:inline-block;margin-top:10px;font-size:12px;font-style:italic;color:#7c3aed;background:#f3e8ff;padding:2px 10px;border-radius:999px;width:fit-content}
.row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.speak{border:none;background:#6366f1;color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px}
.speak:hover{background:#4f46e5}
.toggle{border:1.5px solid #c7d2fe;background:#fff;color:#4338ca;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
.toggle:hover{background:#eef2ff}
.meaning{font-size:22px;font-weight:600;color:#047857;margin-top:12px;min-height:30px}
.meaning.hidden{color:transparent;user-select:none;background:#ecfdf5;border-radius:8px;padding:0 8px;width:fit-content;min-width:160px;height:30px}
.example{font-size:17px;line-height:1.5;margin-top:8px;color:#1f2937}
.example-vi{font-size:15px;line-height:1.5;margin-top:10px;color:#6b7280;font-style:italic}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:1.5px solid #c7d2fe;background:#fff;color:#4338ca;padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){background:#eef2ff}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}
.btn.primary:hover:not(:disabled){background:#4338ca}
.hint{font-size:12px;color:#9ca3af}
@media (max-width:760px){
  .main{grid-template-columns:1fr;overflow:hidden}
  .word{font-size:26px}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>UNIT 1 · MY HOBBIES</h1>
      <div class="sub">Từ vựng – Vocabulary</div>
    </div>
    <div class="counter" id="counter">1 / 23</div>
  </header>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="main">
    <div class="card">
      <div class="label" id="posLabel">Word</div>
      <div class="word" id="word"></div>
      <div class="phon" id="phon"></div>
      <div><span class="pos" id="pos"></span></div>
      <div class="row">
        <button class="speak" id="speak">🔊 Nghe phát âm</button>
        <button class="toggle" id="toggle">Hiện nghĩa</button>
      </div>
      <div class="meaning hidden" id="meaning"></div>
    </div>

    <div class="card">
      <div class="label">Example</div>
      <div class="example" id="ex"></div>
      <div class="example-vi" id="exVi"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prev">← Trước</button>
    <span class="hint">← → để chuyển · Space để hiện nghĩa</span>
    <button class="btn primary" id="next">Tiếp →</button>
  </div>
</div>

<script>
const vocab = [
  { w:"a piece of cake", p:"/ə piːs əv keɪk/", pos:"idiom", vi:"dễ ợt",
    ex:"This puzzle is a piece of cake! Everyone can solve it.", exVi:"Câu đố này dễ ợt! Ai cũng giải được nó." },
  { w:"arranging flowers", p:"/əˈreɪndʒɪŋ ˈflaʊə(r)/", pos:"n.", vi:"cắm hoa",
    ex:"She spent two hours arranging flowers to make a gorgeous bouquet.", exVi:"Cô ấy đã dành 2 tiếng cắm hoa để làm một lẵng hoa tuyệt đẹp." },
  { w:"bird-watching", p:"/ˈbɜːdwɒtʃɪŋ/", pos:"n.", vi:"quan sát chim chóc",
    ex:"Many people list birdwatching among their hobbies.", exVi:"Nhiều người liệt kê việc quan sát chim chóc là một trong số các sở thích của họ." },
  { w:"board game", p:"/ˈbɔːd ɡeɪm/", pos:"n.", vi:"trò chơi trên bàn cờ",
    ex:"Most of the games produced were of the board game genres.", exVi:"Hầu hết các trò chơi được sản xuất ra thuộc thể loại trò chơi trên bàn cờ." },
  { w:"carve", p:"/kɑːv/", pos:"v.", vi:"chạm, khắc",
    ex:"She's carving the stone with a hammer.", exVi:"Cô ấy đang chạm khắc đá với một cây búa." },
  { w:"carved", p:"/kɑːvd/", pos:"adj.", vi:"được chạm khắc",
    ex:"The wood is carved into a beautiful sculpture.", exVi:"Khúc gỗ được chạm khắc thành một bức tượng đẹp." },
  { w:"collage", p:"/ˈkɒlɑːʒ/", pos:"n.", vi:"bức tranh tạo thành từ nhiều tranh, ảnh nhỏ",
    ex:"She collected her favourite photos of her family and made an impressive collage.", exVi:"Cô ấy thu thập những bức ảnh yêu thích của gia đình và làm thành một bức ảnh ghép rất ấn tượng." },
  { w:"eggshell", p:"/ˈeɡʃel/", pos:"n.", vi:"vỏ trứng",
    ex:"You can crack an eggshell by tapping it against a hard surface.", exVi:"Bạn có thể đập vỡ vỏ trứng bằng cách gõ nó vào bề mặt cứng." },
  { w:"fragile", p:"/ˈfrædʒaɪl/", pos:"adj.", vi:"dễ vỡ",
    ex:"Be careful with the bottle! It's fragile.", exVi:"Hãy cẩn thận với cái chai đấy! Nó dễ vỡ." },
  { w:"gardening", p:"/ˈɡɑːdnɪŋ/", pos:"n.", vi:"làm vườn",
    ex:"My grandpa is doing the gardening at the moment.", exVi:"Ông tôi hiện tại đang làm vườn." },
  { w:"horse-riding", p:"/ˈhɔːs raɪdɪŋ/", pos:"n.", vi:"cưỡi ngựa",
    ex:"Horse-riding is a popular activity in royal families.", exVi:"Cưỡi ngựa là một hoạt động phổ biến trong các gia đình hoàng gia." },
  { w:"ice-skating", p:"/ˈaɪs skeɪtɪŋ/", pos:"n.", vi:"trượt băng",
    ex:"She learnt ice-skating at the age of five.", exVi:"Cô ấy học môn trượt băng từ khi lên năm." },
  { w:"making model", p:"/ˈmeɪkɪŋ ˈmɒdl/", pos:"phr.", vi:"làm mô hình",
    ex:"Clay can be used for making models.", exVi:"Đất sét có thể được dùng để làm mô hình." },
  { w:"making pottery", p:"/ˈmeɪkɪŋ ˈpɒtəri/", pos:"phr.", vi:"nặn đồ gốm",
    ex:"Clay is used for making pottery.", exVi:"Đất sét được dùng để nặn đồ gốm." },
  { w:"melody", p:"/ˈmelədi/", pos:"n.", vi:"giai điệu",
    ex:"He played a few well-known melodies.", exVi:"Anh ấy đã biểu diễn một số giai điệu nổi tiếng." },
  { w:"monopoly", p:"/məˈnɒpəli/", pos:"n.", vi:"cờ tỉ phú",
    ex:"Monopoly was invented in the U.S.", exVi:"Cờ tỉ phú được phát minh ra tại nước Mỹ." },
  { w:"mountain climbing", p:"/ˈmaʊntən ˈklaɪmɪŋ/", pos:"n.", vi:"leo núi",
    ex:"They often go mountain climbing at the weekends.", exVi:"Họ thường đi leo núi vào cuối tuần." },
  { w:"share", p:"/ʃeə(r)/", pos:"v.", vi:"chia sẻ",
    ex:"You should share useful information with other people.", exVi:"Bạn nên chia sẻ thông tin bổ ích tới mọi người." },
  { w:"skating", p:"/ˈskeɪtɪŋ/", pos:"n.", vi:"trượt pa tanh",
    ex:"Many people hurt their knees while skating.", exVi:"Nhiều người bị đau đầu gối khi trượt pa tanh." },
  { w:"strange", p:"/streɪndʒ/", pos:"adj.", vi:"lạ",
    ex:"I saw some strange creatures in a book.", exVi:"Tôi đã nhìn thấy vài sinh vật lạ trong một cuốn sách." },
  { w:"surfing", p:"/ˈsɜːfɪŋ/", pos:"n.", vi:"lướt sóng",
    ex:"Surfing is his favourite activity when he comes to the beach.", exVi:"Lướt sóng là hoạt động yêu thích của anh ấy khi đi biển." },
  { w:"unique", p:"/juˈniːk/", pos:"adj.", vi:"độc đáo",
    ex:"Everyone is impressed by him because his personality is unique.", exVi:"Mọi người ấn tượng với anh ấy vì tính cách anh ấy độc đáo." },
  { w:"unusual", p:"/ʌnˈjuːʒuəl/", pos:"adj.", vi:"khác thường",
    ex:"Look at this unusual fish!", exVi:"Hãy nhìn vào con cá khác thường này đi!" }
];

let idx = 0;
let showMeaning = false;

const $ = id => document.getElementById(id);

function render() {
  const v = vocab[idx];
  $("word").textContent = v.w;
  $("phon").textContent = v.p;
  $("pos").textContent = v.pos;
  $("meaning").textContent = v.vi;
  $("meaning").classList.toggle("hidden", !showMeaning);
  $("toggle").textContent = showMeaning ? "Ẩn nghĩa" : "Hiện nghĩa";
  $("ex").textContent = v.ex;
  $("exVi").textContent = v.exVi;
  $("counter").textContent = (idx + 1) + " / " + vocab.length;
  $("bar").style.width = ((idx + 1) / vocab.length * 100) + "%";
  $("prev").disabled = idx === 0;
  $("next").textContent = idx === vocab.length - 1 ? "Hoàn thành ✓" : "Tiếp →";
}

function go(step) {
  const n = idx + step;
  if (n < 0 || n >= vocab.length) return;
  idx = n;
  showMeaning = false;
  render();
}

function speak() {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(vocab[idx].w);
  u.lang = "en-GB";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("speak").onclick = speak;
$("toggle").onclick = () => { showMeaning = !showMeaning; render(); };

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " ") { e.preventDefault(); showMeaning = !showMeaning; render(); }
});

render();
</script>
</body>
</html>
