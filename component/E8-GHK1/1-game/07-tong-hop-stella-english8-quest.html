<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Stella English 8 Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;600;700;800&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: app shell. Home = stats bar + winding lesson path grouped by exam part; Lesson = progress/hearts bar, one exercise, check bar pinned at bottom. */
:root{
  --bg:#F6FAF9; --surface:#FFFFFF; --sunk:#EAF1EF; --ink:#173A40; --muted:#5E7579; --line:#D5E2DF;
  --brand:#16A085; --brand-dk:#0E7A65; --sun:#FFC83D; --sun-dk:#D99A00; --heart:#F2545B; --xp:#FF9F1C;
  --ok:#3BB54A; --ok-dk:#2A8C36; --ok-bg:#DDF5DF; --no:#E5484D; --no-dk:#B8343A; --no-bg:#FDE2E1;
  --lock:#C9D5D2; --vi:#3B5BA9; --vi-bg:#E9EFFC;
  --f-d:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif; --f-b:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --f-ipa:"Noto Sans","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1D20; --surface:#172A2E; --sunk:#1F383D; --ink:#E6F1EE; --muted:#9AB2AE; --line:#2E4A50;
  --brand:#2CC5A5; --brand-dk:#1A8E76; --ok-bg:#183A20; --no-bg:#4A1D1F; --lock:#3A5258; --vi:#A4BEFF; --vi-bg:#1F2A48; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1D20; --surface:#172A2E; --sunk:#1F383D; --ink:#E6F1EE; --muted:#9AB2AE; --line:#2E4A50;
  --brand:#2CC5A5; --brand-dk:#1A8E76; --ok-bg:#183A20; --no-bg:#4A1D1F; --lock:#3A5258; --vi:#A4BEFF; --vi-bg:#1F2A48; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ipa{font-family:var(--f-ipa)}
h1,h2,h3{font-family:var(--f-d);line-height:1.15;margin:0;text-wrap:balance}
.app{max-width:640px;margin:0 auto;padding-inline:16px;min-height:100%;display:flex;flex-direction:column}
/* chunky game button */
.cbtn{border:0;border-radius:16px;padding:13px 20px;font-family:var(--f-d);font-weight:800;font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-dk);transition:transform .05s}
.cbtn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--brand-dk)}
.cbtn[disabled]{background:var(--lock);box-shadow:0 4px 0 var(--line);color:var(--surface);cursor:default}
.cbtn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-dk)}
.cbtn.no{background:var(--no);box-shadow:0 4px 0 var(--no-dk)}
.cbtn.ghost{background:var(--surface);color:var(--brand);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
/* top stats */
.stats{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:2px solid var(--line)}
.brandname{font-family:var(--f-d);font-weight:800;font-size:1.25rem;color:var(--brand)}
.chips{display:flex;gap:14px;font-weight:800}
.chip{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.chip svg{width:24px;height:24px}
/* hero */
.hero{display:flex;gap:14px;align-items:center;padding-block:18px 6px}
.hero .mascot{width:84px;height:84px;flex:0 0 auto}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:600;position:relative}
.goal{margin-top:6px;font-size:.85rem;color:var(--muted)}
.goalbar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px}
.goalbar i{display:block;height:100%;background:var(--xp);width:0}
.review{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
/* unit band + path */
.unit{margin-top:22px}
.band{border-radius:18px;padding:14px 18px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.band small{display:block;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9;font-size:.75rem}
.band h2{font-size:1.45rem;color:#fff}
.band p{margin:2px 0 0;opacity:.95;font-size:.92rem}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:22px 6px}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 7px 0 rgba(0,0,0,.22)}
.node svg{width:34px;height:34px;fill:#fff}
.node[disabled]{background:var(--lock)!important;cursor:not-allowed;box-shadow:0 7px 0 var(--line)}
.node .crown{position:absolute;right:-10px;bottom:-8px;background:var(--sun);color:#5A3B00;border-radius:99px;font-size:.75rem;font-weight:800;padding:1px 7px;border:2px solid var(--surface)}
.node.current::after{content:"BẮT ĐẦU";position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--brand);border:2px solid var(--line);border-radius:10px;padding:1px 8px;font-size:.72rem;font-weight:800;white-space:nowrap}
.nlabel{font-size:.78rem;color:var(--muted);text-align:center;margin-top:-10px;max-width:160px}
.foot{padding-block:28px;text-align:center;color:var(--muted);font-size:.85rem}
/* lesson */
.lhead{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;display:flex;align-items:center;gap:12px;padding-block:14px}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1.6rem;line-height:1;padding:4px}
.pbar{flex:1;height:16px;background:var(--sunk);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--heart)}
.hearts svg{width:26px;height:26px;fill:var(--heart)}
.stage{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:6px 150px}
.qtype{font-family:var(--f-d);font-weight:800;font-size:1.45rem}
.qrow{display:flex;gap:10px;align-items:flex-start}
.spk{flex:0 0 auto;width:52px;height:52px;border-radius:14px;border:0;background:#1CB0F6;box-shadow:0 4px 0 #1287BE;cursor:pointer;display:grid;place-items:center}
.spk svg{width:26px;height:26px;fill:#fff}
.qtext{font-size:1.2rem;font-weight:600;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;flex:1;min-width:0}
.vibtn{align-self:flex-start;border:0;background:none;color:var(--vi);font-weight:700;cursor:pointer;padding:0;text-decoration:underline dotted}
.vibox{background:var(--vi-bg);border-radius:12px;padding:8px 12px;font-size:.95rem}
.passage{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:.93rem;max-height:210px;overflow:auto}
.passage b{color:var(--brand)}
.imgq{display:flex;justify-content:center}
.imgq img{width:130px;border-radius:12px;border:2px solid var(--line);background:#fff}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;font-size:1.05rem;box-shadow:0 4px 0 var(--line);transition:transform .05s}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.opt.sel{border-color:#1CB0F6;background:#DDF4FF;box-shadow:0 4px 0 #84D8FF;color:#0B5F86}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok);color:inherit}
.opt.wrong{border-color:var(--no);background:var(--no-bg);box-shadow:0 4px 0 var(--no);color:inherit}
.opt[disabled]{cursor:default}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;font-size:.8rem;font-weight:800;margin-right:8px;color:var(--muted)}
.answerline{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 12px;cursor:pointer;font-size:1.05rem;box-shadow:0 3px 0 var(--line)}
.tile.ghost{visibility:hidden}
.ans{width:100%;font:inherit;font-size:1.15rem;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.again{font-size:.8rem;font-weight:800;color:var(--xp);letter-spacing:.06em;text-transform:uppercase}
/* check bar */
.checkbar{position:fixed;left:0;right:0;bottom:0;z-index:6;border-top:2px solid var(--line);background:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.checkbar .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.checkbar.ok{background:var(--ok-bg);border-color:transparent}
.checkbar.no{background:var(--no-bg);border-color:transparent}
.fbh{font-family:var(--f-d);font-weight:800;font-size:1.35rem;display:flex;align-items:center;gap:8px}
.checkbar.ok .fbh{color:var(--ok-dk)} .checkbar.no .fbh{color:var(--no-dk)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .checkbar.ok .fbh{color:#7EE08A} :root:not([data-theme="light"]) .checkbar.no .fbh{color:#FF9A9D} }
:root[data-theme="dark"] .checkbar.ok .fbh{color:#7EE08A} :root[data-theme="dark"] .checkbar.no .fbh{color:#FF9A9D}
.fbtxt{font-size:.95rem;max-height:34vh;overflow:auto}
.fbtxt .viline{color:var(--vi);margin-top:4px}
.checkbar .cbtn{width:100%}
/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding-block:30px}
.result .mascot{width:130px;height:130px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stat{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.stat b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:4px}
.stat span{display:block;font-family:var(--f-d);font-weight:800;font-size:1.5rem;padding:6px}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>

const SIGNS = {};
const TF=["True","False"];

và bơi trong hồ bơi.", "q": "My father likes _________ books and _________ in the pool."}, {"o": ["spending", "spend", "spent", "to spending"], "a": 0, "ex": "prefer + V-ing: prefer spending time. “to spending” sai vì sau “to” không dùng V-ing.", "vi": "Nhiều gia đình trẻ ở Việt Nam thích dành thời gian cùng nhau tham gia các hoạt động ngoài trời hơn.", "q": "A lot of young families in Viet Nam prefer _______ time doing outdoor activities together."}, {"o": ["getting", "get", "gets", "to getting"], "a": 0, "ex": "hate + V-ing: hates getting up. “to getting” sai vì sau “to” không dùng V-ing.", "vi": "Chị tôi ghét phải dậy sớm để tập thể dục.", "q": "My sister hates ______ up early to do exercise."}, {"o": ["plays", "playing", "play", "to play"], "a": 0, "ex": "Hiện tại đơn (dấu hiệu “usually”), chủ ngữ số ít → plays.", "vi": "Nam thường chơi bóng đá với bạn bè sau giờ học.", "q": "Nam usually _________ football with his friends after school."}, {"o": ["Messaging", "Playing computer games", "Surfing the net", "Playing sports"], "a": 3, "ex": "Chơi thể thao giúp cải thiện sức khỏe thể chất và kết bạn.", "vi": "Chơi thể thao giúp cải thiện sức khỏe thể chất và đôi khi cho chúng ta cơ hội kết bạn.", "q": "________ helps to improve physical health and sometimes gives us a chance to make friends."}, {"o": ["doing", "taking", "surfing", "knitting"], "a": 2, "ex": "surf the internet: lướt mạng; spend time + V-ing.", "vi": "Mark dành nhiều thời gian lướt mạng. Cậu ấy vào hết trang web này đến trang khác chỉ để xem video ngắn.", "q": "Mark spends a lot of time ________ the internet. He visits one website after another just to watch short videos."}, {"o": ["reading / draw", "reading / drawing", "to read / to draw", "read / draw"], "a": 1, "ex": "detest + V-ing; hai động từ song song: reading – drawing.", "vi": "Mấy anh chị họ của chúng tôi rất ghét đọc sách và vẽ.", "q": "Our cousins detest ________ books and _________ ."}, {"o": ["on", "in", "about", "for"], "a": 0, "ex": "on one’s own: một mình.", "vi": "Alice dành nhiều thời gian một mình; cô ấy luôn tập thể dục đều đặn và làm những điều mình thích.", "q": "Alice spends a lot of time _______ her own; she always exercises regularly and does what she enjoys."}, {"o": ["Pattern", "Pastime", "Needles", "A and B are correct"], "a": 0, "ex": "pattern: mẫu, khuôn (thiết kế dùng để làm ra vật gì); pastime: thú tiêu khiển.", "vi": "Rập (mẫu) là bản thiết kế em dùng để làm ra một món đồ.", "q": "_______ is a design that you use to make something.", "keep": true}, {"o": ["What", "How", "Who", "When"], "a": 0, "ex": "Hỏi về hoạt động → What do you do…?", "vi": "Em làm gì với bạn bè vào thời gian rảnh?", "q": "_________ do you do with your friends in your free time?"}, {"o": ["Stitches", "Magical", "Pastime", "Pattern"], "a": 0, "ex": "stitch: mũi đan/mũi khâu.", "vi": "Mũi đan là những vòng len nhỏ được tạo ra quanh que đan.", "q": "_______ is small circles of wool made around knitting needles."}, {"o": ["fold", "folding", "to fold", "folds"], "a": 1, "ex": "paper folding: (nghệ thuật) gấp giấy – danh động từ.", "vi": "Origami là nghệ thuật gấp giấy.", "q": "Origami is the art of paper _________."}, {"o": ["similarity", "general", "common", "the same"], "a": 2, "ex": "have/share something in common: có điểm chung.", "vi": "Về các hoạt động giải trí yêu thích, cô ấy và tôi có nhiều điểm chung.", "q": "About favorite leisure activities, she and I share many things in _______."}, {"o": ["Therefore", "However", "Because", "A and B are correct"], "a": 1, "ex": "Hai ý trái ngược (mưa to – vẫn đi làm) → However, đứng đầu câu, sau có dấu phẩy.", "vi": "Trời mưa to. Tuy nhiên, bố tôi vẫn đi làm.", "q": "It rained hard. ______, my father went to work.", "keep": true}]}, {"id": "u1-doc", "name": "Đọc hiểu", "qs": "Unit 1 · Đoạn B trang 8 – 9", "kind": "passage", "passages": [{"title": "Điền từ – Family time (tr. 8)", "text": "Some teenagers enjoy (1) ______ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect (2) ______ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the (3) ______. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and (4) ______. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first (5) ______ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to (6) ______ with them.", "vi": "Một số bạn tuổi teen thích dành thời gian rảnh với bạn bè. Những bạn khác lại thích tham gia hoạt động giải trí cùng người thân. Mình thích dành thời gian với gia đình vì đó là cách tuyệt vời để gắn kết với mọi người. Cuối tuần, cả nhà thường đạp xe đến các làng gần đó để tận hưởng không khí trong lành. Chúng mình chụp ảnh và xem lại sau. Anh trai và mình cũng mê nấu ăn: anh tìm công thức dễ, rồi hai anh em chuẩn bị nguyên liệu và nấu. Có lúc ngon, có lúc không, nhưng nấu gì chúng mình cũng thích. Hoạt động mình thích nhất là làm đồ thủ công cùng mẹ. Mẹ dạy mình may váy và quần áo cho búp bê. Có lần mình đoạt giải nhất cuộc thi trang phục ở trường nhờ mẹ giúp rất nhiều.", "items": [{"o": ["spending", "to spend", "spend", "spends"], "a": 0, "ex": "enjoy + V-ing → spending."}, {"o": ["to", "with", "from", "on"], "a": 1, "ex": "connect with sb: gắn kết với ai."}, {"o": ["air pollution", "water pollution", "environmental pollution", "fresh air"], "a": 3, "ex": "Đạp xe về làng quê để tận hưởng không khí trong lành (fresh air)."}, {"o": ["eat", "cook", "cooks", "cooking"], "a": 1, "ex": "Song song với “prepare” sau chủ ngữ “we” → cook."}, {"o": ["award", "gift", "prize", "medal"], "a": 2, "ex": "win the first prize: đạt giải nhất."}, {"o": ["connect", "connecting", "connected", "connection"], "a": 0, "ex": "a way to + V nguyên mẫu → connect."}]}, {"title": "True / False – Nam’s hobbies (tr. 9)", "text": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn’t cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time.", "vi": "Mình tên là Nam. Lúc rảnh, mình thích làm đồ thủ công (DIY) với những người bạn cũ. Tuần trước, chị gái và mình làm một ngôi nhà giấy nhỏ, mất 3 tiếng. Nó không tốn nhiều tiền nhưng cần rất nhiều kiên nhẫn. Mẹ còn dạy mình đan len, giờ mình đã đan được một chiếc khăn quàng nhỏ cho bản thân. Ngoài ra, mình thích lướt Internet tìm công thức làm bánh mới. Thỉnh thoảng chiều Chủ nhật mình nướng bánh cho cả nhà. Những việc này giúp mình thư giãn và tránh xa màn hình.", "items": [{"q": "Nam and his sister made a paper house in three hours.", "o": TF, "a": 0, "ex": "“…made a small paper house, which took us 3 hours.”", "vi": "Nam và chị gái làm một ngôi nhà giấy trong ba giờ."}, {"q": "Making a paper house is very expensive.", "o": TF, "a": 1, "ex": "“It doesn’t cost much…” → không đắt.", "vi": "Làm nhà giấy rất tốn kém."}, {"q": "Nam’s mother showed him how to knit.", "o": TF, "a": 0, "ex": "“My mother also taught me how to knit.”", "vi": "Mẹ Nam đã chỉ cậu cách đan len."}, {"q": "Nam can knit a large blanket.", "o": TF, "a": 1, "ex": "Nam chỉ đan được “a small scarf” (khăn quàng nhỏ), không phải chăn lớn.", "vi": "Nam có thể đan một chiếc chăn lớn."}, {"q": "Nam enjoys _____ the Internet for new baking recipes.", "o": ["searching", "knitting", "banking", "surfing"], "a": 3, "ex": "“I love surfing the Internet to find new recipes for baking.”", "vi": "Nam thích lướt Internet để tìm công thức làm bánh mới."}, {"q": "Doing DIYs and baking makes Nam feel ____________.", "o": ["relaxed", "pleased", "tired", "happy"], "a": 0, "ex": "“Doing these things helps me relax…” → relaxed.", "vi": "Làm đồ thủ công và nướng bánh giúp Nam cảm thấy thư giãn."}]}]}, {"id": "u2-trong-am", "name": "Trọng âm", "qs": "Unit 2 · Life in the Countryside · 6 câu", "kind": "mcq", "items": [{"o": ["cattle", "ferry", "collect", "orchard"], "a": 2, "ex": "collect /kəˈlekt/ nhấn âm 2; các từ còn lại nhấn âm 1.", "vi": "cattle: gia súc · ferry: phà · collect: thu gom · orchard: vườn cây ăn quả"}, {"o": ["cultivate", "develop", "villager", "farmhouse"], "a": 1, "ex": "develop /dɪˈveləp/ nhấn âm 2; các từ còn lại nhấn âm 1.", "vi": "cultivate: trồng trọt · develop: phát triển · villager: dân làng · farmhouse: nhà ở trang trại"}, {"o": ["tradition", "collection", "picturesque", "developer"], "a": 2, "ex": "picturesque /ˌpɪktʃəˈresk/ nhấn âm 3; các từ còn lại nhấn âm 2.", "vi": "tradition: truyền thống · collection: bộ sưu tập · picturesque: đẹp như tranh · developer: nhà phát triển"}, {"o": ["lighthouse", "unload", "friendly", "harvest"], "a": 1, "ex": "unload /ʌnˈləʊd/ nhấn âm 2; các từ còn lại nhấn âm 1.", "vi": "lighthouse: hải đăng · unload: dỡ hàng · friendly: thân thiện · harvest: mùa gặt"}, {"o": ["collective", "carefully", "villager", "friendliness"], "a": 0, "ex": "collective /kəˈlektɪv/ nhấn âm 2; carefully, villager, friendliness nhấn âm 1.", "vi": "collective: tập thể · carefully: cẩn thận · villager: dân làng · friendliness: sự thân thiện"}, {"o": ["traditional", "hospitable", "development", "speciality"], "a": 3, "ex": "speciality /ˌspeʃiˈæləti/ nhấn âm 3; các từ còn lại nhấn âm 2.", "vi": "traditional: thuộc truyền thống · hospitable: hiếu khách · development: sự phát triển · speciality: đặc sản"}]}, {"id": "u2-trac-nghiem", "name": "Trắc nghiệm", "qs": "Unit 2 · Câu 11 – 25", "kind": "mcq", "items": [{"o": ["catching", "holding", "buying", "meeting"], "a": 0, "ex": "catch fish: câu/bắt cá.", "vi": "Chú của cậu ấy thích bắt cá ở các hồ và ao gần đó sau giờ học.", "q": "His uncle likes ______ some fish from nearby lakes and ponds after school."}, {"o": ["cattle", "poultry", "cats", "fruit"], "a": 0, "ex": "herd cattle: chăn gia súc.", "vi": "Tom giúp gia đình chăn gia súc vào cuối tuần.", "q": "Tom helps his family to herd ______ at weekends."}, {"o": ["makes", "loads", "catches", "uploads"], "a": 1, "ex": "load: chất (hàng) lên xe; chủ ngữ số ít → loads.", "vi": "Người đàn ông chất rau lên xe ở ngoài đồng rồi lái xe về nhà.", "q": "The man ______ the vegetables in the field and then drives home."}, {"o": ["stop", "stopping", "to stop", "stopped"], "a": 2, "ex": "tell sb to do sth.", "vi": "Thầy giáo bảo học sinh ngừng cười.", "q": "The teacher told his students __________ laughing."}, {"o": ["the busiest", "the busier", "the most busy", "the most busiest"], "a": 0, "ex": "So sánh nhất của tính từ ngắn busy → the busiest.", "vi": "Đây là thành phố nhộn nhịp nhất mà tôi từng đến.", "q": "This is ________ city that I have ever been to."}, {"o": ["because of", "because", "so", "but"], "a": 1, "ex": "because + mệnh đề (S + V); because of + danh từ/cụm danh từ.", "vi": "Chúng tôi không thể ra ngoài vì trời bão rất to.", "q": "We couldn’t go out _________ it was very stormy."}, {"o": ["not to spending", "didn’t spend", "not to spend", "to not spent"], "a": 2, "ex": "ask sb (not) to do sth → not to spend.", "vi": "Tối qua bố tôi bảo chúng tôi đừng dành quá nhiều thời gian chơi game.", "q": "My father asked us _________ too much time playing computer games last night."}, {"o": ["unloading", "loading", "taking", "filling"], "a": 1, "ex": "load something with something: chất cái gì lên xe.", "vi": "Những người công nhân đang chất gỗ lên xe tải.", "q": "The workers are ______ a truck with timber."}, {"o": ["ploughs", "picks", "digs", "collects"], "a": 2, "ex": "dig holes: đào hố.", "vi": "Ông ấy thường đào hố trong vườn để trồng cây.", "q": "He often ______ holes in his garden to plant trees."}, {"o": ["time", "point", "period", "season"], "a": 0, "ex": "harvest time: mùa thu hoạch (cụm từ trong bài học).", "vi": "Chú tôi thuê thêm người giúp việc vào mùa gặt.", "q": "My uncle hired extra workers to help at harvest ______."}, {"o": ["running", "expanding", "enlarging", "stretching"], "a": 3, "ex": "stretch to the horizon: trải dài tới chân trời.", "vi": "Từ trên đỉnh đồi, chúng tôi có thể thấy những hàng cam nối tiếp nhau trải dài tới tận chân trời.", "q": "From the hilltop, we can see row after row of orange trees ______ to the horizon."}, {"o": ["corn", "wheat", "pad", "paddy"], "a": 3, "ex": "paddy fields: cánh đồng lúa.", "vi": "Người dân làng tôi trồng lúa trên những cánh đồng lúa nước rộng lớn.", "q": "People in my village grow rice in vast ______ fields."}, {"o": ["Do you really think so?", "I don’t think so.", "I beg your pardon.", "I’m fine, thank you."], "a": 0, "ex": "Đáp lại lời khen một cách khiêm tốn.", "vi": "A: Hôm nay trông bạn đẹp quá. – B: Bạn nghĩ vậy thật à?", "q": "Student A: You look nice today.\nStudent B: ______"}, {"o": ["I’m jealous of your holiday.", "I envy you.", "That’s great, thanks.", "No, I don’t envy you."], "a": 1, "ex": "I envy you: Mình ghen tị với bạn quá (ngưỡng mộ) – cách đáp tự nhiên.", "vi": "A: Mình vừa có kỳ nghỉ hè rất vui cùng gia đình. – B: Mình ghen tị với bạn quá.", "q": "Student A: I’ve had a very enjoyable summer holiday with my family.\nStudent B: ______"}, {"o": ["Oh, thank you! I got it at a shop in Le Loi Street.", "Don’t mention it. I bought it at a shop in Ha Noi.", "No, it doesn’t look great at all.", "Yes, I like it very much."], "a": 0, "ex": "Cảm ơn lời khen và trả lời câu hỏi mua ở đâu.", "vi": "A: Ồ, cà vạt đẹp quá! Bạn mua ở đâu vậy? – B: Ồ, cảm ơn bạn! Mình mua ở một cửa hàng trên đường Lê Lợi.", "q": "Student A: Ooh, what a great tie! Where did you get it?\nStudent B: ______"}]}, {"id": "u2-doc", "name": "Đọc hiểu", "qs": "Unit 2 · Đoạn A trang 17 – 18", "kind": "passage", "passages": [{"title": "Điền từ – My village (tr. 17)", "text": "I live in a small village in Ninh Binh. I love the (1) ______ peace and quiet of my village. The air is unpolluted, and the (2) ______ of life is slow. The people in my village are friendly and hospitable. They are always willing (3) ______ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy (4) ______ in the nearby area. It is actually a national park, so the wildlife there can live and move about (5) ______. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this (6) ______ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life.", "vi": "Mình sống ở một ngôi làng nhỏ ở Ninh Bình. Mình yêu sự yên bình, tĩnh lặng của làng. Không khí trong lành và nhịp sống chậm rãi. Người dân thân thiện, hiếu khách và luôn sẵn lòng giúp đỡ nhau. Chúng mình trồng chủ yếu lúa và đậu, nuôi bò và trâu. Gần làng còn có một vườn quốc gia để ngắm thiên nhiên hoang dã, nơi các loài động vật được sống và di chuyển tự do. Mỗi sáng, mình thích ngắm bình minh trên cánh đồng lúa bao la và nghe chim hót. Với mình, bầu không khí thanh bình ấy là báu vật mà thành phố hiện đại khó có được. Mình muốn sống ở đây cả đời.", "items": [{"o": ["urban", "rural", "suburban", "metropolitan"], "a": 1, "ex": "rural peace and quiet: sự yên bình của vùng nông thôn."}, {"o": ["speed", "step", "pace", "rate"], "a": 2, "ex": "the pace of life: nhịp sống."}, {"o": ["to help", "helping", "help", "to helping"], "a": 0, "ex": "be willing + to V: sẵn lòng làm gì."}, {"o": ["nature", "environment", "countryside", "scenery"], "a": 0, "ex": "enjoy nature: hòa mình vào thiên nhiên (câu sau nói về vườn quốc gia, động vật hoang dã)."}, {"o": ["safe", "safety", "safely", "safer"], "a": 2, "ex": "Trạng từ bổ nghĩa cho động từ “live and move about” → safely."}, {"o": ["bustling", "priceless", "peaceful", "rare"], "a": 2, "ex": "peaceful atmosphere: bầu không khí yên bình."}]}, {"title": "True / False – The British countryside (tr. 17 – 18)", "text": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle.", "vi": "Bên cạnh vẻ đẹp, nông thôn nước Anh nổi tiếng vì nhiều sự tương phản: núi trọc và đồng hoang, hồ, sông, rừng, và bờ biển dài, thường hoang sơ. Các vườn quốc gia được chính phủ bảo vệ khỏi việc khai thác xây dựng có cảnh đẹp như tranh. Người Anh thường gắn nông thôn với đất nông nghiệp, không gian rộng như cánh đồng lúa mì, lúa mạch, những đồng cỏ xanh có hàng rào cây hoặc tường đá bao quanh để nuôi bò, cừu. Phần lớn đất nông nghiệp nay thuộc về cá nhân hoặc công ty độc lập, nhưng chính phủ đã làm một mạng lưới đường đi bộ công cộng băng qua các trang trại. Nhiều người Anh thích sự yên bình ở nông thôn: đi bộ, đạp xe, đi dã ngoại. Mùa hè họ có thể hái dâu tây và trái cây ở các nông trại. Ngày nay ít người nông thôn làm nông; nhiều người đi làm ở thị trấn. Nhiều người khác muốn sống ở nông thôn để có lối sống tốt và lành mạnh hơn.", "items": [{"q": "The British countryside is known only for its beautiful scenery without any contrasts.", "o": TF, "a": 1, "ex": "Bài nói “well known for its many contrasts” → có nhiều sự tương phản.", "vi": "Vùng nông thôn nước Anh chỉ nổi tiếng với cảnh đẹp mà không có sự tương phản nào."}, {"q": "National parks in Britain are protected from development by the government.", "o": TF, "a": 0, "ex": "“National parks which are protected from development by the government…”", "vi": "Các vườn quốc gia ở Anh được chính phủ bảo vệ khỏi việc khai thác xây dựng."}, {"q": "Most farmland in Britain is owned by the government.", "o": TF, "a": 1, "ex": "“Most farmland is now owned by individual people or independent companies.”", "vi": "Phần lớn đất nông nghiệp ở Anh thuộc sở hữu của chính phủ."}, {"q": "Today, many people living in rural areas travel to work in towns every day.", "o": TF, "a": 0, "ex": "“Many of them commute to work in towns.” (commute = đi làm hằng ngày).", "vi": "Ngày nay, nhiều người sống ở nông thôn đi làm ở thị trấn hằng ngày."}, {"q": "What is the main idea of the passage?", "o": ["The history of British farmland ownership.", "The contrasts, features, and lifestyle in the British countryside.", "The best outdoor activities for British people.", "The reasons why national parks are famous."], "a": 1, "ex": "Bài nói về sự tương phản, đặc điểm và lối sống ở vùng quê nước Anh.", "vi": "Ý chính của đoạn văn là gì? → Sự tương phản, đặc điểm và lối sống ở nông thôn nước Anh."}, {"q": "According to the passage, what do British people usually associate the countryside with?", "o": ["Only national parks and wild coastlines.", "Farmland, open spaces, and   } else {
    const ids=sec.items.map((it,i)=>{ const id=`${sec.id}-${i}`;
      if(sec.kind==="mcq"){ const isWord=!it.q&&!it.img;
        ITEMS[id]={id,kind:"mcq",title: /phat-am$/.test(sec.id)?"Chọn từ có phần gạch chân phát âm khác": /trong-am$/.test(sec.id)?"Chọn từ có trọng âm khác": it.img?"Biển báo này nghĩa là gì?":"Chọn đáp án đúng",
          q:it.q||"",img:it.img,opts:it.o,a:it.a,ex:it.ex,vi:it.vi,isWord,say: isWord? it.o.map(clean).join(". ") : (it.q? it.q.replace(/_{3,}/g," blank "):null), full: it.q&&!/\n/.test(it.q)? fillBlank(it.q,clean(it.o[it.a])):null, keepOrder:!!it.keep};
      } else if(sec.kind==="order"){
        ITEMS[id]={id,kind:"bank",title:"Sắp xếp thành câu đúng",q:"",tiles:it.w,answers:[it.a],ex:it.ex,vi:it.vi,say:it.a,full:it.a};
      } else if(sec.id==="viet-lai"){
        const toks=it.a[0].split(" "); const extra=shuffle(DISTRACT.filter(d=>!toks.map(t=>t.toLowerCase().replace(/[.?!,]/g,"")).includes(d))).slice(0,3);
        ITEMS[id]={id,kind:"bank",title:"Viết lại câu với nghĩa không đổi",q:it.q,hint:"Bắt đầu: "+it.s,tiles:toks.concat(extra),answers:it.a,ex:it.ex,vi:it.vi,say:it.q,full:it.a[0]};
      } else {
        const plain=it.q.replace(/\s*\([^)]*\)\s*$/,""); const root=(it.q.match(/\(([^)]*)\)\s*$/)||[])[1]||"";
        ITEMS[id]={id,kind:"type",title:`Viết dạng đúng của từ “${root}”`,q:it.q,answers:it.a,ex:it.ex,vi:it.vi,say:plain.replace(/_{3,}/g," blank "),full:fillBlank(plain,it.a[0])};
      } return id });
    if(sec.groups){ sec.groups.forEach(([g,a,b])=>{ const part=ids.slice(a,b); if(part.length<=10) add(part,g); else { for(let k=0;k<part.length;k+=8) add(part.slice(k,k+8),g+" – phần "+(k/8+1)) } }) }
    else { const size=sec.kind==="type"&&sec.id==="word-form"?7:(ids.length<=10?ids.length:8); for(let k=0;k<ids.length;k+=size) add(ids.slice(k,k+size),"Bài "+(k/size+1)) }
  }
  UNITS.push(unit);
});
const ALL_LESSONS=UNITS.flatMap(u=>u.lessons);
const unlocked=l=>{ const u=UNITS.find(u=>u.lessons.includes(l)); const i=u.lessons.indexOf(l); return i===0 || !!S.done[u.lessons[i-1].id] };

/* ================= HOME ================= */
const app=document.getElementById("app");
function statsBar(){ return `<div class="stats"><span class="brandname">Stella English 8</span><div class="chips"><span class="chip" title="Chuỗi ngày học">${I.fire}${S.streak}</span><span class="chip" title="Điểm kinh nghiệm">${I.gem}${S.xp} XP</span></div></div>` }
function home(){
  try{ synth&&synth.cancel() }catch(e){}
  const totalDone=ALL_LESSONS.filter(l=>S.done[l.id]).length;
  const msg = totalDone===0? "Chào em! Mình là Stella. Bắt đầu bài đầu tiên nhé!" : S.todayXp>=GOAL? "Tuyệt vời! Hôm nay em đã đạt mục tiêu rồi." : `Em đã xong ${totalDone}/${ALL_LESSONS.length} bài. Tiếp tục nào!`;
  let h=statsBar()+`<div class="hero">${mascot()}<div style="flex:1;min-width:0"><div class="bubble">${msg}</div><div class="goal">Mục tiêu hôm nay: ${Math.min(S.todayXp,GOAL)}/${GOAL} XP</div><div class="goalbar"><i style="width:${Math.min(100,S.todayXp/GOAL*100)}%"></i></div></div></div>`;
  if(S.mistakes.length) h+=`<div class="review"><div><b>Ôn lỗi sai</b><br><span style="color:var(--muted);font-size:.9rem">${S.mistakes.length} câu em từng làm sai</span></div><button class="cbtn" type="button" id="rv" style="font-size:.95rem;padding:10px 16px">Ôn ngay</button></div>`;
  let current=null;
  UNITS.forEach((u,ui)=>{
    h+=`<section class="unit"><div class="band" style="background:${u.color}"><small>${u.qs}</small><h2>${u.name}</h2><p>${u.lessons.length} bài · đã xong ${u.lessons.filter(l=>S.done[l.id]).length}</p></div><div class="path">`;
    u.lessons.forEach((l,li)=>{
      const ok=unlocked(l), crowns=S.done[l.id]||0; const off=[0,60,90,60,0,-60,-90,-60][li%8];
      const isCur= ok && !crowns && !current; if(isCur) current=l.id;
      const ico= !ok? I.lock : crowns? I.star : li===u.lessons.length-1? I.trophy : I.book;
      h+=`<button type="button" class="node ${isCur?"current":""}" data-l="${l.id}" ${ok?"":"disabled"} style="background:${ok?u.color:""};transform:translateX(${off}px)" aria-label="${esc(l.label)}${ok?"":" (đang khóa)"}">${ico}${crowns?`<span class="crown">×${crowns}</span>`:""}</button><div class="nlabel" style="transform:translateX(${off}px)">${esc(l.label)}</div>`;
    });
    h+=`</div></section>`;
  });
  h+=`<div class="foot">Ms Stella’s English Class · Mỗi bài xong được sao. Chơi lại để lên ×2, ×3.</div>`;
  app.innerHTML=h;
  app.querySelectorAll(".node:not([disabled])").forEach(b=>b.onclick=()=>startLesson(ALL_LESSONS.find(l=>l.id===b.dataset.l)));
  const rv=document.getElementById("rv"); if(rv) rv.onclick=()=>startLesson({id:"review",label:"Ôn lỗi sai",items:shuffle(S.mistakes).slice(0,10),review:true});
  const cur=app.querySelector(".node.current"); if(cur) setTimeout(()=>{try{cur.scrollIntoView({block:"center"})}catch(e){}},50); else window.scrollTo(0,0);
}
/* ================= LESSON ENGINE ================= */
let L=null;
function startLesson(lesson){
  const queue=shuffle(lesson.items).filter(id=>ITEMS[id]);
  L={lesson,queue,pos:0,total:queue.length,hearts:5,correct:0,firstTry:0,seen:new Set(),wrongIds:new Set(),start:Date.now(),answered:false};
  renderQ();
}
function lessonHead(){ const pct=L.correct/L.total*100; return `<div class="lhead"><button class="x" type="button" id="quit" aria-label="Thoát bài">✕</button><div class="pbar" aria-label="Tiến độ"><i style="width:${pct}%"></i></div><span class="hearts" aria-label="Số tim">${I.heart}${L.hearts}</span></div>` }
function renderQ(){
  if(L.correct>=L.total) return finish(true);
  if(L.hearts<=0) return finish(false);
  const it=ITEMS[L.queue[L.pos]]; L.answered=false; L.sel=null;
  const again=L.seen.has(it.id);
  let body=`<div class="stage">${again?'<div class="again">Làm lại câu sai</div>':""}<div class="qtype">${it.title}</div>`;
  if(it.passage) body+=`<div class="passage">${esc(it.passage).replace(/&lt;(\/?)b>/g,"<$1b>")}</div>`;
  if(it.img) body+=`<div class="imgq"><img src="${SIGNS[it.img]}" alt="Biển báo"></div>`;
  const qShown = it.isWord? "" : (it.q||"");
  if(qShown || it.say) body+=`<div class="qrow">${it.say?`<button class="spk" type="button" id="say" aria-label="Nghe">${I.spk}</button>`:""}${qShown?`<div class="qtext">${esc(qShown).replace(/\n/g,"<br>")}</div>`:""}</div>`;
  if(it.hint) body+=`<div style="color:var(--muted);font-weight:600">${esc(it.hint)}</div>`;
  if(it.vi && !it.isWord) body+=`<button class="vibtn" type="button" id="viB">Xem bản dịch</button><div id="viBox"></div>`;
  if(it.kind==="mcq"){
    const order= it.keepOrder? it.opts.map((_,k)=>k) : shuffle(it.opts.map((_,k)=>k)); L.order=order;
    const two = it.isWord || it.opts.every(o=>clean(o).length<16);
    body+=`<div class="opts ${two?"two":""}">${order.map((k,n)=>`<button class="opt ${it.isWord?"ipa":""}" type="button" data-k="${k}"><span class="k">${n+1}</span>${it.isWord?it.opts[k]:esc(it.opts[k])}</button>`).join("")}</div>`;
  } else if(it.kind==="bank"){
    L.bank=shuffle(it.tiles.map((t,k)=>({t,k}))); L.line=[];
    body+=`<div class="answerline" id="line" aria-label="Câu của em"></div><div class="bank" id="bank"></div>`;
  } else {
    body+=`<input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời">`;
  }
  body+=`</div>`;
  app.innerHTML=lessonHead()+body+`<div class="checkbar" id="cb"><div class="in"><button class="cbtn" type="button" id="check" disabled>Kiểm tra</button></div></div>`;
  document.getElementById("quit").onclick=()=>{ if(document.getElementById("quit").dataset.sure) home(); else { document.getElementById("quit").dataset.sure=1; document.getElementById("quit").textContent="Thoát?"; } };
  const sb=document.getElementById("say"); if(sb) sb.onclick=()=>speak(it.say,"en");
  const vb=document.getElementById("viB"); if(vb) vb.onclick=()=>{document.getElementById("viBox").innerHTML=`<div class="vibox">${it.vi}</div>`; vb.remove()};
  const check=document.getElementById("check");
  if(it.kind==="mcq"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(L.answered)return; app.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel")); b.classList.add("sel"); L.sel=+b.dataset.k; check.disabled=false; if(it.isWord) speak(clean(it.opts[L.sel]),"en") });
  } else if(it.kind==="bank"){
    const draw=()=>{ const line=document.getElementById("line"), bank=document.getElementById("bank");
      line.innerHTML=L.line.map((o,n)=>`<button class="tile" type="button" data-n="${n}">${esc(o.t)}</button>`).join("");
      bank.innerHTML=L.bank.map(o=>`<button class="tile ${L.line.includes(o)?"ghost":""}" type="button" data-k="${o.k}">${esc(o.t)}</button>`).join("");
      line.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ if(L.answered)return; L.line.splice(+b.dataset.n,1); draw() });
      bank.querySelectorAll(".tile:not(.ghost)").forEach(b=>b.onclick=()=>{ if(L.answered)return; L.line.push(L.bank.find(o=>o.k===+b.dataset.k)); draw() });
      check.disabled=!L.line.length; };
    draw();
  } else {
    const inp=document.getElementById("ans"); inp.oninput=()=>check.disabled=!inp.value.trim(); inp.onkeydown=e=>{ if(e.key==="Enter"&&!check.disabled){ e.preventDefault(); check.click() } };
    setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},50);
  }
  check.onclick=()=>grade(it);
  document.onkeydown=e=>{ if(it.kind==="mcq" && !L.answered && /^[1-4]$/.test(e.key)){ const b=app.querySelectorAll(".opt")[+e.key-1]; if(b) b.click() } };
}
function grade(it){
  if(L.answered) return next();
  let ok=false, given="";
  if(it.kind==="mcq"){ ok=L.sel===it.a; }
  else if(it.kind==="bank"){ given=L.line.map(o=>o.t).join(" ").replace(/ \./g,".").replace(/ ,/g,",").replace(/ \?/g,"?"); ok=it.answers.some(a=>norm(a)===norm(given)); }
  else { given=document.getElementById("ans").value; ok=it.answers.some(a=>norm(a)===norm(given)); document.getElementById("ans").disabled=true; }
  L.answered=true;
  const firstTime=!L.seen.has(it.id); L.seen.add(it.id);
  if(ok){ L.correct++; if(firstTime) L.firstTry++; sOK(); const mi=S.mistakes.indexOf(it.id); if(L.lesson.review && mi>=0) S.mistakes.splice(mi,1); }
  else { L.hearts--; sNO(); L.queue.push(it.id); if(!S.mistakes.includes(it.id)) S.mistakes.push(it.id); L.wrongIds.add(it.id); }
  save();
  if(it.kind==="mcq"){ app.querySelectorAll(".opt").forEach(o=>{ o.disabled=true; const k=+o.dataset.k; if(k===it.a) o.classList.add("right"); else if(k===L.sel) o.classList.add("wrong"); }); }
  const correctTxt = it.kind==="mcq"? clean(it.opts[it.a]) : it.answers[0];
  const praise=["Tuyệt vời!","Chính xác!","Giỏi lắm!","Xuất sắc!","Đúng rồi!"][Math.floor(Math.random()*5)];
  const cb=document.getElementById("cb"); cb.className="checkbar "+(ok?"ok":"no");
  cb.innerHTML=`<div class="in pop"><div class="fbh">${ok?"✔ "+praise:"✘ Chưa đúng"}</div><div class="fbtxt">${ok?"":`<div>Đáp án đúng: <b>${esc(correctTxt)}</b></div>`}<div>${it.ex}</div>${it.vi&&clean(it.vi).length<240?`<div class="viline">${it.vi}</div>`:""}</div>
  <div style="display:flex;gap:10px">${(it.full||it.isWord)?`<button class="cbtn ghost" type="button" id="hear" style="flex:0 0 auto;width:auto;padding:13px 16px" aria-label="Nghe câu đúng">${I.spk.replace('<svg','<svg style="width:22px;height:22px;fill:currentColor"')}</button>`:""}<button class="cbtn ${ok?"ok":"no"}" type="button" id="cont">Tiếp tục</button></div></div>`;
  if(!ok){ const st=app.querySelector(".stage"); st.classList.add("shake"); }
  const hb=document.getElementById("hear"); if(hb) hb.onclick=()=>speak(it.isWord? clean(it.opts[it.a]) : it.full,"en");
  if(it.full && ok) speak(it.full,"en");
  const cont=document.getElementById("cont"); cont.onclick=next; setTimeout(()=>{try{cont.focus({preventScroll:true})}catch(e){}},30);
  const pb=app.querySelector(".pbar i"); if(pb) pb.style.width=(L.correct/L.total*100)+"%";
  const hs=app.querySelector(".hearts"); if(hs) hs.innerHTML=I.heart+L.hearts;
}
function next(){ L.pos++; if(L.pos>=L.queue.length && L.correct<L.total){ /* safety */ } renderQ() }
function finish(won){
  document.onkeydown=null;
  const acc=Math.round(L.firstTry/L.total*100);
  if(won){
    const xp=10+(L.hearts===5?5:0)+(acc===100?5:0);
    S.xp+=xp; S.todayXp+=xp; const t=todayStr(); if(S.last!==t){ S.streak=(S.streak||0)+1; S.last=t; }
    if(!L.lesson.review) S.done[L.lesson.id]=Math.min(3,(S.done[L.lesson.id]||0)+1);
    save(); sWIN();
    const secs=Math.round((Date.now()-L.start)/1000), mm=Math.floor(secs/60), ss=String(secs%60).padStart(2,"0");
    app.innerHTML=`<div class="result">${mascot()}<h1 style="font-size:2rem;color:var(--sun-dk)">${L.lesson.review?"Đã ôn xong!":"Hoàn thành bài học!"}</h1><p style="margin:0;color:var(--muted)">${esc(L.lesson.label)}</p>
    <div class="tiles3"><div class="stat" style="border-color:var(--xp)"><b style="background:var(--xp)">Tổng XP</b><span style="color:var(--xp)">+${xp}</span></div>
    <div class="stat" style="border-color:var(--ok)"><b style="background:var(--ok)">Chính xác</b><span style="color:var(--ok)">${acc}%</span></div>
    <div class="stat" style="border-color:#1CB0F6"><b style="background:#1CB0F6">Thời gian</b><span style="color:#1CB0F6">${mm}:${ss}</span></div></div>
    ${L.wrongIds.size?`<p style="margin:0">Có ${L.wrongIds.size} câu em làm sai đã được lưu vào mục <b>Ôn lỗi sai</b>.</p>`:`<p style="margin:0">Không sai câu nào. Xuất sắc!</p>`}
    <div style="display:grid;gap:10px;width:100%"><button class="cbtn" type="button" id="go">Tiếp tục</button><button class="cbtn ghost" type="button" id="rep">Chơi lại (đảo câu và đáp án)</button></div></div>`;
  } else {
    app.innerHTML=`<div class="result">${mascot("sad")}<h1 style="font-size:2rem;color:var(--no)">Hết tim rồi!</h1><p style="margin:0">Em đã làm đúng ${L.correct}/${L.total} câu. Đọc kỹ lời giải và thử lại nhé – lần này câu hỏi và đáp án sẽ được đảo lại.</p>
    <div style="display:grid;gap:10px;width:100%"><button class="cbtn" type="button" id="rep">Thử lại</button><button class="cbtn ghost" type="button" id="go">Về bản đồ</button></div></div>`;
  }
  const lesson=L.lesson;
  document.getElementById("go").onclick=home;
  document.getElementById("rep").onclick=()=>startLesson(lesson.review?{...lesson,items:shuffle(S.mistakes.length?S.mistakes:lesson.items).slice(0,10)}:lesson);
  window.scrollTo(0,0);
}
home();
</script>

</body>
