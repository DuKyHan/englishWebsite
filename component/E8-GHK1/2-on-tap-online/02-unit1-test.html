<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Unit 1 Test · English 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column like a lesson app — top progress, question card, sticky check bar at the bottom */
:root{
  --bg:#F3F7F6; --card:#FFFFFF; --ink:#12343B; --muted:#5A7075; --line:#CFDCD9;
  --brand:#1B7F6B; --brand-d:#0F5E4F; --sun:#FFD43B; --sun-ink:#5C4500;
  --ok:#2E9E4F; --ok-bg:#E3F6E8; --bad:#D64545; --bad-bg:#FDE8E8; --chip:#E8F1EF;
  --display:'Baloo 2',ui-rounded,'Segoe UI',Arial,sans-serif; --body:'Be Vietnam Pro','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1D1F; --card:#16292C; --ink:#E6F0EE; --muted:#9DB3B0; --line:#2C4448;
  --brand:#3CC2A2; --brand-d:#2A9C82; --sun:#FFD43B; --sun-ink:#3A2C00;
  --ok:#5BD07E; --ok-bg:#163A24; --bad:#FF7A7A; --bad-bg:#3E1C1C; --chip:#1F3639; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1D1F; --card:#16292C; --ink:#E6F0EE; --muted:#9DB3B0; --line:#2C4448;
  --brand:#3CC2A2; --brand-d:#2A9C82; --sun:#FFD43B; --sun-ink:#3A2C00;
  --ok:#5BD07E; --ok-bg:#163A24; --bad:#FF7A7A; --bad-bg:#3E1C1C; --chip:#1F3639; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 140px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
/* ---------- start ---------- */
.hero{display:grid;gap:10px;padding-block:12px 20px}
.hero h1{font-size:clamp(36px,8vw,52px);font-weight:800}
.hero p{margin:0;color:var(--muted)}
.form{display:grid;grid-template-columns:2fr 1fr;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.form label{display:grid;gap:6px;font-weight:600;font-size:14px;min-width:0}
.form input{font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:100%}
.form input.err{border-color:var(--bad)}
.form .msg{grid-column:1/-1;color:var(--bad);font-size:14px;margin:0}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.parts{display:grid;gap:8px;margin-block:18px}
.part{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-radius:14px;border:1px solid var(--line)}
.part .n{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--brand);font-family:var(--display);font-weight:800;font-size:18px;display:grid;place-items:center}
.part b{display:block;font-size:15px}.part small{color:var(--muted);font-size:13px}
.part .c{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.big{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--brand-d);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brand-d)}
.big:disabled{background:var(--line);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.big.alt{background:var(--card);color:var(--brand);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.hist{margin-top:22px}
.hist h3{font-size:20px;margin-bottom:8px}
.hist table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist th{color:var(--muted);font-weight:600}
.rules{font-size:14px;color:var(--muted);margin:12px 0 0;padding-left:18px}
/* ---------- quiz ---------- */
.top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
.x{border:0;background:none;color:var(--muted);font-size:26px;line-height:1;padding:4px 6px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .35s}
.streak{font-family:var(--display);font-weight:800;color:var(--sun-ink);background:var(--sun);border-radius:99px;padding:2px 10px;font-size:15px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--chip);color:var(--brand);border-radius:99px;padding:3px 10px}
.tag.rev{background:var(--sun);color:var(--sun-ink)}
.q{margin-top:16px;display:grid;gap:16px}
.inst{font-family:var(--display);font-size:24px;font-weight:700}
.prompt{font-size:20px;font-weight:500;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.prompt .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--brand);color:var(--brand);font-weight:700;text-align:center}
.cue{display:inline-block;margin-left:6px;font-weight:700;color:var(--sun-ink);background:var(--sun);border-radius:8px;padding:0 8px}
details.passage{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
details.passage summary{font-weight:700;color:var(--brand);cursor:pointer}
details.passage p{margin:10px 0 0;font-size:15.5px;line-height:1.65;max-width:65ch}
details.passage mark{background:var(--sun);color:var(--sun-ink);border-radius:4px;padding:0 4px;font-weight:700}
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:1fr 1fr}
@media (max-width:420px){.opts.grid{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:18px;box-shadow:0 4px 0 var(--line);min-width:0}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.opt u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
.opt.sel{border-color:var(--brand);background:var(--chip);box-shadow:0 4px 0 var(--brand)}
.opt.sel .k{border-color:var(--brand);color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.type{font:inherit;font-size:20px;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
.build{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.start{font-weight:700;color:var(--brand);align-self:center;font-size:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.tok{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:17px;box-shadow:0 3px 0 var(--line)}
.tok.used{visibility:hidden}
/* ---------- feedback bar ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:10}
.foot .in{max-width:680px;margin:0 auto;display:grid;gap:10px}
.foot.ok{background:var(--ok-bg);border-color:var(--ok)}
.foot.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-size:24px}
.foot.ok .fb h3{color:var(--ok)} .foot.bad .fb h3{color:var(--bad)}
.fb p{margin:4px 0 0;font-size:15px}
.fb .ans{font-weight:700}
.foot.ok .big{background:var(--ok);box-shadow:0 5px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.foot.bad .big{background:var(--bad);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 70%,#000)}
/* ---------- result ---------- */
.res{display:grid;gap:18px;padding-top:10px}
.cert{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:6px;text-align:center}
.cert .who{font-size:18px;font-weight:700}
.cert .score{font-family:var(--display);font-size:84px;font-weight:800;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.cert .score small{font-size:30px;color:var(--muted)}
.cert .line{color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.brk{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.brow .t{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.brow .t i{display:block;height:100%;background:var(--brand)}
.brow .v{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:420px){.brow{grid-template-columns:110px 1fr 46px}}
.wrongs{display:grid;gap:10px}
.wr{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;padding:12px 14px;font-size:15px}
.wr .a{color:var(--ok);font-weight:700}.wr .y{color:var(--bad)}
.wr .e{color:var(--muted);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20}
.pop{animation:pop .25s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sel-copy{width:100%;min-height:120px;font:inherit;font-size:13px;margin-top:8px;border-radius:12px;padding:10px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
</style>

<div class="wrap" id="app"></div>
<div class="foot" id="foot" hidden><div class="in"><div class="fb" id="fb"></div><button class="big" id="act">Kiểm tra</button></div></div>

<script>
const PARTS = [{"id": "pron", "name": "Phonetics", "vi": "Phát âm", "inst": "Choose the word whose underlined part is pronounced differently.", "qs": [{"t": "choice", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["sch<u>oo</u>l", "f<u>oo</u>d", "d<u>oo</u>r", "p<u>oo</u>l"], "ans": 2, "expl": "“door” đọc /ɔː/; các từ còn lại đọc /uː/."}, {"t": "choice", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["ch<u>oo</u>se", "c<u>oo</u>l", "g<u>oo</u>d", "t<u>oo</u>l"], "ans": 2, "expl": "“good” đọc /ʊ/; các từ còn lại đọc /uː/."}, {"t": "choice", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["j<u>u</u>ne", "b<u>u</u>ll", "tr<u>u</u>th", "fl<u>u</u>"], "ans": 1, "expl": "“bull” đọc /ʊ/; các từ còn lại đọc /uː/."}, {"t": "choice", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["picture<u>s</u>", "watch<u>es</u>", "bus<u>es</u>", "brush<u>es</u>"], "ans": 0, "expl": "“pictures” đọc /z/; các từ còn lại tận cùng /tʃ/, /s/, /ʃ/ nên đọc /ɪz/."}, {"t": "choice", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["w<u>o</u>man", "wh<u>o</u>", "m<u>o</u>ve", "l<u>o</u>se"], "ans": 0, "expl": "“woman” đọc /ʊ/; các từ còn lại đọc /uː/."}, {"t": "choice", "prompt": "Chọn từ có phần gạch dưới phát âm khác các từ còn lại.", "opts": ["work<u>ed</u>", "watch<u>ed</u>", "need<u>ed</u>", "walk<u>ed</u>"], "ans": 2, "expl": "“needed” đọc /ɪd/ (tận cùng /d/); các từ còn lại đọc /t/ (tận cùng /k/, /tʃ/)."}], "shuffleQ": true}, {"id": "mcq", "name": "Multiple choice", "vi": "Trắc nghiệm", "inst": "Choose the best answer to complete the sentence.", "qs": [{"t": "choice", "prompt": "About 16% of them love ________ swimming.", "opts": ["to going", "go", "going", "went"], "ans": 2, "expl": "love + V-ing: love going swimming. “to going” sai vì sau “to” không dùng V-ing."}, {"t": "choice", "prompt": "My father likes _________ books and _________ in the pool.", "opts": ["reading - swim", "to read - swimming", "read - swim", "reading - swimming"], "ans": 3, "expl": "like + V-ing; hai động từ nối bằng “and” phải cùng dạng: reading – swimming."}, {"t": "choice", "prompt": "A lot of young families in Viet Nam prefer _______ time doing outdoor activities together.", "opts": ["spending", "spend", "spent", "to spending"], "ans": 0, "expl": "prefer + V-ing: prefer spending time. “to spending” sai vì sau “to” không dùng V-ing."}, {"t": "choice", "prompt": "My sister hates ______ up early to do exercise.", "opts": ["getting", "get", "gets", "to getting"], "ans": 0, "expl": "hate + V-ing: hates getting up. “to getting” sai vì sau “to” không dùng V-ing."}, {"t": "choice", "prompt": "Nam usually _________ football with his friends after school.", "opts": ["plays", "playing", "play", "to play"], "ans": 0, "expl": "Hiện tại đơn (dấu hiệu “usually”), chủ ngữ số ít → plays."}, {"t": "choice", "prompt": "________ helps to improve physical health and sometimes gives us a chance to make friends.", "opts": ["Messaging", "Playing computer games", "Surfing the net", "Playing sports"], "ans": 3, "expl": "Chơi thể thao giúp cải thiện sức khỏe thể chất và kết bạn."}, {"t": "choice", "prompt": "Mark spends a lot of time ________ the internet. He visits one website after another just to watch short videos.", "opts": ["doing", "taking", "surfing", "knitting"], "ans": 2, "expl": "surf the internet: lướt mạng; spend time + V-ing."}, {"t": "choice", "prompt": "Our cousins detest ________ books and _________ .", "opts": ["reading / draw", "reading / drawing", "to read / to draw", "read / draw"], "ans": 1, "expl": "detest + V-ing; hai động từ song song: reading – drawing."}, {"t": "choice", "prompt": "Alice spends a lot of time _______ her own; she always exercises regularly and does what she enjoys.", "opts": ["on", "in", "about", "for"], "ans": 0, "expl": "on one’s own: một mình."}, {"t": "choice", "prompt": "_______ is a design that you use to make  we cook.", "The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first (5) ______ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to (6) ______ with them."], "qs": [{"t": "choice", "prompt": "Chọn đáp án đúng cho chỗ trống (1).", "opts": ["spending", "to spend", "spend", "spends"], "ans": 0, "expl": "enjoy + V-ing → spending.", "blank": 1}, {"t": "choice", "prompt": "Chọn đáp án đúng cho chỗ trống (2).", "opts": ["to", "with", "from", "on"], "ans": 1, "expl": "connect with sb: gắn kết với ai.", "blank": 2}, {"t": "choice", "prompt": "Chọn đáp án đúng cho chỗ trống (3).", "opts": ["air pollution", "water pollution", "environmental pollution", "fresh air"], "ans": 3, "expl": "Đạp xe về làng quê để tận hưởng không khí trong lành (fresh air).", "blank": 3}, {"t": "choice", "prompt": "Chọn đáp án đúng cho chỗ trống (4).", "opts": ["eat", "cook", "cooks", "cooking"], "ans": 1, "expl": "Song song với “prepare” sau chủ ngữ “we” → cook.", "blank": 4}, {"t": "choice", "prompt": "Chọn đáp án đúng cho chỗ trống (5).", "opts": ["award", "gift", "prize", "medal"], "ans": 2, "expl": "win the first prize: đạt giải nhất.", "blank": 5}, {"t": "choice", "prompt": "Chọn đáp án đúng cho chỗ trống (6).", "opts": ["connect", "connecting", "connected", "connection"], "ans": 0, "expl": "a way to + V nguyên mẫu → connect.", "blank": 6}]}, {"id": "tf", "name": "True / False", "vi": "Đọc hiểu", "inst": "Read the passage and answer.", "passage": ["My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn’t cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my f const TOTAL = PARTS.reduce((a,p)=>a+p.qs.length,0);
const $ = s=>document.querySelector(s);
const app = $('#app'), foot = $('#foot'), fb = $('#fb'), act = $('#act');
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s=>String(s).replace(/<[^>]+>/g,'');
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const norm = s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]+/g,' ').replace(/\s+/g,' ').trim();

/* ---------- sound ---------- */
let ac=null, soundOn=store.get('u1s',true);
function tone(seq){ if(!soundOn) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); let t=ac.currentTime;
  seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);t+=d*.8}); }catch(e){} }
const sOk=()=>tone([[660,.12],[880,.18]]), sBad=()=>tone([[220,.18],[180,.22]]), sWin=()=>tone([[523,.14],[659,.14],[784,.14],[1047,.3]]);

/* ---------- state ---------- */
let S = null;
function buildRun(){
  const list=[];
  PARTS.forEach((p,pi)=>{
    let qs=p.qs.map((q,qi)=>({p:pi,qi,q}));
    if(p.shuffleQ) qs=shuffle(qs);
    qs.forEach(it=>{
      if(it.q.opts){ const idx=it.q.opts.map((_,i)=>i); it.order = it.q.fixed? idx : shuffle(idx); }
      if(it.q.tokens){ it.bank = shuffle(it.q.tokens.concat(it.q.distract||[])); }
      list.push(it);
    });
  });
  return list;
}

/* ---------- start screen ---------- */

  $('#snd').onclick=()=>{soundOn=!soundOn;store.set('u1s',soundOn);startScreen()};

/* ---------- question ---------- */
let cur=null;
function showQ(){
  const queue = S.inReview? S.review : S.list;
  if(S.i>=queue.length){
    if(!S.inReview && S.review.length){ S.inReview=true; S.i=0; S.review=shuffle(S.review).map(it=>({...it,order:it.order&&!it.q.fixed?shuffle(it.order):it.order,bank:it.bank&&shuffle(it.bank)})); return showQ(); }
    return result();
  }
  const it=queue[S.i], p=PARTS[it.p], q=it.q;
  cur={it,sel:null,built:[],done:false};
  const answered=Object.keys(S.first).length;
  const pct = S.inReview? 100 : answered/TOTAL*100;
  let body='';
  if(q.t==='choice'){
    let pr = q.prompt;
    if(p.id==='pron') pr='';
    if(p.id==='gap') pr=`Chỗ trống <b>(${q.blank})</b> trong đoạn văn`;
    const longest=Math.max(...q.opts.map(o=>strip(o).length));
    body += pr? `<div class="prompt">${fmtPrompt(pr)}</div>`:'';
    body += `<div class="opts ${longest<=18?'grid':''}">${it.order.map((oi,k)=>`<button class="opt" data-i="${oi}"><span class="k">${k+1}</span><span>${q.opts[oi]}</span></button>`).join('')}</div>`;
  } else if(q.t==='tf'){
    body += `<div class="prompt">${esc(q.prompt)}</div><div class="opts grid"><button class="opt" data-i="0"><span class="k">T</span><span>True</span></button><button class="opt" data-i="1"><span class="k">F</span><span>False</span></button></div>`;
  } else if(q.t==='type'){
    body += `<div class="prompt">${fmtPrompt(q.prompt)} <span class="cue">${esc(q.cue)}</span></div><input class="type" id="ty" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ đúng vào đây">`;
  } else if(q.t==='build'){
    body += `<div class="prompt">${esc(q.prompt)}</div><div class="build" id="bd"><span class="start">${esc(q.start)}</span></div><div class="bank" id="bk">${it.bank.map((w,k)=>`<button class="tok" data-k="${k}">${esc(w)}</button>`).join('')}</div>`;
  }
  const passage = p.passage? `<details class="passage" ${S.openP!==false?'open':''}><summary>Đoạn văn</summary>${p.passage.map(t=>`<p>${markBlank(esc(t),q.blank)}</p>`).join('')}</details>`:'';
  app.innerHTML=`
  <div class="top"><button class="x" id="quit" aria-label="Thoát">×</button><div class="bar"><i style="width:${pct}%"></i></div><span class="streak" title="Chuỗi đúng liên tiếp">🔥${S.streak}</span></div>
  <div class="meta"><span>${S.inReview?'<span class="tag rev">Ôn lại câu sai</span>':`<span class="tag">${p.name}</span>`}</span><span>${S.inReview?`${S.i+1}/${S.review.length}`:`Câu ${answered+1}/${TOTAL}`}</span></div>
  <div class="q pop"><div class="inst">${esc(p.inst)}</div>${passage}${body}</div>`;
  $('#quit').onclick=()=>confirmQuit();
  const det=app.querySelector('details.passage'); if(det) det.ontoggle=()=>{S.openP=det.open};
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(cur.done) return; app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); cur.sel=+b.dataset.i; ready(true); });
  const ty=$('#ty'); if(ty){ ty.oninput=()=>ready(ty.value.trim().length>0); ty.onkeydown=e=>{if(e.key==='Enter'&&!act.disabled){e.preventDefault();act.click()}}; setTimeout(()=>ty.focus({preventScroll:true}),50); }
  const bk=$('#bk'); if(bk) bk.querySelectorAll('.tok').forEach(t=>t.onclick=()=>{ if(cur.done) return; t.classList.add('used'); cur.built.push(+t.dataset.k); drawBuild(); });
  foot.hidden=false; foot.className='foot'; fb.innerHTML=''; act.textContent='Kiểm tra'; act.onclick=check; ready(false);
  window.scrollTo({top:0});
}
function drawBuild(){
  const it=cur.it, bd=$('#bd');
  bd.innerHTML=`<span class="start">${esc(it.q.start)}</span>`+cur.built.map((k,j)=>`<button class="tok" data-j="${j}">${esc(it.bank[k])}</button>`).join('');
  bd.querySelectorAll('.tok').forEach(t=>t.onclick=()=>{ if(cur.done) return; const k=cur.built.splice(+t.dataset.j,1)[0]; $('#bk').querySelector(`[data-k="${k}"]`).classList.remove('used'); drawBuild(); });
  ready(cur.built.length>0);
}
const fmtPrompt = s=> esc(strip(s)).replace(/_{3,}/g,'<span class="blank">?</span>').replace(/&lt;b&gt;|&lt;\/b&gt;/g,'').replace(/\((\d+)\)/,'<b>($1)</b>');
const markBlank=(t,b)=> b? t.replace(new RegExp('\\('+b+'\\)\\s*_+'),m=>`<mark>${m}</mark>`):t;
function ready(on){ act.disabled=!on; }

function correctText(q){
  if(q.t==='choice') return strip(q.opts[q.ans]);
  if(q.t==='tf') return q.ans===0?'True':'False';
  if(q.t==='type') return q.ans[0];
  return q.full;
}
function check(){
  const it=cur.it,q=it.q; let ok=false, yours='';
  if(q.t==='choice'||q.t==='tf'){ ok=cur.sel===q.ans; yours = q.t==='tf'?(cur.sel===0?'True':'False'):strip(q.opts[cur.sel]);
    app.querySelectorAll('.opt').forEach(b=>{b.disabled=true; const i=+b.dataset.i; if(i===q.ans) b.classList.add('right'); else if(i===cur.sel) b.classList.add('wrong');}); }
  else if(q.t==='type'){ const v=$('#ty').value; yours=v.trim(); ok=q.ans.some(a=>norm(a)===norm(v)); $('#ty').disabled=true; }
  else { yours = q.start+' '+cur.built.map(k=>it.bank[k]).join(' '); const accepted=[q.full].concat(q.answers||[]); ok=accepted.some(a=>norm(a)===norm(yours)); }
  cur.done=true;
  const key=it.p+'-'+it.qi;
  if(!S.inReview){ S.first[key]={ok,yours,it}; if(!ok) S.review.push(it); }
  if(ok){ S.streak++; S.best=Math.max(S.best,S.streak); sOk(); } else { S.streak=0; sBad(); app.querySelector('.q').classList.add('shake'); }
  const praise=['Chính xác!','Tuyệt vời!','Giỏi lắm!','Đúng rồi!','Xuất sắc!'];
  foot.className='foot '+(ok?'ok':'bad');
  fb.innerHTML = ok? `<h3>${praise[Math.random()*praise.length|0]}</h3><p>${esc(strip(q.expl||''))}</p>`
    : `<h3>Chưa đúng rồi</h3><p>Đáp án đúng: <span class="ans">${esc(correctText(q))}</span></p><p>${esc(strip(q.expl||''))}</p>`;
  app.querySelector('.streak').textContent='🔥'+S.streak;
  act.disabled=false; act.textContent='Tiếp tục'; act.onclick=()=>{S.i++;showQ()}; act.focus({preventScroll:true});
}
function confirmQuit(){
  fb.innerHTML=`<h3>Dừng bài làm?</h3><p>Kết quả lần này sẽ không được lưu.</p>`; foot.className='foot bad'; foot.hidden=false;
  act.disabled=false; act.textContent='Thoát ra'; const prev=act.onclick;
  act.onclick=()=>startScreen();
  const back=document.createElement('button'); back.className='big alt'; back.textContent='Làm tiếp'; back.onclick=()=>{back.remove();showQ()};
  fb.appendChild(back); back.style.marginTop='10px';
}

/* ---------- result ---------- */
function result(){
  foot.hidden=true;
  const vals=Object.values(S.first), k=vals.filter(v=>v.ok).length;
  const score=Math.round(k/TOTAL*100)/10;
  const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000));
  const d=new Date(), ds=`${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const hist=store.get('u1h',[]); hist.push({d:ds,n:S.name,c:S.cls,k,s:score}); store.set('u1h',hist.slice(-30));
  sWin();
  const byPart=PARTS.map((p,pi)=>{const v=vals.filter(x=>x.it.p===pi);return{p,ok:v.filter(x=>x.ok).length,n:p.qs.length}});
  const wrong=vals.filter(v=>!v.ok);
  const msg= score>=9?'Xuất sắc! Em nắm bài rất chắc.':score>=7?'Khá tốt! Ôn thêm các câu sai là chắc điểm cao.':score>=5?'Cố lên! Xem lại phần giải thích rồi làm lại nhé.':'Em làm lại thêm vài lần để nhớ bài nhé.';
  const txt=`Ms Stella's English Class – Unit 1 Test (English 8)\nHọ tên: ${S.name}\nLớp: ${S.cls}\nĐúng: ${k}/${TOTAL} – Điểm: ${score}/10\nThời gian: ${mins} phút – ${ds}`;
  app.innerHTML=`<div class="res">
   <div class="cert pop"><span class="eyebrow">Kết quả · Unit 1 Test</span><div class="who">${esc(S.name)} · Lớp ${esc(S.cls)}</div><div class="score">${score}<small>/10</small></div><div class="line">${msg}</div></div>
   <div class="stats"><div class="stat"><b>${k}/${TOTAL}</b><span>câu đúng</span></div><div class="stat"><b>${S.best}</b><span>chuỗi đúng dài nhất</span></div><div class="stat"><b>${mins}′</b><span>thời gian</span></div></div>
   <div><h2 style="font-size:24px;margin-bottom:10px">Theo từng phần</h2><div class="brk">${byPart.map(b=>`<div class="brow"><span>${b.p.name}</span><span class="t"><i style="width:${b.ok/b.n*100}%"></i></span><span class="v">${b.ok}/${b.n}</span></div>`).join('')}</div></div>
   <div class="row2"><button class="big" id="again">Làm lại (đảo đáp án)</button><button class="big alt" id="copy">Sao chép kết quả</button></div>
   <div id="cpwrap"></div>
   ${wrong.length?`<div><h2 style="font-size:24px;margin-bottom:10px">Xem lại ${wrong.length} câu sai</h2><div class="wrongs">${wrong.map(w=>{const q=w.it.q,p=PARTS[w.it.p];const pr=q.t==='choice'&&p.id==='pron'?q.opts.map(strip).join(' · '):p.id==='gap'?'Chỗ trống ('+q.blank+')':strip(q.prompt)+(q.cue?' ('+q.cue+')':'');return `<div class="wr"><div><b>${esc(p.name)}</b> – ${esc(pr)}</div><div class="y">Em chọn: ${esc(w.yours)}</div><div class="a">Đáp án: ${esc(correctText(q))}</div><div class="e">${esc(strip(q.expl||''))}</div></div>`}).join('')}</div></div>`:'<p style="text-align:center;font-weight:700;color:var(--ok)">Không sai câu nào. Quá đỉnh!</p>'}
   <button class="big alt" id="home">Về trang đầu</button>
  </div>`;
  $('#again').onclick=()=>{S={...S,list:buildRun(),i:0,first:{},review:[],inReview:false,streak:0,best:0,t0:Date.now()};showQ()};
  $('#home').onclick=startScreen;
  $('#copy').onclick=()=>{
    const done=()=>toast('Đã sao chép kết quả');
    const fallback=()=>{$('#cpwrap').innerHTML=`<textarea class="sel-copy" id="cpt" readonly>${esc(txt)}</textarea>`;const t=$('#cpt');t.focus();t.select();toast('Bôi đen sẵn, em bấm Copy nhé')};
    try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
  };
  window.scrollTo({top:0});
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
document.addEventListener('keydown',e=>{ if(!cur||cur.done||foot.hidden) return; if(e.target.tagName==='INPUT') return; const n=+e.key; const opts=app.querySelectorAll('.opt'); if(n>=1&&n<=opts.length) opts[n-1].click(); if(e.key==='Enter'&&!act.disabled) act.click(); });
startScreen();
</script>

</body>
</html>
