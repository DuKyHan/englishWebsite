<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập Unit 1-3 — Game Từ Vựng &amp; Ngữ Pháp</title>
<style>
  :root{
    --green:#58cc02; --green-dark:#58a700; --blue:#1cb0f6; --blue-dark:#1899d6;
    --orange:#ff9600; --orange-dark:#e08600; --purple:#cd2bff; --purple-dark:#a500d6;
    --red:#ff4b4b; --red-dark:#ea2b2b; --gray:#e5e5e5; --gray-dark:#afafaf;
    --text:#3c3c3c; --bg:#f7f7f7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  /* ===== HEADER ===== */
  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--gray);
    padding:10px 16px;display:flex;align-items:center;gap:14px;}
  .topbar .brand{font-weight:800;color:var(--green);font-size:18px;flex:0 0 auto;}
  .stat-pill{display:flex;align-items:center;gap:4px;font-weight:700;background:var(--bg);
    border:2px solid var(--gray);border-radius:12px;padding:4px 10px;font-size:14px;}
  .stat-pill.xp{color:var(--orange-dark);} .stat-pill.streak{color:#ff4b4b;}
  .topbar .spacer{flex:1;}

  /* ===== MAP / HOME ===== */
  .map-wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  .unit-card{border-radius:16px;padding:18px 20px;margin-bottom:28px;color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.15);}
  .unit-card h2{margin:0 0 4px;font-size:20px;}
  .unit-card p{margin:0;opacity:.9;font-size:14px;}
  .lesson-path{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:18px;}
  .lesson-row{display:flex;align-items:center;gap:14px;width:100%;max-width:420px;}
  .lesson-row.left{flex-direction:row;}
  .lesson-row.right{flex-direction:row-reverse;}
  .lesson-node{width:64px;height:64px;border-radius:50%;border:none;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);
    position:relative;flex:0 0 auto;transition:transform .1s;}
  .lesson-node:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2);}
  .lesson-label{font-size:13px;font-weight:700;text-align:center;}
  .lesson-stars{font-size:11px;margin-top:2px;}
  .node-stat{font-size:11px;color:var(--gray-dark);margin-top:3px;}

  .final-card{background:linear-gradient(135deg,var(--purple),#8f00e0);}

  /* ===== LESSON SCREEN ===== */
  .lesson-screen{max-width:640px;margin:0 auto;padding:14px 16px 100px;}
  .progress-bar-outer{flex:1;height:16px;background:var(--gray);border-radius:10px;overflow:hidden;}
  .progress-bar-inner{height:100%;background:var(--green);border-radius:10px;transition:width .3s;}
  .hearts{display:flex;align-items:center;gap:3px;font-weight:800;color:var(--red);font-size:15px;}
  .lesson-topbar{display:flex;align-items:center;gap:12px;padding:12px 4px;}
  .close-btn{background:none;border:none;font-size:22px;color:var(--gray-dark);padding:4px;}

  .qcard{background:#fff;border-radius:16px;padding:22px;margin-top:18px;}
  .qmeta{font-size:13px;font-weight:700;color:var(--gray-dark);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
  .qprompt{font-size:22px;font-weight:700;margin-bottom:6px;line-height:1.4;}
  .qipa{color:var(--blue-dark);font-size:15px;margin-bottom:10px;}
  .qpassage{background:var(--bg);border-left:4px solid var(--blue);padding:12px 14px;border-radius:8px;
    font-size:14.5px;line-height:1.6;margin-bottom:14px;max-height:220px;overflow-y:auto;}
  .qpassage .ptitle{font-weight:800;margin-bottom:6px;color:var(--blue-dark);}
  .listen-btn{display:flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border:none;
    border-radius:14px;padding:16px 22px;font-size:17px;font-weight:700;box-shadow:0 4px 0 var(--blue-dark);margin:6px 0 16px;}
  .listen-btn:active{transform:translateY(3px);box-shadow:none;}
  .show-word-link{font-size:13px;color:var(--gray-dark);text-decoration:underline;background:none;border:none;margin-left:10px;}

  .opt-list{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .opt-btn{text-align:left;background:#fff;border:2px solid var(--gray);border-radius:12px;
    padding:14px 16px;font-size:16px;font-weight:600;color:var(--text);box-shadow:0 3px 0 var(--gray);transition:.1s;}
  .opt-btn:hover{background:#f0f8ff;border-color:var(--blue);}
  .opt-btn:active{transform:translateY(2px);box-shadow:none;}
  .opt-btn.selected{border-color:var(--blue);background:#ddf4ff;}
  .opt-btn.correct{border-color:var(--green);background:#d7ffb8;color:var(--green-dark);}
  .opt-btn.wrong{border-color:var(--red);background:#ffdfe0;color:var(--red-dark);}
  .opt-btn:disabled{cursor:default;}

  .bottombar{position:fixed;left:0;right:0;bottom:0;padding:16px;border-top:2px solid var(--gray);
    background:#fff;display:flex;justify-content:center;z-index:40;}
  .bottombar.feedback-correct{background:#d7ffb8;border-top-color:#94e345;}
  .bottombar.feedback-wrong{background:#ffdfe0;border-top-color:#ff9b9c;}
  .bottombar-inner{max-width:640px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .feedback-text{font-weight:800;font-size:16px;}
  .feedback-text.correct{color:var(--green-dark);}
  .feedback-text.wrong{color:var(--red-dark);}
  .feedback-exp{font-size:13.5px;color:var(--text);margin-top:4px;font-weight:500;}
  .btn-main{padding:14px 32px;border:none;border-radius:14px;font-weight:800;font-size:16px;
    color:#fff;background:var(--gray-dark);box-shadow:0 4px 0 #8f8f8f;}
  .btn-main.enabled{background:var(--green);box-shadow:0 4px 0 var(--green-dark);}
  .btn-main.wrongbtn{background:var(--red);box-shadow:0 4px 0 var(--red-dark);}
  .btn-main:active{transform:translateY(3px);box-shadow:none;}

  /* ===== END SCREEN ===== */
  .end-screen{max-width:480px;margin:60px auto;text-align:center;padding:0 20px;}
  .end-screen .big-emoji{font-size:72px;}
  .end-screen h1{font-size:26px;margin:10px 0 6px;}
  .stars-row{font-size:40px;margin:16px 0;}
  .end-stats{display:flex;justify-content:center;gap:28px;margin:22px 0;}
  .end-stat{background:#fff;border-radius:14px;padding:14px 20px;box-shadow:0 3px 0 var(--gray);min-width:90px;}
  .end-stat .val{font-size:22px;font-weight:800;}
  .end-stat .lbl{font-size:12px;color:var(--gray-dark);font-weight:700;}
  .gameover .big-emoji{font-size:72px;}

  @media (max-width:480px){
    .lesson-node{width:56px;height:56px;font-size:22px;}
    .qprompt{font-size:19px;}
    .unit-card{padding:14px 16px;}
  }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand">🦉 Ôn Tập Unit 1-3</div>
  <div class="spacer"></div>

  <div class="stat-pill xp">⭐ <span id="xpVal">0</span> XP</div>
</div>

<div id="mapScreen" class="map-wrap"></div>

<div id="lessonScreen" class="lesson-screen hidden"></div>

<div id="endScreen" class="end-screen hidden"></div>

<div id="bottombar" class="bottombar hidden">
  <div class="bottombar-inner" id="bottombarInner"></div>
</div>

 0, "exp": "Em vừa nghe từ 'well-trained' (adj) — nghĩa là: lành nghề, có tay nghề."}]}, {"id": "u2-grammar-1", "unit": 2, "type": "grammar", "title": "Ngữ pháp 1", "icon": "✏️", "questions": [{"id": "q194", "type": "grammar", "prompt": "This village is ___ (quiet) than the city.", "opts": ["quieter", "more quiet", "quietest", "quiet"], "answer": 0, "exp": "Ôn ngữ pháp: tính từ ngắn (quiet) thêm -er. → quieter than."}, {"id": "q195", "type": "grammar", "prompt": "The weather today is ___ (good) than yesterday.", "opts": ["gooder", "more good", "better", "best"], "answer": 2, "exp": "Ôn ngữ pháp: 'good' là tính từ bất quy tắc → so sánh hơn là 'better'."}, {"id": "q196", "type": "grammar", "prompt": "Life in the countryside is ___ (peaceful) than life in the city.", "opts": ["peacefuler", "more peaceful", "peacefulest", "peaceful"], "answer": 1, "exp": "Ôn ngữ pháp: tính từ dài (3 âm tiết: peace-ful... ) dùng 'more' + adj. → more peaceful than."}, {"id": "q197", "type": "grammar", "prompt": "Her bag is ___ (heavy) than mine.", "opts": ["heavyer", "more heavy", "heavier", "heaviest"], "answer": 2, "exp": "Ôn ngữ pháp: tính từ 2 âm tiết tận cùng -y: đổi y→i rồi thêm -er. → heavier than."}, {"id": "q198", "type": "grammar", "prompt": "This river is ___ (long) than that one.", "opts": ["longer", "more long", "longest", "long"], "answer": 0, "exp": "Ôn ngữ pháp: tính từ ngắn (long) thêm -er. → longer than."}, {"id": "q199", "type": "grammar", "prompt": "The exam was ___ (difficult) than we expected.", "opts": ["difficulter", "more difficult", "difficultest", "difficult"], "answer": 1, "exp": "Ôn ngữ pháp: tính từ dài (difficult, 3 âm tiết) dùng 'more'. → more difficult than."}, {"id": "q200", "type": "grammar", "prompt": "My father drives ___ (careful) than my brother.", "opts": ["carefuler", "more carefully", "carefully", "more careful"], "answer": 1, "exp": "Ôn ngữ pháp: trạng từ tận cùng -ly luôn dùng 'more' + trạng từ. → more carefully than."}, {"id": "q201", "type": " "answer": 0, "exp": "Em vừa nghe từ 'schoolwork' (n) — nghĩa là: bài làm trên lớp."}, {"id": "q317", "type": "listen_choose", "prompt": "session", "ipa": "/ˈseʃn/", "opts": ["(nghề, đồ) thủ công", "chín chắn, trưởng thành", "sự thông báo", "tiết học, buổi học"], "answer": 3, "exp": "Em vừa nghe từ 'session' (n) — nghĩa là: tiết học, buổi học."}, {"id": "q318", "type": "listen_choose", "prompt": "stress", "ipa": "/ˈstres/", "opts": ["sự căng thẳng", "chuyên tâm, tập trung", "sự thông báo", "kết nối"], "answer": 0, "exp": "Em vừa nghe từ 'stress' (n) — nghĩa là: sự căng thẳng."}, {"id": "q319", "type": "listen_choose", "prompt": "stressful", "ipa": "/ˈstresfl/", "opts": ["căng thẳng, gây áp lực", "tài khoản", "chín chắn, trưởng thành", "người ngang hàng, bạn đồng lứa"], "answer": 0, "exp": "Em vừa nghe từ 'stressful' (adj) — nghĩa là: căng thẳng, gây áp lực."}, {"id": "q320", "type": "listen_choose", "prompt": "upload", "ipa": "/ˌʌpˈləʊd/", "opts": ["tải lên", "giữa kì", "(nghề, đồ) thủ công", "đăng nhập vào"], "answer": 0, "exp": "Em vừa nghe từ 'upload' (v) — nghĩa là: tải lên."}]}, {"id": "u3-grammar-1", "unit": 3, "type": "grammar", "title": "Ngữ pháp 1", "icon": "✏️", "questions": [{"id": "q321", "type": "grammar", "prompt": "Identify the sentence type: 'Teenagers often feel stressed before exams.'", "opts": ["Simple sentence", "Compound sentence"], "answer": 0, "exp": "Ôn ngữ pháp: câu chỉ có 1 mệnh đề độc lập (1 chủ ngữ + 1 động từ chính) → câu đơn (simple sentence)."}, {"id": "q322", "type": "grammar", "prompt": "Identify the sentence type: 'She joined the music club, and she made many new friends.'", "opts": ["Simple sentence", "Compound sentence"], "answer": 1, "exp": "Ôn ngữ pháp: câu có 2 mệnh đề độc lập nối bằng 'and' → câu ghép (compound sentence)."}, {"id": "q323", "type": "grammar", "prompt": "He was tired, ___ he kept studying for the test.", "opts": ["so", "but", "and", "for"], "answer": 1, "exp": "Ôn ngữ pháp: 'but' diễn tả sự tương phản (mặc dù mệt vẫn tiếp tục học). → He was tired, but he kept studying."}, {"id": "q324", "type": "grammar", "prompt": "You can join the art club, ___ you can join the chess club.", "opts": ["or", "nor", "yet", "for"], "answer": 0, "exp": "Ôn ngữ pháp: 'or' diễn tả sự lựa chọn giữa hai khả năng. → You can join the art club, or you can join the chess club."}, {"id": "q325", "type": "grammar", "prompt": "She did not do her homework, ___ did she review her notes.", "opts": ["and", "nor", "or", "so"], "answer": 1, "exp": "Ôn ngữ pháp: 'nor' nối hai mệnh đề phủ định, và mệnh đề sau 'nor' phải đảo ngữ (did she). → She did not do her homework, nor did she review her notes."}, {"id": "q326", "type": "grammar", "prompt": "He studied hard, ___ he passed the exam easily.", "opts": ["so", "but", "or", "nor"], "answer": 0, "exp": "Ôn ngữ pháp: 'so' diễn tả kết quả (vì học chăm nên đỗ dễ dàng). → He studied hard, so he passed the exam easily."}, {"id": "q327", "type": "grammar", "prompt": "I wanted to join the club, ___ I was too busy.", "opts": ["but", "so", "and", "for"], "answer": 0, "exp": "Ôn ngữ pháp: 'but' diễn tả sự tương phản (muốn tham gia nhưng lại quá bận). → I wanted to join the club, but I was too busy."}, {"id": "q328", "type": "grammar", "prompt": "She is quiet, ___ her brother is very talkative.", "opts": ["and", "for", "nor", "yet"], "answer": 3, "exp": "Ôn ngữ pháp: 'yet' diễn tả sự tương phản bất ngờ (trái ngược tính cách). → She is quiet, yet her brother is very talkative."}]}, {"id": "u3-grammar-2", "unit": 3, "type": "grammar", "title": "Ngữ pháp 2", "icon": "✏️", "questions": [{"id": "q329", "type": "grammar", "prompt": "Which coordinating conjunction means 'reason' (similar to 'because')?", "opts": ["for", "and", "but", "or"], "answer": 0, "exp": "Ôn ngữ pháp: trong 7 liên từ FANBOYS, 'for' mang nghĩa lí do, tương tự 'because'."}, {"id": "q330", "type": "grammar", "prompt": "Which of these is a compound sentence?", "opts": ["Minh feels stressed.", "Minh feels stressed, but he tries to stay calm.", "Minh feels stressed before tests.", "Minh, who feels stressed, studies hard."], "answer": 1, "exp": "Ôn ngữ pháp: câu ghép cần 2 mệnh đề độc lập nối bằng liên từ (but). Câu B có đủ 2 mệnh đề độc lập."}, {"id": "q331", "type": "grammar", "prompt": "Which sentence pattern below matches: 'My teacher gave us some advice.'", "opts": ["S + V", "S + V + O + O", "S + V + C", "S + V + Adv"], "answer": 1, "exp": "Ôn ngữ pháp: 'gave' là động từ có 2 tân ngữ (us = tân ngữ gián tiếp, advice = tân ngữ trực tiếp) → S+V+O+O."}, {"id": "q332", "type": "grammar", "prompt": "Which sentence pattern matches: 'The forum became very popular.'", "opts": ["S + V + C", "S + V + O", "S + V + Adv", "S + V + O + C"], "answer": 0, "exp": "Ôn ngữ pháp: 'became' là động từ nối (linking verb), theo sau là bổ ngữ chủ ngữ (complement) 'very popular' → S+V+C."}, {"id": "q333", "type": "grammar", "prompt": "A simple sentence can contain:", "opts": ["Only one independent clause", "Two independent clauses joined by 'and'", "Two independent clauses joined by a comma only", "Three independent clauses"], "answer": 0, "exp": "Ôn ngữ pháp: câu đơn chỉ có duy nhất một mệnh đề độc lập."}, {"id": "q334", "type": "grammar", "prompt": "The seven coordinating conjunctions are often remembered by the acronym:", "opts": ["FANBOYS", "SVOCA", "ABCDE", "WHWH"], "answer": 0, "exp": "Ôn ngữ pháp: FANBOYS = for, and, nor, but, or, yet, so - 7 liên từ kết hợp dùng để nối 2 mệnh đề độc lập."}, {"id": "q335", "type": "grammar", "prompt": "Choose the correct compound sentence.", "opts": ["She was tired she went to bed early.", "She was tired, so she went to bed early.", "She was tired so went to bed early.", "She tired, so went to bed early."], "answer": 1, "exp": "Ôn ngữ pháp: câu ghép cần dấu phẩy trước liên từ và mỗi mệnh đề phải có đủ chủ ngữ + động từ. → She was tired, so she went to bed early."}, {"id": "q336", "type": "grammar", "prompt": "Minh's friends support him, ___ his parents are proud of him.", "opts": ["and", "but", "nor", "or"], "answer": 0, "exp": "Ôn ngữ pháp: 'and' diễn tả sự bổ sung, hai ý cùng chiều (được bạn ủng hộ và được cha mẹ tự hào). → ...and his parents are proud of him."}]}, {"id": "u3-grammar-3", "unit": 3, "type": "grammar", "title": "Ngữ pháp 3", "icon": "✏️", "questions": [{"id": "q337", "type": "grammar", "prompt": "Do your homework now, ___ you will not have time later.", "opts": ["or", "and", "for", "yet"], "answer": 0, "exp": "Ôn ngữ pháp: 'or' ở đây mang nghĩa cảnh báo 'nếu không' (do X, or Y sẽ xảy ra). → Do your homework now, or you will not have time later."}, {"id": "q338", "type": "grammar", "prompt": "Which word joins two negative clauses and requires inversion (đảo ngữ) in the second clause?", "opts": ["and", "nor", "but", "so"], "answer": 1, "exp": "Ôn ngữ pháp: 'nor' nối 2 mệnh đề phủ định và mệnh đề sau nó phải đảo trợ động từ lên trước chủ ngữ."}, {"id": "q339", "type": "grammar", "prompt": "Peer pressure can be harmful, ___ it can also motivate teens to do better.", "opts": ["yet", "nor", "so", "for"], "answer": 0, "exp": "Ôn ngữ pháp: 'yet' diễn tả sự tương phản (có hại nhưng cũng có thể tạo động lực). → ...harmful, yet it can also motivate teens."}, {"id": "q340", "type": "grammar", "prompt": "'Teenagers should balance study and leisure.' is an example of a:", "opts": ["Simple sentence", "Compound sentence"], "answer": 0, "exp": "Ôn ngữ pháp: câu chỉ có 1 mệnh đề độc lập → câu đơn, dù có liên từ 'and' nối 2 danh từ (study and leisure) chứ không nối 2 mệnh đề."}, {"id": "q341", "type": "grammar", "prompt": "'Teenagers should balance study and leisure, and they should also get enough sleep.' is a:", "opts": ["Simple sentence", "Compound sentence"], "answer": 1, "exp": "Ôn ngữ pháp: câu có 2 mệnh đề độc lập nối bằng 'and' → câu ghép."}, {"id": "q342", "type": "grammar", "prompt": "In a compound sentence, each clause:", "opts": ["Must be able to stand alone as a complete sentence", "Cannot have its own subjec const STORAGE_KEY = "duo_u123_progress_v1";

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {lessons:{}, xp:0, streak:0}; }
  catch(e){ return {lessons:{}, xp:0, streak:0}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();

function renderTopStats(){
  document.getElementById('xpVal').textContent = PROGRESS.xp || 0;
  document.getElementById('streakVal').textContent = PROGRESS.streak || 0;
}

function showScreen(name){
  document.getElementById('mapScreen').classList.toggle('hidden', name!=='map');
  document.getElementById('lessonScreen').classList.toggle('hidden', name!=='lesson');
  document.getElementById('endScreen').classList.toggle('hidden', name!=='end');
  document.getElementById('bottombar').classList.toggle('hidden', name!=='lesson');
  window.scrollTo(0,0);
}

/* ============ MAP ============ */
function renderMap(){
  const wrap = document.getElementById('mapScreen');
  wrap.innerHTML = '';
  LESSONS.forEach(unit=>{
    const card = document.createElement('div');
    card.className = 'unit-card' + (unit.id==='final' ? ' final-card' : '');
    if(unit.id!=='final') card.style.background = unit.color;
    const totalQ = unit.lessons.reduce((s,l)=>s+l.questions.length,0);
    card.innerHTML = `<h2>${unit.name}</h2><p>${unit.lessons.length} bài · ${totalQ} câu hỏi</p>`;
    const path = document.createElement('div');
    path.className = 'lesson-path';
    unit.lessons.forEach((lesson, idx)=>{
      const row = document.createElement('div');
      row.className = 'lesson-row ' + (idx%2===0 ? 'left':'right');
      const prog = PROGRESS.lessons[lesson.id];
      const stars = prog ? prog.stars : 0;
      const btn = document.createElement('button');
      btn.className = 'lesson-node';
      btn.style.background = stars>0 ? 'var(--green)' : 'rgba(255,255,255,.25)';
      btn.style.border = stars>0 ? '3px solid var(--green-dark)' : '3px solid rgba(255,255,255,.5)';
      btn.innerHTML = lesson.icon;
      btn.onclick = ()=>startLesson(unit, lesson);
      const label = document.createElement('div');
      label.innerHTML = `<div class="lesson-label">${lesson.title}</div>
        <div class="lesson-stars">${stars>0 ? '⭐'.repeat(stars) : ''}</div>
        <div class="node-stat">${lesson.questions.length} câu</div>`;
      row.appendChild(btn);
      row.appendChild(label);
      path.appendChild(row);
    });
    card.appendChild(path);
    wrap.appendChild(card);
  });
  renderTopStats();
}

/* ============ LESSON ENGINE ============ */
let CUR = null; // {unit, lesson, queue, idx, hearts, correctCount, xpGain, answered, selectedIdx}

function startLesson(unit, lesson){
  CUR = {
    unit, lesson,
    queue: lesson.questions.map(q=>({...q, _requeued:false})),
    idx: 0,
    hearts: 5,
    correctCount: 0,
    mistakeCount: 0,
    xpGain: 0,
    answered: false,
    selectedIdx: null
  };
  showScreen('lesson');
  renderQuestion();
}

function currentQ(){ return CUR.queue[CUR.idx]; }

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return false;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

function renderQuestion(){
  const scr = document.getElementById('lessonScreen');
  const q = currentQ();
  CUR.answered = false; CUR.selectedIdx = null;
  const total = CUR.queue.length;
  const pct = Math.round((CUR.idx/total)*100);

  let html = `<div class="lesson-topbar">
    <button class="close-btn" onclick="exitLesson()">✕</button>
    <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pct}%"></div></div>
    <div class="hearts">❤️ ${CUR.hearts}</div>
  </div>`;

  html += `<div class="qcard">`;

  if(q.type==='mcq_meaning'){
    html += `<div class="qmeta">Chọn nghĩa đúng</div>
      <div class="qprompt">${q.prompt}</div>
      <div class="qipa">${q.ipa||''}</div>`;
  } else if(q.type==='fill_blank'){
    html += `<div class="qmeta">Điền từ còn thiếu</div>
      <div class="qprompt">${q.prompt}</div>
      <div class="qipa">${q.vi||''}</div>`;
  } else if(q.type==='listen_choose'){
    html += `<div class="qmeta">Nghe và chọn nghĩa đúng</div>
      <button class="listen-btn" onclick="speak(currentQ().prompt)">🔊 Nghe từ</button>
      <button class="show-word-link" onclick="document.getElementById('hiddenWord').classList.toggle('hidden')">Hiện từ (nếu không nghe được)</button>
      <div id="hiddenWord" class="qprompt hidden" style="margin-top:8px;">${q.prompt} <span class="qipa">${q.ipa||''}</span></div>`;
  } else if(q.type==='grammar'){
    html += `<div class="qmeta">Ngữ pháp</div><div class="qprompt" style="font-size:18px;">${q.prompt}</div>`;
  } else if(q.type==='reading'){
    html += `<div class="qmeta">Đọc hiểu</div>
      <div class="qpassage"><div class="ptitle">${q.passageTitle}</div>${q.passageText}</div>
      <div class="qprompt" style="font-size:18px;">${q.prompt}</div>`;
  }

  html += `<div class="opt-list" id="optList"></div>`;
  html += `</div>`;
  scr.innerHTML = html;

  const optList = document.getElementById('optList');
  q.opts.forEach((opt, i)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = opt;
    b.onclick = ()=>selectOption(i);
    optList.appendChild(b);
  });

  if(q.type==='listen_choose'){ setTimeout(()=>speak(q.prompt), 300); }

  renderBottomBar();
}

function selectOption(i){
  if(CUR.answered) return;
  CUR.selectedIdx = i;
  document.querySelectorAll('.opt-btn').forEach((b,idx)=>{
    b.classList.toggle('selected', idx===i);
  });
  renderBottomBar();
}

function renderBottomBar(){
  const bar = document.getElementById('bottombar');
  const inner = document.getElementById('bottombarInner');
  bar.className = 'bottombar';
  if(!CUR.answered){
    const enabled = CUR.selectedIdx !== null;
    inner.innerHTML = `<div></div><button id="checkBtn" class="btn-main ${enabled?'enabled':''}" ${enabled?'':'disabled'} onclick="checkAnswer()">KIỂM TRA</button>`;
  } else {
    const q = currentQ();
    const correct = CUR.selectedIdx === q.answer;
    bar.className = 'bottombar ' + (correct ? 'feedback-correct':'feedback-wrong');
    inner.innerHTML = `<div>
        <div class="feedback-text ${correct?'correct':'wrong'}">${correct ? '✅ Chính xác!' : '❌ Chưa đúng'}</div>
        <div class="feedback-exp">${q.exp || ''}</div>
      </div>
      <button class="btn-main ${correct?'enabled':'wrongbtn'}" onclick="nextQuestion()">TIẾP TỤC</button>`;
  }
}

function checkAnswer(){
  if(CUR.selectedIdx===null || CUR.answered) return;
  CUR.answered = true;
  const q = currentQ();
  const correct = CUR.selectedIdx === q.answer;
  document.querySelectorAll('.opt-btn').forEach((b,idx)=>{
    b.disabled = true;
    if(idx===q.answer) b.classList.add('correct');
    else if(idx===CUR.selectedIdx && !correct) b.classList.add('wrong');
  });
  if(correct){
    CUR.correctCount++;
    CUR.xpGain += q._requeued ? 5 : 10;
  } else {
    CUR.hearts--;
    CUR.mistakeCount++;
    if(!q._requeued){
      const requeued = {...q, _requeued:true};
      CUR.queue.push(requeued);
    }
  }
  renderBottomBar();
  if(CUR.hearts<=0){
    setTimeout(()=>{ if(CUR.hearts<=0) showGameOver(); }, 50);
  }
}

function nextQuestion(){
  if(CUR.hearts<=0){ showGameOver(); return; }
  CUR.idx++;
  if(CUR.idx >= CUR.queue.length){
    finishLesson();
  } else {
    renderQuestion();
  }
}

function exitLesson(){
  CUR = null;
  showScreen('map');
}

function showGameOver(){
  const scr = document.getElementById('endScreen');
  scr.className = 'end-screen gameover';
  scr.innerHTML = `<div class="big-emoji">💔</div>
    <h1>Hết tim rồi!</h1>
    <p>Đừng lo, em có thể làm lại bài này. Càng luyện tập, càng giỏi!</p>
    <div class="end-stats">
      <div class="end-stat"><div class="val">${CUR.correctCount}</div><div class="lbl">ĐÚNG</div></div>
      <div class="end-stat"><div class="val">${CUR.mistakeCount}</div><div class="lbl">SAI</div></div>
    </div>
    <button class="btn-main enabled" style="margin-right:10px;" onclick="retryLesson()">LÀM LẠI</button>
    <button class="btn-main" style="background:var(--gray-dark);box-shadow:0 4px 0 #8f8f8f;" onclick="exitToMap()">VỀ BẢN ĐỒ</button>`;
  showScreen('end');
}

function retryLesson(){
  startLesson(CUR.unit, CUR.lesson);
}
function exitToMap(){
  CUR = null;
  renderMap();
  showScreen('map');
}

function finishLesson(){
  const mistakes = CUR.mistakeCount;
  let stars = 3;
  if(mistakes>=5) stars = 1; else if(mistakes>=2) stars = 2;
  const prev = PROGRESS.lessons[CUR.lesson.id];
  const bestStars = prev ? Math.max(prev.stars, stars) : stars;
  PROGRESS.lessons[CUR.lesson.id] = {stars: bestStars, lastScore: CUR.correctCount};
  PROGRESS.xp = (PROGRESS.xp||0) + CUR.xpGain;
  PROGRESS.streak = (PROGRESS.streak||0) + 1;
  saveProgress(PROGRESS);

  const scr = document.getElementById('endScreen');
  scr.className = 'end-screen';
  scr.innerHTML = `<div class="big-emoji">🎉</div>
    <h1>Hoàn thành bài học!</h1>
    <div class="stars-row">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="end-stats">
      <div class="end-stat"><div class="val">+${CUR.xpGain}</div><div class="lbl">XP</div></div>
      <div class="end-stat"><div class="val">${CUR.correctCount}</div><div class="lbl">ĐÚNG</div></div>
      <div class="end-stat"><div class="val">${CUR.mistakeCount}</div><div class="lbl">SAI</div></div>
    </div>
    <button class="btn-main enabled" onclick="exitToMap()">TIẾP TỤC</button>`;
  showScreen('end');
}

/* ============ INIT ============ */
renderMap();
showScreen('map');
</script>
</body>
</html>
