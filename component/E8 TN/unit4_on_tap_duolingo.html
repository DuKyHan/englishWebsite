<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Unit 4 – Global Success 8</title>
<style>
  :root{
    color-scheme: light;
    --green:#58cc02; --green-d:#58a700; --green-l:#d7ffb8;
    --blue:#1cb0f6; --blue-d:#1899d6; --blue-l:#ddf4ff;
    --red:#ff4b4b; --red-d:#ea2b2b; --red-l:#ffdfe0;
    --yellow:#ffc800; --yellow-d:#e5b400; --orange:#ff9600; --orange-d:#d97e00;
    --gray:#e5e5e5; --gray-d:#afafaf; --ink:#3c3c3c; --ink2:#6b6b6b; --bg:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Nunito","Segoe UI","Be Vietnam Pro",Arial,sans-serif;
    font-size:18px; line-height:1.45; font-weight:700;
  }
  button{font:inherit; color:inherit; cursor:pointer}
  [hidden]{display:none !important}

  /* ---------- nút chung ---------- */
  .btn{
    display:inline-block; border:0; border-radius:16px; padding:14px 26px;
    font-weight:900; letter-spacing:.8px; text-transform:uppercase; font-size:16px;
    background:var(--green); color:#fff; border-bottom:5px solid var(--green-d);
    transition:transform .05s, filter .1s;
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(3px); border-bottom-width:2px; margin-bottom:3px}
  .btn[disabled]{background:var(--gray); color:var(--gray-d); border-bottom-color:#cfcfcf; cursor:not-allowed; transform:none; margin:0}
  .btn.blue{background:var(--blue); border-bottom-color:var(--blue-d)}
  .btn.ghost{background:#fff; color:var(--blue-d); border:2px solid var(--gray); border-bottom-width:5px}
  .btn.red{background:var(--red); border-bottom-color:var(--red-d)}
  .btn.wide{width:100%}

  /* ---------- màn hình chính ---------- */
  #home{max-width:560px; margin:0 auto; padding:0 16px 60px}
  .topbar{
    position:sticky; top:0; z-index:5; background:#fff; border-bottom:2px solid var(--gray);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 4px; margin:0 -16px 8px; padding-left:16px; padding-right:16px;
  }
  .brand{font-weight:900; color:var(--green-d); font-size:20px; line-height:1.1}
  .brand small{display:block; color:var(--ink2); font-size:12px; font-weight:800}
  .stats{display:flex; gap:8px; align-items:center}
  .chip{display:flex; align-items:center; gap:5px; font-weight:900; font-size:17px; padding:4px 8px; border-radius:12px}
  .chip.fire{color:var(--orange)} .chip.xp{color:var(--yellow-d)}
  .icon-btn{border:2px solid var(--gray); background:#fff; border-radius:12px; width:40px; height:40px; font-size:18px}

  .section{
    border-radius:18px; color:#fff; padding:14px 18px; margin:22px 0 14px;
    border-bottom:5px solid rgba(0,0,0,.18);
  }
  .section h2{margin:0; font-size:20px; letter-spacing:.5px}
  .section p{margin:2px 0 0; font-size:14px; font-weight:700; opacity:.92}
  .path{display:flex; flex-direction:column; align-items:center; gap:14px; padding:6px 0 10px}
  .node{
    width:84px; height:76px; border-radius:50%; border:0; position:relative;
    font-size:34px; display:flex; align-items:center; justify-content:center;
    background:var(--c); box-shadow:0 7px 0 var(--cd); transition:transform .08s, box-shadow .08s;
    transform:translateX(var(--x));
  }
  .node:hover{filter:brightness(1.06)}
  .node:active{transform:translateX(var(--x)) translateY(5px); box-shadow:0 2px 0 var(--cd)}
  .node .lbl{
    position:absolute; top:84px; left:50%; transform:translateX(-50%); white-space:nowrap;
    font-size:14px; font-weight:900; color:var(--ink); text-align:center;
  }
  .node .lbl .st{display:block; font-size:15px; letter-spacing:2px; color:var(--yellow-d); margin-top:1px}
  .node.done{--c:var(--yellow); --cd:var(--yellow-d)}
  .path .gap{height:26px}
  .foot-note{text-align:center; color:var(--ink2); font-size:13px; margin-top:20px}
  .foot-note button{border:0; background:none; text-decoration:underline; color:var(--ink2); font-size:13px}

  /* ---------- modal giới thiệu ---------- */
  #modal{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:#fff; width:100%; max-width:640px; max-height:92vh; overflow:auto;
    border-radius:24px 24px 0 0; padding:22px 22px 26px; animation:up .22s ease-out;
  }
  @keyframes up{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
  .sheet h3{margin:0 0 4px; font-size:24px}
  .sheet .sub{color:var(--ink2); font-size:15px; margin-bottom:12px}
  .rule{border:2px solid var(--gray); border-radius:14px; padding:10px 14px; margin:8px 0; font-size:16px; font-weight:700}
  .rule b{color:var(--blue-d)}
  .rule .aux{color:var(--red-d); font-weight:900}
  .rule .ok{color:var(--green-d); font-weight:900}
  .wordgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 14px}
  .wg{border:2px solid var(--gray); border-radius:12px; padding:6px 10px; font-size:15px; display:flex; gap:6px; align-items:center; justify-content:space-between}
  .wg b{color:var(--blue-d)} .wg span{color:var(--ink2); font-size:13px; text-align:right}
  .sheet .row{display:flex; gap:10px; margin-top:14px}
  .sheet .row .btn{flex:1}

  /* ---------- màn hình làm bài ---------- */
  #lesson{display:flex; flex-direction:column; min-height:100vh; min-height:100dvh}
  .lhead{display:flex; align-items:center; gap:14px; max-width:760px; width:100%; margin:0 auto; padding:16px 16px 6px}
  .x{border:0; background:none; font-size:26px; color:var(--gray-d); padding:0 4px; line-height:1}
  .bar{flex:1; height:18px; border-radius:99px; background:var(--gray); overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--green); border-radius:99px; transition:width .35s; position:relative}
  .bar i::after{content:""; position:absolute; left:8px; right:8px; top:4px; height:5px; border-radius:9px; background:rgba(255,255,255,.35)}
  .hearts{font-weight:900; color:var(--red); font-size:20px; white-space:nowrap}
  #qbox{flex:1; width:100%; max-width:760px; margin:0 auto; padding:14px 18px 190px}
  .q-title{font-size:26px; font-weight:900; margin:12px 0 16px; line-height:1.25}
  .bigword{
    display:flex; align-items:center; gap:12px; font-size:30px; font-weight:900; color:var(--blue-d);
    margin:6px 0 18px; flex-wrap:wrap;
  }
  .spk{
    width:52px; height:52px; border-radius:14px; border:2px solid var(--blue); border-bottom-width:5px;
    background:var(--blue-l); font-size:24px; line-height:1;
  }
  .spk.slow{width:44px; height:44px; font-size:20px}
  .spk:active{transform:translateY(2px)}
  .sentence{font-size:26px; line-height:1.7; margin:4px 0 14px; font-weight:800}
  .blank{display:inline-block; min-width:5em; border-bottom:4px solid var(--gray-d); margin:0 .25em; height:1.1em; vertical-align:baseline}
  .hint{color:var(--ink2); font-size:16px; font-weight:800; margin:0 0 10px}
  .hint b{color:var(--orange-d)}

  .opts{display:grid; gap:12px}
  @media(min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
  .opt{
    display:flex; gap:14px; align-items:center; text-align:left; width:100%;
    background:#fff; border:2px solid var(--gray); border-bottom-width:5px; border-radius:16px; padding:14px 16px;
    font-size:21px; font-weight:800;
  }
  .opt:hover{background:#f7f7f7}
  .opt:focus,.tok:focus,.pc:focus,.srow button:focus{outline:none}
  .opt .key{
    flex:none; width:32px; height:32px; border:2px solid var(--gray); border-radius:9px;
    display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink2);
  }
  .opt.sel{border-color:var(--blue); background:var(--blue-l); color:var(--blue-d)}
  .opt.sel .key{border-color:var(--blue); color:var(--blue-d)}
  .opt.right{border-color:var(--green); background:var(--green-l); color:var(--green-d)}
  .opt.wrong{border-color:var(--red); background:var(--red-l); color:var(--red-d)}
  .locked .opt, .locked .tok, .locked .srow button{pointer-events:none}

  .tin{
    width:100%; font:inherit; font-size:26px; font-weight:800; padding:14px 16px;
    border:2px solid var(--gray); border-bottom-width:5px; border-radius:16px; outline:0; background:#f7f7f7; color:var(--ink);
  }
  .tin:focus{border-color:var(--blue); background:#fff}
  .tin.right{border-color:var(--green); background:var(--green-l)}
  .tin.wrong{border-color:var(--red); background:var(--red-l)}
  .tin-wrap small{display:block; color:var(--ink2); margin-top:8px; font-size:14px}

  /* sắp xếp câu */
  .answerline{min-height:74px; border-top:2px solid var(--gray); border-bottom:2px solid var(--gray); padding:10px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:22px;
    background:repeating-linear-gradient(to bottom, transparent 0, transparent 54px, var(--gray) 54px, var(--gray) 56px)}
  .bank{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  .tok{border:2px solid var(--gray); border-bottom-width:5px; background:#fff; border-radius:14px; padding:8px 14px; font-size:22px; font-weight:800}
  .tok:hover{background:#f4f4f4}
  .tok.used{background:var(--gray); color:transparent; border-color:var(--gray); pointer-events:none}

  /* nối cặp */
  .pairs{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px}
  .pairs .col{display:flex; flex-direction:column; gap:12px}
  .pc{border:2px solid var(--gray); border-bottom-width:5px; background:#fff; border-radius:16px; padding:12px 10px; font-size:19px; font-weight:800; text-align:center; min-height:58px}
  .pc.sel{border-color:var(--blue); background:var(--blue-l); color:var(--blue-d)}
  .pc.done{border-color:transparent; background:#f2f2f2; color:var(--gray-d); border-bottom-width:2px; pointer-events:none; opacity:.55}
  .pc.bad{border-color:var(--red); background:var(--red-l); animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* phân loại */
  .srow{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap}
  .srow .w{flex:1 1 130px; font-size:24px; font-weight:900; color:var(--blue-d)}
  .srow button{border:2px solid var(--gray); border-bottom-width:5px; background:#fff; border-radius:14px; padding:8px 12px; font-size:16px; font-weight:800}
  .srow button.sel{border-color:var(--blue); background:var(--blue-l); color:var(--blue-d)}
  .srow button.right{border-color:var(--green); background:var(--green-l); color:var(--green-d)}
  .srow button.wrong{border-color:var(--red); background:var(--red-l); color:var(--red-d)}

  /* thanh dưới */
  #foot{position:fixed; left:0; right:0; bottom:0; border-top:2px solid var(--gray); background:#fff; z-index:10; padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
  #foot .in{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:14px; justify-content:space-between}
  #foot .msg{display:none; flex:1; font-size:17px; line-height:1.35}
  #foot .msg b{display:block; font-size:22px; font-weight:900}
  #foot .msg span{font-weight:800}
  #foot.ok{background:var(--green-l); border-top-color:var(--green-l)} #foot.ok .msg{display:block; color:var(--green-d)}
  #foot.bad{background:var(--red-l); border-top-color:var(--red-l)} #foot.bad .msg{display:block; color:var(--red-d)}
  #foot.ok .skip,#foot.bad .skip{display:none}
  #foot .skip{border:2px solid var(--gray); border-bottom-width:5px; background:#fff; color:var(--gray-d); border-radius:16px; padding:12px 18px; font-weight:900; text-transform:uppercase; font-size:15px; letter-spacing:.6px}
  #foot.ok #btnMain{background:var(--green); border-bottom-color:var(--green-d)}
  #foot.bad #btnMain{background:var(--red); border-bottom-color:var(--red-d)}
  #foot:not(.ok):not(.bad) .in{justify-content:space-between}
  #foot:not(.ok):not(.bad) #btnMain{min-width:170px}

  /* kết thúc */
  #end{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px}
  #end .big{font-size:76px; line-height:1}
  #end h1{font-size:34px; margin:10px 0 4px; color:var(--yellow-d)}
  #end .stars{font-size:46px; letter-spacing:6px; color:var(--yellow); margin:6px 0 16px}
  .statrow{display:flex; gap:12px; margin:8px 0 28px; flex-wrap:wrap; justify-content:center}
  .stat{border:2px solid var(--gray); border-radius:16px; min-width:120px; overflow:hidden}
  .stat .h{background:var(--c); color:#fff; font-size:12px; letter-spacing:1px; padding:4px 10px; font-weight:900}
  .stat .v{padding:10px; font-size:24px; font-weight:900; color:var(--c)}
  #end .actions{display:flex; flex-direction:column; gap:12px; width:100%; max-width:360px}
  .conf{position:fixed; top:-30px; font-size:26px; animation:fall linear forwards; z-index:40; pointer-events:none}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  @media(max-width:520px){
    body{font-size:17px}
    .q-title{font-size:23px} .opt{font-size:19px} .tin{font-size:23px}
    #foot .msg b{font-size:19px}
  }
</style>
</head>
<body>

<!-- ======================= MÀN HÌNH CHÍNH ======================= -->
<div id="home">
  <div class="topbar">
    <div class="brand">Unit 4 · Ethnic groups of Viet Nam<small>Ôn tập từ vựng &amp; ngữ pháp · Global Success 8</small></div>
    <div class="stats">
      <div class="chip fire" title="Chuỗi ngày học">🔥 <span id="streak">0</span></div>
      <div class="chip xp" title="Điểm XP">⭐ <span id="xp">0</span></div>
      <button class="icon-btn" id="sndBtn" title="Bật/tắt âm thanh">🔊</button>
    </div>
  </div>
  <div id="pathbox"></div>
  <div class="foot-note">Gõ đáp án bằng bàn phím · phím <b>Enter</b> để kiểm tra / tiếp tục<br><button id="resetBtn">Xóa tiến độ</button></div>
</div>

<!-- ======================= LÀM BÀI ======================= -->
<div id="lesson" hidden>
  <div class="lhead">
    <button class="x" id="quitBtn" title="Thoát">✕</button>
    <div class="bar"><i id="prog"></i></div>
    <div class="hearts">❤ <span id="hearts">5</span></div>
  </div>
  <div id="qbox"></div>
  <div id="foot">
    <div class="in">
      <button class="skip" id="btnSkip">Bỏ qua</button>
      <div class="msg" id="fmsg"></div>
      <button class="btn" id="btnMain" disabled>Kiểm tra</button>
    </div>
  </div>
</div>

<!-- ======================= KẾT THÚC ======================= -->
<div id="end" hidden></div>
<div id="modal" hidden></div>

<script>
(function(){
'use strict';

/* =====================================================================
   DỮ LIỆU TỪ VỰNG – có thể sửa/thêm ở đây
   en: từ tiếng Anh · vi: nghĩa · ex: câu ví dụ (___ là chỗ trống)
   sans: đáp án riêng cho câu điền từ (nếu khác en)
   ===================================================================== */
const WORDS = [
  {en:'ethnic group',  vi:'dân tộc',               ex:'The Kinh is the largest ___ in Viet Nam.'},
  {en:'ethnic minority',vi:'dân tộc thiểu số',     ex:'The Tay is an ___ living in the northern mountains.'},
  {en:'stilt house',   vi:'nhà sàn',               ex:'Many Thai people live in a ___ near the river.'},
  {en:'terraced field',vi:'ruộng bậc thang',       ex:'A ___ looks like a giant staircase on the mountain.'},
  {en:'costume',       vi:'trang phục',            ex:'Her traditional ___ is made of colourful brocade.'},
  {en:'festival',      vi:'lễ hội',                ex:'People sing and dance at the spring ___.'},
  {en:'custom',        vi:'phong tục',             ex:'It is a local ___ to take off your shoes before entering the house.'},
  {en:'tradition',     vi:'truyền thống',          ex:'Making sticky rice cakes at Tet is a family ___.'},
  {en:'heritage',      vi:'di sản',                ex:'Gong culture is a world cultural ___.'},
  {en:'gong',          vi:'cồng chiêng',           ex:'The Ede people play the ___ at festivals.'},
  {en:'brocade',       vi:'vải thổ cẩm',           ex:'This bag is made of colourful ___.'},
  {en:'weave',         vi:'dệt',                   ex:'Women in the village ___ cloth by hand.'},
  {en:'basket',        vi:'cái giỏ, cái rổ',       ex:'She carries vegetables in a bamboo ___.'},
  {en:'harvest',       vi:'vụ thu hoạch, mùa gặt', ex:'After the rice ___, the villagers hold a festival.'},
  {en:'community',     vi:'cộng đồng',             ex:'The whole ___ gathers in the village hall.'},
  {en:'ancestor',      vi:'tổ tiên',               ex:'People light incense to remember their ___ at Tet.', sans:['ancestors']},
  {en:'ceremony',      vi:'nghi lễ',               ex:'The wedding ___ lasts two days.'},
  {en:'folk dance',    vi:'điệu múa dân gian',     ex:'The bamboo dance is a traditional ___.'},
  {en:'handicraft',    vi:'đồ thủ công, nghề thủ công', ex:'Weaving is a popular ___ of the Cham people.'},
  {en:'celebrate',     vi:'tổ chức lễ, ăn mừng',   ex:'Many ethnic groups ___ the new rice festival.'},
  {en:'worship',       vi:'thờ cúng',              ex:'The Thai people ___ their ancestors and spirits.'},
  {en:'unique',        vi:'độc đáo, riêng biệt',   ex:'Every ethnic group has its own ___ culture.'},
  {en:'preserve',      vi:'bảo tồn, giữ gìn',      ex:'We must ___ our traditional customs for future generations.'},
  {en:'wooden',        vi:'bằng gỗ',               ex:'A ___ stilt house keeps people safe from floods.'}
];

/* ===================== TIỆN ÍCH ===================== */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"“”]/g, '').replace(/\s+/g, ' ').trim();
function lev(a, b){
  const m = a.length, n = b.length, d = [];
  for (let i = 0; i <= m; i++){ d[i] = [i]; }
  for (let j = 1; j <= n; j++){ d[0][j] = j; }
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ===================== LƯU TIẾN ĐỘ ===================== */
const KEY = 'u4-gs8-review-v1';
let P = {xp:0, streak:0, last:'', stars:{}, sound:true};
try { Object.assign(P, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }
function dayStr(d){ return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function bumpStreak(){
  const t = new Date(), today = dayStr(t);
  if (P.last === today) return;
  const y = new Date(t); y.setDate(t.getDate() - 1);
  P.streak = (P.last === dayStr(y)) ? P.streak + 1 : 1;
  P.last = today;
}

/* ===================== ÂM THANH ===================== */
const TTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function speak(text, rate){
  if (!TTS) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.9;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /^en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}
let AC = null;
function beep(freqs, dur){
  if (!P.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    freqs.forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.start(t); o.stop(t + dur + .02); t += dur * .8;
    });
  } catch(e){}
}
const sndOK = () => beep([660, 880], .14), sndBAD = () => beep([240, 170], .2), sndWIN = () => beep([523, 659, 784, 1047], .16);

/* ===================== TẠO CÂU HỎI ===================== */
function distract(w, key, n){
  const seen = new Set([w[key]]), out = [];
  for (const x of shuffle(WORDS)){ if (!seen.has(x[key])){ seen.add(x[key]); out.push(x[key]); if (out.length === n) break; } }
  return out;
}
const qMcqEn2Vi = w => ({t:'mcq', prompt:'Chọn nghĩa đúng', big:w.en, speak:w.en, opts:shuffle([w.vi, ...distract(w,'vi',3)]), ans:w.vi});
const qMcqVi2En = w => ({t:'mcq', prompt:'Từ tiếng Anh nào có nghĩa là', big:w.vi, opts:shuffle([w.en, ...distract(w,'en',3)]), ans:w.en});
const qTypeVi   = w => ({t:'type', prompt:'Gõ từ tiếng Anh có nghĩa là', big:w.vi, ans:[w.en], ph:'Gõ bằng tiếng Anh…'});
const qListen   = w => ({t:'type', prompt:'Nghe và gõ lại từ bạn nghe được', listen:w.en, ans:[w.en], ph:'Gõ từ bạn nghe được…', autoplay:true});
const qSentence = w => ({t:'type', prompt:'Điền từ còn thiếu vào chỗ trống', sentence:w.ex, hint:w.vi, ans:[...(w.sans || [w.en])], ph:'Gõ từ còn thiếu…'});
const qMatch    = pairs => ({t:'match', prompt:'Nối từ với nghĩa tương ứng', pairs, retry:false});

function vocabQs(ws){
  const qs = [qMatch(shuffle(ws).slice(0, 5).map(w => [w.en, w.vi]))];
  shuffle(ws).forEach((w, i) => qs.push(i % 2 ? qMcqVi2En(w) : qMcqEn2Vi(w)));
  shuffle(ws).forEach((w, i) => {
    const k = i % 3;
    qs.push(k === 0 ? qTypeVi(w) : k === 1 ? (TTS ? qListen(w) : qTypeVi(w)) : qSentence(w));
  });
  return qs;
}

/* ---------- Ngữ pháp 1: Yes / No ---------- */
const build = (vi, ans, extra) => Object.assign({t:'build', prompt:'Sắp xếp thành câu hỏi hoàn chỉnh', vi, tokens:ans.replace(/[?.]/g,'').split(' '), ans:[ans]}, extra || {});
function g1(){ return shuffle([
  build('Cô ấy đang làm việc rất chăm chỉ à?', 'Is she working very hard?'),
  {t:'mcq', prompt:'Chọn trợ động từ đúng', sentence:'___ she live near here?', opts:['Do','Does','Did','Is'], ans:'Does', note:'Chủ ngữ she (hiện tại) → Does + V nguyên mẫu.'},
  build('Tối qua bạn có xem TV không?', 'Did you watch TV last night?'),
  {t:'type', prompt:'Gõ trợ động từ còn thiếu', sentence:'___ you finished it yet? – Yes, I have.', ans:['Have'], ph:'Gõ trợ động từ…', note:'have + S + V3 (thì hiện tại hoàn thành).'},
  {t:'mcq', prompt:'Chọn câu đúng', opts:['Walk you to work?','Do you walk to work?','You do walk to work?','Are you walk to work?'], ans:'Do you walk to work?', note:'Không có be/have/modal → mượn do / does / did.'},
  {t:'type', prompt:'Chuyển thành câu hỏi Yes/No', big:'You usually walk to work.', ans:['Do you usually walk to work?'], ph:'Gõ cả câu hỏi…'},
  build('Bạn có thể giúp tôi mở cái hộp này không?', 'Could you help me open this box?'),
  {t:'type', prompt:'Gõ câu trả lời ngắn', sentence:'Is she your sister? – No, she ___.', ans:["isn't", 'is not'], ph:'Gõ từ còn thiếu…', note:'Trả lời lại bằng chính trợ động từ: No, she isn’t.'},
  build('Có chút sữa nào không?', 'Is there any milk?'),
  {t:'type', prompt:'Gõ câu trả lời ngắn', sentence:'Are there any children? – No, there ___.', ans:["aren't", 'are not'], ph:'Gõ từ còn thiếu…'},
  {t:'mcq', prompt:'Chọn từ đúng', sentence:'___ you help me open this box?', opts:['Could','Does','Is','Are'], ans:'Could', note:'Modal (can, could, should, will…) + S + V nguyên mẫu.'},
  {t:'type', prompt:'Chuyển thành câu hỏi Yes/No', big:'She lives near here.', ans:['Does she live near here?'], ph:'Gõ cả câu hỏi…', note:'Mượn Does → động từ trở về nguyên mẫu (live).'}
]); }

/* ---------- Ngữ pháp 2: Wh- ---------- */
function g2(){ return shuffle([
  qMatch([['When','khi nào'],['Where','ở đâu'],['Why','tại sao'],['Which','cái nào'],['Whose','của ai'],['How','như thế nào']]),
  {t:'mcq', prompt:'Chọn từ để hỏi đúng', sentence:'___ do they live? – In Hue.', opts:['When','Where','Why','Who'], ans:'Where'},
  {t:'mcq', prompt:'Chọn từ để hỏi đúng', sentence:"___ didn't you call me? – Because I lost my phone.", opts:['Why','What','Which','Whose'], ans:'Why'},
  {t:'mcq', prompt:'Chọn từ để hỏi đúng', sentence:'___ phone rang? (điện thoại của ai)', opts:['Who','Whom','Whose','Which'], ans:'Whose'},
  {t:'mcq', prompt:'Chọn từ để hỏi đúng', sentence:'___ horse won? (con ngựa nào)', opts:['What','Which','Whose','Where'], ans:'Which', note:'Which = cái nào (có sự lựa chọn).'},
  {t:'mcq', prompt:'Chọn từ để hỏi đúng', sentence:'___ are you leaving? – At 7 o’clock.', opts:['Why','Where','When','How'], ans:'When'},
  build('Tôi nên đỗ xe ở đâu?', 'Where should I park?'),
  build('Bây giờ cô ấy đã làm gì rồi?', 'What has she done now?'),
  {t:'mcq', prompt:'Chọn câu đúng', opts:['Who bought this?','Who did buy this?','Who does bought this?','Who do bought this?'], ans:'Who bought this?', note:'Who là chủ ngữ → Wh + V, không dùng trợ động từ.'},
  {t:'mcq', prompt:'Chọn câu đúng', opts:['What did fall off the wall?','What fell off the wall?','What does fell off the wall?','What falls did off the wall?'], ans:'What fell off the wall?', note:'What là chủ ngữ → What + V (fell).'},
  {t:'mcq', prompt:'Câu hỏi nào KHÔNG dùng trợ động từ?', opts:['Where do they live?','Why didn’t you call me?','Who bought this?','When are you leaving?'], ans:'Who bought this?', note:'Who / What / Which / Whose làm chủ ngữ → Wh + V.'},
  {t:'type', prompt:'Gõ từ để hỏi còn thiếu', sentence:'___ often do you go to the library? – Twice a week.', hint:'bao lâu một lần', ans:['How'], ph:'Gõ từ để hỏi…'},
  build('Cô ấy sẽ ở với ai?', 'Who would she stay with?')
]); }

/* ---------- Ngữ pháp 3: Đếm được / không đếm được ---------- */
const sortQ = (items, note) => ({t:'sort', prompt:'Phân loại danh từ', items, note, retry:true});
function g3(){ return shuffle([
  sortQ([['advice','u'],['car','c'],['water','u'],['book','c'],['news','u'],['cousin','c']]),
  {t:'mcq', prompt:'Chọn từ đúng', sentence:'I need some ___.', opts:['advice','advices','an advice','two advice'], ans:'advice', note:'advice là danh từ không đếm được: không thêm -s, không dùng a/an.'},
  {t:'mcq', prompt:'Chọn từ đúng', sentence:'How ___ water do you drink every day?', opts:['much','many','few','a few'], ans:'much', note:'much + danh từ không đếm được.'},
  {t:'mcq', prompt:'Chọn từ đúng', sentence:'She has ___ cousins in Ha Noi.', opts:['a few','a little','much','an'], ans:'a few', note:'a few + danh từ đếm được số nhiều.'},
  {t:'type', prompt:'Điền từ còn thiếu', sentence:'I have two ___ of trousers.', hint:'hai chiếc quần', ans:['pairs'], ph:'Gõ từ còn thiếu…'},
  {t:'mcq', prompt:'Chọn câu đúng', opts:['I have two trousers.','I have two pairs of trousers.','I have two pair trousers.','I have a trousers.'], ans:'I have two pairs of trousers.', note:'trousers luôn số nhiều → đếm bằng a pair of / two pairs of.'},
  {t:'mcq', prompt:'Từ nào là danh từ KHÔNG đếm được?', opts:['homework','pencil','cousin','festival'], ans:'homework'},
  {t:'mcq', prompt:'Chọn từ đúng', sentence:'Would you like ___ rice?', opts:['some','a','many','two'], ans:'some', note:'some dùng được với cả đếm được số nhiều và không đếm được.'},
  {t:'type', prompt:'Điền từ còn thiếu', sentence:'I need a ___ of scissors.', hint:'một cái kéo', ans:['pair'], ph:'Gõ từ còn thiếu…'},
  sortQ([['furniture','u'],['costume','c'],['luggage','u'],['basket','c'],['traffic','u'],['festival','c']]),
  {t:'mcq', prompt:'Chọn từ đúng', sentence:'How many ___ do you have?', opts:['books','book','homework','water'], ans:'books', note:'many + danh từ đếm được số nhiều.'},
  {t:'mcq', prompt:'Chọn từ đúng', sentence:'She gave me some good ___.', opts:['news','a news','newses','two news'], ans:'news'},
  {t:'type', prompt:'Gõ danh từ không đếm được có nghĩa là', big:'lời khuyên', ans:['advice'], ph:'Gõ bằng tiếng Anh…'}
]); }

function finalQs(){
  const v = [];
  shuffle(WORDS).slice(0, 6).forEach((w, i) => {
    if (i < 3) v.push(pick([qMcqEn2Vi, qMcqVi2En])(w));
    else v.push(pick(TTS ? [qTypeVi, qListen, qSentence] : [qTypeVi, qSentence])(w));
  });
  const ok = q => q.t !== 'match' && q.t !== 'sort';
  const gr = [...g1().filter(ok).slice(0, 3), ...g2().filter(ok).slice(0, 3), ...g3().filter(ok).slice(0, 3)];
  return shuffle([...v, ...gr]);
}

const OFFS = [0, 52, 78, 52, 0, -52, -78, -52];
function renderHome(){
  $('#streak').textContent = P.streak; $('#xp').textContent = P.xp;

    sec.ids.forEach((id, i) => {

function openIntro(id){

  else body = `<div class="sub">Tóm tắt nhanh trước khi làm bài</div>${L.intro}`;

/* ===================== BỘ MÁY LÀM BÀI ===================== */
let S = null;
const PRAISE = ['Tuyệt vời!', 'Chính xác!', 'Giỏi lắm!', 'Đúng rồi!', 'Xuất sắc!'];

function startLesson(id){
  const L = LESSONS[id], queue = L.make();
  S = {id, L, queue, i:0, hearts:5, total:queue.length, done:0, wrong:0, xp:0, ctl:null, phase:'ask', lastOk:true};
  $('#home').hidden = true; $('#end').hidden = true; $('#lesson').hidden = false;
  window.scrollTo(0, 0);
  renderQ();
}
function updHud(){
  $('#prog').style.width = (S.done / S.total * 100) + '%';
  $('#hearts').textContent = S.hearts;
}
function renderQ(){
  const q = S.queue[S.i], box = $('#qbox');
  box.innerHTML = ''; box.classList.remove('locked');
  S.phase = 'ask';
  S.ctl = R[q.t](q, box);
  const foot = $('#foot'); foot.className = '';
  $('#btnMain').textContent = 'Kiểm tra'; $('#btnMain').disabled = true;
  $('#btnSkip').hidden = (q.t === 'match');
  updHud(); upd();
  const inp = box.querySelector('input'); if (inp) setTimeout(() => inp.focus(), 50);
  if (q.autoplay) setTimeout(() => speak(q.listen), 250);
}
function upd(){ if (S && S.phase === 'ask') $('#btnMain').disabled = !S.ctl.ready(); }

function doCheck(skip){
  if (!S || S.phase !== 'ask') return;
  if (!skip && !S.ctl.ready()) return;
  const q = S.queue[S.i];
  const res = skip ? {ok:false, answer:S.ctl.answer()} : S.ctl.check();
  S.ctl.lock && S.ctl.lock(res);
  $('#qbox').classList.add('locked');
  S.phase = 'result'; S.lastOk = res.ok;
  const foot = $('#foot'), msg = $('#fmsg'), btn = $('#btnMain');
  if (res.ok){
    S.done++; S.xp += 10; sndOK();
    foot.className = 'ok';
    msg.innerHTML = `<b>${pick(PRAISE)}</b>` + (q.note ? `<span>${esc(q.note)}</span>` : '');
  } else {
    S.hearts--; S.wrong++; sndBAD();
    if (q.retry !== false) S.queue.push(Object.assign({}, q));
    else S.done++;
    foot.className = 'bad';
    msg.innerHTML = `<b>${res.near ? 'Suýt đúng – kiểm tra chính tả!' : 'Chưa đúng'}</b><span>Đáp án đúng: <u>${esc(res.answer)}</u>${q.note ? '<br>' + esc(q.note) : ''}</span>`;
  }
  btn.disabled = false; btn.textContent = 'Tiếp tục';
  updHud();
}
function next(){
  if (!S || S.phase !== 'result') return;
  if (S.hearts <= 0) return failModal();
  if (S.i + 1 >= S.queue.length) return finish();
  S.i++; renderQ();
}
function failModal(){
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" style="text-align:center"><div style="font-size:64px">💔</div><h3>Hết tim rồi!</h3>
    <div class="sub">Đừng buồn – ôn lại phần tóm tắt rồi thử lại nhé.</div>
    <div class="row"><button class="btn ghost" id="fHome">Về trang chính</button><button class="btn" id="fAgain">Làm lại</button></div></div>`;
  m.hidden = false; m.onclick = null;
  $('#fHome').onclick = () => { m.hidden = true; goHome(); };
  $('#fAgain').onclick = () => { m.hidden = true; startLesson(S.id); };
}
function goHome(){
  $('#lesson').hidden = true; $('#end').hidden = true; $('#home').hidden = false; S = null;
  speechSynthesis && TTS && speechSynthesis.cancel();
  renderHome(); window.scrollTo(0, 0);
}
function finish(){
  const stars = S.wrong === 0 ? 3 : S.hearts >= 3 ? 2 : 1;
  const gain = S.xp + 20;
  P.xp += gain; P.stars[S.id] = Math.max(P.stars[S.id] || 0, stars); bumpStreak(); save();
  const acc = Math.round(S.total / (S.total + S.wrong) * 100);
  $('#lesson').hidden = true;
  const e = $('#end'); e.hidden = false;
  e.innerHTML = `<div class="big">${stars === 3 ? '🏆' : '🎉'}</div><h1>Hoàn thành bài học!</h1>
    <div class="sub" style="color:var(--ink2);margin-bottom:4px">${LESSONS[S.id].title}</div>
    <div class="stars">${'★'.repeat(stars)}<span style="color:var(--gray)">${'★'.repeat(3 - stars)}</span></div>
    <div class="statrow">
      <div class="stat" style="--c:#ffc800"><div class="h">TỔNG XP</div><div class="v">+${gain}</div></div>
      <div class="stat" style="--c:#58cc02"><div class="h">CHÍNH XÁC</div><div class="v">${acc}%</div></div>
      <div class="stat" style="--c:#ff4b4b"><div class="h">TIM CÒN</div><div class="v">${S.hearts}</div></div>
    </div>
    <div class="actions"><button class="btn wide" id="eHome">Tiếp tục</button><button class="btn ghost wide" id="eAgain">Làm lại bài này</button></div>`;
  const id = S.id;
  $('#eHome').onclick = goHome; $('#eAgain').onclick = () => startLesson(id);
  sndWIN(); confetti();
}
function confetti(){
  const em = ['🎉', '⭐', '🌟', '✨', '🎊'];
  for (let i = 0; i < 28; i++){
    const c = el('div', 'conf', pick(em));
    c.style.left = Math.random() * 100 + 'vw'; c.style.animationDuration = (2 + Math.random() * 2.2) + 's'; c.style.animationDelay = (Math.random() * .6) + 's';
    document.body.append(c); setTimeout(() => c.remove(), 5200);
  }
}

  return b;
}
function sentenceEl(s){ return el('div', 'sentence', esc(s).replace('___', '<span class="blank"></span>')); }
function head(q, box){
  box.append(el('h2', 'q-title', esc(q.prompt)));
  if (q.listen){
    const w = el('div', 'bigword'); w.append(spkBtn(q.listen)); w.append(spkBtn(q.listen, true)); box.append(w);
    if (!TTS) box.append(el('div', 'hint', 'Trình duyệt này không có giọng đọc.'));
  } else if (q.big){
    const w = el('div', 'bigword'); w.append(el('span', '', esc(q.big)));
    if (q.speak) w.append(spkBtn(q.speak));
    box.append(w);
  }
  if (q.sentence) box.append(sentenceEl(q.sentence));
  if (q.hint) box.append(el('div', 'hint', 'Gợi ý: <b>' + esc(q.hint) + '</b>'));
}

const R = {};

/* --- trắc nghiệm --- */
R.mcq = (q, box) => {
  head(q, box);
  const wrap = el('div', 'opts' + (q.opts.length === 4 && q.opts.every(o => o.length < 26) ? ' two' : '')); box.append(wrap);
  let sel = -1; const btns = [];
  q.opts.forEach((o, i) => {
    const b = el('button', 'opt'); b.type = 'button';
    b.append(el('span', 'key', String(i + 1))); const t = el('span'); t.textContent = o; b.append(t);
    b.onclick = () => { sel = i; btns.forEach((x, k) => x.classList.toggle('sel', k === i)); if (q.speak && q.big == null) {} upd(); };
    btns.push(b); wrap.append(b);
  });
  S.keySel = i => { if (i < btns.length && S.phase === 'ask') btns[i].click(); };
  return {
    ready: () => sel >= 0,
    check(){ return {ok:q.opts[sel] === q.ans, answer:q.ans}; },
    answer: () => q.ans,
    lock(res){ btns.forEach((b, i) => { b.classList.remove('sel'); if (q.opts[i] === q.ans) b.classList.add('right'); else if (i === sel) b.classList.add('wrong'); }); }
  };
};

/* --- gõ từ --- */
R.type = (q, box) => {
  head(q, box);
  const w = el('div', 'tin-wrap'), inp = el('input', 'tin');
  inp.type = 'text'; inp.placeholder = q.ph || 'Gõ đáp án…';
  inp.setAttribute('autocomplete', 'off'); inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('autocorrect', 'off'); inp.spellcheck = false;
  inp.addEventListener('input', upd);
  w.append(inp); box.append(w);
  S.keySel = null;
  return {
    ready: () => inp.value.trim().length > 0,
    check(){
      const v = norm(inp.value), accepted = q.ans.map(norm);
      if (accepted.includes(v)) return {ok:true};
      const near = accepted.some(a => a.length >= 4 && lev(a, v) <= 1);
      return {ok:false, near, answer:q.ans[0]};
    },
    answer: () => q.ans[0],
    lock(res){ inp.readOnly = true; inp.classList.add(res.ok ? 'right' : 'wrong'); }
  };
};

/* --- sắp xếp câu --- */
R.build = (q, box) => {
  head(q, box);
  if (q.vi) box.append(el('div', 'hint', '“' + esc(q.vi) + '”'));
  const line = el('div', 'answerline'), bank = el('div', 'bank');
  box.append(line, bank);
  let order; let tries = 0;
  do { order = shuffle(q.tokens.map((t, i) => i)); tries++; } while (order.join() === q.tokens.map((t, i) => i).join() && tries < 6);
  const used = [], bankBtns = {};
  order.forEach(idx => {
    const b = el('button', 'tok'); b.type = 'button'; b.textContent = q.tokens[idx];
    b.onclick = () => { if (used.includes(idx)) return; used.push(idx); draw(); };
    bankBtns[idx] = b; bank.append(b);
  });
  function draw(){
    line.innerHTML = '';
    used.forEach(idx => {
      const t = el('button', 'tok'); t.type = 'button'; t.textContent = q.tokens[idx];
      t.onclick = () => { used.splice(used.indexOf(idx), 1); draw(); };
      line.append(t);
    });
    Object.keys(bankBtns).forEach(k => bankBtns[k].classList.toggle('used', used.includes(+k)));
    upd();
  }
  S.keySel = null;
  return {
    ready: () => used.length === q.tokens.length,
    check(){ const s = norm(used.map(i => q.tokens[i]).join(' ')); return {ok:q.ans.map(norm).includes(s), answer:q.ans[0]}; },
    answer: () => q.ans[0]
  };
};

/* --- nối cặp --- */
R.match = (q, box) => {
  head(q, box);
  const grid = el('div', 'pairs'), cl = el('div', 'col'), cr = el('div', 'col');
  grid.append(cl, cr); box.append(grid);
  let a = null, b = null, matched = 0; const n = q.pairs.length;
  const map = {}; q.pairs.forEach(p => map[p[0]] = p[1]);
  const mk = (txt, side, parent) => {
    const c = el('button', 'pc'); c.type = 'button'; c.textContent = txt; parent.append(c);
    c.onclick = () => {
      if (side === 'L'){ if (a) a.classList.remove('sel'); a = c; speak(txt); } else { if (b) b.classList.remove('sel'); b = c; }
      c.classList.add('sel');
      if (a && b){
        const A = a, B = b; a = b = null;
        if (map[A.textContent] === B.textContent){
          A.classList.remove('sel'); B.classList.remove('sel'); A.classList.add('done'); B.classList.add('done'); matched++; beep([700], .08);
          if (matched === n) setTimeout(() => { $('#btnMain').disabled = false; doCheck(); }, 350);
        } else {
          A.classList.add('bad'); B.classList.add('bad'); sndBAD();
          setTimeout(() => { A.classList.remove('bad', 'sel'); B.classList.remove('bad', 'sel'); }, 450);
        }
      }
    };
  };
  shuffle(q.pairs.map(p => p[0])).forEach(t => mk(t, 'L', cl));
  shuffle(q.pairs.map(p => p[1])).forEach(t => mk(t, 'R', cr));
  S.keySel = null;
  return { ready: () => matched === n, check: () => ({ok:true}), answer: () => '' };
};

/* --- phân loại đếm được / không đếm được --- */
R.sort = (q, box) => {
  head(q, box);
  box.append(el('div', 'hint', 'Chọn <b>đếm được</b> hoặc <b>không đếm được</b> cho mỗi từ.'));
  const choice = {}, rows = [];
  q.items.forEach(([w, c], idx) => {
    const r = el('div', 'srow'); r.append(el('div', 'w', esc(w)));
    const bc = el('button', '', 'đếm được'), bu = el('button', '', 'không đếm được'); bc.type = bu.type = 'button';
    const set = v => { choice[idx] = v; bc.classList.toggle('sel', v === 'c'); bu.classList.toggle('sel', v === 'u'); upd(); };
    bc.onclick = () => set('c'); bu.onclick = () => set('u');
    r.append(bc, bu); box.append(r); rows.push({bc, bu, c});
  });
  S.keySel = null;
  const label = c => c === 'c' ? 'đếm được' : 'không đếm được';
  return {
    ready: () => Object.keys(choice).length === q.items.length,
    check(){
      const bad = q.items.filter((it, i) => choice[i] !== it[1]);
      return {ok:bad.length === 0, answer:bad.map(it => it[0] + ' → ' + label(it[1])).join(' · ')};
    },
    answer: () => q.items.map(it => it[0] + ' → ' + label(it[1])).join(' · '),
    lock(){ rows.forEach((r, i) => { r.bc.classList.remove('sel'); r.bu.classList.remove('sel'); const right = r.c === 'c' ? r.bc : r.bu, wrong = r.c === 'c' ? r.bu : r.bc;
      right.classList.add('right'); if (choice[i] && choice[i] !== r.c) wrong.classList.add('wrong'); }); }
  };
};

/* ===================== SỰ KIỆN CHUNG ===================== */
$('#btnMain').onclick = () => { if (!S) return; S.phase === 'ask' ? doCheck() : next(); };
$('#btnSkip').onclick = () => doCheck(true);
$('#quitBtn').onclick = () => {
  const m = $('#modal');
  m.innerHTML = `<div class="sheet" style="text-align:center"><div style="font-size:56px">🤔</div><h3>Thoát bài học?</h3>
    <div class="sub">Tiến độ bài này sẽ không được lưu.</div>
    <div class="row"><button class="btn ghost" id="qNo">Ở lại</button><button class="btn red" id="qYes">Thoát</button></div></div>`;
  m.hidden = false; m.onclick = null;
  $('#qNo').onclick = () => m.hidden = true;
  $('#qYes').onclick = () => { m.hidden = true; goHome(); };
};
$('#sndBtn').onclick = () => { P.sound = !P.sound; save(); renderHome(); };
$('#resetBtn').onclick = () => {
  if (!confirm('Xóa toàn bộ điểm XP, sao và chuỗi ngày học?')) return;
  P = {xp:0, streak:0, last:'', stars:{}, sound:P.sound}; save(); renderHome();
};
document.addEventListener('keydown', e => {
  if (!S || $('#lesson').hidden || !$('#modal').hidden) return;
  if (e.key === 'Enter'){
    e.preventDefault();
    if (S.phase === 'ask') doCheck(); else next();
  } else if (/^[1-4]$/.test(e.key) && S.phase === 'ask' && S.keySel && document.activeElement.tagName !== 'INPUT'){
    S.keySel(+e.key - 1);
  }
});
if (TTS) { try { speechSynthesis.getVoices(); } catch(e){} }
renderHome();
})();
</script>
