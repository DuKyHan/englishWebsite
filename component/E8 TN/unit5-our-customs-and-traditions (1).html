<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English 8 – Unit 5: Our customs and traditions</title>
<style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd:#1899d6;--r:#ff4b4b;--rd:#ea2b2b;--y:#ffc800;--o:#ff9600;--bg:#fff;--t:#3c3c3c;--m:#777;--line:#e5e5e5;--soft:#f7f7f7}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Segoe UI",Arial,sans-serif;color:var(--t);background:var(--bg);font-weight:600}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--line);z-index:5}
.top .in{max-width:720px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top h1{font-size:17px;margin:0;flex:1;font-weight:800}
.stat{font-weight:800;font-size:15px;white-space:nowrap}
.wrap{max-width:720px;margin:auto;padding:18px 16px 120px}
.btn{border:0;border-bottom:4px solid var(--gd);background:var(--g);color:#fff;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:13px 22px;border-radius:14px;font-size:15px}
.btn:active{transform:translateY(3px);border-bottom-width:1px}
.btn.blue{background:var(--b);border-color:var(--bd)}
.btn.ghost{background:#fff;color:var(--b);border:2px solid var(--line);border-bottom-width:4px}
.btn.red{background:var(--r);border-color:var(--rd)}
.btn[disabled]{background:#e5e5e5;border-color:#cfcfcf;color:#aaa;cursor:default}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
/* path */
.hero{background:linear-gradient(135deg,#58cc02,#89e219);color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:22px}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.95;font-size:14px}
.bar{height:12px;background:rgba(255,255,255,.35);border-radius:8px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:8px}
.path{display:flex;flex-direction:column;align-items:center;gap:8px}
.node{display:flex;align-items:center;gap:14px;width:100%;max-width:440px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:12px 14px;text-align:left;transition:.1s}
.node:hover:not(.lock){border-color:var(--b)}
.node .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--g);border-bottom:5px solid var(--gd);flex:none}
.node.cur .ic{background:var(--b);border-color:var(--bd)}
.node.lock{opacity:.55}.node.lock .ic{background:#cfcfcf;border-color:#b5b5b5}
.node b{display:block;font-size:16px}.node small{color:var(--m)}
.stars{margin-left:auto;font-size:18px;color:var(--y);white-space:nowrap}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;font-size:13px;color:var(--m);align-items:center}
/* review */
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;color:var(--m)}
.tab.on{border-color:var(--b);background:#ddf4ff;color:var(--bd)}
.card{border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;background:#fff}
.vrow{display:flex;gap:12px;align-items:flex-start}
.say{border:0;background:var(--b);color:#fff;width:40px;height:40px;border-radius:12px;flex:none;font-size:18px;border-bottom:3px solid var(--bd)}
.say.slow{background:#fff;color:var(--b);border:2px solid var(--line);border-bottom-width:3px;font-size:14px}
.en{font-size:18px;font-weight:800}.ipa{color:var(--m);font-weight:600;font-size:14px;margin-left:6px}
.vi{color:var(--gd);font-weight:800}.hide .vi.hid{filter:blur(7px);cursor:pointer;user-select:none}
.ex{font-size:14px;color:var(--m);margin-top:4px}
.line{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.who{font-weight:800;color:var(--bd);min-width:54px}
.rule{background:#f0fbe4;border-left:5px solid var(--g);padding:10px 14px;border-radius:8px;margin:8px 0}
.tip{background:#fff8dc;border-left:5px solid var(--y);padding:10px 14px;border-radius:8px;margin:8px 0;font-size:14px}
h3{margin:18px 0 6px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{border:0;background:none;font-size:26px;color:var(--m)}
.prog{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g);transition:.3s;border-radius:10px}
.q h2{font-size:22px;margin:6px 0 4px}.q .qvi{color:var(--m);font-size:14px;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 16px;margin:8px 0;font-size:16px;font-weight:700;color:var(--t)}
.opt:hover{background:var(--soft)}.opt.sel{border-color:var(--b);background:#ddf4ff;color:var(--bd)}
.opt.ok{border-color:var(--g);background:#d7ffb8;color:var(--gd)}.opt.no{border-color:var(--r);background:#ffdfe0;color:var(--rd)}
input.ans{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);outline:none}
input.ans:focus{border-color:var(--b)}
.bank,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 0}
.built{border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin:12px 0;align-items:center}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:12px;padding:9px 14px;font-size:16px;font-weight:700}
.chip.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:#fff;padding:14px 16px;transition:.15s}
.foot .in{max-width:720px;margin:auto;display:flex;align-items:center;gap:14px}
.foot.ok{background:#d7ffb8}.foot.no{background:#ffdfe0}
.fb{flex:1;font-size:14px;line-height:1.45}
.fb h4{margin:0 0 3px;font-size:18px}.foot.ok h4{color:var(--gd)}.foot.no h4{color:var(--rd)}
.fb .tr{color:var(--m)}
.done{text-align:center;padding:30px 10px}.done .big{font-size:64px}
.pill{display:inline-block;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px 14px;margin:4px;font-weight:800}
textarea{width:100%;min-height:150px;font:inherit;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--soft);outline:none}
@media(max-width:480px){.en{font-size:16px}.top h1{font-size:15px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1 id="ttl">🇻🇳 Unit 5 · Our customs and traditions</h1>
  <span class="stat" id="stXP">⚡ 0</span><span class="stat" id="stHeart"></span>
</div></div>
<div class="wrap" id="app"></div>
<div class="foot" id="foot" style="display:none"><div class="in" id="footIn"></div></div>

<script>
/* ===================== DỮ LIỆU BÀI HỌC (nội dung tự biên soạn, bám sát chủ đề & trình tự các phần của Unit 5) ===================== */
const L = [];

/* 1 ─ VOCABULARY */
L.push({id:'vocab',ic:'📚',title:'Vocabulary',vi:'Từ vựng của Unit',
vocab:[
['custom','/ˈkʌstəm/','phong tục','Giving lucky money is a Tet custom.','Tặng tiền lì xì là một phong tục ngày Tết.'],
['tradition','/trəˈdɪʃn/','truyền thống','Making sticky rice cakes is a family tradition.','Gói bánh chưng là truyền thống của gia đình.'],
['festival','/ˈfestɪvl/','lễ hội','The Mid-Autumn Festival is fun for children.','Tết Trung thu rất vui với trẻ em.'],
['ancestor','/ˈænsestə(r)/','tổ tiên','We worship our ancestors at Tet.','Chúng tôi thờ cúng tổ tiên vào dịp Tết.'],
['offering','/ˈɒfərɪŋ/','đồ cúng, lễ vật','She put fruit as offerings on the altar.','Cô ấy đặt hoa quả làm lễ vật lên bàn thờ.'],
['worship','/ˈwɜːʃɪp/','thờ cúng','Many families worship their ancestors at home.','Nhiều gia đình thờ cúng tổ tiên tại nhà.'],
['pagoda','/pəˈɡəʊdə/','chùa','We visit a pagoda on the first day of the year.','Chúng tôi đi chùa vào ngày đầu năm.'],
['lantern','/ˈlæntən/','đèn lồng','Children carry star-shaped lanterns.','Trẻ em rước đèn ông sao.'],
['procession','/prəˈseʃn/','đám rước','A long procession walked through the village.','Một đám rước dài đi qua làng.'],
['costume','/ˈkɒstjuːm/','trang phục (truyền thống)','They wear traditional costumes at the festival.','Họ mặc trang phục truyền thống ở lễ hội.'],
['celebrate','/ˈselɪbreɪt/','ăn mừng, tổ chức lễ','We celebrate Tet with our whole family.','Chúng tôi đón Tết cùng cả gia đình.'],
['pass down','/pɑːs daʊn/','truyền lại','Grandparents pass down stories to grandchildren.','Ông bà truyền lại những câu chuyện cho cháu.']
],
grammar:[{t:'Mẹo ghi nhớ từ vựng',r:'Học theo nhóm: <b>người</b> (ancestor, generation) – <b>nơi chốn</b> (pagoda, temple) – <b>hoạt động</b> (celebrate, worship, pass down) – <b>vật</b> (lantern, costume, offering). Đọc to từng từ 3 lần bằng nút 🔊 rồi che nghĩa tiếng Việt để tự kiểm tra.',ex:[['custom / tradition: danh từ đếm được → a custom, many traditions','Custom và tradition đều là danh từ đếm được.']]}],
quiz:[
{t:'mc',q:'What does "ancestor" mean?',vi:'"ancestor" nghĩa là gì?',o:['tổ tiên','hàng xóm','giáo viên','trẻ em'],a:0,e:'ancestor = tổ tiên (người thuộc các thế hệ trước trong gia đình).'},
{t:'mc',q:'Which word means "lễ hội"?',vi:'Từ nào nghĩa là "lễ hội"?',o:['festival','lantern','costume','pagoda'],a:0,e:'festival = lễ hội. lantern = đèn lồng, costume = trang phục, pagoda = chùa.'},
{t:'fill',q:'We ___ Tet with our whole family.',vi:'Chúng tôi đón Tết cùng cả gia đình. (ăn mừng/đón)',a:['celebrate'],e:'Chủ ngữ "We" → động từ nguyên mẫu: celebrate (ăn mừng, tổ chức lễ).'},
{t:'listen',say:'We worship our ancestors.',vi:'Chúng tôi thờ cúng tổ tiên.',e:'worship /ˈwɜːʃɪp/ nhấn âm 1; ancestors /ˈænsestəz/ nhấn âm 1.'},
{t:'mc',q:'A long ___ walked slowly through the village.',vi:'Một ___ dài đi chậm rãi qua làng.',o:['procession','lantern','costume','offering'],a:0,e:'procession = đám rước, hợp với động từ "walked through the village".',s:'A long procession walked slowly through the village.'},
{t:'order',a:'Grandparents pass down traditions to children.',vi:'Ông bà truyền lại các truyền thống cho trẻ em.',e:'Cấu trúc: S + pass down + N + to + người. "pass down" là cụm động từ (truyền lại).'},
{t:'mc',q:'Which word is a PLACE?',vi:'Từ nào chỉ NƠI CHỐN?',o:['pagoda','offering','custom','ancestor'],a:0,e:'pagoda = chùa, là địa điểm. Các từ còn lại không chỉ nơi chốn.'}
]});

/* 2 ─ GETTING STARTED */
L.push({id:'gs',ic:'💬',title:'Getting Started',vi:'Hội thoại mở đầu: Chuẩn bị Tết',
vocab:[
['wrap','/ræp/','gói, bọc','They wrap sticky rice cakes with leaves.','Họ gói bánh chưng bằng lá.'],
['altar','/ˈɔːltə(r)/','bàn thờ','We put flowers on the altar.','Chúng tôi đặt hoa lên bàn thờ.'],
['remind','/rɪˈmaɪnd/','nhắc nhớ','The cake reminds us of our ancestors.','Chiếc bánh nhắc chúng tôi nhớ đến tổ tiên.'],
['relative','/ˈrelətɪv/','họ hàng','We visit our relatives at Tet.','Chúng tôi đi thăm họ hàng vào dịp Tết.'],
['meaningful','/ˈmiːnɪŋfl/','có ý nghĩa','Tet is a meaningful time for families.','Tết là thời gian ý nghĩa với các gia đình.']
],
dialogue:{title:'Hội thoại: Mai and Ben',lines:[
['Ben','Mai, what are you doing?','Mai ơi, bạn đang làm gì thế?'],
['Mai','I\'m wrapping sticky rice cakes with my grandmother. It is a Tet tradition in our family.','Mình đang gói bánh chưng với bà. Đó là truyền thống ngày Tết của gia đình mình.'],
['Ben','Why do you make them every year?','Sao năm nào bạn cũng làm vậy?'],
['Mai','Because they remind us of our ancestors. We put them on the altar as offerings.','Vì chúng nhắc chúng mình nhớ đến tổ tiên. Chúng mình đặt bánh lên bàn thờ làm lễ vật.'],
['Ben','That sounds meaningful. What else do you do at Tet?','Nghe ý nghĩa quá. Dịp Tết bạn còn làm gì nữa?'],
['Mai','We clean the house, visit relatives, and children receive lucky money.','Chúng mình dọn nhà, thăm họ hàng, và trẻ em nhận tiền lì xì.'],
['Ben','Can I help?','Mình giúp được không?'],
['Mai','Of course! Wash the leaves first, please.','Tất nhiên! Làm ơn rửa lá trước nhé.']]},
grammar:[
{t:'Thì hiện tại tiếp diễn – hành động đang diễn ra',r:'<b>S + am/is/are + V-ing</b><br>I <b>am wrapping</b> cakes now.',ex:[['What are you doing?','Bạn đang làm gì?'],['She is cooking in the kitchen.','Cô ấy đang nấu ăn trong bếp.']]},
{t:'Hỏi lý do – trả lời với because',r:'<b>Why + do/does + S + V?</b> → <b>Because + S + V.</b><br>Why do you make them? – <b>Because</b> they remind us of our ancestors.',ex:[['I stay home because it is a family day.','Mình ở nhà vì đó là ngày của gia đình.']]}],
quiz:[
{t:'mc',q:'What is Mai doing?',vi:'Mai đang làm gì?',o:['Wrapping sticky rice cakes','Watching a parade','Visiting a pagoda','Lighting lanterns'],a:0,e:'Mai nói: "I\'m wrapping sticky rice cakes…" (đang gói bánh chưng).'},
{t:'mc',q:'"Mai makes the cakes only once in her life."',vi:'Đúng hay sai? (Mai chỉ làm bánh một lần trong đời)',o:['True','False'],a:1,e:'Sai. Ben hỏi "every year" – gia đình Mai làm bánh MỖI NĂM, đó là truyền thống.'},
{t:'mc',q:'Why does Mai\'s family put the cakes on the altar?',vi:'Vì sao gia đình Mai đặt bánh lên bàn thờ?',o:['As offerings for their ancestors','To sell them','To decorate the street','To give to teachers'],a:0,e:'"We put them on the altar as offerings" – đặt làm lễ vật cho tổ tiên.'},
{t:'fill',q:'Mai makes the cakes ___ they remind her of her ancestors.',vi:'Mai làm bánh ___ chúng nhắc cô nhớ đến tổ tiên.',a:['because'],e:'"because" + mệnh đề (S + V) để nêu LÝ DO.'},
{t:'order',a:'Children receive lucky money at Tet.',vi:'Trẻ em nhận tiền lì xì vào dịp Tết.',e:'S + V + O + at Tet. "receive" = nhận; "at Tet" = vào dịp Tết.'},
{t:'listen',say:'Wash the leaves first, please.',vi:'Làm ơn rửa lá trước nhé.',e:'Câu mệnh lệnh lịch sự: Động từ nguyên mẫu + please.'},
{t:'mc',q:'"Relatives" means…',vi:'"Relatives" nghĩa là…',o:['họ hàng','bạn học','hàng xóm','giáo viên'],a:0,e:'relative = người thân trong họ hàng (cô, chú, bác, anh chị em họ…).'}
]});

/* 3 ─ A CLOSER LOOK 1 */
L.push({id:'cl1',ic:'🔍',title:'A Closer Look 1',vi:'Từ vựng & phát âm (trọng âm)',
vocab:[
['light incense','/laɪt ˈɪnsens/','thắp hương','She lights incense in front of the altar.','Cô ấy thắp hương trước bàn thờ.'],
['make offerings','/meɪk ˈɒfərɪŋz/','dâng lễ','People make offerings at the temple.','Mọi người dâng lễ ở đền.'],
['give lucky money','/ɡɪv ˈlʌki ˈmʌni/','tặng tiền lì xì','Adults give lucky money to children.','Người lớn lì xì cho trẻ em.'],
['watch a parade','/wɒtʃ ə pəˈreɪd/','xem diễu hành','We watch a parade in the street.','Chúng tôi xem diễu hành trên phố.'],
['wear traditional costumes','/weə trəˈdɪʃənl ˈkɒstjuːmz/','mặc trang phục truyền thống','Dancers wear traditional costumes.','Các vũ công mặc trang phục truyền thống.'],
['play folk games','/pleɪ fəʊk ɡeɪmz/','chơi trò chơi dân gian','People play folk games at the festival.','Mọi người chơi trò chơi dân gian ở lễ hội.'],
['decorate the house','/ˈdekəreɪt ðə haʊs/','trang trí nhà','We decorate the house with flowers.','Chúng tôi trang trí nhà bằng hoa.'],
['visit relatives','/ˈvɪzɪt ˈrelətɪvz/','thăm họ hàng','Many people visit relatives at Tet.','Nhiều người đi thăm họ hàng dịp Tết.']
],
grammar:[
{t:'Phát âm – trọng âm từ 2–3 âm tiết',r:'Danh từ 2 âm tiết thường nhấn <b>âm 1</b>: <b>FES</b>-ti-val, <b>CUS</b>-tom, <b>AN</b>-ces-tor.<br>Nhiều từ kết thúc <b>-tion</b> nhấn <b>âm ngay trước -tion</b>: tra-<b>DI</b>-tion, pro-<b>CES</b>-sion, cel-e-<b>BRA</b>-tion.',ex:[['tradition → tra-DI-tion','Nhấn âm thứ 2.'],['festival → FES-ti-val','Nhấn âm thứ 1.']]},
{t:'Kết hợp từ (collocations)',r:'Học cả cụm: <b>light</b> incense (không nói "burn" trong bài này), <b>give</b> lucky money, <b>take part in</b> a festival, <b>pay respect to</b> ancestors.',ex:[['They take part in a festival.','Họ tham gia một lễ hội.']]}],
quiz:[
{t:'mc',q:'She ___ incense in front of the altar.',vi:'Cô ấy ___ hương trước bàn thờ.',o:['lights','plays','wears','watches'],a:0,e:'Cụm cố định: light incense (thắp hương). Chủ ngữ "She" → thêm -s: lights.',s:'She lights incense in front of the altar.'},
{t:'fill',q:'Adults ___ lucky money to children at Tet.',vi:'Người lớn ___ tiền lì xì cho trẻ em dịp Tết. (tặng)',a:['give'],e:'give lucky money to + người. "Adults" số nhiều → give (không thêm -s).'},
{t:'mc',q:'Which phrase means "mặc trang phục truyền thống"?',vi:'Cụm nào nghĩa là "mặc trang phục truyền thống"?',o:['wear traditional costumes','watch a parade','play folk games','visit relatives'],a:0,e:'wear = mặc; traditional costumes = trang phục truyền thống.'},
{t:'mc',q:'Which syllable is stressed in "tradition"?',vi:'Âm tiết nào được nhấn trong "tradition"?',o:['1st (TRA)','2nd (DI)','3rd (TION)'],a:1,e:'Từ kết thúc bằng -tion nhấn âm ngay trước nó: tra-DI-tion.'},
{t:'listen',say:'We watch a parade in the street.',vi:'Chúng tôi xem diễu hành trên phố.',e:'parade /pəˈreɪd/ nhấn âm 2. "in the street": giới từ in + the + danh từ.'},
{t:'order',a:'People play folk games at the festival.',vi:'Mọi người chơi trò chơi dân gian ở lễ hội.',e:'play folk games = chơi trò chơi dân gian. "at the festival" = tại lễ hội.'},
{t:'mc',q:'What does "decorate the house" mean?',vi:'"decorate the house" nghĩa là gì?',o:['trang trí nhà','dọn dẹp nhà','xây nhà','bán nhà'],a:0,e:'decorate = trang trí; clean = dọn dẹp.'}
]});

/* 4 ─ A CLOSER LOOK 2 : ARTICLES */
L.push({id:'cl2',ic:'✏️',title:'A Closer Look 2',vi:'Ngữ pháp: Mạo từ a / an / the',
vocab:[
['hour','/ˈaʊə(r)/','giờ (h câm → an hour)','It takes an hour to get there.','Đi đến đó mất một tiếng.'],

{t:'fill',q:'People take ___ in the parade.',vi:'Mọi người ___ gia cuộc diễu hành. (tham)',a:['part'],e:'take part in = tham gia.'},
{t:'listen',say:'We celebrate festivals to remember our history.',vi:'Chúng tôi tổ chức lễ hội để ghi nhớ lịch sử của mình.',e:'to + V (to remember) chỉ mục đích: để làm gì.'},
{t:'mc',q:'He is ___ honest boy.',vi:'Cậu ấy là một cậu bé trung thực.',o:['a','an','the'],a:1,e:'"honest" có h câm /ˈɒnɪst/ → bắt đầu bằng nguyên âm → an.',s:'He is an honest boy.'}
]});

/* 9 ─ PROJECT */
L.push({id:'prj',ic:'🎯',title:'Project',vi:'Dự án: Giới thiệu một phong tục / lễ hội',project:true,
vocab:[
['present','/prɪˈzent/','trình bày','I will present my project to the class.','Mình sẽ trình bày dự án trước lớp.'],
['origin','/ˈɒrɪdʒɪn/','nguồn gốc','The origin of this festival is very old.','Nguồn gốc của lễ hội này rất xưa.'],
['activity','/ækˈtɪvəti/','hoạt động','The main activity is the lion dance.','Hoạt động chính là múa lân.'],
['meaning','/ˈmiːnɪŋ/','ý nghĩa','This custom has a deep meaning.','Phong tục này có ý nghĩa sâu sắc.']
],
grammar:[{t:'Dàn ý bài thuyết trình (6 câu)',r:'1. <b>Giới thiệu</b>: My project is about … <br>2. <b>Thời gian & nơi</b>: It is celebrated on … in … <br>3. <b>Nguồn gốc</b>: It began because … <br>4. <b>Hoạt động</b>: People usually … and … <br>5. <b>Ý nghĩa</b>: It is important because … <br>6. <b>Kết</b>: That\'s all for my presentation. Thank you for listening.',ex:[]},
{t:'Mẹo trình bày',r:'Nói chậm, rõ; nhìn vào bạn nghe; dùng hình ảnh; luyện đọc to nhiều lần (bấm 🔊 để nghe bài mẫu).',ex:[]}],
quiz:[
{t:'order',a:'My project is about the Mid-Autumn Festival.',vi:'Dự án của mình nói về Tết Trung thu.',e:'Mẫu mở đầu: My project is about + chủ đề. Tên lễ hội có "Festival" thường dùng "the".'},
{t:'fill',q:'First, I will talk about the ___ of the festival.',vi:'Đầu tiên, mình sẽ nói về ___ của lễ hội. (lịch sử/nguồn gốc)',a:['history','origin'],e:'the history / the origin of + N = lịch sử / nguồn gốc của…'},
{t:'fill',q:'We celebrate it ___ the fifteenth day of the eighth lunar month.',vi:'Chúng tôi tổ chức lễ vào ___ ngày rằm tháng Tám âm lịch.',a:['on'],e:'Dùng giới từ "on" với ngày cụ thể (on the fifteenth day).'},
{t:'mc',q:'Which sentence is the best way to end a presentation?',vi:'Câu nào phù hợp nhất để kết thúc bài thuyết trình?',o:['That\'s all for my presentation. Thank you for listening.','I do not know.','Please be quiet.','See you yesterday.'],a:0,e:'Kết thúc lịch sự: nói đã hết phần trình bày và cảm ơn người nghe.'},
{t:'order',a:'It is important because it brings families together.',vi:'Nó quan trọng vì nó gắn kết các gia đình.',e:'because + mệnh đề để nêu lý do; bring … together = gắn kết, đưa … lại gần nhau.'}
]});

/* ===================== ĐỘNG CƠ ỨNG DỤNG ===================== */
const $=s=>document.querySelector(s), app=$('#app'), foot=$('#foot'), footIn=$('#footIn');
let S; try{S=JSON.parse(localStorage.getItem('u5state')||'null')}catch(e){S=null}
S=S||{xp:0,done:{},best:{}};S.weak=S.weak||{}; function save(){try{localStorage.setItem('u5state',JSON.stringify(S))}catch(e){}}
let hearts=5, cur=null, slow=false;

/* ---- âm thanh (giọng đọc tiếng Anh của trình duyệt) ---- */
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en[-_]/i.test(x.lang));
 voice=v.find(x=>/Google US English|Samantha|Microsoft (Aria|Jenny|Guy)|Natural/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,sl){if(!('speechSynthesis' in window)){alert('Trình duyệt chưa hỗ trợ đọc. Hãy dùng Chrome/Edge/Safari.');return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\|/g,''));u.lang='en-US';if(voice)u.voice=voice;u.rate=sl?0.6:0.88;speechSynthesis.speak(u)}
function sp(t){return `<button class="say" onclick='speak(${JSON.stringify(t).replace(/'/g,"&#39;")})' title="Nghe">🔊</button>`}
function sp2(t){return `<button class="say slow" onclick='speak(${JSON.stringify(t).replace(/'/g,"&#39;")},true)' title="Nghe chậm">🐢</button>`}

const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function topbar(){$('#stXP').textContent='⚡ '+S.xp;$('#stHeart').textContent=cur?'❤️ '+hearts:''}

/* ---- Trang chủ ---- */
function home(){cur=null;foot.style.display='none';topbar();
 const n=L.filter(l=>S.done[l.id]).length;
 const wk=Object.keys(S.weak).length,todo=L.filter(l=>(S.best[l.id]||0)<3).length;
 let h=`<div class="hero"><h2>Unit 5: Our customs and traditions</h2><p>${n}/${L.length} phần hoàn thành · Học theo đúng thứ tự các phần của sách giáo khoa. Mỗi phần: <b>Ôn tập → Luyện tập</b>.</p><div class="bar"><i style="width:${n/L.length*100}%"></i></div></div><div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>🔁 Ôn tập phần chưa thuộc</b><div class="ex">${wk} câu làm sai · ${todo} phần chưa đạt 3 sao. Bạn có thể học các phần theo thứ tự bất kỳ.</div></div><button class="btn blue sm" onclick="startReview()">Ôn ngay</button></div><div class="path">`;
 L.forEach((l,i)=>{const unlocked=true;const st=S.best[l.id]||0;
  h+=`<button class="node ${S.done[l.id]?'':'cur'}" ${unlocked?`onclick="review(${i})"`:'disabled'}><span class="ic">${l.ic}</span><span><b>${i+1}. ${l.title}</b><small>${l.vi}</small></span><span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span></button>`});
 h+=`</div><div class="ctl"><button class="btn ghost sm" onclick="if(confirm('Xoá toàn bộ tiến độ?')){S={xp:0,done:{},best:{},weak:{}};save();home()}">Làm lại từ đầu</button> <span>🔊 Âm thanh dùng giọng đọc tiếng Anh có sẵn trên thiết bị của bạn; bấm 🐢 để nghe chậm.</span></div>`;
 app.innerHTML=h}

/* ---- Ôn tập (từ vựng + ngữ pháp) ---- */
let tabSel='v',hideVi=false;
function review(i,tab){cur=null;topbar();foot.style.display='none';const l=L[i];tabSel=tab||'v';window.scrollTo(0,0);
 const tabs=[['v','📚 Từ vựng']];if(l.dialogue)tabs.push(['d',l.id==='sk1'?'📖 Bài đọc':l.id==='sk2'?'🎧 Bài nghe':'💬 Hội thoại']);tabs.push(['g','📐 Ngữ pháp & kỹ năng']);
 let h=`<button class="btn ghost sm" onclick="home()">← Danh sách</button><h2>${i+1}. ${l.title} <small style="color:var(--m);font-size:14px">${l.vi}</small></h2><div class="tabs">${tabs.map(t=>`<button class="tab ${t[0]==tabSel?'on':''}" onclick="review(${i},'${t[0]}')">${t[1]}</button>`).join('')}</div>`;
 if(tabSel==='v'){h+=`<div class="ctl"><label><input type="checkbox" ${hideVi?'checked':''} onchange="hideVi=this.checked;review(${i},'v')"> Che nghĩa tiếng Việt để tự kiểm tra (bấm vào chỗ mờ để hiện)</label></div><div class="${hideVi?'hide':''}">`;
  l.vocab.forEach(v=>{h+=`<div class="card vrow">${sp(v[0])}<div style="flex:1"><span class="en">${esc(v[0])}</span><span class="ipa">${v[1]}</span><div class="vi hid" onclick="this.classList.remove('hid')">${v[2]}</div><div class="ex">${esc(v[3])} ${sp2(v[3])}<br><span class="vi hid" style="font-weight:600" onclick="this.classList.remove('hid')">${v[4]}</span></div></div></div>`});h+='</div>'}
 if(tabSel==='d'){h+=`<h3>${l.dialogue.title}</h3><div class="card">`;
  if(l.id==='sk2'){h+=`<div class="line">${sp(l.dialogue.lines[0][1])}${sp2(l.dialogue.lines[0][1])}<div><i>Nghe trước khi xem văn bản.</i></div></div>`}
  l.dialogue.lines.forEach(x=>{h+=`<div class="line">${sp(x[1])}<div>${x[0]?`<span class="who">${x[0]}:</span> `:''}<b>${esc(x[1])}</b><div class="vi" style="font-weight:600">${x[2]}</div></div></div>`});h+='</div>'}
 if(tabSel==='g'){l.grammar.forEach(g=>{h+=`<h3>${g.t}</h3><div class="rule">${g.r}</div>`;g.ex.forEach(e=>{h+=`<div class="card vrow">${sp(e[0])}<div><b>${esc(e[0])}</b><div class="vi" style="font-weight:600">${e[1]}</div></div></div>`})});
  if(l.project){h+=`<h3>✍️ Viết bài của bạn</h3><div class="tip">Dùng dàn ý 6 câu ở trên. Viết 6–8 câu, rồi bấm đọc to để nghe và luyện nói.</div><textarea id="pw" placeholder="My project is about …"></textarea><p><button class="btn blue sm" onclick="speak($('#pw').value||'Write something first')">🔊 Đọc bài của tôi</button></p>`}}
 h+=`<p style="margin-top:22px"><button class="btn" onclick="startQuiz(${i})">Bắt đầu luyện tập</button></p>`;app.innerHTML=h}

/* ---- Luyện tập ---- */
function startQuiz(i){const l=L[i];const qs=l.quiz.map((x,k)=>({...x,key:l.id+':'+k}));cur={i,L:l,qs,q:shuffle(qs.map((x,k)=>k)),pos:0,wrong:0};hearts=5;nextQ()}
function startReview(){let qs=[];L.forEach(l=>l.quiz.forEach((x,k)=>{const key=l.id+':'+k;if(S.weak[key])qs.push({...x,key})}));
 if(qs.length<8){L.filter(l=>(S.best[l.id]||0)<3).forEach(l=>shuffle(l.quiz.map((x,k)=>({...x,key:l.id+':'+k}))).slice(0,3).forEach(x=>{if(!qs.some(y=>y.key===x.key))qs.push(x)}))}
 if(!qs.length){qs=shuffle(L.flatMap(l=>l.quiz.map((x,k)=>({...x,key:l.id+':'+k})))).slice(0,10)}
 qs=shuffle(qs).slice(0,12);cur={i:-1,L:{id:'rv',title:'Ôn tập'},qs,q:qs.map((x,k)=>k),pos:0,wrong:0};hearts=5;nextQ()}
function nextQ(){topbar();if(hearts<=0)return fail();if(cur.pos>=cur.q.length)return finish();
 const l=cur.L,q=cur.qs[cur.q[cur.pos]];cur.q_=q;cur.sel=null;cur.built=[];
 let h=`<div class="qtop"><button class="x" onclick="if(confirm('Thoát bài luyện tập?'))${cur.i<0?'home()':'review('+cur.i+')'}">✕</button><div class="prog"><i style="width:${cur.pos/cur.q.length*100}%"></i></div></div><div class="q">`;
 if(q.t==='mc'){h+=`<h2>${esc(q.q)}</h2><div class="qvi">${q.vi}</div>`;if(q.say)h+=`<p>${sp(q.say)} ${sp2(q.say)} <small>Bấm để nghe</small></p>`;
  q.o.forEach((o,k)=>h+=`<button class="opt" data-k="${k}" onclick="pickOpt(${k})">${esc(o)}</button>`)}
 if(q.t==='fill'){h+=`<h2>Điền từ còn thiếu</h2><div class="qvi">${q.vi}</div><p class="en" style="font-weight:700">${esc(q.q).replace('___','<span style="border-bottom:3px solid var(--b);padding:0 22px"></span>')}</p><input class="ans" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án…" oninput="chk()">`}
 if(q.t==='listen'){h+=`<h2>Nghe và gõ lại câu bạn nghe</h2><div class="qvi">Bấm 🔊 hoặc 🐢 (nghe chậm)</div><p>${sp(q.say)} ${sp2(q.say)}</p><input class="ans" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu tiếng Anh…" oninput="chk()">`}
 if(q.t==='order'){cur.tok=shuffle(q.a.split(' '));h+=`<h2>Sắp xếp thành câu đúng</h2><div class="qvi">${q.vi}</div><div class="built" id="built"></div><div class="bank" id="bank"></div>`}
 h+='</div>';app.innerHTML=h;
 footIn.innerHTML=`<button class="btn ghost" onclick="skip()" style="margin-right:auto">Bỏ qua</button><button class="btn" id="chkBtn" disabled onclick="check()">Kiểm tra</button>`;foot.className='foot';foot.style.display='block';
 if(q.t==='order')renderOrder();
 if(q.t==='listen')setTimeout(()=>speak(q.say),300);
 if(q.t==='mc'&&q.say&&q.key.indexOf('sk2')===0)setTimeout(()=>speak(q.say),300);
 const inp=$('#inp');if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'&&!$('#chkBtn').disabled)check()}}}
function pickOpt(k){if(cur.done)return;cur.sel=k;document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.k===k));$('#chkBtn').disabled=false}
function chk(){$('#chkBtn').disabled=!$('#inp').value.trim()}
function renderOrder(){const b=$('#built'),k=$('#bank');b.innerHTML=cur.built.map((t,x)=>`<button class="chip" onclick="unOrd(${x})">${esc(cur.tok[t])}</button>`).join('');
 k.innerHTML=cur.tok.map((w,x)=>`<button class="chip ${cur.built.includes(x)?'used':''}" onclick="ord(${x})">${esc(w)}</button>`).join('');$('#chkBtn').disabled=cur.built.length!==cur.tok.length}
function ord(x){if(cur.done)return;cur.built.push(x);renderOrder()}
function unOrd(x){if(cur.done)return;cur.built.splice(x,1);renderOrder()}
function skip(){if(cur.done)return;cur.q.push(cur.q[cur.pos]);cur.pos++;nextQ()}

function check(){const q=cur.q_;let ok=false,ans='',full='';
 if(q.t==='mc'){ok=cur.sel===q.a;ans=q.o[q.a];full=q.s||'';document.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.k;if(k===q.a)b.classList.add('ok');else if(k===cur.sel)b.classList.add('no')})}
 if(q.t==='fill'){const v=norm($('#inp').value);ok=q.a.some(a=>norm(a)===v);ans=q.a[0];full=q.q.replace('___',q.a[0]);$('#inp').disabled=true}
 if(q.t==='listen'){ok=norm($('#inp').value)===norm(q.say);ans=q.say;full=q.say;$('#inp').disabled=true}
 if(q.t==='order'){const u=cur.built.map(t=>cur.tok[t]).join(' ');ok=norm(u)===norm(q.a);ans=q.a;full=q.a}
 cur.done=true;if(ok)delete S.weak[q.key];else S.weak[q.key]=1;save();if(!ok){hearts--;cur.wrong++;cur.q.push(cur.q[cur.pos])}topbar();
 foot.className='foot '+(ok?'ok':'no');
 const tr=q.vi?`<div class="tr">🇻🇳 ${q.vi.replace(/\s*\(.*?\)\s*$/,'')}</div>`:'';
 footIn.innerHTML=`<div class="fb"><h4>${ok?'✅ Chính xác!':'❌ Chưa đúng'}</h4>${ok?'':`<div><b>Đáp án:</b> ${esc(ans)}</div>`}<div>💡 ${q.e}</div>${(q.t==='mc'&&!q.s)?'':tr}</div>${full||q.say?sp(full||q.say):''}<button class="btn ${ok?'':'red'}" onclick="cur.done=false;cur.pos++;nextQ()">Tiếp tục</button>`}

function finish(){if(cur.i<0){foot.style.display='none';S.xp+=10;save();topbar();app.innerHTML=`<div class="done"><div class="big">💪</div><h2>Hoàn thành ôn tập!</h2><span class="pill">❌ Sai ${cur.wrong} lần</span><span class="pill">Còn ${Object.keys(S.weak).length} câu cần ôn</span><p style="margin-top:24px"><button class="btn ghost" onclick="home()">Về danh sách</button> <button class="btn" onclick="startReview()">Ôn tiếp</button></p></div>`;cur=null;return}const l=L[cur.i];const stars=cur.wrong===0?3:cur.wrong<=2?2:1;S.done[l.id]=1;S.best[l.id]=Math.max(S.best[l.id]||0,stars);const gain=10+stars*5;S.xp+=gain;save();topbar();foot.style.display='none';
 const nx=cur.i+1<L.length;
 app.innerHTML=`<div class="done"><div class="big">🎉</div><h2>Hoàn thành ${l.title}!</h2><p style="font-size:30px;color:var(--y)">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p><span class="pill">⚡ +${gain} XP</span><span class="pill">❌ Sai ${cur.wrong} lần</span><p style="margin-top:24px"><button class="btn ghost" onclick="review(${cur.i})">Ôn lại</button> <button class="btn" onclick="${nx?`review(${cur.i+1})`:'home()'}">${nx?'Phần tiếp theo →':'Về danh sách'}</button></p>${!nx?'<h3>🏆 Bạn đã hoàn thành Unit 5!</h3>':''}</div>`;cur=null}
function fail(){foot.style.display='none';const i=cur.i;app.innerHTML=`<div class="done"><div class="big">💔</div><h2>Hết tim rồi!</h2><p>Hãy ôn lại phần từ vựng & ngữ pháp rồi thử lại nhé.</p><p>${i<0?'<button class="btn blue" onclick="home()">Về danh sách</button> <button class="btn" onclick="startReview()">Thử lại</button>':`<button class="btn blue" onclick="review(${i})">Ôn lại</button> <button class="btn" onclick="startQuiz(${i})">Thử lại</button>`}</p></div>`;cur=null}

home();
</script>
</body>
</html>
