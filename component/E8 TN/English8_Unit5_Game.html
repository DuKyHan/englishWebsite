g('4. Custom / Tradition',`<table><tr><th>Cấu trúc</th><th>Ví dụ</th></tr><tr><td>S + have / has <b>a tradition of</b> + V-ing</td><td>${S('We have a tradition of making Chung cakes.')}</td></tr><tr><td>S + <b>follow / carry on the tradition of</b> + V-ing</td><td>Nam is carrying on the family tradition of growing kumquats.</td></tr><tr><td>S + <b>break with tradition</b> (by + V-ing)</td><td>They broke with tradition by going abroad at Tet.</td></tr><tr><td><b>It is the custom</b> (for sb) <b>to</b> V</td><td>It is the custom for children to wear new clothes.</td></tr><tr><td>S + have <b>the / a custom of</b> + V-ing · <b>There is a custom of</b> + V-ing</td><td>${S('In Viet Nam there is a custom of worshipping ancestors.')}</td></tr><tr><td><b>Traditionally,</b> + S + V</td><td>Traditionally, women take care of the family.</td></tr></table><div class="card panel ex"><b>Lưu ý:</b> tradition <b>of</b> / custom <b>of</b> / <b>by</b> + V-ing · It is the custom <b>for</b> sb <b>to</b> V.</div>`),

<h3>I. Mạo từ (Articles)</h3>

<p>👉 Bữa ăn có tính từ đứng trước → dùng <b>a</b>: a very nice lunch, a big dinner.<br>👉 Tóm lại: <b>lần đầu → a/an</b> · <b>đã xác định → the</b> · <b>nói chung → Ø</b>.</p>
<h3>II. Custom / Tradition</h3>
<ul>
<li><span class="f">S + have / has a tradition of + V-ing</span> — có truyền thống làm gì</li>
<li><span class="f">S + follow / keep (up) / maintain the tradition of + V-ing</span> — theo / giữ / duy trì truyền thống</li>
<li><span class="f">S + carry on the (family) tradition of + V-ing</span> — tiếp nối truyền thống (gia đình)</li>
<li><span class="f">S + break with tradition (by + V-ing)</span> — phá lệ, làm khác truyền thống</li>
<li><span class="f">S + be steeped in tradition</span> — đậm chất truyền thống</li>
<li><span class="f">According to tradition, … = Traditionally, + S + V</span> — theo truyền thống</li>
<li><span class="f">It is the custom (here) (for sb) to + V</span> — có phong tục (ai) làm gì</li>
<li><span class="f">It is customary (for sb) to + V</span> — theo phong tục (customary là tính từ, không có “the”)</li>
<li><span class="f">S + have the / a custom of + V-ing</span> · <span class="f">There is a custom of + V-ing</span> · <span class="f">S + follow the custom of + V-ing</span></li>
</ul>
<p>Ví dụ: There's a tradition that English people drink a lot of tea. → English people <b>follow the tradition of drinking</b> a lot of tea.</p>
<h3>III. Lời khuyên: should / had better</h3>
<ul>
<li><span class="f">S + should + V(nguyên mẫu)</span> — nên (khuyên nhẹ) · <span class="f">S + shouldn't + V</span> — không nên</li>
<li><span class="f">S + had better + V(nguyên mẫu)</span> — tốt hơn hết là nên (khuyên mạnh)</li>
<li><span class="f">S + had better not + V</span> — tốt hơn hết là đừng</li>
<li>It's a good idea to + V → S + should + V · Don't + V → S + shouldn't + V · Never + V → S + had better not + V</li>
</ul>
<p>⚠ should / had better + V <b>không có “to”</b>. Phủ định của had better là <b>had better not</b> (không viết hadn't better).</p>
<h3>IV. Take place / hold / organize / celebrate</h3>
<ul>
<li><span class="f">S (lễ hội) + take(s) place + thời gian / nơi chốn</span> — diễn ra (không có tân ngữ, không dùng bị động)</li>
<li><span class="f">People + hold / organize / celebrate + lễ hội + thời gian</span> — tổ chức / ăn mừng</li>
<li>The Ok Om Bok Festival takes place in October. → People organize the Ok Om Bok Festival in October.</li>
</ul>
<h3>V. Cấu trúc khác trong bài</h3>
<ul>
<li><span class="f">S + can + V + by + V-ing</span> — có thể làm gì bằng cách… (maintain our traditions by organising festivals)</li>
<li><span class="f">It's (good) manners for sb to + V</span> — là phép lịch sự đối với ai khi làm gì</li>
<li><span class="f">the way of + V-ing / N</span> — cách làm gì (the most popular way of greeting)</li>
<li><span class="f">keep + sth + alive</span> — giữ cho cái gì tồn tại</li>
<li><span class="f">adj (difficult / easy) + to V</span> — khó / dễ làm gì</li>
<li><span class="f">be used + to V</span> — được dùng để làm gì</li>
<li><span class="f">must be + V3</span> — phải được làm (bị động): must be served</li>
<li><span class="f">Until recently + quá khứ đơn</span> — cho đến gần đây</li>
<li><span class="f">remind sb of sth</span> — gợi ai nhớ về cái gì</li>
</ul>
<h3>VI. Từ loại (Word Form) – xác định vị trí</h3>
<table><tr><th>Vị trí</th><th>Cần</th><th>Ví dụ</th></tr>
<tr><td>a / an / the / my / his / their / some + ___</td><td>danh từ (N)</td><td>their acceptance, some decorations</td></tr>
<tr><td>a / very / great + adj + ___</td><td>danh từ</td><td>a long-standing tradition, great admiration</td></tr>
<tr><td>giới từ (of, with, in…) + ___</td><td>N / V-ing</td><td>full of festivity, with admiration</td></tr>
<tr><td>___ + N</td><td>tính từ (adj)</td><td>social status, traditional foods</td></tr>
<tr><td>be / feel / look / become + ___</td><td>tính từ</td><td>is contestable, felt obliged</td></tr>
<tr><td>V (thường) + ___ / ___ + V3</td><td>trạng từ (adv)</td><td>talk respectfully, traditionally considered</td></tr>
<tr><td>to / should / can / will + ___</td><td>động từ nguyên mẫu</td><td>to maintain, to socialize</td></tr></table>
<p>Đuôi thường gặp: <b>N</b>: -tion, -sion, -ance, -ence, -ity, -ment, -ness, -er/-or, -ant · <b>Adj</b>: -al, -ful, -ive, -able, -ous, -ic, -ary · <b>Adv</b>: adj + -ly · <b>V</b>: -ize/-ise, -ate, -en.</p>
<h3>VII. Phát âm (Pronunciation)</h3>
<ul>
<li><b>c</b> trước e, i, y → /s/ (dance); còn lại → /k/ (cook, connect)</li>
<li><b>g</b> trước e, i, y và đuôi -ge → /dʒ/ (generate, sponge, oblige); <b>ng</b> cuối từ → /ŋ/ (kidding)</li>
<li><b>n</b> trước k, g → /ŋ/ (link, thank); còn lại → /n/</li>
<li><b>s</b> giữa hai nguyên âm thường → /z/ (design, preserve, physical); basic → /s/</li>
<li><b>a</b> + phụ âm + e, đuôi -ation / -asion → /eɪ/ (take, place, occupation, occasion); many → /e/; man, miraculous → /æ/</li>
<li><b>ar</b> trong âm tiết nhấn → /ɑː/ (carp, party, article); a ở âm tiết không nhấn → /ə/ (tradition)</li>
<li><b>o</b> ở âm tiết nhấn → /ɒ/ (clockwise); không nhấn → /ə/ (custom, correct, opinion)</li>
</ul>
<h3>VIII. Trọng âm (Word Stress)</h3>
<ul>
<li>Danh từ, tính từ 2 âm tiết → thường nhấn <b>âm 1</b>: CUS-tom, VIL-lage, MAN-ner</li>
<li>Động từ 2 âm tiết → thường nhấn <b>âm 2</b>: pre-PARE, main-TAIN, ex-PLAIN, o-BEY</li>
<li>Đuôi <b>-tion, -sion, -ic, -ity, -ety, -ian</b> → nhấn âm <b>ngay trước</b> đuôi: tra-DI-tion, per-MIS-sion, ne-CES-si-ty, so-CI-e-ty</li>
<li>Động từ 3 âm tiết đuôi -ate → nhấn âm 1: DEC-o-rate</li>
<li>Học thuộc: bam-BOO, a-WAY, pa-GO-da, con-TES-tant, re-SPECT, COM-ple-ment</li>
</ul>
<h3>IX. Biển báo (Signs)</h3>
<ul><li>Tròn xanh = <b>bắt buộc</b> (must / be required to / mandatory)</li><li>Tròn đỏ gạch chéo = <b>cấm</b> (can't / not allowed / prohibited)</li><li>Tam giác / nền vàng = <b>cảnh báo</b> (be careful / be cautious / watch out)</li></ul>

function home(){S.lv=null;S.play=0;hdr();
$('#app').innerHTML=`<div class="hero"><div class="mascot">🦉</div><div><h2 style="margin:0">English 8 – Unit 5: Festivals in Viet Nam</h2><div style="color:var(--mut)">Game ôn tập – Chọn nội dung để bắt đầu. Chọn đáp án để xem đúng/sai và lời giải ngay.</div></div></div>
<div class="grid" style="margin-bottom:14px"><button class="lv" style="border-color:var(--y);background:#fffbe6" onclick="notes('v')"><div class="ic">📒</div><h3>Ghi vở – Bảng từ vựng</h3><small>${V.length} từ: loại từ, phiên âm, nghĩa, ví dụ + họ từ, cụm từ</small></button><button class="lv" style="border-color:var(--y);background:#fffbe6" onclick="notes('f')"><div class="ic">📐</div><h3>Ghi vở – Công thức</h3><small>Mạo từ · custom/tradition · should/had better · từ loại · phát âm · trọng âm</small></button></div>
<div class="grid">${LV.map((l,i)=>`<button class="lv" onclick="startLevel('${l.id}')"><span class="bd">${P.badge[l.id]?'🏅':''}</span><div class="ic">${l.ic}</div><h3>Level ${i+1} – ${l.t}</h3><small>${l.d}</small></button>`).join('')}</div>`}
function startLevel(id){S.lv=id;S.play=0;if(id==='vocab'){hdr();$('#app').innerHTML=`<div class="bar"><button class="x" onclick="home()">✕</button><h2 style="margin:0">Level 1 – Vocabulary</h2></div><div class="grid">${[['envi','🇬🇧→🇻🇳 English → Vietnamese'],['vien','🇻🇳→🇬🇧 Vietnamese → English'],['listen','🎧 Listen and choose'],['cards','🃏 Flashcards (từ + IPA + nghe)']].map(m=>`<button class="lv" onclick="vocabGo('${m[0]}')"><h3>${m[1]}</h3><small>${m[0]==='cards'?'Tất cả '+V.length+' từ':'15 câu ngẫu nhiên mỗi lượt'}</small></button>`).join('')}</div>`;return}
begin(ITEMS[id])}
function vocabGo(m){if(m==='cards')return begin(V.map(w=>({k:'card',w})));
const pool=shuf(m==='listen'?V.filter(w=>w.ipa):V).slice(0,15);
/* Loại phương án nhiễu trùng / gần trùng nghĩa hoặc cùng gốc từ (vd: luck – lucky, kumquat – kumquat tree) */
const parts=s=>s.toLowerCase().replace(/\(.*?\)/g,'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
const clash=(x,w)=>{const a=x.w.toLowerCase(),b=w.w.toLowerCase();if(a.includes(b)||b.includes(a))return true;const p=parts(x.vi),q=parts(w.vi);return p.some(s=>q.some(t=>s.includes(t)||t.includes(s)))};
begin(pool.map(w=>{const others=shuf(V.filter(x=>x.w!==w.w&&!clash(x,w))).slice(0,3);const opts=shuf([w,...others]);const a=opts.indexOf(w);
const info=`<b>${w.w}</b> ${w.pos?'('+w.pos+')':''} ${w.ipa}<br>= ${w.vi}${w.ex?'<br>Ví dụ: '+w.ex:''}`;
if(m==='envi')return M(`What does “<b>${w.w}</b>” mean? <span class="ipa">${w.ipa}</span>`,opts.map(x=>x.vi),a,w.vi,info,{sp:w.w,speakOpt:0});
if(m==='vien')return M(`Chọn từ tiếng Anh có nghĩa: <b>${w.vi}</b>`,opts.map(x=>x.w),a,w.vi,info,{sp:w.w});
return M('🎧 Nghe phát âm và chọn từ bạn nghe được.',opts.map(x=>x.w),a,w.vi,info,{sp:w.w,hideQ:1})}))}
function startWeak(){const arr=[];Object.keys(P.wr).forEach(k=>{const[id,i]=k.split(':');const it=ITEMS[id]&&ITEMS[id][+i];if(it&&it.k!=='page')arr.push(Object.assign({},it,{wk:k}))});if(!arr.length){P.wr={};save();return home()}S.lv='weak';begin(arr)}
function begin(items){S.play=1;S.items=items;S.i=0;S.res={};S.rv={};S.tr={};S.ex={};S.sel={};S.bad={};S.val={};hdr();render()}
/* ============ RENDER ============ */
const pass=(it,rv)=>{const p=PASS[it.ctx];let t=p.t;
if(p.bl)t=t.replace(/\{(\d)\}/g,(m,n)=>{n=+n;if(n===it.blank)return rv?`<span class="hl">${it.o[it.a]}</span>`:`<span class="bl cur">(${n}) ______</span>`;return `<span class="bl">(${n}) ______</span>`});
else if(rv)(it.ev||[]).forEach(e=>{t=t.replace(e,`<mark>${e}</mark>`)});
return `<details open><summary>📄 ${p.title}</summary><div class="pass" style="overflow:auto">${t.split('\n').map(x=>`<p>${x}</p>`).join('')}</div><button class="btn w s" onclick="sayPass()">🔊 Đọc cả bài</button></details>`};
function sayPass(){const it=S.items[S.i],p=PASS[it.ctx];say(p.t.replace(/\{\d\}/g,' blank '),.9)}
function optTxt(it,j,rv){const o=it.o[j];if(it.fmt==='pron')return o.replace(/\{(.+?)\}/g,'<u class="ul">$1</u>')+(rv?` <span class="ipa">/${it.snd[j]}/</span>`:'');
if(it.fmt==='stress'){const pl=o.split('-').join('').toLowerCase();const ip=rv&&IPA[pl]?` <span class="ipa">${IPA[pl]}</span>`:'';return (rv?o.split('-').map(s=>/[A-Z]/.test(s)&&s===s.toUpperCase()?`<span class="st">${s}</span>`:s.toLowerCase()).join('·'):pl)+ip}
if(it.fmt==='pron')return o;return o}
const plainOpt=(it,j)=>it.fmt==='stress'?it.o[j].split('-').join('').toLowerCase():strip(it.o[j]);
function ansText(it){if(it.k==='mcq')return `${L[it.a]}. ${it.fmt==='stress'?it.o[it.a].split('-').map(s=>/[A-Z]/.test(s)&&s===s.toUpperCase()?s:s.toLowerCase()).join('-'):strip(it.o[it.a])}`;if(it.k==='in')return (it.pre||'')+it.ans[0];return ''}
function fullText(it){if(it.k==='in')return it.full||((it.pre||'')+it.ans[0]);if(it.k==='mcq'){if(it.fmt)return it.o.map((_,j)=>plainOpt(it,j)).join(', ');const a=plainOpt(it,it.a);if(/_{3,}/.test(it.q))return strip(it.q).replace(/_{3,}/,a==='Ø'?'':a);return strip(it.q)+' '+a}return ''}
function sayQ(r){const it=S.items[S.i];say(it.sp||(it.k==='mcq'&&it.fmt?it.o.map((_,j)=>plainOpt(it,j)).join(', '):strip(it.q)+(it.pre?' '+it.pre:'')),r)}
function sayFull(){const it=S.items[S.i];say(S.rv[S.i]?fullText(it):strip(it.q),.95)}
function sayOpt(j,e){e&&e.stopPropagation();const it=S.items[S.i];say(plainOpt(it,j))}
function render(){const T=false,n=S.items.length;if(S.i>=n)return summary();
const it=S.items[S.i],i=S.i,rv=!!S.rv[i];let h=`<div class="bar"><button class="x" onclick="home()">✕</button><div class="pg"><i style="width:${i/n*100}%"></i></div><b>${i+1}/${n}</b></div>`;
if(it.k==='page'){h+=`<div class="card"><h2>${it.title}</h2>${it.html}</div>`}
else if(it.k==='card'){const w=it.w;h+=`<div class="card" style="text-align:center"><div class="q" style="font-size:clamp(40px,7vw,90px)">${w.w}</div><div class="ipa" style="font-size:clamp(20px,3vw,36px)">${w.ipa||''} ${w.pos?'· '+w.pos:''}</div><div class="q" style="color:var(--gd);margin-top:14px">${w.vi}</div>${w.ex?`<div class="panel card ex">Ví dụ: <span class="say" data-s="${w.ex.replace(/"/g,'')}">${w.ex}</span></div>`:''}<p><button class="btn b" onclick="say('${w.w.replace(/'/g,"\\'")}')">🔊 Nghe</button> <button class="btn w" onclick="say('${w.w.replace(/'/g,"\\'")}',.55)">🐢 Chậm</button></p></div>`}
else{ if(it.ctx)h+=`<div class="card">${pass(it,rv)}</div>`; if(it.ctx2)h+=`<div class="card"><details open><summary>📘 Dictionary</summary>${DICT[it.ctx2]}</details></div>`; if(it.sign)h+=`<div class="card" style="text-align:center">${it.sign}<div style="color:var(--mut);font-size:13px">${it.note}</div></div>`;
h+=`<div class="card">`+(it.hideQ?`<div class="q">${it.q}</div>`:`<div class="q"><span class="num">${it.part&&it.n?'':''}</span>${it.q}${it.pre?`<br><span style="color:var(--bd)">→ ${it.pre}</span>${rv?`<mark>${it.ans[0]}</mark>`:'<span class="bl">__________</span>'}`:''}</div>`);

if(it.k==='mcq'){h+=`<div class="opts" style="margin-top:14px">`+it.o.map((o,j)=>{let c='opt';if(rv)c+=j===it.a?' ok':(T?' dim':'');if(!rv&&T&&S.sel[i]===j)c+=' sel';if(!T&&(S.bad[i]||[]).includes(j))c+=' no';if(rv&&T&&S.sel[i]===j&&j!==it.a)c+=' no';
return `<button class="${c}" onclick="pick(${j})"><span class="l">${L[j]}</span><span class="t">${optTxt(it,j,rv)}</span></button>`}).join('')+`</div>`}
else if(it.k==='in'&&!T){h+=`<div style="margin-top:14px"><input class="in" id="inp" autocomplete="off" autocapitalize="off" placeholder="Nhập đáp án…" value="${(S.val[i]||'').replace(/"/g,'&quot;')}" ${rv?'disabled':''} onkeydown="if(event.key==='Enter')check()"></div>`}
h+=`<div class="qa">${it.sp||it.fmt?`<button class="btn b s" onclick="sayQ()">🔊 Nghe</button><button class="btn w s" onclick="sayQ(.6)">🐢 Chậm</button>`:(!it.sign&&!it.blank?`<button class="btn w s" onclick="sayFull()">🔊 ${rv?'Nghe câu đầy đủ':'Nghe câu hỏi'}</button>`:'')}</div>`;
h+=`</div>`;
if(S.fb&&S.fb.i===i&&!T)h+=`<div class="fb ${S.fb.ok?'ok':'no'}">${S.fb.m}</div>`;
if(!T&&it.k==='in'&&!rv&&it.hint)h+=`<div class="card panel ex">${it.hint}</div>`}
/* Khu vực đáp án */
if(rv&&it.k!=='card'&&it.k!=='page'){h+=`<div class="card panel"><h4>✅ Đáp án: <span style="color:var(--gd)">${it.k==='in'?(it.pre||'')+it.ans[0]:ansText(it)}</span></h4>${it.f?`<div>📐 ${it.f}</div>`:''}${it.vi&&!it.sp?`<div>🇻🇳 ${it.vi}</div>`:''}${it.k==='in'&&it.full?`<div><span class="say" data-s="${it.full.replace(/"/g,'')}">🔊 ${it.full}</span></div>`:''}</div>`}

if(S.ex[i]&&rv&&it.ex&&it.k!=='card')h+=`<div class="card panel ex"><h4>💡 Giải thích chi tiết</h4>${it.ex}${it.tip?`<div style="margin-top:6px">🎒 <b>Mẹo:</b> ${it.tip}</div>`:''}${it.flag?`<div class="flag">${it.flag}</div>`:''}</div>`;
/* Điều hướng tối giản */
if(it.k==='page'||it.k==='card'){h+=`<div class="tbar"><button class="btn" onclick="go(1)">Tiếp tục ▶</button></div>`}
else{h+=`<div class="tbar">${it.k==='in'&&!rv?`<button class="btn" onclick="check()">Kiểm tra</button>`:''}<button class="btn" onclick="go(-1)" ${i===0?'disabled':''}>◀ Trước</button><button class="btn" onclick="go(1)">Tiếp theo ▶</button></div>`}
$('#app').innerHTML=h;hdr();const inp=$('#inp');if(inp&&!rv)inp.focus();
if(it.hideQ&&!rv)setTimeout(()=>sayQ(),250)}
/* ============ TƯƠNG TÁC ============ */
function mark(ok){const i=S.i,it=S.items[i];if(S.res[i])return;S.res[i]=ok?'ok':'bad';const k=it.wk||(S.lv&&ITEMS[S.lv]?S.lv+':'+ITEMS[S.lv].indexOf(it):null);
if(ok){P.xp+=10;S.streak++;if(S.streak>P.best)P.best=S.streak;if(k&&P.wr[k]&&it.wk)delete P.wr[k]}else{S.streak=0;if(k&&!k.endsWith(':-1'))P.wr[k]=(P.wr[k]||0)+1}save()}
function pick(j){const i=S.i,it=S.items[i];
if(S.rv[i])return;
if(j===it.a){mark(true);S.fb={i,ok:1,m:'🎉 Chính xác!'};beep(1)}
else{mark(false);S.bad[i]=(S.bad[i]||[]).concat(j);S.fb={i,ok:0,m:'❌ Chưa chính xác. Đáp án đúng được đánh dấu bên dưới.'};beep(0)}
S.rv[i]=1;S.ex[i]=1;render()}
function check(){const i=S.i,it=S.items[i];const v=$('#inp').value;S.val[i]=v;if(!nz(v))return toast('Hãy nhập đáp án');
const u=nz(v);const ok=it.ans.some(a=>nz(a)===u||(it.pre&&nz(it.pre+a)===u));
if(ok){mark(true);S.fb={i,ok:1,m:'🎉 Chính xác!'};beep(1)}else{mark(false);S.fb={i,ok:0,m:'❌ Chưa chính xác. Đáp án tham khảo và giải thích ở bên dưới.'};beep(0)}S.rv[i]=1;S.ex[i]=1;render()}
function giveUp(){mark(false);S.rv[S.i]=1;S.ex[S.i]=1;S.fb=null;render()}
function togRv(){const i=S.i;S.rv[i]=!S.rv[i];if(!S.rv[i]){S.ex[i]=0}render()}
function togTr(){S.tr[S.i]=!S.tr[S.i];render()}
function togEx(){const i=S.i;if(!S.rv[i])S.rv[i]=1;S.ex[i]=!S.ex[i];render()}
function go(d){const n=S.items.length;S.i=Math.max(0,Math.min(n,S.i+d));S.fb=null;render();window.scrollTo(0,0)}
function summary(){const n=S.items.filter(x=>x.k==='mcq'||x.k==='in').length;
const ok=Object.values(S.res).filter(x=>x==='ok').length,bad=Object.values(S.res).filter(x=>x==='bad').length,todo=Math.max(0,n-ok-bad);
if(S.lv&&S.lv!=='weak'&&n)P.badge[S.lv]=1;save();
const wrongIdx=S.items.map((x,i)=>S.res[i]==='bad'?i:-1).filter(i=>i>=0);
$('#app').innerHTML=`<div class="card" style="text-align:center"><div class="mascot">${n?'🏅':'🦉'}</div><h2>${n?'Hoàn thành! Bạn nhận được huy hiệu 🏅':'Hoàn thành phần lý thuyết!'}</h2>${n?`<div class="stat"><div>✅ ${ok}<br><small>đúng ngay lần đầu</small></div><div>❌ ${bad}<br><small>sai</small></div><div>⏳ ${todo}<br><small>chưa làm</small></div></div>`:''}
<p>${wrongIdx.length?'Các câu sai: '+wrongIdx.map(i=>i+1).join(', '):''}</p>${wrongIdx.length?`<button class="btn r" onclick="retryWrong()">🔁 Luyện lại câu sai</button> `:''}<button class="btn" onclick="home()">Về menu</button></div>`}
function retryWrong(){const w=S.items.filter((x,i)=>S.res[i]==='bad');begin(w.map(x=>Object.assign({},x)))}
document.addEventListener('keydown',e=>{if(!S.play||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight'){go(1)}else if(e.key==='ArrowLeft'){go(-1)}});
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('app'))home();
</script></body></html>
