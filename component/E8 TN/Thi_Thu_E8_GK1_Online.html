<!doctype html>
<html lang="vi">
<head>

<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#2563eb;--pri2:#1e40af;--ok:#16a34a;--okbg:#dcfce7;--no:#dc2626;--nobg:#fee2e2;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:1.4rem}header p{margin:4px 0 0;opacity:.9;font-size:.92rem}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{flex:1 1 140px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;text-align:left}
.tab b{display:block}.tab span{font-size:.78rem;color:var(--mut)}
.tab.active{border-color:var(--pri);background:#eff6ff}
.tab.done b::after{content:" ✓ " attr(data-s);color:var(--ok)}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--pri2)}
.timer.low{color:var(--no)}
.prog{font-size:.85rem;color:var(--mut);margin-left:auto}
input.nm{border:1px solid #cbd5e1;border-radius:8px;padding:6px 8px;font:inherit;min-width:0;width:200px}
button.b{border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
button.b:hover{background:var(--pri2)}button.b.g{background:#e5e7eb;color:var(--ink)}button.b.g:hover{background:#d1d5db}
button.b:disabled{opacity:.5;cursor:not-allowed}
h2{margin:14px 0 4px;font-size:1.1rem;color:var(--pri2);border-bottom:2px solid var(--pri);padding-bottom:3px}
h2 small{color:var(--mut);font-weight:400;font-size:.85rem}
.ins{margin:10px 0 4px;font-weight:600}
.vi{color:#0f766e;font-weight:400;font-style:italic;font-size:.88rem}
.q{padding:7px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.opts{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px}
.opts label{border:2px solid var(--line);border-radius:8px;padding:3px 12px;cursor:pointer;user-select:none;background:#fff}
.opts label:has(input:checked){border-color:var(--pri);background:#eff6ff}
.opts input{display:none}
.opts.tf label{padding:3px 20px;font-weight:700}
input.t{border:0;border-bottom:2px solid var(--pri);background:#f8fafc;font:inherit;font-weight:600;padding:1px 6px;width:140px;text-align:center;color:var(--pri2)}
input.t:focus,textarea:focus{outline:none;background:#eff6ff}
textarea{width:100%;border:2px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;margin-top:5px;resize:vertical;min-height:44px}
.pas{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;margin:6px 0;text-align:justify}
.good{background:var(--okbg)!important;border-color:var(--ok)!important}
.bad{background:var(--nobg)!important;border-color:var(--no)!important}
.fb{font-size:.86rem;margin-top:4px}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#eff6ff;border-radius:10px;padding:10px;margin:8px 0}
select{font:inherit;padding:5px;border-radius:8px;border:1px solid #cbd5e1;max-width:200px}
.pbar{height:6px;background:#dbeafe;border-radius:4px;overflow:hidden;flex-basis:100%}.pbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.warn{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:8px 12px;font-size:.88rem;display:none;margin:8px 0}
.result{border:2px solid var(--pri);background:#eff6ff}
.result .big{font-size:2rem;font-weight:800;color:var(--pri2)}
table.rs{border-collapse:collapse;margin:8px 0;width:100%}
table.rs td,table.rs th{border:1px solid var(--line);padding:5px 10px;text-align:left}
table.rs th{background:#f1f5f9}
.ex{background:#f0fdfa;border-left:3px solid #14b8a6;padding:4px 10px;margin-top:4px;font-size:.88rem;color:#134e4a;border-radius:0 6px 6px 0}
.self{font-size:.82rem;margin-left:6px}
details{margin-top:10px;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
summary{cursor:pointer;font-weight:600;color:var(--pri2)}
u{text-decoration:underline}
@media print{.bar,.tabs,.player,button{display:none!important}.card{box-shadow:none}}
</style>
</head>

","does","doing","did"],"a":1},{"o":["because","but","so","or"],"a":0}]},"passage":{"text":"Nam's grandparents have a farm in Thai Nguyen. It is quite large, with a vegetable garden, a small pond and a vast field of tea. Nam visits them every summer. In the morning, he helps his grandfather feed the cows and collect eggs. In the afternoon, he often goes fishing in the pond or rides a bike around the village. At night, there are lots of stars in the sky, but there is no cinema or shopping centre nearby, so Nam sometimes feels bored. However, he still loves the farm because the air is fresh and the people are very friendly.","qs":[{"q":"Where is the farm?","o":["Thai Binh","Thai Nguyen","Thanh Hoa","Thua Thien"],"a":1},{"q":"Which of these is NOT on the farm?","o":["A vegetable garden","A pond","A tea field","A swimming pool"],"a":3},{"q":"What does Nam do in the morning?","o":["He goes fishing.","He rides a bike.","He feeds the cows and collects eggs.","He plays football."],"a":2},{"q":"Why does Nam sometimes feel bored?","o":["He has no friends.","There is no cinema or shopping centre nearby.","He has too much work.","The weather is bad."],"a":1},{"q":"The word “vast” is closest in meaning to ______.","o":["tiny","very large","beautiful","narrow"],"a":1}]},"rw":[["He loves surfing the Internet.","He is fond …","He is fond of surfing the Internet."],["My brother hates going fishing.","My brother isn't …","My brother isn't keen on going fishing."],["Life in the countryside isn't as busy as life in the city. (busier)","Life in the city …","Life in the city is busier than life in the countryside."],["It was raining heavily. We didn't go camping. (so)","…","It was raining heavily, so we didn't go camping."]],"sb":[["My cousin / crazy about / play / computer games.","My cousin is crazy about playing computer games."],["I / not keen / go / camping / because / it / be / dangerous.","I'm not keen on going camping because it is dangerous."],["Farmers / harvest / rice / now.","Farmers are harvesting rice now."],["Mai / run / fast / than / her sister.","Mai runs faster than her sister."]]},{"theme":"Unit 2 – Village life and city life","pron":[{"o":["b<u>u</u>sh","p<u>u</u>sh","b<u>u</u>s","p<u>u</u>ll"],"a":2},{"o":["h<u>a</u>rvest","f<u>a</u>rmer","g<u>a</u>rden","c<u>a</u>t"],"a":3}],"mcq":[{"q":"My grandfather is fond ______ telling stories about the village.","o":["at","of","in","to"],"a":1},{"q":"She enjoys ______ pictures of the countryside.","o":["take","takes","taking","to take"],"a":2},{"q":"Look! The children ______ kites in the paddy field.","o":["fly","flies","is flying","are flying"],"a":3},{"q":"You must drive ______ in the village, or you may hit a buffalo.","o":["careful","carefully","more careful","carelessly"],"a":1},{"q":"A ______ is a place where we can buy fresh vegetables and fruit.","o":["forum","market","pond","cart"],"a":1},{"q":"The air in the countryside is ______ than that in the city.","o":["clean","cleaner","more clean","cleanest"],"a":1},{"q":"The village is quiet; ______, some teens feel bored there.","o":["so","because","however","and"],"a":2},{"q":"“Would you like to visit my village this weekend?” – “______”","o":["Yes, I'd love to.","It's far away.","I have visited.","Yes, it is."],"a":0}],"wf":[["Minh dislikes (stay) ______ at home on sunny days.","staying"],["Tam runs (quick) ______ than Hung.","more quickly / quicker"],["They are fond of (watch) ______ the sunset.","watching"]],"err":[["My uncle {is} crazy {of} {collecting} {stamps}.","B","about"],["Nam {didn't} study {hard}, {but} he {failed} the exam.","C","so"]],"cloze":{"text":"Life in the countryside is (1)____ peaceful than life in the city. People there are friendly and (2)____. Neighbours often help each other (3)____ harvest time. Children can play outdoors, (4)____ they don't have many modern things to play with. Many city people visit the countryside at weekends (5)____ they want to enjoy the fresh air.","items":[{"o":["more","most","much","very"],"a":0},{"o":["hospitable","hospital","hospitably","hospitality"],"a":0},{"o":["in","at","on","by"],"a":1},{"o":["so","but","and","because"],"a":1},{"o":["so","but","because","however"],"a":2}]},"passage":{"text":"Mr Tuan used to work in an office in Ha Noi. Two years ago, he moved to a small village in Quang Binh to grow fruit trees. At first, life was difficult because he knew nothing about farming, but his neighbours showed him how to plant and water the trees. Now he has a big orchard of orange trees, and he sells oranges at the local market. He gets up at 5 a.m. and feels healthier than before. Although he earns less money than in the city, he is happier. In his free time, he plays chess with his neighbours.","qs":[{"q":"Where did Mr Tuan work before?","o":["In a school","In an office in Ha Noi","On a farm","In a market"],"a":1},{"q":"Why was life difficult at first?","o":["He had no neighbours.","He knew nothing about farming.","He was ill.","There was no market."],"a":1},{"q":"What does Mr Tuan grow?","o":["Rice","Tea","Orange trees","Vegetables"],"a":2},{"q":"Compared with city life, he now ______.","o":["earns more money","earns less money but is happier","is unhappier","works less"],"a":1},{"q":"What does he do in his free time?","o":["He goes fishing.","He plays chess with his neighbours.","He reads books.","He watches TV."],"a":1}]},"rw":[["My sister likes playing the piano. (fond)","My sister is …","My sister is fond of playing the piano."],["Mrs Lan dislikes cooking. (keen)","Mrs Lan isn't …","Mrs Lan isn't keen on cooking."],["The city is noisier than the village. (as)","The village isn't …","The village isn't as noisy as the city."],["The village is peaceful. It is far from the city. (but)","…","The village is peaceful, but it is far from the city."]],"sb":[["Children / love / fly kites / summer evenings.","Children love flying kites on summer evenings."],["Farmers / get up / early / than / city workers.","Farmers get up earlier than city workers."],["We / not / keen / watch TV / because / it / be / boring.","We aren't keen on watching TV because it is boring."],["They / should / help / neighbours / when / they / need.","They should help their neighbours when they need help."]]},{"theme":"Unit 3 – Teens' stress and pressure","pron":[{"o":["<u>s</u>ugar","<u>s</u>ure","<u>sh</u>eep","<u>s</u>ound"],"a":3},{"o":["need<u>ed</u>","play<u>ed</u>","want<u>ed</u>","visit<u>ed</u>"],"a":1}],"mcq":[{"q":"Nam is tired, ______ he goes to bed early.","o":["so","but","because","or"],"a":0},{"q":"Minh is tired ______ studying all day.","o":["of","on","at","with"],"a":0},{"q":"I'm not keen ______ posting photos online.","o":["in","on","at","to"],"a":1},{"q":"My brother hates ______ in the rain.","o":["walk","walks","walking","walked"],"a":2},{"q":"If you feel stressed, you should ______ to a friend.","o":["talk","talks","talking","to talk"],"a":0},{"q":"Many teens feel stressed ______ their parents expect too much.","o":["because","so","but","or"],"a":0},{"q":"Hoa ______ her homework faster than I do.","o":["does","do","doing","did"],"a":0},{"q":"I don't know how to ______ with my stress.","o":["deal","take","get","give"],"a":0}],"wf":[["Lan adores (listen) ______ to music after school.","listening"],["Ann studies (hard) ______ than her sister.","harder"],["Teenagers fancy (hang out) ______ with friends.","hanging out"]],"err":[["My parents {expects} me {to get} {high} {marks}.","A","expect"],["She {works} {more careful} {than} {her} classmates.","B","more carefully"]],"cloze":{"text":"Many teenagers feel (1)____ because they have too much homework. They also (2)____ pressure from their friends and parents. To reduce stress, teens should do exercise, (3)____ enough sleep and manage their time well. It is (4)____ to talk to someone you trust (5)____ keep worries to yourself.","items":[{"o":["stress","stressed","stressful","stressing"],"a":1},{"o":["feel","feels","feeling","felt"],"a":0},{"o":["get","gets","getting","got"],"a":0},{"o":["good","well","better","best"],"a":2},{"o":["than","and","so","but"],"a":0}]},"passage":{"text":"Linh is a Grade 8 student. She is under a lot of pressure at the moment. Her parents want her to be the best student in her class, so she goes to extra classes every evening and has little time to relax. Last week, she got a headache and could not concentrate in class. Her teacher noticed this and talked to her. Now Linh has a timetable that includes time to play badminton on Saturdays. She also tells her parents about her feelings. She feels much better than before.","qs":[{"q":"Why is Linh under pressure?","o":["She has no friends.","Her parents want her to be the best in class.","She is ill.","She changed school."],"a":1},{"q":"What happened last week?","o":["She won a prize.","She got a headache and could not concentrate.","She failed a test.","She quarrelled with a friend."],"a":1},{"q":"Who noticed Linh's problem?","o":["Her mother","Her friend","Her teacher","Her sister"],"a":2},{"q":"What does Linh do on Saturdays now?","o":["She goes to extra classes.","She plays badminton.","She goes shopping.","She visits her grandparents."],"a":1},{"q":"How does she feel now?","o":["Worse than before","Much better than before","The same as before","More stressed"],"a":1}]},"rw":[["Nam loves hanging out with friends. (enjoy)","Nam …","Nam enjoys hanging out with friends."],["Tom hates playing board games. (keen)","Tom isn't …","Tom isn't keen on playing board games."],["Stress can make teens tired. It can also give them headaches. (Combine, using AND)","…","Stress can make teens tired and give them headaches."],["Lan runs faster than Mai. (as)","Mai doesn't …","Mai doesn't run as fast as Lan."]],"sb":[["Teens / should / talk / parents / when / they / feel / stressed.","Teens should talk to their parents when they feel stressed."],["Minh / crazy about / play / video games.","Minh is crazy about playing video games."],["She / not / good / maths; / however / she / member / maths club.","She isn't good at maths; however, she is a member of the maths club."],["I / detest / stay up late / because / I / feel / tired / next day.","I detest staying up late because I feel tired the next day."]]},{"theme":"Unit 3 – Coping with stress","pron":[{"o":["<u>ch</u>ess","<u>ch</u>ange","<u>ch</u>ef","<u>ch</u>air"],"a":2},{"o":["h<u>ou</u>se","m<u>ou</u>th","y<u>ou</u>ng","cl<u>ou</u>d"],"a":2}],"mcq":[{"q":"You should take a short ______ every hour when you study.","o":["break","brake","bake","beak"],"a":0},{"q":"Stress can ______ teenagers' health.","o":["affect","effect","affects","effects"],"a":0},{"q":"My sister is crazy ______ K-pop.","o":["at","about","in","of"],"a":1},{"q":"Hung dislikes ______ in front of a computer all day.","o":["work","works","working","worked"],"a":2},{"q":"The test was ______ than we expected.","o":["more easy","easier","easy","easily"],"a":1},{"q":"He didn't sleep well, ______ he felt tired.","o":["so","but","because","or"],"a":0},{"q":"Doing exercise is a good way to ______ stress.","o":["reduce","reduces","reducing","reduced"],"a":0},{"q":"“I feel stressed about my exam.” – “______”","o":["Why don't you make a timetable?","I like exams.","It's an exam.","You are stressed."],"a":0}],"wf":[["My dad adores (cook) ______ for the family.","cooking"],["Mi dances (beautifully) ______ than Hoa.","more beautifully"],["Tuan is not keen on (go) ______ out at night.","going"]],"err":[["She {hate} {doing} {homework} {at night}.","A","hates"],["He {is} not {fond} {for} {swimming}.","C","of"]],"cloze":{"text":"Stress is a normal part of life, (1)____ it can be harmful if it lasts too long. Here are some tips. First, make a timetable (2)____ you know what to do each day. Second, take a short break (3)____ forty-five minutes. Third, do (4)____ activities such as swimming or cycling. Finally, if you still feel stressed, talk to (5)____ school counsellor.","items":[{"o":["but","so","because","or"],"a":0},{"o":["so","but","or","however"],"a":0},{"o":["on","every","in","at"],"a":1},{"o":["physical","physics","physically","physician"],"a":0},{"o":["a","an","two","any"],"a":0}]},"passage":{"text":"Tom is a teenager from England. He is crazy about football and plays for his school team twice a week. Last term, he was worried because he had too many tests and little time for football. His coach advised him to plan his week. Tom wrote a timetable: he studies for two hours every evening and plays football at weekends. He also goes to bed at ten o'clock. Now he is less stressed and his marks are higher.","qs":[{"q":"What is Tom crazy about?","o":["Music","Football","Chess","Cooking"],"a":1},{"q":"How often does he play for his school team?","o":["Once a week","Twice a week","Every day","Only at weekends"],"a":1},{"q":"Why was Tom worried last term?","o":["His team lost a match.","He had too many tests and little time for football.","He had no friends.","He was ill."],"a":1},{"q":"Who advised Tom to plan his week?","o":["His father","His teacher","His coach","His friend"],"a":2},{"q":"What happened after Tom made a timetable?","o":["He felt more stressed.","He was less stressed and got higher marks.","He stopped playing football.","He failed his tests."],"a":1}]},"rw":[["My mother loves cooking. (keen)","My mother is …","My mother is keen on cooking."],["Life in the village isn't as expensive as life in the city. (more)","Life in the city …","Life in the city is more expensive than life in the village."],["She didn't sleep well. She felt tired. (so)","…","She didn't sleep well, so she felt tired."],["Do you like playing chess? (interested)","Are you …","Are you interested in playing chess?"]],"sb":[["You / should / make / timetable / manage / time.","You should make a timetable to manage your time."],["Some teens / feel / pressure / because / they / expect / get / high marks.","Some teens feel pressure because they are expected to get high marks."],["Mai / not / fond / run / because / it / tiring.","Mai isn't fond of running because it is tiring."],["We / adore / spend / weekends / grandparents' village.","We adore spending weekends in our grandparents' village."]]},{"theme":"Units 2 & 3 – Review","pron":[{"o":["t<u>our</u>","p<u>our</u>","c<u>our</u>se","f<u>our</u>"],"a":0},{"o":["b<u>ea</u>ch","t<u>ea</u>m","br<u>ea</u>d","cl<u>ea</u>n"],"a":2}],"mcq":[{"q":"Many teens are crazy ______ taking photos.","o":["about","on","at","of"],"a":0},{"q":"They ______ rice in the field at the moment.","o":["harvest","is harvesting","are harvesting","harvested"],"a":2},{"q":"My mother is good at ______ dishes.","o":["make","makes","making","to make"],"a":2},{"q":"Living in the city is ______ living in the village.","o":["more expensive than","expensive than","as more expensive","expensiver than"],"a":0},{"q":"Hoa didn't prepare well, ______ she did badly in the test.","o":["but","so","because","although"],"a":1},{"q":"People in my village are very ______; they always welcome guests.","o":["hospitable","hostile","lazy","noisy"],"a":0},{"q":"A good way to relax is to ______ some music.","o":["listen","hear","listen to","hearing"],"a":2},{"q":"“Why don't we have a picnic by the lake?” – “______”","o":["That's a good idea.","Yes, it is.","I'm fine.","No, thanks, I do."],"a":0}],"wf":[["She fancies (fly) ______ a kite.","flying"],["Lan works (careful) ______ than her sister.","more carefully"],["Nam hates (stay) ______ indoors.","staying"]],"err":[["My brother {is} keen {on} {play} {football}.","C","playing"],["Life {in} the village {is} more peaceful {that} {life} in the city.","C","than"]],"cloze":{"text":"Last summer, I stayed at my grandparents' house in the countryside. I (1)____ up early every morning to feed the chickens. After that, I (2)____ my grandpa to herd the buffaloes. In the afternoon, I (3)____ kites with the village children. It was a relaxing holiday (4)____ it was quiet and peaceful. (5)____, I missed my friends in the city a little.","items":[{"o":["get","got","getting","gets"],"a":1},{"o":["helped","help","helping","helps"],"a":0},{"o":["fly","flew","flies","flying"],"a":1},{"o":["because","but","so","or"],"a":0},{"o":["However","Therefore","Because","Moreover"],"a":0}]},"passage":{"text":"Some people think that teenagers in the countryside have no stress. This is not true. Lan, 14, lives in a village. She gets up at 5 a.m. to help her mother in the field before school. She walks three kilometres to school. In the evening, she does her homework late. She sometimes feels tired and worried about her tests. However, she says her friends and the quiet life help her feel better. At weekends, she cycles along the river with her friends.","qs":[{"q":"What do some people think?","o":["Teenagers in the countryside have no stress.","All teens love the countryside.","Village life is very hard.","Teens don't need friends."],"a":0},{"q":"What does Lan do before school?","o":["She feeds the pigs.","She helps her mother in the field.","She cooks breakfast.","She goes fishing."],"a":1},{"q":"How does Lan get to school?","o":["By bus","By bike","She walks three kilometres.","By motorbike"],"a":2},{"q":"What helps Lan feel better?","o":["Her friends and the quiet life","More homework","Watching TV","Taking medicine"],"a":0},{"q":"What does Lan do at weekends?","o":["She studies all day.","She cycles along the river with friends.","She visits the city.","She works in the field."],"a":1}]},"rw":[["He likes collecting stamps. (fond)","He is …","He is fond of collecting stamps."],["Hoa hates getting up early. (keen)","Hoa isn't …","Hoa isn't keen on getting up early."],["Life in the city is more stressful than life in the village. (as)","Life in the village isn't …","Life in the village isn't as stressful as life in the city."],["Nam didn't revise. He failed the test. (so)","…","Nam didn't revise, so he failed the test."]],"sb":[["Teenagers / adore / hang out / friends / weekends.","Teenagers adore hanging out with friends at weekends."],["We / should not / stay up / late / because / it / be / bad / health.","We should not stay up late because it is bad for our health."],["Farmers / work / hard / than / office workers.","Farmers work harder than office workers."],["I / like / fly kites / countryside / but / I / not / keen / ride buffaloes.","I like flying kites in the countryside, but I'm not keen on riding buffaloes."]]}];
const E=[{"id":"u2gs","title":"Unit 2 – Getting Started","sub":"Mai's summer holiday in the village","vocab":"tanned • harvest • combine harvester • herd • paddy field • traditional games • slower • healthier","lines":[["Nick","Hi, Mai! You look so tanned. Where have you been?"],["Mai","I've just come back from a wonderful summer holiday. I stayed at my uncle's house in a small village in Bac Ninh Province."],["Nick","Sounds great! What did you do there?"],["Mai","I helped my uncle's family with the rice harvest. The farmers there use a combine harvester, so it was quicker than I expected."],["Mai","I also herded buffaloes and cows with the village children, flew kites in the paddy fields, and played traditional games in the evenings."],["Nick","I'm so jealous!"],["Mai","Life there is slower than in the city, but people seem much healthier."]],"tf":[["Mai has just come back from a winter trip.",false],["Mai stayed at her uncle's house.",true],["The village is in Bac Giang Province.",false],["The farmers harvest rice with a combine harvester.",true],["Mai played traditional games in the evenings.",true]],"tfWhy":["It was a summer holiday.","“I stayed at my uncle's house…”","The village is in Bac Ninh Province.","“The farmers there use a combine harvester.”","“…played traditional games in the evenings.”"],"fill":[["Nick says Mai looks very ____.",["tanned"]],["Mai helped with the rice ____.",["harvest"]],["She herded buffaloes and ____ with the village children.",["cows"]],["She flew ____ in the paddy fields.",["kites"]],["Life in the village is ____ than in the city, but people are healthier.",["slower"]]],"vv":[["tanned","rám nắng"],["harvest","thu hoạch / vụ gặt"],["combine harvester","máy gặt đập liên hợp"],["herd","chăn dắt"],["paddy field","cánh đồng lúa"],["traditional games","trò chơi dân gian"],["slower","chậm hơn"],["healthier","khỏe mạnh hơn"]],"vi":["Chào Mai! Trông bạn rám nắng quá. Bạn đã đi đâu vậy?","Mình vừa trở về sau một kì nghỉ hè tuyệt vời. Mình ở nhà chú mình trong một ngôi làng nhỏ ở tỉnh Bắc Ninh.","Nghe tuyệt quá! Bạn đã làm gì ở đó?","Mình giúp gia đình chú gặt lúa. Nông dân ở đó dùng máy gặt đập liên hợp nên nhanh hơn mình tưởng.","Mình cũng chăn trâu bò cùng bọn trẻ trong làng, thả diều trên cánh đồng lúa và chơi các trò chơi dân gian vào buổi tối.","Mình ghen tị quá!","Cuộc sống ở đó chậm hơn ở thành phố, nhưng mọi người có vẻ khỏe mạnh hơn nhiều."],"tfVi":["Mai vừa trở về sau một chuyến đi mùa đông.","Mai đã ở nhà chú của bạn ấy.","Ngôi làng ở tỉnh Bắc Giang.","Nông dân gặt lúa bằng máy gặt đập liên hợp.","Mai chơi các trò chơi dân gian vào buổi tối."],"fillVi":["Nick nói Mai trông rất ____.","Mai đã giúp gặt (thu hoạch) ____.","Bạn ấy chăn trâu và ____ cùng bọn trẻ trong làng.","Bạn ấy thả ____ trên cánh đồng lúa.","Cuộc sống ở làng ____ hơn ở thành phố, nhưng mọi người khỏe mạnh hơn."],"mcq":[{"q":"Where did Mai stay during her holiday?","vi":"Mai đã ở đâu trong kì nghỉ?","o":["At her grandparents' house","At her uncle's house","At a hotel","At Nick's house"],"ov":["Nhà ông bà","Nhà chú","Khách sạn","Nhà Nick"],"a":1,"why":"“I stayed at my uncle's house…”"},{"q":"Which province is the village in?","vi":"Ngôi làng thuộc tỉnh nào?","o":["Bac Giang","Bac Kan","Bac Ninh","Ninh Binh"],"ov":["Bắc Giang","Bắc Kạn","Bắc Ninh","Ninh Bình"],"a":2,"why":"“…a small village in Bac Ninh Province.”"},{"q":"How do the farmers there harvest rice?","vi":"Nông dân ở đó thu hoạch lúa bằng cách nào?","o":["By hand","With buffaloes","With a combine harvester","With an ox-drawn cart"],"ov":["Bằng tay","Bằng trâu","Bằng máy gặt đập liên hợp","Bằng xe bò kéo"],"a":2,"why":"“The farmers there use a combine harvester.”"},{"q":"Which activity did Mai NOT do in the village?","vi":"Mai KHÔNG làm hoạt động nào ở làng?","o":["Herd buffaloes and cows","Fly kites","Play traditional games","Go swimming in the sea"],"ov":["Chăn trâu bò","Thả diều","Chơi trò chơi dân gian","Đi bơi ở biển"],"a":3,"why":"Bài không nhắc đến việc đi bơi ở biển."},{"q":"What does Mai say about life in the village?","vi":"Mai nói gì về cuộc sống ở làng?","o":["It is faster than in the city.","It is slower, but people are healthier.","It is boring and unhealthy.","It is more expensive than in the city."],"ov":["Nhanh hơn ở thành phố.","Chậm hơn nhưng mọi người khỏe mạnh hơn.","Nhàm chán và không tốt cho sức khỏe.","Đắt đỏ hơn ở thành phố."],"a":1,"why":"“Life there is slower… but people seem much healthier.”"}]},{"id":"u2s2","title":"Unit 2 – Skills 2","sub":"Three speakers talk about rural life","vocab":"sense of community • supportive • entertainment • public transport • outdoor activities • peaceful • simple","lines":[["Speaker 1","I love living in my village because there is a strong sense of community. Neighbours are always welcome in each other's homes, and people are very supportive. When someone is in trouble, everyone helps and shares what they have."],["Speaker 2","Honestly, I don't like life in the countryside. There are few good schools and colleges, and there is hardly any entertainment for young people. Public transport is also poor. I think we should improve the lives of people here."],["Speaker 3","I'd love to live in the countryside. There is so much space, and you can do many outdoor activities that are difficult to do in the city. Life here is peaceful and simple."]],"tf":[["Speaker 1 says there is a strong sense of community in the village.",true],["Speaker 1 says neighbours are not welcome in each other's homes.",false],["Speaker 2 likes life in the countryside.",false],["Speaker 2 complains about public transport.",true],["Speaker 3 thinks the countryside is noisy and busy.",false]],"tfWhy":["“…a strong sense of community.”","Neighbours are always welcome.","Speaker 2: “I don't like life in the countryside.”","“Public transport is also poor.”","She says it is peaceful and simple."],"fill":[["Speaker 1: There is a strong sense of ____ in my village.",["community"]],["Speaker 1: People in the village are very ____.",["supportive"]],["Speaker 2: There are few good schools and ____.",["colleges"]],["Speaker 3: You can do many ____ activities that are hard to do in the city.",["outdoor"]],["Speaker 3: Life in the countryside is peaceful and ____.",["simple"]]],"vv":[["sense of community","tinh thần cộng đồng"],["supportive","hay giúp đỡ"],["entertainment","giải trí"],["public transport","giao thông công cộng"],["outdoor activities","hoạt động ngoài trời"],["peaceful","yên bình"],["simple","giản dị"]],"vi":["Tôi yêu cuộc sống ở làng vì ở đây có tinh thần cộng đồng rất mạnh. Hàng xóm luôn được chào đón ở nhà nhau và mọi người rất hay giúp đỡ nhau. Khi ai đó gặp khó khăn, mọi người cùng giúp và chia sẻ những gì mình có.","Thành thật mà nói, tôi không thích cuộc sống ở nông thôn. Ở đây có ít trường học và trường cao đẳng tốt, hầu như không có hoạt động giải trí cho giới trẻ. Giao thông công cộng cũng kém. Tôi nghĩ chúng ta nên cải thiện cuộc sống của người dân ở đây.","Tôi rất muốn sống ở nông thôn. Ở đây có rất nhiều không gian và bạn có thể làm nhiều hoạt động ngoài trời mà khó làm ở thành phố. Cuộc sống ở đây yên bình và giản dị."],"tfVi":["Người nói 1 nói rằng ở làng có tinh thần cộng đồng mạnh mẽ.","Người nói 1 nói rằng hàng xóm không được chào đón ở nhà nhau.","Người nói 2 thích cuộc sống ở nông thôn.","Người nói 2 phàn nàn về giao thông công cộng.","Người nói 3 nghĩ nông thôn ồn ào và đông đúc."],"fillVi":["Người nói 1: Làng tôi có tinh thần ____ rất mạnh.","Người nói 1: Mọi người trong làng rất ____ (hay giúp đỡ).","Người nói 2: Có ít trường học tốt và ____.","Người nói 3: Bạn có thể làm nhiều hoạt động ____ khó làm ở thành phố.","Người nói 3: Cuộc sống ở nông thôn yên bình và ____."],"mcq":[{"q":"How many people are speaking?","vi":"Có bao nhiêu người đang nói?","o":["One","Two","Three","Four"],"ov":["Một","Hai","Ba","Bốn"],"a":2,"why":"Speaker 1, 2 và 3."},{"q":"What does Speaker 1 like about village life?","vi":"Người nói 1 thích điều gì ở cuộc sống làng quê?","o":["Modern shops","A strong sense of community","Many good schools","Good public transport"],"ov":["Cửa hàng hiện đại","Tinh thần cộng đồng mạnh","Nhiều trường học tốt","Giao thông công cộng tốt"],"a":1,"why":"“…a strong sense of community.”"},{"q":"Why does Speaker 2 dislike the countryside?","vi":"Vì sao người nói 2 không thích nông thôn?","o":["It is too noisy.","It is too crowded.","There are few good schools and little entertainment.","Life is too expensive."],"ov":["Quá ồn ào.","Quá đông đúc.","Có ít trường học tốt và ít giải trí.","Cuộc sống quá đắt đỏ."],"a":2,"why":"“There are few good schools and colleges, and hardly any entertainment.”"},{"q":"What does Speaker 2 think people should do?","vi":"Người nói 2 nghĩ mọi người nên làm gì?","o":["Move to the city","Improve the lives of people in the countryside","Build more factories","Close old schools"],"ov":["Chuyển lên thành phố","Cải thiện cuộc sống của người dân nông thôn","Xây thêm nhà máy","Đóng cửa các trường cũ"],"a":1,"why":"“We should improve the lives of people here.”"},{"q":"According to Speaker 3, life in the countryside is peaceful and ______.","vi":"Theo người nói 3, cuộc sống ở nông thôn yên bình và ______.","o":["busy","simple","dangerous","modern"],"ov":["bận rộn","giản dị","nguy hiểm","hiện đại"],"a":1,"why":"“Life here is peaceful and simple.”"}]},{"id":"u3gs","title":"Unit 3 – Getting Started","sub":"Back to class: forum, clubs and pressure","vocab":"forum • midterm test • stressful • pressure • easy to use • arts and crafts club • music club","lines":[["Teacher","Welcome back, class. What's new?"],["Minh","Our class forum is now on Facebook, and we are preparing for the midterm tests. I find them stressful."],["Teacher","Try to stay calm and keep working hard. Do you feel any other pressure?"],["Minh","Yes. I feel pressure from my parents and from my friends."],["Ann","We chose Facebook because it's easy to use. We also have new clubs, like an arts and crafts club and a music club, with activities for different interests."],["Teacher","I hope everyone can join the clubs they like."]],"tf":[["The students have already finished their midterm tests.",false],["Minh finds the midterm tests stressful.",true],["The class forum is now on Facebook.",true],["Ann says they chose Facebook because it is difficult to use.",false],["The new clubs include an arts and crafts club and a music club.",true]],"tfWhy":["They are preparing for them.","“I find them stressful.”","“Our class forum is now on Facebook.”","It is easy to use.","Ann lists both clubs."],"fill":[["The class forum is now on ____.",["facebook"]],["Minh feels pressure from his parents and from his ____.",["friends"]],["Ann says Facebook is easy to ____.",["use"]],["The new clubs are an arts and ____ club and a music club.",["crafts"]],["The teacher hopes everyone can ____ the clubs they like.",["join"]]],"vv":[["forum","diễn đàn"],["midterm test","bài kiểm tra giữa kì"],["stressful","gây căng thẳng"],["pressure","áp lực"],["easy to use","dễ sử dụng"],["arts and crafts club","câu lạc bộ thủ công mỹ nghệ"],["music club","câu lạc bộ âm nhạc"]],"vi":["Chào mừng các em trở lại lớp. Có gì mới không nào?","Diễn đàn của lớp em giờ đã chuyển lên Facebook, và chúng em đang chuẩn bị cho các bài kiểm tra giữa kì. Em thấy chúng rất căng thẳng.","Hãy cố giữ bình tĩnh và tiếp tục học chăm chỉ nhé. Em có cảm thấy áp lực nào khác không?","Có ạ. Em cảm thấy áp lực từ bố mẹ và từ bạn bè.","Chúng em chọn Facebook vì nó dễ sử dụng. Chúng em cũng có các câu lạc bộ mới, như câu lạc bộ thủ công mỹ nghệ và câu lạc bộ âm nhạc, với các hoạt động cho nhiều sở thích khác nhau.","Cô hi vọng mọi người có thể tham gia các câu lạc bộ mình thích."],"tfVi":["Các học sinh đã làm xong bài kiểm tra giữa kì.","Minh thấy các bài kiểm tra giữa kì gây căng thẳng.","Diễn đàn của lớp giờ ở trên Facebook.","Ann nói họ chọn Facebook vì nó khó sử dụng.","Các câu lạc bộ mới gồm câu lạc bộ thủ công mỹ nghệ và câu lạc bộ âm nhạc."],"fillVi":["Diễn đàn của lớp giờ ở trên ____.","Minh cảm thấy áp lực từ bố mẹ và từ ____.","Ann nói Facebook dễ ____.","Các câu lạc bộ mới là câu lạc bộ thủ công mỹ nghệ (arts and ____) và âm nhạc.","Giáo viên hi vọng mọi người có thể ____ các câu lạc bộ mình thích."],"mcq":[{"q":"Where is the class forum now?","vi":"Hiện giờ diễn đàn của lớp ở đâu?","o":["On the school website","On Zalo","On Facebook","By email"],"ov":["Trên website trường","Trên Zalo","Trên Facebook","Qua email"],"a":2,"why":"“Our class forum is now on Facebook.”"},{"q":"What are the students preparing for?","vi":"Các học sinh đang chuẩn bị cho điều gì?","o":["A school trip","Midterm tests","A music show","The summer holiday"],"ov":["Chuyến đi của trường","Các bài kiểm tra giữa kì","Buổi biểu diễn âm nhạc","Kì nghỉ hè"],"a":1,"why":"“…we are preparing for the midterm tests.”"},{"q":"Besides his parents, who else puts pressure on Minh?","vi":"Ngoài bố mẹ, ai khác tạo áp lực cho Minh?","o":["His teachers","His friends","His neighbours","His brother"],"ov":["Thầy cô","Bạn bè","Hàng xóm","Anh trai"],"a":1,"why":"“…pressure from my parents and from my friends.”"},{"q":"Why did the class choose Facebook?","vi":"Vì sao lớp chọn Facebook?","o":["It has no advertisements.","It is easy to use.","The teacher asked them to.","It is cheaper than other websites."],"ov":["Không có quảng cáo.","Nó dễ sử dụng.","Giáo viên yêu cầu.","Rẻ hơn các trang khác."],"a":1,"why":"“…because it's easy to use.”"},{"q":"What does the teacher hope?","vi":"Giáo viên hi vọng điều gì?","o":["Everyone gets high marks.","Everyone can join the clubs they like.","Everyone stops using Facebook.","There are no more tests."],"ov":["Mọi người đạt điểm cao.","Mọi người có thể tham gia câu lạc bộ mình thích.","Mọi người ngừng dùng Facebook.","Không còn bài kiểm tra nào nữa."],"a":1,"why":"“I hope everyone can join the clubs they like.”"}]},{"id":"u3s2","title":"Unit 3 – Skills 2","sub":"Mi, Minh and Ann talk about stress","vocab":"expectations • interests • abilities • focus on • fit • jealous • argument","lines":[["Mi","Our teacher invited us to talk about stress on the class forum. What stress do you have?"],["Minh","My parents expect too much from me. They send me to a lot of classes that I don't want to attend."],["Ann","Why don't you talk to them about your interests and abilities? I did, and now they don't send me to classes I dislike. These days I focus on my health and try to lose weight."],["Minh","But you look fit, Ann. You should feel good about your body."],["Mi","My problem is my sister. She is jealous of everything I have, and she often starts arguments. So I talked to my mum."]],"tf":[["Three students are talking in the conversation.",true],["They are discussing the rules of the class forum.",false],["Minh's parents send him to classes he doesn't want to attend.",true],["Ann's parents still send her to classes she dislikes.",false],["Mi talked to her mum about her sister.",true]],"tfWhy":["Mi, Minh and Ann.","They are discussing their stress.","“…classes that I don't want to attend.”","They no longer send her.","“So I talked to my mum.”"],"fill":[["Minh's parents send him to a lot of ____.",["classes"]],["Ann tells Minh to talk about his interests and ____.",["abilities"]],["Ann now focuses on her ____.",["health"]],["Minh says Ann should feel ____ about her body.",["good"]],["Mi's sister is ____ of everything she has.",["jealous"]]],"vv":[["expect","kì vọng"],["interests","sở thích"],["abilities","khả năng"],["focus on","tập trung vào"],["fit","cân đối, khỏe mạnh"],["jealous (of)","ghen tị (với)"],["argument","cuộc tranh cãi"]],"vi":["Cô giáo mời chúng ta thảo luận về căng thẳng (stress) trên diễn đàn của lớp. Các bạn đang gặp căng thẳng gì?","Bố mẹ mình kì vọng quá nhiều ở mình. Họ cho mình đi học rất nhiều lớp mà mình không muốn học.","Sao bạn không nói với họ về sở thích và khả năng của mình? Mình đã làm vậy và giờ họ không cho mình học những lớp mình không thích nữa. Dạo này mình tập trung vào sức khỏe và cố gắng giảm cân.","Nhưng trông bạn cân đối mà, Ann. Bạn nên cảm thấy hài lòng về cơ thể mình.","Vấn đề của mình là chị/em gái. Cô ấy ghen tị với mọi thứ mình có và hay gây gổ. Vì vậy mình đã nói chuyện với mẹ."],"tfVi":["Có ba học sinh đang nói chuyện trong đoạn hội thoại.","Họ đang thảo luận về các quy định của diễn đàn lớp.","Bố mẹ Minh cho cậu ấy đi học những lớp cậu ấy không muốn học.","Bố mẹ Ann vẫn cho bạn ấy đi học những lớp bạn ấy không thích.","Mi đã nói chuyện với mẹ về chị/em gái của mình."],"fillVi":["Bố mẹ Minh cho cậu ấy đi học rất nhiều ____.","Ann bảo Minh nói về sở thích và ____ của mình.","Bây giờ Ann tập trung vào ____ của mình.","Minh nói Ann nên cảm thấy ____ về cơ thể mình.","Chị/em gái của Mi ____ (ghen tị) với mọi thứ bạn ấy có."],"mcq":[{"q":"What are the students talking about?","vi":"Các học sinh đang nói về điều gì?","o":["Their holiday","Their stress","Their favourite clubs","Their homework"],"ov":["Kì nghỉ","Sự căng thẳng của họ","Câu lạc bộ yêu thích","Bài tập về nhà"],"a":1,"why":"Mi: “…talk about stress on the class forum.”"},{"q":"Why is Minh stressed?","vi":"Vì sao Minh bị căng thẳng?","o":["His parents expect too much and send him to many classes.","He has no friends.","He has too many tests.","His sister is jealous of him."],"ov":["Bố mẹ kì vọng quá nhiều và cho cậu đi học nhiều lớp.","Cậu không có bạn.","Cậu có quá nhiều bài kiểm tra.","Chị/em gái ghen tị với cậu."],"a":0,"why":"“My parents expect too much from me.”"},{"q":"What did Ann do to solve her problem?","vi":"Ann đã làm gì để giải quyết vấn đề của mình?","o":["She changed school.","She talked to her parents about her interests and abilities.","She stopped studying.","She asked her teacher for help."],"ov":["Bạn ấy chuyển trường.","Bạn ấy nói với bố mẹ về sở thích và khả năng.","Bạn ấy ngừng học.","Bạn ấy nhờ giáo viên giúp."],"a":1,"why":"“I did, and now they don't send me to classes I dislike.”"},{"q":"What is Ann trying to do now?","vi":"Hiện giờ Ann đang cố gắng làm gì?","o":["Learn the piano","Lose weight","Gain weight","Join a music club"],"ov":["Học piano","Giảm cân","Tăng cân","Tham gia câu lạc bộ âm nhạc"],"a":1,"why":"“…I focus on my health and try to lose weight.”"},{"q":"Why does Mi have problems with her sister?","vi":"Vì sao Mi có vấn đề với chị/em gái?","o":["Her sister is jealous and often starts arguments.","Her sister is lazy.","Her sister lives far away.","Her sister never talks to her."],"ov":["Chị/em gái ghen tị và hay gây gổ.","Chị/em gái lười biếng.","Chị/em gái sống ở xa.","Chị/em gái không bao giờ nói chuyện với bạn ấy."],"a":0,"why":"“She is jealous of everything I have, and she often starts arguments.”"}]},{"title":"Unit 2 & 3 – Review","lines":[["Hoa","Hi, Nam. How was your weekend?"],["Nam","It was great. I went to my grandparents' village in Thai Binh. I fed the ducks, flew a kite, and helped my grandpa dry the rice."],["Hoa","That sounds relaxing. I stayed at home all weekend to study for the English test on Monday, and I feel very stressed."],["Nam","You should take a short break every hour. Why don't you go cycling with me this afternoon?"],["Hoa","Good idea. And I'll talk to my parents, too. They want me to join three extra classes, and it's too much."],["Nam","I hope they will listen. Let's meet at the lake at four o'clock."]],"tf":[["Nam spent the weekend in Thai Binh.",true],["Nam helped his grandpa dry the rice.",true],["Hoa has a maths test on Monday.",false],["Nam suggests Hoa study all afternoon.",false],["Hoa's parents want her to join three extra classes.",true]],"fill":[["Nam fed the ____ in the village.",["ducks"]],["Nam flew a ____.",["kite"]],["Nam says Hoa should take a short break every ____.",["hour"]],["Nam and Hoa will go ____ this afternoon.",["cycling"]],["They will meet at the lake at ____ o'clock.",["four","4"]]],"vv":[["duck","con vịt"],["dry the rice","phơi lúa"],["relaxing","thư giãn"],["cycling","đạp xe"],["extra class","lớp học thêm"]]}];
const X=[{"items":[["Mai vừa trở về sau một chuyến đi mùa đông.","SAI – Mai nói mình vừa có kì nghỉ HÈ (summer holiday)."],["Mai đã ở nhà chú của mình.","ĐÚNG – “I stayed at my uncle's house”."],["Ngôi làng thuộc tỉnh Bắc Giang.","SAI – Làng ở tỉnh Bắc Ninh (Bac Ninh Province)."],["Nông dân gặt lúa bằng máy gặt đập liên hợp.","ĐÚNG – “use a combine harvester”."],["Mai chơi trò chơi dân gian vào buổi tối.","ĐÚNG – “played traditional games in the evenings”."],["Nick nói Mai trông rất rám nắng.","tanned = rám nắng."],["Mai giúp gặt (thu hoạch) lúa.","harvest = vụ gặt, thu hoạch."],["Mai chăn trâu và bò cùng bọn trẻ trong làng.","cows = bò (herded buffaloes and cows)."],["Mai thả diều trên cánh đồng lúa.","kites = diều (fly kites = thả diều)."],["Cuộc sống ở làng chậm hơn ở thành phố, nhưng mọi người khỏe mạnh hơn.","slower = chậm hơn (so sánh hơn của slow)."],["","food /fuːd/ có âm /uː/; book /bʊk/, good /ɡʊd/, stood /stʊd/ có âm /ʊ/ → C."],["","snow /snəʊ/ có âm /əʊ/; cow, how, now có âm /aʊ/ → C."],["Em gái tôi rất mê sưu tầm búp bê.","keen on + V-ing = say mê, thích (giới từ ON)."],["Nam thích giúp ông bà làm việc đồng áng.","enjoy + V-ing → helping."],["Nhìn kìa! Những người nông dân đang gặt lúa ngoài đồng.","Có “Look!” và “now” → thì hiện tại tiếp diễn: are harvesting."],["Trang trại có một cánh đồng rộng mênh mông để chúng tôi thả diều.","vast = rộng lớn; narrow = hẹp; tiny = nhỏ xíu; crowded = đông đúc."],["Linh hát hay hơn chị gái.","Trạng từ dài beautifully → so sánh hơn: more beautifully than."],["Cuộc sống ở thành phố căng thẳng hơn cuộc sống ở nông thôn.","Tính từ dài: more + adj + than."],["Chú tôi bận nên thường không có thời gian chơi với chúng tôi.","Quan hệ nguyên nhân – kết quả: so (nên). “however” cần dấu chấm/phẩy đi kèm."],["“Bạn có muốn đi câu cá với mình không?” – “Có, mình rất muốn.”","Đáp lời mời: Yes, I'd love to."],["Anh trai tôi ghét dậy sớm.","detest + V-ing → getting."],["Hoa làm việc chăm chỉ hơn các bạn cùng lớp.","hard (trạng từ ngắn) → harder than."],["Cô ấy rất thích nấu ăn cùng mẹ.","adore + V-ing → cooking."],["Cô ấy ghét dùng điện thoại trong lớp.","Sai ở B: hate + V-ing → using."],["Cuộc sống ở thành phố bận rộn hơn ở làng.","Sai ở C: busy → busier (tính từ ngắn tận cùng -y đổi y→ier)."],["","Chủ ngữ she, thì hiện tại đơn, nối bằng and → feeds."],["","by bike = bằng xe đạp."],["","be fond of = thích."],["","She → does her homework (làm bài tập)."],["","because = vì (chỉ lí do)."],["Trang trại ở đâu?","B – câu đầu: “a farm in Thai Nguyen”."],["Điều nào KHÔNG có ở trang trại?","D – bài chỉ nhắc vườn rau, ao, cánh đồng chè; không có hồ bơi."],["Buổi sáng Nam làm gì?","C – giúp ông cho bò ăn và nhặt trứng."],["Vì sao đôi khi Nam thấy chán?","B – gần đó không có rạp phim hay trung tâm mua sắm."],["“vast” gần nghĩa nhất với…","B – very large = rất rộng lớn."],["Anh ấy thích lướt Internet. → Anh ấy mê lướt Internet.","like/love + V-ing = be fond of + V-ing."],["Anh trai tôi ghét đi câu cá. → Anh trai tôi không thích đi câu cá.","hate = be not keen on + V-ing."],["Cuộc sống ở nông thôn không bận rộn bằng ở thành phố. → Thành phố bận rộn hơn nông thôn.","not as + adj + as ↔ adj-er + than."],["Trời mưa to. Chúng tôi không đi cắm trại. → Trời mưa to nên chúng tôi không đi cắm trại.","so = nên (chỉ kết quả); trước so có dấu phẩy."],["Em họ tôi cực kì thích chơi trò chơi máy tính.","be crazy about + V-ing."],["Tôi không thích đi cắm trại vì nó nguy hiểm.","not keen on + V-ing; because + mệnh đề."],["Bây giờ những người nông dân đang gặt lúa.","“now” → hiện tại tiếp diễn: are harvesting."],["Mai chạy nhanh hơn chị gái.","fast (trạng từ ngắn) → faster than; chủ ngữ Mai → runs."]],"clozeTr":"Hoa sống ở một ngôi làng nhỏ gần Huế. Mỗi sáng, cô dậy sớm và cho gà ăn. Sau bữa sáng, cô đi học bằng xe đạp. Buổi chiều, cô giúp bố mẹ ngoài đồng. Cô thích trồng rau. Buổi tối, cô làm bài tập và đọc sách. Cô yêu ngôi làng vì nơi đó yên bình và mọi người thân thiện.","pasTr":"Ông bà của Nam có một trang trại ở Thái Nguyên. Trang trại khá lớn, có vườn rau, một cái ao nhỏ và cánh đồng chè rộng mênh mông. Nam đến thăm ông bà mỗi mùa hè. Buổi sáng, cậu giúp ông cho bò ăn và nhặt trứng. Buổi chiều, cậu thường câu cá ở ao hoặc đạp xe quanh làng. Ban đêm trên trời có rất nhiều sao, nhưng gần đó không có rạp chiếu phim hay trung tâm mua sắm nên Nam đôi khi thấy chán. Tuy vậy, cậu vẫn yêu trang trại vì không khí trong lành và mọi người rất thân thiện."},{"items":[["Người nói 1 nói rằng làng có tinh thần cộng đồng mạnh.","ĐÚNG – “a strong sense of community”."],["Người nói 1 nói hàng xóm không được chào đón ở nhà nhau.","SAI – “Neighbours are always welcome”."],["Người nói 2 thích cuộc sống nông thôn.","SAI – Người nói 2: “I don't like life in the countryside”."],["Người nói 2 phàn nàn về giao thông công cộng.","ĐÚNG – “Public transport is also poor”."],["Người nói 3 nghĩ nông thôn ồn ào, đông đúc.","SAI – Người nói 3: yên bình và giản dị (peaceful and simple)."],["Người nói 1: Làng tôi có tinh thần cộng đồng rất mạnh.","community = cộng đồng."],["Người nói 1: Mọi người trong làng rất hay giúp đỡ nhau.","supportive = hay giúp đỡ."],["Người nói 2: Có ít trường học và trường cao đẳng tốt.","colleges = trường cao đẳng."],["Người nói 3: Bạn có thể làm nhiều hoạt động ngoài trời mà khó làm ở thành phố.","outdoor = ngoài trời."],["Người nói 3: Cuộc sống ở nông thôn yên bình và giản dị.","simple = giản dị, đơn giản."],["","bus /bʌs/ có âm /ʌ/; bush, push, pull có âm /ʊ/ → C."],["","cat /kæt/ có âm /æ/; harvest, farmer, garden có âm /ɑː/ → D."],["Ông tôi thích kể chuyện về ngôi làng.","be fond of + V-ing."],["Cô ấy thích chụp ảnh vùng quê.","enjoy + V-ing → taking."],["Nhìn kìa! Bọn trẻ đang thả diều trên cánh đồng.","“Look!” → hiện tại tiếp diễn; chủ ngữ số nhiều → are flying."],["Bạn phải lái xe cẩn thận trong làng, nếu không có thể đâm vào trâu.","Cần trạng từ bổ nghĩa cho động từ drive → carefully."],["___ là nơi ta có thể mua rau củ quả tươi.","market = chợ; forum = diễn đàn; pond = ao; cart = xe kéo."],["Không khí ở nông thôn sạch hơn ở thành phố.","clean (tính từ ngắn) → cleaner than."],["Làng quê yên tĩnh; tuy nhiên, một số bạn trẻ thấy chán ở đó.","however = tuy nhiên (chỉ sự đối lập)."],["“Bạn có muốn đến thăm làng mình cuối tuần này không?” – “Có, mình rất muốn.”","Đáp lời mời: Yes, I'd love to."],["Minh không thích ở nhà vào những ngày nắng.","dislike + V-ing → staying."],["Tâm chạy nhanh hơn Hùng.","quick → quicker; hoặc trạng từ more quickly."],["Họ thích ngắm hoàng hôn.","be fond of + V-ing → watching."],["Chú tôi rất mê sưu tầm tem.","Sai ở B: be crazy ABOUT, không dùng of."],["Nam không học chăm nên đã trượt kì thi.","Sai ở C: quan hệ nguyên nhân – kết quả → so (không dùng but)."],["","peaceful là tính từ dài → more peaceful than."],["","hospitable = hiếu khách (hospital = bệnh viện)."],["","at harvest time = vào mùa gặt."],["","but = nhưng (ý đối lập)."],["","because = vì (lí do về quê)."],["Trước đây ông Tuấn làm việc ở đâu?","B – trong một văn phòng ở Hà Nội."],["Vì sao lúc đầu cuộc sống khó khăn?","B – ông không biết gì về nghề nông."],["Ông Tuấn trồng gì?","C – cây cam (orange trees)."],["So với cuộc sống thành phố, bây giờ ông…","B – kiếm ít tiền hơn nhưng hạnh phúc hơn."],["Lúc rảnh ông làm gì?","B – chơi cờ với hàng xóm."],["Chị tôi thích chơi piano. → Chị tôi mê chơi piano.","like + V-ing = be fond of + V-ing."],["Cô Lan không thích nấu ăn. → Cô Lan không mê nấu ăn.","dislike = be not keen on + V-ing."],["Thành phố ồn hơn làng quê. → Làng quê không ồn bằng thành phố.","adj-er than ↔ not as + adj + as (đảo chủ ngữ)."],["Làng yên bình. Nó xa thành phố. → Làng yên bình nhưng xa thành phố.","but nối hai ý đối lập."],["Trẻ em thích thả diều vào những buổi tối mùa hè.","love + V-ing; on summer evenings."],["Nông dân dậy sớm hơn công nhân thành phố.","early → earlier than."],["Chúng tôi không thích xem TV vì nó nhàm chán.","not keen on + V-ing; because it is boring."],["Họ nên giúp đỡ hàng xóm khi cần.","should + V nguyên mẫu; when they need help."]],"clozeTr":"Cuộc sống ở nông thôn yên bình hơn cuộc sống ở thành phố. Người dân ở đó thân thiện và hiếu khách. Hàng xóm thường giúp đỡ nhau vào mùa gặt. Trẻ em có thể chơi ngoài trời, nhưng chúng không có nhiều đồ chơi hiện đại. Nhiều người thành phố về quê vào cuối tuần vì họ muốn tận hưởng không khí trong lành.","pasTr":"Ông Tuấn từng làm việc trong một văn phòng ở Hà Nội. Hai năm trước, ông chuyển đến một ngôi làng nhỏ ở Quảng Bình để trồng cây ăn quả. Lúc đầu cuộc sống khó khăn vì ông không biết gì về nghề nông, nhưng hàng xóm đã chỉ ông cách trồng và tưới cây. Bây giờ ông có một vườn cam lớn và bán cam ở chợ địa phương. Ông dậy lúc 5 giờ sáng và thấy khỏe hơn trước. Dù kiếm được ít tiền hơn ở thành phố, ông hạnh phúc hơn. Lúc rảnh, ông chơi cờ với hàng xóm."},{"items":[["Các học sinh đã làm xong bài kiểm tra giữa kì.","SAI – Các em đang CHUẨN BỊ (preparing for) bài kiểm tra."],["Minh thấy bài kiểm tra giữa kì gây căng thẳng.","ĐÚNG – “I find them stressful”."],["Diễn đàn lớp giờ ở trên Facebook.","ĐÚNG – “Our class forum is now on Facebook”."],["Ann nói họ chọn Facebook vì nó khó dùng.","SAI – Vì nó DỄ sử dụng (easy to use)."],["Các câu lạc bộ mới gồm thủ công mỹ nghệ và âm nhạc.","ĐÚNG – Ann nhắc cả hai câu lạc bộ."],["Diễn đàn của lớp giờ ở trên Facebook.","Facebook."],["Minh cảm thấy áp lực từ bố mẹ và từ bạn bè.","friends = bạn bè."],["Ann nói Facebook dễ sử dụng.","easy to use = dễ sử dụng."],["Các câu lạc bộ mới: thủ công mỹ nghệ và âm nhạc.","arts and crafts club = câu lạc bộ thủ công mỹ nghệ."],["Giáo viên hi vọng mọi người có thể tham gia các câu lạc bộ mình thích.","join = tham gia."],["","sound /saʊnd/ có âm /s/; sugar, sure, sheep có âm /ʃ/ → D."],["","played /pleɪd/: -ed đọc /d/; needed, wanted, visited: -ed đọc /ɪd/ (sau âm t, d) → B."],["Nam mệt nên đi ngủ sớm.","Kết quả: so (nên)."],["Minh mệt mỏi vì học cả ngày.","be tired of + V-ing = chán/mệt vì."],["Tôi không thích đăng ảnh lên mạng.","be keen on + V-ing."],["Anh tôi ghét đi bộ dưới mưa.","hate + V-ing → walking."],["Nếu cảm thấy căng thẳng, bạn nên nói chuyện với bạn bè.","should + V nguyên mẫu → talk."],["Nhiều bạn trẻ thấy căng thẳng vì bố mẹ kì vọng quá nhiều.","because = vì (chỉ lí do)."],["Hoa làm bài tập nhanh hơn tôi.","Hiện tại đơn, chủ ngữ Hoa → does."],["Tôi không biết cách đối phó với căng thẳng.","deal with = đối phó, giải quyết."],["Lan rất thích nghe nhạc sau giờ học.","adore + V-ing → listening."],["Ann học chăm chỉ hơn chị gái.","hard → harder than."],["Thanh thiếu niên thích đi chơi với bạn bè.","fancy + V-ing → hanging out."],["Bố mẹ tôi kì vọng tôi đạt điểm cao.","Sai ở A: chủ ngữ my parents (số nhiều) → expect."],["Cô ấy làm việc cẩn thận hơn các bạn cùng lớp.","Sai ở B: cần trạng từ → more carefully."],["","feel + tính từ: stressed = bị căng thẳng."],["","They (số nhiều) + động từ nguyên mẫu → feel."],["","should do …, get …: should + V nguyên mẫu → get."],["","So sánh hơn của good là better."],["","better … than = tốt hơn … là."],["Vì sao Linh chịu áp lực?","B – bố mẹ muốn em là học sinh giỏi nhất lớp."],["Tuần trước chuyện gì xảy ra?","B – em bị đau đầu và không tập trung được."],["Ai nhận ra vấn đề của Linh?","C – cô giáo (her teacher)."],["Bây giờ thứ Bảy Linh làm gì?","B – chơi cầu lông."],["Bây giờ em cảm thấy thế nào?","B – tốt hơn nhiều so với trước."],["Nam thích đi chơi với bạn bè. → Nam rất thích đi chơi với bạn bè.","love + V-ing = enjoy + V-ing."],["Tom ghét chơi cờ bàn. → Tom không mê chơi cờ bàn.","hate = be not keen on + V-ing."],["Căng thẳng làm thanh thiếu niên mệt mỏi. Nó cũng gây đau đầu. → Căng thẳng làm các bạn mệt và đau đầu.","Dùng and nối hai vế có cùng chủ ngữ."],["Lan chạy nhanh hơn Mai. → Mai không chạy nhanh bằng Lan.","S1 + adj-er than S2 ↔ S2 + not as + adv + as + S1."],["Thanh thiếu niên nên nói chuyện với bố mẹ khi thấy căng thẳng.","should + V; talk to; when + mệnh đề."],["Minh cực kì mê chơi trò chơi điện tử.","be crazy about + V-ing."],["Cô ấy không giỏi toán; tuy nhiên cô ấy là thành viên câu lạc bộ toán.","be good at; however + dấu phẩy."],["Tôi ghét thức khuya vì hôm sau tôi thấy mệt.","detest + V-ing; the next day."]],"clozeTr":"Nhiều thanh thiếu niên cảm thấy căng thẳng vì có quá nhiều bài tập. Họ còn chịu áp lực từ bạn bè và bố mẹ. Để giảm căng thẳng, các bạn nên tập thể dục, ngủ đủ giấc và quản lí thời gian tốt. Nói chuyện với người mình tin tưởng thì tốt hơn là giữ nỗi lo cho riêng mình.","pasTr":"Linh là học sinh lớp 8. Hiện tại em chịu rất nhiều áp lực. Bố mẹ muốn em là học sinh giỏi nhất lớp nên tối nào em cũng đi học thêm và có rất ít thời gian thư giãn. Tuần trước, em bị đau đầu và không tập trung được trong lớp. Cô giáo nhận ra và nói chuyện với em. Bây giờ Linh có thời gian biểu gồm cả thời gian chơi cầu lông vào thứ Bảy. Em cũng kể cho bố mẹ nghe cảm xúc của mình. Em thấy tốt hơn nhiều so với trước."},{"items":[["Có ba học sinh đang nói chuyện.","ĐÚNG – Mi, Minh và Ann."],["Họ đang thảo luận quy định của diễn đàn lớp.","SAI – Họ nói về căng thẳng (stress)."],["Bố mẹ Minh cho cậu học những lớp cậu không muốn.","ĐÚNG – “classes that I don't want to attend”."],["Bố mẹ Ann vẫn cho cô học những lớp cô không thích.","SAI – Họ không còn cho Ann học các lớp đó nữa."],["Mi đã nói chuyện với mẹ về chị/em gái.","ĐÚNG – “So I talked to my mum”."],["Bố mẹ Minh cho cậu học rất nhiều lớp.","classes = lớp học."],["Ann bảo Minh nói về sở thích và khả năng của mình.","abilities = khả năng."],["Bây giờ Ann tập trung vào sức khỏe.","health = sức khỏe."],["Minh nói Ann nên cảm thấy hài lòng về cơ thể mình.","feel good about = cảm thấy hài lòng về."],["Chị/em gái của Mi ghen tị với mọi thứ bạn ấy có.","jealous = ghen tị."],["","chef /ʃef/ có âm /ʃ/; chess, change, chair có âm /tʃ/ → C."],["","young /jʌŋ/ có âm /ʌ/; house, mouth, cloud có âm /aʊ/ → C."],["Bạn nên nghỉ giải lao ngắn mỗi giờ khi học.","break = giờ nghỉ; brake = phanh; bake = nướng; beak = mỏ chim."],["Căng thẳng có thể ảnh hưởng đến sức khỏe thanh thiếu niên.","affect (động từ) = ảnh hưởng; effect là danh từ. can + V → affect."],["Em gái tôi rất mê K-pop.","be crazy about."],["Hùng không thích làm việc trước máy tính cả ngày.","dislike + V-ing → working."],["Bài kiểm tra dễ hơn chúng tôi nghĩ.","easy → easier than."],["Anh ấy ngủ không ngon nên thấy mệt.","so = nên (chỉ kết quả)."],["Tập thể dục là cách tốt để giảm căng thẳng.","a way to + V nguyên mẫu → reduce."],["“Mình lo lắng về kì thi.” – “Sao bạn không lập thời gian biểu?”","Lời khuyên: Why don't you + V?"],["Bố tôi rất thích nấu ăn cho cả nhà.","adore + V-ing → cooking."],["Mi nhảy đẹp hơn Hoa.","trạng từ dài → more beautifully than."],["Tuấn không thích đi chơi buổi tối.","be keen on + V-ing → going."],["Cô ấy ghét làm bài tập vào buổi tối.","Sai ở A: chủ ngữ she → hates."],["Anh ấy không thích bơi lội.","Sai ở C: be fond OF, không dùng for."],["","but = nhưng (ý đối lập)."],["","so (để / nên) bạn biết phải làm gì."],["","every forty-five minutes = cứ mỗi 45 phút."],["","physical activities = hoạt động thể chất (physical là tính từ)."],["","a school counsellor: counsellor bắt đầu bằng phụ âm → dùng a."],["Tom mê gì?","B – bóng đá (football)."],["Cậu chơi cho đội trường bao lâu một lần?","B – hai lần một tuần (twice a week)."],["Vì sao học kì trước Tom lo lắng?","B – quá nhiều bài kiểm tra, ít thời gian chơi bóng."],["Ai khuyên Tom lên kế hoạch?","C – huấn luyện viên (his coach)."],["Sau khi lập thời gian biểu chuyện gì xảy ra?","B – bớt căng thẳng và điểm cao hơn."],["Mẹ tôi thích nấu ăn. → Mẹ tôi mê nấu ăn.","love + V-ing = be keen on + V-ing."],["Cuộc sống ở làng không đắt bằng thành phố. → Thành phố đắt đỏ hơn làng.","not as … as ↔ more + adj + than."],["Cô ấy ngủ không ngon. Cô ấy thấy mệt. → Cô ấy ngủ không ngon nên thấy mệt.","so chỉ kết quả."],["Bạn có thích chơi cờ vua không? → Bạn có hứng thú với cờ vua không?","like + V-ing ↔ be interested in + V-ing."],["Bạn nên lập thời gian biểu để quản lí thời gian.","to + V chỉ mục đích; manage your time."],["Một số bạn trẻ thấy áp lực vì bị kì vọng đạt điểm cao.","expect → bị động: are expected to get."],["Mai không thích chạy vì nó mệt.","be fond of + V-ing; because + mệnh đề."],["Chúng tôi rất thích dành cuối tuần ở làng của ông bà.","adore + V-ing; spend weekends in …"]],"clozeTr":"Căng thẳng là một phần bình thường của cuộc sống, nhưng nó có thể có hại nếu kéo dài quá lâu. Sau đây là vài lời khuyên. Thứ nhất, hãy lập thời gian biểu để biết mỗi ngày phải làm gì. Thứ hai, nghỉ giải lao ngắn mỗi 45 phút. Thứ ba, tham gia các hoạt động thể chất như bơi lội hoặc đạp xe. Cuối cùng, nếu vẫn căng thẳng, hãy nói chuyện với cố vấn học đường.","pasTr":"Tom là một thiếu niên người Anh. Cậu rất mê bóng đá và chơi cho đội trường hai lần một tuần. Học kì trước, cậu lo lắng vì có quá nhiều bài kiểm tra và ít thời gian chơi bóng. Huấn luyện viên khuyên cậu lên kế hoạch cho tuần của mình. Tom lập thời gian biểu: học hai giờ mỗi tối và chơi bóng vào cuối tuần. Cậu cũng đi ngủ lúc 10 giờ. Bây giờ cậu bớt căng thẳng và điểm cao hơn."},{"items":[["Nam đã ở Thái Bình cả cuối tuần.","ĐÚNG – “I went to my grandparents' village in Thai Binh”."],["Nam giúp ông phơi lúa.","ĐÚNG – “helped my grandpa dry the rice”."],["Hoa có bài kiểm tra Toán vào thứ Hai.","SAI – Là bài kiểm tra TIẾNG ANH (English test)."],["Nam gợi ý Hoa học cả buổi chiều.","SAI – Nam khuyên nghỉ giải lao và đi đạp xe."],["Bố mẹ Hoa muốn cô học thêm ba lớp.","ĐÚNG – “three extra classes”."],["Nam đã cho vịt ăn ở làng.","ducks = vịt."],["Nam đã thả diều.","kite = diều."],["Nam nói Hoa nên nghỉ giải lao ngắn mỗi giờ.","every hour = mỗi giờ."],["Nam và Hoa sẽ đi đạp xe chiều nay.","cycling = đạp xe."],["Họ sẽ gặp nhau ở hồ lúc 4 giờ.","four o'clock = 4 giờ."],["","tour /tʊə/ khác với pour, course, four /ɔː/ → A."],["","bread /bred/ có âm /e/; beach, team, clean có âm /iː/ → C."],["Nhiều bạn trẻ mê chụp ảnh.","be crazy about + V-ing."],["Họ đang gặt lúa ngoài đồng vào lúc này.","at the moment → hiện tại tiếp diễn; They → are harvesting."],["Mẹ tôi giỏi nấu các m d → harder than."],["Tôi thích thả diều ở quê nhưng không thích cưỡi trâu.","like + V-ing; not keen on + V-ing."]],"clozeTr":"Mùa hè năm ngoái, tôi ở nhà ông bà ở quê. Mỗi sáng tôi dậy sớm để cho gà ăn. Sau đó tôi giúp ông chăn trâu. Buổi chiều, tôi thả diều với bọn trẻ trong làng. Đó là kì nghỉ thư giãn vì nơi đó yên tĩnh và bình yên. Tuy nhiên, tôi hơi nhớ bạn bè ở thành phố.","pasTr":"Một số người nghĩ thanh thiếu niên ở nông thôn không bị căng thẳng. Điều đó không đúng. Lan, 14 tuổi, sống ở một ngôi làng. Em dậy lúc 5 giờ sáng để giúp mẹ ngoài đồng trước giờ đi học. Em đi bộ ba cây số đến trường. Buổi tối em làm bài tập muộn. Đôi khi em thấy mệt và lo về bài kiểm tra. Tuy nhiên, em nói bạn bè và cuộc sống yên bình giúp em thấy khá hơn. Cuối tuần, em đạp xe dọc bờ sông cùng bạn."}];
const L="ABCD";

function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const s=$("#voice");if(s){const p=s.value;s.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join("");if(p)s.value=p;else{const i=voices.findIndex(v=>/en[-_]US/.test(v.lang));if(i>=0)s.value=i}}const w=$("#warn");if(w)w.style.display=voices.length?"none":"block"}

/* ---------- build question model ---------- */
const esc=x=>x;
function build(i){
 const d=D[i],e=E[i];let n=0;const S=[];
 const A={name:"A. LISTENING",pts:.2,vi:"Phần Nghe (2,0 điểm)",blocks:[]};
 A.blocks.push({ins:"Task 1. Listen and choose T (True) or F (False).",vi:"Nghe và chọn Đúng (T) hay Sai (F).",items:e.tf.map(q=>({id:++n,type:"tf",q:q[0],a:q[1]?"T":"F"}))});
 A.blocks.push({ins:"Task 2. Listen again and fill in each blank with ONE word or number.",vi:"Nghe lại và điền MỘT từ hoặc một số vào chỗ trống.",items:e.fill.map(q=>({id:++n,type:"fill",q:q[0],a:q[1]}))});
 const B={name:"B. LANGUAGE FOCUS",pts:.2,vi:"Ngôn ngữ (3,0 điểm)",blocks:[]};
 B.blocks.push({ins:"I. Choose the word whose underlined part is pronounced differently from the others.",vi:"Chọn từ có phần gạch chân phát âm khác các từ còn lại.",items:d.pron.map(p=>({id:++n,type:"mc",q:"",o:p.o,a:p.a}))});
 B.blocks.push({ins:"II. Choose the best option (A, B, C or D) to complete each sentence.",vi:"Chọn đáp án đúng nhất (A, B, C hoặc D) để hoàn thành câu.",items:d.mcq.map(q=>({id:++n,type:"mc",q:q.q,o:q.o,a:q.a}))});
 B.blocks.push({ins:"III. Give the correct form of the word in brackets.",vi:"Cho dạng đúng của từ trong ngoặc.",items:d.wf.map(q=>({id:++n,type:"fill",q:q[0],a:q[1].split("/").map(x=>x.trim())}))});
 B.blocks.push({ins:"IV. Find the mistake (A, B, C or D) in each sentence.",vi:"Tìm lỗi sai (A, B, C hoặc D) trong mỗi câu.",items:d.err.map(q=>{let k=0;const s=q[0].replace(/\{([^}]+)\}/g,(m,t)=>`<u>${t}</u><sup>(${L[k++]})</sup>`);return{id:++n,type:"mc",q:s,o:["A","B","C","D"],a:L.indexOf(q[1]),note:"Sửa: "+q[2]}})});
 const C={name:"C. READING",pts:.3,vi:"Đọc hiểu (3,0 điểm)",blocks:[]};
 const base=n;
 C.blocks.push({ins:"I. Read the text and choose the best answer (A, B, C or D) for each blank.",vi:"Đọc đoạn văn và chọn đáp án đúng cho mỗi chỗ trống.",pas:d.cloze.text.replace(/\((\d)\)_{4}/g,(m,k)=>`<b>(${base+ +k})</b> ______`),items:d.cloze.items.map(q=>({id:++n,type:"mc",q:"",o:q.o,a:q.a}))});
 C.blocks.push({ins:"II. Read the passage and choose the best answer (A, B, C or D).",vi:"Đọc đoạn văn và chọn đáp án đúng nhất.",pas:d.passage.text,items:d.passage.qs.map(q=>({id:++n,type:"mc",q:q.q,o:q.o,a:q.a}))});
 const W={name:"D. WRITING",pts:.25,vi:"Viết (2,0 điểm)",blocks:[]};
 W.blocks.push({ins:"I. Rewrite the sentences, using the word(s) in brackets. Do not change the meaning.",vi:"Viết lại câu với từ cho sẵn, không đổi nghĩa. (Viết cả câu hoàn chỉnh.)",items:d.rw.map(q=>({id:++n,type:"write",q:q[0],hint:q[1],a:q[2]}))});
 W.blocks.push({ins:"II. Write full sentences, using the given words. You can add words or change the form.",vi:"Viết câu hoàn chỉnh từ các từ gợi ý (có thể thêm từ hoặc đổi dạng từ).",items:d.sb.map(q=>({id:++n,type:"write",q:q[0],hint:"",a:q[1]}))});
 const it=X[i].items;[A,B,C,W].forEach(s=>s.blocks.forEach(b=>b.items.forEach(q=>q.x=it[q.id-1])));
 C.blocks[0].ptr=X[i].clozeTr;C.blocks[1].ptr=X[i].pasTr;
 return [A,B,C,W];
}
/* ---------- normalise ---------- */
function canon(s){
 s=s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g," ");
 const ex=[[/\bi'm\b/g,"i am"],[/\bisn't\b/g,"is not"],[/\baren't\b/g,"are not"],[/\bdoesn't\b/g,"does not"],[/\bdon't\b/g,"do not"],[/\bdidn't\b/g,"did not"],[/\bwon't\b/g,"will not"],[/\bit's\b/g,"it is"],[/\bshouldn't\b/g,"should not"],[/\bcan't\b/g,"cannot"],[/\b(he|she|we|they|you)'(s|re)\b/g,(m,a,b)=>a+(b=="s"?" is":" are")],[/\bi'll\b/g,"i will"]];
 ex.forEach(([r,t])=>s=s.replace(r,t));
 return s.replace(/[^a-z0-9' ]/g," ").replace(/'/g,"").replace(/\s+/g," ").trim();
}
const nf=x=>x.toLowerCase().trim().replace(/[.,!?]$/,"").replace(/[-\s]+/g," ");

/* ---------- render ---------- */
function renderTabs(){
 $("#tabs").innerHTML=D.map((d,i)=>{const r=st.res[i];return `<button class="tab ${i==st.cur?"active":""} ${r?"done":""}" data-s="${r?r.total.toFixed(2).replace(/\.?0+$/,""):""}" onclick="go(${i})"><b>ĐỀ ${i+1}</b><span>${d.theme}</span></button>`}).join("");
}
function go(i){stopAudio();st.cur=i;render()}
function render(){
 renderTabs();
 const i=st.cur;
 if(st.dom[i]){st.model=st.models[i];$("#main").replaceChildren(st.dom[i]);loadVoices();paint();return}
 const d=D[i],secs=build(i);st.model=secs;st.models[i]=secs;
 let h=`<div class="card" style="padding:0"><div class="bar">
  <input class="nm" id="sname" placeholder="Họ và tên" value="${st.name||""}" oninput="st.name=this.value">
  <input class="nm" id="sclass" style="width:90px" placeholder="Lớp" value="${st.cls||""}" oninput="st.cls=this.value">
  <span class="timer" id="timer">45:00</span>
  <button class="b g" id="tbtn" onclick="startTimer()">⏱ Bắt đầu tính giờ</button>
  <span class="prog" id="prog"></span></div>
  <div style="padding:14px 16px">
  <h2 style="margin-top:0">ĐỀ SỐ ${i+1} <small>— ${d.theme} • 45 phút</small></h2>
  <div class="warn" id="warn">Trình duyệt chưa có giọng đọc tiếng Anh. Hãy dùng Chrome / Edge / Safari mới nhất.</div>
  <div class="player">
   <button class="b" onclick="play()">▶ Nghe</button><button class="b g" onclick="pauseAudio()">⏸ Tạm dừng</button><button class="b g" onclick="stopAudio()">⏹ Dừng</button>
   <select id="rate"><option value="0.8">Chậm</option><option value="0.9" selected>Vừa</option><option value="1.05">Thường</option></select>
   <select id="voice"></select>
   <select id="lim"><option value="2" selected>Nghe tối đa 2 lần</option><option value="99">Nghe không giới hạn</option></select>
   <span id="pstat" style="margin-left:auto;font-size:.85rem;color:#6b7280">Đã nghe: ${st.plays[i]||0} lần</span><div class="pbar"><i id="pb"></i></div></div>`;
 secs.forEach(s=>{
  h+=`<h2>${s.name} <small>— <span class="vi">${s.vi}</span></small></h2>`;
  s.blocks.forEach(b=>{
   h+=`<div class="ins">${b.ins}<br><span class="vi">${b.vi}</span></div>`;
   if(b.pas)h+=`<div class="pas">${b.pas}</div>`;
   if(b.ptr)h+=`<div class="pas ptr" style="display:none;background:#f0fdfa;border-color:#99f6e4"><b>🇻🇳 Dịch:</b> ${b.ptr}</div>`;
   b.items.forEach(q=>h+=itemHtml(q));
  });
 });
 h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="b" id="sbtn" onclick="submit()">✔ Nộp bài &amp; chấm điểm</button><button class="b g" onclick="redo()">↺ Làm lại đề này</button></div><div id="result"></div>
  <details><summary>📄 Script bài nghe (xem sau khi nộp bài)</summary>${E[i].lines.map(l=>`<p><b>${l[0]}:</b> ${l[1]}</p>`).join("")}</details>
  </div></div>`;
 const w=document.createElement("div");w.innerHTML=h;
 w.addEventListener("input",updProg);
 st.dom[i]=w;$("#main").replaceChildren(w);
 loadVoices();updProg();
}
function itemHtml(q){
 const id="q"+q.id;let h=`<div class="q" id="${id}">`;
 if(q.type=="tf")h+=`<div><b>${q.id}.</b> ${q.q}</div><div class="opts tf"><label><input type="radio" name="${id}" value="T">T</label><label><input type="radio" name="${id}" value="F">F</label></div>`;
 else if(q.type=="fill")h+=`<div><b>${q.id}.</b> ${q.q.replace(/_{4,}/,'<input class="t" type="text" autocomplete="off" spellcheck="false">')}</div>`;
 else if(q.type=="mc"){
  h+=`<div><b>${q.id}.</b> ${q.q||""}</div><div class="opts">${q.o.map((o,j)=>`<label><input type="radio" name="${id}" value="${j}"><b>${L[j]}.</b> ${q.o[0]==="A"&&q.o[1]==="B"?"":o}</label>`).join("")}</div>`}
 else if(q.type=="write")h+=`<div><b>${q.id}.</b> ${q.q}</div>${q.hint?`<div class="vi">Gợi ý: ${q.hint}</div>`:""}<textarea rows="2" spellcheck="false" placeholder="Viết cả câu..."></textarea>`;
 return h+`<div class="fb"></div></div>`;
}
function updProg(){
 const qs=document.querySelectorAll(".q");let a=0;
 qs.forEach(q=>{const r=q.querySelector("input[type=radio]:checked"),t=q.querySelector("input.t,textarea");if(r||(t&&t.value.trim()))a++});
 const p=$("#prog");if(p)p.textContent=`Đã làm: ${a}/${qs.length} câu`;
}

/* ---------- audio ---------- */
function sentences(t){return t.match(/[^.!?]+[.!?]+["']?|[^.!?]+$/g).map(x=>x.trim()).filter(Boolean)}
function play(){
 if(!("speechSynthesis" in window)){alert("Trình duyệt không hỗ trợ đọc.");return}
 if(st.paused){speechSynthesis.resume();st.paused=false;return}
 const i=st.cur,lim=+$("#lim").value;
 if((st.plays[i]||0)>=lim){alert("Em đã nghe đủ số lần quy định.");return}
 stopAudio();const tok=++st.token,e=E[i],q=[];
 const sp=[...new Set(e.lines.map(l=>l[0]))];
 e.lines.forEach((l,li)=>sentences(l[1]).forEach(t=>q.push({sp:l[0],t,li})));
 const rate=+$("#rate").value,base=voices[+$("#voice").value]||null;
 const alt=voices.find(v=>v!==base&&base&&v.lang===base.lang)||base;
 st.plays[i]=(st.plays[i]||0)+1;$("#pstat").textContent=`Đã nghe: ${st.plays[i]} lần`;
 let k=0;(function nx(){
  if(tok!==st.token)return;
  if(k>=q.length){const b=$("#pb");if(b)b.style.width="100%";return}
  const it=q[k++],u=new SpeechSynthesisUtterance(it.t),si=sp.indexOf(it.sp);
  u.lang="en-US";u.rate=rate;
  if(si%2==0){if(base)u.voice=base;u.pitch=1}else{if(alt)u.voice=alt;u.pitch=alt!==base?1:.75}
  if(sp.length>2)u.pitch=[1,.8,.7][si%3];
  u.onend=()=>{const b=$("#pb");if(b)b.style.width=(k/q.length*100)+"%";setTimeout(nx,it.li!==(q[k]||{}).li?450:120)};
  speechSynthesis.speak(u);
 })();
}
function pauseAudio(){if(speechSynthesis.speaking&&!st.paused){speechSynthesis.pause();st.paused=true}}
function stopAudio(){st.token++;st.paused=false;if("speechSynthesis" in window)speechSynthesis.cancel();const b=$("#pb");if(b)b.style.width="0"}

/* ---------- timer ---------- */
function startTimer(){
 const i=st.cur;if(st.timers[i]&&st.timers[i].h)return;
 const t=st.timers[i]=st.timers[i]||{left:45*60};
 $("#tbtn").disabled=true;
 t.h=setInterval(()=>{t.left--;paint();if(t.left<=0){clearInterval(t.h);t.h=null;if(!st.res[i]&&st.cur==i){alert("Hết giờ! Bài sẽ được nộp tự động.");submit()}}},1000);
}
function paint(){const t=st.timers[st.cur];const el=$("#timer");if(!el||!t)return;const m=Math.floor(t.left/60),s=t.left%60;el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");el.classList.toggle("low",t.left<300)}

/* ---------- grading ---------- */
function submit(){
 const i=st.cur;if(st.res[i]&&!arguments[0]&&false)return;
 stopAudio();const t=st.timers[i];if(t&&t.h){clearInterval(t.h);t.h=null}
 const secs=st.model,res={sec:[],ok:{},total:0,time:t?45*60-t.left:0};
 secs.forEach(s=>{let c=0,n=0;
  s.blocks.forEach(b=>b.items.forEach(q=>{n++;const box=$("#q"+q.id),fb=box.querySelector(".fb");let ok=false,msg="";
   fb.className="fb";
   if(q.type=="tf"||q.type=="mc"){
    const r=box.querySelector("input:checked");const v=r?r.value:null;
    const ans=q.type=="tf"?q.a:String(q.a);ok=v===ans;
    box.querySelectorAll(".opts label").forEach(l=>l.classList.remove("good","bad"));
    const labs=box.querySelectorAll(".opts label");
    const ci=q.type=="tf"?(q.a=="T"?0:1):q.a;labs[ci].classList.add("good");
    if(r&&!ok)r.parentElement.classList.add("bad");
    const ansTxt=q.type=="tf"?q.a:L[q.a];
    msg=ok?"✔ Đúng":`✘ ${r?"Sai":"Chưa chọn"}. Đáp án: ${ansTxt}${q.note?" ("+q.note+")":""}`;
   }else if(q.type=="fill"){
    const inp=box.querySelector("input.t");inp.classList.remove("good","bad");
    ok=q.a.map(nf).includes(nf(inp.value));inp.classList.add(ok?"good":"bad");
    msg=ok?"✔ Đúng":"✘ Đáp án: "+q.a.join(" / ");
   }else if(q.type=="write"){
    const ta=box.querySelector("textarea");ta.classList.remove("good","bad");
    ok=canon(ta.value)===canon(q.a);ta.classList.add(ok?"good":"bad");
    msg=ok?"✔ Đúng":`✘ Đáp án mẫu: ${q.a}`;
    if(!ok&&ta.value.trim())msg+=` <label class="self"><input type="checkbox" onchange="selfMark(${q.id},this.checked)"> Câu của em cũng đúng (tự chấm / GV chấm)</label>`;
   }
   fb.className="fb "+(ok?"ok":"no");fb.innerHTML=msg;
   if(q.x){const ex=document.createElement("div");ex.className="ex";ex.innerHTML=(q.x[0]?`<b>🇻🇳 Dịch:</b> ${q.x[0]}<br>`:"")+`<b>💡 Giải thích:</b> ${q.x[1]}`;fb.after(ex)}
   res.ok[q.id]=ok;if(ok)c++;
  }));
  const pts=c*s.pts;res.sec.push({name:s.name,c,n,pts,max:n*s.pts,per:s.pts});res.total+=pts});
 res.total=Math.round(res.total*100)/100;
 st.res[i]=res;renderTabs();showResult();
 document.querySelectorAll("#main .q input,#main .q textarea").forEach(x=>{if(x.type!="checkbox")x.disabled=true});
 $("#sbtn").disabled=true;
 document.querySelectorAll("#main .ptr").forEach(x=>x.style.display="block");
}
function selfMark(id,on){
 const i=st.cur,r=st.res[i];if(!r)return;
 const sec=st.model.findIndex(s=>s.blocks.some(b=>b.items.some(q=>q.id==id)));
 const sc=r.sec[sec];const d=on?1:-1;sc.c+=d;sc.pts=Math.round(sc.c*sc.per*100)/100;
 r.total=Math.round(r.sec.reduce((a,s)=>a+s.pts,0)*100)/100;r.ok[id]=on;
 renderTabs();showResult(true);
}
function showResult(keep){
 const i=st.cur,r=st.res[i];if(!r)return;
 const nm=(st.name||"").trim()||"(chưa nhập tên)",cl=(st.cls||"").trim();
 const g=r.total>=8?"Giỏi 🎉":r.total>=6.5?"Khá 👍":r.total>=5?"Trung bình":"Cần cố gắng thêm 💪";
 const m=Math.floor(r.time/60);
 $("#result").innerHTML=`<div class="card result" style="margin-top:14px"><div>Học sinh: <b>${nm}</b> ${cl?"• Lớp "+cl:""} • Đề ${i+1} • Thời gian làm: ${m} phút</div>
 <div class="big">${r.total.toFixed(2).replace(/\.?0+$/,"")} / 10 <small style="font-size:1rem;font-weight:600">— ${g}</small></div>
 <table class="rs"><tr><th>Phần</th><th>Số câu đúng</th><th>Điểm</th></tr>${r.sec.map(s=>`<tr><td>${s.name}</td><td>${s.c}/${s.n}</td><td>${s.pts.toFixed(2).replace(/\.?0+$/,"")} / ${s.max.toFixed(1).replace(/\.0$/,"")}</td></tr>`).join("")}</table>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b g" onclick="copyRes()">📋 Sao chép kết quả</button><button class="b g" onclick="window.print()">🖨 In</button></div>
 <p class="vi" style="margin:6px 0 0">Cuộn lên để xem đáp án đúng/sai từng câu. Phần Viết: nếu câu em đúng nghĩa nhưng khác đáp án mẫu, tích “Câu của em cũng đúng” (giáo viên xác nhận).</p></div>`;
 if(!keep)$("#result").scrollIntoView({behavior:"smooth"});
}
function copyRes(){
 const i=st.cur,r=st.res[i];
 const t=`Họ tên: ${st.name||""} | Lớp: ${st.cls||""} | Đề ${i+1} | Điểm: ${r.total}/10 | `+r.sec.map(s=>`${s.name.split(".")[0]}:${s.c}/${s.n}`).join(" ");
 navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert("Đã sao chép:\n"+t),()=>prompt("Sao chép:",t));
}
function redo(){
 const i=st.cur;stopAudio();if(st.timers[i]&&st.timers[i].h)clearInterval(st.timers[i].h);
 delete st.timers[i];delete st.res[i];delete st.dom[i];st.plays[i]=0;render();window.scrollTo(0,0);
}
render();
</script>
</body>
