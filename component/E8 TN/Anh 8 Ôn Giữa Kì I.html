<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anh 8 Ôn Giữa Kì I</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column learning path (Duolingo-like), lessons run full-screen with a sticky check bar */
:root{
  --bg:#EEF5F3; --surface:#FFFFFF; --surface-2:#F6FAF9; --ink:#11303A; --muted:#5B7279; --line:#D3E2DE;
  --brand:#0F8B7E; --brand-deep:#0A6158; --brand-soft:#D6EFEB;
  --sun:#F2B33D; --sun-deep:#C98A12; --sun-soft:#FCEFD2;
  --coral:#E3664F; --coral-deep:#B2412D; --coral-soft:#FBE3DD;
  --sky:#3C83C4; --sky-deep:#28609A; --sky-soft:#DCEAF7;
  --ok:#2E9E4F; --ok-deep:#1F7A39; --ok-bg:#DDF3E2;
  --bad:#D2453B; --bad-deep:#A8302A; --bad-bg:#FBE1DE;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1C20; --surface:#16292E; --surface-2:#1B3238; --ink:#E6F1EE; --muted:#9DB4B0; --line:#29454C;
  --brand:#2BB3A3; --brand-deep:#17857A; --brand-soft:#173F3B;
  --sun:#F2B33D; --sun-deep:#B07A0E; --sun-soft:#3B3017;
  --coral:#EE7C66; --coral-deep:#B8503C; --coral-soft:#40261F;
  --sky:#5EA2DE; --sky-deep:#3471AD; --sky-soft:#1B3249;
  --ok:#47BE69; --ok-deep:#2C8E48; --ok-bg:#16382A; --bad:#EE6A5F; --bad-deep:#B8443B; --bad-bg:#3F201E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1C20; --surface:#16292E; --surface-2:#1B3238; --ink:#E6F1EE; --muted:#9DB4B0; --line:#29454C;
  --brand:#2BB3A3; --brand-deep:#17857A; --brand-soft:#173F3B;
  --sun:#F2B33D; --sun-deep:#B07A0E; --sun-soft:#3B3017;
  --coral:#EE7C66; --coral-deep:#B8503C; --coral-soft:#40261F;
  --sky:#5EA2DE; --sky-deep:#3471AD; --sky-soft:#1B3249;
  --ok:#47BE69; --ok-deep:#2C8E48; --ok-bg:#16382A; --bad:#EE6A5F; --bad-deep:#B8443B; --bad-bg:#3F201E; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
u{text-decoration-thickness:2px;text-underline-offset:3px}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:1.25rem;color:var(--brand);letter-spacing:.2px}
.brand span{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:10px}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.stat svg{width:22px;height:22px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
.nav button{background:none;border:2px solid transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--brand);border-color:var(--brand-soft);background:var(--brand-soft)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* path */
.hero{padding-block:18px 6px}
.hero h1{font-size:1.6rem}
.hero p{margin:.3rem 0 0;color:var(--muted);font-size:.92rem}
.next{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.next div{flex:1;min-width:0}
.next small{display:block;color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.next b{font-family:var(--f-display);font-size:1.1rem}
.secband{margin-top:26px;border-radius:var(--r);padding:12px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}
.secband h2{font-size:1.25rem}
.secband p{margin:0;font-size:.85rem;opacity:.92}
.secband .cnt{font-family:var(--f-display);font-size:1.05rem;white-space:nowrap}
.sec-A{background:var(--sky)} .sec-B{background:var(--brand)} .sec-C{background:var(--coral)} .sec-D{background:var(--sun-deep)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:18px 4px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;width:150px}
.node .disc{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;border-bottom:6px solid var(--d);background:var(--c);transition:transform .12s}
.node:active .disc{transform:translateY(3px);border-bottom-width:3px}
.node .disc svg{width:34px;height:34px}
.node.done .disc{background:var(--sun);border-bottom-color:var(--sun-deep)}
.node .lbl{font-weight:700;font-size:.9rem;text-align:center;line-height:1.25}
.node .stars{display:flex;gap:2px}
.node .stars svg{width:15px;height:15px}
.node.isnext .disc{box-shadow:0 0 0 6px var(--surface),0 0 0 9px var(--c)}

/* generic buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:1rem;letter-spacing:.02em;background:var(--brand);color:#fff;border-bottom:4px solid var(--brand-deep);text-transform:uppercase}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{background:var(--line);border-bottom-color:var(--line);color:var(--muted);cursor:default;transform:none}
.btn.ghost{background:var(--surface);color:var(--brand);border:2px solid var(--line);border-bottom-width:4px}
.btn.wide{width:100%}
.btn.okb{background:var(--ok);border-bottom-color:var(--ok-deep)}
.btn.badb{background:var(--bad);border-bottom-color:var(--bad-deep)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem}

/* lesson overlay */
#lesson{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lhead .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.x{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted)}
.x svg{width:24px;height:24px;display:block}
.bar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .35s ease;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums}
.hearts svg{width:24px;height:24px}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lbody .wrap{padding-block:8px 24px}
.lfoot{border-top:2px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s}
.lfoot .wrap{padding-block:14px;display:flex;flex-direction:column;gap:10px}
.lfoot.ok{background:var(--ok-bg);border-top-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-top-color:transparent}
.fb h3{font-size:1.35rem;display:flex;align-items:center;gap:8px}
.lfoot.ok .fb h3{color:var(--ok)} .lfoot.bad .fb h3{color:var(--bad)}
.fb .ans{margin:.2rem 0 0;font-weight:600}
.fb .why{margin:.25rem 0 0;font-size:.93rem}
.fb .src{font-size:.75rem;color:var(--muted);margin-top:4px}
.combo{font-family:var(--f-display);color:var(--sun-deep);font-size:1rem}

.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.qtitle{font-family:var(--f-display);font-size:1.3rem;margin:0 0 14px;line-height:1.3}
.prompt{font-size:1.12rem;font-weight:600;margin:0 0 16px;line-height:1.5}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--brand);margin:0 2px;transform:translateY(-2px)}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;font-size:1rem;font-weight:500;display:flex;align-items:center;gap:10px;min-width:0}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt .tx{flex:1;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.opt[aria-pressed="true"] .k{border-color:var(--sky);color:var(--sky)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.say{flex:none;background:var(--brand-soft);color:var(--brand);border:0;border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.say svg{width:20px;height:20px}
.pronw{font-size:1.25rem;font-weight:600;letter-spacing:.01em}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .opt{justify-content:center;font-weight:700;font-size:1.05rem;padding:16px}

.audio{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--sky-soft);border-radius:var(--r);padding:12px;margin-bottom:16px}
.play{width:64px;height:64px;border-radius:18px;border:0;background:var(--sky);border-bottom:5px solid var(--sky-deep);color:#fff;display:grid;place-items:center}
.play svg{width:30px;height:30px}
.play.slow{width:48px;height:48px;border-radius:14px;background:var(--surface);color:var(--sky);border:2px solid var(--line);border-bottom-width:4px}
.play.slow svg{width:22px;height:22px}
.audio .meta{flex:1;min-width:140px;font-size:.88rem}
.audio .meta b{display:block;font-size:.95rem}

input.ty{width:100%;font:inherit;font-size:1.15rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.sent{font-size:1.15rem;line-height:2.3;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px}
.seg{background:none;border:0;padding:0 2px;border-bottom:3px solid var(--ink);border-radius:4px;font-weight:600;position:relative}
.seg sub{font-size:.68rem;font-weight:800;color:var(--muted);margin-left:2px}
.seg[aria-pressed="true"]{background:var(--sky-soft);border-bottom-color:var(--sky)}
.seg.right{background:var(--ok-bg);border-bottom-color:var(--ok)} .seg.wrong{background:var(--bad-bg);border-bottom-color:var(--bad)}

.cue{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:1.02rem;margin-bottom:14px}
.answer-line{min-height:110px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0 12px;background-image:linear-gradient(transparent 52px,var(--line) 52px,var(--line) 54px,transparent 54px);background-size:100% 56px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:16px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 12px;font-size:1rem;font-weight:500}
.tile.used{visibility:hidden}
.toggle{margin-top:14px;background:none;border:0;color:var(--brand);font-weight:700;font-size:.9rem;padding:4px 0}
textarea.ty{width:100%;min-height:110px;font:inherit;font-size:1.05rem;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 10px;font-weight:600;font-size:.95rem;min-height:56px;text-align:center}
.mt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.mt.gone{opacity:.35;border-color:var(--ok);background:var(--ok-bg);pointer-events:none}
.mt.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* intro / learn */
.ltabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:6px 0 14px}
.ltabs button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem;color:var(--muted)}
.ltabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:1.15rem;margin-bottom:8px}
.card p{margin:.5rem 0}
.tblw{overflow-x:auto;margin:.6rem 0}
.card table{width:100%;border-collapse:collapse;font-size:.92rem}
.card th,.card td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.card th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center;font-family:var(--f-display)}
.para{margin:0 0 12px}
.para .en{margin:0}
.para .vi{margin:.35rem 0 0;padding:8px 10px;border-left:4px solid var(--coral);background:var(--coral-soft);border-radius:0 10px 10px 0;font-size:.94rem}
mark.w{background:var(--sun-soft);color:inherit;border-radius:4px;padding:0 2px;cursor:pointer;border-bottom:2px dotted var(--sun-deep)}
.gloss{display:inline-block;font-size:.8rem;font-weight:600;background:var(--ink);color:var(--surface);border-radius:6px;padding:0 6px;margin-left:3px}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.92rem;margin-bottom:12px}
.switch input{width:22px;height:22px;accent-color:var(--coral)}
.vocab{display:grid;grid-template-columns:1fr;gap:8px}
.vrow{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:7px 0}
.vrow b{font-weight:700}
.vrow span{color:var(--muted);text-align:right}

/* end screen */
.end{text-align:center;padding-top:20px}
.end h2{font-size:2rem;color:var(--sun-deep)}
.bigstars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.bigstars svg{width:56px;height:56px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.score{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.score small{display:block;font-weight:800;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 0}
.score b{display:block;font-family:var(--f-display);font-size:1.4rem;padding:6px 0;font-variant-numeric:tabular-nums}

/* answer book */
.book .item{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.book .item .s{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.book .item .q{margin:.2rem 0;font-weight:500}
.book .item .a{font-weight:700;color:var(--ok)}
.book .item .e{font-size:.88rem;color:var(--muted);margin-top:2px}
.book.hide .item .a{filter:blur(6px);cursor:pointer;user-select:none}
.book.hide .item .a.show{filter:none}
.book h2{font-size:1.3rem;margin:22px 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.search{flex:1;min-width:180px;font:inherit;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.modecard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.modecard h2{font-size:1.3rem}
.modecard p{margin:.35rem 0 12px;color:var(--muted)}

#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,25,30,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--bg);width:100%;max-width:680px;max-height:86%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet .ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--line)}
#sheet .pb{overflow-y:auto;padding:14px 16px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;z-index:70;font-size:.9rem}

/* thi đua */
.clock{color:var(--ink);font-family:var(--f-display);font-size:1.15rem}
.warn{border-color:var(--sun);background:var(--sun-soft)}
.mecard{border-color:var(--brand)}
.merow{display:flex;gap:14px;align-items:center}
.ava{flex:none;width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;border-bottom:4px solid var(--brand-deep)}
.pgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.pname{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600}
.pname[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.pin{max-width:150px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.subh{font-size:1.35rem;margin:26px 0 12px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ecard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.ecard .en{font-family:var(--f-display);font-size:1.4rem;line-height:1;color:var(--brand)}
.ecard.alt .en{color:var(--coral)}
.ecard .ec{font-size:.85rem;color:var(--muted);flex:1}
.ecard .eb{font-size:.9rem;margin-bottom:4px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:8px 0 16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:30%;max-width:150px;min-width:0}

const AUDIO={

  vi:`Chào các bạn, mình là Nam. Hè năm ngoái mình ở với ông bà tại một ngôi làng ở Thái Bình. Lúc đó là mùa thu hoạch nên ai cũng rất bận. Buổi sáng, mình giúp bố mẹ chất lúa lên xe bò kéo. Buổi chiều, mình chăn trâu cùng các anh chị em họ. Buổi tối, chúng mình bắt cá ở một cái ao gần đó. Người dân ở đó rất thân thiện và hiếu khách. Cuộc sống ở nông thôn chậm rãi và yên bình hơn ở thành phố.`},
 u2b:{title:`Three opinions about the countryside`,lines:[['Lan',`Speaker one, Lan. I love the countryside because the air is fresh and it's very peaceful. I can relax there.`],['Tom',`Speaker two, Tom. For me, the best thing is the people. They are friendly and they always help each other.`],['Hoa',`Speaker three, Hoa. I don't really like living in the countryside. There aren't many places for entertainment, and it's not convenient to go shopping.`]],
  vi:`Người nói 1 – Lan: Mình yêu nông thôn vì không khí trong lành và rất yên bình. Mình có thể thư giãn ở đó. Người nói 2 – Tom: Với mình, điều tuyệt nhất là con người. Họ thân thiện và luôn giúp đỡ nhau. Người nói 3 – Hoa: Mình không thích sống ở nông thôn lắm. Không có nhiều nơi giải trí và đi mua sắm không thuận tiện.`},
 u3a:{title:`Choosing a school club`,lines:[['Mai',`Phong, which club do you want to join this year?`],['Phong',`The chess club. I started playing chess three years ago, and it helps me concentrate better.`],['Mai',`I want to join the arts and crafts club. The members make things by hand and do community service projects.`],['Phong',`Sounds great. When does it meet?`],['Mai',`On Wednesdays after school, from four to five thirty.`]],
  vi:`Mai: Phong ơi, năm nay bạn muốn tham gia câu lạc bộ nào? – Phong: CLB cờ vua. Mình bắt đầu chơi cờ ba năm trước và nó giúp mình tập trung tốt hơn. – Mai: Mình muốn vào CLB mỹ thuật và thủ công. Thành viên làm đồ bằng tay và làm các dự án phục vụ cộng đồng. – Phong: Nghe hay đấy. Khi nào CLB sinh hoạt? – Mai: Vào thứ Tư sau giờ học, từ 4 giờ đến 5 giờ 30.`},
 u3b:{title:`Teenagers and stress`,lines:[['Minh',`Hello, I'm Minh. Teenagers face many kinds of pressure. First, there is pressure from parents. They want us to get high marks. Second, there is schoolwork. We have lots of homework and exams. Third, there is peer pressure. We want to fit in with our friends. Some teens are also bullied, even online. When I feel stressed, I talk to my parents, play sports and get enough sleep.`]],
  vi:`Xin chào, mình là Minh. Thanh thiếu niên phải đối mặt với nhiều loại áp lực. Thứ nhất là áp lực từ bố mẹ: bố mẹ muốn chúng mình đạt điểm cao. Thứ hai là bài vở: chúng mình có rất nhiều bài tập về nhà và bài kiểm tra. Thứ ba là áp lực bạn bè: chúng mình muốn hòa nhập với bạn bè. Một số bạn còn bị bắt nạt, kể cả trên mạng. Khi thấy căng thẳng, mình nói chuyện với bố mẹ, chơi thể thao và ngủ đủ giấc.`}

<tr><td>ou</td><td>/ɔː/</td><td>p<u>ou</u>r, c<u>ou</u>rse, f<u>ou</u>r</td></tr>
<tr><td>ou</td><td>/ʊə/</td><td>t<u>ou</u>r</td></tr>
<tr><td>u</td><td>/ʊ/</td><td>b<u>u</u>lly, b<u>u</u>sh, s<u>u</u>gar, p<u>u</u>t, p<u>u</u>sh</td></tr>
<tr><td>u</td><td>/uː/</td><td>cr<u>u</u>el, fl<u>u</u>, J<u>u</u>ne</td></tr>
<tr><td>a trong -age</td><td>/ɪ/</td><td>vill<u>a</u>ge, dam<u>a</u>ge, cott<u>a</u>ge</td></tr>
<tr><td>a đầu từ không nhấn</td><td>/ə/</td><td><u>a</u>bout, <u>a</u>go</td></tr>
<tr><td>e không nhấn</td><td>/ə/</td><td>op<u>e</u>n, sil<u>e</u>nt, gard<u>e</u>n</td></tr>
<tr><td>e được nhấn</td><td>/e/</td><td><u>e</u>nvelope /ˈenvələʊp/</td></tr></table>`,
how:[`Đọc to cả 4 từ, chú ý <b>phần gạch chân</b>.`,`Xác định trọng âm: nguyên âm ở âm tiết <b>không nhấn</b> thường đọc /ə/ hoặc /ɪ/.`,`Nhớ các cặp dễ nhầm: oo /uː/ – /ʊ/; o /ɒ/ – /əʊ/; ou /ɔː/ – /ʊə/.`,`Bấm nút loa trong app để nghe lại từng từ.`],
qs:[
 P('B1-1','Đề cương B.I – Câu 1',[`wat{e}r`,`dinn{e}r`,`farm{e}r`,`harv{e}st`],3,`harvest /ˈhɑːvɪst/: e đọc /ɪ/. Ba từ còn lại có đuôi -er không nhấn, đọc /ə/.`),
 P('B1-2','Đề cương B.I – Câu 2',[`sch{oo}l`,`sp{oo}n`,`b{oo}k`,`t{oo}l`],2,`book /bʊk/ đọc /ʊ/ ngắn. school, spoon, tool đọc /uː/ dài.`),
 P('B1-3','Đề cương B.I – Câu 3',[`c{o}llege`,`c{o}ntact`,`{o}ffice`,`{o}pen`],3,`open /ˈəʊpən/ đọc /əʊ/. college, contact, office đọc /ɒ/.`),
 P('B1-4','Đề cương B.I – Câu 4',[`t{ou}r`,`p{ou}r`,`c{ou}rse`,`f{ou}r`],0,`tour /tʊə(r)/ đọc /ʊə/. pour, course, four đọc /ɔː/.`),
 P('B1-5','Đề cương B.I – Câu 5',[`b{u}lly`,`b{u}sh`,`cr{u}el`,`s{u}gar`],2,`cruel /ˈkruːəl/ đọc /uː/. bully, bush, sugar đọc /ʊ/.`),
 P('B1-6','Đề cương B.I – Câu 6',[`b{oo}k`,`g{oo}d`,`st{oo}d`,`r{oo}t`],3,`root /ruːt/ đọc /uː/. book, good, stood đọc /ʊ/.`),
 P('B1-7','Đề cương B.I – Câu 7',[`vill{a}ge`,`{a}bout`,`dam{a}ge`,`cott{a}ge`],1,`about /əˈbaʊt/: a đọc /ə/. Đuôi -age trong village, damage, cottage đọc /ɪdʒ/.`),

 P('B1-x2','Luyện thêm',[`p{u}t`,`p{u}sh`,`fl{u}`,`f{u}ll`],2,`flu /fluː/ đọc /uː/; put, push, full đọc /ʊ/.`),
 P('B1-x3','Luyện thêm',[`h{o}t`,`sh{o}p`,`g{o}`,`b{o}x`],2,`go /ɡəʊ/ đọc /əʊ/; hot, shop, box đọc /ɒ/.`),
 P('B1-x4','Luyện thêm',[`h{ou}se`,`c{ou}rse`,`p{ou}r`,`f{ou}r`],0,`house /haʊs/ đọc /aʊ/; course, pour, four đọc /ɔː/.`)

{id:'B2',sec:'B',name:'Sở thích + V-ing',title:'Verbs of liking + V-ing',sub:'Đề cương B.II, B.III, B.IV',
learn:`<p><b>1. Động từ chỉ sở thích + V-ing</b></p>
<table><tr><th>Cấu trúc</th><th>Động từ</th></tr>
<tr><td>+ V-ing</td><td>enjoy, fancy, adore, detest, dislike, don't mind</td></tr>
<tr><td>+ V-ing hoặc to V (nghĩa như nhau)</td><td>like, love, hate, prefer</td></tr>
<tr><td>+ to V (chỉ to V)</td><td>would like, want, decide</td></tr></table>
<p>→ Đáp án có “<b>prefers to plant</b>” vì trong 4 động từ prefer / enjoy / detest / adore chỉ <b>prefer</b> đi được với <b>to V</b>.</p>
<p>→ <b>loves preparing = loves to prepare</b>, nên chọn “A &amp; B are correct”.</p>
<p><b>2. Tính từ + giới từ + V-ing</b></p>
<table><tr><th>Cụm</th><th>Nghĩa</th></tr>
<tr><td>be keen <b>on</b></td><td>say mê</td></tr>
<tr><td>be fond <b>of</b></td><td>thích</td></tr>
<tr><td>be interested <b>in</b></td><td>quan tâm, thích</td></tr>
<tr><td>be <b>into</b> + N/V-ing</td><td>mê, thích</td></tr>
<tr><td>be crazy <b>about</b></td><td>phát cuồng vì</td></tr>
<tr><td>be good <b>at</b></td><td>giỏi về</td></tr>
<tr><td>rely <b>on</b></td><td>dựa vào, phụ thuộc vào</td></tr></table>
<p><b>3. Hai động từ nối bằng “and” phải cùng dạng:</b> enjoys <u>making</u> videos and <u>uploading</u> them.</p>
<p><b>4. Nghĩa của động từ:</b> fancy / adore = thích; detest / hate / dislike = ghét, không thích. Người <i>sociable</i> (hòa đồng) thì <b>fancies</b> hanging out.</p>`,
how:[`Nhìn từ ngay trước chỗ trống: enjoy, fancy, love, keen on, fond of… → điền <b>V-ing</b>.`,`Nếu sau chỗ trống là <b>to V</b> → chọn like, love, hate hoặc <b>prefer</b>.`,`Câu hỏi giới từ: học thuộc cặp keen–on, fond–of, interested–in, crazy–about, good–at, rely–on.`,`Câu hỏi nghĩa: đọc vế giải thích (because…) để biết thích hay ghét.`,`Câu sửa lỗi: tìm động từ ngay sau like/love/hate/enjoy – nếu là V nguyên mẫu thì sai.`],
qs:[
 M('B2-1','Đề cương B.II – Câu 1',`My brother is very keen ______ collecting stamps in his free time.`,[`at`,`on`,`in`,`with`],1,`be keen <b>on</b> + V-ing: say mê làm gì.`),
 M('B2-2','Đề cương B.II – Câu 2',`She enjoys ______ videos and uploading them to her TikTok channel.`,[`make`,`makes`,`making`,`to make`],2,`enjoy + V-ing; và hai động từ nối bằng “and” cùng dạng: <b>making</b> … and uploading.`),
 M('B2-3','Đề cương B.II – Câu 3',`Teenagers nowadays rely heavily ______ social media to keep in touch with friends.`,[`on`,`in`,`at`,`with`],0,`rely <b>on</b>: dựa vào, phụ thuộc vào.`),
 M('B2-7','Đề cương B.II – Câu 7',`My mother loves ______ food for my family.`,[`preparing`,`to prepare`,`prepare`,`A&B are correct`],3,`love + V-ing hoặc love + to V đều đúng → <b>A &amp; B are correct</b>.`),
 M('B2-8','Đề cương B.II – Câu 8',`My father is fond of ______ a lot of trees and vegetables.`,[`growing`,`grow`,`grew`,`grows`],0,`be fond of + V-ing → <b>growing</b>.`),
 M('B2-9','Đề cương B.II – Câu 9',`My teacher ______ to plant flowers in the garden behind her house.`,[`prefers`,`enjoys`,`detests`,`adores`],0,`Sau chỗ trống là “to plant”. Chỉ <b>prefer</b> đi được với to V; enjoy, detest, adore + V-ing.`),
 M('B2-13','Đề cương B.II – Câu 13',`Melinda ______ hanging out because she is a sociable person.`,[`detests`,`hates`,`dislikes`,`fancies`],3,`sociable = hòa đồng, nên cô ấy <b>fancies</b> (thích) đi chơi. Ba từ còn lại nghĩa là ghét.`),
 M('B2-22','Đề cương B.II – Câu 22',`Children in this village love ______ kites on summer afternoons.`,[`to flying`,`flow`,`flies`,`flying`],3,`love + V-ing → <b>flying</b> kites (thả diều). “to flying” sai cấu trúc.`),
 M('B2-24','Đề cương B.II – Câu 24',`I'm not keen on ______ our class photos to the forum.`,[`uploading`,`surfing`,`messaging`,`log on`],0,`upload photos <b>to</b> the forum: tải ảnh lên diễn đàn. Sau keen on cần V-ing.`),
 M('B2-28','Đề cương B.II – Câu 28',`The sport that kids in the UK are ______ about is football.`,[`fond`,`into`,`crazy`,`interested`],2,`be <b>crazy about</b>: phát cuồng vì. (fond of, into, interested in không đi với about.)`),
 M('B2-29','Đề cương B.II – Câu 29',`Some teenagers, especially those who like to express themselves, are really ______ photography.`,[`about`,`in`,`of`,`into`],3,`be <b>into</b> + N: mê, thích (be into photography).`),
 M('B2-32','Đề cương B.II – Câu 32 (= Câu 35)',`Sue enjoys ______ origami with her friends at recess.`,[`making`,`make`,`to make`,`makes`],0,`enjoy + V-ing → <b>making</b> origami (gấp giấy).`),
 TY('B2-w1','Đề cương B.III – Câu 1',`Do you fancy (go) ______ to the cinema this weekend?`,[`going`],`fancy + V-ing → <b>going</b>.`),
 TY('B2-w3','Đề cương B.III – Câu 3',`John dislikes (work) ______ in front of a computer all day.`,[`working`],`dislike + V-ing → <b>working</b>.`),
 TY('B2-w4','Đề cương B.III – Câu 4',`Riding a bike is Lan's pleasure, but she detests (walk) ______ in the rain.`,[`walking`],`detest + V-ing → <b>walking</b>.`),
 E('B2-e7','Đề cương B.IV – Câu 7',[`She hates `,[`use`,'A'],` Facebook Messenger `,[`to`,'B'],` `,[`discuss`,'C'],` `,[`schoolwork`,'D'],`.`],'A',`use → using`,`hate + V-ing (hoặc to V): “hates <b>using</b> Facebook Messenger”. Không dùng V nguyên mẫu sau hate.`),
 M('B2-x1','Luyện thêm',`Lan is very good ______ drawing pictures.`,[`at`,`on`,`in`,`of`],0,`be good <b>at</b> + V-ing: giỏi về.`),
 M('B2-x2','Luyện thêm',`My dad doesn't mind ______ the dishes after dinner.`,[`wash`,`to wash`,`washing`,`washes`],2,`don't mind + V-ing → <b>washing</b>.`)
]},
{id:'B3',sec:'B',name:'So sánh hơn',title:'Comparatives – adjectives & adverbs',sub:'Đề cương B.II, B.III',
learn:`<p><b>1. Tính từ hay trạng từ?</b></p>
<table><tr><th>Vị trí</th><th>Dùng</th><th>Ví dụ</th></tr>
<tr><td>sau <b>be</b> (is, was…)</td><td>tính từ</td><td>The new member is <b>quicker</b> than we expected.</td></tr>
<tr><td>sau <b>động từ thường</b></td><td>trạng từ</td><td>work <b>more carefully</b>, donate <b>more generously</b>, dance <b>more beautifully</b></td></tr></table>
<p><b>2. Cách tạo so sánh hơn</b></p>
<table><tr><th>Loại</th><th>Công thức</th><th>Ví dụ</th></tr>
<tr><td>Ngắn (1 âm tiết)</td><td>adj/adv + <b>-er</b> + than</td><td>hard → harder, high → higher, quick → quicker, fast → faster</td></tr>
<tr><td>Dài</td><td><b>more</b> + adj/adv + than</td><td>more expensive, more stressful, more carefully, more generously</td></tr>
<tr><td>Bất quy tắc</td><td>—</td><td>good / well → <b>better</b>; bad / badly → <b>worse</b></td></tr></table>
<p><b>3. Lỗi hay gặp:</b> không dùng cả more và -er (<s>more higher</s>, <s>more hard</s>); không thêm the (<s>the harder than</s>); không viết <s>quicklier</s>, <s>morequick</s>. Có thể thêm <b>much</b> trước so sánh hơn để nhấn mạnh: much harder.</p>
<p><b>4. Đổi câu:</b> A isn't as stressful as B → B is <b>more stressful</b> than A. A cooks better than B → B cooks <b>worse</b> than A.</p>`,
how:[`Tìm “than” → đây là câu so sánh hơn.`,`Nhìn từ đứng trước chỗ trống: <b>be</b> → tính từ; động từ thường → <b>trạng từ</b>.`,`Đếm âm tiết: ngắn thêm -er, dài dùng more.`,`Loại ngay đáp án sai cấu trúc: more + -er, the + so sánh hơn, trật tự “expensive more than”.`],
qs:[
 M('B3-5','Đề cương B.II – Câu 5 (= Câu 26)',`You need to work ______, or you will make a lot of mistakes.`,[`more careful`,`more carefully`,`less carefully`,`careful`],1,`Bổ nghĩa cho động từ <i>work</i> → trạng từ. Nghĩa: làm cẩn thận <b>hơn</b>, nếu không sẽ mắc lỗi → <b>more carefully</b>.`),
 M('B3-17','Đề cương B.II – Câu 17',`This year's exam was much ______ than last year's.`,[`the harder`,`harder`,`more hardly`,`more hard`],1,`hard là tính từ ngắn → <b>harder</b>. much + so sánh hơn để nhấn mạnh.`),
 M('B3-18','Đề cương B.II – Câu 18',`The growth rate of rice farms is ______ that of corn farms this year.`,[`higher more than`,`high more than`,`more higher than`,`higher than`],3,`high → <b>higher than</b>. Không dùng more cùng -er.`),
 M('B3-19','Đề cương B.II – Câu 19',`I think living in the city is ______ living in the countryside.`,[`more expensive than`,`expensive more than`,`as expensive more than`,`more than expensive`],0,`expensive là tính từ dài → <b>more expensive than</b>.`),
 M('B3-23','Đề cương B.II – Câu 23 (= Câu 38)',`It's not always true that rich people donate ______ than poor people.`,[`generously`,`more generously`,`most generously`,`more generous`],1,`Bổ nghĩa cho động từ <i>donate</i> → trạng từ; có “than” → <b>more generously</b>.`),
 M('B3-31','Đề cương B.II – Câu 31',`The new member is ______ than we expected.`,[`morequick`,`more quickly`,`quicklier`,`quicker`],3,`Sau <b>is</b> cần tính từ; quick ngắn → <b>quicker</b>.`),
 TY('B3-w2','Đề cương B.III – Câu 2',`Mai dances (beautifully) ______ than Hoa does.`,[`more beautifully`],`Bổ nghĩa cho động từ dances; beautifully là trạng từ dài → <b>more beautifully</b>.`),
 M('B3-x1','Luyện thêm',`Hoa runs ______ than her sister.`,[`fast`,`faster`,`more fast`,`more faster`],1,`fast (tính từ = trạng từ) → <b>faster</b>.`),
 M('B3-x2','Luyện thêm',`Life in the city is ______ than life in the countryside.`,[`stressfuler`,`more stressful`,`stressful`,`most stressful`],1,`stressful dài → <b>more stressful</b>.`),
 M('B3-x3','Luyện thêm',`My mother cooks better than her sister. → Her sister cooks ______ than my mother.`,[`better`,`worse`,`badder`,`more bad`],1,`Đảo hai người → đảo nghĩa: better ↔ <b>worse</b>.`)
]},
{id:'B4',sec:'B',name:'Từ nối & thì',title:'Connectors & tenses',sub:'Đề cương B.II, B.IV',
learn:`<p><b>1. Từ nối</b></p>
<table><tr><th>Quan hệ</th><th>Từ nối</th><th>Cấu trúc</th></tr>
<tr><td>Kết quả</td><td><b>so</b> (vì vậy)</td><td>S + V, <b>so</b> S + V</td></tr>
<tr><td>Kết quả</td><td><b>therefore</b> (do đó)</td><td>S + V; <b>therefore,</b> S + V</td></tr>
<tr><td>Tương phản</td><td><b>but</b> (nhưng)</td><td>S + V, <b>but</b> S + V</td></tr>
<tr><td>Tương phản</td><td><b>however</b> (tuy nhiên)</td><td>S + V; <b>however,</b> S + V</td></tr>
<tr><td>Thêm ý</td><td><b>and</b>, <b>moreover</b> (hơn nữa)</td><td>S + V; moreover, S + V</td></tr>
<tr><td>Nguyên nhân</td><td><b>for</b> (bởi vì)</td><td>S + V, <b>for</b> S + V</td></tr>
<tr><td>Điều kiện ngược</td><td><b>otherwise</b> (nếu không thì)</td><td>S + V; <b>otherwise,</b> S + V</td></tr>
<tr><td>Nhượng bộ</td><td><b>although</b> (mặc dù)</td><td><b>Although</b> S + V, S + V</td></tr></table>
<p>Mẹo: sau dấu <b>chấm phẩy (;)</b> và trước dấu phẩy thường là <b>therefore / however / moreover / otherwise</b>. Không dùng <s>; or,</s>.</p>
<p><b>2. Thì hiện tại tiếp diễn:</b> S + am/is/are + V-ing. Dấu hiệu: <b>Look! Listen!</b> now, at the moment. “The farmers” số nhiều → <b>are harvesting</b>.</p>
<p><b>3. Thì hiện tại đơn:</b> They <b>spend</b> (không phải <s>spends</s>), He spends. Đề cương in “They spends” là lỗi đánh máy.</p>`,
how:[`Đọc hai vế câu, hỏi: vế sau là <b>kết quả</b>, <b>tương phản</b>, <b>thêm ý</b> hay <b>nếu không thì</b>?`,`Kết quả → so / therefore; tương phản → but / however; thêm ý → and / moreover; nếu không thì → otherwise.`,`Xem dấu câu: “, ___ S V” → so, but, and, for; “; ___, S V” → therefore, however, moreover, otherwise.`,`Câu có Look!/Listen! → hiện tại tiếp diễn; chia be theo chủ ngữ.`],
qs:[
 M('B4-4','Đề cương B.II – Câu 4',`Look! The farmers ______ rice in the large paddy field.`,[`harvest`,`harvests`,`is harvesting`,`are harvesting`],3,`<b>Look!</b> → hiện tại tiếp diễn; The farmers số nhiều → <b>are harvesting</b>.`),
 M('B4-21','Đề cương B.II – Câu 21 (= Câu 37)',`They spend a lot of time surfing the net; ______, they have little time to read books.`,[`therefore`,`although`,`however`,`otherwise`],0,`Vế sau là <b>kết quả</b> (dành nhiều thời gian lướt mạng → ít thời gian đọc sách) → <b>therefore</b>.`),
 M('B4-25','Đề cương B.II – Câu 25 (= Câu 30)',`Nam didn't study hard, ______ he failed the exam.`,[`but`,`so`,`and`,`for`],1,`Không học chăm → trượt: quan hệ <b>kết quả</b> → <b>so</b>.`),
 M('B4-33','Đề cương B.II – Câu 33',`This village is beautiful and peaceful; ______, many people from the city go there to enjoy their weekends.`,[`although`,`however`,`moreover`,`therefore`],3,`Đẹp và yên bình → nhiều người đến: <b>kết quả</b> → <b>therefore</b>.`),
 E('B4-e5','Đề cương B.IV – Câu 5',[`Mi `,[`loves`,'A'],` playing `,[`sport,`,'B'],` `,[`so`,'C'],` his brother `,[`hates`,'D'],` it.`],'C',`so → but`,`Mi thích – anh trai ghét: hai ý <b>tương phản</b> → dùng <b>but</b>, không dùng so.`),
 E('B4-e6','Đề cương B.IV – Câu 6',[`You must `,[`work`,'A'],` `,[`hard`,'B'],`; `,[`or,`,'C'],` you `,[`will fail`,'D'],` the exam.`],'C',`or → otherwise`,`Sau dấu chấm phẩy và trước dấu phẩy dùng <b>otherwise</b> (nếu không thì).`),
 M('B4-x1','Luyện thêm',`It rained heavily, ______ we stayed at home.`,[`but`,`so`,`for`,`or`],1,`Mưa to → ở nhà: kết quả → <b>so</b>.`),
 M('B4-x2','Luyện thêm',`I like badminton; ______, I don't like football.`,[`therefore`,`however`,`moreover`,`so`],1,`Thích – không thích: tương phản → <b>however</b>.`)
]},
{id:'B5',sec:'B',name:'Từ vựng & giao tiếp',title:'Vocabulary & communication',sub:'Đề cương B.II – Unit 1, 2, 3',
learn:`<table><tr><th>Từ / cụm từ</th><th>Nghĩa</th><th>Câu trong đề cương</th></tr>
<tr><td>forum</td><td>diễn đàn</td><td>post questions to discuss on a <b>forum</b></td></tr>
<tr><td>load … onto the ox-drawn cart</td><td>chất … lên xe bò kéo</td><td>helped his parents <b>load</b> the rice</td></tr>
<tr><td>do DIY</td><td>tự làm đồ</td><td><b>Doing</b> DIY means you do things yourself</td></tr>
<tr><td>crafts</td><td>đồ thủ công (gốm, khắc gỗ)</td><td>making <b>crafts</b>, such as pottery</td></tr>
<tr><td>surf the Internet / net</td><td>lướt mạng</td><td>like <b>surfing</b> the Internet</td></tr>
<tr><td>vast</td><td>rộng lớn</td><td>a <b>vast</b> expanse of grassland</td></tr>
<tr><td>harvesting season</td><td>mùa thu hoạch</td><td>at the end of the <b>harvesting</b> season</td></tr>
<tr><td>friendly and hospitable</td><td>thân thiện và hiếu khách</td><td>They are so <b>friendly</b> and hospitable</td></tr>
<tr><td>catch fish</td><td>bắt cá</td><td>helped his parents <b>catch</b> fish</td></tr>
<tr><td>paddy field</td><td>ruộng lúa nước</td><td><b>Paddy</b> field is a field planted with rice</td></tr></table>
<p><b>Nhận lời mời:</b> “Would you like to …?” → <b>I'd love to. Thanks.</b> / Từ chối: I'm sorry, I can't.</p>`,
how:[`Đọc cả câu, tìm từ đi kèm (collocation): load + rice, catch + fish, surf + the Internet, do + DIY.`,`Câu định nghĩa (“… is a field planted with rice”) → chọn từ đúng nghĩa.`,`Câu giao tiếp: xác định chức năng (mời, khen, cảm ơn) rồi chọn câu đáp lại đúng chức năng.`],
qs:[
 M('B5-6','Đề cương B.II – Câu 6 (= Câu 39)',`We often post many questions to discuss on a/an ______ after school.`,[`forum`,`market`,`club`,`office`],0,`Đăng câu hỏi để thảo luận trên mạng → <b>forum</b> (diễn đàn).`),
 M('B5-10','Đề cương B.II – Câu 10',`Nam helped his parents ______ the rice onto the ox-drawn cart.`,[`load`,`collect`,`dry`,`ride`],0,`<b>load</b> sth onto…: chất lên. (help sb + V nguyên mẫu)`),
 M('B5-11','Đề cương B.II – Câu 11',`______ DIY means you do things yourself without the help of experts.`,[`Playing`,`Doing`,`Making`,`Taking`],1,`Cụm cố định: <b>do DIY</b> (do-it-yourself).`),
 M('B5-12','Đề cương B.II – Câu 12',`She loves making ______, such as pottery and carving wood.`,[`crafts`,`origami`,`stamps`,`bracelets`],0,`Gốm, khắc gỗ là <b>crafts</b> (đồ thủ công).`),
 M('B5-14','Đề cương B.II – Câu 14',`Many people like ______ the Internet with their mobile phones.`,[`surfing`,`blogging`,`emailing`,`communicating`],0,`<b>surf</b> the Internet: lướt mạng.`),
 M('B5-15','Đề cương B.II – Câu 15',`The farm has a ______ expanse of grassland for us to play football.`,[`vast`,`short`,`limited`,`narrow`],0,`Đủ rộng để đá bóng → <b>vast</b> (rộng lớn).`),
 M('B5-16','Đề cương B.II – Câu 16',`They got about 30 million tons of grain at the end of the ______ season.`,[`planting`,`watering`,`fertilising`,`harvesting`],3,`Thu được 30 triệu tấn lúa → cuối mùa <b>thu hoạch</b> (harvesting).`),
 M('B5-20','Đề cương B.II – Câu 20 (= Câu 36)',`I love the people in my village. They are so ______ and hospitable.`,[`vast`,`friendly`,`slow`,`inconvenient`],1,`Tính từ tả người, cùng nghĩa tích cực với hospitable → <b>friendly</b>.`),
 M('B5-27','Đề cương B.II – Câu 27',`Nam helped his parents ______ fish from nearby ponds.`,[`catch`,`keep`,`hold`,`ride`],0,`<b>catch</b> fish: bắt cá.`),
 M('B5-34','Đề cương B.II – Câu 34',`“Would you like to play basketball with me this Saturday morning?” – “______”`,[`I prefer football.`,`I'd love to. Thanks.`,`Playing basketball is fun.`,`I love watching basketball with my brother.`],1,`Đáp lại lời mời “Would you like to…?” → <b>I'd love to. Thanks.</b>`),
 M('B5-40','Đề cương B.II – Câu 40',`______ field is a field planted with rice growing in water.`,[`Paddy`,`Grass`,`Pasture`,`Wheat`],0,`<b>paddy field</b>: ruộng lúa nước.`),
 MT('B5-m1',[[`forum`,`diễn đàn`],[`crafts`,`đồ thủ công`],[`vast`,`rộng lớn`],[`ox-drawn cart`,`xe bò kéo`],[`sociable`,`hòa đồng`]]),
 MT('B5-m2',[[`upload`,`tải lên`],[`harvest`,`thu hoạch`],[`detest`,`ghét`],[`fancy`,`thích`],[`rely on`,`dựa vào`]])

/* ---------------- C. READING ---------------- */
{id:'C1',sec:'C',name:'Đọc I',title:'Reading I – Country life',sub:'Ưu và nhược điểm của sống ở nông thôn',
passage:{en:[`Living in the country is something that people from the city often dream about. However, in reality, it has both advantages and disadvantages.`,`There are certainly many advantages of living in the country. First, you can enjoy peace and quietness. Moreover, people tend to be friendlier. A further advantage is that there is less traffic, so it is safer for young children.`,`However, there are certain disadvantages or drawbacks to life outside the city. First, because there are fewer people, you are likely to have few friends. In addition, entertainment is difficult to find, particularly in the evening. Furthermore, there are fewer shops and services so it is quite hard to find jobs. As a result, you may have to travel a long way to work, which can be extremely expensive.`,`In conclusion, it can be seen that the country is more suitable for some people than others. On the whole, it is often the best place for those who are retired or who have young children. In contrast, young or single people who have a career are better provided for in the city.`],
vi:[`Sống ở nông thôn là điều mà người thành phố thường mơ ước. Tuy nhiên, trên thực tế, nó có cả ưu điểm lẫn nhược điểm.`,`Chắc chắn có nhiều ưu điểm khi sống ở nông thôn. Thứ nhất, bạn có thể tận hưởng sự yên bình và tĩnh lặng. Hơn nữa, con người có xu hướng thân thiện hơn. Một ưu điểm nữa là có ít xe cộ hơn, vì vậy an toàn hơn cho trẻ nhỏ.`,`Tuy nhiên, cuộc sống bên ngoài thành phố có những nhược điểm hay bất lợi nhất định. Thứ nhất, vì có ít người hơn nên bạn có thể có ít bạn bè. Ngoài ra, khó tìm được hoạt động giải trí, đặc biệt là vào buổi tối. Hơn nữa, có ít cửa hàng và dịch vụ hơn nên khá khó tìm việc làm. Kết quả là bạn có thể phải đi một quãng đường xa để làm việc, điều này có thể cực kỳ tốn kém.`,`Tóm lại, có thể thấy nông thôn phù hợp với một số người hơn những người khác. Nhìn chung, đó thường là nơi tốt nhất cho những người đã nghỉ hưu hoặc có con nhỏ. Ngược lại, những người trẻ hoặc độc thân đang theo đuổi sự nghiệp thì được đáp ứng tốt hơn ở thành phố.`]},
vocab:[[`advantage`,`ưu điểm`],[`disadvantage / drawback`,`nhược điểm`],[`peace and quietness`,`sự yên bình, tĩnh lặng`],[`tend to`,`có xu hướng`],[`traffic`,`xe cộ, giao thông`],[`entertainment`,`sự giải trí`],[`services`,`dịch vụ`],[`suitable`,`phù hợp`],[`retired`,`đã nghỉ hưu`],[`career`,`sự nghiệp`]],
how:HOW_READ,
qs:[
 M('C1-1','Đề cương C.I – Câu 1',`How many advantages does living in the country have?`,[`Three`,`Two`,`Four`,`No`],0,`Đoạn 2 nêu 3 ưu điểm: (1) peace and quietness, (2) people are friendlier, (3) less traffic → <b>Three</b>.`),
 M('C1-2','Đề cương C.I – Câu 2',`Having few friends is ______.`,[`one of the drawbacks to life in the country`,`one of the certain drawbacks to life outside the city`,`the only disadvantage of living in the country`,`one of the certain advantages to life outside the city`],1,`Bài viết: “there are <b>certain disadvantages or drawbacks to life outside the city</b>. First… you are likely to have few friends.” B khớp nguyên văn bài nhất. C sai vì “only”, D sai vì “advantages”.`),
 M('C1-3','Đề cương C.I – Câu 3',`Living in the country is safer for young children because ______.`,[`there are few shops`,`there are few services`,`there is less traffic`,`there are fewer people`],2,`“there is <b>less traffic</b>, so it is safer for young children.”`),
 M('C1-4','Đề cương C.I – Câu 4',`According to the passage, living in the country has ______.`,[`only bad points`,`both good and bad points`,`only good points`,`no disadvantages`],1,`“it has <b>both advantages and disadvantages</b>” = both good and bad points.`),
 M('C1-5','Đề cương C.I – Câu 5',`Which of the following statements is NOT true according to the passage?`,[`There are fewer shops and services in the country.`,`It's hard to find entertainment in the country.`,`People in the country tend to be friendlier than people in the city.`,`The country is only suitable for retired people.`],3,`Bài nói nông thôn tốt nhất cho người nghỉ hưu <b>hoặc người có con nhỏ</b> → câu D có “only” là sai.`),
 MT('C1-m',[[`drawback`,`nhược điểm`],[`retired`,`đã nghỉ hưu`],[`suitable`,`phù hợp`],[`traffic`,`xe cộ`],[`career`,`sự nghiệp`]])
]},
{id:'C2',sec:'C',name:'Đọc II',title:'Reading II – Dealing with stress',sub:'Cách đối phó với căng thẳng',
passage:{en:[`Today teenagers live in a very competitive world so it is very common for young people to feel stressed out from time to time. They are also trying to do so many tasks that it becomes harder and harder to balance study, relaxation and friends.`,`There are different ways of dealing with stress. A good way to deal with stress is to exercise. Research has proved that physical exercise is a good **release** for stress, because it increases certain chemicals in the brain which calm people down. Getting enough sleep is also an important way of avoiding stress and staying healthy and full of energy. Another way to avoid stress is by managing time effectively. It is better to do several tasks really well than performing too many tasks badly. Finally, if **it** all gets beyond their control, teenagers shouldn't panic. Find the time to sit down quietly and breathe deeply for ten to twenty minutes. Do this regularly, and it will help them calm down and put things in order.`],
vi:[`Ngày nay thanh thiếu niên sống trong một thế giới rất cạnh tranh nên việc người trẻ thỉnh thoảng cảm thấy căng thẳng là rất phổ biến. Các em cũng đang cố làm quá nhiều việc đến mức ngày càng khó cân bằng giữa học tập, thư giãn và bạn bè.`,`Có nhiều cách khác nhau để đối phó với căng thẳng. Một cách tốt là tập thể dục. Nghiên cứu đã chứng minh vận động thể chất là cách <b>giải tỏa</b> căng thẳng tốt, vì nó làm tăng một số chất hóa học trong não giúp con người bình tĩnh lại. Ngủ đủ giấc cũng là cách quan trọng để tránh căng thẳng, giữ sức khỏe và tràn đầy năng lượng. Một cách khác là quản lý thời gian hiệu quả. Làm thật tốt vài việc thì tốt hơn làm quá nhiều việc mà làm kém. Cuối cùng, nếu <b>nó</b> (sự căng thẳng) vượt ngoài tầm kiểm soát, các em không nên hoảng loạn. Hãy dành thời gian ngồi yên lặng và hít thở sâu trong mười đến hai mươi phút. Làm việc này thường xuyên sẽ giúp các em bình tĩnh lại và sắp xếp mọi việc có trật tự.`]},
vocab:[[`competitive`,`cạnh tranh`],[`stressed out`,`bị căng thẳng`],[`balance`,`cân bằng`],[`deal with`,`đối phó với`],[`release`,`sự giải tỏa (= getting rid of)`],[`calm down`,`bình tĩnh lại`],[`manage time effectively`,`quản lý thời gian hiệu quả`],[`beyond control`,`ngoài tầm kiểm soát`],[`panic`,`hoảng loạn`],[`breathe deeply`,`hít thở sâu`]],
how:HOW_READ,
qs:[
 M('C2-1','Đề cương C.II – Câu 1',`Why do teenagers feel stressed?`,[`Because they are very competitive.`,`Because they don't have friends.`,`Because they do a great number of tasks.`,`Because they don't relax.`],2,`“They are also trying to do <b>so many tasks</b>…” = a great number of tasks. (A sai: thế giới cạnh tranh, không phải các em.)`),
 M('C2-2','Đề cương C.II – Câu 2',`Which has the closest meaning with the word <u>release</u>?`,[`getting rid of`,`treatment`,`freedom`,`start`],0,`release for stress = cách giải tỏa căng thẳng ≈ <b>getting rid of</b> (loại bỏ).`),
 M('C2-3','Đề cương C.II – Câu 3',`Which is NOT mentioned in the text as a way of dealing with stress?`,[`Taking medicine.`,`Doing physical exercise.`,`Managing time well.`,`Having enough sleep.`],0,`Bài nhắc exercise, sleep, managing time, breathing – không nhắc <b>uống thuốc</b>.`),
 M('C2-4','Đề cương C.II – Câu 4',`In the second paragraph, what does the word <u>it</u> refer to?`,[`tasks`,`control`,`stress`,`time`],2,`“if <b>it</b> all gets beyond their control” – điều vượt tầm kiểm soát chính là <b>stress</b>.`),
 M('C2-5','Đề cương C.II – Câu 5',`What is the best title for this text?`,[`Ways of coping with stress`,`Causes of stress`,`Effects of stress on teenagers`,`Life with stress`],0,`Phần lớn bài nói về các cách đối phó với căng thẳng → <b>Ways of coping with stress</b>.`),
 MT('C2-m',[[`release`,`sự giải tỏa`],[`competitive`,`cạnh tranh`],[`panic`,`hoảng loạn`],[`calm down`,`bình tĩnh lại`],[`balance`,`cân bằng`]])
]},
{id:'C3',sec:'C',name:'Đọc III',title:'Reading III – Playing the guitar',sub:'Sở thích chơi đàn ghi-ta',
passage:{en:[`The most interesting hobby that I have is playing the guitar. I have played guitar for three and a half years now and I am getting better at it every time I decide to play. Playing guitar keeps me doing something interesting at home instead of staring at the ceiling all the time. Actually it is a very relaxing activity. It gives person some time to think and dream.`,`Guitar or guitars also give my room some personality. When it hangs on my wall it seems like a piece of art. I have two guitars - one is black acoustic one and the second is a yellow Spanish guitar. The last one was my first guitar and both of them are Yamaha products. I bought the classical one because it was required to learn guitar in my school. Since I am interested in blues, jazz and rock music I felt that I needed a change in my guitar play and that is why I bought the black acoustic one.`,`I can play many different songs and after 3 years of experience I have learned how to learn the songs to play them. My favourite songs that I have learned are Led Zeppelin's Stairway to Heaven and Leonard Cohen's Hallelujah. I can also play a bit of Sting, Nirvana, Metallica and the Animals.`,`In the future I want to improve my guitar playing skills and maybe use them in some small band or I would just like to play with my friends. I would certainly recommend learning guitar. If interest in it comes, it cannot be put away.`],
vi:[`Sở thích thú vị nhất của tôi là chơi đàn ghi-ta. Tôi đã chơi ghi-ta được ba năm rưỡi và mỗi lần chơi tôi lại giỏi hơn. Chơi ghi-ta giúp tôi có việc thú vị để làm ở nhà thay vì lúc nào cũng nhìn chằm chằm lên trần nhà. Thật ra đó là một hoạt động rất thư giãn. Nó cho người ta thời gian để suy nghĩ và mơ mộng.`,`Những cây đàn cũng làm cho căn phòng của tôi có cá tính. Khi treo trên tường, nó trông như một tác phẩm nghệ thuật. Tôi có hai cây đàn – một cây acoustic màu đen và cây kia là đàn Tây Ban Nha màu vàng. Cây đàn màu vàng là cây đàn đầu tiên của tôi, và cả hai đều là sản phẩm của Yamaha. Tôi mua cây đàn cổ điển (đàn Tây Ban Nha) vì trường bắt buộc học ghi-ta. Vì tôi thích nhạc blues, jazz và rock nên tôi thấy cần thay đổi cách chơi, và đó là lý do tôi mua cây acoustic màu đen.`,`Tôi có thể chơi nhiều bài hát khác nhau và sau 3 năm kinh nghiệm, tôi đã biết cách tự tập các bài để chơi. Những bài tôi thích nhất mà tôi đã học là Stairway to Heaven của Led Zeppelin và Hallelujah của Leonard Cohen. Tôi cũng chơi được một chút nhạc của Sting, Nirvana, Metallica và The Animals (tên các ban nhạc, ca sĩ).`,`Trong tương lai, tôi muốn nâng cao kỹ năng chơi đàn và có thể dùng nó trong một ban nhạc nhỏ, hoặc chỉ đơn giản là chơi cùng bạn bè. Tôi chắc chắn khuyên mọi người học ghi-ta. Một khi đã thích thì không thể bỏ được.`]},
vocab:[[`hobby`,`sở thích`],[`relaxing`,`thư giãn`],[`stare at`,`nhìn chằm chằm`],[`ceiling`,`trần nhà`],[`personality`,`cá tính`],[`acoustic guitar`,`đàn ghi-ta mộc`],[`classical`,`cổ điển`],[`required`,`bắt buộc`],[`improve`,`nâng cao, cải thiện`],[`band`,`ban nhạc`],[`recommend`,`khuyên, giới thiệu`]],
how:HOW_READ,
qs:[
 M('C3-1','Đề cương C.III – Câu 1',`The first paragraph is mainly about ______.`,[`why playing the guitar is the author's most interesting hobby`,`the author's good feelings about playing the guitar`,`how the author chose to play the guitar and the benefits of playing it`,`the author's hobby of playing the guitar and some of its benefits`],3,`Đoạn 1 giới thiệu sở thích chơi ghi-ta và lợi ích của nó (có việc thú vị để làm, thư giãn, suy nghĩ và mơ mộng) → <b>D</b>.`),
 M('C3-2','Đề cương C.III – Câu 2',`According to the second paragraph, the author's second guitar is ______.`,[`a Spanish one`,`black`,`not an acoustic one`,`not a classical one`],1,`Cây đầu tiên là đàn Tây Ban Nha màu vàng (“The last one was my first guitar”) → cây thứ hai, mua sau, là cây acoustic <b>màu đen</b>.`),
 M('C3-3','Đề cương C.III – Câu 3',`Why did the author buy the acoustic guitar?`,[`Because the author likes to play blues, jazz and rock music`,`Because the author was required to learn guitar in school`,`Because the other guitar can't play classical music`,`Because the author wanted to change his current one`],0,`“Since I am interested in <b>blues, jazz and rock</b> music… that is why I bought the black acoustic one.”`),
 M('C3-4','Đề cương C.III – Câu 4',`What does the phrase “the Animals” in the third paragraph possibly refer to?`,[`a song`,`a music band`,`some kinds of animals`,`none of above`],1,`Đứng cùng Sting, Nirvana, Metallica (ca sĩ, ban nhạc) → <b>a music band</b>.`),
 M('C3-5','Đề cương C.III – Câu 5',`We learn from the passage that ______.`,[`the author plays the guitar because he usually does nothing in his free time`,`the author has totally four guitars`,`the author can play different songs of different types of music`,`the author will continue to play the guitar in the future`],2,`“I can play <b>many different songs</b>” (rock, blues…). B sai (2 cây). D chưa chắc chắn: tác giả chỉ “want” và “maybe”. A sai.`),
 MT('C3-m',[[`ceiling`,`trần nhà`],[`personality`,`cá tính`],[`required`,`bắt buộc`],[`recommend`,`khuyên`],[`band`,`ban nhạc`]])
]},
{id:'C4',sec:'C',name:'Đọc IV',title:'Reading IV – Joining clubs',sub:'Hội thoại Mai và Tom (True / False)',
passage:{en:[`<b>Mai:</b> Tom, so which club do you want to join?`,`<b>Tom:</b> I'm interested in 2 clubs: badminton and chess.`,`<b>Mai:</b> I like badminton, too. It's relaxing.`,`<b>Tom:</b> Yes, I play it to keep fit. So let's join that club together.`,`<b>Mai:</b> Ok. It's on Tuesdays and Fridays from 5:00 p.m. to 6:30 p.m. It starts 30 minutes after school, so we have enough time to get some snacks beforehand. I know you like chess. Will you join the chess club?`,`<b>Tom:</b> Well, I started playing it 5 years ago. My mum first sent me to a chess club because she wanted me to be more focused. Now I find that I can concentrate better. Do you like chess? Let's join the chess club too.`,`<b>Mai:</b> Actually, this year there is a new arts and crafts club, and I want to join it. I hear that the members will work together in small community service projects. Members can do art projects and also improve their practical skills and teamwork skills too.`],
vi:[`<b>Mai:</b> Tom, vậy bạn muốn tham gia câu lạc bộ nào?`,`<b>Tom:</b> Mình thích 2 câu lạc bộ: cầu lông và cờ vua.`,`<b>Mai:</b> Mình cũng thích cầu lông. Nó giúp thư giãn.`,`<b>Tom:</b> Ừ, mình chơi để giữ dáng. Vậy tụi mình cùng vào CLB đó nhé.`,`<b>Mai:</b> Được. CLB sinh hoạt thứ Ba và thứ Sáu, từ 5 giờ đến 6 giờ 30 chiều. Nó bắt đầu 30 phút sau giờ tan học nên tụi mình có đủ thời gian ăn nhẹ trước. Mình biết bạn thích cờ vua. Bạn có vào CLB cờ vua không?`,`<b>Tom:</b> À, mình bắt đầu chơi cờ từ 5 năm trước. Lúc đầu mẹ gửi mình vào CLB cờ vua vì mẹ muốn mình tập trung hơn. Giờ mình thấy mình tập trung tốt hơn. Bạn có thích cờ vua không? Mình cùng vào CLB cờ vua nữa nhé.`,`<b>Mai:</b> Thật ra năm nay có CLB mỹ thuật và thủ công mới, mình muốn tham gia. Nghe nói các thành viên sẽ cùng làm những dự án phục vụ cộng đồng nhỏ. Thành viên có thể làm dự án mỹ thuật, đồng thời cải thiện kỹ năng thực hành và kỹ năng làm việc nhóm.`]},
vocab:[[`join`,`tham gia`],[`keep fit`,`giữ dáng`],[`snacks`,`đồ ăn nhẹ`],[`beforehand`,`trước đó`],[`focused`,`tập trung`],[`concentrate`,`tập trung`],[`arts and crafts`,`mỹ thuật và thủ công`],[`community service project`,`dự án phục vụ cộng đồng`],[`practical skills`,`kỹ năng thực hành`],[`teamwork`,`làm việc nhóm`]],
how:[`Đọc từng câu True/False, gạch chân từ khóa.`,`Tìm lời thoại chứa từ khóa và so sánh <b>từng chi tiết</b>.`,`Thông tin không có trong bài hoặc ngược với bài → F.`,`Bẫy thời gian: “5 years ago” (5 năm trước) ≠ “when he was five” (lúc 5 tuổi).`],
qs:[
 TF('C4-1','Đề cương C.IV – Câu 1',`Mai likes soccer.`,false,`Mai nói “I like <b>badminton</b>, too.” Bài không nhắc bóng đá → F.`),
 TF('C4-2','Đề cương C.IV – Câu 2',`The school has badminton, chess, and arts and crafts clubs.`,true,`Bài nhắc cả 3 CLB: badminton, chess và “a new arts and crafts club” → T.`),
 TF('C4-3','Đề cương C.IV – Câu 3',`The badminton club activities are after school.`,true,`“It starts <b>30 minutes after school</b>” → T.`),
 TF('C4-4','Đề cương C.IV – Câu 4',`Tom started playing chess when he was five.`,false,`Tom: “I started playing it <b>5 years ago</b>” = 5 năm trước, không phải lúc 5 tuổi → F.`),
 TF('C4-5','Đề cương C.IV – Câu 5',`Members of the arts and crafts club do community activities.`,true,`“the members will work together in small <b>community service projects</b>” → T.`),
 MT('C4-m',[[`keep fit`,`giữ dáng`],[`beforehand`,`trước đó`],[`concentrate`,`tập trung`],[`teamwork`,`làm việc nhóm`],[`snacks`,`đồ ăn nhẹ`]])
]},
{id:'C5',sec:'C',name:'Đọc V',title:'Reading V – My favourite hobby',sub:'Điền từ: reading, to do, but, when, an, a, what',
passage:{en:[`My favourite hobby is reading. I enjoy (1) ______ a book when I am free. I started (2) ______ it when I was four years old. The first time I read books, I felt interested. So I kept reading. The teachers always taught me to read the difficult words. I was happy when I read a story with a happy ending. I was thrilled (3) ______ I read a detective story. I enjoy reading because I like to explore the imaginative world of my favourite author, J. K. Rowling, who wrote the Harry Potter series. There are a lot of advantages of reading. Reading can make me relaxed and calm. I can also learn new vocabulary items. Then I can further improve my English. Moreover, it can give me (4) ______ unlimited imagination, so I can write books in the future. I can learn the different cultures and customs of other countries in the world too. I read at least one hour every day. I read books by myself. I usually read it at home. I wish I could read different kinds of books (5) ______ it might be very challenging.`],
vi:[`Sở thích của tôi là đọc sách. Tôi thích (1) <b>đọc</b> sách khi rảnh. Tôi bắt đầu (2) <b>làm việc đó</b> khi tôi bốn tuổi. Lần đầu đọc sách, tôi thấy thích thú. Vì vậy tôi tiếp tục đọc. Thầy cô luôn dạy tôi đọc những từ khó. Tôi vui khi đọc một câu chuyện có kết thúc có hậu. Tôi hồi hộp (3) <b>khi</b> đọc truyện trinh thám. Tôi thích đọc vì tôi thích khám phá thế giới tưởng tượng của tác giả yêu thích là J. K. Rowling, người viết bộ truyện Harry Potter. Đọc sách có rất nhiều lợi ích. Đọc sách giúp tôi thư giãn và bình tĩnh. Tôi cũng học được từ vựng mới, từ đó nâng cao tiếng Anh. Hơn nữa, nó cho tôi (4) <b>một</b> trí tưởng tượng vô hạn để tôi có thể viết sách trong tương lai. Tôi cũng tìm hiểu được văn hóa và phong tục của các nước khác. Tôi đọc ít nhất một giờ mỗi ngày. Tôi tự đọc sách, thường đọc ở nhà. Tôi ước mình có thể đọc nhiều loại sách khác nhau (5) <b>nhưng</b> điều đó có thể rất thử thách.`]},
vocab:[[`enjoy + V-ing`,`thích làm gì`],[`thrilled`,`hồi hộp, phấn khích`],[`detective story`,`truyện trinh thám`],[`explore`,`khám phá`],[`imaginative`,`giàu tưởng tượng`],[`author`,`tác giả`],[`advantage`,`lợi ích`],[`unlimited imagination`,`trí tưởng tượng vô hạn`],[`customs`,`phong tục`],[`challenging`,`thử thách`]],
how:[`Gạch bỏ dần các từ trong khung khi đã dùng.`,`Sau <b>enjoy</b> → V-ing; sau <b>start</b> → to V hoặc V-ing.`,`Nối hai mệnh đề chỉ thời gian → <b>when</b>; tương phản → <b>but</b>.`,`Trước tính từ bắt đầu bằng nguyên âm (unlimited /ʌn-/) → <b>an</b>.`,`Khung có 7 từ cho 5 chỗ trống: 2 từ thừa (<b>a</b>, <b>what</b>).`],
qs:[
 M('C5-1','Đề cương C.V – Câu 1',`I enjoy (1) ______ a book when I am free.`,[`reading`,`to do`,`but`,`when`,`an`,`a`,`what`],0,`enjoy + V-ing → <b>reading</b>.`),
 M('C5-2','Đề cương C.V – Câu 2',`I started (2) ______ it when I was four years old.`,[`reading`,`to do`,`but`,`when`,`an`,`a`,`what`],1,`start + to V; “reading” đã dùng ở câu 1 → <b>to do</b> it (làm việc đó = đọc sách).`),
 M('C5-3','Đề cương C.V – Câu 3',`I was thrilled (3) ______ I read a detective story.`,[`reading`,`to do`,`but`,`when`,`an`,`a`,`what`],3,`Nối mệnh đề chỉ thời gian: hồi hộp <b>khi</b> đọc truyện → <b>when</b>.`),
 M('C5-4','Đề cương C.V – Câu 4',`It can give me (4) ______ unlimited imagination.`,[`reading`,`to do`,`but`,`when`,`an`,`a`,`what`],4,`unlimited bắt đầu bằng nguyên âm /ʌ/ → <b>an</b>.`),
 M('C5-5','Đề cương C.V – Câu 5',`I wish I could read different kinds of books (5) ______ it might be very challenging.`,[`reading`,`to do`,`but`,`when`,`an`,`a`,`what`],2,`Muốn đọc nhiều loại sách – <b>nhưng</b> có thể rất khó: tương phản → <b>but</b>.`),
 MT('C5-m',[[`thrilled`,`hồi hộp`],[`detective story`,`truyện trinh thám`],[`explore`,`khám phá`],[`customs`,`phong tục`],[`challenging`,`thử thách`]])
]},
{id:'C6',sec:'C',name:'Đọc VI',title:'Reading VI – Moving to the city',sub:'Điền từ: đô thị hóa',
passage:{en:[`Today, people all over the world are moving out of small villages in the country to go and live in big, noisy cities. They are moving from the peaceful mountains, fields and rivers of the countryside to the busy world of streets, buildings, traffic and (1) ______. This movement from rural areas to urban areas has been going on for over two hundred years.`,`In many countries, the main reason why people come to live in towns and cities is work. After one or two large factories have been built in a town, people come to find work and a better (2) ______, and soon an industrial area begins to grow. There is usually a residential area nearby where the factory workers can live. The families of these workers need schools, shops and hospitals, (3) ______ more people come to live in the area to provide these services - and so a city grows.`,`A lot of people live in the (4) ______ of the city, far away from the industrial area and the city centre. Some suburbs are pleasant, with nice houses and parks for children to play, but others are poor, with old houses and bad conditions.`,`But what is the future of the big cities? Will they continue to get bigger and bigger? Perhaps yes. Some major cities have actually become bigger in the last ten years and it is quite possible that one day we will see people (5) ______ of the countryside and go to bigger towns and cities.`],
vi:[`Ngày nay, người dân khắp thế giới đang rời những ngôi làng nhỏ ở nông thôn để đến sống ở các thành phố lớn, ồn ào. Họ rời những ngọn núi, cánh đồng và dòng sông yên bình của vùng quê để đến thế giới nhộn nhịp của đường phố, nhà cửa, xe cộ và (1) <b>đám đông</b>. Sự di chuyển từ nông thôn ra thành thị này đã diễn ra hơn hai trăm năm.`,`Ở nhiều nước, lý do chính khiến người ta đến sống ở thị trấn và thành phố là việc làm. Sau khi một hai nhà máy lớn được xây ở một thị trấn, người ta đến tìm việc và một (2) <b>cuộc sống</b> tốt hơn, và chẳng bao lâu một khu công nghiệp bắt đầu hình thành. Gần đó thường có một khu dân cư cho công nhân nhà máy sinh sống. Gia đình họ cần trường học, cửa hàng và bệnh viện, (3) <b>vì vậy</b> càng nhiều người đến sống ở khu vực này để cung cấp các dịch vụ đó – và thế là một thành phố lớn lên.`,`Nhiều người sống ở (4) <b>vùng ngoại ô</b> thành phố, cách xa khu công nghiệp và trung tâm. Một số khu ngoại ô dễ chịu, có nhà đẹp và công viên cho trẻ em vui chơi, nhưng số khác thì nghèo, nhà cũ và điều kiện tồi tệ.`,`Nhưng tương lai của các thành phố lớn sẽ ra sao? Chúng có tiếp tục ngày càng lớn hơn không? Có lẽ là có. Một số thành phố lớn đã thực sự lớn hơn trong mười năm qua, và rất có thể một ngày nào đó chúng ta sẽ thấy người dân (5) <b>rời khỏi</b> nông thôn để đến các thị trấn và thành phố lớn hơn.`]},
vocab:[[`rural / urban`,`nông thôn / thành thị`],[`crowds`,`đám đông`],[`factory`,`nhà máy`],[`industrial area`,`khu công nghiệp`],[`residential area`,`khu dân cư`],[`provide services`,`cung cấp dịch vụ`],[`suburbs`,`vùng ngoại ô`],[`conditions`,`điều kiện (sống)`],[`move out of`,`chuyển ra khỏi`],[`a better life`,`cuộc sống tốt hơn`]],
how:HOW_CLOZE,
qs:[
 M('C6-1','Đề cương C.VI – Câu 1',`…the busy world of streets, buildings, traffic and (1) ______.`,[`crowded`,`overcrowded`,`crowding`,`crowds`],3,`Liệt kê danh từ (streets, buildings, traffic) → cần danh từ: <b>crowds</b> (đám đông).`),
 M('C6-2','Đề cương C.VI – Câu 2',`…people come to find work and a better (2) ______.`,[`living`,`life`,`live`,`alive`],1,`Sau tính từ <i>better</i> cần danh từ; cụm quen thuộc <b>a better life</b>.`),
 M('C6-3','Đề cương C.VI – Câu 3',`…need schools, shops and hospitals, (3) ______ more people come to live in the area.`,[`but`,`or`,`so`,`and`],2,`Cần dịch vụ → nhiều người đến cung cấp: kết quả → <b>so</b>.`),
 M('C6-4','Đề cương C.VI – Câu 4',`A lot of people live in the (4) ______ of the city, far away from the industrial area and the city centre.`,[`urban`,`city centre`,`down town`,`suburbs`],3,`Xa trung tâm và khu công nghiệp → <b>suburbs</b> (ngoại ô); câu sau cũng nhắc “Some suburbs…”.`),
 M('C6-5','Đề cương C.VI – Câu 5',`…we will see people (5) ______ of the countryside and go to bigger towns and cities.`,[`moving out`,`coming`,`moving in`,`leaving`],0,`<b>move out of</b> + nơi chốn: chuyển ra khỏi. (leaving không đi với of.)`),
 MT('C6-m',[[`suburbs`,`vùng ngoại ô`],[`crowds`,`đám đông`],[`industrial area`,`khu công nghiệp`],[`residential area`,`khu dân cư`],[`rural`,`thuộc nông thôn`]])
]},
{id:'C7',sec:'C',name:'Đọc VII',title:'Reading VII – A letter from Mi',sub:'Điền từ: kỳ nghỉ hè ở quê',
passage:{en:[`Dear Elena,`,`Thanks for your email. Now I'll tell you about my summer holiday in my home town. I live in Ha Noi, (1) ______ my home town is Ninh Binh. My grandparents live there, in a small house near a paddy field. I went to stay with them in June. It was a wonderful holiday. Every morning, my grandma and I got up early and (2) ______ the pigs and chickens. When we finished, we cooked breakfast. After that, I (3) ______ fishing with my grandpa or helped my grandma with the gardening. In the afternoon, I went to the fields with some other children. They taught me to (4) ______ the buffaloes. Sometimes we flew kites or skipped rope together. In the evening, I drew pictures, read books, or watched TV with my grandparents. I went to bed quite early, at about 9 p.m.`,`I'm sending you a photo I took (5) ______ my grandparents' house. I hope you'll like it.`,`Love, Mi`],
vi:[`Elena thân mến,`,`Cảm ơn email của bạn. Giờ mình sẽ kể bạn nghe về kỳ nghỉ hè ở quê mình. Mình sống ở Hà Nội, (1) <b>nhưng</b> quê mình ở Ninh Bình. Ông bà mình sống ở đó, trong một ngôi nhà nhỏ gần ruộng lúa. Mình đến ở với ông bà vào tháng Sáu. Đó là một kỳ nghỉ tuyệt vời. Mỗi sáng, bà và mình dậy sớm và (2) <b>cho</b> lợn và gà <b>ăn</b>. Xong việc, chúng mình nấu bữa sáng. Sau đó, mình (3) <b>đi</b> câu cá với ông hoặc giúp bà làm vườn. Buổi chiều, mình ra đồng với mấy bạn nhỏ khác. Các bạn dạy mình (4) <b>chăn</b> trâu. Thỉnh thoảng tụi mình thả diều hoặc nhảy dây. Buổi tối, mình vẽ tranh, đọc sách hoặc xem TV với ông bà. Mình đi ngủ khá sớm, khoảng 9 giờ tối.`,`Mình gửi bạn một tấm ảnh mình chụp (5) <b>(của)</b> ngôi nhà của ông bà. Mong là bạn sẽ thích.`,`Thương mến, Mi`]},
vocab:[[`home town`,`quê nhà`],[`paddy field`,`ruộng lúa`],[`feed – fed – fed`,`cho ăn`],[`go fishing`,`đi câu cá`],[`gardening`,`làm vườn`],[`herd the buffaloes`,`chăn trâu`],[`fly kites`,`thả diều`],[`skip rope`,`nhảy dây`],[`a photo of`,`bức ảnh (chụp) cái gì`]],
how:[...HOW_CLOZE,`Bài kể chuyện đã qua (got up, cooked, went…) → động từ chia <b>quá khứ đơn</b>.`],
qs:[
 M('C7-1','Đề cương C.VII – Câu 1',`I live in Ha Noi, (1) ______ my home town is Ninh Binh.`,[`but`,`so`,`for`,`or`],0,`Sống ở Hà Nội – quê ở Ninh Bình: tương phản → <b>but</b>.`),
 M('C7-2','Đề cương C.VII – Câu 2',`Every morning, my grandma and I got up early and (2) ______ the pigs and chickens.`,[`feel`,`is feeling`,`fed`,`will feed`],2,`“got up … and ___”: cùng thì quá khứ đơn; feed → <b>fed</b> (cho ăn).`),
 M('C7-3','Đề cương C.VII – Câu 3',`After that, I (3) ______ fishing with my grandpa.`,[`could`,`went`,`did`,`played`],1,`<b>go fishing</b> → quá khứ: <b>went</b> fishing.`),
 M('C7-4','Đề cương C.VII – Câu 4',`They taught me to (4) ______ the buffaloes.`,[`run`,`get`,`go`,`herd`],3,`<b>herd</b> the buffaloes: chăn trâu.`),
 M('C7-5','Đề cương C.VII – Câu 5',`I'm sending you a photo I took (5) ______ my grandparents' house.`,[`for`,`of`,`on`,`next`],1,`a photo <b>of</b> sth: bức ảnh chụp cái gì.`),
 MT('C7-m',[[`fed`,`đã cho ăn`],[`herd`,`chăn (trâu)`],[`skip rope`,`nhảy dây`],[`gardening`,`làm vườn`],[`home town`,`quê nhà`]])
]},
{id:'C8',sec:'C',name:'Đọc VIII',title:'Reading VIII – Leisure activities',sub:'Điền từ: hoạt động giải trí',
passage:{en:[`Leisure activities are very important to people. There are a lot of activities they can do in their free time. The most (1) ______ type of leisure activities are those that are done just for fun. Often these activities do not need a special skill in order to do them. In many parts of the world, (2) ______ television is the number one leisure activity. Other popular choices include talking with friends, eating out, playing sports, travelling, and (3) ______ electronic games.`,`More serious leisure activities include working on a hobby, such as (4) ______ a model plane or working with pottery. People need to learn a special skill or have experience to do these types of leisure activities.`,`Leisure brings different rewards to different people. People usually feel happy and relaxed (5) ______ doing their leisure activities. They can also feel a sense of adventure and pride in their accomplishment.`],
vi:[`Hoạt động giải trí rất quan trọng với con người. Có rất nhiều hoạt động người ta có thể làm lúc rảnh. Loại hoạt động giải trí (1) <b>phổ biến</b> nhất là những hoạt động chỉ để cho vui. Thường thì chúng không cần kỹ năng đặc biệt nào. Ở nhiều nơi trên thế giới, (2) <b>xem</b> ti vi là hoạt động giải trí số một. Những lựa chọn phổ biến khác gồm trò chuyện với bạn bè, đi ăn ngoài, chơi thể thao, du lịch và (3) <b>chơi</b> trò chơi điện tử.`,`Những hoạt động giải trí nghiêm túc hơn gồm theo đuổi một sở thích, như (4) <b>lắp ráp</b> mô hình máy bay hoặc làm gốm. Người ta cần học kỹ năng đặc biệt hoặc có kinh nghiệm để làm những hoạt động này.`,`Giải trí mang lại những phần thưởng khác nhau cho những người khác nhau. Mọi người thường thấy vui vẻ và thư giãn (5) <b>khi</b> làm hoạt động giải trí. Họ cũng có thể cảm nhận tinh thần phiêu lưu và niềm tự hào về thành quả của mình.`]},
vocab:[[`leisure activity`,`hoạt động giải trí`],[`common`,`phổ biến`],[`special skill`,`kỹ năng đặc biệt`],[`eat out`,`đi ăn ngoài`],[`electronic games`,`trò chơi điện tử`],[`build a model plane`,`lắp mô hình máy bay`],[`pottery`,`đồ gốm`],[`reward`,`phần thưởng`],[`sense of adventure`,`tinh thần phiêu lưu`],[`accomplishment`,`thành quả`]],
how:HOW_CLOZE,
qs:[
 M('C8-1','Đề cương C.VIII – Câu 1',`The most (1) ______ type of leisure activities are those that are done just for fun.`,[`common`,`good`,`interesting`,`funny`],0,`Hoạt động chỉ để vui, không cần kỹ năng → loại <b>phổ biến</b> nhất: the most <b>common</b>.`),
 M('C8-2','Đề cương C.VIII – Câu 2',`In many parts of the world, (2) ______ television is the number one leisure activity.`,[`having`,`spending`,`watching`,`using`],2,`<b>watch</b> television: xem ti vi.`),
 M('C8-3','Đề cương C.VIII – Câu 3',`…eating out, playing sports, travelling, and (3) ______ electronic games.`,[`getting`,`having`,`doing`,`playing`],3,`<b>play</b> games: chơi trò chơi.`),
 M('C8-4','Đề cương C.VIII – Câu 4',`…such as (4) ______ a model plane or working with pottery.`,[`buying`,`taking`,`building`,`doing`],2,`Sở thích cần kỹ năng: <b>build</b> a model plane (lắp ráp mô hình máy bay).`),
 M('C8-5','Đề cương C.VIII – Câu 5',`People usually feel happy and relaxed (5) ______ doing their leisure activities.`,[`when`,`if`,`why`,`where`],0,`Cảm thấy vui <b>khi</b> làm → <b>when</b> + V-ing.`),
 MT('C8-m',[[`common`,`phổ biến`],[`pottery`,`đồ gốm`],[`reward`,`phần thưởng`],[`accomplishment`,`thành quả`],[`eat out`,`đi ăn ngoài`]])
]},
{id:'C9',sec:'C',name:'Đọc IX',title:'Reading IX – Stress on the class forum',sub:'Hội thoại Mi, Minh, Ann',
passage:{en:[`<b>Mi:</b> Ms Hoa said we can discuss the stress we have in our lives on the class forum. So, what stress do you have?`,`<b>Minh:</b> I'm tired of trying to meet my parents' expectations. They want me to study well and be good at many things, so they send me to many classes like maths, English, piano, and karate.`,`<b>Ann:</b> Why don't you tell them your interests and abilities, Minh? I talked to my parents about this so they no longer send me to classes I don't like. Now I just focus on my health and try to lose some weight.`,`<b>Minh:</b> You look fit, Ann. You should feel good about your body.`,`<b>Ann:</b> Are you kidding? I still need to lose a few more kilos. How about you, Mi?`,`<b>Mi:</b> Actually, I don't get on with my sister. She is jealous of anything I have and always starts arguments. So I had to talk to my mum...`],
vi:[`<b>Mi:</b> Cô Hoa nói chúng mình có thể thảo luận về những căng thẳng trong cuộc sống trên diễn đàn của lớp. Vậy các bạn có áp lực gì?`,`<b>Minh:</b> Mình mệt mỏi vì cố đáp ứng kỳ vọng của bố mẹ. Bố mẹ muốn mình học giỏi và giỏi nhiều thứ, nên gửi mình đi học nhiều lớp như toán, tiếng Anh, piano và karate.`,`<b>Ann:</b> Sao bạn không nói với bố mẹ về sở thích và khả năng của bạn, Minh? Mình đã nói với bố mẹ chuyện này nên bố mẹ không gửi mình đến những lớp mình không thích nữa. Giờ mình chỉ tập trung vào sức khỏe và cố giảm cân.`,`<b>Minh:</b> Trông bạn cân đối mà, Ann. Bạn nên tự tin về cơ thể mình.`,`<b>Ann:</b> Bạn đùa à? Mình vẫn cần giảm thêm vài cân nữa. Còn bạn thì sao, Mi?`,`<b>Mi:</b> Thật ra mình không hòa thuận với chị gái. Chị ấy ghen tị với mọi thứ mình có và luôn gây cãi nhau. Vì vậy mình đã phải nói chuyện với mẹ...`]},
vocab:[[`meet expectations`,`đáp ứng kỳ vọng`],[`be tired of`,`mệt mỏi vì`],[`interests and abilities`,`sở thích và khả năng`],[`no longer`,`không còn nữa`],[`focus on`,`tập trung vào`],[`lose weight`,`giảm cân`],[`fit`,`cân đối, khỏe mạnh`],[`get on with`,`hòa thuận với`],[`jealous of`,`ghen tị với`],[`argument`,`cuộc cãi vã`]],
how:[...HOW_READ.slice(0,2),`Câu chọn từ: tìm câu gốc trong hội thoại, từ cần điền thường nằm ngay trong câu đó (meet, interests, health, get on).`,`Câu T/F: so từng chi tiết; “never told” ngược với “I talked to my parents” → F.`],
qs:[
 M('C9-1','Đề cương C.IX – Câu 1',`Minh feels tired of trying to ______ his parents' expectations.`,[`meet`,`refuse`,`forget`,`ignore`],0,`<b>meet</b> one's expectations: đáp ứng kỳ vọng.`),
 M('C9-2','Đề cương C.IX – Câu 2',`Ann told Minh to talk to his parents about his ______ and abilities.`,[`problems`,`interests`,`plans`,`worries`],1,`“tell them your <b>interests</b> and abilities”.`),
 M('C9-3','Đề cương C.IX – Câu 3',`Ann now focuses on her ______ and tries to lose weight.`,[`hobbies`,`studies`,`health`,`fashion`],2,`“Now I just focus on my <b>health</b>”.`),
 M('C9-4','Đề cương C.IX – Câu 4',`Mi doesn't ______ with her sister because they often argue.`,[`agree`,`get on`,`go out`,`chat`],1,`<b>get on with</b> sb: hòa thuận với ai.`),
 TF('C9-5','Đề cương C.IX – Câu 5',`Ms Hoa allowed the students to talk about their stress on the class forum.`,true,`“Ms Hoa said we <b>can discuss</b> the stress… on the class forum” → T.`),
 TF('C9-6','Đề cương C.IX – Câu 6',`Minh feels stressed because his parents expect too much from him.`,true,`Minh mệt vì phải đáp ứng kỳ vọng, bố mẹ gửi đi học nhiều lớp → T.`),
 TF('C9-7','Đề cương C.IX – Câu 7',`Ann never told her parents about her classes.`,false,`Ann: “<b>I talked to my parents</b> about this” → F.`),
 TF('C9-8','Đề cương C.IX – Câu 8',`Ann now focuses on her health and tries to lose weight.`,true,`“Now I just focus on my health and try to lose some weight” → T.`),
 TF('C9-9','Đề cương C.IX – Câu 9',`Mi has problems with her sister because her sister is jealous of her.`,true,`“She is <b>jealous</b> of anything I have and always starts arguments” → T.`),
 MT('C9-m',[[`jealous of`,`ghen tị với`],[`get on with`,`hòa thuận với`],[`lose weight`,`giảm cân`],[`argument`,`cuộc cãi vã`],[`abilities`,`khả năng`]])
]},
