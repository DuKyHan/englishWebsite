{id:'D1',sec:'D',name:'Viết lại câu',title:'Sentence transformation',sub:'Đề cương D.I – Câu 1–10',
learn:`<table><tr><th>Câu gốc</th><th>Câu viết lại</th></tr>
<tr><td>S + love / like + V-ing</td><td>S + be + <b>fond of</b> / <b>keen on</b> / <b>interested in</b> / <b>into</b> / <b>crazy about</b> + V-ing</td></tr>
<tr><td>S + really love + to V</td><td>S + <b>enjoy(s)</b> + V-ing</td></tr>
<tr><td>S + hate / dislike + V-ing</td><td>S + be <b>not keen on</b> / <b>not interested in</b> + V-ing</td></tr>
<tr><td>S + find + V-ing + boring</td><td>S + be <b>not interested in</b> + V-ing</td></tr>
<tr><td>dislike (không thích)</td><td><b>hate</b> (ghét) – giữ V-ing</td></tr>
<tr><td>A isn't as stressful as B</td><td>B is <b>more stressful than</b> A</td></tr>
<tr><td>A cooks better than B</td><td>B cooks <b>worse than</b> A</td></tr>
<tr><td>Hai câu cùng ý, có “also”</td><td>nối bằng <b>and</b>: …, and it also …</td></tr></table>
<p><b>Lưu ý chia động từ:</b> He <b>is</b>, Ms Lan <b>isn't</b>, Minh <b>enjoys</b>, My brother <b>hates</b>, Are you…? → giữ nguyên thì của câu gốc.</p>`,
how:[`Gạch chân động từ chính và hoạt động trong câu gốc.`,`Nhìn từ gợi ý (fond, keen, enjoy, interested, more…) để chọn công thức.`,`Thêm đúng giới từ: fond <b>of</b>, keen <b>on</b>, interested <b>in</b>.`,`Đổi động từ sau giới từ sang <b>V-ing</b>; chép nguyên phần còn lại.`,`Kiểm tra: chia động từ đúng chủ ngữ, viết hoa đầu câu, dấu câu cuối câu, nghĩa không đổi.`],
qs:[
 B('D1-1','Đề cương D.I – Câu 1',`He loves surfing the facebook in his leisure time. <i>(fond)</i>`,`He is fond of surfing Facebook in his leisure time.`,[`He is fond of surfing the Facebook in his leisure time.`,`He's fond of surfing Facebook in his leisure time.`],[`in`,`surf`],`love + V-ing → be <b>fond of</b> + V-ing.`),
 B('D1-2','Đề cương D.I – Câu 2 (= Câu 6)',`Ms Lan hates going out at night. <i>(keen)</i>`,`Ms Lan isn't keen on going out at night.`,[],[`in`,`go`],`hate → <b>isn't keen on</b> + V-ing.`),
 B('D1-3','Đề cương D.I – Câu 3',`Minh really loves to hang out with friends. <i>(enjoy)</i>`,`Minh enjoys hanging out with friends.`,[],[`to`,`hang`,`enjoy`],`enjoy + <b>V-ing</b>; Minh số ít → <b>enjoys</b>.`),
 B('D1-4','Đề cương D.I – Câu 4',`Do you like making dollhouses in your leisure time? <i>(interested)</i>`,`Are you interested in making dollhouses in your leisure time?`,[],[`on`,`make`,`Do`],`Câu hỏi: <b>Are you interested in</b> + V-ing…?`),
 B('D1-5','Đề cương D.I – Câu 5',`My brother finds playing board games boring. <i>(INTERESTED)</i>`,`My brother isn't interested in playing board games.`,[`My brother is not interested in playing board games.`],[`boring`,`on`],`thấy chán = <b>không thích</b> → isn't interested in + V-ing.`),
 B('D1-7','Đề cương D.I – Câu 7',`Stress can have physical effects on teenagers. It also affects their social life. <i>(BUT / AND)</i>`,`Stress can have physical effects on teenagers, and it also affects their social life.`,[],[`but`],`Hai ý cùng chiều (có “also”) → nối bằng <b>and</b>.`),
 B('D1-8','Đề cương D.I – Câu 8',`My brother dislikes going for a walk. <i>(hates)</i>`,`My brother hates going for a walk.`,[],[`hate`,`to`],`dislike → <b>hates</b> (chủ ngữ số ít), giữ V-ing.`),
 B('D1-9','Đề cương D.I – Câu 9',`Life in the countryside isn't as stressful as life in the city. <i>(more)</i>`,`Life in the city is more stressful than life in the countryside.`,[],[`as`,`less`],`A không căng thẳng bằng B → B <b>more stressful than</b> A.`),
 B('D1-10','Đề cương D.I – Câu 10',`My mother cooks better than her sister. → My mother's sister cooks …`,`My mother's sister cooks worse than my mother.`,[`My mother's sister cooks worse than my mother does.`,`My mother's sister cooks worse than her.`],[`better`,`badly`],`Đảo vị trí hai người → better đổi thành <b>worse</b>.`)
]},
{id:'D2',sec:'D',name:'Viết câu',title:'Write full sentences',sub:'Đề cương D.II – Câu 11–25',
learn:`<p><b>Các bước viết câu từ gợi ý:</b></p>
<table><tr><th>Gợi ý</th><th>Thêm gì?</th><th>Ví dụ</th></tr>
<tr><td>crazy about / fond / keen / interested / into / good</td><td>be + giới từ + V-ing</td><td>is crazy about <b>playing</b>; is fond <b>of</b> messaging</td></tr>
<tr><td>fancy / adore / enjoy</td><td>chia động từ + V-ing</td><td>Julia <b>fancies doing</b> DIY</td></tr>
<tr><td>should / play sport / keep fit</td><td>to V chỉ mục đích</td><td>play sport <b>to</b> keep fit</td></tr>
<tr><td>câu hỏi có “?”</td><td>đảo be lên đầu</td><td><b>Are they</b> interested in…?</td></tr>
<tr><td>not good / however</td><td>dấu ; và ,</td><td>…dancing; <b>however,</b> he is…</td></tr>
<tr><td>more convenient / calling</td><td>so sánh: more … <b>than</b></td><td>more convenient <b>than</b> calling</td></tr>
<tr><td>If / not run / not go</td><td>câu điều kiện loại 1</td><td>If you <b>don't</b> run fast, you <b>won't</b> go to school <b>on</b> time.</td></tr>
<tr><td>for / it / be / wrong thing / do</td><td>for + mệnh đề; the … to V</td><td>, for it <b>is the</b> wrong thing <b>to</b> do.</td></tr>
<tr><td>gifts / birthday</td><td>giới từ thời gian</td><td>receiving gifts <b>on</b> their birthday</td></tr>
<tr><td>participate / clubs</td><td>participate <b>in</b></td><td>participate <b>in</b> school clubs</td></tr></table>`,
how:[`Xác định chủ ngữ và thì (thường là hiện tại đơn) → chia động từ: Julia <b>fancies</b>, she <b>has</b>, she often <b>uploads</b>.`,`Thêm <b>be</b> trước tính từ: is crazy about, am not fond of.`,`Thêm giới từ còn thiếu: of, in, at, on, to.`,`Đổi động từ sau giới từ / enjoy / fancy / adore sang V-ing.`,`Viết hoa đầu câu, thêm dấu chấm hoặc dấu hỏi.`],
qs:[
 B('D2-11','Đề cương D.II – Câu 11',`My cousin / crazy about / play / computer / games.`,`My cousin is crazy about playing computer games.`,[],[`play`,`are`],`be crazy about + <b>V-ing</b>.`),
 B('D2-12','Đề cương D.II – Câu 12',`I / not fond / make models / because / I / not patient.`,`I am not fond of making models because I am not patient.`,[],[`make`,`in`],`am not fond <b>of</b> + V-ing; I <b>am</b> not patient.`),
 B('D2-13','Đề cương D.II – Câu 13',`they / interested / play / badminton / after school?`,`Are they interested in playing badminton after school?`,[],[`Do`,`on`],`Câu hỏi: <b>Are they interested in playing</b> …?`),
 B('D2-14','Đề cương D.II – Câu 14',`Teenagers / should / play / sport / keep fit.`,`Teenagers should play sport to keep fit.`,[`Teenagers should play sports to keep fit.`],[`for`,`keeping`],`should + V; <b>to</b> + V chỉ mục đích (để giữ dáng).`),
 B('D2-15','Đề cương D.II – Câu 15',`Nam / not good / dancing / however / he / member / dancing club.`,`Nam is not good at dancing; however, he is a member of the dancing club.`,[`Nam isn't good at dancing; however, he is a member of the dancing club.`],[`in`,`so`],`not good <b>at</b> + V-ing; ; however, …; a member <b>of</b> the club.`),
 B('D2-16','Đề cương D.II – Câu 16',`Some teens / feel / pressure / because / they / want / fit / a group.`,`Some teens feel pressure because they want to fit into a group.`,[`Some teens feel pressure because they want to fit in a group.`,`Some teens feel pressure because they want to fit in with a group.`],[`fitting`,`feels`],`want + <b>to V</b>: want to fit into a group (muốn hòa nhập vào nhóm).`),
 B('D2-17','Đề cương D.II – Câu 17',`Lan / fond / message / friends / because / it / more convenient / calling.`,`Lan is fond of messaging her friends because it is more convenient than calling.`,[`Lan is fond of messaging friends because it is more convenient than calling.`,`Lan is fond of messaging her friends because it's more convenient than calling.`],[`message`,`as`],`is fond <b>of messaging</b>; more convenient <b>than</b> calling.`),
 B('D2-18','Đề cương D.II – Câu 18',`I / not / into / cook / because / I / often / cut / myself.`,`I am not into cooking because I often cut myself.`,[],[`cook`,`me`],`be into + <b>V-ing</b>: I am not into cooking.`),
 B('D2-19','Đề cương D.II – Câu 19',`Julia / fancy / do / DIY / when / she / have / free time.`,`Julia fancies doing DIY when she has free time.`,[`Julia fancies doing DIY when she has her free time.`],[`fancy`,`have`],`Julia số ít → <b>fancies doing</b>; she <b>has</b>.`),
 B('D2-20','Đề cương D.II – Câu 20 (= Câu 24)',`Everyone / adore / receive / gifts / their / birthday.`,`Everyone adores receiving gifts on their birthday.`,[`Everyone adores receiving gifts on their birthdays.`],[`adore`,`in`],`Everyone + động từ số ít → <b>adores receiving</b>; <b>on</b> + ngày sinh nhật.`),
 B('D2-21','Đề cương D.II – Câu 21',`If / you / not / run / fast, / you / not / go / school / time.`,`If you don't run fast, you won't go to school on time.`,[`If you don't run fast, you won't get to school on time.`],[`in`,`didn't`],`Điều kiện loại 1: If + hiện tại đơn, S + <b>will (not)</b> + V; <b>on time</b>: đúng giờ.`),
 B('D2-22','Đề cương D.II – Câu 22',`We / should not / cheat / exam / for / it / be / wrong thing / do.`,`We should not cheat in the exam, for it is the wrong thing to do.`,[`We should not cheat in exams, for it is the wrong thing to do.`,`We should not cheat in the exams, for it is the wrong thing to do.`],[`doing`,`on`],`cheat <b>in</b> the exam; for + mệnh đề; the wrong thing <b>to do</b>.`),
 B('D2-23','Đề cương D.II – Câu 23',`She / often upload / video / YouTube / and / watch / others' videos.`,`She often uploads videos to YouTube and watches others' videos.`,[`She often uploads videos on YouTube and watches others' videos.`,`She often uploads videos onto YouTube and watches others' videos.`],[`upload`,`watch`],`Hiện tại đơn, chủ ngữ số ít → <b>uploads</b>, <b>watches</b>; upload videos <b>to</b> YouTube.`),
 B('D2-25','Đề cương D.II – Câu 25',`Some teens / participate / school / clubs / make / new / friends.`,`Some teens participate in school clubs to make new friends.`,[],[`on`,`making`],`participate <b>in</b>; <b>to</b> make new friends (để kết bạn mới).`)
]}
];

let AC=null;
function beep(ok){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;const notes=ok?[[660,0],[880,.09]]:[[220,0],[180,.12]];notes.forEach(([f,dt])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+dt);g.gain.exponentialRampToValueAtTime(ok?.18:.06,t+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dt+.18);o.connect(g).connect(AC.destination);o.start(t+dt);o.stop(t+dt+.2);});}catch(e){}}
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));VOICES.sort((a,b)=>(/GB|US/.test(b.lang)?1:0)-(/GB|US/.test(a.lang)?1:0));}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(lines,rate=0.92){
  if(!('speechSynthesis' in window)){toast('Trình duyệt này chưa hỗ trợ đọc tiếng Anh.');return;}
  speechSynthesis.cancel();
  const who={};let n=0;
  lines.forEach(([sp,text])=>{
    if(!(sp in who))who[sp]=n++;
    const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;
    const vi=who[sp];
    if(VOICES.length){u.voice=VOICES[vi%VOICES.length];u.lang=u.voice.lang;}
    u.pitch=VOICES.length>1?1:(vi%2?0.8:1.15);
    speechSynthesis.speak(u);
  });
}
const sayWord=w=>speak([['x',plain(w)]],0.8);

/* ---------- normalisation for typed answers ---------- */
const CONTR=[["isn't","is not"],["aren't","are not"],["don't","do not"],["doesn't","does not"],["didn't","did not"],["won't","will not"],["can't","cannot"],["shouldn't","should not"],["i'm","i am"],["it's","it is"],["he's","he is"],["she's","she is"],["they're","they are"],["you're","you are"],["we're","we are"]];
function norm(s){s=String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ');CONTR.forEach(([a,b])=>{s=s.split(a).join(b);});return s.replace(/[.,;:!?"“”()]/g,' ').replace(/\s+/g,' ').trim();}
const accepts=(q,val)=>(q.acc||[]).some(a=>norm(a)===norm(val));

/* ---------- ANSWER BOOK ---------- */
function answerText(q,noLetter){
  if(q.t==='mcq')return noLetter?fmt(q.o[q.a]):`${LET[q.a]}. ${fmt(q.o[q.a])}`;
  if(q.t==='tf')return q.a?'T (True)':'F (False)';
  if(q.t==='type')return q.acc[0];
  if(q.t==='build')return q.ans;
  if(q.t==='err')return `${q.a} – sửa: ${q.fix}`;
  return '';
}
function qText(q){
  if(q.t==='err')return q.parts.map(p=>Array.isArray(p)?`<u>${p[0]}</u><sub>${p[1]}</sub>`:p).join('');
  if(q.pron)return q.o.map((o,i)=>`${LET[i]}. ${fmt(o)}`).join('&nbsp;&nbsp; ');
  if(q.t==='mcq'&&!q.audio)return fmt(q.q)+'<br><span class="muted">'+q.o.map((o,i)=>`${LET[i]}. ${fmt(o)}`).join(' · ')+'</span>';
  return fmt(q.q);
}
function renderBook(w){
  w.appendChild(h('div',{class:'hero'},`<h1>Sổ đáp án đề cương</h1><p>Đủ đáp án và lý do cho từng câu trong đề cương. Bật “Che đáp án” để tự kiểm tra: đọc câu hỏi, nhớ đáp án rồi chạm để xem.</p>`));
  const tools=h('div',{class:'tools'});
  const inp=h('input',{class:'search',id:'bookSearch',type:'search',placeholder:'Tìm câu, từ vựng…','aria-label':'Tìm trong sổ đáp án'});
  const hideB=h('button',{class:'chip'},'Che đáp án');
  tools.append(inp,hideB);w.appendChild(tools);
  const book=h('div',{class:'book'});w.appendChild(book);
  hideB.onclick=()=>{book.classList.toggle('hide');hideB.textContent=book.classList.contains('hide')?'Hiện đáp án':'Che đáp án';};
  book.addEventListener('click',e=>{const a=e.target.closest('.a');if(a)a.classList.toggle('show');});
  const draw=()=>{
    const f=norm(inp.value);book.innerHTML='';
    LESSONS.forEach(L=>{
      const items=L.qs.filter(q=>q.t!=='match'&&!q.src.startsWith('Luyện thêm'));
      const vis=items.filter(q=>!f||norm(plain(qText(q)+' '+answerText(q)+' '+q.src)).includes(f));
      if(!vis.length)return;
      book.appendChild(h('h2',{},`${L.title}`));
      if(L.passage&&!f){const b=h('button',{class:'chip',style:'margin-bottom:10px',onclick:()=>openPassage(L)},'Xem bài đọc + dịch nghĩa');book.appendChild(b);}
      if(L.id.startsWith('L')&&!f){const b=h('button',{class:'chip',style:'margin-bottom:10px',onclick:()=>openScripts(L)},'Xem lời bài nghe');book.appendChild(b);}
      vis.forEach(q=>{book.appendChild(h('div',{class:'item'},`<div class="s">${q.src}</div><div class="q">${qText(q)}</div><div class="a">${answerText(q)}</div>${q.ex?`<div class="e">${q.ex}</div>`:''}`));});
    });
    if(!book.children.length)book.appendChild(h('p',{class:'empty'},'Không tìm thấy câu nào khớp.'));
  };
  inp.addEventListener('input',draw);draw();
}

  sh.onclick=e=>{if(e.target===sh)closeSheet();};

function closeSheet(){const sh=$('#sheet');sh.hidden=true;sh.innerHTML='';}
function passageView(L,showTr=true){
  const box=h('div');
  const sw=h('label',{class:'switch'});const cb=h('input',{type:'checkbox',id:'tr-'+L.id});cb.checked=showTr;sw.append(cb,document.createTextNode('Hiện dịch nghĩa tiếng Việt'));
  box.appendChild(sw);
  const card=h('div',{class:'card'});
  const vmap=(L.vocab||[]).map(([w,m])=>[w.split(/\s*\/\s*|\s*–\s*|\s*\+\s*/)[0].trim(),m]).filter(([w])=>w.length>2);
  L.passage.en.forEach((en,i)=>{
    let html=fmt(en);
    vmap.forEach(([w,m])=>{const re=new RegExp('(^|[^\\w>])('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\w<])','i');html=html.replace(re,(all,pre,word)=>`${pre}<mark class="w" data-m="${m.replace(/"/g,'&quot;')}" tabindex="0">${word}</mark>`);});
    const p=h('div',{class:'para'},`<p class="en">${html}</p><p class="vi"${showTr?'':' hidden'}>${L.passage.vi[i]||''}</p>`);
    card.appendChild(p);
  });
  card.addEventListener('click',e=>{const m=e.target.closest('mark.w');if(!m)return;const nx=m.nextElementSibling;if(nx&&nx.classList.contains('gloss'))nx.remove();else m.insertAdjacentHTML('afterend',`<span class="gloss">${m.dataset.m}</span>`);});
  cb.onchange=()=>card.querySelectorAll('.vi').forEach(v=>v.hidden=!cb.checked);
  box.appendChild(card);
  box.appendChild(h('p',{class:'note',style:'margin-top:10px'},'Chạm vào từ được tô vàng để xem nghĩa.'));
  return box;
}
function vocabView(L){const c=h('div',{class:'card'},'<h3>Từ vựng trong đáp án</h3>');const v=h('div',{class:'vocab'});L.vocab.forEach(([w,m])=>{const r=h('div',{class:'vrow'});const left=h('div',{style:'display:flex;gap:8px;align-items:center'});const sb=h('button',{class:'say','aria-label':'Nghe '+w,onclick:()=>sayWord(w.split('/')[0])},I.spk);left.append(sb,h('b',{},w));r.append(left,h('span',{},m));v.appendChild(r);});c.appendChild(v);return c;}

const lessonEl=$('#lesson');
function openLesson(id){
  const L=LBY[id];
  lessonEl.hidden=false;document.body.style.overflow='hidden';
  const tabs=[];
  if(L.learn)tabs.push(['learn','Kiến thức cần nhớ']);
  if(L.passage)tabs.push(['passage','Bài đọc & dịch']);
  if(L.vocab)tabs.push(['vocab','Từ vựng']);
  if(L.qs.some(q=>q.audio))tabs.push(['script','Lời bài nghe']);
  tabs.push(['how','Cách làm bài']);
  let cur=tabs[0][0];
  const draw=()=>{
    lessonEl.innerHTML='';
    const head=h('div',{class:'lhead'},'<div class="wrap"></div>');
    head.firstChild.appendChild(h('button',{class:'x','aria-label':'Thoát',onclick:closeLesson},I.x));

    w.appendChild(h('p',{class:'muted',style:'margin:0 0 4px;font-size:.9rem'},L.sub));
    const tb=h('div',{class:'ltabs',role:'tablist'});
    tabs.forEach(([k,lab])=>tb.appendChild(h('button',{role:'tab','aria-selected':String(k===cur),onclick:()=>{cur=k;draw();}},lab)));
    w.appendChild(tb);
    if(cur==='learn'){const c=h('div',{class:'card'},'<h3>Kiến thức cần nhớ</h3>'+L.learn);c.querySelectorAll('table').forEach(t=>{const d=h('div',{class:'tblw'});t.replaceWith(d);d.appendChild(t);});w.appendChild(c);}
    if(cur==='passage')w.appendChild(passageView(L));
    if(cur==='vocab')w.appendChild(vocabView(L));
    if(cur==='script')w.appendChild(scriptView([...new Set(L.qs.filter(q=>q.audio).map(q=>q.audio))]));
    if(cur==='how'){const c=h('div',{class:'card'},'<h3>Cách làm bài</h3>');const ol=h('ol',{class:'steps'});L.how.forEach(s=>ol.appendChild(h('li',{},`<span>${s}</span>`)));c.appendChild(ol);w.appendChild(c);}
    const n=L.qs.length;
    w.appendChild(h('p',{class:'muted',style:'font-size:.88rem;margin-top:14px'},`${n} câu luyện tập · 5 tim · câu sai sẽ được hỏi lại ở cuối bài.`));
    const foot=h('div',{class:'lfoot'},'<div class="wrap"></div>');
    foot.firstChild.appendChild(h('button',{class:'btn wide',onclick:()=>startRun({mode:'lesson',lesson:L,title:L.title,qs:L.qs.slice(),hearts:5})},'Bắt đầu luyện tập'));
    lessonEl.append(head,body,foot);
  };
  draw();
}
function closeLesson(){clearInterval(CLOCK);try{speechSynthesis.cancel();}catch(e){}lessonEl.hidden=true;lessonEl.innerHTML='';document.body.style.overflow='';R=null;render();}

function startRun(cfg){
  lessonEl.hidden=false;document.body.style.overflow='hidden';
  R={...cfg,queue:cfg.qs.slice(),total:cfg.qs.length,solved:0,first:0,tried:new Set(),hp:cfg.hearts,xp:0,combo:0,best:0,wrongIds:new Set(),t0:Date.now()};
  clearInterval(CLOCK);
  if(cfg.mode==='exam')CLOCK=setInterval(()=>{const c=$('#clock');if(c&&R)c.textContent=clockText();},1000);
  nextQ();
}
let CLOCK=null;
const fmtTime=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function clockText(){return R?fmtTime(Math.round((Date.now()-R.t0)/1000)):'0:00';}
function shell(){
  lessonEl.innerHTML='';
  const head=h('div',{class:'lhead'},'<div class="wrap"></div>');
  head.firstChild.appendChild(h('button',{class:'x','aria-label':'Thoát bài',onclick:closeLesson},I.x));
  head.firstChild.appendChild(h('div',{class:'bar','aria-hidden':'true'},`<i style="width:${Math.round(R.solved/R.total*100)}%"></i>`));
  if(R.mode==='exam'){head.firstChild.appendChild(h('div',{class:'hearts clock','aria-label':'Thời gian'},`<span id="clock">${clockText()}</span>`));}
  else head.firstChild.appendChild(h('div',{class:'hearts','aria-label':'Số tim'},I.heart+`<span>${R.hp===Infinity?'∞':R.hp}</span>`));
  const body=h('div',{class:'lbody'});const w=h('div',{class:'wrap'});body.appendChild(w);
  const foot=h('div',{class:'lfoot'},'<div class="wrap"></div>');
  lessonEl.append(head,body,foot);
  return {w,foot:foot.firstChild,footEl:foot};
}
function nextQ(){
  if(!R.queue.length)return endRun();
  const q=R.queue[0];
  const {w,foot,footEl}=shell();
  if(R.mode==='exam'){w.appendChild(h('div',{class:'tag'},`${R.title} · Câu ${R.solved+1}/${R.total}`));}
  else if(R.mode!=='lesson'){w.appendChild(h('div',{class:'tag'},`${LBY[q.lesson].name} · ${q.src}`));}
  else w.appendChild(h('div',{class:'tag'},(R.tried.has(q.id)?'Làm lại · ':'')+q.src));
  const PL=LBY[q.lesson];
  if(PL&&PL.passage&&q.t!=='match'){w.appendChild(h('button',{class:'chip',style:'margin-bottom:12px',onclick:()=>openPassage(PL,R.mode==='lesson')},'Xem bài đọc: '+PL.title.replace(/^Reading [IVX]+ – /,'')));}
  const ui=renderQ(q,w);
  const check=h('button',{class:'btn wide',disabled:''},'Kiểm tra');
  if(q.t!=='match')foot.appendChild(check);
  ui.onReady=ok=>{check.disabled=!ok;};
  ui.onAuto=()=>grade(q,ui,true,footEl,foot);
  check.onclick=()=>grade(q,ui,ui.check(),footEl,foot);
  ui.submit=()=>{if(!check.disabled)check.click();};
}
function grade(q,ui,ok,footEl,foot){
  ui.lock&&ui.lock(ok);
  const firstTime=!R.tried.has(q.id);R.tried.add(q.id);
  R.queue.shift();
  if(ok){
    R.solved++;R.combo++;R.best=Math.max(R.best,R.combo);
    if(firstTime)R.first++;
    const gain=(firstTime?10:5)+(R.combo>=5?5:R.combo>=3?2:0);R.xp+=gain;
    if(R.mode==='review'||!firstTime){S.wrong=S.wrong.filter(x=>x!==q.id);}
    beep(true);
  }else{
    R.combo=0;R.wrongIds.add(q.id);if(R.hp!==Infinity)R.hp--;
    if(!S.wrong.includes(q.id))S.wrong.push(q.id);
    if(R.mode==='exam')R.solved++;else R.queue.push(q);
    beep(false);
  }
  save();
  footEl.classList.add(ok?'ok':'bad');
  foot.innerHTML='';
  const praise=['Chính xác!','Tuyệt vời!','Giỏi quá!','Đúng rồi!','Xuất sắc!'];
  const fb=h('div',{class:'fb'});
  fb.innerHTML=ok?`<h3>${praise[Math.floor(Math.random()*praise.length)]}${R.combo>=3?` <span class="combo">· ${R.combo} câu liên tiếp</span>`:''}</h3>`:`<h3>Chưa đúng</h3><p class="ans">Đáp án: ${ui.ansLabel||answerText(q)||'—'}</p>`;
  if(q.ex)fb.innerHTML+=`<p class="why">${q.ex}</p>`;
  if(!ok&&R.hp!==Infinity&&R.mode!=='exam')fb.appendChild(h('p',{class:'src'},'Câu này sẽ được hỏi lại ở cuối bài.'));
  if(q.audio){const b=h('button',{class:'toggle',onclick:()=>openSheet('Lời bài nghe',scriptView([q.audio]))},'Xem lời bài nghe + dịch');fb.appendChild(b);}
  if(q.lesson&&LBY[q.lesson].passage&&R.mode!=='lesson'){fb.appendChild(h('button',{class:'toggle',onclick:()=>openPassage(LBY[q.lesson],true)},'Xem bài đọc + dịch'));}
  foot.appendChild(fb);
  const bar=lessonEl.querySelector('.bar i');if(bar)bar.style.width=Math.round(R.solved/R.total*100)+'%';
  const hs=lessonEl.querySelector('.hearts span');if(hs)hs.textContent=R.hp===Infinity?'∞':R.hp;
  const cont=h('button',{class:'btn wide '+(ok?'okb':'badb')},'Tiếp tục');
  cont.onclick=()=>{try{speechSynthesis.cancel();}catch(e){} if(R.hp<=0)return failRun(); nextQ();};
  foot.appendChild(cont);cont.focus();
}
function failRun(){
  const {w,foot}=shell();
  w.appendChild(h('div',{class:'end'},`<h2 style="color:var(--bad)">Hết tim rồi!</h2><p>Không sao cả. Xem lại phần kiến thức rồi thử lại nhé – mỗi lần làm lại em sẽ nhớ lâu hơn.</p>`));
  if(R.lesson){const L=R.lesson;foot.appendChild(h('button',{class:'btn wide',onclick:()=>startRun({mode:'lesson',lesson:L,title:L.title,qs:L.qs.slice(),hearts:5})},'Làm lại'));foot.appendChild(h('button',{class:'btn ghost wide',onclick:()=>openLesson(L.id)},'Xem lại kiến thức'));}
  else{const cfg={...R};foot.appendChild(h('button',{class:'btn wide',onclick:()=>startRun({mode:cfg.mode,title:cfg.title,qs:shuffle(cfg.qs),hearts:cfg.hearts})},'Làm lại'));foot.appendChild(h('button',{class:'btn ghost wide',onclick:closeLesson},'Về trang chính'));}
}
function qStem(q){
  if(q.t==='err')return q.parts.map(p=>Array.isArray(p)?`<u>${p[0]}</u>`:p).join('');
  if(q.pron)return q.o.map(fmt).join(' · ');
  return fmt(q.q);
}
function reviewList(title,note){
  const c=h('div',{class:'card'},`<h3>${title}</h3><p class="muted" style="font-size:.88rem">${note}</p>`);
  R.qs.filter(q=>q.t!=='match').forEach(q=>{const bad=R.wrongIds.has(q.id);c.appendChild(h('div',{style:`border-top:1px solid var(--line);padding:8px 0;${bad?'border-left:4px solid var(--bad);padding-left:10px':''}`},`<div class="tag" style="margin:0">${q.src}</div><div style="font-size:.95rem">${qStem(q)}</div><div style="font-weight:700;color:var(--ok)">${answerText(q,true)}</div>`));});
  return c;
}
function endRun(){
  clearInterval(CLOCK);
  if(R.mode==='exam')return endExam();
  const acc=Math.round(R.first/R.total*100);
  const stars=acc>=90?3:acc>=70?2:1;
  S.xp+=R.xp;markDay();
  if(R.lesson){S.stars[R.lesson.id]=Math.max(S.stars[R.lesson.id]||0,stars);}
  save();updateStats();
  const {w,foot}=shell();
  const end=h('div',{class:'end'});
  end.innerHTML=`<h2>${stars===3?'Hoàn hảo!':stars===2?'Làm tốt lắm!':'Hoàn thành!'}</h2><div class="bigstars">${I.star(true)}${I.star(stars>1)}${I.star(stars>2)}</div><p class="muted">${R.title}</p>
  <div class="scores"><div class="score" style="border-color:var(--sun)"><small style="background:var(--sun)">XP</small><b>+${R.xp}</b></div><div class="score" style="border-color:var(--ok)"><small style="background:var(--ok)">Đúng lần đầu</small><b>${acc}%</b></div><div class="score" style="border-color:var(--sky)"><small style="background:var(--sky)">Chuỗi đúng</small><b>${R.best}</b></div></div>`;
  w.appendChild(end);
  if(R.qs.some(q=>q.t!=='match'))w.appendChild(reviewList('Ghi nhớ đáp án','Đọc lại một lượt trước khi thoát. Câu đánh dấu đỏ là câu em đã làm sai.'));
  if(R.lesson){
    const idx=LESSONS.indexOf(R.lesson);const nx=LESSONS[idx+1];
    if(nx)foot.appendChild(h('button',{class:'btn wide',onclick:()=>openLesson(nx.id)},'Bài tiếp theo: '+nx.name));
    foot.appendChild(h('button',{class:'btn ghost wide',onclick:closeLesson},'Về lộ trình'));
  }else foot.appendChild(h('button',{class:'btn wide',onclick:closeLesson},'Về trang chính'));
}

function audioCard(key){

}
function renderQ(q,w){
  const ui={onReady(){},check(){return false;}};
  if(q.audio)w.appendChild(audioCard(q.audio));
  if(q.t==='mcq'){
    if(q.pron){w.appendChild(h('h2',{class:'qtitle'},q.q));}
    else w.appendChild(h('p',{class:'prompt'},fmt(q.q)));
    const short=q.o.every(o=>plain(o).length<=16);
    const box=h('div',{class:'opts'+(short&&q.o.length>=4?' g2':'')});
    /* đảo thứ tự A B C D mỗi lần làm (trừ câu "A&B are correct" phải giữ nguyên) */
    const fixed=q.o.some(o=>/A\s*&\s*B|A and B/i.test(o));
    const perm=fixed?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i));
    let sel=-1;const btns=[];
    perm.forEach((oi,pos)=>{
      const o=q.o[oi];
      const b=h('button',{class:'opt','aria-pressed':'false'});
      b.innerHTML=`<span class="k">${LET[pos]}</span><span class="tx ${q.pron?'pronw':''}">${fmt(o)}</span>`;
      if(q.pron){const s=h('span',{class:'say',role:'button',tabindex:'0','aria-label':'Nghe từ '+plain(o)},I.spk);s.addEventListener('click',e=>{e.stopPropagation();sayWord(o);});b.appendChild(s);}
      b.onclick=()=>{sel=oi;btns.forEach((x,j)=>x.setAttribute('aria-pressed',String(j===pos)));ui.onReady(true);};
      btns.push(b);box.appendChild(b);
    });
    w.appendChild(box);
    ui.ansLabel=`${LET[perm.indexOf(q.a)]}. ${fmt(q.o[q.a])}`;
    ui.check=()=>sel===q.a;
    ui.lock=()=>{btns.forEach((b,pos)=>{b.disabled=true;if(perm[pos]===q.a)b.classList.add('right');else if(perm[pos]===sel)b.classList.add('wrong');});};
    keyHandler=(e)=>{const k=e.key.toUpperCase();const i=LET.indexOf(k);const n=parseInt(e.key,10);const idx=i>=0&&i<q.o.length?i:(n>=1&&n<=q.o.length?n-1:-1);if(idx>=0&&!btns[idx].disabled)btns[idx].click();if(e.key==='Enter')ui.submit&&ui.submit();};
  }
  else if(q.t==='tf'){
    w.appendChild(h('h2',{class:'qtitle'},'True or False?'));
    w.appendChild(h('p',{class:'prompt'},fmt(q.q)));
    const row=h('div',{class:'tfrow'});let sel=null;
    const bt=h('button',{class:'opt','aria-pressed':'false'},'T · Đúng');const bf=h('button',{class:'opt','aria-pressed':'false'},'F · Sai');
    bt.onclick=()=>{sel=true;bt.setAttribute('aria-pressed','true');bf.setAttribute('aria-pressed','false');ui.onReady(true);};
    bf.onclick=()=>{sel=false;bf.setAttribute('aria-pressed','true');bt.setAttribute('aria-pressed','false');ui.onReady(true);};
    row.append(bt,bf);w.appendChild(row);
    ui.check=()=>sel===q.a;
    ui.lock=()=>{[bt,bf].forEach(b=>b.disabled=true);(q.a?bt:bf).classList.add('right');if(sel!==q.a)(sel?bt:bf).classList.add('wrong');};
    keyHandler=e=>{if(/^[tT1]$/.test(e.key))bt.click();if(/^[fF2]$/.test(e.key))bf.click();if(e.key==='Enter')ui.submit&&ui.submit();};
  }
  else if(q.t==='type'){
    w.appendChild(h('h2',{class:'qtitle'},'Viết dạng đúng của từ trong ngoặc'));
    w.appendChild(h('p',{class:'prompt'},fmt(q.q)));
    const inp=h('input',{class:'ty',id:'ty-'+q.id,type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:'false',placeholder:'Gõ đáp án…','aria-label':'Đáp án'});
    inp.addEventListener('input',()=>ui.onReady(inp.value.trim().length>0));
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ui.submit&&ui.submit();}});
    w.appendChild(inp);setTimeout(()=>inp.focus(),50);
    ui.check=()=>accepts(q,inp.value);ui.lock=()=>{inp.disabled=true;};
    keyHandler=null;
  }
  else if(q.t==='err'){
    w.appendChild(h('h2',{class:'qtitle'},'Chạm vào phần gạch chân bị sai'));
    const s=h('div',{class:'sent'});const segs={};let sel=null;
    q.parts.forEach(p=>{if(Array.isArray(p)){const b=h('button',{class:'seg','aria-pressed':'false'},`${p[0]}<sub>${p[1]}</sub>`);b.onclick=()=>{sel=p[1];Object.values(segs).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');ui.onReady(true);};segs[p[1]]=b;s.appendChild(b);}else s.appendChild(document.createTextNode(p));});
    w.appendChild(s);
    ui.check=()=>sel===q.a;
    ui.lock=()=>{Object.entries(segs).forEach(([k,b])=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===sel)b.classList.add('wrong');});};
    keyHandler=e=>{const k=e.key.toUpperCase();if(segs[k])segs[k].click();if(e.key==='Enter')ui.submit&&ui.submit();};
  }
  else if(q.t==='build'){
    w.appendChild(h('h2',{class:'qtitle'},q.lesson==='D1'?'Viết lại câu, giữ nguyên nghĩa':'Viết câu hoàn chỉnh từ gợi ý'));
    w.appendChild(h('div',{class:'cue'},fmt(q.q)));
    const words=q.ans.replace(/[.,;?!]/g,'').split(/\s+/).filter(Boolean);
    const tiles=shuffle([...words,...(q.extra||[])]);
    const line=h('div',{class:'answer-line','aria-label':'Câu trả lời của em'});
    const bank=h('div',{class:'bank'});
    const chosen=[];
    const typed=h('textarea',{class:'ty',id:'tx-'+q.id,placeholder:'Gõ cả câu…',autocapitalize:'sentences',spellcheck:'false'});typed.hidden=true;
    let mode='tiles';
    const refresh=()=>{ui.onReady(mode==='tiles'?chosen.length>0:typed.value.trim().length>0);};
    tiles.forEach((t,i)=>{const b=h('button',{class:'tile'},t);b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');const c=h('button',{class:'tile'},t);c.onclick=()=>{c.remove();b.classList.remove('used');chosen.splice(chosen.indexOf(c),1);refresh();};chosen.push(c);line.appendChild(c);refresh();};bank.appendChild(b);});
    w.append(line,bank,typed);
    const tg=h('button',{class:'toggle'},'Gõ bằng bàn phím');
    tg.onclick=()=>{mode=mode==='tiles'?'type':'tiles';line.hidden=bank.hidden=mode!=='tiles';typed.hidden=mode==='tiles';tg.textContent=mode==='tiles'?'Gõ bằng bàn phím':'Dùng thẻ từ';if(mode==='type'){typed.value=chosen.map(c=>c.textContent).join(' ');typed.focus();}refresh();};
    typed.addEventListener('input',refresh);
    typed.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ui.submit&&ui.submit();}});
    w.appendChild(tg);
    ui.check=()=>accepts(q,mode==='tiles'?chosen.map(c=>c.textContent).join(' '):typed.value);
    ui.lock=()=>{[...line.children,...bank.children].forEach(b=>b.disabled=true);typed.disabled=true;tg.hidden=true;};
    keyHandler=null;
  }
  else if(q.t==='match'){
    w.appendChild(h('h2',{class:'qtitle'},'Nối từ với nghĩa đúng'));
    const m=h('div',{class:'match'});const L=h('div',{class:'col'}),Rt=h('div',{class:'col'});m.append(L,Rt);
    let pick=null;let left=q.pairs.length;
    const mk=(txt,key,side)=>{const b=h('button',{class:'mt','aria-pressed':'false'},txt);b.dataset.k=key;b.dataset.s=side;b.onclick=()=>{
      if(side==='en')sayWord(txt);
      if(!pick||pick.dataset.s===side){if(pick)pick.setAttribute('aria-pressed','false');pick=b;b.setAttribute('aria-pressed','true');return;}
      if(pick.dataset.k===String(key)){[pick,b].forEach(x=>{x.classList.add('gone');x.setAttribute('aria-pressed','false');x.disabled=true;});pick=null;left--;beep(true);if(!left)setTimeout(()=>ui.onAuto(),350);}
      else{const a=pick;[a,b].forEach(x=>{x.classList.add('shake');x.setAttribute('aria-pressed','false');setTimeout(()=>x.classList.remove('shake'),400);});pick=null;}
    };return b;};
    shuffle(q.pairs.map((p,i)=>[p[0],i])).forEach(([t,i])=>L.appendChild(mk(t,i,'en')));
    shuffle(q.pairs.map((p,i)=>[p[1],i])).forEach(([t,i])=>Rt.appendChild(mk(t,i,'vi')));
    w.appendChild(m);
    ui.check=()=>true;keyHandler=null;
  }
  return ui;
}
let keyHandler=null;
document.addEventListener('keydown',e=>{if(lessonEl.hidden||!keyHandler)return;if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;const cont=lessonEl.querySelector('.lfoot.ok .btn, .lfoot.bad .btn');if(cont&&e.key==='Enter'){e.preventDefault();cont.click();return;}if(!cont)keyHandler(e);});

/* ================= LÀM ĐỀ (luyện tập, không thi đua) ================= */
const nm=ids=>ids.map(id=>QBY[id]).filter(Boolean);
const lessonQs=(...ids)=>ids.flatMap(id=>LBY[id].qs.filter(q=>q.t!=='match'));
const GPOOL=lessonQs('B2','B3','B4','B5');
const WPOOL=lessonQs('D1','D2');
const EXAMS=[
 {key:'e1',name:'Đề 1',listen:['L1a','L1b','L1c','L1d'],pron:['B1-1','B1-5','B1-x1'],read:['C1','C4']},
 {key:'e2',name:'Đề 2',listen:['L1e','L1f','L1g'],pron:['B1-2','B1-6','B1-x2'],read:['C2','C7','C5']},
 {key:'e3',name:'Đề 3',listen:['L2a','L2b','L2c','L2d'],pron:['B1-3','B1-7','B1-x3'],read:['C3','C8']},
 {key:'e4',name:'Đề 4',listen:['L2e','L2f','L2g'],pron:['B1-4','B1-8','B1-x4'],read:['C9','C6']}
].map((E,i)=>{
  E.gram=GPOOL.filter((_,j)=>j%4===i);E.write=WPOOL.filter((_,j)=>j%4===i);
  E.count=E.listen.length+E.pron.length+E.gram.length+lessonQs(...E.read).length+E.write.length;
  return E;
});
function buildExam(E){
  return [...nm(E.listen),...shuffle(nm(E.pron)),...shuffle(E.gram),...shuffle(E.read).flatMap(id=>lessonQs(id)),...shuffle(E.write)];
}
function buildRandom(){
  const all=LESSONS.flatMap(L=>L.qs.filter(q=>q.t!=='match'&&!q.src.startsWith('Luyện thêm')));
  return shuffle(all).slice(0,40);
}


const fmtPts=n=>(Math.round(n*10)/10).toString().replace('.',',');

function startExam(E){
  const qs=E.key==='rand'?buildRandom():buildExam(E);
  startRun({mode:'exam',exam:E,title:E.name,qs,hearts:Infinity});
}
function endExam(){
  const E=R.exam;const total=R.total;const right=R.first;
  const score=Math.round(right/total*100)/10;const t=Math.round((Date.now()-R.t0)/1000);
  S.best=S.best||{};const prev=S.best[E.key];
  const improved=!prev||score>prev.s||(score===prev.s&&t<prev.t);
  if(improved)S.best[E.key]={s:score,t,at:Date.now()};
  S.xp+=R.xp;markDay();save();updateStats();
  const {w,foot}=shell();
  const end=h('div',{class:'end'});
  end.innerHTML=`<h2>${score>=9?'Xuất sắc!':score>=7?'Làm tốt lắm!':score>=5?'Cố lên nữa nhé!':'Ôn thêm rồi thử lại nhé!'}</h2><p class="muted">${E.name}</p>
  <div class="bigscore">${fmtPts(score)}<small>/10</small></div>
  <div class="scores"><div class="score" style="border-color:var(--ok)"><small style="background:var(--ok)">Câu đúng</small><b>${right}/${total}</b></div><div class="score" style="border-color:var(--sky)"><small style="background:var(--sky)">Thời gian</small><b>${fmtTime(t)}</b></div><div class="score" style="border-color:var(--sun)"><small style="background:var(--sun)">XP</small><b>+${R.xp}</b></div></div>
  <p class="note" style="text-align:center">${improved&&prev?'Kỷ lục mới cho '+E.name+'!':prev?'Điểm cao nhất của em: '+fmtPts(prev.s)+'/10':'Đã lưu điểm.'}</p>`;
  w.appendChild(end);
  w.appendChild(reviewList('Xem lại đáp án','Câu đánh dấu đỏ là câu em làm sai. Đáp án hiển thị bằng nội dung vì thứ tự A B C D thay đổi mỗi lần làm.'));
  foot.appendChild(h('button',{class:'btn wide',onclick:()=>startExam(E)},'Làm lại đề này'));
  foot.appendChild(h('button',{class:'btn ghost wide',onclick:()=>{closeLesson();go('rank');}},'Chọn đề khác'));
}

go('path');
})();

</script>
