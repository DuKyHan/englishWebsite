spend + time + V-ing.\u003cbr>Câu đúng: \u003cb>He spends all his free time looking after his garden.\u003c/b>\u003cbr>Dịch: Anh ấy dành toàn bộ thời gian rảnh để chăm sóc khu vườn."}},{"k":"q","q":{"t":"tx","n":122,"stem":"Making crafts or collecting things like stamps and coins are very interesting.","pre":"→ It's very&nbsp;","post":".","acc":["interesting to make crafts or collect things like stamps and coins"],"show":"interesting to make crafts or collect things like stamps and coins","ex":"Công thức: It's + adj + to V.\u003cbr>Câu đúng: \u003cb>It's very interesting to make crafts or collect things like stamps and coins.\u003c/b>\u003cbr>Dịch: Làm đồ thủ công hoặc sưu tầm tem, tiền xu rất thú vị."}},{"k":"q","q":{"t":"tx","n":123,"stem":"I don't like to get up early and prepare breakfast in the cold winter days.","pre":"→ I hate&nbsp;","post":".","acc":["getting up early and preparing breakfast in the cold winter days"],"show":"getting up early and preparing breakfast in the cold winter days","ex":"Công thức: hate + V-ing.\u003cbr>Câu đúng: \u003cb>I hate getting up early and preparing breakfast in the cold winter days.\u003c/b>\u003cbr>Dịch: Tôi ghét dậy sớm và chuẩn bị bữa sáng vào những ngày đông lạnh."}},{"k":"q","q":{"t":"tx","n":124,"stem":"It took us 30 minutes to rehearse the song.","pre":"→ We spent&nbsp;","post":".","acc":["30 minutes rehearsing the song"],"show":"30 minutes rehearsing the song","ex":"Công thức: spend + time + V-ing.\u003cbr>Câu đúng: \u003cb>We spent 30 minutes rehearsing the song.\u003c/b>\u003cbr>Dịch: Chúng tôi đã dành 30 phút tập bài hát."}},{"k":"q","q":{"t":"tx","n":125,"stem":"He likes swimming and sunbathing.","pre":"→ He is interested&nbsp;","post":".","acc":["in swimming and sunbathing"],"show":"in swimming and sunbathing","ex":"Công thức: be interested in + V-ing.\u003cbr>Câu đúng: \u003cb>He is interested in swimming and sunbathing.\u003c/b>\u003cbr>Dịch: Anh ấy thích bơi lội và tắm nắng."}}]}]};var TOTAL=EXAM.total;document.getElementById('lead').textContent=TOTAL+' câu, mỗi câu 1 điểm, quy đổi ra thang 10. Làm hết rồi bấm “Nộp bài” để xem điểm, đáp án và giải thích.';
var $=function(s,r){return (r||document).querySelector(s)};
var ans={},items=[],t0=Date.now(),timer=null,submitted=false;
function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,;:!?()"]/g,' ').replace(/\s+/g,' ').trim()}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function build(){
 var sheet=$('#sheet');sheet.innerHTML='';items=[];
 EXAM.secs.forEach(function(sec){
  var s=el('section','sec');s.appendChild(el('h2',null,sec.title));if(sec.note)s.appendChild(el('p','note',sec.note));
  sec.blocks.forEach(function(b){
   if(b.k==='sub')s.appendChild(el('p','sub',b.text));
   else if(b.k==='passage'){var p=el('div','passage');b.text.split('\n').forEach(function(x){p.appendChild(el('p',null,x))});s.appendChild(p)}
   else if(b.k==='box'){var d=el('div','dbox');d.appendChild(el('h3',null,b.head));b.lines.forEach(function(l){d.appendChild(el('p',null,l))});s.appendChild(d)}
   else{s.appendChild(mkQ(b.q))}
  });
  sheet.appendChild(s);
 });
}
function mkQ(q){
 var box=el('div','q');box.id='q'+q.n;var it={q:q,box:box,ok:null,forced:false};items.push(it);
 var head=q.t==='mc'?(q.stem?'<span class="qn">'+q.n+'.</span>'+q.stem:'<span class="qn">'+q.n+'.</span>'):'<span class="qn">'+q.n+'.</span>'+(q.stem||'');
 var inner=el('div');
 if(q.t==='mc'){
  inner.appendChild(el('div',null,head));
  var o=el('div','opts');
  q.opts.forEach(function(t,i){var b=el('button','opt','<b>'+'ABCD'[i]+'</b><span>'+t+'</span>');b.type='button';b.setAttribute('aria-pressed','false');
   b.onclick=function(){if(submitted)return;ans[q.n]=i;[].forEach.call(o.children,function(c,j){c.classList.toggle('sel',j===i);c.setAttribute('aria-pressed',j===i)});upd()};o.appendChild(b)});
  inner.appendChild(o);it.opts=o;
 }else{
  if(q.stem)inner.appendChild(el('div',null,head));
  var r=el('div','tx');var lead=(q.stem?'':head)+(q.pre||'');if(lead)r.appendChild(el('span',null,lead));
  var inp=el('input');inp.type='text';inp.id='a'+q.n;inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('aria-label','Câu '+q.n);
  inp.oninput=function(){if(submitted)return;ans[q.n]=inp.value;upd()};var long=!!(q.stem&&q.pre);if(long){r.style.display='block';inp.style.cssText='width:100%;margin-top:6px'}r.appendChild(inp);if(q.post&&!(long&&/^[.\s]*$/.test(q.post)))r.appendChild(el('span',null,q.post));inner.appendChild(r);it.inp=inp;
 }
 var fb=el('div','fb');inner.appendChild(fb);it.fb=fb;
 if(q.img){var row=el('div','qrow');var im=new Image();im.src='data:image/jpeg;base64,'+q.img;im.alt='Biển báo';row.appendChild(im);row.appendChild(inner);box.appendChild(row)}else box.appendChild(inner);
 return box;
}
function answered(){return items.filter(function(it){var v=ans[it.q.n];return v!==undefined&&String(v).trim()!==''}).length}
function upd(){var a=answered();$('#st-done').textContent=a+'/'+TOTAL+' câu';$('#prog').style.width=(a/TOTAL*100)+'%';$('#warn').style.display='none'}
function tick(){var s=Math.floor((Date.now()-t0)/1000);$('#st-time').textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function fold(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function addExp(it){var q=it.q;if(q.ex){var e=el('div','exp','<b>Giải thích:</b> '+q.ex);it.fb.appendChild(e)}}
function grade(it){
 var q=it.q,v=ans[q.n];
 if(q.t==='mc')return v===q.a;
 if(v===undefined)return false;
 if(q.loose){var nv=fold(v);return q.acc.some(function(a){var na=fold(a);return nv===na||(na.length>=3&&nv.indexOf(na)>-1)})}
 var n=norm(v);return q.acc.some(function(a){return norm(a)===n});
}
function showAns(it){
 var q=it.q;it.box.classList.add('done');it.box.classList.toggle('ok',it.ok);it.box.classList.toggle('no',!it.ok);
 if(q.t==='mc'){[].forEach.call(it.opts.children,function(c,i){c.disabled=true;c.classList.remove('sel');if(i===q.a)c.classList.add('right');else if(i===ans[q.n])c.classList.add('wrong')});
  it.fb.textContent=it.ok?'✓ Đúng':'✗ Đáp án đúng: '+'ABCD'[q.a]+'. '+q.opts[q.a].replace(/<[^>]+>/g,'')}
 else{it.inp.readOnly=true;
  it.fb.innerHTML=it.ok?'✓ Đúng':'✗ Đáp án: '+q.show.replace(/</g,'&lt;');
  if(!it.ok){var b=el('button',null,'Tính đúng');b.type='button';b.title='Dùng khi em viết đúng nghĩa nhưng khác cách viết';b.onclick=function(){it.forced=true;it.ok=true;showAns(it);score()};it.fb.appendChild(b)}}
 addExp(it);
}
function score(){
 var right=items.filter(function(i){return i.ok}).length,pt=Math.round(right/TOTAL*1000)/100;
 var rank=pt>=8?'Giỏi':pt>=6.5?'Khá':pt>=5?'Trung bình':'Cần cố gắng hơn';
 var secs=[];EXAM.secs.forEach(function(s){var qs=s.blocks.filter(function(b){return b.k==='q'}).map(function(b){return b.q.n});var r=items.filter(function(i){return qs.indexOf(i.q.n)>-1&&i.ok}).length;secs.push('<span class="chip">'+s.short+': '+r+'/'+qs.length+'</span>')});
 var nm=$('#nm').value.trim(),cl=$('#cl').value.trim();
 var r=$('#res');r.className='res on';
 r.innerHTML='<div class="row"><div class="big">'+String(pt).replace('.',',')+'<small> / 10</small></div><div><b>'+(nm?nm.replace(/</g,'&lt;')+(cl?' – '+cl.replace(/</g,'&lt;'):''):'Kết quả')+'</b><br>Xếp loại: <b>'+rank+'</b><br>Thời gian: '+$('#st-time').textContent+'</div></div><div class="chips"><span class="chip g">Đúng '+right+'</span><span class="chip b">Sai '+(TOTAL-right)+'</span>'+secs.join('')+'</div>';
}
function submit(force){
 var left=TOTAL-answered();
 if(left>0&&!force){var w=$('#warn');w.style.display='block';w.innerHTML='Còn '+left+' câu chưa làm. ';var y=el('button','btn alt','Nộp luôn');y.type='button';y.style.cssText='padding:4px 14px;font-size:15px;margin:0 6px';y.onclick=function(){submit(true)};var n=el('button','btn alt','Làm tiếp');n.type='button';n.style.cssText='padding:4px 14px;font-size:15px';n.onclick=function(){w.style.display='none'};w.appendChild(y);w.appendChild(n);return}
 submitted=true;clearInterval(timer);
 items.forEach(function(it){it.ok=grade(it);showAns(it)});
 score();$('#submit').hidden=true;$('#again').hidden=false;$('#onlywrong').hidden=false;$('#warn').style.display='none';
 window.scrollTo({top:0,behavior:'smooth'});
}
$('#submit').onclick=function(){submit(false)};
$('#again').onclick=function(){ans={};submitted=false;t0=Date.now();clearInterval(timer);timer=setInterval(tick,1000);document.body.classList.remove('hidden-ok');build();$('#res').className='res';$('#submit').hidden=false;$('#again').hidden=true;$('#onlywrong').hidden=true;upd();tick();window.scrollTo({top:0})};
$('#onlywrong').onclick=function(){var on=document.body.classList.toggle('hidden-ok');this.textContent=on?'Xem tất cả câu':'Chỉ xem câu sai'};
build();upd();tick();timer=setInterval(tick,1000);
</script>
