<style>

<script>
const DATA={"L":[{"id":"u2gs","t":"Unit 2 – Getting Started","vt":"Kì nghỉ hè của Mai ở làng quê","src":"SGK tr.18–19","ic":"🌾","lines":[["Nick","Hi, Mai! You look so tanned. Where have you been?","Chào Mai! Trông bạn rám nắng quá. Bạn đã đi đâu vậy?"],["Mai","I've just come back from a wonderful summer holiday. I stayed at my uncle's house in a small village in Bac Ninh Province.","Mình vừa trở về sau một kì nghỉ hè tuyệt vời. Mình ở nhà chú mình trong một ngôi làng nhỏ ở tỉnh Bắc Ninh."],["Nick","Sounds great! What did you do there?","Nghe tuyệt quá! Bạn đã làm gì ở đó?"],["Mai","I helped my uncle's family with the rice harvest. The farmers there use a combine harvester, so it was quicker than I expected.","Mình giúp gia đình chú gặt lúa. Nông dân ở đó dùng máy gặt đập liên hợp nên nhanh hơn mình tưởng."],["Mai","I also herded buffaloes and cows with the village children, flew kites in the paddy fields, and played traditional games in the evenings.","Mình cũng chăn trâu bò cùng bọn trẻ trong làng, thả diều trên cánh đồng lúa và chơi các trò chơi dân gian vào buổi tối."],["Nick","I'm so jealous!","Mình ghen tị quá!"],["Mai","Life there is slower than in the city, but people seem much healthier.","Cuộc sống ở đó chậm hơn ở thành phố, nhưng mọi người có vẻ khỏe mạnh hơn nhiều."]],"vocab":[["tanned","/tænd/","rám nắng","You look so tanned!","Trông bạn rám nắng quá!"],["harvest","/ˈhɑːvɪst/","thu hoạch; vụ gặt","Farmers harvest rice in October.","Nông dân gặt lúa vào tháng Mười."],["combine harvester","/ˌkɒmbaɪn ˈhɑːvɪstə/","máy gặt đập liên hợp","A combine harvester works very fast.","Máy gặt đập liên hợp làm việc rất nhanh."],["herd","/hɜːd/","chăn dắt","He herds the buffaloes every afternoon.","Cậu ấy chăn trâu mỗi buổi chiều."],["paddy field","/ˈpædi fiːld/","cánh đồng lúa","Kites fly over the paddy field.","Những chiếc diều bay trên cánh đồng lúa."],["traditional games","/trəˈdɪʃənl ɡeɪmz/","trò chơi dân gian","We play traditional games at Tet.","Chúng tôi chơi trò chơi dân gian dịp Tết."],["slower","/ˈsləʊə/","chậm hơn","Life here is slower than in the city.","Cuộc sống ở đây chậm hơn ở thành phố."],["healthier","/ˈhelθiə/","khỏe mạnh hơn","People in the village look healthier.","Người dân ở làng trông khỏe mạnh hơn."],["buffalo","/ˈbʌfələʊ/","con trâu","The buffalo is eating grass.","Con trâu đang ăn cỏ."],["kite","/kaɪt/","con diều","Children fly kites in summer.","Trẻ em thả diều vào mùa hè."]],"sent":[["You look so tanned.","Trông bạn rám nắng quá."],["I helped my uncle's family with the rice harvest.","Mình giúp gia đình chú gặt lúa."],["The farmers there use a combine harvester.","Nông dân ở đó dùng máy gặt đập liên hợp."],["Life there is slower than in the city.","Cuộc sống ở đó chậm hơn ở thành phố."],["I stayed at my uncle's house in a small village.","Mình ở nhà chú trong một ngôi làng nhỏ."]],"sgk":[{"k":"mcq","title":"SGK Bài 2: Nghe và chọn đáp án đúng","vi":"Listen and choose the correct answer.","items":[{"q":"How does Mai feel about her holiday?","qv":"Mai cảm thấy thế nào về kì nghỉ của mình?","o":["She likes it.","She doesn't like it.","She feels tired."],"ov":["Bạn ấy thích nó.","Bạn ấy không thích nó.","Bạn ấy thấy mệt."],"a":0,"why":"Mai gọi đó là “a wonderful summer holiday” (kì nghỉ hè tuyệt vời) → cô ấy thích."},{"q":"Where did Mai stay?","qv":"Mai đã ở đâu?","o":["At her grandparents' house","At her uncle's house","At a hotel"],"ov":["Nhà ông bà","Nhà chú","Khách sạn"],"a":1,"why":"“I stayed at my uncle's house…”"},{"q":"How do the villagers harvest rice?","qv":"Dân làng thu hoạch lúa bằng cách nào?","o":["By hand","With buffaloes","Using a combine harvester"],"ov":["Bằng tay","Bằng trâu","Bằng máy gặt đập liên hợp"],"a":2,"why":"“The farmers there use a combine harvester.”"},{"q":"What kind of life do people in the countryside lead, according to Mai?","qv":"Theo Mai, người nông thôn sống cuộc sống thế nào?","o":["A healthy life","A busy life","A lonely life"],"ov":["Cuộc sống lành mạnh","Cuộc sống bận rộn","Cuộc sống cô đơn"],"a":0,"why":"“…people seem much healthier.”"}]}],"tf":[{"s":"Mai has just come back from a winter trip.","v":"Mai vừa trở về sau một chuyến đi mùa đông.","a":false,"why":"SAI – Mai nói mình vừa có kì nghỉ HÈ (summer holiday)."},{"s":"Mai stayed at her uncle's house.","v":"Mai đã ở nhà chú của mình.","a":true,"why":"ĐÚNG – “I stayed at my uncle's house”."},{"s":"The village is in Bac Giang Province.","v":"Ngôi làng thuộc tỉnh Bắc Giang.","a":false,"why":"SAI – Làng ở tỉnh Bắc Ninh (Bac Ninh Province)."},{"s":"The farmers harvest rice with a combine harvester.","v":"Nông dân gặt lúa bằng máy gặt đập liên hợp.","a":true,"why":"ĐÚNG – “use a combine harvester”."},{"s":"Mai played traditional games in the evenings.","v":"Mai chơi trò chơi dân gian vào buổi tối.","a":true,"why":"ĐÚNG – “played traditional games in the evenings”."}],"fill":[{"t":"Nick says Mai looks very ____.","v":"Nick nói Mai trông rất rám nắng.","a":["tanned"],"why":"tanned = rám nắng."},{"t":"Mai helped with the rice ____.","v":"Mai giúp gặt (thu hoạch) lúa.","a":["harvest"],"why":"harvest = vụ gặt, thu hoạch."},{"t":"She herded buffaloes and ____ with the village children.","v":"Mai chăn trâu và bò cùng bọn trẻ trong làng.","a":["cows"],"why":"cows = bò (herded buffaloes and cows)."},{"t":"She flew ____ in the paddy fields.","v":"Mai thả diều trên cánh đồng lúa.","a":["kites"],"why":"kites = diều (fly kites = thả diều)."},{"t":"Life in the village is ____ than in the city, but people are healthier.","v":"Cuộc sống ở làng chậm hơn ở thành phố, nhưng mọi người khỏe mạnh hơn.","a":["slower"],"why":"slower = chậm hơn (so sánh hơn của slow)."}],"bank":["tanned","harvest","cows","kites","slower"]},{"id":"u2s2","t":"Unit 2 – Skills 2","vt":"Ba người nói về cuộc sống nông thôn","src":"SGK tr.25","ic":"🏡","lines":[["Speaker 1","I love living in my village because there is a strong sense of community. Neighbours are always welcome in each other's homes, and people are very supportive. When someone is in trouble, everyone helps and shares what they have.","Tôi yêu cuộc sống ở làng vì ở đây có tinh thần cộng đồng rất mạnh. Hàng xóm luôn được chào đón ở nhà nhau và mọi người rất hay giúp đỡ nhau. Khi ai đó gặp khó khăn, mọi người cùng giúp và chia sẻ những gì mình có."],["Speaker 2","Honestly, I don't like life in the countryside. There are few good schools and colleges, and there is hardly any entertainment for young people. Public transport is also poor. I think we should improve the lives of people here.","Thành thật mà nói, tôi không thích cuộc sống ở nông thôn. Ở đây có ít trường học và trường cao đẳng tốt, hầu như không có hoạt động giải trí cho giới trẻ. Giao thông công cộng cũng kém. Tôi nghĩ chúng ta nên cải thiện cuộc sống của người dân ở đây."],["Speaker 3","I'd love to live in the countryside. There is so much space, and you can do many outdoor activities that are difficult to do in the city. Life here is peaceful and simple.","Tôi rất muốn sống ở nông thôn. Ở đây có rất nhiều không gian và bạn có thể làm nhiều hoạt động ngoài trời mà khó làm ở thành phố. Cuộc sống ở đây yên bình và giản dị."]],"vocab":[["sense of community","/sens əv kəˈmjuːnəti/","tinh thần cộng đồng","There is a strong sense of community here.","Ở đây có tinh thần cộng đồng mạnh mẽ."],["supportive","/səˈpɔːtɪv/","hay giúp đỡ, ủng hộ","My neighbours are very supportive.","Hàng xóm của tôi rất hay giúp đỡ."],["entertainment","/ˌentəˈteɪnmənt/","sự giải trí","There is little entertainment in my village.","Làng tôi có ít hoạt động giải trí."],["public transport","/ˌpʌblɪk ˈtrænspɔːt/","giao thông công cộng","Public transport is poor in the countryside.","Giao thông công cộng ở nông thôn còn kém."],["outdoor activities","/ˈaʊtdɔːr ækˈtɪvətiz/","hoạt động ngoài trời","I love outdoor activities like cycling.","Tôi thích các hoạt động ngoài trời như đạp xe."],["peaceful","/ˈpiːsfl/","yên bình","The village is quiet and peaceful.","Ngôi làng yên tĩnh và bình yên."],["simple","/ˈsɪmpl/","giản dị, đơn giản","They live a simple life.","Họ sống một cuộc sống giản dị."],["college","/ˈkɒlɪdʒ/","trường cao đẳng","There are few colleges in the countryside.","Ở nông thôn có ít trường cao đẳng."],["improve","/ɪmˈpruːv/","cải thiện","We should improve the lives of villagers.","Chúng ta nên cải thiện cuộc sống người dân làng."],["transportation","/ˌtrænspɔːˈteɪʃn/","giao thông vận tải","Transportation is a big problem here.","Giao thông vận tải là vấn đề lớn ở đây."]],"sent":[["There is a strong sense of community.","Có tinh thần cộng đồng mạnh mẽ."],["People are very supportive.","Mọi người rất hay giúp đỡ."],["Public transport is also poor.","Giao thông công cộng cũng kém."],["There is hardly any entertainment for young people.","Hầu như không có giải trí cho giới trẻ."],["Life here is peaceful and simple.","Cuộc sống ở đây yên bình và giản dị."]],"sgk":[{"k":"pair","title":"SGK Task 2: Nối người nói với ý kiến","vi":"Match each speaker with the opinion he/she expresses.","left":["Speaker 1","Speaker 2","Speaker 3"],"right":["A. Dislikes rural life: poor schools, colleges, entertainment and transport.","B. Likes rural life because people are close to each other.","C. Wants to live in the countryside: many activities are hard to do in the city."],"rv":["A. Không thích nông thôn: trường học, giải trí, giao thông kém.","B. Thích nông thôn vì mọi người gắn bó với nhau.","C. Muốn sống ở nông thôn: nhiều hoạt động khó làm ở thành phố."],"ans":[1,0,2],"why":["Người 1 nói về tinh thần cộng đồng → B.","Người 2 phàn nàn trường học, giải trí, giao thông → A.","Người 3 thích hoạt động ngoài trời → C."]},{"k":"mcq","title":"SGK Task 3: Nghe lại và chọn đáp án đúng","vi":"Listen again and choose the correct answer.","items":[{"q":"According to Speaker 1, there is a great sense of ______ in the village.","qv":"Theo người nói 1, trong làng có một ______ rất mạnh.","o":["security","duty","community"],"ov":["sự an toàn","bổn phận","tinh thần cộng đồng"],"a":2,"why":"“a strong sense of community”."},{"q":"Speaker 1 says people in the village are very ______.","qv":"Người nói 1 nói người trong làng rất ______.","o":["supportive","unsociable","well-trained"],"ov":["hay giúp đỡ","khó gần","được đào tạo tốt"],"a":0,"why":"“people are very supportive”."},{"q":"In Speaker 2's opinion, ______ is a big problem in the countryside.","qv":"Theo người nói 2, ______ là vấn đề lớn ở nông thôn.","o":["the cost of living","safety","transportation"],"ov":["chi phí sinh hoạt","sự an toàn","giao thông vận tải"],"a":2,"why":"Người 2 nhấn mạnh giao thông công cộng kém."},{"q":"Speaker 2 says they should ______ in the countryside.","qv":"Người nói 2 nói họ nên ______ ở nông thôn.","o":["improve the lives of people","prevent crime","protect nature"],"ov":["cải thiện cuộc sống người dân","ngăn ngừa tội phạm","bảo vệ thiên nhiên"],"a":0,"why":"“we should improve the lives of people here”."},{"q":"According to Speaker 3, life in the countryside is peaceful and ______.","qv":"Theo người nói 3, cuộc sống ở nông thôn yên bình và ______.","o":["slow","simple","safe"],"ov":["chậm","giản dị","an toàn"],"a":1,"why":"“peaceful and simple”."}]}],"tf":[{"s":"Speaker 1 says there is a strong sense of community in the village.","v":"Người nói 1 nói rằng làng có tinh thần cộng đồng mạnh.","a":true,"why":"ĐÚNG – “a strong sense of community”."},{"s":"Speaker 1 says neighbours are not welcome in each other's homes.","v":"Người nói 1 nói hàng xóm không được chào đón ở nhà nhau.","a":false,"why":"SAI – “Neighbours are always welcome”."},{"s":"Speaker 2 likes life in the countryside.","v":"Người nói 2 thích cuộc sống nông thôn.","a":false,"why":"SAI – Người nói 2: “I don't like life in the countryside”."},{"s":"Speaker 2 complains about public transport.","v":"Người nói 2 phàn nàn về giao thông công cộng.","a":true,"why":"ĐÚNG – “Public transport is also poor”."},{"s":"Speaker 3 thinks the countryside is noisy and busy.","v":"Người nói 3 nghĩ nông thôn ồn ào, đông đúc.","a":false,"why":"SAI – Người nói 3: yên bình và giản dị (peaceful and simple)."}],"fill":[{"t":"Speaker 1: There is a strong sense of ____ in my village.","v":"Người nói 1: Làng tôi có tinh thần cộng đồng rất mạnh.","a":["community"],"why":"community = cộng đồng."},{"t":"Speaker 1: People in the village are very ____.","v":"Người nói 1: Mọi người trong làng rất hay giúp đỡ nhau.","a":["supportive"],"why":"supportive = hay giúp đỡ."},{"t":"Speaker 2: There are few good schools and ____.","v":"Người nói 2: Có ít trường học và trường cao đẳng tốt.","a":["colleges"],"why":"colleges = trường cao đẳng."},{"t":"Speaker 3: You can do many ____ activities that are hard to do in the city.","v":"Người nói 3: Bạn có thể làm nhiều hoạt động ngoài trời mà khó làm ở thành phố.","a":["outdoor"],"why":"outdoor = ngoài trời."},{"t":"Speaker 3: Life in the countryside is peaceful and ____.","v":"Người nói 3: Cuộc sống ở nông thôn yên bình và giản dị.","a":["simple"],"why":"simple = giản dị, đơn giản."}],"bank":["community","supportive","colleges","outdoor","simple"]},{"id":"u3gs","t":"Unit 3 – Getting Started","vt":"Diễn đàn lớp, câu lạc bộ và áp lực","src":"SGK tr.28–29","ic":"💬","lines":[["Teacher","Welcome back, class. What's new?","Chào mừng các em trở lại lớp. Có gì mới không nào?"],["Minh","Our class forum is now on Facebook, and we are preparing for the midterm tests. I find them stressful.","Diễn đàn của lớp em giờ đã chuyển lên Facebook, và chúng em đang chuẩn bị cho các bài kiểm tra giữa kì. Em thấy chúng rất căng thẳng."],["Teacher","Try to stay calm and keep working hard. Do you feel any other pressure?","Hãy cố giữ bình tĩnh và tiếp tục học chăm chỉ nhé. Em có cảm thấy áp lực nào khác không?"],["Minh","Yes. I feel pressure from my parents and from my friends.","Có ạ. Em cảm thấy áp lực từ bố mẹ và từ bạn bè."],["Ann","We chose Facebook because it's easy to use. We also have new clubs, like an arts and crafts club and a music club, with activities for different interests.","Chúng em chọn Facebook vì nó dễ sử dụng. Chúng em cũng có các câu lạc bộ mới, như câu lạc bộ thủ công mỹ nghệ và câu lạc bộ âm nhạc, với các hoạt động cho nhiều sở thích khác nhau."],["Teacher","I hope everyone can join the clubs they like.","Cô hi vọng mọi người có thể tham gia các câu lạc bộ mình thích."]],"vocab":[["forum","/ˈfɔːrəm/","diễn đàn","We discuss problems on the class forum.","Chúng tôi thảo luận vấn đề trên diễn đàn lớp."],["midterm test","/ˌmɪdˈtɜːm test/","bài kiểm tra giữa kì","I'm preparing for the midterm tests.","Tôi đang chuẩn bị cho bài kiểm tra giữa kì."],["stressful","/ˈstresfl/","gây căng thẳng","Exams can be very stressful.","Kì thi có thể rất căng thẳng."],["pressure","/ˈpreʃə/","áp lực","Teens feel pressure from parents.","Thanh thiếu niên chịu áp lực từ bố mẹ."],["easy to use","/ˈiːzi tə juːz/","dễ sử dụng","This app is easy to use.","Ứng dụng này dễ sử dụng."],["arts and crafts club","/ˌɑːts ən ˈkrɑːfts klʌb/","câu lạc bộ thủ công mỹ nghệ","I joined the arts and crafts club.","Mình đã tham gia câu lạc bộ thủ công mỹ nghệ."],["music club","/ˈmjuːzɪk klʌb/","câu lạc bộ âm nhạc","She sings in the music club.","Cô ấy hát trong câu lạc bộ âm nhạc."],["chess club","/ˈtʃes klʌb/","câu lạc bộ cờ vua","The chess club meets on Fridays.","Câu lạc bộ cờ vua họp vào thứ Sáu."],["sports club","/ˈspɔːts klʌb/","câu lạc bộ thể thao","He plays football in the sports club.","Cậu ấy chơi bóng đá ở câu lạc bộ thể thao."],["language club","/ˈlæŋɡwɪdʒ klʌb/","câu lạc bộ ngoại ngữ","The language club helps me practise English.","Câu lạc bộ ngoại ngữ giúp tôi luyện tiếng Anh."]],"sent":[["Our class forum is now on Facebook.","Diễn đàn của lớp giờ ở trên Facebook."],["I find them stressful.","Mình thấy chúng gây căng thẳng."],["I feel pressure from my parents and from my friends.","Em cảm thấy áp lực từ bố mẹ và từ bạn bè."],["We chose Facebook because it's easy to use.","Chúng em chọn Facebook vì nó dễ dùng."],["I hope everyone can join the clubs they like.","Cô hi vọng mọi người có thể tham gia các câu lạc bộ mình thích."]],"sgk":[{"k":"pair","title":"SGK Bài 3: Nối từ với nghĩa tiếng Việt","vi":"Learn the words: language club, pressure, arts and crafts club, forum, sports club, chess club.","left":["language club","pressure","arts and crafts club","forum","sports club","chess club"],"right":["diễn đàn","câu lạc bộ cờ vua","câu lạc bộ thủ công mỹ nghệ","áp lực","câu lạc bộ thể thao","câu lạc bộ ngoại ngữ"],"rv":null,"ans":[5,3,2,0,4,1],"why":["language club = CLB ngoại ngữ","pressure = áp lực","arts and crafts club = CLB thủ công mỹ nghệ","forum = diễn đàn","sports club = CLB thể thao","chess club = CLB cờ vua"]}],"tf":[{"s":"The students have already finished their midterm tests.","v":"Các học sinh đã làm xong bài kiểm tra giữa kì.","a":false,"why":"SAI – Các em đang CHUẨN BỊ (preparing for) bài kiểm tra."},{"s":"Minh finds the midterm tests stressful.","v":"Minh thấy bài kiểm tra giữa kì gây căng thẳng.","a":true,"why":"ĐÚNG – “I find them stressful”."},{"s":"The class forum is now on Facebook.","v":"Diễn đàn lớp giờ ở trên Facebook.","a":true,"why":"ĐÚNG – “Our class forum is now on Facebook”."},{"s":"Ann says they chose Facebook because it is difficult to use.","v":"Ann nói họ chọn Facebook vì nó khó dùng.","a":false,"why":"SAI – Vì nó DỄ sử dụng (easy to use)."},{"s":"The new clubs include an arts and crafts club and a music club.","v":"Các câu lạc bộ mới gồm thủ công mỹ nghệ và âm nhạc.","a":true,"why":"ĐÚNG – Ann nhắc cả hai câu lạc bộ."}],"fill":[{"t":"The class forum is now on ____.","v":"Diễn đàn của lớp giờ ở trên Facebook.","a":["facebook"],"why":"Facebook."},{"t":"Minh feels pressure from his parents and from his ____.","v":"Minh cảm thấy áp lực từ bố mẹ và từ bạn bè.","a":["friends"],"why":"friends = bạn bè."},{"t":"Ann says Facebook is easy to ____.","v":"Ann nói Facebook dễ sử dụng.","a":["use"],"why":"easy to use = dễ sử dụng."},{"t":"The new clubs are an arts and ____ club and a music club.","v":"Các câu lạc bộ mới: thủ công mỹ nghệ và âm nhạc.","a":["crafts"],"why":"arts and crafts club = câu lạc bộ thủ công mỹ nghệ."},{"t":"The teacher hopes everyone can ____ the clubs they like.","v":"Giáo viên hi vọng mọi người có thể tham gia các câu lạc bộ mình thích.","a":["join"],"why":"join = tham gia."}],"bank":["facebook","friends","use","crafts","join"]},{"id":"u3s2","t":"Unit 3 – Skills 2","vt":"Mi, Minh và Ann nói về căng thẳng","src":"SGK tr.35","ic":"😓","lines":[["Mi","Our teacher invited us to talk about stress on the class forum. What stress do you have?","Cô giáo mời chúng ta thảo luận về căng thẳng (stress) trên diễn đàn của lớp. Các bạn đang gặp căng thẳng gì?"],["Minh","My parents expect too much from me. They send me to a lot of classes that I don't want to attend.","Bố mẹ mình kì vọng quá nhiều ở mình. Họ cho mình đi học rất nhiều lớp mà mình không muốn học."],["Ann","Why don't you talk to them about your interests and abilities? I did, and now they don't send me to classes I dislike. These days I focus on my health and try to lose weight.","Sao bạn không nói với họ về sở thích và khả năng của mình? Mình đã làm vậy và giờ họ không cho mình học những lớp mình không thích nữa. Dạo này mình tập trung vào sức khỏe và cố gắng giảm cân."],["Minh","But you look fit, Ann. You should feel good about your body.","Nhưng trông bạn cân đối mà, Ann. Bạn nên cảm thấy hài lòng về cơ thể mình."],["Mi","My problem is my sister. She is jealous of everything I have, and she often starts arguments. So I had to talk to my mum.","Vấn đề của mình là chị/em gái. Cô ấy ghen tị với mọi thứ mình có và hay gây gổ. Vì vậy mình đã phải nói chuyện với mẹ."]],"vocab":[["expect","/ɪkˈspekt/","kì vọng, mong đợi","My parents expect me to get good marks.","Bố mẹ kì vọng tôi đạt điểm cao."],["interest","/ˈɪntrəst/","sở thích; hứng thú","Tell your parents about your interests.","Hãy nói với bố mẹ về sở thích của bạn."],["ability","/əˈbɪləti/","khả năng","Everyone has different abilities.","Mỗi người có khả năng khác nhau."],["focus on","/ˈfəʊkəs ɒn/","tập trung vào","I focus on my health.","Tôi tập trung vào sức khỏe."],["fit","/fɪt/","cân đối, khỏe mạnh","You look fit and healthy.","Bạn trông cân đối và khỏe mạnh."],["jealous","/ˈdʒeləs/","ghen tị","She is jealous of her sister.","Cô ấy ghen tị với chị gái."],["argument","/ˈɑːɡjumənt/","cuộc tranh cãi","They often have arguments.","Họ thường xuyên cãi nhau."],["parents","/ˈpeərənts/","bố mẹ","My parents work in a school.","Bố mẹ tôi làm việc ở một trường học."],["weight","/weɪt/","cân nặng","She wants to lose weight.","Cô ấy muốn giảm cân."],["body","/ˈbɒdi/","cơ thể","Feel good about your body.","Hãy cảm thấy hài lòng về cơ thể mình."]],"sent":[["My parents expect too much from me.","Bố mẹ mình kì vọng quá nhiều ở mình."],["Why don't you talk to them about your interests and abilities?","Sao bạn không nói với họ về sở thích và khả năng của mình?"],["These days I focus on my health and try to lose weight.","Dạo này mình tập trung vào sức khỏe và cố giảm cân."],["You should feel good about your body.","Bạn nên cảm thấy hài lòng về cơ thể mình."],["She is jealous of everything I have.","Cô ấy ghen tị với mọi thứ mình có."]],"sgk":[{"k":"multi","title":"SGK Task 1: Em nghĩ thanh thiếu niên chịu những loại áp lực nào?","vi":"Which types of pressure below do you think teens face? (Chọn các đáp án đúng.)","items":[{"q":"Types of pressure","qv":"Các loại áp lực","o":["parental pressure","pressure from work","pressure from schoolwork","pressure from their clubs"],"ov":["áp lực từ bố mẹ","áp lực công việc","áp lực bài vở","áp lực từ câu lạc bộ"],"a":[0,2],"why":"Bài hội thoại nói về áp lực từ bố mẹ (kì vọng, học thêm) và học tập. (Đáp án gợi ý SGK: A, C)"}]},{"k":"mcq","title":"SGK Task 2: Nghe hội thoại và chọn đáp án đúng","vi":"Listen to a conversation and choose the correct answer to each question.","items":[{"q":"How many students are talking?","qv":"Có bao nhiêu học sinh đang nói chuyện?","o":["One","Two","Three"],"ov":["Một","Hai","Ba"],"a":2,"why":"Mi, Minh và Ann."},{"q":"What are they discussing?","qv":"Họ đang thảo luận về điều gì?","o":["Their class forum","Their stress","Their community activities"],"ov":["Diễn đàn lớp","Sự căng thẳng của họ","Hoạt động cộng đồng"],"a":1,"why":"Mi: “discuss the stress we have in our lives”."}]},{"k":"fill","title":"SGK Task 3: Nghe lại và điền MỘT từ","vi":"Listen to the conversation again and fill in each blank with ONE word.","items":[{"t":"Minh's ____ expect too much from him.","v":"Bố mẹ của Minh kì vọng quá nhiều ở cậu ấy.","a":["parents"]},{"t":"Ann tells Minh to talk about his interests and ____.","v":"Ann bảo Minh nói về sở thích và khả năng của mình.","a":["abilities"]},{"t":"Ann wants to lose ____ (kg).","v":"Ann muốn giảm cân.","a":["weight"],"alt":["body"]},{"t":"Minh says Ann should feel ____ about her body.","v":"Minh nói Ann nên cảm thấy hài lòng (tốt) về cơ thể mình.","a":["good"]},{"t":"Mi has problems with her ____ because she is jealous.","v":"Mi có vấn đề với chị/em gái vì cô ấy hay ghen tị.","a":["sister"]},{"t":"Mi had to ____ to her mum.","v":"Mi phải nói chuyện với mẹ.","a":["talk"]}],"bank":["parents","abilities","weight","good","sister","talk"]}],"tf":[{"s":"Three students are talking in the conversation.","v":"Có ba học sinh đang nói chuyện.","a":true,"why":"ĐÚNG – Mi, Minh và Ann."},{"s":"They are discussing the rules of the class forum.","v":"Họ đang thảo luận quy định của diễn đàn lớp.","a":false,"why":"SAI – Họ nói về căng thẳng (stress)."},{"s":"Minh's parents send him to classes he doesn't want to attend.","v":"Bố mẹ Minh cho cậu học những lớp cậu không muốn.","a":true,"why":"ĐÚNG – “classes that I don't want to attend”."},{"s":"Ann's parents still send her to classes she dislikes.","v":"Bố mẹ Ann vẫn cho cô học những lớp cô không thích.","a":false,"why":"SAI – Họ không còn cho Ann học các lớp đó nữa."},{"s":"Mi talked to her mum about her sister.","v":"Mi đã nói chuyện với mẹ về chị/em gái.","a":true,"why":"ĐÚNG – “So I talked to my mum”."}],"fill":[{"t":"Minh's parents send him to a lot of ____.","v":"Bố mẹ Minh cho cậu học rất nhiều lớp.","a":["classes"],"why":"classes = lớp học."},{"t":"Ann tells Minh to talk about his interests and ____.","v":"Ann bảo Minh nói về sở thích và khả năng của mình.","a":["abilities"],"why":"abilities = khả năng."},{"t":"Ann now focuses on her ____.","v":"Bây giờ Ann tập trung vào sức khỏe.","a":["health"],"why":"health = sức khỏe."},{"t":"Minh says Ann should feel ____ about her body.","v":"Minh nói Ann nên cảm thấy hài lòng về cơ thể mình.","a":["good"],"why":"feel good about = cảm thấy hài lòng về."},{"t":"Mi's sister is ____ of everything she has.","v":"Chị/em gái của Mi ghen tị với mọi thứ bạn ấy có.","a":["jealous"],"why":"jealous = ghen tị."}],"bank":["classes","abilities","health","good","jealous"]},{"id":"rev5","t":"Bài ôn tổng hợp (Đề 5)","vt":"Hoa và Nam: cuối tuần ở quê và áp lực học tập","src":"Đề thi thử 5","ic":"📝","lines":[["Hoa","Hi, Nam. How was your weekend?","Chào Nam. Cuối tuần của bạn thế nào?"],["Nam","It was great. I went to my grandparents' village in Thai Binh. I fed the ducks, flew a kite, and helped my grandpa dry the rice.","Rất tuyệt. Mình về làng của ông bà ở Thái Bình. Mình cho vịt ăn, thả diều và giúp ông phơi lúa."],["Hoa","That sounds relaxing. I stayed at home all weekend to study for the English test on Monday, and I feel very stressed.","Nghe thư giãn nhỉ. Mình ở nhà cả cuối tuần để học cho bài kiểm tra tiếng Anh hôm thứ Hai và mình thấy rất căng thẳng."],["Nam","You should take a short break every hour. Why don't you go cycling with me this afternoon?","Bạn nên nghỉ giải lao ngắn mỗi giờ. Sao chiều nay bạn không đi đạp xe với mình?"],["Hoa","Good idea. And I'll talk to my parents, too. They want me to join three extra classes, and it's too much.","Ý hay đấy. Mình cũng sẽ nói chuyện với bố mẹ. Họ muốn mình học thêm ba lớp, như vậy là quá nhiều."],["Nam","I hope they will listen. const LS=DATA.L,ANSVI=DATA.ansvi,L4="ABCD";
const $=s=>document.querySelector(s);
const app={l:0,a:"read",done:{},best:{}};

function save(){try{localStorage.setItem("e8done",JSON.stringify(app.done))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nf=x=>x.toLowerCase().trim().replace(/[.,!?]$/,"").replace(/[-\s]+/g," ");

/* ---- speech ---- */
let voices=[];
function loadV(){voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const s=$("#voice");s.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name}</option>`).join("");const i=voices.findIndex(v=>/en[-_]US/.test(v.lang));if(i>=0)s.value=i;$("#warn").style.display=voices.length?"none":"block"}
if("speechSynthesis" in window){loadV();speechSynthesis.onvoiceschanged=loadV}
let stok=0;
function say(text,o={}){return new Promise(res=>{if(!("speechSynthesis" in window)){res();return}
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=o.rate||+$("#rate").value;
 const v=voices[+$("#voice").value];if(v)u.voice=v;u.pitch=o.pitch||1;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
function stopSay(){stok++;if("speechSynthesis" in window)speechSynthesis.cancel()}
function sayNow(t,o){stopSay();say(t,o)}
const pitchOf=(l,sp)=>{const s=[...new Set(LS[l].lines.map(x=>x[0]))];return [1,.8,1.15,.7][s.indexOf(sp)%4]};

/* ---- shell ---- */
function mark(k,pct){app.done[app.l+"-"+k]=Math.max(app.done[app.l+"-"+k]||0,pct);save();paintActs()}
const ACTS=[["read","🎧 Nghe & đọc"],["vocab","📚 Từ vựng"],["match","🔗 Nối từ"],["sgk","📖 Bài SGK"],["tf","✔✘ True/False"],["fill","✍ Điền từ"],["order","🔀 Sắp xếp câu"],["dict","⌨ Chép chính tả"]];
function paintLessons(){$("#lessons").innerHTML=LS.map((l,i)=>`<button class="ls ${i==app.l?"on":""}" onclick="goL(${i})"><b>${l.ic} ${l.t}</b><span>${l.src}</span></button>`).join("")+`<button class="ls ${app.l==-1?"on":""}" onclick="goL(-1)"><b>🧠 Ôn từ đáp án</b><span>Từ cần nhớ + trò chơi</span></button>`}
function paintActs(){if(app.l==-1){$("#acts").innerHTML="";return}
 $("#acts").innerHTML=ACTS.map(a=>`<button class="act ${app.a==a[0]?"on":""} ${(app.done[app.l+"-"+a[0]]||0)>=80?"dn":""}" onclick="goA('${a[0]}')">${a[1]}</button>`).join("")}
function goL(i){stopSay();app.l=i;if(i>=0&&app.a=="rev")app.a="read";paintLessons();paintActs();render()}
function goA(a){stopSay();app.a=a;paintActs();render()}
$("#tvi").onchange=e=>document.body.classList.toggle("novi",!e.target.checked);
function render(){const m=$("#main");if(app.l==-1){m.innerHTML=reviewHtml();return}
 const l=LS[app.l];
 const head=`<h2>${l.ic} ${l.t} <span class="vi">— ${l.vt}</span></h2>`;
 const f={read,vocab,match,sgk,tf,fill,order,dict}[app.a];
 m.innerHTML=`<div class="card">${head}<div id="act"></div></div>`;f();
}

/* ---- READ ---- */
function hl(text,l){let t=esc(text);LS[l].vocab.forEach(v=>{const re=new RegExp("\\b("+v[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\b","gi");t=t.replace(re,`<mark title="${v[2]}">$1</mark>`)});return t}
function read(){const l=LS[app.l];
 $("#act").innerHTML=`<p class="hint">Bấm 🔊 để nghe từng câu, hoặc “Nghe cả bài”. Từ được tô vàng là từ vựng quan trọng (đưa chuột/chạm để xem nghĩa).</p>
 <div class="row"><button class="b" onclick="playAll()">▶ Nghe cả bài</button><button class="b g" onclick="stopSay();clr()">⏹ Dừng</button>
 <label><input type="checkbox" onchange="document.body.classList.toggle('hide',this.checked)" ${document.body.classList.contains("hide")?"checked":""}> Nghe trước, ẩn chữ (bấm vào dòng để hiện)</label></div>
 ${l.lines.map((x,i)=>`<div class="ln" id="ln${i}"><b>${x[0]}</b><div class="tx"><div class="en" onclick="this.classList.toggle('rv')">${hl(x[1],app.l)}</div><div class="vi">${x[2]}</div></div><button class="sm" onclick="sayLine(${i})">🔊</button></div>`).join("")}`;
 mark("read",100)}
function clr(){document.querySelectorAll(".ln.pl").forEach(x=>x.classList.remove("pl"))}
async function sayLine(i){stopSay();const my=stok;clr();$("#ln"+i).classList.add("pl");await say(LS[app.l].lines[i][1],{pitch:pitchOf(app.l,LS[app.l].lines[i][0])});if(my==stok)clr()}
async function playAll(){stopSay();const my=stok;const ls=LS[app.l].lines;for(let i=0;i<ls.length;i++){if(my!=stok)return;clr();const e=$("#ln"+i);if(!e)return;e.classList.add("pl");e.scrollIntoView({block:"nearest"});await say(ls[i][1],{pitch:pitchOf(app.l,ls[i][0])});await new Promise(r=>setTimeout(r,300))}clr()}

/* ---- VOCAB flashcards ---- */
let fcs={i:0,order:[],flip:false,known:{}};
function vocab(){const l=LS[app.l];fcs.order=l.vocab.map((_,i)=>i);fcs.i=0;fcs.flip=false;fcs.known={};drawFc()}
function drawFc(){const l=LS[app.l],v=l.vocab[fcs.order[fcs.i]];const kn=Object.keys(fcs.known).length;
 $("#act").innerHTML=`<p class="hint">Bấm vào thẻ để lật. Bấm 🔊 để nghe. Chọn “Đã nhớ” khi chắc chắn.</p>
 <div class="pb"><i style="width:${kn/l.vocab.length*100}%"></i></div><div class="score">Đã nhớ ${kn}/${l.vocab.length} từ • thẻ ${fcs.i+1}/${l.vocab.length}</div>
 <div class="fc ${fcs.flip?"flip":""}" onclick="fcs.flip=!fcs.flip;this.classList.toggle('flip')"><div class="fci"><div class="face front"><div class="w">${v[0]}</div><div class="ip">${v[1]}</div><button class="sm" style="margin-top:8px" onclick="event.stopPropagation();sayNow('${v[0].replace(/'/g,"\\'")}')">🔊</button></div>
 <div class="face back"><div class="w" style="color:var(--tl)">${v[2]}</div><p style="margin:8px 0 2px">${v[3]}</p><p class="vi" style="margin:0">${v[4]}</p><button class="sm" style="margin-top:6px" onclick="event.stopPropagation();sayNow('${v[3].replace(/'/g,"\\'")}')">🔊</button></div></div></div>
 <div class="row" style="justify-content:center"><button class="b g" onclick="fcMove(-1)">◀</button><button class="b g" onclick="fcKnow(false)">Chưa nhớ</button><button class="b" onclick="fcKnow(true)">Đã nhớ ✓</button><button class="b g" onclick="fcMove(1)">▶</button><button class="b g" onclick="fcs.order=shuffle(fcs.order);fcs.i=0;drawFc()">🔀 Xáo</button></div>
 <h3>Bảng từ vựng</h3><table class="vt"><tr><th></th><th>Từ</th><th>Phiên âm</th><th>Nghĩa</th></tr>${l.vocab.map(v=>`<tr><td><button class="sm" onclick="sayNow('${v[0].replace(/'/g,"\\'")}')">🔊</button></td><td><b>${v[0]}</b></td><td>${v[1]}</td><td>${v[2]}</td></tr>`).join("")}</table>`;
 if(kn==l.vocab.length)mark("vocab",100)}
function fcMove(d){const n=fcs.order.length;fcs.i=(fcs.i+d+n)%n;fcs.flip=false;drawFc()}
function fcKnow(k){const id=fcs.order[fcs.i];if(k)fcs.known[id]=1;else delete fcs.known[id];fcMove(1)}

/* ---- MATCH ---- */
let mt={};
function match(){const l=LS[app.l];const vs=l.vocab.slice(0,8);mt={left:shuffle(vs.map((v,i)=>i)),right:shuffle(vs.map((v,i)=>i)),sel:null,ok:{},tries:0,wrong:0};drawMt()}
function drawMt(){const l=LS[app.l],n=mt.left.length,ok=Object.keys(mt.ok).length;
 $("#act").innerHTML=`<p class="hint">Bấm một từ tiếng Anh ở bên trái, rồi bấm nghĩa tiếng Việt tương ứng ở bên phải.</p><div class="score">Đúng ${ok}/${n} • Sai ${mt.wrong} lần</div><div class="pb"><i style="width:${ok/n*100}%"></i></div>
 <div class="match"><div>${mt.left.map(i=>`<button class="opt ${mt.ok[i]?"good":""} ${mt.sel===i?"sel":""}" style="display:block;width:100%;margin:4px 0" ${mt.ok[i]?"disabled":""} onclick="mtL(${i})">${l.vocab[i][0]}</button>`).join("")}</div>
 <div>${mt.right.map(i=>`<button class="opt ${mt.ok[i]?"good":""}" style="display:block;width:100%;margin:4px 0" ${mt.ok[i]?"disabled":""} onclick="mtR(${i},this)">${l.vocab[i][2]}</button>`).join("")}</div></div>
 ${ok==n?`<p class="score big">🎉 Hoàn thành! <button class="b" onclick="match()">Chơi lại</button></p>`:""}`;
 if(ok==n)mark("match",100)}
function mtL(i){mt.sel=i;sayNow(LS[app.l].vocab[i][0]);drawMt()}
function mtR(i,el){if(mt.sel==null)return;if(mt.sel===i){mt.ok[i]=1;mt.sel=null;drawMt()}else{mt.wrong++;el.classList.add("bad","shake");setTimeout(drawMt,400)}}

/* ---- generic items ---- */
function mcqHtml(it,id,multi){return `<div class="q" id="${id}"><div>${it.q.replace(/______|____/,"<b>＿＿＿</b>")}</div><div class="vi">${it.qv}</div><div class="opts">${it.o.map((o,j)=>`<button class="opt" data-j="${j}" onclick="pick('${id}',${j},${!!multi})"><b>${L4[j]}.</b> ${o} <span class="vi">(${it.ov[j]})</span></button>`).join("")}</div><div class="fb"></div></div>`}
const picks={};
function pick(id,j,multi){const p=picks[id]=picks[id]||[];const k=p.indexOf(j);if(multi){if(k>=0)p.splice(k,1);else p.push(j)}else picks[id]=[j];document.querySelectorAll(`#${id} .opt`).forEach(b=>b.classList.toggle("sel",picks[id].includes(+b.dataset.j)));if(!multi){const it=cur[id];if(it&&it.instant)gradeMcq(id)}}
let cur={};
function gradeMcq(id){const it=cur[id],p=(picks[id]||[]).slice().sort();const ans=[].concat(it.a).sort();const ok=p.length==ans.length&&p.every((x,i)=>x==ans[i]);
 const box=$("#"+id);box.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.j;b.classList.remove("good","bad");if(ans.includes(j))b.classList.add("good");else if(p.includes(j))b.classList.add("bad")});
 const fb=box.querySelector(".fb");fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"✔ Chính xác!":"✘ Chưa đúng – đáp án: "+ans.map(x=>L4[x]).join(", ");
 if(!box.querySelector(".ex"))fb.insertAdjacentHTML("afterend",`<div class="ex">💡 ${it.why}</div>`);it.ok=ok;return ok}

function sgk(){const l=LS[app.l];let n=0;cur={};
 $("#act").innerHTML=l.sgk.map((t,ti)=>{let h=`<h3>${t.title}</h3><div class="vi">${t.vi}</div>`;
  if(t.k=="mcq"||t.k=="multi"){t.items.forEach((it,j)=>{const id=`s${ti}_${j}`;cur[id]=it;h+=mcqHtml(it,id,t.k=="multi")});
   h+=`<div class="row"><button class="b" onclick="chkTask(${ti})">Kiểm tra</button><span class="score" id="sc${ti}"></span></div>`}
  else if(t.k=="pair"){h+=t.left.map((x,j)=>`<div class="q" id="p${ti}_${j}"><b>${x}</b> → <select>${'<option value="">— chọn —</option>'+t.right.map((r,k)=>`<option value="${k}">${r}${t.rv?" ("+t.rv[k]+")":""}</option>`).join("")}</select><div class="fb"></div></div>`).join("")+`<div class="row"><button class="b" onclick="chkPair(${ti})">Kiểm tra</button><span class="score" id="sc${ti}"></span></div>`}
  else if(t.k=="fill"){h+=`<div class="chips">${shuffle(t.bank).map(w=>`<span class="chip" onclick="chipFill(this,${ti})">${w}</span>`).join("")}</div>`+t.items.map((it,j)=>`<div class="q" id="f${ti}_${j}"><div>${j+1}. ${esc(it.t).replace("____",'<input class="t" type="text" autocomplete="off" spellcheck="false">')}</div><div class="vi">${it.v}</div><div class="fb"></div></div>`).join("")+`<div class="row"><button class="b" onclick="chkFill(${ti})">Kiểm tra</button><span class="score" id="sc${ti}"></span></div>`}
  return h}).join("");
 window._sgkTotal=l.sgk.length;window._sgkDone={}}
function chkTask(ti){const t=LS[app.l].sgk[ti];let c=0;t.items.forEach((it,j)=>{if(gradeMcq(`s${ti}_${j}`))c++});$("#sc"+ti).textContent=`Đúng ${c}/${t.items.length}`;taskDone(ti)}
function chkPair(ti){const t=LS[app.l].sgk[ti];let c=0;t.left.forEach((x,j)=>{const box=$(`#p${ti}_${j}`),s=box.querySelector("select"),fb=box.querySelector(".fb");const ok=s.value!==""&&+s.value===t.ans[j];s.className=ok?"good":"bad";fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"✔ Đúng":"✘ Đáp án: "+t.right[t.ans[j]];if(!box.querySelector(".ex"))fb.insertAdjacentHTML("afterend",`<div class="ex">💡 ${t.why[j]}</div>`);if(ok)c++});$("#sc"+ti).textContent=`Đúng ${c}/${t.left.length}`;taskDone(ti)}
let activeInp=null;document.addEventListener("focusin",e=>{if(e.target.classList&&e.target.classList.contains("t"))activeInp=e.target});
function chipFill(el,ti){if(activeInp&&activeInp.isConnected){activeInp.value=el.textContent;activeInp.focus()}else{const i=document.querySelector(".t:not([data-set])");if(i){i.value=el.textContent}}}
function chkFill(ti){const t=LS[app.l].sgk[ti];let c=0;t.items.forEach((it,j)=>{const box=$(`#f${ti}_${j}`),inp=box.querySelector("input"),fb=box.querySelector(".fb");const acc=it.a.concat(it.alt||[]).map(nf);const ok=acc.includes(nf(inp.value));inp.className="t "+(ok?"good":"bad");fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"✔ Đúng":"✘ Đáp án: "+it.a[0]+(ANSVI[it.a[0]]?" = "+ANSVI[it.a[0]]:"");if(ok)c++});$("#sc"+ti).textContent=`Đúng ${c}/${t.items.length}`;taskDone(ti)}
function taskDone(ti){window._sgkDone[ti]=1;if(Object.keys(window._sgkDone).length>=window._sgkTotal)mark("sgk",100)}

/* ---- TF ---- */
function tf(){const l=LS[app.l];tfs={c:0,n:0,d:{}};$("#act").innerHTML=`<p class="hint">Nghe lại bài (nút bên dưới) rồi chọn Đúng (T) hoặc Sai (F). Đáp án và giải thích hiện ngay.</p><div class="row"><button class="b" onclick="playScript()">▶ Nghe bài</button><button class="b g" onclick="stopSay()">⏹</button><span class="score" id="tfsc"></span></div>`+l.tf.map((q,i)=>`<div class="q" id="tf${i}"><div><b>${i+1}.</b> ${q.s}</div><div class="vi">${q.v}</div><div class="opts"><button class="opt" onclick="tfA(${i},true)">T – Đúng</button><button class="opt" onclick="tfA(${i},false)">F – Sai</button></div><div class="fb"></div></div>`).join("")}
let tfs={};
function playScript(){const l=LS[app.l];(async()=>{stopSay();const my=stok;for(const x of l.lines){if(my!=stok)return;await say(x[1],{pitch:pitchOf(app.l,x[0])});await new Promise(r=>setTimeout(r,250))}})()}
function tfA(i,v){const q=LS[app.l].tf[i];if(tfs.d[i]!==undefined)return;tfs.d[i]=1;const ok=v===q.a;const box=$("#tf"+i),bs=box.querySelectorAll(".opt");bs[q.a?0:1].classList.add("good");if(!ok)bs[v?0:1].classList.add("bad");const fb=box.querySelector(".fb");fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"✔ Đúng":"✘ Sai – đáp án: "+(q.a?"T":"F");fb.insertAdjacentHTML("afterend",`<div class="ex">💡 ${q.why}</div>`);if(ok)tfs.c++;tfs.n++;$("#tfsc").textContent=`Đúng ${tfs.c}/${tfs.n}`;if(tfs.n==LS[app.l].tf.length)mark("tf",Math.round(tfs.c/tfs.n*100))}

/* ---- FILL ---- */
function fill(){const l=LS[app.l];$("#act").innerHTML=`<p class="hint">Nghe bài rồi điền MỘT từ vào chỗ trống. Có thể bấm từ gợi ý bên dưới.</p><div class="row"><button class="b" onclick="playScript()">▶ Nghe bài</button><button class="b g" onclick="stopSay()">⏹</button></div><div class="chips">${shuffle(l.bank).map(w=>`<span class="chip" onclick="chipFill(this,0)">${w}</span>`).join("")}</div>`+l.fill.map((q,i)=>`<div class="q" id="fl${i}"><div><b>${i+1}.</b> ${esc(q.t).replace(/_{4,}/,'<input class="t" type="text" autocomplete="off" spellcheck="false">')}</div><div class="vi">${q.v}</div><div class="fb"></div></div>`).join("")+`<div class="row"><button class="b" onclick="chkFl()">Kiểm tra</button><span class="score" id="flsc"></span></div>`}
function chkFl(){const l=LS[app.l];let c=0;l.fill.forEach((q,i)=>{const box=$("#fl"+i),inp=box.querySelector("input"),fb=box.querySelector(".fb");const ok=q.a.map(nf).includes(nf(inp.value));inp.className="t "+(ok?"good":"bad");fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"✔ Đúng":"✘ Đáp án: "+q.a[0]+(ANSVI[q.a[0]]?" = "+ANSVI[q.a[0]]:"");if(!box.querySelector(".ex"))fb.insertAdjacentHTML("afterend",`<div class="ex">💡 ${q.why}</div>`);if(ok)c++});$("#flsc").textContent=`Đúng ${c}/${l.fill.length}`;mark("fill",Math.round(c/l.fill.length*100))}

/* ---- ORDER ---- */
let od={};
function order(){od={i:0,c:0,seen:0};drawOd()}
function drawOd(){const l=LS[app.l];if(od.i>=l.sent.length){$("#act").innerHTML=`<p class="score big">🎉 Xong! Đúng ${od.c}/${l.sent.length} câu.</p><button class="b" onclick="order()">Làm lại</button>`;mark("order",Math.round(od.c/l.sent.length*100));return}
 const s=l.sent[od.i];od.words=s[0].split(" ");od.pool=shuffle(od.words.map((w,i)=>({w,i})));od.built=[];od.checked=false;paintOd()}
function paintOd(){const l=LS[app.l],s=l.sent[od.i];
 $("#act").innerHTML=`<p class="hint">Câu ${od.i+1}/${l.sent.length}. Bấm các từ theo đúng thứ tự để tạo thành câu. Bấm từ trong khung để bỏ ra.</p><div class="vi" style="font-size:1rem">🇻🇳 ${s[1]}</div>
 <div class="build">${od.built.map((x,k)=>`<span class="chip" onclick="odUn(${k})">${x.w}</span>`).join("")}</div>
 <div class="chips">${od.pool.map(x=>`<span class="chip ${od.built.includes(x)?"used":""}" onclick="odPick(${od.pool.indexOf(x)})">${x.w}</span>`).join("")}</div>
 <div class="row"><button class="b" onclick="odChk()">Kiểm tra</button><button class="b g" onclick="sayNow('${s[0].replace(/'/g,"\\'")}')">🔊 Nghe câu</button><button class="b g" onclick="od.built=[];paintOd()">Xóa</button></div><div class="fb" id="odfb"></div>`}
function odPick(k){const x=od.pool[k];if(od.built.includes(x))return;od.built.push(x);paintOd()}
function odUn(k){od.built.splice(k,1);paintOd()}
function odChk(){const s=LS[app.l].sent[od.i],got=od.built.map(x=>x.w).join(" ");const fb=$("#odfb");if(got===s[0]){fb.className="fb ok";fb.innerHTML=`✔ Đúng! <b>${s[0]}</b> <button class="b" onclick="od.c+=${od.checked?0:1};od.i++;drawOd()">Câu tiếp →</button>`;od.checked=true;sayNow(s[0])}else{fb.className="fb no";fb.innerHTML=`✘ Chưa đúng. Thử lại! <button class="b g" onclick="od.built=[];od.i++;drawOd()">Bỏ qua (xem đáp án: ${s[0]})</button>`}}

/* ---- DICTATION ---- */
let dc={};
function dict(){dc={i:0,sc:[]};drawDc()}
function drawDc(){const l=LS[app.l];if(dc.i>=l.sent.length){const a=Math.round(dc.sc.reduce((x,y)=>x+y,0)/dc.sc.length);$("#act").innerHTML=`<p class="score big">🎉 Xong! Điểm chính tả trung bình: ${a}%</p><button class="b" onclick="dict()">Làm lại</button>`;mark("dict",a);return}
 const s=l.sent[dc.i];$("#act").innerHTML=`<p class="hint">Câu ${dc.i+1}/${l.sent.length}. Nghe rồi gõ lại đúng câu em nghe được (có thể nghe nhiều lần, chọn tốc độ “Chậm” ở trên).</p>
 <div class="row"><button class="b" onclick="sayNow('${s[0].replace(/'/g,"\\'")}')">🔊 Nghe</button><button class="b g" onclick="sayNow('${s[0].replace(/'/g,"\\'")}',{rate:.6})">🐢 Nghe chậm</button></div>
 <input class="w" id="dcin" placeholder="Gõ câu em nghe được..." autocomplete="off" spellcheck="false"><div class="row"><button class="b" onclick="dcChk()">Kiểm tra</button></div><div id="dcfb"></div>`}
function dcChk(){const l=LS[app.l],s=l.sent[dc.i];const norm=x=>x.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);const a=norm(s[0]),b=norm($("#dcin").value);let c=0;const out=a.map((w,k)=>{const ok=b[k]===w||(b.includes(w)&&false);if(ok)c++;return `<span class="dd ${ok?"good":"bad"}">${w}</span>`}).join(" ");const pct=Math.round(c/a.length*100);dc.sc[dc.i]=pct;
 $("#dcfb").innerHTML=`<div class="fb ${pct==100?"ok":"no"}">${pct==100?"✔ Hoàn hảo!":"Kết quả: "+pct+"% – các từ đúng vị trí màu xanh"}</div><p>${out}</p><p class="vi">🇻🇳 ${s[1]}</p><button class="b" onclick="dc.i++;drawDc()">Câu tiếp →</button>`}

/* ---- REVIEW ---- */
function allWords(){const m={};LS.forEach((l,i)=>{l.vocab.forEach(v=>{m[v[0].toLowerCase()]={en:v[0],ip:v[1],vi:v[2],l:i}});l.fill.forEach(q=>{const w=q.a[0];if(!/^\d/.test(w)&&!m[w.toLowerCase()]&&ANSVI[w.toLowerCase()])m[w.toLowerCase()]={en:w,ip:"",vi:ANSVI[w.toLowerCase()],l:i}})});
 LS.forEach((l,i)=>l.sgk.forEach(t=>{if(t.k=="fill")t.items.forEach(it=>{const w=it.a[0];if(!m[w]&&ANSVI[w])m[w]={en:w,ip:"",vi:ANSVI[w],l:i}})}));return Object.values(m)}
function reviewHtml(){const w=allWords();setTimeout(()=>{},0);
 return `<div class="card"><h2>🧠 Ôn từ đáp án cần nhớ <span class="vi">— ${w.length} từ</span></h2><p class="hint">Tất cả từ vựng và từ đáp án trong các bài tập. Bấm 🔊 để nghe. Sau đó chơi 2 trò chơi để ghi nhớ.</p>
 <div class="row"><button class="b" onclick="qz('listen')">🎧 Nghe – chọn từ</button><button class="b" onclick="qz('type')">⌨ Đọc nghĩa – gõ từ</button><button class="b" onclick="qz('mean')">🇻🇳 Từ – chọn nghĩa</button></div><div id="qzbox"></div>
 <table class="vt"><tr><th></th><th>Từ</th><th>Phiên âm</th><th>Nghĩa</th><th>Bài</th></tr>${w.map(x=>`<tr><td><button class="sm" onclick="sayNow('${x.en.replace(/'/g,"\\'")}')">🔊</button></td><td><b>${x.en}</b></td><td>${x.ip}</td><td>${x.vi}</td><td>${LS[x.l].t.replace("Unit ","U").replace(" – "," ")}</td></tr>`).join("")}</table></div>`}
let qs={};
function qz(mode){const w=shuffle(allWords()).slice(0,10);qs={mode,w,i:0,c:0};drawQz()}
function drawQz(){const box=$("#qzbox");if(qs.i>=qs.w.length){box.innerHTML=`<p class="score big">🎉 Kết quả: ${qs.c}/${qs.w.length}</p><button class="b" onclick="qz('${qs.mode}')">Chơi lại</button>`;return}
 const x=qs.w[qs.i],all=allWords();const bar=`<div class="pb"><i style="width:${qs.i/qs.w.length*100}%"></i></div><div class="score">Câu ${qs.i+1}/${qs.w.length} • Đúng ${qs.c}</div>`;
 if(qs.mode=="type"){box.innerHTML=bar+`<p class="big">🇻🇳 <b>${x.vi}</b></p><input class="w" id="qin" placeholder="Gõ từ tiếng Anh..." autocomplete="off" spellcheck="false" onkeydown="if(event.key=='Enter')qtype()"><div class="row"><button class="b" onclick="qtype()">Kiểm tra</button><button class="b g" onclick="sayNow('${x.en.replace(/'/g,"\\'")}')">🔊 Gợi ý (nghe)</button></div><div id="qfb"></div>`;return}
 const opts=shuffle([x].concat(shuffle(all.filter(y=>y.en!=x.en)).slice(0,3)));qs.opts=opts;
 if(qs.mode=="listen"){box.innerHTML=bar+`<p><button class="b" onclick="sayNow('${x.en.replace(/'/g,"\\'")}')">🔊 Nghe từ</button> <span class="hint">Em nghe thấy từ nào?</span></p><div class="opts">${opts.map((o,k)=>`<button class="opt" onclick="qpick(${k})">${o.en}</button>`).join("")}</div><div id="qfb"></div>`;sayNow(x.en)}
 else{box.innerHTML=bar+`<p class="big"><b>${x.en}</b> <button class="sm" onclick="sayNow('${x.en.replace(/'/g,"\\'")}')">🔊</button></p><div class="opts">${opts.map((o,k)=>`<button class="opt" onclick="qpick(${k})">${o.vi}</button>`).join("")}</div><div id="qfb"></div>`}}
function qpick(k){const x=qs.w[qs.i],ok=qs.opts[k].en==x.en;const bs=document.querySelectorAll("#qzbox .opt");bs.forEach((b,j)=>{b.disabled=true;if(qs.opts[j].en==x.en)b.classList.add("good")});if(!ok)bs[k].classList.add("bad");else qs.c++;$("#qfb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✔ Đúng!":"✘ Chưa đúng"} — <b>${x.en}</b> ${x.ip} = ${x.vi}</div><button class="b" onclick="qs.i++;drawQz()">Tiếp →</button>`}
function qtype(){const x=qs.w[qs.i],ok=nf($("#qin").value)==nf(x.en);if(ok)qs.c++;$("#qfb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✔ Đúng!":"✘ Đáp án:"} <b>${x.en}</b> ${x.ip}</div><button class="b" onclick="qs.i++;drawQz()">Tiếp →</button>`;sayNow(x.en)}

paintLessons();paintActs();render();
</script>
</body>
</html>
