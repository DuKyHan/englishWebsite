  let k=0;parts.forEach(p=>p.groups.forEach(g=>g.items.forEach(x=>{x.g=++k})));
  const mins=+$('#tm').value;
  X={name:nm,cls:$('#cl').value.trim(),test:T.name,parts,total:k,ans:{},submitted:false,end:mins?Date.now()+mins*60000:0,mins,t0:Date.now()};
  $('#start').hidden=true;$('#exam').hidden=false;drawPaper();window.scrollTo(0,0);
  $('#who').innerHTML=esc(nm)+`<small>${esc(T.name)}${X.cls?' · '+esc(X.cls):''}</small>`;
  tick();timerId=setInterval(tick,1000);
});
function tick(){
  const el=$('#timer');
  if(!X.end){el.textContent='';return}
  const left=Math.max(0,Math.round((X.end-Date.now())/1000));
  el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  el.classList.toggle('low',left<=300);
  if(left<=0)submit();
}
function counts(){const d=Object.keys(X.ans).filter(k=>String(X.ans[k]).trim()!=='').length;$('#cnt').textContent=d+'/'+X.total+' câu'}

function passageEl(sid){
  const S=SEC[sid];const d=document.createElement('details');d.className='passage';d.open=true;
  d.innerHTML='<summary>Bài đọc <button type="button" class="tr-btn">Dịch từng câu</button></summary><div class="pbody"></div>';
  const pb=$('.pbody',d);
  S.passage.forEach(pg=>{pg.forEach(s=>{
    const p=document.createElement('p');p.className='sent';
    p.innerHTML=esc(s.en).replace(/\[\[(.*?)\|(.*?)\]\]/g,(m,tag,txt)=>txt?`<span class="ev" data-q="${tag}">${txt}<span class="tag"></span></span>`:'');
    const v=document.createElement('p');v.className='vi';v.textContent=s.vi;pb.append(p,v)});
    const g=document.createElement('div');g.className='pgap';pb.append(g)});
  $('.tr-btn',d).addEventListener('click',e=>{e.preventDefault();e.stopPropagation();d.classList.toggle('showvi')});
  return d;
}
const clean=s=>String(s).replace(/\(\d+\)\s*/g,'');
function qCard(x){
  const it=x.it,c=document.createElement('div');c.className='q';c.id='q'+x.g;
  const stem=it.u===2?fmt(clean(it.stem),2):fmt(clean(it.stem));
  c.innerHTML=`<div class="qh"><span class="qn">${x.g}.</span><div class="stem">${stem}</div></div>`;
  if(it.t==='mcq'||it.t==='tf'){
    const o=document.createElement('div');o.className='opts'+(it.t==='tf'?' tf':'');
    const labs=it.t==='tf'?['T','F']:['A','B','C','D'];
    const tx=it.t==='tf'?['Đúng (T)','Sai (F)']:it.opts;
    tx.forEach((t,k)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.dataset.l=labs[k];
      b.innerHTML=it.t==='tf'?`<span class="v">${esc(t)}</span>`:`<span class="k">${labs[k]}</span><span class="v">${it.u===1?fmt(t,1):it.u===2?'Phần '+labs[k]:esc(t)}</span>`;
      b.addEventListener('click',()=>{if(X.submitted)return;const was=X.ans[x.g]===labs[k];o.querySelectorAll('.opt').forEach(y=>y.classList.remove('sel'));if(was){delete X.ans[x.g]}else{b.classList.add('sel');X.ans[x.g]=labs[k]}counts()});
      o.append(b)});c.append(o);
  }else{
    const w=document.createElement('div');w.className='fld';
    w.innerHTML=`<input class="tin" id="t${x.g}" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Câu ${x.g}" placeholder="Gõ đáp án">`;
    $('input',w).addEventListener('input',e=>{if(e.target.value.trim())X.ans[x.g]=e.target.value;else delete X.ans[x.g];counts()});
    c.append(w);
  }
  return c;
}
function drawPaper(){
  const P=$('#paper');P.innerHTML='';
  X.parts.forEach(p=>{
    const h=document.createElement('div');h.className='part';h.textContent=p.title;P.append(h);
    p.groups.forEach(g=>{
      if(g.sid&&SEC[g.sid].passage){const d=passageEl(g.sid);d.dataset.sid=g.sid;g.el=d;P.append(d)}
      g.items.forEach(x=>P.append(qCard(x)));
    });
  });
  const b=document.createElement('div');b.className='bottom';b.innerHTML='<div id="cf"></div><button class="go" id="sub2">Nộp bài</button>';P.append(b);
  $('#sub2').addEventListener('click',askSubmit);$('#sub').onclick=askSubmit;counts();
}
function askSubmit(){
  if(X.submitted)return;
  const left=X.total-Object.keys(X.ans).length;
  const cf=$('#cf');
  cf.innerHTML=`<div class="confirm"><b>${left?`Còn ${left} câu chưa làm.`:'Em đã làm hết các câu.'}</b> Nộp bài bây giờ?<div class="row"><button class="b2 pri" id="y">Nộp bài</button><button class="b2" id="n">Làm tiếp</button></div></div>`;
  $('#y').onclick=submit;$('#n').onclick=()=>{cf.innerHTML=''};
  cf.scrollIntoView({block:'center'});
}
function isRight(x){const it=x.it,a=X.ans[x.g];if(a===undefined)return false;return it.t==='text'?it.ans.some(z=>norm(z)===norm(a)):a===it.ans}

/* ---------- submit & review ---------- */
function submit(){
  if(X.submitted)return;X.submitted=true;clearInterval(timerId);
  const all=[];X.parts.forEach(p=>p.groups.forEach(g=>g.items.forEach(x=>all.push(x))));
  const right=all.filter(isRight).length,blank=all.filter(x=>X.ans[x.g]===undefined).length,wrong=X.total-right-blank;
  const score=right*10/X.total;
  const used=Math.round((Date.now()-X.t0)/60000);
  const date=new Date().toLocaleDateString('vi-VN');
  hist.unshift({n:X.name,c:X.cls,t:X.test,s:score,d:date});hist=hist.slice(0,20);try{localStorage.setItem('e8-exam',JSON.stringify(hist))}catch(e){}
  // review in paper
  all.forEach(x=>review(x));
  X.parts.forEach(p=>p.groups.forEach(g=>{if(g.el){g.el.querySelectorAll('.ev').forEach(e=>{
    const tags=e.dataset.q.split(',').map(Number);const mine=g.items.filter(y=>y.sid===g.sid&&tags.includes(y.it.n)).map(y=>y.g);
    if(mine.length){e.classList.add('on');e.querySelector('.tag').textContent='(Câu '+mine.join(', ')+')'}})}}));
  const rk=score>=8?'Giỏi':score>=6.5?'Khá':score>=5?'Trung bình':'Cần cố gắng thêm';
  const txt=`${X.name}${X.cls?' - '+X.cls:''} | ${X.test} | ${num(score)}/10 | đúng ${right}/${X.total} | ${date}`;
  const R=$('#result');R.hidden=false;
  R.innerHTML=`<div class="card score"><div class="who" style="text-align:center;flex:none">${esc(X.name)}${X.cls?' · '+esc(X.cls):''}</div><div class="note">${esc(X.test)} · làm trong ${used} phút</div>
  <div class="big" style="margin-top:10px">${num(score)}<small>/10</small></div><div class="rk">${rk}</div>
  <div class="meta"><span class="chip g">Đúng ${right}</span><span class="chip r">Sai ${wrong}</span><span class="chip y">Bỏ trống ${blank}</span></div>
  <div style="margin-top:16px"><button class="b2 pri" id="cp">Sao chép kết quả để gửi giáo viên</button> <button class="b2" id="re">Làm đề khác</button></div>
  <div id="cpb" style="margin-top:10px"></div></div>
  <p class="note" style="margin:0 0 4px">Xem lại bên dưới: câu sai và câu bỏ trống đã mở sẵn lời giải; dẫn chứng trong bài đọc được tô vàng.</p>`;
  $('#cp').onclick=()=>{const ok=()=>{$('#cpb').textContent='Đã sao chép: '+txt};const fb=()=>{$('#cpb').innerHTML='<textarea class="cp" readonly id="cpt"></textarea>';const t=$('#cpt');t.value=txt;t.select()};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}};
  $('#re').onclick=()=>location.reload();
  const bar=$('.bar');$('#timer').textContent='';$('#sub').hidden=true;$('#cnt').textContent=`${num(score)}/10`;
  $('#cf').innerHTML='';const sb=$('#sub2');if(sb)sb.hidden=true;
  $('#paper').prepend(R);window.scrollTo(0,0);
  showHist();
}
function review(x){
  const it=x.it,c=$('#q'+x.g),a=X.ans[x.g],ok=isRight(x),blank=a===undefined;
  c.classList.add(ok?'ok':blank?'skip':'no');
  if(it.t==='mcq'||it.t==='tf'){c.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.remove('sel');if(b.dataset.l===it.ans)b.classList.add('right');else if(b.dataset.l===a)b.classList.add('wrong')})}
  else{const i=$('input',c);i.disabled=true;i.style.borderColor=ok?'var(--green)':'var(--red)'}
  const shown=it.t==='text'?it.show:it.t==='tf'?(it.ans==='T'?'T (Đúng)':'F (Sai)'):(it.u?it.ans:it.ans+'. '+it.opts['ABCD'.indexOf(it.ans)]);
  let h=`<p>${ok?'<span class="your" style="color:var(--green)">Đúng.</span>':blank?'<span class="your" style="color:var(--gold)">Chưa làm.</span>':'<span class="your" style="color:var(--red)">Sai.</span> Em chọn: <b>'+esc(it.t==='mcq'&&!it.u?a+'. '+it.opts['ABCD'.indexOf(a)]:a)+'</b>.'} Đáp án đúng: <b>${it.u===1?fmt(shown,1):fmt(shown)}</b></p>`;
  if(it.on){h+='<h4>Vì sao đúng, vì sao sai</h4><ul class="onote">'+it.on.map((t,k)=>{const L='ABCD'[k],g=L===it.ans;return `<li class="${g?'good':'bad'}"><span class="m">${g?'✓':'✗'}</span><span class="tx"><b>${L}.</b> ${esc(t)}</span></li>`}).join('')+'</ul>'}
  if(it.vi)h+=`<h4>Dịch nghĩa câu</h4><p>${fmt(it.vi)}</p>`;
  if(it.ex)h+=`<h4>Giải thích</h4><p>${fmt(it.ex)}</p>`;
  const w=document.createElement(ok?'details':'div');w.className='rev';
  if(ok){w.innerHTML='<summary style="cursor:pointer;font-weight:800;color:var(--muted)">Xem lời giải</summary>'+h}else w.innerHTML=h;
  c.append(w);
}
</script>

</body></html>
