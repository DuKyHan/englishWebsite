<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Thi thử Tiếng Anh 8</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: màn nhập tên và chọn đề, màn làm bài một trang cuộn có thanh thời gian cố định, màn kết quả có điểm và xem lại từng câu */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --ink:#1F2A3A; --muted:#66748A; --line:#DAE1EC;
  --blue:#2A5FD0; --blue-d:#1E48A3; --blue-soft:#E3ECFC; --green:#1F8A4C; --green-soft:#DDF3E6; --red:#C73A31; --red-soft:#FBE3E0;
  --gold:#B7791F; --mark:#FFE88A; --markink:#3D2E00; --onbtn:#FFFFFF;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Source Serif 4',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --surface:#18202F; --ink:#E7ECF5; --muted:#98A5BA; --line:#2B3649;
  --blue:#7FA5FF; --blue-d:#5B86E8; --blue-soft:#1C2A47; --green:#52D08C; --green-soft:#123222; --red:#FF8379; --red-soft:#3B1C1A;
  --gold:#F0B85A; --mark:#6B5A12; --markink:#FFF3C4; --onbtn:#0F1522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#18202F; --ink:#E7ECF5; --muted:#98A5BA; --line:#2B3649;
  --blue:#7FA5FF; --blue-d:#5B86E8; --blue-soft:#1C2A47; --green:#52D08C; --green-soft:#123222; --red:#FF8379; --red-soft:#3B1C1A;
  --gold:#F0B85A; --mark:#6B5A12; --markink:#FFF3C4; --onbtn:#0F1522; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:600 16px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.col{max-width:700px;margin:0 auto}
h1{font-size:26px;font-weight:800;line-height:1.2;margin:26px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label.f{display:block;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.in{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;font-size:17px}
.in:focus{border-color:var(--blue);outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tbtn{border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center;font-weight:800;line-height:1.25}
.tbtn small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.tbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.go{display:block;width:100%;border:0;border-radius:12px;background:var(--blue);color:var(--onbtn);font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:14px;box-shadow:0 4px 0 var(--blue-d);margin-top:6px}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--blue-d)}
.go:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.err{color:var(--red);font-size:14px;margin:6px 0 0;min-height:1.2em}
.note{font-size:13.5px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.barin{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who{font-weight:800;min-width:0;flex:1 1 140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
.timer.low{color:var(--red)}
.cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub{border:0;border-radius:10px;background:var(--blue);color:var(--onbtn);font-weight:800;padding:8px 16px}
.part{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--blue-soft)}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 0}
.passage summary{cursor:pointer;padding:10px 14px;font-weight:800;display:flex;gap:10px;align-items:center;list-style:none}
.passage summary::-webkit-details-marker{display:none}
.passage summary::after{content:"▾";margin-left:auto;color:var(--muted)}
.passage[open] summary::after{content:"▴"}
.pbody{padding:0 14px 12px;max-height:44vh;overflow:auto}
.tr-btn{font-size:12.5px;font-weight:800;background:var(--blue-soft);color:var(--blue);border:0;border-radius:8px;padding:4px 10px}
.sent{font-family:var(--serif);font-size:17px;line-height:1.55;margin:0 0 .1em;font-weight:400}
.vi{font-size:14px;color:var(--muted);margin:0 0 .6em;font-style:italic}
.passage:not(.showvi) .vi{display:none}
.pgap{height:8px}
.ev.on{background:var(--mark);color:var(--markink);text-decoration:underline;text-underline-offset:3px;font-weight:700;padding:0 2px;border-radius:3px}
.ev .tag{display:none;font:800 10px var(--sans);vertical-align:super;margin-left:3px}
.ev.on .tag{display:inline}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.q.ok{border-left:5px solid var(--green)} .q.no{border-left:5px solid var(--red)} .q.skip{border-left:5px solid var(--gold)}
.qh{display:flex;gap:10px}
.qn{font-weight:800;color:var(--blue);min-width:1.7em;font-variant-numeric:tabular-nums}
.stem{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.stem u{text-decoration-thickness:2px;text-underline-offset:4px}
.opts{display:grid;gap:8px;margin:10px 0 0 calc(1.7em + 10px)}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.opt .k{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.opt .v{min-width:0;overflow-wrap:anywhere;padding-top:1px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .k{background:var(--blue);border-color:var(--blue);color:var(--onbtn)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{background:var(--green);border-color:var(--green);color:var(--onbtn)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:var(--onbtn)}
.tf .opt{justify-content:center;text-align:center}
.opt:disabled{cursor:default}
.fld{margin:10px 0 0 calc(1.7em + 10px)}
@media(max-width:480px){.opts,.fld{margin-left:0}}
.tin{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;font-size:17px}
.tin:focus{border-color:var(--blue);outline:none}
.bottom{margin:26px 0}
.confirm{background:var(--blue-soft);border:1px solid var(--blue);border-radius:12px;padding:14px;margin:14px 0}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.b2{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:800}
.b2.pri{background:var(--blue);border-color:var(--blue);color:var(--onbtn)}

/* result */
.score{text-align:center;padding:26px 16px}
.big{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--blue)}
.big small{font-size:24px;color:var(--muted)}
.rk{font-weight:800;font-size:18px;margin:6px 0}
.meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 0}
.chip{border-radius:999px;padding:4px 14px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.chip.g{background:var(--green-soft);color:var(--green)} .chip.r{background:var(--red-soft);color:var(--red)} .chip.y{background:var(--blue-soft);color:var(--blue)}
.rev{margin:10px 0 0 calc(1.7em + 10px);font-size:14.5px;border-top:1px dashed var(--line);padding-top:8px}

.rev h4{margin:8px 0 3px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rev p{margin:0}
.rev .your{font-weight:800}
.onote{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.onote li{display:flex;gap:8px;align-items:flex-start}
.onote .m{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--onbtn);margin-top:2px}
.onote .good .m{background:var(--green)} .onote .bad .m{background:var(--red)}
.onote .tx{min-width:0;overflow-wrap:anywhere}
.cp{width:100%;min-height:90px;border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;font:600 14px var(--sans)}
u{text-decoration-thickness:2px;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="card">

</div>

-ing. \"The farmers\" là số nhiều → **are harvesting**.", "on": ["harvest = gặt (hiện tại đơn, số nhiều) → ✗ \"Look!\" cần hiện tại tiếp diễn.", "harvests = gặt (ngôi 3 số ít) → ✗ sai thì và sai chủ ngữ số nhiều.", "is harvesting = đang gặt → ✗ \"is\" chỉ dùng với chủ ngữ số ít.", "are harvesting = đang gặt → ✓ hiện tại tiếp diễn, The farmers số nhiều."]}, {"n": 5, "t": "mcq", "stem": "You need to work ________, or you will make a lot of mistakes.", "opts": ["more careful", "more carefully", "less carefully", "careful"], "ans": "B", "vi": "Bạn cần làm việc cẩn thận hơn, nếu không bạn sẽ mắc nhiều lỗi.", "ex": "Bổ nghĩa cho động từ \"work\" cần **trạng từ**: carefully (loại A, D). Câu có \"or you will make mistakes\" → cần làm **cẩn thận hơn** = **more carefully**. (less carefully = kém cẩn thận hơn → sai nghĩa)", "on": ["more careful = cẩn thận hơn (tính từ) → ✗ bổ nghĩa cho động từ cần trạng từ.", "more carefully = cẩn thận hơn (trạng từ) → ✓ đúng từ loại, đúng nghĩa.", "less carefully = kém cẩn thận hơn → ✗ sai nghĩa (làm việc kém cẩn thận thì càng mắc lỗi).", "careful = cẩn thận (tính từ) → ✗ sai từ loại."]}, {"n": 6, "t": "mcq", "stem": "We often post many questions to discuss on a/an _______ after school.", "opts": ["forum", "market", "club", "office"], "ans": "A", "vi": "Chúng tôi thường đăng nhiều câu hỏi để thảo luận trên một diễn đàn sau giờ học.", "ex": "**forum** = diễn đàn trực tuyến (đăng bài, thảo luận). market = chợ; club = câu lạc bộ; office = văn phòng → không hợp nghĩa.", "on": ["forum = diễn đàn → ✓ nơi đăng câu hỏi để thảo luận.", "market = chợ → ✗ không đăng câu hỏi thảo luận ở chợ.", "club = câu lạc bộ → ✗ không phải nơi \"post questions\".", "office = văn phòng → ✗ không hợp nghĩa."]}, {"n": 7, "t": "mcq", "stem": "My mother loves _______ food for my family.", "opts": ["preparing", "to prepare", "prepare", "A&B are correct"], "ans": "D", "vi": "Mẹ tôi thích chuẩn bị đồ ăn cho gia đình tôi.", "ex": "**love + V-ing** hoặc **love + to V** đều đúng → chọn D. (Nhóm động từ like / love / hate / prefer đi được với cả hai dạng.)", "on": ["preparing = chuẩn bị → ✓ love + V-ing.", "to prepare = chuẩn bị → ✓ love + to V cũng đúng.", "prepare = chuẩn bị (nguyên mẫu) → ✗ love không đi với V nguyên mẫu.", "A và B đều đúng → ✓ chọn đáp án này."]}, {"n": 8, "t": "mcq", "stem": "My father is fond of ________ a lot of trees and vegetables.", "opts": ["growing", "grow", "grew", "grows"], "ans": "A", "vi": "Bố tôi thích trồng nhiều cây và rau.", "ex": "**be fond of + V-ing** = thích làm gì. grow = trồng.", "on": ["growing = trồng → ✓ be fond of + V-ing.", "grow → ✗ sau giới từ of phải là V-ing.", "grew (quá khứ) → ✗ sai dạng.", "grows (ngôi 3) → ✗ sai dạng."]}, {"n": 9, "t": "mcq", "stem": "My teacher _____ to plant flowers in the garden behind her house.", "opts": ["prefers", "enjoys", "detests", "adores"], "ans": "A", "vi": "Cô giáo tôi thích trồng hoa trong khu vườn sau nhà cô hơn.", "ex": "Sau chỗ trống là **to plant** (to V). Chỉ **prefer** đi với to V. enjoy / detest / adore chỉ đi với V-ing; ngoài ra detests (ghét) sai nghĩa.", "on": ["prefers = thích hơn → ✓ prefer + to V.", "enjoys = thích → ✗ enjoy chỉ đi với V-ing, không đi với to plant.", "detests = ghét → ✗ sai nghĩa và đi với V-ing.", "adores = rất thích → ✗ adore đi với V-ing."]}, {"n": 10, "t": "mcq", "stem": "Nam helped his parents _____ the rice onto the ox-drawn cart.", "opts": ["load", "collect", "dry", "ride"], "ans": "A", "vi": "Nam giúp bố mẹ chất lúa lên xe bò kéo.", "ex": "**help sb + (to) V**. **load sth onto sth** = chất (hàng) lên. ox-drawn cart = xe do bò kéo. collect = thu gom, dry = phơi, ride = cưỡi → không hợp \"onto the cart\".", "on": ["load = chất (hàng) lên → ✓ load sth onto the cart.", "collect = thu gom → ✗ không hợp \"onto the cart\".", "dry = phơi khô → ✗ không hợp \"onto the cart\".", "ride = cưỡi, đi (xe) → ✗ không đi với the rice."]}, {"n": 11, "t": "mcq", "stem": "________ DIY means you do yourself without the help of experts.", e Internet.", "emailing = gửi email → ✗ không đi với the Internet.", "communicating = giao tiếp → ✗ cần \"with\", không đi với the Internet."]}, {"n": 15, "t": "mcq", "stem": "The farm has a ________ expanse of grassland for us to play football.", "opts": ["vast", "short", "limited", "narrow"], "ans": "A", "vi": "Trang trại có một vùng đồng cỏ mênh mông để chúng tôi chơi bóng đá.", "ex": "**vast** = rộng lớn, bao la. short / limited / narrow (ngắn / hạn chế / hẹp) không hợp với việc chơi bóng đá.", "on": ["vast = rộng lớn → ✓ đủ chỗ chơi bóng đá.", "short = ngắn → ✗ không miêu tả expanse.", "limited = hạn chế → ✗ sai nghĩa với \"chơi bóng\".", "narrow = hẹp → ✗ sai nghĩa."]}, {"n": 16, "t": "mcq", "stem": "They got about 30 million tons of grain at the end of the ________ season.", "opts": ["planting", "watering", "fertilising", "harvesting"], "ans": "D", "vi": "Họ thu được khoảng 30 triệu tấn ngũ cốc vào cuối mùa gặt.", "ex": "**harvesting season** = mùa thu hoạch; \"got grain at the end\" → thu hoạch được lúa.", "on": ["planting = gieo trồng → ✗ cuối mùa gieo trồng chưa có thóc.", "watering = tưới nước → ✗ không thu được thóc.", "fertilising = bón phân → ✗ không thu được thóc.", "harvesting = thu hoạch → ✓ harvesting season = mùa gặt."]}, {"n": 17, "t": "mcq", "stem": "This year's exam was much ________ than last year's.", "opts": ["the harder", "harder", "more hardly", "more hard"], "ans": "B", "vi": "Bài thi năm nay khó hơn nhiều so với năm ngoái.", "ex": "So sánh hơn với tính từ ngắn: **adj-er + than** → **harder than**. (\"much\" nhấn mạnh so sánh hơn.)", "on": ["the harder → ✗ không dùng \"the\" khi so sánh hơn với than.", "harder = khó hơn → ✓ adj ngắn + er + than.", "more hardly → ✗ hardly = hầu như không, sai nghĩa.", "more hard → ✗ hard là tính từ ngắn nên dùng harder."]}, {"n": 18, "t": "mcq", "stem": "The growth rate of rice farms is ________ that of corn farms this year.", "opts": ["higher more than", "high more than", "more higher than", "higher than"], "ans": "D", "vi": "Tốc độ tăng trưởng của các trang trại lúa năm nay cao hơn của các trang trại ngô.", "ex": "So sánh hơn: **higher than** (không dùng thêm \"more\").", "on": ["higher more than → ✗ thừa \"more\".", "high more than → ✗ sai cấu trúc so sánh.", "more higher than → ✗ không dùng more với higher.", "higher than = cao hơn → ✓."]}, {"n": 19, "t": "mcq", "stem": "I think living in the city is ________ living in the countryside.", "opts": ["more expensive than", "expensive more than", "as expensive more than", "more than expensive"], "ans": "A", "vi": "Tôi nghĩ sống ở thành phố đắt đỏ hơn sống ở nông thôn.", "ex": "Tính từ dài (expensive): **more + adj + than**.", "on": ["more expensive than = đắt hơn → ✓ so sánh hơn tính từ dài.", "expensive more than → ✗ sai trật tự.", "as expensive more than → ✗ trộn hai cấu trúc.", "more than expensive → ✗ sai cấu trúc."]}, {"n": 20, "t": "mcq", "stem": "I love the people in my village. They are so _______ and hospitable.", "opts": ["vast", "friendly", "slow", "inconvenient"], "ans": "B", "vi": "Tôi yêu những người dân trong làng. Họ rất thân thiện và hiếu khách.", "ex": "\"and hospitable\" (hiếu khách) cần một tính từ tích cực, cùng nghĩa → **friendly**.", "on": ["vast = rộng lớn → ✗ không miêu tả người.", "friendly = thân thiện → ✓ cùng nghĩa tích cực với hospitable.", "slow = chậm → ✗ sai nghĩa.", "inconvenient = bất tiện → ✗ sai nghĩa."]}, {"n": 21, "t": "mcq", "stem": "They spend a lot of time surfing the net; _______, they have little time to read books.", "opts": ["therefore", "although", "however", "otherwise"], "ans": "A", "vi": "Họ dành nhiều thời gian lướt web; vì vậy họ có ít thời gian đọc sách.", "ex": "Vế sau là **kết quả** của vế trước → **therefore** (vì vậy). however = tuy nhiên; otherwise = nếu không thì; although không đứng sau dấu \";\" như vậy.", "on": ["therefore = vì vậy → ✓ vế sau là kết quả.", "although = mặc dù → ✗ không hợp nghĩa, không đứng sau dấu chấm phẩy.", "however = tuy nhiên → ✗ chỉ sự đối lập.", "otherwise = nếu không thì → ✗ sai nghĩa."]}, {"n": 22, "t": "mcq", "stem": "Children in this village love _______ kites on summer afternoons.", "opts": ["to flying", "flow", "flies", "flying"], "ans": "D", "vi": "Trẻ em trong làng này thích thả diều vào những buổi chiều hè.", "ex": "**love + V-ing**. fly a kite → flying kites.", "on": ["to flying → ✗ sai cấu trúc.", "flow = chảy → ✗ sai từ.", "flies = bay / ruồi → ✗ sai dạng.", "flying = thả (diều) → ✓ love + V-ing."]}, {"n": 23, "t": "mcq", "stem": "It's not always true that rich people donate _______ than poor people.", "opts": ["generously", "more generously", "most generously", "more generous"], "ans": "B", "vi": "Không phải lúc nào người giàu cũng quyên góp hào phóng hơn người nghèo.", "ex": "Có \"than\" → so sánh hơn; bổ nghĩa cho động từ \"donate\" → **trạng từ**: **more generously**.", "on": ["generously = một cách hào phóng → ✗ thiếu \"more\" để so sánh với than.", "more generously = hào phóng hơn → ✓ trạng từ so sánh hơn.", "most generously = hào phóng nhất → ✗ so sánh nhất.", "more generous = hào phóng hơn (tính từ) → ✗ bổ nghĩa cho donate cần trạng từ."]}, {"n": 24, "t": "mcq", "stem": "I'm not keen on _______ our class photos to the forum.", "opts": ["uploading", "surfing", "messaging", "log on"], "ans": "A", "vi": "Tôi không thích đăng ảnh lớp chúng ta lên diễn đàn.", "ex": "**keen on + V-ing**; **upload sth to** = tải/đăng lên. (loại D vì \"log on\" không phải V-ing).", "on": ["uploading = đăng/tải lên → ✓ keen on + V-ing, upload to the forum.", "surfing = lướt → ✗ không hợp \"photos to the forum\".", "messaging = nhắn tin → ✗ không hợp nghĩa.", "log on = đăng nhập → ✗ không phải V-ing."]}, {"n": 25, "t": "mcq", "stem": "Nam didn't study hard, _______ he failed the exam.", "opts": ["but", "so", "and", "for"], "ans": "B", "vi": "Nam không học chăm chỉ, vì vậy cậu ấy thi trượt.", "ex": "Quan hệ nguyên nhân → kết quả: **so** (vì vậy). but = nhưng (đối lập).", "on": ["but = nhưng → ✗ không đ  say mê, yêu thích. (Không có \"be about / in / of photography\" với nghĩa này.)", "on": ["about → ✗ be about photography không mang nghĩa mê.", "in → ✗ cần interested in.", "of → ✗ cần fond of.", "into = say mê → ✓ be into + N."]}, {"n": 30, "t": "mcq", "stem": "Nam didn't study hard, _______ he failed the exam. (trùng câu 25)", "opts": ["but", "so", "and", "for"], "ans": "B", "vi": "Nam không học chăm chỉ, vì vậy cậu ấy thi trượt.", "ex": "Chỉ kết quả → **so**.", "on": ["but = nhưng → ✗ không đối lập.", "so = vì vậy → ✓ kết quả của việc không học chăm.", "and = và → ✗ thiếu quan hệ nhân quả.", "for = vì → ✗ đảo nghĩa (vì cậu trượt nên không học)."]}, {"n": 31, "t": "mcq", "stem": "The new member is _________ than we expected.", "opts": ["morequick", "more quickly", "quicklier", "quicker"], "ans": "D", "vi": "Thành viên mới nhanh nhẹn hơn chúng tôi mong đợi.", "ex": "Sau **is** (to be) cần **tính từ**. Tính từ ngắn quick → so sánh hơn **quicker**.", "on": ["morequick → ✗ không có dạng này.", "more quickly = nhanh hơn (trạng từ) → ✗ sau is cần tính từ.", "quicklier → ✗ không tồn tại.", "quicker = nhanh hơn → ✓ tính từ ngắn + er."]}, {"n": 32, "t": "mcq", "stem": "Sue enjoys _______ origami with her friends at recess.", "opts": ["making", "make", "to make", "makes"], "ans": "A", "vi": "Sue thích gấp giấy origami cùng bạn bè vào giờ ra chơi.", "ex": "**enjoy + V-ing**. (recess = giờ ra chơi)", "on": ["making → ✓ enjoy + V-ing.", "make → ✗ sai dạng.", "to make → ✗ enjoy không đi với to V.", "makes → ✗ sai dạng."]}, {"n": 33, "t": "mcq", "stem": "This village is beautiful and peaceful; _________, many people from the city go there to enjoy their weekends.", "opts": ["although", "however", "moreover", "therefore"], "ans": "D", "vi": "Ngôi làng này đẹp và yên bình; vì vậy nhiều người từ thành phố đến đó tận hưởng cuối tuần.", "ex": "Vế sau là **kết quả** của vế trước → **therefore**. (however = tuy nhiên; moreover = hơn nữa – thêm ý, không phải kết quả.)", "on": ["although = mặc dù → ✗ sai nghĩa.", "however = tuy nhiên → ✗ vế sau không đối lập.", "moreover = hơn nữa → ✗ chỉ thêm ý, không phải kết quả.", "therefore = vì vậy → ✓ kết quả."]}, {"n": 34, "t": "mcq", "stem": "\"Would you like to play basketball with me this Saturday morning?\"  \" _________ \"", "opts": ["I prefer football.", "I'd love to. Thanks.", "Playing basketball is fun.", "I love watching basketball with my brother."], "ans": "B", "vi": "\"Bạn có muốn chơi bóng rổ với mình sáng thứ Bảy này không?\" – \"Mình rất muốn. Cảm ơn bạn.\"", "ex": "Đáp lại lời mời **Would you like to...?** ta nhận lời bằng **I'd love to.** / **Yes, I'd love to.**", "on": ["I prefer football. = Tôi thích bóng đá hơn. → ✗ không đáp lại lời mời.", "I'd love to. Thanks. = Tôi rất muốn. Cảm ơn. → ✓ nhận lời.", "Playing basketball is fun. = Chơi bóng rổ vui. → ✗ không trả lời lời mời.", "I love watching basketball... = Tôi thích xem bóng rổ cùng anh. → ✗ không trả lời lời mời."]}, {"n": 35, "t": "mcq", "stem": "Sue enjoys _______ origami with her friends at recess. (trùng câu 32)", "opts": ["making", "make", "to make", "makes"], "ans": "A", "vi": "Sue thích gấp giấy origami cùng bạn bè vào giờ ra chơi.", "ex": "**enjoy + V-ing**.", "on": ["making → ✓ enjoy + V-ing.", "make → ✗ sai dạng.", "to make → ✗ enjoy không đi với to V.", "makes → ✗ sai dạng."]}, {"n": 36, "t": "mcq", "stem": "I love the people in my village. They are so _______ and hospitable. (trùng câu 20)", "opts": ["vast", "friendly", "slow", "inconvenient"], "ans": "B", "vi": "Tôi yêu những người dân trong làng. Họ rất thân thiện và hiếu khách.", "ex": "Tính từ cùng nghĩa tích cực với hospitable → **friendly**.", "on": ["vast = rộng lớn → ✗ không miêu tả người.", "friendly = thân thiện → ✓ cùng nghĩa tích cực với hospitable.", "slow = chậm → ✗ sai nghĩa.", "inconvenient = bất tiện → ✗ sai nghĩa."]}, {"n": 37, "t": "mcq", "stem": "They spend a lot of time surfing the net; _______, they have little time to read books. (trùng câu 21)", "opts": ["therefore", "although", "however", "otherwise"], "ans": "A", "vi": "Họ dành nhiều thời gian lướt web; vì vậy họ có ít thời gian đọc sách.", "ex": "Kết quả → **therefore**.", "on": ["therefore = vì vậy → ✓ vế sau là kết quả.", "although = mặc dù → ✗ không hợp nghĩa, không đứng sau dấu chấm phẩy.", "however = tuy nhiên → ✗ chỉ sự đối lập.", "otherwise = nếu không thì → ✗ sai nghĩa."]}, {"n": 38, "t": "mcq", "stem": "It's not always true that rich people donate _______ than poor people. (trùng câu 23)", "opts": ["generously", "more generously", "most generously", "more generous"], "ans": "B", "vi": "Không phải lúc nào người giàu cũng quyên góp hào phóng hơn người nghèo.", "ex": "Trạng từ so sánh hơn: **more generously than**.", "on": ["generously = một cách hào phóng → ✗ thiếu \"more\" để so sánh với than.", "more generously = hào phóng hơn → ✓ trạng từ so sánh hơn.", "most generously = hào phóng nhất → ✗ so sánh nhất.", "more generous = hào phóng hơn (tính từ) → ✗ bổ nghĩa cho donate cần trạng từ."]}, {"n": 39, "t": "mcq", "stem": "We often post many questions to discuss on a/an _______ after school. (trùng câu 6)", "opts": ["forum", "market", "club", "office"], "ans": "A", "vi": "Chúng tôi thường đăng nhiều câu hỏi để thảo luận trên diễn đàn sau giờ học.", "ex": "**forum** = diễn đàn.", "on": ["forum = diễn đàn → ✓ nơi đăng câu hỏi để thảo luận.", "market = chợ → ✗ không đăng câu hỏi thảo luận ở chợ.", "club = câu lạc bộ → ✗ không phải nơi \"post questions\".", "office = văn phòng → ✗ không hợp nghĩa."]}, {"n": 40, "t": "mcq", "stem": "_______ field is a field planted with rice growing in water.", "opts": ["Paddy", "Grass", "Pasture", "Wheat"], "ans": "A", "vi": "Cánh đồng lúa nước là cánh đồng trồng lúa mọc trong nước.", "ex": "**paddy field** = ruộng lúa nước. grass = cỏ; pasture = đồng cỏ chăn thả; wheat = lúa mì.", "on": ["Paddy = lúa nước → ✓ paddy field.", "Grass = cỏ → ✗ không phải ruộng lúa.", "Pasture = đồng cỏ chăn thả → ✗ không trồng lúa.", "Wheat = lúa mì → ✗ không phải lúa trong nước."]}]}, {"id": "s3", "title": "III. Dạng đúng của từ", "sub": "Gõ dạng đúng của từ trong ngoặc.", "items": [{"n": 1, "t": "text", "stem": "Do you fancy (go) ________ to the cinema this weekend?", "ans": ["going"], "show": "going", "vi": "Cuối tuần này bạn có thích đi xem phim không?", "ex": "**fancy + V-ing** (fancy = thích, muốn) → going."}, {"n": 2, "t": "text", "stem": "Mai dances (beautifully) ________ than Hoa does.", "ans": ["more beautifully"], "show": "more beautifully", "vi": "Mai nhảy đẹp hơn Hoa.", "ex": "Có \"than\" → so sánh hơn. Trạng từ dài (beautifully) → **more + adv**: more beautifully."}, {"n": 3, "t": "text", "stem": "John dislikes (work) ________ in front of a computer all day.", "ans": ["working"], "show": "working", "vi": "John không thích làm việc trước máy tính cả ngày.", "ex": "**dislike + V-ing** → working."}, {"n": 4, "t": "text", "stem": "Riding a bike is Lan's pleasure, but she detests (walk) ________ in the rain.", "ans": ["walking"], "show": "walking", "vi": "Đi xe đạp là niềm vui của Lan, nhưng cô ấy ghét đi bộ dưới mưa.", "ex": "**detest + V-ing** (detest = ghét cay ghét đắng) → walking."}]}, {"id": "s4", "title": "IV. Tìm lỗi sai", "sub": "Chọn phần (A, B, C hoặc D) có lỗi sai.", "items": [{"n": 5, "t": "mcq", "stem": "Mi **A. loves** playing **B. sport**, **C. so** his brother **D. hates** it.", "opts": ["A", "B", "C", "D"], "u": 2, "ans": "C", "vi": "Mi thích chơi thể thao, nhưng em trai cô ấy lại ghét nó.", "ex": "Hai vế **đối lập** (thích ↔ ghét) nên phải dùng **but**, không dùng \"so\" (chỉ kết quả). Sửa: so → **but**.", "on": ["A. loves = thích → đúng (ngôi 3 số ít).", "B. sport = thể thao → đúng.", "C. so = vì vậy → ✓ SAI, phải là but vì hai vế đối lập.", "D. hates = ghét → đúng."]}, {"n": 6, "t": "mcq", "stem": "You must **A. work** **B. hard**; **C. or**, you **D. will fail** the exam.", "opts": ["A", "B", "C", "D"], "u": 2, "ans": "C", "vi": "Bạn phải học chăm chỉ; nếu không, bạn sẽ trượt kỳ thi.", "ex": "Nghĩa \"nếu không thì\" dùng **otherwise** sau dấu \";\" (dạng: ...; otherwise, ...). Hoặc viết lại: You must work hard, **or** you will fail. Sửa: or → **otherwise**.", "on": ["A. work → đúng.", "B. hard = chăm chỉ → đúng.", "C. or → ✓ SAI, nghĩa \"nếu không thì\" dùng otherwise.", "D. will fail → đúng."]}, {"n": 7, "t": "mcq", "stem": "She hates **A. use** Facebook Messenger **B. to** **C. discuss** **D. schoolwork**.", "opts": ["A", "B", "C", "D"], "u": 2, "ans": "A", "vi": "Cô ấy ghét dùng Facebook Messenger để thảo luận bài vở.", "ex": "**hate + V-ing** (hoặc to V). Không dùng hate + V nguyên mẫu. Sửa: use → **using**.", "on": ["A. use → ✓ SAI, hate + V-ing → using.", "B. to = để → đúng (chỉ mục đích).", "C. discuss = thảo luận → đúng.", "D. schoolwork = bài tập → đúng."]}]}, {"id": "s5", "title": "C. READING – I. Đọc đoạn văn và chọn đáp án đúng", "sub": "", "passage": [[{"en": "Living in the country is something that people from the city often dream about.", "vi": "Sống ở nông thôn là điều mà người thành phố thường mơ ước."}, {"en": "However, in reality, it has [[4|both advantages and disadvantages]].", "vi": "Tuy nhiên, trên thực tế, nó có cả ưu điểm lẫn nhược điểm."}], [{"en": "There are certainly many advantages of living in the country.", "vi": "Chắc chắn có nhiều ưu điểm khi sống ở nông thôn."}, {"en": "First, [[1|you can enjoy peace and quietness]].", "vi": "Thứ nhất, bạn được tận hưởng sự yên bình và tĩnh lặng."}, {"en": "Moreover, [[1,5|people tend to be friendlier]].", "vi": "Hơn nữa, mọi người thường thân thiện hơn."}, {"en": "A further advantage is that [[1,3|there is less traffic, so it is safer for young children]].", "vi": "Một ưu điểm nữa là ít xe cộ hơn nên an toàn hơn cho trẻ nhỏ."}], [{"en": "However, there are certain disadvantages or drawbacks to life outside the city.", "vi": "Tuy nhiên, cũng có những nhược điểm nhất định khi sống ngoài thành phố."}, {"en": "First, because there are fewer people, [[2|you are likely to have few friends]].", "vi": "Thứ nhất, vì ít người hơn nên bạn có thể có ít bạn bè."}, {"en": "In addition, [[5|entertainment is difficult to find]], particularly in the evening.", "vi": "Thêm vào đó, rất khó tìm thấy hoạt động giải trí, đặc biệt là vào buổi tối."}, {"en": "Furthermore, [[5|there are fewer shops and services]] so it is quite hard to find jobs.", "vi": "Hơn nữa, có ít cửa hàng và dịch vụ hơn nên khá khó tìm việc làm."}, {"en": "As a result, you may have to travel a long way to work, which can be extremely expensive.", "vi": "Kết quả là bạn có thể phải đi làm quãng đường xa, điều này có thể cực kỳ tốn kém."}], [{"en": "In conclusion, it can be seen that the country is more suitable for some people than others.", "vi": "Tóm lại, có thể thấy nông thôn phù hợp với một số người hơn những người khác."}, {"en": "On the whole, [[5|it is often the best place for those who are retired or who have young children]].", "vi": "Nhìn chung, đó thường là nơi tốt nhất cho những người đã nghỉ hưu hoặc có con nhỏ."}, {"en": "In contrast, young or single people who have a career are better provided for in the city.", "vi": "Ngược lại, người trẻ hoặc độc thân có sự nghiệp sẽ được đáp ứng tốt hơn ở thành phố."}]], "cloze": false, "items": [{"n": 1, "t": "mcq", "stem": "How many advantages does living in the country have?", "opts": ["Three", "Two", "Four", "No"], "ans": "A", "vi": "Sống ở nông thôn có bao nhiêu ưu điểm?", "ex": "Đoạn 2 nêu: (1) yên bình, tĩnh lặng (First), (2) người thân thiện hơn (Moreover), (3) ít xe cộ nên an toàn cho trẻ (A further advantage) → **3 ưu điểm**.", "on": ["Three = ba → ✓ có 3 ưu điểm (yên bình, thân thiện, ít xe).", "Two = hai → ✗ thiếu một ưu điểm.", "Four = bốn → ✗ thừa.", "No = không có → ✗ bài nêu nhiều ưu điểm."]}, {"n": 2, "t": "mcq", "stem": "Having few friends is ______________.", "opts": ["one of the drawbacks to life in the country", "one of the certain drawbacks to life outside the city", "the only disadvantage of living in the country", "one of the certain advantages to life outside the city"], "ans": "A", "vi": "Có ít bạn bè là ______.", "ex": "Đoạn 3: \"you are likely to have few friends\" được liệt kê trong các nhược điểm (drawbacks) → là **một trong những nhược điểm** của cuộc sống nông thôn. C sai vì \"the only\" (còn nhiều nhược điểm khác); D sai vì là nhược điểm, không phải ưu điểm. (B cách diễn đạt \"one of the certain\" không tự nhiên nên chọn A.)", "on": ["một trong những nhược điểm của cuộc sống nông thôn → ✓ đúng với đoạn 3.", "một trong những nhược điểm chắc chắn của cuộc sống ngoài thành phố → ✗ diễn đạt \"one of the certain\" không tự nhiên.", "nhược điểm duy nhất → ✗ bài nêu nhiều nhược điểm.", "một trong những ưu điểm → ✗ đây là nhược điểm."]}, {"n": 3, "t": "mcq", "stem": "Living in the country is safer for young children because ______________.", "opts": ["there are few shops", "there are few services", "there is less traffic", "there are fewer people"], "ans": "C", "vi": "Sống ở nông thôn an toàn hơn cho trẻ nhỏ vì ______.", "ex": "Đoạn 2: \"there is less traffic, so it is safer for young children\" → **ít xe cộ hơn**.", "on": ["có ít cửa hàng → ✗ liên quan khó tìm việc, không liên quan an toàn cho trẻ.", "có ít dịch vụ → ✗ tương tự.", "có ít xe cộ hơn → ✓ \"less traffic, so it is safer\".", "có ít người hơn → ✗ dẫn đến ít bạn bè."]}, {"n": 4, "t": "mcq", "stem": "According to the passage, living in the country has ______________.", "opts": ["only bad points", "both good and bad points", "only good points", "no disadvantages"], "ans": "B", "vi": "Theo bài, sống ở nông thôn có ______.", "ex": "Câu đầu: \"it has both advantages and disadvantages\" → **cả điểm tốt lẫn điểm xấu**.", "on": ["chỉ có điểm xấu → ✗.", "có cả điểm tốt lẫn xấu → ✓ \"both advantages and disadvantages\".", "chỉ có điểm tốt → ✗.", "không có nhược điểm → ✗."]}, {"n": 5, "t": "mcq", "stem": "Which of the following statements is NOT true according to the passage?", "opts": ["There are fewer shops and services in the country.", "It's hard to find entertainment in the country.", "People in the country tend to be friendlier than people in the city.", "The country is only suitable for retired people."], "ans": "D", "vi": "Câu nào KHÔNG đúng theo bài?", "ex": "A, B, C đều có trong bài. D sai: bài nói nông thôn phù hợp nhất với người **đã nghỉ hưu HOẶC có con nhỏ** (không phải \"chỉ\" người nghỉ hưu).", "on": ["Có ít cửa hàng và dịch vụ → bài có nói (đúng).", "Khó tìm giải trí → bài có nói (đúng).", "Người nông thôn thân thiện hơn → bài có nói (đúng).", "Nông thôn chỉ phù hợp với người nghỉ hưu → ✓ KHÔNG đúng, còn người có con nhỏ."]}]}, {"id": "s6", "title": "C. READING – II. Đọc văn bản và chọn đáp án đúng", "sub": "", "passage": [[{"en": "Today teenagers live in a very competitive world so it is very common for young people to feel stressed out from time to time.", "vi": "Ngày nay thanh thiếu niên sống trong một thế giới rất cạnh tranh nên việc các bạn trẻ thỉnh thoảng cảm thấy căng thẳng là rất phổ biến."}, {"en": "They are also [[1|trying to do so many tasks]] that it becomes harder and harder to balance study, relaxation and friends.", "vi": "Các bạn cũng đang cố làm quá nhiều việc đến nỗi ngày càng khó cân bằng giữa học tập, thư giãn và bạn bè."}], [{"en": "[[5|There are different ways of dealing with stress.]]", "vi": "Có nhiều cách khác nhau để đối phó với căng thẳng."}, {"en": "A good way to deal with stress is to exercise.", "vi": "Một cách tốt để đối phó với căng thẳng là tập thể dục."}, {"en": "Research has proved that physical exercise is a good [[2|release]] for stress, because it increases certain chemicals in the brain which calm people down.", "vi": "Nghiên cứu đã chứng minh tập thể dục là cách giải toả căng thẳng hiệu quả vì nó làm tăng một số chất hoá học trong não giúp con người bình tĩnh lại."}, {"en": "Getting enough sleep is also an important way of avoiding stress and staying healthy and full of energy.", "vi": "Ngủ đủ giấc cũng là cách quan trọng để tránh căng thẳng, giữ sức khoẻ và tràn đầy năng lượng."}, {"en": "Another way to avoid stress is by managing time effectively.", "vi": "Một cách khác để tránh căng thẳng là quản lý thời gian hiệu quả."}, {"en": "It is better to do several tasks really well than performing too many tasks badly.", "vi": "Làm tốt vài việc thì tốt hơn là làm quá nhiều việc một cách tệ."}, {"en": "Finally, if [[4|it all]] gets beyond their control, teenagers shouldn't panic.", "vi": "Cuối cùng, nếu mọi thứ vượt ngoài tầm kiểm soát, thanh thiếu niên không nên hoảng sợ."}, {"en": "Find the time to sit down quietly and breathe deeply for ten to twenty minutes.", "vi": "Hãy dành thời gian ngồi yên lặng và hít thở sâu trong mười đến hai mươi phút."}, {"en": "Do this regularly, and it will help them calm down and put things in order.", "vi": "Làm điều này đều đặn sẽ giúp các bạn bình tĩnh lại và sắp xếp mọi thứ vào trật tự."}]], "cloze": false, "items": [{"n": 1, "t": "mcq", "stem": "Why do teenagers feel stressed?", "opts": ["Because they are very competitive.", "Because they don't have friends.", "Because they do a great number of tasks.", "Because they don't relax."], "ans": "C", "vi": "Tại sao thanh thiếu niên cảm thấy căng thẳng?", "ex": "Đoạn 1: \"They are also trying to do so many tasks that it becomes harder...\" → vì họ **làm quá nhiều việc**. (A sai: thế giới cạnh tranh chứ không phải các bạn \"rất hay cạnh tranh\".)", "on": ["Vì họ rất hay cạnh tranh → ✗ thế giới cạnh tranh, không phải họ.", "Vì họ không có bạn → ✗ bài không nói.", "Vì họ làm quá nhiều việc → ✓.", "Vì họ không thư giãn → ✗ không nêu là nguyên nhân."]}, {"n": 2, "t": "mcq", "stem": "Which has the closest meaning with the word \"release\"?", "opts": ["getting rid of", "treatment", "freedom", "start"], "ans": "A", "vi": "Từ nào gần nghĩa nhất với từ \"release\"?", "ex": "\"a good release for stress\" = cách giải toả / xả bớt căng thẳng → **getting rid of** (loại bỏ, trút bỏ).", "on": ["getting rid of = loại bỏ → ✓ release = giải toả.", "treatment = điều trị → ✗.", "freedom = tự do → ✗.", "start = bắt đầu → ✗."]}, {"n": 3, "t": "mcq", "stem": "Which is NOT mentioned in the text as a way of dealing with stress?", "opts": ["Taking medicine.", "Doing physical exercise.", "Managing time well.", "Having enough sleep."], "ans": "A", "vi": "Cách nào KHÔNG được nhắc đến để đối phó với căng thẳng?", "ex": "Bài nêu: tập thể dục (B), ngủ đủ (D), quản lý thời gian (C), ngồi yên và hít thở sâu. **Uống thuốc** thì không được nhắc đến.", "on": ["Uống thuốc → ✓ KHÔNG được nhắc đến.", "Tập thể dục → có nhắc.", "Quản lý thời gian → có nhắc.", "Ngủ đủ giấc → có nhắc."]}, {"n": 4, "t": "mcq", "stem": "In the second paragraph, what does the word \"it\" refer to?", "opts": ["tasks", "control", "stress", "time"], "ans": "C", "vi": "Ở đoạn 2, từ \"it\" ám chỉ điều gì?", "ex": "\"if it all gets beyond their control\" – \"it all\" chỉ toàn bộ tình trạng **căng thẳng (stress)** đang bàn đến trong đoạn → chọn C.", "on": ["tasks = các công việc → ✗.", "control = sự kiểm soát → ✗ (control đứng sau).", "stress = căng thẳng → ✓.", "time = thời gian → ✗."]}, {"n": 5, "t": "mcq", "stem": "What is the best title for this text?", "opts": ["Ways of coping with stress", "Causes of stress", "Effects of stress on teenagers", "Life with stress"], "ans": "A", "vi": "Tiêu đề phù hợp nhất cho bài là gì?", "ex": "Phần chính của bài liệt kê nhiều cách đối phó với căng thẳng → **Ways of coping with stress** (Những cách đối phó với căng thẳng).", "on": ["Ways of coping with stress = Những cách đối phó với stress → ✓.", "Causes of stress = Nguyên nhân → ✗ chỉ đoạn 1.", "Effects of stress = Tác động → ✗ không nói.", "Life with stress = Sống với stress → ✗ quá rộng."]}]}, {"id": "s7", "title": "C. READING – III. Đọc đoạn văn và chọn đáp án đúng nhất", "sub": "", "passage": [[{"en": "[[1|The most interesting hobby that I have is playing the guitar.]]", "vi": "Sở thích thú vị nhất của tôi là chơi guitar."}, {"en": "I have played guitar for three and a half years now and I am getting better at it every time I decide to play.", "vi": "Tôi đã chơi guitar được ba năm rưỡi và tôi tiến bộ hơn mỗi lần quyết định chơi."}, {"en": "[[1|Playing guitar keeps me doing something interesting at home instead of staring at the ceiling all the time.]]", "vi": "Chơi guitar giúp tôi có việc thú vị để làm ở nhà thay vì cứ nhìn trân trân lên trần nhà."}, {"en": "[[1|Actually it is a very relaxing activity.]]", "vi": "Thật ra nó là một hoạt động rất thư giãn."}, {"en": "[[1|It gives person some time to think and dream.]]", "vi": "Nó cho con người chút thời gian để suy nghĩ và mơ mộng."}], [{"en": "Guitar or guitars also give my room some personality.", "vi": "Những cây guitar còn làm căn phòng của tôi có cá tính."}, {"en": "When it hangs on my wall it seems like a piece of art.", "vi": "Khi treo trên tường, nó trông như một tác phẩm nghệ thuật."}, {"en": "I have two guitars - [[2|one is black acoustic one]] and the second is a yellow Spanish guitar.", "vi": "Tôi có hai cây guitar – một cây acoustic màu đen và cây còn lại là guitar Tây Ban Nha màu vàng."}, {"en": "[[2|The last one was my first guitar]] and both of them are Yamaha products.", "vi": "Cây sau (màu vàng) là cây guitar đầu tiên của tôi và cả hai đều là sản phẩm của Yamaha."}, {"en": "I bought the classical one because it was required to learn guitar in my school.", "vi": "Tôi mua cây cổ điển vì trường yêu cầu phải có để học guitar."}, {"en": "[[3|Since I am interested in blues, jazz and rock music]] I felt that I needed a change in my guitar play and [[3|that is why I bought the black acoustic one]].", "vi": "Vì tôi thích nhạc blues, jazz và rock nên tôi cảm thấy cần thay đổi cách chơi guitar và đó là lý do tôi mua cây acoustic màu đen."}], [{"en": "[[5|I can play many different songs]] and after 3 years of experience I have learned how to learn the songs to play them.", "vi": "Tôi có thể chơi nhiều bài khác nhau và sau 3 năm kinh nghiệm tôi đã học được cách học các bài hát để chơi chúng."}, {"en": "My favourite songs that I have learned are Led Zeppelin's Stairway to Heaven and Leonard Cohen's Hallelujah.", "vi": "Những bài yêu thích tôi đã học là \"Stairway to Heaven\" của Led Zeppelin và \"Hallelujah\" của Leonard Cohen."}, {"en": "I can also play a bit of Sting, Nirvana, Metallica and [[4|the Animals]].", "vi": "Tôi cũng có thể chơi một chút nhạc của Sting, Nirvana, Metallica và The Animals (đứng cạnh các nghệ sĩ/ban nhạc nên là một ban nhạc)."}], [{"en": "In the future I want to improve my guitar playing skills and maybe use them in some small band or I would just like to play with my friends.", "vi": "Trong tương lai tôi muốn cải thiện kỹ năng chơi guitar và có thể dùng chúng trong một ban nhạc nhỏ, hoặc chỉ đơn giản là chơi cùng bạn bè."}, {"en": "I would certainly recommend learning guitar.", "vi": "Tôi chắc chắn khuyên bạn nên học guitar."}, {"en": "If interest in it comes, it cannot be put away.", "vi": "Nếu sự yêu thích đến, thì nó không thể bị bỏ đi."}]], "cloze": false, "items": [{"n": 1, "t": "mcq", "stem": "The first paragraph is mainly about ________.", "opts": ["why playing the guitar is the author's most interesting hobby", "the author's good feelings about playing the guitar", "how the author chose to play the guitar and the benefits of playing it", "the author's hobby of playing the guitar and some of its benefits"], "ans": "D", "vi": "Đoạn 1 chủ yếu nói về ________.", "ex": "Đoạn 1 giới thiệu sở thích chơi guitar (chơi 3,5 năm) và một số lợi ích (có việc thú vị làm, thư giãn, có thời gian suy nghĩ) → **sở thích chơi guitar và một vài lợi ích của nó**.", "on": ["vì sao chơi guitar là sở thích thú vị nhất → ✗ không giải thích lý do chọn.", "cảm xúc tốt khi chơi → ✗ thiếu ý lợi ích.", "tác giả chọn guitar thế nào và lợi ích → ✗ không kể cách chọn.", "sở thích chơi guitar và một số lợi ích → ✓."]}, {"n": 2, "t": "mcq", "stem": "According to the second paragraph, the author's second guitar is ________.", "opts": ["a Spanish one", "black", "not an acoustic one", "not a classical one"], "ans": "B", "vi": "Theo đoạn 2, cây guitar thứ hai của tác giả là ________.", "ex": "Cây thứ nhất là guitar Tây Ban Nha màu vàng (classical). Cây thứ hai là \"black acoustic one\" → **màu đen** (B). Lưu ý: bài viết \"the second is a yellow Spanish guitar\" theo thứ tự liệt kê, nhưng \"The last one was my first guitar\" cho biết cây vàng mua TRƯỚC, nên cây mua thứ hai là cây đen. (Câu này dễ gây tranh cãi – nên đối chiếu đáp án của giáo viên.)", "on": ["một cây Spanish → ✗ đó là cây đầu tiên.", "màu đen → ✓ cây thứ hai mua là cây đen.", "không phải acoustic → ✗ cây đen là acoustic.", "không phải cổ điển → đúng nghĩa nhưng B nêu trực tiếp hơn."]}, {"n": 3, "t": "mcq", "stem": "Why did the author buy the acoustic guitar?", "opts": ["Because the author likes to play blues, jazz and rock music", "Because the author was required to learn guitar in school", "Because the other guitar can't play classical music", "Because the author wanted to change his current one"], "ans": "A", "vi": "Tại sao tác giả mua cây guitar acoustic?", "ex": "\"Since I am interested in blues, jazz and rock music ... that is why I bought the black acoustic one\" → vì **thích chơi nhạc blues, jazz, rock**. (B là lý do mua cây cổ điển.)", "on": ["vì thích blues, jazz, rock → ✓.", "vì trường yêu cầu → ✗ đó là lý do mua cây cổ điển.", "vì cây kia không chơi được nhạc cổ điển → ✗ bài không nói.", "vì muốn đổi cây hiện tại → ✗ muốn đổi cách chơi."]}, {"n": 4, "t": "mcq", "stem": "What does the phrase \"the Animals\" in the third paragraph possibly refer to?", "opts": ["a song", "a music band", "some kinds of animals", "none of above"], "ans": "B", "vi": "Cụm \"the Animals\" ở đoạn 3 có thể chỉ điều gì?", "ex": "Nó đứng cạnh Sting, Nirvana, Metallica (các nghệ sĩ/ban nhạc) → **một ban nhạc**.", "on": ["một bài hát → ✗ đứng cạnh các nghệ sĩ.", "một ban nhạc → ✓ the Animals là ban nhạc.", "một loài vật → ✗.", "không đáp án nào → ✗."]}, {"n": 5, "t": "mcq", "stem": "We learn from the passage that ________.", "opts": ["the author plays the guitar because he usually does nothing in his free time", "the author has totally four guitars", "the author can play different songs of different types of music", "the author will continue to play the guitar in the future"], "ans": "C", "vi": "Từ bài ta biết rằng ________.", "ex": "Đoạn 3: tác giả chơi được nhiều bài của Led Zeppelin, Leonard Cohen, Sting, Nirvana, Metallica... → chơi **nhiều bài thuộc nhiều thể loại nhạc**. A sai (chơi để thư giãn, không phải vì rảnh rỗi), B sai (có 2 cây).", "on": ["chơi vì thường không có việc gì làm → ✗ chơi cho thú vị và thư giãn.", "có tất cả bốn cây guitar → ✗ chỉ có hai.", "chơi được nhiều bài của nhiều thể loại → ✓.", "sẽ tiếp tục chơi → ✗ chỉ là điều suy ra, không phải điều bài nói trực tiếp."]}]}, {"id": "s8", "title": "C. READING – IV. Đọc hội thoại và chọn T (đúng) / F (sai)", "sub": "", "passage": [[{"en": "Mai: Tom, so which club do you want to join?", "vi": "Mai: Tom, cậu muốn tham gia câu lạc bộ nào?"}, {"en": "Tom: I'm interested in 2 clubs: [[2|badminton and chess]].", "vi": "Tom: Mình thích 2 câu lạc bộ: cầu lông và cờ vua."}, {"en": "Mai: [[1|I like badminton, too]]. It's relaxing.", "vi": "Mai: Mình cũng thích cầu lông. Nó rất thư giãn."}, {"en": "Tom: Yes, I play it to keep fit. So let's join that club together.", "vi": "Tom: Ừ, mình chơi để giữ dáng. Vậy hãy cùng tham gia CLB đó nhé."}], [{"en": "Mai: Ok. It's on Tuesdays and Fridays from 5:00 p.m to 6:30 p.m.", "vi": "Mai: Được. CLB sinh hoạt vào thứ Ba và thứ Sáu từ 5:00 đến 6:30 chiều."}, {"en": "[[3|It starts 30 minutes after school]], so we have enough time to get some snacks beforehand.", "vi": "CLB bắt đầu sau giờ học 30 phút nên chúng mình có đủ thời gian ăn chút đồ ăn nhẹ trước đó."}, {"en": "I know you like chess. Will you join the chess club?", "vi": "Mình biết cậu thích cờ vua. Cậu có tham gia CLB cờ vua không?"}], [{"en": "Tom: Well, [[4|I started playing it 5 years ago]].", "vi": "Tom: À, mình bắt đầu chơi cờ cách đây 5 năm (không phải \"lúc 5 tuổi\")."}, {"en": "My mum first sent me to a chess club because she wanted me to be more focused.", "vi": "Mẹ mình cho mình đi CLB cờ vua vì mẹ muốn mình tập trung hơn."}, {"en": "Now I find that I can concentrate better. Do you like chess? Let's join the chess club too.", "vi": "Giờ mình thấy mình tập trung tốt hơn. Cậu có thích cờ vua không? Mình cùng tham gia CLB cờ vua luôn nhé."}], [{"en": "Mai: Actually, this year there is [[2|a new arts and crafts club]], and I want to join it.", "vi": "Mai: Thật ra năm nay có một CLB mới là nghệ thuật và thủ công, và mình muốn tham gia."}, {"en": "I hear that the members will work together in small [[5|community service projects]].", "vi": "Mình nghe nói các thành viên sẽ cùng làm những dự án phục vụ cộng đồng nhỏ."}, {"en": "Members can do art projects and also improve their practical skills and teamwork skills too.", "vi": "Các thành viên có thể làm dự án nghệ thuật và cũng cải thiện kỹ năng thực hành và kỹ năng làm việc nhóm."}]], "items": [{"n": 1, "t": "tf", "stem": "Mai likes soccer.", "ans": "F", "vi": "Mai thích bóng đá.", "ex": "Mai nói \"I like **badminton**, too\" – cô ấy thích **cầu lông**, không phải bóng đá. → **F**"}, {"n": 2, "t": "tf", "stem": "The school has badminton, chess, and arts and crafts clubs.", "ans": "T", "vi": "Trường có các câu lạc bộ cầu lông, cờ vua và nghệ thuật thủ công.", "ex": "Hội thoại nhắc cả ba CLB: badminton, chess, và \"a new arts and crafts club\". → **T**"}, {"n": 3, "t": "tf", "stem": "The badminton club activities are after school.", "ans": "T", "vi": "Hoạt động của CLB cầu lông diễn ra sau giờ học.", "ex": "Mai: \"It starts 30 minutes after school\" (bắt đầu sau giờ học 30 phút) → **T**"}, {"n": 4, "t": "tf", "stem": "Tom stayed playing chess when he was five.", "ans": "F", "vi": "Tom chơi cờ vua khi cậu ấy 5 tuổi.", "ex": "Tom nói \"I started playing it **5 years ago**\" (cách đây 5 năm), không phải \"khi lên 5 tuổi\". → **F**"}, {"n": 5, "t": "tf", "stem": "Members of the arts and crafts club do community activities.", "ans": "T", "vi": "Thành viên CLB nghệ thuật thủ công làm các hoạt động cộng đồng.", "ex": "Mai: \"members will work together in small **community service projects**\" → **T**"}]}, {"id": "s9", "title": "C. READING – V. Điền từ thích hợp vào mỗi chỗ trống", "sub": "Từ cho sẵn: reading, to do, but, when, an, a, what", "passage": [[{"en": "My favourite hobby is reading.", "vi": "Sở thích yêu thích của tôi là đọc sách."}, {"en": "I enjoy [[1|reading]] a book when I am free.", "vi": "Tôi thích đọc một cuốn sách khi rảnh."}, {"en": "I started [[2|to do]] it when I was four years old.", "vi": "Tôi bắt đầu làm điều đó từ năm bốn tuổi."}, {"en": "The first time I read books, I felt interested. So I kept reading.", "vi": "Lần đầu đọc sách, tôi thấy hứng thú nên cứ tiếp tục đọc."}, {"en": "I was happy when I read a story with a happy ending.", "vi": "Tôi vui khi đọc câu chuyện có cái kết có hậu."}, {"en": "I was thrilled [[3|when]] I read a detective story.", "vi": "Tôi hồi hộp khi đọc truyện trinh thám."}], [{"en": "I enjoy reading because I like to explore the imaginative world of my favourite author, J. K. Rowling, who wrote the Harry Potter series.", "vi": "Tôi thích đọc vì muốn khám phá thế giới giàu trí tưởng tượng của tác giả yêu thích J. K. Rowling, người viết bộ Harry Potter."}, {"en": "There are a lot of advantages of reading.", "vi": "Đọc sách có rất nhiều lợi ích."}, {"en": "Reading can make me relaxed and calm.", "vi": "Đọc sách giúp tôi thư giãn và bình tĩnh."}, {"en": "I can also learn new vocabulary items. Then I can further improve my English.", "vi": "Tôi cũng học được từ vựng mới, nhờ đó cải thiện tiếng Anh."}, {"en": "Moreover, it can give me [[4|an]] unlimited imagination, so I can write books in the future.", "vi": "Hơn nữa, nó cho tôi một trí tưởng tượng vô hạn nên sau này tôi có thể viết sách."}, {"en": "I can learn the different cultures and customs of other countries in the world too.", "vi": "Tôi cũng học được văn hoá và phong tục của các nước khác."}], [{"en": "I read at least one hour every day. I read books by myself.", "vi": "Tôi đọc ít nhất một giờ mỗi ngày và tự đọc sách."}, {"en": "I wish I could read different kinds of books [[5|but]] it might be very challenging.", "vi": "Tôi ước mình có thể đọc nhiều thể loại sách nhưng điều đó có thể rất khó khăn."}]], "cloze": true, "items": [{"n": 1, "t": "text", "stem": "I enjoy (1) ______ a book when I am free.", "ans": ["reading"], "show": "reading", "vi": "", "ex": "enjoy + V-ing → **reading**."}, {"n": 2, "t": "text", "stem": "I started (2) ______ it when I was four years old.", "ans": ["to do"], "show": "to do", "vi": "", "ex": "start + to V → **to do** (to do it = làm việc đó, tức là đọc sách)."}, {"n": 3, "t": "text", "stem": "I was thrilled (3) ______ I read a detective story.", "ans": ["when"], "show": "when", "vi": "", "ex": "Chỉ thời điểm \"khi tôi đọc truyện trinh thám\" → **when**."}, {"n": 4, "t": "text", "stem": "it can give me (4) ______ unlimited imagination", "ans": ["an"], "show": "an", "vi": "", "ex": "\"unlimited\" bắt đầu bằng âm nguyên âm /ʌ/ nên dùng mạo từ **an** (không dùng \"a\"): an unlimited imagination."}, {"n": 5, "t": "text", "stem": "I wish I could read different kinds of books (5) ______ it might be very challenging.", "ans": ["but"], "show": "but", "vi": "", "ex": "Hai vế đối lập (ước đọc nhiều sách ↔ nhưng có thể rất khó khăn) → **but**."}]}, {"id": "s10", "title": "C. READING – VI. Chọn đáp án đúng để điền vào chỗ trống", "sub": "", "passage": [[{"en": "Today, people all over the world are moving out of small villages in the country to go and live in big, noisy cities.", "vi": "Ngày nay, người dân khắp thế giới đang rời những ngôi làng nhỏ ở nông thôn để đến sống ở các thành phố lớn, ồn ào."}, {"en": "They are moving from the peaceful mountains, fields and rivers of the countryside to the busy world of streets, buildings, traffic and [[1|crowds]].", "vi": "Họ chuyển từ núi, cánh đồng, dòng sông yên bình của miền quê đến thế giới bận rộn của đường phố, toà nhà, xe cộ và đám đông."}, {"en": "This movement from rural areas to urban areas has been going on for over two hundred years.", "vi": "Sự di chuyển từ nông thôn ra thành thị này đã diễn ra hơn hai trăm năm."}], [{"en": "In many countries, the main reason why people come to live in towns and cities is work.", "vi": "Ở nhiều nước, lý do chính khiến người ta đến sống ở thị trấn, thành phố là công việc."}, {"en": "After one or two large factories have been built in a town, people come to find work and a better [[2|life]], and soon an industrial area begins to grow.", "vi": "Sau khi một hai nhà máy lớn được xây, người ta kéo đến tìm việc và một cuộc sống tốt hơn, và chẳng bao lâu một khu công nghiệp hình thành."}, {"en": "There is usually a residential area nearby where the factory workers can live.", "vi": "Thường có một khu dân cư gần đó để công nhân sinh sống."}, {"en": "The families of these workers need schools, shops and hospitals, [[3|so]] more people come to live in the area to provide these services - and so a city grows.", "vi": "Gia đình họ cần trường học, cửa hàng, bệnh viện, nên ngày càng nhiều người đến sống để cung cấp các dịch vụ này – và thế là một thành phố lớn lên."}], [{"en": "A lot of people live in the [[4|suburbs]] of the city, far away from the industrial area and the city centre.", "vi": "Nhiều người sống ở vùng ngoại ô thành phố, xa khu công nghiệp và trung tâm."}, {"en": "Some suburbs are pleasant, with nice houses and parks for children to play, but others are poor, with old houses and bad conditions.", "vi": "Một số vùng ngoại ô dễ chịu, có nhà đẹp và công viên cho trẻ chơi, nhưng số khác nghèo, nhà cũ và điều kiện tồi."}], [{"en": "But what is the future of the big cities? Will they continue to get bigger and bigger?", "vi": "Nhưng tương lai của các thành phố lớn là gì? Chúng sẽ tiếp tục lớn lên mãi chứ?"}, {"en": "Perhaps yes. Some major cities have actually become bigger in the last ten years.", "vi": "Có lẽ là có. Một số thành phố lớn thực sự đã lớn hơn trong mười năm qua."}, {"en": "It is quite possible that one day we will see people [[5|moving out]] of the countryside and go to bigger towns and cities.", "vi": "Rất có thể một ngày nào đó ta sẽ thấy người dân rời khỏi nông thôn để đến các thị trấn, thành phố lớn hơn."}]], "cloze": true, "items": [{"n": 1, "t": "mcq", "stem": "... the busy world of streets, buildings, traffic and (1) ________.", "opts": ["crowded", "overcrowded", "crowding", "crowds"], "ans": "D", "vi": "… thế giới bận rộn của đường phố, toà nhà, xe cộ và (1) đám đông.", "ex": "Đây là danh sách danh từ (streets, buildings, traffic and ...) → cần **danh từ**: **crowds** (đám đông). crowded / overcrowded là tính từ.", "on": ["crowded = đông đúc (tính từ) → ✗ cần danh từ.", "overcrowded = quá đông (tính từ) → ✗ cần danh từ.", "crowding → ✗ không hợp.", "crowds = đám đông (danh từ) → ✓."]}, {"n": 2, "t": "mcq", "stem": "... people come to find work and a better (2) ________...", "opts": ["living", "life", "live", "alive"], "ans": "B", "vi": "… người ta đến tìm việc và một cuộc sống tốt hơn.", "ex": "Sau \"a better\" cần danh từ: **a better life** (cuộc sống tốt hơn). living (cuộc sống mưu sinh) không tự nhiên bằng; live là động từ, alive là tính từ.", "on": ["living = mưu sinh → ✗ không tự nhiên bằng life.", "life = cuộc sống → ✓ a better life.", "live = sống (động từ) → ✗.", "alive = còn sống → ✗."]}, {"n": 3, "t": "mcq", "stem": "The families of these workers need schools, shops and hospitals, (3) ________ more people come to live in the area...", "opts": ["but", "or", "so", "and"], "ans": "C", "vi": "Gia đình công nhân cần trường học, cửa hàng, bệnh viện, nên ngày càng nhiều người đến sống ở khu vực này…", "ex": "Vế sau là **kết quả** của vế trước → **so** (vì vậy, nên).", "on": ["but = nhưng → ✗.", "or = hoặc → ✗.", "so = vì vậy → ✓ kết quả.", "and = và → ✗ ít hợp nghĩa nhân quả bằng so."]}, {"n": 4, "t": "mcq", "stem": "A lot of people live in the (4) ________ of the city, far away from the industrial area and the city centre.", "opts": ["urban", "city centre", "down town", "suburbs"], "ans": "D", "vi": "Nhiều người sống ở vùng ngoại ô của thành phố, xa khu công nghiệp và trung tâm thành phố.", "ex": "\"far away from ... the city centre\" → **suburbs** (vùng ngoại ô). Câu sau cũng nói \"Some suburbs are pleasant...\".", "on": ["urban = thuộc đô thị → ✗ tính từ.", "city centre = trung tâm → ✗ trái nghĩa far away from.", "down town = khu trung tâm → ✗.", "suburbs = ngoại ô → ✓."]}, {"n": 5, "t": "mcq", "stem": "... one day we will see people (5) ________ of the countryside and go to bigger towns and cities.", "opts": ["moving out", "coming", "moving in", "leaving"], "ans": "A", "vi": "… một ngày nào đó ta sẽ thấy người dân rời khỏi vùng nông thôn để đến các thành phố lớn hơn.", "ex": "Cụm **move out of** = chuyển ra khỏi. \"moving out **of** the countryside\" (có giới từ \"of\"). \"leaving of\" sai, \"coming\"/\"moving in\" sai nghĩa.", "on": ["moving out (of) = chuyển ra khỏi → ✓.", "coming → ✗ không đi với of the countryside.", "moving in = chuyển vào → ✗ ngược nghĩa.", "leaving = rời → ✗ leaving of sai cấu trúc."]}]}, {"id": "s11", "title": "C. READING – VII. Chọn đáp án đúng hoàn thành bức thư", "sub": "", "passage": [[{"en": "Dear Elena,", "vi": "Elena thân mến,"}, {"en": "Thanks for your email.", "vi": "Cảm ơn email của bạn."}, {"en": "Now I'll tell you about my summer holiday in my home town.", "vi": "Bây giờ mình sẽ kể về kỳ nghỉ hè ở quê của mình."}, {"en": "I live in Ha Noi, [[1|but]] my home town is Ninh Binh.", "vi": "Mình sống ở Hà Nội, nhưng quê mình là Ninh Bình."}, {"en": "My grandparents live there, in a small house near a paddy field.", "vi": "Ông bà mình sống ở đó, trong một ngôi nhà nhỏ gần cánh đồng lúa."}, {"en": "I went to stay with them in June. It was a wonderful holiday.", "vi": "Mình đến ở với ông bà vào tháng Sáu. Đó là một kỳ nghỉ tuyệt vời."}], [{"en": "Every morning, my grandma and I got up early and [[2|fed]] the pigs and chickens.", "vi": "Mỗi sáng, bà và mình dậy sớm và cho lợn, gà ăn."}, {"en": "When we finished, we cooked breakfast.", "vi": "Khi xong, chúng mình nấu bữa sáng."}, {"en": "After that, I [[3|went]] fishing with my grandpa or helped my grandma with the gardening.", "vi": "Sau đó, mình đi câu cá với ông hoặc giúp bà làm vườn."}, {"en": "In the afternoon, I went to the fields with some other children.", "vi": "Buổi chiều, mình ra đồng cùng vài bạn nhỏ khác."}, {"en": "They taught me to [[4|herd]] the buffaloes.", "vi": "Các bạn dạy mình chăn trâu."}, {"en": "Sometimes we flew kites or skipped rope together.", "vi": "Đôi khi chúng mình thả diều hoặc nhảy dây cùng nhau."}, {"en": "In the evening, I drew pictures, read books, or watched TV with my grandparents.", "vi": "Buổi tối, mình vẽ tranh, đọc sách hoặc xem TV với ông bà."}, {"en": "I went to bed quite early, at about 9 p.m.", "vi": "Mình đi ngủ khá sớm, khoảng 9 giờ tối."}], [{"en": "I'm sending you a photo I took [[5|of]] my grandparents' house.", "vi": "Mình gửi bạn một bức ảnh mình chụp ngôi nhà của ông bà."}, {"en": "I hope you'll like it. Love, Mi", "vi": "Mình hy vọng bạn sẽ thích nó. Thân, Mi."}]], "cloze": true, "items": [{"n": 1, "t": "mcq", "stem": "I live in Ha Noi, (1) ______ my home town is Ninh Binh.", "opts": ["but", "so", "for", "or"], "ans": "A", "vi": "Mình sống ở Hà Nội, nhưng quê mình là Ninh Bình.", "ex": "Hai ý tương phản (sống ở Hà Nội ↔ quê ở Ninh Bình) → **but**.", "on": ["but = nhưng → ✓ đối lập.", "so → ✗.", "for → ✗.", "or → ✗."]}, {"n": 2, "t": "mcq", "stem": "... my grandma and I got up early and (2) ______ the pigs and chickens.", "opts": ["feel", "is feeling", "fed", "will feed"], "ans": "C", "vi": "… bà và mình dậy sớm và cho lợn gà ăn.", "ex": "Câu kể chuyện quá khứ (got up, cooked) → động từ chia **quá khứ đơn**: **fed** (feed – fed – fed = cho ăn). \"feel\" là cảm thấy, không hợp nghĩa.", "on": ["feel → ✗ không hợp nghĩa.", "is feeling → ✗ sai thì.", "fed = cho ăn (quá khứ) → ✓.", "will feed → ✗ sai thì."]}, {"n": 3, "t": "mcq", "stem": "After that, I (3) ______ fishing with my grandpa or helped my grandma...", "opts": ["could", "went", "did", "played"], "ans": "B", "vi": "Sau đó mình đi câu cá với ông…", "ex": "**go fishing** = đi câu cá; quá khứ: **went**.", "on": ["could = có thể → ✗.", "went = đi → ✓ went fishing.", "did → ✗.", "played → ✗."]}, {"n": 4, "t": "mcq", "stem": "They taught me to (4) ______ the buffaloes.", "opts": ["run", "get", "go", "herd"], "ans": "D", "vi": "Các bạn dạy mình chăn trâu.", "ex": "**herd buffaloes** = chăn trâu.", "on": ["run = chạy → ✗.", "get = lấy → ✗.", "go = đi → ✗.", "herd = chăn → ✓ herd buffaloes."]}, {"n": 5, "t": "mcq", "stem": "I'm sending you a photo I took (5) ______ my grandparents' house.", "opts": ["for", "of", "on", "next"], "ans": "B", "vi": "Mình gửi bạn bức ảnh mình chụp ngôi nhà của ông bà.", "ex": "**a photo of sth** = bức ảnh chụp cái gì → **of**.", "on": ["for → ✗.", "of → ✓ photo of.", "on → ✗.", "next → ✗."]}]}, {"id": "s12", "title": "C. READING – VIII. Chọn đáp án đúng hoàn thành đoạn văn", "sub": "", "passage": [[{"en": "Leisure activities are very important to people.", "vi": "Các hoạt động giải trí rất quan trọng đối với con người."}, {"en": "There are a lot of activities they can do in their free time.", "vi": "Có rất nhiều hoạt động họ có thể làm lúc rảnh."}, {"en": "The most [[1|common]] type of leisure activities are those that are done just for fun.", "vi": "Loại hoạt động giải trí phổ biến nhất là những hoạt động chỉ để vui."}, {"en": "Often these activities do not need a special skill in order to do them.", "vi": "Thường những hoạt động này không cần kỹ năng đặc biệt."}, {"en": "In many parts of the world, [[2|watching]] television is the number one leisure activity.", "vi": "Ở nhiều nơi trên thế giới, xem tivi là hoạt động giải trí số một."}, {"en": "Other popular choices include talking with friends, eating out, playing sports, travelling, and [[3|playing]] electronic games.", "vi": "Các lựa chọn phổ biến khác gồm nói chuyện với bạn bè, đi ăn ngoài, chơi thể thao, du lịch và chơi trò chơi điện tử."}], [{"en": "More serious leisure activities include working on a hobby, such as [[4|building]] a model plane or working with pottery.", "vi": "Các hoạt động nghiêm túc hơn gồm làm một sở thích, như lắp ráp mô hình máy bay hoặc làm đồ gốm."}, {"en": "People need to learn a special skill or have experience to do these types of leisure activities.", "vi": "Người ta cần học kỹ năng đặc biệt hoặc có kinh nghiệm để làm những hoạt động này."}], [{"en": "Leisure brings different rewards to different people.", "vi": "Giải trí mang lại những phần thưởng khác nhau cho những người khác nhau."}, {"en": "People usually feel happy and relaxed [[5|when]] doing their leisure activities.", "vi": "Mọi người thường cảm thấy vui và thư giãn khi làm các hoạt động giải trí."}, {"en": "They can also feel a sense of adventure and pride in their accomplishment.", "vi": "Họ cũng có thể cảm thấy phiêu lưu và tự hào về thành tích của mình."}]], "cloze": true, "items": [{"n": 1, "t": "mcq", "stem": "The most (1) ____ type of leisure activities are those that are done just for fun.", "opts": ["common", "good", "interesting", "funny"], "ans": "A", "vi": "Loại hoạt động giải trí phổ biến nhất là những hoạt động chỉ để vui.", "ex": "**the most common type** = loại phổ biến nhất (phù hợp với ý \"nhiều người làm\").", "on": ["common = phổ biến → ✓.", "good = tốt → ✗.", "interesting = thú vị → ✗.", "funny = buồn cười → ✗."]}, {"n": 2, "t": "mcq", "stem": "In many parts of the world, (2) _______ television is the number one leisure activity.", "opts": ["having", "spending", "watching", "using"], "ans": "C", "vi": "Ở nhiều nơi trên thế giới, xem tivi là hoạt động giải trí số một.", "ex": "Cụm cố định: **watch television** (xem tivi).", "on": ["having → ✗.", "spending → ✗.", "watching = xem → ✓ watching television.", "using → ✗."]}, {"n": 3, "t": "mcq", "stem": "... travelling, and (3) ______ electronic games.", "opts": ["getting", "having", "doing", "playing"], "ans": "D", "vi": "… đi du lịch, và chơi trò chơi điện tử.", "ex": "Cụm cố định: **play electronic games** (chơi trò chơi điện tử).", "on": ["getting → ✗.", "having → ✗.", "doing → ✗.", "playing = chơi → ✓ playing electronic games."]}, {"n": 4, "t": "mcq", "stem": "... such as (4) ______ a model plane or working with pottery.", "opts": ["buying", "taking", "building", "doing"], "ans": "C", "vi": "… chẳng hạn như lắp ráp mô hình máy bay hoặc làm đồ gốm.", "ex": "**build a model plane** = lắp ráp / làm mô hình máy bay (đây là sở thích cần kỹ năng, nên không phải \"buying\").", "on": ["buying = mua → ✗.", "taking → ✗.", "building = lắp ráp → ✓.", "doing → ✗."]}, {"n": 5, "t": "mcq", "stem": "People usually feel happy and relaxed (5) ______ doing their leisure activities.", "opts": ["when", "if", "why", "where"], "ans": "A", "vi": "Mọi người thường cảm thấy vui và thư giãn khi làm các hoạt động giải trí.", "ex": "**when + V-ing** = khi đang làm gì (rút gọn mệnh đề thời gian).", "on": ["when = khi → ✓.", "if = nếu → ✗.", "why = tại sao → ✗.", "where = ở đâu → ✗."]}]}, {"id": "s13", "title": "C. READING – IX. Đọc đoạn hội thoại", "sub": "Câu 1–4: chọn đáp án. Câu 5–9: chọn T hoặc F.", "passage": [[{"en": "Mi: Ms Hoa said we can discuss the stress we have in our lives on the class forum.", "vi": "Mi: Cô Hoa nói chúng ta có thể thảo luận về căng thẳng trong cuộc sống trên diễn đàn lớp."}, {"en": "So, what stress do you have?", "vi": "Vậy các cậu có căng thẳng gì?"}], [{"en": "Minh: I'm tired of trying to [[1,6|meet my parents' expectations]].", "vi": "Minh: Mình mệt mỏi vì cố đáp ứng kỳ vọng của bố mẹ."}, {"en": "They want me to study well and be good at many things, so they send me to many classes like maths, English, piano, and karate.", "vi": "Họ muốn mình học giỏi và giỏi nhiều thứ nên cho mình đi nhiều lớp như toán, tiếng Anh, piano và karate."}], [{"en": "Ann: Why don't you tell them your [[2|interests]] and abilities, Minh?", "vi": "Ann: Sao cậu không nói với họ về sở thích và khả năng của cậu, Minh?"}, {"en": "[[7|I talked to my parents about this]] so they no longer send me to classes I don't like.", "vi": "Mình đã nói chuyện với bố mẹ về chuyện này nên họ không còn cho mình đi các lớp mình không thích nữa."}, {"en": "Now I just focus on my [[3,8|health and try to lose some weight]].", "vi": "Bây giờ mình chỉ tập trung vào sức khoẻ và cố giảm cân."}], [{"en": "Minh: You look fit, Ann. You should feel good about your body.", "vi": "Minh: Cậu trông cân đối mà, Ann. Cậu nên cảm thấy tự tin về cơ thể mình."}, {"en": "Ann: Are you kidding, Mi? I still need to lose a few more kilos. How about you, Mi?", "vi": "Ann: Cậu đùa à, Mi? Mình vẫn cần giảm thêm vài ký. Còn cậu thì sao, Mi?"}], [{"en": "Mi: Actually, I [[4|don't get on with my sister]].", "vi": "Mi: Thật ra mình không hợp với chị/em gái mình."}, {"en": "She is [[9|jealous of anything I have]] and always starts arguments.", "vi": "Cô ấy ghen tị với mọi thứ mình có và luôn gây ra cãi nhau."}, {"en": "So I had to talk to my mum...", "vi": "Nên mình đã phải nói chuyện với mẹ…"}]], "items": [{"n": 1, "t": "mcq", "stem": "Minh feels tired of trying to _______ his parents' expectations.", "opts": ["meet", "refuse", "forget", "ignore"], "ans": "A", "vi": "Minh mệt mỏi vì cố gắng đáp ứng kỳ vọng của bố mẹ.", "ex": "Cụm **meet expectations** = đáp ứng kỳ vọng. (Minh nói: \"I'm tired of trying to meet my parents' expectations\").", "on": ["meet = đáp ứng → ✓ meet expectations.", "refuse = từ chối → ✗.", "forget = quên → ✗.", "ignore = phớt lờ → ✗."]}, {"n": 2, "t": "mcq", "stem": "Ann told Minh to talk to his parents about his _______ and abilities.", "opts": ["problems", "interests", " const SEC=Object.fromEntries(DATA.map(s=>[s.id,s]));
const DUP=new Set([26,30,35,36,37,38,39]);
const pool=(id,f)=>SEC[id].items.filter(it=>(!f||f(it))).map(it=>({it,sid:id}));
const P={
  pron:pool('s1'), err:pool('s4'), wf:pool('s3'),
  mcq:pool('s2',it=>!DUP.has(it.n)),
  cloze:[...pool('s10'),...pool('s11'),...pool('s12')], fill:pool('s9')
};
const SETS=[ {sid:'s5',f:null}, {sid:'s6',f:null}, {sid:'s7',f:null}, {sid:'s13',f:it=>it.t==='mcq'} ];
const TFS=[ {sid:'s8',f:null}, {sid:'s13',f:it=>it.t==='tf'} ];
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const take=(a,n,r)=>shuffle(a,r).slice(0,n);
function buildTest(seed){
  const r=rng(seed);
  const lang=[...take(P.pron,3,r),...take(P.err,1,r),...take(P.wf,2,r),...take(P.mcq,12,r)];
  const fill=[...take(P.cloze,6,r),...take(P.fill,2,r)];
  const sets=shuffle(SETS,r).slice(0,2);if(sets[0].sid==='s13')sets.reverse();
  const groups=[];
  sets.forEach((st,i)=>{const items=SEC[st.sid].items.filter(it=>!st.f||st.f(it)).map(it=>({it,sid:st.sid}));groups.push({sid:st.sid,items:take(items,i===0?5:4,r).sort((a,b)=>a.it.n-b.it.n)})});
  const tfs=TFS[Math.floor(r()*TFS.length)];
  const tf={sid:tfs.sid,items:SEC[tfs.sid].items.filter(it=>!tfs.f||tfs.f(it)).map(it=>({it,sid:tfs.sid}))};
  return [
    {title:'Phần 1. Ngôn ngữ: phát âm, từ vựng, ngữ pháp',groups:[{sid:null,items:lang}]},
    {title:'Phần 2. Hoàn thành câu và đoạn văn',groups:[{sid:null,items:fill}]},
    {title:'Phần 3. Đọc hiểu',groups},
    {title:'Phần 4. Đọc và chọn Đúng (T) hoặc Sai (F)',groups:[tf]}
  ];
}
