<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>E8 Unit 5 Festivals in Viet Nam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one 600px column — a lesson path of round nodes (home) and a full-screen lesson with a sticky check bar and a sliding feedback sheet. */
:root{
  --bg:#F5F7F0; --surface:#FFFFFF; --surface-2:#EEF2E6; --line:#D9E0CF; --line-strong:#C3CDB5;
  --fg:#22301F; --muted:#66735E;
  --leaf:#3E9B4F; --leaf-deep:#2C7A3B; --leaf-soft:#E2F2DF;
  --brocade:#3B4CA8; --brocade-soft:#E6E9F8;
  --gold:#E9A52B; --gold-deep:#C2841A; --gold-soft:#FCF0D6;
  --red:#D2453A; --red-deep:#A8332A; --red-soft:#FBE3E0;
  --sky:#2F86C9; --sky-soft:#E1EFFA;
  --display:"Baloo 2", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151B14; --surface:#1E261C; --surface-2:#253023; --line:#33402F; --line-strong:#465641;
  --fg:#E7EEE1; --muted:#A3B09A;
  --leaf:#5CBB6C; --leaf-deep:#3E8F4D; --leaf-soft:#22382A;
  --brocade:#8F9CF0; --brocade-soft:#262B4A;
  --gold:#F0B545; --gold-deep:#B9861F; --gold-soft:#3A3020;
  --red:#EE6A5E; --red-deep:#B94A40; --red-soft:#3E2422;
  --sky:#6BB3EA; --sky-soft:#1E3142; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151B14; --surface:#1E261C; --surface-2:#253023; --line:#33402F; --line-strong:#465641;
  --fg:#E7EEE1; --muted:#A3B09A;
  --leaf:#5CBB6C; --leaf-deep:#3E8F4D; --leaf-soft:#22382A;
  --brocade:#8F9CF0; --brocade-soft:#262B4A;
  --gold:#F0B545; --gold-deep:#B9861F; --gold-soft:#3A3020;
  --red:#EE6A5E; --red-deep:#B94A40; --red-soft:#3E2422;
  --sky:#6BB3EA; --sky-soft:#1E3142; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:22px;height:22px;flex:none}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;color:var(--leaf-deep);margin-right:auto;white-space:nowrap}
:root[data-theme="dark"] .brand{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand{color:var(--leaf)}}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.fire{color:var(--gold-deep)} .stat.gem{color:var(--sky)} .stat.done{color:var(--leaf-deep)}

/* ---------- banner ---------- */
.banner{margin-top:18px;border-radius:var(--r);background:var(--leaf);color:#fff;overflow:hidden;box-shadow:0 4px 0 var(--leaf-deep)}
.banner .inner{padding:16px 18px 14px}
.banner .eyebrow{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.banner h1{font-size:26px;margin-top:2px;color:#fff}
.banner p{margin:4px 0 0;font-weight:600;opacity:.95;font-size:15px}
.brocade{height:14px;background:
  linear-gradient(135deg,transparent 25%,#F2C14E 25% 37%,transparent 37% 63%,#F2C14E 63% 75%,transparent 75%) 0 0/14px 14px,
  linear-gradient(45deg,#D2453A 25%,transparent 25% 75%,#D2453A 75%) 0 0/14px 14px,
  #2B3A8F}
.overall{display:flex;align-items:center;gap:10px;margin-top:12px}
.bar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s}
.overall b{font-variant-numeric:tabular-nums}

/* ---------- path ---------- */
.section{margin-top:28px}
.sec-head{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px dashed var(--line)}
.sec-head .tag{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brocade);background:var(--brocade-soft);border-radius:8px;padding:1px 8px;white-space:nowrap}
.sec-head h2{font-size:20px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 4px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:150px}
.node .disc{width:72px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-deep);transition:transform .1s,box-shadow .1s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--leaf-deep)}
.node .disc svg{width:32px;height:32px}
.node.done .disc{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep)}
.node.next .disc{outline:5px solid var(--leaf-soft);outline-offset:4px}
.node .lbl{font-weight:800;font-size:14px;line-height:1.25;text-align:center}
.node .sub{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:-4px;font-variant-numeric:tabular-nums}
.node .flag{position:absolute;top:-30px;background:var(--surface);border:2px solid var(--line);color:var(--leaf-deep);font-weight:800;font-size:13px;padding:2px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.node .flag::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.nodes .node:nth-child(4n+2){transform:translateX(-70px)}
.nodes .node:nth-child(4n+4){transform:translateX(70px)}
@media (max-width:420px){.nodes .node:nth-child(4n+2){transform:translateX(-50px)}.nodes .node:nth-child(4n+4){transform:translateX(50px)}}
.foot{padding-block:28px 40px;color:var(--muted);font-size:13.5px;text-align:center}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:700}

/* ---------- lesson ---------- */
#lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lhead .wrap{display:flex;align-items:center;gap:14px;padding-block:14px 6px}
.iconbtn{background:none;border:0;padding:4px;color:var(--muted);display:grid;place-items:center;border-radius:10px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.25)}
.hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-variant-numeric:tabular-nums}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lbody .wrap{padding-block:12px 28px;display:flex;flex-direction:column;gap:16px}
.kind{font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--brocade)}
.qtitle{font-family:var(--display);font-size:24px;font-weight:700}
.qtext{font-size:19px;font-weight:700;line-height:1.45}
.qtext .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--line-strong);margin:0 2px}
.basew{display:inline-block;font-weight:800;color:var(--brocade);background:var(--brocade-soft);padding:1px 10px;border-radius:8px;font-size:15px;letter-spacing:.04em}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;font-weight:700;font-size:17px;min-height:54px;transition:background .1s,border-color .1s}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--sky);background:var(--sky-soft)}
.opt.sel .k{border-color:var(--sky);color:var(--sky)}
.opt.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.opt u{text-decoration-thickness:2.5px;text-underline-offset:4px;text-decoration-color:var(--red)}
.opt .say{margin-left:auto;color:var(--sky);display:grid;place-items:center}

.typebox{display:flex;flex-direction:column;gap:8px}
.typebox input{font:inherit;font-size:18px;font-weight:700;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.typebox input:focus{border-color:var(--sky);outline:none}
.typebox input.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.typebox input.bad{border-color:var(--red);background:var(--red-soft)}

/* chips */
.orig{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:17px}
.answer-line{min-height:110px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px 2px;border-bottom:2px solid var(--line);
  background-image:linear-gradient(var(--line) 2px,transparent 2px);background-size:100% 54px;background-position:0 52px}
.pre{font-weight:800;font-size:17px;align-self:center;padding:0 4px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.chip{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 12px;font-weight:700;font-size:16.5px}
.chip.ghost{color:transparent;background:var(--line);border-color:var(--line);pointer-events:none}
.groupnote{font-weight:700;color:var(--brocade);font-size:14px}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{justify-content:center;text-align:center;font-size:16px;padding:10px}
.match .opt.gone{opacity:.35;border-color:var(--line);background:var(--surface-2)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* reading + dictionary + sign */
details.passage{background:var(--surface);border:2px solid var(--line);border-radius:14px}
details.passage summary{cursor:pointer;padding:10px 14px;font-weight:800;color:var(--brocade);list-style:none;display:flex;align-items:center;gap:8px}
details.passage summary::-webkit-details-marker{display:none}
details.passage .ptxt{padding:0 14px 12px;font-size:15.5px;line-height:1.6;max-height:42vh;overflow-y:auto}
.ptxt p{margin:0 0 8px}
.ptxt mark{background:var(--gold-soft);color:var(--fg);border-radius:4px;padding:0 3px;font-weight:800;outline:2px solid var(--gold)}
.ptxt .bl{font-weight:800;color:var(--muted)}
.vitoggle{margin:0 14px 12px;background:var(--surface-2);border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--muted)}
.vitext{padding:0 14px 12px;font-size:14.5px;color:var(--muted);font-style:italic}
.entry{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--brocade);border-radius:14px;padding:12px 14px;font-size:15px}
.entry .hw{font-family:var(--display);font-size:22px;font-weight:800;color:var(--brocade)}
.entry .ipa{color:var(--muted);font-weight:600}
.entry ol{margin:6px 0 0;padding-left:20px}
.entry ul{margin:4px 0 6px;padding-left:16px;color:var(--muted)}
.entry li{margin:2px 0}
.signimg{display:block;max-width:100%;max-height:240px;margin:0 auto;border-radius:12px;border:2px solid var(--line);background:#fff}

.phrase{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:21px;font-weight:700;line-height:1.4}
.phrase b{color:var(--brocade)}
.phrase.vi{font-size:19px;color:var(--fg)}
.saybtn.big{width:48px;height:48px;flex:none;border-radius:14px;background:var(--sky);color:#fff;justify-content:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 70%,#000)}
.saybtn.big svg{width:26px;height:26px}
.opt b{color:var(--brocade)}
.entry b{color:var(--fg)}
.entry ul b{color:var(--brocade)}
.exsay{vertical-align:middle;opacity:.8}
.exsay svg{width:18px;height:18px}
.writebox{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.writebox:focus-within{border-color:var(--sky)}
.writebox textarea{font:inherit;font-size:18px;font-weight:700;border:0;background:transparent;color:var(--fg);resize:none;width:100%;padding:0;line-height:1.45}
.writebox textarea:focus{outline:none}
.writebox textarea.ok{color:var(--leaf-deep)}
.writebox textarea.bad{color:var(--red)}
.writebox .pre{padding:0;color:var(--brocade)}
.writetip{font-size:13.5px;color:var(--muted);font-weight:600}
.orig .saybtn{vertical-align:middle}
.fb .full s{color:var(--red);text-decoration-thickness:2px}
.fb .full .yours{font-weight:600;color:var(--muted)}
.fb .full .rightans b{color:var(--leaf-deep);background:var(--leaf-soft);border-radius:4px;padding:0 2px;text-decoration:none}
/* bottom bar + feedback */
.lfoot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s,border-color .2s}
.lfoot .wrap{display:flex;gap:12px;align-items:center;padding-block:14px}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-deep)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-strong);cursor:default;transform:none}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-deep)}
.btn.ghost{background:var(--surface);color:var(--muted);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{flex:1}
.fb{display:none;flex-direction:column;gap:6px;flex:1;min-width:0}
.lfoot.ok{background:var(--leaf-soft);border-color:transparent}
.lfoot.bad{background:var(--red-soft);border-color:transparent}
.lfoot.ok .fb,.lfoot.bad .fb{display:flex}
.lfoot.ok .wrap,.lfoot.bad .wrap{flex-direction:column;align-items:stretch}
.fb h3{font-size:22px;display:flex;align-items:center;gap:8px}
.lfoot.ok h3{color:var(--leaf-deep)} .lfoot.bad h3{color:var(--red)}
:root[data-theme="dark"] .lfoot.ok h3{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lfoot.ok h3{color:var(--leaf)}}
.fb .full{font-weight:700;font-size:16px}
.fb .full b{color:var(--red);text-decoration:underline;text-underline-offset:3px}
.lfoot.ok .fb .full b{color:var(--leaf-deep)}
.fb .row{font-size:14.5px;line-height:1.45}
.fb .row strong{font-weight:800}
.fb .row.vi{font-style:italic;color:var(--muted)}
.fb .row.fx{color:var(--brocade);font-weight:700}
.fb .more{max-height:30vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.hintbox{background:var(--sky-soft);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;color:var(--fg)}
.hintbox strong{color:var(--sky)}
.saybtn{background:none;border:0;color:var(--sky);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:0}

/* results */
.result{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:28px}
.result h2{font-size:30px;color:var(--gold-deep)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--gold);border-radius:14px;overflow:hidden}
.tile .t{background:var(--gold);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px}
.tile .v{font-family:var(--display);font-size:24px;font-weight:800;padding:8px 4px;font-variant-numeric:tabular-nums}
.tile.g{border-color:var(--leaf)} .tile.g .t{background:var(--leaf)}
.tile.b{border-color:var(--sky)} .tile.b .t{background:var(--sky)}
.mist{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.mist h3{font-size:18px}
.mist .m{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.mist .m b{color:var(--red)}
.trophy{width:96px;height:96px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="home">
  <div class="top"><div class="wrap">
    <span class="brand">E8 · Unit 5</span>
    <span class="stat fire" title="Chuỗi ngày học"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5-1.5 5-1.5 7.5 0 1.4 1 2.5 2.3 2.5 1.5 0 2.2-1.2 2.2-2.6 2.3 1.6 3.5 4 3.5 6.3C18.5 19.6 15.6 22 12 22s-6.5-2.4-6.5-6.3C5.5 10.4 10 7.5 12 2z"/></svg><span id="sStreak">0</span></span>
    <span class="stat gem" title="Tổng XP"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10l4 6-9 12L3 9z"/></svg><span id="sXp">0</span></span>
    <span class="stat done" title="Bài đã hoàn thành"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6.3 6.9.9-5 4.8 1.3 6.8L12 17.6 5.8 20.8 7.1 14 2.1 9.2 9 8.3z"/></svg><span id="sDone">0</span></span>
  </div></div>
  <div class="wrap">
    <div class="banner">
      <div class="inner">
        <div class="eyebrow">Tiếng Anh 8 · Global Success</div>
        <h1>Unit 5 – Festivals in Viet Nam</h1>
        <p>Học từng bài nhỏ: chọn đáp án, nghe, sắp xếp từ. Sai thì xem công thức và làm lại.</p>
        <div class="overall"><div class="bar"><i id="ovBar" style="width:0"></i></div><b id="ovTxt">0/0</b></div>
      </div>
      <div class="brocade" aria-hidden="true"></div>
    </div>
    <div id="path"></div>
    <div class="foot">Tiến độ được lưu trên trình duyệt của máy này. <button id="resetBtn" type="button">Xóa tiến độ</button><span id="resetAsk" hidden> · Chắc chắn? <button id="resetYes" type="button">Xóa</button> <button id="resetNo" type="button">Không</button></span></div>
  </div>
</div>

<div id="lesson" hidden>
  <div class="lhead"><div class="wrap">
    <button class="iconbtn" id="quitBtn" type="button" aria-label="Thoát bài"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

social", "socialability", "society", "socialable"], "a": 0, "hint": "social (adj) + N", "full": "Linda fell in love with Peter without knowing about his real [[social]] status.", "vi": "địa vị xã hội thật sự", "f": "social (adj) + N", "e": "his real social status: tính từ social đứng trước danh từ status = địa vị xã hội."}, {"t": "mc", "n": 20, "q": "Tet's _____ is the longest holiday which may last up to seven to nine days.", "o": ["celebration", "celebratory", "celebrated", "celebrate"], "a": 0, "hint": "'s + N", "full": "Tet's [[celebration]] is the longest holiday which may last up to seven to nine days.", "vi": "lễ đón Tết", "f": "'s + N", "e": "Tet’s + danh từ: celebration (lễ đón Tết). celebratory là tính từ, celebrate là động từ."}], "art": [{"t": "mc", "n": 21, "q": "Thank you. That was _____ very nice lunch.", "o": ["the", "a", "an", "Ø"], "a": 1, "hint": "a + adj + bữa ăn", "full": "Thank you. That was [[a]] very nice lunch.", "vi": "bữa trưa rất ngon", "f": "a + adj + bữa ăn", "e": "Có tính từ “very nice” trước bữa ăn → dùng a (a very nice lunch)."}, {"t": "mc", "n": 22, "q": "He majors in _____ English.", "o": ["a", "Ø", "the", "an"], "a": 1, "hint": "môn học, ngôn ngữ: Ø", "full": "He majors in [[Ø]] English.", "vi": "chuyên ngành tiếng Anh", "f": "môn học, ngôn ngữ: Ø", "e": "major in + môn học / ngôn ngữ → không dùng mạo từ (Ø)."}, {"t": "mc", "n": 23, "q": "We often watch _____ television.", "o": ["a", "an", "the", "Ø"], "a": 3, "hint": "watch television: Ø", "full": "We often watch [[Ø]] television.", "vi": "chúng tôi hay xem tivi", "f": "watch television: Ø", "e": "watch television (nghĩa chung) → Ø."}, {"t": "mc", "n": 24, "q": "My aunt has _____ interesting novel.", "o": ["an", "Ø", "the", "a"], "a": 0, "hint": "an + âm nguyên âm", "full": "My aunt has [[an]] interesting novel.", "vi": "một cuốn tiểu thuyết hay", "f": "an + âm nguyên âm", "e": "interesting bắt đầu bằng nguyên âm /ɪ/ → an."}, {"t": "mc", "n": 25, "q": "_____ used razor blade is useless.", "o": ["The", "A", "Ø", "An"], "a": 1, "hint": "used đọc /juː/ → a", "full": "[[A]] used razor blade is useless.", "vi": "lưỡi dao cạo đã dùng", "f": "used đọc /juː/ → a", "e": "used đọc /juːzd/ (phụ âm /j/) → A (viết hoa vì đầu câu)."}, {"t": "mc", "n": 26, "q": "We had _____ meal in a restaurant.", "o": ["the", "an", "Ø", "a"], "a": 3, "hint": "a meal", "full": "We had [[a]] meal in a restaurant.", "vi": "ăn một bữa ở nhà hàng", "f": "a meal", "e": "a meal: danh từ đếm được, nhắc lần đầu → a."}, {"t": "mc", "n": 27, "q": "Can you turn off _____ television, please?", "o": ["the", "a", "an", "Ø"], "a": 0, "hint": "cái tivi cụ thể: the", "full": "Can you turn off [[the]] television, please?", "vi": "tắt cái tivi đi", "f": "cái tivi cụ thể: the", "e": "Cái tivi cụ thể trong phòng → the."}, {"t": "mc", "n": 28, "q": "He tried to park his car but _____ space wasn't big enough.", "o": ["the", "Ø", "a", "an"], "a": 0, "hint": "đã xác định → the", "full": "He tried to park his car but [[the]] space wasn't big enough.", "vi": "chỗ trống (đã xác định)", "f": "đã xác định → the", "e": "Chỗ đậu xe đã được xác định → the space."}, {"t": "mc", "n": 29, "q": "We live at _____ third house from the church.", "o": ["Ø", "an", "a", "the"], "a": 3, "hint": "the + số thứ tự", "full": "We live at [[the]] third house from the church.", "vi": "ngôi nhà thứ ba", "f": "the + số thứ tự", "e": "Có số thứ tự “third” → the."}, {"t": "mc", "n": 30, "q": "Where can _____ people buy everything they need?", "o": ["Ø", "a", "an", "the"], "a": 0, "hint": "N số nhiều chung chung: Ø", "full": "Where can [[Ø]] people buy everything they need?", "vi": "người ta (nói chung)", "f": "N số nhiều chung chung: Ø", "e": "people số nhiều, nói chung → Ø."}], "tr": [{"t": "chips", "n": 1, "org": "There's a tradition that English people drink a lot of tea.", "pre": "English people follow the tradition of", "ans": ["drinking", "a", "lot", "of", "tea."], "dis": [], "hint": "S + follow the tradition of + V-in ects mean <b>cutting the relationship</b>", "vi": "vật sắc = cắt đứt quan hệ", "note": "bài D – câu 3: T"}, {"en": "<b>leave the option</b> to them", "vi": "để họ tự quyết (mở hay không)", "note": "bài D – câu 4: F; câu 6: D"}], "tr": [{"en": "English people follow the tradition of <b>drinking a lot of tea.</b>", "vi": "người Anh theo truyền thống uống nhiều trà", "note": "S + follow the tradition of + V-ing"}, {"en": "Last year we broke with tradition by <b>going to Thailand on Tet holiday.</b>", "vi": "phá lệ đi Thái Lan dịp Tết", "note": "S + broke with tradition by + V-ing"}, {"en": "In Viet Nam there is a custom of <b>worshipping ancestors.</b>", "vi": "ở Việt Nam có phong tục thờ cúng tổ tiên", "note": "There is a custom of + V-ing (In + nơi chốn)"}, {"en": "Vietnamese parents have the custom of <b>celebrating their baby's first month.</b>", "vi": "phong tục làm lễ đầy tháng cho con", "note": "sb + have the custom of + V-ing"}, {"en": "Vietnamese people have a tradition of <b>celebrating the Mid-Autumn Festival every year.</b>", "vi": "truyền thống đón Trung thu hằng năm", "note": "S + have / has a tradition of + V-ing"}, {"en": "People organize <b>the Ok Om Bok Festival in October.</b>", "vi": "người ta tổ chức lễ Ok Om Bok vào tháng 10", "note": "People + organize / hold + S + thời gian"}, {"en": "We should <b>hand bowls with both hands.</b>", "vi": "nên đưa bát bằng hai tay", "note": "S + should + V"}, {"en": "We had better <b>wait for the host to start eating.</b>", "vi": "nên chờ chủ nhà bắt đầu ăn", "note": "S + had better + V"}, {"en": "We shouldn't <b>sweep the floor on the first three days of Tet.</b>", "vi": "không nên quét nhà ba ngày Tết", "note": "S + shouldn't + V"}, {"en": "We had better not <b>use bad words in conversations with others, especially with older people.</b>", "vi": "không nên nói tục, nhất là với người lớn", "note": "S + had better not + V"}, {"en": "Traditionally, <b>taking care of the family is considered women's duty in many Eastern countries.</b>", "vi": "theo truyền thống, chăm sóc gia đình là việc của phụ nữ", "note": "Traditionally, + S + be + V3"}, {"en": "We can maintain our traditions by <b>organising the festivals.</b>", "vi": "duy trì truyền thống bằng cách tổ chức lễ hội", "note": "S + can + V + by + V-ing"}], "sign": [{"en": "<b>WET FLOOR</b> – walk carefully", "vi": "sàn ướt, đi cẩn thận kẻo trượt", "note": "CAUTION / WET FLOOR (1)"}, {"en": "<b>move around</b> the traffic circle", "vi": "đi vòng quanh vòng xuyến", "note": "biển tròn có mũi tên vòng (2)"}, {"en": "<b>be cautious</b> – there is a dog here", "vi": "cẩn thận, có chó dữ", "note": "DANGER / BEWARE OF DOG (3)"}, {"en": "Hand protection is <b>mandatory</b>", "vi": "bắt buộc bảo vệ tay (đeo găng)", "note": "WEAR GLOVES – biển xanh = bắt buộc (4)"}, {"en": "can't <b>bring any sharp objects</b> on the plane", "vi": "không mang vật sắc nhọn lên máy bay", "note": "dao bị gạch chéo (5)"}], "dict": [{"en": "Vietnamese people <b>follow the custom of</b> visiting relatives", "vi": "theo phong tục đi thăm họ hàng", "note": "follow the custom of + V-ing"}, {"en": "<b>It is the custom</b> here for the bride to wear a red ao dai", "vi": "ở đây có phong tục cô dâu mặc áo dài đỏ", "note": "It is the custom (for sb) to V"}, {"en": "Nam is <b>carrying on the family tradition</b> of making Chung cakes", "vi": "tiếp nối truyền thống gia đình gói bánh chưng", "note": "carry on the (family) tradition of + V-ing"}, {"en": "our class decided to <b>break with tradition</b>", "vi": "phá lệ, làm khác truyền thống", "note": "break with tradition"}], "gart": [{"en": "a cat, a house, a uniform, a university, a one-dollar bill", "vi": "Trước từ bắt đầu bằng phụ âm, hoặc nguyên âm đọc là /j/ (u trong uniform), /w/ (one)", "note": "a"}, {"en": "an elephant, an idea, an orange, an hour, an MD /em-diː/", "vi": "Trước từ bắt đầu bằng nguyên âm (a, e, i, o, u) hoặc h câm (hour, honest)", "note": "an"}, {"en": "He is <b>a</b> doctor. · She is <b>an</b> engineer.", "vi": "Chỉ nghề nghiệp", "note": "Chỉ nghề nghiệp"}, {"en": "What <b>a</b> lovely day! · What <b>an</b> interesting festival!", "vi": "Câu cảm thán (N số ít đếm được)", "note": "Câu cảm thán (N số ít đếm được)"}, {"en": "50 miles <b>an</b> hour · twice <b>a</b> week · once <b>a</b> month", "vi": "Giá, tốc độ, tần suất", "note": "Giá, tốc độ, tần suất"}, {"en": "the Sun, the Moon, the President of Viet Nam", "vi": "Vật duy nhất (trên thế giới / trong bối cảnh)", "note": "Vật duy nhất (trên thế giới / trong bối cảnh)"}, {"en": "I bought a book. <b>The</b> book is about history.", "vi": "Danh từ đã được nhắc đến trước đó", "note": "Danh từ đã được nhắc đến trước đó"}, {"en": "the best student, the only way, the third house", "vi": "Trước so sánh nhất và số thứ tự (first, second, only, last)", "note": "Trước so sánh nhất và số thứ tự (first, second, only, last)"}, {"en": "the whale (loài cá voi), the invention of the telephone", "vi": "Chỉ một loài / một nhóm chung", "note": "Chỉ một loài / một nhóm chung"}, {"en": "the poor (người nghèo), the old, the unemployed", "vi": "the + adj chỉ một nhóm người", "note": "the + adj chỉ một nhóm người"}, {"en": "the Mekong River, the Pacific Ocean, the Himalayas", "vi": "Tên sông, biển, đại dương, dãy núi, quần đảo, sa mạc", "note": "Tên sông, biển, đại dương, dãy núi, quần đảo, sa mạc"}, {"en": "the United States, the Netherlands, the United Kingdom", "vi": "Tên nước số nhiều hoặc có Republic, Kingdom, States", "note": "Tên nước số nhiều hoặc có Republic, Kingdom, States"}, {"en": "play the piano, play the violin", "vi": "Tên nhạc cụ (khi chơi)", "note": "Tên nhạc cụ (khi chơi)"}, {"en": "Ø Water is necessary for life. · Ø Cats are popular pets.", "vi": "N số nhiều và N không đếm được dùng theo nghĩa chung", "note": "N số nhiều và N không đếm được dùng theo nghĩa chung"}, {"en": "Ø Paris is beautiful. · Ø Mount Everest is high.", "vi": "Tên riêng (người, nước, châu lục, thành phố, hồ, núi, đường, công viên)", "note": "Tên riêng (người, nước, châu lục, thành phố, hồ, núi, đường, công viên)"}, {"en": "We have Ø breakfast at 7. (Nhưng: <b>a</b> big breakfast)", "vi": "Tên bữa ăn (nói chung)", "note": "Tên bữa ăn (nói chung)"}, {"en": "go Ø by bus, communicate Ø by email", "vi": "by + phương tiện đi lại, liên lạc", "note": "by + phương tiện đi lại, liên lạc"}, {"en": "go to Ø school, be in Ø hospital, go to Ø church", "vi": "Địa điểm công cộng dùng đúng mục đích chính", "note": "Địa điểm công cộng dùng đúng mục đích chính"}, {"en": "Ø Summer is my favourite season. · major in Ø English", "vi": "Mùa, tháng, ngày (nói chung); môn học; watch TV", "note": "Mùa, tháng, ngày (nói chung); môn học; watch TV"}, {"en": "go to Ø school (đi học), go to Ø bed (đi ngủ)", "vi": "Đến đó vì mục đích chính của nơi đó", "note": "go to Ø + nơi chốn"}, {"en": "go to the school (đến thăm trường), go to the bed (đến chỗ cái giường)", "vi": "Đến đó vì việc khác, chỉ là một địa điểm", "note": "go to the + nơi chốn"}, {"en": "full of <b>festivity</b> · their <b>acceptance</b> · with great <b>admiration</b>", "vi": "danh từ", "note": "sau a / an / the / tính từ sở hữu (my, their...); sau giới từ (of, with)"}, {"en": "a <b>traditional</b> dish · The custom is <b>contestable</b>.", "vi": "tính từ", "note": "trước danh từ; sau be (is, was, are)"}, {"en": "talk <b>respectfully</b> · were hung <b>decoratively</b>", "vi": "trạng từ (-ly)", "note": "sau động từ thường; bổ nghĩa cho động từ"}, {"en": "to <b>maintain</b> the customs · to <b>socialize</b>", "vi": "động từ", "note": "sau to / should / can (động từ nguyên mẫu)"}, {"en": "I felt <b>obliged</b> to help.", "vi": "tính từ", "note": "sau feel / look / seem (cảm xúc, trạng thái)"}], "gcus": [{"en": "We have a tradition of making Chung cakes.", "vi": "có truyền thống làm gì", "note": "S + have / has + a tradition of + V-ing"}, {"en": "Nam is carrying on the family tradition of growing kumquats.", "vi": "theo / tiếp nối truyền thống", "note": "S + follow / carry on the tradition of + V-ing"}, {"en": "They broke with tradition by going abroad at Tet.", "vi": "phá vỡ truyền thống", "note": "S + break with tradition (by + V-ing)"}, {"en": "It is the custom for children to wear new clothes.", "vi": "có phong tục làm gì", "note": "It is the custom (for sb) to V"}, {"en": "In Viet Nam there is a custom of worshipping ancestors.", "vi": "có phong tục làm gì", "note": "S + have the / a custom of + V-ing · There is a custom of + V-ing"}, {"en": "You had better not sweep the floor on the first day of Tet.", "vi": "nên / không nên", "note": "S + should / shouldn't + V · S + had better (not) + V"}, {"en": "Traditionally, women take care of the family.", "vi": "theo truyền thống", "note": "Traditionally, + S + V"}, {"en": "People hold the festival in spring.", "vi": "chuyển sang chủ ngữ People", "note": "S + take place → People + hold / organise / celebrate + O"}]}, "passages": {"A": ["Tet Food", "Tet is the biggest festival in Viet Nam. To (1)______ Tet, Vietnamese people make many tasty (2)______ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; (3)______, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult (4)______, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be (5)______ immediately after they are cooked, so they are often made (6)______ home."], "B": ["Wedding Traditions around the World", "A lovely custom from France comes in the form of a two-handled cup called the “coupe de mariage”. The cup was saved to be used from one (1)______ to another. Of course, (2)______ custom has long been established of drinking a toast to one another, but the two-handled cup adds a special touch to the weddings of today. Until recently, these cups (3)______ very difficult to find. Drinking from the same cup denotes “togetherness”.", "At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old (4)______ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used (5)______ the unity candle at the end of the ceremony.", "Flowers have always played a very (6)______ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."], "C": ["Something Old, Something New", "Although there are various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: “Something old, something new, something borrowed, something blue.”", "A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewellery. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed, such as a friend's handkerchief or a married friend's bridal veil, means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue colour or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."], "D": ["Gift-giving Customs in Viet Nam", "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture.", "First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam to exchange small gifts on certain occasions such as anniversaries, Tet holidays… to express respect, love, appreciation, or gratitude.", "Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner, you should give the gift on a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with all the office employees.", "Do not wrap a gift in black paper because this colour is unlucky and associated with funerals in Viet Nam. Gifts that symbolise cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship.", "Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."]}, "passVi": {"A": "Món ăn ngày Tết\nTết là lễ hội lớn nhất ở Việt Nam. Để đón Tết, người Việt làm nhiều món ăn truyền thống ngon. Các món quan trọng nhất gồm bánh chưng, giò chả, gà luộc, nem rán và xôi. Bánh chưng làm từ gạo nếp, thịt lợn, đậu xanh và các gia vị khác, gói trong lá xanh; vì vậy món bánh này cần rất nhiều công chuẩn bị. Bánh có thể để được lâu dù thời tiết dịp Tết thường ẩm. Những món quan trọng khác không thể thiếu khi thờ cúng tổ tiên là giò chả, nem rán và xôi. Vì giò chả khó làm nên mọi người thường mua của các nhà cung cấp nổi tiếng. Tuy nhiên, xôi và nem rán dễ chuẩn bị hơn và phải được dọn ra ngay sau khi nấu, nên thường được làm ở nhà.", "B": "Phong tục cưới hỏi trên thế giới\nMột phong tục đáng yêu của Pháp là chiếc cốc hai quai gọi là “coupe de mariage”. Chiếc cốc được giữ lại để dùng từ thế hệ này sang thế hệ khác. Dĩ nhiên, phong tục nâng ly chúc mừng nhau có từ lâu đời, nhưng chiếc cốc hai quai thêm nét đặc biệt cho đám cưới ngày nay. Cho đến gần đây, những chiếc cốc này rất khó tìm. Uống chung một cốc biểu thị sự gắn bó.\nỞ đám cưới tại Đức, cô dâu chú rể cầm nến trang trí hoa và ruy băng. Truyền thống cổ đẹp này có thể đưa vào đám cưới hiện đại, khi cặp đôi đặt những cây nến đã cầm lên bàn thờ cạnh nến đoàn kết. Những cây nến ấy có thể dùng để thắp nến đoàn kết vào cuối buổi lễ.\nHoa luôn đóng vai trò rất quan trọng trong đám cưới Ấn Độ. Một truyền thống lâu đời là em trai của chú rể rắc cánh hoa lên đầu cặp đôi sau lời thề và vào cuối buổi lễ.", "C": "Đồ cũ, đồ mới\nDù đám cưới ở Mỹ có nhiều phong cách, hầu hết vẫn theo một số truyền thống nhất định. Một trong số đó là câu nói xưa có từ nước Anh thế kỷ 19 về những thứ cô dâu nên mặc hoặc mang: “Một thứ cũ, một thứ mới, một thứ mượn, một thứ màu xanh.”\nCô dâu mặc đồ cũ để nhớ về gia đình và quá khứ. Một số cô dâu mặc váy cưới hoặc đeo trang sức của mẹ. Đồ mới nghĩa là may mắn và hy vọng về tương lai hạnh phúc bên chồng. Món này có thể là chiếc váy, nhưng thường là đôi giày mới. Đồ mượn, như khăn tay của bạn hay khăn voan của một người bạn đã kết hôn, nghĩa là cô dâu có bạn bè và gia đình sẵn lòng giúp đỡ. Đồ màu xanh là biểu tượng của sự tin tưởng và chung thủy giữa đôi vợ chồng. Ngày nay, một số cô dâu sáng tạo với món này bằng cách sơn móng tay màu xanh nhạt hoặc đeo nịt tất ở chân. Một truyền thống khác là chú rể lấy nịt tất sau buổi lễ và ném cho các chàng trai độc thân. Người bắt được sẽ là người kết hôn tiếp theo.", "D": "Phong tục tặng quà ở Việt Nam\nTặng quà quan trọng ở Việt Nam vì các mối quan hệ giữa người với người có vai trò lớn trong văn hóa Việt.\nTrước hết, đừng khuyến khích tham nhũng. Có ranh giới rõ ràng giữa tặng quà và hối lộ. Tuy nhiên, ở Việt Nam việc trao nhau những món quà nhỏ vào các dịp như kỷ niệm, Tết… để bày tỏ sự tôn trọng, yêu mến, cảm kích hay biết ơn là phổ biến.\nPhong tục tặng quà tùy theo hoàn cảnh. Nếu là quà riêng cho một đối tác người Việt, nên tặng vào dịp riêng tư. Nếu có quà cho cả văn phòng hoặc công ty, nên tặng sau cuộc họp với toàn thể nhân viên.\nĐừng gói quà bằng giấy đen vì màu này xui xẻo và gắn với đám tang ở Việt Nam. Nên tránh quà mang ý nghĩa cắt như kéo, dao và các vật sắc nhọn vì chúng tượng trưng cho việc cắt đứt quan hệ.\nNgười Việt có thể mở hoặc không mở quà khi nhận; hãy để họ tự quyết. Bạn cũng sẽ nhận quà và nên nghe theo chủ nhà xem có mở ngay hay không. Dù mở lúc nào hay quà gì, lời cảm ơn rối rít luôn phù hợp."}, "entries": {"custom": {"head": "custom", "ipa": "/ˈkʌstəm/", "pos": "noun", "senses": [{"def": "an accepted way of behaving or of doing things in a society or a community", "bolddef": true, "ex": ["They still **follow the custom of** pinning money to the bride’s dress.", "**It is the custom** here to put flowers on the graves at Easter.", "**the custom of** giving presents at Christmas", "In Viet Nam **there is a custom of** worshipping ancestors.", "In Maori culture, **it’s customary** for people to press their noses when greeting."]}]}, "tradition": {"head": "tradition", "ipa": "/trəˈdɪʃn/", "pos": "noun", "senses": [{"def": "a belief, custom or way of doing something that has existed for a long time among a particular group of people", "bolddef": true, "ex": ["This region is **steeped in tradition**.", "He is **carrying on the family tradition** of public service.", "They **broke with tradition** and got married quietly.", "We can **maintain our traditions** by organising festivals.", "**According to tradition**, people eat banh chung at Tet."]}]}}};

let AC = null;
function tone(ok) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, AC.currentTime + i * 0.11);
      g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.06, AC.currentTime + i * 0.11 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + i * 0.11 + 0.16);
      o.connect(g).connect(AC.destination); o.start(AC.currentTime + i * 0.11); o.stop(AC.currentTime + i * 0.11 + 0.18);
    });
  } catch (e) {}
}
const canSpeak = 'speechSynthesis' in window;
let VOICE = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
if (canSpeak) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
function speak(text, auto) {
  if (!canSpeak || !text) return;
  if (auto && S.autoRead === false) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/_+/g, ' blank '));
    u.lang = 'en-GB'; u.rate = 0.9;
    if (!VOICE) pickVoice();
    if (VOICE) { u.voice = VOICE; u.lang = VOICE.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}

let L = null; // current lesson state
function buildQueue(lesson) {
  if (lesson.kind === 'match') {
    const w = shuffle(lesson.words), rounds = [];
    for (let i = 0; i < w.length; i += 4) rounds.push({ t:'match', words:w.slice(i, i + 4).length < 3 && rounds.length ? w.slice(i - 2, i + 4) : w.slice(i, i + 4) });
    return rounds;
  }
  if (lesson.phr) {
    const set = DATA.phr[lesson.phr];
    const pick = shuffle(set).slice(0, lesson.take || set.length);
    return pick.map((it, k) => {
      const vi2en = k % 3 === 2;                      // 1/3 số câu hỏi ngược: nghĩa → cụm tiếng Anh
      const field = vi2en ? 'en' : 'vi';
      const wrong = shuffle(set.filter(x => stripB(x.en) !== stripB(it.en) && stripB(x.vi) !== stripB(it.vi))).filter((x, i, a) => a.findIndex(y => stripB(y[field]) === stripB(x[field])) === i).slice(0, 3);
      const o = shuffle([it].concat(wrong));
      return { t:'mc', kind:'phr', dir: vi2en ? 'vi2en' : 'en2vi', item:it, q: vi2en ? it.vi : it.en,
        o: o.map(x => x[field]), a: o.indexOf(it), full: it.en.replace(/<b>/g, '[[').replace(/<\/b>/g, ']]'),
        vi: it.vi, f: it.note ? 'Ghi nhớ: ' + it.note : '', e: '' };
    });
  }
  if (lesson.mix) {
    const pool = ['voc','art','wf','tr','pron','stress','readA','readB','readC','readD','sign','dict'].flatMap(k => I[k]);
    return shuffle(pool).slice(0, 20);
  }
  return lesson.items.slice();
}
function startLesson(lesson) {
  const q = buildQueue(lesson);
  L = { lesson, queue:q, total:q.length, pos:0, correct:0, hearts:5, firstTry:0, wrongSet:new Set(), mistakes:[], start:Date.now(), state:'answer', cur:null, answer:null };
  $('#home').hidden = true; $('#lesson').hidden = false;
  nextQ();
}
function quit() { L = null; $('#lesson').hidden = true; $('#home').hidden = false; if (canSpeak) speechSynthesis.cancel(); renderHome(); window.scrollTo(0, 0); }
$('#quitBtn').onclick = quit;
function drawAuto() {
  const on = S.autoRead !== false, b = $('#autoBtn');
  b.setAttribute('aria-pressed', on); b.title = on ? 'Đang bật tự đọc – chạm để tắt' : 'Đang tắt tự đọc – chạm để bật';
  b.style.color = on ? 'var(--sky)' : 'var(--muted)';
  b.innerHTML = on ? ICON.speak : '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>';
}
$('#autoBtn').onclick = () => { S.autoRead = S.autoRead === false; save(); drawAuto(); if (S.autoRead) speak('Auto read on'); };
drawAuto();
document.addEventListener('click', e => { const b = e.target.closest('.exsay'); if (b) speak(b.dataset.say); });

function setProgress() { $('#pFill').style.width = (L.correct / L.total * 100) + '%'; $('#hCount').textContent = L.hearts; }
function resetFoot() {
  const f = $('#lfoot'); f.className = 'lfoot'; $('#fb').innerHTML = '';
  $('#btnRow').innerHTML = '<button class="btn ghost" id="hintBtn" type="button">Gợi ý</button><button class="btn wide" id="checkBtn" type="button" disabled>Kiểm tra</button>';
  $('#checkBtn').onclick = check; $('#hintBtn').onclick = showHint;
}
function nextQ() {
  if (L.pos >= L.queue.length) return finish();
  L.cur = L.queue[L.pos]; L.answer = null; L.state = 'answer'; L.hinted = false;
  resetFoot(); setProgress(); render(L.cur);
  $('#lbody').scrollTop = 0;
}
function ready(v) { L.answer = v; $('#checkBtn').disabled = v == null || v === '' || (Array.isArray(v) && !v.length); }

/* renderers */
function headHtml(q) {
  const k = q.t === 'chips' ? 'chips' : q.t === 'type' ? 'type' : (q.kind || 'mc');
  return `<div class="kind">${KINDLBL[k]}${q.n != null ? ' · Câu ' + q.n : ''}</div>`;
}
function passageHtml(letter, n) {
  const paras = DATA.passages[letter];
  const body = paras.map((p, i) => i === 0 ? `<p><strong>${esc(p)}</strong></p>` :
    `<p>${esc(p).replace(/\((\d)\)_+/g, (m, d) => +d === n ? `<mark>(${d}) _____</mark>` : `<span class="bl">(${d}) _____</span>`)}</p>`).join('');
  const vi = (DATA.passVi[letter] || '').split('\n').map(t => `<p>${esc(t)}</p>`).join('');
  return `<details class="passage" open><summary>${ICON.read.replace('<svg', '<svg class="i"')} Bài đọc ${letter}</summary>
    <div class="ptxt">${body}</div>${DATA.passVi[letter] ? `<button class="vitoggle" type="button" id="viT">Xem bản dịch</button><div class="vitext" id="viX" hidden>${vi}</div>` : ''}</details>`;
}
function entryHtml(key) {
  const e = DATA.entries[key];
  return `<div class="entry"><span class="hw">${esc(e.head)}</span> <span class="ipa">${esc(e.ipa)} · ${esc(e.pos)}</span>
    <ol>${e.senses.map(s => `<li>${s.bolddef ? '<b>' + esc(s.def) + '</b>' : esc(s.def)}<ul>${s.ex.map(x => `<li>${richB(x)} <button class="saybtn exsay" type="button" data-say="${esc(stripB(x.replace(/\*\*/g, '')))}" aria-label="Nghe ví dụ">${ICON.speak}</button></li>`).join('')}</ul></li>`).join('')}</ol></div>`;
}
function render(q) {
  const st = $('#stage');
  if (q.t === 'match') return renderMatch(q);
  $('#hintBtn').hidden = !q.hint;
  if (q.t === 'mc') {
    let top = headHtml(q), title = '';
    if (q.passage) top += passageHtml(q.passage, q.kind === 'cloze' ? q.n : 0);
    if (q.kind === 'sign') top += `<img class="signimg" src="${q.img}" alt="Biển báo câu ${q.n}">`;
    if (q.kind === 'phr') title = q.dir === 'en2vi'
      ? `<div class="qtitle">Cụm từ này nghĩa là gì?</div><div class="phrase"><button class="saybtn big" type="button" id="sayQ" aria-label="Nghe">${ICON.speak}</button><span>${richB(q.q)}</span></div>`
      : `<div class="qtitle">Chọn cụm tiếng Anh đúng nghĩa</div><div class="phrase vi"><span>${esc(q.q)}</span></div>`;
    else if (q.kind === 'pron' || q.kind === 'stress') title = `<div class="qtitle">${esc(q.q)}</div>`;
    else if (q.kind === 'tf') title = `<div class="qtitle">True hay False?</div><div class="qtext">${esc(q.q)}</div>`;
    else title = `<div class="qtext">${esc(q.q).replace(/_{3,}/g, '<span class="gap"></span>')}</div>`;
    const sayable = !(q.kind === 'phr' && q.dir === 'en2vi');   // đáp án tiếng Anh → tự đọc khi chọn
    const opts = q.o.map((o, i) => `<button class="opt" data-i="${i}" type="button"><span class="k">${q.kind === 'tf' ? (i ? 'F' : 'T') : 'ABCD'[i]}</span><span>${q.kind === 'pron' ? o.replace(/<(?!\/?u>)/g, '&lt;') : q.kind === 'phr' ? richB(o) : esc(o)}</span>${sayable && !VN.test(stripB(o)) ? `<span class="say" aria-hidden="true">${ICON.speak}</span>` : ''}</button>`).join('');
    st.innerHTML = top + title + `<div class="opts ${q.kind === 'tf' ? 'two' : ''}" id="opts">${opts}</div>`;
    st.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (L.state !== 'answer') return;
      st.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); ready(+b.dataset.i);
      const said = stripB(q.o[+b.dataset.i]).replace(/<\/?u>/g, '');
      if (sayable && !VN.test(said)) speak(said, true);
    });
    const sq = $('#sayQ'); if (sq) { sq.onclick = () => speak(stripB(q.q)); speak(stripB(q.q), true); }
  } else if (q.t === 'type') {
    const top = headHtml(q) + (q.entry ? entryHtml(q.entry) : '');
    st.innerHTML = top + `<div class="qtitle">${q.base ? 'Viết dạng đúng của từ' : 'Điền cụm từ đúng (xem từ điển)'}</div>
      ${q.base ? `<div><span class="basew">${esc(q.base)}</span></div>` : ''}
      <div class="qtext">${esc(q.q).replace(/_{3,}/g, '<span class="gap"></span>')}</div>
      <div class="typebox"><input id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời…"></div>`;
    const inp = $('#typeIn'); inp.oninput = () => ready(inp.value.trim()); inp.focus({ preventScroll:true });
  } else if (q.t === 'chips') {
    st.innerHTML = headHtml(q) + `<div class="qtitle">Viết lại câu, nghĩa không đổi</div>
      ${q.group ? `<div class="groupnote">${esc(q.group)}: ${esc(q.hint)}</div>` : ''}
      <div class="orig">${esc(q.org)} <button class="saybtn" type="button" id="sayOrg" aria-label="Nghe câu gốc">${ICON.speak}</button></div>
      <div class="writebox"><span class="pre">→ ${esc(q.pre)}</span>
        <textarea id="writeIn" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gõ tiếp phần còn lại của câu…"></textarea></div>
      <div class="writetip">Gõ phần còn lại sau chữ in đậm. Không cần viết hoa; dấu chấm cuối câu có hay không đều được. Nhấn Enter để kiểm tra.</div>`;
    const w = $('#writeIn'); w.oninput = () => ready(w.value.trim()); w.focus({ preventScroll:true });
    $('#sayOrg').onclick = () => speak(q.org);
  }
  const vb = $('#viT'); if (vb) vb.onclick = () => { const x = $('#viX'); x.hidden = !x.hidden; vb.textContent = x.hidden ? 'Xem bản dịch' : 'Ẩn bản dịch'; };
}
function renderMatch(q) {
  $('#hintBtn').hidden = true;
  const left = shuffle(q.words), right = shuffle(q.words);
  $('#stage').innerHTML = `<div class="kind">Từ vựng</div><div class="qtitle">Ghép từ với nghĩa đúng</div>
    <div class="match"><div class="col">${left.map(w => `<button class="opt" data-w="${esc(w.w)}" data-s="L" type="button">${esc(w.w)}</button>`).join('')}</div>
    <div class="col">${right.map(w => `<button class="opt" data-w="${esc(w.w)}" data-s="R" type="button">${esc(w.vi)}</button>`).join('')}</div></div>`;
  let pick = { L:null, R:null }, left_ = q.words.length, errs = 0;
  $('#stage').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (b.classList.contains('gone')) return;
    const s = b.dataset.s;
    if (pick[s]) pick[s].classList.remove('sel');
    pick[s] = b; b.classList.add('sel');
    if (s === 'L') { const w = q.words.find(x => x.w === b.dataset.w); speak(w.w, true); }
    if (pick.L && pick.R) {
      const a = pick.L, z = pick.R; pick = { L:null, R:null };
      if (a.dataset.w === z.dataset.w) {
        [a, z].forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); });
        tone(true);
        setTimeout(() => [a, z].forEach(x => { x.classList.remove('ok'); x.classList.add('gone'); x.disabled = true; }), 280);
        if (--left_ === 0) {
          L.correct++; L.firstTry += errs ? 0 : 1; setProgress();
          setTimeout(() => { L.pos++; nextQ(); }, 550);
        }
      } else {
        errs++; tone(false);
        const w = q.words.find(x => x.w === a.dataset.w);
        if (!L.mistakes.find(m => m.w === w.w)) L.mistakes.push({ w:w.w, html:`<b>${esc(w.w)}</b> ${esc(w.ipa)} = ${esc(w.vi)}` });
        [a, z].forEach(x => { x.classList.remove('sel'); x.classList.add('bad', 'shake'); setTimeout(() => x.classList.remove('bad', 'shake'), 400); });
      }
    }
  });
  $('#btnRow').innerHTML = '<div style="flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:14px">Chạm một từ bên trái, rồi chạm nghĩa bên phải. Chạm từ tiếng Anh để nghe.</div>';
}

/* checking */
/* chấm câu viết lại: bỏ hoa/thường, dấu chấm cuối, ngoặc; chấp nhận travelling/traveling, gõ lại cả phần đầu câu */
const wnorm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[()]/g, ' ').replace(/[.,!?;:]/g, ' ')
  .replace(/\btravell/g, 'travel').replace(/\bit is\b/g, "it's").replace(/\bdo not\b/g, "don't").replace(/\bdoes not\b/g, "doesn't")
  .replace(/\s+/g, ' ').trim();
function writeVariants(q) {
  const full = q.ans.join(' ');
  const v = [full];
  if (q.n === 1) v.push(full.replace(/\.$/, '') + ' or not');
  return v.map(wnorm);
}
function writeOk(q, a) {
  let x = wnorm(a); const pre = wnorm(q.pre);
  if (x.startsWith(pre + ' ')) x = x.slice(pre.length + 1);
  return writeVariants(q).includes(x);
}
/* tô các từ em viết sai / thiếu (so khớp dãy con chung dài nhất) */
function diffHtml(user, right) {
  const a = wnorm(user).split(' ').filter(Boolean), b = right.split(/\s+/);
  const bn = b.map(wnorm);
  const m = a.length, n = b.length, d = Array.from({ length:m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) d[i][j] = a[i] === bn[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
  const keep = new Set(); let i = 0, j = 0;
  while (i < m && j < n) { if (a[i] === bn[j]) { keep.add(j); i++; j++; } else if (d[i + 1][j] >= d[i][j + 1]) i++; else j++; }
  const userKeep = new Set(); i = 0; j = 0;
  while (i < m && j < n) { if (a[i] === bn[j]) { userKeep.add(i); i++; j++; } else if (d[i + 1][j] >= d[i][j + 1]) i++; else j++; }
  return { user: a.map((w, k) => userKeep.has(k) ? esc(w) : `<s>${esc(w)}</s>`).join(' ') || '<s>(để trống)</s>',
           right: b.map((w, k) => keep.has(k) ? esc(w) : `<b>${esc(w)}</b>`).join(' ') };
}
const norm = s => s.toLowerCase().replace(/[’‘]/g, "'").replace(/[.,!?;:]+$/g, '').replace(/\s+/g, ' ').trim();
function isRight(q, a) {
  if (q.t === 'mc') return a === q.a || (q.alts || []).includes(a);
  if (q.t === 'type') return q.acc.some(x => norm(x) === norm(a));
  if (q.t === 'chips') return writeOk(q, a);
  return false;
}
function check() {
  if (L.state !== 'answer' || L.answer == null) return;
  const q = L.cur, ok = isRight(q, L.answer);
  L.state = 'feedback'; tone(ok);
  if (q.t === 'mc') {
    const b = [...document.querySelectorAll('#opts .opt')];
    b.forEach(x => x.disabled = true);
    b[ok ? L.answer : q.a].classList.add('ok'); if (!ok) b[L.answer].classList.add('bad');
    if (q.kind === 'stress') b.forEach((x, i) => { x.querySelector('span:nth-child(2)').textContent = q.marks[i]; });
  } else if (q.t === 'type') { const inp = $('#typeIn'); inp.disabled = true; inp.classList.add(ok ? 'ok' : 'bad'); }
  else if (q.t === 'chips') { const w = $('#writeIn'); w.disabled = true; w.classList.add(ok ? 'ok' : 'bad'); }
  if (ok) {
    L.correct++; if (!L.wrongSet.has(q)) L.firstTry++;
  } else {
    L.hearts--; L.wrongSet.add(q);
    if (!L.mistakes.includes(q)) L.mistakes.push(q);
    L.queue.push(q); // làm lại cuối bài
  }
  setProgress();
  const f = $('#lfoot'); f.className = 'lfoot ' + (ok ? 'ok' : 'bad');
  let full = q.t === 'chips' ? `→ ${esc(q.pre)} <b>${esc(q.ans.join(' '))}</b>` : markAns(q.full);
  if (q.t === 'chips' && !ok) {
    const df = diffHtml(L.answer, q.ans.join(' '));
    full = `<span class="yours">Em viết: → ${esc(q.pre)} ${df.user}</span><br>Đáp án đúng: → ${esc(q.pre)} <span class="rightans">${df.right}</span>`;
    q.lastWrong = L.answer;
  }
  const enText = q.t === 'chips' ? q.pre + ' ' + q.ans.join(' ') : (q.kind === 'pron' || q.kind === 'stress' ? '' : plain(q.full).replace(/\s*→.*$/, '').replace(/\s*\([A-Z]+\)$/, ''));
  const enSay = VN.test(enText) ? '' : enText;
  $('#fb').innerHTML = `<h3>${ok ? ICON.check + ' Chính xác!' : ICON.cross + ' Chưa đúng'}</h3>
    <div class="more">
      <div class="full">${ok || q.t === 'chips' ? '' : 'Đáp án đúng: '}${full} ${enSay && canSpeak ? `<button class="saybtn" id="sayFull" type="button">${ICON.speak} Nghe</button>` : ''}</div>
      <div class="row vi"><strong>${q.kind === 'phr' ? 'Nghĩa' : 'Dịch'}:</strong> ${esc(q.vi)}</div>
      ${q.f ? `<div class="row fx"><strong>${q.kind === 'phr' ? '' : 'Công thức: '}</strong>${esc(q.f)}</div>` : ''}
      ${q.e ? `<div class="row"><strong>Giải thích:</strong> ${esc(q.e)}</div>` : ''}
    </div>`;
  const sb = $('#sayFull'); if (sb) sb.onclick = () => speak(enSay);
  $('#btnRow').innerHTML = `<button class="btn wide ${ok ? '' : 'red'}" id="contBtn" type="button">${L.hearts <= 0 ? 'Xem kết quả' : 'Tiếp tục'}</button>`;
  $('#contBtn').onclick = cont; $('#contBtn').focus({ preventScroll:true });
}
function cont() { if (L.hearts <= 0) return finish(true); L.pos++; nextQ(); }
function showHint() {
  const q = L.cur; if (!q || !q.hint || L.hinted) return; L.hinted = true;
  const d = document.createElement('div'); d.className = 'hintbox';
  d.innerHTML = `<strong>Công thức gợi ý:</strong> ${esc(q.hint)}`;
  $('#stage').appendChild(d); d.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

/* results */
function finish(outOfHearts) {
  const lesson = L.lesson, secs = Math.round((Date.now() - L.start) / 1000);
  const acc = Math.round(L.firstTry / L.total * 100);
  const xp = outOfHearts ? 0 : L.firstTry * 2 + (acc === 100 ? 5 : 0) + 5;
  if (!outOfHearts) {
    S.done[lesson.id] = Math.max(S.done[lesson.id] || 0, acc);
    S.xp += xp; if (!S.days.includes(today())) S.days.push(today()); save();
  }
  const mm = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  const mistakes = L.mistakes.map(m => m.html ? `<div class="m">${m.html}</div>` :
    `<div class="m">${markAns(m.full || ('→ ' + m.pre + ' [[' + m.ans.join(' ') + ']]'))}<br><span style="color:var(--muted)">${esc(m.f)}</span></div>`).join('');
  $('#pFill').style.width = outOfHearts ? $('#pFill').style.width : '100%';
  $('#hintBtn') && ($('#hintBtn').hidden = true);
  $('#lfoot').className = 'lfoot'; $('#fb').innerHTML = '';
  $('#stage').innerHTML = `<div class="result">
    <svg class="trophy" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h28v14a14 14 0 0 1-28 0z" fill="var(--gold)"/><path d="M18 12H8v4a10 10 0 0 0 10 10M46 12h10v4a10 10 0 0 1-10 10" fill="none" stroke="var(--gold-deep)" stroke-width="4"/><rect x="28" y="36" width="8" height="10" fill="var(--gold-deep)"/><rect x="18" y="46" width="28" height="8" rx="3" fill="var(--gold-deep)"/><path d="M32 13l2.4 5 5.4.6-4 3.7 1.1 5.3-4.9-2.7-4.9 2.7 1.1-5.3-4-3.7 5.4-.6z" fill="#fff"/></svg>
    <h2>${outOfHearts ? 'Hết tim rồi!' : acc === 100 ? 'Hoàn hảo!' : 'Hoàn thành bài học!'}</h2>
    <div>${outOfHearts ? 'Xem lại công thức các câu sai bên dưới rồi làm lại nhé.' : esc(lesson.name)}</div>
    <div class="tiles">
      <div class="tile"><div class="t">XP</div><div class="v">+${xp}</div></div>
      <div class="tile g"><div class="t">Đúng ngay</div><div class="v">${acc}%</div></div>
      <div class="tile b"><div class="t">Thời gian</div><div class="v">${mm}</div></div>
    </div>
    ${mistakes ? `<div class="mist"><h3>Câu cần ôn lại (${L.mistakes.length})</h3>${mistakes}</div>` : ''}
  </div>`;
  $('#btnRow').innerHTML = `<button class="btn ghost" id="againBtn" type="button">Làm lại</button><button class="btn wide" id="homeBtn" type="button">Về lộ trình</button>`;
  $('#againBtn').onclick = () => startLesson(lesson);
  $('#homeBtn').onclick = quit;
  L.state = 'done';
  $('#lbody').scrollTop = 0;
}

/* keyboard */
document.addEventListener('keydown', e => {
  if (!L || $('#lesson').hidden) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    if (L.state === 'answer') check(); else if (L.state === 'feedback') cont();
    return;
  }
  if (L.state === 'answer' && L.cur && L.cur.t === 'mc' && document.activeElement.tagName !== 'INPUT') {
    const k = { '1':0, '2':1, '3':2, '4':3, a:0, b:1, c:2, d:3, t:0, f:1 }[e.key.toLowerCase()];
    const b = document.querySelectorAll('#opts .opt')[k]; if (b) b.click();
  }
});
if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
renderHome();
</script>
