003c/b> these challenges, people around the world have lived and worked in mountainous areas for centuries. There are \u003cb class=\"blank\">(4)\u003c/b> health benefits of living in the mountains. Being on the mountaintops allows you to live far from pollution. The air you breathe is fresher. There are places where you cannot drive a car or a motorbike, so you \u003cb class=\"blank\">(5)\u003c/b> walk. Travelling up and down hills and mountains on foot helps keep you active. Finally, mountain people are quite simple and \u003cb class=\"blank\">(6)\u003c/b>. They live a peaceful life."},{"k":"q","q":{"t":"mc","n":21,"stem":"(1) ______","opts":["collect","grow","feed","upload"],"a":1}},{"k":"q","q":{"t":"mc","n":22,"stem":"(2) ______","opts":["because","when","so","although"],"a":0}},{"k":"q","q":{"t":"mc","n":23,"stem":"(3) ______","opts":["Although","But","Despite","Because"],"a":2}},{"k":"q","q":{"t":"mc","n":24,"stem":"(4) ______","opts":["a lot","many","a little","a few"],"a":1}},{"k":"q","q":{"t":"mc","n":25,"stem":"(5) ______","opts":["cannot","should","mustn’t","have to"],"a":3}},{"k":"q","q":{"t":"mc","n":26,"stem":"(6) ______","opts":["friend","unfriend","friendly","unfriendly"],"a":2}},{"k":"sub","text":"Read the passage. Choose True or False, then answer the questions."},{"k":"passage","text":"There is an ethnic group living in Ha Long Bay, which is a UNESCO World Heritage site in Quang Ninh Province, in the northeast of Viet Nam. It has over 1,600 islands and islets. Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains. All the houses and buildings in the village float on huge wooden rafts.\nThe villagers spend their days fishing and looking after the sea life. Then they sail to the mainland to trade their fish for things like food, drinking water or clothes. Most children go to floating schools and then spend the rest of their time learning important skills like swimming and fishing. They also help out their parents as much as they can. Their lifestyle may seem strange to many people, but it’s so wonderful to live among such natural beauty and know you are protecting it. The villagers are able to help preserve their beautiful bay because they live directly on the water."},{"k":"q","q":{"t":"mc","n":27,"stem":"Ha Long Bay is located in Quang Ninh Province, in the northeast of Viet Nam.","opts":["True","False"],"a":0,"tf":1}},{"k":"q","q":{"t":"mc","n":28,"stem":"Cua Van is the only ancient floating fishing village that remains in Ha Long Bay.","opts":["True","False"],"a":0,"tf":1}},{"k":"q","q":{"t":"mc","n":29,"stem":"The villagers usually buy fish from the mainland and sell it to other people.","opts":["True","False"],"a":1,"tf":1}},{"k":"q","q":{"t":"mc","n":30,"stem":"Most children in Cua Van floating village attend floating schools.","opts":["True","False"],"a":0,"tf":1}},{"k":"q","q":{"t":"mc","n":31,"stem":"The passage is mainly about ______.","opts":["how Ha Long Bay became a UNESCO World Heritage site","the beauty of nature in Ha Long Bay","the life of people in Cua Van ancient village","the geographical features of Ha Long Bay"],"a":2}},{"k":"q","q":{"t":"mc","n":32,"stem":"The word “they” in paragraph 2 is closest in meaning to ______.","opts":["the houses","the villagers","the builders","the schools"],"a":1}}]},{"title":"V. SIGNS & NOTICES","note":"Choose the best option A, B, C or D.","blocks":[{"k":"q","q":{"t":"mc","n":33,"stem":"What does the sign tell you?","opts":["Only local pets are welcome here.","Pets are allowed if they are on a leash.","Pets are allowed in this area.","You are not allowed to bring pets here."],"a":3,"img":"/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAF+APUDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxF function mkQ(q){
 var box=el('div','q');box.id='q'+q.n;var it={q:q,box:box,ok:null,forced:false};items.push(it);
 var head=q.t==='mc'?(q.stem?'<span class="qn">'+q.n+'.</span>'+q.stem:'<span class="qn">'+q.n+'.</span>'):'<span class="qn">'+q.n+'.</span>'+(q.stem||'');
 var inner=el('div');
 if(q.t==='mc'){
  inner.appendChild(el('div',null,head));
  var o=el('div','opts');
  q.opts.forEach(function(t,i){var b=el('button','opt','<b>'+'ABCD'[i]+'</b><span>'+t+'</span>');b.type='button';b.setAttribute('aria-pressed','false');
   b.onclick=function(){if(submitted)return;ans[q.n]=i;[].forEach.call(o.children,function(c,j){c.classList.toggle('sel',j===i);c.setAttribute('aria-pressed',j===i)});upd()};o.appendChild(b)});
  inner.appendChild(o);it.opts=o;
 }else{
  if(q.stem)inner.appendChild(el('div',null,head));
  var r=el('div','tx');var lead=(q.stem?'':head)+(q.pre||'');if(lead)r.appendChild(el('span',null,lead));
  var inp=el('input');inp.type='text';inp.id='a'+q.n;inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('aria-label','Câu '+q.n);
  inp.oninput=function(){if(submitted)return;ans[q.n]=inp.value;upd()};var long=!!(q.stem&&q.pre);if(long){r.style.display='block';inp.style.cssText='width:100%;margin-top:6px'}r.appendChild(inp);if(q.post&&!(long&&/^[.\s]*$/.test(q.post)))r.appendChild(el('span',null,q.post));inner.appendChild(r);it.inp=inp;
 }
 var fb=el('div','fb');inner.appendChild(fb);it.fb=fb;
 if(q.img){var row=el('div','qrow');var im=new Image();im.src='data:image/jpeg;base64,'+q.img;im.alt='Biển báo';row.appendChild(im);row.appendChild(inner);box.appendChild(row)}else box.appendChild(inner);
 return box;
}
function answered(){return items.filter(function(it){var v=ans[it.q.n];return v!==undefined&&String(v).trim()!==''}).length}
function upd(){var a=answered();$('#st-done').textContent=a+'/40 câu';$('#prog').style.width=(a/40*100)+'%';$('#warn').style.display='none'}
function tick(){var s=Math.floor((Date.now()-t0)/1000);$('#st-time').textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function grade(it){
 var q=it.q,v=ans[q.n];
 if(q.t==='mc')return v===q.a;
 if(v===undefined)return false;var n=norm(v);return q.acc.some(function(a){return norm(a)===n});
}
function showAns(it){
 var q=it.q;it.box.classList.add('done');it.box.classList.toggle('ok',it.ok);it.box.classList.toggle('no',!it.ok);
 if(q.t==='mc'){[].forEach.call(it.opts.children,function(c,i){c.disabled=true;c.classList.remove('sel');if(i===q.a)c.classList.add('right');else if(i===ans[q.n])c.classList.add('wrong')});
  it.fb.textContent=it.ok?'✓ Đúng':'✗ Đáp án đúng: '+'ABCD'[q.a]+'. '+q.opts[q.a].replace(/<[^>]+>/g,'')}
 else{it.inp.readOnly=true;
  it.fb.innerHTML=it.ok?'✓ Đúng':'✗ Đáp án: '+q.show.replace(/</g,'&lt;');
  if(!it.ok){var b=el('button',null,'Tính đúng');b.type='button';b.title='Dùng khi em viết đúng nghĩa nhưng khác cách viết';b.onclick=function(){it.forced=true;it.ok=true;showAns(it);score()};it.fb.appendChild(b)}}
}
function score(){
 var right=items.filter(function(i){return i.ok}).length,pt=right*0.25;
 var rank=pt>=8?'Giỏi':pt>=6.5?'Khá':pt>=5?'Trung bình':'Cần cố gắng hơn';
 var secs=[];EXAM.secs.forEach(function(s){var qs=s.blocks.filter(function(b){return b.k==='q'}).map(function(b){return b.q.n});var r=items.filter(function(i){return qs.indexOf(i.q.n)>-1&&i.ok}).length;secs.push('<span class="chip">'+s.title.split('.')[0]+': '+r+'/'+qs.length+'</span>')});
 var nm=$('#nm').value.trim(),cl=$('#cl').value.trim();
 var r=$('#res');r.className='res on';
 r.innerHTML='<div class="row"><div class="big">'+String(pt).replace('.',',')+'<small> / 10</small></div><div><b>'+(nm?nm.replace(/</g,'&lt;')+(cl?' – '+cl.replace(/</g,'&lt;'):''):'Kết quả')+'</b><br>Xếp loại: <b>'+rank+'</b><br>Thời gian: '+$('#st-time').textContent+'</div></div><div class="chips"><span class="chip g">Đúng '+right+'</span><span class="chip b">Sai '+(40-right)+'</span>'+secs.join('')+'</div>';
}
function submit(force){
 var left=40-answered();
 if(left>0&&!force){var w=$('#warn');w.style.display='block';w.innerHTML='Còn '+left+' câu chưa làm. ';var y=el('button','btn alt','Nộp luôn');y.type='button';y.style.cssText='padding:4px 14px;font-size:15px;margin:0 6px';y.onclick=function(){submit(true)};var n=el('button','btn alt','Làm tiếp');n.type='button';n.style.cssText='padding:4px 14px;font-size:15px';n.onclick=function(){w.style.display='none'};w.appendChild(y);w.appendChild(n);return}
 submitted=true;clearInterval(timer);
 items.forEach(function(it){it.ok=grade(it);showAns(it)});
 score();$('#submit').hidden=true;$('#again').hidden=false;$('#onlywrong').hidden=false;$('#warn').style.display='none';
 window.scrollTo({top:0,behavior:'smooth'});
}
$('#submit').onclick=function(){submit(false)};
$('#again').onclick=function(){ans={};submitted=false;t0=Date.now();clearInterval(timer);timer=setInterval(tick,1000);document.body.classList.remove('hidden-ok');build();$('#res').className='res';$('#submit').hidden=false;$('#again').hidden=true;$('#onlywrong').hidden=true;upd();tick();window.scrollTo({top:0})};
$('#onlywrong').onclick=function(){var on=document.body.classList.toggle('hidden-ok');this.textContent=on?'Xem tất cả câu':'Chỉ xem câu sai'};
build();upd();tick();timer=setInterval(tick,1000);
</script>
