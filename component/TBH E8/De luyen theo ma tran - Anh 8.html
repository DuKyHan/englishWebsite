<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đề luyện Anh 8 GHK1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:wght@600;700&display=swap">
<style>
/* Layout: exam paper column (max 820px). Home = grid of exam cards; exam view = parts I–VII like the printed test, sticky bottom bar with progress and submit. */
:root{
  --bg:#F4F6F9; --paper:#FFFFFF; --ink:#1B2433; --muted:#5B6576; --line:#D7DEE8;
  --navy:#1F3864; --navy-soft:#DCE6F2; --green:#385623; --green-soft:#E2EFDA; --green-pale:#F3F8EF;
  --good:#2E8B4A; --good-soft:#DFF3E5; --bad:#C2413B; --bad-soft:#FBE4E2; --sun:#E0A100; --sun-soft:#FFF4D6;
  --display:"Lora",Georgia,"Times New Roman",serif; --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151D; --paper:#171E29; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2B3545;
  --navy:#9DB8E8; --navy-soft:#1E2B42; --green:#9CCB7A; --green-soft:#1D2C1A; --green-pale:#18231A;
  --good:#5BC27A; --good-soft:#163222; --bad:#F07C75; --bad-soft:#3A1C1B; --sun:#F2C14E; --sun-soft:#3A2F12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151D; --paper:#171E29; --ink:#E6EBF2; --muted:#9AA6B8; --line:#2B3545;
  --navy:#9DB8E8; --navy-soft:#1E2B42; --green:#9CCB7A; --green-soft:#1D2C1A; --green-pale:#18231A;
  --good:#5BC27A; --good-soft:#163222; --bad:#F07C75; --bad-soft:#3A1C1B; --sun:#F2C14E; --sun-soft:#3A2F12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--navy)}
.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--display);color:var(--navy);font-size:19px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.timer{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;font-size:15px}
main{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
h1,h2,h3{font-family:var(--display);color:var(--navy);margin:0;text-wrap:balance}
h1{font-size:24px} h2{font-size:20px}
p{margin:6px 0}
.muted{color:var(--muted)}
.tip{background:var(--sun-soft);border-radius:10px;padding:10px 14px;font-size:15px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.ex{border:1px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--paper);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.ex:hover{border-color:var(--navy)}
.ex b{font-family:var(--display);font-size:21px;color:var(--navy)}
.ex span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex.rand{background:var(--green-pale);border-color:var(--green)}
.ex.rand b{color:var(--green)}
.ex .badge{align-self:flex-start;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--navy-soft);color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}
th{background:var(--navy-soft);color:var(--navy)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
/* exam paper */
.part{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.ph{background:var(--navy-soft);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ph h3{font-size:16px;font-family:var(--body);font-weight:700}
.ph span{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap}
.pinstr{padding:8px 16px 0;font-size:14px;font-style:italic;color:var(--muted)}
.passage{margin:10px 16px;padding:12px 14px;background:var(--green-pale);border-radius:10px;font-size:15px}
.passage p{text-indent:1.4em;margin:0 0 8px;text-align:justify}
.gap{font-weight:700;color:var(--navy);white-space:nowrap}
.entry{margin:10px 16px;padding:10px 14px;border:1px dashed var(--green);border-radius:10px;background:var(--green-pale);font-size:15px}
.entry ul{margin:4px 0 0;padding-left:20px}
.entry li{font-style:italic}
.q{padding:10px 16px;border-top:1px solid var(--line);scroll-margin-top:80px}
.stem{display:flex;gap:10px;align-items:flex-start}
.qn{flex:none;min-width:34px;height:26px;padding:0 6px;border-radius:7px;background:var(--navy-soft);color:var(--navy);font-weight:700;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.q.answered .qn{background:var(--navy);color:var(--paper)}
.st{min-width:0;padding-top:1px}
.sign{display:block;max-height:130px;width:auto;border-radius:8px;border:1px solid var(--line);background:#fff;margin:2px 0 6px}
.opts{display:grid;gap:6px;margin:8px 0 2px 44px}
.opts.short{grid-template-columns:repeat(4,minmax(0,1fr))}
.opts.tf{grid-template-columns:repeat(2,minmax(0,160px))}
.opt{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);border-bottom-width:3px;background:var(--paper);border-radius:9px;padding:6px 10px;min-width:0;font-size:15px}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt u{text-decoration-thickness:2px;text-underline-offset:3px}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt.sel .k{background:var(--navy);color:var(--paper)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.typ{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 2px 44px}
.typ .prefix{font-weight:600}
.typ input{flex:1;min-width:160px;border:1px solid var(--line);border-bottom-width:3px;border-radius:9px;padding:7px 10px;font:inherit;background:var(--paper);color:var(--ink)}
.typ input.okk{border-color:var(--good);background:var(--good-soft)}
.typ input.bad{border-color:var(--bad);background:var(--bad-soft)}
.cue{color:var(--green)}
.fb{margin:8px 0 2px 44px;padding:8px 12px;border-radius:9px;font-size:14px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fb .t{font-weight:700}
.fb.good .t{color:var(--good)} .fb.bad .t{color:var(--bad)}
.hideok .q.correct{display:none}
/* bottom bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--navy);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.foot .bar{flex:1;min-width:120px;height:10px;background:var(--navy-soft);border-radius:99px;overflow:hidden}
.foot .bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .3s}
.foot .cnt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--navy);color:var(--paper)}
.btn.green{background:var(--green);color:var(--paper)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* result */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.big{font-family:var(--display);font-size:56px;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--navy-soft);border-radius:99px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--good)}
.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wl a{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--bad-soft);color:var(--bad);text-decoration:none;font-weight:700}
.confirm{background:var(--sun-soft);border-radius:10px;padding:10px 12px;font-size:14px}
@media (max-width:560px){
  .opts,.typ,.fb{margin-left:0}
  .opts.short{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

ually”), chủ ngữ số ít → plays.", "ref": "Câu 5", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "________ helps to improve physical health and sometimes gives us a chance to make friends.", "opts": ["Messaging", "Playing computer games", "Surfing the net", "Playing sports"], "ans": 3, "expl": "Chơi thể thao giúp cải thiện sức khỏe thể chất và kết bạn.", "ref": "Câu 6", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Mark spends a lot of time ________ the internet. He visits one website after another just to watch short videos.", "opts": ["doing", "taking", "surfing", "knitting"], "ans": 2, "expl": "surf the internet: lướt mạng; spend time + V-ing.", "ref": "Câu 7", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Our cousins detest ________ books and _________ .", "opts": ["reading / draw", "reading / drawing", "to read / to draw", "read / draw"], "ans": 1, "expl": "detest + V-ing; hai động từ song song: reading – drawing.", "ref": "Câu 8", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Alice spends a lot of time _______ her own; she always exercises regularly and does what she enjoys.", "opts": ["on", "in", "about", "for"], "ans": 0, "expl": "on one’s own: một mình.", "ref": "Câu 9", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "_______ is a design that you use to make something.", "opts": ["Pattern", "Pastime", "Needles", "A and B are correct"], "ans": 0, "expl": "pattern: mẫu, khuôn (thiết kế dùng để làm ra vật gì); pastime: thú tiêu khiển.", "ref": "Câu 10", "fixed": true}, {"t": "choice", "kind": "mcq", "prompt": "_________ do you do with your friends in your free time?", "opts": ["What", "How", "Who", "When"], "ans": 0, "expl": "Hỏi về hoạt động → What do you do…?", "ref": "Câu 11", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "_______ is small circles of wool made around knitting needles.", "opts": ["Stitches", "Magical", "Pastime", "Pattern"], "ans": 0, "expl": "stitch: mũi đan/mũi khâu.", "ref": "Câu 12", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Origami is the art of paper _________.", "opts": ["fold", "folding", "to fold", "folds"], "ans": 1, "expl": "paper folding: (nghệ thuật) gấp giấy – danh động từ.", "ref": "Câu 13", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "About favorite leisure activities, she and I share many things in _______.", "opts": ["similarity", "general", "common", "the same"], "ans": 2, "expl": "have/share something in common: có điểm chung.", "ref": "Câu 14", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "It rained hard. ______, my father went to work.", "opts": ["Therefore", "However", "Because", "A and B are correct"], "ans": 1, "expl": "Hai ý trái ngược (mưa to – vẫn đi làm) → However, đứng đầu câu, sau có dấu phẩy.", "ref": "Câu 15", "fixed": true}]}, "mcq-2": {"id": "mcq-2", "title": "Trắc nghiệm Unit 2", "sub": "Câu 11 – 25", "passage": null, "qs": [{"t": "choice", "kind": "mcq", "prompt": "His uncle likes ______ some fish from nearby lakes and ponds after school.", "opts": ["catching", "holding", "buying", "meeting"], "ans": 0, "expl": "catch fish: câu/bắt cá.", "ref": "Câu 11", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Tom helps his family to herd ______ at weekends.", "opts": ["cattle", "poultry", "cats", "fruit"], "ans": 0, "expl": "herd cattle: chăn gia súc.", "ref": "Câu 12", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "The man ______ the vegetables in the field and then drives home.", "opts": ["makes", "loads", "catches", "uploads"], "ans": 1, "expl": "load: chất (hàng) lên xe; chủ ngữ số ít → loads.", "ref": "Câu 13", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "The teacher told his students __________ laughing.", "opts": ["stop", "stopping", "to stop", "stopped"], "ans": 2, "expl": "tell sb to do sth.", "ref": "Câu 14", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "This is ________ city that I have ever been to.", "opts": ["the busiest", "the busier", "the most busy", "the most busiest"], "ans": 0, "expl": "So sánh nhất của tính từ ngắn busy → the busiest.", "ref": "Câu 15", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "We couldn’t go out _________ it was very stormy.", "opts": ["because of", "because", "so", "but"], "ans": 1, "expl": "because + mệnh đề (S + V); because of + danh từ/cụm danh từ.", "ref": "Câu 16", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "My father asked us _________ too much time playing computer games last night.", "opts": ["not to spending", "didn’t spend", "not to spend", "to not spent"], "ans": 2, "expl": "ask sb (not) to do sth → not to spend.", "ref": "Câu 17", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "The workers are ______ a truck with timber.", "opts": ["unloading", "loading", "taking", "filling"], "ans": 1, "expl": "load something with something: chất cái gì lên xe.", "ref": "Câu 18", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "He often ______ holes in his garden to plant trees.", "opts": ["ploughs", "picks", "digs", "collects"], "ans": 2, "expl": "dig holes: đào hố.", "ref": "Câu 19", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "My uncle hired extra workers to help at harvest ______.", "opts": ["time", "point", "period", "season"], "ans": 0, "expl": "harvest time: mùa thu hoạch (cụm từ trong bài học).", "ref": "Câu 20", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "From the hilltop, we can see row after row of orange trees ______ to the horizon.", "opts": ["running", "expanding", "enlarging", "stretching"], "ans": 3, "expl": "stretch to the horizon: trải dài tới chân trời.", "ref": "Câu 21", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "People in my village grow rice in vast ______ fields.", "opts": ["corn", "wheat", "pad", "paddy"], "ans": 3, "expl": "paddy fields: cánh đồng lúa.", "ref": "Câu 22", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Student A: You look nice today.          Student B: ______", "opts": ["Do you really think so?", "I don’t think so.", "I beg your pardon.", "I’m fine, thank you."], "ans": 0, "expl": "Đáp lại lời khen một cách khiêm tốn.", "ref": "Câu 23", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Student A: I’ve had a very enjoyable summer holiday with my family.          Student B: ______", "opts": ["I’m jealous of your holiday.", "I envy you.", "That’s great, thanks.", "No, I don’t envy you."], "ans": 1, "expl": "I envy you: Mình ghen tị với bạn quá (ngưỡng mộ) – cách đáp tự nhiên.", "ref": "Câu 24", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Student A: Ooh, what a great tie! Where did you get it?          Student B: ______", "opts": ["Oh, thank you! I got it at a shop in Le Loi Street.", "Don’t mention it. I bought it at a shop in Ha Noi.", "No, it doesn’t look great at all.", "Yes, I like it very much."], "ans": 0, "expl": "Cảm ơn lời khen và trả lời câu hỏi mua ở đâu.", "ref": "Câu 25", "fixed": false}]}, "mcq-3": {"id": "mcq-3", "title": "Trắc nghiệm Unit 3", "sub": "Câu 11 – 20", "passage": null, "qs": [{"t": "choice", "kind": "mcq", "prompt": "He isn’t going to the concert ________ the tickets are too expensive.", "opts": ["Though", "in spite of", "because", "because of"], "ans": 2, "expl": "Chỉ nguyên nhân, theo sau là mệnh đề → because.", "ref": "Câu 11", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "No one in the volunteer group is ______ Jack is.", "opts": ["more active as", "as active than", "more active", "so active as"], "ans": 3, "expl": "So sánh bằng phủ định: not/no one … so/as + adj + as.", "ref": "Câu 12", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "There is nothing _____________ than going swimming in hot weather.", "opts": ["gooder", "good", "better", "more goodly"], "ans": 2, "expl": "So sánh hơn của good → better (… than).", "ref": "Câu 13", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Lam is very sensitive, _________ you shouldn’t comment on his new shoes.", "opts": ["but", "therefore", "however", "so"], "ans": 3, "expl": "Mệnh đề chỉ kết quả, sau dấu phẩy → so.", "ref": "Câu 14", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Mr Buong likes showing off his new things; _________, he often posts pictures on social media.", "opts": ["because", "therefore", "although", "but"], "ans": 1, "expl": "Sau dấu chấm phẩy, trước dấu phẩy, chỉ kết quả → therefore.", "ref": "Câu 15", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Nowadays, many people like to spend their free time ________ the Internet.", "opts": ["surfing", "surf", "are surfing", "to surf"], "ans": 0, "expl": "spend time + V-ing.", "ref": "Câu 16", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Ba wanted ________ with his family on a day trip to his home village.", "opts": ["to join", "join", "joining", "will join"], "ans": 0, "expl": "want + to V.", "ref": "Câu 17", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Every road user ________ obey traffic rules strictly to prevent accidents.", "opts": ["ought", "must", "could", "may"], "ans": 1, "expl": "must + V: phải (bắt buộc). “ought” phải đi với “to”.", "ref": "Câu 18", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "Listening to folk songs ________ me a great pleasure and I feel very relaxed.", "opts": ["give", "are giving", "gave", "gives"], "ans": 3, "expl": "Chủ ngữ là V-ing (Listening…) → động từ số ít: gives.", "ref": "Câu 19", "fixed": false}, {"t": "choice", "kind": "mcq", "prompt": "My principal is always ________ first person to arrive at the school every morning.", "opts": ["a", "an", "the", "Ø (no article)"], "ans": 2, "expl": "Dùng “the” trước số thứ tự: the first person.", "ref": "Câu 20", "fixed": true}]}, "gap-1": {"id": "gap-1", "title": "Điền từ – Unit 1", "sub": "Passage B (page 8)", "passage": ["Some teenagers enjoy (1) ______ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect (2) ______ them.", "At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the (3) ______. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and (4) ______. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook.", "The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first (5) ______ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to (6) ______ with them."], "qs": [{"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (1).", "blank": 1, "opts": ["spending", "to spend", "spend", "spends"], "ans": 0, "expl": "enjoy + V-ing → spending.", "fixed": false}, {"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (2).", "blank": 2, "opts": ["to", "with", "from", "on"], "ans": 1, "expl": "connect with sb: gắn kết với ai.", "fixed": false}, {"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (3).", "blank": 3, "opts": ["air pollution", "water pollution", "environmental pollution", "fresh air"], "ans": 3, "expl": "Đạp xe về làng quê để tận hưởng không khí trong lành (fresh air).", "fixed": false}, {"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (4).", "blank": 4, "opts": ["eat", "cook", "cooks", "cooking"], "ans": 1, "expl": "Song song với “prepare” sau chủ ngữ “we” → cook.", "fixed": false}, {"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (5).", "blank": 5, "opts": ["award", "gift", "prize", "medal"], "ans": 2, "expl": "win the first prize: đạt giải nhất.", "fixed": false}, {"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (6).", "blank": 6, "opts": ["connect", "connecting", "connected", "connection"], "ans": 0, "expl": "a way to + V nguyên mẫu → connect.", "fixed": false}]}, "gap-2": {"id": "gap-2", "title": "Điền từ – Unit 2", "sub": "Passage A (page 17)", "passage": ["I live in a small village in Ninh Binh. I love the (1) ______ peace and quiet of my village. The air is unpolluted, and the (2) ______ of life is slow. The people in my village are friendly and hospitable. They are always willing (3) ______ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy (4) ______ in the nearby area. It is actually a national park, so the wildlife there can live and move about (5) ______. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this (6) ______ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."], "qs": [{"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (1).", "blank": 1, "opts": ["urban", "rural", "suburban", "metropolitan"], "ans": 1, "expl": "rural peace and quiet: sự yên bình của vùng nông thôn.", "fixed": false}, {"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (2).", "blank": 2, "opts": ["speed", "step", "pace", "rate"], "ans": 2, "expl": "the pace of life: nhịp sống.", "fixed": false}, {"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (3).", "blank": 3, "opts": ["to help", "helping", "help", "to helping"], "ans": 0, "expl": "be willing + to V: sẵn lòng làm gì.", "fixed": false}, {"t": "choice", "kind": "gap", "prompt": "Chọn đáp án đúng cho chỗ trống (4).", "blank": 4, "opts": ["nature", "environment", "countryside", "scenery"], "ans": 0, "expl": "enjoy nature: hòa mình vào thiên nhiên (câu sau nói về vườn quốc gia, động Doing DIYs and baking makes Nam feel ____________.", "opts": ["relaxed", "tired", "bored", "stressed"], "ans": 0, "expl": "“Doing these things helps me relax…” → relaxed.", "fixed": false}]}, "tf-2": {"id": "tf-2", "title": "True / False – Unit 2", "sub": "Passage A (pages 17 ", "passage": ["Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland.", "Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."], "qs": [{"t": "tf", "kind": "tf", "prompt": "The British countryside is known only for its beautiful scenery without any contrasts.", "ans": 1, "expl": "Bài nói “well known for its many contrasts” → có nhiều sự tương phản."}, {"t": "tf", "kind": "tf", "prompt": "National parks in Britain are protected from development by the government.", "ans": 0, "expl": "“National parks which are protected from development by the government…”"}, {"t": "tf", "kind": "tf", "prompt": "Most farmland in Britain is owned by the government.", "ans": 1, "expl": "“Most farmland is now owned by individual people or independent companies.”"}, {"t": "tf", "kind": "tf", "prompt": "Today, many people living in rural areas travel to work in towns every day.", "ans": 0, "expl": "“Many of them commute to work in towns.” (commute = đi làm hằng ngày)."}, {"t": "choice", "kind": "tfmc", "prompt": "What is the main idea of the passage?", "opts": ["The history of British farmland ownership.", "The contrasts, features, and lifestyle in the British countryside.", "The best outdoor activities for British people.", "The reasons why national parks are famous."], "ans": 1, "expl": "Bài nói về sự tương phản, đặc điểm và lối sống ở vùng quê nước Anh.", "fixed": false}, {"t": "choice", "kind": "tfmc", "prompt": "According to the passage, what do British people usually associate the countryside with?", "opts": ["Only national parks and wild coastlines.", "Farmland, open spaces, and green fields enclosed by hedges or stone walls.", "Modern buildings and busy roads.", "Large forests without any farms."], "ans": 1, "expl": "“British people often associate the countryside with farmland, open spaces… green fields enclosed by hedges or stone walls.”", "fixed": false}]}, "wf-1": {"id": "wf-1", "title": "Word form – Unit 1", "sub": "Viết dạng đúng của từ", "passage": null, "qs": [{"t": "type", "kind": "wf", "prompt": "The most popular leisure _____ in Britain is going for a walk.", "cue": "ACT", "ans": ["activity"], "expl": "Sau tính từ “leisure” cần danh từ: activity (hoạt động)."}, {"t": "type", "kind": "wf", "prompt": "To play video games, these computers must be used over a Wi-Fi internet _____.", "cue": "CONNECT", "ans": ["connection"], "expl": "internet connection: kết nối mạng – cần danh từ."}, {"t": "type", "kind": "wf", "prompt": "I think badminton is an easy sport which helps to improve my muscle _____.", "cue": "STRONG", "ans": ["strength"], "expl": "muscle strength: sức mạnh cơ bắp – danh từ của strong."}, {"t": "type", "kind": "wf", "prompt": "It is very _____ to watch these movies. I think you should watch them.", "cue": const KEY = 'e8_matrix_exams_v1';
const LET = ['A', 'B', 'C', 'D'];
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => String(s).replace(/<\/?[a-z][^>]*>/gi, '');
const norm = s => String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').replace(/\s*([,.;!?])\s*/g, '$1 ').replace(/[\s.!?]+$/, '').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
S.stats = S.stats || {}; S.cur = S.cur || null;

const PARTS = [
  ['I', 'Choose the word / phrase (A, B, C or D) that best fits the space or best answers the requirement in each sentence.', 1, 14, '3,5 điểm'],
  ['II', 'Look at the signs. Choose the best answer (A, B, C or D).', 15, 16, '0,5 điểm'],
  ['III', 'Read the passage and choose the correct answer (A, B, C or D) for each numbered blank.', 17, 22, '1,5 điểm'],
  ['IV', 'Read the passage. Decide whether statements 23–26 are True or False, then choose the correct answer for 27–28.', 23, 28, '1,5 điểm'],
  ['V', 'Use the correct form of the word given in each sentence.', 29, 34, '1,5 điểm'],
  ['VI', 'Use the dictionary entry to complete the sentences with two or three words.', 35, 36, '0,5 điểm'],
  ['VII', 'Finish each sentence so that it means the same as the sentence before it.', 37, 40, '1,0 điểm'],
];
const KIND = {pron:'Phát âm', stress:'Trọng âm', mcq:'Trắc nghiệm', sign:'Biển báo', gap:'Điền từ', tf:'True/False', tfmc:'Đọc hiểu', wf:'Word form', dict:'Từ điển', trans:'Viết lại câu'};
const Q = (lid, idx) => DATA.lessons[lid].qs[idx];

/* ---------- random exam following the matrix ---------- */
function randomItems(){
  const L = DATA.lessons, ids = lid => L[lid].qs.map((_, i) => [lid, i]);
  const dialogs = [['mcq-2', 12], ['mcq-2', 13], ['mcq-2', 14]];
  const isDlg = x => dialogs.some(d => d[0] === x[0] && d[1] === x[1]);
  const mcqPool = ids('mcq-1').concat(ids('mcq-2'), ids('mcq-3')).filter(x => !isDlg(x));
  const gap = pick(['gap-1', 'gap-2'], 1)[0], tf = gap === 'gap-1' ? 'tf-2' : 'tf-1';
  const d = Math.floor(Math.random() * 4) * 2;
  return [].concat(pick(ids('pron-1'), 1), pick(ids('pron-3'), 1), pick(ids('stress-2'), 1), pick(ids('stress-3'), 1),
    pick(mcqPool, 9), pick(dialogs, 1), pick(ids('sign'), 2), ids(gap), ids(tf),
    pick(ids('wf-1'), 2), pick(ids('wf-2'), 2), pick(ids('wf-3'), 2), [['dict', d], ['dict', d + 1]],
    pick(ids('tr-1'), 1), pick(ids('tr-2'), 1), pick(ids('tr-3'), 1), pick(ids('tr-4'), 1));
}

/* ---------- start / attempt ---------- */
function newAttempt(examId){
  const items = examId === 'rand' ? randomItems() : DATA.exams.find(e => e.id === examId).items;
  const perms = items.map(([lid, idx]) => { const q = Q(lid, idx); return (q.t === 'choice' && !q.fixed) ? shuffle([0, 1, 2, 3]) : null; });
  S.cur = {examId, items, perms, ans: {}, submitted: false, t0: Date.now(), elapsed: 0};
  save(); renderExam();
}
function examTitle(id){ return id === 'rand' ? 'Đề ngẫu nhiên' : DATA.exams.find(e => e.id === id).title; }

/* ---------- home ---------- */
function home(){
  stopTimer(); $('#foot').hidden = true; $('#timer').hidden = true;
  const cur = S.cur && !S.cur.submitted ? S.cur : null;
  const card = (id, title, extra) => { const st = S.stats[id]; return `<button class="ex${id === 'rand' ? ' rand' : ''}" data-id="${id}"><b>${title}</b>${extra || ''}<span>${st ? `Đã làm ${st.n} lần · cao nhất ${st.best.toFixed(2).replace('.', ',')}` : 'Chưa làm'}</span>${cur && cur.examId === id ? '<span class="badge">Đang làm dở</span>' : ''}</button>`; };
  const hist = Object.entries(S.stats);
  $('#app').innerHTML = `
  <div class="card">
    <h1>Đề luyện theo ma trận</h1>
    <p class="muted">Mỗi đề 40 câu, đúng cấu trúc đề kiểm tra giữa HK1: ngữ âm, trắc nghiệm, biển báo, đọc điền từ, True/False, word form, từ điển, viết lại câu. Mỗi câu 0,25 điểm.</p>
    <p class="tip"><b>Thứ tự đáp án A, B, C, D được đảo ngẫu nhiên mỗi lần làm.</b> Vì vậy em cần hiểu vì sao đáp án đúng, không thể nhớ “câu 5 chọn C”. Làm xong bấm <b>Nộp bài</b> để xem điểm, đáp án và giải thích từng câu.</p>
    <div class="grid">${DATA.exams.map(e => card(e.id, e.title)).join('')}${card('rand', 'Đề ngẫu nhiên', '<span>Bốc câu mới theo ma trận</span>')}</div>
  </div>
  ${hist.length ? `<div class="card"><h2>Kết quả của em</h2><div class="tw" style="margin-top:10px"><table><thead><tr><th>Đề</th><th class="n">Số lần</th><th class="n">Cao nhất</th><th class="n">Gần nhất</th></tr></thead><tbody>${hist.map(([id, st]) => `<tr><td>${examTitle(id)}</td><td class="n">${st.n}</td><td class="n">${st.best.toFixed(2).replace('.', ',')}</td><td class="n">${st.last.toFixed(2).replace('.', ',')}</td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
  $$('.ex').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (cur && cur.examId === id) { renderExam(); return; }
    newAttempt(id);
  });
  window.scrollTo(0, 0);
}

/* ---------- exam render ---------- */
let timerId = null;
function stopTimer(){ if (timerId) clearInterval(timerId); timerId = null; }
function startTimer(){
  stopTimer(); const el = $('#timer'); el.hidden = false;
  const tick = () => {
    const c = S.cur; if (!c) return;
    const secs = Math.floor((c.submitted ? c.elapsed : (Date.now() - c.t0)) / 1000);
    el.textContent = '⏱ ' + String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0') + (c.submitted ? '' : ' / 60:00');
  };
  tick(); timerId = setInterval(tick, 1000);
}
function optsHtml(q, perm, n){
  const order = perm || [0, 1, 2, 3];
  const short = q.opts.every(o => strip(o).length <= 16);
  return `<div class="opts${short ? ' short' : ''}">${order.map((orig, pos) => `<button type="button" class="opt" data-orig="${orig}"><span class="k">${LET[pos]}</span><span>${q.html ? q.opts[orig] : esc(q.opts[orig])}</span></button>`).join('')}</div>`;
}
function renderExam(){
  const c = S.cur; const app = $('#app');
  let html = `<div class="card"><div class="row" style="justify-content:space-between"><div><h1>${examTitle(c.examId)}</h1><p class="muted">40 câu · 60 phút · thứ tự đáp án đã được đảo</p></div><button class="btn ghost" id="back" type="button">Danh sách đề</button></div><div id="result"></div></div>`;
  let n = 0;
  PARTS.forEach(([code, instr, from, to, pts]) => {
    html += `<section class="part"><div class="ph"><h3>${code}. ${instr}</h3><span>Câu ${from}–${to} · ${pts}</span></div>`;
    let shownPassage = null, shownEntry = null;
    for (let k = from; k <= to; k++){
      const [lid, idx] = c.items[k - 1]; const q = Q(lid, idx); const L = DATA.lessons[lid];
      if (L.passage && L.passage !== shownPassage && (q.kind === 'gap' || q.kind === 'tf' || q.kind === 'tfmc')){
        shownPassage = L.passage;
        html += `<div class="passage">${L.passage.map(p => '<p>' + esc(p).replace(/\((\d)\)\s*_+/g, (m, d) => `<span class="gap">(${from - 1 + +d}) ______</span>`) + '</p>').join('')}</div>`;
      }
      if (q.entry && q.entry.word !== shownEntry){
        shownEntry = q.entry.word; const e = q.entry;
        html += `<div class="entry"><b>${esc(e.word)}</b> ${esc(e.ipa)} <i>${esc(e.pos)}</i><div>${esc(e.def)}</div><ul>${e.ex.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
      }
      html += qHtml(q, k, c.perms[k - 1]);
    }
    html += '</section>';
  });
  app.innerHTML = html;
  $('#back').onclick = home;
  // restore answers
  $$('.q').forEach(el => {
    const k = +el.dataset.k, v = c.ans[k];
    if (el.dataset.t === 'choice'){
      $$('.opt', el).forEach(b => b.onclick = () => { if (S.cur.submitted) return; S.cur.ans[k] = +b.dataset.orig; save(); markSel(el, k); updateFoot(); });
      markSel(el, k);
    } else {
      const inp = $('input', el); if (v != null) inp.value = v;
      inp.addEventListener('input', () => { S.cur.ans[k] = inp.value; save(); el.classList.toggle('answered', inp.value.trim().length > 0); updateFoot(); });
      el.classList.toggle('answered', !!(v && String(v).trim()));
    }
  });
  if (c.submitted) grade(true); else { updateFoot(); }
  startTimer();
  window.scrollTo(0, 0);
}
function qHtml(q, k, perm){
  let stem = '', body = '';
  if (q.kind === 'pron') stem = 'Which word has the underlined part pronounced differently from that of the others?';
  else if (q.kind === 'stress') stem = 'Which word has a different stress pattern from that of the others?';
  else if (q.kind === 'gap') stem = `Choose the best option for blank (${k}).`;
  else if (q.kind === 'trans') stem = esc(q.prompt);
  else stem = esc(q.prompt).replace(/_{3,}/g, '<span class="gap">______</span>').replace(/\s{4,}Student B:/, '<br>Student B:');
  if (q.img) stem = `<img class="sign" src="${q.img}" alt="Biển báo">` + stem;
  if (q.cue) stem += ` <b class="cue">(${esc(q.cue)})</b>`;
  if (q.t === 'choice') body = optsHtml(q, perm, k);
  else if (q.t === 'tf') body = `<div class="opts tf"><button type="button" class="opt" data-orig="0"><span class="k">T</span><span>True</span></button><button type="button" class="opt" data-orig="1"><span class="k">F</span><span>False</span></button></div>`;
  else {
    const pre = q.kind === 'trans' ? `<span class="prefix">→ ${esc(q.start)}</span>` : '';
    body = `<div class="typ">${pre}<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.kind === 'trans' ? 'Viết tiếp câu…' : q.kind === 'dict' ? 'Cụm 2–3 từ' : 'Dạng đúng của từ'}" aria-label="Câu ${k}"></div>`;
  }
  const t = (q.t === 'choice' || q.t === 'tf') ? 'choice' : 'text';
  return `<div class="q" id="k${k}" data-k="${k}" data-t="${t}"><div class="stem"><span class="qn">${k}</span><div class="st">${stem}</div></div>${body}<div class="fb" hidden></div></div>`;
}
function markSel(el, k){
  const v = S.cur.ans[k];
  $$('.opt', el).forEach(b => b.classList.toggle('sel', v != null && +b.dataset.orig === v));
  el.classList.toggle('answered', v != null);
}
function answeredCount(){ const c = S.cur; let a = 0; for (let k = 1; k <= 40; k++){ const v = c.ans[k]; if (v != null && String(v).trim() !== '') a++; } return a; }
function updateFoot(){
  const f = $('#foot'); f.hidden = false; const a = answeredCount();
  $('#footIn').innerHTML = `<div class="bar"><i style="width:${100 * a / 40}%"></i></div><span class="cnt">${a}/40 câu</span><button class="btn green" id="submit" type="button">Nộp bài</button>`;
  $('#submit').onclick = () => {
    const left = 40 - answeredCount();
    if (left > 0){
      $('#footIn').innerHTML = `<span class="confirm">Còn <b>${left}</b> câu chưa làm. Nộp bài luôn?</span><div class="row"><button class="btn ghost" id="cont" type="button">Làm tiếp</button><button class="btn green" id="go" type="button">Nộp bài</button></div>`;
      $('#cont').onclick = updateFoot; $('#go').onclick = () => grade(false);
    } else grade(false);
  };
}

/* ---------- grading ---------- */
function isRight(q, v){
  if (v == null || String(v).trim() === '') return false;
  if (q.t === 'choice' || q.t === 'tf') return +v === q.ans;
  if (q.kind === 'trans') return q.answers.some(a => [norm(v), norm(q.start + ' ' + v)].includes(norm(a)));
  return q.ans.some(a => norm(a) === norm(v));
}
function rightText(q, perm){
  if (q.t === 'choice'){ const pos = (perm || [0, 1, 2, 3]).indexOf(q.ans); return `${LET[pos]}. ${strip(q.opts[q.ans])}`; }
  if (q.t === 'tf') return q.ans === 0 ? 'True' : 'False';
  if (q.kind === 'trans') return q.answers[0];
  return q.ans[0];
}
function grade(restoring){
  const c = S.cur;
  if (!c.submitted){ c.submitted = true; c.elapsed = Date.now() - c.t0; }
  let right = 0; const byPart = {}, wrong = [];
  for (let k = 1; k <= 40; k++){
    const [lid, idx] = c.items[k - 1]; const q = Q(lid, idx); const v = c.ans[k]; const ok = isRight(q, v);
    if (ok) right++; else wrong.push(k);
    const part = PARTS.find(p => k >= p[2] && k <= p[3])[0];
    byPart[part] = byPart[part] || {c: 0, n: 0}; byPart[part].n++; if (ok) byPart[part].c++;
    const el = $('#k' + k); el.classList.toggle('correct', ok);
    if (q.t === 'choice' || q.t === 'tf'){
      $$('.opt', el).forEach(b => { const o = +b.dataset.orig; b.disabled = true; b.classList.remove('sel'); b.classList.toggle('right', o === q.ans); b.classList.toggle('wrong', v != null && o === +v && o !== q.ans); });
    } else { const inp = $('input', el); inp.disabled = true; inp.classList.add(ok ? 'okk' : 'bad'); }
    const fb = $('.fb', el); fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'bad');
    const blank = v == null || String(v).trim() === '';
    fb.innerHTML = `<span class="t">${ok ? '✓ Đúng.' : blank ? '✗ Chưa làm.' : '✗ Sai.'}</span>${ok ? '' : ` Đáp án: <b>${esc(rightText(q, c.perms[k - 1]))}</b>.`} ${q.expl}`;
  }
  const score = right * 0.25;
  if (!restoring){
    const st = S.stats[c.examId] || {n: 0, best: 0, last: 0}; st.n++; st.best = Math.max(st.best, score); st.last = score; S.stats[c.examId] = st;
  }
  save();
  const secs = Math.floor(c.elapsed / 1000);
  $('#result').innerHTML = `<div style="text-align:center;margin-top:14px"><div class="muted" style="font-weight:700;font-size:13px;letter-spacing:.06em">ĐIỂM (THANG 10)</div><div class="big">${score.toFixed(2).replace('.', ',')}</div><div style="font-weight:600">${score >= 8 ? 'Rất tốt! Em đã nắm vững bài.' : score >= 5 ? 'Khá ổn – xem lại các câu sai và giải thích bên dưới.' : 'Cần ôn thêm – đọc kĩ giải thích từng câu rồi làm lại.'}</div></div>
    <div class="score"><div class="tile"><b style="color:var(--good)">${right}</b><span>Câu đúng</span></div><div class="tile"><b style="color:var(--bad)">${40 - right}</b><span>Câu sai</span></div><div class="tile"><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b><span>Thời gian</span></div></div>
    <div class="tw"><table><thead><tr><th>Phần</th><th class="n">Đúng</th><th>Tỉ lệ</th></tr></thead><tbody>${PARTS.map(p => { const b = byPart[p[0]]; return `<tr><td>Phần ${p[0]} (câu ${p[2]}–${p[3]})</td><td class="n">${b.c}/${b.n}</td><td><div class="meter"><i style="width:${100 * b.c / b.n}%"></i></div></td></tr>`; }).join('')}</tbody></table></div>
    ${wrong.length ? `<p style="margin-top:10px"><b>Câu sai:</b></p><div class="wl">${wrong.map(k => `<a href="#k${k}">Câu ${k}</a>`).join('')}</div>` : '<p style="margin-top:10px"><b>Không sai câu nào!</b></p>'}
    <div class="row" style="margin-top:14px"><button class="btn" id="again" type="button">Làm lại đề này (đảo đáp án mới)</button><button class="btn ghost" id="onlyWrong" type="button">Chỉ xem câu sai</button></div>`;
  $('#again').onclick = () => newAttempt(c.examId);
  $('#onlyWrong').onclick = e => { const on = document.body.classList.toggle('hideok'); e.target.textContent = on ? 'Xem tất cả câu' : 'Chỉ xem câu sai'; };
  $('#footIn').innerHTML = `<span class="cnt">Điểm: ${score.toFixed(2).replace('.', ',')} · đúng ${right}/40</span><div class="row"><button class="btn ghost" id="fHome" type="button">Danh sách đề</button><button class="btn" id="fAgain" type="button">Làm lại (đảo đáp án)</button></div>`;
  $('#foot').hidden = false;
  $('#fHome').onclick = home; $('#fAgain').onclick = () => newAttempt(c.examId);
  if (!restoring) $('#result').scrollIntoView({block: 'start'});
}

if (S.cur && S.cur.items && !S.cur.submitted) home(); else home();
</script>
