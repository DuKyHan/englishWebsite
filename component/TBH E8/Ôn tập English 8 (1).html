<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ôn tập English 8</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: phone-first single column (max 640px). Home = winding lesson path grouped by Revision; Lesson = progress/hearts bar, question, fixed check bar that turns into a feedback sheet. */
:root{
  --bg:#F5F7FB; --card:#FFFFFF; --ink:#1D2939; --muted:#677489; --line:#E0E6EF; --line-d:#C8D1DE;
  --pri:#1B74DB; --pri-d:#145AAD; --pri-soft:#E3EEFC;
  --ok:#43A512; --ok-d:#2F7F08; --ok-soft:#E5F6D8; --ok-ink:#2B6E0A;
  --bad:#E1474C; --bad-d:#B4343A; --bad-soft:#FDE6E6; --bad-ink:#A9272D;
  --gold:#F2B000; --gold-d:#C38A00; --heart:#F0445A; --fire:#FF8A1F;
  --mark:#F5C518; --mark-soft:#FFF2BF;
  --u1:#EE7A2B; --u2:#8656EE; --u3:#1B74DB; --u4:#0E9F95; --u5:#D9417A; --u6:#B7791F; --u7:#4C5BD4;
  --f:"Nunito", "Segoe UI", system-ui, sans-serif; --f-ipa:"Noto Sans","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111924; --card:#1A2433; --ink:#E9EFF7; --muted:#97A6BB; --line:#2B394C; --line-d:#202C3B;
  --pri:#4C96F0; --pri-d:#2E6FC0; --pri-soft:#1C2E47;
  --ok:#5CC52A; --ok-d:#3F9516; --ok-soft:#1B3112; --ok-ink:#8FE063;
  --bad:#F2595E; --bad-d:#BE3B40; --bad-soft:#3A1B1E; --bad-ink:#FF9195;
  --mark:#E2B523; --mark-soft:#3A3115; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111924; --card:#1A2433; --ink:#E9EFF7; --muted:#97A6BB; --line:#2B394C; --line-d:#202C3B;
  --pri:#4C96F0; --pri-d:#2E6FC0; --pri-soft:#1C2E47;
  --ok:#5CC52A; --ok-d:#3F9516; --ok-soft:#1B3112; --ok-ink:#8FE063;
  --bad:#F2595E; --bad-d:#BE3B40; --bad-soft:#3A1B1E; --bad-ink:#FF9195;
  --mark:#E2B523; --mark-soft:#3A3115; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;font-weight:700;line-height:1.4}
@media (min-width:900px){body{font-size:19px}}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg{display:block}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.ipa{font-family:var(--f-ipa)}
u{text-decoration:none;border-bottom:3px solid var(--mark);background:var(--mark-soft);border-radius:3px}

/* chunky buttons */
.btn{border:none;border-radius:16px;padding:14px 20px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d);transition:transform .06s, box-shadow .06s, filter .15s;width:100%}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 0 0 var(--pri-d)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-d);cursor:default}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.ghost{background:var(--card);color:var(--pri);box-shadow:0 4px 0 var(--line-d);border:2px solid var(--line)}

/* ---------- home ---------- */
.hbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.hbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{font-weight:900;font-size:1.15em;color:var(--pri);letter-spacing:-.01em;flex:1}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-variant-numeric:tabular-nums}
.stat.fire{color:var(--fire)} .stat.xp{color:var(--gold)} .stat.miss{color:var(--bad)}
.icobtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 8px;color:var(--muted)}
.namecard{margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.namecard label{color:var(--muted);font-size:.9em}
.namecard input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);font-weight:800}
.unit{margin-top:22px;border-radius:18px;padding:14px 18px;color:#fff;background:var(--uc);box-shadow:0 4px 0 color-mix(in srgb, var(--uc) 70%, #000)}
.unit small{display:block;font-size:.78em;opacity:.9;letter-spacing:.08em;text-transform:uppercase}
.unit b{font-size:1.2em;font-weight:900}
.path{display:flex;flex-direction:column;align-items:center;gap:30px;padding-block:52px 6px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x));background:none;border:none;padding:0}
.disc{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--uc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb, var(--uc) 68%, #000);transition:transform .06s}
.node:active .disc{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb, var(--uc) 68%, #000)}
.node.done .disc{background:var(--gold);box-shadow:0 6px 0 var(--gold-d)}
.node.next .disc{outline:5px solid color-mix(in srgb, var(--uc) 30%, transparent);outline-offset:5px}
.nlabel{font-weight:900;text-align:center;max-width:12em}
.nlabel span{display:block;font-size:.78em;color:var(--muted);font-weight:700}
.stars{display:flex;gap:2px;justify-content:center}
.stars svg{width:18px;height:18px}
.bubble{position:absolute;top:-44px;background:var(--card);border:2px solid var(--line);color:var(--uc);font-weight:900;padding:4px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;font-size:.85em;letter-spacing:.05em}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.review{margin:26px 0 40px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.review .t{flex:1}
.review .t span{display:block;color:var(--muted);font-size:.85em}
.review .btn{width:auto}

/* ---------- lesson ---------- */
.lesson{min-height:100%;display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:14px;padding-block:14px}
.xbtn{border:none;background:none;color:var(--muted);padding:4px}
.pbar{flex:1;height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s cubic-bezier(.3,1.4,.5,1);position:relative}
.pbar i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.hearts{display:flex;align-items:center;gap:5px;color:var(--heart);font-weight:900;font-variant-numeric:tabular-nums}
.hearts.hit{animation:pulse .4s}
@keyframes pulse{40%{transform:scale(1.35)}}
.lbody{flex:1;padding-bottom:var(--padb,140px)}
.combo{color:var(--fire);font-weight:900;font-size:.9em;letter-spacing:.04em;min-height:1.3em}
.kind{font-size:1.3em;font-weight:900;margin:4px 0 14px;text-wrap:balance}
.passage{background:var(--card);border:2px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.passage summary{cursor:pointer;padding:10px 14px;color:var(--muted);font-weight:800;list-style:none;display:flex;justify-content:space-between}
.passage summary::-webkit-details-marker{display:none}
.ptext{max-height:34vh;overflow:auto;padding:0 14px 12px;font-family:var(--f-ipa);font-weight:400;line-height:1.6;font-size:.95em}
.ptext p{margin:0 0 8px}
.ptext.tr{max-height:44vh}
.trbar{position:sticky;top:0;background:var(--card);padding:2px 0 8px;z-index:1}
.chip{border:2px solid var(--pri);color:var(--pri);background:var(--pri-soft);border-radius:999px;padding:4px 12px;font-family:var(--f);font-weight:800;font-size:.85em}
.sline i{font-weight:400}
.sx{margin-bottom:.55em}
.sx .vi{font-family:var(--f-ipa);font-style:italic;color:var(--muted);font-size:.9em;line-height:1.45;border-left:3px solid var(--line);padding-left:.5em;margin-top:.1em}
.para{margin-bottom:.9em}
.gv{color:var(--ok-ink);font-style:normal}
.gvb{font-style:normal;font-weight:600}

.gap{display:inline-block;min-width:3em;border-bottom:2px solid var(--muted);text-align:center;font-weight:600;color:var(--muted);padding-inline:3px}
.gap.cur{border:2px solid var(--pri);border-radius:6px;color:var(--pri);background:var(--pri-soft)}
.gap.filled{color:var(--ok-ink);border-bottom-color:var(--ok);background:var(--ok-soft)}
.ev.on{background:var(--mark-soft);box-shadow:0 2px 0 var(--mark)}
.sent{font-size:1.25em;font-weight:800;line-height:1.5;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.blank{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--line-d);margin-inline:3px;text-align:center}
.blank.sel{border-color:var(--pri);color:var(--pri)}
.blank.fill{border-color:var(--ok);color:var(--ok-ink);background:var(--ok-soft);border-radius:6px 6px 0 0;padding-inline:4px}
.blank.wrongfill{border-color:var(--bad);color:var(--bad-ink);background:var(--bad-soft);border-radius:6px 6px 0 0;padding-inline:4px;text-decoration:line-through}
.opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--line);transition:transform .06s, box-shadow .06s, background .15s, border-color .15s;min-width:0;font-weight:800;font-size:1.05em}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8em;color:var(--muted)}
.opt .w{min-width:0}
.opt .w.big{font-size:1.3em}
.opt .sub{display:block;font-size:.72em;color:var(--muted);font-weight:700;margin-top:2px}
.opt .sub b{color:var(--ink)}
.stress{color:var(--pri);font-weight:900}
.opt.sel{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 4px 0 var(--pri)}
.opt.sel .k{border-color:var(--pri);color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.opt.right .k{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt.wrong .k{border-color:var(--bad);background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.fade{opacity:.5}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.root{display:inline-block;font-size:.72em;font-weight:900;letter-spacing:.06em;background:var(--pri-soft);color:var(--pri);border-radius:8px;padding:1px 8px;vertical-align:.15em}
.typein{width:100%;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;background:var(--card);font-size:1.2em;font-weight:800}
.typein:focus{outline:none;border-color:var(--pri)}
.typein.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)}
.typein.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink);text-decoration:line-through}
.entry{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--u6);border-radius:16px;padding:12px 16px;margin-bottom:16px;font-family:var(--f-ipa);font-weight:400;font-size:.92em}
.entry .eh b{font-family:var(--f);font-weight:900;font-size:1.3em;color:var(--u6)}
.entry .eh i{color:var(--muted)}
.entry .ed{margin-top:4px}
.entry .ev2{color:var(--muted);font-style:italic}
.entry ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.entry li span{font-style:italic}
.entry li b{font-style:normal;font-weight:600;background:var(--mark-soft);border-radius:4px;padding:0 3px}
.entry li small{display:block;color:var(--muted);font-size:.88em}
.srcsent{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:14px;font-size:1.1em}
.srcsent .l,.ex .l{display:inline-block;font-size:.66em;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-right:8px}
.line{min-height:4.2em;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 12px;border-bottom:2px solid var(--line);margin-bottom:16px;}
.line .pre{font-weight:900;font-size:1.05em;padding:6px 2px}
.line.right .tile{border-color:var(--ok);color:var(--ok-ink)}
.line.wrong .tile{border-color:var(--bad);color:var(--bad-ink)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:800;font-size:1.02em;box-shadow:0 3px 0 var(--line);transition:transform .06s}
.tile:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile[disabled]{cursor:default}
.tile.used{background:var(--line);color:transparent;box-shadow:none;border-color:var(--line)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom, 0px)}
.foot .wrap{padding-block:14px}
.foot.ok{background:var(--ok-soft);border-color:transparent}
.foot.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:46vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.3}}
.fb h3{margin:0;font-size:1.35em;font-weight:900;display:flex;align-items:center;gap:8px}
.foot.ok h3{color:var(--ok-ink)} .foot.bad h3{color:var(--bad-ink)}
.fb .ans{font-weight:900;color:var(--bad-ink)}
.ex{font-weight:700;line-height:1.45}
.ex .l{display:inline-block;font-size:.72em;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-right:6px}
.ex.vi{font-family:var(--f-ipa);font-style:italic;font-weight:400}
.ex.note{background:var(--mark-soft);border-radius:10px;padding:4px 10px;color:var(--ink)}
.foot.ok .ex{color:var(--ok-ink)} .foot.bad .ex{color:var(--bad-ink)}
.foot .ex b{font-weight:900}

/* ---------- result / modal ---------- */
.result{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:32px;text-align:center}
.result h1{margin:0;font-size:1.9em;font-weight:900;color:var(--gold);text-wrap:balance}
.result.fail h1{color:var(--heart)}
.result .who{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sc{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--card)}
.sc small{display:block;background:var(--c);color:#fff;font-weight:900;font-size:.72em;letter-spacing:.06em;text-transform:uppercase;padding:5px 4px}
.sc b{display:block;padding:12px 4px;font-size:1.4em;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums}
.bigstars{display:flex;justify-content:center;gap:10px}
.bigstars svg{width:56px;height:56px}
.bigstars svg.on{animation:pop .5s backwards}
.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.2)}}
.btns{display:flex;flex-direction:column;gap:14px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,26,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px;text-align:center}
.sheet h3{margin:0;font-size:1.3em;font-weight:900}
.sheet p{margin:0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

/* ---------- sound ---------- */
let AC=null;
function tone(seq){ if(!S.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
  seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});}catch(e){} }
const sOK=()=>tone([[660,.12],[880,.12],[1320,.22]]), sBAD=()=>tone([[220,.18,"square"],[180,.25,"square"]]), sWIN=()=>tone([[523,.14],[659,.14],[784,.14],[1047,.35]]);

const $=s=>document.querySelector(s);
const app=$("#app");
const L4="ABCD";
const und=w=>w.replace(/\[(.+?)\]/g,"<u>$1</u>");
const plain=w=>w.replace(/[\[\]]/g,"");
const word2=o=>o[0].join("");
const syl=o=>o[0].map((x,i)=>i+1===o[1]?`<span class="stress">${x.toUpperCase()}</span>`:x).join("·");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const ansOf=it=>it.type==="r1"||it.type==="r2"?it.s[1]:it.s.a;
const optsOf=it=>it.type==="r1"||it.type==="r2"?it.s[0]:it.s.o;
const isTF=it=>it.type==="r4"&&it.s.o===TF;
const isMC=it=>["r1","r2","r3","r4"].includes(it.type);
function ansText(it){ if(it.type==="wf"||it.type==="dict") return it.s.a[0]; if(it.type==="tr") return it.s.pre+" "+it.s.ans;
  const a=ansOf(it),o=optsOf(it)[a]; if(it.type==="r1")return plain(o[0]); if(it.type==="r2")return word2(o); return o;}
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const norm=x=>x.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function canCheck(it){ if(isMC(it)) return G.sel!==null; if(it.type==="tr") return G.chosen.length>0; return G.text.trim().length>0; }
function judge(it){
  if(isMC(it)) return {ok:G.sel===ansOf(it)};
  if(it.type==="tr"){ const u=norm(G.chosen.map(i=>G.tiles[i].w).join(" ")); return {ok:[it.s.ans,...(it.s.alt||[])].some(a=>norm(a)===u)}; }
  const u=norm(G.text), acc=it.s.a.map(norm);
  if(acc.includes(u)) return {ok:true};
  return {ok:false,typo:acc.some(a=>a.length>4&&lev(a,u)===1)};
}
function entryHTML(k){const e=DE[k];return `<div class="entry"><div class="eh"><b>${e.h}</b> <span class="ipa">${e.ipa}</span> <i>${e.pos}</i></div><div class="ed">${e.d}</div><div class="ev2">→ ${e.v}</div><ul>${e.ex.map(x=>`<li><span>${x[0]}</span><small>${x[1]}</small></li>`).join("")}</ul></div>`;}
function starsFor(acc){return acc>=.9?3:acc>=.7?2:1;}

function home(){
  document.documentElement.style.removeProperty("--padb");
  const nextId=(LESSONS.find(L=>!S.prog[L.id])||{}).id;
  const offs=[0,-70,-95,-60,0,60,95,70];
  let h=`<header class="hbar"><div class="wrap">
    <div class="logo">Ôn tập English 8</div>
    <span class="stat fire" title="Chuỗi ngày học">${I.fire}${S.streak}</span>

    <button class="icobtn" id="snd" aria-label="Bật/tắt âm thanh">${I.sound(S.sound)}</button>
    <button class="icobtn" id="thm" aria-label="Đổi giao diện sáng/tối">${I.moon}</button>
  </div></header><main class="wrap">

  let k=0;
  UNITS.forEach(U=>{
    h+=`<div class="unit" style="--uc:${U.c}"><small>${U.tag}</small><b>${U.name}</b></div><div class="path">`;
    LESSONS.filter(L=>L.u===U.id).forEach(L=>{
      const p=S.prog[L.id], x=offs[k++%offs.length];
      h+=`<button class="node ${p?"done":""} ${L.id===nextId?"next":""}" style="--uc:${U.c};--x:${x}px" data-l="${L.id}">
        ${L.id===nextId?`<span class="bubble">BẮT ĐẦU</span>`:""}
        <span class="disc">${p&&p.stars===3?I.crown:U.icon}</span>
        <span class="stars">${p?[1,2,3].map(i=>I.star(i<=p.stars)).join(""):""}</span>
        <span class="nlabel">${L.t}<span>${L.sub}${p?` · ${Math.round(p.acc*100)}%`:""}</span></span></button>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="review"><span style="color:var(--bad)">${I.redo}</span><div class="t">Ôn câu sai<span>${S.miss.length?`Còn ${S.miss.length} câu em từng làm sai`:"Chưa có câu sai nào. Làm bài để mở mục này."}</span></div>
    <button class="btn" id="rv" ${S.miss.length?"":"disabled"} style="width:auto">Luyện</button></div></main>`;
  app.innerHTML=h;
  app.querySelectorAll(".node").forEach(b=>b.onclick=()=>start(b.dataset.l));
  $("#rv").onclick=()=>start("review");
  $("#nm").oninput=e=>{S.name=e.target.value;save();};
  $("#snd").onclick=()=>{S.sound=!S.sound;save();home();};
  $("#thm").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";};
  const nx=app.querySelector(".node.next"); if(nx&&window.scrollY===0) nx.scrollIntoView({block:"center"});
}

/* ---------- lesson ---------- */
let G=null;
function start(id){
  let items, title;
  if(id==="review"){ items=shuffle(S.miss.map(k=>ITEMS[k]).filter(Boolean)); title="Ôn câu sai"; }
  else { const L=LESSONS.find(x=>x.id===id); items=Object.values(ITEMS).filter(it=>it.lesson===id); if(L.shuffle) items=shuffle(items); title=L.t; }
  if(!items.length) return home();
  G={id,title,queue:items.slice(),total:items.length,done:new Set(),missed:new Set(),hearts:5,combo:0,sel:null,text:"",tiles:null,chosen:[],phase:"ask",t0:Date.now()};
  window.scrollTo(0,0); lesson();
}
function lesson(){
  const it=G.queue[0], s=it.s, phase=G.phase, mc=isMC(it), ans=mc?ansOf(it):0, opts=mc?optsOf(it):[];
  const checked=phase!=="ask";
  let h=`<div class="lesson"><div class="wrap ltop">
    <button class="xbtn" id="quit" aria-label="Thoát bài học">${I.x}</button>
    <div class="pbar"><i style="width:${Math.max(4,G.done.size/G.total*100)}%"></i></div>
    <span class="hearts" id="hearts">${I.heart}${G.hearts}</span></div>
  <main class="wrap lbody">`;
  h+=`<div class="combo">${G.combo>=3?`${G.combo} câu đúng liên tiếp!`:G.queue.length>1&&G.missed.has(it.key)&&!checked?"Câu em đã làm sai, thử lại nhé":""}</div>`;
  let kind="";
  if(it.type==="r1") kind="Chọn từ có phần gạch chân <u>phát âm khác</u>";
  else if(it.type==="r2") kind="Chọn từ có <span style='color:var(--pri)'>trọng âm khác</span> ba từ còn lại";
  else if(it.type==="r3") kind="Chọn đáp án đúng để hoàn thành câu";
  else if(s.gap) kind=`Chọn từ điền vào chỗ trống (${s.gap})`;
  else if(isTF(it)) kind="Theo bài đọc, câu này đúng hay sai?";
  else if(it.type==="wf") kind="Viết dạng đúng của từ trong ngoặc";
  else if(it.type==="dict") kind="Đọc mục từ điển, điền cụm từ (2–3 từ)";
  else if(it.type==="tr") kind="Viết lại câu sao cho nghĩa không đổi";
  else kind="Chọn đáp án đúng theo bài đọc";
  h+=`<div class="kind">${kind}</div>`;

  if(it.type==="wf"||it.type==="dict"){
    if(it.type==="dict") h+=entryHTML(s.e);
    const bl=checked?`<span class="blank fill">${s.a[0]}</span>`:`<span class="blank">&nbsp;</span>`;
    h+=`<div class="sent">${s.q.replace("___",bl)}${it.type==="wf"?` <span class="root">${s.w}</span>`:""}</div>`;
    h+=`<input class="typein ${checked?(G.right?"right":"wrong"):""}" id="ti" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${it.type==="wf"?"Gõ dạng đúng của từ…":"Gõ cụm từ trong từ điển…"}" value="${esc(G.text)}" ${checked?"disabled":""}>`;
  }
  if(it.type==="tr"){
    if(!G.tiles) G.tiles=shuffle(s.ans.split(" ").concat(s.x||[])).map((w,i)=>({w,i}));
    h+=`<div class="srcsent"><span class="l">Câu gốc</span>${s.src}</div>`;
    h+=`<div class="line ${checked?(G.right?"right":"wrong"):""}"><span class="pre">${s.pre}</span>${G.chosen.map(id=>`<button class="tile" data-c="${id}" ${checked?"disabled":""}>${esc(G.tiles[id].w)}</button>`).join("")}</div>`;
    h+=`<div class="bank">${G.tiles.map(t=>{const u=G.chosen.includes(t.i);return `<button class="tile ${u?"used":""}" data-b="${t.i}" ${checked||u?"disabled":""} ${u?'aria-hidden="true" tabindex="-1"':""}>${esc(t.w)}</button>`;}).join("")}</div>`;
  }

  if(it.type==="r4"){
    const P0=P[s.p];
    const ph=passHTML(s.p,S.trans,n=>(checked&&n===s.gap)||(s.gap&&n<s.gap&&G.id!=="review")).replace(/\{(\d)\}/g,(m,n)=>{n=+n; if(n===s.gap) return `<span class="gap ${checked?"filled":"cur"}">(${n}) ${checked?opts[ans]:"_____"}</span>`;
      const doneHere=s.gap&&n<s.gap&&G.id!=="review"; const q=R4.find(x=>x.p===s.p&&x.gap===n);
      return `<span class="gap ${doneHere?"filled":""}">(${n}) ${doneHere?q.o[q.a]:"_____"}</span>`;});
    h+=`<details class="passage" open><summary>Bài đọc · ${P0.title}<span>Ẩn / hiện</span></summary><div class="ptext ${S.trans?"tr":""}" id="ptext"><div class="trbar"><button class="chip" id="trx">${S.trans?"Ẩn bản dịch":"Hiện dịch từng câu"}</button></div>${ph}</div></details>`;
  }
  if(it.type==="r3"||(it.type==="r4"&&(s.gap||/___/.test(s.q)))||(it.type==="r4"&&!s.gap)){
    let fills=s.fill||[opts[ans]], k=0;
    let q=s.q.replace(/___/g,()=>{const f=fills[k++]??"";
      if(checked) return G.right?`<span class="blank fill">${f}</span>`:`<span class="blank fill">${f}</span>`;
      if(G.sel!==null&&fills.length===1) return `<span class="blank sel">${opts[G.sel]}</span>`;
      return `<span class="blank">&nbsp;</span>`;});
    if(it.type==="r4") q=q.replace(/^\d\.\s*/,"");
    h+=`<div class="sent">${q}</div>`;
  }
  const one=it.type!=="r1"&&it.type!=="r2"&&!isTF(it)&&Math.max(0,...opts.map(o=>o.length))>16;
  if(mc) h+=`<div class="opts ${one?"one":""}">`;
  opts.forEach((o,i)=>{
    let cls="opt";
    if(!checked&&G.sel===i) cls+=" sel";
    if(checked){ if(i===ans) cls+=" right"; else if(i===G.sel) cls+=" wrong"; else cls+=" fade"; }
    let body;
    if(it.type==="r1") body=`<span class="w big">${und(o[0])}${checked?`<span class="sub ipa">${o[1]}</span>`:""}</span>`;
    else if(it.type==="r2") body=`<span class="w big">${word2(o)}${checked?`<span class="sub">${syl(o)} · <b>âm ${o[1]}</b></span>`:""}</span>`;
    else body=`<span class="w">${o}</span>`;
    const key=isTF(it)?(i?"F":"T"):L4[i];
    h+=`<button class="${cls}" data-i="${i}" ${checked?"disabled":""}><span class="k">${key}</span>${body}</button>`;
  });
  if(mc) h+=`</div>`;
  h+=`</main>`;

  // footer
  if(!checked){
    h+=`<footer class="foot" id="foot"><div class="wrap"><button class="btn" id="go" ${canCheck(it)?"":"disabled"}>Kiểm tra</button></div></footer>`;
  } else {
    const ok=G.right;
    const praise=["Chính xác!","Tuyệt vời!","Giỏi lắm!","Xuất sắc!","Đúng rồi!"][Math.random()*5|0];
    const ansShow=mc?(isTF(it)?TF[ans]:L4[ans]+". "+ansText(it)):ansText(it);
    h+=`<footer class="foot ${ok?"ok":"bad"}" id="foot"><div class="wrap"><div class="fb">
      <h3>${ok?I.check:I.cross}${ok?praise:G.typo?"Gần đúng! Sai chính tả":"Chưa đúng rồi"}</h3>
      ${ok?"":`<div class="ex">Đáp án đúng: <span class="ans">${ansShow}</span></div>`}
      ${!ok&&!mc&&G.text?`<div class="ex">Em đã gõ: <s>${esc(G.text)}</s></div>`:""}
      ${explain(it)}</div>
      <button class="btn ${ok?"ok":"bad"}" id="go">${ok?"Tiếp tục":"Đã hiểu"}</button></div></footer>`;
  }
  h+=`</div>`;
  app.innerHTML=h;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(G.phase!=="ask")return; G.sel=+b.dataset.i; tone([[520,.05]]); lesson(); });
  $("#go").onclick=()=>G.phase==="ask"?check():next();
  $("#quit").onclick=askQuit;
  const tx=$("#trx"); if(tx) tx.onclick=()=>{S.trans=!S.trans;save();lesson();};
  const ti=$("#ti");
  if(ti&&!checked){ ti.oninput=()=>{G.text=ti.value; $("#go").disabled=!canCheck(it);}; ti.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault(); if(canCheck(it)) check();}}; ti.focus({preventScroll:true}); }
  app.querySelectorAll(".bank .tile").forEach(b=>b.onclick=()=>{ if(G.phase!=="ask")return; G.chosen.push(+b.dataset.b); tone([[520,.05]]); lesson(); });
  app.querySelectorAll(".line .tile").forEach(b=>b.onclick=()=>{ if(G.phase!=="ask")return; G.chosen=G.chosen.filter(x=>x!==+b.dataset.c); lesson(); });
  const foot=$("#foot"); document.documentElement.style.setProperty("--padb",(foot.offsetHeight+24)+"px");
  if(checked) $("#go").focus({preventScroll:true});
  // focus passage
  const pt=$("#ptext");
  if(pt){ let el=pt.querySelector(".gap.cur, .gap.filled:last-of-type");
    if(s.gap) el=pt.querySelectorAll(".gap")[s.gap-1];
    if(checked&&s.ev){const e=pt.querySelector(`[data-ev="${s.ev}"]`); if(e){e.classList.add("on");el=e;}}
    if(el) pt.scrollTop=Math.max(0,el.offsetTop-pt.clientHeight/2);
  }
  if(checked&&!G.right){ const hh=$("#hearts"); hh.classList.add("hit"); }
}
function explain(it){
  const s=it.s;
  if(it.type==="r1"||it.type==="r2") return `<div class="ex">${s[2]}</div>`;
  let h="";
  if(it.type==="wf") h+=`<div class="ex"><span class="l">Từ</span><b>${s.a[0]}</b> (${s.pos})</div>`;
  if(it.type==="tr") return `<div class="ex"><span class="l">Cách đổi</span>${s.why}</div><div class="ex vi"><span class="l">Dịch</span>${s.vi}</div><div class="ex note">${s.r}</div>`;
  if(s.why) h+=`<div class="ex"><span class="l">Vì sao</span>${s.why}</div>`;
  if(s.vi) h+=`<div class="ex vi"><span class="l">Dịch</span>${s.vi}</div>`;
  if(s.no) h+=`<div class="ex"><span class="l">Loại</span>${s.no}</div>`;
  if(it.type==="r4") h+=sentLine(s);
  if(s.note) h+=`<div class="ex note">${s.note}</div>`;
  return h;
}
function check(){
  const it=G.queue[0]; if(!canCheck(it)) return;
  const j=judge(it); G.right=j.ok; G.typo=!!j.typo; G.phase="shown";
  if(G.right){ G.done.add(it.key); G.combo++; sOK(); if(G.id==="review"||!G.missed.has(it.key)) S.miss=S.miss.filter(k=>k!==it.key||G.id!=="review"); }
  else { G.hearts--; G.combo=0; G.missed.add(it.key); if(!S.miss.includes(it.key)) S.miss.push(it.key); G.queue.push(it); sBAD(); }
  save(); lesson();
}
function next(){
  G.queue.shift(); G.sel=null; G.text=""; G.tiles=null; G.chosen=[]; G.typo=false; G.phase="ask";
  if(G.hearts<=0) return fail();
  if(!G.queue.length) return finish();
  window.scrollTo(0,0); lesson();
}
function fmtTime(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function finish(){
  document.documentElement.style.removeProperty("--padb");
  const first=G.total-G.missed.size, acc=first/G.total, st=starsFor(acc);
  const xp=first*2+10+(G.missed.size===0?5:0);
  S.xp+=xp;
  const t=today(); if(S.last!==t){ const y=new Date(); y.setDate(y.getDate()-1); const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate(); S.streak=S.last===ys?S.streak+1:1; S.last=t; }
  if(G.id!=="review"){ const old=S.prog[G.id]; if(!old||acc>=old.acc) S.prog[G.id]={stars:Math.max(st,old?old.stars:0),acc}; else old.stars=Math.max(old.stars,st); }
  save(); sWIN();
  const d=new Date();
  app.innerHTML=`<main class="wrap result">
    <div class="bigstars">${[1,2,3].map(i=>I.star(i<=st)).join("")}</div>
    <h1>${G.missed.size===0?"Hoàn hảo! Không sai câu nào":"Hoàn thành bài học!"}</h1>
    <div class="who">${S.name?`<b style="color:var(--ink)">${S.name.replace(/</g,"&lt;")}</b> · `:""}${G.title} · ${d.toLocaleDateString("vi-VN")} ${d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}</div>
    <div class="cards">
      <div class="sc" style="--c:var(--gold)"><small>Tổng XP</small><b>+${xp}</b></div>
      <div class="sc" style="--c:var(--ok)"><small>Đúng ngay</small><b>${Math.round(acc*100)}%</b></div>
      <div class="sc" style="--c:var(--pri)"><small>Thời gian</small><b>${fmtTime(Date.now()-G.t0)}</b></div>
    </div>
    <div class="who">Đúng ngay lần đầu ${first}/${G.total} câu${G.missed.size?` · ${G.missed.size} câu đã được lưu vào mục “Ôn câu sai”`:""}</div>
    <div class="btns"><button class="btn" id="h">Tiếp tục</button><button class="btn ghost" id="again">Làm lại bài này</button></div></main>`;
  const id=G.id; $("#h").onclick=()=>{window.scrollTo(0,0);home();}; $("#again").onclick=()=>start(id); $("#h").focus();
}
function fail(){
  document.documentElement.style.removeProperty("--padb");
  const id=G.id;
  app.innerHTML=`<main class="wrap result fail"><div style="color:var(--heart);display:grid;place-items:center"><svg width="90" height="90" viewBox="0 0 24 24"><path fill="currentColor" opacity=".25" d="M12 21s-7.5-4.6-9.6-9.3C.8 8 3 4 6.8 4c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3C21 4 23.2 8 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg></div>
    <h1>Hết tim rồi!</h1><div class="who">Em đã làm được ${G.done.size}/${G.total} câu. Đọc lại phần giải thích rồi thử lại nhé. Các câu sai đã được lưu vào mục “Ôn câu sai”.</div>
    <div class="btns"><button class="btn" id="again">Làm lại</button><button class="btn ghost" id="h">Về trang chính</button></div></main>`;
  $("#again").onclick=()=>start(id); $("#h").onclick=home;
}
function askQuit(){
  $("#sheet").innerHTML=`<h3>Thoát bài học?</h3><p>Kết quả của bài đang làm sẽ không được lưu.</p><button class="btn" id="stay">Học tiếp</button><button class="btn ghost" id="leave" style="color:var(--bad)">Thoát</button>`;
  $("#modal").hidden=false; $("#stay").focus();
  $("#stay").onclick=()=>$("#modal").hidden=true;
  $("#leave").onclick=()=>{$("#modal").hidden=true;G=null;window.scrollTo(0,0);home();};
}
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").hidden=true;};

document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||!G||!$(".lesson")) return;
  if(e.target.tagName==="INPUT") return;
  if(!$("#modal").hidden){ if(e.key==="Escape") $("#modal").hidden=true; return; }
  const it=G.queue[0], k=e.key.toLowerCase();
  if(k==="enter"){ e.preventDefault(); G.phase==="ask"?check():next(); return; }
  if(k==="escape"){ askQuit(); return; }
  if(G.phase!=="ask") return;
  if(it.type==="tr"){ if(k==="backspace"&&G.chosen.length){G.chosen.pop();lesson();} return; }
  if(!isMC(it)) return;
  let i=-1;
  if(isTF(it)){ i=k==="t"||k==="1"?0:k==="f"||k==="2"?1:-1; }
  else { i="abcd".indexOf(k); if(i<0) i="1234".indexOf(k); if(i>=optsOf(it).length) i=-1; }
  if(i>=0){ G.sel=i; lesson(); }
});
home();
</script>

</body></html>
