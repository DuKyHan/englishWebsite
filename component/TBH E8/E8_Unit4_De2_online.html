y the gong ______.","opts":["special","different","communal","festival"],"a":3}},{"k":"q","q":{"t":"mc","n":14,"stem":"Some ______ farmers keep ducks and geese on their farms.","opts":["feature","post","soil","poultry"],"a":3}},{"k":"q","q":{"t":"mc","n":15,"stem":"We can ______ the sea from here.","opts":["raise","overlook","enrich","weave"],"a":1}},{"k":"q","q":{"t":"mc","n":16,"stem":"Viet Nam has 54 ethnic ______.","opts":["groups","levels","turkeys","fields"],"a":0}},{"k":"q","q":{"t":"mc","n":17,"stem":"The Nung mostly live in ______, though they also live in earthen houses.","opts":["bamboo flutes","wooden statues","stilt houses","travel brochures"],"a":2}}]},{"title":"III. WORD FORM","note":"Write the correct form of the word in capitals.","blocks":[{"k":"q","q":{"t":"tx","n":18,"pre":"Each time I returned, I was struck by the ","post":" of Sa Pa and its people. (UNIQUE)","acc":["uniqueness"],"show":"uniqueness"}},{"k":"q","q":{"t":"tx","n":19,"pre":"Viet Nam is a country of great cultural ","post":" with 54 ethnic groups. (DIVERSE)","acc":["diversity"],"show":"diversity"}},{"k":"q","q":{"t":"tx","n":20,"pre":"The museum collects and preserves many ","post":" artifacts of ethnic cultures. (HISTORY)","acc":["historical"],"show":"historical"}}]},{"title":"IV. READING","note":"","blocks":[{"k":"sub","text":"Read the passage and choose the best option for each numbered blank."},{"k":"passage","text":"Hill tribal markets are a distinctive feature in northern mountainous provinces in Viet Nam. Every year, these unique markets attract millions of holidaymakers who love finding out about the culture of ethnic \u003cb class=\"blank\">(1)\u003c/b> groups like the Tay, the Hmong, etc. Most flea markets take place once a week, from early morning till noon, due to the inconvenience of long \u003cb class=\"blank\">(2)\u003c/b> between neighbouring communities. Hence, on market days, these places are quite bustling \u003cb class=\"blank\">(3)\u003c/b> trade activities. Visitors can watch and buy a lot of local specialties, including corn wine, soy bean as well as five-colour sticky rice. It’s also a special occasion for the ethnic people to \u003cb class=\"blank\">(4)\u003c/b> dressed in nice colourful clothes woven by skilled women, which motivates tourists to purchase brocade products for their own use. What’s more, \u003cb class=\"blank\">(5)\u003c/b> exciting cultural events also happen at the fairs to serve the locals \u003cb class=\"blank\">(6)\u003c/b> tourists."},{"k":"q","q":{"t":"mc","n":21,"stem":"(1) ______","opts":["village","minority","country","highland"],"a":1}},{"k":"q","q":{"t":"mc","n":22,"stem":"(2) ______","opts":["directions","roads","ways","distances"],"a":3}},{"k":"q","q":{"t":"mc","n":23,"stem":"(3) ______","opts":["with","of","about","at"],"a":0}},{"k":"q","q":{"t":"mc","n":24,"stem":"(4) ______","opts":["wash","wear","get","put on"],"a":2}},{"k":"q","q":{"t":"mc","n":25,"stem":"(5) ______","opts":["a lot","many","much","a little"],"a":1}},{"k":"q","q":{"t":"mc","n":26,"stem":"(6) ______","opts":["and","but","so","nor"],"a":0}},{"k":"sub","text":"Read the passage. Choose True or False, then answer the questions."},{"k":"passage","text":"Viet Nam is a multi-ethnic country with 54 ethnic groups. The Viet (Kinh) people account for 87% of the country’s population and mainly inhabit the Red River Delta, the central coastal delta, the Mekong Delta and major cities. The other 53 ethnic minority groups, totalling over 8 million people, are scattered over mountain areas spreading from the North to the South.\nAmong ethnic minorities, the most populated are the Tay, Thai, Muong, Hoa, Khmer and Nung, with a population of around 1 million each. Meanwhile, the least populated are the Brau, Roman and Odu, with several hundred people each.\nThe main economic activity of most ethnic peoples is wet rice cultivation. Some ethnic minorities have mastered farming techniques, growing rice plants in flooded paddy fields and carry function answered(){return items.filter(function(it){var v=ans[it.q.n];return v!==undefined&&String(v).trim()!==''}).length}
function upd(){var a=answered();$('#st-done').textContent=a+'/40 câu';$('#prog').style.width=(a/40*100)+'%';$('#warn').style.display='none'}
function tick(){var s=Math.floor((Date.now()-t0)/1000);$('#st-time').textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function grade(it){
 var q=it.q,v=ans[q.n];
 if(q.t==='mc')return v===q.a;
 if(v===undefined)return false;var n=norm(v);return q.acc.some(function(a){return norm(a)===n});
}
function showAns(it){
 var q=it.q;it.box.classList.add('done');it.box.classList.toggle('ok',it.ok);it.box.classList.toggle('no',!it.ok);
 if(q.t==='mc'){[].forEach.call(it.opts.children,function(c,i){c.disabled=true;c.classList.remove('sel');if(i===q.a)c.classList.add('right');else if(i===ans[q.n])c.classList.add('wrong')});
  it.fb.textContent=it.ok?'✓ Đúng':'✗ Đáp án đúng: '+'ABCD'[q.a]+'. '+q.opts[q.a].replace(/<[^>]+>/g,'')}
 else{it.inp.readOnly=true;
  it.fb.innerHTML=it.ok?'✓ Đúng':'✗ Đáp án: '+q.show.replace(/</g,'&lt;');
  if(!it.ok){var b=el('button',null,'Tính đúng');b.type='button';b.title='Dùng khi em viết đúng nghĩa nhưng khác cách viết';b.onclick=function(){it.forced=true;it.ok=true;showAns(it);score()};it.fb.appendChild(b)}}
}
function score(){
 var right=items.filter(function(i){return i.ok}).length,pt=right*0.25;
 var rank=pt>=8?'Giỏi':pt>=6.5?'Khá':pt>=5?'Trung bình':'Cần cố gắng hơn';
 var secs=[];EXAM.secs.forEach(function(s){var qs=s.blocks.filter(function(b){return b.k==='q'}).map(function(b){return b.q.n});var r=items.filter(function(i){return qs.indexOf(i.q.n)>-1&&i.ok}).length;secs.push('<span class="chip">'+s.title.split('.')[0]+': '+r+'/'+qs.length+'</span>')});
 var nm=$('#nm').value.trim(),cl=$('#cl').value.trim();
 var r=$('#res');r.className='res on';
 r.innerHTML='<div class="row"><div class="big">'+String(pt).replace('.',',')+'<small> / 10</small></div><div><b>'+(nm?nm.replace(/</g,'&lt;')+(cl?' – '+cl.replace(/</g,'&lt;'):''):'Kết quả')+'</b><br>Xếp loại: <b>'+rank+'</b><br>Thời gian: '+$('#st-time').textContent+'</div></div><div class="chips"><span class="chip g">Đúng '+right+'</span><span class="chip b">Sai '+(40-right)+'</span>'+secs.join('')+'</div>';
}
function submit(force){
 var left=40-answered();
 if(left>0&&!force){var w=$('#warn');w.style.display='block';w.innerHTML='Còn '+left+' câu chưa làm. ';var y=el('button','btn alt','Nộp luôn');y.type='button';y.style.cssText='padding:4px 14px;font-size:15px;margin:0 6px';y.onclick=function(){submit(true)};var n=el('button','btn alt','Làm tiếp');n.type='button';n.style.cssText='padding:4px 14px;font-size:15px';n.onclick=function(){w.style.display='none'};w.appendChild(y);w.appendChild(n);return}
 submitted=true;clearInterval(timer);
 items.forEach(function(it){it.ok=grade(it);showAns(it)});
 score();$('#submit').hidden=true;$('#again').hidden=false;$('#onlywrong').hidden=false;$('#warn').style.display='none';
 window.scrollTo({top:0,behavior:'smooth'});
}
$('#submit').onclick=function(){submit(false)};
$('#again').onclick=function(){ans={};submitted=false;t0=Date.now();clearInterval(timer);timer=setInterval(tick,1000);document.body.classList.remove('hidden-ok');build();$('#res').className='res';$('#submit').hidden=false;$('#again').hidden=true;$('#onlywrong').hidden=true;upd();tick();window.scrollTo({top:0})};
$('#onlywrong').onclick=function(){var on=document.body.classList.toggle('hidden-ok');this.textContent=on?'Xem tất cả câu':'Chỉ xem câu sai'};
build();upd();tick();timer=setInterval(tick,1000);
</script>
