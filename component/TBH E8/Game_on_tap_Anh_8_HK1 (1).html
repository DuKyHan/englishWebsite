<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B70F0">
<title>Vượt Ải Anh 8</title>
<style>
:root{
  --bg:#F4F7FC; --card:#FFFFFF; --ink:#1B2430; --muted:#66748A; --line:#DDE4EF; --line2:#C9D3E3;
  --pri:#2B70F0; --pri-d:#1A55C2; --ok:#1FA45B; --ok-d:#15803F; --ok-bg:#E3F7EA; --bad:#E0434B; --bad-d:#B32A31; --bad-bg:#FDE7E8;
  --gold:#FFB020; --gold-d:#D98A00; --sel:#E6EFFE; --sel-line:#8AB0F7; --lock:#C3CCDA; --shadow:0 2px 0 rgba(20,40,80,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1621; --card:#18222F; --ink:#E8EEF6; --muted:#93A1B5; --line:#2A3746; --line2:#364557;
    --pri:#4D8BFF; --pri-d:#2F6AD8; --ok:#2BC46F; --ok-d:#1E9554; --ok-bg:#12301F; --bad:#FF5C63; --bad-d:#C93A41; --bad-bg:#3A1A1D;
    --sel:#1C2E4D; --sel-line:#4D7BD0; --lock:#3A4656; --shadow:0 2px 0 rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1621; --card:#18222F; --ink:#E8EEF6; --muted:#93A1B5; --line:#2A3746; --line2:#364557;
  --pri:#4D8BFF; --pri-d:#2F6AD8; --ok:#2BC46F; --ok-d:#1E9554; --ok-bg:#12301F; --bad:#FF5C63; --bad-d:#C93A41; --bad-bg:#3A1A1D;
  --sel:#1C2E4D; --sel-line:#4D7BD0; --lock:#3A4656; --shadow:0 2px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:2px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.2px;flex:1;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:6px 8px;border-radius:12px}
.chip.fire{color:#F0761A}.chip.xp{color:var(--gold-d)}
.iconbtn{background:none;border:0;padding:6px;border-radius:10px;cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
.iconbtn:hover{background:var(--bg)}

/* ---------- home ---------- */
.hero{margin:16px 0;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.hero h1{font-size:18px;margin:0 0 4px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.goalbar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.goalbar i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .5s}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.qbtn{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}
.qbtn:active{transform:translateY(2px);border-bottom-width:2px}
.qbtn b{display:block;font-size:15px}.qbtn small{color:var(--muted);font-size:12.5px}
.qbtn .em{font-size:26px}
.qbtn[disabled]{opacity:.55;cursor:default}
.section{margin:22px 0 8px}
.sechead{border-radius:18px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.sechead .sp{font-size:12.5px;opacity:.9;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.sechead h2{margin:2px 0 0;font-size:19px}
.sechead .em{font-size:30px}
.sechead .tipbtn{margin-left:auto;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;border-radius:12px;padding:7px 10px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.secprog{font-size:12.5px;opacity:.95;margin-top:2px}
.path{position:relative;padding:14px 0 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px}
.node .circle{width:70px;height:64px;border-radius:50%;border:0;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;transition:transform .1s}
.node .circle:active{transform:translateY(4px)}
.node .lbl{font-size:13px;font-weight:700;text-align:center;color:var(--ink);line-height:1.25}
.node.locked .circle{background:var(--lock)!important;box-shadow:0 6px 0 var(--line2)!important;cursor:pointer}
.node.locked .lbl{color:var(--muted)}
.node .stars{font-size:12px;letter-spacing:1px;color:var(--gold);min-height:14px}
.node.current .circle::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid currentColor;opacity:.35;animation:pulse 1.6s infinite}
@keyframes pulse{0%{transform:scale(.95);opacity:.5}70%{transform:scale(1.1);opacity:0}100%{opacity:0}}
.startTag{background:var(--card);border:2px solid var(--line);color:var(--pri);font-weight:800;font-size:12px;padding:3px 9px;border-radius:10px;text-transform:uppercase;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.foot{color:var(--muted);font-size:12.5px;text-align:center;padding:28px 0 40px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .22s ease-out}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.tipbox{font-size:15px}
.tipbox h4{margin:12px 0 4px;font-size:15px;color:var(--pri)}
.tipbox ul,.tipbox ol{padding-left:20px;margin:6px 0}
.tipbox li{margin:4px 0}
.tipbox p{margin:6px 0}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 16px;font-weight:800;font-size:16px;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line2);cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1}
.mt{margin-top:10px}

/* ---------- lesson ---------- */
#lesson{min-height:100vh;display:flex;flex-direction:column}
.lhead{position:sticky;top:0;background:var(--bg);z-index:10}
.lhead .wrap{display:flex;align-items:center;gap:12px;height:60px}
.pbar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:10px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);position:relative}
.hearts{font-weight:800;color:var(--bad);display:flex;align-items:center;gap:4px;font-size:17px}
.lbody{flex:1;padding-bottom:230px}
.instr{font-size:19px;font-weight:800;margin:10px 0 12px;line-height:1.3}
.tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;border-radius:8px;padding:2px 8px;margin-bottom:6px}
.qtext{font-size:18px;margin:4px 0 16px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px}
.qtext .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--muted);margin:0 2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;text-align:left;cursor:pointer;font-size:17px;display:flex;align-items:center;gap:10px;min-height:54px}
.opt .k{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt.sel{background:var(--sel);border-color:var(--sel-line)}
.opt.sel .k{border-color:var(--sel-line);color:var(--pri)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.opt u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:800;color:var(--pri)}
.opts.big .opt{justify-content:center;font-size:20px;font-weight:800}
.passage{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15.5px;max-height:42vh;overflow:auto;white-space:pre-line}
.passage .blank{background:var(--line);border-radius:6px;padding:0 6px;font-weight:700;color:var(--muted)}
.passage .blank.cur{background:var(--gold);color:#3a2600}
.passage .blank.done{background:var(--ok-bg);color:var(--ok-d)}
.ptools{display:flex;gap:8px;margin:-6px 0 12px;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--pri)}
.pill[disabled]{color:var(--muted);cursor:default;opacity:.7}
.pvi{background:var(--sel);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14.5px;white-space:pre-line}
.sign{margin:6px auto 16px;max-width:360px;border-radius:14px;padding:18px 16px;text-align:center;font-weight:800;border:5px solid;background:#fff;color:#1b1b1b;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.sign .ic{font-size:36px;display:block;margin-bottom:4px}
.sign .l0{font-size:22px;letter-spacing:.5px}
.sign .ln{font-size:16px;font-weight:700;margin-top:4px}
.sign.ban{border-color:#D32F2F}.sign.ban .l0{color:#C62828}
.sign.warn{border-color:#F2B600;background:#FFF8D6}
.sign.must{border-color:#1565C0}.sign.must .l0{color:#0D47A1}
.sign.info{border-color:#2E7D32}.sign.info .l0{color:#1B5E20}
.inp{width:100%;font-size:19px;padding:14px;border-radius:14px;border:2px solid var(--line2);background:var(--card);color:var(--ink);outline:none}
.inp:focus{border-color:var(--pri)}
.inp.right{border-color:var(--ok);background:var(--ok-bg)}.inp.wrong{border-color:var(--bad);background:var(--bad-bg)}
.hint{margin-top:10px;font-size:14px;color:var(--muted)}
.hint b{color:var(--ink)}
.dict{background:var(--card);border:2px solid var(--line);border-left:6px solid #5B6B7F;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.dict .hw{font-size:19px;font-weight:800}
.dict .ipa{color:var(--muted);margin-left:6px}
.dict .pos{font-style:italic;color:var(--muted)}
.dict ul{margin:4px 0 6px;padding-left:18px}
.dict .g{color:var(--pri);font-weight:700}
/* order */
.orig{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:17px}
.orig small{display:block;color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;margin-bottom:2px}
.ansline{min-height:110px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(to bottom,transparent 0,transparent 52px,var(--line) 52px,var(--line) 54px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.tile{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:17px;cursor:pointer;min-height:44px}
.tile.fixed{background:var(--sel);border-color:var(--sel-line);cursor:default;font-weight:700}
.tile.used{visibility:hidden}
.ansline.right .tile{border-color:var(--ok)}.ansline.wrong .tile:not(.fixed){border-color:var(--bad)}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt-i{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px;min-height:60px;cursor:pointer;font-size:15.5px;text-align:center;display:flex;align-items:center;justify-content:center}
.mt-i.sel{background:var(--sel);border-color:var(--sel-line)}
.mt-i.ok{background:var(--ok-bg);border-color:var(--ok);opacity:.55;cursor:default}
.mt-i.no{background:var(--bad-bg);border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* footer feedback */
.lfoot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);z-index:15;padding:14px 0 calc(14px + env(safe-area-inset-bottom))}
.lfoot.ok{background:var(--ok-bg);border-top-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-top-color:transparent}
.fb{max-height:52vh;overflow:auto;margin-bottom:12px}
.fb h3{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:8px}
.lfoot.ok .fb h3{color:var(--ok-d)}.lfoot.bad .fb h3{color:var(--bad-d)}
.fb .ans{font-weight:700;margin-bottom:8px}
.fb .box{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.fb .box b.t{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:2px}
.spk{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:3px 9px;font-size:14px;cursor:pointer;margin-left:auto;font-weight:700;color:var(--pri)}
/* result */
#result{min-height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px 0}
#result h1{font-size:28px;margin:10px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.stat b{display:block;font-size:12px;color:#fff;padding:4px;text-transform:uppercase}
.stat span{display:block;font-size:22px;font-weight:800;padding:10px 4px}
.bigstars{font-size:44px;letter-spacing:6px}
.bigstars .off{filter:grayscale(1);opacity:.3}
.reviewlist{text-align:left;margin-top:10px}
.reviewlist details{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14.5px}
.reviewlist summary{cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;font-size:14px;max-width:90vw;text-align:center}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:5;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.mascot{flex:none}
@media (max-width:380px){.opts.grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div id="home">
  <div class="topbar"><div class="wrap">
    <div class="brand"><svg class="mascot" width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="12" width="52" height="46" rx="18" fill="#2B70F0"/><rect x="6" y="12" width="52" height="40" rx="18" fill="#4D8BFF"/><circle cx="24" cy="32" r="8" fill="#fff"/><circle cx="40" cy="32" r="8" fill="#fff"/><circle cx="25.5" cy="33" r="4" fill="#1B2430"/><circle cx="41.5" cy="33" r="4" fill="#1B2430"/><path d="M26 44 q6 5 12 0" stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M14 12 L32 4 L50 12 L32 19 Z" fill="#1B2430"/><path d="M48 12 v9" stroke="#FFB020" stroke-width="3" stroke-linecap="round"/><circle cx="48" cy="22" r="3" fill="#FFB020"/></svg><span>Vượt Ải Anh 8</span></div>
    <div class="chip fire" title="Chuỗi ngày học">🔥 <span id="hStreak">0</span></div>
    <div class="chip xp" title="Tổng điểm kinh nghiệm">⭐ <span id="hXp">0</span></div>
    <button class="iconbtn" id="btnMenu" aria-label="Cài đặt">⚙️</button>
  </div></div>
  <div class="wrap">
    <div class="hero">
      <svg class="mascot" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="12" width="52" height="46" rx="18" fill="#2B70F0"/><rect x="6" y="12" width="52" height="40" rx="18" fill="#4D8BFF"/><circle cx="24" cy="32" r="8" fill="#fff"/><circle cx="40" cy="32" r="8" fill="#fff"/><circle cx="25.5" cy="33" r="4" fill="#1B2430"/><circle cx="41.5" cy="33" r="4" fill="#1B2430"/><path d="M26 44 q6 5 12 0" stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M14 12 L32 4 L50 12 L32 19 Z" fill="#1B2430"/><path d="M48 12 v9" stroke="#FFB020" stroke-width="3" stroke-linecap="round"/><circle cx="48" cy="22" r="3" fill="#FFB020"/></svg>
      <div style="flex:1;min-width:0">
        <h1 id="greet">Ôn thi cuối HK1 – Tiếng Anh 8</h1>
        <p id="goalTxt">Mục tiêu hôm nay: 0 / 50 XP</p>
        <div class="goalbar"><i id="goalBar" style="width:0%"></i></div>
      </div>
    </div>
    <div class="quick">
      <button class="qbtn" id="btnReview"><span class="em">🩹</span><span><b>Ôn câu sai</b><small id="wrongCnt">Chưa có câu sai</small></span></button>
      <button class="qbtn" id="btnMix"><span class="em">🏆</span><span><b>Thử thách tổng hợp</b><small>15 câu ngẫu nhiên mọi phần</small></span></button>
    </div>
    <div id="sections"></div>
    <div class="foot">Nội dung theo Đề cương ôn tập cuối HK1 Tiếng Anh 8 (2026–2027) · Ma trận 40 câu · Chơi được không cần mạng<br>Tiến độ được lưu trên chính thiết bị này.</div>
  </div>
</div>

<!-- ============ LESSON ============ -->
<div id="lesson" class="hidden">
  <div class="lhead"><div class="wrap">
    <button class="iconbtn" id="btnQuit" aria-label="Thoát" style="font-size:24px">✕</button>
    <div class="pbar"><i id="pbar" style="width:0%"></i></div>
    <div class="hearts">❤️ <span id="hearts">5</span></div>
  </div></div>
  <div class="lbody"><div class="wrap" id="qArea"></div></div>
  <div class="lfoot" id="lfoot"><div class="wrap">
    <div class="fb hidden" id="fb"></div>
    <button class="btn" id="btnCheck" disabled>Kiểm tra</button>
  </div></div>
</div>

<!-- ============ RESULT ============ -->
<div id="result" class="hidden"><div class="wrap" id="resArea"></div></div>

<div id="modal" class="overlay hidden"><div class="sheet" id="sheet"></div></div>

<script>
/* ===== DỮ LIỆU CÂU HỎI – theo Đề cương ôn tập cuối HK1 Anh 8 (2026–2027) ===== */
const P=(o,a,ex,vi)=>({t:'mcq',kind:'pron',o:o.split('|'),a,ex,vi});
const S=(o,a,ex,vi)=>({t:'mcq',kind:'stress',o:o.split('|'),a,ex,vi});
const C=(q,o,a,ex,vi)=>({t:'mcq',q,o:o.split('|'),a,ex,vi});
const TF=(q,a,ex,vi)=>({t:'mcq',kind:'tf',q,o:['True','False'],a:a?0:1,fixed:true,ex,vi});
const SG=(lines,k,o,a,ex,vi)=>({t:'mcq',kind:'sign',sign:{lines:lines.split('|'),k},q:'What does the sign / notice say?',o:o.split('|'),a,ex,vi});
const I=(q,a,h,ex,vi,e)=>({t:'input',q,a:a.split('|'),h,ex,vi,e});
const O=(q,s,ans,d,ex,vi,alts)=>({t:'order',q,s,ans,d:d.split('|'),ex,vi,alts:alts?alts.split('|'):[]});

{title:'Unit 3: Tuổi teen',qs:[

C('Many students feel stressed because of ______ pressure – they want to be like their friends.','media|forum|peer|account',2,'<b>peer pressure</b> = áp lực từ bạn bè đồng trang lứa (muốn giống bạn bè). media: truyền thông; forum: diễn đàn; account: tài khoản.','Nhiều học sinh cảm thấy căng thẳng vì áp lực đồng trang lứa – các em muốn giống bạn bè mình.'),

C('Lan is under a lot of ______ because she has three tests next week.','pressure|forum|notification|session',0,'<b>be under (a lot of) pressure</b> = chịu (nhiều) áp lực. forum: diễn đàn; notification: thông báo; session: buổi, phiên. <i>(Câu 10 – Đề tham khảo)</i>','Lan đang chịu nhiều áp lực vì tuần tới bạn ấy có ba bài kiểm tra.'),
MT('cyberbullying=bắt nạt trên mạng;concentrate on=tập trung vào;midterm test=bài kiểm tra giữa kì;mature=trưởng thành, chín chắn;stressful=gây căng thẳng')

C('The Hmong people grow rice on ______ fields on the mountainsides.','terraced|stilt|communal|open-air',0,'<b>terraced fields</b> = ruộng bậc thang, làm trên sườn núi. stilt đi với house; communal đi với house; open-air đi với market.','Người Hmông trồng lúa trên ruộng bậc thang ở sườn núi.'),

{title:'Unit 5: Phong tục & Lễ hội',qs:[

/* ---------------- 4. NGỮ PHÁP ---------------- */
{id:'gram',part:'Phần I · Câu 11',title:'Ngữ pháp',icon:'🧩',color:'#E07A1F',
instr:'Chọn đáp án đúng để hoàn thành câu',
tip:`<ul><li><b>enjoy / fancy / adore / detest / dislike / don't mind + V-ing</b>; like / love / hate / prefer + V-ing hoặc to V; would like + to V.</li><li><b>So sánh hơn trạng từ</b>: trạng từ ngắn + -er (harder, faster); trạng từ dài: more + adv (more carefully). Bất quy tắc: well → better, badly → worse.</li><li><b>Câu hỏi</b>: What (cái gì), Where (ở đâu), How far (bao xa), How often (bao lâu một lần), How many + N đếm được, How much + N không đếm được.</li><li><b>Lượng từ</b>: many / a few + N đếm được số nhiều; much / a little + N không đếm được.</li><li><b>Mạo từ</b>: a + phụ âm, an + nguyên âm (theo cách đọc); the + sông, biển, vật duy nhất, so sánh nhất.</li><li><b>If loại 1</b>: If + S + V(s/es), S + will + V.</li></ul>`,
lessons:[
{title:'Sở thích & so sánh trạng từ',qs:[
C('In her free time, Mai likes ______ DIY projects like making paper flowers.','doing|do|to doing|does',0,'<b>like + V-ing</b> (hoặc like + to V). "to doing" sai cấu trúc; do / does không đứng ngay sau like.','Vào thời gian rảnh, Mai thích làm các món đồ tự làm (DIY) như làm hoa giấy.'),
C('My grandfather doesn\'t mind ______ up early to water the plants.','get|to get|getting|got',2,'<b>don\'t / doesn\'t mind + V-ing</b> = không ngại làm gì.','Ông tôi không ngại dậy sớm để tưới cây.'),
C('My little brother enjoys ______ with Lego bricks.','play|to play|playing|plays',2,'<b>enjoy + V-ing</b> = thích làm gì. Không dùng enjoy + to V. <i>(Câu 11 – Đề tham khảo)</i>','Em trai tôi thích chơi với những viên gạch Lego.'),
C('Lan studies ______ than her brother, so she always gets better marks.','hard|harder|more hard|more hardly',1,'Có <b>than</b> → so sánh hơn. <i>hard</i> là trạng từ ngắn → <b>harder</b>. Chú ý: hardly nghĩa là "hầu như không", không phải trạng từ của hard.','Lan học chăm chỉ hơn anh trai, vì vậy bạn ấy luôn được điểm cao hơn.'),
C('City people seem to live ______ than people in the countryside.','more busily|busier|more busy|busily',0,'Cần <b>trạng từ</b> bổ nghĩa cho động từ <i>live</i>: busily là trạng từ dài (đuôi -ly) → <b>more busily</b> than. busier / more busy là tính từ.','Người thành phố dường như sống bận rộn hơn người ở nông thôn.'),
C('Nam speaks English ______ than any other student in my class.','good|well|better|more well',2,'Có <b>than</b> → so sánh hơn. Trạng từ well (giỏi) có dạng so sánh bất quy tắc <b>better</b>. good là tính từ; "more well" sai.','Nam nói tiếng Anh giỏi hơn bất kì học sinh nào khác trong lớp tôi.')
]},
{title:'Câu hỏi, lượng từ, mạo từ',qs:[
C('______ do the Hmong people usually wear on special occasions? – Colourful costumes.','What|Where|Who|Why',0,'Câu trả lời là một vật (trang phục) → hỏi bằng <b>What</b> (cái gì).','Người Hmông thường mặc gì vào những dịp đặc biệt? – Những bộ trang phục sặc sỡ.'),
C('______ is it from Ha Noi to Sa Pa? – About 320 kilometres.','How long|How far|How often|How much',1,'Câu trả lời là khoảng cách (320 km) → <b>How far</b> (bao xa). How long: bao lâu; How often: bao lâu một lần; How much: bao nhiêu (giá, lượng không đếm được).','Từ Hà Nội đến Sa Pa bao xa? – Khoảng 320 ki-lô-mét.'),
C('We don\'t have ______ rice left. Let\'s buy some more.','much|many|a few|few',0,'<b>rice</b> là danh từ không đếm được → dùng <b>much</b>. many, a few, few dùng với danh từ đếm được số nhiều.','Chúng ta không còn nhiều gạo. Hãy mua thêm một ít nhé.'),
C('______ Mekong River flows through six countries.','A|An|The|Ø',2,'Trước <b>tên sông</b> dùng mạo từ <b>the</b>: the Mekong River, the Red River.','Sông Mê Kông chảy qua sáu quốc gia.'),
C('My cousin is ______ engineer, and he works in ______ city centre.','a – the|an – the|an – a|the – an',1,'<b>an</b> + engineer (bắt đầu bằng nguyên âm /e/); <b>the</b> city centre (trung tâm thành phố – nơi đã xác định).','Anh họ tôi là kĩ sư và anh ấy làm việc ở trung tâm thành phố.'),
C('If it ______ tomorrow, we will stay at home.','rains|will rain|rained|raining',0,'<b>Câu điều kiện loại 1</b>: If + S + V hiện tại đơn, S + will + V. Mệnh đề If <u>không</u> dùng will → <b>rains</b>.','Nếu ngày mai trời mưa, chúng tôi sẽ ở nhà.')
]}
]},
/* ---------------- 5. LIÊN TỪ & GIỚI TỪ ---------------- */
{id:'link',part:'Phần I · Câu 12–13',title:'Liên từ & Giới từ',icon:'🔗',color:'#D6457A',
instr:'Chọn đáp án đúng để hoàn thành câu',
tip:`<h4>Liên từ</h4><ul><li>Sau dấu phẩy giữa câu: <b>and</b> (và), <b>but</b> (nhưng), <b>so</b> (nên), <b>or</b> (hoặc), <b>for</b> (vì).</li><li>Sau dấu chấm phẩy: <b>however</b> (tuy nhiên), <b>therefore</b> (vì vậy), <b>otherwise</b> (nếu không thì), <b>moreover</b> (hơn nữa).</li><li><b>because / although + mệnh đề</b>; <b>because of / despite + cụm danh từ</b>.</li></ul><h4>Giới từ hay gặp</h4><p>keen on, fond of, interested in, crazy about, good at, famous for, proud of, similar to, different from, take part in, log on to, concentrate on, under pressure.</p><p><b>Thời gian</b>: at + giờ, at Tet, at the weekend · on + thứ, ngày cụ thể (on the 15th day) · in + tháng, năm, mùa.</p>`,
lessons:[
{title:'Liên từ',qs:[
C('It rained heavily; ______, the festival still took place.','therefore|however|so|because',1,'Hai vế <b>trái ngược</b> (mưa to – lễ hội vẫn diễn ra), đứng sau dấu chấm phẩy → <b>however</b> (tuy nhiên).','Trời mưa to; tuy nhiên, lễ hội vẫn diễn ra.'),
C('Hoa felt very tired, ______ she went to bed early.','but|so|or|for',1,'Vế 2 là <b>kết quả</b> của vế 1 (mệt → đi ngủ sớm) → <b>so</b> (vì vậy).','Hoa cảm thấy rất mệt, vì vậy bạn ấy đi ngủ sớm.'),
C('You should switch off your phone in class; ______, you won\'t concentrate on the lesson.','however|therefore|otherwise|moreover',2,'<b>otherwise</b> = nếu không thì (nếu không tắt điện thoại thì sẽ không tập trung được).','Em nên tắt điện thoại trong giờ học; nếu không, em sẽ không tập trung vào bài học được.'),
C('Ba wanted to buy a new laptop; ______, he didn\'t have enough money.','therefore|however|so|because',1,'Hai vế trái ngược (muốn mua – không đủ tiền), sau dấu chấm phẩy → <b>however</b>. <i>(Câu 12 – Đề tham khảo)</i>','Ba muốn mua một chiếc máy tính xách tay mới; tuy nhiên, bạn ấy không có đủ tiền.'),
C('______ the heavy rain, the farmers still worked in the field.','Although|Despite|Because|So',1,'Sau chỗ trống là <b>cụm danh từ</b> (the heavy rain) và hai vế trái ngược → <b>Despite</b> (mặc dù). Although phải đi với mệnh đề (S + V).','Mặc dù trời mưa to, những người nông dân vẫn làm việc trên cánh đồng.'),
C('We stayed at home ______ it was very cold.','because|so|but|because of',0,'Vế sau là <b>lý do</b> và là một mệnh đề (it was…) → <b>because</b>. because of chỉ đi với danh từ / V-ing.','Chúng tôi ở nhà vì trời rất lạnh.')
]},
{title:'Giới từ',qs:[
MT('keen on=thích;famous for=nổi tiếng về;proud of=tự hào về;similar to=giống với;different from=khác với'),
C('My sister is crazy ______ taking photos of flowers.','on|about|in|at',1,'<b>be crazy about</b> = mê, phát cuồng vì.','Chị gái tôi mê chụp ảnh hoa.'),
C('Duong Lam Village is famous ______ its ancient laterite houses.','for|with|of|at',0,'<b>be famous for</b> = nổi tiếng về.','Làng Đường Lâm nổi tiếng với những ngôi nhà cổ bằng đá ong.'),
C('The Mid-Autumn Festival takes place ______ the 15th day of the 8th lunar month.','in|at|on|for',2,'<b>on</b> + ngày cụ thể (on the 15th day, on Monday).','Tết Trung thu diễn ra vào ngày 15 tháng 8 âm lịch.'),
C('My grandmother is good ______ making traditional cakes.','on|at|in|for',1,'<b>be good at</b> = giỏi về. <i>(Câu 13 – Đề tham khảo)</i>','Bà tôi giỏi làm các loại bánh truyền thống.'),
C('Lan is interested ______ learning about the cultures of ethnic groups.','on|in|at|about',1,'<b>be interested in</b> = quan tâm, thích thú.','Lan thích tìm hiểu về văn hóa của các dân tộc.'),
C('We usually visit our grandparents ______ Tet.','in|on|at|for',2,'<b>at Tet</b> = vào dịp Tết (giống at Christmas, at the weekend).','Chúng tôi thường về thăm ông bà vào dịp Tết.'),
MT('take part in=tham gia;look after=chăm sóc;cope with=đối phó với;belong to=thuộc về;under pressure=chịu áp lực')
]}
]},
/* ---------------- 6. GIAO TIẾP ---------------- */
{id:'comm',part:'Phần I · Câu 14',title:'Chức năng giao tiếp',icon:'💬',color:'#0E9BB5',
instr:'Chọn câu đáp lại phù hợp nhất',
tip:`<ul><li>Lời mời <i>Would you like to…?</i> → <b>I'd love to.</b> / I'd love to, but I'm busy.</li><li>Lời khen → <b>Thank you.</b> / That's very kind of you.</li><li>Lời cảm ơn → <b>You're welcome. / It's my pleasure.</b></li><li>Xin lỗi → <b>That's all right. / Never mind.</b></li><li>Gợi ý <i>Let's… / Why don't we…?</i> → <b>That's a good idea!</b></li><li><i>Do you mind if I…?</i> → đồng ý thì nói <b>No, not at all. / Not at all. Go ahead.</b></li><li>Chúc mừng → <b>Thank you (very much).</b></li></ul><p>Mẹo: xác định chức năng câu của A trước, cẩn thận "bẫy lặp từ".</p>`,
lessons:[
{title:'Đáp lời trong hội thoại',qs:[
C('A: "Would you like to go to the flower festival with me this Sunday?"<br>B: "______"','Yes, I like flowers.|I\'d love to. What time?|No, I wouldn\'t.|You\'re welcome.',1,'Đây là <b>lời mời</b> → nhận lời bằng <b>I\'d love to</b>. "Yes, I like flowers" là bẫy lặp từ; "No, I wouldn\'t" bất lịch sự; "You\'re welcome" dùng để đáp lời cảm ơn.','A: "Chủ nhật này bạn có muốn đi lễ hội hoa với mình không?" – B: "Mình rất thích. Mấy giờ vậy?"'),
C('A: "Your áo dài is so beautiful!"<br>B: "______"','Thank you. My mum made it for me.|Yes, it is.|I don\'t think.|Not at all.',0,'Đáp lại <b>lời khen</b> → <b>Thank you</b>. "Yes, it is" thiếu lịch sự; "Not at all" dùng cho Do you mind…?','A: "Chiếc áo dài của bạn đẹp quá!" – B: "Cảm ơn bạn. Mẹ mình may cho mình đấy."'),
C('A: "Thank you for helping me with my DIY project."<br>B: "______"','That\'s right.|It\'s my pleasure.|Yes, please.|Good idea.',1,'Đáp lại <b>lời cảm ơn</b> → <b>It\'s my pleasure</b> / You\'re welcome.','A: "Cảm ơn bạn đã giúp mình làm dự án DIY." – B: "Đó là niềm vui của mình mà."'),
C('A: "I think life in the countryside is more peaceful than in the city."<br>B: "______ The air is fresher, too."','I don\'t agree.|I completely agree.|Never mind.|Of course not.',1,'Câu sau "The air is fresher, too" (không khí cũng trong lành hơn) cho thấy B <b>đồng ý</b> → <b>I completely agree</b>.','A: "Mình nghĩ cuộc sống ở nông thôn yên bình hơn ở thành phố." – B: "Mình hoàn toàn đồng ý. Không khí cũng trong lành hơn nữa."'),
C('A: "Do you mind if I use your laptop for a moment?"<br>B: "______"','Yes, sure.|Not at all. Go ahead.|I\'m sorry for that.|Congratulations!',1,'<b>Do you mind…?</b> nghĩa là "Bạn có phiền không…?" → đồng ý thì trả lời <b>Not at all</b> (không phiền chút nào). "Yes, sure" lại có nghĩa là "Có, phiền đấy".','A: "Bạn có phiền không nếu mình dùng máy tính xách tay của bạn một lát?" – B: "Không phiền đâu. Cứ dùng đi."'),
C('A: "Congratulations on winning the first prize!"<br>B: "______"','Thank you very much.|Never mind.|You\'re welcome.|Yes, I do.',0,'Đáp lại <b>lời chúc mừng</b> → <b>Thank you (very much)</b>. <i>(Câu 14 – Đề tham khảo)</i>','A: "Chúc mừng bạn đã đạt giải nhất!" – B: "Cảm ơn bạn rất nhiều."'),
C('A: "I\'m sorry for being late."<br>B: "______"','That\'s all right.|You\'re welcome.|Congratulations!|Yes, please.',0,'Đáp lại <b>lời xin lỗi</b> → <b>That\'s all right</b> / Never mind / No problem.','A: "Xin lỗi, mình đến muộn." – B: "Không sao đâu."'),
C('A: "Let\'s visit my grandparents\' farm this weekend."<br>B: "______"','That\'s a good idea!|Not at all.|It\'s my pleasure.|No, I don\'t.',0,'Đáp lại <b>lời gợi ý</b> (Let\'s…) → <b>That\'s a good idea!</b> / Great! / Sounds fun.','A: "Cuối tuần này mình đến thăm trang trại của ông bà mình đi." – B: "Ý hay đấy!"')
]}
]},
/* ---------------- 7. BIỂN BÁO ---------------- */
{id:'sign',part:'Phần II · Câu 15–16',title:'Biển báo – Thông báo',icon:'🚸',color:'#C9302C',
instr:'Biển báo / thông báo này có nghĩa là gì?',
tip:`<ul><li><b>Cấm</b> (vòng tròn đỏ): NO + V-ing, DO NOT…, PROHIBITED, NOT ALLOWED → <i>You must not… / You are not allowed to…</i></li><li><b>Bắt buộc</b> (vòng tròn xanh): MUST, REQUIRED → <i>You have to… / You must…</i></li><li><b>Cảnh báo</b> (tam giác vàng): CAUTION, WARNING, DANGER, MIND… → <i>Be careful…</i></li><li><b>Thông tin</b>: OUT OF ORDER (hỏng), STAFF ONLY, CLOSED ON… </li></ul><p>Bẫy: chú ý ONLY, EXCEPT, giờ và ngày trên biển; should (nên) khác must (phải).</p>`,
lessons:[
{title:'Biển cấm & cảnh báo',qs:[
MT('No smoking=Cấm hút thuốc;No littering=Cấm xả rác;Keep off the grass=Không giẫm lên cỏ;Wet floor=Sàn ướt;Beware of the dog=Coi chừng chó dữ'),
SG('NO SWIMMING|DEEP WATER','ban','You can swim here because the water is deep.|You must not swim here because the water is deep.|You should learn to swim in deep water.|Swimming is only allowed in the morning.',1,'<b>NO + V-ing</b> = cấm làm gì → <i>You must not swim here</i>. Các đáp án khác sai nghĩa (cho phép bơi, khuyên học bơi, thêm thông tin "buổi sáng" không có trên biển).','Biển: CẤM BƠI – NƯỚC SÂU. → Bạn không được bơi ở đây vì nước sâu.'),
SG('PLEASE KEEP OFF THE GRASS','ban','Do not walk on the grass.|Cut the grass regularly.|You can sit on the grass.|Water the grass every day.',0,'<b>Keep off the grass</b> = không giẫm/đi lên cỏ → <i>Do not walk on the grass</i>.','Biển: VUI LÒNG KHÔNG GIẪM LÊN CỎ. → Không đi lên cỏ.'),
SG('CAUTION|WET FLOOR','warn','Clean the floor now.|Be careful because the floor may be slippery.|Do not use water on the floor.|The floor is dry and safe.',1,'<b>CAUTION</b> = chú ý, cẩn thận; <b>WET FLOOR</b> = sàn ướt → sàn có thể trơn, hãy cẩn thận.','Biển: CHÚ Ý – SÀN ƯỚT. → Hãy cẩn thận vì sàn có thể trơn trượt.'),
SG('LIBRARY – SILENCE PLEASE|Mobile phones must be switched off.','must','You can talk quietly on the phone.|You must keep quiet and turn off your phone.|Phones are sold in the library.|Only students can use phones here.',1,'<b>Silence please</b> = xin giữ im lặng; <b>must be switched off</b> = phải tắt → giữ im lặng và tắt điện thoại.','Biển: THƯ VIỆN – XIN GIỮ IM LẶNG. Điện thoại di động phải được tắt. → Bạn phải giữ im lặng và tắt điện thoại.'),
SG('PAGODA|Please take off your shoes before entering.','must','Leave your shoes outside before going in.|You can buy shoes here.|Shoes are not sold in the pagoda.|Wear your shoes when you enter.',0,'<b>take off your shoes</b> = cởi giày → để giày bên ngoài trước khi vào.','Biển: CHÙA – Vui lòng cởi giày trước khi vào. → Hãy để giày bên ngoài trước khi đi vào.'),
SG('STAFF ONLY','info','Everyone can enter this room.|Only people who work here can enter.|Staff must stay outside.|Visitors should wait for the staff here.',1,'<b>STAFF ONLY</b> = chỉ dành cho nhân viên → chỉ người làm việc ở đây mới được vào.','Biển: CHỈ DÀNH CHO NHÂN VIÊN. → Chỉ những người làm việc ở đây mới được vào.'),
SG('NO PHOTOGRAPHY|IN THE MUSEUM','ban','You can take photos here.|You must not take photos in the museum.|You can buy photos in the museum.|Photos of the museum are free.',1,'<b>NO PHOTOGRAPHY</b> = cấm chụp ảnh. <i>(Câu 15 – Đề tham khảo)</i>','Biển: CẤM CHỤP ẢNH TRONG BẢO TÀNG. → Bạn không được chụp ảnh trong bảo tàng.')
]},
{title:'Thông báo & kĩ năng mềm',qs:[
SG('TICKET OFFICE|Open: 8 a.m. – 5 p.m.|Closed on Mondays','info','You can buy tickets on Monday morning.|The office opens at 5 p.m.|You can\'t buy tickets here on Mondays.|The office is open all day, every day.',2,'<b>Closed on Mondays</b> = đóng cửa vào thứ Hai → thứ Hai không mua được vé. Mở cửa 8 giờ sáng (không phải 5 giờ chiều).','Biển: PHÒNG VÉ – Mở cửa: 8 giờ sáng – 5 giờ chiều. Đóng cửa vào thứ Hai. → Bạn không thể mua vé ở đây vào thứ Hai.'),
SG('NO LITTERING|Fine: 200,000 VND','ban','You will be fined if you throw rubbish here.|You can buy a bin for 200,000 VND.|Rubbish collection costs 200,000 VND.|You will get 200,000 VND for picking up litter.',0,'<b>No littering</b> = cấm xả rác; <b>Fine</b> = tiền phạt → xả rác sẽ bị phạt 200.000 đồng.','Biển: CẤM XẢ RÁC – Phạt: 200.000 đồng. → Bạn sẽ bị phạt nếu vứt rác ở đây.'),
SG('LIFT OUT OF ORDER|Please use the stairs.','info','The lift is not working, so use the stairs.|Line up in order to use the lift.|The stairs are closed today.|The lift is for staff only.',0,'<b>Out of order</b> = bị hỏng, không hoạt động → thang máy hỏng, hãy đi cầu thang bộ. (Bẫy: "in order" là theo thứ tự.)','Biển: THANG MÁY BỊ HỎNG – Vui lòng đi cầu thang bộ. → Thang máy không hoạt động, vì vậy hãy đi cầu thang bộ.'),
SG('ONLINE SAFETY TIP|Never share your password with anyone.','info','You should give your password to your friends.|Keep your password secret.|Change your password every day.|Post your password on social media.',1,'<b>Never share your password</b> = không bao giờ chia sẻ mật khẩu → giữ bí mật mật khẩu.','Biển: MẸO AN TOÀN TRÊN MẠNG – Không bao giờ chia sẻ mật khẩu với bất kì ai. → Hãy giữ bí mật mật khẩu của bạn.'),
SG('FIRE EXIT|KEEP CLEAR','must','Don\'t put anything in front of this door.|You can make a fire here.|Use this door only when there is no fire.|Keep this door locked at all times.',0,'<b>Fire exit</b> = lối thoát hiểm; <b>Keep clear</b> = để trống, không cản lối → đừng để đồ vật trước cửa này.','Biển: LỐI THOÁT HIỂM – ĐỂ TRỐNG. → Không để bất cứ thứ gì trước cửa này.'),
SG('THINK BEFORE YOU POST','info','Post as many photos as possible.|Consider carefully before sharing something online.|Never use social media.|You should only post at night.',1,'<b>Think before you post</b> = suy nghĩ trước khi đăng → cân nhắc kĩ trước khi chia sẻ lên mạng.','Biển: HÃY SUY NGHĨ TRƯỚC KHI ĐĂNG. → Hãy cân nhắc kĩ trước khi chia sẻ điều gì đó lên mạng.'),
SG('MIND YOUR HEAD|Low ceiling','warn','Be careful not to hit your head.|Think carefully before you go in.|You must not wear a hat here.|The ceiling is very high.',0,'<b>Mind your head</b> = cẩn thận đụng đầu; <b>Low ceiling</b> = trần thấp. (Bẫy: mind ở đây không phải "suy nghĩ".) <i>(Câu 16 – Đề tham khảo)</i>','Biển: CẨN THẬN ĐỤNG ĐẦU – Trần thấp. → Hãy cẩn thận kẻo đụng đầu.'),
MT('Out of order=Bị hỏng, không hoạt động;Staff only=Chỉ dành cho nhân viên;Fire exit=Lối thoát hiểm;Mandatory=Bắt buộc;Fine=Tiền phạt')
]}
]},
/* ---------------- 8. ĐỌC ĐIỀN TỪ ---------------- */
{id:'cloze',part:'Phần III · Câu 17–22',title:'Đọc điền từ',icon:'📝',color:'#3D8B37',
instr:'Đọc đoạn văn và chọn đáp án đúng cho chỗ trống',
tip:`<ol><li>Đọc lướt cả đoạn để nắm chủ đề.</li><li>Xét 4 đáp án: cùng gốc từ khác loại → xác định vị trí cần N/adj/adv; cùng động từ khác dạng → nhìn động từ phía trước (enjoy + V-ing, help + V, want + to V); liên từ → xét quan hệ nghĩa câu trước – câu sau; giới từ → nhớ cụm cố định.</li><li>Đọc lại cả câu với đáp án đã chọn.</li></ol><p>Mẹo: làm câu ngữ pháp, giới từ trước (nhanh, chắc điểm), câu từ vựng sau.</p>`,
lessons:[
{title:'Đoạn A – Leisure time (DIY)',
passage:'Many teenagers today are (1) ______ about doing DIY. DIY stands (2) ______ "do it yourself". It is a great way to spend your free time because it helps you become more (3) ______. For example, you can make a pencil case (4) ______ old jeans or decorate your bedroom with paper flowers. DIY also helps you save money. (5) ______, you should be careful when you use tools like scissors or glue guns. If you are interested (6) ______ DIY, why don\'t you start with a simple project this weekend?',
pvi:'Ngày nay nhiều bạn trẻ rất mê làm đồ DIY. DIY là viết tắt của "do it yourself" (tự mình làm). Đó là một cách tuyệt vời để dành thời gian rảnh vì nó giúp bạn trở nên sáng tạo hơn. Ví dụ, bạn có thể làm hộp bút từ quần jean cũ hoặc trang trí phòng ngủ bằng hoa giấy. DIY cũng giúp bạn tiết kiệm tiền. Tuy nhiên, bạn nên cẩn thận khi dùng các dụng cụ như kéo hay súng bắn keo. Nếu bạn thích DIY, sao bạn không bắt đầu với một dự án đơn giản vào cuối tuần này?',
qs:[
C('(1)','keen|crazy|fond|interested',1,'Sau chỗ trống là <b>about</b> → <b>crazy about</b> (mê). keen đi với on, fond đi với of, interested đi với in.','Ngày nay nhiều bạn trẻ rất mê làm đồ DIY.'),
C('(2)','by|for|with|of',1,'<b>stand for</b> = là viết tắt của.','DIY là viết tắt của "do it yourself" (tự mình làm).'),
C('(3)','create|creative|creatively|creation',1,'Sau <b>become more</b> cần <b>tính từ</b> → creative (sáng tạo).','Nó giúp bạn trở nên sáng tạo hơn.'),
C('(4)','from|at|on|in',0,'<b>make sth from sth</b> = làm cái gì từ cái gì.','Bạn có thể làm hộp bút từ quần jean cũ.'),
C('(5)','However|Therefore|Because|So',0,'Câu trước nói lợi ích (tiết kiệm tiền), câu sau là lời lưu ý → quan hệ <b>tương phản</b>, đứng đầu câu có dấu phẩy → <b>However</b>.','Tuy nhiên, bạn nên cẩn thận khi dùng các dụng cụ như kéo hay súng bắn keo.'),
C('(6)','on|at|in|about',2,'<b>be interested in</b> = quan tâm, thích thú.','Nếu bạn thích DIY, sao bạn không bắt đầu với một dự án đơn giản vào cuối tuần này?')
]},
{title:'Đoạn B – Life in the countryside',
passage:'My grandparents live in a small village in Nam Dinh. Life there is much more (1) ______ than in the city. There are no tall buildings or heavy traffic, and the air is fresh. Every morning, my grandfather gets up early to (2) ______ the cattle to the field. My grandmother grows vegetables and (3) ______ the chickens. The villagers are very (4) ______; they always smile and invite visitors into their homes. Last summer, I helped my grandparents (5) ______ the rice. It was hard work, but I enjoyed it. People in the countryside work (6) ______ than people in the city, but they seem happier.',
pvi:'Ông bà tôi sống ở một ngôi làng nhỏ ở Nam Định. Cuộc sống ở đó yên bình hơn nhiều so với ở thành phố. Không có nhà cao tầng hay giao thông đông đúc, và không khí trong lành. Mỗi sáng, ông tôi dậy sớm để lùa đàn gia súc ra đồng. Bà tôi trồng rau và cho gà ăn. Dân làng rất hiếu khách; họ luôn mỉm cười và mời khách vào nhà. Hè năm ngoái, tôi đã giúp ông bà gặt lúa. Đó là công việc vất vả nhưng tôi rất thích. Người ở nông thôn làm việc vất vả hơn người ở thành phố, nhưng họ dường như hạnh phúc hơn.',
qs:[
C('(1)','peace|peaceful|peacefully|peacefulness',1,'Sau <b>is much more</b> cần <b>tính từ</b> (so sánh hơn) → peaceful (yên bình).','Cuộc sống ở đó yên bình hơn nhiều so với ở thành phố.'),
C('(2)','herd|milk|load|dry',0,'<b>herd the cattle to the field</b> = lùa gia súc ra đồng. milk: vắt sữa; load: chất hàng; dry: phơi.','Mỗi sáng, ông tôi dậy sớm để lùa đàn gia súc ra đồng.'),
C('(3)','feeds|rides|catches|flies',0,'<b>feed the chickens</b> = cho gà ăn. Chủ ngữ số ít (my grandmother) và song song với grows → feeds.','Bà tôi trồng rau và cho gà ăn.'),
C('(4)','hospitable|vast|picturesque|well-trained',0,'Vế sau "luôn mỉm cười và mời khách vào nhà" → <b>hospitable</b> (hiếu khách). vast (rộng lớn), picturesque (đẹp như tranh) dùng cho cảnh vật.','Dân làng rất hiếu khách; họ luôn mỉm cười và mời khách vào nhà.'),
C('(5)','harvest|harvesting|harvested|harvests',0,'<b>help + sb + V (nguyên mẫu)</b> → helped my grandparents harvest.','Hè năm ngoái, tôi đã giúp ông bà gặt lúa.'),
C('(6)','hard|harder|more hardly|hardly',1,'Có <b>than</b> → so sánh hơn của trạng từ ngắn hard → <b>harder</b>.','Người ở nông thôn làm việc vất vả hơn người ở thành phố, nhưng họ dường như hạnh phúc hơn.')
]},
{title:'Đoạn C – Teenagers & social media',
passage:'Nowadays, social media plays an important role in teenagers\' lives. Many students (1) ______ on to their accounts every day to chat with friends or share photos. Social media can be useful (2) ______ students can join online forums to discuss their schoolwork. However, spending too much time online can make teens (3) ______ and tired. Some students even become victims of cyberbullying. (4) ______ this reason, teenagers should use social media wisely. They should not share personal information, (5) ______ they should tell an adult if someone bullies them online. Parents and teachers should also help teens (6) ______ a healthy balance between online and offline activities.',
pvi:'Ngày nay, mạng xã hội đóng vai trò quan trọng trong cuộc sống của thanh thiếu niên. Nhiều học sinh đăng nhập vào tài khoản mỗi ngày để trò chuyện với bạn bè hoặc chia sẻ ảnh. Mạng xã hội có thể hữu ích vì học sinh có thể tham gia các diễn đàn trực tuyến để thảo luận bài vở. Tuy nhiên, dành quá nhiều thời gian trên mạng có thể khiến thanh thiếu niên căng thẳng và mệt mỏi. Một số học sinh thậm chí trở thành nạn nhân của bắt nạt trên mạng. Vì lý do này, thanh thiếu niên nên sử dụng mạng xã hội một cách khôn ngoan. Các em không nên chia sẻ thông tin cá nhân, và nên báo cho người lớn nếu ai đó bắt nạt mình trên mạng. Cha mẹ và thầy cô cũng nên giúp thanh thiếu niên giữ sự cân bằng lành mạnh giữa hoạt động trực tuyến và ngoài đời thực.',
qs:[
C('(1)','log|upload|browse|connect',0,'<b>log on to</b> = đăng nhập vào.','Nhiều học sinh đăng nhập vào tài khoản mỗi ngày để trò chuyện với bạn bè hoặc chia sẻ ảnh.'),
C('(2)','although|because|but|so',1,'Vế sau giải thích <b>lý do</b> mạng xã hội hữu ích → <b>because</b>.','Mạng xã hội có thể hữu ích vì học sinh có thể tham gia các diễn đàn trực tuyến để thảo luận bài vở.'),
C('(3)','stress|stressful|stressed|stressfully',2,'<b>make + sb + adj</b>; chỉ cảm xúc của người (teens) → <b>stressed</b> (bị căng thẳng). stressful dùng cho sự vật gây căng thẳng.','Tuy nhiên, dành quá nhiều thời gian trên mạng có thể khiến thanh thiếu niên căng thẳng và mệt mỏi.'),
C('(4)','Because|For|With|By',1,'<b>For this reason</b> = vì lý do này.','Vì lý do này, thanh thiếu niên nên sử dụng mạng xã hội một cách khôn ngoan.'),
C('(5)','and|or|but|so',0,'Hai vế đều là lời khuyên, bổ sung cho nhau → <b>and</b> (thêm ý).','Các em không nên chia sẻ thông tin cá nhân, và nên báo cho người lớn nếu ai đó bắt nạt mình trên mạng.'),
C('(6)','keep|keeping|kept|keeps',0,'<b>help + sb + V (nguyên mẫu)</b> → help teens keep.','Cha mẹ và thầy cô cũng nên giúp thanh thiếu niên giữ sự cân bằng lành mạnh giữa hoạt động trực tuyến và ngoài đời thực.')
]},
{title:'Đề tham khảo – Câu 17–22',
passage:'Leisure time is very important for teenagers. After hours of studying at school, students need time to relax and (1) ______ their energy. There are many leisure activities to choose from. Some students like (2) ______ the net or messaging friends. Others prefer outdoor activities (3) ______ cycling, playing football or flying kites. Outdoor activities are good for our health (4) ______ they help us build muscle strength and keep fit. However, we should not spend too (5) ______ time on screens. Experts say that teenagers should do at least 60 minutes of physical activity every day. So, turn off your phone and go outside (6) ______ some fresh air!',
pvi:'Thời gian rảnh rất quan trọng đối với thanh thiếu niên. Sau nhiều giờ học ở trường, học sinh cần thời gian để thư giãn và lấy lại năng lượng. Có nhiều hoạt động giải trí để lựa chọn. Một số bạn thích lướt mạng hoặc nhắn tin với bạn bè. Những bạn khác thích các hoạt động ngoài trời như đạp xe, đá bóng hay thả diều. Hoạt động ngoài trời tốt cho sức khỏe vì chúng giúp ta tăng sức mạnh cơ bắp và giữ dáng. Tuy nhiên, chúng ta không nên dành quá nhiều thời gian cho màn hình. Các chuyên gia nói rằng thanh thiếu niên nên vận động ít nhất 60 phút mỗi ngày. Vậy nên, hãy tắt điện thoại và ra ngoài tận hưởng không khí trong lành!',
qs:[
C('(1)','recover|lose|spend|waste',0,'<b>recover their energy</b> = lấy lại năng lượng (hợp nghĩa sau khi học nhiều giờ). lose: mất; spend: tiêu; waste: lãng phí.','Sau nhiều giờ học ở trường, học sinh cần thời gian để thư giãn và lấy lại năng lượng.'),
C('(2)','surf|surfing|surfed|surfs',1,'<b>like + V-ing</b>, song song với messaging → <b>surfing</b> the net.','Một số bạn thích lướt mạng hoặc nhắn tin với bạn bè.'),
C('(3)','such as|for example|like as|so as',0,'<b>such as</b> = chẳng hạn như, dùng để liệt kê ví dụ ngay giữa câu. "for example" thường đứng đầu câu và có dấu phẩy; "like as", "so as" sai.','Những bạn khác thích các hoạt động ngoài trời như đạp xe, đá bóng hay thả diều.'),
C('(4)','so|but|because|although',2,'Vế sau giải thích <b>lý do</b> hoạt động ngoài trời tốt cho sức khỏe → <b>because</b>.','Hoạt động ngoài trời tốt cho sức khỏe vì chúng giúp ta tăng sức mạnh cơ bắp và giữ dáng.'),
C('(5)','many|much|few|a lot',1,'<b>time</b> là danh từ không đếm được → <b>too much time</b> (quá nhiều thời gian).','Tuy nhiên, chúng ta không nên dành quá nhiều thời gian cho màn hình.'),
C('(6)','enjoy|to enjoy|enjoying|enjoyed',1,'<b>to + V</b> chỉ mục đích: ra ngoài <i>để</i> tận hưởng → <b>to enjoy</b>.','Vậy nên, hãy tắt điện thoại và ra ngoài tận hưởng không khí trong lành!')
]}
]},
/* ---------------- 9. ĐỌC HIỂU ---------------- */
{id:'read',part:'Phần IV · Câu 23–28',title:'Đọc hiểu',icon:'📖',color:'#8A5A2B',
instr:'Đọc đoạn văn và trả lời câu hỏi',
tip:`<p><b>True / False</b>: đọc câu hỏi trước, gạch chân từ khóa (tên, số, thời gian), dò trong bài. Giống ý (dù khác từ) → True; sai chi tiết, đổi đối tượng (men ↔ women, North ↔ South), thêm "only / all / always" → False.</p><p><b>Trắc nghiệm</b>: ý chính → chọn đáp án bao quát toàn bài; từ quy chiếu (they, it, he or she) → đọc câu chứa từ đó và câu ngay trước; EXCEPT → tìm 3 đáp án có trong bài, chọn đáp án còn lại.</p><p>Cặp từ đồng nghĩa: take place = be held; be good at = be skilful at; most = the majority of; famous = well-known.</p>`,
lessons:[
{title:'Đoạn A – The Tay people',
passage:'The Tay are the largest ethnic minority group in Viet Nam, with a population of about 1.8 million people. They live mainly in the northern mountainous provinces such as Cao Bang, Lang Son and Bac Kan. Most Tay people live in villages near rivers or streams, and their houses are usually stilt houses made of wood and bamboo. Living on stilts keeps them safe from wild animals and floods.\n\nThe Tay are good at farming. They grow wet rice in paddy fields and on terraced fields, and they also raise livestock such as buffaloes, pigs and chickens. Tay women are skilful at weaving. They make beautiful cloth and brocade bags, and their traditional costumes are usually dark indigo.\n\nThe Tay have a rich culture. "Then" singing, often performed with a "tinh" lute, is a famous folk art of the Tay and is recognised by UNESCO. During festivals, Tay people play folk games and enjoy special foods like five-colour sticky rice.',
pvi:'Người Tày là dân tộc thiểu số đông dân nhất Việt Nam, với khoảng 1,8 triệu người. Họ sống chủ yếu ở các tỉnh miền núi phía Bắc như Cao Bằng, Lạng Sơn và Bắc Kạn. Hầu hết người Tày sống trong những bản làng gần sông suối, và nhà của họ thường là nhà sàn làm bằng gỗ và tre. Sống trên nhà sàn giúp họ an toàn trước thú dữ và lũ lụt.\n\nNgười Tày giỏi làm nông. Họ trồng lúa nước trên cánh đồng và ruộng bậc thang, đồng thời chăn nuôi gia súc như trâu, lợn và gà. Phụ nữ Tày khéo léo trong việc dệt vải. Họ làm ra những tấm vải và túi thổ cẩm đẹp, và trang phục truyền thống của họ thường có màu chàm sẫm.\n\nNgười Tày có nền văn hóa phong phú. Hát Then, thường được biểu diễn cùng đàn tính, là một loại hình nghệ thuật dân gian nổi tiếng của người Tày và được UNESCO công nhận. Trong các lễ hội, người Tày chơi trò chơi dân gian và thưởng thức những món ăn đặc biệt như xôi ngũ sắc.',
qs:[
TF('The Tay are the largest ethnic minority group in Viet Nam.',true,'Bài viết: "<i>The Tay are the largest ethnic minority group in Viet Nam</i>" → đúng y như câu hỏi.','Người Tày là dân tộc thiểu số đông dân nhất Việt Nam.'),
TF('Most Tay people live in the southern part of Viet Nam.',false,'Bài viết: "<i>They live mainly in the <b>northern</b> mountainous provinces</i>" → họ sống ở miền <b>Bắc</b>, không phải miền Nam.','Hầu hết người Tày sống ở miền Nam Việt Nam.'),
TF('Stilt houses help protect the Tay from floods and wild animals.',true,'Bài viết: "<i>Living on stilts keeps them safe from wild animals and floods.</i>" (keep safe from = protect from).','Nhà sàn giúp người Tày tránh khỏi lũ lụt và thú dữ.'),
TF('Tay men are famous for weaving brocade.',false,'Bài viết: "<i>Tay <b>women</b> are skilful at weaving.</i>" → phụ nữ, không phải đàn ông (bẫy đổi đối tượng).','Đàn ông Tày nổi tiếng về nghề dệt thổ cẩm.'),
C('What is the passage mainly about?','Farming methods in the north|The life and culture of the Tay people|Stilt houses in Viet Nam|UNESCO heritage in Viet Nam',1,'Bài có 3 đoạn: nơi ở – công việc – văn hóa của người Tày → ý chính bao quát là <b>cuộc sống và văn hóa của người Tày</b>. Các đáp án khác chỉ là một chi tiết nhỏ.','Đoạn văn chủ yếu nói về điều gì? → Cuộc sống và văn hóa của người Tày.'),
C('The word "They" in paragraph 2 refers to ______.','paddy fields|the Tay|buffaloes|terraced fields',1,'Câu ngay trước: "<i>The Tay are good at farming.</i>" → "They grow wet rice…" nghĩa là <b>người Tày</b> trồng lúa.','Từ "They" ở đoạn 2 chỉ người Tày.')
]},
{title:'Đoạn B – The Mid-Autumn Festival',
passage:'The Mid-Autumn Festival, or Tet Trung Thu, takes place on the 15th day of the eighth lunar month, when the moon is the fullest and brightest. In the past, it was a time for farmers to celebrate the end of the harvest and to thank the gods for good crops. Today, it is mainly a festival for children.\n\nA few weeks before the festival, shops and streets are full of colourful lanterns in many shapes, such as stars, fish and rabbits. Families buy mooncakes, which are often filled with lotus seeds, green beans or mixed nuts, to give to relatives and friends. On the night of the festival, children carry lanterns and walk around their neighbourhood. They also watch lion dances, which people believe bring good luck. Later, families sit together, eat mooncakes, drink tea and admire the full moon. For many Vietnamese people, the Mid-Autumn Festival is a time of family bonding and happy memories.',
pvi:'Tết Trung thu diễn ra vào ngày 15 tháng 8 âm lịch, khi trăng tròn và sáng nhất. Ngày xưa, đó là dịp để nông dân mừng kết thúc mùa gặt và tạ ơn thần linh vì mùa màng bội thu. Ngày nay, đó chủ yếu là lễ hội dành cho trẻ em.\n\nVài tuần trước lễ hội, các cửa hàng và đường phố tràn ngập đèn lồng đủ màu sắc với nhiều hình dạng như ngôi sao, con cá và con thỏ. Các gia đình mua bánh trung thu, thường có nhân hạt sen, đậu xanh hoặc thập cẩm, để biếu họ hàng và bạn bè. Vào đêm hội, trẻ em cầm đèn lồng đi quanh xóm. Các em cũng xem múa lân – điệu múa mà mọi người tin rằng mang lại may mắn. Sau đó, các gia đình ngồi bên nhau, ăn bánh trung thu, uống trà và ngắm trăng tròn. Với nhiều người Việt Nam, Tết Trung thu là dịp gắn kết gia đình và lưu giữ những kỉ niệm vui vẻ.',
qs:[
TF('The Mid-Autumn Festival is held when the moon is the fullest.',true,'Bài viết: "<i>takes place on the 15th day of the eighth lunar month, when the moon is the fullest and brightest</i>" (take place = be held).','Tết Trung thu được tổ chức khi trăng tròn nhất.'),
TF('In the past, the festival was mainly for children.',false,'Bài viết: "<i>In the past, it was a time for <b>farmers</b>… Today, it is mainly a festival for children.</i>" → ngày xưa dành cho nông dân, <b>ngày nay</b> mới dành cho trẻ em.','Ngày xưa, lễ hội chủ yếu dành cho trẻ em.'),
TF('Lanterns are made only in the shape of stars.',false,'Bài viết: "<i>lanterns in many shapes, such as stars, fish and rabbits</i>" → có nhiều hình dạng, không chỉ ngôi sao (bẫy từ "only").','Đèn lồng chỉ được làm hình ngôi sao.'),
TF('People believe that lion dances bring good luck.',true,'Bài viết: "<i>lion dances, which people believe bring good luck</i>".','Mọi người tin rằng múa lân mang lại may mắn.'),
C('Mooncakes may be filled with all of the following EXCEPT ______.','lotus seeds|green beans|mixed nuts|sticky rice',3,'Bài viết nêu nhân bánh: "<i>lotus seeds, green beans or mixed nuts</i>". <b>sticky rice</b> (gạo nếp, xôi) không được nhắc đến → đáp án.','Bánh trung thu có thể có tất cả các loại nhân sau, NGOẠI TRỪ: xôi (gạo nếp).'),
C('Which is the best title for the passage?','How to make mooncakes|The Mid-Autumn Festival in Viet Nam|Lantern shops in Ha Noi|Harvest time in the countryside',1,'Cả bài nói về nguồn gốc và các hoạt động của Tết Trung thu → tiêu đề bao quát: <b>Tết Trung thu ở Việt Nam</b>.','Tiêu đề phù hợp nhất cho đoạn văn là gì? → Tết Trung thu ở Việt Nam.')
]},
{title:'Đoạn C – Tet customs',
passage:'Tet, or the Lunar New Year, is the most important festival in Viet Nam. Before Tet, people clean and decorate their houses. In the North, people usually buy peach blossoms, while in the South, people prefer apricot blossoms. Many families also put a kumquat tree in their living room as a symbol of wealth.\n\nVietnamese people follow many customs during Tet. On the first day, the first visitor to a house is very important because people believe he or she will bring luck for the whole year. Children wear new clothes and wish their grandparents and parents a long and healthy life. In return, they receive lucky money in red envelopes. People also avoid sweeping the floor during the first days of Tet because they are afraid of sweeping away good luck. Today, some families travel during Tet instead of staying at home, but most people still return to their hometowns for family reunions.',
pvi:'Tết, hay Tết Nguyên đán, là lễ hội quan trọng nhất ở Việt Nam. Trước Tết, mọi người dọn dẹp và trang trí nhà cửa. Ở miền Bắc, người ta thường mua hoa đào, còn ở miền Nam người ta chuộng hoa mai. Nhiều gia đình còn đặt một cây quất trong phòng khách như biểu tượng của sự giàu có.\n\nNgười Việt Nam giữ nhiều phong tục trong dịp Tết. Vào mùng một, người đầu tiên đến nhà (xông đất) rất quan trọng vì người ta tin rằng người đó sẽ mang lại may mắn cho cả năm. Trẻ em mặc quần áo mới và chúc ông bà, cha mẹ sống lâu, mạnh khỏe. Đáp lại, các em nhận tiền lì xì trong phong bao đỏ. Mọi người cũng tránh quét nhà trong những ngày đầu năm vì sợ quét mất may mắn. Ngày nay, một số gia đình đi du lịch trong dịp Tết thay vì ở nhà, nhưng hầu hết mọi người vẫn trở về quê để đoàn tụ gia đình.',
qs:[
TF('Peach blossoms are popular in the North of Viet Nam at Tet.',true,'Bài viết: "<i>In the North, people usually buy peach blossoms</i>".','Hoa đào được ưa chuộng ở miền Bắc Việt Nam vào dịp Tết.'),
TF('The kumquat tree is a symbol of long life.',false,'Bài viết: "<i>a kumquat tree… as a symbol of <b>wealth</b></i>" → biểu tượng của sự giàu có, không phải sống lâu.','Cây quất là biểu tượng của sự sống lâu.'),
TF('Children give lucky money to their grandparents.',false,'Bài viết: "<i>In return, they <b>receive</b> lucky money</i>" → trẻ em <b>nhận</b> tiền lì xì, không phải cho.','Trẻ em lì xì cho ông bà.'),
TF('Some families now go travelling during Tet.',true,'Bài viết: "<i>Today, some families travel during Tet instead of staying at home</i>".','Ngày nay một số gia đình đi du lịch trong dịp Tết.'),
C('Why do people avoid sweeping the floor during the first days of Tet?','Because they are too busy.|Because they don\'t want to sweep away good luck.|Because the floor is already clean.|Because the first visitor will do it.',1,'Bài viết: "<i>because they are afraid of sweeping away good luck</i>" (sợ quét mất may mắn = không muốn quét đi may mắn).','Tại sao người ta tránh quét nhà trong những ngày đầu năm? → Vì họ không muốn quét mất may mắn.'),
C('The words "he or she" in paragraph 2 refer to ______.','the first visitor|the grandparent|the child|the host',0,'Câu chứa từ: "<i>the first visitor to a house is very important because people believe he or she will bring luck</i>" → <b>người đến nhà đầu tiên</b>.','Cụm "he or she" ở đoạn 2 chỉ người đầu tiên đến nhà (người xông đất).')
]},
{title:'Đề tham khảo – Câu 23–28',
passage:'The Gong Festival in the Central Highlands\n\nThe Space of Gong Culture in the Central Highlands of Viet Nam was recognised by UNESCO as a Masterpiece of the Oral and Intangible Heritage of Humanity in 2005. Every year, many provinces in the Central Highlands such as Gia Lai, Kon Tum and Dak Lak hold gong festivals.\n\nFor ethnic groups such as the Ede, the Ba Na and the Gia Rai, gongs are not only musical instruments but also sacred objects. People believe that every gong has its own god, and the older the gong is, the more powerful its god is. Gongs are played at important events in a person\'s life, from birth to death, and in ceremonies such as the new rice celebration.\n\nDuring the festival, people gather around a fire in front of the communal house. Men play the gongs while women in colourful traditional costumes dance in a circle. Visitors can also enjoy rice wine, grilled meat and other local specialities. The festival is a great chance for tourists to learn about the culture of the ethnic minorities in the Central Highlands.',
pvi:'Lễ hội Cồng chiêng ở Tây Nguyên\n\nKhông gian văn hóa Cồng chiêng Tây Nguyên của Việt Nam được UNESCO công nhận là Kiệt tác Di sản Văn hóa Phi vật thể và Truyền khẩu của Nhân loại vào năm 2005. Hằng năm, nhiều tỉnh ở Tây Nguyên như Gia Lai, Kon Tum và Đắk Lắk tổ chức lễ hội cồng chiêng.\n\nĐối với các dân tộc như Ê Đê, Ba Na và Gia Rai, cồng chiêng không chỉ là nhạc cụ mà còn là vật linh thiêng. Người ta tin rằng mỗi chiếc cồng đều có vị thần riêng, và chiếc cồng càng cổ thì vị thần càng quyền năng. Cồng chiêng được đánh trong những sự kiện quan trọng của đời người, từ khi sinh ra đến khi mất đi, và trong các nghi lễ như lễ mừng lúa mới.\n\nTrong lễ hội, mọi người tụ họp quanh đống lửa trước nhà rông. Đàn ông đánh cồng chiêng trong khi phụ nữ mặc trang phục truyền thống sặc sỡ múa thành vòng tròn. Du khách cũng có thể thưởng thức rượu cần, thịt nướng và các đặc sản địa phương khác. Lễ hội là cơ hội tuyệt vời để du khách tìm hiểu văn hóa của các dân tộc thiểu số ở Tây Nguyên.',
qs:[
TF('The Space of Gong Culture was recognised by UNESCO in 2005.',true,'Bài viết: "<i>…was recognised by UNESCO… in 2005</i>".','Không gian văn hóa Cồng chiêng được UNESCO công nhận năm 2005.'),
TF('Gong festivals are only held in Gia Lai province.',false,'Bài viết: "<i><b>many provinces</b>… such as Gia Lai, Kon Tum and Dak Lak hold gong festivals</i>" → nhiều tỉnh, không chỉ Gia Lai (bẫy "only").','Lễ hội cồng chiêng chỉ được tổ chức ở tỉnh Gia Lai.'),
TF('People believe that older gongs have more powerful gods.',true,'Bài viết: "<i>the older the gong is, the more powerful its god is</i>".','Người ta tin rằng những chiếc cồng cổ hơn có vị thần quyền năng hơn.'),
TF('During the festival, women play the gongs and men dance.',false,'Bài viết: "<i><b>Men</b> play the gongs while <b>women</b>… dance</i>" → bị đảo ngược đối tượng.','Trong lễ hội, phụ nữ đánh cồng chiêng còn đàn ông nhảy múa.'),
C('Where do people gather during the festival?','In a pagoda|In front of the communal house|At the market|In the rice fields',1,'Bài viết: "<i>people gather around a fire in front of the communal house</i>".','Mọi người tụ họp ở đâu trong lễ hội? → Trước nhà rông.'),
C('What is the passage mainly about?','How to play the gongs|The gong festival and its meaning|Rice wine in the Central Highlands|Traditional costumes of the Ede',1,'Bài nói về sự công nhận của UNESCO, ý nghĩa thiêng liêng của cồng chiêng và hoạt động trong lễ hội → <b>lễ hội cồng chiêng và ý nghĩa của nó</b>.','Đoạn văn chủ yếu nói về điều gì? → Lễ hội cồng chiêng và ý nghĩa của nó.')
]}
]},
/* ---------------- 10. DẠNG TỪ ---------------- */
{id:'wf',part:'Phần V · Câu 29–34',title:'Dạng từ (Word form)',icon:'🔤',color:'#B8860B',
instr:'Viết dạng đúng của từ trong ngoặc',
tip:`<ul><li><b>Danh từ</b>: sau a/an/the, my/his…, sau tính từ, sau giới từ, trước "of".</li><li><b>Tính từ</b>: trước danh từ; sau be, feel, become, get, make + O; sau very, so, more.</li><li><b>Trạng từ</b>: bổ nghĩa động từ; đứng trước tính từ; đầu câu có dấu phẩy.</li><li><b>Động từ</b>: sau can/will/should, sau to, sau help/let/make + O.</li></ul><p><b>-ed / -ing</b>: người cảm thấy → stressed, entertained; sự vật gây ra → stressful, entertaining.</p><p>15 họ từ: act, connect, entertain, collect, peace, develop, diverse, farm, participate, stress, expect, popular, strong, ethnic, tradition.</p>`,
lessons:[
{title:'act · connect · entertain',qs:[
I('Swimming is the most popular leisure ______ among teenagers in my neighbourhood. (act)','activity','Cần danh từ','Sau "the most popular leisure" cần <b>danh từ</b>: leisure <b>activity</b> = hoạt động giải trí.','Bơi lội là hoạt động giải trí phổ biến nhất với thanh thiếu niên trong khu tôi ở.'),
I('My grandmother is over 80, but she is still very ______. (act)','active','Cần tính từ','Sau "is still very" cần <b>tính từ</b> → <b>active</b> (năng động).','Bà tôi đã hơn 80 tuổi nhưng vẫn còn rất năng động.'),
I('Students should take part ______ in school activities. (act)','actively','Cần trạng từ','Bổ nghĩa cho động từ "take part" → cần <b>trạng từ</b>: <b>actively</b> (một cách tích cực).','Học sinh nên tham gia tích cực vào các hoạt động của trường.'),
I('Without an Internet ______, we can\'t join the online class. (connect)','connection','Cần danh từ','Sau "an Internet" cần <b>danh từ</b> → Internet <b>connection</b> (kết nối Internet).','Không có kết nối Internet, chúng ta không thể tham gia lớp học trực tuyến.'),
I('I couldn\'t finish the online test because I got ______ from the Internet. (connect)','disconnected','Cần tính từ – nghĩa phủ định','Sau "got" cần <b>tính từ</b>; nghĩa là không làm xong bài vì <i>bị mất</i> kết nối → phủ định: <b>disconnected</b>.','Tôi không thể làm xong bài kiểm tra trực tuyến vì bị mất kết nối Internet.'),
I('Watching comedies is a form of ______ for the whole family. (entertain)','entertainment','Cần danh từ','Sau "a form of" cần <b>danh từ</b> → <b>entertainment</b> (sự giải trí).','Xem phim hài là một hình thức giải trí cho cả gia đình.'),
I('The magic show was really ______; all the children laughed a lot. (entertain)','entertaining','Cần tính từ đuôi -ing','Sau "was really" cần <b>tính từ</b>; chủ ngữ là sự vật (buổi diễn) gây ra cảm xúc → đuôi -ing: <b>entertaining</b>.','Buổi biểu diễn ảo thuật thật sự thú vị; tất cả trẻ em đều cười rất nhiều.'),
I('The comedy was so ______ that everyone laughed all the time. (entertain)','entertaining','Cần tính từ đuôi -ing','Cấu trúc <b>so + adj + that</b>; vở hài kịch (sự vật) → <b>entertaining</b>. <i>(Câu 33 – Đề tham khảo)</i>','Vở hài kịch thú vị đến mức mọi người cười suốt.')
]},
{title:'collect · peace · develop · diverse',qs:[
I('My brother has a big ______ of foreign stamps. (collect)','collection','Cần danh từ chỉ vật','Sau "a big" cần <b>danh từ</b>; nói về đồ vật (tem) → <b>collection</b> (bộ sưu tập).','Anh trai tôi có một bộ sưu tập tem nước ngoài lớn.'),
I('He is a famous coin ______; he has more than 2,000 old coins. (collect)','collector','Cần danh từ chỉ người','Chủ ngữ "He is a famous coin…" → <b>danh từ chỉ người</b>: <b>collector</b> (người sưu tầm).','Ông ấy là một nhà sưu tầm tiền xu nổi tiếng; ông có hơn 2.000 đồng xu cổ.'),
I('My uncle is a stamp ______; he has thousands of stamps. (collect)','collector','Cần danh từ chỉ người','"My uncle is a stamp…" → <b>danh từ chỉ người</b>: <b>collector</b>. <i>(Câu 32 – Đề tham khảo)</i>','Chú tôi là một người sưu tầm tem; chú có hàng nghìn con tem.'),
I('Life in the countryside is quiet and ______. (peace)','peaceful','Cần tính từ','Sau "is quiet and" cần <b>tính từ</b> song song với quiet → <b>peaceful</b> (yên bình).','Cuộc sống ở nông thôn yên tĩnh và yên bình.'),
I('The baby is sleeping ______ in her mother\'s arms. (peace)','peacefully','Cần trạng từ','Bổ nghĩa cho động từ "is sleeping" → <b>trạng từ</b>: <b>peacefully</b>.','Em bé đang ngủ yên bình trong vòng tay mẹ.'),
I('My grandparents live a ______ life in the countryside. (peace)','peaceful','Cần tính từ','Trước danh từ "life" cần <b>tính từ</b> → a <b>peaceful</b> life. <i>(Câu 29 – Đề tham khảo)</i>','Ông bà tôi sống một cuộc sống yên bình ở nông thôn.'),
I('The ______ of technology has changed the way teenagers learn. (develop)','development','Cần danh từ','Cấu trúc <b>The + N + of</b> → <b>development</b> (sự phát triển).','Sự phát triển của công nghệ đã thay đổi cách thanh thiếu niên học tập.'),
I('Viet Nam is a ______ country with a fast-growing economy. (develop)','developing','Cần tính từ','Trước danh từ "country" cần <b>tính từ</b> → <b>developing</b> country (nước đang phát triển).','Việt Nam là một quốc gia đang phát triển với nền kinh tế tăng trưởng nhanh.'),
I('Viet Nam is famous for its cultural ______ with 54 ethnic groups. (diverse)','diversity','Cần danh từ','Sau "its cultural" cần <b>danh từ</b> → cultural <b>diversity</b> (sự đa dạng văn hóa).','Việt Nam nổi tiếng về sự đa dạng văn hóa với 54 dân tộc.')
]},
{title:'farm · participate · stress · expect',qs:[
I('Most ______ in my village grow rice and raise cattle. (farm)','farmers','Cần danh từ chỉ người, số nhiều','Sau "Most" cần danh từ số nhiều; người trồng lúa, nuôi gia súc → <b>farmers</b> (nông dân).','Hầu hết nông dân ở làng tôi trồng lúa và nuôi gia súc.'),
I('Modern machines make ______ easier than before. (farm)','farming','Cần danh từ chỉ công việc','make + <b>O</b> + adj: tân ngữ là danh từ chỉ công việc → <b>farming</b> (việc làm nông).','Máy móc hiện đại làm cho việc làm nông dễ dàng hơn trước.'),
I('All ______ in the singing contest will receive a small gift. (participate)','participants','Cần danh từ chỉ người, số nhiều','Sau "All" cần danh từ số nhiều chỉ người (nhận quà) → <b>participants</b> (người tham gia).','Tất cả người tham gia cuộc thi hát sẽ nhận được một món quà nhỏ.'),
I('Her active ______ in class activities impressed her teacher. (participate)','participation','Cần danh từ chỉ sự việc','Sau "Her active" cần <b>danh từ</b> chỉ sự việc → <b>participation</b> (sự tham gia).','Sự tham gia tích cực của bạn ấy vào các hoạt động lớp đã gây ấn tượng với cô giáo.'),
I('Exams can be very ______ for students. (stress)','stressful','Cần tính từ chỉ sự vật','Sau "be very" cần <b>tính từ</b>; chủ ngữ là sự vật (kì thi) gây căng thẳng → <b>stressful</b>.','Các kì thi có thể rất căng thẳng đối với học sinh.'),
I('Lan felt ______ the night before her final exam. (stress)','stressed','Cần tính từ chỉ cảm xúc người','Sau "felt" cần <b>tính từ</b>; cảm xúc của người (Lan) → <b>stressed</b> (bị căng thẳng).','Lan cảm thấy căng thẳng vào đêm trước kì thi cuối kì.'),
I('Parents\' high ______ can put a lot of pressure on teenagers. (expect)','expectations|expectation','Cần danh từ','Sau tính từ "high" cần <b>danh từ</b> → high <b>expectations</b> (kì vọng cao).','Kì vọng cao của cha mẹ có thể gây nhiều áp lực cho thanh thiếu niên.'),
I('______, our weak team won the first prize. Nobody thought it could happen. (expect)','Unexpectedly','Cần trạng từ đầu câu – nghĩa phủ định','Đầu câu, trước dấu phẩy → <b>trạng từ</b>; "không ai nghĩ điều đó có thể xảy ra" → nghĩa bất ngờ: <b>Unexpectedly</b> (viết hoa vì đầu câu).','Thật bất ngờ, đội yếu của chúng tôi đã giành giải nhất. Không ai nghĩ điều đó có thể xảy ra.')
]},
{title:'popular · strong · ethnic · tradition',qs:[
I('K-pop has gained great ______ among Vietnamese teenagers. (popular)','popularity','Cần danh từ','Sau "gained great" cần <b>danh từ</b> → gain <b>popularity</b> (trở nên phổ biến).','K-pop đã trở nên rất phổ biến với thanh thiếu niên Việt Nam.'),
I('Playing video games all day is ______ with most parents. (popular)','unpopular','Cần tính từ – nghĩa phủ định','Sau "is" cần <b>tính từ</b>; phụ huynh không thích việc chơi game cả ngày → <b>unpopular</b>.','Việc chơi điện tử cả ngày không được hầu hết phụ huynh ưa thích.'),
I('The ______ of social media has changed teenagers\' lives. (popular)','popularity','Cần danh từ','Cấu trúc <b>The + N + of</b> → <b>popularity</b>. <i>(Câu 31 – Đề tham khảo)</i>','Sự phổ biến của mạng xã hội đã thay đổi cuộc sống của thanh thiếu niên.'),
I('Doing exercise every day helps to improve our muscle ______. (strong)','strength','Cần danh từ','Sau "our muscle" cần <b>danh từ</b> → muscle <b>strength</b> (sức mạnh cơ bắp).','Tập thể dục mỗi ngày giúp cải thiện sức mạnh cơ bắp.'),
I('Team sports can help ______ the friendship among students. (strong)','strengthen','Cần động từ','Sau "help" cần <b>động từ nguyên mẫu</b> → <b>strengthen</b> (làm mạnh thêm, thắt chặt).','Các môn thể thao đồng đội có thể giúp thắt chặt tình bạn giữa học sinh.'),
I('Taking part in team sports helps students ______ their friendship. (strong)','strengthen','Cần động từ','<b>help + O + V</b> → <b>strengthen</b>. <i>(Câu 30 – Đề tham khảo)</i>','Tham gia các môn thể thao đồng đội giúp học sinh thắt chặt tình bạn.'),
I('Viet Nam is an ______ diverse country. (ethnic)','ethnically','Cần trạng từ','Đứng trước tính từ "diverse" → <b>trạng từ</b>: <b>ethnically</b> diverse (đa dạng về dân tộc). Chú ý "an" vì ethnically bắt đầu bằng nguyên âm.','Việt Nam là một quốc gia đa dạng về dân tộc.'),
I('Áo dài is the ______ costume of Vietnamese women. (tradition)','traditional','Cần tính từ','Trước danh từ "costume" cần <b>tính từ</b> → <b>traditional</b> costume (trang phục truyền thống).','Áo dài là trang phục truyền thống của phụ nữ Việt Nam.'),
I('______, Vietnamese people make chung cakes before Tet. (tradition)','Traditionally','Cần trạng từ đầu câu','Đầu câu, trước dấu phẩy → <b>trạng từ</b>: <b>Traditionally</b> (theo truyền thống).','Theo truyền thống, người Việt gói bánh chưng trước Tết.'),
I('______, Vietnamese people visit their relatives during Tet. (tradition)','Traditionally','Cần trạng từ đầu câu','Đầu câu, trước dấu phẩy → <b>Traditionally</b>. <i>(Câu 34 – Đề tham khảo)</i>','Theo truyền thống, người Việt Nam đi thăm họ hàng trong dịp Tết.'),
I('The villagers welcomed us ______, so we felt at home. (warm)','warmly','Cần trạng từ','Bổ nghĩa cho động từ "welcomed" → <b>trạng từ</b>: <b>warmly</b> (nồng hậu).','Dân làng chào đón chúng tôi nồng hậu, nên chúng tôi cảm thấy như ở nhà.')
]}
]},
/* ---------------- 11. TỪ ĐIỂN ---------------- */
{id:'dict',part:'Phần VI · Câu 35–36',title:'Tra từ điển',icon:'🔍',color:'#5B6B7F',
instr:'Đọc mục từ điển và điền cụm từ thích hợp',
tip:`<ol><li>Đọc câu cần điền, đoán nghĩa và loại từ cần.</li><li>So sánh với các <b>câu ví dụ</b> trong từ điển, tìm câu có ngữ cảnh giống nhất.</li><li><b>Chép</b> cụm từ đó (2–4 từ).</li><li>Biến đổi cho hợp ngữ pháp: chia thì (take up → took up), số ít/số nhiều, thêm a/an/the.</li></ol><p>Không tự "sáng tác" cụm từ mới – chép đúng cụm có sẵn trong từ điển.</p>`,
lessons:[
{title:'hobby · harvest · peer',qs:[
I('Last summer, my sister ______ knitting as a hobby.','took up','Dựa vào ví dụ: "He took up painting as a hobby."','Câu ví dụ: "<i>He <b>took up</b> painting as a hobby.</i>" → take up = bắt đầu (một sở thích). Có "Last summer" nên chia quá khứ: <b>took up</b>.','Mùa hè năm ngoái, chị tôi bắt đầu đan len như một sở thích.','hobby'),
I('Making origami is ______ for Japanese children.','a popular hobby','Dựa vào ví dụ: "Collecting stamps is a popular hobby for children."','Câu ví dụ: "<i>Collecting stamps is <b>a popular hobby</b> for children.</i>" → chép nguyên cụm <b>a popular hobby</b>.','Gấp giấy origami là một sở thích phổ biến của trẻ em Nhật Bản.','hobby'),
I('Everyone in my village works from early morning until late evening ______.','at harvest time','Dựa vào ví dụ: "Farmers are very busy at harvest time."','Câu ví dụ: "<i>Farmers are very busy <b>at harvest time</b>.</i>" → <b>at harvest time</b> = vào mùa gặt.','Vào mùa gặt, mọi người trong làng tôi làm việc từ sáng sớm đến tối muộn.','harvest'),
I('Thanks to the good weather, the farmers had ______ this year.','a good harvest','Dựa vào ví dụ: "We had a good harvest this year."','Câu ví dụ: "<i>We had <b>a good harvest</b> this year.</i>" → <b>a good harvest</b> = một vụ mùa bội thu.','Nhờ thời tiết thuận lợi, năm nay nông dân được một vụ mùa bội thu.','harvest'),
I('Many teenagers want expensive phones because of ______.','peer pressure','Dựa vào ví dụ: "Teenagers often feel peer pressure to look cool."','Câu ví dụ: "<i>Teenagers often feel <b>peer pressure</b> to look cool.</i>" → because of + danh từ: <b>peer pressure</b>.','Nhiều thanh thiếu niên muốn có điện thoại đắt tiền vì áp lực từ bạn bè đồng trang lứa.','peer'),
I('When working in groups, students can learn a lot ______.','from their peers','Dựa vào ví dụ: "Children learn a lot from their peers."','Câu ví dụ: "<i>Children learn a lot <b>from their peers</b>.</i>" → <b>from their peers</b> (từ bạn bè đồng trang lứa).','Khi làm việc nhóm, học sinh có thể học hỏi được nhiều điều từ bạn bè.','peer')
]},
{title:'festival · ethnic · reunion',qs:[
I('Families get together to celebrate the new year at Tet – ______ in Viet Nam.','the most important traditional festival','Dựa vào ví dụ: "Tet is the most important traditional festival in Viet Nam."','Câu ví dụ: "<i>Tet is <b>the most important traditional festival</b> in Viet Nam.</i>" → chép nguyên cụm.','Các gia đình sum họp để đón năm mới vào dịp Tết – lễ hội truyền thống quan trọng nhất ở Việt Nam.','festival'),
I('The Lim Festival in Bac Ninh ______.','is held every spring','Dựa vào ví dụ: "The Hung King Temple Festival is held every spring."','Câu ví dụ: "<i>The Hung King Temple Festival <b>is held every spring</b>.</i>" → <b>is held every spring</b> (được tổ chức vào mỗi mùa xuân).','Hội Lim ở Bắc Ninh được tổ chức vào mỗi mùa xuân.','festival'),
I('In Ha Giang, tourists can meet people from different ______ such as the Hmong and the Dao.','ethnic groups|ethnic minorities','Dựa vào ví dụ: "Viet Nam has 54 ethnic groups."','Câu ví dụ: "<i>Viet Nam has 54 <b>ethnic groups</b>.</i>" → sau "different" cần danh từ số nhiều: <b>ethnic groups</b> (hoặc ethnic minorities).','Ở Hà Giang, du khách có thể gặp gỡ người thuộc nhiều dân tộc khác nhau như người Hmông và người Dao.','ethnic'),
I('At the night market, visitors can enjoy ______ played on traditional instruments.','ethnic music','Dựa vào ví dụ: "She loves listening to ethnic music."','Câu ví dụ: "<i>She loves listening to <b>ethnic music</b>.</i>" → <b>ethnic music</b> (âm nhạc dân tộc).','Ở chợ đêm, du khách có thể thưởng thức âm nhạc dân tộc được chơi bằng nhạc cụ truyền thống.','ethnic'),
I('Every Lunar New Year, all my relatives come back home for ______.','a family reunion','Dựa vào ví dụ: "We hold a family reunion every Tet."','Câu ví dụ: "<i>We hold <b>a family reunion</b> every Tet.</i>" → <b>a family reunion</b> (cuộc đoàn tụ gia đình). <i>(Câu 35 – Đề tham khảo)</i>','Mỗi dịp Tết Nguyên đán, tất cả họ hàng của tôi đều trở về nhà để đoàn tụ gia đình.','reunion'),
I('Ten years after leaving school, our class ______ at a restaurant.','had a reunion','Dựa vào ví dụ: "Our class had a reunion ten years after we left school."','Câu ví dụ: "<i>Our class <b>had a reunion</b> ten years after we left school.</i>" → <b>had a reunion</b> (đã họp lớp). <i>(Câu 36 – Đề tham khảo)</i>','Mười năm sau khi ra trường, lớp chúng tôi đã họp lớp ở một nhà hàng.','reunion')
]}
]},
/* ---------------- 12. VIẾT LẠI CÂU ---------------- */
{id:'rw',part:'Phần VII · Câu 37–40',title:'Viết lại câu',icon:'✍️',color:'#1F6FB2',
instr:'Viết lại câu cho nghĩa không đổi – chạm vào các từ để sắp xếp',
