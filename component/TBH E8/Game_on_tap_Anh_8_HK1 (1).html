tip:`<h4>37. If loại 1 (không dùng unless)</h4><p>Mệnh lệnh + <b>or / otherwise</b> → If + you <b>don't</b> + V (đổi sang phủ định). Mệnh lệnh + <b>and</b> → If + you + V (giữ khẳng định). Don't + V, or → If + you + V. "OR đảo NOT".</p><h4>38. Had better (not)</h4><p>should / ought to / It's a good idea / Why don't you → <b>had better + V</b>; shouldn't / Don't / It's not a good idea → <b>had better not + V</b>. Không có "to", không đổi had thành has.</p><h4>39. Because ↔ so</h4><p><b>Because</b> + nguyên nhân; <b>so</b> + kết quả. Không dùng cả because và so trong một câu.</p><h4>40. So sánh tính từ → trạng từ</h4><p>A is a better swimmer than B → A <b>swims better</b> than B. A is a more careful driver → A <b>drives more carefully</b>. Nhớ thêm -s cho động từ khi chủ ngữ số ít.</p>`,
lessons:[
{title:'Câu điều kiện loại 1',qs:[
O('Hurry up, or you will be late for school.','If','you don\'t hurry up, you will be late for school.','will|doesn\'t','Mệnh lệnh + <b>or</b> (nếu không thì) → đổi vế If sang <b>phủ định</b>: If you <b>don\'t</b> hurry up, …','Nếu bạn không nhanh lên, bạn sẽ bị muộn học.'),
O('Water these plants every day, and they will grow well.','If','you water these plants every day, they will grow well.','don\'t|will','Mệnh lệnh + <b>and</b> → giữ <b>khẳng định</b>: If you water…, they will grow well.','Nếu bạn tưới những cây này mỗi ngày, chúng sẽ phát triển tốt.'),
O('Be careful, or you will cut your finger.','If','you aren\'t careful, you will cut your finger.','don\'t|be','"Be careful" + or → phủ định. careful là <b>tính từ</b> nên dùng <b>aren\'t</b> (không dùng don\'t careful).','Nếu bạn không cẩn thận, bạn sẽ bị đứt tay.'),
O('Turn off the lights when you leave, and you will save electricity.','If','you turn off the lights when you leave, you will save electricity.','don\'t|will','Mệnh lệnh + <b>and</b> → giữ khẳng định.','Nếu bạn tắt đèn khi ra ngoài, bạn sẽ tiết kiệm được điện.'),
O('Stop playing computer games, or your eyes will get tired.','If','you don\'t stop playing computer games, your eyes will get tired.','won\'t|stopped','Mệnh lệnh + <b>or</b> → phủ định: If you don\'t stop playing…','Nếu bạn không dừng chơi điện tử, mắt bạn sẽ bị mỏi.'),
O('Don\'t be noisy in the library, or the librarian will be angry.','If','you are noisy in the library, the librarian will be angry.','don\'t|aren\'t','"<b>Don\'t</b> + V, or…" → bỏ don\'t, chuyển thành <b>khẳng định</b>: If you are noisy…','Nếu bạn làm ồn trong thư viện, cô thủ thư sẽ tức giận.'),
O('Mai must wear a raincoat, or she will get wet.','If','Mai doesn\'t wear a raincoat, she will get wet.','don\'t|must','S + must + V, or… → If + S + <b>doesn\'t</b> + V (chủ ngữ Mai số ít → doesn\'t).','Nếu Mai không mặc áo mưa, bạn ấy sẽ bị ướt.'),
O('Practise speaking English every day, and you will speak it fluently.','If','you practise speaking English every day, you will speak it fluently.','don\'t|fluent','Mệnh lệnh + <b>and</b> → giữ khẳng định.','Nếu bạn luyện nói tiếng Anh mỗi ngày, bạn sẽ nói lưu loát.'),
O('Leave now, otherwise you will miss the last bus.','If','you don\'t leave now, you will miss the last bus.','will|otherwise','<b>otherwise</b> giống "or" → đổi sang phủ định: If you don\'t leave now…','Nếu bạn không đi ngay bây giờ, bạn sẽ lỡ chuyến xe buýt cuối cùng.'),
O('Study harder, or you will fail the final exam.','If','you don\'t study harder, you will fail the final exam.','won\'t|hard','Mệnh lệnh + <b>or</b> → phủ định. <i>(Câu 37 – Đề tham khảo)</i>','Nếu bạn không học chăm hơn, bạn sẽ trượt kì thi cuối kì.')
]},
{title:'Had better (not)',qs:[
O('You should wear a helmet when riding a motorbike.','You had better','wear a helmet when riding a motorbike.','to|not','<b>should + V</b> → <b>had better + V</b> (không có "to").','Bạn nên đội mũ bảo hiểm khi đi xe máy.'),
O('It\'s a good idea for you to see a doctor.','You','had better see a doctor.','to|has','<b>It\'s a good idea for you to V</b> → You <b>had better + V</b>. Không đổi had thành has.','Bạn nên đi khám bác sĩ.'),
O('You shouldn\'t stay up too late before the exam.','You had','better not stay up too late before the exam.','to|don\'t','<b>shouldn\'t + V</b> → <b>had better not + V</b>.','Bạn không nên thức quá khuya trước kì thi.'),
O('Don\'t use your phone while you are crossing the road.','You had','better not use your phone while you are crossing the road.','don\'t|to','<b>Don\'t + V</b> → You <b>had better not + V</b>.','Bạn không nên dùng điện thoại khi đang qua đường.'),
O('Students ought to do their homework before class.','Students','had better do their homework before class.','to|have','<b>ought to + V</b> → <b>had better + V</b> (dù chủ ngữ số nhiều vẫn là had).','Học sinh nên làm bài tập về nhà trước giờ học.'),
O('It\'s not a good idea to wrap a gift in black paper in Viet Nam.','You had','better not wrap a gift in black paper in Viet Nam.','to|don\'t','<b>It\'s not a good idea to V</b> → had better <b>not</b> + V.','Ở Việt Nam, bạn không nên gói quà bằng giấy màu đen.'),
O('We should take off our shoes before entering the pagoda.','We had','better take off our shoes before entering the pagoda.','to|not','<b>should + V</b> → <b>had better + V</b>.','Chúng ta nên cởi giày trước khi vào chùa.'),
O('Why don\'t you ask your teacher for help?','You had','better ask your teacher for help.','to|don\'t','<b>Why don\'t you + V?</b> (lời khuyên) → You <b>had better + V</b>.','Bạn nên nhờ thầy cô giúp đỡ.'),
O('You should wear warm clothes when you visit Sa Pa in winter.','You had','better wear warm clothes when you visit Sa Pa in winter.','to|wearing','<b>should + V</b> → <b>had better + V</b>. <i>(Câu 38 – Đề tham khảo)</i>','Bạn nên mặc quần áo ấm khi đến Sa Pa vào mùa đông.')
]},
{title:'Because ↔ so',qs:[
O('It rained heavily, so we stayed at home.','Because','it rained heavily, we stayed at home.','so|of','<b>Because</b> đứng trước <b>nguyên nhân</b> (trời mưa to); bỏ "so" – không dùng cả because và so trong một câu.','Vì trời mưa to nên chúng tôi ở nhà.'),
O('Nam was ill, so he didn\'t go to school yesterday.','Because','Nam was ill, he didn\'t go to school yesterday.','so|isn\'t','Because + nguyên nhân (Nam bị ốm), giữ nguyên thì quá khứ.','Vì Nam bị ốm nên hôm qua bạn ấy không đi học.','he was ill, Nam didn\'t go to school yesterday.'),
O('My village is very peaceful, so many tourists come there to relax.','Because','my village is very peaceful, many tourists come there to relax.','so|peace','Because + nguyên nhân (làng yên bình), vế sau là kết quả.','Vì làng tôi rất yên bình nên nhiều du khách đến đó để thư giãn.'),
O('Lan stayed up late chatting online, so she felt tired in class.','Because','Lan stayed up late chatting online, she felt tired in class.','so|of','Because + nguyên nhân (thức khuya), vế sau là kết quả (mệt trong lớp).','Vì Lan thức khuya nhắn tin trên mạng nên bạn ấy thấy mệt trong lớp.','she stayed up late chatting online, Lan felt tired in class.'),
O('Because the Tay live near rivers, they build stilt houses.','The Tay','live near rivers, so they build stilt houses.','because|lives','Đổi ngược lại: nguyên nhân + <b>, so</b> + kết quả.','Người Tày sống gần sông, vì vậy họ làm nhà sàn.'),
O('Because Tet is coming, people are busy decorating their houses.','Tet','is coming, so people are busy decorating their houses.','because|decorate','Nguyên nhân (Tết đến) + <b>, so</b> + kết quả (mọi người bận trang trí nhà).','Tết sắp đến nên mọi người bận rộn trang trí nhà cửa.'),
O('Mai loves DIY, so she often makes her own birthday cards.','Because','Mai loves DIY, she often makes her own birthday cards.','so|love','Because + nguyên nhân (Mai thích DIY).','Vì Mai yêu thích DIY nên bạn ấy thường tự làm thiệp sinh nhật.','she loves DIY, Mai often makes her own birthday cards.'),
O('He didn\'t study hard, so he failed the test.','Because','he didn\'t study hard, he failed the test.','so|fail','Because + nguyên nhân (không học chăm), giữ nguyên thì quá khứ.','Vì không học chăm nên cậu ấy trượt bài kiểm tra.'),
O('Minh bought a lot of origami paper, for he wanted to make paper cranes.','Because','Minh wanted to make paper cranes, he bought a lot of origami paper.','for|so','<b>for</b> (vì) đứng trước nguyên nhân → đưa nguyên nhân lên sau <b>Because</b>.','Vì Minh muốn gấp hạc giấy nên bạn ấy đã mua rất nhiều giấy origami.','he wanted to make paper cranes, Minh bought a lot of origami paper.'),
O('Hoa was very tired, so she went to bed early.','Because','Hoa was very tired, she went to bed early.','so|of','Because + nguyên nhân. <i>(Câu 39 – Đề tham khảo)</i>','Vì Hoa rất mệt nên bạn ấy đi ngủ sớm.','she was very tired, Hoa went to bed early.')
]},
{title:'So sánh: tính từ → trạng từ',qs:[
O('Minh is a better swimmer than Hieu.','Minh swims','better than Hieu.','more|well','a better <b>swimmer</b> → <b>swims better</b> (good → well → better).','Minh bơi giỏi hơn Hiếu.'),
O('My mother is a more careful driver than my father.','My mother','drives more carefully than my father.','careful|drive','a more careful <b>driver</b> → <b>drives more carefully</b> (thêm -s vì chủ ngữ số ít; careful → carefully).','Mẹ tôi lái xe cẩn thận hơn bố tôi.'),
O('Lan is a faster runner than her sister.','Lan','runs faster than her sister.','more|run','a faster <b>runner</b> → <b>runs faster</b> (fast là trạng từ ngắn, giữ nguyên faster).','Lan chạy nhanh hơn chị gái.'),
O('Mr Hai was a harder worker than his colleagues.','Mr Hai','worked harder than his colleagues.','works|more','"<b>was</b>" là quá khứ → động từ chia quá khứ: <b>worked harder</b>.','Ông Hải đã làm việc chăm chỉ hơn các đồng nghiệp.'),
O('Nga is a more beautiful singer than Hoa.','Nga','sings more beautifully than Hoa.','beautiful|sing','a more beautiful <b>singer</b> → <b>sings more beautifully</b>.','Nga hát hay hơn Hoa.'),
O('Tom is a worse cook than his wife.','Tom','cooks worse than his wife.','more|badly','a worse <b>cook</b> (đầu bếp) → <b>cooks worse</b> (badly → worse).','Tom nấu ăn dở hơn vợ.'),
O('Mai is a more fluent English speaker than Lan.','Mai','speaks English more fluently than Lan.','fluent|speak','a more fluent English <b>speaker</b> → <b>speaks English more fluently</b> (tân ngữ English đặt ngay sau động từ).','Mai nói tiếng Anh lưu loát hơn Lan.'),
O('My brother is a better badminton player than me.','My brother','plays badminton better than me.','well|more','a better badminton <b>player</b> → <b>plays badminton better</b>.','Anh trai tôi chơi cầu lông giỏi hơn tôi.'),
O('Nam is a more careless writer than his classmates.','Nam','writes more carelessly than his classmates.','careless|write','a more careless <b>writer</b> → <b>writes more carelessly</b>.','Nam viết cẩu thả hơn các bạn cùng lớp.'),
O('Huong is a more creative designer than her friend.','Huong','designs more creatively than her friend.','creative|design','a more creative <b>designer</b> → <b>designs more creatively</b>.','Hương thiết kế sáng tạo hơn bạn của cô ấy.'),
O('Peter is a more careful driver than his brother.','Peter','drives more carefully than his brother.','careful|drive','a more careful <b>driver</b> → <b>drives more carefully</b>. <i>(Câu 40 – Đề tham khảo)</i>','Peter lái xe cẩn thận hơn anh trai.')
]}
]}
];

</script>
<script>
(function(){
'use strict';
/* ---------------- storage ---------------- */
const KEY='vuotai-anh8-v1';
let ST={xp:0,streak:0,lastDay:'',done:{},wrong:[],day:'',dayXp:0,sound:true,unlockAll:false,theme:''};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)ST=Object.assign(ST,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
if(ST.day!==today()){ST.day=today();ST.dayXp=0;}
if(ST.lastDay && ST.lastDay!==today() && ST.lastDay!==yesterday()){ST.streak=0;}
if(ST.theme)document.documentElement.setAttribute('data-theme',ST.theme);
const GOAL=50;

/* ---------------- index ---------------- */
const QMAP={};
SECTIONS.forEach(sec=>sec.lessons.forEach((L,li)=>{
  L.id=sec.id+'-'+li;
  L.qs.forEach((q,qi)=>{q.id=L.id+'-'+qi;q.sec=sec;if(L.passage){q.passage=L.passage;q.pvi=L.pvi;}QMAP[q.id]=q;});
}));

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,'').replace(/\[|\]/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').replace(/\s*([,.!?])\s*/g,'$1 ').trim().replace(/[.!\s]+$/,'');
const underline=s=>esc(s).replace(/\[(.+?)\]/g,'<u>$1</u>');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ---------------- sound ---------------- */
let AC=null;
function tone(freqs,dur,type){if(!ST.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;freqs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8;});}catch(e){}}
const sOk=()=>tone([660,880],.14),sBad=()=>tone([220,180],.18,'square'),sWin=()=>tone([523,659,784,1047],.15),sTap=()=>tone([500],.04);
/* ---------------- speech ---------------- */
const canSpeak='speechSynthesis' in window;
let enVoice=null;
function pickVoice(){if(!canSpeak)return;const v=speechSynthesis.getVoices();enVoice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
if(canSpeak){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){if(!canSpeak||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=enVoice?enVoice.lang:'en-GB';if(enVoice)u.voice=enVoice;u.rate=.88;speechSynthesis.speak(u);}catch(e){}}

/* ---------------- HOME ---------------- */
function lessonUnlocked(sec,li){return ST.unlockAll||li===0||!!ST.done[sec.lessons[li-1].id];}
function renderHome(){
  $('#hStreak').textContent=ST.streak;$('#hXp').textContent=ST.xp;
  $('#goalTxt').textContent='Mục tiêu hôm nay: '+Math.min(ST.dayXp,GOAL)+' / '+GOAL+' XP'+(ST.dayXp>=GOAL?' ✅':'');
  $('#goalBar').style.width=Math.min(100,ST.dayXp/GOAL*100)+'%';
  const wc=ST.wrong.filter(id=>QMAP[id]).length;
  $('#wrongCnt').textContent=wc?wc+' câu cần ôn lại':'Chưa có câu sai';
  $('#btnReview').disabled=!wc;
  const box=$('#sections');box.innerHTML='';
  let firstCurrentMarked=false;
  SECTIONS.forEach(sec=>{
    const doneN=sec.lessons.filter(L=>ST.done[L.id]).length;
    const qN=sec.lessons.reduce((a,L)=>a+L.qs.length,0);
    const d=document.createElement('div');d.className='section';
    d.innerHTML=`<div class="sechead" style="background:${sec.color}"><span class="em">${sec.icon}</span><div style="min-width:0"><div class="sp">${esc(sec.part)}</div><h2>${esc(sec.title)}</h2><div class="secprog">${doneN}/${sec.lessons.length} bài · ${qN} câu</div></div><button class="tipbtn">📘 Mẹo</button></div><div class="path"></div>`;
    d.querySelector('.tipbtn').onclick=()=>showTip(sec);
    const path=d.querySelector('.path');
    const offs=[0,-60,-80,-40,20,60,80,40];
    sec.lessons.forEach((L,li)=>{
      const unlocked=lessonUnlocked(sec,li);const done=ST.done[L.id];
      const isCur=unlocked&&!done&&!firstCurrentMarked;
      if(isCur)firstCurrentMarked=true;
      const n=document.createElement('div');
      n.className='node'+(unlocked?'':' locked')+(isCur?' current':'');
      n.style.transform='translateX('+offs[li%offs.length]+'px)';
      const icon=done?'✔':(unlocked?(L.qs[0].t==='match'?'🧠':(L.passage?'📄':'★')):'🔒');
      n.innerHTML=(isCur?'<div class="startTag">Bắt đầu</div>':'')+`<button class="circle" style="background:${sec.color};box-shadow:0 6px 0 ${shade(sec.color)};color:#fff" aria-label="${esc(L.title)}">${icon}</button><div class="stars">${done?'★'.repeat(done)+'☆'.repeat(3-done):''}</div><div class="lbl">${esc(L.title)}</div>`;
      if(isCur)n.querySelector('.circle').style.color=sec.color;
      n.querySelector('.circle').innerHTML='<span style="color:#fff">'+icon+'</span>';
      n.querySelector('.circle').onclick=()=>{sTap();if(!unlocked){toast('Hoàn thành bài trước để mở khoá nhé!');return;}openLessonSheet(sec,L);};
      path.appendChild(n);
    });
    box.appendChild(d);
  });
}
function shade(hex){const n=parseInt(hex.slice(1),16);let r=(n>>16)*.75|0,g=((n>>8)&255)*.75|0,b=(n&255)*.75|0;return 'rgb('+r+','+g+','+b+')';}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function showTip(sec){openModal(`<h3>${sec.icon} ${esc(sec.title)}</h3><p class="sub">${esc(sec.part)} · Mẹo làm bài</p><div class="tipbox">${sec.tip}</div><button class="btn mt" id="mClose">Đã hiểu</button>`);$('#mClose').onclick=closeModal;}
function openLessonSheet(sec,L){
  const done=ST.done[L.id];
  const kinds={mcq:'Trắc nghiệm',input:'Điền từ',order:'Sắp xếp câu',match:'Ghép cặp'};
  const ks=[...new Set(L.qs.map(q=>kinds[q.t]))].join(' · ');
  openModal(`<div class="tag" style="background:${sec.color}">${esc(sec.part)}</div><h3>${esc(L.title)}</h3><p class="sub">${L.qs.length} câu · ${ks}${done?' · Kỷ lục: '+'★'.repeat(done):''}</p><div class="row"><button class="btn ghost" id="mTip">📘 Mẹo</button><button class="btn" id="mGo">${done?'Luyện lại':'Bắt đầu'}</button></div>`);
  $('#mTip').onclick=()=>showTip(sec);
  $('#mGo').onclick=()=>{closeModal();startLesson({title:L.title,lessonId:L.id,qs:L.qs.slice(),sec});};
}
$('#btnMenu').onclick=()=>{
  openModal(`<h3>⚙️ Cài đặt</h3><p class="sub">Tiến độ chỉ lưu trên thiết bị này.</p>
  <div class="row"><button class="btn ghost" id="sSound">${ST.sound?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt'}</button></div>
  <div class="row mt"><button class="btn ghost" id="sTheme">🌓 Giao diện: ${ST.theme==='dark'?'Tối':ST.theme==='light'?'Sáng':'Theo máy'}</button></div>
  <div class="row mt"><button class="btn ghost" id="sUnlock">${ST.unlockAll?'🔓 Đang mở khoá tất cả bài':'🔒 Mở khoá tất cả bài'}</button></div>
  <div class="row mt"><button class="btn bad" id="sReset">Xoá toàn bộ tiến độ</button></div>
  <button class="btn mt" id="mClose">Đóng</button>`);
  $('#sSound').onclick=()=>{ST.sound=!ST.sound;save();$('#btnMenu').click();};
  $('#sTheme').onclick=()=>{ST.theme=ST.theme===''?'dark':ST.theme==='dark'?'light':'';if(ST.theme)document.documentElement.setAttribute('data-theme',ST.theme);else document.documentElement.removeAttribute('data-theme');save();$('#btnMenu').click();};
  $('#sUnlock').onclick=()=>{ST.unlockAll=!ST.unlockAll;save();renderHome();$('#btnMenu').click();};
  $('#sReset').onclick=()=>{if(confirm('Xoá toàn bộ điểm, chuỗi ngày và tiến độ?')){ST.xp=0;ST.streak=0;ST.lastDay='';ST.done={};ST.wrong=[];ST.dayXp=0;save();renderHome();closeModal();}};
  $('#mClose').onclick=closeModal;
};
$('#btnReview').onclick=()=>{const ids=shuffle(ST.wrong.filter(id=>QMAP[id])).slice(0,15);if(!ids.length)return;startLesson({title:'Ôn câu sai',review:true,qs:ids.map(id=>QMAP[id])});};
$('#btnMix').onclick=()=>{const all=Object.values(QMAP).filter(q=>q.t!=='match');startLesson({title:'Thử thách tổng hợp',mix:true,qs:shuffle(all).slice(0,15)});};

/* ---------------- LESSON ENGINE ---------------- */
let LS=null;
function startLesson(cfg){
  LS={cfg,queue:cfg.qs.slice(),total:cfg.qs.length,correct:0,hearts:5,mistakes:0,firstTry:0,seen:{},wrongList:[],filled:{},start:Date.now(),cur:null,state:'answer',ans:null};
  $('#home').classList.add('hidden');$('#result').classList.add('hidden');$('#lesson').classList.remove('hidden');
  window.scrollTo(0,0);next();
}
function updateBar(){$('#pbar').style.width=(LS.correct/LS.total*100)+'%';$('#hearts').textContent=LS.hearts;}
function next(){
  updateBar();
  if(!LS.queue.length){return finish(true);}
  LS.cur=LS.queue.shift();LS.state='answer';LS.ans=null;
  const fb=$('#fb');fb.classList.add('hidden');fb.innerHTML='';
  $('#lfoot').className='lfoot';
  const b=$('#btnCheck');b.className='btn';b.textContent='Kiểm tra';b.disabled=true;
  renderQ(LS.cur);window.scrollTo(0,0);
}
function setReady(v){$('#btnCheck').disabled=!v;}
function instrOf(q){if(q.t==='match')return 'Ghép từ tiếng Anh với nghĩa tiếng Việt';if(q.t==='order')return 'Viết lại câu cho nghĩa không đổi';if(q.kind==='tf')return 'True (Đúng) hay False (Sai)?';if(q.passage&&q.t==='mcq'&&/^\(\d\)$/.test(q.q))return 'Chọn đáp án đúng cho chỗ trống '+q.q;return q.sec.instr;}
function passageHTML(q){
  let p=esc(q.passage);
  if(/^\(\d\)$/.test(q.q||'')){
    p=p.replace(/\((\d)\) ______/g,(m,n)=>{const key='('+n+')';if(key===q.q)return '<span class="blank cur">('+n+') ______</span>';
      if(LS.filled[key]&&!LS.cfg.mix&&!LS.cfg.review)return '<span class="blank done">('+n+') '+esc(LS.filled[key])+'</span>';return '<span class="blank">('+n+') ______</span>';});
  }
  return p;
}
function renderQ(q){
  const A=$('#qArea');let h='';document.querySelectorAll('.confetti').forEach(c=>c.parentNode.removeChild(c));$('.lbody').style.paddingBottom='';
  if(LS.cfg.mix||LS.cfg.review)h+=`<div class="tag" style="background:${q.sec.color}">${q.sec.icon} ${esc(q.sec.title)}</div>`;
  h+=`<div class="instr">${esc(instrOf(q))}</div>`;
  if(q.passage){h+=`<div class="passage" id="passage">${passageHTML(q)}</div><div class="ptools"><button class="pill" id="pViBtn" disabled>🇻🇳 Dịch đoạn văn (sau khi trả lời)</button></div><div class="pvi hidden" id="pVi">${esc(q.pvi||'')}</div>`;}
  if(q.e&&DICT[q.e]){const D=DICT[q.e];h+=`<div class="dict"><span class="hw">${esc(D.w)}</span><span class="ipa">${esc(D.ipa)}</span> <span class="pos">${esc(D.pos)}</span>${D.defs.map(df=>`<div style="margin-top:6px"><span class="g">${esc(df.g)}</span> ${esc(df.d)}<ul>${df.ex.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`).join('')}</div>`;}
  if(q.t==='mcq'){
    if(q.sign){const ic={ban:'🚫',warn:'⚠️',must:'🔵',info:'ℹ️'}[q.sign.k];h+=`<div class="sign ${q.sign.k}"><span class="ic">${ic}</span>${q.sign.lines.map((l,i)=>`<div class="${i?'ln':'l0'}">${esc(l)}</div>`).join('')}</div>`;}
    else if(q.q&&!/^\(\d\)$/.test(q.q)){h+=`<div class="qtext">${q.kind==='tf'?'':''}${esc(q.q).replace(/&lt;br&gt;/g,'<br>').replace(/______/g,'<span class="gap">&nbsp;</span>')}</div>`;}
    let order=q.o.map((t,i)=>i);if(!q.fixed)order=shuffle(order);
    LS.order=order;
    const big=q.kind==='tf';const grid=(q.kind==='pron'||q.kind==='stress'||(!q.sign&&q.o.every(o=>o.length<16)&&!big));
    h+=`<div class="opts${big?' grid big':grid?' grid':''}">`+order.map((oi,k)=>`<button class="opt" data-i="${oi}">${big?'':`<span class="k">${'ABCD'[k]}</span>`}<span>${big?(q.o[oi]==='True'?'✔ True – Đúng':'✘ False – Sai'):(q.kind==='pron'?underline(q.o[oi]):esc(q.o[oi]))}</span></button>`).join('')+'</div>';
    A.innerHTML=h;
    A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(LS.state!=='answer')return;sTap();A.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');LS.ans=+b.dataset.i;setReady(true);if(q.kind==='pron'||q.kind==='stress')speak(strip(q.o[+b.dataset.i]));});
  }
  if(q.passage){const pc=$('#passage'),cb=pc&&pc.querySelector('.blank.cur');if(cb)pc.scrollTop=Math.max(0,cb.offsetTop-pc.offsetTop-40);}
  if(q.t==='input'){
    h+=`<div class="qtext">${esc(q.q).replace(/______/g,'<span class="gap">&nbsp;</span>')}</div><input class="inp" id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Gõ câu trả lời…"><div class="hint"><button class="pill" id="hintBtn">💡 Gợi ý</button> <span id="hintTxt" class="hidden"><b>${esc(q.h||'')}</b></span></div>`;
    A.innerHTML=h;const inp=$('#inp');
    inp.oninput=()=>{LS.ans=inp.value;setReady(inp.value.trim().length>0);};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#btnCheck').click();}};
    $('#hintBtn').onclick=()=>{$('#hintTxt').classList.remove('hidden');};
    setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},50);
  }
  else if(q.t==='order'){
    const toks=q.ans.split(' ');const bank=shuffle(toks.concat(q.d).map((t,i)=>({t,i})));
    LS.picked=[];
    h+=`<div class="orig"><small>Câu gốc</small>${esc(q.q)}</div><div class="ansline" id="ansline"><span class="tile fixed">${esc(q.s)}</span></div><div class="bank" id="bank">${bank.map(b=>`<button class="tile" data-i="${b.i}">${esc(b.t)}</button>`).join('')}</div>`;
    A.innerHTML=h;
    const all=toks.concat(q.d);
    const redraw=()=>{const line=$('#ansline');line.innerHTML=`<span class="tile fixed">${esc(q.s)}</span>`+LS.picked.map(i=>`<button class="tile" data-i="${i}">${esc(all[i])}</button>`).join('');
      line.querySelectorAll('button.tile').forEach(t=>t.onclick=()=>{if(LS.state!=='answer')return;sTap();LS.picked=LS.picked.filter(x=>x!==+t.dataset.i);A.querySelector('#bank .tile[data-i="'+t.dataset.i+'"]').classList.remove('used');redraw();});
      LS.ans=LS.picked.map(i=>all[i]).join(' ');setReady(LS.picked.length>0);};
    A.querySelectorAll('#bank .tile').forEach(t=>t.onclick=()=>{if(LS.state!=='answer'||t.classList.contains('used'))return;sTap();t.classList.add('used');LS.picked.push(+t.dataset.i);redraw();});
  }
  else if(q.t==='match'){
    const L=shuffle(q.pairs.map((p,i)=>({t:p[0],i}))),R=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
    h+=`<div class="match"><div class="col">${L.map(x=>`<button class="mt-i" data-s="L" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col">${R.map(x=>`<button class="mt-i" data-s="R" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
    A.innerHTML=h;let selL=null,selR=null,got=0;LS.matchMiss=0;
    const tryPair=()=>{if(!selL||!selR)return;const a=selL,b=selR;selL=selR=null;
      if(a.dataset.i===b.dataset.i){sOk();speak(q.pairs[+a.dataset.i][0]);[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true;});got++;if(got===q.pairs.length){LS.ans='ok';setReady(true);setTimeout(()=>$('#btnCheck').click(),350);}}
      else{sBad();LS.matchMiss++;[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('no');setTimeout(()=>x.classList.remove('no'),400);});}};
    A.querySelectorAll('.mt-i').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;sTap();if(b.dataset.s==='L'){A.querySelectorAll('[data-s="L"]').forEach(x=>x.classList.remove('sel'));selL=b;}else{A.querySelectorAll('[data-s="R"]').forEach(x=>x.classList.remove('sel'));selR=b;}b.classList.add('sel');if(b.dataset.s==='L')speak(b.textContent);tryPair();});
  }
}
function correctText(q){
  if(q.t==='mcq')return q.o[q.a];
  if(q.t==='input')return q.a[0];
  if(q.t==='order')return q.s+' '+q.ans;
  return '';
}
function englishOf(q){
  if(q.t==='match')return '';
  if(q.kind==='pron'||q.kind==='stress')return q.o.map(strip).join(', ');
  if(q.kind==='tf')return q.q;
  if(q.sign)return q.o[q.a];
  if(q.t==='order')return q.s+' '+q.ans;
  if(q.passage&&/^\(\d\)$/.test(q.q)){const re=new RegExp('[^.!?]*\\'+q.q.slice(0,2)+'\\) ______[^.!?]*[.!?]');const m=q.passage.match(re);return m?m[0].replace(/\(\d\) ______/,q.o[q.a]).replace(/\(\d\) ______/g,'…').trim():q.o[q.a];}
  let s=strip(q.q||'').replace(/\s*\((?:act|connect|entertain|collect|peace|develop|diverse|farm|participate|stress|expect|popular|strong|ethnic|tradition|warm)\)\s*$/,'');
  const ans=q.t==='input'?q.a[0]:q.o[q.a];
  if(/^A: /.test(s)){s=s.replace('______',ans);return s.replace(/^A: /,'').replace(/B: /,' ');}
  return s.replace(/______/,ans);
}
$('#btnCheck').onclick=()=>{
  if(!LS)return;
  if(LS.state==='feedback'){next();return;}
  const q=LS.cur;let ok=false;
  if(q.t==='mcq')ok=LS.ans===q.a;
  else if(q.t==='input')ok=q.a.some(a=>norm(a)===norm(LS.ans||''));
  else if(q.t==='order')ok=[q.ans].concat(q.alts||[]).some(a=>norm(a)===norm(LS.ans||''));
  else if(q.t==='match')ok=true;
  LS.state='feedback';
  const first=!LS.seen[q.id];LS.seen[q.id]=1;
  const A=$('#qArea');
  if(q.t==='mcq'){A.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===q.a)b.classList.add('right');else if(i===LS.ans)b.classList.add('wrong');});}
  if(q.t==='input'){$('#inp').classList.add(ok?'right':'wrong');$('#inp').readOnly=true;}
  if(q.t==='order'){$('#ansline').classList.add(ok?'right':'wrong');}
  if(ok){LS.correct++;if(first){LS.firstTry++;if(q.t!=='match'&&(LS.cfg.review||ST.wrong.includes(q.id)))ST.wrong=ST.wrong.filter(x=>x!==q.id);}if(q.passage&&q.q)LS.filled[q.q]=q.o?q.o[q.a]:'';sOk();}
  else{LS.mistakes++;LS.hearts--;if(!ST.wrong.includes(q.id))ST.wrong.push(q.id);if(!LS.wrongList.includes(q))LS.wrongList.push(q);LS.queue.push(q);sBad();}
  save();updateBar();
  if(q.passage){const pb=$('#pViBtn');if(pb){pb.disabled=false;pb.textContent='🇻🇳 Xem bản dịch đoạn văn';pb.onclick=()=>$('#pVi').classList.toggle('hidden');}}
  const praise=['Chính xác!','Tuyệt vời!','Giỏi quá!','Xuất sắc!','Đúng rồi!'];
  const en=englishOf(q);
  let fb='';
  if(q.t==='match'){fb=`<h3>${LS.matchMiss?'Hoàn thành!':'Hoàn hảo!'} 🎉</h3><div class="box"><b class="t">Các cặp từ</b>${q.pairs.map(p=>'<div><b>'+esc(p[0])+'</b>: '+esc(p[1])+'</div>').join('')}</div>`;}
  else{
    fb=`<h3>${ok?'✅ '+praise[Math.random()*praise.length|0]:'❌ Chưa đúng rồi'}${canSpeak&&en?'<button class="spk" id="spk">🔊 Nghe</button>':''}</h3>`;
    if(!ok){fb+=`<div class="ans">Đáp án đúng: ${q.kind==='pron'?underline(correctText(q)):esc(correctText(q))}</div>`;}
    else if(q.t==='input'&&norm(LS.ans)!==norm(q.a[0])){fb+=`<div class="ans">Đáp án: ${esc(q.a.join(' / '))}</div>`;}
    fb+=`<div class="box"><b class="t">💡 Giải thích</b>${q.ex}</div>`;
    fb+=`<div class="box"><b class="t">🇻🇳 Dịch nghĩa</b>${esc(q.vi)}</div>`;
  }
  const f=$('#fb');f.innerHTML=fb;f.classList.remove('hidden');
  const sp=$('#spk');if(sp)sp.onclick=()=>speak(en);
  $('#lfoot').className='lfoot '+(ok?'ok':'bad');
  const b=$('#btnCheck');b.disabled=false;b.className='btn '+(ok?'ok':'bad');b.textContent=ok?'Tiếp tục':'Đã hiểu';
  if(LS.hearts<=0){b.textContent='Tiếp tục';b.onclickOverride=true;LS.queue=[];LS.dead=true;}
  f.scrollTop=0;
  $('.lbody').style.paddingBottom=($('#lfoot').offsetHeight+24)+'px';
};
function finish(){
  const dead=LS.dead;
  $('#lesson').classList.add('hidden');$('#result').classList.remove('hidden');window.scrollTo(0,0);
  const secs=Math.round((Date.now()-LS.start)/1000);const tm=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  const acc=LS.firstTry&&LS.total?Math.round(LS.firstTry/LS.total*100):0;
  const R=$('#resArea');
  const reviewHTML=LS.wrongList.length?`<div class="reviewlist"><h3 style="margin:18px 0 8px;font-size:17px">Xem lại câu đã sai (${LS.wrongList.length})</h3>${LS.wrongList.map(q=>`<details><summary>${esc(strip(q.q&&!/^\(\d\)$/.test(q.q)?q.q:(q.kind==='pron'||q.kind==='stress'?q.o.map(strip).join(' · '):(q.sign?q.sign.lines.join(' – '):q.q||''))).slice(0,90))}</summary><div style="margin-top:6px"><b>Đáp án:</b> ${esc(correctText(q))}</div><div style="margin-top:4px">${q.ex}</div><div style="margin-top:4px;color:var(--muted)">${esc(q.vi)}</div></details>`).join('')}</div>`:'';
  if(dead){
    sBad();
    R.innerHTML=`<div style="font-size:64px">💔</div><h1>Hết tim rồi!</h1><p style="color:var(--muted)">Đừng nản nhé – đọc lại phần giải thích các câu sai rồi thử lại.</p>${reviewHTML}<div class="row mt"><button class="btn ghost" id="rHome">Về trang chính</button><button class="btn" id="rRetry">Làm lại</button></div>`;
    $('#rRetry').onclick=()=>startLesson(Object.assign({},LS.cfg,{qs:LS.cfg.mix?shuffle(Object.values(QMAP).filter(q=>q.t!=='match')).slice(0,15):LS.cfg.qs}));
    $('#rHome').onclick=goHome;return;
  }
  const stars=LS.mistakes===0?3:LS.mistakes<=2?2:1;
  const gain=10+LS.firstTry+(LS.mistakes===0?5:0);
  ST.xp+=gain;ST.dayXp+=gain;
  if(ST.lastDay!==today()){ST.streak=(ST.lastDay===yesterday())?ST.streak+1:1;ST.lastDay=today();}
  if(LS.cfg.lessonId){ST.done[LS.cfg.lessonId]=Math.max(ST.done[LS.cfg.lessonId]||0,stars);}
  save();sWin();confetti();
  const msgs={3:'Hoàn hảo! Không sai câu nào!',2:'Làm tốt lắm!',1:'Hoàn thành! Ôn lại câu sai để giỏi hơn nhé.'};
  R.innerHTML=`<div class="bigstars">${[1,2,3].map(i=>i<=stars?'⭐':'<span class="off">⭐</span>').join('')}</div><h1>${msgs[stars]}</h1><p style="color:var(--muted);margin:0">${esc(LS.cfg.title)}</p>
  <div class="stats"><div class="stat"><b style="background:var(--gold)">Điểm XP</b><span>+${gain}</span></div><div class="stat"><b style="background:var(--ok)">Chính xác</b><span>${acc}%</span></div><div class="stat"><b style="background:var(--pri)">Thời gian</b><span>${tm}</span></div></div>
  <p style="margin:0 0 6px;font-weight:700">🔥 Chuỗi ${ST.streak} ngày · Hôm nay ${Math.min(ST.dayXp,GOAL)}/${GOAL} XP</p>
  ${reviewHTML}
  <div class="row mt"><button class="btn ghost" id="rAgain">Luyện lại</button><button class="btn ok" id="rHome">Tiếp tục</button></div>`;
  $('#rHome').onclick=goHome;
  $('#rAgain').onclick=()=>startLesson(Object.assign({},LS.cfg,{qs:LS.cfg.mix?shuffle(Object.values(QMAP).filter(q=>q.t!=='match')).slice(0,15):LS.cfg.qs}));
}
function goHome(){$('#result').classList.add('hidden');$('#lesson').classList.add('hidden');$('#home').classList.remove('hidden');renderHome();window.scrollTo(0,0);}
$('#btnQuit').onclick=()=>{
  openModal(`<h3>Thoát bài học?</h3><p class="sub">Tiến độ của bài này sẽ không được lưu.</p><div class="row"><button class="btn ghost" id="qNo">Học tiếp</button><button class="btn bad" id="qYes">Thoát</button></div>`);
  $('#qNo').onclick=closeModal;$('#qYes').onclick=()=>{closeModal();if(canSpeak)speechSynthesis.cancel();goHome();};
};
function confetti(){const c=['#2B70F0','#FFB020','#1FA45B','#E0434B','#7A5AF0'];for(let i=0;i<40;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%c.length];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800);}}
document.addEventListener('keydown',e=>{if($('#lesson').classList.contains('hidden')||!LS)return;if(e.key==='Enter'&&document.activeElement.id!=='inp'&&!$('#btnCheck').disabled){e.preventDefault();$('#btnCheck').click();}
  if(LS.state==='answer'&&LS.cur&&LS.cur.t==='mcq'&&/^[1-4]$/.test(e.key)){const b=$('#qArea').querySelectorAll('.opt')[+e.key-1];if(b)b.click();}});
const h=new Date().getHours();$('#greet').textContent=(h<11?'Chào buổi sáng! ':h<18?'Chào em! ':'Chào buổi tối! ')+'Ôn thi cuối HK1 nào 💪';
renderHome();
})();
</script>
