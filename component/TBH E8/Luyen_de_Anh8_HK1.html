<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện đề Anh 8 – HK1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful, encouraging, one-question-at-a-time drill for grade 8 students
   IDEA: a lesson path of chunky tactile buttons that press down like keys
   PICTURE: the live question card itself, big and centred
   COLOUR/TYPE: leaf green #58cc02 lead, sky #1cb0f6 support, coral #ff4b4b for mistakes; Nunito 800
   LAYOUT: top progress bar, centred 640px column, bottom check bar that turns into a feedback sheet */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#131f24);--ink:light-dark(#3c3c3c,#f1f7fb);--mute:light-dark(#777,#9fb3bd);
--line:light-dark(#e5e5e5,#37464f);--card:light-dark(#fff,#1b2b33);
--g:#58cc02;--gd:#58a700;--gl:light-dark(#d7ffb8,#1f3a17);--b:#1cb0f6;--bd:#1899d6;--bl:light-dark(#ddf4ff,#123a4f);
--r:#ff4b4b;--rd:#ea2b2b;--rl:light-dark(#ffdfe0,#4a1d22);--y:#ffc800}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:700 17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{width:100%;max-width:680px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;border:0;
 background:var(--g);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.03em;box-shadow:0 4px 0 var(--gd);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gd)}
.btn:disabled{background:var(--line);color:var(--mute);box-shadow:0 4px 0 light-dark(#ccc,#2a3940);cursor:default}
.btn.ghost{background:var(--card);color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
/* home */
#home{padding:28px 0 60px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;align-items:center;margin-bottom:22px}
h1{font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0 0 8px;font-weight:900;color:var(--g);text-wrap:balance}
.sub{color:var(--mute);margin:0}
.path{display:grid;gap:12px;margin:18px 0}
.unit{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.unit:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.unit .dot{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff;font-weight:900;box-shadow:0 4px 0 var(--gd)}
.unit:nth-child(3n+2) .dot{background:var(--b);box-shadow:0 4px 0 var(--bd)}
.unit:nth-child(3n) .dot{background:#ce82ff;box-shadow:0 4px 0 #a568cc}
.unit b{display:block;font-size:18px}.unit small{color:var(--mute);font-size:14px}
.unit .best{margin-left:auto;color:var(--y);font-weight:900;font-size:15px;white-space:nowrap}
/* lesson */
#lesson{display:none;min-height:100vh;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 0}
.x{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;color:var(--mute)}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:width .35s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.3)}
.streak{display:flex;align-items:center;gap:4px;color:#ff9600;font-weight:900;white-space:nowrap}
main.q{flex:1;padding-bottom:200px}
.tag{display:inline-block;font-size:14px;color:#ce82ff;font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 4px}
.qtext{font-size:clamp(20px,4.2vw,24px);font-weight:800;line-height:1.35;margin:4px 0 16px;white-space:pre-line}
.qtext u{text-decoration-thickness:3px;text-underline-offset:3px;color:var(--b)}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--b);color:var(--b)}
.sign{display:block;max-height:180px;margin:0 auto 14px;border-radius:14px}
details.pass{border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 14px;background:var(--card)}
details.pass summary{cursor:pointer;color:var(--b);font-weight:800}
details.pass p{font-weight:600;font-size:15.5px;margin:8px 0}
.say{border:0;background:var(--b);color:#fff;width:44px;height:44px;border-radius:12px;box-shadow:0 3px 0 var(--bd);vertical-align:middle;margin-right:8px;display:inline-grid;place-items:center}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:700}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--mute)}
.opt.sel{border-color:var(--b);background:var(--bl);box-shadow:0 4px 0 var(--b)}.opt.sel .k{border-color:var(--b);color:var(--b)}
.opt.ok{border-color:var(--g);background:var(--gl);box-shadow:0 4px 0 var(--g)}
.opt.no{border-color:var(--r);background:var(--rl);box-shadow:0 4px 0 var(--r)}
.opts.tf{grid-template-columns:1fr 1fr}.opts.tf .opt{justify-content:center;font-size:20px;font-weight:900;min-height:80px}
.inp{width:100%;font:800 20px Nunito,sans-serif;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:light-dark(#f7f7f7,#1b2b33);color:var(--ink)}
.inp:focus{border-color:var(--b);outline:none}
.hint{color:var(--mute);font-size:15px;margin:8px 2px}
.lead{color:var(--mute);margin:0 0 6px}
.slots{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:6px}
.tail{color:var(--mute);font-weight:700;margin:0 0 18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:44px;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:800}
.tile.used{color:transparent;background:var(--line);box-shadow:none;pointer-events:none}
/* footer / sheet */
.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg);padding:16px 0 calc(16px + env(safe-area-inset-bottom))}
.foot .wrap{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot.good{background:var(--gl);border-color:transparent}.foot.bad{background:var(--rl);border-color:transparent}
.fb{flex:1 1 320px;max-height:42vh;overflow:auto}
.fb h3{margin:0 0 4px;font-size:22px;font-weight:900}
.good h3{color:var(--gd)}.bad h3{color:var(--rd)}
.fb p{margin:4px 0;font-weight:600;font-size:15.5px}
.fb .lab{font-weight:900}
.fb ul{margin:4px 0;padding-left:20px;font-weight:600;font-size:15px}
.foot .btn{flex:0 0 auto;min-width:160px}
.good .btn{background:var(--g)}.bad .btn{background:var(--r);box-shadow:0 4px 0 var(--rd)}
/* end */
#end{display:none;padding:40px 0 60px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}
.stat{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.stat b{display:block;padding:6px;color:#fff;font-size:14px;text-transform:uppercase}
.stat span{display:block;padding:14px 4px;font-size:clamp(22px,5vw,30px);font-weight:900}
.s1 b{background:var(--y)}.s1{border-color:var(--y)}.s2 b{background:var(--g)}.s2{border-color:var(--g)}.s3 b{background:var(--b)}.s3{border-color:var(--b)}
.review{text-align:left;display:grid;gap:10px;margin:18px 0}
.rv{border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:600;font-size:15.5px}
.rv b{color:var(--rd)}.rv .ans{color:var(--gd);font-weight:800}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.foot.good,.foot.bad{animation:pop .25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.hero{grid-template-columns:1fr}.hero svg{width:110px;justify-self:center;order:-1}.foot .btn{width:100%}}
</style>
</head>
<body>
<section id="home" class="wrap">
  <div class="hero">
    <div>
      <h1>Luyện đề Tiếng Anh 8 – Cuối HK1</h1>
      <p class="sub">40 câu, mỗi lần một câu. Sai thì xem dịch nghĩa và giải thích, câu sai sẽ quay lại cuối bài để làm lại.</p>
    </div>
    <svg viewBox="0 0 150 150" width="150" height="150" aria-hidden="true">
      <ellipse cx="75" cy="138" rx="46" ry="7" fill="rgba(0,0,0,.12)"/>
      <rect x="22" y="30" width="106" height="100" rx="22" fill="#58a700"/>
      <rect x="22" y="24" width="106" height="100" rx="22" fill="#58cc02"/>
      <rect x="38" y="44" width="74" height="12" rx="6" fill="#d7ffb8"/>
      <rect x="38" y="66" width="52" height="12" rx="6" fill="#d7ffb8"/>
      <rect x="38" y="88" width="62" height="12" rx="6" fill="#d7ffb8"/>
      <circle cx="116" cy="36" r="22" fill="#ffc800"/><path d="M105 36l8 8 14-16" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="path" id="path"></div>
  <p class="hint">Mẹo: phím 1–4 để chọn đáp án, Enter để kiểm tra / tiếp tục.</p>
</section>

<section id="lesson">
  <div class="wrap top">
    <button class="x" id="quit" aria-label="Thoát"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 3l14 14M17 3L3 17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
    <div class="bar"><i id="prog"></i></div>
    <div class="streak" title="Chuỗi đúng liên tiếp"><svg width="18" height="22" viewBox="0 0 18 22"><path d="M9 1c1 4 7 6 7 13a7 7 0 01-14 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4 1-7 2-10z" fill="#ff9600"/></svg><span id="streak">0</span></div>
  </div>
  <main class="wrap q" id="q"></main>
  <div class="foot" id="foot"><div class="wrap"><div class="fb" id="fb"></div><button class="btn" id="go" disabled>Kiểm tra</button></div></div>
</section>

<section id="end" class="wrap"></section>

<script>
const Q=[{"n":1,"sec":"I","type":"mc","q":"Which word has the underlined part pronounced differently from that of the others?","opts":["decorat[[ed]]","weav[[ed]]","pray[[ed]]","rais[[ed]]"],"ans":"A","vi":"Từ nào có phần gạch chân phát âm khác các từ còn lại?","exp":"decorated /ˈdekəreɪtɪd/ – đuôi -ed đọc /ɪd/ (vì động từ tận cùng bằng âm /t/). weaved /wiːvd/, prayed /preɪd/, raised /reɪzd/ đều đọc /d/.","optVi":["được trang trí","đã dệt","đã cầu nguyện","đã nâng lên/nuôi"]},{"n":2,"sec":"I","type":"mc","q":"Which word has the underlined part pronounced differently from that of the others?","opts":["c[[oo]]k","g[[oo]]d","l[[oo]]k","sch[[oo]]l"],"ans":"D","vi":"Từ nào có phần gạch chân phát âm khác các từ còn lại?","exp":"school /skuːl/ – “oo” đọc /uː/ (dài). cook /kʊk/, good /ɡʊd/, look /lʊk/ – “oo” đọc /ʊ/ (ngắn).","optVi":["nấu ăn","tốt","nhìn","trường học"]},{"n":3,"sec":"I","type":"mc","q":"Which word has a different stress pattern from that of the others?","opts":["ethnic","bamboo","peaceful","wooden"],"ans":"B","vi":"Từ nào có trọng âm khác các từ còn lại?","exp":"bamboo /bæmˈbuː/ nhấn âm 2. ethnic /ˈeθnɪk/, peaceful /ˈpiːsfl/, wooden /ˈwʊdn/ nhấn âm 1.","optVi":["(thuộc) dân tộc","cây tre","yên bình","bằng gỗ"]},{"n":4,"sec":"I","type":"mc","q":"Which word has a different stress pattern from that of the others?","opts":["ceremony","festival","minority","offering"],"ans":"C","vi":"Từ nào có trọng âm khác các từ còn lại?","exp":"minority /maɪˈnɒrəti/ nhấn âm 2. ceremony /ˈserəməni/, festival /ˈfestɪvl/, offering /ˈɒfərɪŋ/ nhấn âm 1.","optVi":["nghi lễ","lễ hội","thiểu số","lễ vật"]},{"n":5,"sec":"I","type":"mc","q":"We spent hours in _______ house to talk with local people.","opts":["terraced","close","communal","awesome"],"ans":"C","vi":"Chúng tôi đã dành hàng giờ ở nhà rông (nhà sinh hoạt cộng đồng) để trò chuyện với người dân địa phương.","exp":"communal house = nhà rông / nhà sinh hoạt chung của buôn làng. Các từ khác không đi với “house” theo nghĩa này.","optVi":["(ruộng) bậc thang","gần, thân thiết","chung, cộng đồng","tuyệt vời"]},{"n":6,"sec":"I","type":"mc","q":"My Son sanctuary has been recognized by UNESCO as a world _______.","opts":["ethnic minorities","open-air market","heritage site","terraced field"],"ans":"C","vi":"Thánh địa Mỹ Sơn đã được UNESCO công nhận là Di sản Thế giới.","exp":"world heritage site = di sản thế giới – cụm cố định.","optVi":["dân tộc thiểu số","chợ ngoài trời","khu di sản","ruộng bậc thang"]},{"n":7,"sec":"I","type":"mc","q":"Taking care of the family is _______ considered women’s duty in many Eastern countries.","opts":["traditional","traditionally","tradition","traditionalism"],"ans":"B","vi":"Ở nhiều nước phương Đông, chăm sóc gia đình theo truyền thống được xem là bổn phận của phụ nữ.","exp":"Chỗ trống đứng trước động từ (quá khứ phân từ) “considered” → cần trạng từ: traditionally (theo truyền thống).","optVi":["(tính từ) truyền thống","(trạng từ) theo truyền thống","(danh từ) truyền thống","chủ nghĩa truyền thống"]},{"n":8,"sec":"I","type":"mc","q":"Most ethnic minority peoples are good _______ farming techniques.","opts":["at","for","to","on"],"ans":"A","vi":"Phần lớn các dân tộc thiểu số đều giỏi kỹ thuật canh tác.","exp":"be good at + N/V-ing = giỏi về… (good for = tốt cho; good to = tốt với ai).","optVi":["giỏi về (good at)","tốt cho","tốt với","—"]},{"n":9,"sec":"I","type":"mc","q":"We _______ the Spring Festival on the 15th of January in the lunar calendar every year.","opts":["will hold","are holding","held","hold"],"ans":"D","vi":"Hằng năm chúng tôi tổ chức Lễ hội mùa xuân vào ngày 15 tháng Giêng âm lịch.","exp":"“every year” → thói quen, việc lặp lại → thì hiện tại đơn: We hold.","optVi":["sẽ tổ chức","đang tổ chức","đã tổ chức","tổ chức (thường xuyên)"]},{"n":10,"sec":"I","type":"mc","q":"Viet Nam has 54 ethnic _______.","opts":["groups","levels","turkeys","fields"],"ans":"A","vi":"Việt Nam có 54 dân tộc (nhóm dân tộc).","exp":"ethnic groups = các nhóm dân tộc.","optVi":["nhóm","cấp độ","gà tây","cánh đồng"]},{"n":11,"sec":"I","type":"mc","q":"Lahu, Mang, and Brau are _______ minorities in Viet Nam.","opts":["traditional","ethnic","awesome","natural"],"ans":"B","vi":"La Hủ, Mảng và Brâu là các dân tộc thiểu số ở Việt Nam.","exp":"ethnic minorities = dân tộc thiểu số – cụm cố định.","optVi":["truyền thống","(thuộc) dân tộc","tuyệt vời","tự nhiên"]},{"n":12,"sec":"I","type":"mc","q":"He tried to park his car but _______ space wasn't big enough.","opts":["the","Ø","a","an"],"ans":"A","vi":"Anh ấy cố đỗ xe nhưng chỗ đỗ (đó) không đủ rộng.","exp":"“space” ở đây là chỗ đỗ cụ thể mà cả người nói lẫn người nghe đều biết (chỗ anh ấy định đỗ) → dùng mạo từ xác định “the”.","optVi":["mạo từ xác định","không dùng mạo từ","một (trước phụ âm)","một (trước nguyên âm)"]},{"n":13,"sec":"I","type":"mc","q":"If we _______ the bamboo pole in the front yard at Tet, it will help chase away bad luck.","opts":["put","puts","will put","are putting"],"ans":"A","vi":"Nếu chúng ta dựng cây nêu ở sân trước vào dịp Tết, nó sẽ giúp xua đuổi vận xui.","exp":"Câu điều kiện loại 1: If + S + V (hiện tại đơn), S + will + V. Chủ ngữ “we” → put.","optVi":["đặt/dựng (we)","đặt (he/she/it)","sẽ đặt","đang đặt"]},{"n":14,"sec":"I","type":"mc","q":"Student A: Ooh, what a great tie! Where did you get it?\nStudent B: _______","opts":["Oh, thank you! I got it at a shop in Le Loi Street.","Don’t mention it. I bought it at a shop in Ha Noi.","No, it doesn’t look great at all.","Yes, I like it very much."],"ans":"A","wide":true,"vi":"Học sinh A: Ồ, cà vạt đẹp quá! Bạn mua ở đâu vậy? – Học sinh B: …","exp":"Được khen → cảm ơn, rồi trả lời câu hỏi “ở đâu”. “Don’t mention it” dùng để đáp lại lời cảm ơn, không phải lời khen.","optVi":["Ồ, cảm ơn nhé! Mình mua ở một cửa hàng trên đường Lê Lợi.","Không có gì. Mình mua ở một cửa hàng ở Hà Nội.","Không, nó chẳng đẹp chút nào.","Ừ, mình rất thích nó."]},{"n":15,"sec":"II","type":"mc","img":"sign15","q":"What does this sign tell you to do?","opts":["High-speed vehicles are permitted on this road.","You can drive as fast as you want here.","You should look for a parking lot near the school.","Drivers must slow down because school children are ahead."],"ans":"D","wide":true,"vi":"Biển báo “SLOW – SCHOOL ZONE” yêu cầu bạn làm gì?","exp":"SLOW SCHOOL ZONE = Đi chậm – Khu vực trường học → tài xế phải giảm tốc vì phía trước có học sinh.","optVi":["Xe chạy tốc độ cao được phép đi trên đường này.","Bạn có thể lái nhanh tùy thích ở đây.","Bạn nên tìm bãi đỗ xe gần trường.","Tài xế phải giảm tốc vì phía trước có học sinh."]},{"n":16,"sec":"II","type":"mc","img":"sign16","q":"What does this notification on the sign mean?","opts":["Only local pets are welcome here.","Pets are allowed if they are on a leash.","Pets are allowed in this area.","You are not allowed to bring pets here."],"ans":"D","wide":true,"vi":"Thông báo trên biển có nghĩa là gì? (NO PETS ALLOWED IN THE PROTECTED HERITAGE SITE)","exp":"NO PETS ALLOWED = Không được mang thú cưng vào khu di sản được bảo vệ.","optVi":["Chỉ thú cưng địa phương được chào đón.","Thú cưng được phép nếu có dây xích.","Thú cưng được phép vào khu vực này.","Bạn không được mang thú cưng vào đây."]},{"n":17,"sec":"III","type":"mc","ctx":"becoming more and more (17) _______ these days because of how user-friendly it is.","opts":["excited","unpopular","popular","interesting"],"ans":"C","vi":"…ngày càng phổ biến vì nó rất dễ sử dụng.","exp":"Dễ dùng → ngày càng phổ biến: popular. (excited = hào hứng – dùng cho người).","optVi":["hào hứng","không phổ biến","phổ biến","thú vị"]},{"n":18,"sec":"III","type":"mc","ctx":"Social media websites like Facebook, Instagram, Twitter, and others (18) _______ people to communicate with one another across distances.","opts":["enable","connects","connecting","cannot"],"ans":"A","vi":"Các trang mạng xã hội… giúp mọi người liên lạc với nhau dù ở xa.","exp":"enable + sb + to V = giúp/cho phép ai làm gì. Chủ ngữ số nhiều (websites) → enable.","optVi":["giúp, cho phép","kết nối (số ít)","đang kết nối","không thể"]},{"n":19,"sec":"III","type":"mc","ctx":"When we look (19) _______ social media’s positive aspects, …","opts":["at","for","in","on"],"ans":"A","vi":"Khi chúng ta nhìn vào mặt tích cực của mạng xã hội, …","exp":"look at = nhìn vào, xem xét. (look for = tìm kiếm).","optVi":["nhìn vào","tìm kiếm","—","—"]},{"n":20,"sec":"III","type":"mc","ctx":"…there (20) _______ several advantages.","opts":["is","are","isn’t","aren’t"],"ans":"B","vi":"…thì có nhiều lợi ích.","exp":"There + are + danh từ số nhiều (several advantages). Câu mang nghĩa khẳng định → are.","optVi":["có (số ít)","có (số nhiều)","không có (số ít)","không có (số nhiều)"]},{"n":21,"sec":"III","type":"mc","ctx":"(21) _______ social media is not used responsibly, it can have detrimental effects on a person who is using it.","opts":["Because","Although","If","While"],"ans":"C","vi":"Nếu mạng xã hội không được sử dụng có trách nhiệm, nó có thể gây tác hại cho người dùng.","exp":"Mệnh đề sau dùng “can have” → diễn tả điều kiện – kết quả → If (nếu).","optVi":["Bởi vì","Mặc dù","Nếu","Trong khi"]},{"n":22,"sec":"III","type":"mc","ctx":"Social media is (22) _______ when used excessively but useful if used productively.","opts":["harmless","better","benefits","harmful"],"ans":"D","vi":"Mạng xã hội có hại khi dùng quá mức nhưng hữu ích nếu dùng hiệu quả.","exp":"Có “but useful” → vế trước phải trái nghĩa: harmful (có hại). harmless = vô hại.","optVi":["vô hại","tốt hơn","lợi ích (danh từ)","có hại"]},{"n":23,"sec":"IV","type":"tf","q":"Ha Long Bay is located in Quang Ninh Province, in the northeast of Viet Nam.","ans":"TRUE","vi":"Vịnh Hạ Long nằm ở tỉnh Quảng Ninh, phía đông bắc Việt Nam.","exp":"Câu 1 đoạn 1: “…Ha Long Bay … in Quang Ninh province, in the northeast of Viet Nam.” → TRUE."},{"n":24,"sec":"IV","type":"tf","q":"Cua Van is the only ancient floating fishing village that remains in Ha Long Bay.","ans":"TRUE","vi":"Cửa Vạn là làng chài nổi cổ duy nhất còn lại ở vịnh Hạ Long.","exp":"“Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains.” → TRUE."},{"n":25,"sec":"IV","type":"tf","q":"The villagers usually buy fish from the mainland and sell it to other people.","ans":"FALSE","vi":"Dân làng thường mua cá từ đất liền rồi bán lại cho người khác.","exp":"Bài đọc: họ mang cá vào đất liền để ĐỔI lấy thức ăn, nước uống, quần áo (trade their fish for…), không phải mua cá từ đất liền → FALSE."},{"n":26,"sec":"IV","type":"tf","q":"Most children in Cua Van floating village attend floating schools.","ans":"TRUE","vi":"Phần lớn trẻ em ở làng chài nổi Cửa Vạn học ở trường nổi.","exp":"“Most children go to floating schools…” → TRUE."},{"n":27,"sec":"IV","type":"mc","q":"The passage is mainly about:","opts":["How Ha Long Bay became a UNESCO World Heritage.","The beauty of nature in Ha Long Bay.","The life of people in Cua Van ancient village.","The geographical features of Ha Long Bay."],"ans":"C","wide":true,"vi":"Đoạn văn chủ yếu nói về:","exp":"Cả bài tập trung mô tả cuộc sống của dân làng chài Cửa Vạn (nhà nổi, đánh cá, trẻ em học trường nổi…).","optVi":["Vịnh Hạ Long trở thành Di sản UNESCO như thế nào.","Vẻ đẹp thiên nhiên của vịnh Hạ Long.","Cuộc sống của người dân làng cổ Cửa Vạn.","Đặc điểm địa lý của vịnh Hạ Long."]},{"n":28,"sec":"IV","type":"mc","q":"The word “they” in paragraph 2 is closest in meaning to:","opts":["the houses","the villagers","the builders","the schools"],"ans":"B","vi":"Từ “they” ở đoạn 2 gần nghĩa nhất với:","exp":"“The villagers spend their days fishing… Then they sail to the mainland…” → they = the villagers (dân làng).","optVi":["những ngôi nhà","dân làng","thợ xây","trường học"]},{"n":29,"sec":"V","type":"input","q":"Many _______ nations are facing economic challenges due to the global crisis. (develop)","word":"develop","ans":["developing"],"vi":"Nhiều quốc gia đang phát triển đang đối mặt với thách thức kinh tế do khủng hoảng toàn cầu.","exp":"Trước danh từ “nations” cần tính từ. developing nations = các nước đang phát triển (developed = đã phát triển, không hợp ngữ cảnh gặp khó khăn)."},{"n":30,"sec":"V","type":"input","q":"The Pa Then believe that the god of fire brings them _______ and prosperity. (peaceful)","word":"peaceful","ans":["peace"],"vi":"Người Pà Thẻn tin rằng thần lửa mang lại cho họ sự bình yên và thịnh vượng.","exp":"Cấu trúc song song “___ and prosperity” (danh từ) → cần danh từ: peace (hòa bình, bình yên)."},{"n":31,"sec":"V","type":"input","q":"Many teenagers feel _______ because of too much homework and exam pressure. (stress)","word":"stress","ans":["stressed"],"vi":"Nhiều thiếu niên cảm thấy căng thẳng vì quá nhiều bài tập về nhà và áp lực thi cử.","exp":"feel + tính từ. Chỉ cảm xúc của người → tính từ đuôi -ed: stressed (bị căng thẳng). stressful = gây căng thẳng (dùng cho sự việc)."},{"n":32,"sec":"V","type":"input","q":"Farmers in this region grow crops _______ to supply the local markets. (diverse)","word":"diverse","ans":["diversely"],"vi":"Nông dân vùng này trồng trọt đa dạng để cung cấp cho chợ địa phương.","exp":"Bổ nghĩa cho động từ “grow (crops)” → cần trạng từ: diversely (một cách đa dạng)."},{"n":33,"sec":"V","type":"input","q":"She has a valuable _______ of ancient coins that she has gathered over the past ten years. (collect)","word":"collect","ans":["collection"],"vi":"Cô ấy có một bộ sưu tập tiền xu cổ quý giá mà cô đã gom góp trong mười năm qua.","exp":"Sau “a valuable” (mạo từ + tính từ) cần danh từ số ít: collection (bộ sưu tập)."},{"n":34,"sec":"V","type":"input","q":"Villagers join festivals to _______ their relationships. (strong)","word":"strong","ans":["strengthen"],"vi":"Dân làng tham gia lễ hội để thắt chặt mối quan hệ của họ.","exp":"Sau “to” cần động từ nguyên mẫu: strengthen (làm mạnh thêm, củng cố)."},{"n":35,"sec":"VI","type":"input","q":"For the museum's opening night, the staff wore _______ from the 18th century.","ans":["historical costumes","historical costume"],"vi":"Trong đêm khai trương bảo tàng, nhân viên mặc trang phục lịch sử từ thế kỷ 18.","exp":"Dựa vào ví dụ “an elaborate historical costume” → historical costumes (số nhiều vì nhiều nhân viên mặc)."},{"n":36,"sec":"VI","type":"input","q":"At the international cultural fair, each participant proudly wears their _______.","ans":["national costume","traditional national costume","national costumes","traditional national costumes"],"vi":"Tại hội chợ văn hóa quốc tế, mỗi người tham gia đều tự hào mặc trang phục dân tộc của mình.","exp":"Dựa vào ví dụ “a traditional national costume” → (traditional) national costume = trang phục dân tộc (truyền thống)."},{"n":37,"sec":"VII","type":"build","q":"Hurry up, or you will miss the bus to the ethnic minority village.","lead":"If","target":"If you don't hurry up, you will miss the bus","tail":"to the ethnic minority village.","extra":["won't","do"],"ans":["If you don't hurry up, you will miss the bus to the ethnic minority village.","If you do not hurry up, you will miss the bus to the ethnic minority village."],"vi":"Nhanh lên, nếu không bạn sẽ lỡ chuyến xe buýt đến làng dân tộc thiểu số. → Nếu bạn không nhanh lên, bạn sẽ lỡ xe buýt…","exp":"Mệnh lệnh + or (nếu không thì) → If + S + don't + V, S + will + V (câu điều kiện loại 1)."},{"n":38,"sec":"VII","type":"build","q":"You shouldn’t take photos inside the temple during the ceremony.","lead":"You had","target":"You had better not take photos","tail":"inside the temple during the ceremony.","extra":["to","don't"],"ans":["You had better not take photos inside the temple during the ceremony.","You'd better not take photos inside the temple during the ceremony."],"vi":"Bạn không nên chụp ảnh trong đền khi đang diễn ra nghi lễ.","exp":"shouldn't + V = had better not + V (tốt hơn hết là không nên). Sau “had better not” dùng động từ nguyên mẫu không “to”."},{"n":39,"sec":"VII","type":"build","q":"Because the weather in the mountains is cold, many ethnic families weave warm clothes.","lead":"The weather","target":"The weather in the mountains is cold, so","tail":"many ethnic families weave warm clothes.","extra":["because","but"],"ans":["The weather in the mountains is cold, so many ethnic families weave warm clothes."],"vi":"Vì thời tiết vùng núi lạnh nên nhiều gia đình dân tộc dệt quần áo ấm.","exp":"Because + nguyên nhân, kết quả → Nguyên nhân, so + kết quả (“so” = vì vậy, nên)."},{"n":40,"sec":"VII","type":"build","q":"Lan is a more careful writer of English essays than Minh.","lead":"Lan writes","target":"Lan writes English essays more carefully than Minh","tail":"","extra":["careful","most"],"ans":["Lan writes English essays more carefully than Minh.","Lan writes English essays more carefully than Minh does."],"vi":"Lan là người viết bài luận tiếng Anh cẩn thận hơn Minh. → Lan viết bài luận tiếng Anh cẩn thận hơn Minh.","exp":"a more careful writer (tính từ bổ nghĩa danh từ) → writes more carefully (trạng từ bổ nghĩa động từ). So sánh hơn trạng từ dài: more + adv + than."}];const SECTIONS=[{"id":"I","title":"I. Choose the word / phrase (A, B, C or D) that best fits the space or best answers the requirement in each sentence. (3.5 pts)","short":"Trắc nghiệm"},{"id":"II","title":"II. Look at the signs. Choose the best answer (A, B, C or D) for questions 15 and 16. (0.5 pt)","short":"Biển báo"},{"id":"III","title":"III. Choose the correct answer that best fits the blank space in the following passage. (1.5 pts)","short":"Điền đoạn văn"},{"id":"IV","title":"IV. Read the passage, then decide if the statements are TRUE or FALSE (23–26) and choose the correct answer (27–28). (1.5 pts)","short":"Đọc hiểu"},{"id":"V","title":"V. Use the correct form of the word given in each sentence. (1.5 pts)","short":"Dạng từ"},{"id":"VI","title":"VI. Look at the dictionary entry. Use it to complete the sentences with two or three words. (0.5 pt)","short":"Từ điển"},{"id":"VII","title":"VII. Finish each sentence so that it means exactly the same as the sentence before it. (1.0 pt)","short":"Viết lại câu"}];const PASSAGE3=["Social networking is a technology that is becoming more and more (17) _______ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others (18) _______ people to communicate with one another across distances.","When we look (19) _______ social media’s positive aspects, there (20) _______ several advantages. Despite these clear benefits, social networking is viewed as one of society’s most damaging forces. (21) _______ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is (22) _______ when used excessively but useful if used productively."];const PASSAGE3_VI="Mạng xã hội là một công nghệ ngày càng phổ biến vì nó rất dễ sử dụng. Các trang mạng xã hội như Facebook, Instagram, Twitter… giúp mọi người liên lạc với nhau dù ở xa. Khi nhìn vào mặt tích cực của mạng xã hội, có nhiều lợi ích. Dù có những lợi ích rõ ràng này, mạng xã hội vẫn bị xem là một trong những tác nhân gây hại nhất cho xã hội. Nếu mạng xã hội không được dùng một cách có trách nhiệm, nó có thể gây ảnh hưởng xấu cho người dùng. Tóm lại, mạng xã hội có cả ưu và nhược điểm. Nó có hại khi dùng quá mức nhưng hữu ích nếu dùng hiệu quả.";const PASSAGE4=["There is an ethnic group living in Ha Long Bay which is a UNESCO World Heritage site in Quang Ninh province, in the northeast of Viet Nam. It has got over 1,600 islands and islets. Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains. All the houses and buildings in the village float on huge wooden rafts.","The villagers spend their days fishing and looking after the sea life. Then they sail to the mainland to trade their fish for things like food, drinking water or clothes. Most children go to floating schools and then spend the rest of their time learning important skills like swimming and fishing. They also help out their parents as much as they can. This lifestyle may seem strange to many people, but it’s so wonderful to live among such natural beauty and know you are protecting it. The villagers are able to help preserve their beautiful bay because they live directly on the water."];const PASSAGE4_VI="Có một nhóm dân tộc sống ở vịnh Hạ Long – Di sản Thế giới UNESCO thuộc tỉnh Quảng Ninh, phía đông bắc Việt Nam. Vịnh có hơn 1.600 hòn đảo lớn nhỏ. Trong số nhiều làng chài cổ ở vịnh Hạ Long, chỉ còn lại làng chài nổi Cửa Vạn. Tất cả nhà cửa trong làng đều nổi trên những bè gỗ lớn. Dân làng dành cả ngày đánh cá và chăm sóc sinh vật biển. Sau đó họ chèo thuyền vào đất liền để đổi cá lấy thức ăn, nước uống hay quần áo. Phần lớn trẻ em học ở trường nổi, thời gian còn lại học các kỹ năng quan trọng như bơi và đánh cá. Các em cũng giúp đỡ bố mẹ nhiều nhất có thể. Lối sống này có vẻ lạ với nhiều người, nhưng thật tuyệt khi được sống giữa thiên nhiên đẹp như vậy và biết rằng mình đang bảo vệ nó. Dân làng có thể góp phần giữ gìn vịnh vì họ sống ngay trên mặt nước.";const DICT={"head":"costume /ˈkɒstjuːm/ noun","def":"the clothes worn by actors in a play or film/movie, or worn by somebody pretending to be somebody else","defVi":"trang phục do diễn viên mặc trong vở kịch/phim, hoặc do ai đó mặc để hóa trang thành người khác","ex":["The actors were already in full costume.","She wore an elaborate historical costume to the party.","The children dressed up in Halloween costumes.","She wears a traditional national costume for the festival."]};const IMG={sign15:"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEUAPgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2Jyg const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => esc(s).replace(/\[\[(.*?)\]\]/g, "<u>$1</u>").replace(/_{3,}/g, '<span class="blank">&nbsp;</span>');
const plain = (s) => s.replace(/\[\[|\]\]/g, "");
const norm = (s) => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,!?;:()]/g, " ").replace(/\s+/g, " ").trim();
const L = ["A", "B", "C", "D"];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let best = {}; try { best = JSON.parse(localStorage.getItem("anh8best") || "{}"); } catch (e) {}

const UNITS = [{ id: "ALL", t: "Cả đề (40 câu)", s: "Làm toàn bộ đề như thi thật" }].concat(SECTIONS.map((s) => {
  const qs = Q.filter((q) => q.sec === s.id);
  return { id: s.id, t: "Phần " + s.id + " – " + s.short, s: "Câu " + qs[0].n + "–" + qs[qs.length - 1].n };
}));
function home() {
  $("#home").style.display = ""; $("#lesson").style.display = "none"; $("#end").style.display = "none";
  $("#path").innerHTML = UNITS.map((u) => `<button class="unit" data-u="${u.id}"><span class="dot">${u.id === "ALL" ? "★" : u.id}</span><span><b>${esc(u.t)}</b><small>${esc(u.s)}</small></span>${best[u.id] != null ? `<span class="best">${best[u.id]}%</span>` : ""}</button>`).join("");
}
$("#path").addEventListener("click", (e) => { const b = e.target.closest(".unit"); if (b) start(b.dataset.u); });

let S;
function start(unit, list) {
  const qs = list || (unit === "ALL" ? Q : Q.filter((q) => q.sec === unit));
  S = { redo: !!list, unit, queue: qs.slice(), total: qs.length, done: 0, first: {}, wrong: [], streak: 0, maxStreak: 0, xp: 0, cur: null, state: "ask", pick: null, built: [] };
  $("#home").style.display = "none"; $("#end").style.display = "none"; $("#lesson").style.display = "flex";
  next();
}
function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .9; speechSynthesis.speak(u); } catch (e) {} }
const SAY = '<button class="say" data-say aria-label="Nghe đọc"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#fff"/><path d="M16 8a5 5 0 010 8M19 5a9 9 0 010 14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>';

function next() {
  const q = S.queue.shift(); S.cur = q; S.state = "ask"; S.pick = null; S.built = [];
  $("#prog").style.width = (S.done / S.total * 100) + "%";
  $("#streak").textContent = S.streak;
  const foot = $("#foot"); foot.className = "foot"; $("#fb").innerHTML = ""; $("#go").textContent = "Kiểm tra"; $("#go").disabled = true;
  const sec = SECTIONS.find((s) => s.id === q.sec);
  let h = `<div class="tag">Câu ${q.n} · ${esc(sec.short)}${S.first[q.n] === false ? " · làm lại" : ""}</div>`;
  if (q.sec === "III") h += passage(PASSAGE3, PASSAGE3_VI, false);
  if (q.sec === "IV") h += passage(PASSAGE4, PASSAGE4_VI, q.n === 23 || S.unit === "IV" && S.done === 0);
  if (q.sec === "VI") h += `<details class="pass" open><summary>Mục từ điển</summary><p><b>${esc(DICT.head)}</b> – ${esc(DICT.def)}</p><ul style="font-weight:600;font-size:15px;margin:4px 0">${DICT.ex.map((x) => `<li><i>${esc(x)}</i></li>`).join("")}</ul></details>`;
  if (q.img) h += `<img class="sign" src="${IMG[q.img]}" alt="Biển báo câu ${q.n}">`;
  const text = q.ctx || q.q;
  if (q.type === "build") h += `<div class="qtext">${SAY}Viết lại câu sao cho nghĩa không đổi:\n“${fmt(text)}”</div>`;
  else h += `<div class="qtext">${q.type === "mc" && q.n <= 4 ? "" : SAY}${fmt(text)}</div>`;
  if (q.type === "mc") h += `<div class="opts">${q.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${fmt(o)}</span></button>`).join("")}</div>`;
  if (q.type === "tf") h += `<div class="opts tf">${["TRUE", "FALSE"].map((o, i) => `<button class="opt" data-v="${o}"><span>${o}</span></button>`).join("")}</div>`;
  if (q.type === "input") h += `<input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.word ? "Viết dạng đúng của “" + esc(q.word) + "”" : "Điền 2–3 từ"}"><p class="hint">Gõ câu trả lời rồi nhấn Enter.</p>`;
  if (q.type === "build") {
    S.tiles = shuffle(q.target.split(" ").concat(q.extra));
    h += `<p class="lead">Chạm vào các từ để ghép câu:</p><div class="slots" id="slots"></div>${q.tail ? `<p class="tail">… ${esc(q.tail)}</p>` : ""}<div class="bank" id="bank">${S.tiles.map((t, i) => `<button class="tile" data-t="${i}">${esc(t)}</button>`).join("")}</div>`;
  }
  $("#q").innerHTML = h; window.scrollTo(0, 0);
  const inp = $("#inp"); if (inp) { inp.focus(); inp.addEventListener("input", () => { $("#go").disabled = !inp.value.trim(); }); }
}
function passage(arr, vi, open) {
  return `<details class="pass"${open ? " open" : ""}><summary>Đọc đoạn văn</summary>${arr.map((p) => `<p>${fmt(p)}</p>`).join("")}<details><summary>Xem bản dịch</summary><p>${esc(vi)}</p></details></details>`;
}

$("#q").addEventListener("click", (e) => {
  if (e.target.closest("[data-say]")) { const q = S.cur; speak(plain((q.ctx || q.q)).replace(/_{3,}|\(\d+\)/g, " blank ")); return; }
  if (S.state !== "ask") return;
  const o = e.target.closest(".opt");
  if (o) { document.querySelectorAll(".opt").forEach((x) => x.classList.remove("sel")); o.classList.add("sel"); S.pick = o.dataset.i != null ? L[+o.dataset.i] : o.dataset.v; $("#go").disabled = false; return; }
  const t = e.target.closest(".tile");
  if (t) { const i = +t.dataset.t; if (t.parentNode.id === "bank") { S.built.push(i); t.classList.add("used"); } else { S.built = S.built.filter((x) => x !== i); document.querySelector(`#bank [data-t="${i}"]`).classList.remove("used"); } drawSlots(); }
});
function drawSlots() {
  $("#slots").innerHTML = S.built.map((i) => `<button class="tile" data-t="${i}">${esc(S.tiles[i])}</button>`).join("");
  $("#go").disabled = !S.built.length;
}

function check() {
  const q = S.cur; let ok = false, given = "";
  if (q.type === "mc" || q.type === "tf") { given = S.pick; ok = S.pick === q.ans; }
  if (q.type === "input") { given = $("#inp").value; ok = q.ans.some((a) => norm(a) === norm(given)); $("#inp").disabled = true; }
  if (q.type === "build") { given = S.built.map((i) => S.tiles[i]).join(" "); ok = norm(given) === norm(q.target); }
  if (S.first[q.n] === undefined) { S.first[q.n] = ok; if (!ok) S.wrong.push({ q, given }); }
  if (ok) { S.done++; S.streak++; S.maxStreak = Math.max(S.maxStreak, S.streak); S.xp += 10; }
  else { S.streak = 0; S.queue.push(q); }
  // mark options
  if (q.type === "mc") document.querySelectorAll(".opt").forEach((x, i) => { if (L[i] === q.ans) x.classList.add("ok"); else if (x.classList.contains("sel")) x.classList.add("no"); });
  if (q.type === "tf") document.querySelectorAll(".opt").forEach((x) => { if (x.dataset.v === q.ans) x.classList.add("ok"); else if (x.classList.contains("sel")) x.classList.add("no"); });
  S.state = "shown";
  $("#prog").style.width = (S.done / S.total * 100) + "%"; $("#streak").textContent = S.streak;
  const right = q.type === "mc" ? q.ans + ". " + plain(q.opts[L.indexOf(q.ans)]) : q.type === "build" ? q.ans[0] : Array.isArray(q.ans) ? q.ans[0] : q.ans;
  const PRAISE = ["Tuyệt vời!", "Chính xác!", "Giỏi lắm!", "Quá đỉnh!", "Đúng rồi!"];
  let h = `<h3>${ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : "Chưa đúng rồi"}</h3>`;
  if (!ok) h += `<p><span class="lab">Đáp án đúng:</span> ${esc(right)}</p>`;
  h += `<p><span class="lab">Dịch nghĩa:</span> ${esc(q.vi)}</p><p><span class="lab">Giải thích:</span> ${esc(q.exp)}</p>`;
  if (q.optVi && q.type === "mc") h += `<ul>${q.opts.map((o, i) => `<li><b>${L[i]}.</b> ${esc(plain(o))} – ${esc(q.optVi[i])}</li>`).join("")}</ul>`;
  $("#fb").innerHTML = h;
  $("#foot").className = "foot " + (ok ? "good" : "bad");
  $("#go").textContent = "Tiếp tục"; $("#go").disabled = false; $("#go").focus();
}
$("#go").addEventListener("click", () => { if (S.state === "ask") check(); else if (S.queue.length) next(); else finish(); });
document.addEventListener("keydown", (e) => {
  if ($("#lesson").style.display !== "flex") return;
  if (e.key === "Enter") { if (!$("#go").disabled) { e.preventDefault(); $("#go").click(); } return; }
  if (S.state === "ask" && /^[1-4]$/.test(e.key) && document.activeElement.id !== "inp") { const o = document.querySelectorAll(".opt")[+e.key - 1]; if (o) o.click(); }
});
$("#quit").addEventListener("click", home);

function finish() {
  $("#lesson").style.display = "none";
  const firstOk = Object.values(S.first).filter(Boolean).length;
  const pct = Math.round(firstOk / S.total * 100);
  if (!S.redo && (best[S.unit] == null || pct > best[S.unit])) { best[S.unit] = pct; try { localStorage.setItem("anh8best", JSON.stringify(best)); } catch (e) {} }
  const msg = pct === 100 ? "Hoàn hảo! Không sai câu nào." : pct >= 80 ? "Rất tốt! Ôn lại vài câu sai là chắc điểm cao." : pct >= 50 ? "Khá ổn! Xem lại các câu sai bên dưới nhé." : "Cố lên! Đọc kỹ giải thích rồi làm lại các câu sai.";
  const end = $("#end"); end.style.display = "block";
  end.innerHTML = `<h1>Hoàn thành bài!</h1><p class="sub">${esc(msg)}</p>
  <div class="stats"><div class="stat s1"><b>Tổng XP</b><span>${S.xp}</span></div><div class="stat s2"><b>Đúng lần đầu</b><span>${firstOk}/${S.total}</span></div><div class="stat s3"><b>Chuỗi dài nhất</b><span>${S.maxStreak}</span></div></div>
  ${S.wrong.length ? `<h2 style="text-align:left;font-size:22px;margin:0">Các câu đã sai</h2><div class="review">${S.wrong.map(({ q, given }) => {
    const right = q.type === "mc" ? q.ans + ". " + plain(q.opts[L.indexOf(q.ans)]) : Array.isArray(q.ans) ? q.ans[0] : q.ans;
    return `<div class="rv"><div><b>Câu ${q.n}.</b> ${fmt(q.ctx || q.q)}</div><div>Em chọn: ${esc(given || "—")} · <span class="ans">Đúng: ${esc(right)}</span></div><div style="color:var(--mute)">${esc(q.exp)}</div></div>`;
  }).join("")}</div>` : ""}
  <div class="row">${S.wrong.length ? `<button class="btn red" id="redo">Làm lại câu sai</button>` : ""}<button class="btn" id="again">Làm lại từ đầu</button><button class="btn ghost" id="back">Về trang chính</button></div>`;
  const w = S.wrong.map((x) => x.q), u = S.unit;
  if ($("#redo")) $("#redo").onclick = () => start(u, w);
  $("#again").onclick = () => start(u); $("#back").onclick = home;
  window.scrollTo(0, 0);
}
window.lessonState = () => S;
home();
}
</script>
