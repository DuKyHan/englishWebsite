héo léo trong việc dệt vải. Họ làm ra những tấm vải và túi thổ cẩm đẹp, và trang phục truyền thống của họ thường có màu chàm sẫm.\n\nNgười Tày có nền văn hóa phong phú. Hát Then, thường được biểu diễn cùng đàn tính, là một loại hình nghệ thuật dân gian nổi tiếng của người Tày và được UNESCO công nhận. Trong các lễ hội, người Tày chơi trò chơi dân gian và thưởng thức những món ăn đặc biệt như xôi ngũ sắc.","id":"read:0"},{"title":"The Mid-Autumn Festival","unit":"Unit 5","passage":"The Mid-Autumn Festival, or Tet Trung Thu, takes place on the 15th day of the eighth lunar month, when the moon is the fullest and brightest. In the past, it was a time for farmers to celebrate the end of the harvest and to thank the gods for good crops. Today, it is mainly a festival for children.\n\nA few weeks before the festival, shops and streets are full of colourful lanterns in many shapes, such as stars, fish and rabbits. Families buy mooncakes, which are often filled with lotus seeds, green beans or mixed nuts, to give to relatives and friends. On the night of the festival, children carry lanterns and walk around their neighbourhood. They also watch lion dances, which people believe bring good luck. Later, families sit together, eat mooncakes, drink tea and admire the full moon. For many Vietnamese people, the Mid-Autumn Festival is a time of family bonding and happy memories.","tf":[{"q":"The Mid-Autumn Festival is held when the moon is the fullest.","a":true,"ex":"Bài viết: \"<i>takes place on the 15th day of the eighth lunar month, when the moon is the fullest and brightest<\/i>\" (take place = be held).","vi":"Tết Trung thu được tổ chức khi trăng tròn nhất."},{"q":"In the past, the festival was mainly for children.","a":false,"ex":"Bài viết: \"<i>In the past, it was a time for <b>farmers<\/b>… Today, it is mainly a festival for children.<\/i>\" → ngày xưa dành cho nông dân, <b>ngày nay<\/b> mới dành cho trẻ em.","vi":"Ngày xưa, lễ hội chủ yếu dành cho trẻ em."},{"q":"Lanterns are made only in the shape of stars.","a":false,"ex":"Bài viết: \"<i>lanterns in many shapes, such as stars, fish and rabbits<\/i>\" → có nhiều hình dạng, không chỉ ngôi sao (bẫy từ \"only\").","vi":"Đèn lồng chỉ được làm hình ngôi sao."},{"q":"People believe that lion dances bring good luck.","a":true,"ex":"Bài viết: \"<i>lion dances, which people believe bring good luck<\/i>\".","vi":"Mọi người tin rằng múa lân mang lại may mắn."}],"mc":[{"o":["lotus seeds","green beans","mixed nuts","sticky rice"],"a":3,"ex":"Bài viết nêu nhân bánh: \"<i>lotus seeds, green beans or mixed nuts<\/i>\". <b>sticky rice<\/b> (gạo nếp, xôi) không được nhắc đến → đáp án.","vi":"Bánh trung thu có thể có tất cả các loại nhân sau, NGOẠI TRỪ: xôi (gạo nếp).","q":"Mooncakes may be filled with all of the following EXCEPT ______."},{"o":["How to make mooncakes","The Mid-Autumn Festival in Viet Nam","Lantern shops in Ha Noi","Harvest time in the countryside"],"a":1,"ex":"Cả bài nói về nguồn gốc và các hoạt động của Tết Trung thu → tiêu đề bao quát: <b>Tết Trung thu ở Việt Nam<\/b>.","vi":"Tiêu đề phù hợp nhất cho đoạn văn là gì? → Tết Trung thu ở Việt Nam.","q":"Which is the best title for the passage?"}],"vi":"Tết Trung thu diễn ra vào ngày rằm tháng Tám âm lịch, khi trăng tròn và sáng nhất. Ngày xưa, đây là dịp để nông dân mừng kết thúc mùa gặt và tạ ơn thần linh vì một vụ mùa bội thu. Ngày nay, Trung thu chủ yếu là lễ hội dành cho trẻ em.\n\nVài tuần trước lễ hội, các cửa hàng và đường phố tràn ngập đèn lồng đủ màu sắc với nhiều hình dạng như ngôi sao, con cá và con thỏ. Các gia đình mua bánh trung thu, thường có nhân hạt sen, đậu xanh hoặc thập cẩm, để biếu họ hàng và bạn bè. Vào đêm hội, trẻ em cầm đèn lồng đi quanh xóm. Các em cũng xem múa lân, điệu múa mà mọi người tin là mang lại may mắn. Sau đó, cả gia đình quây quần ăn bánh, uống trà và ngắm trăng rằm. Với nhiều người Việt, Tết Trung thu là dịp gắn kết gia đình và lưu giữ những kỉ niệm vui vẻ.","id":"read:1"},{"title":"Tet customs","unit":"Unit 5","passage":"Tet, or the Lunar New Year, is the most important festival in Viet Nam. Before Tet, people clean and decorate their houses. In the North, people usually buy peach blossoms, while in the South, people prefer apricot blossoms. Many families also put a kumquat tree in their living room as a symbol of wealth.\n\nVietnamese people follow many customs during Tet. On the first day, the first visitor to a house is very important because people believe he or she will bring luck for the whole year. Children wear new clothes and wish their grandparents and parents a long and healthy life. In return, they receive lucky money in red envelopes. People also avoid sweeping the floor during the first days of Tet because they are afraid of sweeping away good luck. Today, some families travel during Tet instead of staying at home, but most people still return to their hometowns for family reunions.","tf":[{"q":"Peach blossoms are popular in the North of Viet Nam at Tet.","a":true,"ex":"Bài viết: \"<i>In the North, people usually buy peach blossoms<\/i>\".","vi":"Hoa đào được ưa chuộng ở miền Bắc Việt Nam vào dịp Tết."},{"q":"The kumquat tree is a symbol of long life.","a":false,"ex":"Bài viết: \"<i>a kumquat tree… as a symbol of <b>wealth<\/b><\/i>\" → biểu tượng của sự giàu có, không phải sống lâu.","vi":"Cây quất là biểu tượng của sự sống lâu."},{"q":"Children give lucky money to their grandparents.","a":false,"ex":"Bài viết: \"<i>In return, they <b>receive<\/b> lucky money<\/i>\" → trẻ em <b>nhận<\/b> tiền lì xì, không phải cho.","vi":"Trẻ em lì xì cho ông bà."},{"q":"Some families now go travelling during Tet.","a":true,"ex":"Bài viết: \"<i>Today, some families travel during Tet instead of staying at home<\/i>\".","vi":"Ngày nay một số gia đình đi du lịch trong dịp Tết."}],"mc":[{"o":["Because they are too busy.","Because they don't want to sweep away good luck.","Because the floor is already clean.","Because the first visitor will do it."],"a":1,"ex":"Bài viết: \"<i>because they are afraid of sweeping away good luck<\/i>\" (sợ quét mất may mắn = không muốn quét đi may mắn).","vi":"Tại sao người ta tránh quét nhà trong những ngày đầu năm? → Vì họ không muốn quét mất may mắn.","q":"Why do people avoid sweeping the floor during the first days of Tet?"},{"o":["the first visitor","the grandparent","the child","the host"],"a":0,"ex":"Câu chứa từ: \"<i>the first visitor to a house is very important because people believe he or she will bring luck<\/i>\" → <b>người đến nhà đầu tiên<\/b>.","vi":"Cụm \"he or she\" ở đoạn 2 chỉ người đầu tiên đến nhà (người xông đất).","q":"The words \"he or she\" in paragraph 2 refer to ______."}],"vi":"Tết, hay Tết Nguyên đán, là lễ hội quan trọng nhất ở Việt Nam. Trước Tết, mọi người dọn dẹp và trang trí nhà cửa. Ở miền Bắc, người ta thường mua hoa đào, còn ở miền Nam, người ta thích hoa mai hơn. Nhiều gia đình cũng đặt một cây quất trong phòng khách như biểu tượng của sự sung túc.\n\nNgười Việt theo nhiều phong tục trong dịp Tết. Vào ngày mùng Một, vị khách đầu tiên đến nhà rất quan trọng vì người ta tin rằng người đó sẽ mang lại may mắn cho cả năm. Trẻ em mặc quần áo mới và chúc ông bà, bố mẹ sống lâu, mạnh khỏe. Đáp lại, các em được nhận tiền lì xì trong phong bao đỏ. Mọi người cũng tránh quét nhà trong những ngày đầu năm vì sợ quét mất may mắn. Ngày nay, một số gia đình đi du lịch trong dịp Tết thay vì ở nhà, nhưng hầu hết mọi người vẫn trở về quê để đoàn tụ gia đình.","id":"read:2"},{"title":"The Gong Festival in the Central Highlands","unit":"Unit 4","passage":"The Space of Gong Culture in the Central Highlands of Viet Nam was recognised by UNESCO as a Masterpiece of the Oral and Intangible Heritage of Humanity in 2005. Every year, many provinces in the Central Highlands such as Gia Lai, Kon Tum and Dak Lak hold gong festivals.\n\nFor ethnic groups such as the Ede, the Ba Na and the Gia Rai, gongs are not only musical instruments but also sacred objects. People believe that every gong has its own god, and the older the gong is, the more powerful its god is. Gongs are played at important events in a person's life, from birth to death, and in ceremonies such as the new rice celebration.\n\nDuring the festival, people gather around a fire in front of the communal house. Men play the gongs while women in colourful traditional costumes dance in a circle. Visitors can also enjoy rice wine, grilled meat and other local specialities. The festival is a great chance for tourists to learn about the culture of the ethnic minorities in the Central Highlands.","tf":[{"q":"The Space of Gong Culture was recognised by UNESCO in 2005.","a":true,"ex":"Bài viết: \"<i>…was recognised by UNESCO… in 2005<\/i>\".","vi":"Không gian văn hóa Cồng chiêng được UNESCO công nhận năm 2005."},{"q":"Gong festivals are only held in Gia Lai province.","a":false,"ex":"Bài viết: \"<i><b>many provinces<\/b>… such as Gia Lai, Kon Tum and Dak Lak hold gong festivals<\/i>\" → nhiều tỉnh, không chỉ Gia Lai (bẫy \"only\").","vi":"Lễ hội cồng chiêng chỉ được tổ chức ở tỉnh Gia Lai."},{"q":"People believe that older gongs have more powerful gods.","a":true,"ex":"Bài viết: \"<i>the older the gong is, the more powerful its god is<\/i>\".","vi":"Người ta tin rằng những chiếc cồng cổ hơn có vị thần quyền năng hơn."},{"q":"During the festival, women play the gongs and men dance.","a":false,"ex":"Bài viết: \"<i><b>Men<\/b> play the gongs while <b>women<\/b>… dance<\/i>\" → bị đảo ngược đối tượng.","vi":"Trong lễ hội, phụ nữ đánh cồng chiêng còn đàn ông nhảy múa."}],"mc":[{"o":["In a pagoda","In front of the communal house","At the market","In the rice fields"],"a":1,"ex":"Bài viết: \"<i>people gather around a fire in front of the communal house<\/i>\".","vi":"Mọi người tụ họp ở đâu trong lễ hội? → Trước nhà rông.","q":"Where do people gather during the festival?"},{"o":["How to play the gongs","The gong festival and its meaning","Rice wine in the Central Highlands","Traditional costumes of the Ede"],"a":1,"ex":"Bài nói về sự công nhận của UNESCO, ý nghĩa thiêng liêng của cồng chiêng và hoạt động trong lễ hội → <b>lễ hội cồng chiêng và ý nghĩa của nó<\/b>.","vi":"Đoạn văn chủ yếu nói về điều gì? → Lễ hội cồng chiêng và ý nghĩa của nó.","q":"What is the passage mainly about?"}],"vi":"Không gian Văn hóa Cồng chiêng Tây Nguyên của Việt Nam được UNESCO công nhận là Kiệt tác Di sản Truyền khẩu và Phi vật thể của Nhân loại vào năm 2005. Hằng năm, nhiều tỉnh ở Tây Nguyên như Gia Lai, Kon Tum và Đắk Lắk tổ chức lễ hội cồng chiêng.\n\nVới các dân tộc như Ê-đê, Ba Na và Gia Rai, cồng chiêng không chỉ là nhạc cụ mà còn là vật linh thiêng. Người ta tin rằng mỗi chiếc cồng đều có vị thần riêng, và cồng càng cổ thì vị thần càng quyền năng. Cồng chiêng được đánh trong những sự kiện quan trọng của đời người, từ lúc sinh ra đến khi mất đi, và trong các nghi lễ như lễ mừng lúa mới.\n\nTrong lễ hội, mọi người tụ họp quanh đống lửa trước nhà rông. Đàn ông đánh cồng chiêng trong khi phụ nữ mặc trang phục truyền thống sặc sỡ nhảy múa thành vòng tròn. Du khách cũng có thể thưởng thức rượu cần, thịt nướng và các đặc sản địa phương khác. Lễ hội là cơ hội tuyệt vời để du khách tìm hiểu văn hóa của các dân tộc thiểu số ở Tây Nguyên.","id":"read:3"},{"title":"The Ede long houses","unit":"Unit 4","passage":"The Ede live mainly in Dak Lak province in the Central Highlands. They are famous for their long houses. A long house is a type of stilt house made of wood and bamboo. It can be up to 100 metres long, and many families of the same big family live in it together. People say that the longer the house is, the richer the family is.\n\nThe Ede follow a matrilineal system: women are the heads of the family, and children take their mother's family name. After marriage, the husband comes to live in his wife's house.\n\nThe Ede mainly grow rice, coffee and vegetables on the hills. They also raise animals such as pigs, chickens and buffaloes. Ede women are good at weaving, and their brocade is famous for its black colour with red and white patterns.","tf":[{"q":"The Ede live mainly in Dak Lak province.","a":true,"ex":"Bài viết: \"<i>The Ede live mainly in Dak Lak province<\/i>\" → đúng.","vi":"Người Ê-đê sống chủ yếu ở tỉnh Đắk Lắk."},{"q":"Each Ede long house is home to only one small family.","a":false,"ex":"Bài viết: \"<i><b>many families<\/b> of the same big family live in it together<\/i>\" → nhiều gia đình cùng sống, không phải chỉ một gia đình nhỏ.","vi":"Mỗi ngôi nhà dài của người Ê-đê chỉ có một gia đình nhỏ sinh sống."},{"q":"Ede children take their father's family name.","a":false,"ex":"Bài viết: \"<i>children take their <b>mother's<\/b> family name<\/i>\" → con lấy họ <b>mẹ<\/b>, không phải họ bố.","vi":"Con cái người Ê-đê mang họ của bố."},{"q":"Ede brocade is mainly black with red and white patterns.","a":true,"ex":"Bài viết: \"<i>their brocade is famous for its black colour with red and white patterns<\/i>\" → đúng.","vi":"Thổ cẩm của người Ê-đê chủ yếu có màu đen với hoa văn đỏ và trắng."}],"mc":[{"o":["The family is rich.","The family is poor.","The house is new.","The family has many buffaloes."],"a":0,"ex":"Bài viết: \"<i>the longer the house is, the richer the family is<\/i>\" (nhà càng dài thì gia đình càng giàu) → ngôi nhà rất dài cho thấy gia đình <b>giàu có<\/b>.","vi":"Theo bài đọc, một ngôi nhà rất dài cho thấy điều gì? → Gia đình đó giàu có.","q":"According to the passage, what does a very long house show?"},{"o":["a long house","bamboo","Dak Lak","the family"],"a":0,"ex":"Câu trước nói về \"<i>A long house<\/i>\"; câu \"<i>It can be up to 100 metres long<\/i>\" → It = <b>a long house<\/b> (dài tới 100 mét).","vi":"Từ \"It\" ở đoạn 1 chỉ: ngôi nhà dài.","q":"The word \"It\" in paragraph 1 refers to ______."}],"vi":"Người Ê-đê sống chủ yếu ở tỉnh Đắk Lắk thuộc vùng Tây Nguyên. Họ nổi tiếng với những ngôi nhà dài. Nhà dài là một kiểu nhà sàn làm bằng gỗ và tre. Nó có thể dài tới 100 mét, và nhiều gia đình trong cùng một đại gia đình sống chung trong đó. Người ta nói rằng nhà càng dài thì gia đình càng giàu.\n\nNgười Ê-đê theo chế độ mẫu hệ: phụ nữ là chủ gia đình, và con cái mang họ mẹ. Sau khi kết hôn, người chồng về sống ở nhà vợ.\n\nNgười Ê-đê chủ yếu trồng lúa, cà phê và rau trên đồi. Họ cũng nuôi các con vật như lợn, gà và trâu. Phụ nữ Ê-đê giỏi dệt vải, và thổ cẩm của họ nổi tiếng với màu đen điểm hoa văn đỏ và trắng.","id":"read:4"},{"title":"The Hung King Temple Festival","unit":"Unit 5","passage":"The Hung King Temple Festival is one of the most important festivals in Viet Nam. It takes place at the Hung Temple in Phu Tho Province from the 8th to the 11th day of the third lunar month. The main day is the 10th. On this day, people from all over the country come to the temple to worship the Hung Kings, who founded the first state of Viet Nam.\n\nThe festival has two parts: the ceremony and the festivities. During the ceremony, people make offerings such as flowers, incense and banh chung to show their respect to the kings. After that, visitors can enjoy many traditional activities, for example, singing xoan, wrestling and bamboo swinging.\n\nSince 2007, the 10th day of the third lunar month has been a public holiday in Viet Nam, so many people do not have to go to work and can join the festival.","tf":[{"q":"The festival is held in Phu Tho Province.","a":true,"ex":"Bài viết: \"<i>It takes place at the Hung Temple in Phu Tho Province<\/i>\" → take place = be held → đúng.","vi":"Lễ hội được tổ chức ở tỉnh Phú Thọ."},{"q":"The main day of the festival is the 8th day of the third lunar month.","a":false,"ex":"Bài viết: \"<i>The main day is the <b>10th<\/b>.<\/i>\" → ngày chính là mùng 10, không phải mùng 8 (mùng 8 là ngày bắt đầu).","vi":"Ngày chính của lễ hội là mùng 8 tháng 3 âm lịch."},{"q":"People offer flowers, incense and banh chung to the Hung Kings.","a":true,"ex":"Bài viết: \"<i>people make offerings such as flowers, incense and banh chung<\/i>\" → đúng.","vi":"Mọi người dâng hoa, hương và bánh chưng lên các Vua Hùng."},{"q":"Everyone has to go to work on the main day of the festival.","a":false,"ex":"Bài viết: mùng 10 tháng 3 là <b>ngày nghỉ lễ<\/b> (public holiday) nên \"<i>many people do not have to go to work<\/i>\" → sai.","vi":"Mọi người đều phải đi làm vào ngày chính của lễ hội."}],"mc":[{"o":["lion dancing","singing xoan","wrestling","bamboo swinging"],"a":0,"ex":"Bài viết liệt kê: \"<i>singing xoan, wrestling and bamboo swinging<\/i>\" → <b>lion dancing<\/b> (múa lân) không được nhắc đến.","vi":"Hoạt động nào KHÔNG được nhắc đến trong bài? → Múa lân.","q":"Which activity is NOT mentioned in the passage?"},{"o":["To worship the Hung Kings","To buy banh chung","To go to work","To learn wrestling"],"a":0,"ex":"Bài viết: \"<i>people … come to the temple <b>to worship the Hung Kings<\/b><\/i>\".","vi":"Vì sao mọi người đến đền vào ngày mùng 10? → Để thờ cúng các Vua Hùng.","q":"Why do people come to the temple on the 10th day?"}],"vi":"Lễ hội Đền Hùng là một trong những lễ hội quan trọng nhất ở Việt Nam. Lễ hội diễn ra tại Đền Hùng, tỉnh Phú Thọ từ mùng 8 đến mùng 11 tháng 3 âm lịch. Ngày chính là mùng 10. Vào ngày này, người dân từ khắp mọi miền đất nước đến đền để thờ cúng các Vua Hùng – những người đã lập nên nhà nước đầu tiên của Việt Nam.\n\nLễ hội có hai phần: phần lễ và phần hội. Trong phần lễ, mọi người dâng lễ vật như hoa, hương và bánh chưng để bày tỏ lòng tôn kính với các vua. Sau đó, du khách có thể tham gia nhiều hoạt động truyền thống, ví dụ như hát xoan, đấu vật và đu tre.\n\nTừ năm 2007, ngày mùng 10 tháng 3 âm lịch đã trở thành ngày nghỉ lễ ở Việt Nam, vì vậy nhiều người không phải đi làm và có thể tham gia lễ hội.","id":"read:5"}],"wf":[{"pos":"n","fam":"act","q":"Swimming is the most popular leisure ______ among teenagers in my neighbourhood. (act)","a":["activity"],"ex":"Sau \"the most popular leisure\" cần <b>danh từ<\/b>: leisure <b>activity<\/b> = hoạt động giải trí.","vi":"Bơi lội là hoạt động giải trí phổ biến nhất với thanh thiếu niên trong khu tôi ở.","id":"wf:0"},{"pos":"adj","fam":"act","q":"My grandmother is over 80, but she is still very ______. (act)","a":["active"],"ex":"Sau \"is still very\" cần <b>tính từ<\/b> → <b>active<\/b> (năng động).","vi":"Bà tôi đã hơn 80 tuổi nhưng vẫn còn rất năng động.","id":"wf:1"},{"pos":"adv","fam":"act","q":"Students should take part ______ in school activities. (act)","a":["actively"],"ex":"Bổ nghĩa cho động từ \"take part\" → cần <b>trạng từ<\/b>: <b>actively<\/b> (một cách tích cực).","vi":"Học sinh nên tham gia tích cực vào các hoạt động của trường.","id":"wf:2"},{"pos":"n","fam":"connect","q":"Without an Internet ______, we can't join the online class. (connect)","a":["connection"],"ex":"Sau \"an Internet\" cần <b>danh từ<\/b> → Internet <b>connection<\/b> (kết nối Internet).","vi":"Không có kết nối Internet, chúng ta không thể tham gia lớp học trực tuyến.","id":"wf:3"},{"pos":"adj","fam":"connect","q":"I couldn't finish the online test because I got ______ from the Internet. (connect)","a":["disconnected"],"ex":"Sau \"got\" cần <b>tính từ<\/b>; nghĩa là không làm xong bài vì <i>bị mất<\/i> kết nối → phủ định: <b>disconnected<\/b>.","vi":"Tôi không thể làm xong bài kiểm tra trực tuyến vì bị mất kết nối Internet.","id":"wf:4"},{"pos":"n","fam":"entertain","q":"Watching comedies is a form of ______ for the whole family. (entertain)","a":["entertainment"],"ex":"Sau \"a form of\" cần <b>danh từ<\/b> → <b>entertainment<\/b> (sự giải trí).","vi":"Xem phim hài là một hình thức giải trí cho cả gia đình.","id":"wf:5"},{"pos":"adj","fam":"entertain","q":"The magic show was really ______; all the children laughed a lot. (entertain)","a":["entertaining"],"ex":"Sau \"was really\" cần <b>tính từ<\/b>; chủ ngữ là sự vật (buổi diễn) gây ra cảm xúc → đuôi -ing: <b>entertaining<\/b>.","vi":"Buổi biểu diễn ảo thuật thật sự thú vị; tất cả trẻ em đều cười rất nhiều.","id":"wf:6"},{"pos":"adj","fam":"entertain","q":"The comedy was so ______ that everyone laughed all the time. (entertain)","a":["entertaining"],"ex":"Cấu trúc <b>so + adj + that<\/b>; vở hài kịch (sự vật) → <b>entertaining<\/b>. <i>(Câu 33 – Đề tham khảo)<\/i>","vi":"Vở hài kịch thú vị đến mức mọi người cười suốt.","id":"wf:7"},{"pos":"n","fam":"collect","q":"My brother has a big ______ of foreign stamps. (collect)","a":["collection"],"ex":"Sau \"a big\" cần <b>danh từ<\/b>; nói về đồ vật (tem) → <b>collection<\/b> (bộ sưu tập).","vi":"Anh trai tôi có một bộ sưu tập tem nước ngoài lớn.","id":"wf:8"},{"pos":"n","fam":"collect","q":"He is a famous coin ______; he has more than 2,000 old coins. (collect)","a":["collector"],"ex":"Chủ ngữ \"He is a famous coin…\" → <b>danh từ chỉ người<\/b>: <b>collector<\/b> (người sưu tầm).","vi":"Ông ấy là một nhà sưu tầm tiền xu nổi tiếng; ông có hơn 2.000 đồng xu cổ.","id":"wf:9"},{"pos":"n","fam":"collect","q":"My uncle is a stamp ______; he has thousands of stamps. (collect)","a":["collector"],"ex":"\"My uncle is a stamp…\" → <b>danh từ chỉ người<\/b>: <b>collector<\/b>. <i>(Câu 32 – Đề tham khảo)<\/i>","vi":"Chú tôi là một người sưu tầm tem; chú có hàng nghìn con tem.","id":"wf:10"},{"pos":"adj","fam":"peace","q":"Life in the countryside is quiet and ______. (peace)","a":["peaceful"],"ex":"Sau \"is quiet and\" cần <b>tính từ<\/b> song song với quiet → <b>peaceful<\/b> (yên bình).","vi":"Cuộc sống ở nông thôn yên tĩnh và yên bình.","id":"wf:11"},{"pos":"adv","fam":"peace","q":"The baby is sleeping ______ in her mother's arms. (peace)","a":["peacefully"],"ex":"Bổ nghĩa cho động từ \"is sleeping\" → <b>trạng từ<\/b>: <b>peacefully<\/b>.","vi":"Em bé đang ngủ yên bình trong vòng tay mẹ.","id":"wf:12"},{"pos":"adj","fam":"peace","q":"My grandparents live a ______ life in the countryside. (peace)","a":["peaceful"],"ex":"Trước danh từ \"life\" cần <b>tính từ<\/b> → a <b>peaceful<\/b> life. <i>(Câu 29 – Đề tham khảo)<\/i>","vi":"Ông bà tôi sống một cuộc sống yên bình ở nông thôn.","id":"wf:13"},{"pos":"n","fam":"develop","q":"The ______ of technology has changed the way teenagers learn. (develop)","a":["development"],"ex":"Cấu trúc <b>The + N + of<\/b> → <b>development<\/b> (sự phát triển).","vi":"Sự phát triển của công nghệ đã thay đổi cách thanh thiếu niên học tập.","id":"wf:14"},{"pos":"adj","fam":"develop","q":"Viet Nam is a ______ country with a fast-growing economy. (develop)","a":["developing"],"ex":"Trước danh từ \"country\" cần <b>tính từ<\/b> → <b>developing<\/b> country (nước đang phát triển).","vi":"Việt Nam là một quốc gia đang phát triển với nền kinh tế tăng trưởng nhanh.","id":"wf:15"},{"pos":"n","fam":"diverse","q":"Viet Nam is famous for its cultural ______ with 54 ethnic groups. (diverse)","a":["diversity"],"ex":"Sau \"its cultural\" cần <b>danh từ<\/b> → cultural <b>diversity<\/b> (sự đa dạng văn hóa).","vi":"Việt Nam nổi tiếng về sự đa dạng văn hóa với 54 dân tộc.","id":"wf:16"},{"pos":"n","fam":"farm","q":"Most ______ in my village grow rice and raise cattle. (farm)","a":["farmers"],"ex":"Sau \"Most\" cần danh từ số nhiều; người trồng lúa, nuôi gia súc → <b>farmers<\/b> (nông dân).","vi":"Hầu hết nông dân ở làng tôi trồng lúa và nuôi gia súc.","id":"wf:17"},{"pos":"n","fam":"farm","q":"Modern machines make ______ easier than before. (farm)","a":["farming"],"ex":"make + <b>O<\/b> + adj: tân ngữ là danh từ chỉ công việc → <b>farming<\/b> (việc làm nông).","vi":"Máy móc hiện đại làm cho việc làm nông dễ dàng hơn trước.","id":"wf:18"},{"pos":"n","fam":"participate","q":"All ______ in the singing contest will receive a small gift. (participate)","a":["participants"],"ex":"Sau \"All\" cần danh từ số nhiều chỉ người (nhận quà) → <b>participants<\/b> (người tham gia).","vi":"Tất cả người tham gia cuộc thi hát sẽ nhận được một món quà nhỏ.","id":"wf:19"},{"pos":"n","fam":"participate","q":"Her active ______ in class activities impressed her teacher. (participate)","a":["participation"],"ex":"Sau \"Her active\" cần <b>danh từ<\/b> chỉ sự việc → <b>participation<\/b> (sự tham gia).","vi":"Sự tham gia tích cực của bạn ấy vào các hoạt động lớp đã gây ấn tượng với cô giáo.","id":"wf:20"},{"pos":"adj","fam":"stress","q":"Exams can be very ______ for students. (stress)","a":["stressful"],"ex":"Sau \"be very\" cần <b>tính từ<\/b>; chủ ngữ là sự vật (kì thi) gây căng thẳng → <b>stressful<\/b>.","vi":"Các kì thi có thể rất căng thẳng đối với học sinh.","id":"wf:21"},{"pos":"adj","fam":"stress","q":"Lan felt ______ the night before her final exam. (stress)","a":["stressed"],"ex":"Sau \"felt\" cần <b>tính từ<\/b>; cảm xúc của người (Lan) → <b>stressed<\/b> (bị căng thẳng).","vi":"Lan cảm thấy căng thẳng vào đêm trước kì thi cuối kì.","id":"wf:22"},{"pos":"n","fam":"expect","q":"Parents' high ______ can put a lot of pressure on teenagers. (expect)","a":["expectations","expectation"],"ex":"Sau tính từ \"high\" cần <b>danh từ<\/b> → high <b>expectations<\/b> (kì vọng cao).","vi":"Kì vọng cao của cha mẹ có thể gây nhiều áp lực cho thanh thiếu niên.","id":"wf:23"},{"pos":"adv","fam":"expect","q":"______, our weak team won the first prize. Nobody thought it could happen. (expect)","a":["Unexpectedly"],"ex":"Đầu câu, trước dấu phẩy → <b>trạng từ<\/b>; \"không ai nghĩ điều đó có thể xảy ra\" → nghĩa bất ngờ: <b>Unexpectedly<\/b> (viết hoa vì đầu câu).","vi":"Thật bất ngờ, đội yếu của chúng tôi đã giành giải nhất. Không ai nghĩ điều đó có thể xảy ra.","id":"wf:24"},{"pos":"n","fam":"popular","q":"K-pop has gained great ______ among Vietnamese teenagers. (popular)","a":["popularity"],"ex":"Sau \"gained great\" cần <b>danh từ<\/b> → gain <b>popularity<\/b> (trở nên phổ biến).","vi":"K-pop đã trở nên rất phổ biến với thanh thiếu niên Việt Nam.","id":"wf:25"},{"pos":"adj","fam":"popular","q":"Playing video games all day is ______ with most parents. (popular)","a":["unpopular"],"ex":"Sau \"is\" cần <b>tính từ<\/b>; phụ huynh không thích việc chơi game cả ngày → <b>unpopular<\/b>.","vi":"Việc chơi điện tử cả ngày không được hầu hết phụ huynh ưa thích.","id":"wf:26"},{"pos":"n","fam":"popular","q":"The ______ of social media has changed teenagers' lives. (popular)","a":["popularity"],"ex":"Cấu trúc <b>The + N + of<\/b> → <b>popularity<\/b>. <i>(Câu 31 – Đề tham khảo)<\/i>","vi":"Sự phổ biến của mạng xã hội đã thay đổi cuộc sống của thanh thiếu niên.","id":"wf:27"},{"pos":"n","fam":"strong","q":"Doing exercise every day helps to improve our muscle ______. (strong)","a":["strength"],"ex":"Sau \"our muscle\" cần <b>danh từ<\/b> → muscle <b>strength<\/b> (sức mạnh cơ bắp).","vi":"Tập thể dục mỗi ngày giúp cải thiện sức mạnh cơ bắp.","id":"wf:28"},{"pos":"v","fam":"strong","q":"Team sports can help ______ the friendship among students. (strong)","a":["strengthen"],"ex":"Sau \"help\" cần <b>động từ nguyên mẫu<\/b> → <b>strengthen<\/b> (làm mạnh thêm, thắt chặt).","vi":"Các môn thể thao đồng đội có thể giúp thắt chặt tình bạn giữa học sinh.","id":"wf:29"},{"pos":"v","fam":"strong","q":"Taking part in team sports helps students ______ their friendship. (strong)","a":["strengthen"],"ex":"<b>help + O + V<\/b> → <b>strengthen<\/b>. <i>(Câu 30 – Đề tham khảo)<\/i>","vi":"Tham gia các môn thể thao đồng đội giúp học sinh thắt chặt tình bạn.","id":"wf:30"},{"pos":"adv","fam":"ethnic","q":"Viet Nam is an ______ diverse country. (ethnic)","a":["ethnically"],"ex":"Đứng trước tính từ \"diverse\" → <b>trạng từ<\/b>: <b>ethnically<\/b> diverse (đa dạng về dân tộc). Chú ý \"an\" vì ethnically bắt đầu bằng nguyên âm.","vi":"Việt Nam là một quốc gia đa dạng về dân tộc.","id":"wf:31"},{"pos":"adj","fam":"tradition","q":"Áo dài is the ______ costume of Vietnamese women. (tradition)","a":["traditional"],"ex":"Trước danh từ \"costume\" cần <b>tính từ<\/b> → <b>traditional<\/b> costume (trang phục truyền thống).","vi":"Áo dài là trang phục truyền thống của phụ nữ Việt Nam.","id":"wf:32"},{"pos":"adv","fam":"tradition","q":"______, Vietnamese people make chung cakes before Tet. (tradition)","a":["Traditionally"],"ex":"Đầu câu, trước dấu phẩy → <b>trạng từ<\/b>: <b>Traditionally<\/b> (theo truyền thống).","vi":"Theo truyền thống, người Việt gói bánh chưng trước Tết.","id":"wf:33"},{"pos":"adv","fam":"tradition","q":"______, Vietnamese people visit their relatives during Tet. (tradition)","a":["Traditionally"],"ex":"Đầu câu, trước dấu phẩy → <b>Traditionally<\/b>. <i>(Câu 34 – Đề tham khảo)<\/i>","vi":"Theo truyền thống, người Việt Nam đi thăm họ hàng trong dịp Tết.","id":"wf:34"},{"pos":"v","fam":"connect","q":"Smartphones help teenagers ______ with their friends anytime. (connection)","a":["connect"],"ex":"Sau <b>help + O<\/b> cần <b>động từ nguyên mẫu<\/b> → connect (kết nối). connect with = kết nối với.","vi":"Điện thoại thông minh giúp thanh thiếu niên kết nối với bạn bè bất cứ lúc nào.","id":"wf:35"},{"pos":"v","fam":"collect","q":"My uncle ______ old coins from many different countries. (collection)","a":["collects"],"ex":"Sau chủ ngữ \"My uncle\" cần <b>động từ<\/b>; chủ ngữ số ít, thì hiện tại đơn → <b>collects<\/b> (sưu tầm).","vi":"Chú tôi sưu tầm tiền xu cổ từ nhiều quốc gia khác nhau.","id":"wf:36"},{"pos":"v","fam":"participate","q":"All students are encouraged to ______ in the school art festival. (participation)","a":["participate"],"ex":"Sau <b>to<\/b> cần <b>động từ nguyên mẫu<\/b> → participate in = tham gia.","vi":"Tất cả học sinh đều được khuyến khích tham gia lễ hội nghệ thuật của trường.","id":"wf:37"},{"pos":"v","fam":"entertain","q":"Comedians ______ the audience with funny stories and jokes. (entertainment)","a":["entertain"],"ex":"Sau chủ ngữ số nhiều \"Comedians\" cần <b>động từ<\/b> chia hiện tại đơn → <b>entertain<\/b> (mua vui, giải trí cho).","vi":"Các diễn viên hài mua vui cho khán giả bằng những câu chuyện và câu đùa hài hước.","id":"wf:38"},{"pos":"v","fam":"expect","q":"Nobody ______ our team to win, but we got the first prize! (expectation)","a":["expected"],"ex":"Sau chủ ngữ \"Nobody\" cần <b>động từ<\/b>; câu kể chuyện đã xảy ra (got) → quá khứ <b>expected<\/b> (mong đợi).","vi":"Không ai nghĩ đội chúng tôi sẽ thắng, nhưng chúng tôi đã đoạt giải nhất!","id":"wf:39"},{"pos":"v","fam":"develop","q":"Viet Nam is ______ very fast, and many new roads have been built. (development)","a":["developing"],"ex":"Sau <b>is<\/b> + chỗ trống, câu nói về sự việc đang diễn ra → thì hiện tại tiếp diễn: is <b>developing<\/b> (đang phát triển).","vi":"Việt Nam đang phát triển rất nhanh, và nhiều con đường mới đã được xây dựng.","id":"wf:40"},{"pos":"v","fam":"strong","q":"Regular exercise can ______ your muscles and bones. (strong)","a":["strengthen"],"ex":"Sau động từ khuyết thiếu <b>can<\/b> cần <b>động từ nguyên mẫu<\/b> → <b>strengthen<\/b> (làm cho chắc khỏe).","vi":"Tập thể dục thường xuyên có thể làm cơ và xương của bạn chắc khỏe hơn.","id":"wf:41"},{"pos":"adv","fam":"strong","q":"I ______ believe that we should keep our traditions alive. (strong)","a":["strongly"],"ex":"Bổ nghĩa cho động từ <b>believe<\/b> → cần <b>trạng từ<\/b>: strongly (mạnh mẽ, chắc chắn).","vi":"Tôi tin chắc rằng chúng ta nên giữ gìn các truyền thống của mình.","id":"wf:42"},{"pos":"adv","fam":"act","q":"The children took part ______ in the lantern parade. (act)","a":["actively"],"ex":"Bổ nghĩa cho động từ <b>took part<\/b> → cần <b>trạng từ<\/b>: actively (một cách tích cực).","vi":"Bọn trẻ đã tham gia rước đèn rất tích cực.","id":"wf:43"},{"pos":"adv","fam":"expect","q":"The festival ended ______ because of the heavy storm. (expect)","a":["unexpectedly"],"ex":"Bổ nghĩa cho động từ <b>ended<\/b> → cần <b>trạng từ<\/b>; vì cơn bão nên kết thúc ngoài dự kiến → nghĩa phủ định <b>unexpectedly<\/b> (bất ngờ).","vi":"Lễ hội kết thúc bất ngờ vì cơn bão lớn.","id":"wf:44"},{"pos":"adv","fam":"peace","q":"The Ede and the Gia Rai have lived ______ together for a long time. (peace)","a":["peacefully"],"ex":"Bổ nghĩa cho động từ <b>have lived<\/b> → cần <b>trạng từ<\/b>: peacefully (một cách hòa bình, yên bình).","vi":"Người Ê-đê và người Gia Rai đã chung sống hòa bình với nhau từ lâu.","id":"wf:45"},{"pos":"adj","fam":"connect","q":"The Internet makes people around the world more ______. (connect)","a":["connected"],"ex":"Sau <b>make + O + more<\/b> cần <b>tính từ<\/b> → connected (được kết nối, gắn kết).","vi":"Internet khiến con người trên khắp thế giới gắn kết với nhau hơn.","id":"wf:46"},{"pos":"adj","fam":"diverse","q":"Viet Nam is a ______ country with 54 ethnic groups. (diversity)","a":["diverse"],"ex":"Đứng trước danh từ <b>country<\/b> cần <b>tính từ<\/b> → diverse (đa dạng).","vi":"Việt Nam là một đất nước đa dạng với 54 dân tộc.","id":"wf:47"},{"pos":"adj","fam":"popular","q":"Football is the most ______ sport in my school. (popularity)","a":["popular"],"ex":"Sau <b>the most<\/b> và trước danh từ <b>sport<\/b> cần <b>tính từ<\/b> → popular (phổ biến).","vi":"Bóng đá là môn thể thao phổ biến nhất ở trường tôi.","id":"wf:48"},{"pos":"adj","fam":"strong","q":"Our grandfather is old, but he is still very ______. (strength)","a":["strong"],"ex":"Sau <b>is still very<\/b> cần <b>tính từ<\/b> → strong (khỏe mạnh).","vi":"Ông chúng tôi đã già nhưng vẫn còn rất khỏe.","id":"wf:49"},{"pos":"n","fam":"diverse","q":"The ______ of cultures in Viet Nam attracts many tourists. (diverse)","a":["diversity"],"ex":"Sau <b>The<\/b> và trước <b>of<\/b> cần <b>danh từ<\/b> → diversity (sự đa dạng).","vi":"Sự đa dạng văn hóa ở Việt Nam thu hút nhiều khách du lịch.","id":"wf:50"},{"pos":"n","fam":"tradition","q":"Making banh chung is a beautiful ______ of Vietnamese people. (traditional)","a":["tradition"],"ex":"Sau <b>a beautiful<\/b> (mạo từ + tính từ) cần <b>danh từ số ít<\/b> → tradition (truyền thống).","vi":"Gói bánh chưng là một truyền thống đẹp của người Việt.","id":"wf:51"},{"pos":"n","fam":"act","q":"Bamboo dancing is a popular ______ at the festival. (act)","a":["activity"],"ex":"Sau <b>a popular<\/b> cần <b>danh từ số ít<\/b> → activity (hoạt động).","vi":"Múa sạp là một hoạt động phổ biến trong lễ hội.","id":"wf:52"},{"pos":"n","fam":"stress","q":"Too much homework can cause ______ for teenagers. (stressful)","a":["stress"],"ex":"Sau động từ <b>cause<\/b> cần <b>danh từ<\/b> → stress (sự căng thẳng, không đếm được).","vi":"Quá nhiều bài tập về nhà có thể gây căng thẳng cho thanh thiếu niên.","id":"wf:53"}],"dict":[{"entry":{"w":"hobby","ipa":"/ˈhɒbi/","pos":"noun (plural hobbies)","defs":[{"g":"[countable]","d":"an activity that you do for pleasure when you are not working","ex":["Her hobbies include reading and swimming.","He took up painting as a hobby.","Collecting stamps is a popular hobby for children."]}]},"qs":[{"q":"Last summer, my sister ______ knitting as a hobby.","a":["took up"],"ex":"Câu ví dụ: \"<i>He <b>took up<\/b> painting as a hobby.<\/i>\" → take up = bắt đầu (một sở thích). Có \"Last summer\" nên chia quá khứ: <b>took up<\/b>.","vi":"Mùa hè năm ngoái, chị tôi bắt đầu đan len như một sở thích."},{"q":"Making origami is ______ for Japanese children.","a":["a popular hobby"],"ex":"Câu ví dụ: \"<i>Collecting stamps is <b>a popular hobby<\/b> for children.<\/i>\" → chép nguyên cụm <b>a popular hobby<\/b>.","vi":"Gấp giấy origami là một sở thích phổ biến của trẻ em Nhật Bản."}],"id":"dict:0"},{"entry":{"w":"harvest","ipa":"/ˈhɑːvɪst/","pos":"noun","defs":[{"g":"1 [countable, uncountable]","d":"the time of year when crops are cut and collected","ex":["Farmers are very busy at harvest time.","Villagers often help each other during the rice harvest."]},{"g":"2 [countable]","d":"the amount of crops that is collected","ex":["We had a good harvest this year.","A bad harvest can make farmers poor."]}]},"qs":[{"q":"Everyone in my village works from early morning until late evening ______.","a":["at harvest time"],"ex":"Câu ví dụ: \"<i>Farmers are very busy <b>at harvest time<\/b>.<\/i>\" → <b>at harvest time<\/b> = vào mùa gặt.","vi":"Vào mùa gặt, mọi người trong làng tôi làm việc từ sáng sớm đến tối muộn."},{"q":"Thanks to the good weather, the farmers had ______ this year.","a":["a good harvest"],"ex":"Câu ví dụ: \"<i>We had <b>a good harvest<\/b> this year.<\/i>\" → <b>a good harvest<\/b> = một vụ mùa bội thu.","vi":"Nhờ thời tiết thuận lợi, năm nay nông dân được một vụ mùa bội thu."}],"id":"dict:1"},{"entry":{"w":"peer","ipa":"/pɪə(r)/","pos":"noun","defs":[{"g":"[countable, usually plural]","d":"a person who is the same age or has the same social position as you","ex":["She is popular with her peers.","Teenagers often feel peer pressure to look cool.","Children learn a lot from their peers."]}]},"qs":[{"q":"Many teenagers want expensive phones because of ______.","a":["peer pressure"],"ex":"Câu ví dụ: \"<i>Teenagers often feel <b>peer pressure<\/b> to look cool.<\/i>\" → because of + danh từ: <b>peer pressure<\/b>.","vi":"Nhiều thanh thiếu niên muốn có điện thoại đắt tiền vì áp lực từ bạn bè đồng trang lứa."},{"q":"When working in groups, students can learn a lot ______.","a":["from their peers"],"ex":"Câu ví dụ: \"<i>Children learn a lot <b>from their peers<\/b>.<\/i>\" → <b>from their peers<\/b> (từ bạn bè đồng trang lứa).","vi":"Khi làm việc nhóm, học sinh có thể học hỏi được nhiều điều từ bạn bè."}],"id":"dict:2"},{"entry":{"w":"festival","ipa":"/ˈfestɪvl/","pos":"noun","defs":[{"g":"","d":"a day or period when people celebrate a special event, often a religious or traditional one","ex":["Tet is the most important traditional festival in Viet Nam.","The Hung King Temple Festival is held every spring.","Thousands of festival-goers came to watch the lion dances."]}]},"qs":[{"q":"Families get together to celebrate the new year at Tet – ______ in Viet Nam.","a":["the most important traditional festival"],"ex":"Câu ví dụ: \"<i>Tet is <b>the most important traditional festival<\/b> in Viet Nam.<\/i>\" → chép nguyên cụm.","vi":"Các gia đình sum họp để đón năm mới vào dịp Tết – lễ hội truyền thống quan trọng nhất ở Việt Nam."},{"q":"The Lim Festival in Bac Ninh ______.","a":["is held every spring"],"ex":"Câu ví dụ: \"<i>The Hung King Temple Festival <b>is held every spring<\/b>.<\/i>\" → <b>is held every spring<\/b> (được tổ chức vào mỗi mùa xuân).","vi":"Hội Lim ở Bắc Ninh được tổ chức vào mỗi mùa xuân."}],"id":"dict:3"},{"entry":{"w":"ethnic","ipa":"/ˈeθnɪk/","pos":"adjective","defs":[{"g":"","d":"connected with or belonging to a group of people who share the same culture, traditions, language, etc.","ex":["Viet Nam has 54 ethnic groups.","The museum shows the costumes of ethnic minorities.","She loves listening to ethnic music."]}]},"qs":[{"q":"In Ha Giang, tourists can meet people from different ______ such as the Hmong and the Dao.","a":["ethnic groups","ethnic minorities"],"ex":"Câu ví dụ: \"<i>Viet Nam has 54 <b>ethnic groups<\/b>.<\/i>\" → sau \"different\" cần danh từ số nhiều: <b>ethnic groups<\/b> (hoặc ethnic minorities).","vi":"Ở Hà Giang, du khách có thể gặp gỡ người thuộc nhiều dân tộc khác nhau như người Hmông và người Dao."},{"q":"At the night market, visitors can enjoy ______ played on traditional instruments.","a":["ethnic music"],"ex":"Câu ví dụ: \"<i>She loves listening to <b>ethnic music<\/b>.<\/i>\" → <b>ethnic music<\/b> (âm nhạc dân tộc).","vi":"Ở chợ đêm, du khách có thể thưởng thức âm nhạc dân tộc được chơi bằng nhạc cụ truyền thống."}],"id":"dict:4"},{"entry":{"w":"reunion","ipa":"/riːˈjuːniən/","pos":"noun","defs":[{"g":"[countable, uncountable]","d":"a social occasion when people who have not seen each other for a long time meet again","ex":["We hold a family reunion every Tet.","Our class had a reunion ten years after we left school.","It was an emotional reunion with her old friends."]}]},"qs":[{"q":"Every Lunar New Year, all my relatives come back home for ______.","a":["a family reunion"],"ex":"Câu ví dụ: \"<i>We hold <b>a family reunion<\/b> every Tet.<\/i>\" → <b>a family reunion<\/b> (cuộc đoàn tụ gia đình). <i>(Câu 35 – Đề tham khảo)<\/i>","vi":"Mỗi dịp Tết Nguyên đán, tất cả họ hàng của tôi đều trở về nhà để đoàn tụ gia đình."},{"q":"Ten years after leaving school, our class ______ at a restaurant.","a":["had a reunion"],"ex":"Câu ví dụ: \"<i>Our class <b>had a reunion<\/b> ten years after we left school.<\/i>\" → <b>had a reunion<\/b> (đã họp lớp). <i>(Câu 36 – Đề tham khảo)<\/i>","vi":"Mười năm sau khi ra trường, lớp chúng tôi đã họp lớp ở một nhà hàng."}],"id":"dict:5"},{"entry":{"w":"custom","ipa":"/ˈkʌstəm/","pos":"noun","defs":[{"g":"[countable, uncountable]","d":"an accepted way of behaving or of doing things in a society or a community","ex":["It is the custom in Viet Nam to give lucky money at Tet.","Many families still follow the custom of worshipping their ancestors.","The custom of eating banh chung has a long history."]}]},"qs":[{"q":"In my village, ______ to visit the oldest people first at Tet.","a":["it is the custom","it's the custom"],"ex":"Câu ví dụ: \"<i><b>It is the custom<\/b> in Viet Nam to give lucky money at Tet.<\/i>\" → chép cụm <b>it is the custom<\/b> (+ to V).","vi":"Ở làng tôi, theo phong tục là đến thăm những người cao tuổi nhất trước vào dịp Tết."},{"q":"My family always ______ of decorating the house with peach blossoms.","a":["follows the custom"],"ex":"Câu ví dụ: \"<i>Many families still <b>follow the custom of<\/b> worshipping their ancestors.<\/i>\" → chủ ngữ số ít \"My family\", hiện tại đơn → <b>follows the custom<\/b>.","vi":"Gia đình tôi luôn theo phong tục trang trí nhà bằng hoa đào."}],"id":"dict:6"},{"entry":{"w":"pressure","ipa":"/ˈpreʃə(r)/","pos":"noun","defs":[{"g":"[uncountable]","d":"difficulties and worries caused by the problems of life, work or school","ex":["Students are under pressure to get good marks.","She has been under a lot of pressure at school.","There is growing pressure on teenagers to look perfect online."]}]},"qs":[{"q":"Before the final exam, many students feel that they are ______.","a":["under pressure","under a lot of pressure"],"ex":"Câu ví dụ: \"<i>Students are <b>under pressure<\/b> to get good marks.<\/i>\" → be under pressure = chịu áp lực.","vi":"Trước kì thi cuối kì, nhiều học sinh cảm thấy mình đang chịu áp lực."},{"q":"There is ______ on young people to have the latest phones.","a":["growing pressure"],"ex":"Câu ví dụ: \"<i>There is <b>growing pressure<\/b> on teenagers to look perfect online.<\/i>\" → chép cụm <b>growing pressure<\/b> (áp lực ngày càng tăng).","vi":"Giới trẻ đang chịu áp lực ngày càng tăng phải có những chiếc điện thoại đời mới nhất."}],"id":"dict:7"},{"entry":{"w":"tradition","ipa":"/trəˈdɪʃn/","pos":"noun","defs":[{"g":"[countable, uncountable]","d":"a belief, custom or way of doing something that has existed for a long time","ex":["We should carry on the tradition of making banh chung.","Last year the family broke with tradition and travelled abroad at Tet.","Lion dancing is a long tradition in Viet Nam."]}]},"qs":[{"q":"Young people should ______ of wearing áo dài on special days.","a":["carry on the tradition"],"ex":"Câu ví dụ: \"<i>We should <b>carry on the tradition<\/b> of making banh chung.<\/i>\" → sau should giữ nguyên mẫu: <b>carry on the tradition<\/b> (tiếp nối truyền thống).","vi":"Giới trẻ nên tiếp nối truyền thống mặc áo dài vào những ngày đặc biệt."},{"q":"Last Tet, my uncle ______ and had a big party at a restaurant instead of at home.","a":["broke with tradition"],"ex":"Câu ví dụ: \"<i>The family <b>broke with tradition<\/b> …<\/i>\" → có \"Last Tet\" nên chia quá khứ: <b>broke with tradition<\/b> (phá lệ, không theo truyền thống).","vi":"Tết năm ngoái, chú tôi đã phá lệ và tổ chức một bữa tiệc lớn ở nhà hàng thay vì ở nhà."}],"id":"dict:8"}],"rw_if":[{"q":"Hurry up, or you will be late for school.","s":"If","ans":["If you don't hurry up, you will be late for school."],"ex":"Mệnh lệnh + <b>or<\/b> (nếu không thì) → đổi vế If sang <b>phủ định<\/b>: If you <b>don't<\/b> hurry up, …","vi":"Nếu bạn không nhanh lên, bạn sẽ bị muộn học.","id":"rw_if:0"},{"q":"Water these plants every day, and they will grow well.","s":"If","ans":["If you water these plants every day, they will grow well."],"ex":"Mệnh lệnh + <b>and<\/b> → giữ <b>khẳng định<\/b>: If you water…, they will grow well.","vi":"Nếu bạn tưới những cây này mỗi ngày, chúng sẽ phát triển tốt.","id":"rw_if:1"},{"q":"Be careful, or you will cut your finger.","s":"If","ans":["If you aren't careful, you will cut your finger."],"ex":"\"Be careful\" + or → phủ định. careful là <b>tính từ<\/b> nên dùng <b>aren't<\/b> (không dùng don't careful).","vi":"Nếu bạn không cẩn thận, bạn sẽ bị đứt tay.","id":"rw_if:2"},{"q":"Turn off the lights when you leave, and you will save electricity.","s":"If","ans":["If you turn off the lights when you leave, you will save electricity."],"ex":"Mệnh lệnh + <b>and<\/b> → giữ khẳng định.","vi":"Nếu bạn tắt đèn khi ra ngoài, bạn sẽ tiết kiệm được điện.","id":"rw_if:3"},{"q":"Stop playing computer games, or your eyes will get tired.","s":"If","ans":["If you don't stop playing computer games, your eyes will get tired."],"ex":"Mệnh lệnh + <b>or<\/b> → phủ định: If you don't stop playing…","vi":"Nếu bạn không dừng chơi điện tử, mắt bạn sẽ bị mỏi.","id":"rw_if:4"},{"q":"Don't be noisy in the library, or the librarian will be angry.","s":"If","ans":["If you are noisy in the library, the librarian will be angry."],"ex":"\"<b>Don't<\/b> + V, or…\" → bỏ don't, chuyển thành <b>khẳng định<\/b>: If you are noisy…","vi":"Nếu bạn làm ồn trong thư viện, cô thủ thư sẽ tức giận.","id":"rw_if:5"},{"q":"Mai must wear a raincoat, or she will get wet.","s":"If","ans":["If Mai doesn't wear a raincoat, she will get wet."],"ex":"S + must + V, or… → If + S + <b>doesn't<\/b> + V (chủ ngữ Mai số ít → doesn't).","vi":"Nếu Mai không mặc áo mưa, bạn ấy sẽ bị ướt.","id":"rw_if:6"},{"q":"Practise speaking English every day, and you will speak it fluently.","s":"If","ans":["If you practise speaking English every day, you will speak it fluently."],"ex":"Mệnh lệnh + <b>and<\/b> → giữ khẳng định.","vi":"Nếu bạn luyện nói tiếng Anh mỗi ngày, bạn sẽ nói lưu loát.","id":"rw_if:7"},{"q":"Leave now, otherwise you will miss the last bus.","s":"If","ans":["If you don't leave now, you will miss the last bus."],"ex":"<b>otherwise<\/b> giống \"or\" → đổi sang phủ định: If you don't leave now…","vi":"Nếu bạn không đi ngay bây giờ, bạn sẽ lỡ chuyến xe buýt cuối cùng.","id":"rw_if:8"},{"q":"Study harder, or you will fail the final exam.","s":"If","ans":["If you don't study harder, you will fail the final exam."],"ex":"Mệnh lệnh + <b>or<\/b> → phủ định. <i>(Câu 37 – Đề tham khảo)<\/i>","vi":"Nếu bạn không học chăm hơn, bạn sẽ trượt kì thi cuối kì.","id":"rw_if:9"},{"q":"Don't eat too many sweets, or you will get toothache.","s":"If","ans":["If you eat too many sweets, you will get toothache."],"ex":"<b>Don't + V, or …<\/b> → bỏ don't, vế If chuyển sang <b>khẳng định<\/b>: If you eat too many sweets, …","vi":"Nếu bạn ăn quá nhiều kẹo, bạn sẽ bị đau răng.","id":"rw_if:10"},{"q":"Wear a helmet, or you may get hurt.","s":"If","ans":["If you don't wear a helmet, you may get hurt."],"ex":"Mệnh lệnh + <b>or<\/b> → vế If đổi sang <b>phủ định<\/b>: If you don't wear a helmet, you may get hurt.","vi":"Nếu bạn không đội mũ bảo hiểm, bạn có thể bị thương.","id":"rw_if:11"}],"rw_hb":[{"q":"You should wear a helmet when riding a motorbike.","s":"You had better","ans":["You had better wear a helmet when riding a motorbike."],"ex":"<b>should + V<\/b> → <b>had better + V<\/b> (không có \"to\").","vi":"Bạn nên đội mũ bảo hiểm khi đi xe máy.","id":"rw_hb:0"},{"q":"It's a good idea for you to see a doctor.","s":"You","ans":["You had better see a doctor."],"ex":"<b>It's a good idea for you to V<\/b> → You <b>had better + V<\/b>. Không đổi had thành has.","vi":"Bạn nên đi khám bác sĩ.","id":"rw_hb:1"},{"q":"You shouldn't stay up too late before the exam.","s":"You had","ans":["You had better not stay up too late before the exam."],"ex":"<b>shouldn't + V<\/b> → <b>had better not + V<\/b>.","vi":"Bạn không nên thức quá khuya trước kì thi.","id":"rw_hb:2"},{"q":"Don't use your phone while you are crossing the road.","s":"You had","ans":["You had better not use your phone while you are crossing the road."],"ex":"<b>Don't + V<\/b> → You <b>had better not + V<\/b>.","vi":"Bạn không nên dùng điện thoại khi đang qua đường.","id":"rw_hb:3"},{"q":"Students ought to do their homework before class.","s":"Students","ans":["Students had better do their homework before class."],"ex":"<b>ought to + V<\/b> → <b>had better + V<\/b> (dù chủ ngữ số nhiều vẫn là had).","vi":"Học sinh nên làm bài tập về nhà trước giờ học.","id":"rw_hb:4"},{"q":"It's not a good idea to wrap a gift in black paper in Viet Nam.","s":"You had","ans":["You had better not wrap a gift in black paper in Viet Nam."],"ex":"<b>It's not a good idea to V<\/b> → had better <b>not<\/b> + V.","vi":"Ở Việt Nam, bạn không nên gói quà bằng giấy màu đen.","id":"rw_hb:5"},{"q":"We should take off our shoes before entering the pagoda.","s":"We had","ans":["We had better take off our shoes before entering the pagoda."],"ex":"<b>should + V<\/b> → <b>had better + V<\/b>.","vi":"Chúng ta nên cởi giày trước khi vào chùa.","id":"rw_hb:6"},{"q":"Why don't you ask your teacher for help?","s":"You had","ans":["You had better ask your teacher for help."],"ex":"<b>Why don't you + V?<\/b> (lời khuyên) → You <b>had better + V<\/b>.","vi":"Bạn nên nhờ thầy cô giúp đỡ.","id":"rw_hb:7"},{"q":"You should wear warm clothes when you visit Sa Pa in winter.","s":"You had","ans":["You had better wear warm clothes when you visit Sa Pa in winter."],"ex":"<b>should + V<\/b> → <b>had better + V<\/b>. <i>(Câu 38 – Đề tham khảo)<\/i>","vi":"Bạn nên mặc quần áo ấm khi đến Sa Pa vào mùa đông.","id":"rw_hb:8"},{"q":"You shouldn't spend too much time on social media.","s":"You had","ans":["You had better not spend too much time on social media."],"ex":"<b>shouldn't + V<\/b> → <b>had better not + V<\/b> (nguyên mẫu, không \"to\").","vi":"Bạn không nên dành quá nhiều thời gian cho mạng xã hội.","id":"rw_hb:9"},{"q":"It's a good idea for us to book the tickets early.","s":"We had","ans":["We had better book the tickets early."],"ex":"<b>It's a good idea (for sb) to V<\/b> → <b>S + had better + V<\/b>.","vi":"Chúng ta nên đặt vé sớm.","id":"rw_hb:10"}],"rw_bs":[{"q":"It rained heavily, so we stayed at home.","s":"Because","ans":["Because it rained heavily, we stayed at home."],"ex":"<b>Because<\/b> đứng trước <b>nguyên nhân<\/b> (trời mưa to); bỏ \"so\" – không dùng cả because và so trong một câu.","vi":"Vì trời mưa to nên chúng tôi ở nhà.","id":"rw_bs:0"},{"q":"Nam was ill, so he didn't go to school yesterday.","s":"Because","ans":["Because Nam was ill, he didn't go to school yesterday.","Because he was ill, Nam didn't go to school yesterday."],"ex":"Because + nguyên nhân (Nam bị ốm), giữ nguyên thì quá khứ.","vi":"Vì Nam bị ốm nên hôm qua bạn ấy không đi học.","id":"rw_bs:1"},{"q":"My village is very peaceful, so many tourists come there to relax.","s":"Because","ans":["Because my village is very peaceful, many tourists come there to relax."],"ex":"Because + nguyên nhân (làng yên bình), vế sau là kết quả.","vi":"Vì làng tôi rất yên bình nên nhiều du khách đến đó để thư giãn.","id":"rw_bs:2"},{"q":"Lan stayed up late chatting online, so she felt tired in class.","s":"Because","ans":["Because Lan stayed up late chatting online, she felt tired in class.","Because she stayed up late chatting online, Lan felt tired in class."],"ex":"Because + nguyên nhân (thức khuya), vế sau là kết quả (mệt trong lớp).","vi":"Vì Lan thức khuya nhắn tin trên mạng nên bạn ấy thấy mệt trong lớp.","id":"rw_bs:3"},{"q":"Because the Tay live near rivers, they build stilt houses.","s":"The Tay","ans":["The Tay live near rivers, so they build stilt houses."],"ex":"Đổi ngược lại: nguyên nhân + <b>, so<\/b> + kết quả.","vi":"Người Tày sống gần sông, vì vậy họ làm nhà sàn.","id":"rw_bs:4"},{"q":"Because Tet is coming, people are busy decorating their houses.","s":"Tet","ans":["Tet is coming, so people are busy decorating their houses."],"ex":"Nguyên nhân (Tết đến) + <b>, so<\/b> + kết quả (mọi người bận trang trí nhà).","vi":"Tết sắp đến nên mọi người bận rộn trang trí nhà cửa.","id":"rw_bs:5"},{"q":"Mai loves DIY, so she often makes her own birthday cards.","s":"Because","ans":["Because Mai loves DIY, she often makes her own birthday cards.","Because she loves DIY, Mai often makes her own birthday cards."],"ex":"Because + nguyên nhân (Mai thích DIY).","vi":"Vì Mai yêu thích DIY nên bạn ấy thường tự làm thiệp sinh nhật.","id":"rw_bs:6"},{"q":"He didn't study hard, so he failed the test.","s":"Because","ans":["Because he didn't study hard, he failed the test."],"ex":"Because + nguyên nhân (không học chăm), giữ nguyên thì quá khứ.","vi":"Vì không học chăm nên cậu ấy trượt bài kiểm tra.","id":"rw_bs:7"},{"q":"Minh bought a lot of origami paper, for he wanted to make paper cranes.","s":"Because","ans":["Because Minh wanted to make paper cranes, he bought a lot of origami paper.","Because he wanted to make paper cranes, Minh bought a lot of origami paper."],"ex":"<b>for<\/b> (vì) đứng trước nguyên nhân → đưa nguyên nhân lên sau <b>Because<\/b>.","vi":"Vì Minh muốn gấp hạc giấy nên bạn ấy đã mua rất nhiều giấy origami.","id":"rw_bs:8"},{"q":"Hoa was very tired, so she went to bed early.","s":"Because","ans":["Because Hoa was very tired, she went to bed early.","Because she was very tired, Hoa went to bed early."],"ex":"Because + nguyên nhân. <i>(Câu 39 – Đề tham khảo)<\/i>","vi":"Vì Hoa rất mệt nên bạn ấy đi ngủ sớm.","id":"rw_bs:9"},{"q":"Many tourists visit Hoi An because it is very picturesque.","s":"Hoi An","ans":["Hoi An is very picturesque, so many tourists visit it.","Hoi An is very picturesque, so many tourists visit there.","Hoi An is very picturesque, so many tourists visit the town."],"ex":"Vế nguyên nhân \"Hoi An is very picturesque\" đứng trước, <b>so<\/b> đứng trước vế kết quả. Đổi \"it\" thành Hoi An ở vế đầu.","vi":"Hội An rất đẹp như tranh, vì vậy có nhiều khách du lịch đến thăm.","id":"rw_bs:10"},{"q":"The farmers were very busy, so they didn't go to the festival.","s":"Because","ans":["Because the farmers were very busy, they didn't go to the festival.","Because they were very busy, the farmers didn't go to the festival."],"ex":"<b>Because<\/b> đứng trước vế nguyên nhân (the farmers were very busy), bỏ \"so\", thêm dấu phẩy giữa 2 vế.","vi":"Vì những người nông dân rất bận nên họ đã không đi lễ hội.","id":"rw_bs:11"}],"rw_cmp":[{"q":"Minh is a better swimmer than Hieu.","s":"Minh swims","ans":["Minh swims better than Hieu."],"ex":"a better <b>swimmer<\/b> → <b>swims better<\/b> (good → well → better).","vi":"Minh bơi giỏi hơn Hiếu.","id":"rw_cmp:0"},{"q":"My mother is a more careful driver than my father.","s":"My mother","ans":["My mother drives more carefully than my father."],"ex":"a more careful <b>driver<\/b> → <b>drives more carefully<\/b> (thêm -s vì chủ ngữ số ít; careful → carefully).","vi":"Mẹ tôi lái xe cẩn thận hơn bố tôi.","id":"rw_cmp:1"},{"q":"Lan is a faster runner than her sister.","s":"Lan","ans":["Lan runs faster than her sister."],"ex":"a faster <b>runner<\/b> → <b>runs faster<\/b> (fast là trạng từ ngắn, giữ nguyên faster).","vi":"Lan chạy nhanh hơn chị gái.","id":"rw_cmp:2"},{"q":"Mr Hai was a harder worker than his colleagues.","s":"Mr Hai","ans":["Mr Hai worked harder than his colleagues."],"ex":"\"<b>was<\/b>\" là quá khứ → động từ chia quá khứ: <b>worked harder<\/b>.","vi":"Ông Hải đã làm việc chăm chỉ hơn các đồng nghiệp.","id":"rw_cmp:3"},{"q":"Nga is a more beautiful singer than Hoa.","s":"Nga","ans":["Nga sings more beautifully than Hoa."],"ex":"a more beautiful <b>singer<\/b> → <b>sings more beautifully<\/b>.","vi":"Nga hát hay hơn Hoa.","id":"rw_cmp:4"},{"q":"Tom is a worse cook than his wife.","s":"Tom","ans":["Tom cooks worse than his wife."],"ex":"a worse <b>cook<\/b> (đầu bếp) → <b>cooks worse<\/b> (badly → worse).","vi":"Tom nấu ăn dở hơn vợ.","id":"rw_cmp:5"},{"q":"Mai is a more fluent English speaker than Lan.","s":"Mai","ans":["Mai speaks English more fluently than Lan."],"ex":"a more fluent English <b>speaker<\/b> → <b>speaks English more fluently<\/b> (tân ngữ English đặt ngay sau động từ).","vi":"Mai nói tiếng Anh lưu loát hơn Lan.","id":"rw_cmp:6"},{"q":"My brother is a better badminton player than me.","s":"My brother","ans":["My brother plays badminton better than me.","My brother plays badminton better than I do.","My brother plays badminton better than I."],"ex":"a better badminton <b>player<\/b> → <b>plays badminton better<\/b>.","vi":"Anh trai tôi chơi cầu lông giỏi hơn tôi.","id":"rw_cmp:7"},{"q":"Nam is a more careless writer than his classmates.","s":"Nam","ans":["Nam writes more carelessly than his classmates."],"ex":"a more careless <b>writer<\/b> → <b>writes more carelessly<\/b>.","vi":"Nam viết cẩu thả hơn các bạn cùng lớp.","id":"rw_cmp:8"},{"q":"Huong is a more creative designer than her friend.","s":"Huong","ans":["Huong designs more creatively than her friend."],"ex":"a more creative <b>designer<\/b> → <b>designs more creatively<\/b>.","vi":"Hương thiết kế sáng tạo hơn bạn của cô ấy.","id":"rw_cmp:9"},{"q":"Peter is a more careful driver than his brother.","s":"Peter","ans":["Peter drives more carefully than his brother."],"ex":"a more careful <b>driver<\/b> → <b>drives more carefully<\/b>. <i>(Câu 40 – Đề tham khảo)<\/i>","vi":"Peter lái xe cẩn thận hơn anh trai.","id":"rw_cmp:10"},{"q":"Lan is a better dancer than Mai.","s":"Lan","ans":["Lan dances better than Mai."],"ex":"a better <b>dancer<\/b> → <b>dances better<\/b> (good → well → better; chủ ngữ số ít thêm -s).","vi":"Lan nhảy giỏi hơn Mai.","id":"rw_cmp:11"},{"q":"Mr Nam is a slower walker than his wife.","s":"Mr Nam","ans":["Mr Nam walks more slowly than his wife.","Mr Nam walks slower than his wife."],"ex":"a slower <b>walker<\/b> → <b>walks more slowly<\/b> (slow → slowly → more slowly).","vi":"Ông Nam đi bộ chậm hơn vợ ông.","id":"rw_cmp:12"}]};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ul=s=>String(s).replace(/\[(.+?)\]/g,'<u>$1</u>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=x=>{let s=(Math.round(x*100)/100).toFixed(2);s=s.replace(/0+$/,'').replace(/\.$/,'');return s.replace('.',',');};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function modal(title,text,btns){const m=$('#mdl');m.innerHTML=`<h3>${title}</h3><p>${text}</p><div class="row">${btns.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${b.t}</button>`).join('')}</div>`;$('#ovl').classList.remove('hidden');m.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#ovl').classList.add('hidden');const f=btns[+b.dataset.i].f;if(f)f();});}
function dateStr(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function durStr(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+' phút '+String(s%60).padStart(2,'0')+' giây';}

/* ---------- text checking ---------- */
function norm(s){
  s=String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"');
  s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not')
     .replace(/n't\b/g,' not').replace(/'ll\b/g,' will').replace(/'d better\b/g,' had better').replace(/'re\b/g,' are').replace(/'m\b/g,' am')
     .replace(/\b(it|that|he|she|there|what|who)'s\b/g,'$1 is').replace(/'ve\b/g,' have');
  s=s.replace(/[.,!?;:"()]/g,' ').replace(/\s*-\s*/g,'-').replace(/\s+/g,' ').trim();
  return s;
}
function checkText(q,val){
  const v=String(val||'').trim();if(!v)return false;
  if(q.kind==='rw'){
    const ns=norm(q.s),nv=norm(v);
    const full=(nv===ns||nv.startsWith(ns+' '))?nv:norm(q.s+' '+v);
    return q.answers.some(a=>norm(a)===full);
  }
  return q.answers.some(a=>norm(a)===norm(v));
}

/* ---------- bank access ---------- */
const MCQPOOLS=['ed','sound','s2','s3','vocab','gram','conj','prep','func','sign'];
function getQ(ref){
  const m=ref.match(/^([a-z0-9_]+):(\d+)(?:\.(.+))?$/);const pool=m[1],i=+m[2],sub=m[3];const g=B[pool][i];
  if(MCQPOOLS.includes(pool))return {type:'mcq',kind:pool==='ed'||pool==='sound'?'pron':pool==='s2'||pool==='s3'?'stress':pool==='sign'?'sign':'mc',q:g.q||'',o:g.o,a:g.a,ex:g.ex,vi:g.vi,sign:g.sign};
  if(pool==='cloze'){const x=g.qs[+sub];return {type:'mcq',kind:'cloze',q:'',o:x.o,a:x.a,ex:x.ex,vi:x.vi,g,blank:+sub};}
  if(pool==='read'){const t=sub[0],k=+sub.slice(1);
    if(t==='t'){const x=g.tf[k];return {type:'mcq',kind:'tf',q:x.q,o:['True','False'],a:x.a?0:1,ex:x.ex,vi:x.vi,g};}
    const x=g.mc[k];return {type:'mcq',kind:'mc',q:x.q,o:x.o,a:x.a,ex:x.ex,vi:x.vi,g};}
  if(pool==='wf')return {type:'input',kind:'wf',q:g.q,answers:g.a,ex:g.ex,vi:g.vi};
  if(pool==='dict'){const x=g.qs[+sub];return {type:'input',kind:'dict',q:x.q,answers:x.a,ex:x.ex,vi:x.vi,g};}
  return {type:'input',kind:'rw',q:g.q,s:g.s,answers:g.ans,ex:g.ex,vi:g.vi};
}
function correctText(q){if(q.type==='mcq')return q.o[q.a];if(q.kind==='rw')return q.answers[0];return q.answers.join(' / ');}

/* ---------- test generation (matrix) ---------- */
function ranked(pool,used){return shuffle(B[pool]).sort((a,b)=>(used[a.id]||0)-(used[b.id]||0));}
function pickN(pool,n,used){
  const out=[],seen=new Set();
  for(const x of ranked(pool,used)){if(out.length>=n)break;const key=x.o?x.o[x.a]:x.id;if(seen.has(key))continue;seen.add(key);out.push(x);}
  return out;
}
function pickVocab(used){
  const list=ranked('vocab',used),out=[],ans=new Set();
  const take=x=>{out.push(x);ans.add(x.o[x.a]);};
  shuffle(['u12','u3','u4','u5']).forEach(u=>{const x=list.find(y=>y.u===u&&!out.includes(y)&&!ans.has(y.o[y.a]));if(x)take(x);});
  for(const x of list){if(out.length>=6)break;if(!out.includes(x)&&!ans.has(x.o[x.a]))take(x);}
  return shuffle(out);
}
function pickWF(used){
  const list=ranked('wf',used),out=[],fams=new Set();
  for(const pos of ['v','adv','n','n','adj','adj']){
    let x=list.find(y=>y.pos===pos&&!out.includes(y)&&!fams.has(y.fam));
    if(!x)x=list.find(y=>y.pos===pos&&!out.includes(y));
    out.push(x);fams.add(x.fam);
  }
  return shuffle(out);
}
function makeTest(u){
  const used=u.used;const items=[];let n=1;
  const addM=(ref,o)=>{items.push({n:n++,ref,perm:o?shuffle([0,1,2,3]):null});};
  pickN('ed',1,used).forEach(x=>addM(x.id,1));
  pickN('sound',1,used).forEach(x=>addM(x.id,1));
  const s2=pickN('s2',1,used),s3=pickN('s3',1,used);shuffle([s2[0],s3[0]]).forEach(x=>addM(x.id,1));
  pickVocab(used).forEach(x=>addM(x.id,1));
  ['gram','conj','prep','func'].forEach(p=>pickN(p,1,used).forEach(x=>addM(x.id,1)));
  pickN('sign',2,used).forEach(x=>addM(x.id,1));
  const cz=pickN('cloze',1,used)[0];for(let k=0;k<6;k++)addM(cz.id+'.'+k,1);
  const rd=pickN('read',1,used)[0];for(let k=0;k<4;k++)addM(rd.id+'.t'+k,0);for(let k=0;k<2;k++)addM(rd.id+'.m'+k,1);
  pickWF(used).forEach(x=>addM(x.id,0));
  const dc=pickN('dict',1,used)[0];for(let k=0;k<2;k++)addM(dc.id+'.'+k,0);
  ['rw_if','rw_hb','rw_bs','rw_cmp'].forEach(p=>pickN(p,1,used).forEach(x=>addM(x.id,0)));
  // usage: base ids
  const bases=new Set(items.map(it=>it.ref.split('.')[0]));
  bases.forEach(id=>used[id]=(used[id]||0)+1);
  u.n=(u.n||0)+1;
  return {no:u.n,items,ans:{},start:Date.now(),timer:!!DB.timer,cls:u.cls||''};
}
function poolCoverage(u){ // how many fresh tests remain before repeats
  const lim={ed:1,sound:1,s2:1,s3:1,vocab:6,gram:1,conj:1,prep:1,func:1,sign:2,cloze:1,read:1,wf:6,dict:1,rw_if:1,rw_hb:1,rw_bs:1,rw_cmp:1};
  let min=Infinity;for(const p in lim){const fresh=B[p].filter(x=>!(u.used[x.id])).length;min=Math.min(min,Math.floor(fresh/lim[p]));}
  return min;
}
const BANKSIZE=(()=>{let c=0;for(const p in B){B[p].forEach(x=>{if(x.qs)c+=x.qs.length;else if(x.tf)c+=x.tf.length+x.mc.length;else c++;});}return c;})();
const FULLTESTS=(()=>{const lim={ed:1,sound:1,s2:1,s3:1,vocab:6,gram:1,conj:1,prep:1,func:1,sign:2,cloze:1,read:1,wf:6,dict:1,rw_if:1,rw_hb:1,rw_bs:1,rw_cmp:1};let m=Infinity;for(const p in lim)m=Math.min(m,Math.floor(B[p].length/lim[p]));return m;})();

/* TEST */
function blankify(passage,base,ansFor){
  return passage.split(/\n\n+/).map(par=>'<p>'+esc(par).replace(/\((\d)\)\s*_+/g,(m,d)=>{const n=base+(+d)-1;const t=ansFor?ansFor(n):'';return `<span class="blank${t?' fill':''}" id="bl${n}">(${n}) ${t?esc(t):'______'}</span>`;})+'</p>').join('');
}
function paras(t){return t.split(/\n\n+/).map(p=>'<p>'+esc(p)+'</p>').join('');}
function dictHTML(e){return `<div class="dict"><span class="hw">${esc(e.w)}</span><span class="ipa">${esc(e.ipa)}</span><span class="pos">${esc(e.pos)}</span>${e.defs.map(d=>`<div style="margin-top:6px">${d.g?`<span class="g">${esc(d.g)}</span> `:''}${esc(d.d)}<ul>${d.ex.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`).join('')}</div>`;}
function signHTML(s){return `<div class="sign ${s.k}"><span class="ic">${SIGNIC[s.k]||''}</span><span>${s.lines.map(l=>`<span class="ln">${esc(l)}</span>`).join('')}</span></div>`;}
function optClass(q){if(q.kind==='pron'||q.kind==='stress'||q.kind==='tf')return 'short';const L=Math.max(...q.o.map(o=>o.length));return L<=16?'short':L<=34?'mid':'';}
function qPrompt(q,it){
  if(q.kind==='pron'||q.kind==='stress'||q.kind==='cloze')return '';
  if(q.kind==='sign')return signHTML(q.sign);
  if(q.kind==='rw')return esc(q.q);
  if(q.kind==='tf')return esc(q.q);
  return q.q; // contains <br>
}
function sectionContext(pid,test){
  const it=test.items.find(x=>x.n===PARTS.find(p=>p.id===pid).from);const q=getQ(it.ref);
  if(pid==='p3')return {g:q.g,html:`<div class="passage"><h3>${esc(q.g.title)}</h3>${blankify(q.g.passage,17,n=>{const a=test.ans[n];if(a==null)return '';const qq=getQ(test.items[n-1].ref);return qq.o[a];})}</div>`};
  if(pid==='p4')return {g:q.g,html:`<div class="passage"><h3>${esc(q.g.title)}</h3>${paras(q.g.passage)}</div>`};
  if(pid==='p6')return {g:q.g,html:dictHTML(q.g.entry)};
  return null;
}

  $('#sub1').onclick=$('#sub2').onclick=()=>askSubmit();

  if(T.timer){const tick=()=>{const left=T.start+DUR-Date.now();const el=$('#tmr');if(!el)return;if(left<=0){stopTimer();toast('Hết giờ! Bài làm đã được nộp.');submit();return;}const s=Math.ceil(left/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');el.classList.toggle('low',s<=300);};tick();timerInt=setInterval(tick,1000);}
  function updProg(){const c=Object.keys(T.ans).length;$('#cnt').textContent=c;$('#pg').style.width=(c/40*100)+'%';}

function qCardTest(T,it){
  const q=getQ(it.ref),n=it.n;let h=`<div class="q" id="q${n}"><div class="qh"><div class="qn">${n}</div><div class="qt">${qPrompt(q,it)}`;
  if(q.type==='mcq'){
    const order=it.perm||[0,1];
    h+=`<div class="opts ${optClass(q)}">${order.map((oi,k)=>`<button class="opt${T.ans[n]===oi?' on':''}" data-n="${n}" data-i="${oi}"><span class="L">${q.kind==='tf'?(k?'F':'T'):LET[k]}.</span><span>${q.kind==='pron'?ul(esc(q.o[oi])):esc(q.o[oi])}</span></button>`).join('')}</div>`;
  }else{
    const v=T.ans[n]||'';
    if(q.kind==='rw')h+=`<div class="ans-in"><span class="st">→ ${esc(q.s)}</span><input class="t" data-n="${n}" value="${esc(v)}" placeholder="viết tiếp câu…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
    else h+=`<div class="ans-in"><input class="t" data-n="${n}" value="${esc(v)}" placeholder="${q.kind==='wf'?'Điền dạng đúng của từ':'Điền cụm từ'}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
  }
  return h+`</div></div></div>`;
}
function askSubmit(){
  const T=U().cur;const miss=[];for(let n=1;n<=40;n++)if(T.ans[n]==null)miss.push(n);
  if(!miss.length){modal('Nộp bài?','Em đã làm đủ 40 câu. Sau khi nộp sẽ không sửa được nữa.',[{t:'Kiểm tra lại'},{t:'Nộp bài',cls:'pri',f:submit}]);return;}
  modal('Còn '+miss.length+' câu chưa làm',`Các câu: ${miss.slice(0,12).join(', ')}${miss.length>12?'…':''}. Câu bỏ trống bị tính sai.`,[{t:'Làm tiếp',cls:'pri',f:()=>{miss.forEach(n=>{const e=$('#q'+n);if(e)e.classList.add('unans-flag');});const e=$('#q'+miss[0]);if(e)e.scrollIntoView({behavior:'smooth'});}},{t:'Vẫn nộp bài',f:submit}]);
}
function grade(T){
  const res=T.items.map(it=>{const q=getQ(it.ref);const a=T.ans[it.n];const ok=q.type==='mcq'?a===q.a:checkText(q,a);return {n:it.n,ref:it.ref,ok};});
  const correct=res.filter(r=>r.ok).length;
  const parts=PARTS.map(P=>{const r=res.filter(x=>x.n>=P.from&&x.n<=P.to);return {id:P.id,ok:r.filter(x=>x.ok).length,tot:r.length};});
  return {res,correct,score:correct*0.25,parts};
}
let LAST=null;
function submit(){
  stopTimer();const u=U();const T=u.cur;if(!T)return;
  const G=grade(T);const end=Date.now();
  G.res.forEach(r=>{if(r.ok)delete u.wrong[r.ref];else u.wrong[r.ref]={ts:end};});
  u.hist.push({no:T.no,ts:end,correct:G.correct,score:G.score,dur:end-T.start});
  if(u.hist.length>60)u.hist=u.hist.slice(-60);
  u.last={test:T,G,end};u.cur=null;save();
  go('result');
}

/* RESULT */
let FILTER='all';
function comment(s){if(s>=9)return ['Xuất sắc!','ok'];if(s>=8)return ['Giỏi lắm!','ok'];if(s>=6.5)return ['Khá tốt','warn'];if(s>=5)return ['Đạt – cần cố gắng thêm','warn'];return ['Chưa đạt – hãy ôn lại và luyện câu sai','bad'];}
function renderResult(){
  const u=U();if(!u||!u.last){go('home');return;}
  const {test:T,G,end}=u.last;const [cm,ct]=comment(G.score);const wrongN=40-G.correct;
  const col=G.score>=8?'var(--ok)':G.score>=5?'var(--warn)':'var(--bad)';
  let h=`<div class="wrap">
  <div class="card" style="margin-top:18px">
    <div class="score"><div class="ring" style="--p:${G.score*10};--c:${col}"><div><b>${fmt(G.score)}</b><span>/ 10 điểm</span></div></div>
    <div><h2>${esc(u.name)}${T.cls?' <span class="muted" style="font-weight:500;font-size:16px">· Lớp '+esc(T.cls)+'</span>':''}</h2>
    <div class="muted small">Đề số ${T.no} · nộp lúc ${dateStr(end)}</div>
    <div class="small" style="margin-top:6px">Đúng <b>${G.correct}/40</b> câu · thời gian làm: ${durStr(end-T.start)}</div>
    <div style="margin-top:6px"><span class="tag ${ct}">${cm}</span></div></div></div>
    <table class="tb" style="margin-top:14px"><thead><tr><th>Phần</th><th class="num">Đúng</th><th class="num">Điểm</th></tr></thead><tbody>
    ${G.parts.map(p=>{const P=PARTS.find(x=>x.id===p.id);return `<tr><td>${P.label} <span class="muted small">(câu ${P.from}–${P.to})</span></td><td class="num">${p.ok}/${p.tot}</td><td class="num">${fmt(p.ok*0.25)}</td></tr>`;}).join('')}
    </tbody></table>
    <div class="row noprint" style="margin-top:14px">
      ${wrongN?`<button class="btn pri" id="pw">Luyện lại ${wrongN} câu sai</button>`:''}
      <button class="btn ${wrongN?'':'pri'}" id="nt">Làm đề mới</button>
      <button class="btn" id="pr">In kết quả</button>
      <button class="btn" id="hm">Trang chủ</button>
    </div>
  </div>
  <div class="filterbar"><h3 style="margin:0">Đáp án và giải thích</h3>
    <div class="seg"><button data-f="all" class="${FILTER==='all'?'on':''}">Tất cả</button><button data-f="wrong" class="${FILTER==='wrong'?'on':''}">Chỉ câu sai (${wrongN})</button></div></div>
  <div id="rv"></div></div>`;
  $('#app').innerHTML=h;
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;renderResult();});
  if($('#pw'))$('#pw').onclick=()=>startPractice(G.res.filter(r=>!r.ok).map(r=>r.ref));
  $('#nt').onclick=()=>{u.cur=makeTest(u);save();go('test');};
  $('#pr').onclick=()=>window.print();
  $('#hm').onclick=()=>go('home');
  let r='';
  for(const P of PARTS){
    const rows=G.res.filter(x=>x.n>=P.from&&x.n<=P.to);const show=rows.filter(x=>FILTER==='all'||!x.ok);if(!show.length)continue;
    const [t1]=HEAD[P.id];r+=`<div class="part"><h2>${t1}</h2></div>`;
    const it0=T.items[P.from-1],q0=getQ(it0.ref);
    if(P.id==='p3')r+=`<div class="passage"><h3>${esc(q0.g.title)}</h3>${blankify(q0.g.passage,17,n=>{const q=getQ(T.items[n-1].ref);return q.o[q.a];})}<details class="tr"><summary>Xem bản dịch đoạn văn</summary><div class="vi">${esc(q0.g.vi)}</div></details></div>`;
    if(P.id==='p4')r+=`<div class="passage"><h3>${esc(q0.g.title)}</h3>${paras(q0.g.passage)}<details class="tr"><summary>Xem bản dịch đoạn văn</summary><div class="vi">${esc(q0.g.vi)}</div></details></div>`;
    if(P.id==='p6')r+=dictHTML(q0.g.entry);
    show.forEach(x=>{r+=reviewCard(T.items[x.n-1],T.ans[x.n],x.ok);});
  }
  if(!r)r=`<div class="empty">Em làm đúng tất cả các câu. Tuyệt vời!</div>`;
  $('#rv').innerHTML=r;
}
function viLabel(q){return q.kind==='pron'||q.kind==='stress'?'Nghĩa các từ':q.kind==='sign'?'Dịch':q.kind==='tf'?'Dịch câu':'Dịch nghĩa';}
function reviewCard(it,a,ok){
  const q=getQ(it.ref),n=it.n;
  let h=`<div class="q"><div class="qh"><div class="qn" style="${ok?'background:var(--ok-bg);color:var(--ok)':'background:var(--bad-bg);color:var(--bad)'}">${n}</div><div class="qt">`;
  h+=`<div style="float:right;margin-left:8px">${ok?'<span class="tag ok">Đúng</span>':a==null||a===''?'<span class="tag warn">Bỏ trống</span>':'<span class="tag bad">Sai</span>'}</div>`;
  h+=qPrompt(q,it);
  if(q.type==='mcq'){
    const order=it.perm||[0,1];
    h+=`<div class="opts ${optClass(q)}">${order.map((oi,k)=>`<button class="opt${oi===q.a?' right':a===oi?' wrong':''}" disabled><span class="L">${q.kind==='tf'?(k?'F':'T'):LET[k]}.</span><span>${q.kind==='pron'?ul(esc(q.o[oi])):esc(q.o[oi])}</span></button>`).join('')}</div>`;
  }else{
    if(q.kind==='rw')h+=`<div class="small muted" style="margin-top:6px">→ ${esc(q.s)} …</div>`;
    h+=`<div class="yours">Em trả lời: ${a?`<span class="${ok?'v':'x'}">${esc(a)}</span>`:'<i class="muted">(bỏ trống)</i>'}</div>`;
    if(!ok||q.kind!=='rw')h+=`<div class="yours">Đáp án: <span class="v">${esc(correctText(q))}</span>${q.answers.length>1&&q.kind==='rw'?' <span class="muted small">(cách viết khác cũng đúng: '+q.answers.slice(1).map(esc).join('; ')+')</span>':''}</div>`;
  }
  h+=`<div class="exp"><p><span class="k">Giải thích:</span> ${q.ex}</p><p><span class="k">${viLabel(q)}:</span> ${esc(q.vi).replace(/&lt;br&gt;/g,'<br>')}</p></div>`;
  return h+`</div></div></div>`;
}

/* PRACTICE (wrong answers) */
let PR=null;
function startPractice(refs){
  const valid=refs.filter(r=>{try{return !!getQ(r);}catch(e){return false;}});
  if(!valid.length){toast('Không có câu sai nào để luyện.');return;}
  PR={queue:shuffle(valid),i:0,ok:0,done:false,ans:null,checked:false,perm:null};go('practice');
}
function renderPractice(){
  const u=U();if(!PR||!u){go('home');return;}
  if(PR.i>=PR.queue.length){
    const left=Object.keys(u.wrong).length;
    $('#app').innerHTML=`<div class="wrap"><div class="card" style="margin-top:22px;text-align:center">
      <h2 style="margin:4px 0 6px">Hoàn thành lượt luyện tập</h2>
      <p class="muted">Em trả lời đúng <b>${PR.ok}/${PR.queue.length}</b> câu. Câu làm đúng đã được xóa khỏi danh sách câu sai.</p>
      <p>${left?`Còn <b>${left}</b> câu sai cần luyện lại.`:'Danh sách câu sai đã trống. Rất tốt!'}</p>
      <div class="row" style="margin-top:12px">${left?'<button class="btn pri" id="again">Luyện tiếp câu còn sai</button>':''}<button class="btn" id="nt">Làm đề mới</button><button class="btn" id="hm">Trang chủ</button></div></div></div>`;
    if($('#again'))$('#again').onclick=()=>startPractice(Object.keys(u.wrong));
    $('#nt').onclick=()=>{u.cur=makeTest(u);save();go('test');};
    $('#hm').onclick=()=>go('home');
    return;
  }
  const ref=PR.queue[PR.i],q=getQ(ref);
  if(!PR.perm)PR.perm=q.kind==='tf'?[0,1]:shuffle([0,1,2,3]);
  let ctx='';
  if(q.kind==='cloze'){ctx=`<details class="tr" open><summary>Đoạn văn (Câu ${q.blank+1} trong đoạn)</summary><div class="passage" style="margin-top:8px"><h3>${esc(q.g.title)}</h3>${blankify(q.g.passage,1,null).replace(new RegExp('id="bl'+(q.blank+1)+'"'),'id="cur" style="border-color:var(--pri);color:var(--pri)"')}</div></details>`;}
  else if(q.g&&q.g.tf){ctx=`<details class="tr"><summary>Xem đoạn văn: ${esc(q.g.title)}</summary><div class="passage" style="margin-top:8px">${paras(q.g.passage)}</div></details>`;}
  else if(q.kind==='dict')ctx=dictHTML(q.g.entry);
  const it={n:q.kind==='cloze'?'('+(q.blank+1)+')':PR.i+1,perm:q.type==='mcq'?PR.perm:null};
  const head={pron:'Choose the word whose underlined part is pronounced differently.',stress:'Choose the word whose main stress is placed differently.',sign:'What does the sign / notice say?',tf:'True or False?',cloze:'Choose the best answer for the blank.',wf:'Give the correct form of the word in brackets.',dict:'Complete the sentence with a phrase from the dictionary entry.',rw:'Rewrite the sentence, beginning with the given words.',mc:'Choose the best answer.'}[q.kind];
  let h=`<div class="bar"><div class="wrap"><div class="who"><b>Luyện lại câu sai</b><span>Câu ${PR.i+1}/${PR.queue.length} · đúng ${PR.ok}</span></div><button class="btn sm" id="quit">Thoát</button></div><div class="prog"><i style="width:${PR.i/PR.queue.length*100}%"></i></div></div><div class="wrap"><p class="small muted" style="margin:16px 0 4px">${head}</p>${ctx}`;
  h+=`<div class="q"><div class="qh"><div class="qn">${it.n}</div><div class="qt">${qPrompt(q,it)}`;
  if(q.type==='mcq'){
    h+=`<div class="opts ${optClass(q)}">${PR.perm.map((oi,k)=>{let c='';if(PR.checked){if(oi===q.a)c=' right';else if(oi===PR.ans)c=' wrong';}else if(oi===PR.ans)c=' on';return `<button class="opt${c}" data-i="${oi}" ${PR.checked?'disabled':''}><span class="L">${q.kind==='tf'?(k?'F':'T'):LET[k]}.</span><span>${q.kind==='pron'?ul(esc(q.o[oi])):esc(q.o[oi])}</span></button>`;}).join('')}</div>`;
  }else{
    h+=`<div class="ans-in">${q.kind==='rw'?`<span class="st">→ ${esc(q.s)}</span>`:''}<input class="t" id="pin" value="${esc(PR.ans||'')}" ${PR.checked?'disabled':''} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập câu trả lời"></div>`;
  }
  if(PR.checked){
    const ok=PR.lastOk;
    h+=`<div class="fb ${ok?'ok':'bad'}">${ok?'Chính xác!':'Chưa đúng.'}${!ok||q.type!=='mcq'?` Đáp án: ${esc(correctText(q))}`:''}</div>`;
    h+=`<div class="exp"><p><span class="k">Giải thích:</span> ${q.ex}</p><p><span class="k">${viLabel(q)}:</span> ${esc(q.vi)}</p></div>`;
    if(q.kind==='cloze'||(q.g&&q.g.tf))h+=`<details class="tr"><summary>Xem bản dịch đoạn văn</summary><div class="vi">${esc(q.g.vi)}</div></details>`;
  }
  h+=`</div></div></div><div class="row" style="margin:8px 0 30px">${PR.checked?'<button class="btn pri" id="next">Câu tiếp theo</button>':'<button class="btn pri" id="chk">Kiểm tra</button><button class="btn" id="skip">Bỏ qua</button>'}</div></div>`;
  $('#app').innerHTML=h;
  $('#quit').onclick=()=>{PR=null;go('home');};
  document.querySelectorAll('.opt').forEach(b=>{if(!PR.checked)b.onclick=()=>{PR.ans=+b.dataset.i;renderPractice();};});
  if($('#pin')){$('#pin').oninput=e=>{PR.ans=e.target.value;};$('#pin').onkeydown=e=>{if(e.key==='Enter')doCheck();};if(!PR.checked)$('#pin').focus();}
  if($('#chk'))$('#chk').onclick=doCheck;
  if($('#skip'))$('#skip').onclick=()=>{PR.i++;PR.ans=null;PR.checked=false;PR.perm=null;renderPractice();window.scrollTo(0,0);};
  if($('#next'))$('#next').onclick=()=>{PR.i++;PR.ans=null;PR.checked=false;PR.perm=null;renderPractice();window.scrollTo(0,0);};
  function doCheck(){
    if(PR.ans==null||PR.ans===''){toast('Em hãy chọn hoặc nhập câu trả lời.');return;}
    const ok=q.type==='mcq'?PR.ans===q.a:checkText(q,PR.ans);
    PR.checked=true;PR.lastOk=ok;if(ok){PR.ok++;delete u.wrong[ref];}else u.wrong[ref]={ts:Date.now()};save();renderPractice();
  }
}

render();
})();
</script>
</body>
