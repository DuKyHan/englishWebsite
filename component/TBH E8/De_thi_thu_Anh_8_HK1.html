<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5FD1">
<title>Đề thi thử Anh 8</title>
<style>
:root{
  --bg:#F3F6FB;--card:#FFFFFF;--ink:#1A2230;--muted:#5F6D82;--line:#DCE3EE;--line2:#C6D0DF;
  --pri:#1F5FD1;--pri-d:#174AA6;--pri-bg:#E8F0FE;--ok:#16884A;--ok-bg:#E2F5EA;--bad:#C9353D;--bad-bg:#FCE8E9;
  --warn:#B86E00;--warn-bg:#FFF3DC;--sel:#E3ECFD;--sel-line:#6E9BEF;--shadow:0 1px 2px rgba(16,32,64,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1520;--card:#182131;--ink:#E7EDF6;--muted:#97A5B9;--line:#2A3648;--line2:#38465B;
    --pri:#5B92F5;--pri-d:#3F74D6;--pri-bg:#1B2B47;--ok:#3CCB7F;--ok-bg:#13301F;--bad:#FF6B72;--bad-bg:#3A1C20;
    --warn:#F2B14C;--warn-bg:#3A2C12;--sel:#1D2E4E;--sel-line:#4E7DD4;--shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1520;--card:#182131;--ink:#E7EDF6;--muted:#97A5B9;--line:#2A3648;--line2:#38465B;
  --pri:#5B92F5;--pri-d:#3F74D6;--pri-bg:#1B2B47;--ok:#3CCB7F;--ok-bg:#13301F;--bad:#FF6B72;--bad-bg:#3A1C20;
  --warn:#F2B14C;--warn-bg:#3A2C12;--sel:#1D2E4E;--sel-line:#4E7DD4;--shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h1,h2,h3{line-height:1.25}
a{color:var(--pri)}

/* top bar */
.bar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:56px;padding-top:6px;padding-bottom:6px}
.bar .who{flex:1;min-width:0}
.bar .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.bar .who span{font-size:12.5px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:5px 9px;border-radius:9px;background:var(--pri-bg);color:var(--pri)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}

/* buttons */
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:11px 16px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:14px}
.hero{padding:22px 0 6px}
.hero h1{font-size:24px;margin:0 0 6px}
.hero p{margin:0;color:var(--muted)}
label.f{display:block;font-weight:650;font-size:14px;margin:12px 0 6px}
input.t{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:11px 13px;min-height:46px;outline:none}
input.t:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:13px;color:var(--muted)}
table.tb{width:100%;border-collapse:collapse;font-size:14.5px}
table.tb th,table.tb td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tb th{font-size:13px;color:var(--muted);font-weight:600}
table.tb td.num,table.tb th.num{text-align:right;font-variant-numeric:tabular-nums}
.mtx{font-size:14px}
.mtx td:first-child{white-space:nowrap}

/* exam */
.part{margin:22px 0 8px}
.part h2{font-size:17px;margin:0;color:var(--pri)}
.part p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow);scroll-margin-top:80px}
.q.unans-flag{border-color:var(--warn)}
.qh{display:flex;gap:10px;align-items:flex-start}
.qn{flex:0 0 auto;min-width:30px;height:30px;border-radius:9px;background:var(--pri-bg);color:var(--pri);font-weight:750;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.qt{flex:1;min-width:0;padding-top:3px}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.opts.short{grid-template-columns:1fr 1fr}
@media(min-width:560px){.opts.short{grid-template-columns:repeat(4,1fr)}.opts.mid{grid-template-columns:1fr 1fr}}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:9px 11px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;min-height:44px;line-height:1.4}
.opt .L{flex:0 0 auto;font-weight:750;color:var(--muted);min-width:18px}
.opt:hover{border-color:var(--sel-line)}
.opt.on{background:var(--sel);border-color:var(--sel-line)}
.opt.on .L{color:var(--pri)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right .L{color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .L{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
.ans-in{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ans-in .st{font-weight:700;white-space:nowrap}
.ans-in input{flex:1 1 200px;min-width:0}
.passage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;font-size:15.5px;line-height:1.65;box-shadow:var(--shadow)}
.passage h3{margin:0 0 8px;font-size:16px;text-align:center}
.passage p{margin:0 0 10px}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;background:var(--bg);border:1px dashed var(--line2);border-radius:6px;padding:0 6px;font-weight:650;color:var(--muted);min-width:70px;text-align:center}
.blank.fill{border-style:solid;border-color:var(--sel-line);background:var(--sel);color:var(--ink)}
.sign{border-radius:12px;padding:12px 14px;margin:8px 0 2px;text-align:center;font-weight:800;letter-spacing:.3px;border:3px solid;display:flex;gap:12px;align-items:center;justify-content:center;background:#fff;color:#1a1a1a}
.sign .ic{font-size:30px;line-height:1}
.sign .ln{display:block}
.sign .ln+.ln{font-weight:600;font-size:14.5px;letter-spacing:0}
.sign.ban{border-color:#D22F2F}
.sign.warn{border-color:#E6A100;background:#FFF6D6}
.sign.must{border-color:#1E63C8;background:#EAF2FF}
.sign.info{border-color:#1E8A4C;background:#EAF7EF}
.dict{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.dict .hw{font-weight:800;font-size:18px}
.dict .ipa{color:var(--muted);margin:0 6px}
.dict .pos{font-style:italic;color:var(--pri)}
.dict ul{margin:4px 0 0;padding-left:20px}
.dict .g{font-size:13px;color:var(--muted)}
details.tr{margin:8px 0 0}
details.tr summary{cursor:pointer;color:var(--pri);font-weight:650;font-size:14.5px}
details.tr .vi{margin-top:6px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:15px;white-space:pre-line}
.submitbar{position:sticky;bottom:0;z-index:20;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 14px}

/* result */
.score{display:flex;gap:16px;align-items:center}
.ring{flex:0 0 auto;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring b{font-size:28px;line-height:1}
.ring span{font-size:12px;color:var(--muted)}
.score h2{margin:0 0 4px;font-size:20px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.exp .k{font-weight:750}
.exp p{margin:0 0 6px}
.exp p:last-child{margin:0}
.yours{margin-top:8px;font-size:15px}
.yours .x{color:var(--bad);font-weight:650;text-decoration:line-through}
.yours .v{color:var(--ok);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600}
.seg button.on{background:var(--pri);color:#fff}
.filterbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mdl h3{margin:0 0 8px}
.mdl p{margin:0 0 14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;z-index:70;font-size:14.5px;max-width:90vw}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:700}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
footer{padding:30px 0 40px;text-align:center;font-size:13px;color:var(--muted)}
@media print{
  .bar,.submitbar,.noprint,.filterbar,footer{display:none!important}
  body{background:#fff;color:#000}
  .card,.q,.passage{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovl" class="ov hidden"><div class="mdl" id="mdl"></div></div>

<script>
const BANK={"ed":[{"o":["work[ed]","watch[ed]","need[ed]","walk[ed]"],"a":2,"ex":"<b>needed<\/b> đọc /ɪd/ vì động từ <i>need<\/i> tận cùng bằng âm /d/. Ba từ còn lại đọc /t/: work<b>ed<\/b>, walk<b>ed<\/b> (âm cuối /k/), watch<b>ed<\/b> (âm cuối /tʃ/).","vi":"worked: đã làm việc · watched: đã xem · needed: đã cần · walked: đã đi bộ","id":"ed:0"},{"o":["decid[ed]","play[ed]","clean[ed]","liv[ed]"],"a":0,"ex":"<b>decided<\/b> đọc /ɪd/ vì <i>decide<\/i> tận cùng âm /d/. played, cleaned, lived đọc /d/ (âm cuối /eɪ/, /n/, /v/ là âm hữu thanh).","vi":"decided: đã quyết định · played: đã chơi · cleaned: đã dọn dẹp · lived: đã sống","id":"ed:1"},{"o":["laugh[ed]","relax[ed]","harvest[ed]","danc[ed]"],"a":2,"ex":"<b>harvested<\/b> đọc /ɪd/ vì <i>harvest<\/i> tận cùng âm /t/. laughed (gh đọc /f/), relaxed (x đọc /ks/), danced (ce đọc /s/) đều là âm vô thanh nên đọc /t/.","vi":"laughed: đã cười · relaxed: đã thư giãn · harvested: đã thu hoạch · danced: đã nhảy múa","id":"ed:2"},{"o":["plough[ed]","knitt[ed]","cultivat[ed]","collect[ed]"],"a":0,"ex":"<b>ploughed<\/b> /plaʊd/ đọc /d/: chữ gh câm, âm cuối là nguyên âm /aʊ/. knitted, cultivated, collected tận cùng âm /t/ nên đọc /ɪd/.","vi":"ploughed: đã cày (ruộng) · knitted: đã đan · cultivated: đã trồng trọt · collected: đã sưu tầm","id":"ed:3"},{"o":["releas[ed]","promis[ed]","chas[ed]","rais[ed]"],"a":3,"ex":"<b>raised<\/b> /reɪzd/ đọc /d/ vì chữ s ở đây đọc /z/ (âm hữu thanh). released, promised, chased có s đọc /s/ (vô thanh) nên đuôi -ed đọc /t/.","vi":"released: đã thả · promised: đã hứa · chased: đã đuổi · raised: đã nuôi; đã nâng lên","id":"ed:4"},{"o":["decorat[ed]","celebrat[ed]","worshipp[ed]","invit[ed]"],"a":2,"ex":"<b>worshipped<\/b> đọc /t/ vì âm cuối là /p/. decorated, celebrated, invited tận cùng âm /t/ nên đọc /ɪd/.","vi":"decorated: đã trang trí · celebrated: đã tổ chức mừng · worshipped: đã thờ cúng · invited: đã mời","id":"ed:5"},{"o":["visit[ed]","wash[ed]","need[ed]","connect[ed]"],"a":1,"ex":"<b>washed<\/b> đọc /t/ vì âm cuối là /ʃ/ (sh). visited, needed, connected tận cùng /t/ hoặc /d/ nên đọc /ɪd/. <i>(Câu 1 – Đề ôn tập tham khảo)<\/i>","vi":"visited: đã thăm · washed: đã giặt, rửa · needed: đã cần · connected: đã kết nối","id":"ed:6"},{"o":["preferr[ed]","pray[ed]","fix[ed]","enjoy[ed]"],"a":2,"ex":"<b>fixed<\/b> đọc /t/ vì chữ x đọc /ks/, âm cuối /s/ là âm vô thanh. preferred, prayed, enjoyed có âm cuối hữu thanh (/ɜː/, /eɪ/, /ɔɪ/) nên đọc /d/.","vi":"preferred: đã thích hơn · prayed: đã cầu nguyện · fixed: đã sửa · enjoyed: đã thích thú","id":"ed:7"},{"o":["milk[ed]","pick[ed]","cook[ed]","herd[ed]"],"a":3,"ex":"<b>herded<\/b> đọc /ɪd/ vì <i>herd<\/i> tận cùng âm /d/. milked, picked, cooked có âm cuối /k/ (âm vô thanh) nên đọc /t/. Lưu ý: <b>milked<\/b> /mɪlkt/ đọc /t/, không phải /d/.","vi":"milked: đã vắt sữa · picked: đã hái · cooked: đã nấu · herded: đã chăn (gia súc)","id":"ed:8"},{"o":["stay[ed]","dri[ed]","lov[ed]","help[ed]"],"a":3,"ex":"<b>helped<\/b> đọc /t/ vì âm cuối là /p/ (âm vô thanh). stayed, dried, loved có âm cuối /eɪ/, /aɪ/, /v/ (hữu thanh) nên đọc /d/.","vi":"stayed: đã ở lại · dried: đã phơi khô · loved: đã yêu thích · helped: đã giúp đỡ","id":"ed:9"},{"o":["want[ed]","unload[ed]","fold[ed]","stopp[ed]"],"a":3,"ex":"<b>stopped<\/b> đọc /t/ vì âm cuối là /p/. wanted, unloaded, folded tận cùng âm /t/ hoặc /d/ nên đọc /ɪd/.","vi":"wanted: đã muốn · unloaded: đã dỡ hàng · folded: đã gấp · stopped: đã dừng lại","id":"ed:10"},{"o":["hop[ed]","miss[ed]","us[ed]","look[ed]"],"a":2,"ex":"<b>used<\/b> /juːzd/ đọc /d/ vì chữ s đọc /z/ (hữu thanh). hoped (/p/), missed (/s/), looked (/k/) là âm vô thanh nên đọc /t/.","vi":"hoped: đã hy vọng · missed: đã nhớ; đã lỡ · used: đã dùng · looked: đã nhìn","id":"ed:11"}],"sound":[{"o":["f[oo]d","g[oo]d","sch[oo]l","m[oo]n"],"a":1,"ex":"<b>good<\/b> /ɡʊd/ đọc /ʊ/ (u ngắn) – một trong những từ \"oo\" đặc biệt cần nhớ (good, wood, foot, stood). food, school, moon đọc /uː/ (u dài).","vi":"food: thức ăn · good: tốt · school: trường học · moon: mặt trăng","id":"sound:0"},{"o":["b[oo]k","l[oo]k","c[oo]k","bamb[oo]"],"a":3,"ex":"<b>bamboo<\/b> /bæmˈbuː/ đọc /uː/. book, look, cook có \"oo\" đứng trước k nên đọc /ʊ/.","vi":"book: quyển sách · look: nhìn · cook: nấu ăn · bamboo: cây tre","id":"sound:1"},{"o":["p[u]sh","p[u]t","fl[u]te","b[u]lly"],"a":2,"ex":"<b>flute<\/b> /fluːt/ đọc /uː/ (dạng u_e). push, put, bully đọc /ʊ/ (u đứng sau p, b).","vi":"push: đẩy · put: đặt · flute: cây sáo · bully: bắt nạt","id":"sound:2"},{"o":["w[ou]ld","gr[ou]p","s[ou]p","y[ou]"],"a":0,"ex":"<b>would<\/b> /wʊd/ đọc /ʊ/ (giống could, should). group, soup, you đọc /uː/.","vi":"would: sẽ (quá khứ của will) · group: nhóm · soup: món súp · you: bạn","id":"sound:3"},{"o":["f[oo]t","f[oo]d","t[oo]l","r[u]le"],"a":0,"ex":"<b>foot<\/b> /fʊt/ đọc /ʊ/. food, tool, rule đọc /uː/. <i>(Câu 2 – Đề ôn tập tham khảo)<\/i>","vi":"foot: bàn chân · food: thức ăn · tool: dụng cụ · rule: quy tắc","id":"sound:4"},{"o":["c[u]shion","p[u]dding","s[u]gar","j[ui]ce"],"a":3,"ex":"<b>juice<\/b> /dʒuːs/ đọc /uː/. cushion /ˈkʊʃn/, pudding /ˈpʊdɪŋ/, sugar /ˈʃʊɡə/ đều đọc /ʊ/.","vi":"cushion: cái đệm · pudding: bánh pudding · sugar: đường · juice: nước ép","id":"sound:5"},{"o":["st[oo]d","w[oo]d","igl[oo]","f[oo]t"],"a":2,"ex":"<b>igloo<\/b> /ˈɪɡluː/ đọc /uː/. stood, wood, foot là các từ \"oo\" đặc biệt đọc /ʊ/.","vi":"stood: đã đứng · wood: gỗ · igloo: lều tuyết · foot: bàn chân","id":"sound:6"},{"o":["[c]ulture","[c]eremony","[c]ustom","[c]rop"],"a":1,"ex":"<b>ceremony<\/b> /ˈserəməni/: chữ c đứng trước e nên đọc /s/. culture, custom, crop có c đứng trước u, r nên đọc /k/.","vi":"culture: văn hóa · ceremony: nghi lễ · custom: phong tục · crop: vụ mùa, cây trồng","id":"sound:7"},{"o":["s[ch]ool","[ch]ase","[ch]aracter","te[ch]nology"],"a":1,"ex":"<b>chase<\/b> /tʃeɪs/: ch đọc /tʃ/ như thông thường. school, character, technology là từ gốc Hy Lạp, ch đọc /k/.","vi":"school: trường học · chase: đuổi theo · character: nhân vật; tính tume"],"a":2,"ex":"<b>reˈlax<\/b> là động từ → nhấn âm 2. ˈvillage, ˈharvest, ˈcostume là danh từ → nhấn âm 1. <i>(Câu 3 – Đề ôn tập tham khảo)<\/i>","vi":"village: ngôi làng · harvest: vụ mùa · relax: thư giãn · costume: trang phục","id":"s2:6"},{"o":["bamboo","resort","balloon","muscle"],"a":3,"ex":"<b>ˈmuscle<\/b> là danh từ 2 âm tiết → nhấn âm 1. bamˈboo, reˈsort, baˈlloon là các ngoại lệ nhấn âm 2 (-oo, -oon nhận trọng âm).","vi":"bamboo: cây tre · resort: khu nghỉ dưỡng · balloon: bóng bay · muscle: cơ bắp","id":"s2:7"},{"o":["gather","visit","follow","admire"],"a":3,"ex":"<b>adˈmire<\/b> là động từ 2 âm tiết theo quy tắc → nhấn âm 2. ˈgather, ˈvisit, ˈfollow là các động từ ngoại lệ nhấn âm 1.","vi":"gather: tụ họp · visit: thăm · follow: theo · admire: ngắm, ngưỡng mộ","id":"s2:8"},{"o":["revive","obey","prepare","offer"],"a":3,"ex":"<b>ˈoffer<\/b> là động từ ngoại lệ → nhấn âm 1. reˈvive, oˈbey, preˈpare là động từ 2 âm tiết → nhấn âm 2.","vi":"revive: làm sống lại · obey: vâng lời · prepare: chuẩn bị · offer: đưa ra, mời","id":"s2:9"},{"o":["highland","livestock","website","invite"],"a":3,"ex":"<b>inˈvite<\/b> là động từ → nhấn âm 2. ˈhighland, ˈlivestock, ˈwebsite là danh từ ghép → nhấn âm 1.","vi":"highland: vùng cao · livestock: gia súc · website: trang web · invite: mời","id":"s2:10"}],"s3":[{"o":["tradition","decorate","collection","connected"],"a":1,"ex":"<b>ˈdecorate<\/b>: từ 3 âm tiết tận cùng -ate → nhấn âm 1. traˈdition, colˈlection (-tion nhấn âm ngay trước), conˈnected → nhấn âm 2.","vi":"tradition: truyền thống · decorate: trang trí · collection: bộ sưu tập · connected: được kết nối","id":"s3:0"},{"o":["picturesque","Vietnamese","volunteer","festival"],"a":3,"ex":"<b>ˈfestival<\/b> → nhấn âm 1. pictuˈresque, Vietnaˈmese, volunˈteer có hậu tố -esque, -ese, -eer nhận trọng âm → nhấn âm 3.","vi":"picturesque: đẹp như tranh · Vietnamese: người/tiếng Việt · volunteer: tình nguyện viên · festival: lễ hội","id":"s3:1"},{"o":["cultivate","concentrate","entertain","decorate"],"a":2,"ex":"<b>enterˈtain<\/b>: động từ tận cùng -ain → nhấn âm cuối (âm 3). ˈcultivate, ˈconcentrate, ˈdecorate (-ate) → nhấn âm 1.","vi":"cultivate: trồng trọt · concentrate: tập trung · entertain: giải trí · decorate: trang trí","id":"s3:2"},{"o":["minority","ceremony","activity","traditional"],"a":1,"ex":"<b>ˈceremony<\/b> → nhấn âm 1. miˈnority, acˈtivity (-ity), traˈditional (-al giữ trọng âm của tradition) → nhấn âm 2.","vi":"minority: thiểu số · ceremony: nghi lễ · activity: hoạt động · traditional: truyền thống","id":"s3:3"},{"o":["development","entertainment","environment","experience"],"a":1,"ex":"<b>enterˈtainment<\/b> → nhấn âm 3 (giữ trọng âm của entertain). deˈvelopment, enˈvironment, exˈperience → nhấn âm 2.","vi":"development: sự phát triển · entertainment: sự giải trí · environment: môi trường · experience: kinh nghiệm","id":"s3:4"},{"o":["overlook","lighthouse","staircase","farmhouse"],"a":0,"ex":"<b>overˈlook<\/b> là động từ ghép → nhấn phần sau (âm 3). ˈlighthouse, ˈstaircase, ˈfarmhouse là danh từ ghép → nhấn âm 1.","vi":"overlook: nhìn ra · lighthouse: ngọn hải đăng · staircase: cầu thang · farmhouse: nhà ở trang trại","id":"s3:5"},{"o":["tradition","important","decorate","collector"],"a":2,"ex":"<b>ˈdecorate<\/b> → nhấn âm 1. traˈdition, imˈportant, colˈlector → nhấn âm 2. <i>(Câu 4 – Đề ôn tập tham khảo)<\/i>","vi":"tradition: truyền thống · important: quan trọng · decorate: trang trí · collector: người sưu tầm","id":"s3:6"},{"o":["popular","celebrate","family","community"],"a":3,"ex":"<b>comˈmunity<\/b> có hậu tố -ity → nhấn âm ngay trước hậu tố (âm 2). ˈpopular, ˈcelebrate (-ate), ˈfamily (-y) → nhấn âm 1.","vi":"popular: phổ biến · celebrate: tổ chức mừng · family: gia đình · community: cộng đồng","id":"s3:7"},{"o":["diversity","technology","participate","ancestor"],"a":3,"ex":"<b>ˈancestor<\/b> → nhấn âm 1. diˈversity (-ity), techˈnology (-logy), parˈticipate (-ate, âm thứ 3 từ cuối lên) → nhấn âm 2.","vi":"diversity: sự đa dạng · technology: công nghệ · participate: tham gia · ancestor: tổ tiên","id":"s3:8"},{"o":["engineer","employee","Japanese","cultural"],"a":3,"ex":"<b>ˈcultural<\/b> → nhấn âm 1 (-al giữ trọng âm của ˈculture). engiˈneer, emploˈyee, Japaˈnese có hậu tố -eer, -ee, -ese nhận trọng âm → nhấn âm 3.","vi":"engineer: kĩ sư · employee: nhân viên · Japanese: người/tiếng Nhật · cultural: thuộc văn hóa","id":"s3:9"}],"vocab":[{"o":["knit","message","surf","fold"],"a":2,"ex":"<b>surf the net<\/b> = lướt mạng. Các từ khác: knit (đan), message (nhắn tin), fold (gấp) không đi với \"the net\".","vi":"Thanh thiếu niên thường lướt mạng để tìm thông tin cho các dự án của mình.","q":"Teenagers often ______ the net to look for information for their projects.","u":"u12","id":"vocab:0"},{"o":["load","herd","dry","milk"],"a":1,"ex":"<b>herd the buffaloes<\/b> = chăn trâu, lùa trâu. load: chất hàng; dry: phơi khô; milk: vắt sữa.","vi":"Ở nông thôn, các bạn nam thường lùa trâu ra đồng sau giờ học.","q":"In the countryside, boys often ______ the buffaloes to the fields after school.","u":"u12","id":"vocab:1"},{"o":["lighthouse","combine harvester","paddy field","ferry"],"a":1,"ex":"<b>combine harvester<\/b> = máy gặt đập liên hợp (vừa cắt vừa thu gom lúa). lighthouse: hải đăng; paddy field: cánh đồng lúa; ferry: phà.","vi":"Vào mùa gặt, nông dân dùng máy gặt đập liên hợp để cắt và thu gom lúa nhanh chóng.","q":"At harvest time, farmers use a ______ to cut and collect rice quickly.","u":"u12","id":"vocab:2"},{"o":["hospitable","well-trained","noisy","picturesque"],"a":3,"ex":"<b>picturesque<\/b> = đẹp như tranh, dùng để tả cảnh vật. hospitable (hiếu khách) và well-trained (lành nghề) dùng cho người; noisy (ồn ào) trái nghĩa với cảnh được tả.","vi":"Làng tôi rất đẹp như tranh với những cánh đồng lúa xanh, dòng sông uốn khúc và những bụi tre già.","q":"My village is very ______ with green rice fields, a winding river and old bamboo trees.","u":"u12","id":"vocab:3"},{"o":["kites","cattle","crops","ferries"],"a":0,"ex":"<b>fly kites<\/b> = thả diều. cattle: gia súc; crops: cây trồng; ferries: phà. <i>(Câu 5 – Đề ôn tập tham khảo)<\/i>","vi":"Ở nông thôn, trẻ em thường thả diều trên những cánh đồng rộng.","q":"In the countryside, children often fly ______ in the open fields.","u":"u12","id":"vocab:4"},{"o":["media","forum","peer","account"],"a":2,"ex":"<b>peer pressure<\/b> = áp lực từ bạn bè đồng trang lứa (muốn giống bạn bè). media: truyền thông; forum: diễn đàn; account: tài khoản.","vi":"Nhiều học sinh cảm thấy căng thẳng vì áp lực đồng trang lứa – các em muốn giống bạn bè mình.","q":"Many students feel stressed because of ______ pressure – they want to be like their friends.","u":"u3","id":"vocab:5"},{"o":["upload","browse","connect","concentrate"],"a":3,"ex":"<b>concentrate on<\/b> = tập trung vào. upload: tải lên; browse: lướt xem; connect: kết nối (connect with).","vi":"Ba không thể tập trung làm bài tập về nhà vì điện thoại liên tục hiện thông báo.","q":"Ba can't ______ on his homework because his phone keeps showing notifications.","u":"u3","id":"vocab:6"},{"o":["keen","fond","addicted","interested"],"a":2,"ex":"<b>become addicted to<\/b> = trở nên nghiện. Các từ khác đi với giới từ khác: keen <u>on<\/u>, fond <u>of<\/u>, interested <u>in<\/u> – không đi với \"to\". <i>(Câu 6 – Đề tham khảo)<\/i>","vi":"Những thanh thiếu niên dành quá nhiều thời gian cho mạng xã hội có thể bị nghiện nó.","q":"Teenagers who spend too much time on social media may become ______ to it.","u":"u3","id":"vocab:7"},{"o":["pressure","forum","notification","session"],"a":0,"ex":"<b>be under (a lot of) pressure<\/b> = chịu (nhiều) áp lực. forum: diễn đàn; notification: thông báo; session: buổi, phiên. <i>(Câu 10 – Đề tham khảo)<\/i>","vi":"Lan đang chịu nhiều áp lực vì tuần tới bạn ấy có ba bài kiểm tra.","q":"Lan is under a lot of ______ because she has three tests next week.","u":"u3","id":"vocab:8"},{"o":["stilt","terraced","flute","gong"],"a":0,"ex":"<b>stilt house<\/b> = nhà sàn. terraced đi với fields (ruộng bậc thang); flute: sáo; gong: cồng chiêng.","vi":"Người Ê Đê sống trong những ngôi nhà sàn dài làm bằng gỗ và tre.","q":"The Ede people live in long ______ houses made of wood and bamboo.","u":"u4","id":"vocab:9"},{"o":["grow","raise","weave","overlook"],"a":1,"ex":"<b>raise livestock<\/b> = chăn nuôi gia súc. grow: trồng (cây); weave: dệt; overlook: nhìn ra.","vi":"Người dân tộc thiểu số ở vùng núi thường chăn nuôi gia súc như dê, lợn và gà.","q":"Ethnic minority people in the mountains often ______ livestock such as goats, pigs and chickens.","u":"u4","id":"vocab:10"},{"o":["folk","ethnic","minority","communal"],"a":1,"ex":"<b>ethnic groups<\/b> = các dân tộc. folk: dân gian; minority: thiểu số; communal: thuộc cộng đồng. <i>(Câu 7 – Đề tham khảo)<\/i>","vi":"Việt Nam có 54 dân tộc sinh sống trên khắp cả nước.","q":"Viet Nam has 54 ______ groups living throughout the country.","u":"u4","id":"vocab:11"},{"o":["terraced","stilt","communal","open-air"],"a":0,"ex":"<b>terraced fields<\/b> = ruộng bậc thang, làm trên sườn núi. stilt đi với house; communal đi với house; open-air đi với market.","vi":"Người Hmông trồng lúa trên ruộng bậc thang ở sườn núi.","q":"The Hmong people grow rice on ______ fields on the mountainsides.","u":"u4","id":"vocab:12"},{"o":["open-air","communal","folk","terraced"],"a":0,"ex":"<b>open-air market<\/b> = chợ ngoài trời, chợ phiên (như chợ phiên Bắc Hà).","vi":"Nhiều du khách đến chợ phiên Bắc Hà để mua túi thổ cẩm.","q":"Many tourists visit the ______ market in Bac Ha to buy brocade bags.","u":"u4","id":"vocab:13"},{"o":["bad luck","offering","longevity","monk"],"a":2,"ex":"<b>longevity<\/b> = sự trường thọ, sống lâu – lời chúc dành cho ông bà. bad luck: xui xẻo; offering: lễ vật; monk: nhà sư.","vi":"Vào mùng một Tết, trẻ em chúc ông bà mạnh khỏe và sống lâu.","q":"On the first day of Tet, children wish their grandparents good health and ______.","u":"u5","id":"vocab:14"},{"o":["chase","release","hang","admire"],"a":1,"ex":"<b>release carps<\/b> = thả cá chép (ngày 23 tháng Chạp, tiễn Ông Công Ông Táo). chase: đuổi; hang: treo; admire: ngắm.","vi":"Vào ngày 23 tháng Chạp, người ta thả cá chép để tiễn Ông Công Ông Táo về trời.","q":"On the 23rd day of the last lunar month, people ______ carps to send the Kitchen Gods to Heaven.","u":"u5","id":"vocab:15"},{"o":["take place","look after","take off","chase away"],"a":3,"ex":"<b>chase away bad spirits<\/b> = xua đuổi tà ma. take place: diễn ra; look after: chăm sóc; take off: cởi ra, cất cánh.","vi":"Người ta tin rằng múa lân có thể xua đuổi tà ma.","q":"People believe that the lion dance can ______ bad spirits.","u":"u5","id":"vocab:16"},{"o":["reunion","manner","ceremony","decoration"],"a":0,"ex":"<b>family reunion<\/b> = sự đoàn tụ gia đình. manner: cách thức; ceremony: nghi lễ; decoration: đồ trang trí.","vi":"Tết là dịp đoàn tụ gia đình; mọi người từ khắp nơi trở về nhà.","q":"Tet is a time for family ______; people return home from everywhere.","u":"u5","id":"vocab:17"},{"o":["carps","monks","offerings","lanterns"],"a":3,"ex":"<b>hang lanterns<\/b> = treo đèn lồng. carps: cá chép; monks: nhà sư; offerings: lễ vật. <i>(Câu 8 – Đề tham khảo)<\/i>","vi":"Mọi người treo đèn lồng đỏ trước nhà trong dịp Tết Trung thu.","q":"People hang red ______ in front of their houses during the Mid-Autumn Festival.","u":"u5","id":"vocab:18"},{"o":["pray","release","admire","place"],"a":1,"ex":"<b>release carps<\/b> = thả cá chép. pray: cầu nguyện; admire: ngắm nhìn; place: đặt. <i>(Câu 9 – Đề tham khảo)<\/i>","vi":"Vào ngày 23 tháng Chạp, người ta thả cá chép xuống sông, hồ.","q":"On the 23rd day of the twelfth lunar month, people ______ carps into rivers and lakes.","u":"u5","id":"vocab:19"},{"o":["knitting","origami","puzzle","kite"],"a":0,"ex":"<b>knitting kit<\/b> = bộ dụng cụ đan len. Đan khăn (make a scarf) cần bộ đồ đan len.","vi":"Chị tôi đã mua một bộ dụng cụ đan len để đan khăn tặng bà.","q":"My sister bought a ______ kit to make a scarf for our grandma.","u":"u12","id":"vocab:20"},{"o":["puzzles","crafts","messages","kites"],"a":0,"ex":"<b>do (jigsaw) puzzles<\/b> = chơi xếp hình, giải đố. crafts đi với make; messages, kites không đi với \"jigsaw\".","vi":"Chơi xếp hình giúp tôi thư giãn và rèn luyện trí não.","q":"Doing jigsaw ______ helps me relax and train my brain.","u":"u12","id":"vocab:21"},{"o":["common","general","total","same"],"a":0,"ex":"<b>have sth in common<\/b> = có điểm chung.","vi":"Lan và tôi có nhiều điểm chung: cả hai đều thích đọc sách và đạp xe.","q":"Lan and I have a lot in ______: we both love reading and cycling.","u":"u12","id":"vocab:22"},{"o":["activity","pressure","harvest","custom"],"a":0,"ex":"<b>leisure activity<\/b> = hoạt động giải trí. pressure: áp lực; harvest: vụ mùa; custom: phong tục.","vi":"Đạp xe là một hoạt động giải trí tốt vì nó giúp bạn khỏe mạnh.","q":"Cycling is a good leisure ______ because it keeps you fit.","u":"u12","id":"vocab:23"},{"o":["orchard","paddy field","lighthouse","pagoda"],"a":0,"ex":"<b>orchard<\/b> = vườn cây ăn quả (có cây xoài, cây nhãn). paddy field: ruộng lúa; lighthouse: hải đăng; pagoda: chùa.","vi":"Nhà ông bà tôi nằm cạnh một vườn cây ăn quả rộng đầy cây xoài và cây nhãn.","q":"My grandparents' house is next to a large ______ full of mango and longan trees.","u":"u12","id":"vocab:24"},{"o":["milk","herd","load","plough"],"a":0,"ex":"Sau đó bán <i>sữa tươi<\/i> → phải <b>milk the cows<\/b> = vắt sữa bò. herd: chăn; load: chất hàng; plough: cày.","vi":"Chú Ba dậy lúc 5 giờ sáng để vắt sữa bò, rồi chú mang sữa tươi ra chợ bán.","q":"Uncle Ba gets up at 5 a.m. to ______ the cows, then he sells the fresh milk at the market.","u":"u12","id":"vocab:25"},{"o":["hospitable","picturesque","vast","boring"],"a":0,"ex":"Luôn chào đón người lạ vào nhà → <b>hospitable<\/b> = hiếu khách. picturesque (đẹp như tranh) và vast (rộng lớn) dùng cho cảnh vật, không dùng cho người.","vi":"Người dân làng tôi rất hiếu khách; họ luôn chào đón người lạ vào nhà.","q":"The people in my village are very ______; they always welcome strangers into their homes.","u":"u12","id":"vocab:26"},{"o":["vast","narrow","noisy","crowded"],"a":0,"ex":"Cánh đồng trải dài tới chân trời → <b>vast<\/b> = rộng lớn, bao la.","vi":"Từ đỉnh đồi, chúng tôi có thể nhìn thấy những cánh đồng lúa bao la trải dài tới chân trời.","q":"From the top of the hill, we could see the ______ rice fields stretching to the horizon.","u":"u12","id":"vocab:27"},{"o":["pace","speed","time","way"],"a":0,"ex":"Cụm cố định <b>pace of life<\/b> = nhịp sống.","vi":"Nhịp sống ở nông thôn chậm hơn ở thành phố.","q":"The ______ of life in the countryside is slower than in the city.","u":"u12","id":"vocab:28"},{"o":["upload","log","bully","browse"],"a":0,"ex":"<b>upload photos<\/b> = tải ảnh lên (trang web). log (on): đăng nhập; bully: bắt nạt; browse: lướt xem.","vi":"Nhớ tải ảnh của em lên trang web của lớp trước thứ Sáu nhé.","q":"Remember to ______ your photos to the class website before Friday.","u":"u3","id":"vocab:29"},{"o":["Cyberbullying","Peer pressure","Notification","Forum"],"a":0,"ex":"Dùng Internet để làm tổn thương, đe dọa người khác → <b>cyberbullying<\/b> = bắt nạt trên mạng.","vi":"Bắt nạt trên mạng là khi ai đó dùng Internet để làm tổn thương hoặc đe dọa người khác.","q":"______ is when someone uses the Internet to hurt or frighten another person.","u":"u3","id":"vocab:30"},{"o":["forum","account","password","midterm"],"a":0,"ex":"Tham gia để thảo luận → <b>online forum<\/b> = diễn đàn trực tuyến. account: tài khoản; password: mật khẩu; midterm: bài kiểm tra giữa kì.","vi":"Mai đã tham gia một diễn đàn trực tuyến để thảo luận dự án khoa học với các bạn khác.","q":"Mai joined an online ______ to discuss the science project with other students.","u":"u3","id":"vocab:31"},{"o":["self-aware","stressful","bored","addicted"],"a":0,"ex":"Hiểu cảm xúc và điểm mạnh của bản thân → <b>self-aware<\/b> = có khả năng tự nhận thức.","vi":"Thanh thiếu niên nên biết tự nhận thức: các em nên hiểu cảm xúc và điểm mạnh của chính mình.","q":"Teenagers should be ______: they should understand their own feelings and strengths.","u":"u3","id":"vocab:32"},{"o":["notifications","forums","accounts","pressures"],"a":0,"ex":"Tắt khi làm bài để không bị làm phiền → <b>notifications<\/b> = thông báo (trên điện thoại).","vi":"Tôi luôn tắt thông báo trên điện thoại khi làm bài tập về nhà.","q":"I always switch off ______ on my phone when I do my homework.","u":"u3","id":"vocab:33"},{"o":["communal","terraced","folk","floating"],"a":0,"ex":"Nơi họp và tổ chức lễ hội của cả làng → <b>communal house<\/b> = nhà rông, nhà sinh hoạt cộng đồng.","vi":"Mỗi làng của người Ba Na đều có một nhà rông, nơi mọi người họp và tổ chức lễ hội.","q":"Every Ba Na village has a ______ house where people hold meetings and festivals.","u":"u4","id":"vocab:34"},{"o":["weave","raise","herd","overlook"],"a":0,"ex":"<b>weave cloth<\/b> = dệt vải. raise: nuôi; herd: chăn; overlook: nhìn ra.","vi":"Phụ nữ người Dao dệt vải để may những bộ trang phục sặc sỡ cho gia đình.","q":"Dao women ______ cloth to make colourful costumes for their families.","u":"u4","id":"vocab:35"},{"o":["overlooks","weaves","raises","grows"],"a":0,"ex":"<b>overlook<\/b> = nhìn ra, hướng ra (cảnh gì). Khách sạn \"nhìn ra\" thung lũng.","vi":"Khách sạn của chúng tôi ở Sa Pa nhìn ra thung lũng Mường Hoa xinh đẹp.","q":"Our hotel in Sa Pa ______ the beautiful Muong Hoa Valley.","u":"u4","id":"vocab:36"},{"o":["folk","stilt","communal","terraced"],"a":0,"ex":"<b>folk dance<\/b> = điệu múa dân gian. stilt (house): nhà sàn; communal (house): nhà rông; terraced (fields): ruộng bậc thang.","vi":"Thanh niên trong làng học điệu múa dân gian từ ông bà.","q":"Young people in the village learn the ______ dance from their grandparents.","u":"u4","id":"vocab:37"},{"o":["worship","release","chase","admire"],"a":0,"ex":"<b>worship ancestors<\/b> = thờ cúng tổ tiên.","vi":"Người Việt thờ cúng tổ tiên trong những ngày đầu năm mới.","q":"Vietnamese people ______ their ancestors on the first days of Tet.","u":"u5","id":"vocab:38"},{"o":["kumquat","coconut","rubber","pine"],"a":0,"ex":"Ngày Tết, nhiều gia đình bày <b>cây quất (kumquat tree)<\/b> – biểu tượng của sự sung túc.","vi":"Nhiều gia đình đặt một cây quất trong phòng khách như biểu tượng của sự giàu có vào dịp Tết.","q":"Many families put a ______ tree in their living room as a symbol of wealth at Tet.","u":"u5","id":"vocab:39"},{"o":["lucky","luck","good","happy"],"a":0,"ex":"<b>lucky money<\/b> = tiền lì xì (đựng trong phong bao đỏ).","vi":"Trẻ em nhận tiền lì xì trong phong bao đỏ vào dịp Tết.","q":"Children receive ______ money in red envelopes at Tet.","u":"u5","id":"vocab:40"},{"o":["manners","customs","rules","habits"],"a":0,"ex":"Cụm cố định <b>table manners<\/b> = phép tắc khi ăn uống.","vi":"Vừa nói chuyện vừa ngậm thức ăn là thiếu phép lịch sự khi ăn uống.","q":"It is bad table ______ to talk with food in your mouth.","u":"u5","id":"vocab:41"},{"o":["takes place","takes part","takes off","takes care"],"a":0,"ex":"<b>take place<\/b> = diễn ra. take part: tham gia; take off: cởi ra, cất cánh; take care: chăm sóc.","vi":"Lễ hội Đền Hùng diễn ra vào ngày mùng 10 tháng 3 âm lịch.","q":"The Hung King Temple Festival ______ on the 10th day of the third lunar month.","u":"u5","id":"vocab:42"}],"gram":[{"o":["doing","do","to doing","does"],"a":0,"ex":"<b>like + V-ing<\/b> (hoặc like + to V). \"to doing\" sai cấu trúc; do / does không đứng ngay sau like.","vi":"Vào thời gian rảnh, Mai thích làm các món đồ tự làm (DIY) như làm hoa giấy.","q":"In her free time, Mai likes ______ DIY projects like making paper flowers.","id":"gram:0"},{"o":["get","to get","getting","got"],"a":2,"ex":"<b>don't / doesn't mind + V-ing<\/b> = không ngại làm gì.","vi":"Ông tôi không ngại dậy sớm để tưới cây.","q":"My grandfather doesn't mind ______ up early to water the plants.","id":"gram:1"},{"o":["play","to play","playing","plays"],"a":2,"ex":"<b>enjoy + V-ing<\/b> = thích làm gì. Không dùng enjoy + to V. <i>(Câu 11 – Đề tham khảo)<\/i>","vi":"Em trai tôi thích chơi với những viên gạch Lego.","q":"My little brother enjoys ______ with Lego bricks.","id":"gram:2"},{"o":["hard","harder","more hard","more hardly"],"a":1,"ex":"Có <b>than<\/b> → so sánh hơn. <i>hard<\/i> là trạng từ ngắn → <b>harder<\/b>. Chú ý: hardly nghĩa là \"hầu như không\", không phải trạng từ của hard.","vi":"Lan học chăm chỉ hơn anh trai, vì vậy bạn ấy luôn được điểm cao hơn.","q":"Lan studies ______ than her brother, so she always gets better marks.","id":"gram:3"},{"o":["more busily","busier","more busy","busily"],"a":0,"ex":"Cần <b>trạng từ<\/b> bổ nghĩa cho động từ <i>live<\/i>: busily là trạng từ dài (đuôi -ly) → <b>more busily<\/b> than. busier / more busy là tính từ.","vi":"Người thành phố dường như sống bận rộn hơn người ở nông thôn.","q":"City people seem to live ______ than people in the countryside.","id":"gram:4"},{"o":["good","well","better","more well"],"a":2,"ex":"Có <b>than<\/b> → so sánh hơn. Trạng từ well (giỏi) có dạng so sánh bất quy tắc <b>better<\/b>. good là tính từ; \"more well\" sai.","vi":"Nam nói tiếng Anh giỏi hơn bất kì học sinh nào khác trong lớp tôi.","q":"Nam speaks English ______ than any other student in my class.","id":"gram:5"},{"o":["What","Where","Who","Why"],"a":0,"ex":"Câu trả lời là một vật (trang phục) → hỏi bằng <b>What<\/b> (cái gì).","vi":"Người Hmông thường mặc gì vào những dịp đặc biệt? – Những bộ trang phục sặc sỡ.","q":"______ do the Hmong people usually wear on special occasions? – Colourful costumes.","id":"gram:6"},{"o":["How long","How far","How often","How much"],"a":1,"ex":"Câu trả lời là khoảng cách (320 km) → <b>How far<\/b> (bao xa). How long: bao lâu; How often: bao lâu một lần; How much: bao nhiêu (giá, lượng không đếm được).","vi":"Từ Hà Nội đến Sa Pa bao xa? – Khoảng 320 ki-lô-mét.","q":"______ is it from Ha Noi to Sa Pa? – About 320 kilometres.","id":"gram:7"},{"o":["much","many","a few","few"],"a":0,"ex":"<b>rice<\/b> là danh từ không đếm được → dùng <b>much<\/b>. many, a few, few dùng với danh từ đếm được số nhiều.","vi":"Chúng ta không còn nhiều gạo. Hãy mua thêm một ít nhé.","q":"We don't have ______ rice left. Let's buy some more.","id":"gram:8"},{"o":["A","An","The","Ø"],"a":2,"ex":"Trước <b>tên sông<\/b> dùng mạo từ <b>the<\/b>: the Mekong River, the Red River.","vi":"Sông Mê Kông chảy qua sáu quốc gia.","q":"______ Mekong River flows through six countries.","id":"gram:9"},{"o":["a – the","an – the","an – a","the – an"],"a":1,"ex":"<b>an<\/b> + engineer (bắt đầu bằng nguyên âm /e/); <b>the<\/b> city centre (trung tâm thành phố – nơi đã xác định).","vi":"Anh họ tôi là kĩ sư và anh ấy làm việc ở trung tâm thành phố.","q":"My cousin is ______ engineer, and he works in ______ city centre.","id":"gram:10"},{"o":["rains","will rain","rained","raining"],"a":0,"ex":"<b>Câu điều kiện loại 1<\/b>: If + S + V hiện tại đơn, S + will + V. Mệnh đề If <u>không<\/u> dùng will → <b>rains<\/b>.","vi":"Nếu ngày mai trời mưa, chúng tôi sẽ ở nhà.","q":"If it ______ tomorrow, we will stay at home.","id":"gram:11"},{"o":["to go","going","go","went"],"a":0,"ex":"<b>would like + to V<\/b> = muốn làm gì (lịch sự).","vi":"Chủ nhật này bạn có muốn đi bảo tàng với chúng tôi không?","q":"Would you like ______ to the museum with us this Sunday?","id":"gram:12"},{"o":["How many","How much","How often","How long"],"a":0,"ex":"Hỏi số lượng danh từ <b>đếm được<\/b> số nhiều (groups) → <b>How many<\/b>.","vi":"Việt Nam có bao nhiêu dân tộc? – Năm mươi tư.","q":"______ ethnic groups are there in Viet Nam? – Fifty-four.","id":"gram:13"},{"o":["a few","much","a little","little"],"a":0,"ex":"\"students\" là danh từ đếm được số nhiều → <b>a few<\/b> (một vài). much, a little, little dùng với danh từ không đếm được.","vi":"Chỉ có vài học sinh trong thư viện vì hôm nay là Chủ nhật.","q":"There are only ______ students in the library because it's Sunday.","id":"gram:14"},{"o":["will","are","do","did"],"a":0,"ex":"Có \"next week\" (tuần tới) → thì <b>tương lai đơn: will + V<\/b>.","vi":"Tôi và các bạn sẽ đi thăm Bảo tàng Dân tộc học vào tuần tới.","q":"My friends and I ______ visit the Museum of Ethnology next week.","id":"gram:15"},{"o":["getting","get","got","gets"],"a":0,"ex":"<b>hate + V-ing<\/b> (hoặc hate + to V) = ghét làm gì. Chỉ \"getting\" đúng trong các đáp án.","vi":"Anh trai tôi ghét dậy sớm vào cuối tuần.","q":"My brother hates ______ up early at the weekend.","id":"gram:16"},{"o":["more beautifully","beautifuller","more beautiful","beautifully"],"a":0,"ex":"Bổ nghĩa cho động từ <b>sings<\/b> → cần trạng từ; beautifully là trạng từ dài → so sánh hơn: <b>more beautifully<\/b> than.","vi":"Hoa hát hay hơn tất cả các bạn nữ khác trong lớp.","q":"Hoa sings ______ than all the other girls in our class.","id":"gram:17"}],"conj":[{"o":["therefore","however","so","because"],"a":1,"ex":"Hai vế <b>trái ngược<\/b> (mưa to – lễ hội vẫn diễn ra), đứng sau dấu chấm phẩy → <b>however<\/b> (tuy nhiên).","vi":"Trời mưa to; tuy nhiên, lễ hội vẫn diễn ra.","q":"It rained heavily; ______, the festival still took place.","id":"conj:0"},{"o":["but","so","or","for"],"a":1,"ex":"Vế 2 là <b>kết quả<\/b> của vế 1 (mệt → đi ngủ sớm) → <b>so<\/b> (vì vậy).","vi":"Hoa cảm thấy rất mệt, vì vậy bạn ấy đi ngủ sớm.","q":"Hoa felt very tired, ______ she went to bed early.","id":"conj:1"},{"o":["however","therefore","otherwise","moreover"],"a":2,"ex":"<b>otherwise<\/b> = nếu không thì (nếu không tắt điện thoại thì sẽ không tập trung được).","vi":"Em nên tắt điện thoại trong giờ học; nếu không, em sẽ không tập trung vào bài học được.","q":"You should switch off your phone in class; ______, you won't concentrate on the lesson.","id":"conj:2"},{"o":["therefore","however","so","because"],"a":1,"ex":"Hai vế trái ngược (muốn mua – không đủ tiền), sau dấu chấm phẩy → <b>however<\/b>. <i>(Câu 12 – Đề tham khảo)<\/i>","vi":"Ba muốn mua một chiếc máy tính xách tay mới; tuy nhiên, bạn ấy không có đủ tiền.","q":"Ba wanted to buy a new laptop; ______, he didn't have enough money.","id":"conj:3"},{"o":["Although","Despite","Because","So"],"a":1,"ex":"Sau chỗ trống là <b>cụm danh từ<\/b> (the heavy rain) và hai vế trái ngược → <b>Despite<\/b> (mặc dù). Although phải đi với mệnh đề (S + V).","vi":"Mặc dù trời mưa to, những người nông dân vẫn làm việc trên cánh đồng.","q":"______ the heavy rain, the farmers still worked in the field.","id":"conj:4"},{"o":["because","so","but","because of"],"a":0,"ex":"Vế sau là <b>lý do<\/b> và là một mệnh đề (it was…) → <b>because<\/b>. because of chỉ đi với danh từ / V-ing.","vi":"Chúng tôi ở nhà vì trời rất lạnh.","q":"We stayed at home ______ it was very cold.","id":"conj:5"},{"o":["but","so","or","for"],"a":0,"ex":"Hai vế trái ngược nhau (tôi thích ra ngoài – anh tôi thích ở nhà) → <b>but<\/b> (nhưng).","vi":"Tôi thích các hoạt động ngoài trời, nhưng anh tôi thích ở nhà hơn.","q":"I love outdoor activities, ______ my brother prefers staying at home.","id":"conj:6"},{"o":["or","so","but","for"],"a":0,"ex":"Đưa ra 2 lựa chọn (đi xe buýt – đạp xe) → <b>or<\/b> (hoặc).","vi":"Chúng ta có thể đi xe buýt tới làng nghề, hoặc chúng ta có thể đạp xe tới đó.","q":"We can go to the craft village by bus, ______ we can cycle there.","id":"conj:7"},{"o":["therefore","however","otherwise","although"],"a":0,"ex":"Vế 1 là nguyên nhân, vế 2 là kết quả; sau dấu chấm phẩy → <b>therefore<\/b> (do đó).","vi":"Thời tiết rất xấu; do đó, chuyến đi thuyền đã bị hủy.","q":"The weather was very bad; ______, the boat trip was cancelled.","id":"conj:8"},{"o":["Although","Because","So","However"],"a":0,"ex":"Hai vế tương phản (trời mưa – vẫn đi lễ hội), sau chỗ trống là mệnh đề → <b>Although<\/b> (mặc dù). However phải có dấu phẩy và đứng sau dấu chấm/chấm phẩy.","vi":"Mặc dù trời mưa, dân làng vẫn đi trẩy hội.","q":"______ it was raining, the villagers still went to the festival.","id":"conj:9"},{"o":["moreover","otherwise","however","so"],"a":0,"ex":"Vế 2 bổ sung thêm một lợi ích → <b>moreover<\/b> (hơn nữa).","vi":"Tự làm đồ rất vui; hơn nữa, nó còn giúp bạn tiết kiệm tiền.","q":"DIY is fun; ______, it helps you save money.","id":"conj:10"}],"prep":[{"o":["at","on","for","with"],"a":1,"ex":"<b>log on to<\/b> = đăng nhập vào (tài khoản, trang web).","vi":"Bạn cần mật khẩu để đăng nhập vào tài khoản của trường.","q":"You need a password to log ______ to your school account.","id":"prep:0"},{"o":["on","about","in","at"],"a":1,"ex":"<b>be crazy about<\/b> = mê, phát cuồng vì.","vi":"Chị gái tôi mê chụp ảnh hoa.","q":"My sister is crazy ______ taking photos of flowers.","id":"prep:1"},{"o":["for","with","of","at"],"a":0,"ex":"<b>be famous for<\/b> = nổi tiếng về.","vi":"Làng Đường Lâm nổi tiếng với những ngôi nhà cổ bằng đá ong.","q":"Duong Lam Village is famous ______ its ancient laterite houses.","id":"prep:2"},{"o":["in","at","on","for"],"a":2,"ex":"<b>on<\/b> + ngày cụ thể (on the 15th day, on Monday).","vi":"Tết Trung thu diễn ra vào ngày 15 tháng 8 âm lịch.","q":"The Mid-Autumn Festival takes place ______ the 15th day of the 8th lunar month.","id":"prep:3"},{"o":["on","at","in","for"],"a":1,"ex":"<b>be good at<\/b> = giỏi về. <i>(Câu 13 – Đề tham khảo)<\/i>","vi":"Bà tôi giỏi làm các loại bánh truyền thống.","q":"My grandmother is good ______ making traditional cakes.","id":"prep:4"},{"o":["on","in","at","about"],"a":1,"ex":"<b>be interested in<\/b> = quan tâm, thích thú.","vi":"Lan thích tìm hiểu về văn hóa của các dân tộc.","q":"Lan is interested ______ learning about the cultures of ethnic groups.","id":"prep:5"},{"o":["in","on","at","for"],"a":2,"ex":"<b>at Tet<\/b> = vào dịp Tết (giống at Christmas, at the weekend).","vi":"Chúng tôi thường về thăm ông bà vào dịp Tết.","q":"We usually visit our grandparents ______ Tet.","id":"prep:6"},{"o":["about","of","in","on"],"a":0,"ex":"<b>be worried about<\/b> = lo lắng về.","vi":"Thanh thiếu niên thường lo lắng về kết quả thi.","q":"Teenagers are often worried ______ their exam results.","id":"prep:7"},{"o":["from","with","of","at"],"a":0,"ex":"<b>be different from<\/b> = khác với.","vi":"Cuộc sống ở làng tôi rất khác với cuộc sống ở thành phố.","q":"Life in my village is very different ______ life in the city.","id":"prep:8"},{"o":["on","in","by","at"],"a":0,"ex":"<b>on your own / on her own<\/b> = một mình.","vi":"Em gái tôi thích dành thời gian một mình để đọc truyện tranh.","q":"My little sister likes spending time ______ her own, reading comics.","id":"prep:9"},{"o":["on","at","in","with"],"a":0,"ex":"<b>be hooked on<\/b> = mê, nghiện.","vi":"Ngày nay nhiều bạn trẻ nghiện mạng xã hội.","q":"Many young people are hooked ______ social media these days.","id":"prep:10"},{"o":["in","on","at","for"],"a":0,"ex":"<b>in<\/b> + mùa (in spring, in summer…).","vi":"Hội Lim thường được tổ chức vào mùa xuân.","q":"The Lim Festival is usually held ______ spring.","id":"prep:11"}],"func":[{"o":["Yes, I like flowers.","I'd love to. What time?","No, I wouldn't.","You're welcome."],"a":1,"ex":"Đây là <b>lời mời<\/b> → nhận lời bằng <b>I'd love to<\/b>. \"Yes, I like flowers\" là bẫy lặp từ; \"No, I wouldn't\" bất lịch sự; \"You're welcome\" dùng để đáp lời cảm ơn.","vi":"A: \"Chủ nhật này bạn có muốn đi lễ hội hoa với mình không?\" – B: \"Mình rất thích. Mấy giờ vậy?\"","q":"A: \"Would you like to go to the flower festival with me this Sunday?\"<br>B: \"______\"","id":"func:0"},{"o":["Thank you. My mum made it for me.","Yes, it is.","I don't think.","Not at all."],"a":0,"ex":"Đáp lại <b>lời khen<\/b> → <b>Thank you<\/b>. \"Yes, it is\" thiếu lịch sự; \"Not at all\" dùng cho Do you mind…?","vi":"A: \"Chiếc áo dài của bạn đẹp quá!\" – B: \"Cảm ơn bạn. Mẹ mình may cho mình đấy.\"","q":"A: \"Your áo dài is so beautiful!\"<br>B: \"______\"","id":"func:1"},{"o":["That's right.","It's my pleasure.","Yes, please.","Good idea."],"a":1,"ex":"Đáp lại <b>lời cảm ơn<\/b> → <b>It's my pleasure<\/b> / You're welcome.","vi":"A: \"Cảm ơn bạn đã giúp mình làm dự án DIY.\" – B: \"Đó là niềm vui của mình mà.\"","q":"A: \"Thank you for helping me with my DIY project.\"<br>B: \"______\"","id":"func:2"},{"o":["I don't agree.","I completely agree.","Never mind.","Of course not."],"a":1,"ex":"Câu sau \"The air is fresher, too\" (không khí cũng trong lành hơn) cho thấy B <b>đồng ý<\/b> → <b>I completely agree<\/b>.","vi":"A: \"Mình nghĩ cuộc sống ở nông thôn yên bình hơn ở thành phố.\" – B: \"Mình hoàn toàn đồng ý. Không khí cũng trong lành hơn nữa.\"","q":"A: \"I think life in the countryside is more peaceful than in the city.\"<br>B: \"______ The air is fresher, too.\"","id":"func:3"},{"o":["Yes, sure.","Not at all. Go ahead.","I'm sorry for that.","Congratulations!"],"a":1,"ex":"<b>Do you mind…?<\/b> nghĩa là \"Bạn có phiền không…?\" → đồng ý thì trả lời <b>Not at all<\/b> (không phiền chút nào). \"Yes, sure\" lại có nghĩa là \"Có, phiền đấy\".","vi":"A: \"Bạn có phiền không nếu mình dùng máy tính xách tay của bạn một lát?\" – B: \"Không phiền đâu. Cứ dùng đi.\"","q":"A: \"Do you mind if I use your laptop for a moment?\"<br>B: \"______\"","id":"func:4"},{"o":["Thank you very much.","Never mind.","You're welcome.","Yes, I do."],"a":0,"ex":"Đáp lại <b>lời chúc mừng<\/b> → <b>Thank you (very much)<\/b>. <i>(Câu 14 – Đề tham khảo)<\/i>","vi":"A: \"Chúc mừng bạn đã đạt giải nhất!\" – B: \"Cảm ơn bạn rất nhiều.\"","q":"A: \"Congratulations on winning the first prize!\"<br>B: \"______\"","id":"func:5"},{"o":["That's all right.","You're welcome.","Congratulations!","Yes, please."],"a":0,"ex":"Đáp lại <b>lời xin lỗi<\/b> → <b>That's all right<\/b> / Never mind / No problem.","vi":"A: \"Xin lỗi, mình đến muộn.\" – B: \"Không sao đâu.\"","q":"A: \"I'm sorry for being late.\"<br>B: \"______\"","id":"func:6"},{"o":["That's a good idea!","Not at all.","It's my pleasure.","No, I don't."],"a":0,"ex":"Đáp lại <b>lời gợi ý<\/b> (Let's…) → <b>That's a good idea!<\/b> / Great! / Sounds fun.","vi":"A: \"Cuối tuần này mình đến thăm trang trại của ông bà mình đi.\" – B: \"Ý hay đấy!\"","q":"A: \"Let's visit my grandparents' farm this weekend.\"<br>B: \"______\"","id":"func:7"},{"o":["Sure. I'd be happy to.","Not at all.","You're welcome.","Congratulations!"],"a":0,"ex":"Đây là <b>lời nhờ vả<\/b> → đồng ý giúp: <b>Sure. / Certainly.<\/b> \"Not at all\" đáp lại Do you mind…?; \"You're welcome\" đáp lại lời cảm ơn.","vi":"A: \"Bạn giúp mình mang mấy cái thùng này được không?\" – B: \"Được chứ. Mình rất sẵn lòng.\"","q":"A: \"Could you help me carry these boxes?\"<br>B: \"______\"","id":"func:8"},{"o":["I think it's peaceful but a bit boring.","Yes, I do.","No, I don't think.","It's my pleasure."],"a":0,"ex":"Câu hỏi <b>Wh-<\/b> hỏi ý kiến → trả lời bằng ý kiến <b>I think it's…<\/b>, không trả lời Yes/No.","vi":"A: \"Bạn nghĩ gì về cuộc sống ở nông thôn?\" – B: \"Mình nghĩ nó yên bình nhưng hơi buồn tẻ.\"","q":"A: \"What do you think of life in the countryside?\"<br>B: \"______\"","id":"func:9"},{"o":["You're right.","Never mind.","Not at all.","Of course not."],"a":0,"ex":"B đưa thêm lý do ủng hộ (tiện lợi, tiết kiệm thời gian) → <b>đồng ý<\/b>: You're right. / I completely agree.","vi":"A: \"Mình nghĩ học trực tuyến có ích cho thanh thiếu niên.\" – B: \"Bạn nói đúng. Nó tiện lợi và tiết kiệm thời gian.\"","q":"A: \"I think online learning is useful for teenagers.\"<br>B: \"______ It's convenient and saves time.\"","id":"func:10"},{"o":["You're welcome.","That's a good idea.","Never mind.","Yes, please."],"a":0,"ex":"Đáp lại <b>lời cảm ơn<\/b> → <b>You're welcome. / It's my pleasure.<\/b>","vi":"A: \"Cảm ơn bạn rất nhiều vì món quà đáng yêu!\" – B: \"Không có gì đâu.\"","q":"A: \"Thank you very much for the lovely gift!\"<br>B: \"______\"","id":"func:11"}],"sign":[{"o":["You can swim here because the water is deep.","You must not swim here because the water is deep.","You should learn to swim in deep water.","Swimming is only allowed in the morning."],"a":1,"ex":"<b>NO + V-ing<\/b> = cấm làm gì → <i>You must not swim here<\/i>. Các đáp án khác sai nghĩa (cho phép bơi, khuyên học bơi, thêm thông tin \"buổi sáng\" không có trên biển).","vi":"Biển: CẤM BƠI – NƯỚC SÂU. → Bạn không được bơi ở đây vì nước sâu.","sign":{"lines":["NO SWIMMING","DEEP WATER"],"k":"ban"},"q":"What does the sign / notice say?","id":"sign:0"},{"o":["Do not walk on the grass.","Cut the grass regularly.","You can sit on the grass.","Water the grass every day."],"a":0,"ex":"<b>Keep off the grass<\/b> = không giẫm/đi lên cỏ → <i>Do not walk on the grass<\/i>.","vi":"Biển: VUI LÒNG KHÔNG GIẪM LÊN CỎ. → Không đi lên cỏ.","sign":{"lines":["PLEASE KEEP OFF THE GRASS"],"k":"ban"},"q":"What does the sign / notice say?","id":"sign:1"},{"o":["Clean the floor now.","Be careful because the floor may be slippery.","Do not use water on the floor.","The floor is dry and safe."],"a":1,"ex":"<b>CAUTION<\/b> = chú ý, cẩn thận; <b>WET FLOOR<\/b> = sàn ướt → sàn có thể trơn, hãy cẩn thận.","vi":"Biển: CHÚ Ý – SÀN ƯỚT. → Hãy cẩn thận vì sàn có thể trơn trượt.","sign":{"lines":["CAUTION","WET FLOOR"],"k":"warn"},"q":"What does the sign / notice say?","id":"sign:2"},{"o":["You can talk quietly on the phone.","You must keep quiet and turn off your phone.","Phones are sold in the library.","Only students can use phones here."],"a":1,"ex":"<b>Silence please<\/b> = xin giữ im lặng; <b>must be switched off<\/b> = phải tắt → giữ im lặng và tắt điện thoại.","vi":"Biển: THƯ VIỆN – XIN GIỮ IM LẶNG. Điện thoại di động phải được tắt. → Bạn phải giữ im lặng và tắt điện thoại.","sign":{"lines":["LIBRARY – SILENCE PLEASE","Mobile phones must be switched off."],"k":"must"},"q":"What does the sign / notice say?","id":"sign:3"},{"o":["Leave your shoes outside before going in.","You can buy shoes here.","Shoes are not sold in the pagoda.","Wear your shoes when you enter."],"a":0,"ex":"<b>take off your shoes<\/b> = cởi giày → để giày bên ngoài trước khi vào.","vi":"Biển: CHÙA – gì đó lên mạng.","sign":{"lines":["THINK BEFORE YOU POST"],"k":"info"},"q":"What does the sign / notice say?","id":"sign:12"},{"o":["Be careful not to hit your head.","Think carefully before you go in.","You must not wear a hat here.","The ceiling is very high."],"a":0,"ex":"<b>Mind your head<\/b> = cẩn thận đụng đầu; <b>Low ceiling<\/b> = trần thấp. (Bẫy: mind ở đây không phải \"suy nghĩ\".) <i>(Câu 16 – Đề tham khảo)<\/i>","vi":"Biển: CẨN THẬN ĐỤNG ĐẦU – Trần thấp. → Hãy cẩn thận kẻo đụng đầu.","sign":{"lines":["MIND YOUR HEAD","Low ceiling"],"k":"warn"},"q":"What does the sign / notice say?","id":"sign:13"},{"o":["You can't park here during the day.","You can park here at noon.","Parking costs 7,000 VND.","The car park opens at 6 p.m."],"a":0,"ex":"Biển <b>cấm đỗ xe từ 7 giờ sáng đến 6 giờ chiều<\/b> → ban ngày không được đỗ. Buổi trưa (noon) nằm trong khung giờ cấm; không có thông tin giá tiền.","vi":"Biển: CẤM ĐỖ XE – 7 giờ sáng đến 6 giờ chiều. → Bạn không được đỗ xe ở đây vào ban ngày.","sign":{"lines":["NO PARKING","7 a.m. – 6 p.m."],"k":"ban"},"q":"What does the sign / notice say?","id":"sign:14"},{"o":["Be careful – there is a dangerous dog here.","Dogs are for sale here.","You can bring your dog in.","Please feed the dog."],"a":0,"ex":"<b>Beware of …<\/b> = coi chừng, cẩn thận với … → đây là biển cảnh báo có chó dữ.","vi":"Biển: COI CHỪNG CHÓ DỮ. → Hãy cẩn thận – ở đây có chó dữ.","sign":{"lines":["BEWARE OF THE DOG"],"k":"warn"},"q":"What does the sign / notice say?","id":"sign:15"},{"o":["Stand in line here and wait for your turn.","Ask questions here.","Sit down and rest here.","Do not wait here."],"a":0,"ex":"<b>Queue<\/b> = xếp hàng → đứng xếp hàng ở đây và chờ đến lượt.","vi":"Biển: XẾP HÀNG TẠI ĐÂY. → Đứng xếp hàng ở đây và chờ đến lượt bạn.","sign":{"lines":["QUEUE HERE"],"k":"info"},"q":"What does the sign / notice say?","id":"sign:16"},{"o":["You must not give food to the animals.","The animals are very hungry.","You can buy food for the animals here.","Feed the animals twice a day."],"a":0,"ex":"<b>Do not feed<\/b> = không được cho ăn → You must not give food to the animals.","vi":"Biển: VUI LÒNG KHÔNG CHO THÚ ĂN. → Bạn không được cho các con vật ăn.","sign":{"lines":["PLEASE DO NOT FEED","THE ANIMALS"],"k":"ban"},"q":"What does the sign / notice say?","id":"sign:17"},{"o":["Be nice to other people on the Internet.","You can bully people online.","Use social media all day long.","Only adults can go online."],"a":0,"ex":"Biển kĩ năng mềm: <b>Be kind online – No cyberbullying<\/b> = hãy tử tế trên mạng, không bắt nạt trên mạng.","vi":"Biển: HÃY TỬ TẾ TRÊN MẠNG – Không bắt nạt trên mạng. → Hãy cư xử tốt với người khác trên Internet.","sign":{"lines":["BE KIND ONLINE","No cyberbullying"],"k":"info"},"q":"What does the sign / notice say?","id":"sign:18"}],"cloze":[{"title":"DIY – Do it yourself","unit":"Unit 1","passage":"Many teenagers today are (1) ______ about doing DIY. DIY stands (2) ______ \"do it yourself\". It is a great way to spend your free time because it helps you become more (3) ______. For example, you can make a pencil case (4) ______ old jeans or decorate your bedroom with paper flowers. DIY also helps you save money. (5) ______, you should be careful when you use tools like scissors or glue guns. If you are interested (6) ______ DIY, why don't you start with a simple project this weekend?","qs":[{"o":["keen","crazy","fond","interested"],"a":1,"ex":"Sau chỗ trống là <b>about<\/b> → <b>crazy about<\/b> (mê). keen đi với on, fond đi với of, interested đi với in.","vi":"Ngày nay nhiều bạn trẻ rất mê làm đồ DIY.","q":"(1)"},{"o":["by","for","with","of"],"a":1,"ex":"<b>stand for<\/b> = là viết tắt của.","vi":"DIY là viết tắt của \"do it yourself\" (tự mình làm).","q":"(2)"},{"o":["create","creative","creatively","creation"],"a":1,"ex":"Sau <b>become more<\/b> cần <b>tính từ<\/b> → creative (sáng tạo).","vi":"Nó giúp bạn trở nên sáng tạo hơn.","q":"(3)"},{"o":["from","at","on","in"],"a":0,"ex":"<b>make sth from sth<\/b> = làm cái gì từ cái gì.","vi":"Bạn có thể làm hộp bút từ quần jean cũ.","q":"(4)"},{"o":["However","Therefore","Because","So"],"a":0,"ex":"Câu trước nói lợi ích (tiết kiệm tiền), câu sau là lời lưu ý → quan hệ <b>tương phản<\/b>, đứng đầu câu có dấu phẩy → <b>However<\/b>.","vi":"Tuy nhiên, bạn nên cẩn thận khi dùng các dụng cụ như kéo hay súng bắn keo.","q":"(5)"},{"o":["on","at","in","about"],"a":2,"ex":"<b>be interested in<\/b> = quan tâm, thích thú.","vi":"Nếu bạn thích DIY, sao bạn không bắt đầu với một dự án đơn giản vào cuối tuần này?","q":"(6)"}],"vi":"Ngày nay nhiều bạn trẻ rất mê làm đồ DIY. DIY là viết tắt của \"do it yourself\" (tự mình làm). Đây là một cách tuyệt vời để sử dụng thời gian rảnh vì nó giúp bạn trở nên sáng tạo hơn. Ví dụ, bạn có thể làm hộp bút từ quần jean cũ hoặc trang trí phòng ngủ bằng hoa giấy. DIY còn giúp bạn tiết kiệm tiền. Tuy nhiên, bạn nên cẩn thận khi dùng các dụng cụ như kéo hay súng bắn keo. Nếu bạn thích DIY, sao bạn không bắt đầu với một dự án đơn giản vào cuối tuần này?","id":"cloze:0"},{"title":"My grandparents' village","unit":"Unit 2","passage":"My grandparents live in a small village in Nam Dinh. Life there is much more (1) ______ than in the city. There are no tall buildings or heavy traffic, and the air is fresh. Every morning, my grandfather gets up early to (2) ______ the cattle to the field. My grandmother grows vegetables and (3) ______ the chickens. The villagers are very (4) ______; they always smile and invite visitors into their homes. Last summer, I helped my grandparents (5) ______ the rice. It was hard work, but I enjoyed it. People in the countryside work (6) ______ than people in the city, but they seem happier.","qs":[{"o":["peace","peaceful","peacefully","peacefulness"],"a":1,"ex":"Sau <b>is much more<\/b> cần <b>tính từ<\/b> (so sánh hơn) → peaceful (yên bình).","vi":"Cuộc sống ở đó yên bình hơn nhiều so với ở thành phố.","q":"(1)"},{"o":["herd","milk","load","dry"],"a":0,"ex":"<b>herd the cattle to the field<\/b> = lùa gia súc ra đồng. milk: vắt sữa; load: chất hàng; dry: phơi.","vi":"Mỗi sáng, ông tôi dậy sớm để lùa đàn gia súc ra đồng.","q":"(2)"},{"o":["feeds","rides","catches","flies"],"a":0,"ex":"<b>feed the chickens<\/b> = cho gà ăn. Chủ ngữ số ít (my grandmother) và song song với grows → feeds.","vi":"Bà tôi trồng rau và cho gà ăn.","q":"(3)"},{"o":["hospitable","vast","picturesque","well-trained"],"a":0,"ex":"Vế sau \"luôn mỉm cười và mời khách vào nhà\" → <b>hospitable<\/b> (hiếu khách). vast (rộng lớn), picturesque (đẹp như tranh) dùng cho cảnh vật.","vi":"Dân làng rất hiếu khách; họ luôn mỉm cười và mời khách vào nhà.","q":"(4)"},{"o":["harvest","harvesting","harvested","harvests"],"a":0,"ex":"<b>help + sb + V (nguyên mẫu)<\/b> → helped my grandparents harvest.","vi":"Hè năm ngoái, tôi đã giúp ông bà gặt lúa.","q":"(5)"},{"o":["hard","harder","more hardly","hardly"],"a":1,"ex":"Có <b>than<\/b> → so sánh hơn của trạng từ ngắn hard → <b>harder<\/b>.","vi":"Người ở nông thôn làm việc vất vả hơn người ở thành phố, nhưng họ dường như hạnh phúc hơn.","q":"(6)"}],"vi":"Ông bà tôi sống ở một ngôi làng nhỏ ở Nam Định. Cuộc sống ở đó yên bình hơn nhiều so với ở thành phố. Không có nhà cao tầng hay giao thông đông đúc, và không khí thì trong lành. Mỗi sáng, ông tôi dậy sớm để lùa gia súc ra đồng. Bà tôi trồng rau và cho gà ăn. Dân làng rất hiếu khách; họ luôn mỉm cười và mời khách vào nhà. Mùa hè năm ngoái, tôi đã giúp ông bà gặt lúa. Đó là công việc vất vả, nhưng tôi rất thích. Người dân ở nông thôn làm việc vất vả hơn người ở thành phố, nhưng họ có vẻ hạnh phúc hơn.","id":"cloze:1"},{"title":"Teenagers and social media","unit":"Unit 3","passage":"Nowadays, social media plays an important role in teenagers' lives. Many students (1) ______ on to their accounts every day to chat with friends or share photos. Social media can be useful (2) ______ students can join online forums to discuss their schoolwork. However, spending too much time online can make teens (3) ______ and tired. Some students even become victims of cyberbullying. (4) ______ this reason, teenagers should use social media wisely. They should not share personal information, (5) ______ they should tell an adult if someone bullies them online. Parents and teachers should also help teens (6) ______ a healthy balance between online and offline activities.","qs":[{"o":["log","upload","browse","connect"],"a":0,"ex":"<b>log on to<\/b> = đăng nhập vào.","vi":"Nhiều học sinh đăng nhập vào tài khoản mỗi ngày để trò chuyện với bạn bè hoặc chia sẻ ảnh.","q":"(1)"},{"o":["although","because","but","so"],"a":1,"ex":"Vế sau giải thích <b>lý do<\/b> mạng xã hội hữu ích → <b>because<\/b>.","vi":"Mạng xã hội có thể hữu ích vì học sinh có thể tham gia các diễn đàn trực tuyến để thảo luận bài vở.","q":"(2)"},{"o":["stress","stressful","stressed","stressfully"],"a":2,"ex":"<b>make + sb + adj<\/b>; chỉ cảm xúc của người (teens) → <b>stressed<\/b> (bị căng thẳng). stressful dùng cho sự vật gây căng thẳng.","vi":"Tuy nhiên, dành quá nhiều thời gian trên mạng có thể khiến thanh thiếu niên căng thẳng và mệt mỏi.","q":"(3)"},{"o":["Because","For","With","By"],"a":1,"ex":"<b>For this reason<\/b> = vì lý do này.","vi":"Vì lý do này, thanh thiếu niên nên sử dụng mạng xã hội một cách khôn ngoan.","q":"(4)"},{"o":["and","or","but","so"],"a":0,"ex":"Hai vế đều là lời khuyên, bổ sung cho nhau → <b>and<\/b> (thêm ý).","vi":"Các em không nên chia sẻ thông tin cá nhân, và nên báo cho người lớn nếu ai đó bắt nạt mình trên mạng.","q":"(5)"},{"o":["keep","keeping","kept","keeps"],"a":0,"ex":"<b>help + sb + V (nguyên mẫu)<\/b> → help teens keep.","vi":"Cha mẹ và thầy cô cũng nên giúp thanh thiếu niên giữ sự cân bằng lành mạnh giữa hoạt động trực tuyến và ngoài đời thực.","q":"(6)"}],"vi":"Ngày nay, mạng xã hội đóng vai trò quan trọng trong cuộc sống của thanh thiếu niên. Nhiều học sinh đăng nhập vào tài khoản mỗi ngày để trò chuyện với bạn bè hoặc chia sẻ ảnh. Mạng xã hội có thể hữu ích vì học sinh có thể tham gia các diễn đàn trực tuyến để thảo luận bài vở. Tuy nhiên, dành quá nhiều thời gian trên mạng có thể khiến các bạn trẻ căng thẳng và mệt mỏi. Một số học sinh thậm chí trở thành nạn nhân của bắt nạt trên mạng. Vì lý do này, thanh thiếu niên nên sử dụng mạng xã hội một cách khôn ngoan. Các em không nên chia sẻ thông tin cá nhân, và nên báo cho người lớn nếu ai đó bắt nạt mình trên mạng. Bố mẹ và thầy cô cũng nên giúp các em giữ sự cân bằng lành mạnh giữa hoạt động trên mạng và ngoài đời thực.","id":"cloze:2"},{"title":"Leisure time for teenagers","unit":"Unit 1","passage":"Leisure time is very important for teenagers. After hours of studying at school, students need time to relax and (1) ______ their energy. There are many leisure activities to choose from. Some students like (2) ______ the net or messaging friends. Others prefer outdoor activities (3) ______ cycling, playing football or flying kites. Outdoor activities are good for our health (4) ______ they help us build muscle strength and keep fit. However, we should not spend too (5) ______ time on screens. Experts say that teenagers should do at least 60 minutes of physical activity every day. So, turn off your phone and go outside (6) ______ some fresh air!","qs":[{"o":["recover","lose","spend","waste"],"a":0,"ex":"<b>recover their energy<\/b> = lấy lại năng lượng (hợp nghĩa sau khi học nhiều giờ). lose: mất; spend: tiêu; waste: lãng phí.","vi":"Sau nhiều giờ học ở trường, học sinh cần thời gian để thư giãn và lấy lại năng lượng.","q":"(1)"},{"o":["surf","surfing","surfed","surfs"],"a":1,"ex":"<b>like + V-ing<\/b>, song song với messaging → <b>surfing<\/b> the net.","vi":"Một số bạn thích lướt mạng hoặc nhắn tin với bạn bè.","q":"(2)"},{"o":["such as","for example","like as","so as"],"a":0,"ex":"<b>such as<\/b> = chẳng hạn như, dùng để liệt kê ví dụ ngay giữa câu. \"for example\" thường đứng đầu câu và có dấu phẩy; \"like as\", \"so as\" sai.","vi":"Những bạn khác thích các hoạt động ngoài trời như đạp xe, đá bóng hay thả diều.","q":"(3)"},{"o":["so","but","because","although"],"a":2,"ex":"Vế sau giải thích <b>lý do<\/b> hoạt động ngoài trời tốt cho sức khỏe → <b>because<\/b>.","vi":"Hoạt động ngoài trời tốt cho sức khỏe vì chúng giúp ta tăng sức mạnh cơ bắp và giữ dáng.","q":"(4)"},{"o":["many","much","few","a lot"],"a":1,"ex":"<b>time<\/b> là danh từ không đếm được → <b>too much time<\/b> (quá nhiều thời gian).","vi":"Tuy nhiên, chúng ta không nên dành quá nhiều thời gian cho màn hình.","q":"(5)"},{"o":["enjoy","to enjoy","enjoying","enjoyed"],"a":1,"ex":"<b>to + V<\/b> chỉ mục đích: ra ngoài <i>để<\/i> tận hưởng → <b>to enjoy<\/b>.","vi":"Vậy nên, hãy tắt điện thoại và ra ngoài tận hưởng không khí trong lành!","q":"(6)"}],"vi":"Thời gian rảnh rất quan trọng đối với thanh thiếu niên. Sau nhiều giờ học ở trường, học sinh cần thời gian để thư giãn và phục hồi năng lượng. Có rất nhiều hoạt động giải trí để lựa chọn. Một số bạn thích lướt mạng hoặc nhắn tin với bạn bè. Những bạn khác thích các hoạt động ngoài trời như đạp xe, đá bóng hay thả diều. Các hoạt động ngoài trời tốt cho sức khỏe vì chúng giúp chúng ta tăng sức mạnh cơ bắp và giữ dáng. Tuy nhiên, chúng ta không nên dành quá nhiều thời gian trước màn hình. Các chuyên gia cho rằng thanh thiếu niên nên vận động ít nhất 60 phút mỗi ngày. Vì vậy, hãy tắt điện thoại và ra ngoài tận hưởng không khí trong lành nhé!","id":"cloze:3"},{"title":"A trip to Duong Lam","unit":"Unit 2","passage":"Last summer, my class went on a trip to Duong Lam, an ancient village (1) ______ Ha Noi. We were very excited (2) ______ most of us live in the city. When we arrived, the villagers welcomed us (3) ______. We learnt how to (4) ______ the buffaloes and catch fish in the pond. In the afternoon, some boys flew kites, (5) ______ the girls picked fruit in an orchard. Life in the village moves more (6) ______ than in the city, and everyone seems relaxed and happy.","qs":[{"o":["near","on","at","under"],"a":0,"ex":"<b>near<\/b> + nơi chốn = gần (một ngôi làng cổ gần Hà Nội). on, at, under không hợp nghĩa.","vi":"Mùa hè năm ngoái, lớp tôi đi dã ngoại ở Đường Lâm, một ngôi làng cổ gần Hà Nội.","q":"(1)"},{"o":["because","so","but","although"],"a":0,"ex":"Vế sau (hầu hết chúng tôi sống ở thành phố) là <b>lý do<\/b> khiến chúng tôi háo hức → <b>because<\/b>.","vi":"Chúng tôi rất háo hức vì hầu hết chúng tôi sống ở thành phố.","q":"(2)"},{"o":["warmly","warm","warmth","warmer"],"a":0,"ex":"Bổ nghĩa cho động từ <b>welcomed<\/b> → cần <b>trạng từ<\/b>: warmly (nồng nhiệt).","vi":"Khi chúng tôi đến, dân làng chào đón chúng tôi rất nồng nhiệt.","q":"(3)"},{"o":["herd","milk","dry","load"],"a":0,"ex":"<b>herd the buffaloes<\/b> = chăn trâu. milk: vắt sữa; dry: phơi; load: chất hàng.","vi":"Chúng tôi học cách chăn trâu và bắt cá dưới ao.","q":"(4)"},{"o":["while","so","because","or"],"a":0,"ex":"Hai hoạt động diễn ra cùng lúc, đối lập nhau (các bạn nam thả diều – các bạn nữ hái quả) → <b>while<\/b> (trong khi).","vi":"Buổi chiều, một số bạn nam thả diều, trong khi các bạn nữ hái quả trong vườn cây ăn quả.","q":"(5)"},{"o":["slowly","slow","slower","slowness"],"a":0,"ex":"Sau động từ <b>moves<\/b> và \"more … than\" → so sánh hơn của <b>trạng từ<\/b> dài: more <b>slowly<\/b>.","vi":"Cuộc sống ở làng trôi chậm hơn ở thành phố, và ai cũng có vẻ thư thái, vui vẻ.","q":"(6)"}],"vi":"Mùa hè năm ngoái, lớp tôi đi dã ngoại ở Đường Lâm, một ngôi làng cổ gần Hà Nội. Chúng tôi rất háo hức vì hầu hết chúng tôi sống ở thành phố. Khi chúng tôi đến, dân làng chào đón chúng tôi rất nồng nhiệt. Chúng tôi học cách chăn trâu và bắt cá dưới ao. Buổi chiều, một số bạn nam thả diều, trong khi các bạn nữ hái quả trong vườn cây ăn quả. Cuộc sống ở làng trôi chậm hơn ở thành phố, và ai cũng có vẻ thư thái, vui vẻ.","id":"cloze:4"},{"title":"Teenagers and stress","unit":"Unit 3","passage":"Being a teenager is not always easy. Many students feel (1) ______ because of exams and homework. Some also suffer from peer (2) ______: they want to look cool and do the same things as their friends. When you feel stressed, you should talk (3) ______ someone you trust, like your parents or a teacher. You can also do something you enjoy, such as (4) ______ music or playing sports. Don't keep your feelings to yourself; (5) ______, the problem may become worse. Remember that everyone makes mistakes, and every teen needs time to become more (6) ______.","qs":[{"o":["stressed","stress","stressful","stressing"],"a":0,"ex":"Sau động từ <b>feel<\/b> cần tính từ chỉ <b>cảm xúc của người<\/b> → stressed (bị căng thẳng). stressful dùng cho sự vật gây căng thẳng.","vi":"Nhiều học sinh cảm thấy căng thẳng vì thi cử và bài tập về nhà.","q":"(1)"},{"o":["pressure","forum","account","notification"],"a":0,"ex":"Cụm cố định <b>peer pressure<\/b> = áp lực từ bạn bè đồng trang lứa.","vi":"Một số bạn còn chịu áp lực đồng trang lứa: họ muốn trông thật \"ngầu\" và làm giống bạn bè.","q":"(2)"},{"o":["to","at","on","for"],"a":0,"ex":"<b>talk to sb<\/b> = nói chuyện với ai.","vi":"Khi cảm thấy căng thẳng, bạn nên nói chuyện với người mình tin tưởng, như bố mẹ hoặc thầy cô.","q":"(3)"},{"o":["listening to","listen to","listened to","listens to"],"a":0,"ex":"Sau <b>such as<\/b> liệt kê ví dụ, song song với \"playing sports\" → dùng <b>V-ing<\/b>: listening to music.","vi":"Bạn cũng có thể làm điều mình thích, chẳng hạn như nghe nhạc hoặc chơi thể thao.","q":"(4)"},{"o":["otherwise","however","therefore","moreover"],"a":0,"ex":"\"Đừng giữ cảm xúc trong lòng; <b>nếu không thì<\/b> vấn đề có thể tệ hơn\" → <b>otherwise<\/b>.","vi":"Đừng giữ cảm xúc cho riêng mình; nếu không, vấn đề có thể trở nên tồi tệ hơn.","q":"(5)"},{"o":["mature","maturity","maturely","matures"],"a":0,"ex":"Sau <b>become more<\/b> cần <b>tính từ<\/b> → mature (trưởng thành, chín chắn).","vi":"Hãy nhớ rằng ai cũng mắc lỗi, và mỗi bạn tuổi teen đều cần thời gian để trở nên chín chắn hơn.","q":"(6)"}],"vi":"Làm một thiếu niên không phải lúc nào cũng dễ dàng. Nhiều học sinh cảm thấy căng thẳng vì thi cử và bài tập về nhà. Một số bạn còn chịu áp lực đồng trang lứa: họ muốn trông thật \"ngầu\" và làm những điều giống như bạn bè. Khi cảm thấy căng thẳng, bạn nên nói chuyện với người mình tin tưởng, như bố mẹ hoặc thầy cô. Bạn cũng có thể làm điều mình thích, chẳng hạn như nghe nhạc hoặc chơi thể thao. Đừng giữ cảm xúc cho riêng mình; nếu không, vấn đề có thể trở nên tồi tệ hơn. Hãy nhớ rằng ai cũng mắc lỗi, và mỗi bạn tuổi teen đều cần thời gian để trở nên chín chắn hơn.","id":"cloze:5"},{"title":"Our DIY club","unit":"Unit 1","passage":"My best friend Minh and I have a lot (1) ______ common. We both love (2) ______ origami. Every weekend, we hang (3) ______ at the community centre, where there is a DIY club. Last month, our club made 1,000 paper cranes and sold them (4) ______ raise money for poor children. Minh is very good at folding paper, (5) ______ I am better at decorating. I think making crafts is a great leisure activity (6) ______ it helps us become patient and creative.","qs":[{"o":["in","on","at","of"],"a":0,"ex":"<b>have sth in common<\/b> = có điểm chung.","vi":"Minh – bạn thân nhất của tôi – và tôi có nhiều điểm chung.","q":"(1)"},{"o":["doing","do","to doing","does"],"a":0,"ex":"<b>love + V-ing<\/b> (hoặc to V) → doing origami. \"to doing\" sai cấu trúc.","vi":"Cả hai chúng tôi đều thích gấp giấy origami.","q":"(2)"},{"o":["out","on","up","off"],"a":0,"ex":"<b>hang out<\/b> = đi chơi, tụ tập (với bạn bè).","vi":"Mỗi cuối tuần, chúng tôi tụ tập ở nhà văn hóa, nơi có một câu lạc bộ DIY.","q":"(3)"},{"o":["to","for","so","of"],"a":0,"ex":"<b>to + V<\/b> chỉ mục đích: bán hạc giấy <b>để<\/b> quyên tiền.","vi":"Tháng trước, câu lạc bộ đã gấp 1.000 con hạc giấy và bán chúng để quyên tiền cho trẻ em nghèo.","q":"(4)"},{"o":["but","so","because","or"],"a":0,"ex":"Hai vế đối lập (Minh giỏi gấp giấy – tôi giỏi trang trí hơn) → <b>but<\/b>.","vi":"Minh rất giỏi gấp giấy, nhưng tôi thì giỏi trang trí hơn.","q":"(5)"},{"o":["because","so","but","although"],"a":0,"ex":"Vế sau giải thích <b>lý do<\/b> vì sao làm đồ thủ công là hoạt động tuyệt vời → <b>because<\/b>.","vi":"Tôi nghĩ làm đồ thủ công là một hoạt động giải trí tuyệt vời vì nó giúp chúng ta kiên nhẫn và sáng tạo.","q":"(6)"}],"vi":"Minh – bạn thân nhất của tôi – và tôi có nhiều điểm chung. Cả hai chúng tôi đều thích gấp giấy origami. Mỗi cuối tuần, chúng tôi tụ tập ở nhà văn hóa, nơi có một câu lạc bộ DIY. Tháng trước, câu lạc bộ của chúng tôi đã gấp 1.000 con hạc giấy và bán chúng để quyên tiền cho trẻ em nghèo. Minh rất giỏi gấp giấy, nhưng tôi thì giỏi trang trí hơn. Tôi nghĩ làm đồ thủ công là một hoạt động giải trí tuyệt vời vì nó giúp chúng ta trở nên kiên nhẫn và sáng tạo.","id":"cloze:6"}],"read":[{"title":"The Tay people","unit":"Unit 4","passage":"The Tay are the largest ethnic minority group in Viet Nam, with a population of about 1.8 million people. They live mainly in the northern mountainous provinces such as Cao Bang, Lang Son and Bac Kan. Most Tay people live in villages near rivers or streams, and their houses are usually stilt houses made of wood and bamboo. Living on stilts keeps them safe from wild animals and floods.\n\nThe Tay are good at farming. They grow wet rice in paddy fields and on terraced fields, and they also raise livestock such as buffaloes, pigs and chickens. Tay women are skilful at weaving. They make beautiful cloth and brocade bags, and their traditional costumes are usually dark indigo.\n\nThe Tay have a rich culture. \"Then\" singing, often performed with a \"tinh\" lute, is a famous folk art of the Tay and is recognised by UNESCO. During festivals, Tay people play folk games and enjoy special foods like five-colour sticky rice.","tf":[{"q":"The Tay are the largest ethnic minority group in Viet Nam.","a":true,"ex":"Bài viết: \"<i>The Tay are the largest ethnic minority group in Viet Nam<\/i>\" → đúng y như câu hỏi.","vi":"Người Tày là dân tộc thiểu số đông dân nhất Việt Nam."},{"q":"Most Tay people live in the southern part of Viet Nam.","a":false,"ex":"Bài viết: \"<i>They live mainly in the <b>northern<\/b> mountainous provinces<\/i>\" → họ sống ở miền <b>Bắc<\/b>, không phải miền Nam.","vi":"Hầu hết người Tày sống ở miền Nam Việt Nam."},{"q":"Stilt houses help protect the Tay from floods and wild animals.","a":true,"ex":"Bài viết: \"<i>Living on stilts keeps them safe from wild animals and floods.<\/i>\" (keep safe from = protect from).","vi":"Nhà sàn giúp người Tày tránh khỏi lũ lụt và thú dữ."},{"q":"Tay men are famous for weaving brocade.","a":false,"ex":"Bài viết: \"<i>Tay <b>women<\/b> are skilful at weaving.<\/i>\" → phụ nữ, không phải đàn ông (bẫy đổi đối tượng).","vi":"Đàn ông Tày nổi tiếng về nghề dệt thổ cẩm."}],"mc":[{"o":["Farming methods in the north","The life and culture of the Tay people","Stilt houses in Viet Nam","UNESCO heritage in Viet Nam"],"a":1,"ex":"Bài có 3 đoạn: nơi ở – công việc – văn hóa của người Tày → ý chính bao quát là <b>cuộc sống và văn hóa của người Tày<\/b>. Các đáp án khác chỉ là một chi tiết nhỏ.","vi":"Đoạn văn chủ yếu nói về điều gì? → Cuộc sống và văn hóa của người Tày.","q":"What is the passage mainly about?"},{"o":["paddy fields","the Tay","buffaloes","terraced fields"],"a":1,"ex":"Câu ngay trước: \"<i>The Tay are good at farming.<\/i>\" → \"They grow wet rice…\" nghĩa là <b>người Tày<\/b> trồng lúa.","vi":"Từ \"They\" ở đoạn 2 chỉ người Tày.","q":"The word \"They\" in paragraph 2 refers to ______."}],"vi":"Người Tày là dân tộc thiểu số đông dân nhất ở Việt Nam, với khoảng 1,8 triệu người. Họ sống chủ yếu ở các tỉnh miền núi phía Bắc như Cao Bằng, Lạng Sơn và Bắc Kạn. Hầu hết người Tày sống trong những ngôi làng gần sông suối, và nhà của họ thường là nhà sàn làm bằng gỗ và tre. Sống trên nhà sàn giúp họ an toàn trước thú dữ và lũ lụt.\n\nNgười Tày giỏi làm nông. Họ trồng lúa nước trên ruộng và trên ruộng bậc thang, đồng thời chăn nuôi gia súc, gia cầm như trâu, lợn và gà. Phụ nữ Tày k
