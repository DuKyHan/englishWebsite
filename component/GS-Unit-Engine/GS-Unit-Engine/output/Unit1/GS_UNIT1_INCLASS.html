  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }

e-100 py-1'><span class='font-bold text-indigo-800'>6. spend</span><span class='text-slate-400 text-xs'>(v) /spend/</span><span class='text-slate-500 text-xs ml-auto'>dành (thời gian, tiền bạc)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. spend time on your own</span><span class='text-slate-400 text-xs'>(phr) /spend taɪm ɒn jɔːr oʊn/</span><span class='text-slate-500 text-xs ml-auto'>dành thời gian một mình</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. DIY (do-it-yourself)</span><span class='text-slate-400 text-xs'>(n, adj) /ˌdiː aɪ ˈwaɪ/</span><span class='text-slate-500 text-xs ml-auto'>tự làm, tự chế</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. puzzle</span><span class='text-slate-400 text-xs'>(n) /ˈpʌzl/</span><span class='text-slate-500 text-xs ml-auto'>trò chơi xếp hình, câu đố</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. do puzzle</span><span class='text-slate-400 text-xs'>(phr) /duː ˈpʌzl/</span><span class='text-slate-500 text-xs ml-auto'>chơi xếp hình</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. surf</span><span class='text-slate-400 text-xs'>(v) /sɜːrf/</span><span class='text-slate-500 text-xs ml-auto'>lướt (mạng, sóng)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. surf the net</span><span class='text-slate-400 text-xs'>(phr) /sɜːrf ðə net/</span><span class='text-slate-500 text-xs ml-auto'>lướt mạng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. message</span><span class='text-slate-400 text-xs'>(v) /ˈme go-800'>21. love</span><span class='text-slate-400 text-xs'>(v) /lʌv/</span><span class='text-slate-500 text-xs ml-auto'>yêu, rất thích</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. enjoy</span><span class='text-slate-400 text-xs'>(v) /ɪnˈdʒɔɪ/</span><span class='text-slate-500 text-xs ml-auto'>thích thú, tận hưởng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>23. fancy</span><span class='text-slate-400 text-xs'>(v) /ˈfænsi/</span><span class='text-slate-500 text-xs ml-auto'>thích, muốn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>24. prefer</span><span class='text-slate-400 text-xs'>(v) /prɪˈfɜːr/</span><span class='text-slate-500 text-xs ml-auto'>thích hơn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>25. hate</span><span class='text-slate-400 text-xs'>(v) /heɪt/</span><span class='text-slate-500 text-xs ml-auto'>ghét</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>26. detest</span><span class='text-slate-400 text-xs'>(v) /dɪˈtest/</span><span class='text-slate-500 text-xs ml-auto'>ghét cay ghét đắng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>27. dislike</span><span class='text-slate-400 text-xs'>(v) /dɪsˈlaɪk/</span><span class='text-slate-500 text-xs ml-auto'>không thích</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>28. home-made</span><span class='text-slate-400 text-xs'>(adj) /ˌhoʊm ˈmeɪd/</span><span class='text-slate-500 text-xs ml-auto'>tự làm tại nhà</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py- div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>37. muscle</span><span class='text-slate-400 text-xs'>(n) /ˈmʌsl/</span><span class='text-slate-500 text-xs ml-auto'>cơ bắp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>38. muscle strength</span><span class='text-slate-400 text-xs'>(n) /ˈmʌsl streŋθ/</span><span class='text-slate-500 text-xs ml-auto'>sức mạnh cơ bắp</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Verbs of liking + gerunds / to-infinitives</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\"></th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ (Anh - Việt)</th></tr>\n      <tr class=\"bg-emerald-50\"><td class=\"border px-2 py-1 font-bold\" rowspan=\"8\">LIKING<br><span class=\"font-normal text-xs\">(thích)</span></td><td class=\"border px-2 py-1 font-bold\">Adore + V-ing</td><td class=\"border px-2 py-1 italic\">I adore watching movies.<br><span class=\"not-italic text-slate-500\">Tôi rất mê xem phim.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Love + V-ing / to V</td><td class=\"border px-2 py-1 italic\">She loves learning English. / She loves to learn English.<br><span class=\"not-italic text-slate-500\">Cô ấy rất thích học tiếng Anh.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Enjoy + V-ing</td><td class=\"border px-2 py-1 italic\">He enjoys listening to music.<br><span class=\"not-italic text-slate-500\">Anh ấy thích nghe nhạc.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Fancy + V-ing</td><td class=\"border px-2 py-1 italic\">Do they fancy skiing?<br><span class=\"not-italic text-slate-500\">Họ có thích trượt tuyết không?</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Like + V-ing / to V</td><td class=\"border px-2 py-1 italic\">I like playing football. / I like to play football.<br><span class=\"not-italic text-slate-500\">Tôi thích chơi bóng đá.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Prefer + V-ing / to V</td><td class=\"border px-2 py-1 italic\">My sister prefers dancing. / My sister prefers to dance.<br><span class=\"not-italic text-slate-500\">Chị tôi thích khiêu vũ hơn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Not like + V-ing</td><td class=\"border px-2 py-1 italic\">I don't like eating vegetables.<br><span class=\"not-italic text-slate-500\">Tôi không thích ăn rau.</span></td></tr>\n      <tr class=\"bg-rose-50\"><td class=\"border px-2 py-1 font-bold\">Dislike + V-ing</td><td class=\"border px-2 py-1 italic\">Does he dislike fishing?<br><span class=\"not-italic text-slate-500\">Anh ấy có ghét câu cá không?</span></td></tr>\n      <tr class=\"bg-rose-50\"><td class=\"border px-2 py-1 font-bold\" rowspan=\"3\">DISLIKE<br><span class=\"font-normal text-xs\">(không thích)</span></td><td class=\"border px-2 py-1 font-bold\">Hate + V-ing / to V</td><td class=\"border px-2 py-1 italic\">She hates cleaning the house.<br><span class=\"not-italic text-slate-500\">Cô ấy ghét dọn nhà.</span></td></tr>\n      <tr class=\"bg-rose-50\"><td class=\"border px-2 py-1 font-bold\">Detest + V-ing</td><td class=\"border px-2 py-1 italic\">They detest getting up early.<br><span class=\"not-italic text-slate-500\">Họ ghét cay ghét đắng việc dậy sớm.</span></td></tr>\n      <tr class=\"bg-rose-50\"><td class=\"border px-2 py-1 font-bold\">Not mind + V-ing</td><td class=\"border px-2 py-1 italic\">I don't mind cooking.<br><span class=\"not-italic text-slate-500\">Tôi không phiền việc nấu ăn.</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 <b>fancy, adore, enjoy, mind, detest, dislike</b> chỉ theo sau bởi <b>V-ing</b>. <b>love, like, prefer, hate</b> đi được với cả <b>V-ing</b> và <b>to V</b>.</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-heart mr-1\"></i>2. Expressions used with hobbies</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Verb</th><th class=\"border px-2 py-1\">Cấu trúc tương đương</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\" rowspan=\"5\">Like<br><span class=\"font-normal text-xs\">(thích)</span></td><td class=\"border px-2 py-1\">= Be keen ON</td><td class=\"border px-2 py-1 italic\">I'm keen on music. <span class=\"not-italic text-slate-500\">— Tôi say mê âm nhạc.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be a fan OF</td><td class=\"border px-2 py-1 italic\">I'm a fan of football. <span class=\"not-italic text-slate-500\">— Tôi là fan bóng đá.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be interested IN</td><td class=\"border px-2 py-1 italic\">I'm interested in action movies. <span class=\"not-italic text-slate-500\">— Tôi thích phim hành động.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be hooked ON</td><td class=\"border px-2 py-1 italic\">I'm hooked on playing board games. <span class=\"not-italic text-slate-500\">— Tôi mê chơi cờ bàn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be addicted TO</td><td class=\"border px-2 py-1 italic\">I'm addicted to playing computer games. <span class=\"not-italic text-slate-500\">— Tôi nghiện chơi game.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\" rowspan=\"3\">Love<br><span class=\"font-normal text-xs\">(rất thích)</span></td><td class=\"border px-2 py-1\">= Be obsessed WITH</td><td class=\"border px-2 py-1 italic\">She's obsessed with novels. <span class=\"not-italic text-slate-500\">— Cô ấy mê tiểu thuyết.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be mad ABOUT</td><td class=\"border px-2 py-1 italic\">He's mad about painting. <span class=\"not-italic text-slate-500\">— Anh ấy đam mê hội họa.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be crazy ABOUT</td><td class=\"border px-2 py-1 italic\">She is crazy about taking photos. <span class=\"not-italic text-slate-500\">— Cô ấy mê chụp ảnh.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\" rowspan=\"2\">Dislike<br><span class=\"font-normal text-xs\">(không giỏi/thích)</span></td><td class=\"border px-2 py-1\">= Be bad AT</td><td class=\"border px-2 py-1 italic\">I'm bad at swimming. <span class=\"not-italic text-slate-500\">— Tôi bơi không giỏi.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be terrible AT</td><td class=\"border px-2 py-1 italic\">I'm terrible at singing. <span class=\"not-italic text-slate-500\">— Tôi hát rất dở.</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Chú ý đúng GIỚI TỪ đi kèm: keen <b>on</b>, interested <b>in</b>, addicted <b>to</b>, obsessed <b>with</b>, mad/crazy <b>about</b>, bad/terrible <b>at</b>.</p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>I fancy to play.</s> ❌ → <b>I fancy playing.</b> ✅ — \"fancy\" chỉ theo sau bởi V-ing, không dùng to-V.</li>\n      <li><s>She enjoys to cook.</s> ❌ → <b>She enjoys cooking.</b> ✅ — \"enjoy\" chỉ đi với V-ing.</li>\n      <li><s>He doesn't mind to wait.</s> ❌ → <b>He doesn't mind waiting.</b> ✅ — \"mind\" chỉ đi với V-ing.</li>\n      <li><s>They detest to get up early.</s> ❌ → <b>They detest getting up early.</b> ✅ — \"detest\" chỉ đi với V-ing.</li>\n      <li><s>I am interested to play football.</s> ❌ → <b>I am interested IN playing football.</b> ✅ — cần giới từ \"in\".</li>\n      <li><s>It take me two hours to do it.</s> ❌ → <b>It takes me two hours to do it.</b> ✅ — chủ ngữ giả \"It\" luôn chia số ít (takes/took).</li>\n      <li><s>I spend two hours to read books.</s> ❌ → <b>I spend two hours reading books.</b> ✅ — \"spend + time\" đi với V-ing, không dùng to-V.</li>\n      <li><s>She is keen with music.</s> ❌ → <b>She is keen ON music.</b> ✅ — \"keen\" đi với giới từ \"on\", không phải \"with\".</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"It is interesting for sb to V = sb + fancy/fancies + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1 (riêng của Unit này)</p>\n      <p class=\"text-sm text-slate-700\">It is interesting for sb to V<br>= sb + fancy(-ies) + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"V-ing... is interesting to sb = sb + enjoy(s) + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2 (riêng của Unit này)</p>\n      <p class=\"text-sm text-slate-700\">V-ing... is interesting to sb<br>= sb + enjoy(s) + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + like(s) + V-ing = S + be interested in + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 3 (riêng của Unit này)</p>\n      <p class=\"text-sm text-slate-700\">S + like(s) + V-ing<br>= S + be interested in + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 4 (riêng của Unit này)</p>\n      <p class=\"text-sm text-slate-700\">S + spend(s)/spent + time + V-ing<br>= It takes/took + O + time + to V</p>\n    </div>\n  </div>\n\n  <div class=\"bg-amber-50 border border-amber-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-amber-800 mb-2\"><i class=\"fa-solid fa-lightbulb mr-1\"></i>Áp dụng phương pháp 6 bước (xem tab \"Cách viết lại câu\") vào bài này</p>\n    <p class=\"text-sm text-slate-700\">Ví dụ: <i>\"It is really interesting for him to talk with his music teacher about jazz.\"</i> → từ gợi ý <b>He fancies</b> cho biết cần dùng Công thức 1 → động từ \"talk\" ở câu gốc → chuyển thành V-ing \"talking\" → giữ nguyên phần còn lại → <b>He fancies talking with his music teacher about jazz.</b></p>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["school", "school", "door", "pool"], "answer": 2, "ipas": ["/skuːl/", "/skuːl/", "/dɔːr/", "/puːl/"], "vis": ["trường học", "trường học", "cửa", "hồ bơi"], "explanation": "\"door\" phát âm /ɔː/, các từ còn lại có \"oo\" phát âm /uː/."}, {"q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["choose", "cool", "good", "tool"], "answer": 2, "ipas": ["/tʃuːz/", "/kuːl/", "/ɡʊd/", "/tuːl/"], "vis": ["chọn", "mát mẻ", "tốt", "dụng cụ"], "explanation": "\"good\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/."}, {"q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["june", "bull", "truth", "flu"], "answer": 1, "ipas": ["/dʒuːn/", "/bʊl/", "/truːθ/", "/fluː/"], "vis": ["tháng Sáu", "con bò đực", "sự thật", "cúm"], "explanation": "\"bull\" có \"u\" phát âm /ʊ/, ba từ còn lại phát âm /uː/."}, {"q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["pictures", "watches", "buses", "brushes"], "answer": 0, "ipas": ["/ˈpɪktʃərz/", "/ˈwɒtʃɪz/", "/ˈbʌsɪz/", "/ˈbrʌʃɪz/"], "vis": ["những bức tranh", "đồng hồ (số nhiều)", "xe buýt (số nhiều)", "bàn chải (số nhiều)"], "explanation": "\"pictures\" có đuôi \"-s\" phát âm /z/, ba từ còn lại có đuôi \"-es\" phát âm /ɪz/."}, {"q": "5. Which word has the underlined part pronounced differently from that of the others?", "options": ["woman", "who", "move", "lose"], "answer": 0, "ipas": ["/ˈwʊmən/", "/huː/", "/muːv/", "/luːz/"], "vis": ["người phụ nữ", "ai", "di chuyển", "mất, thua"], "explanation": "\"woman\" có \"o\" phát âm /ʊ/, ba từ còn lại phát âm /uː/."}, {"q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["worked", "watched", "needed", "walked"], "answer": 2, "ipas": ["/wɜːrkt/", "/wɒtʃt/", "/ˈniːdɪd/", "/wɔːkt/"], "vis": ["đã làm việc", "đã xem", "đã cần", "đã đi bộ"], "explanation": "\"needed\" có đuôi \"-ed\" phát âm /ɪd/ (vì \"need\" tận cùng bằng /d/), ba từ còn lại phát âm /t/."}, {"q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["pudding", "push", "cushion", "include"], "answer": 3, "ipas": ["/ˈpʊdɪŋ/", "/pʊʃ/", "/ˈkʊʃn/", "/ɪnˈkluːd/"], "vis": ["bánh pudding", "đẩy", "đệm, gối tựa", "bao gồm"], "explanation": "\"include\" có \"u\" phát âm /uː/, ba từ còn lại phát âm /ʊ/."}, {"q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["finish", "find", "tired", "dislike"], "answer": 0, "ipas": ["/ˈfɪnɪʃ/", "/faɪnd/", "/ˈtaɪərd/", "/dɪsˈlaɪk/"], "vis": ["hoàn thành", "tìm thấy", "mệt mỏi", "không thích"], "explanation": "\"finish\" có \"i\" phát âm /ɪ/, ba từ còn lại có \"i\" phát âm /aɪ/."}, {"q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["wood", "moon", "soon", "loose"], "answer": 0, "ipas": ["/wʊd/", "/muːn/", "/suːn/", "/luːs/"], "vis": ["gỗ", "mặt trăng", "sớm", "lỏng lẻo"], "explanation": "\"wood\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/."}, {"q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["choose", "look", "spoon", "food"], "answer": 1, "ipas": ["/tʃuːz/", "/lʊk/", "/spuːn/", "/fuːd/"], "vis": ["chọn", "nhìn", "cái thìa", "thức ăn"], "explanation": "\"look\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/."}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has a different stress pattern from that of the others?", "options": ["leisure", "puzzle", "enjoy", "message"], "answer": 2, "ipas": ["/ˈliːʒər/", "/ˈpʌzl/", "/ɪnˈdʒɔɪ/", "/ˈmesɪdʒ/"], "vis": ["thời gian rảnh", "trò chơi xếp hình", "thích thú", "tin nhắn"], "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "2. Which word has a different stress pattern from that of the others?", "options": ["enjoy", "dislike", "relax", "muscle"], "answer": 3, "ipas": ["/ɪnˈdʒɔɪ/", "/dɪsˈlaɪk/", "/rɪˈlæks/", "/ˈmʌsl/"], "vis": ["thích thú", "không thích", "thư giãn", "cơ bắp"], "explanation": "\"muscle\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "3. Which word has a different stress pattern from that of the others?", "options": ["balance", "muscle", "improve", "fancy"], "answer": 2, "ipas": ["/ˈbæləns/", "/ˈmʌsl/", "/ɪmˈpruːv/", "/ˈfænsi/"], "vis": ["sự cân bằng", "cơ bắp", "cải thiện", "thích, muốn"], "explanation": "\"improve\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "4. Which word has a different stress pattern from that of the others?", "options": ["home-made", "snowboarding", "puzzle", "balance"], "answer": 0, "ipas": ["/ˌhoʊmˈmeɪd/", "/ˈsnoʊbɔːrdɪŋ/", "/ˈpʌzl/", "/ˈbæləns/"], "vis": ["tự làm tại nhà", "trượt ván tuyết", "trò chơi xếp hình", "sự cân bằng"], "explanation": "\"home-made\" trọng âm rơi vào âm tiết thứ 2 (\"made\"), ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "5. Which word has age friends", "folding", "fancy"], "answer": 0, "ipas": ["/dɪˈtest/", "/ˈmesɪdʒ frendz/", "/ˈfoʊldɪŋ/", "/ˈfænsi/"], "vis": ["ghét cay ghét đắng", "nhắn tin cho bạn bè", "gấp", "thích, muốn"], "explanation": "\"detest\" trọng âm rơi vào âm tiết 2, ba từ/cụm còn lại trọng âm chính rơi vào âm tiết 1."}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. About 16% of them love ________ swimming.", "options": ["to go", "go", "going", "went"], "answer": 2, "explanation": "\"love\" có thể theo sau bởi V-ing hoặc to-V; đáp án chính thức là going.", "vi": "Khoảng 16% trong số họ rất thích bơi lội.", "tags": ["grammar"], "vis": ["đi (to-V, ít dùng sau love)", "đi (nguyên mẫu, thiếu to/-ing)", "đi (V-ing, đúng: love + V-ing)", "đã đi (quá khứ, sai thì)"]}, {"q": "2. My father likes _________ books and _________ in the pool.", "options": ["reading - swim", "to read - swimming", "read - swim", "reading - swimming"], "answer": 3, "explanation": "Hai động từ song song sau \"likes\" phải cùng dạng V-ing: reading - swimming.", "vi": "Bố tôi thích đọc sách và bơi trong hồ bơi.", "tags": ["grammar"], "vis": ["reading - swim (không song song)", "to read - swimming (không song song)", "read - swim (sai cấu trúc)", "reading - swimming (đúng: hai V-ing song song sau likes)"]}, {"q": "3. A lot of young families in Viet Nam prefer _______ time doing outdoor activities together.", "options": ["spending", "spend", "spent", "to spend"], "answer": 0, "explanation": "Cấu trúc \"prefer + V-ing\"; đây cũng là cấu trúc \"spend time V-ing\".", "vi": "Nhiều gia đình trẻ ở Việt Nam thích dành thời gian cùng nhau làm các hoạt động ngoài trời.", "tags": ["grammar"], "vis": ["spending (V-ing, đúng: prefer + V-ing)", "spend (nguyên mẫu, thiếu to/-ing)", "spent (quá khứ, sai)", "to spend (to-V, không phải đáp án chính)"]}, {"q": "4. My sister hates ______ up early to do exercise.", "options": ["getting", "get", "gets", "to get"], "answer": 0, "explanation": "\"hate\" theo sau bởi V-ing hoặc to-V; đáp án chính thức là getting.", "vi": "Chị tôi ghét việc dậy sớm để tập thể dục.", "tags": ["grammar"], "vis": ["getting (V-ing, đúng: hate + V-ing)", "get (nguyên mẫu, thiếu to/-ing)", "gets (chia sai)", "to get (to-V, không phải đáp án chính)"]}, {"q": "5. Nam usually _________ football with his friends after school.", "options": ["plays", "playing", "play", "to play"], "answer": 0, "explanation": "Chủ ngữ số ít \"Nam\", thì hiện tại đơn → plays.", "vi": "Nam thường chơi bóng đá với bạn bè sau giờ học.", "tags": ["grammar"], "vis": ["chơi (chia đúng ngôi thứ 3 số ít 'plays')", "chơi (V-ing, sai vì cần động từ chính)", "chơi (nguyên mẫu, thiếu -s)", "chơi (to-V, sai cấu trúc)"]}, {"q": "6. ________ helps to improve physical health and sometimes gives us a chance to make friends.", "options": ["Messaging", "Playing computer games", "Surfing the net", "Playing sports"], "answer": 3, "explanation": "Chơi thể thao giúp cải thiện sức khỏe thể chất và có cơ hội kết bạn.", "vi": "Chơi thể thao giúp cải thiện sức khỏe thể chất và đôi khi cho ta cơ hội kết bạn.", "tags": ["mixed"], "vis": ["Nhắn tin", "Chơi trò chơi điện tử", "Lướt mạng", "Chơi thể thao (đúng — cải thiện sức khỏe & kết bạn)"]}, {"q": "7. Mark spends a lot of time ________ the internet. He visits one website after another just to watch short videos.", "options": ["doing", "taking", "surfing", "knitting"], "answer": 2, "explanation": "\"surf the internet\" = lướt mạng.", "vi": "Mark dành nhiều thời gian lướt mạng. Cậu ấy vào hết trang này đến trang khác chỉ để xem video ngắn.", "tags": ["mixed"], "vis": ["làm (chung chung, sai)", "lấy, mang (sai nghĩa)", "lướt (đúng: surf the internet)", "đan len (sai nghĩa)"]}, {"q": "8. Our cousins detest ________ books and _________ .", "options": ["reading / draw", "reading / drawing", "to read / to draw", "read/ draw"], "answer": 1, "explanation": "Hai động từ song song sau \"detest\" phải cùng dạng V-ing: reading / drawing.", "vi": "Anh chị em họ của chúng tôi rất ghét đọc sách và vẽ.", "tags": ["grammar"], "vis": ["reading / draw (không song song)", "reading / drawing (đúng: hai V-ing song song sau detest)", "to read / to draw (sai cấu trúc)", "read/ draw (nguyên mẫu, sai)"]}, {"q": "9. Alice spends a lot of time _______ her own; she always exercises regularly and does what she enjoys.", "options": ["on", "in", "about", "for"], "answer": 0, "explanation": "\"spend time on your own\" = dành thời gian một mình.", "vi": "Alice dành nhiều thời gian ở một mình; cô ấy luôn tập thể dục đều đặn và làm những gì mình thích.", "tags": ["mixed"], "vis": ["on (đúng: spend time on your own = dành thời gian một mình)", "in (sai giới từ)", "about (sai giới từ)", "for (sai giới từ)"]}, {"q": "10. _______ is a design that you use to make something.", "options": ["Pattern", "Pastime", "Needles", "A and B are correct"], "answer": 0, "explanation": "\"pattern\" = mẫu, khuôn thiết kế dùng để tạo ra vật gì đó.", "vi": "Mẫu (pattern) là một thiết kế mà bạn dùng để làm ra thứ gì đó.", "tags": ["vocab"], "vis": ["Mẫu, khuôn thiết kế (đúng)", "Thú vui, việc làm lúc rảnh", "Kim đan len", "Cả A và B đều đúng"]}, {"q": "11. _________ do you do with your friends in your free time?", "options": ["What", "How", "Who", "When"], "answer": 0, "explanation": "Câu hỏi về hoạt động → What.", "vi": "Bạn làm gì với bạn bè trong thời gian rảnh?", "tags": ["vocab"], "vis": ["Cái gì (đúng — hỏi về hoạt động)", "Như thế nào", "Ai", "Khi nào"]}, {"q": "12. _______ is small circles of wool made around knitting needles.", "options": ["Stitches", "Magical", "Pastime", "Pattern"], "answer": 0, "explanation": "\"stitches\" = các mũi đan (vòng len nhỏ quanh que đan).", "vi": "Các mũi đan là những vòng len nhỏ được tạo quanh que đan.", "tags": ["vocab"], "vis": ["Các mũi đan (đúng)", "Kỳ diệu, huyền bí", "Thú vui", "Mẫu, khuôn thiết kế"]}, {"q": "13. Origami is the art of paper _________.", "options": ["fold", "folding", "to fold", "folds"], "answer": 1, "explanation": "\"paper folding\" = nghệ thuật gấp giấy (danh từ ghép).", "vi": "Origami là nghệ thuật gấp giấy.", "tags": ["vocab"], "vis": ["gấp (nguyên mẫu, sai — cần danh từ ghép)", "gấp (danh động từ, đúng: paper folding = gấp giấy)", "gấp (to-V, sai)", "gấp (chia số ít, sai)"]}, {"q": "14. About favorite leisure activities, she and I share many things in _______.", "options": ["similarity", "general", "common", "the same"], "answer": 2, "explanation": "\"have things in common\" = có nhiều điểm chung.", "vi": "Về các hoạt động giải trí yêu thích, cô ấy và tôi có nhiều điểm chung.", "tags": ["vocab"], "vis": ["sự giống nhau (danh từ, sai cụm)", "chung chung", "chung, giống nhau (đúng: have things in common)", "giống hệt"]}, {"q": "15. It rained hard. ______, my father went to work.", "options": ["Therefore", "However", "Because", "A and B are correct"], "answer": 1, "explanation": "Ý tương phản (trời mưa to nhưng bố vẫn đi làm) → However.", "vi": "Trời mưa to. Tuy nhiên, bố tôi vẫn đi làm.", "tags": ["mixed"], "vis": ["Vì vậy", "Tuy nhiên (đúng — ý tương phản)", "Bởi vì", "Cả A và B đều đúng"]}, {"q": "16. It was cold and wet, ______ Bob still went to the beach.", "options": ["therefore", "so", "but", "because"], "answer": 2, "explanation": "Ý tương phản (trời lạnh ướt nhưng Bob vẫn đi biển) → but.", "vi": "Trời lạnh và ẩm ướt, nhưng Bob vẫn đi biển.", "tags": ["mixed"], "vis": ["vì vậy", "vì vậy", "nhưng (đúng — ý tương phản)", "bởi vì"]}, {"q": "17. _______ is something that you enjoy doing when you are not working", "options": ["Pastime", "Pattern", "Magical", "Stitches"], "answer": 0, "explanation": "\"pastime\" = thú vui, việc bạn thích làm khi không phải làm việc.", "vi": "Thú vui (pastime) là điều bạn thích làm khi không phải làm việc.", "tags": ["vocab"], "vis": ["Thú vui (đúng)", "Mẫu, khuôn thiết kế", "Kỳ diệu", "Các mũi đan"]}, {"q": "18. Visiting _______ increases my knowledge about cultures in the past.", "options": ["museums", "cinemas", "hometown", "city"], "answer": 0, "explanation": "Thăm bảo tàng giúp tăng hiểu biết về văn hóa trong quá khứ.", "vi": "Việc thăm các bảo tàng giúp tôi tăng thêm hiểu biết về các nền văn hóa trong quá khứ.", "tags": ["vocab"], "vis": ["bảo tàng (đúng)", "rạp chiếu phim", "quê hương", "thành phố"]}, {"q": "19. ________ is having a special quality that makes something seem different from ordinary things.", "options": ["Stitches", "Similarity", "Magical", "creative"], "answer": 2, "explanation": "\"magical\" = có phẩm chất đặc biệt khiến thứ gì đó khác biệt so với bình thường.", "vi": "Từ \"magical\" chỉ việc có một phẩm chất đặc biệt khiến điều gì đó có vẻ khác so với những thứ bình thường.", "tags": ["vocab"], "vis": ["Các mũi đan", "Sự giống nhau", "Kỳ diệu, đặc biệt (đúng)", "sáng tạo"]}, {"q": "20. Last school year, my students were very keen on _______. They decorated and repaired the classroom by themselves.", "options": ["cooking", "doing origami", "doing DIY", "playing sports"], "answer": 2, "explanation": "Tự trang trí, sửa chữa lớp học → doing DIY.", "vi": "Năm học trước, học sinh của tôi rất say mê làm đồ tự chế (DIY). Các em đã tự trang trí và sửa chữa lớp học.", "tags": ["mixed"], "vis": ["nấu ăn", "gấp giấy nghệ thuật", "làm đồ tự chế (đúng — tự trang trí, sửa lớp học)", "chơi thể thao"]}, {"q": "21. ________ is an increasingly popular method of communicating over the internet. People often send short messages using a mobile phone or computer.", "options": ["Messaging", "Volunteering", "Snowboarding", "Knitting"], "answer": 0, "explanation": "Gửi tin nhắn ngắn qua điện thoại/máy tính → Messaging.", "vi": "Nhắn tin là một phương thức giao tiếp qua internet ngày càng phổ biến.", "tags": ["vocab"], "vis": ["Nhắn tin (đúng)", "Làm tình nguyện", "Trượt ván tuyết", "Đan len"]}, {"q": "22. Minh ______ to play football, and so does his brother.", "options": ["likes", "enjoys", "fancies", "detest"], "answer": 0, "explanation": "\"like to V\" đúng ngữ pháp và hợp nghĩa; \"fancy\" và \"enjoy\" không đi với to-V.", "vi": "Minh thích chơi bóng đá, và anh trai cậu ấy cũng vậy.", "tags": ["grammar"], "vis": ["thích (đúng, đi được với to-V)", "thích thú (chỉ đi với V-ing, sai)", "thích, muốn (chỉ đi với V-ing, sai)", "ghét (sai nghĩa & thiếu -s)"]}, {"q": "23. She loves going out _______ her friends.", "options": ["for", "with", "between", "in"], "answer": 1, "explanation": "\"go out with sb\" = đi chơi cùng ai.", "vi": "Cô ấy rất thích đi chơi cùng bạn bè.", "tags": ["mixed"], "vis": ["cho", "với, cùng (đúng: go out with sb)", "giữa", "trong, vào"]}, {"q": "24. Ms. Janny loves _______very much. There are a lot of beautiful flowers and fresh vegetables in her garden.", "options": ["doing gardening", "to doing garden", "to do garden", "do gardening"], "answer": 0, "explanation": "\"do gardening\" ở dạng V-ing sau \"loves\": doing gardening.", "vi": "Cô Janny rất thích làm vườn. Trong vườn của cô có rất nhiều hoa đẹp và rau tươi.", "tags": ["grammar"], "vis": ["làm vườn (V-ing, đúng)", "làm vườn (sai — 'to doing' không tồn tại)", "làm vườn (to + V nguyên mẫu, sai sau loves)", "làm vườn (nguyên mẫu, thiếu -ing)"]}, {"q": "25. I'm so thirsty after a long run. I would like _________ a full glass of orange juice.", "options": ["drink", "to drink", "drank", "drinking"], "answer": 1, "explanation": "\"would like to V\" = muốn làm gì.", "vi": "Tôi khát nước quá sau khi chạy một quãng dài. Tôi muốn uống một ly nước cam đầy.", "tags": ["grammar"], "vis": ["uống (nguyên mẫu, sai)", "uống (to-V, đúng: would like to V)", "đã uống (quá khứ, sai)", "uống (V-ing, sai cấu trúc)"]}, {"q": "26. My grandparents love ______ very much. There are a lot of beautiful flowers and fresh vegetables in their garden.", "options": ["doing garden", "doing gardening", "do gardening", "to do garden"], "answer": 1, "explanation": "\"do gardening\" ở dạng V-ing sau \"love\": doing gardening.", "vi": "Ông bà tôi rất thích làm vườn. Trong vườn của ông bà có rất nhiều hoa đẹp và rau tươi.", "tags": ["grammar"], "vis": ["làm vườn (sai — thiếu -ing ở 'garden')", "làm vườn (V-ing, đúng)", "làm vườn (nguyên mẫu, sai)", "làm vườn (to + V nguyên mẫu, sai cấu trúc)"]}, {"q": "27. You should avoid ______ too much TV. It's not good for your eyes.", "options": ["seeing", "looking", "watching", "glancing"], "answer": 2, "explanation": "\"avoid + V-ing\"; \"watch TV\" là collocation đúng.", "vi": "Bạn nên tránh xem TV quá nhiều. Điều đó không tốt cho mắt của bạn.", "tags": ["mixed"], "vis": ["nhìn thấy (sai — không đi với TV theo cách này)", "nhìn (sai — không phải collocation đúng)", "xem (đúng: watch TV)", "liếc nhìn (sai nghĩa)"]}, {"q": "28. Most people now enjoy shorter working hours and more _______.", "options": ["message friends", "paper folding", "leisure time", "muscle strength"], "answer": 2, "explanation": "\"leisure time\" = thời gian rảnh rỗi, hợp nghĩa với giờ làm việc ngắn hơn.", "vi": "Hầu hết mọi người hiện nay có giờ làm việc ngắn hơn và nhiều thời gian rảnh hơn.", "tags": ["vocab"], "vis": ["nhắn tin bạn bè", "gấp giấy", "thời gian rảnh rỗi (đúng)", "sức mạnh cơ bắp"]}, {"q": "29. A: How do you feel when you spend time with your mum?", "options": ["Yes, I'd love to.", "I feel very happy.", "I like it too", "I love cooking with her."], "answer": 1, "explanation": "Câu hỏi \"How do you feel...?\" cần trả lời về cảm xúc → I feel very happy.", "vi": "A: Bạn cảm thấy thế nào khi ở bên mẹ? B: Tôi cảm thấy rất vui.", "tags": ["mixed"], "vis": ["Vâng, tôi rất muốn. (sai — không hợp câu hỏi về cảm xúc)", "Tôi cảm thấy rất vui. (đúng — trả lời cảm xúc)", "Tôi cũng thích điều đó. (sai — lạc đề)", "Tôi thích nấu ăn cùng mẹ. (sai — lạc đề)"]}, {"q": "30. A: Would you like to go to the cinema with me?", "options": ["Yes, I watch films every day.", "Yes, I don't like it.", "I'd love to.", "We can go there together."], "answer": 2, "explanation": "Lời mời \"Would you like to...?\" → đồng ý bằng \"I'd love to.\"", "vi": "A: Bạn có muốn đi xem phim với tôi không? B: Tôi rất muốn.", "tags": ["mixed"], "vis": ["Vâng, tôi xem phim mỗi ngày. (sai — không đáp lời mời)", "Vâng, tôi không thích nó. (mâu thuẫn logic — sai)", "Tôi rất muốn. (đúng — nhận lời mời)", "Chúng ta có thể đi cùng nhau. (không tự nhiên bằng đáp án đúng)"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "1. The most popular leisure _____________ in Britain is going for a walk.", "hint": "(act)", "answer": "activity", "explanation": "Sau tính từ \"popular leisure\" và trước động từ \"is\" cần một DANH TỪ → act + ivity = activity.", "vi": "Hoạt động giải trí phổ biến nhất ở Anh là đi bộ.", "family": ["activate (v): kích hoạt", "activation (n): sự kích hoạt", "active (adj): năng động, hoạt bát", "actively (adv): một cách năng động", "activity (n): hoạt động"]}, {"q": "2. To play video games, these computers must be used over a Wi-Fi internet ____________.", "hint": "(connect)", "answer": "connection", "explanation": "Sau tính từ sở hữu \"internet\" cần DANH TỪ → connect + ion = connection.", "vi": "Để chơi trò chơi điện tử, những chiếc máy tính này phải được kết nối qua Wi-Fi.", "family": ["connect (v): kết nối", "connection (n): sự kết nối", "connected (adj): được kết nối, có liên quan", "connecting (adj): đang kết nối (chuyến bay nối chuyến)"]}, {"q": "3. I think badminton is an easy sport which helps to improve my muscle ______________.", "hint": "(strong)", "answer": "strength", "explanation": "Sau tính từ sở hữu \"muscle\" cần DANH TỪ → strong → strength (đổi đuôi bất quy tắc).", "vi": "Tôi nghĩ cầu lông là môn thể thao dễ giúp cải thiện sức mạnh cơ bắp của tôi.", "family": ["strengthen (v): củng cố, làm cho mạnh hơn", "strength (n): sức mạnh, điểm mạnh", "strong (adj): mạnh mẽ", "strongly (adv): một cách mạnh mẽ"]}, {"q": "4. It .is very _______________ to watch these movies. I think you should watch them.", "hint": "(entertain)", "answer": "entertaining", "explanation": "Sau \"very\" cần TÍNH TỪ, chủ ngữ giả \"It\" mang tính chất gây giải trí → entertain + ing = entertaining.", "vi": "Xem những bộ phim này rất thú vị. Tôi nghĩ bạn nên xem chúng.", "family": ["entertain (v): giải trí, chiêu đãi", "entertainment (n): sự giải trí, ngành giải trí", "entertaining (adj): mang tính giải trí, thú vị", "entertainer (n): người làm giải trí", "entertainingly (adv): một cách giải trí, thú vị"]}, {"q": "5. I like doing DIY because it helps me to save money and increase my ____________ as well.", "hint": "(create)", "answer": "creativity", "explanation": "Sau tính từ sở hữu \"my\" cần DANH TỪ chỉ khả năng → create + ivity = creativity.", "vi": "Tôi thích làm đồ tự chế vì nó giúp tôi tiết kiệm tiền và tăng khả năng sáng tạo của mình.", "family": ["create (v): tạo ra, sáng tạo", "creation (n): sự sáng tạo, tác phẩm", "creativity (n): sự sáng tạo (khả năng)", "creative (adj): sáng tạo", "creatively (adv): một cách sáng tạo"]}, {"q": "6. Little John is keen on acting at school shows, and he wants to be a __________ in the future.", "hint": "(comedy)", "answer": "comedian", "explanation": "Sau mạo từ \"a\" cần DANH TỪ CHỈ NGƯỜI → comedy + ian = comedian.", "vi": "Cậu bé John rất say mê diễn kịch ở trường và muốn trở thành diễn viên hài trong tương lai.", "family": ["comedy (n): hài kịch, sự hài hước", "comedian (n): diễn viên hài, người kể chuyện cười", "comic (adj/n): hài hước; truyện tranh", "comical (adj): khôi hài, buồn cười", "comically (adv): một cách khôi hài"]}, {"q": "7. ________improves my overall health and balance, so I practice the sport every weekend.", "hint": "(Snowboard)", "answer": "Snowboarding", "explanation": "Đứng đầu câu, làm chủ ngữ, cần DANH TỪ → Snowboard + ing = Snowboarding.", "vi": "Trượt ván tuyết giúp cải thiện sức khỏe tổng thể và sự cân bằng của tôi.", "family": ["snowboard (v): trượt ván tuyết", "snowboarding (n): môn trượt ván tuyết", "snowboarder (n): người trượt ván tuyết"]}, {"q": "8. Messaging has won ______________ among students nowadays.", "hint": "(popular)", "answer": "popularity", "explanation": "Sau động từ \"won\" cần DANH TỪ → popular + ity = popularity.", "vi": "Nhắn tin đã trở nên phổ biến trong giới học sinh ngày nay.", "family": ["popularize (v): phổ biến hóa", "popularity (n): sự phổ biến", "popular (adj): phổ biến", "popularly (adv): một cách phổ biến"]}, {"q": "9. Having leisure activities is one of the best ways to make you feel _________.", "hint": "(comfort)", "answer": "comfortable", "explanation": "Sau \"feel\" cần TÍNH TỪ → comfort + able = comfortable.", "vi": "Có các hoạt động giải trí là một trong những cách tốt nhất để khiến bạn cảm thấy thoải mái.", "family": ["comfort (v/n): an ủi, làm cho thoải mái; sự thoải mái", "comfortable (adj): thoải mái, dễ chịu", "comfortably (adv): một cách thoải mái", "uncomfortable (adj): không thoải mái", "uncomfortably (adv): một cách không thoải mái"]}, {"q": "10. My dad was _______________ when I could repair my own bike.", "hint": "(surprise)", "answer": "surprised", "explanation": "Sau \"was\" chủ ngữ là người → dùng tính từ đuôi -ed (chỉ cảm xúc của người) → surprised.", "vi": "Bố tôi đã rất ngạc nhiên khi tôi có thể tự sửa xe đạp của mình.", "family": ["surprise (v/n): làm ngạc nhiên; sự ngạc nhiên", "surprised (adj): ngạc nhiên (người cảm thấy)", "surprising (adj): đáng ngạc nhiên (điều gây ra)", "surprisingly (adv): một cách đáng ngạc nhiên"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "A) Mountain climbing", "html": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?", "vi": "Có rất nhiều thú vui mà giới trẻ yêu thích, và một trong số đó là leo núi. Đây là hoạt động có thể làm trong nhà hoặc ngoài trời. Nếu leo núi ngoài trời, đó là cách tuyệt vời để tăng cường sức mạnh và tận hưởng thiên nhiên. Bạn thậm chí có thể dựng một bức tường leo núi trong sân sau hoặc trong nhà mình. Nhiều người học một lớp để biết cách leo và dùng thiết bị hiệu quả. Người khác tham gia câu lạc bộ leo núi để kết bạn mới và cùng nhau leo núi. Nếu bạn năng động và thích hoạt động ngoài trời, sao không thử hoạt động này?"}, "questions": [{"q": "1.", "options": ["them", "they", "theirs", "their"], "answer": 0, "vis": ["họ, chúng (tân ngữ)", "họ, chúng (chủ ngữ)", "của họ (đại từ sở hữu)", "của họ (tính từ sở hữu)"], "explanation": "\"one of them\" = một trong số chúng, cần đại từ tân ngữ sau \"of\"."}, {"q": "2.", "options": ["decrease", "reduce", "increase", "raise"], "answer": 2, "vis": ["giảm bớt, giảm dần", "giảm bớt, thu nhỏ", "tăng cường, gia tăng", "nâng lên, tăng (lương...)"], "explanation": "\"increase your strength\" = tăng cường sức mạnh của bạn."}, {"q": "3.", "options": ["indoor", "inside", "within", "among"], "answer": 1, "vis": ["trong nhà (tính từ)", "bên trong (giới từ)", "trong vòng, phạm vi", "giữa, trong số"], "explanation": "\"inside your home\" = bên trong nhà bạn (giới từ + your home)."}, {"q": "4.", "options": ["keep", "stay", "go", "give"], "answer": 1, "vis": ["giữ (nghĩa chung)", "giữ (ở trạng thái, stay fit)", "đi", "cho, đưa"], "explanation": "\"stay fit\" = giữ dáng, giữ sức khỏe tốt."}, {"q": "5.", "options": ["effective", "effect", "effectively", "effectiveness"], "answer": 2, "vis": ["hiệu quả (tính từ)", "hiệu quả (danh từ)", "một cách hiệu quả (trạng từ)", "tính hiệu quả (danh từ)"], "explanation": "Trạng từ bổ nghĩa cho động từ \"use\": effectively (một cách hiệu quả)."}, {"q": "6.", "options": ["what", "when", "how", "why"], "answer": 3, "vis": ["cái gì", "khi nào", "như thế nào", "tại sao (why don't you...?)"], "explanation": "\"Why don't you...?\" = sao bạn không...? (lời đề nghị)."}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "B) Leisure time with family", "html": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them.", "vi": "Một số thanh thiếu niên thích dành thời gian rảnh với bạn bè. Người khác lại thích làm hoạt động giải trí cùng gia đình. Tôi thích dành thời gian với gia đình vì đó là cách tuyệt vời để gắn kết với họ. Cuối tuần chúng tôi thường đạp xe đến các làng gần đó để tận hưởng không khí trong lành. Anh trai tôi và tôi cũng thích nấu ăn, tìm công thức đơn giản rồi chuẩn bị nguyên liệu và nấu. Hoạt động tôi thích nhất là làm dự án DIY cùng mẹ — mẹ dạy tôi may váy và quần áo búp bê; tôi từng giành giải nhất trong một cuộc thi trang phục ở trường nhờ mẹ giúp đỡ."}, "questions": [{"q": "1.", "options": ["spending", "to spend", "spend", "spends"], "answer": 0, "vis": ["dành (V-ing, sau enjoy)", "dành (to-V, sai cấu trúc)", "dành (nguyên thể, sai)", "dành (số ít, sai chủ ngữ)"], "explanation": "\"enjoy + V-ing\" = thích thú làm gì."}, {"q": "2.", "options": ["to", "with", "from", "on"], "answer": 1, "vis": ["đến (sai)", "với, cùng (connect with)", "từ (sai)", "trên, vào (sai)"], "explanation": "\"connect with sb\" = kết nối, gắn kết với ai."}, {"q": "3.", "options": ["air pollution", "water pollution", "environmental pollution", "fresh air"], "answer": 3, "vis": ["ô nhiễm không khí", "ô nhiễm nước", "ô nhiễm môi trường", "không khí trong lành"], "explanation": "Đạp xe ra làng quê để tận hưởng không khí trong lành → fresh air."}, {"q": "4.", "options": ["eat", "cook", "cooks", "cooking"], "answer": 1, "vis": ["ăn", "nấu (nguyên thể, song song với \"prepare\")", "nấu (số ít, sai)", "nấu (V-ing, sai)"], "explanation": "\"prepare the ingredients and cook\" — hai động từ nguyên thể song song sau \"we\"."}, {"q": "5.", "options": ["award", "gift", "prize", "medal"], "answer": 2, "vis": ["giải thưởng (chung)", "món quà", "giải (thi đấu, cuộc thi)", "huy chương"], "explanation": "\"win the first prize\" = giành giải nhất (trong cuộc thi trang phục)."}, {"q": "6.", "options": ["connect", "connecting", "connected", "connection"], "answer": 0, "vis": ["kết nối (nguyên thể, sau to)", "đang kết nối", "đã kết nối", "sự kết nối (danh từ)"], "explanation": "\"a great way to connect with them\" = to + V nguyên thể."}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Teenagers' leisure activities", "html": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills.", "vi": "Ngày nay, thanh thiếu niên thường có nhiều hoạt động giải trí khác nhau. Một số thích hoạt động trong nhà như chơi game, lướt mạng, làm đồ tự chế. Người khác thích hoạt động ngoài trời như thể thao, đạp xe, đi chơi cùng bạn bè. Thanh thiếu niên được gọi là \"thế hệ công nghệ\" vì dành nhiều thời gian cho thiết bị. Tuy nhiên, tham gia câu lạc bộ hay làm bộ dụng cụ thủ công cũng là lựa chọn phổ biến, giúp các em thư giãn và phát triển kỹ năng mới."}, "questions": [{"q": "1. Teenagers nowadays only prefer indoor activities in their free time.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nêu cả hoạt động trong nhà lẫn ngoài trời, không chỉ trong nhà → Sai."}, {"q": "2. Teenagers are called a “technology generation” because they spend a lot of time on devices.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Teenagers can be called a 'technology generation' because they spend much of their free time on devices\" → Đúng."}, {"q": "3. Joining clubs and doing craft kits are unpopular choices for teenagers.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"joining clubs or doing craft kits are also popular choices\" → Sai."}, {"q": "4. Leisure activities only help teenagers relax but do not help them develop skills.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"These activities help them relax and develop new skills\" → Sai."}, {"q": "5. _______ with friends are considered outdoor activities.", "options": ["Cycling and hanging out", "Joining clubs and doing craft kits", "Leisure activities", "Surfing and doing DIYs"], "answer": 0, "explanation": "Bài đọc: \"outdoor activities such as sports, cycling, or hanging out with friends\"."}, {"q": "6. Other teenagers like outdoor activities such as _________ with friends.", "options": ["sports", "cycling", "hanging out", "A, B and C are correct"], "answer": 3, "explanation": "Bài đọc liệt kê cả ba: sports, cycling, hanging out with friends."}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Nam's DIY hobby", "html": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time.", "vi": "Tôi tên là Nam. Trong thời gian rảnh, tôi thích làm đồ tự chế cùng bạn bè cũ. Tuần trước, chị tôi và tôi đã làm một ngôi nhà giấy nhỏ, mất 3 tiếng. Việc này không tốn nhiều tiền nhưng đòi hỏi nhiều kiên nhẫn. Mẹ tôi cũng dạy tôi đan len, giờ tôi có thể tự đan khăn quàng nhỏ. Ngoài ra tôi thích lướt mạng tìm công thức nướng bánh mới, thỉnh thoảng nướng bánh cho gia đình vào chiều Chủ nhật. Làm những việc này giúp tôi thư giãn và tránh xa màn hình."}, "questions": [{"q": "1. Nam and his sister made a paper house in three hours.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"my sister and I made a small paper house, which took us 3 hours\" → Đúng."}, {"q": "2. Making a paper house is very expensive.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"It doesn't cost much\" → Sai."}, {"q": "3. Nam's mother showed him how to knit.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"My mother also taught me how to knit\" → Đúng."}, {"q": "4. Nam can knit a large blanket.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"I can knit a small scarf\" (khăn quàng nhỏ), không phải chăn lớn → Sai."}, {"q": "5. Nam enjoys _____ the Internet for new baking recipes.", "options": ["searching", "knitting", "banking", "surfing"], "answer": 3, "explanation": "Bài đọc: \"I love surfing the Internet to find new recipes for baking\"."}, {"q": "6. Doing DIYs and baking makes Nam feel ____________.", "options": ["enjoyable", "pleased", "tired", "happy"], "answer": 0, "explanation": "Theo đáp án chính thức của đề cương: enjoyable (thú vị, đáng tận hưởng)."}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "1.", "original": "It is really interesting for him to talk with his music teacher about jazz.", "starter": "He fancies", "answer": "talking with his music teacher about jazz", "accepted": null, "explanation": "It is interesting for sb to V = sb fancies + V-ing.", "vi": "Việc trò chuyện với giáo viên âm nhạc về nhạc jazz thực sự rất thú vị đối với cậu ấy.", "note": "It is interesting for sb to V → sb + fancies + V-ing"}, {"q": "2.", "original": "Watching historical films is very interesting to my younger brother.", "starter": "My younger brother enjoys", "answer": "watching historical films", "accepted": null, "explanation": "V-ing... is interesting to sb = sb + enjoys + V-ing.", "vi": "Xem phim lịch sử rất thú vị đối với em trai tôi.", "note": "V-ing + be interesting to sb → sb + enjoys + V-ing"}, {"q": "3.", "original": "We usually visit museums when we have leisure time.", "starter": "We enjoy", "answer": "visiting museums when we have leisure time", "accepted": null, "explanation": "usually + V (hiện tại đơn) = enjoy + V-ing.", "vi": "Chúng tôi thường đi thăm bảo tàng khi có thời gian rảnh.", "note": "S + usually + V → S + enjoy + V-ing"}, {"q": "4.", "original": "He likes swimming and sunbathing.", "starter": "He is interested", "answer": "in swimming and sunbathing", "accepted": null, "explanation": "like + V-ing = be interested in + V-ing.", "vi": "Anh ấy thích bơi lội và tắm nắng.", "note": "S + like + V-ing → S + be interested in + V-ing"}, {"q": "5.", "original": "It is not a problem to me whether I have to pick her up to the cinema or not.", "starter": "I don't mind", "answer": "picking her up to the cinema", "accepted": null, "explanation": "It is not a problem to sb whether... = sb don't mind + V-ing.", "vi": "Việc tôi có phải đón cô ấy đi xem phim hay không cũng không phải vấn đề gì với tôi.", "note": "It is not a problem to sb whether S + V or not → S + don't mind + V-ing"}, {"q": "6.", "original": "Ngoc dislikes doing any sports or exercises, so her health is not good enough to study.", "starter": "Ngoc doesn't like", "answer": "doing any sports or exercises, so her health is not good enough to study", "accepted": null, "explanation": "dislike + V-ing = don't/doesn't like + V-ing (đồng nghĩa).", "vi": "Ngọc không thích chơi thể thao hay tập thể dục, vì vậy sức khỏe của bạn ấy không đủ tốt để học.", "note": "S + dislike(s) + V-ing → S + don't/doesn't like + V-ing"}, {"q": "7.", "original": "She cannot bear talking with him about what he likes.", "starter": "She hates", "answer": "talking with him about what he likes", "accepted": null, "explanation": "cannot bear + V-ing = hate(s) + V-ing (đồng nghĩa).", "vi": "Cô ấy không thể chịu đựng được việc nói chuyện với anh ta về những gì anh ta thích.", "note": "S + can't bear + V-ing → S + hate(s) + V-ing"}, {"q": "8.", "original": "Jane likes skateboarding although this has hurt her leg and arm some times.", "starter": "Jane fancies", "answer": "skateboarding although this has hurt her leg and arm some times", "accepted": null, "explanation": "like + V-ing = fancy/fancies + V-ing (đồng nghĩa).", "vi": "Jane thích trượt ván mặc dù việc này đã làm cô ấy bị đau chân và tay vài lần.", "note": "S + like(s) + V-ing → S + fancies + V-ing"}, {"q": "9.", "original": "The thing that I hate most is motor racing, and I will never do it in my life.", "starter": "I detest", "answer": "motor racing, and I will never do it in my life", "accepted": null, "explanation": "the thing I hate most is N = detest + N (đồng nghĩa, ghét cay ghét đắng).", "vi": "Điều tôi ghét nhất là đua xe, và tôi sẽ không bao giờ làm việc đó trong đời.", "note": "The thing that I hate most is + N → I + detest + N"}, {"q": "10.", "original": "I don't like to get up early and prepare breakfast in the cold winter days.", "starter": "I hate", "answer": "getting up early and preparing breakfast on cold winter days", "accepted": ["getting up early and preparing breakfast on cold winter days", "getting up early and preparing breakfast in the cold winter days"], "explanation": "don't like + to-V = hate + V-ing (đồng nghĩa).", "vi": "Tôi không thích dậy sớm và chuẩn bị bữa sáng vào những ngày mùa đông lạnh giá.", "note": "S + don't like + to V → S + hate + V-ing"}, {"q": "11.", "original": "Lan spends 3 hours a day doing her homework.", "starter": "It takes Lan", "answer": "3 hours a day to do her homework", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Lan mất 3 tiếng mỗi ngày để làm bài tập về nhà.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"q": "12.", "original": "My sister spends 30 minutes walking to school every day.", "starter": "It takes my sister", "answer": "30 minutes to walk to school every day", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Chị tôi mất 30 phút để đi bộ đến trường mỗi ngày.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"q": "13.", "original": "They spent two months building this bridge.", "starter": "It took them", "answer": "two months to build this bridge", "accepted": null, "explanation": "Ở thì quá khứ: S + spent + time + V-ing = It took + O + time + to V.", "vi": "Họ đã mất hai tháng để xây cây cầu này.", "note": "S + spent + time + V-ing → It took + O + time + to V"}, {"q": "14.", "original": "We spend 15 minutes cleaning our classroom after school.", "starter": "It takes us", "answer": "15 minutes to clean our classroom after school", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Chúng tôi mất 15 phút để dọn lớp sau giờ học.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"q": "15.", "original": "Her grandmother spends an hour gardening every day.", "starter": "It takes her grandmother", "answer": "an hour to garden every day", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Bà của cô ấy mất một tiếng để làm vườn mỗi ngày.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"leisure\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "leisure", "ipa": "/ˈleʒər/", "pos": "noun", "senses": [{"def": "the time when you are not working or studying and can relax and do things that you enjoy.", "examples": ["Leisure activities such as cycling or gardening help reduce daily stress.", "Most people only have a little leisure time during the busy workweek.", "The new community center offers excellent leisure facilities for sports and hobbies."]}], "vi": "<b>leisure</b> /ˈleʒər/ (danh từ)<br>khoảng thời gian khi bạn không phải làm việc hay học tập và có thể thư giãn, làm những điều mình thích.<br>• Các hoạt động giải trí như đạp xe hay làm vườn giúp giảm căng thẳng.<br>• Hầu hết mọi người chỉ có một ít thời gian rảnh trong tuần bận rộn.<br>• Trung tâm cộng đồng mới có cơ sở giải trí tuyệt vời cho thể thao và sở thích."}, "questions": [{"q": "A. The government is building new _________ like swimming pools for the residents.", "answer": "leisure facilities", "explanation": "Dựa vào ví dụ: leisure facilities.", "vi": "Chính phủ đang xây các cơ sở giải trí mới như hồ bơi cho cư dân."}, {"q": "B. Playing sports and collecting stamps are healthy _______ that help teenagers relax after school.", "answer": "leisure activities", "explanation": "Dựa vào ví dụ: leisure activities.", "vi": "Chơi thể thao và sưu tầm tem là những hoạt động giải trí lành mạnh giúp thanh thiếu niên thư giãn."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"entertainment\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "entertainment", "ipa": "/ˌentərˈteɪnmənt/", "pos": "noun", "senses": [{"def": "[uncountable, countable] films, music, etc. used to entertain people; an example of this.", "examples": ["Radio, television and other forms of entertainment.", "There will be live entertainment at the party.", "It was typical family entertainment."]}], "vi": "<b>entertainment</b> /ˌentərˈteɪnmənt/ (danh từ)<br>phim ảnh, âm nhạc,... dùng để giải trí cho mọi người; một ví dụ về điều này.<br>• Radio, truyền hình và các hình thức giải trí khác.<br>• Sẽ có buổi biểu diễn trực tiếp tại bữa tiệc.<br>• Đó là một chương trình giải trí gia đình điển hình."}, "questions": [{"q": "A. There will be __________ at the hotel party tonight, including singers and dancers.", "answer": "live entertainment", "explanation": "Dựa vào ví dụ: live entertainment.", "vi": "Sẽ có buổi biểu diễn trực tiếp tại bữa tiệc khách sạn tối nay, gồm ca sĩ và vũ công."}, {"q": "B. Radio, television and the Internet are popular __________ for people of all ages.", "answer": "forms of entertainment", "explanation": "Dựa vào ví dụ: forms of entertainment.", "vi": "Radio, truyền hình và Internet là những hình thức giải trí phổ biến với mọi lứa tuổi."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-44 bg-white border-2 border-slate-200 rounded-xl p-3 shadow-sm\"><svg viewBox=\"0 0 100 100\" class=\"w-16 h-16\" aria-hidden=\"true\"><rect x=\"10\" y=\"10\" width=\"80\" height=\"80\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#f59e0b\" stroke-width=\"4\"/><path d=\"M20 70 L45 30 L60 55 L70 40 L82 70 Z\" fill=\"#0891b2\"/><circle cx=\"30\" cy=\"25\" r=\"7\" fill=\"#f59e0b\"/><line x1=\"14\" y1=\"78\" x2=\"86\" y2=\"78\" stroke=\"#7c2d12\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight mt-1\">QUAYSIDE OR RIVERBANK AHEAD</p></div>", "options": ["Dangerous dip", "Slippery road", "Quayside or riverbank ahead", "Compulsory ahead only"], "answer": 2, "vis": ["Chỗ trũng nguy hiểm", "Đường trơn trượt", "Phía trước có bến tàu hoặc bờ sông", "Chỉ được đi thẳng (bắt buộc)"], "explanation": "Biển báo hình chữ nhật màu vàng với người đi về phía mép nước cảnh báo có bến tàu/bờ sông phía trước."}, {"q": "2. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫🧒💺</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">FRONT SEATS: NOT FOR CHILDREN</p></div>", "options": ["The front seats are only for children.", "Children are not allowed to sit here.", "Adults have to sit at the front.", "There is no more seat for adults."], "answer": 1, "vis": ["Ghế trước chỉ dành cho trẻ em.", "Trẻ em không được phép ngồi ở đây.", "Người lớn phải ngồi ở phía trước.", "Không còn ghế nào cho người lớn."], "explanation": "Biểu tượng cấm trẻ em ngồi ghế trước → trẻ em không được phép ngồi ở đây."}, {"q": "3. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><svg viewBox=\"0 0 100 100\" class=\"w-16 h-16\" aria-hidden=\"true\"><rect x=\"10\" y=\"10\" width=\"80\" height=\"80\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#16a34a\" stroke-width=\"4\"/><rect x=\"18\" y=\"55\" width=\"64\" height=\"20\" fill=\"#16a34a\" opacity=\"0.5\"/><circle cx=\"40\" cy=\"35\" r=\"9\" fill=\"#fbbf24\"/><path d=\"M40 44 L40 60 M40 60 L30 75 M40 60 L50 75\" stroke=\"#7c2d12\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"14\" y1=\"82\" x2=\"86\" y2=\"18\" stroke=\"#dc2626\" stroke-width=\"5\"/></svg><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight mt-1\">KEEP OFF THE GRASS</p></div>", "options": ["Do not leave your feet touching the grass.", "Riding your bicycle in this area.", "You can play soccer in this place.", "You can throw the trash here."], "answer": 0, "vis": ["Không được để chân chạm vào cỏ.", "Được đi xe đạp trong khu vực này.", "Có thể chơi bóng đá ở đây.", "Có thể vứt rác ở đây."], "explanation": "Biển \"Keep off the grass\" với hình gạch chéo trên bãi cỏ → không được giẫm/để chân chạm cỏ."}, {"q": "4. What does the sign warn drivers?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">📵🚗</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO PHONE WHILE DRIVING</p></div>", "options": ["not to use your phone when driving.", "to talk with friends when driving.", "not to play games when driving.", "to drive and keep your phone in hand."], "answer": 0, "vis": ["không dùng điện thoại khi lái xe.", "nói chuyện với bạn bè khi lái xe.", "không chơi game khi lái xe.", "lái xe và cầm điện thoại trên tay."], "explanation": "Biểu tượng điện thoại gạch chéo trên nền xe hơi → cấm dùng điện thoại khi lái xe."}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 1", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 1 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>school</b> <span class='text-slate-400'>/skuːl/</span> · <b class='text-slate-500'>school</b> <span class='text-slate-400'>/skuːl/</span> · <b class='text-emerald-700'>door</b> <span class='text-slate-400'>/dɔːr/</span> · <b class='text-slate-500'>pool</b> <span class='text-slate-400'>/puːl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"door\" phát âm /ɔː/, các từ còn lại có \"oo\" phát âm /uː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>choose</b> <span class='text-slate-400'>/tʃuːz/</span> · <b class='text-slate-500'>cool</b> <span class='text-slate-400'>/kuːl/</span> · <b class='text-emerald-700'>good</b> <span class='text-slate-400'>/ɡʊd/</span> · <b class='text-slate-500'>tool</b> <span class='text-slate-400'>/tuːl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"good\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>june</b> <span class='text-slate-400'>/dʒuːn/</span> · <b class='text-emerald-700'>bull</b> <span class='text-slate-400'>/bʊl/</span> · <b class='text-slate-500'>truth</b> <span class='text-slate-400'>/truːθ/</span> · <b class='text-slate-500'>flu</b> <span class='text-slate-400'>/fluː/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"bull\" có \"u\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-emerald-700'>pictures</b> <span class='text-slate-400'>/ˈpɪktʃərz/</span> · <b class='text-slate-500'>watches</b> <span class='text-slate-400'>/ˈwɒtʃɪz/</span> · <b class='text-slate-500'>buses</b> <span class='text-slate-400'>/ˈbʌsɪz/</span> · <b class='text-slate-500'>brushes</b> <span class='text-slate-400'>/ˈbrʌʃɪz/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"pictures\" có đuôi \"-s\" phát âm /z/, ba từ còn lại có đuôi \"-es\" phát âm /ɪz/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-emerald-700'>woman</
