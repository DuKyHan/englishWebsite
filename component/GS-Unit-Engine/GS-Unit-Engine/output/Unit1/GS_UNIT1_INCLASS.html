='text-slate-400'>/ˈlɪsn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"listen\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>10. <b class='text-emerald-700'>detest</b> <span class='text-slate-400'>/dɪˈtest/</span> · <b class='text-slate-500'>message friends</b> <span class='text-slate-400'>/ˈmesɪdʒ frendz/</span> · <b class='text-slate-500'>folding</b> <span class='text-slate-400'>/ˈfoʊldɪŋ/</span> · <b class='text-slate-500'>fancy</b> <span class='text-slate-400'>/ˈfænsi/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"detest\" trọng âm rơi vào âm tiết 2, ba từ/cụm còn lại trọng âm chính rơi vào âm tiết 1.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Verbs of liking + gerunds / to-infinitives</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\"></th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ (Anh - Việt)</th></tr>\n      <tr class=\"bg-emerald-50\"><td class=\"border px-2 py-1 font-bold\" rowspan=\"8\">LIKING<br><span class=\"font-normal text-xs\">(thích)</span></td><td class=\"border px-2 py-1 font-bold\">Adore + V-ing</td><td class=\"border px-2 py-1 italic\">I adore watching movies.<br><span class=\"not-italic text-slate-500\">Tôi rất mê xem phim.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Love + V-ing / to V</td><td class=\"border px-2 py-1 italic\">She loves learning English. / She loves to learn English.<br><span class=\"not-italic text-slate-500\">Cô ấy rất thích học tiếng Anh.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Enjoy + V-ing</td><td class=\"border px-2 py-1 italic\">He enjoys listening to music.<br><span class=\"not-italic text-slate-500\">Anh ấy thích nghe nhạc.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Fancy + V-ing</td><td class=\"border px-2 py-1 italic\">Do they fancy skiing?<br><span class=\"not-italic text-slate-500\">Họ có thích trượt tuyết không?</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Like + V-ing / to V</td><td class=\"border px-2 py-1 italic\">I like playing football. / I like to play football.<br><span class=\"not-italic text-slate-500\">Tôi thích chơi bóng đá.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Prefer + V-ing / to V</td><td class=\"border px-2 py-1 italic\">My sister prefers dancing. / My sister prefers to dance.<br><span class=\"not-italic text-slate-500\">Chị tôi thích khiêu vũ hơn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Not like + V-ing</td><td class=\"border px-2 py-1 italic\">I don't like eating vegetables.<br><span class=\"not-italic text-slate-500\">Tôi không thích ăn rau.</span></td></tr>\n      <tr class=\"bg-rose-50\"><td class=\"border px-2 py-1 font-bold\">Dislike + V-ing</td><td class=\"border px-2 py-1 italic\">Does he dislike fishing?<br><span class=\"not-italic text-slate-500\">Anh ấy có ghét câu cá không?</span></td></tr>\n      <tr class=\"bg-rose-50\"><td class=\"border px-2 py-1 font-bold\" rowspan=\"3\">DISLIKE<br><span class=\"font-normal text-xs\">(không thích)</span></td><td class=\"border px-2 py-1 font-bold\">Hate + V-ing / to V</td><td class=\"border px-2 py-1 italic\">She hates cleaning the house.<br><span class=\"not-italic text-slate-500\">Cô ấy ghét dọn nhà.</span></td></tr>\n      <tr class=\"bg-rose-50\"><td class=\"border px-2 py-1 font-bold\">Detest + V-ing</td><td class=\"border px-2 py-1 italic\">They detest getting up early.<br><span class=\"not-italic text-slate-500\">Họ ghét cay ghét đắng việc dậy sớm.</span></td></tr>\n      <tr class=\"bg-rose-50\"><td class=\"border px-2 py-1 font-bold\">Not mind + V-ing</td><td class=\"border px-2 py-1 italic\">I don't mind cooking.<br><span class=\"not-italic text-slate-500\">Tôi không phiền việc nấu ăn.</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 <b>fancy, adore, enjoy, mind, detest, dislike</b> chỉ theo sau bởi <b>V-ing</b>. <b>love, like, prefer, hate</b> đi được với cả <b>V-ing</b> và <b>to V</b>.</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-heart mr-1\"></i>2. Expressions used with hobbies</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Verb</th><th class=\"border px-2 py-1\">Cấu trúc tương đương</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\" rowspan=\"5\">Like<br><span class=\"font-normal text-xs\">(thích)</span></td><td class=\"border px-2 py-1\">= Be keen ON</td><td class=\"border px-2 py-1 italic\">I'm keen on music. <span class=\"not-italic text-slate-500\">— Tôi say mê âm nhạc.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be a fan OF</td><td class=\"border px-2 py-1 italic\">I'm a fan of football. <span class=\"not-italic text-slate-500\">— Tôi là fan bóng đá.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be interested IN</td><td class=\"border px-2 py-1 italic\">I'm interested in action movies. <span class=\"not-italic text-slate-500\">— Tôi thích phim hành động.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be hooked ON</td><td class=\"border px-2 py-1 italic\">I'm hooked on playing board games. <span class=\"not-italic text-slate-500\">— Tôi mê chơi cờ bàn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be addicted TO</td><td class=\"border px-2 py-1 italic\">I'm addicted to playing computer games. <span class=\"not-italic text-slate-500\">— Tôi nghiện chơi game.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\" rowspan=\"3\">Love<br><span class=\"font-normal text-xs\">(rất thích)</span></td><td class=\"border px-2 py-1\">= Be obsessed WITH</td><td class=\"border px-2 py-1 italic\">She's obsessed with novels. <span class=\"not-italic text-slate-500\">— Cô ấy mê tiểu thuyết.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be mad ABOUT</td><td class=\"border px-2 py-1 italic\">He's mad about painting. <span class=\"not-italic text-slate-500\">— Anh ấy đam mê hội họa.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be crazy ABOUT</td><td class=\"border px-2 py-1 italic\">She is crazy about taking photos. <span class=\"not-italic text-slate-500\">— Cô ấy mê chụp ảnh.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\" rowspan=\"2\">Dislike<br><span class=\"font-normal text-xs\">(không giỏi/thích)</span></td><td class=\"border px-2 py-1\">= Be bad AT</td><td class=\"border px-2 py-1 italic\">I'm bad at swimming. <span class=\"not-italic text-slate-500\">— Tôi bơi không giỏi.</span></td></tr>\n      <tr><td class=\"border px-2 py-1\">= Be terrible AT</td><td class=\"border px-2 py-1 italic\">I'm terrible at singing. <span class=\"not-italic text-slate-500\">— Tôi hát rất dở.</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Chú ý đúng GIỚI TỪ đi kèm: keen <b>on</b>, interested <b>in</b>, addicted <b>to</b>, obsessed <b>with</b>, mad/crazy <b>about</b>, bad/terrible <b>at</b>.</p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>I fancy to play.</s> ❌ → <b>I fancy playing.</b> ✅ — \"fancy\" chỉ theo sau bởi V-ing, không dùng to-V.</li>\n      <li><s>She enjoys to cook.</s> ❌ → <b>She enjoys cooking.</b> ✅ — \"enjoy\" chỉ đi với V-ing.</li>\n      <li><s>He doesn't mind to wait.</s> ❌ → <b>He doesn't mind waiting.</b> ✅ — \"mind\" chỉ đi với V-ing.</li>\n      <li><s>They detest to get up early.</s> ❌ → <b>They detest getting up early.</b> ✅ — \"detest\" chỉ đi với V-ing.</li>\n      <li><s>I am interested to play football.</s> ❌ → <b>I am interested IN playing football.</b> ✅ — cần giới từ \"in\".</li>\n      <li><s>It take me two hours to do it.</s> ❌ → <b>It takes me two hours to do it.</b> ✅ — chủ ngữ giả \"It\" luôn chia số ít (takes/took).</li>\n      <li><s>I spend two hours to read books.</s> ❌ → <b>I spend two hours reading books.</b> ✅ — \"spend + time\" đi với V-ing, không dùng to-V.</li>\n      <li><s>She is keen with music.</s> ❌ → <b>She is keen ON music.</b> ✅ — \"keen\" đi với giới từ \"on\", không phải \"with\".</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"It is interesting for sb to V = sb + fancy/fancies + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1 (riêng của Unit này)</p>\n      <p class=\"text-sm text-slate-700\">It is interesting for sb to V<br>= sb + fancy(-ies) + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"V-ing... is interesting to sb = sb + enjoy(s) + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2 (riêng của Unit này)</p>\n      <p class=\"text-sm text-slate-700\">V-ing... is interesting to sb<br>= sb + enjoy(s) + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + like(s) + V-ing = S + be interested in + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 3 (riêng của Unit này)</p>\n      <p class=\"text-sm text-slate-700\">S + like(s) + V-ing<br>= S + be interested in + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 4 (riêng của Unit này)</p>\n      <p class=\"text-sm text-slate-700\">S + spend(s)/spent + time + V-ing<br>= It takes/took + O + time + to V</p>\n    </div>\n  </div>\n\n  <div class=\"bg-amber-50 border border-amber-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-amber-800 mb-2\"><i class=\"fa-solid fa-lightbulb mr-1\"></i>Áp dụng phương pháp 6 bước (xem tab \"Cách viết lại câu\") vào bài này</p>\n    <p class=\"text-sm text-slate-700\">Ví dụ: <i>\"It is really interesting for him to talk with his music teacher about jazz.\"</i> → từ gợi ý <b>He fancies</b> cho biết cần dùng Công thức 1 → động từ \"talk\" ở câu gốc → chuyển thành V-ing \"talking\" → giữ nguyên phần còn lại → <b>He fancies talking with his music teacher about jazz.</b></p>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Ngữ pháp</p>\n  <div id=\"miniquiz-grammar\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-grammar\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Word Formation</p>\n  <div id=\"miniquiz-wf\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-wf\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n<div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. leisure</span><span class='text-slate-400 text-xs'>(n) /ˈliːʒər/</span><span class='text-slate-500 text-xs ml-auto'>thời gian rảnh rỗi, sự nhàn rỗi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. leisure time</span><span class='text-slate-400 text-xs'>(n) /ˈliːʒər taɪm/</span><span class='text-slate-500 text-xs ml-auto'>thời gian rảnh rỗi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. leisure activity</span><span class='text-slate-400 text-xs'>(n) /ˈliːʒər ækˈtɪvəti/</span><span class='text-slate-500 text-xs ml-auto'>hoạt động giải trí</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. knit</span><span class='text-slate-400 text-xs'>(v) /nɪt/</span><span class='text-slate-500 text-xs ml-auto'>đan (áo, khăn...)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. knitting kit</span><span class='text-slate-400 text-xs'>(n) /ˈnɪtɪŋ kɪt/</span><span class='text-slate-500 text-xs ml-auto'>bộ dụng cụ đan lát</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. spend</span><span class='text-slate-400 text-xs'>(v) /spend/</span><span class='text-slate-500 text-xs ml-auto'>dành (thời gian, tiền bạc)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. spend time on your own</span><span class='text-slate-400 text-xs'>(phr) /spend taɪm ɒn jɔːr oʊn/</span><span class='text-slate-500 text-xs ml-auto'>dành thời gian một mình</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. DIY (do-it-yourself)</span><span class='text-slate-400 text-xs'>(n, adj) /ˌdiː aɪ ˈwaɪ/</span><span class='text-slate-500 text-xs ml-auto'>tự làm, tự chế</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. puzzle</span><span class='text-slate-400 text-xs'>(n) /ˈpʌzl/</span><span class ];
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true;
  try{ const Ctx=window.AudioContext||window.webkitAudioContext; if(Ctx){ const ctx=new Ctx(); const buf=ctx.createBuffer(1,1,22050); const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0);} }catch(e){}
  try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  loadVoices();
}
document.addEventListener('touchstart', unlockAudio, {once:true, passive:true});
document.addEventListener('click', unlockAudio, {once:true});
function pickBestVoice(){
  if(!cachedVoices.length) return null;
  for(const name of PREFERRED_VOICE_NAMES){ const v=cachedVoices.find(x=>x.name===name); if(v) return v; }
  const usEn = cachedVoices.filter(v=>/en[-_]us/i.test(v.lang));
  if(usEn.length){ const local = usEn.find(v=>v.localService); return local||usEn[0]; }
  const anyEn = cachedVoices.find(v=>/^en/i.test(v.lang));
  return anyEn||null;
}
function loadVoices(){
  cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  chosenVoice = pickBestVoice();
}
if('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,300); setTimeout(loadVoices,1000); }
let resumeInterval=null;
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if(resumeInterval){ clearInterval(resumeInterval); resumeInterval=null; }
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.88; u.pitch=1;
    if(!cachedVoices.length) loadVoices();
    if(chosenVoice) u.voice=chosenVoice;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>{btn.classList.remove('speaking'); if(resumeInterval){clearInterval(resumeInterval);resumeInterval=null;}}; }
    window.speechSynthesis.speak(u);
    resumeInterval=setInterval(()=>{ if(window.speechSynthesis.speaking){ window.speechSynthesis.pause(); window.speechSynthesis.resume(); } else { clearInterval(resumeInterval); resumeInterval=null; } },4000);
  }catch(e){}
}

function feedbackHTML(ok, answerLabel, explanation, vi, note){
  const okLine = ok? `<span class="text-emerald-700 font-bold">✅ Chính xác!</span>` : `<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án đúng: <b>${answerLabel}</b>`;
  const expLine = explanation? `<br><span class="text-blue-700">💡 ${explanation}</span>` : '';
  const viLine = vi? `<span class="text-slate-500">📖 Nghĩa: <i>${vi}</i></span>` : '';
  const noteLine = note? `<br><span class="text-violet-600">📐 Công thức: <b>${note}</b></span>` : '';
  if(note){ return (viLine?viLine+'<br>':'') + okLine + expLine + noteLine; }
  return okLine + expLine + (viLine?'<br>'+viLine:'') + noteLine;
}


function buildNav(){
  const nav=document.getElementById('navWrap');
  nav.innerHTML = DATA.sections.map((s,i)=>
    `<button class="tab-btn text-sm font-bold px-3 py-2 rounded-full text-slate-600${i===0?' active':''}" id="navbtn_${i}" onclick="showTab(${i})">${s.roman?s.roman+'. ':''}${s.navLabel}</button>`
  ).join('');
}

function renderPassage(p, idx){
  if(!p) return '';
  const viBlock = p.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-indigo-200 text-indigo-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-indigo-200 italic text-slate-500">${p.vi}</p>` : '';
  return `<div class="passage-box mb-4"><p class="font-extrabold text-indigo-900 mb-2"><i class="fa-solid fa-book mr-1"></i>${p.title||''}</p><p id="passage_en_${idx}">${p.html}</p>${viBlock}</div>`;
}
function renderDict(d, idx){
  if(!d) return '';
  const viBlock = d.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-amber-300 text-amber-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-amber-300 text-slate-600">${d.vi}</p>` : '';
  return `<div class="dict-box mb-4"><p class="font-extrabold text-amber-800 mb-1"><i class="fa-solid fa-book-bookmark mr-1"></i>${d.word} <span class="font-normal italic">${d.ipa||''}</span> <span class="font-normal">(${d.pos||''})</span></p>${d.senses.map(x=>`<p class="mb-1">✱ ${x.def}</p>${(x.examples||[]).map(e=>`<p class="ml-4 italic text-slate-600">• ${e}</p>`).join('')}`).join('')}${viBlock}</div>`;
}

function renderSection(s, idx){
  if(s.type==='info'){
    return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">
      <h2 class="text-xl md:text-2xl font-extrabold text-indigo-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'lightbulb'} text-amber-400"></i> ${s.title}</h2>
      ${s.info}
    </section>`;
  }
  let inner = `<h2 class="text-xl md:text-2xl font-extrabold text-indigo-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'circle-check'} text-amber-400"></i> ${s.roman}. ${s.title}</h2>`;
  if(s.instructions) inner += `<p class="text-sm text-slate-500 mb-3 italic">${s.instructions}</p>`;
  inner += renderPassage(s.passage, idx);
  inner += renderDict(s.dict, idx);

  inner += `<div class="space-y-4">`;
  s.questions.forEach((q,i)=>{
    inner += `<div class="task-card bg-white rounded-2xl shadow-md p-4" id="qblock_${idx}_${i}">`;
    if(q.image) inner += `<div class="mb-3">${q.image}</div>`;
    inner += `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${q.q}</p>`;
    if(s.type==='mcq'){
      inner += `<div class="grid sm:grid-cols-2 gap-2">`;
      q.options.forEach((opt,j)=>{
        const ipa = q.ipas ? q.ipas[j] : null;
        const optVi = q.vis ? q.vis[j] : null;
        const cleanWord = opt.replace(/<[^>]+>/g,'');
        const wordBlock = (ipa || optVi)
          ? `<span class="flex flex-col leading-tight"><span>${opt}</span>${ipa?`<span class="text-[10px] text-slate-400 font-normal mcq-detail-hidden">${ipa}</span>`:''}${optVi?`<span class="text-[10px] text-emerald-500 font-normal italic mcq-detail-hidden">${optVi}</span>`:''}</span>
             <button type="button" data-w="${cleanWord}" onclick="event.stopPropagation();event.preventDefault();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:scale-110 transition flex items-center justify-center ml-auto shrink-0 mcq-detail-hidden" title="Nghe phát âm" aria-label="Nghe phát âm ${cleanWord}"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`
          : `<span>${opt}</span>`;
        inner += `<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="opt_${idx}_${i}_${j}" onclick="selectMcq(${idx},${i},${j})">
          <input type="radio" name="mcq_${idx}_${i}" class="accent-indigo-700" style="display:none">
          <span class="font-black text-indigo-700">${optionLetter(j)}.</span> ${wordBlock}
        </label>`;
      });
      inner += `</div>`;
    } else if(s.type==='fill'){
      const w = widthFor(q.answer);
      const famBlock = q.family ? `<div class="wordfam-box mt-2">${q.family.map(f=>`<div>• ${f}</div>`).join('')}</div>` : '';
      inner += `<div class="flex items-center gap-2 flex-wrap">`;
      if(q.hint) inner += `<span class="blank-tag text-xs">${q.hint}</span>`;
      inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input ${w} px-3 py-1.5 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false"></div>${famBlock}`;
    } else if(s.type==='sentence'){
      const instantAttr = s.instant ? ` oninput="gradeOneSentence(${idx},${i})"` : '';
      if(q.starter){
        inner += `<p class="text-slate-700 text-sm mb-2">${q.original}</p>
        <div class="flex items-center gap-3 w-full flex-wrap">
          <span class="text-slate-800 font-extrabold text-base whitespace-nowrap">${q.starter}</span>
          <input type="text" id="inp_${idx}_${i}" class="answer-input flex-1 min-w-[180px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false"${instantAttr}>
        </div>`;
      } else {
        inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Viết câu trả lời..." autocomplete="off" spellcheck="false"${instantAttr}>`;
      }
    }
    inner += `<div class="explanation-box mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm text-blue-800" id="fb_${idx}_${i}"></div>`;
    inner += `</div>`;
  });
  inner += `</div>`;

  inner += `<div class="flex flex-wrap gap-2 mt-5">
    <button onclick="checkSection(${idx})" class="bg-gradient-to-r from-indigo-900 to-pink-600 text-white font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>
    <button onclick="revealSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-eye mr-1"></i>Xem đáp án</button>
    <button onclick="resetSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-rotate-left mr-1"></i>Làm lại</button>
    <span id="score_${idx}" class="hidden ml-auto self-center font-extrabold text-emerald-600 text-sm score-badge"></span>
  </div>`;

  return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">${inner}</section>`;
}

function buildMain(){
  const main=document.getElementById('mainWrap');
  main.innerHTML = DATA.sections.map((s,i)=>renderSection(s,i)).join('');
}

function togglePassageVI(idx){ const el=document.getElementById(`passage_vi_${idx}`); if(el) el.classList.toggle('vi-hidden'); }
function selectMcq(idx,i,j){
  const q=DATA.sections[idx].questions[i];
  document.querySelectorAll(`[id^="opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${idx}_${i}_${j}`).classList.add('selected');
  document.getElementById(`opt_${idx}_${i}_${j}`).dataset.chosen = j;
  if(DATA.sections[idx].instant){ gradeOneMcq(idx,i); }
}

function gradeOneMcq(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const qblock=document.getElementById(`qblock_${idx}_${i}`);
  if(qblock) qblock.classList.add('show-mcq-detail');
  const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
  const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
  const ok = chosen === q.answer;
  const answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
  q.options.forEach((o,j)=>{
    const el=document.getElementById(`opt_${idx}_${i}_${j}`);
    el.classList.remove('correct-opt','wrong-opt');
    if(j===q.answer) el.classList.add('correct-opt');
    else if(j===chosen) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function gradeOneSentence(idx,i){
  const q=DATA.sections[idx].questions[i];
  const inp=document.getElementById(`inp_${idx}_${i}`);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(!inp || !fb) return;
  const raw=inp.value.trim();
  if(raw===''){
    inp.classList.remove('correct-input','wrong-input');
    fb.classList.remove('show'); fb.innerHTML='';
    return;
  }
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function checkSection(idx){
  const s=DATA.sections[idx];
  let correct=0;
  s.questions.forEach((q,i)=>{
    let ok=false, answerLabel='';
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='mcq'){
      const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
      const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
      ok = chosen === q.answer;
      answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
        else if(j===chosen) el.classList.add('wrong-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      const val=normalize(inp.value);
      const acc=(q.accepted||[q.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.classList.remove('correct-input','wrong-input');
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = q.answer;
    }
    if(ok) correct++;
    fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
    fb.classList.add('show');
  });
  const total=s.questions.length;
  scores[idx]={correct,total};
  const scoreEl=document.getElementById(`score_${idx}`);
  scoreEl.textContent = `🏆 Điểm: ${correct}/${total}`;
  scoreEl.classList.remove('hidden');
  completedTasks.add(idx);
  updateProgress();
  if(completedTasks.size===TOTAL_TASKS) setTimeout(showCompletion,500);
}

function revealSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    let answerLabel = s.type==='mcq' ? `${optionLetter(q.answer)}. ${q.options[q.answer]}` : q.answer;
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    }
    fb.innerHTML = `👁️ Đáp án: <b>${answerLabel}</b>` + (q.explanation?`<br><span class="text-blue-700">💡 ${q.explanation}</span>`:'') + (q.vi?`<br><span class="text-slate-500">📖 Nghĩa: <i>${q.vi}</i></span>`:'') + (q.note?`<br><span class="text-violet-600">📐 Công thức: <b>${q.note}</b></span>`:'');
    fb.classList.add('show');
  });
}

function resetSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt','selected');
        delete el.dataset.chosen;
      });
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    }
    const qblock=document.getElementById(`qblock_${idx}_${i}`);
    if(qblock) qblock.classList.remove('show-mcq-detail');
    const fb=document.getElementById(`fb_${idx}_${i}`);
    fb.classList.remove('show'); fb.innerHTML='';
  });
  const scoreEl=document.getElementById(`score_${idx}`); scoreEl.classList.add('hidden');
  completedTasks.delete(idx); delete scores[idx]; updateProgress();
}

function showTab(idx){
  document.querySelectorAll('.section-page').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-slate-600');});
  document.getElementById(`tab-${idx}`).classList.add('active');
  const btn=document.getElementById(`navbtn_${idx}`);
  btn.classList.add('active'); btn.classList.remove('text-slate-600');
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=completedTasks.size;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TASKS} phần`;
  document.getElementById('progressBar').style.width = `${(done/TOTAL_TASKS)*100}%`;
}

function showCompletion(){
  fireConfetti();
  const banner=document.getElementById('completionBanner');
  banner.classList.remove('hidden'); banner.classList.add('show');
  let c=0,t=0; Object.values(scores).forEach(s=>{c+=s.correct; t+=s.total;});
  document.getElementById('finalScoreDisplay').textContent = `🎯 ${c} / ${t} câu đúng`;
}
function closeBanner(){ const b=document.getElementById('completionBanner'); b.classList.remove('show'); b.classList.add('hidden'); }

function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}


function renderMiniQuizzes(){
  Object.keys(DATA.miniQuizzes||{}).forEach(key=>{
    const wrap = document.getElementById('miniquiz-'+key);
    if(!wrap) return;
    wrap.innerHTML = DATA.miniQuizzes[key].map((q,i)=>`
      <div id="mqwrap_${key}_${i}">
        <p class="text-sm font-bold text-slate-800 mb-1.5">${i+1}. ${q.q}</p>
        <div class="grid sm:grid-cols-2 gap-2">${q.options.map((o,j)=>`<label class="option-label rounded-lg px-3 py-1.5 text-xs font-semibold" id="mq_${key}_${i}_${j}" onclick="answerMiniQuiz('${key}',${i},${j})"><span class="font-black text-emerald-700">${optionLetter(j)}.</span> ${o}</label>`).join('')}</div>
        <div class="mt-1 text-xs hidden bg-blue-50 border border-blue-200 rounded-lg px-2 py-1.5 text-blue-800" id="mq_fb_${key}_${i}"></div>
      </div>`).join('');
  });
}
const MINI_QUIZ_SCORE = {};
function answerMiniQuiz(key,i,j){
  const wrapEl = document.getElementById(`mqwrap_${key}_${i}`);
  if(wrapEl.dataset.answered) return;
  wrapEl.dataset.answered = '1';
  const q = DATA.miniQuizzes[key][i];
  const ok = j===q.answer;
  q.options.forEach((o,k)=>{
    const el=document.getElementById(`mq_${key}_${i}_${k}`);
    el.onclick=null;
    if(k===q.answer) el.classList.add('correct-opt');
    else if(k===j) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`mq_fb_${key}_${i}`);
  fb.classList.remove('hidden');
  fb.innerHTML = (ok?'<span class="text-emerald-700 font-bold">✅ Chính xác!</span>':`<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án: <b>${optionLetter(q.answer)}. ${q.options[q.answer]}</b>`) + (q.explanation?`<br>💡 ${q.explanation}`:'') + (q.vi?`<br>📖 <i>${q.vi}</i>`:'');
  if(!MINI_QUIZ_SCORE[key]) MINI_QUIZ_SCORE[key] = {correct:0, answered:0};
  MINI_QUIZ_SCORE[key].answered++;
  if(ok) MINI_QUIZ_SCORE[key].correct++;
  const scoreEl = document.getElementById(`miniquiz-score-${key}`);
  if(scoreEl) scoreEl.textContent = `🏆 ${MINI_QUIZ_SCORE[key].correct}/${MINI_QUIZ_SCORE[key].answered} đã trả lời`;
}

buildNav();
buildMain();
updateProgress();
renderMiniQuizzes();
</script>
