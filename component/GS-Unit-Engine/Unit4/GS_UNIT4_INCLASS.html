.5'>💡 \"rulers\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>7. <b class='text-slate-500'>flute</b> <span class='text-slate-400'>/fluːt/</span> · <b class='text-emerald-700'>feature</b> <span class='text-slate-400'>/ˈfiːtʃər/</span> · <b class='text-slate-500'>costume</b> <span class='text-slate-400'>/ˈkɒstjuːm/</span> · <b class='text-slate-500'>livestock</b> <span class='text-slate-400'>/ˈlaɪvstɒk/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"feature\" có \"t\" phát âm /tʃ/, ba từ còn lại phát âm /t/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>8. <b class='text-emerald-700'>knew</b> <span class='text-slate-400'>/njuː/</span> · <b class='text-slate-500'>flew</b> <span class='text-slate-400'>/fluː/</span> · <b class='text-slate-500'>grew</b> <span class='text-slate-400'>/ɡruː/</span> · <b class='text-slate-500'>drew</b> <span class='text-slate-400'>/druː/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"knew\" có \"ew\" phát âm /njuː/, ba từ còn lại phát âm /uː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>9. <b class='text-slate-500'>hear</b> <span class='text-slate-400'>/hɪr/</span> · <b class='text-slate-500'>dear</b> <span class='text-slate-400'>/dɪr/</span> · <b class='text-emerald-700'>heart</b> <span class='text-slate-400'>/hɑːrt/</span> · <b class='text-slate-500'>near</b> <span class='text-slate-400'>/nɪr/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"heart\" có \"ear\" phát âm /ɑːr/, ba từ còn lại phát âm /ɪr/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>10. <b class='text-slate-500'>lived</b> <span class='text-slate-400'>/lɪvd/</span> · <b class='text-slate-500'>played</b> <span class='text-slate-400'>/pleɪd/</span> · <b class='text-emerald-700'>promised</b> <span class='text-slate-400'>/ˈprɒmɪst/</span> · <b class='text-slate-500'>cleaned</b> <span class='text-slate-400'>/kliːnd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"promised\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /d/.</p></div></div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Trọng âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>invite</b> <span class='text-slate-400'>/ɪnˈvaɪt/</span> · <b class='text-slate-500'>computer</b> <span class='text-slate-400'>/kəmˈpjuːtər/</span> · <b class='text-slate-500'>minority</b> <span class='text-slate-400'>/maɪˈnɒrəti/</span> · <b class='text-emerald-700'>highland</b> <span class='text-slate-400'>/ˈhaɪlənd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"highland\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>wooden</b> <span class='text-slate-400'>/ˈwʊdn/</span> · <b class='text-emerald-700'>communal</b> <span class='text-slate-400'>/kəˈmjuːnl/</span> · <b class='text-slate-500'>ethnic</b> <span class='text-slate-400'>/ˈeθnɪk/</span> · <b class='text-slate-500'>famous</b> <span class='text-slate-400'>/ˈfeɪməs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"communal\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>happen</b> <span class='text-slate-400'>/ˈhæpən/</span> · <b class='text-slate-500'>listen</b> <span class='text-slate-400'>/ˈlɪsn/</span> · <b class='text-slate-500'>finish</b> <span class='text-slate-400'>/ˈfɪnɪʃ/</span> · <b class='text-emerald-700'>communal</b> <span class='text-slate-400'>/kəˈmjuːnl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"communal\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>harvest</b> <span class='text-slate-400'>/ˈhɑːrvɪst/</span> · <b class='text-emerald-700'>arrange</b> <span class='text-slate-400'>/əˈreɪndʒ/</span> · <b class='text-slate-500'>costume</b> <span class='text-slate-400'>/ˈkɒstjuːm/</span> · <b class='text-slate-500'>famous</b> <span class='text-slate-400'>/ˈfeɪməs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"arrange\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>gather</b> <span class='text-slate-400'>/ˈɡæðər/</span> · <b class='text-slate-500'>statue</b> <span class='text-slate-400'>/ˈstætʃuː/</span> · <b class='text-slate-500'>ethnic</b> <span class='text-slate-400'>/ˈeθnɪk/</span> · <b class='text-emerald-700'>unique</b> <span class='text-slate-400'>/juˈniːk/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"unique\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-slate-500'>hunting</b> <span class='text-slate-400'>/ˈhʌntɪŋ/</span> · <b class='text-slate-500'>custom</b> <span class='text-slate-400'>/ˈkʌstəm/</span> · <b class='text-slate-500'>feature</b> <span class='text-slate-400'>/ˈfiːtʃər/</span> · <b class='text-emerald-700'>overlook</b> <span class='text-slate-400'>/ˌoʊvərˈlʊk/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"overlook\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>7. <b class='text-slate-500'>invitation</b> <span class='text-slate-400'>/ˌɪnvɪˈteɪʃn/</span> · <b class='text-slate-500'>celebration</b> <span class='text-slate-400'>/ˌselɪˈbreɪʃn/</span> · <b class='text-emerald-700'>tradition</b> <span class='text-slate-400'>/trəˈdɪʃn/</span> · <b class='text-slate-500'>information</b> <span class='text-slate-400'>/ˌɪnfərˈmeɪʃn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"tradition\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>8. <b class='text-slate-500'>custom</b> <span class='text-slate-400'>/ˈkʌstəm/</span> · <b class='text-emerald-700'>invite</b> <span class='text-slate-400'>/ɪnˈvaɪt/</span> · <b class='text-slate-500'>greeting</b> <span class='text-slate-400'>/ˈɡriːtɪŋ/</span> · <b class='text-slate-500'>manner</b> <span class='text-slate-400'>/ˈmænər/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"invite\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>9. <b class='text-emerald-700'>woman</b> <span class='text-slate-400'>/ˈwʊmən/</span> · <b class='text-slate-500'>detest</b> <span class='text-slate-400'>/dɪˈtest/</span> · <b class='text-slate-500'>balloon</b> <span class='text-slate-400'>/bəˈluːn/</span> · <b class='text-slate-500'>police</b> <span class='text-slate-400'>/pəˈliːs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"woman\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>10. <b class='text-slate-500'>refuse</b> <span class='text-slate-400'>/rɪˈfjuːz/</span> · <b class='text-emerald-700'>enter</b> <span class='text-slate-400'>/ˈentər/</span> · <b class='text-slate-500'>deny</b> <span class='text-slate-400'>/dɪˈnaɪ/</span> · <b class='text-slate-500'>delay</b> <span class='text-slate-400'>/dɪˈleɪ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"enter\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Câu hỏi Yes/No (Yes/No Questions)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng để hỏi xác nhận Có/Không. Cấu trúc: <b>Trợ động từ (be/do/have/modal) + S + V chính...?</b></p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trợ động từ</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">be</td><td class=\"border px-2 py-1 italic\">Is she working very hard? <span class=\"not-italic text-slate-500\">— Cô ấy đang làm việc rất chăm chỉ à?</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">do/does/did</td><td class=\"border px-2 py-1 italic\">Does she live near here? <span class=\"not-italic text-slate-500\">— Cô ấy sống gần đây à?</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">have/has/had</td><td class=\"border px-2 py-1 italic\">Have you finished it yet? <span class=\"not-italic text-slate-500\">— Bạn đã hoàn thành chưa?</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">modal (can/could/will...)</td><td class=\"border px-2 py-1 italic\">Could you help me? <span class=\"not-italic text-slate-500\">— Bạn có thể giúp tôi không?</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Nếu câu trần thuật KHÔNG có sẵn trợ động từ be/have/modal → dùng do/does/did: You usually walk to work. → Do you usually walk to work?</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-question mr-1\"></i>2. Câu hỏi Wh- (Wh- Questions)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng để hỏi lấy thông tin cụ thể (không trả lời Yes/No được). Cấu trúc: <b>Wh- + trợ động từ/modal + S + V chính...?</b> (hoặc S + V nếu Wh- làm chủ ngữ, không cần trợ động từ).</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ hỏi</th><th class=\"border px-2 py-1\">Ý nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">What</td><td class=\"border px-2 py-1\">cái gì, việc gì</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Where</td><td class=\"border px-2 py-1\">ở đâu (nơi chốn)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">When</td><td class=\"border px-2 py-1\">khi nào (thời gian)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Who / Whom</td><td class=\"border px-2 py-1\">ai (chủ ngữ / tân ngữ)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Whose</td><td class=\"border px-2 py-1\">của ai (sở hữu)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Which</td><td class=\"border px-2 py-1\">cái nào (chọn lựa cụ thể)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Why</td><td class=\"border px-2 py-1\">tại sao (lý do)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">How / How far / How often / How much/many</td><td class=\"border px-2 py-1\">như thế nào / bao xa / bao lâu một lần / bao nhiêu</td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Khi What/Who/Which/Whose làm CHỦ NGỮ của câu, KHÔNG dùng trợ động từ: Who bought this? (KHÔNG nói \"Who did buy this?\")</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-cubes mr-1\"></i>3. Danh từ đếm được &amp; không đếm được</p>\n    <p class=\"text-sm text-slate-700 mb-2\"><b>Danh từ đếm được (countable)</b> có dạng số ít/số nhiều, đi được với a/an và số đếm: a book, three books.</p>\n    <p class=\"text-sm text-slate-700 mb-2\"><b>Danh từ không đếm được (uncountable)</b> không có số nhiều, không đi với a/an hay số đếm: information, rice, furniture, homework, money, weather...</p>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Một số danh từ LUÔN ở dạng số nhiều nhưng KHÔNG đếm được (không dùng với số đếm trực tiếp): trousers, shorts, glasses, scissors — phải nói \"two pairs of trousers\", KHÔNG nói \"two trousers\".</p>\n  </div>\n\n  \n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-users mr-1\"></i>Chủ ngữ SỐ ÍT và SỐ NHIỀU — vì sao động từ chia khác nhau</p>\n  <p class=\"text-sm text-slate-700 mb-3\">Trong tiếng Anh, dạng của động từ (to be, to do, hay động từ thường thêm \"-s/-es\") phụ thuộc vào chủ ngữ là SỐ ÍT hay SỐ NHIỀU. Đây là quy tắc SỐNG CÒN cần nắm chắc trước khi học bất kỳ thì nào.</p>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Chủ ngữ</th><th class=\"border px-2 py-1\">Số ít hay số nhiều?</th><th class=\"border px-2 py-1\">to be</th><th class=\"border px-2 py-1\">to do</th><th class=\"border px-2 py-1\">Động từ thường (hiện tại đơn)</th></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">I</td><td class=\"border px-2 py-1\">số ít <span class=\"text-slate-400\">(nhưng chia đặc biệt)</span></td><td class=\"border px-2 py-1 font-bold\">am</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, không thêm gì)</td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">You</td><td class=\"border px-2 py-1\">số ít HOẶC số nhiều <span class=\"text-slate-400\">(luôn chia như số nhiều)</span></td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu)</td></tr>\n    <tr class=\"bg-amber-50\"><td class=\"border px-2 py-1 font-bold\">He / She / It<br><span class=\"font-normal text-xs\">(và danh từ số ít: a boy, my sister, the dog...)</span></td><td class=\"border px-2 py-1 font-bold\">SỐ ÍT</td><td class=\"border px-2 py-1 font-bold\">is</td><td class=\"border px-2 py-1 font-bold\">does</td><td class=\"border px-2 py-1 font-bold\">V + s/es <span class=\"font-normal\">(plays, watches, goes...)</span></td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">We</td><td class=\"border px-2 py-1 font-bold\">SỐ NHIỀU</td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, KHÔNG thêm s/es)</td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">They<br><span class=\"font-normal text-xs\">(và danh từ số nhiều: boys, my parents, the dogs...)</span></td><td class=\"border px-2 py-1 font-bold\">SỐ NHIỀU</td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, KHÔNG thêm s/es)</td></tr>\n  </table>\n  </div>\n  <div class=\"mt-3 space-y-1.5 text-sm text-slate-700\">\n    <p>💡 <b>Chỉ có \"He / She / It\" (ngôi thứ 3 số ít) và danh từ số ít mới thêm \"-s/-es\" vào động từ thường</b> ở thì hiện tại đơn. Mọi chủ ngữ khác (I, You, We, They) giữ nguyên động từ ở dạng nguyên mẫu.</p>\n    <p>💡 Cách nhận biết danh từ số ít/số nhiều nhanh: số ít thường có \"a/an/the/my/his...\" + danh từ KHÔNG có \"-s\" (a student); số nhiều thường có danh từ CÓ \"-s\" hoặc từ chỉ số lượng >1 (students, two students, many students).</p>\n    <p>💡 Với \"to be\" ở thì QUÁ KHỨ: số ít dùng <b>was</b> (I was, he/she/it was), số nhiều dùng <b>were</b> (we/you/they were).</p>\n  </div>\n</div>\n\n<div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>Walk you to work every day?</s> ❌ → <b>Do you walk to work every day?</b> ✅ — cần trợ động từ \"do\" khi câu trần thuật không có sẵn trợ động từ.</li>\n      <li><s>Who did buy this?</s> ❌ → <b>Who bought this?</b> ✅ — khi \"who\" làm chủ ngữ, không dùng thêm trợ động từ.</li>\n      <li><s>I need an information.</s> ❌ → <b>I need some information.</b> ✅ — \"information\" là danh từ không đếm được, không dùng với \"an\".</li>\n      <li><s>I bought two trousers.</s> ❌ → <b>I bought two pairs of trousers.</b> ✅ — \"trousers\" luôn số nhiều nhưng không đếm được trực tiếp.</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Trợ động từ (be/do/have/modal) + S + V chính...?\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1 — Yes/No Question</p>\n      <p class=\"text-sm text-slate-700\">Trợ động từ + S + V chính...?</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Wh- + trợ động từ + S + V chính...?\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2 — Wh- Question</p>\n      <p class=\"text-sm text-slate-700\">Wh- + trợ động từ + S + V chính...?</p>\n    </div>\n  </div>\n\n  <div class=\"bg-amber-50 border border-amber-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-amber-800 mb-2\"><i class=\"fa-solid fa-lightbulb mr-1\"></i>Lưu ý về phần Viết lại câu trong Unit này</p>\n    <p class=\"text-sm text-slate-700\">Phần \"Viết lại câu\" của Unit 4 trong đề cương gốc ôn lại các cấu trúc verbs of liking/disliking và spend time (đã học ở Unit 1) để giúp các em ôn tập xen kẽ — không trực tiếp luyện tập Yes/No &amp; Wh- Questions. Hãy xem lại các công thức này ở tab \"Cách viết lại câu\" nếu cần ôn lại.</p>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Ngữ pháp</p>\n  <div id=\"miniquiz-grammar\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-grammar\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Word Formation</p>\n  <div id=\"miniquiz-wf\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-wf\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n<div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. communal house</span><span class='text-slate-400 text-xs'>(n) /kəˈmjuːnl haʊs/</span><span class='text-slate-500 text-xs ml-auto'>nhà rông, nhà sinh hoạt cộng đồng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. costume</span><span class='text-slate-400 text-xs'>(n) /ˈkɒstjuːm/</span><span class='text-slate-500 text-xs ml-auto'>trang phục</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. crop</span><span class='text-slate-400 text-xs'>(n) /krɒp/</span><span class='text-slate-500 text-xs ml-auto'>vụ mùa, vụ trồng trọt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. ethnic group</span><span class='text-slate-400 text-xs'>(n) /ˈeθnɪk ɡruːp/</span><span class='text-slate-500 text-xs ml-auto'>nhóm dân tộc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. feature</span><span class='text-slate-400 text-xs'>(n) /ˈfiːtʃər/</span><span class='text-slate-500 text-xs ml-auto'>nét, đặc điểm</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. flute</span><span class='text-slate-400 text-xs'>(n) /fluːt/</span><span class='text-slate-500 text-xs ml-auto'>cái sáo (nhạc cụ)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. folk</span><span class='text-slate-400 text-xs'>(adj) /foʊk/</span><span class='text-slate-500 text-xs ml-auto'>thuộc về dân gian, truyền thống</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. gong</span><span class='text-slate-400 text-xs'>(n) /ɡɒŋ/</spa -slate-400 text-xs'>(n) /sɔɪl/</span><span class='text-slate-500 text-xs ml-auto'>đất trồng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. staircase</span><span class='text-slate-400 text-xs'>(n) /ˈsterkeɪs/</span><span class='text-slate-500 text-xs ml-auto'>cầu thang bộ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. statue</span><span class='text-slate-400 text-xs'>(n) /ˈstætʃuː/</span><span class='text-slate-500 text-xs ml-auto'>tượng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. stilt house</span><span class='text-slate-400 text-xs'>(n) /stɪlt haʊs/</span><span class='text-slate-500 text-xs ml-auto'>nhà sàn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. terraced</span><span class='text-slate-400 text-xs'>(adj) /ˈterəst/</span><span class='text-slate-500 text-xs ml-auto'>có hình bậc thang</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. weave</span><span class='text-slate-400 text-xs'>(v) /wiːv/</span><span class='text-slate-500 text-xs ml-auto'>dệt, đan, kết lại</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. wooden</span><span class='text-slate-400 text-xs'>(adj) /ˈwʊdn/</span><span class='text-slate-500 text-xs ml-auto'>bằng gỗ</span></div></div></div>"}], "miniQuizzes": {"sEs": [{"q": "Từ nào có đuôi \"-s\" phát âm khác với 3 từ còn lại?", "options": ["books", "cats", "buses", "maps"], "answer": 2, "explanation": "\"buses\" tận cùng bằng /s/ → thêm \"-es\" đọc /ɪz/. Ba từ còn lại tận cùng phụ âm vô thanh (k, t, p) → đọc /s/."}, {"q": "Từ nào có đuôi \"-s\" phát âm là /z/?", "options": ["plays", "h function normalize(s){ return (s||'').trim().toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d"]/g,'').replace(/[.,!?;:]/g,'').replace(/\s+/g,' '); }
function optionLetter(i){ return ['A','B','C','D'][i]; }
function shuffleArr(a){ return a.slice().sort(()=>Math.random()-0.5); }

function widthFor(ref){ const l=(ref||'').length; return l<7?'w-24':l<16?'w-40':'w-full'; }

let audioUnlocked=false, cachedVoices=[], chosenVoice=null;
const PREFERRED_VOICE_NAMES = [
  'Google US English','Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)','Samantha',
  'Microsoft Zira Desktop - English (United States)','Google UK English Female','Alex'
];
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true;
  try{ const Ctx=window.AudioContext||window.webkitAudioContext; if(Ctx){ const ctx=new Ctx(); const buf=ctx.createBuffer(1,1,22050); const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0);} }catch(e){}
  try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  loadVoices();
}
document.addEventListener('touchstart', unlockAudio, {once:true, passive:true});
document.addEventListener('click', unlockAudio, {once:true});
function pickBestVoice(){
  if(!cachedVoices.length) return null;
  for(const name of PREFERRED_VOICE_NAMES){ const v=cachedVoices.find(x=>x.name===name); if(v) return v; }
  const usEn = cachedVoices.filter(v=>/en[-_]us/i.test(v.lang));
  if(usEn.length){ const local = usEn.find(v=>v.localService); return local||usEn[0]; }
  const anyEn = cachedVoices.find(v=>/^en/i.test(v.lang));
  return anyEn||null;
}
function loadVoices(){
  cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  chosenVoice = pickBestVoice();
}
if('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,300); setTimeout(loadVoices,1000); }
let resumeInterval=null;
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if(resumeInterval){ clearInterval(resumeInterval); resumeInterval=null; }
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.88; u.pitch=1;
    if(!cachedVoices.length) loadVoices();
    if(chosenVoice) u.voice=chosenVoice;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>{btn.classList.remove('speaking'); if(resumeInterval){clearInterval(resumeInterval);resumeInterval=null;}}; }
    window.speechSynthesis.speak(u);
    resumeInterval=setInterval(()=>{ if(window.speechSynthesis.speaking){ window.speechSynthesis.pause(); window.speechSynthesis.resume(); } else { clearInterval(resumeInterval); resumeInterval=null; } },4000);
  }catch(e){}
}

function feedbackHTML(ok, answerLabel, explanation, vi, note){
  const okLine = ok? `<span class="text-emerald-700 font-bold">✅ Chính xác!</span>` : `<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án đúng: <b>${answerLabel}</b>`;
  const expLine = explanation? `<br><span class="text-blue-700">💡 ${explanation}</span>` : '';
  const viLine = vi? `<span class="text-slate-500">📖 Nghĩa: <i>${vi}</i></span>` : '';
  const noteLine = note? `<br><span class="text-violet-600">📐 Công thức: <b>${note}</b></span>` : '';
  if(note){ return (viLine?viLine+'<br>':'') + okLine + expLine + noteLine; }
  return okLine + expLine + (viLine?'<br>'+viLine:'') + noteLine;
}

  inner += `<div class="flex flex-wrap gap-2 mt-5">
    <button onclick="checkSection(${idx})" class="bg-gradient-to-r from-indigo-900 to-pink-600 text-white font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>
    <button onclick="revealSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-eye mr-1"></i>Xem đáp án</button>
    <button onclick="resetSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-rotate-left mr-1"></i>Làm lại</button>
    <span id="score_${idx}" class="hidden ml-auto self-center font-extrabold text-emerald-600 text-sm score-badge"></span>
  </div>`;

  return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">${inner}</section>`;
}

function buildMain(){
  const main=document.getElementById('mainWrap');
  main.innerHTML = DATA.sections.map((s,i)=>renderSection(s,i)).join('');
}

function togglePassageVI(idx){ const el=document.getElementById(`passage_vi_${idx}`); if(el) el.classList.toggle('vi-hidden'); }
function selectMcq(idx,i,j){
  const q=DATA.sections[idx].questions[i];
  document.querySelectorAll(`[id^="opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${idx}_${i}_${j}`).classList.add('selected');
  document.getElementById(`opt_${idx}_${i}_${j}`).dataset.chosen = j;
  if(DATA.sections[idx].instant){ gradeOneMcq(idx,i); }
}

function gradeOneMcq(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const qblock=document.getElementById(`qblock_${idx}_${i}`);
  if(qblock) qblock.classList.add('show-mcq-detail');
  const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
  const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
  const ok = chosen === q.answer;
  const answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
  q.options.forEach((o,j)=>{
    const el=document.getElementById(`opt_${idx}_${i}_${j}`);
    el.classList.remove('correct-opt','wrong-opt');
    if(j===q.answer) el.classList.add('correct-opt');
    else if(j===chosen) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function gradeOneSentence(idx,i){
  const q=DATA.sections[idx].questions[i];
  const inp=document.getElementById(`inp_${idx}_${i}`);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(!inp || !fb) return;
  const raw=inp.value.trim();
  if(raw===''){
    inp.classList.remove('correct-input','wrong-input');
    fb.classList.remove('show'); fb.innerHTML='';
    return;
  }
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function checkSection(idx){
  const s=DATA.sections[idx];
  let correct=0;
  s.questions.forEach((q,i)=>{
    let ok=false, answerLabel='';
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='mcq'){
      const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
      const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
      ok = chosen === q.answer;
      answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
        else if(j===chosen) el.classList.add('wrong-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      const val=normalize(inp.value);
      const acc=(q.accepted||[q.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.classList.remove('correct-input','wrong-input');
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = q.answer;
    }
    if(ok) correct++;
    fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
    fb.classList.add('show');
  });
  const total=s.questions.length;
  scores[idx]={correct,total};
  const scoreEl=document.getElementById(`score_${idx}`);
  scoreEl.textContent = `🏆 Điểm: ${correct}/${total}`;
  scoreEl.classList.remove('hidden');
  completedTasks.add(idx);
  updateProgress();
  if(completedTasks.size===TOTAL_TASKS) setTimeout(showCompletion,500);
}

function revealSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    let answerLabel = s.type==='mcq' ? `${optionLetter(q.answer)}. ${q.options[q.answer]}` : q.answer;
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    }
    fb.innerHTML = `👁️ Đáp án: <b>${answerLabel}</b>` + (q.explanation?`<br><span class="text-blue-700">💡 ${q.explanation}</span>`:'') + (q.vi?`<br><span class="text-slate-500">📖 Nghĩa: <i>${q.vi}</i></span>`:'') + (q.note?`<br><span class="text-violet-600">📐 Công thức: <b>${q.note}</b></span>`:'');
    fb.classList.add('show');
  });
}

function resetSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt','selected');
        delete el.dataset.chosen;
      });
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    }
    const qblock=document.getElementById(`qblock_${idx}_${i}`);
    if(qblock) qblock.classList.remove('show-mcq-detail');
    const fb=document.getElementById(`fb_${idx}_${i}`);
    fb.classList.remove('show'); fb.innerHTML='';
  });
  const scoreEl=document.getElementById(`score_${idx}`); scoreEl.classList.add('hidden');
  completedTasks.delete(idx); delete scores[idx]; updateProgress();
}

function showTab(idx){
  document.querySelectorAll('.section-page').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-slate-600');});
  document.getElementById(`tab-${idx}`).classList.add('active');
  const btn=document.getElementById(`navbtn_${idx}`);
  btn.classList.add('active'); btn.classList.remove('text-slate-600');
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=completedTasks.size;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TASKS} phần`;
  document.getElementById('progressBar').style.width = `${(done/TOTAL_TASKS)*100}%`;
}

function showCompletion(){
  fireConfetti();
  const banner=document.getElementById('completionBanner');
  banner.classList.remove('hidden'); banner.classList.add('show');
  let c=0,t=0; Object.values(scores).forEach(s=>{c+=s.correct; t+=s.total;});
  document.getElementById('finalScoreDisplay').textContent = `🎯 ${c} / ${t} câu đúng`;
}
function closeBanner(){ const b=document.getElementById('completionBanner'); b.classList.remove('show'); b.classList.add('hidden'); }

function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}


function renderMiniQuizzes(){
  Object.keys(DATA.miniQuizzes||{}).forEach(key=>{
    const wrap = document.getElementById('miniquiz-'+key);
    if(!wrap) return;
    wrap.innerHTML = DATA.miniQuizzes[key].map((q,i)=>`
      <div id="mqwrap_${key}_${i}">
        <p class="text-sm font-bold text-slate-800 mb-1.5">${i+1}. ${q.q}</p>
        <div class="grid sm:grid-cols-2 gap-2">${q.options.map((o,j)=>`<label class="option-label rounded-lg px-3 py-1.5 text-xs font-semibold" id="mq_${key}_${i}_${j}" onclick="answerMiniQuiz('${key}',${i},${j})"><span class="font-black text-emerald-700">${optionLetter(j)}.</span> ${o}</label>`).join('')}</div>
        <div class="mt-1 text-xs hidden bg-blue-50 border border-blue-200 rounded-lg px-2 py-1.5 text-blue-800" id="mq_fb_${key}_${i}"></div>
      </div>`).join('');
  });
}
const MINI_QUIZ_SCORE = {};
function answerMiniQuiz(key,i,j){
  const wrapEl = document.getElementById(`mqwrap_${key}_${i}`);
  if(wrapEl.dataset.answered) return;
  wrapEl.dataset.answered = '1';
  const q = DATA.miniQuizzes[key][i];
  const ok = j===q.answer;
  q.options.forEach((o,k)=>{
    const el=document.getElementById(`mq_${key}_${i}_${k}`);
    el.onclick=null;
    if(k===q.answer) el.classList.add('correct-opt');
    else if(k===j) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`mq_fb_${key}_${i}`);
  fb.classList.remove('hidden');
  fb.innerHTML = (ok?'<span class="text-emerald-700 font-bold">✅ Chính xác!</span>':`<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án: <b>${optionLetter(q.answer)}. ${q.options[q.answer]}</b>`) + (q.explanation?`<br>💡 ${q.explanation}`:'') + (q.vi?`<br>📖 <i>${q.vi}</i>`:'');
  if(!MINI_QUIZ_SCORE[key]) MINI_QUIZ_SCORE[key] = {correct:0, answered:0};
  MINI_QUIZ_SCORE[key].answered++;
  if(ok) MINI_QUIZ_SCORE[key].correct++;
  const scoreEl = document.getElementById(`miniquiz-score-${key}`);
  if(scoreEl) scoreEl.textContent = `🏆 ${MINI_QUIZ_SCORE[key].correct}/${MINI_QUIZ_SCORE[key].answered} đã trả lời`;
}

buildNav();
buildMain();
updateProgress();
renderMiniQuizzes();
</script>
</body>
</html>
