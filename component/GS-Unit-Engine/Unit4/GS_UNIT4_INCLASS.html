<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{ --accent:#1d4ed8; --accent2:#0891b2; }
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#f5f3ff; }
  .hero-gradient{ background: linear-gradient(135deg, #7c2d12 0%, #ea580c 55%, #f59e0b 100%); }
  .tab-btn{ transition: all .2s ease; }
  .tab-btn.active{ background: linear-gradient(135deg, #7c2d12, #f59e0b); color:#fff; box-shadow:0 4px 14px rgba(124,45,18,.35); transform:translateY(-1px); }
  .task-card{ transition: box-shadow .2s, transform .2s; }
  .task-card:hover{ transform: translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  .mcq-detail-hidden{ display:none; }
  .show-mcq-detail .mcq-detail-hidden{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:var(--accent); }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .voice-ok{ color:#16a34a; } .voice-warn{ color:#d97706; }

  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
  table.border-collapse td, table.border-collapse th{ border:1px solid #e2e8f0; }
</style>

<script>
const DATA = {"unit": 4, "sections": [{"roman": "", "navLabel": "Lý thuyết", "title": "Từ vựng - Ngữ pháp - Hướng dẫn Word Form", "icon": "lightbulb", "type": "info", "info": "<div class='mb-5'><p class=\"text-sm text-slate-500 italic mb-3\">Ôn lại từ vựng, ngữ pháp trọng tâm và cách làm dạng bài Word Form trước khi luyện tập.</p></div><div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. communal house</span><span class='text-slate-400 text-xs'>(n) /kəˈmjuːnl haʊs/</span><span class='text-slate-500 text-xs ml-auto'>nhà rông, nhà sinh hoạt cộng đồng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. costume</span><span class='text-slate-400 text-xs'>(n) /ˈkɒstjuːm/</span><span class='text-slate-500 text-xs ml-auto'>trang phục</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. crop</span><span class='text-slate-400 text-xs'>(n) /krɒp/</span><span class='text-slate-500 text-xs ml-auto'>vụ mùa, vụ trồng trọt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. ethnic group</span><span class='text-slate-400 text-xs'>(n) /ˈeθnɪk ɡruːp/</span><span class='text-slate-500 text-xs ml-auto'>nhóm dân tộc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. feature</span><span class='text-slate-400 text-xs'>(n) /ˈfiːtʃər/</span><span class='text-slate-500 text-xs ml-auto'>nét, đặc điểm</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. flute</span><span class='text-slate-400 text-xs'>(n) /fluːt/</span><span class='text-slate-500 text-xs ml-auto'>cái sáo (nhạc cụ)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. folk</span><span class='text-slate-400 text-xs'>(adj) /foʊk/</span><span class='text-slate-500 text-xs ml-auto'>thuộc về dân gian, truyền thống</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. gong</span><span class='text-slate-400 text-xs'>(n) /ɡɒŋ/</span><span class='text-slate-500 text-xs ml-auto'>cái cồng, cái chiêng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. harvest</span><span class='text-slate-400 text-xs'>(n) /ˈhɑːvɪst/</span><span class='text-slate-500 text-xs ml-auto'>vụ mùa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. highland</span><span class='text-slate-400 text-xs'>(n) /ˈhaɪlənd/</span><span class='text-slate-500 text-xs ml-auto'>vùng cao nguyên</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. livestock</span><span class='text-slate-400 text-xs'>(n) /ˈlaɪvstɒk/</span><span class='text-slate-500 text-xs ml-auto'>gia súc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. minority</span><span class='text-slate-400 text-xs'>(n) /maɪˈnɒrəti/</span><span class='text-slate-500 text-xs ml-auto'>dân tộc thiểu số</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. overlook</span><span class='text-slate-400 text-xs'>(v) /ˌoʊvərˈlʊk/</span><span class='text-slate-500 text-xs ml-auto'>nhìn ra, đối diện</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. post</span><span class='text-slate-400 text-xs'>(n) /poʊst/</span><span class='text-slate-500 text-xs ml-auto'>cột</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. raise</span><span class='text-slate-400 text-xs'>(v) /reɪz/</span><span class='text-slate-500 text-xs ml-auto'>chăn nuôi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. soil</span><span class='text-slate-400 text-xs'>(n) /sɔɪl/</span><span class='text-slate-500 text-xs ml-auto'>đất trồng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. staircase</span><span class='text-slate-400 text-xs'>(n) /ˈsterkeɪs/</span><span class='text-slate-500 text-xs ml-auto'>cầu thang bộ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. statue</span><span class='text-slate-400 text-xs'>(n) /ˈstætʃuː/</span><span class='text-slate-500 text-xs ml-auto'>tượng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. stilt house</span><span class='text-slate-400 text-xs'>(n) /stɪlt haʊs/</span><span class='text-slate-500 text-xs ml-auto'>nhà sàn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. terraced</span><span class='text-slate-400 text-xs'>(adj) /ˈterəst/</span><span class='text-slate-500 text-xs ml-auto'>có hình bậc thang</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. weave</span><span class='text-slate-400 text-xs'>(v) /wiːv/</span><span class='text-slate-500 text-xs ml-auto'>dệt, đan, kết lại</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. wooden</span><span class='text-slate-400 text-xs'>(adj) /ˈwʊdn/</span><span class='text-slate-500 text-xs ml-auto'>bằng gỗ</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Câu hỏi Yes/No (Yes/No Questions)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng để hỏi xác nhận Có/Không. Cấu trúc: <b>Trợ động từ (be/do/have/modal) + S + V chính...?</b></p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trợ động từ</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">be</td><td class=\"border px-2 py-1 italic\">Is she working very hard? <span class=\"not-italic text-slate-500\">— Cô ấy đang làm việc rất chăm chỉ à?</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">do/does/did</td><td class=\"border px-2 py-1 italic\">Does she live near here? <span class=\"not-italic text-slate-500\">— Cô ấy sống gần đây à?</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">have/has/had</td><td class=\"border px-2 py-1 italic\">Have you finished it yet? <span class=\"not-italic text-slate-500\">— Bạn đã hoàn thành chưa?</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">modal (can/could/will...)</td><td class=\"border px-2 py-1 italic\">Could you help me? <span class=\"not-italic text-slate-500\">— Bạn có thể giúp tôi không?</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Nếu câu trần thuật KHÔNG có sẵn trợ động từ be/have/modal → dùng do/does/did: You usually walk to work. → Do you usually walk to work?</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-question mr-1\"></i>2. Câu hỏi Wh- (Wh- Questions)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng để hỏi lấy thông tin cụ thể (không trả lời Yes/No được). Cấu trúc: <b>Wh- + trợ động từ/modal + S + V chính...?</b> (hoặc S + V nếu Wh- làm chủ ngữ, không cần trợ động từ).</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ hỏi</th><th class=\"border px-2 py-1\">Ý nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">What</td><td class=\"border px-2 py-1\">cái gì, việc gì</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Where</td><td class=\"border px-2 py-1\">ở đâu (nơi chốn)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">When</td><td class=\"border px-2 py-1\">khi nào (thời gian)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Who / Whom</td><td class=\"border px-2 py-1\">ai (chủ ngữ / tân ngữ)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Whose</td><td class=\"border px-2 py-1\">của ai (sở hữu)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Which</td><td class=\"border px-2 py-1\">cái nào (chọn lựa cụ thể)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Why</td><td class=\"border px-2 py-1\">tại sao (lý do)</td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">How / How far / How often / How much/many</td><td class=\"border px-2 py-1\">như thế nào / bao xa / bao lâu một lần / bao nhiêu</td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Khi What/Who/Which/Whose làm CHỦ NGỮ của câu, KHÔNG dùng trợ động từ: Who bought this? (KHÔNG nói \"Who did buy this?\")</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-cubes mr-1\"></i>3. Danh từ đếm được &amp; không đếm được</p>\n    <p class=\"text-sm text-slate-700 mb-2\"><b>Danh từ đếm được (countable)</b> có dạng số ít/số nhiều, đi được với a/an và số đếm: a book, three books.</p>\n    <p class=\"text-sm text-slate-700 mb-2\"><b>Danh từ không đếm được (uncountable)</b> không có số nhiều, không đi với a/an hay số đếm: information, rice, furniture, homework, money, weather...</p>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Một số danh từ LUÔN ở dạng số nhiều nhưng KHÔNG đếm được (không dùng với số đếm trực tiếp): trousers, shorts, glasses, scissors — phải nói \"two pairs of trousers\", KHÔNG nói \"two trousers\".</p>\n  </div>\n\n  \n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-users mr-1\"></i>Chủ ngữ SỐ ÍT và SỐ NHIỀU — vì sao động từ chia khác nhau</p>\n  <p class=\"text-sm text-slate-700 mb-3\">Trong tiếng Anh, dạng của động từ (to be, to do, hay động từ thường thêm \"-s/-es\") phụ thuộc vào chủ ngữ là SỐ ÍT hay SỐ NHIỀU. Đây là quy tắc SỐNG CÒN cần nắm chắc trước khi học bất kỳ thì nào.</p>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Chủ ngữ</th><th class=\"border px-2 py-1\">Số ít hay số nhiều?</th><th class=\"border px-2 py-1\">to be</th><th class=\"border px-2 py-1\">to do</th><th class=\"border px-2 py-1\">Động từ thường (hiện tại đơn)</th></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">I</td><td class=\"border px-2 py-1\">số ít <span class=\"text-slate-400\">(nhưng chia đặc biệt)</span></td><td class=\"border px-2 py-1 font-bold\">am</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, không thêm gì)</td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">You</td><td class=\"border px-2 py-1\">số ít HOẶC số nhiều <span class=\"text-slate-400\">(luôn chia như số nhiều)</span></td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu)</td></tr>\n    <tr class=\"bg-amber-50\"><td class=\"border px-2 py-1 font-bold\">He / She / It<br><span class=\"font-normal text-xs\">(và danh từ số ít: a boy, my sister, the dog...)</span></td><td class=\"border px-2 py-1 font-bold\">SỐ ÍT</td><td class=\"border px-2 py-1 font-bold\">is</td><td class=\"border px-2 py-1 font-bold\">does</td><td class=\"border px-2 py-1 font-bold\">V + s/es <span class=\"font-normal\">(plays, watches, goes...)</span></td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">We</td><td class=\"border px-2 py-1 font-bold\">SỐ NHIỀU</td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, KHÔNG thêm s/es)</td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">They<br><span class=\"font-normal text-xs\">(và danh từ số nhiều: boys, my parents, the dogs...)</span></td><td class=\"border px-2 py-1 font-bold\">SỐ NHIỀU</td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, KHÔNG thêm s/es)</td></tr>\n  </table>\n  </div>\n  <div class=\"mt-3 space-y-1.5 text-sm text-slate-700\">\n    <p>💡 <b>Chỉ có \"He / She / It\" (ngôi thứ 3 số ít) và danh từ số ít mới thêm \"-s/-es\" vào động từ thường</b> ở thì hiện tại đơn. Mọi chủ ngữ khác (I, You, We, They) giữ nguyên động từ ở dạng nguyên mẫu.</p>\n    <p>💡 Cách nhận biết danh từ số ít/số nhiều nhanh: số ít thường có \"a/an/the/my/his...\" + danh từ KHÔNG có \"-s\" (a student); số nhiều thường có danh từ CÓ \"-s\" hoặc từ chỉ số lượng >1 (students, two students, many students).</p>\n    <p>💡 Với \"to be\" ở thì QUÁ KHỨ: số ít dùng <b>was</b> (I was, he/she/it was), số nhiều dùng <b>were</b> (we/you/they were).</p>\n  </div>\n</div>\n\n<div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>Walk you to work every day?</s> ❌ → <b>Do you walk to work every day?</b> ✅ — cần trợ động từ \"do\" khi câu trần thuật không có sẵn trợ động từ.</li>\n      <li><s>Who did buy this?</s> ❌ → <b>Who bought this?</b> ✅ — khi \"who\" làm chủ ngữ, không dùng thêm trợ động từ.</li>\n      <li><s>I need an information.</s> ❌ → <b>I need some information.</b> ✅ — \"information\" là danh từ không đếm được, không dùng với \"an\".</li>\n      <li><s>I bought two trousers.</s> ❌ → <b>I bought two pairs of trousers.</b> ✅ — \"trousers\" luôn số nhiều nhưng không đếm được trực tiếp.</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Trợ động từ (be/do/have/modal) + S + V chính...?\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1 — Yes/No Question</p>\n      <p class=\"text-sm text-slate-700\">Trợ động từ + S + V chính...?</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Wh- + trợ động từ + S + V chính...?\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2 — Wh- Question</p>\n      <p class=\"text-sm text-slate-700\">Wh- + trợ động từ + S + V chính...?</p>\n    </div>\n  </div>\n\n  <div class=\"bg-amber-50 border border-amber-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-amber-800 mb-2\"><i class=\"fa-solid fa-lightbulb mr-1\"></i>Lưu ý về phần Viết lại câu trong Unit này</p>\n    <p class=\"text-sm text-slate-700\">Phần \"Viết lại câu\" của Unit 4 trong đề cương gốc ôn lại các cấu trúc verbs of liking/disliking và spend time (đã học ở Unit 1) để giúp các em ôn tập xen kẽ — không trực tiếp luyện tập Yes/No &amp; Wh- Questions. Hãy xem lại các công thức này ở tab \"Cách viết lại câu\" nếu cần ôn lại.</p>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["bulb", "plumber", "profitable", "label"], "answer": 1, "ipas": ["/bʌlb/", "/ˈplʌmər/", "/ˈprɒfɪtəbl/", "/ˈleɪbl/"], "vis": ["bóng đèn", "thợ ống nước", "có lợi nhuận", "cái nhãn"], "explanation": "Chữ \"b\" trong \"plumber\" là âm câm (không phát âm); ba từ còn lại phát âm /b/."}, {"q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["missed", "liked", "cleaned", "stopped"], "answer": 2, "ipas": ["/mɪst/", "/laɪkt/", "/kliːnd/", "/stɒpt/"], "vis": ["đã nhớ", "đã thích", "đã dọn dẹp", "đã dừng"], "explanation": "\"cleaned\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /t/."}, {"q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["environment", "idea", "condition", "highland"], "answer": 2, "ipas": ["/ɪnˈvaɪrənmənt/", "/aɪˈdiːə/", "/kənˈdɪʃn/", "/ˈhaɪlənd/"], "vis": ["môi trường", "ý tưởng", "điều kiện", "vùng cao"], "explanation": "\"condition\" có \"i\" phát âm /ɪ/, ba từ còn lại phát âm /aɪ/."}, {"q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["brochure", "change", "machine", "champagne"], "answer": 1, "ipas": ["/broʊˈʃʊr/", "/tʃeɪndʒ/", "/məˈʃiːn/", "/ʃæmˈpeɪn/"], "vis": ["tờ rơi, sách quảng cáo", "thay đổi", "máy móc", "rượu sâm-panh"], "explanation": "\"change\" có \"ch\" phát âm /tʃ/, ba từ còn lại phát âm /ʃ/."}, {"q": "5. Which word has the underlined part pronounced differently from that of the others?", "options": ["tests", "neighbors", "cooks", "roofs"], "answer": 1, "ipas": ["/tests/", "/ˈneɪbərz/", "/kʊks/", "/ruːfs/"], "vis": ["các bài kiểm tra", "hàng xóm", "đầu bếp (số nhiều)", "mái nhà (số nhiều)"], "explanation": "\"neighbors\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/."}, {"q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["rulers", "crops", "flutes", "posts"], "answer": 0, "ipas": ["/ˈruːlərz/", "/krɒps/", "/fluːts/", "/poʊsts/"], "vis": ["người cai trị (số nhiều)", "vụ mùa (số nhiều)", "cái sáo (số nhiều)", "cột (số nhiều)"], "explanation": "\"rulers\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/."}, {"q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["flute", "feature", "costume", "livestock"], "answer": 1, "ipas": ["/fluːt/", "/ˈfiːtʃər/", "/ˈkɒstjuːm/", "/ˈlaɪvstɒk/"], "vis": ["cái sáo", "nét, đặc điểm", "trang phục", "gia súc"], "explanation": "\"feature\" có \"t\" phát âm /tʃ/, ba từ còn lại phát âm /t/."}, {"q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["knew", "flew", "grew", "drew"], "answer": 0, "ipas": ["/njuː/", "/fluː/", "/ɡruː/", "/druː/"], "vis": ["đã biết", "đã bay", "đã lớn lên", "đã vẽ"], "explanation": "\"knew\" có \"ew\" phát âm /njuː/, ba từ còn lại phát âm /uː/."}, {"q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["hear", "dear", "heart", "near"], "answer": 2, "ipas": ["/hɪr/", "/dɪr/", "/hɑːrt/", "/nɪr/"], "vis": ["nghe", "thân yêu", "trái tim", "gần"], "explanation": "\"heart\" có \"ear\" phát âm /ɑːr/, ba từ còn lại phát âm /ɪr/."}, {"q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["lived", "played", "promised", "cleaned"], "answer": 2, "ipas": ["/lɪvd/", "/pleɪd/", "/ˈprɒmɪst/", "/kliːnd/"], "vis": ["đã sống", "đã chơi", "đã hứa", "đã dọn dẹp"], "explanation": "\"promised\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /d/."}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has a different stress pattern from that of the others?", "options": ["invite", "computer", "minority", "highland"], "answer": 3, "ipas": ["/ɪnˈvaɪt/", "/kəmˈpjuːtər/", "/maɪˈnɒrəti/", "/ˈhaɪlənd/"], "vis": ["mời", "máy tính", "dân tộc thiểu số", "vùng cao"], "explanation": "\"highland\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "2. Which word has a different stress pattern from that of the others?", "options": ["wooden", "communal", "ethnic", "famous"], "answer": 1, "ipas": ["/ˈwʊdn/", "/kəˈmjuːnl/", "/ˈeθnɪk/", "/ˈfeɪməs/"], "vis": ["bằng gỗ", "chung, cộng đồng", "thuộc dân tộc", "nổi tiếng"], "explanation": "\"communal\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "3. Which word has a different stress pattern from that of the others?", "options": ["happen", "listen", "finish", "communal"], "answer": 3, "ipas": ["/ˈhæpən/", "/ˈlɪsn/", "/ˈfɪnɪʃ/", "/kəˈmjuːnl/"], "vis": ["xảy ra", "lắng nghe", "hoàn thành", "chung, cộng đồng"], "explanation": "\"communal\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "4. Which word has a different stress pattern from that of the others?", "options": ["harvest", "arrange", "costume", "famous"], "answer": 1, "ipas": ["/ˈhɑːrvɪst/", "/əˈreɪndʒ/", "/ˈkɒstjuːm/", "/ˈfeɪməs/"], "vis": ["vụ mùa", "sắp xếp", "trang phục", "nổi tiếng"], "explanation": "\"arrange\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "5. Which word has a different stress pattern from that of the others?", "options": ["gather", "statue", "ethnic", "unique"], "answer": 3, "ipas": ["/ˈɡæðər/", "/ˈstætʃuː/", "/ˈeθnɪk/", "/juˈniːk/"], "vis": ["thu thập, tụ họp", "tượng", "thuộc dân tộc", "độc đáo"], "explanation": "\"unique\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "6. Which word has a different stress pattern from that of the others?", "options": ["hunting", "custom", "feature", "overlook"], "answer": 3, "ipas": ["/ˈhʌntɪŋ/", "/ˈkʌstəm/", "/ˈfiːtʃər/", "/ˌoʊvərˈlʊk/"], "vis": ["săn bắn", "phong tục", "nét, đặc điểm", "nhìn ra"], "explanation": "\"overlook\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "7. Which word has a different stress pattern from that of the others?", "options": ["invitation", "celebration", "tradition", "information"], "answer": 2, "ipas": ["/ˌɪnvɪˈteɪʃn/", "/ˌselɪˈbreɪʃn/", "/trəˈdɪʃn/", "/ˌɪnfərˈmeɪʃn/"], "vis": ["lời mời", "lễ kỷ niệm", "truyền thống", "thông tin"], "explanation": "\"tradition\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3."}, {"q": "8. Which word has a different stress pattern from that of the others?", "options": ["custom", "invite", "greeting", "manner"], "answer": 1, "ipas": ["/ˈkʌstəm/", "/ɪnˈvaɪt/", "/ˈɡriːtɪŋ/", "/ˈmænər/"], "vis": ["phong tục", "mời", "lời chào", "cách cư xử"], "explanation": "\"invite\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "9. Which word has a different stress pattern from that of the others?", "options": ["woman", "detest", "balloon", "police"], "answer": 0, "ipas": ["/ˈwʊmən/", "/dɪˈtest/", "/bəˈluːn/", "/pəˈliːs/"], "vis": ["người phụ nữ", "ghét", "bóng bay", "cảnh sát"], "explanation": "\"woman\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "10. Which word has a different stress pattern from that of the others?", "options": ["refuse", "enter", "deny", "delay"], "answer": 1, "ipas": ["/rɪˈfjuːz/", "/ˈentər/", "/dɪˈnaɪ/", "/dɪˈleɪ/"], "vis": ["từ chối", "đi vào", "chối bỏ", "trì hoãn"], "explanation": "\"enter\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. ______ do you usually eat lunch? - At noon.", "options": ["Which", "When", "What", "How"], "answer": 1, "explanation": "Trả lời chỉ THỜI GIAN (At noon) → When.", "vis": ["cái nào", "khi nào (đúng)", "cái gì", "như thế nào"], "tags": ["grammar"]}, {"q": "2. ______ do you wash clothes? - Every week.", "options": ["Which", "Who", "What", "How often"], "answer": 3, "explanation": "Trả lời chỉ TẦN SUẤT (Every week) → How often.", "vis": ["cái nào", "ai", "cái gì", "bao lâu một lần (đúng)"], "tags": ["grammar"]}, {"q": "3. ______ does your father work? - At City Hall.", "options": ["Where", "Who", "What", "How"], "answer": 0, "explanation": "Trả lời chỉ NƠI CHỐN (At City Hall) → Where.", "vis": ["ở đâu (đúng)", "ai", "cái gì", "như thế nào"], "tags": ["grammar"]}, {"q": "4. ______ usually gets up the earliest in your family?", "options": ["Which", "Who", "What", "How"], "answer": 1, "explanation": "Hỏi về NGƯỜI làm chủ ngữ → Who.", "vis": ["cái nào", "ai (đúng)", "cái gì", "như thế nào"], "tags": ["grammar"]}, {"q": "5. ______ do you think of this hotel? - It's pretty good.", "options": ["Which", "Why", "What", "How"], "answer": 2, "explanation": "Cụm cố định \"What do you think of...?\" = bạn nghĩ gì về...?", "vis": ["cái nào", "tại sao", "cái gì (đúng — What do you think of)", "như thế nào"], "tags": ["grammar"]}, {"q": "6. ______ do you work at that company? - Because it's near my house.", "options": ["Which", "Who", "Why", "Which"], "answer": 2, "explanation": "Trả lời bắt đầu bằng \"Because\" (lý do) → Why.", "vis": ["cái nào", "ai", "tại sao (đúng)", "cái nào"], "tags": ["grammar"]}, {"q": "7. ______ dances the best in your family?", "options": ["Which", "Who", "What", "How"], "answer": 1, "explanation": "Hỏi về NGƯỜI làm chủ ngữ → Who.", "vis": ["cái nào", "ai (đúng)", "cái gì", "như thế nào"], "tags": ["grammar"]}, {"q": "8. ______ is it from the centre to the Museum of Ethnology? ~ It's about seven kilometers.", "options": ["How long", "How far", "How often", "How much"], "answer": 1, "explanation": "Trả lời chỉ KHOẢNG CÁCH (kilometers) → How far.", "vis": ["bao lâu (thời gian)", "bao xa (đúng — khoảng cách)", "bao lâu một lần", "bao nhiêu (giá/lượng)"], "tags": ["grammar"]}, {"q": "9. ______ can I buy some milk? - At the supermarket.", "options": ["Which", "Who", "Where", "How"], "answer": 2, "explanation": "Trả lời chỉ NƠI CHỐN (At the supermarket) → Where.", "vis": ["cái nào", "ai", "ở đâu (đúng)", "như thế nào"], "tags": ["grammar"]}, {"q": "10. ______ much do you weigh?", "options": ["Which", "Who", "What", "How"], "answer": 3, "explanation": "Cụm cố định \"How much do you weigh?\" = bạn nặng bao nhiêu?", "vis": ["cái nào", "ai", "cái gì", "như thế nào (đúng — How much)"], "tags": ["grammar"]}, {"q": "11. ______ hat is this? - It's my brother's.", "options": ["Which", "Whose", "What", "How"], "answer": 1, "explanation": "Trả lời chỉ SỞ HỮU (my brother's) → Whose.", "vis": ["cái nào", "của ai (đúng)", "cái gì", "như thế nào"], "tags": ["grammar"]}, {"q": "12. ______ do you like your tea? - I like it with cream and sugar.", "options": ["Which", "Who", "What", "How"], "answer": 3, "explanation": "Cụm cố định \"How do you like...?\" = bạn thích...như thế nào?", "vis": ["cái nào", "ai", "cái gì", "như thế nào (đúng)"], "tags": ["grammar"]}, {"q": "13. ______ picture do you prefer, this one or that one?", "options": ["Which", "Who", "What", "How"], "answer": 0, "explanation": "Hỏi CHỌN LỰA giữa các lựa chọn cụ thể (this one or that one) → Which.", "vis": ["cái nào (đúng)", "ai", "cái gì", "như thế nào"], "tags": ["grammar"]}, {"q": "14. ______ is that woman? - I think she is a teacher.", "options": ["Which", "Who", "When", "How"], "answer": 1, "explanation": "Hỏi về DANH TÍNH người → Who.", "vis": ["cái nào", "ai (đúng)", "khi nào", "như thế nào"], "tags": ["grammar"]}, {"q": "15. Do you know ______ language is spoken in Kenya?", "options": ["which", "who", "what", "how"], "answer": 0, "explanation": "Hỏi chọn lựa trong nhóm ngôn ngữ cụ thể → which (cũng có thể dùng what, đáp án chính là which).", "vis": ["cái nào (đúng)", "ai", "cái gì", "như thế nào"], "tags": ["grammar"]}, {"q": "16. My Son sanctuary has been recognized by UNESCO as a world _______.", "options": ["ethnic minorities", "open-air market", "heritage site", "terraced field"], "answer": 2, "explanation": "\"heritage site\" = di sản — hợp nghĩa với UNESCO công nhận.", "vis": ["dân tộc thiểu số", "chợ ngoài trời", "di sản (đúng)", "ruộng bậc thang"], "tags": ["vocab"]}, {"q": "17. If you go to Sapa, you can distinguish people from different ethnic groups by their _______.", "options": ["costumes", "livestock", "highlands", "staircases"], "answer": 0, "explanation": "\"costumes\" = trang phục — dùng để phân biệt các dân tộc.", "vis": ["trang phục (đúng)", "gia súc", "vùng cao", "cầu thang"], "tags": ["vocab"]}, {"q": "18. Xoe and Sap are _____ of Thai ethnic minority people.", "options": ["modern dances", "jazz dances", "lion dances", "folk dances"], "answer": 3, "explanation": "Xòe, Sạp là các điệu múa dân gian → folk dances.", "vis": ["múa hiện đại", "múa jazz", "múa lân", "múa dân gian (đúng)"], "tags": ["vocab"]}, {"q": "19. We spent hours in _______ house to talk with local people.", "options": ["terraced", "close", "communal", "awesome"], "answer": 2, "explanation": "\"communal house\" = nhà rông/nhà sinh hoạt cộng đồng.", "vis": ["có bậc thang", "gần", "cộng đồng, chung (đúng)", "tuyệt vời"], "tags": ["vocab"]}, {"q": "20. She wore a _______ costume of bright pink silk.", "options": ["peaceful", "ethnic", "musical", "traditional"], "answer": 3, "explanation": "\"traditional costume\" = trang phục truyền thống.", "vis": ["yên bình", "thuộc dân tộc", "thuộc âm nhạc", "truyền thống (đúng)"], "tags": ["vocab"]}, {"q": "21. You can visit Gia Lai to enjoy the gong _______.", "options": ["special", "different", "communal", "festival"], "answer": 3, "explanation": "\"gong festival\" = lễ hội cồng chiêng.", "vis": ["đặc biệt (sai từ loại)", "khác nhau", "cộng đồng", "lễ hội (đúng)"], "tags": ["vocab"]}, {"q": "22. Some _______ farmers keep ducks and geese in their farms.", "options": ["feature", "post", "soil", "poultry"], "answer": 3, "explanation": "\"poultry\" = gia cầm (vịt, ngỗng...).", "vis": ["đặc điểm", "cột", "đất trồng", "gia cầm (đúng)"], "tags": ["vocab"]}, {"q": "23. We can _______ the sea from here.", "options": ["raise", "overlook", "enrich", "weave"], "answer": 1, "explanation": "\"overlook the sea\" = nhìn ra biển.", "vis": ["chăn nuôi", "nhìn ra (đúng)", "làm giàu", "dệt, đan"], "tags": ["vocab"]}, {"q": "24. Viet Nam has 54 ethnic _______.", "options": ["groups", "levels", "turkeys", "fields"], "answer": 0, "explanation": "\"ethnic groups\" = các nhóm/dân tộc.", "vis": ["nhóm (đúng)", "cấp độ", "gà tây", "cánh đồng"], "tags": ["vocab"]}, {"q": "25. The Nung mostly live in _______ though they also live in earthen houses.", "options": ["bamboo flute", "wooden statue", "stilt houses", "travel brochure"], "answer": 2, "explanation": "\"stilt houses\" = nhà sàn — nơi ở phổ biến của người Nùng.", "vis": ["sáo tre", "tượng gỗ", "nhà sàn (đúng)", "tờ rơi du lịch"], "tags": ["vocab"]}, {"q": "26. The Lunar New Year festival is important _____ the Kinh.", "options": ["to", "with", "for", "of"], "answer": 0, "explanation": "\"important to sb\" = quan trọng đối với ai.", "vis": ["đối với (đúng)", "với", "cho", "của"], "tags": ["grammar"]}, {"q": "27. Sa Pa is famous for the ______ located in the mountainous area.", "options": ["stilt houses", "heritage site", "terraced fields", "wooden statue"], "answer": 2, "explanation": "\"terraced fields\" = ruộng bậc thang — đặc trưng của Sa Pa.", "vis": ["nhà sàn", "di sản", "ruộng bậc thang (đúng)", "tượng gỗ"], "tags": ["vocab"]}, {"q": "28. Lahu, Mang, and Brau are ________ minorities in Viet Nam.", "options": ["traditional", "ethnic", "awesome", "natural"], "answer": 1, "explanation": "\"ethnic minorities\" = các dân tộc thiểu số.", "vis": ["truyền thống", "dân tộc (đúng)", "tuyệt vời", "tự nhiên"], "tags": ["vocab"]}, {"q": "29. The goods in the open-air market are _______. You can find almost everything there.", "options": ["diverse", "similar", "unlike", "like"], "answer": 0, "explanation": "\"diverse\" = đa dạng — hợp nghĩa với \"tìm thấy hầu như mọi thứ\".", "vis": ["đa dạng (đúng)", "tương tự", "không giống", "giống"], "tags": ["vocab"]}, {"q": "30. Most ethnic minority peoples are good _____ farming techniques.", "options": ["at", "for", "to", "on"], "answer": 0, "explanation": "\"be good at\" = giỏi về việc gì.", "vis": ["giỏi về (đúng)", "cho", "đến", "trên"], "tags": ["grammar"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "1. Vietnam is one of the most _____ diverse countries in South East Asia.", "hint": "(ETHNIC)", "answer": "ethnically", "explanation": "Bổ nghĩa cho tính từ \"diverse\" cần TRẠNG TỪ → ethnically.", "vi": "Việt Nam là một trong những quốc gia đa dạng về dân tộc nhất Đông Nam Á.", "family": ["ethnic (adj): thuộc dân tộc", "ethnically (adv): về mặt dân tộc", "ethnicity (n): tính dân tộc"]}, {"q": "2. The Pa Then believe that the god of fire brings them _______and prosperity.", "hint": "(PEACEFUL)", "answer": "peace", "explanation": "Song song với danh từ \"prosperity\" (sự thịnh vượng) → cần DANH TỪ → peace.", "vi": "Người Pà Thẻn tin rằng thần lửa mang lại cho họ hòa bình và sự thịnh vượng.", "family": ["peace (n): hòa bình, sự yên bình", "peaceful (adj): yên bình, hòa bình", "peacefully (adv): một cách yên bình"]}, {"q": "3. The Tay community practice ________religious beliefs including ancestor worship.", "hint": "(TRADITION)", "answer": "traditional", "explanation": "Bổ nghĩa cho danh từ \"religious beliefs\" cần TÍNH TỪ → traditional.", "vi": "Cộng đồng người Tày thực hành các tín ngưỡng tôn giáo truyền thống bao gồm thờ cúng tổ tiên.", "family": ["tradition (n): truyền thống", "traditional (adj): thuộc về truyền thống", "traditionally (adv): theo truyền thống"]}, {"q": "4. The population of Vietnam contains a rich ______of ethnic groups.", "hint": "(DIVERSE)", "answer": "diversity", "explanation": "Sau tính từ \"rich\" cần DANH TỪ → diversity (sự đa dạng).", "vi": "Dân số Việt Nam có sự đa dạng phong phú về các nhóm dân tộc.", "family": ["diverse (adj): đa dạng", "diversity (n): sự đa dạng", "diversify (v): đa dạng hóa"]}, {"q": "5. Each time I returned I was struck by the ______ of Sapa and its people.", "hint": "(UNIQUE)", "answer": "uniqueness", "explanation": "Sau mạo từ \"the\" cần DANH TỪ → uniqueness (sự độc đáo).", "vi": "Mỗi lần trở lại, tôi đều ấn tượng bởi sự độc đáo của Sa Pa và con người nơi đây.", "family": ["unique (adj): độc đáo, duy nhất", "uniqueness (n): sự độc đáo", "uniquely (adv): một cách độc đáo"]}, {"q": "6. Vietnam is a country of great cultural __________________ with 54 ethnic groups.", "hint": "(diverse)", "answer": "diversity", "explanation": "Sau tính từ \"cultural\" cần DANH TỪ → diversity.", "vi": "Việt Nam là một đất nước có sự đa dạng văn hóa lớn với 54 dân tộc.", "family": ["diverse (adj): đa dạng", "diversity (n): sự đa dạng", "diversify (v): đa dạng hóa"]}, {"q": "7. The museum collects and preserves many ___________ artifacts of ethnic cultures.", "hint": "(history)", "answer": "historical", "explanation": "Bổ nghĩa cho danh từ \"artifacts\" cần TÍNH TỪ → historical.", "vi": "Bảo tàng sưu tầm và lưu giữ nhiều hiện vật lịch sử của các nền văn hóa dân tộc.", "family": ["history (n): lịch sử", "historical (adj): thuộc về lịch sử", "historically (adv): về mặt lịch sử"]}, {"q": "8. The Cham people once boasted a _____________ culture early in history.", "hint": "(flourish)", "answer": "flourishing", "explanation": "Bổ nghĩa cho danh từ \"culture\" cần TÍNH TỪ → flourishing (hưng thịnh).", "vi": "Người Chăm từng có một nền văn hóa hưng thịnh từ thời xa xưa.", "family": ["flourish (v): hưng thịnh, phát triển mạnh", "flourishing (adj): đang hưng thịnh"]}, {"q": "9. A number of ethnic minorities have _________ mastered farming techniques.", "hint": "(success)", "answer": "successfully", "explanation": "Bổ nghĩa cho động từ \"mastered\" cần TRẠNG TỪ → successfully.", "vi": "Nhiều dân tộc thiểu số đã thành công làm chủ các kỹ thuật canh tác.", "family": ["succeed (v): thành công", "success (n): sự thành công", "successful (adj): thành công", "successfully (adv): một cách thành công"]}, {"q": "10. The exhibition of traditional costumes was _________________ beautiful.", "hint": "(impress)", "answer": "impressively", "explanation": "Bổ nghĩa cho tính từ \"beautiful\" cần TRẠNG TỪ → impressively.", "vi": "Buổi triển lãm trang phục truyền thống đẹp một cách ấn tượng.", "family": ["impress (v): gây ấn tượng", "impression (n): ấn tượng", "impressive (adj): gây ấn tượng", "impressively (adv): một cách ấn tượng"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "A) Living in the mountains", "html": "Living in the mountains can be very hard. First, there is not enough land to ___(1)___ crops or raise livestock. Building houses is also difficult ___(2)___ the land is not flat. The air in the mountains is another problem. The higher we get, the thinner the air becomes. This means there is less oxygen, which makes breathing harder. ___(3)___ these challenges, people around the world have lived and worked in mountainous areas for centuries. There are ___(4)___ health benefits of living in the mountains. Being on the mountaintops allows you to live far from pollution. The air you breathe is fresher. There are places where you cannot drive a car or a motorbike, so you ___(5)___ walk. Travelling up and down hills and mountains on foot helps keep you active. Finally, mountain people are quite simple and ___(6)___. They live a peaceful life.", "vi": "Sống trên núi có thể rất khó khăn. Thứ nhất, không đủ đất để trồng trọt hoặc chăn nuôi. Xây nhà cũng khó vì đất không bằng phẳng. Không khí trên núi cũng là một vấn đề — càng lên cao, không khí càng loãng, nghĩa là ít oxy hơn, khiến việc thở khó khăn hơn. Bất chấp những thử thách này, con người trên khắp thế giới đã sống và làm việc ở vùng núi hàng thế kỷ. Sống trên núi có nhiều lợi ích sức khỏe: xa ô nhiễm, không khí trong lành hơn. Có những nơi không thể lái ô tô hay xe máy nên phải đi bộ, giúp cơ thể luôn vận động. Cuối cùng, người miền núi khá giản dị và thân thiện. Họ sống một cuộc sống yên bình."}, "questions": [{"q": "1.", "options": ["collect", "grow", "feed", "upload"], "answer": 1, "vis": ["thu thập", "trồng trọt (đúng)", "cho ăn", "tải lên"], "explanation": "\"grow crops\" = trồng trọt mùa màng."}, {"q": "2.", "options": ["because", "when", "so", "although"], "answer": 0, "vis": ["bởi vì (đúng)", "khi", "vì vậy", "mặc dù"], "explanation": "Xây nhà khó vì đất không bằng phẳng → nguyên nhân, dùng \"because\"."}, {"q": "3.", "options": ["Although", "But", "Despite", "Because"], "answer": 2, "vis": ["mặc dù (sai — cần mệnh đề)", "nhưng (sai vị trí đầu câu)", "bất chấp (đúng — đi với cụm danh từ \"these challenges\")", "bởi vì (sai nghĩa)"], "explanation": "\"Despite + N\" = bất chấp điều gì; sau chỗ trống là cụm danh từ \"these challenges\"."}, {"q": "4.", "options": ["a lot", "many", "a little", "a few"], "answer": 1, "vis": ["nhiều (không đếm được, sai vì health benefits đếm được)", "nhiều (đúng — đi với danh từ đếm được số nhiều)", "một ít (không đếm được)", "một vài (ít, không hợp nghĩa \"nhiều lợi ích\")"], "explanation": "\"health benefits\" là danh từ đếm được số nhiều, và ngữ cảnh cần \"nhiều\" → many."}, {"q": "5.", "options": ["cannot", "should", "musn't", "have to"], "answer": 3, "vis": ["không thể (sai nghĩa)", "nên (sai — cần diễn đạt bắt buộc)", "cấm (sai nghĩa)", "phải (đúng — bắt buộc vì không có xe)"], "explanation": "Không có xe để đi nên BẮT BUỘC phải đi bộ → have to."}, {"q": "6.", "options": ["friend", "unfriend", "friendly", "unfriendly"], "answer": 2, "vis": ["bạn (danh từ, sai từ loại)", "hủy kết bạn (sai nghĩa)", "thân thiện (đúng — tính từ)", "không thân thiện (sai nghĩa)"], "explanation": "Bổ nghĩa cho \"simple and ___\" (giản dị và thân thiện) → friendly."}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "B) Hill tribal markets", "html": "Hill tribal markets are a distinctive feature in northern mountainous provinces in Viet Nam. Every year, these unique markets attract millions of holidaymakers who love finding out the culture of ethnic ___(1)___ groups like the Tay, the Hmong, etc. Most flea markets take place once a week, from early morning till noon due to the inconvenience of long ___(2)___ between neighbouring communities. Hence, on the market days, these places are quite bustling ___(3)___ trade activities. Visitors can watch and buy a lot of local specialties including corn wine, soy bean as well as five-colour sticky rice. It's also a special occasion for the ethnic people to ___(4)___ dressed in nice colourful clothes woven by skilled women, which motivates tourists to purchase brocatelle products for their own use. What's more, ___(5)___ exciting cultural events also happen at the fairs to serve the locals ___(6)___ tourists.", "vi": "Chợ phiên vùng cao là một nét đặc trưng của các tỉnh miền núi phía Bắc Việt Nam. Hàng năm, những phiên chợ độc đáo này thu hút hàng triệu du khách yêu thích tìm hiểu văn hóa các dân tộc thiểu số như Tày, Hmông,... Hầu hết các chợ phiên họp một tuần một lần, từ sáng sớm tới trưa do khoảng cách xa giữa các cộng đồng lân cận. Vì vậy, vào ngày chợ phiên, những nơi này khá nhộn nhịp với các hoạt động buôn bán. Du khách có thể ngắm và mua nhiều đặc sản địa phương như rượu ngô, đậu tương, xôi ngũ sắc. Đây cũng là dịp đặc biệt để người dân tộc mặc những bộ trang phục nhiều màu sắc do những người phụ nữ khéo tay dệt nên, thu hút du khách mua các sản phẩm thổ cẩm. Ngoài ra, nhiều sự kiện văn hóa thú vị cũng diễn ra tại các phiên chợ để phục vụ cả người dân địa phương và du khách."}, "questions": [{"q": "1.", "options": ["village", "minority", "country", "highland"], "answer": 1, "vis": ["làng", "thiểu số (đúng)", "đất nước", "vùng cao"], "explanation": "\"ethnic minority groups\" = các nhóm dân tộc thiểu số."}, {"q": "2.", "options": ["direction", "roads", "ways", "distances"], "answer": 3, "vis": ["hướng", "con đường", "cách thức", "khoảng cách (đúng)"], "explanation": "\"long distances\" = khoảng cách xa giữa các cộng đồng."}, {"q": "3.", "options": ["with", "of", "about", "at"], "answer": 0, "vis": ["với (đúng — bustling with)", "của", "về", "tại"], "explanation": "\"bustling with trade activities\" = nhộn nhịp với hoạt động buôn bán."}, {"q": "4.", "options": ["wash", "wear", "get", "put on"], "answer": 2, "vis": ["rửa", "mặc (động từ thường)", "get dressed (đúng — cụm cố định)", "mặc vào (sai vì cần \"get dressed\")"], "explanation": "Cụm cố định \"get dressed\" = mặc quần áo."}, {"q": "5.", "options": ["a lot", "many", "much", "a little"], "answer": 1, "vis": ["nhiều (không hợp cấu trúc)", "nhiều (đúng — đi với danh từ đếm được số nhiều \"events\")", "nhiều (không đếm được, sai)", "một ít (sai nghĩa)"], "explanation": "\"events\" đếm được số nhiều → many."}, {"q": "6.", "options": ["and", "but", "so", "nor"], "answer": 0, "vis": ["và (đúng — liệt kê 2 đối tượng)", "nhưng", "vì vậy", "cũng không"], "explanation": "Phục vụ cả người dân địa phương VÀ du khách → and."}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "C) Cua Van floating village", "html": "There is an ethnic group living in Ha Long Bay which is a UNESCO World Heritage site in Quang Ninh province, in the northeast of Viet Nam. It has got over 1,600 islands and islets. Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains. All the houses and buildings in the village float on huge wooden rafts. The villagers spend their days fishing and looking after the sea life. Then they sail to the mainland to trade their fish for things like food, drinking water or clothes. Most children go to floating schools and then spend the rest of their time learning important skills like swimming and fishing. They also help out their parents as much as they can. This lifestyle may seem strange to many people, but it's so wonderful to live among such natural beauty and know you are protecting it. The villagers are able to help preserve their beautiful bay because they live directly on the water.", "vi": "Có một cộng đồng dân cư sống ở Vịnh Hạ Long — di sản thế giới UNESCO thuộc tỉnh Quảng Ninh, đông bắc Việt Nam, với hơn 1.600 hòn đảo lớn nhỏ. Trong số nhiều làng chài cổ ở Vịnh Hạ Long, chỉ còn làng chài nổi Cửa Vạn. Mọi nhà cửa trong làng đều nổi trên các bè gỗ lớn. Người dân làng dành cả ngày đánh cá và chăm sóc sinh vật biển, sau đó chèo thuyền vào đất liền để đổi cá lấy thức ăn, nước uống hoặc quần áo. Hầu hết trẻ em học ở các trường nổi rồi dành thời gian còn lại học các kỹ năng quan trọng như bơi lội và đánh cá, đồng thời giúp đỡ cha mẹ. Lối sống này có thể lạ với nhiều người, nhưng thật tuyệt khi được sống giữa vẻ đẹp thiên nhiên như vậy và biết mình đang bảo vệ nó. Người dân làng có thể giúp bảo tồn vịnh đẹp này vì họ sống trực tiếp trên mặt nước."}, "questions": [{"q": "1. Ha Long Bay is located in Quang Ninh Province, in the northeast of Viet Nam.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Ha Long Bay... Quang Ninh province, in the northeast of Viet Nam\" → Đúng."}, {"q": "2. Cua Van is the only ancient floating fishing village that remains in Ha Long Bay.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"only Cua Van floating village remains\" → Đúng."}, {"q": "3. The villagers usually buy fish from the mainland and sell it to other people.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: họ BÁN cá cho đất liền để đổi lấy thức ăn, không phải MUA cá từ đất liền → Sai."}, {"q": "4. Most children in Cua Van floating village attend floating schools.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Most children go to floating schools\" → Đúng."}, {"q": "5. The passage is mainly about:", "options": ["How Ha Long bay became a UNESCO World Heritage.", "The beauty of nature in Ha Long bay.", "The life of people in Cua Van ancient village.", "The geographical features of Ha Long bay."], "answer": 2, "explanation": "Bài đọc chủ yếu miêu tả cuộc sống của người dân làng cổ Cửa Vạn."}, {"q": "6. The word \"they\" in paragraph 2 is closest in meaning to:", "options": ["the houses", "the villagers", "the builders", "the schools"], "answer": 1, "explanation": "\"they\" thay thế cho \"the villagers\" (những người dân làng)."}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "D) Ethnic Groups in Vietnam", "html": "Vietnam is a multi-ethnic country with 54 ethnic groups. The Viet (Kinh) people account for 87% of the country's population and mainly inhabit the Red River Delta, the central coastal delta, the Mekong Delta, and major cities. The other 53 ethnic minority groups, totaling over 8 million people, are scattered over mountain areas spreading from the North to the South. Among ethnic minorities, the most populated are Tay, Thai, Muong, Hoa, Khmer, and Nung, with a population of around 1 million each. Meanwhile, the least populated are Brau, Roman, and Odu, with several hundred people each. The main economic activity of most ethnic peoples is wet rice cultivation. Some ethnic minorities have mastered farming techniques, growing rice plants in flooded paddy fields and carrying out irrigation. Others go hunting, fishing, collecting, and live a semi-nomadic life. Each group has its own diverse and special culture. Beliefs and religions among Vietnamese ethnic minority groups are also different from one another.", "vi": "Việt Nam là quốc gia đa dân tộc với 54 dân tộc. Người Kinh chiếm 87% dân số cả nước, chủ yếu sống ở đồng bằng sông Hồng, đồng bằng ven biển miền Trung, đồng bằng sông Cửu Long và các thành phố lớn. 53 dân tộc thiểu số còn lại, tổng cộng hơn 8 triệu người, sống rải rác ở vùng núi trải dài từ Bắc vào Nam. Trong số các dân tộc thiểu số, đông nhất là Tày, Thái, Mường, Hoa, Khmer, Nùng, mỗi dân tộc khoảng 1 triệu người. Trong khi đó, ít dân nhất là Brâu, Rơ Măm, Ơ Đu, mỗi dân tộc chỉ vài trăm người. Hoạt động kinh tế chính của hầu hết các dân tộc là trồng lúa nước. Một số dân tộc thiểu số đã thành thạo kỹ thuật canh tác, trồng lúa trên ruộng ngập nước và làm thủy lợi. Số khác đi săn bắn, đánh cá, hái lượm và sống du cư bán phần. Mỗi dân tộc có nền văn hóa đa dạng và đặc sắc riêng. Tín ngưỡng và tôn giáo giữa các dân tộc thiểu số Việt Nam cũng khác nhau."}, "questions": [{"q": "1. Vietnam has 54 ethnic groups.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Vietnam is a multi-ethnic country with 54 ethnic groups\" → Đúng."}, {"q": "2. The Viet (Kinh) people make up 87% of Vietnam's population.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The Viet (Kinh) people account for 87%...\" → Đúng."}, {"q": "3. All ethnic minority groups in Vietnam live in major cities.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: các dân tộc thiểu số sống rải rác ở vùng núi, không phải thành phố lớn → Sai."}, {"q": "4. Wet rice cultivation is the main economic activity of most ethnic peoples.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The main economic activity of most ethnic peoples is wet rice cultivation\" → Đúng."}, {"q": "5. Which ethnic group accounts for 87% of Vietnam's population?", "options": ["Tay", "Thai", "Viet (Kinh)", "Muong"], "answer": 2, "explanation": "Bài đọc: \"The Viet (Kinh) people account for 87%...\"."}, {"q": "6. Where do most ethnic minority groups live?", "options": ["In major cities", "In the Red River Delta", "In mountain areas", "In the Mekong Delta"], "answer": 2, "explanation": "Bài đọc: các dân tộc thiểu số \"scattered over mountain areas\"."}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "1.", "original": "It is not a problem to me whether I have to pick her up to the cinema or not.", "starter": "I don't mind", "answer": "picking her up to the cinema", "accepted": null, "explanation": "It is not a problem to sb whether S + V or not → sb + don't/doesn't mind + V-ing", "vi": "Việc tôi có phải đón cô ấy đi xem phim hay không cũng không phải vấn đề gì với tôi.", "note": "It is not a problem to sb whether S + V or not → sb + don't/doesn't mind + V-ing"}, {"q": "2.", "original": "John cannot bear listening to such kind of noisy music.", "starter": "John dislikes", "answer": "listening to such kind of noisy music", "accepted": null, "explanation": "S + cannot bear + V-ing → S + dislike(s) + V-ing", "vi": "John không chịu được việc nghe loại nhạc ồn ào đó.", "note": "S + cannot bear + V-ing → S + dislike(s) + V-ing"}, {"q": "3.", "original": "Watching historical films is very interesting to my younger brother.", "starter": "My younger brother enjoys", "answer": "watching historical films", "accepted": null, "explanation": "V-ing... + be interesting to sb → sb + enjoy(s) + V-ing", "vi": "Xem phim lịch sử rất thú vị đối với em trai tôi.", "note": "V-ing... + be interesting to sb → sb + enjoy(s) + V-ing"}, {"q": "4.", "original": "She cannot bear talking with him about what he likes.", "starter": "She hates", "answer": "talking with him about what he likes", "accepted": null, "explanation": "S + cannot bear + V-ing → S + hate(s) + V-ing", "vi": "Cô ấy không thể chịu đựng được việc nói chuyện với anh ta về những gì anh ta thích.", "note": "S + cannot bear + V-ing → S + hate(s) + V-ing"}, {"q": "5.", "original": "The thing that I hate most is motor racing, and I will never do it in my life.", "starter": "I detest", "answer": "motor racing, and I will never do it in my life", "accepted": null, "explanation": "The thing that S hate(s) most is N → S + detest(s) + N", "vi": "Điều tôi ghét nhất là đua xe, và tôi sẽ không bao giờ làm việc đó trong đời.", "note": "The thing that S hate(s) most is N → S + detest(s) + N"}, {"q": "6.", "original": "It is really interesting for him to talk with his music teacher about jazz.", "starter": "He fancies", "answer": "talking with his music teacher about jazz", "accepted": null, "explanation": "It is interesting for sb to V → sb + fancy/fancies + V-ing", "vi": "Việc trò chuyện với giáo viên âm nhạc về nhạc jazz thực sự rất thú vị đối với cậu ấy.", "note": "It is interesting for sb to V → sb + fancy/fancies + V-ing"}, {"q": "7.", "original": "He uses all his free time to look after his garden.", "starter": "He spends", "answer": "all his free time looking after his garden", "accepted": null, "explanation": "S + use(s) all + time + to V → S + spend(s) all + time + V-ing", "vi": "Cậu ấy dùng hết thời gian rảnh để chăm sóc khu vườn của mình.", "note": "S + use(s) all + time + to V → S + spend(s) all + time + V-ing"}, {"q": "8.", "original": "Making crafts or collecting things like stamps and coins are very interesting.", "starter": "It's very interesting", "answer": "to make crafts or collect things like stamps and coins", "accepted": null, "explanation": "V-ing... + be very interesting (chủ ngữ là V-ing) → It's very interesting to V (chủ ngữ giả It)", "vi": "Làm đồ thủ công hoặc sưu tầm những thứ như tem và tiền xu rất thú vị.", "note": "V-ing... + be very interesting (chủ ngữ là V-ing) → It's very interesting to V (chủ ngữ giả It)"}, {"q": "9.", "original": "We usually visit museums when we have leisure time.", "starter": "We enjoy", "answer": "visiting museums when we have leisure time", "accepted": null, "explanation": "S + usually + V → S + enjoy(s) + V-ing", "vi": "Chúng tôi thường đi thăm bảo tàng khi có thời gian rảnh.", "note": "S + usually + V → S + enjoy(s) + V-ing"}, {"q": "10.", "original": "I don't like to get up early and prepare breakfast in the cold winter days.", "starter": "I hate", "answer": "getting up early and preparing breakfast in the cold winter days", "accepted": null, "explanation": "S + don't/doesn't like + to V → S + hate(s) + V-ing", "vi": "Tôi không thích dậy sớm và chuẩn bị bữa sáng vào những ngày mùa đông lạnh giá.", "note": "S + don't/doesn't like + to V → S + hate(s) + V-ing"}, {"q": "11.", "original": "It took us 30 minutes to rehearse the song.", "starter": "We spent", "answer": "30 minutes rehearsing the song", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Chúng tôi mất 30 phút để tập bài hát.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}, {"q": "12.", "original": "It took Tom one hour to travel to his hometown last week.", "starter": "Tom spent", "answer": "one hour travelling to his hometown last week", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Tom đã mất một tiếng để đi về quê tuần trước.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}, {"q": "13.", "original": "It took him 30 minutes to watch the play.", "starter": "He spent", "answer": "30 minutes watching the play", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Cậu ấy đã mất 30 phút để xem vở kịch.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}, {"q": "14.", "original": "He likes swimming and sunbathing.", "starter": "He is interested", "answer": "in swimming and sunbathing", "accepted": null, "explanation": "S + like(s) + V-ing → S + be interested in + V-ing", "vi": "Anh ấy thích bơi lội và tắm nắng.", "note": "S + like(s) + V-ing → S + be interested in + V-ing"}, {"q": "15.", "original": "It took her nearly an hour to do the crossword.", "starter": "She spent", "answer": "nearly an hour doing the crossword", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Cô ấy đã mất gần một tiếng để giải ô chữ.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"costume\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "costume", "ipa": "/ˈkɒstjuːm/", "pos": "noun", "senses": [{"def": "the clothes worn by actors in a play or film/movie, or worn by somebody pretending to be somebody else; clothes worn to represent a particular culture, nation or period", "examples": ["The actors were already in full costume.", "The film won an Oscar for best costume design.", "She wore an elaborate historical costume to the party.", "The children dressed up in Halloween costumes.", "She wears a traditional national costume for the festival."]}], "vi": "<b>costume</b> /ˈkɒstjuːm/ (danh từ)<br>trang phục diễn viên mặc trong phim/kịch, hoặc trang phục đại diện cho một nền văn hóa/dân tộc/thời kỳ.<br>• Các diễn viên đã mặc trang phục đầy đủ.<br>• Bộ phim đoạt giải Oscar cho thiết kế trang phục xuất sắc nhất.<br>• Cô ấy mặc bộ trang phục lịch sử công phu đến bữa tiệc.<br>• Trẻ em hóa trang trong trang phục Halloween.<br>• Cô ấy mặc trang phục truyền thống dân tộc trong lễ hội."}, "questions": [{"q": "A. For the museum's opening night, the staff wore ____________________ from the 18th century.", "answer": "historical costumes", "explanation": "Dựa vào ví dụ \"elaborate historical costume\": historical costumes.", "vi": "Trong đêm khai mạc bảo tàng, nhân viên mặc trang phục lịch sử từ thế kỷ 18."}, {"q": "B. At the international cultural fair, each participant proudly wears their ____________________.", "answer": "national costume", "explanation": "Dựa vào ví dụ: national costume (trang phục dân tộc).", "vi": "Tại hội chợ văn hóa quốc tế, mỗi người tham gia tự hào mặc trang phục dân tộc của mình."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"minority\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "minority", "ipa": "/maɪˈnɒrəti/", "pos": "noun", "senses": [{"def": "the smaller part of a group; a group of people who are different from the larger group in a country, because of their race, religion, etc.", "examples": ["Only a small minority of students voted against the new school uniform.", "Local residents are in the minority regarding the decision to build a new mall.", "The government is working to protect the rights of ethnic minorities.", "She belongs to a religious minority in her hometown."]}], "vi": "<b>minority</b> /maɪˈnɒrəti/ (danh từ)<br>phần nhỏ hơn của một nhóm; nhóm người khác biệt với nhóm lớn hơn trong một quốc gia do chủng tộc, tôn giáo,...<br>• Chỉ một số ít học sinh phản đối đồng phục mới.<br>• Cư dân địa phương là thiểu số trong quyết định xây trung tâm thương mại mới.<br>• Chính phủ đang nỗ lực bảo vệ quyền của các dân tộc thiểu số.<br>• Cô ấy thuộc một nhóm tôn giáo thiểu số ở quê nhà."}, "questions": [{"q": "A. The festival celebrates the traditional music and dance of various __________________ in the region.", "answer": "ethnic minorities", "explanation": "Dựa vào ví dụ: ethnic minorities.", "vi": "Lễ hội tôn vinh âm nhạc và điệu múa truyền thống của các dân tộc thiểu số trong vùng."}, {"q": "B. The survey showed that only __________________ of people prefer working from home full-time.", "answer": "a minority", "explanation": "Dựa vào ví dụ: a minority (of people).", "vi": "Khảo sát cho thấy chỉ một số ít người thích làm việc tại nhà toàn thời gian."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "15. What does the sign tell you?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫🐕</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO PETS ALLOWED</p></div>", "options": ["Only local pets are welcome here.", "Pets are allowed if they are on a leash.", "Pets are allowed in this area.", "You are not allowed to bring pets here."], "answer": 3, "vis": ["Chỉ thú cưng địa phương được chào đón.", "Thú cưng được phép nếu có dây xích.", "Thú cưng được phép ở khu vực này.", "Bạn không được mang thú cưng vào đây."], "explanation": "Biểu tượng chó gạch chéo → cấm mang thú cưng vào."}, {"q": "16. What does this notice mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🎒📢🏫</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">LOST ITEM? CONTACT SCHOOL OFFICE</p></div>", "options": ["Contact the school office to get the lost item back.", "Go to the school gate if you want to sell your wallet.", "Wait for someone to call you from the school office.", "You can buy a handmade craft wallet at the school yard."], "answer": 0, "vis": ["Liên hệ văn phòng trường để nhận lại đồ thất lạc.", "Đến cổng trường nếu muốn bán ví của bạn.", "Chờ ai đó gọi bạn từ văn phòng trường.", "Bạn có thể mua ví thủ công ở sân trường."], "explanation": "Thông báo về đồ thất lạc, liên hệ văn phòng trường để nhận lại."}, {"q": "17. What does this sign tell you?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🐢🚸🚗</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">SLOW DOWN — SCHOOL AHEAD</p></div>", "options": ["Drivers must slow down because school children are ahead.", "You can drive as fast as you want here.", "You should look for a parking lot near the school.", "High-speed vehicles are permitted on this road."], "answer": 0, "vis": ["Tài xế phải giảm tốc độ vì phía trước có học sinh.", "Bạn có thể lái nhanh tùy ý ở đây.", "Bạn nên tìm bãi đỗ xe gần trường.", "Xe tốc độ cao được phép trên đường này."], "explanation": "Biển báo khu vực trường học → yêu cầu giảm tốc độ."}, {"q": "18. What does this notice tell students?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🖥️📅✅</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">UPDATED VIRTUAL TOUR SCHEDULE — READY TOMORROW</p></div>", "options": ["The new schedule for the virtual tour cannot be changed.", "The updated schedule will be ready for viewing tomorrow.", "The virtual tour is canceled until next week.", "Students can join the virtual tour this afternoon."], "answer": 1, "vis": ["Lịch trình mới của chuyến tham quan ảo không thể thay đổi.", "Lịch trình cập nhật sẽ sẵn sàng để xem vào ngày mai.", "Chuyến tham quan ảo bị hủy đến tuần sau.", "Học sinh có thể tham gia chuyến tham quan ảo chiều nay."], "explanation": "Thông báo: lịch trình cập nhật sẽ có vào ngày mai."}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 4", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 4 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>bulb</b> <span class='text-slate-400'>/bʌlb/</span> · <b class='text-emerald-700'>plumber</b> <span class='text-slate-400'>/ˈplʌmər/</span> · <b class='text-slate-500'>profitable</b> <span class='text-slate-400'>/ˈprɒfɪtəbl/</span> · <b class='text-slate-500'>label</b> <span class='text-slate-400'>/ˈleɪbl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 Chữ \"b\" trong \"plumber\" là âm câm (không phát âm); ba từ còn lại phát âm /b/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>missed</b> <span class='text-slate-400'>/mɪst/</span> · <b class='text-slate-500'>liked</b> <span class='text-slate-400'>/laɪkt/</span> · <b class='text-emerald-700'>cleaned</b> <span class='text-slate-400'>/kliːnd/</span> · <b class='text-slate-500'>stopped</b> <span class='text-slate-400'>/stɒpt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"cleaned\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /t/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>environment</b> <span class='text-slate-400'>/ɪnˈvaɪrənmənt/</span> · <b class='text-slate-500'>idea</b> <span class='text-slate-400'>/aɪˈdiːə/</span> · <b class='text-emerald-700'>condition</b> <span class='text-slate-400'>/kənˈdɪʃn/</span> · <b class='text-slate-500'>highland</b> <span class='text-slate-400'>/ˈhaɪlənd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"condition\" có \"i\" phát âm /ɪ/, ba từ còn lại phát âm /aɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>brochure</b> <span class='text-slate-400'>/broʊˈʃʊr/</span> · <b class='text-emerald-700'>change</b> <span class='text-slate-400'>/tʃeɪndʒ/</span> · <b class='text-slate-500'>machine</b> <span class='text-slate-400'>/məˈʃiːn/</span> · <b class='text-slate-500'>champagne</b> <span class='text-slate-400'>/ʃæmˈpeɪn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"change\" có \"ch\" phát âm /tʃ/, ba từ còn lại phát âm /ʃ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>tests</b> <span class='text-slate-400'>/tests/</span> · <b class='text-emerald-700'>neighbors</b> <span class='text-slate-400'>/ˈneɪbərz/</span> · <b class='text-slate-500'>cooks</b> <span class='text-slate-400'>/kʊks/</span> · <b class='text-slate-500'>roofs</b> <span class='text-slate-400'>/ruːfs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"neighbors\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-emerald-700'>rulers</b> <span class='text-slate-400'>/ˈruːlərz/</span> · <b class='text-slate-500'>crops</b> <span class='text-slate-400'>/krɒps/</span> · <b class='text-slate-500'>flutes</b> <span class='text-slate-400'>/fluːts/</span> · <b class='text-slate-500'>posts</b> <span class='text-slate-400'>/poʊsts/</span></p><p class='text-xs text-blue-700 mt-0
