<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{ --accent:#1d4ed8; --accent2:#0891b2; }
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#f5f3ff; }
  .hero-gradient{ background: linear-gradient(135deg, #7c2d12 0%, #ea580c 55%, #f59e0b 100%); }
  .tab-btn{ transition: all .2s ease; }
  .tab-btn.active{ background: linear-gradient(135deg, #7c2d12, #f59e0b); color:#fff; box-shadow:0 4px 14px rgba(124,45,18,.35); transform:translateY(-1px); }
  .task-card{ transition: box-shadow .2s, transform .2s; }
  .task-card:hover{ transform: translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  .mcq-detail-hidden{ display:none; }
  .show-mcq-detail .mcq-detail-hidden{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:var(--accent); }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .voice-ok{ color:#16a34a; } .voice-warn{ color:#d97706; }

  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
  table.border-collapse td, table.border-collapse th{ border:1px solid #e2e8f0; }
</style>

<script>
const DATA = {"unit": 2, "sections": [{"roman": "", "navLabel": "Lý thuyết", "title": "Từ vựng - Ngữ pháp - Hướng dẫn Word Form", "icon": "lightbulb", "type": "info", "info": "<div class='mb-5'><p class=\"text-sm text-slate-500 italic mb-3\">Ôn lại từ vựng, ngữ pháp trọng tâm và cách làm dạng bài Word Form trước khi luyện tập.</p></div><div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. healthy</span><span class='text-slate-400 text-xs'>(adj) /ˈhelθi/</span><span class='text-slate-500 text-xs ml-auto'>khỏe mạnh, lành mạnh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. lifestyle</span><span class='text-slate-400 text-xs'>(n) /ˈlaɪfstaɪl/</span><span class='text-slate-500 text-xs ml-auto'>lối sống</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. obesity</span><span class='text-slate-400 text-xs'>(n) /əʊˈbiːsəti/</span><span class='text-slate-500 text-xs ml-auto'>bệnh béo phì</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. junk food</span><span class='text-slate-400 text-xs'>(n) /ˈdʒʌŋk fuːd/</span><span class='text-slate-500 text-xs ml-auto'>đồ ăn vặt không lành mạnh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. calorie</span><span class='text-slate-400 text-xs'>(n) /ˈkæləri/</span><span class='text-slate-500 text-xs ml-auto'>calo</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. protein</span><span class='text-slate-400 text-xs'>(n) /ˈprəʊtiːn/</span><span class='text-slate-500 text-xs ml-auto'>chất đạm</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. flu</span><span class='text-slate-400 text-xs'>(n) /fluː/</span><span class='text-slate-500 text-xs ml-auto'>cúm</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. cough</span><span class='text-slate-400 text-xs'>(n, v) /kɒf/</span><span class='text-slate-500 text-xs ml-auto'>ho</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. itchy</span><span class='text-slate-400 text-xs'>(adj) /ˈɪtʃi/</span><span class='text-slate-500 text-xs ml-auto'>ngứa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. acne</span><span class='text-slate-400 text-xs'>(n) /ˈækni/</span><span class='text-slate-500 text-xs ml-auto'>mụn trứng cá</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. sunburn</span><span class='text-slate-400 text-xs'>(n) /ˈsʌnbɜːn/</span><span class='text-slate-500 text-xs ml-auto'>cháy nắng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. fit</span><span class='text-slate-400 text-xs'>(adj) /fɪt/</span><span class='text-slate-500 text-xs ml-auto'>khỏe mạnh, cân đối</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. fitness</span><span class='text-slate-400 text-xs'>(n) /ˈfɪtnəs/</span><span class='text-slate-500 text-xs ml-auto'>thể lực, sự khỏe mạnh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. physical</span><span class='text-slate-400 text-xs'>(adj) /ˈfɪzɪkl/</span><span class='text-slate-500 text-xs ml-auto'>thuộc về thể chất</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. rest</span><span class='text-slate-400 text-xs'>(v, n) /rest/</span><span class='text-slate-500 text-xs ml-auto'>nghỉ ngơi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. gain weight</span><span class='text-slate-400 text-xs'>(v.phr) /ɡeɪn weɪt/</span><span class='text-slate-500 text-xs ml-auto'>tăng cân</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. lose weight</span><span class='text-slate-400 text-xs'>(v.phr) /luːz weɪt/</span><span class='text-slate-500 text-xs ml-auto'>giảm cân</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. prevent</span><span class='text-slate-400 text-xs'>(v) /prɪˈvent/</span><span class='text-slate-500 text-xs ml-auto'>phòng ngừa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. avoid</span><span class='text-slate-400 text-xs'>(v) /əˈvɔɪd/</span><span class='text-slate-500 text-xs ml-auto'>tránh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. expert</span><span class='text-slate-400 text-xs'>(n) /ˈekspɜːt/</span><span class='text-slate-500 text-xs ml-auto'>chuyên gia</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Câu mệnh lệnh (Imperatives)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng để đưa ra lời khuyên, chỉ dẫn, yêu cầu. Không có chủ ngữ, động từ ở dạng nguyên mẫu.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">V (nguyên mẫu) + O</td><td class=\"border px-2 py-1 italic\">Eat more vegetables. <span class=\"not-italic text-slate-500\">— Hãy ăn nhiều rau hơn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">Don't + V (nguyên mẫu) + O</td><td class=\"border px-2 py-1 italic\">Don't skip breakfast. <span class=\"not-italic text-slate-500\">— Đừng bỏ bữa sáng.</span></td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-comment-medical mr-1\"></i>2. Should / Shouldn't (Lời khuyên)</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + should + V (nguyên mẫu)</td><td class=\"border px-2 py-1 italic\">You should drink more water. <span class=\"not-italic text-slate-500\">— Bạn nên uống nhiều nước hơn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + shouldn't + V (nguyên mẫu)</td><td class=\"border px-2 py-1 italic\">You shouldn't eat too much sugar. <span class=\"not-italic text-slate-500\">— Bạn không nên ăn quá nhiều đường.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Nghi vấn</td><td class=\"border px-2 py-1\">Should + S + V?</td><td class=\"border px-2 py-1 italic\">Should I see a doctor? <span class=\"not-italic text-slate-500\">— Tôi có nên đi khám bác sĩ không?</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Sau \"should/shouldn't\" LUÔN là động từ NGUYÊN MẪU, không thêm \"to\", không chia thì.</p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>You should to eat more fruit.</s> ❌ → <b>You should eat more fruit.</b> ✅ — không dùng \"to\" sau \"should\".</li>\n      <li><s>You should eating more fruit.</s> ❌ → <b>You should eat more fruit.</b> ✅ — không dùng V-ing sau \"should\".</li>\n      <li><s>Don't to eat junk food.</s> ❌ → <b>Don't eat junk food.</b> ✅ — mệnh lệnh phủ định không dùng \"to\".</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"It's a good idea to V = S + should + V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">It's a good idea to V<br>= S + should + V</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Don't + V = S + shouldn't + V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">Don't + V<br>= S + shouldn't + V</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["h<u>ea</u>lthy", "w<u>a</u>ter", "dis<u>ea</u>se", "s<u>i</u>mple"], "answer": 2, "explanation": "\"disease\" có \"ea\" phát âm /iː/ (nguyên âm dài), \"healthy\" có \"ea\" phát âm /e/, \"simple\" /ɪ/, \"water\" /ɔː/. Theo đáp án gợi ý: disease.", "ipas": ["/ˈhelθi/", "/ˈwɔːtə/", "/dɪˈziːz/", "/ˈsɪmpl/"], "vis": ["khỏe mạnh", "nước", "bệnh", "đơn giản"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["<u>e</u>xercise", "<u>e</u>nergy", "v<u>e</u>getable", "<u>i</u>mportant"], "answer": 3, "explanation": "\"important\" có \"i\" phát âm /ɪ/, ba từ còn lại có \"e\" phát âm /e/.", "ipas": ["/ˈeksəsaɪz/", "/ˈenədʒi/", "/ˈvedʒtəbl/", "/ɪmˈpɔːtnt/"], "vis": ["bài tập thể dục", "năng lượng", "rau củ", "quan trọng"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["b<u>a</u>lance", "l<u>i</u>festyle", "rout<u>i</u>ne", "adv<u>i</u>ce"], "answer": 2, "explanation": "\"routine\" có \"i\" phát âm /iː/, \"lifestyle\" và \"advice\" có \"i\" phát âm /aɪ/. Theo đáp án gợi ý: routine.", "ipas": ["/ˈbæləns/", "/ˈlaɪfstaɪl/", "/ruːˈtiːn/", "/ədˈvaɪs/"], "vis": ["sự cân bằng", "lối sống", "thói quen hằng ngày", "lời khuyên"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["<u>e</u>xercise", "w<u>o</u>nderful", "r<u>e</u>gular", "<u>e</u>ducation"], "answer": 1, "explanation": "\"wonderful\" có \"o\" phát âm /ʌ/, ba từ còn lại có \"e\" phát âm /e/.", "ipas": ["/ˈeksəsaɪz/", "/ˈwʌndəfl/", "/ˈreɡjələ/", "/ˌedʒuˈkeɪʃn/"], "vis": ["bài tập thể dục", "tuyệt vời", "đều đặn", "giáo dục"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["m<u>e</u>dicine", "v<u>i</u>tamin", "<u>a</u>llergy", "pr<u>o</u>tect"], "answer": 1, "explanation": "\"vitamin\" (Anh-Mỹ /ˈvaɪtəmɪn/) có nguyên âm đôi /aɪ/, ba từ còn lại là nguyên âm ngắn /e/, /æ/, /ə/. Theo đáp án gợi ý: vitamin.", "ipas": ["/ˈmedsn/", "/ˈvaɪtəmɪn/", "/ˈælədʒi/", "/prəˈtekt/"], "vis": ["thuốc", "vitamin", "dị ứng", "bảo vệ"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["h<u>ea</u>lthy", "c<u>a</u>reful", "<u>a</u>ctive", "dis<u>ea</u>se"], "answer": 3, "explanation": "\"disease\" có \"ea\" phát âm /iː/; \"healthy\" /e/, \"active\" /æ/, \"careful\" /eə/. Theo đáp án gợi ý: disease.", "ipas": ["/ˈhelθi/", "/ˈkeəfl/", "/ˈæktɪv/", "/dɪˈziːz/"], "vis": ["khỏe mạnh", "cẩn thận", "năng động", "bệnh"]}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "Which word has a different stress pattern from that of the others?", "options": ["healthy", "avoid", "advice", "disease"], "answer": 0, "explanation": "\"healthy\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "ipas": ["/ˈhelθi/", "/əˈvɔɪd/", "/ədˈvaɪs/", "/dɪˈziːz/"], "vis": ["khỏe mạnh", "tránh", "lời khuyên", "bệnh"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["calorie", "vegetable", "important", "exercise"], "answer": 2, "explanation": "\"important\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈkæləri/", "/ˈvedʒtəbl/", "/ɪmˈpɔːtnt/", "/ˈeksəsaɪz/"], "vis": ["calo", "rau củ", "quan trọng", "bài tập thể dục"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["breakfast", "dinner", "enjoy", "water"], "answer": 2, "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈbrekfəst/", "/ˈdɪnə/", "/ɪnˈdʒɔɪ/", "/ˈwɔːtə/"], "vis": ["bữa sáng", "bữa tối", "thích thú", "nước"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["fitness", "become", "habit", "cycle"], "answer": 1, "explanation": "\"become\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈfɪtnəs/", "/bɪˈkʌm/", "/ˈhæbɪt/", "/ˈsaɪkl/"], "vis": ["sự cân đối", "trở nên", "thói quen", "đạp xe, chu kỳ"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["dentist", "doctor", "instead", "patient"], "answer": 2, "explanation": "\"instead\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈdentɪst/", "/ˈdɒktə/", "/ɪnˈsted/", "/ˈpeɪʃnt/"], "vis": ["nha sĩ", "bác sĩ", "thay vào đó", "bệnh nhân; kiên nhẫn"]}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "You should eat a lot of fruits and vegetables because they ______ much vitamin A.", "options": ["run", "take", "have", "get"], "answer": 2, "explanation": "Trái cây và rau chứa (have) nhiều vitamin A.", "vi": "Bạn nên ăn nhiều trái cây và rau vì chúng có nhiều vitamin A.", "tags": ["vocab"]}, {"q": "The seafood I ate this morning makes me feel ______ all over.", "options": ["itchy", "weak", "running", "well"], "answer": 0, "explanation": "Ăn hải sản bị dị ứng → ngứa khắp người: itchy.", "vi": "Hải sản tôi ăn sáng nay khiến tôi ngứa khắp người.", "tags": ["vocab"]}, {"q": "If you want to be fit, stay outdoors more and do more ______ activities.", "options": ["physics", "physic", "physical", "physically"], "answer": 2, "explanation": "Tính từ bổ nghĩa cho \"activities\": physical (thể chất).", "vi": "Nếu muốn khỏe mạnh, hãy ra ngoài trời nhiều hơn và làm nhiều hoạt động thể chất hơn.", "tags": ["vocab"]}, {"q": "Do more exercise ______ eat more fruit and vegetables.", "options": ["and", "so", "but", "although"], "answer": 0, "explanation": "Hai mệnh lệnh cùng chiều → nối bằng and.", "vi": "Hãy tập thể dục nhiều hơn và ăn nhiều trái cây, rau củ hơn.", "tags": ["grammar"]}, {"q": "After working on a computer for long hours, you should ______ your eyes and relax.", "options": ["wake", "rest", "sleep", "sleep in"], "answer": 1, "explanation": "\"rest your eyes\" = cho mắt nghỉ ngơi.", "vi": "Sau khi làm việc với máy tính nhiều giờ, bạn nên cho mắt nghỉ và thư giãn.", "tags": ["vocab"]}, {"q": "Eat less high-fat food to keep you from ______ weight.", "options": ["gaining", "reducing", "rising", "losing"], "answer": 0, "explanation": "\"gain weight\" = tăng cân; keep sb from + V-ing.", "vi": "Ăn ít đồ nhiều chất béo để tránh tăng cân.", "tags": ["grammar"]}, {"q": "We should follow advice from doctors and health ______ to keep fit.", "options": ["managers", "experts", "workers", "players"], "answer": 1, "explanation": "\"health experts\" = chuyên gia sức khỏe.", "vi": "Chúng ta nên làm theo lời khuyên của bác sĩ và chuyên gia sức khỏe để giữ dáng.", "tags": ["vocab"]}, {"q": "Have a healthy ______ and you can enjoy your life.", "options": ["lifeline", "lively", "lives", "lifestyle"], "answer": 3, "explanation": "\"healthy lifestyle\" = lối sống lành mạnh.", "vi": "Hãy có một lối sống lành mạnh và bạn có thể tận hưởng cuộc sống.", "tags": ["vocab"]}, {"q": "Rob eats a lot of fast food, so he ______ on a lot of weight.", "options": ["spends", "brings", "takes", "puts"], "answer": 3, "explanation": "\"put on weight\" = tăng cân.", "vi": "Rob ăn nhiều đồ ăn nhanh, nên cậu ấy tăng cân nhiều.", "tags": ["vocab"]}, {"q": "We need to spend less time ______ computer games.", "options": ["playing", "to playing", "play", "to play"], "answer": 0, "explanation": "\"spend time + V-ing\" → playing.", "vi": "Chúng ta cần dành ít thời gian hơn để chơi game máy tính.", "tags": ["grammar"]}, {"q": "To prevent ______, you should eat well and keep your body warm.", "options": ["flu", "toothache", "sunburn", "obesity"], "answer": 0, "explanation": "Ăn uống tốt và giữ ấm cơ thể → phòng cúm (flu).", "vi": "Để phòng cúm, bạn nên ăn uống đầy đủ và giữ ấm cơ thể.", "tags": ["vocab"]}, {"q": "Be careful with ______ you eat and drink.", "options": ["who", "where", "what", "when"], "answer": 2, "explanation": "\"what you eat and drink\" = những gì bạn ăn và uống.", "vi": "Hãy cẩn thận với những gì bạn ăn và uống.", "tags": ["vocab"]}, {"q": "Eating a lot of junk food may lead to ______.", "options": ["fitness", "obesity", "energy", "health"], "answer": 1, "explanation": "Ăn nhiều đồ ăn vặt → béo phì (obesity).", "vi": "Ăn nhiều đồ ăn vặt có thể dẫn đến béo phì.", "tags": ["vocab"]}, {"q": "Which food is the healthiest?", "options": ["chips", "soft drinks", "fresh fruit", "candy"], "answer": 2, "explanation": "Trái cây tươi là thực phẩm lành mạnh nhất.", "vi": "Thực phẩm nào lành mạnh nhất?", "tags": ["vocab"]}, {"q": "Don't ______ too much time playing computer games.", "options": ["spend", "spends", "spending", "to spend"], "answer": 0, "explanation": "Câu mệnh lệnh phủ định: Don't + V nguyên thể.", "vi": "Đừng dành quá nhiều thời gian chơi game máy tính.", "tags": ["grammar"]}, {"q": "You have chapped lips. You should use some ______.", "options": ["eye drops", "lip balm", "tofu", "sunburn"], "answer": 1, "explanation": "Môi nứt nẻ → dùng kem dưỡng môi (lip balm).", "vi": "Môi bạn bị nứt nẻ. Bạn nên dùng kem dưỡng môi.", "tags": ["vocab"]}, {"q": "You should use ______ if your eyes are dry.", "options": ["lip balm", "junk food", "protein", "eye drops"], "answer": 3, "explanation": "Mắt khô → dùng thuốc nhỏ mắt (eye drops).", "vi": "Bạn nên dùng thuốc nhỏ mắt nếu mắt bị khô.", "tags": ["vocab"]}, {"q": "Tofu and soybeans are good sources of ______.", "options": ["calories", "protein", "viruses", "acne"], "answer": 1, "explanation": "Đậu phụ và đậu nành là nguồn đạm (protein) tốt.", "vi": "Đậu phụ và đậu nành là nguồn chất đạm tốt.", "tags": ["vocab"]}, {"q": "Eating too much candy is not good ______ your teeth.", "options": ["at", "from", "for", "with"], "answer": 2, "explanation": "\"be good/bad for\" = tốt/xấu cho.", "vi": "Ăn quá nhiều kẹo không tốt cho răng của bạn.", "tags": ["vocab"]}, {"q": "You should drink ______ water when the weather is hot.", "options": ["fewer", "little", "less", "more"], "answer": 3, "explanation": "Trời nóng → uống nhiều nước hơn: more.", "vi": "Bạn nên uống nhiều nước hơn khi trời nóng.", "tags": ["vocab"]}, {"q": "If you want to stay in shape, ______ more exercise.", "options": ["make", "do", "take", "play"], "answer": 1, "explanation": "\"do exercise\" = tập thể dục.", "vi": "Nếu muốn giữ dáng, hãy tập thể dục nhiều hơn.", "tags": ["vocab"]}, {"q": "Don't stay up too late, ______ you may feel tired the next day.", "options": ["so", "and", "but", "or"], "answer": 3, "explanation": "Mệnh lệnh + or = nếu không thì... (hậu quả).", "vi": "Đừng thức quá khuya, nếu không bạn có thể thấy mệt vào hôm sau.", "tags": ["mixed"]}, {"q": "Lan has an allergy, ______ she avoids some kinds of seafood.", "options": ["so", "but", "or", "yet"], "answer": 0, "explanation": "Nguyên nhân → kết quả: dùng so.", "vi": "Lan bị dị ứng, vì vậy cô ấy tránh một số loại hải sản.", "tags": ["vocab"]}, {"q": "Nam wants to lose weight, ______ he still eats a lot of junk food.", "options": ["so", "and", "but", "for"], "answer": 2, "explanation": "Ý tương phản (muốn giảm cân nhưng vẫn ăn đồ ăn vặt) → but.", "vi": "Nam muốn giảm cân, nhưng cậu ấy vẫn ăn nhiều đồ ăn vặt.", "tags": ["vocab"]}, {"q": "You should eat less fast food ______ more vegetables.", "options": ["but", "and", "or", "yet"], "answer": 1, "explanation": "Hai lời khuyên cùng chiều → and.", "vi": "Bạn nên ăn ít đồ ăn nhanh hơn và nhiều rau hơn.", "tags": ["mixed"]}, {"q": "A healthy diet gives your body enough ______.", "options": ["pimples", "coughs", "viruses", "vitamins"], "answer": 3, "explanation": "Chế độ ăn lành mạnh cung cấp đủ vitamin.", "vi": "Một chế độ ăn lành mạnh cung cấp cho cơ thể bạn đủ vitamin.", "tags": ["vocab"]}, {"q": "Too much sun can cause ______.", "options": ["a cough", "a virus", "a calorie", "sunburn"], "answer": 3, "explanation": "Nắng nhiều → cháy nắng (sunburn).", "vi": "Quá nhiều nắng có thể gây cháy nắng.", "tags": ["vocab"]}, {"q": "Acne is a common skin ______ among teenagers.", "options": ["condition", "calorie", "expert", "shape"], "answer": 0, "explanation": "\"skin condition\" = tình trạng da.", "vi": "Mụn trứng cá là một tình trạng da phổ biến ở thanh thiếu niên.", "tags": ["mixed"]}, {"q": "You should ______ touching your face with dirty hands.", "options": ["pop", "put", "avoid", "coordinate"], "answer": 2, "explanation": "\"avoid + V-ing\" = tránh làm gì.", "vi": "Bạn nên tránh chạm tay bẩn lên mặt.", "tags": ["grammar"]}, {"q": "Regular exercise helps you stay ______.", "options": ["itchy", "dim", "chapped", "fit"], "answer": 3, "explanation": "\"stay fit\" = giữ dáng, khỏe mạnh.", "vi": "Tập thể dục đều đặn giúp bạn giữ được sự cân đối, khỏe mạnh.", "tags": ["vocab"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "Doing exercise every day is good for your ________________.", "hint": "(health)", "answer": "health", "explanation": "Sau tính từ sở hữu \"your\" cần danh từ: health.", "vi": "Tập thể dục mỗi ngày tốt cho sức khỏe của bạn.", "family": ["health (n): sức khỏe", "healthy (adj): khỏe mạnh, lành mạnh", "unhealthy (adj): không lành mạnh", "healthily (adv): một cách lành mạnh"]}, {"q": "Eating too much fast food is _______________ for us.", "hint": "(health)", "answer": "unhealthy", "explanation": "Ăn quá nhiều đồ ăn nhanh là không lành mạnh: unhealthy.", "vi": "Ăn quá nhiều đồ ăn nhanh không tốt cho sức khỏe chúng ta.", "family": ["health (n): sức khỏe", "healthy (adj): khỏe mạnh, lành mạnh", "unhealthy (adj): không lành mạnh", "healthily (adv): một cách lành mạnh"]}, {"q": "My father always drives his car ________________.", "hint": "(care)", "answer": "carefully", "explanation": "Trạng từ bổ nghĩa cho động từ \"drives\": carefully.", "vi": "Bố tôi luôn lái xe cẩn thận.", "family": ["care (n/v): sự cẩn thận; chăm sóc", "careful (adj): cẩn thận", "careless (adj): bất cẩn", "carefully (adv): một cách cẩn thận"]}, {"q": "Remember to drive ________________ when it rains.", "hint": "(care)", "answer": "carefully", "explanation": "Trạng từ bổ nghĩa cho \"drive\": carefully.", "vi": "Nhớ lái xe cẩn thận khi trời mưa.", "family": ["care (n/v): sự cẩn thận; chăm sóc", "careful (adj): cẩn thận", "careless (adj): bất cẩn", "carefully (adv): một cách cẩn thận"]}, {"q": "Fruit gives us a lot of ________________.", "hint": "(energy)", "answer": "energy", "explanation": "Sau \"a lot of\" cần danh từ: energy.", "vi": "Trái cây cho chúng ta nhiều năng lượng.", "family": ["energy (n): năng lượng", "energetic (adj): tràn đầy năng lượng", "energetically (adv): một cách hăng hái"]}, {"q": "Tuấn is a _____________ student, he rarely makes mistakes in the tests.", "hint": "(care)", "answer": "careful", "explanation": "Tính từ bổ nghĩa cho danh từ \"student\": careful.", "vi": "Tuấn là một học sinh cẩn thận, cậu ấy hiếm khi mắc lỗi trong bài kiểm tra.", "family": ["care (n/v): sự cẩn thận; chăm sóc", "careful (adj): cẩn thận", "careless (adj): bất cẩn", "carefully (adv): một cách cẩn thận"]}, {"q": "Running is a good outdoor ________________.", "hint": "(act)", "answer": "activity", "explanation": "Sau \"a good outdoor\" cần danh từ số ít: activity.", "vi": "Chạy bộ là một hoạt động ngoài trời tốt.", "family": ["act (v): hành động", "activity (n): hoạt động", "active (adj): năng động", "actively (adv): một cách tích cực"]}, {"q": "You have to brush your teeth ________________.", "hint": "(regular)", "answer": "regularly", "explanation": "Trạng từ bổ nghĩa cho động từ \"brush\": regularly.", "vi": "Bạn phải đánh răng đều đặn.", "family": ["regular (adj): đều đặn", "regularly (adv): một cách đều đặn", "regularity (n): tính đều đặn"]}, {"q": "We should eat a ________________ diet.", "hint": "(balance)", "answer": "balanced", "explanation": "Tính từ -ed bổ nghĩa cho \"diet\": balanced (cân bằng).", "vi": "Chúng ta nên ăn một chế độ ăn cân bằng.", "family": ["balance (n/v): sự cân bằng; cân bằng", "balanced (adj): cân bằng", "unbalanced (adj): mất cân bằng"]}, {"q": "My eating habits are ________________ from yours.", "hint": "(differ)", "answer": "different", "explanation": "\"be different from\" = khác với.", "vi": "Thói quen ăn uống của tôi khác với của bạn.", "family": ["differ (v): khác", "difference (n): sự khác biệt", "different (adj): khác", "differently (adv): một cách khác"]}, {"q": "A ______________ lifestyle helps you live longer.", "hint": "(health)", "answer": "healthy", "explanation": "Tính từ bổ nghĩa cho \"lifestyle\": healthy.", "vi": "Một lối sống lành mạnh giúp bạn sống lâu hơn.", "family": ["health (n): sức khỏe", "healthy (adj): khỏe mạnh, lành mạnh", "unhealthy (adj): không lành mạnh", "healthily (adv): một cách lành mạnh"]}, {"q": "We feel really ______________ when the doctor says we're great.", "hint": "(happiness)", "answer": "happy", "explanation": "Sau \"feel\" dùng tính từ: happy.", "vi": "Chúng ta cảm thấy rất vui khi bác sĩ nói chúng ta khỏe.", "family": ["happy (adj): vui vẻ", "happily (adv): một cách vui vẻ", "happiness (n): niềm hạnh phúc", "unhappy (adj): không vui"]}, {"q": "You should do _______________ exercise every morning.", "hint": "(regular)", "answer": "regular", "explanation": "Tính từ bổ nghĩa cho \"exercise\": regular.", "vi": "Bạn nên tập thể dục đều đặn mỗi sáng.", "family": ["regular (adj): đều đặn", "regularly (adv): một cách đều đặn", "regularity (n): tính đều đặn"]}, {"q": "Good health brings ________________ to people.", "hint": "(happy)", "answer": "happiness", "explanation": "Sau động từ \"brings\" cần danh từ làm tân ngữ: happiness.", "vi": "Sức khỏe tốt mang lại hạnh phúc cho mọi người.", "family": ["happy (adj): vui vẻ", "happily (adv): một cách vui vẻ", "happiness (n): niềm hạnh phúc", "unhappy (adj): không vui"]}, {"q": "Thank you a lot. This advice is very ________________.", "hint": "(use)", "answer": "useful", "explanation": "Tính từ sau \"very\": useful (hữu ích).", "vi": "Cảm ơn rất nhiều. Lời khuyên này rất hữu ích.", "family": ["use (v): sử dụng", "useful (adj): hữu ích", "useless (adj): vô ích"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "Passage 1: Healthy Habits", "html": "Healthy habits are important for students because they help us feel active and study better every day. Everyone should <span class='blank-tag'>(1)</span> ______ healthy food. Fruit and vegetables are good <span class='blank-tag'>(2)</span> ______ our bodies. They give us vitamins and energy for school and daily activities. We should drink enough <span class='blank-tag'>(3)</span> ______ every day. Drinking water is especially important after playing sports or spending time outdoors. It is also important to <span class='blank-tag'>(4)</span> ______ exercise regularly. Walking, cycling, or playing badminton are simple ways to keep fit. Don't eat too <span class='blank-tag'>(5)</span> ______ junk food because it is not good for your <span class='blank-tag'>(6)</span> ______. We should also sleep about eight hours each night and take short breaks when we feel tired. Small healthy choices can make a big difference to our lives.", "vi": "Thói quen lành mạnh rất quan trọng với học sinh vì chúng giúp ta cảm thấy năng động và học tốt hơn mỗi ngày. Mọi người nên (1) ăn thực phẩm lành mạnh. Trái cây và rau củ tốt (2) cho cơ thể. Chúng cung cấp vitamin và năng lượng cho việc học và các hoạt động hằng ngày. Ta nên uống đủ (3) nước mỗi ngày. Uống nước đặc biệt quan trọng sau khi chơi thể thao hoặc ở ngoài trời. Việc (4) tập thể dục đều đặn cũng quan trọng. Đi bộ, đạp xe hay chơi cầu lông là những cách đơn giản để giữ dáng. Đừng ăn quá (5) nhiều đồ ăn vặt vì nó không tốt cho (6) sức khỏe của bạn. Ta cũng nên ngủ khoảng tám tiếng mỗi đêm và nghỉ ngắn khi mệt. Những lựa chọn lành mạnh nhỏ có thể tạo nên khác biệt lớn cho cuộc sống."}, "questions": [{"q": "(1) Everyone should ______ healthy food.", "options": ["eat", "eats", "eating", "ate"], "answer": 0, "explanation": "Sau \"should\" dùng động từ nguyên thể: eat.", "vi": null, "vis": ["ăn (nguyên thể)", "ăn (ngôi 3)", "đang ăn", "đã ăn"]}, {"q": "(2) Fruit and vegetables are good ______ our bodies.", "options": ["at", "for", "in", "on"], "answer": 1, "explanation": "\"be good for\" = tốt cho.", "vi": null, "vis": ["tại", "cho (good for)", "trong", "trên"]}, {"q": "(3) We should drink enough ______ every day.", "options": ["milk", "juice", "water", "cola"], "answer": 2, "explanation": "Câu sau nói về \"Drinking water\" → water.", "vi": null, "vis": ["sữa", "nước ép", "nước", "cô-la"]}, {"q": "(4) It is also important to ______ exercise regularly.", "options": ["do", "make", "play", "take"], "answer": 0, "explanation": "\"do exercise\" = tập thể dục.", "vi": null, "vis": ["làm (do exercise)", "làm ra", "chơi", "lấy"]}, {"q": "(5) Don't eat too ______ junk food.", "options": ["many", "much", "lot", "more"], "answer": 1, "explanation": "\"junk food\" không đếm được → too much.", "vi": null, "vis": ["nhiều (đếm được)", "nhiều (không đếm được)", "nhiều (a lot)", "hơn"]}, {"q": "(6) It is not good for your ______.", "options": ["health", "healthy", "healthily", "healthier"], "answer": 0, "explanation": "Sau \"your\" cần danh từ: health.", "vi": null, "vis": ["sức khỏe (n)", "khỏe mạnh (adj)", "một cách lành mạnh (adv)", "khỏe hơn"]}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "Passage 2: A Healthy Day", "html": "Lan is a 7th grade student in Hoa Mai secondary school. She wants to stay healthy for her studying. She gets <span class='blank-tag'>(1)</span> ______ early every morning, at about 5:30 a.m. She usually <span class='blank-tag'>(2)</span> ______ breakfast before school. Then she walks to her school and begins her morning classes. After school, she often plays <span class='blank-tag'>(3)</span> ______ with her friends. In the evening, she doesn't watch TV for too <span class='blank-tag'>(4)</span> ______. Lan always has vegetables in her meals. Sometimes she drinks soft drink after meals, but she often drinks milk instead. She goes to bed <span class='blank-tag'>(5)</span> ______ because sleep is important for good <span class='blank-tag'>(6)</span> ______. You should follow Lan's healthy living, so that you can get your best health condition and studying.", "vi": "Lan là học sinh lớp 7 trường THCS Hoa Mai. Cô ấy muốn giữ sức khỏe để học tập. Cô ấy (1) thức dậy sớm mỗi sáng, khoảng 5:30. Cô ấy thường (2) ăn sáng trước khi đến trường. Sau đó cô ấy đi bộ đến trường và bắt đầu các tiết học buổi sáng. Sau giờ học, cô ấy thường chơi (3) trò chơi với bạn bè. Buổi tối, cô ấy không xem TV quá (4) lâu. Lan luôn có rau trong các bữa ăn. Đôi khi cô ấy uống nước ngọt sau bữa ăn, nhưng cô ấy thường uống sữa thay thế. Cô ấy đi ngủ (5) sớm vì giấc ngủ rất quan trọng cho (6) sức khỏe tốt. Bạn nên làm theo lối sống lành mạnh của Lan để có sức khỏe và việc học tốt nhất."}, "questions": [{"q": "(1) She gets ______ early every morning.", "options": ["on", "up", "in", "out"], "answer": 1, "explanation": "\"get up\" = thức dậy.", "vi": null, "vis": ["lên (get on)", "thức dậy (get up)", "vào (get in)", "ra (get out)"]}, {"q": "(2) She usually ______ breakfast before school.", "options": ["has", "have", "having", "had"], "answer": 0, "explanation": "Chủ ngữ \"She\" + hiện tại đơn → has breakfast.", "vi": null, "vis": ["ăn (ngôi 3)", "ăn (nguyên thể)", "đang ăn", "đã ăn"]}, {"q": "(3) After school, she often plays ______ with her friends.", "options": ["games", "homework", "piano", "books"], "answer": 0, "explanation": "\"play games with friends\" = chơi trò chơi với bạn bè.", "vi": null, "vis": ["trò chơi", "bài tập về nhà", "đàn piano", "sách"]}, {"q": "(4) She doesn't watch TV for too ______.", "options": ["many", "long", "much", "often"], "answer": 1, "explanation": "\"for too long\" = quá lâu.", "vi": null, "vis": ["nhiều", "lâu (for too long)", "nhiều", "thường xuyên"]}, {"q": "(5) She goes to bed ______ because sleep is important.", "options": ["late", "early", "slowly", "never"], "answer": 1, "explanation": "Lối sống lành mạnh → đi ngủ sớm: early.", "vi": null, "vis": ["muộn", "sớm", "chậm", "không bao giờ"]}, {"q": "(6) Sleep is important for good ______.", "options": ["healthy", "health", "healthily", "healthier"], "answer": 1, "explanation": "Sau tính từ \"good\" cần danh từ: health.", "vi": null, "vis": ["khỏe mạnh (adj)", "sức khỏe (n)", "một cách lành mạnh (adv)", "khỏe hơn"]}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Passage 1: Tom's Healthy Lifestyle", "html": "Tom is thirteen years old. He's now living with his parents and his two younger brother and sister. Let's take a look at his living style. He eats fruits every day and drinks plenty of water. He rides his bike to school and plays badminton three times a week. Sometimes he and his 2 siblings go swimming on the weekend. He rarely eats fast food because he wants to stay healthy. Everyone in his family usually has vegetables in their meals. He often goes to bed at 9 p.m. with his 2 siblings, so they can get up on time next morning and study well all day.", "vi": "Tom mười ba tuổi. Cậu đang sống với bố mẹ và hai em nhỏ. Hãy xem lối sống của cậu. Cậu ăn trái cây mỗi ngày và uống nhiều nước. Cậu đạp xe đến trường và chơi cầu lông ba lần một tuần. Đôi khi cậu và hai em đi bơi vào cuối tuần. Cậu hiếm khi ăn đồ ăn nhanh vì muốn giữ sức khỏe. Mọi người trong gia đình cậu thường có rau trong bữa ăn. Cậu thường đi ngủ lúc 9 giờ tối cùng hai em, để có thể dậy đúng giờ vào sáng hôm sau và học tốt cả ngày."}, "questions": [{"q": "Tom is 13 years old.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Tom is thirteen years old\" → Đúng.", "vi": "Tom 13 tuổi.", "vis": ["Đúng", "Sai"]}, {"q": "He drinks little water every day.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"drinks plenty of water\" (uống nhiều nước) → Sai.", "vi": "Cậu ấy uống ít nước mỗi ngày.", "vis": ["Đúng", "Sai"]}, {"q": "He rides a bike to school.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"He rides his bike to school\" → Đúng.", "vi": "Cậu ấy đạp xe đến trường.", "vis": ["Đúng", "Sai"]}, {"q": "He often eats fast food to stay healthy.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"He rarely eats fast food\" → Sai.", "vi": "Cậu ấy thường ăn đồ ăn nhanh để giữ sức khỏe.", "vis": ["Đúng", "Sai"]}, {"q": "How often does Tom play badminton?", "options": ["every day", "twice a week", "three times a week", "once a week"], "answer": 2, "explanation": "Bài đọc: \"plays badminton three times a week\".", "vi": "Tom chơi cầu lông bao lâu một lần?", "vis": ["mỗi ngày", "hai lần một tuần", "ba lần một tuần", "một lần một tuần"]}, {"q": "Why does Tom rarely eat fast food?", "options": ["To stay healthy.", "To save money.", "To ride faster.", "To sleep early."], "answer": 0, "explanation": "Bài đọc: \"because he wants to stay healthy\".", "vi": "Tại sao Tom hiếm khi ăn đồ ăn nhanh?", "vis": ["Để giữ sức khỏe.", "Để tiết kiệm tiền.", "Để đạp xe nhanh hơn.", "Để ngủ sớm."]}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Passage 2: Mai's Habits", "html": "Mai likes vegetables and milk. She usually has a simple breakfast before school and takes a bottle of water with her. At school, she enjoys learning and tries not to eat too much fast food. She goes to bed at 10 p.m. every day and gets up early. After getting up, she often does some light exercise and helps her mother prepare breakfast. She spends one hour exercising after school. Sometimes she walks in the park with her friends, and on other days she rides her bike around her neighbourhood. In the evening, Mai finishes her homework before relaxing with a book or some music. She feels active and happy. Mai believes that healthy habits help her study better and have more energy for school activities.", "vi": "Mai thích rau và sữa. Cô thường ăn sáng đơn giản trước khi đến trường và mang theo một chai nước. Ở trường, cô thích học và cố gắng không ăn quá nhiều đồ ăn nhanh. Cô đi ngủ lúc 10 giờ tối mỗi ngày và dậy sớm. Sau khi thức dậy, cô thường tập thể dục nhẹ và giúp mẹ chuẩn bị bữa sáng. Cô dành một tiếng tập thể dục sau giờ học. Đôi khi cô đi bộ trong công viên với bạn bè, những ngày khác cô đạp xe quanh khu phố. Buổi tối, Mai hoàn thành bài tập trước khi thư giãn với sách hoặc nhạc. Cô cảm thấy năng động và vui vẻ. Mai tin rằng thói quen lành mạnh giúp cô học tốt hơn và có nhiều năng lượng hơn cho các hoạt động ở trường."}, "questions": [{"q": "Mai dislikes vegetables.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Mai likes vegetables and milk\" → Sai.", "vi": "Mai không thích rau.", "vis": ["Đúng", "Sai"]}, {"q": "She sleeps late every night.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: đi ngủ lúc 10 giờ tối và dậy sớm → không ngủ muộn → Sai.", "vi": "Cô ấy ngủ muộn mỗi đêm.", "vis": ["Đúng", "Sai"]}, {"q": "She exercises for one hour after school.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"She spends one hour exercising after school\" → Đúng.", "vi": "Cô ấy tập thể dục một tiếng sau giờ học.", "vis": ["Đúng", "Sai"]}, {"q": "She feels active and happy.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"She feels active and happy\" → Đúng.", "vi": "Cô ấy cảm thấy năng động và vui vẻ.", "vis": ["Đúng", "Sai"]}, {"q": "What time does Mai go to bed every day?", "options": ["8 p.m.", "9 p.m.", "10 p.m.", "11 p.m."], "answer": 2, "explanation": "Bài đọc: \"She goes to bed at 10 p.m. every day\".", "vi": "Mai đi ngủ lúc mấy giờ mỗi ngày?", "vis": ["8 giờ tối", "9 giờ tối", "10 giờ tối", "11 giờ tối"]}, {"q": "How long does Mai exercise after school?", "options": ["thirty minutes", "one hour", "two hours", "three hours"], "answer": 1, "explanation": "Bài đọc: \"She spends one hour exercising after school\".", "vi": "Mai tập thể dục bao lâu sau giờ học?", "vis": ["ba mươi phút", "một tiếng", "hai tiếng", "ba tiếng"]}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "R1.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>keep/ We/ to avoid/ should/ warm/ a cold./</b>", "starter": "", "answer": "We should keep warm to avoid a cold.", "accepted": null, "explanation": "S + should + V + to V (mục đích).", "vi": "Chúng ta nên giữ ấm để tránh bị cảm lạnh.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R2.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>Getting/ study/ you/ well./ enough sleep/ helps/</b>", "starter": "", "answer": "Getting enough sleep helps you study well.", "accepted": null, "explanation": "V-ing (chủ ngữ) + helps + sb + V.", "vi": "Ngủ đủ giấc giúp bạn học tốt.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R3.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>in our diet/. /an important role/ play/ Vitamins/</b>", "starter": "", "answer": "Vitamins play an important role in our diet.", "accepted": null, "explanation": "\"play an important role in\" = đóng vai trò quan trọng trong.", "vi": "Vitamin đóng vai trò quan trọng trong chế độ ăn của chúng ta.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R4.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>should not/ more/ computer games./ play/ You/</b>", "starter": "", "answer": "You should not play more computer games.", "accepted": null, "explanation": "S + should not + V + O.", "vi": "Bạn không nên chơi thêm game máy tính nữa.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R5.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>Mai/ see/ tomorrow./ will/ the doctor/ go to/</b>", "starter": "", "answer": "Mai will go to see the doctor tomorrow.", "accepted": null, "explanation": "S + will + go to see + O + tomorrow.", "vi": "Mai sẽ đi khám bác sĩ vào ngày mai.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "T1.", "original": "It's a good idea to drink more water.", "starter": "You should", "answer": "drink more water", "accepted": null, "explanation": "It's a good idea to + V = You should + V.", "vi": "Bạn nên uống nhiều nước hơn.", "note": "It's a good idea to + V → S + should + V"}, {"q": "T2.", "original": "Don't eat too much junk food.", "starter": "You shouldn't", "answer": "eat too much junk food", "accepted": null, "explanation": "Don't + V = You shouldn't + V.", "vi": "Bạn không nên ăn quá nhiều đồ ăn vặt.", "note": "Don't + V → S + shouldn't + V"}, {"q": "T3.", "original": "My brother cycles to school every day.", "starter": "My brother goes", "answer": "to school by bike every day", "accepted": ["to school by bike every day", "to school by bicycle every day"], "explanation": "cycle = go by bike/bicycle.", "vi": "Anh tôi đi học bằng xe đạp mỗi ngày.", "note": "S + cycle(s) + to + place → S + go(es) + to + place + by bike"}, {"q": "T4.", "original": "Let's play badminton.", "starter": "Why don't we", "answer": "play badminton", "accepted": null, "explanation": "Let's + V = Why don't we + V?", "vi": "Sao chúng ta không chơi cầu lông nhỉ?", "note": "Let's + V → Why don't we + V?"}, {"q": "T5.", "original": "It is important to exercise every day.", "starter": "We should", "answer": "exercise every day", "accepted": ["exercise every day", "do exercise every day"], "explanation": "It is important to + V = We should + V.", "vi": "Chúng ta nên tập thể dục mỗi ngày.", "note": "It is important to + V → S + should + V"}, {"q": "T6.", "original": "Lan likes eating healthy food because she wants to be fit.", "starter": "Lan is", "answer": "interested in eating healthy food because she wants to be fit", "accepted": ["interested in eating healthy food because she wants to be fit", "fond of eating healthy food because she wants to be fit", "keen on eating healthy food because she wants to be fit"], "explanation": "like + V-ing = be interested in / fond of / keen on + V-ing.", "vi": "Lan thích ăn thực phẩm lành mạnh vì cô ấy muốn khỏe mạnh.", "note": "S + like + V-ing → S + be interested in / fond of / keen on + V-ing"}, {"q": "T7.", "original": "Nam doesn't drink enough water.", "starter": "Nam should", "answer": "drink more water", "accepted": null, "explanation": "Không uống đủ nước → nên uống nhiều nước hơn.", "vi": "Nam nên uống nhiều nước hơn.", "note": "S + doesn't + V + enough + N → S + should + V + more + N"}, {"q": "T8.", "original": "Walking regularly is good for your health.", "starter": "You should", "answer": "walk regularly", "accepted": null, "explanation": "V-ing + is good for you = You should + V.", "vi": "Bạn nên đi bộ thường xuyên.", "note": "V-ing + is good for your health → S + should + V"}, {"q": "T9.", "original": "You must wash your hands before meals.", "starter": "Don't forget", "answer": "to wash your hands before meals", "accepted": null, "explanation": "must + V = Don't forget to + V.", "vi": "Đừng quên rửa tay trước bữa ăn.", "note": "S + must + V → Don't forget to + V"}, {"q": "T10.", "original": "It is not good to stay up late.", "starter": "I think you shouldn't", "answer": "stay up late", "accepted": null, "explanation": "It is not good to + V = You shouldn't + V.", "vi": "Tôi nghĩ bạn không nên thức khuya.", "note": "It is not good to + V → S + shouldn't + V"}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"healthy\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "healthy", "ipa": "/ˈhelθi/", "pos": "adjective", "senses": [{"def": "having or showing good health; helping to produce good health", "examples": ["a healthy child", "a healthy appetite", "Regular exercise keeps you healthy.", "Try to eat a healthy, balanced diet."]}], "vi": "<b>healthy</b> /ˈhelθi/ (tính từ)<br>có hoặc thể hiện sức khỏe tốt; giúp tạo ra sức khỏe tốt.<br>• một đứa trẻ khỏe mạnh<br>• sự thèm ăn tốt (dấu hiệu khỏe mạnh)<br>• Tập thể dục đều đặn giúp bạn khỏe mạnh.<br>• Hãy cố gắng ăn theo chế độ lành mạnh, cân bằng."}, "questions": [{"q": "A. Doctors recommend that we eat a _______________, balanced diet every day.", "answer": "healthy", "explanation": "Dựa vào ví dụ: a healthy, balanced diet.", "vi": "Bác sĩ khuyên chúng ta nên ăn theo chế độ lành mạnh, cân bằng mỗi ngày."}, {"q": "B. Regular exercise and enough sleep can keep you _______________.", "answer": "healthy", "explanation": "Dựa vào ví dụ: keeps you healthy.", "vi": "Tập thể dục đều đặn và ngủ đủ giấc có thể giúp bạn khỏe mạnh."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"avoid\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "avoid", "ipa": "/əˈvɔɪd/", "pos": "verb", "senses": [{"def": "to stay away from somebody/something; to try to prevent something from happening or to try not to do something", "examples": ["You should avoid eating too much sugar.", "Try to avoid stress if possible.", "She avoided answering my question.", "Drivers should avoid this road during rush hour."]}], "vi": "<b>avoid</b> /əˈvɔɪd/ (động từ)<br>tránh xa ai/cái gì; cố gắng ngăn điều gì xảy ra hoặc cố không làm gì.<br>• Bạn nên tránh ăn quá nhiều đường.<br>• Cố gắng tránh căng thẳng nếu có thể.<br>• Cô ấy tránh trả lời câu hỏi của tôi.<br>• Tài xế nên tránh con đường này vào giờ cao điểm."}, "questions": [{"q": "A. To stay healthy, you should _______________ eating too much fast food.", "answer": "avoid", "explanation": "Dựa vào ví dụ: avoid eating too much sugar.", "vi": "Để giữ sức khỏe, bạn nên tránh ăn quá nhiều đồ ăn nhanh."}, {"q": "B. It's important to _______________ stress by getting enough rest.", "answer": "avoid", "explanation": "Dựa vào ví dụ: avoid stress.", "vi": "Điều quan trọng là tránh căng thẳng bằng cách nghỉ ngơi đầy đủ."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🚭</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO SMOKING</p></div>", "options": ["You can smoke here.", "You mustn't smoke here.", "You should buy cigarettes here.", "You must leave your bag here."], "answer": 1, "explanation": "Biển có điếu thuốc bị gạch chéo → cấm hút thuốc.", "vis": ["Bạn có thể hút thuốc ở đây.", "Bạn không được hút thuốc ở đây.", "Bạn nên mua thuốc lá ở đây.", "Bạn phải để túi ở đây."]}, {"q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🚯</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO LITTERING</p></div>", "options": ["No running.", "No parking.", "No littering.", "No camping."], "answer": 2, "explanation": "Biển có hình người vứt rác bị gạch chéo → cấm xả rác.", "vis": ["Cấm chạy.", "Cấm đỗ xe.", "Cấm xả rác.", "Cấm cắm trại."]}, {"q": "What does the picture say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-green-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🥦🥕✅</div><p class=\"text-[11px] font-black text-center text-green-700 leading-tight\">EAT VEGETABLES EVERY DAY</p></div>", "options": ["You should eat lots of vegetables every day.", "You shouldn't eat lots of vegetables every day.", "You can't eat lots of vegetables every day.", "All are correct."], "answer": 0, "explanation": "Hình rau củ với dấu tích (✓) → khuyến khích ăn nhiều rau mỗi ngày.", "vis": ["Bạn nên ăn nhiều rau mỗi ngày.", "Bạn không nên ăn nhiều rau mỗi ngày.", "Bạn không thể ăn nhiều rau mỗi ngày.", "Tất cả đều đúng."]}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 2", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 2 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>h<u>ea</u>lthy</b> <span class='text-slate-400'>/ˈhelθi/</span> · <b class='text-slate-500'>w<u>a</u>ter</b> <span class='text-slate-400'>/ˈwɔːtə/</span> · <b class='text-emerald-700'>dis<u>ea</u>se</b> <span class='text-slate-400'>/dɪˈziːz/</span> · <b class='text-slate-500'>s<u>i</u>mple</b> <span class='text-slate-400'>/ˈsɪmpl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"disease\" có \"ea\" phát âm /iː/ (nguyên âm dài), \"healthy\" có \"ea\" phát âm /e/, \"simple\" /ɪ/, \"water\" /ɔː/. Theo đáp án gợi ý: disease.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'><u>e</u>xercise</b> <span class='text-slate-400'>/ˈeksəsaɪz/</span> · <b class='text-slate-500'><u>e</u>nergy</b> <span class='text-slate-400'>/ˈenədʒi/</span> · <b class='text-slate-500'>v<u>e</u>getable</b> <span class='text-slate-400'>/ˈvedʒtəbl/</span> · <b class='text-emerald-700'><u>i</u>mportant</b> <span class='text-slate-400'>/ɪmˈpɔːtnt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"important\" có \"i\" phát âm /ɪ/, ba từ còn lại có \"e\" phát âm /e/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>b<u>a</u>lance</b> <span class='text-slate-400'>/ˈbæləns/</span> · <b class='text-slate-500'>l<u>i</u>festyle</b> <span class='text-slate-400'>/ˈlaɪfstaɪl/</span> · <b class='text-emerald-700'>rout<u>i</u>ne</b> <span class='text-slate-400'>/ruːˈtiːn/</span> · <b class='text-slate-500'>adv<u>i</u>ce</b> <span class='text-slate-400'>/ədˈvaɪs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"routine\" có \"i\" phát âm /iː/, \"lifestyle\" và \"advice\" có \"i\" phát âm /aɪ/. Theo đáp án gợi ý: routine.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'><u>e</u>xercise</b> <span class='text-slate-400'>/ˈeksəsaɪz/</span> · <b class='text-emerald-700'>w<u>o</u>nderful</b> <span class='text-slate-400'>/ˈwʌndəfl/</span> · <b class='text-slate-500'>r<u>e</u>gular</b> <span class='text-slate-400'>/ˈreɡjələ/</span> · <b class='text-slate-500'><u>e</u>ducation</b> <span class='text-slate-400'>/ˌedʒuˈkeɪʃn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"wonderful\" có \"o\" phát âm /ʌ/, ba từ còn lại có \"e\" phát âm /e/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>m<u>e</u>dicine</b> <span class='text-slate-400'>/ˈmedsn/</span> · <b class='text-emerald-700'>v<u>i</u>tamin</b> <span class='text-slate-400'>/ˈvaɪtəmɪn/</span> · <b class='text-slate-500'><u>a</u>llergy</b> <span class='text-slate-400'>/ˈælədʒi/</span> · <b class='text-slate-500'>pr<u>o</u>tect</b> <span class='text-slate-400'>/prəˈtekt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"vitamin\" (Anh-Mỹ /ˈvaɪtəmɪn/) có nguyên âm đôi /aɪ/, ba từ còn lại là nguyên âm ngắn /e/, /æ/, /ə/. Theo đáp án gợi ý: vitamin.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-slate-500'>h<u>ea</u>lthy</b> <span class='text-slate-400'>/ˈhelθi/</span> · <b class='text-slate-500'>c<u>a</u>reful</b> <span class='text-slate-400'>/ˈkeəfl/</span> · <b class='text-slate-500'><u>a</u>ctive</b> <span class='text-slate-400'>/ˈæktɪv/</span> · <b class='text-emerald-700'>dis<u>ea</u>se</b> <span class='text-slate-400'>/dɪˈziːz/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"disease\" có \"ea\" phát âm /iː/; \"healthy\" /e/, \"active\" /æ/, \"careful\" /eə/. Theo đáp án gợi ý: disease.</p></div></div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Trọng âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-emerald-700'>healthy</b> <span class='text-slate-400'>/ˈhelθi/</span> · <b class='text-slate-500'>avoid</b> <span class='text-slate-400'>/əˈvɔɪd/</span> · <b class='text-slate-500'>advice</b> <span class='text-slate-400'>/ədˈvaɪs/</span> · <b class='text-slate-500'>disease</b> <span class='text-slate-400'>/dɪˈziːz/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"healthy\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>calorie</b> <span class='text-slate-400'>/ˈkæləri/</span> · <b class='text-slate-500'>vegetable</b> <span class='text-slate-400'>/ˈvedʒtəbl/</span> · <b class='text-emerald-700'>important</b> <span class='text-slate-400'>/ɪmˈpɔːtnt/</span> · <b class='text-slate-500'>exercise</b> <span class='text-slate-400'>/ˈeksəsaɪz/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"important\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>breakfast</b> <span class='text-slate-400'>/ˈbrekfəst/</span> · <b class='text-slate-500'>dinner</b> <span class='text-slate-400'>/ˈdɪnə/</span> · <b class='text-emerald-700'>enjoy</b> <span class='text-slate-400'>/ɪnˈdʒɔɪ/</span> · <b class='text-slate-500'>water</b> <span class='text-slate-400'>/ˈwɔːtə/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>fitness</b> <span class='text-slate-400'>/ˈfɪtnəs/</span> · <b class='text-emerald-700'>become</b> <span class='text-slate-400'>/bɪˈkʌm/</span> · <b class='text-slate-500'>habit</b> <span class='text-slate-400'>/ˈhæbɪt/</span> · <b class='text-slate-500'>cycle</b> <span class='text-slate-400'>/ˈsaɪkl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"become\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>dentist</b> <span class='text-slate-400'>/ˈdentɪst/</span> · <b class='text-slate-500'>doctor</b> <span class='text-slate-400'>/ˈdɒktə/</span> · <b class='text-emerald-700'>instead</b> <span class='text-slate-400'>/ɪnˈsted/</span> · <b class='text-slate-500'>patient</b> <span class='text-slate-400'>/ˈpeɪʃnt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"instead\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Câu mệnh lệnh (Imperatives)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Dùng để đưa ra lời khuyên, chỉ dẫn, yêu cầu. Không có chủ ngữ, động từ ở dạng nguyên mẫu.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">V (nguyên mẫu) + O</td><td class=\"border px-2 py-1 italic\">Eat more vegetables. <span class=\"not-italic text-slate-500\">— Hãy ăn nhiều rau hơn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">Don't + V (nguyên mẫu) + O</td><td class=\"border px-2 py-1 italic\">Don't skip breakfast. <span class=\"not-italic text-slate-500\">— Đừng bỏ bữa sáng.</span></td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-comment-medical mr-1\"></i>2. Should / Shouldn't (Lời khuyên)</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + should + V (nguyên mẫu)</td><td class=\"border px-2 py-1 italic\">You should drink more water. <span class=\"not-italic text-slate-500\">— Bạn nên uống nhiều nước hơn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + shouldn't + V (nguyên mẫu)</td><td class=\"border px-2 py-1 italic\">You shouldn't eat too much sugar. <span class=\"not-italic text-slate-500\">— Bạn không nên ăn quá nhiều đường.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Nghi vấn</td><td class=\"border px-2 py-1\">Should + S + V?</td><td class=\"border px-2 py-1 italic\">Should I see a doctor? <span class=\"not-italic text-slate-500\">— Tôi có nên đi khám bác sĩ không?</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Sau \"should/shouldn't\" LUÔN là động từ NGUYÊN MẪU, không thêm \"to\", không chia thì.</p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>You should to eat more fruit.</s> ❌ → <b>You should eat more fruit.</b> ✅ — không dùng \"to\" sau \"should\".</li>\n      <li><s>You should eating more fruit.</s> ❌ → <b>You should eat more fruit.</b> ✅ — không dùng V-ing sau \"should\".</li>\n      <li><s>Don't to eat junk food.</s> ❌ → <b>Don't eat junk food.</b> ✅ — mệnh lệnh phủ định không dùng \"to\".</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"It's a good idea to V = S + should + V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">It's a good idea to V<br>= S + should + V</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Don't + V = S + shouldn't + V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">Don't + V<br>= S + shouldn't + V</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Ngữ pháp</p>\n  <div id=\"miniquiz-grammar\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-grammar\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Word Formation</p>\n  <div id=\"miniquiz-wf\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-wf\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n<div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. healthy</span><span class='text-slate-400 text-xs'>(adj) /ˈhelθi/</span><span class='text-slate-500 text-xs ml-auto'>khỏe mạnh, lành mạnh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. lifestyle</span><span class='text-slate-400 text-xs'>(n) /ˈlaɪfstaɪl/</span><span class='text-slate-500 text-xs ml-auto'>lối sống</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. obesity</span><span class='text-slate-400 text-xs'>(n) /əʊˈbiːsəti/</span><span class='text-slate-500 text-xs ml-auto'>bệnh béo phì</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. junk food</span><span class='text-slate-400 text-xs'>(n) /ˈdʒʌŋk fuːd/</span><span class='text-slate-500 text-xs ml-auto'>đồ ăn vặt không lành mạnh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. calorie</span><span class='text-slate-400 text-xs'>(n) /ˈkæləri/</span><span class='text-slate-500 text-xs ml-auto'>calo</span></div><div class='flex items-baseline gap-1 border-b border-slat
