  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{ --accent:#1d4ed8; --accent2:#0891b2; }

  .tab-btn.active{ background: linear-gradient(135deg, #7c2d12, #f59e0b); color:#fff; box-shadow:0 4px 14px rgba(124,45,18,.35); transform:translateY(-1px); }
  .task-card{ transition: box-shadow .2s, transform .2s; }
  .task-card:hover{ transform: translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  .mcq-detail-hidden{ display:none; }
  .show-mcq-detail .mcq-detail-hidden{ display:block; }
  .speak-btn{ cursor:pointer; }

  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:var(--accent); }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .voice-ok{ color:#16a34a; } .voice-warn{ color:#d97706; }

  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
  table.border-collapse td, table.border-collapse th{ border:1px solid #e2e8f0; }
</style>

<script>
const DATA = {"unit": 3, "sections": [{"roman": "", "navLabel": "Lý thuyết", "title": "Từ vựng - Ngữ pháp - Hướng dẫn Word Form", "icon": "lightbulb", "type": "info", "info": "<div class='mb-5'><p class=\"text-sm text-slate-500 italic mb-3\">Ôn lại từ vựng, ngữ pháp trọng tâm và cách làm dạng bài Word Form trước khi luyện tập.</p></div><div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. volunteer</span><span class='text-slate-400 text-xs'>(n, v) /ˌvɒlənˈtɪə/</span><span class='text-slate-500 text-xs ml-auto'>tình nguyện viên; tình nguyện</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. donate</span><span class='text-slate-400 text-xs'>(v) /dəʊˈneɪt/</span><span class='text-slate-500 text-xs ml-auto'>quyên góp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. donation</span><span class='text-slate-400 text-xs'>(n) /dəʊˈneɪʃn/</span><span class='text-slate-500 text-xs ml-auto'>sự quyên góp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. charity</span><span class='text-slate-400 text-xs'>(n) /ˈtʃærəti/</span><span class='text-slate-500 text-xs ml-auto'>tổ chức từ thiện</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. community</span><span class='text-slate-400 text-xs'>(n) /kəˈmjuːnəti/</span><span class='text-slate-500 text-xs ml-auto'>cộng đồng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. homeless</span><span class='text-slate-400 text-xs'>(adj) /ˈhəʊmləs/</span><span class='text-slate-500 text-xs ml-auto'>vô gia cư</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. blanket</span><span class='text-slate-400 text-xs'>(n) /ˈblæŋkɪt/</span><span class='text-slate-500 text-xs ml-auto'>chăn, mền</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. coupon</span><span class='text-slate-400 text-xs'>(n) /ˈkuːpɒn/</span><span class='text-slate-500 text-xs ml-auto'>phiếu giảm giá</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. mentor</span><span class='text-slate-400 text-xs'>(n) /ˈmentɔː/</span><span class='text-slate-500 text-xs ml-auto'>người cố vấn, người hướng dẫn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. nursing home</span><span class='text-slate-400 text-xs'>(n) /ˈnɜːsɪŋ həʊm/</span><span class='text-slate-500 text-xs ml-auto'>viện dưỡng lão</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. flood</span><span class='text-slate-400 text-xs'>(n) /flʌd/</span><span class='text-slate-500 text-xs ml-auto'>lũ lụt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. clean-up</span><span class='text-slate-400 text-xs'>(n) /ˈkliːn ʌp/</span><span class='text-slate-500 text-xs ml-auto'>việc dọn dẹp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. fund</span><span class='text-slate-400 text-xs'>(n, v) /fʌnd/</span><span class='text-slate-500 text-xs ml-auto'>quỹ; tài trợ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. organize</span><span class='text-slate-400 text-xs'>(v) /ˈɔːɡənaɪz/</span><span class='text-slate-500 text-xs ml-auto'>tổ chức</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. offer</span><span class='text-slate-400 text-xs'>(v) /ˈɒfə/</span><span class='text-slate-500 text-xs ml-auto'>đề nghị, đề xuất</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. exchange</span><span class='text-slate-400 text-xs'>(v, n) /ɪksˈtʃeɪndʒ/</span><span class='text-slate-500 text-xs ml-auto'>trao đổi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. raise money</span><span class='text-slate-400 text-xs'>(v.phr) /reɪz ˈmʌni/</span><span class='text-slate-500 text-xs ml-auto'>gây quỹ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. collect</span><span class='text-slate-400 text-xs'>(v) /kəˈlekt/</span><span class='text-slate-500 text-xs ml-auto'>thu thập, quyên góp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. poor</span><span class='text-slate-400 text-xs'>(adj) /pɔː/</span><span class='text-slate-500 text-xs ml-auto'>nghèo</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. disabled</span><span class='text-slate-400 text-xs'>(adj) /dɪsˈeɪbld/</span><span class='text-slate-500 text-xs ml-auto'>khuyết tật</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>Thì quá khứ đơn (Past Simple)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Diễn tả hành động đã xảy ra và kết thúc trong quá khứ, thường có mốc thời gian xác định.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + V-ed / V2 (bất quy tắc)</td><td class=\"border px-2 py-1 italic\">We cleaned the park yesterday. <span class=\"not-italic text-slate-500\">— Chúng tôi đã dọn công viên hôm qua.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + didn't + V (nguyên mẫu)</td><td class=\"border px-2 py-1 italic\">She didn't donate money. <span class=\"not-italic text-slate-500\">— Cô ấy đã không quyên góp tiền.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Nghi vấn</td><td class=\"border px-2 py-1\">Did + S + V (nguyên mẫu)?</td><td class=\"border px-2 py-1 italic\">Did you help them? <span class=\"not-italic text-slate-500\">— Bạn đã giúp họ chưa?</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Dấu hiệu nhận biết: yesterday, last week/month/year, ... ago, in + năm đã qua.</p>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Nhiều động từ có dạng quá khứ BẤT QUY TẮC (không thêm \"-ed\"): go→went, have→had, give→gave, buy→bought...</p>\n  </div>\n\n  \n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-users mr-1\"></i>Chủ ngữ SỐ ÍT và SỐ NHIỀU — vì sao động từ chia khác nhau</p>\n  <p class=\"text-sm text-slate-700 mb-3\">Trong tiếng Anh, dạng của động từ (to be, to do, hay động từ thường thêm \"-s/-es\") phụ thuộc vào chủ ngữ là SỐ ÍT hay SỐ NHIỀU. Đây là quy tắc SỐNG CÒN cần nắm chắc trước khi học bất kỳ thì nào.</p>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Chủ ngữ</th><th class=\"border px-2 py-1\">Số ít hay số nhiều?</th><th class=\"border px-2 py-1\">to be</th><th class=\"border px-2 py-1\">to do</th><th class=\"border px-2 py-1\">Động từ thường (hiện tại đơn)</th></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">I</td><td class=\"border px-2 py-1\">số ít <span class=\"text-slate-400\">(nhưng chia đặc biệt)</span></td><td class=\"border px-2 py-1 font-bold\">am</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, không thêm gì)</td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">You</td><td class=\"border px-2 py-1\">số ít HOẶC số nhiều <span class=\"text-slate-400\">(luôn chia như số nhiều)</span></td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu)</td></tr>\n    <tr class=\"bg-amber-50\"><td class=\"border px-2 py-1 font-bold\">He / She / It<br><span class=\"font-normal text-xs\">(và danh từ số ít: a boy, my sister, the dog...)</span></td><td class=\"border px-2 py-1 font-bold\">SỐ ÍT</td><td class=\"border px-2 py-1 font-bold\">is</td><td class=\"border px-2 py-1 font-bold\">does</td><td class=\"border px-2 py-1 font-bold\">V + s/es <span class=\"font-normal\">(plays, watches, goes...)</span></td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">We</td><td class=\"border px-2 py-1 font-bold\">SỐ NHIỀU</td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, KHÔNG thêm s/es)</td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">They<br><span class=\"font-normal text-xs\">(và danh từ số nhiều: boys, my parents, the dogs...)</span></td><td class=\"border px-2 py-1 font-bold\">SỐ NHIỀU</td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, KHÔNG thêm s/es)</td></tr>\n  </table>\n  </div>\n  <div class=\"mt-3 space-y-1.5 text-sm text-slate-700\">\n    <p>💡 <b>Chỉ có \"He / She / It\" (ngôi thứ 3 số ít) và danh từ số ít mới thêm \"-s/-es\" vào động từ thường</b> ở thì hiện tại đơn. Mọi chủ ngữ khác (I, You, We, They) giữ nguyên động từ ở dạng nguyên mẫu.</p>\n    <p>💡 Cách nhận biết danh từ số ít/số nhiều nhanh: số ít thường có \"a/an/the/my/his...\" + danh từ KHÔNG có \"-s\" (a student); số nhiều thường có danh từ CÓ \"-s\" hoặc từ chỉ số lượng >1 (students, two students, many students).</p>\n    <p>💡 Với \"to be\" ở thì QUÁ KHỨ: số ít dùng <b>was</b> (I was, he/she/it was), số nhiều dùng <b>were</b> (we/you/they were).</p>\n  </div>\n</div>\n\n<div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>She didn't cleaned the beach.</s> ❌ → <b>She didn't clean the beach.</b> ✅ — sau \"didn't\" dùng động từ NGUYÊN MẪU, không chia quá khứ nữa.</li>\n      <li><s>Did you went there?</s> ❌ → <b>Did you go there?</b> ✅ — sau \"Did\" dùng động từ nguyên mẫu.</li>\n      <li><s>He goed to school.</s> ❌ → <b>He went to school.</b> ✅ — \"go\" là động từ bất quy tắc.</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + V-ed/V2 (khẳng định quá khứ đơn)\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">S + V-ed / V2 (bất quy tắc)</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + didn't + V (nguyên mẫu)\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">S + didn't + V (nguyên mẫu)</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["provid<u>ed</u>", "lov<u>ed</u>", "want<u>ed</u>", "visit<u>ed</u>"], "answer": 1, "explanation": "\"loved\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại (kết thúc bằng /t/, /d/) có đuôi \"-ed\" phát âm /ɪd/.", "ipas": ["/prəˈvaɪdɪd/", "/lʌvd/", "/ˈwɒntɪd/", "/ˈvɪzɪtɪd/"], "vis": ["đã cung cấp", "đã yêu", "đã muốn", "đã thăm"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["lik<u>ed</u>", "stay<u>ed</u>", "liv<u>ed</u>", "play<u>ed</u>"], "answer": 0, "explanation": "\"liked\" có đuôi \"-ed\" phát âm /t/ (sau âm vô thanh /k/), ba từ còn lại phát âm /d/.", "ipas": ["/laɪkt/", "/steɪd/", "/lɪvd/", "/pleɪd/"], "vis": ["đã thích", "đã ở lại", "đã sống", "đã chơi"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["plant<u>ed</u>", "flood<u>ed</u>", "paint<u>ed</u>", "clean<u>ed</u>"], "answer": 3, "explanation": "\"cleaned\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /ɪd/.", "ipas": ["/ˈplɑːntɪd/", "/ˈflʌdɪd/", "/ˈpeɪntɪd/", "/kliːnd/"], "vis": ["đã trồng", "bị ngập lụt", "đã sơn", "đã dọn dẹp"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["prepar<u>ed</u>", "stay<u>ed</u>", "book<u>ed</u>", "lov<u>ed</u>"], "answer": 2, "explanation": "\"booked\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /d/.", "ipas": ["/prɪˈpeəd/", "/steɪd/", "/bʊkt/", "/lʌvd/"], "vis": ["đã chuẩn bị", "đã ở lại", "đã đặt (vé, phòng)", "đã yêu"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["want<u>ed</u>", "visit<u>ed</u>", "need<u>ed</u>", "open<u>ed</u>"], "answer": 3, "explanation": "\"opened\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /ɪd/.", "ipas": ["/ˈwɒntɪd/", "/ˈvɪzɪtɪd/", "/ˈniːdɪd/", "/ˈəʊpənd/"], "vis": ["đã muốn", "đã thăm", "đã cần", "đã mở"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["wash<u>ed</u>", "practic<u>ed</u>", "clos<u>ed</u>", "jump<u>ed</u>"], "answer": 2, "explanation": "\"closed\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /t/.", "ipas": ["/wɒʃt/", "/ˈpræktɪst/", "/kləʊzd/", "/dʒʌmpt/"], "vis": ["đã rửa", "đã luyện tập", "đã đóng", "đã nhảy"]}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "Which word has a different stress pattern from that of the others?", "options": ["benefit", "charity", "environment", "government"], "answer": 2, "explanation": "\"environment\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈbenɪfɪt/", "/ˈtʃærəti/", "/ɪnˈvaɪrənmənt/", "/ˈɡʌvənmənt/"], "vis": ["lợi ích", "việc từ thiện", "môi trường", "chính phủ"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["tutor", "sponsor", "shelter", "maintain"], "answer": 3, "explanation": "\"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈtjuːtə/", "/ˈspɒnsə/", "/ˈʃeltə/", "/meɪnˈteɪn/"], "vis": ["gia sư", "nhà tài trợ", "mái ấm", "duy trì"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["donate", "people", "mural", "public"], "answer": 0, "explanation": "\"donate\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/dəʊˈneɪt/", "/ˈpiːpl/", "/ˈmjʊərəl/", "/ˈpʌblɪk/"], "vis": ["quyên góp", "mọi người", "tranh tường", "công cộng"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["homeless", "culture", "exact", "provide"], "answer": 2, "explanation": "Lưu ý: câu này trong tài liệu có hai từ nhấn âm 2 (exact /ɪɡˈzækt/ và provide /prəˈvaɪd/); \"homeless\", \"culture\" nhấn âm 1. Đáp án gợi ý: exact.", "ipas": ["/ˈhəʊmləs/", "/ˈkʌltʃə/", "/ɪɡˈzækt/", "/prəˈvaɪd/"], "vis": ["vô gia cư", "văn hóa", "chính xác", "cung cấp"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["volunteer", "government", "charity", "decorate"], "answer": 0, "explanation": "\"volunteer\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˌvɒlənˈtɪə/", "/ˈɡʌvənmənt/", "/ˈtʃærəti/", "/ˈdekəreɪt/"], "vis": ["tình nguyện viên", "chính phủ", "việc từ thiện", "trang trí"]}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "We ______ old textbooks to children in rural areas.", "options": ["see", "play", "buy", "donate"], "answer": 3, "explanation": "\"donate sth to sb\" = quyên góp cho ai.", "vi": "Chúng tôi quyên góp sách giáo khoa cũ cho trẻ em ở vùng nông thôn.", "tags": ["vocab"]}, {"q": "She ______ the letter and then read it.", "options": ["opened", "opens", "will open", "is opening"], "answer": 0, "explanation": "Hành động trong quá khứ nối tiếp \"read\" (quá khứ) → opened.", "vi": "Cô ấy mở lá thư rồi đọc nó.", "tags": ["grammar"]}, {"q": "He ______ an English song at the party last Wednesday.", "options": ["sings", "is singing", "sang", "to sing"], "answer": 2, "explanation": "\"last Wednesday\" → quá khứ đơn: sang.", "vi": "Anh ấy hát một bài hát tiếng Anh ở bữa tiệc thứ Tư tuần trước.", "tags": ["grammar"]}, {"q": "Three years ago, my sister and I ______ to Phong Nha Cave with my family.", "options": ["go", "will go", "went", "are going"], "answer": 2, "explanation": "\"Three years ago\" → quá khứ đơn: went.", "vi": "Ba năm trước, chị tôi và tôi đã đi động Phong Nha cùng gia đình.", "tags": ["grammar"]}, {"q": "Mr Buong ______ some apples for the party three weeks ago.", "options": ["buys", "will buy", "bought", "buy"], "answer": 2, "explanation": "\"three weeks ago\" → quá khứ đơn: bought.", "vi": "Ông Buông đã mua vài quả táo cho bữa tiệc ba tuần trước.", "tags": ["grammar"]}, {"q": "Nam and his sister ______ English in class this morning.", "options": ["didn't speak", "don't speak", "aren't speaking", "won't speak"], "answer": 0, "explanation": "\"this morning\" (đã qua) → quá khứ đơn phủ định: didn't speak.", "vi": "Nam và chị gái đã không nói tiếng Anh trong lớp sáng nay.", "tags": ["grammar"]}, {"q": "There ______ ten boys at the party last week.", "options": ["had", "were", "was", "are"], "answer": 1, "explanation": "\"last week\" + danh từ số nhiều → There were.", "vi": "Có mười cậu bé ở bữa tiệc tuần trước.", "tags": ["grammar"]}, {"q": "They often ______ small children in their village.", "options": ["tutor", "tutored", "will tutor", "tutoring"], "answer": 0, "explanation": "\"often\" → hiện tại đơn: tutor (dạy kèm).", "vi": "Họ thường dạy kèm trẻ nhỏ trong làng.", "tags": ["vocab"]}, {"q": "Miss Lien ______ a new car two years ago.", "options": ["has", "had", "is having", "will have"], "answer": 1, "explanation": "\"two years ago\" → quá khứ đơn: had.", "vi": "Cô Liên có một chiếc xe mới hai năm trước.", "tags": ["grammar"]}, {"q": "Nam ______ to class late four weeks ago.", "options": ["went", "is going", "will go", "goes"], "answer": 0, "explanation": "\"four weeks ago\" → quá khứ đơn: went.", "vi": "Nam đã đến lớp muộn bốn tuần trước.", "tags": ["grammar"]}, {"q": "Tom and his friends ______ the plants in their neighbourhood every weekend.", "options": ["water", "clean", "donate", "pick up"], "answer": 0, "explanation": "\"water the plants\" = tưới cây.", "vi": "Tom và bạn bè tưới cây trong khu phố mỗi cuối tuần.", "tags": ["vocab"]}, {"q": "Be a Buddy has ______ education for street children.", "options": ["given", "spent", "provided", "helped"], "answer": 2, "explanation": "\"provide education for sb\" = cung cấp giáo dục cho ai.", "vi": "Be a Buddy đã cung cấp giáo dục cho trẻ em đường phố.", "tags": ["vocab"]}, {"q": "Mr Buong ______ books for poor children for years.", "options": ["has collected", "collects", "is collecting", "collected"], "answer": 0, "explanation": "\"for years\" → hiện tại hoàn thành: has collected.", "vi": "Ông Buông đã thu thập sách cho trẻ em nghèo trong nhiều năm.", "tags": ["vocab"]}, {"q": "I ______ to work as a volunteer three years ago.", "options": ["started", "was started", "starting", "starts"], "answer": 0, "explanation": "\"three years ago\" → quá khứ đơn: started.", "vi": "Tôi bắt đầu làm tình nguyện viên ba năm trước.", "tags": ["grammar"]}, {"q": "Last year, I ______ to visit a children's village in Yen Bai with my teachers and friends.", "options": ["go", "to go", "goes", "went"], "answer": 3, "explanation": "\"Last year\" → quá khứ đơn: went.", "vi": "Năm ngoái, tôi đã đi thăm một làng trẻ em ở Yên Bái cùng thầy cô và bạn bè.", "tags": ["grammar"]}, {"q": "Last year, our school ______ hundreds of books to children in a rural village.", "options": ["has donated", "donated", "donates", "to donate"], "answer": 1, "explanation": "\"Last year\" → quá khứ đơn: donated.", "vi": "Năm ngoái, trường chúng tôi đã quyên góp hàng trăm cuốn sách cho trẻ em ở một ngôi làng nông thôn.", "tags": ["grammar"]}, {"q": "My friends and I ______ the streets in our neighbourhood every summer when we were small.", "options": ["cleaned", "have cleaned", "were cleaning", "cleans"], "answer": 0, "explanation": "\"when we were small\" (thói quen trong quá khứ) → quá khứ đơn: cleaned.", "vi": "Tôi và bạn bè dọn đường phố trong khu phố mỗi mùa hè khi còn nhỏ.", "tags": ["grammar"]}, {"q": "A group of volunteers ______ food to patients in our hospital for three weeks last month.", "options": ["offered", "offer", "has offered", "offering"], "answer": 0, "explanation": "\"last month\" → quá khứ đơn: offered.", "vi": "Một nhóm tình nguyện viên đã phát thức ăn cho bệnh nhân ở bệnh viện chúng tôi trong ba tuần tháng trước.", "tags": ["grammar"]}, {"q": "She became a member of the Peace Corps ______.", "options": ["for two years", "since two years", "two years now", "two years ago"], "answer": 3, "explanation": "\"became\" (quá khứ đơn) đi với \"ago\": two years ago.", "vi": "Cô ấy trở thành thành viên của Peace Corps hai năm trước.", "tags": ["grammar"]}, {"q": "The last time he donated blood ______ ten years ago.", "options": ["am", "is", "were", "was"], "answer": 3, "explanation": "Chủ ngữ số ít \"The last time\" + \"ten years ago\" → was.", "vi": "Lần cuối anh ấy hiến máu là mười năm trước.", "tags": ["grammar"]}, {"q": "We often ______ clothes and books to homeless people.", "options": ["donate", "establish", "interview", "exchange"], "answer": 0, "explanation": "\"donate sth to sb\" = quyên góp.", "vi": "Chúng tôi thường quyên góp quần áo và sách cho người vô gia cư.", "tags": ["vocab"]}, {"q": "The students joined a ______ activity after the storm.", "options": ["board game", "clean-up", "traffic jam", "coupon"], "answer": 1, "explanation": "\"clean-up activity\" = hoạt động dọn dẹp (sau bão).", "vi": "Các học sinh tham gia hoạt động dọn dẹp sau cơn bão.", "tags": ["mixed"]}, {"q": "Volunteers visited the ______ home to talk with elderly people.", "options": ["nursing", "mountain", "private", "rural"], "answer": 0, "explanation": "\"nursing home\" = viện dưỡng lão.", "vi": "Các tình nguyện viên đến thăm viện dưỡng lão để trò chuyện với người cao tuổi.", "tags": ["vocab"]}, {"q": "A person who gives time freely to help other people is a ______.", "options": ["sponsor", "mentor", "volunteer", "teenager"], "answer": 2, "explanation": "\"volunteer\" = tình nguyện viên.", "vi": "Người dành thời gian giúp đỡ người khác một cách tự nguyện là tình nguyện viên.", "tags": ["vocab"]}, {"q": "The charity provides food and clothes for ______ people.", "options": ["exact", "homeless", "public", "proud"], "answer": 1, "explanation": "\"homeless people\" = người vô gia cư.", "vi": "Tổ chức từ thiện cung cấp thức ăn và quần áo cho người vô gia cư.", "tags": ["mixed"]}, {"q": "Students can ______ trees in the school yard to make it greener.", "options": ["serve", "plant", "sort", "force"], "answer": 1, "explanation": "\"plant trees\" = trồng cây.", "vi": "Học sinh có thể trồng cây trong sân trường để sân xanh hơn.", "tags": ["vocab"]}, {"q": "Our club wants to ______ money for children in need.", "options": ["raise", "pay", "relate", "flood"], "answer": 0, "explanation": "\"raise money\" = gây quỹ.", "vi": "Câu lạc bộ chúng tôi muốn gây quỹ cho trẻ em khó khăn.", "tags": ["vocab"]}, {"q": "A non-profit organization does not work mainly for ______.", "options": ["culture", "population", "profit", "dirt"], "answer": 2, "explanation": "non-profit = phi lợi nhuận → không vì lợi nhuận (profit).", "vi": "Tổ chức phi lợi nhuận không hoạt động chủ yếu vì lợi nhuận.", "tags": ["mixed"]}, {"q": "Community service helps students develop useful ______.", "options": ["skills", "coupons", "statistics", "blankets"], "answer": 0, "explanation": "\"develop skills\" = phát triển kỹ năng.", "vi": "Dịch vụ cộng đồng giúp học sinh phát triển các kỹ năng hữu ích.", "tags": ["vocab"]}, {"q": "We should ______ the books before giving them to children.", "options": ["sponsor", "provide", "sort", "establish"], "answer": 2, "explanation": "\"sort\" = phân loại.", "vi": "Chúng ta nên phân loại sách trước khi trao cho trẻ em.", "tags": ["vocab"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "Students do lots of ________________ activities to help poor families.", "hint": "(effect)", "answer": "effective", "explanation": "Tính từ bổ nghĩa cho \"activities\": effective (hiệu quả).", "vi": "Học sinh làm nhiều hoạt động hiệu quả để giúp các gia đình nghèo.", "family": ["effect (n): tác dụng, ảnh hưởng", "effective (adj): có hiệu quả", "effectively (adv): một cách hiệu quả"]}, {"q": "The shelter received a large ________________ of clothes from local people.", "hint": "(donate)", "answer": "donation", "explanation": "Sau \"a large\" cần danh từ: donation (khoản quyên góp).", "vi": "Mái ấm nhận được một khoản quyên góp quần áo lớn từ người dân địa phương.", "family": ["donate (v): quyên góp", "donation (n): khoản/việc quyên góp", "donor (n): người quyên góp"]}, {"q": "She works for a big ________________ in our city.", "hint": "(organize)", "answer": "organization", "explanation": "Sau \"a big\" cần danh từ: organization (tổ chức).", "vi": "Cô ấy làm việc cho một tổ chức lớn ở thành phố chúng tôi.", "family": ["organize (v): tổ chức", "organization (n): tổ chức", "organizer (n): người tổ chức"]}, {"q": "There is a ________________ between Jack and Sue.", "hint": "(differ)", "answer": "difference", "explanation": "Sau \"a\" cần danh từ: difference (sự khác biệt).", "vi": "Có một sự khác biệt giữa Jack và Sue.", "family": ["differ (v): khác", "difference (n): sự khác biệt", "different (adj): khác", "differently (adv): một cách khác"]}, {"q": "Be _____________ when you cross the streets.", "hint": "(care)", "answer": "careful", "explanation": "Sau \"Be\" cần tính từ: careful.", "vi": "Hãy cẩn thận khi băng qua đường.", "family": ["care (n/v): sự cẩn thận; chăm sóc", "careful (adj): cẩn thận", "carefully (adv): một cách cẩn thận", "careless (adj): bất cẩn"]}, {"q": "The students cleaned the school yard ________________.", "hint": "(care)", "answer": "carefully", "explanation": "Trạng từ bổ nghĩa cho \"cleaned\": carefully.", "vi": "Các học sinh dọn sân trường một cách cẩn thận.", "family": ["care (n/v): sự cẩn thận; chăm sóc", "careful (adj): cẩn thận", "carefully (adv): một cách cẩn thận", "careless (adj): bất cẩn"]}, {"q": "Many teenagers take part in ________________ work at weekends.", "hint": "(volunteer)", "answer": "voluntary", "explanation": "Tính từ bổ nghĩa cho \"work\": voluntary (tình nguyện); cũng chấp nhận \"volunteer work\".", "vi": "Nhiều thanh thiếu niên tham gia công việc tình nguyện vào cuối tuần.", "family": ["volunteer (n/v): tình nguyện viên; tình nguyện", "voluntary (adj): tự nguyện", "voluntarily (adv): một cách tự nguyện"]}, {"q": "Charitable activity is very ________________ to street children.", "hint": "(help)", "answer": "helpful", "explanation": "Tính từ sau \"very\": helpful (hữu ích).", "vi": "Hoạt động từ thiện rất hữu ích với trẻ em đường phố.", "family": ["help (v/n): giúp đỡ", "helpful (adj): hữu ích", "helpless (adj): bất lực", "helper (n): người giúp"]}, {"q": "Our book ________________ grew quickly after the school campaign.", "hint": "(collect)", "answer": "collection", "explanation": "Danh từ ghép: book collection (bộ sưu tập sách).", "vi": "Bộ sưu tập sách của chúng tôi tăng nhanh sau chiến dịch của trường.", "family": ["collect (v): thu thập", "collection (n): bộ sưu tập", "collector (n): người sưu tầm"]}, {"q": "Community service helps the personal ________________ of young people.", "hint": "(develop)", "answer": "development", "explanation": "Sau tính từ \"personal\" cần danh từ: development (sự phát triển).", "vi": "Dịch vụ cộng đồng giúp cho sự phát triển cá nhân của người trẻ.", "family": ["develop (v): phát triển", "development (n): sự phát triển", "developed (adj): phát triển", "developing (adj): đang phát triển"]}, {"q": "The club works for environmental ________________.", "hint": "(protect)", "answer": "protection", "explanation": "Sau tính từ \"environmental\" cần danh từ: protection (sự bảo vệ).", "vi": "Câu lạc bộ hoạt động vì việc bảo vệ môi trường.", "family": ["protect (v): bảo vệ", "protection (n): sự bảo vệ", "protective (adj): mang tính bảo vệ"]}, {"q": "The clean-up campaign was very ________________ in our neighbourhood.", "hint": "(effect)", "answer": "effective", "explanation": "Tính từ sau \"very\": effective.", "vi": "Chiến dịch dọn dẹp rất hiệu quả ở khu phố chúng tôi.", "family": ["effect (n): tác dụng, ảnh hưởng", "effective (adj): có hiệu quả", "effectively (adv): một cách hiệu quả"]}, {"q": "Some students give food to ________________ people in the city.", "hint": "(home)", "answer": "homeless", "explanation": "Tính từ bổ nghĩa cho \"people\": homeless (vô gia cư).", "vi": "Một số học sinh phát thức ăn cho người vô gia cư trong thành phố.", "family": ["home (n): nhà", "homeless (adj): vô gia cư", "homelessness (n): tình trạng vô gia cư"]}, {"q": "A lot of people volunteer to ________________ the environment.", "hint": "(protect)", "answer": "protect", "explanation": "Sau \"to\" cần động từ nguyên thể: protect.", "vi": "Nhiều người tình nguyện bảo vệ môi trường.", "family": ["protect (v): bảo vệ", "protection (n): sự bảo vệ", "protective (adj): mang tính bảo vệ"]}, {"q": "We learned about ________________ differences through the project.", "hint": "(culture)", "answer": "cultural", "explanation": "Tính từ bổ nghĩa cho \"differences\": cultural (thuộc văn hóa).", "vi": "Chúng tôi học về những khác biệt văn hóa qua dự án.", "family": ["culture (n): văn hóa", "cultural (adj): thuộc văn hóa", "culturally (adv): về mặt văn hóa"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "Passage 1: Blood Donation", "html": "Blood donation is one of the most valuable forms of community service. Millions of people <span class='blank-tag'>(1)</span> ______ blood after accidents, burns, or operations. Voluntary blood donors give their blood freely and do not ask for any <span class='blank-tag'>(2)</span> ______. Their donations help hospitals keep a safe blood supply for emergencies. Modern science can make many medicines, <span class='blank-tag'>(3)</span> ______ it cannot manufacture human blood in a laboratory. For this reason, people who need blood must receive it <span class='blank-tag'>(4)</span> ______ other people. Donating blood is generally safe for healthy donors, and it can save the <span class='blank-tag'>(5)</span> ______ of patients. A person who donates today may need blood in the future, so blood donation is a social responsibility and a generous way to <span class='blank-tag'>(6)</span> ______ others.", "vi": "Hiến máu là một trong những hình thức dịch vụ cộng đồng giá trị nhất. Hàng triệu người (1) cần máu sau tai nạn, bỏng hoặc phẫu thuật. Người hiến máu tình nguyện cho máu miễn phí và không đòi hỏi bất kỳ (2) phần thưởng nào. Sự đóng góp của họ giúp bệnh viện duy trì nguồn máu an toàn cho các trường hợp khẩn cấp. Khoa học hiện đại có thể tạo ra nhiều loại thuốc, (3) nhưng không thể sản xuất máu người trong phòng thí nghiệm. Vì lý do này, người cần máu phải nhận máu (4) từ người khác. Hiến máu nhìn chung an toàn với người khỏe mạnh, và nó có thể cứu (5) mạng sống của bệnh nhân. Người hiến máu hôm nay có thể cần máu trong tương lai, nên hiến máu là trách nhiệm xã hội và là cách hào phóng để (6) giúp đỡ người khác."}, "questions": [{"q": "(1) Millions of people ______ blood after accidents.", "options": ["need", "needs", "needed", "needing"], "answer": 0, "explanation": "Chủ ngữ số nhiều \"Millions of people\" + hiện tại đơn → need.", "vi": null, "vis": ["cần (số nhiều)", "cần (ngôi 3 số ít)", "đã cần", "đang cần"]}, {"q": "(2) Donors do not ask for any ______.", "options": ["reward", "skill", "culture", "coupon"], "answer": 0, "explanation": "Hiến máu tự nguyện → không đòi phần thưởng (reward).", "vi": null, "vis": ["phần thưởng", "kỹ năng", "văn hóa", "phiếu giảm giá"]}, {"q": "(3) Science can make many medicines, ______ it cannot manufacture human blood.", "options": ["and", "but", "so", "or"], "answer": 1, "explanation": "Ý tương phản → but.", "vi": null, "vis": ["và", "nhưng", "vì vậy", "hoặc"]}, {"q": "(4) People who need blood must receive it ______ other people.", "options": ["at", "on", "from", "with"], "answer": 2, "explanation": "\"receive sth from sb\" = nhận từ ai.", "vi": null, "vis": ["tại", "trên", "từ", "với"]}, {"q": "(5) It can save the ______ of patients.", "options": ["lives", "life", "living", "alive"], "answer": 0, "explanation": "\"save the lives of patients\" = cứu mạng sống (số nhiều) của các bệnh nhân.", "vi": null, "vis": ["mạng sống (số nhiều)", "cuộc sống (số ít)", "việc sống", "còn sống (adj)"]}, {"q": "(6) A generous way to ______ others.", "options": ["help", "helps", "helping", "helped"], "answer": 0, "explanation": "Sau \"to\" cần động từ nguyên thể: help.", "vi": null, "vis": ["giúp (nguyên thể)", "giúp (ngôi 3)", "đang giúp", "đã giúp"]}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "Passage 2: The Peace Corps", "html": "The Peace Corps <span class='blank-tag'>(1)</span> ______ one of the most famous volunteer organizations in the world. It was established in 1961 in the United States. People who work in this <span class='blank-tag'>(2)</span> ______ are called volunteers. They live and work in other countries for a period of time and share useful <span class='blank-tag'>(3)</span> ______ with local communities. Some volunteers work as <span class='blank-tag'>(4)</span> ______ at schools, while others help protect the environment, improve health, or support farmers. The Peace Corps also helps build understanding between people from different countries <span class='blank-tag'>(5)</span> ______ cultures. When volunteers return home, they often bring back new experiences and a better understanding <span class='blank-tag'>(6)</span> ______ the people they met.", "vi": "Peace Corps (1) là một trong những tổ chức tình nguyện nổi tiếng nhất thế giới. Nó được thành lập năm 1961 tại Hoa Kỳ. Những người làm việc trong (2) tổ chức này được gọi là tình nguyện viên. Họ sống và làm việc ở các nước khác trong một thời gian và chia sẻ những (3) kỹ năng hữu ích với cộng đồng địa phương. Một số tình nguyện viên làm (4) giáo viên ở các trường học, trong khi những người khác giúp bảo vệ môi trường, cải thiện sức khỏe hoặc hỗ trợ nông dân. Peace Corps cũng giúp xây dựng sự hiểu biết giữa những người đến từ các quốc gia (5) và nền văn hóa khác nhau. Khi trở về nhà, các tình nguyện viên thường mang theo trải nghiệm mới và hiểu biết tốt hơn (6) về những người họ đã gặp."}, "questions": [{"q": "(1) The Peace Corps ______ one of the most famous volunteer organizations.", "options": ["is", "does", "are", "were"], "answer": 0, "explanation": "Chủ ngữ số ít (tên tổ chức) + hiện tại đơn → is.", "vi": null, "vis": ["là (số ít)", "làm", "là (số nhiều)", "đã là"]}, {"q": "(2) People who work in this ______ are called volunteers.", "options": ["organization", "orphanage", "shelter", "government"], "answer": 0, "explanation": "Peace Corps là một tổ chức (organization).", "vi": null, "vis": ["tổ chức", "trại trẻ mồ côi", "mái ấm", "chính phủ"]}, {"q": "(3) They share useful ______ with local communities.", "options": ["skills", "coupons", "blankets", "profits"], "answer": 0, "explanation": "\"share useful skills\" = chia sẻ kỹ năng hữu ích.", "vi": null, "vis": ["kỹ năng", "phiếu giảm giá", "chăn", "lợi nhuận"]}, {"q": "(4) Some volunteers work as ______ at schools.", "options": ["teachers", "sponsors", "patients", "donors"], "answer": 0, "explanation": "Làm việc ở trường học → giáo viên (teachers).", "vi": null, "vis": ["giáo viên", "nhà tài trợ", "bệnh nhân", "người hiến tặng"]}, {"q": "(5) People from different countries ______ cultures.", "options": ["but", "because", "and", "so"], "answer": 2, "explanation": "Liệt kê: countries and cultures.", "vi": null, "vis": ["nhưng", "bởi vì", "và", "vì vậy"]}, {"q": "(6) A better understanding ______ the people they met.", "options": ["of", "for", "at", "from"], "answer": 0, "explanation": "\"understanding of\" = sự hiểu biết về.", "vi": null, "vis": ["về (understanding of)", "cho", "tại", "từ"]}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Passage 1: Young Volunteers", "html": "Each country has many good people who take care of others. In the United States, some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly. They read books to people, visit them, play games with them, or listen to their problems. Other young volunteers work in the homes of people who are sick or old. They paint, clean up, or repair houses and do the shopping. For boys who do not have fathers, an organization called Big Brothers helps them by taking them to basketball games or on fishing trips. Many cities also have clubs where boys and girls can play games, watch films, or take short trips. These clubs often use student volunteers because young volunteers can understand the problems of younger children.", "vi": "Mỗi quốc gia đều có nhiều người tốt chăm sóc người khác. Ở Hoa Kỳ, một số học sinh dành nhiều giờ làm tình nguyện viên tại bệnh viện, trại trẻ mồ côi hoặc viện dưỡng lão. Họ đọc sách cho mọi người, thăm hỏi, chơi trò chơi hoặc lắng nghe những vấn đề của họ. Những tình nguyện viên trẻ khác làm việc tại nhà của người ốm hoặc già. Họ sơn, dọn dẹp hoặc sửa nhà và đi mua sắm. Với những cậu bé không có cha, một tổ chức tên Big Brothers giúp đỡ bằng cách đưa các em đi xem bóng rổ hoặc đi câu cá. Nhiều thành phố cũng có các câu lạc bộ nơi các em trai và gái có thể chơi trò chơi, xem phim hoặc đi dã ngoại ngắn. Các câu lạc bộ này thường dùng tình nguyện viên học sinh vì tình nguyện viên trẻ có thể hiểu được vấn đề của trẻ nhỏ hơn."}, "questions": [{"q": "Some students volunteer in hospitals, orphanages, or homes for the elderly.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly\" → Đúng.", "vi": "Một số học sinh làm tình nguyện ở bệnh viện, trại trẻ mồ côi hoặc viện dưỡng lão.", "vis": ["Đúng", "Sai"]}, {"q": "Young volunteers only read books to the people they help.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: họ còn thăm hỏi, chơi trò chơi, lắng nghe... → không chỉ đọc sách → Sai.", "vi": "Tình nguyện viên trẻ chỉ đọc sách cho những người họ giúp.", "vis": ["Đúng", "Sai"]}, {"q": "Big Brothers helps some boys who do not have fathers.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"For boys who do not have fathers, an organization called Big Brothers helps them\" → Đúng.", "vi": "Big Brothers giúp một số cậu bé không có cha.", "vis": ["Đúng", "Sai"]}, {"q": "Clubs never use students as volunteers.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"These clubs often use student volunteers\" → Sai.", "vi": "Các câu lạc bộ không bao giờ dùng học sinh làm tình nguyện viên.", "vis": ["Đúng", "Sai"]}, {"q": "What can volunteers do in the homes of people who are sick or old?", "options": ["Clean or repair their houses.", "Sell them tickets.", "Teach them to drive.", "Build new schools."], "answer": 0, "explanation": "Bài đọc: \"They paint, clean up, or repair houses\".", "vi": "Tình nguyện viên có thể làm gì tại nhà của người ốm hoặc già?", "vis": ["Dọn dẹp hoặc sửa nhà.", "Bán vé cho họ.", "Dạy họ lái xe.", "Xây trường mới."]}, {"q": "Why do many clubs use students as volunteers?", "options": ["They have no homework.", "They understand younger children.", "They are paid well.", "They own the clubs."], "answer": 1, "explanation": "Bài đọc: \"because young volunteers can understand the problems of younger children\".", "vi": "Tại sao nhiều câu lạc bộ dùng học sinh làm tình nguyện viên?", "vis": ["Họ không có bài tập.", "Họ hiểu trẻ nhỏ hơn.", "Họ được trả lương cao.", "Họ sở hữu câu lạc bộ."]}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Passage 2: Community Service and Students", "html": "Community service is work that people do for free to help the public or their community. Students who choose community service usually work as volunteers because they want to help others. Community service can have many positive effects on students. It can help them develop useful skills, meet new people, and improve the quality of life of others. There are many ways for students to volunteer. They can join a non-profit organization, work with a community group, or create their own service project. Volunteer work can be simple, such as helping coach a school football team, or more difficult, such as starting a project to support homeless people. Whatever activity they choose, students can learn responsibility and understand their community better.", "vi": "Dịch vụ cộng đồng là công việc mọi người làm miễn phí để giúp đỡ công chúng hoặc cộng đồng của mình. Học sinh chọn làm dịch vụ cộng đồng thường làm tình nguyện viên vì muốn giúp đỡ người khác. Dịch vụ cộng đồng có thể mang lại nhiều tác động tích cực cho học sinh. Nó giúp các em phát triển kỹ năng hữu ích, gặp gỡ người mới và cải thiện chất lượng cuộc sống của người khác. Có nhiều cách để học sinh làm tình nguyện. Các em có thể tham gia tổ chức phi lợi nhuận, làm việc với nhóm cộng đồng hoặc tự tạo dự án phục vụ của riêng mình. Công việc tình nguyện có thể đơn giản như giúp huấn luyện đội bóng đá trường, hoặc khó hơn như khởi động dự án hỗ trợ người vô gia cư. Dù chọn hoạt động nào, học sinh cũng học được tinh thần trách nhiệm và hiểu cộng đồng của mình hơn."}, "questions": [{"q": "Students often do community service as volunteers.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Students who choose community service usually work as volunteers\" → Đúng.", "vi": "Học sinh thường làm dịch vụ cộng đồng với tư cách tình nguyện viên.", "vis": ["Đúng", "Sai"]}, {"q": "Community service can help students develop useful skills.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"It can help them develop useful skills\" → Đúng.", "vi": "Dịch vụ cộng đồng có thể giúp học sinh phát triển kỹ năng hữu ích.", "vis": ["Đúng", "Sai"]}, {"q": "No students choose to volunteer their free time through community service.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nói nhiều học sinh chọn làm tình nguyện → Sai.", "vi": "Không học sinh nào chọn làm tình nguyện qua dịch vụ cộng đồng.", "vis": ["Đúng", "Sai"]}, {"q": "Joining a non-profit organization is the only way to do community service.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"There are many ways for students to volunteer\" → không phải cách duy nhất → Sai.", "vi": "Tham gia tổ chức phi lợi nhuận là cách duy nhất để làm dịch vụ cộng đồng.", "vis": ["Đúng", "Sai"]}, {"q": "Which is one way students can do community service?", "options": ["Join a non-profit organization.", "Avoid other people.", "Stay home all day.", "Stop all school activities."], "answer": 0, "explanation": "Bài đọc: \"They can join a non-profit organization\".", "vi": "Đâu là một cách học sinh có thể làm dịch vụ cộng đồng?", "vis": ["Tham gia tổ chức phi lợi nhuận.", "Tránh người khác.", "Ở nhà cả ngày.", "Dừng mọi hoạt động ở trường."]}, {"q": "What can students learn from community service?", "options": ["Responsibility.", "How to make a profit.", "How to avoid work.", "How to spend more money."], "answer": 0, "explanation": "Bài đọc: \"students can learn responsibility\".", "vi": "Học sinh có thể học được gì từ dịch vụ cộng đồng?", "vis": ["Tinh thần trách nhiệm.", "Cách kiếm lợi nhuận.", "Cách tránh việc.", "Cách tiêu nhiều tiền hơn."]}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "R1.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>this Sunday./ should/ for/ old people/ We/ clean the house/</b>", "starter": "", "answer": "We should clean the house for old people this Sunday.", "accepted": null, "explanation": "S + should + V + O + for sb + time.", "vi": "Chúng ta nên dọn nhà cho người già vào Chủ nhật này.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R2.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>the streets/ Last week,/ my class/ volunteered/ in our neighbourhood./ to clean/</b>", "starter": "", "answer": "Last week, my class volunteered to clean the streets in our neighbourhood.", "accepted": null, "explanation": "Time, S + volunteered to + V + O + place.", "vi": "Tuần trước, lớp tôi đã tình nguyện dọn đường phố trong khu phố của chúng tôi.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R3.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>should/ and hungry/ We/ people./ cold/ help/</b>", "starter": "", "answer": "We should help cold and hungry people.", "accepted": null, "explanation": "S + should + help + adj + N.", "vi": "Chúng ta nên giúp những người đang lạnh và đói.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R4.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>homeless people./ We/ cook meals/ and bring them to/ can/</b>", "starter": "", "answer": "We can cook meals and bring them to homeless people.", "accepted": null, "explanation": "S + can + V1 + and + V2 + O.", "vi": "Chúng ta có thể nấu ăn và mang đến cho người vô gia cư.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R5.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>old books and clothes/ Every year,/ we/ to help/ collect/ poor children./</b>", "starter": "", "answer": "Every year, we collect old books and clothes to help poor children.", "accepted": null, "explanation": "Time, S + V + O + to V (mục đích).", "vi": "Mỗi năm, chúng tôi thu gom sách và quần áo cũ để giúp trẻ em nghèo.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"donate\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "donate", "ipa": "/dəʊˈneɪt/", "pos": "verb", "senses": [{"def": "to give money, food, clothes, etc. to help a person or organization", "examples": ["Local businesses donated food and clothing to the flood victims.", "She donates 10% of her salary to charity every month.", "He decided to donate his old books to the school library.", "Many people donated blood after the earthquake."]}], "vi": "<b>donate</b> /dəʊˈneɪt/ (động từ)<br>tặng tiền, thức ăn, quần áo,... để giúp đỡ người khác hoặc tổ chức.<br>• Các doanh nghiệp địa phương đã quyên góp thức ăn và quần áo cho nạn nhân lũ lụt.<br>• Cô ấy quyên góp 10% lương mỗi tháng cho từ thiện.<br>• Anh ấy quyết định tặng sách cũ cho thư viện trường.<br>• Nhiều người đã hiến máu sau trận động đất."}, "questions": [{"q": "A. Every winter, our class ________________ warm clothes to homeless people.", "answer": "donates", "explanation": "Dựa vào ví dụ: donates. Chủ ngữ \"our class\" số ít.", "vi": "Mỗi mùa đông, lớp chúng tôi quyên góp quần áo ấm cho người vô gia cư."}, {"q": "B. After the flood, many volunteers ________________ food and blankets to the victims.", "answer": "donated", "explanation": "Dựa vào ví dụ, thì quá khứ: donated.", "vi": "Sau trận lũ, nhiều tình nguyện viên đã quyên góp thức ăn và chăn màn cho các nạn nhân."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"volunteer\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "volunteer", "ipa": "/ˌvɒlənˈtɪə/", "pos": "noun, verb", "senses": [{"def": "a person who does something, especially helping other people, willingly and without being forced or paid; to offer to do something without being forced or paid", "examples": ["Hundreds of volunteers helped clean up the beach.", "She volunteers at the animal shelter every weekend.", "He volunteered to help the elderly in his neighborhood.", "The charity relies on volunteers to run its programs."]}], "vi": "<b>volunteer</b> /ˌvɒlənˈtɪə/ (danh từ, động từ)<br>người tự nguyện làm việc gì, đặc biệt giúp đỡ người khác, không bị ép buộc hay trả lương; tự nguyện làm việc gì.<br>• Hàng trăm tình nguyện viên đã giúp dọn dẹp bãi biển.<br>• Cô ấy tình nguyện ở trại động vật mỗi cuối tuần.<br>• Anh ấy đã tình nguyện giúp đỡ người già trong khu phố.<br>• Tổ chức từ thiện dựa vào tình nguyện viên để vận hành các chương trình."}, "questions": [{"q": "A. Every Saturday, she ________________ at the local nursing home.", "answer": "volunteers", "explanation": "Dựa vào ví dụ: volunteers at the animal shelter.", "vi": "Mỗi thứ Bảy, cô ấy tình nguyện ở viện dưỡng lão địa phương."}, {"q": "B. Last month, hundreds of ________________ helped clean up the river.", "answer": "volunteers", "explanation": "Dựa vào ví dụ: Hundreds of volunteers.", "vi": "Tháng trước, hàng trăm tình nguyện viên đã giúp dọn dẹp con sông."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-green-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🌱🌳</div><p class=\"text-[11px] font-black text-center text-green-700 leading-tight\">PLANT MORE TREES</p></div>", "options": ["We should plant more trees.", "We should sell more trees.", "We should use more trees.", "We should buy more trees."], "answer": 0, "explanation": "Biển có hình cây xanh và bàn tay trồng cây → kêu gọi trồng thêm cây.", "vis": ["Chúng ta nên trồng thêm cây.", "Chúng ta nên bán thêm cây.", "Chúng ta nên dùng thêm cây.", "Chúng ta nên mua thêm cây."]}, {"q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🏍️🚫</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO MOTORBIKES</p></div>", "options": ["Mustn't ride a motorbike.", "Mustn't use a vehicle.", "Mustn't drive a car.", "Mustn't ride a bike."], "answer": 0, "explanation": "Biển có hình xe máy bị gạch chéo → cấm đi xe máy.", "vis": ["Không được đi xe máy.", "Không được dùng phương tiện.", "Không được lái ô tô.", "Không được đi xe đạp."]}, {"q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">👨‍👧</div><p class=\"text-[11px] font-black text-center text-amber-700 leading-tight\">CHILDREN MUST BE WITH AN ADULT</p></div>", "options": ["Children can't play in this area.", "Children can enter this area with their parents.", "Only children can enter this place.", "Children can enter this place alone."], "answer": 1, "explanation": "Biển có hình người lớn nắm tay trẻ em → trẻ em phải đi cùng bố mẹ.", "vis": ["Trẻ em không được chơi ở khu vực này.", "Trẻ em có thể vào khu vực này cùng bố mẹ.", "Chỉ trẻ em mới được vào.", "Trẻ em có thể vào một mình."]}]}, {"roman": "", "navLabel": "Quá khứ đơn", "title": "Past Simple: Chia động từ", "icon": "pen", "instructions": "Chia động từ trong ngoặc ở thì quá khứ đơn (nhấn Enter để kiểm tra từng câu).", "type": "fill", "instant": true, "questions": [{"q": "Our class __________ the park last Sunday.", "answer": "cleaned", "explanation": "\"last Sunday\" → quá khứ đơn: cleaned.", "hint": "(clean)", "vi": "Lớp chúng tôi đã dọn công viên Chủ nhật tuần trước."}, {"q": "The students __________ some new trees in the school yard last week.", "answer": "planted", "explanation": "\"last week\" → quá khứ đơn: planted.", "hint": "(plant)", "vi": "Các học sinh đã trồng vài cây mới trong sân trường tuần trước."}, {"q": "We __________ old books and clothes for poor children last month.", "answer": "collected", "explanation": "\"last month\" → quá khứ đơn: collected.", "hint": "(collect)", "vi": "Chúng tôi đã thu gom sách và quần áo cũ cho trẻ em nghèo tháng trước."}, {"q": "We __________ at the nursing home last Saturday.", "answer": "were", "explanation": "Chủ ngữ \"We\" + quá khứ → were.", "hint": "(be)", "vi": "Chúng tôi đã ở viện dưỡng lão thứ Bảy tuần trước."}, {"q": "Miss Nga __________ at school yesterday.", "answer": "wasn't", "explanation": "Chủ ngữ số ít, phủ định quá khứ → wasn't.", "hint": "(not be)", "vi": "Cô Nga đã không ở trường hôm qua.", "accepted": ["wasn't", "was not"]}, {"q": "Our club __________ elderly people with their housework last weekend.", "answer": "helped", "explanation": "\"last weekend\" → quá khứ đơn: helped.", "hint": "(help)", "vi": "Câu lạc bộ chúng tôi đã giúp người cao tuổi làm việc nhà cuối tuần trước."}, {"q": "My class __________ an orphanage two weeks ago.", "answer": "visited", "explanation": "\"two weeks ago\" → quá khứ đơn: visited.", "hint": "(visit)", "vi": "Lớp tôi đã thăm một trại trẻ mồ côi hai tuần trước."}, {"q": "They __________ up trash around their school two days ago.", "answer": "picked", "explanation": "\"two days ago\" → quá khứ đơn: picked (up).", "hint": "(pick)", "vi": "Họ đã nhặt rác quanh trường hai ngày trước."}, {"q": "Nam __________ to the community centre yesterday.", "answer": "went", "explanation": "\"yesterday\" → quá khứ đơn bất quy tắc: go → went.", "hint": "(go)", "vi": "Nam đã đến trung tâm cộng đồng hôm qua."}, {"q": "My mother __________ meals for homeless people last Sunday.", "answer": "cooked", "explanation": "\"last Sunday\" → quá khứ đơn: cooked.", "hint": "(cook)", "vi": "Mẹ tôi đã nấu ăn cho người vô gia cư Chủ nhật tuần trước."}, {"q": "We __________ money for the charity last month.", "answer": "didn't collect", "explanation": "Phủ định quá khứ đơn: didn't + V nguyên thể.", "hint": "(not collect)", "vi": "Chúng tôi đã không quyên tiền cho tổ chức từ thiện tháng trước.", "accepted": ["didn't collect", "did not collect"]}, {"q": "Lan __________ the nursing home yesterday.", "answer": "didn't visit", "explanation": "Phủ định quá khứ đơn: didn't + V nguyên thể.", "hint": "(not visit)", "vi": "Lan đã không thăm viện dưỡng lão hôm qua.", "accepted": ["didn't visit", "did not visit"]}, {"q": "__________ your class __________ to the orphanage last weekend?", "answer": "Did ... go", "explanation": "Câu hỏi quá khứ đơn: Did + S + V nguyên thể? (nhập: Did / go)", "hint": "(go)", "vi": "Lớp bạn có đi đến trại trẻ mồ côi cuối tuần trước không?", "accepted": ["Did ... go", "did go"]}, {"q": "__________ they at the community centre yesterday?", "answer": "Were", "explanation": "Câu hỏi với to be quá khứ, chủ ngữ \"they\" → Were.", "hint": "(be)", "vi": "Hôm qua họ có ở trung tâm cộng đồng không?"}, {"q": "__________ Mai __________ meals for homeless people last Sunday?", "answer": "Did ... cook", "explanation": "Câu hỏi quá khứ đơn: Did + S + V nguyên thể? (nhập: Did / cook)", "hint": "(cook)", "vi": "Mai có nấu ăn cho người vô gia cư Chủ nhật tuần trước không?", "accepted": ["Did ... cook", "did cook"]}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 3", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 3 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>provid<u>ed</u></b> <span class='text-slate-400'>/prəˈvaɪdɪd/</span> · <b class='text-emerald-700'>lov<u>ed</u></b> <span class='text-slate-400'>/lʌvd/</span> · <b class='text-slate-500'>want<u>ed</u></b> <span class='text-slate-400'>/ˈwɒntɪd/</span> · <b class='text-slate-500'>visit<u>ed</u></b> <span class='text-slate-400'>/ˈvɪzɪtɪd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"loved\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại (kết thúc bằng /t/, /d/) có đuôi \"-ed\" phát âm /ɪd/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-emerald-700'>lik<u>ed</u></b> <span class='text-slate-400'>/laɪkt/</span> · <b class='text-slate-500'>stay<u>ed</u></b> <span class='text-slate-400'>/steɪd/</span> · <b class='text-slate-500'>liv<u>ed</u></b> <span class='text-slate-400'>/lɪvd/</span> · <b class='text-slate-500'>play<u>ed</u></b> <span class='text-slate-400'>/pleɪd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"liked\" có đuôi \"-ed\" phát âm /t/ (sau âm vô thanh /k/), ba từ còn lại phát âm /d/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>plant<u>ed</u></b> <span class='text-slate-400'>/ˈplɑːntɪd/</span> · <b class='text-slate-500'>flood<u>ed</u></b> <span class='text-slate-400'>/ˈflʌdɪd/</span> · <b class='text-slate-500'>paint<u>ed</u></b> <span class='text-slate-400'>/ˈpeɪntɪd/</span> · <b class='text-emerald-700'>clean<u>ed</u></b> <span class='text-slate-400'>/kliːnd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"cleaned\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /ɪd/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>prepar<u>ed</u></b> <span class='text-slate-400'>/prɪˈpeəd/</span> · <b class='text-slate-500'>stay<u>ed</u></b> <span class='text-slate-400'>/steɪd/</span> · <b class='text-emerald-700'>book<u>ed</u></b> <span class='text-slate-400'>/bʊkt/</span> · <b class='text-slate-500'>lov<u>ed</u></b> <span class='text-slate-400'>/lʌvd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"booked\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /d/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>want<u>ed</u></b> <span class='text-slate-400'>/ˈwɒntɪd/</span> · <b class='text-slate-500'>visit<u>ed</u></b> <span class='text-slate-400'>/ˈvɪzɪtɪd/</span> · <b class='text-slate-500'>need<u>ed</u></b> <span class='text-slate-400'>/ˈniːdɪd/</span> · <b class='text-emerald-700'>open<u>ed</u></b> <span class='text-slate-400'>/ˈəʊpənd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"opened\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /ɪd/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-slate-500'>wash<u>ed</u></b> <span class='text-slate-400'>/wɒʃt/</span> · <b class='text-slate-500'>practic<u>ed</u></b> <span class='text-slate-400'>/ˈpræktɪst/</span> · <b class='text-emerald-700'>clos<u>ed</u></b> <span class='text-slate-400'>/kləʊzd/</span> · <b class='text-slate-500'>jump<u>ed</u></b> <span class='text-slate-400'>/dʒʌmpt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"closed\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /t/.</p></div></div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Trọng âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>benefit</b> <span class='text-slate-400'>/ˈbenɪfɪt/</span> · <b class='text-slate-500'>charity</b> <span class='text-slate-400'>/ˈtʃærəti/</span> · <b class='text-emerald-700'>environment</b> <span class='text-slate-400'>/ɪnˈvaɪrənmənt/</span> · <b class='text-slate-500'>government</b> <span class='text-slate-400'>/ˈɡʌvənmənt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"environment\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>tutor</b> <span class='text-slate-400'>/ˈtjuːtə/</span> · <b class='text-slate-500'>sponsor</b> <span class='text-slate-400'>/ˈspɒnsə/</span> · <b class='text-slate-500'>shelter</b> <span class='text-slate-400'>/ˈʃeltə/</span> · <b class='text-emerald-700'>maintain</b> <span class='text-slate-400'>/meɪnˈteɪn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-emerald-700'>donate</b> <span class='text-slate-400'>/dəʊˈneɪt/</span> · <b class='text-slate-500'>people</b> <span class='text-slate-400'>/ˈpiːpl/</span> · <b class='text-slate-500'>mural</b> <span class='text-slate-400'>/ˈmjʊərəl/</span> · <b class='text-slate-500'>public</b> <span class='text-slate-400'>/ˈpʌblɪk/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"donate\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>homeless</b> <span class='text-slate-400'>/ˈhəʊmləs/</span> · <b class='text-slate-500'>culture</b> <span class='text-slate-400'>/ˈkʌltʃə/</span> · <b class='text-emerald-700'>exact</b> <span class='text-slate-400'>/ɪɡˈzækt/</span> · <b class='text-slate-500'>provide</b> <span class='text-slate-400'>/prəˈvaɪd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 Lưu ý: câu này trong tài liệu có hai từ nhấn âm 2 (exact /ɪɡˈzækt/ và provide /prəˈvaɪd/); \"homeless\", \"culture\" nhấn âm 1. Đáp án gợi ý: exact.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-emerald-700'>volunteer</b> <span class='text-slate-400'>/ˌvɒlənˈtɪə/</span> · <b class='text-slate-500'>government</b> <span class='text-slate-400'>/ˈɡʌvənmənt/</span> · <b class='text-slate-500'>charity</b> <span class='text-slate-400'>/ˈtʃærəti/</span> · <b class='text-slate-500'>decorate</b> <span class='text-slate-400'>/ˈdekəreɪt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"volunteer\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>Thì quá khứ đơn (Past Simple)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Diễn tả hành động đã xảy ra và kết thúc trong quá khứ, thường có mốc thời gian xác định.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + V-ed / V2 (bất quy tắc)</td><td class=\"border px-2 py-1 italic\">We cleaned the park yesterday. <span class=\"not-italic text-slate-500\">— Chúng tôi đã dọn công viên hôm qua.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + didn't + V (nguyên mẫu)</td><td class=\"border px-2 py-1 italic\">She didn't donate money. <span class=\"not-italic text-slate-500\">— Cô ấy đã không quyên góp tiền.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Nghi vấn</td><td class=\"border px-2 py-1\">Did + S + V (nguyên mẫu)?</td><td class=\"border px-2 py-1 italic\">Did you help them? <span class=\"not-italic text-slate-500\">— Bạn đã giúp họ chưa?</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Dấu hiệu nhận biết: yesterday, last week/month/year, ... ago, in + năm đã qua.</p>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Nhiều động từ có dạng quá khứ BẤT QUY TẮC (không thêm \"-ed\"): go→went, have→had, give→gave, buy→bought...</p>\n  </div>\n\n  \n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-users mr-1\"></i>Chủ ngữ SỐ ÍT và SỐ NHIỀU — vì sao động từ chia khác nhau</p>\n  <p class=\"text-sm text-slate-700 mb-3\">Trong tiếng Anh, dạng của động từ (to be, to do, hay động từ thường thêm \"-s/-es\") phụ thuộc vào chủ ngữ là SỐ ÍT hay SỐ NHIỀU. Đây là quy tắc SỐNG CÒN cần nắm chắc trước khi học bất kỳ thì nào.</p>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Chủ ngữ</th><th class=\"border px-2 py-1\">Số ít hay số nhiều?</th><th class=\"border px-2 py-1\">to be</th><th class=\"border px-2 py-1\">to do</th><th class=\"border px-2 py-1\">Động từ thường (hiện tại đơn)</th></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">I</td><td class=\"border px-2 py-1\">số ít <span class=\"text-slate-400\">(nhưng chia đặc biệt)</span></td><td class=\"border px-2 py-1 font-bold\">am</td><td class=\"border px-2 py-1 font-bold\">do</td><td clas
