  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');

  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }

  .vi-hidden{ display:none; }

  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }

  .section-page{ display:none; }

  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
  table.border-collapse td, table.border-collapse th{ border:1px solid #e2e8f0; }

<script>
const DATA = {"unit": 4, "sections": [{"roman": "", "navLabel": "Lý thuyết", "title": "Từ vựng - Ngữ pháp - Hướng dẫn Word Form", "icon": "lightbulb", "type": "info", "info": "<div class='mb-5'><p class=\"text-sm text-slate-500 italic mb-3\">Ôn lại từ vựng, ngữ pháp trọng tâm và cách làm dạng bài Word Form trước khi luyện tập.</p></div><div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. art</span><span class='text-slate-400 text-xs'>(n) /ɑːt/</span><span class='text-slate-500 text-xs ml-auto'>nghệ thuật</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. artist</span><span class='text-slate-400 text-xs'>(n) /ˈɑːtɪst/</span><span class='text-slate-500 text-xs ml-auto'>nghệ sĩ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. gallery</span><span class='text-slate-400 text-xs'>(n) /ˈɡæləri/</span><span class='text-slate-500 text-xs ml-auto'>phòng trưng bày tranh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. exhibition</span><span class='text-slate-400 text-xs'>(n) /ˌeksɪˈbɪʃn/</span><span class='text-slate-500 text-xs ml-auto'>cuộc triển lãm</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. museum</span><span class='text-slate-400 text-xs'>(n) /mjuˈziːəm/</span><span class='text-slate-500 text-xs ml-auto'>viện bảo tàng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. performance</span><span class='text-slate-400 text-xs'>(n) /pəˈfɔːməns/</span><span class='text-slate-500 text-xs ml-auto'>buổi biểu diễn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. perform</span><span class='text-slate-400 text-xs'>(v) /pəˈfɔːm/</span><span class='text-slate-500 text-xs ml-auto'>biểu diễn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. composer</span><span class='text-slate-400 text-xs'>(n) /kəmˈpəʊzə/</span><span class='text-slate-500 text-xs ml-auto'>nhà soạn nhạc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. instrument</span><span class='text-slate-400 text-xs'>(n) /ˈɪnstrəmənt/</span><span class='text-slate-500 text-xs ml-auto'>nhạc cụ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. concert</span><span class='text-slate-400 text-xs'>(n) /ˈkɒnsət/</span><span class='text-slate-500 text-xs ml-auto'>buổi hòa nhạc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. anthem</span><span class='text-slate-400 text-xs'>(n) /ˈænθəm/</span><span class='text-slate-500 text-xs ml-auto'>quốc ca, bài ca</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. puppet</span><span class='text-slate-400 text-xs'>(n) /ˈpʌpɪt/</span><span class='text-slate-500 text-xs ml-auto'>con rối</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. parade</span><span class='text-slate-400 text-xs'>(n) /pəˈreɪd/</span><span class='text-slate-500 text-xs ml-auto'>cuộc diễu hành</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. portrait</span><span class='text-slate-400 text-xs'>(n) /ˈpɔːtreɪt/</span><span class='text-slate-500 text-xs ml-auto'>tranh chân dung</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. drawing</span><span class='text-slate-400 text-xs'>(n) /ˈdrɔːɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>bức vẽ, việc vẽ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. heritage</span><span class='text-slate-400 text-xs'>(n) /ˈherɪtɪdʒ/</span><span class='text-slate-500 text-xs ml-auto'>di sản</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. critic</span><span class='text-slate-400 text-xs'>(n) /ˈkrɪtɪk/</span><span class='text-slate-500 text-xs ml-auto'>nhà phê bình</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. famous</span><span class='text-slate-400 text-xs'>(adj) /ˈfeɪməs/</span><span class='text-slate-500 text-xs ml-auto'>nổi tiếng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. lively</span><span class='text-slate-400 text-xs'>(adj) /ˈlaɪvli/</span><span class='text-slate-500 text-xs ml-auto'>sống động, sôi nổi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. loud</span><span class='text-slate-400 text-xs'>(adj) /laʊd/</span><span class='text-slate-500 text-xs ml-auto'>to, ồn</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. So sánh bằng (as...as)</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + be/V + as + adj/adv + as + N/pronoun</td><td class=\"border px-2 py-1 italic\">This song is as popular as that one. <span class=\"not-italic text-slate-500\">— Bài hát này nổi tiếng như bài kia.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + be/V + not as/so + adj/adv + as</td><td class=\"border px-2 py-1 italic\">She is not as tall as her sister. <span class=\"not-italic text-slate-500\">— Cô ấy không cao bằng chị mình.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Với danh từ đếm được</td><td class=\"border px-2 py-1\">as many + N (số nhiều) + as</td><td class=\"border px-2 py-1 italic\">as many toys as <span class=\"not-italic text-slate-500\">— nhiều đồ chơi như...</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Với danh từ không đếm được</td><td class=\"border px-2 py-1\">as much + N (không đếm được) + as</td><td class=\"border px-2 py-1 italic\">as much water as <span class=\"not-italic text-slate-500\">— nhiều nước như...</span></td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-equals mr-1\"></i>2. Different from / The same as</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">be different from</td><td class=\"border px-2 py-1 italic\">Her lifestyle is different from yours. <span class=\"not-italic text-slate-500\">— Lối sống của cô ấy khác với bạn.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">be the same as</td><td class=\"border px-2 py-1 italic\">This novel is the same as that one. <span class=\"not-italic text-slate-500\">— Cuốn tiểu thuyết này giống cuốn kia.</span></td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>This song is as popular than that one.</s> ❌ → <b>This song is as popular as that one.</b> ✅ — so sánh bằng dùng \"as...as\", không dùng \"than\".</li>\n      <li><s>Her lifestyle is different than yours.</s> ❌ → <b>Her lifestyle is different from yours.</b> ✅ — \"different\" đi với \"from\".</li>\n      <li><s>I don't have as many money as you.</s> ❌ → <b>I don't have as much money as you.</b> ✅ — \"money\" không đếm được, dùng \"much\" không dùng \"many\".</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + be/V + as + adj/adv + as + N\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">S + be/V + as + adj/adv + as + N</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + be/V + not as/so + adj/adv + as + N\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">S + be/V + not as/so + adj/adv + as + N</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["musi<u>ci</u>an", "televi<u>si</u>on", "<u>sh</u>ow", "na<u>ti</u>on"], "answer": 1, "explanation": "\"television\" có \"si\" phát âm /ʒ/ (hữu thanh), ba từ còn lại phần gạch chân phát âm /ʃ/.", "ipas": ["/mjuˈzɪʃn/", "/ˈtelɪvɪʒn/", "/ʃəʊ/", "/ˈneɪʃn/"], "vis": ["nhạc sĩ", "truyền hình", "buổi biểu diễn", "quốc gia"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["plea<u>s</u>ure", "u<u>s</u>ual", "deci<u>si</u>on", "spe<u>ci</u>al"], "answer": 3, "explanation": "\"special\" có \"ci\" phát âm /ʃ/, ba từ còn lại phần gạch chân phát âm /ʒ/.", "ipas": ["/ˈpleʒə/", "/ˈjuːʒuəl/", "/dɪˈsɪʒn/", "/ˈspeʃl/"], "vis": ["niềm vui", "thường lệ", "quyết định", "đặc biệt"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["<u>ph</u>oto", "lau<u>gh</u>", "<u>v</u>ery", "<u>ph</u>one"], "answer": 2, "explanation": "\"very\" có \"v\" phát âm /v/ (hữu thanh), ba từ còn lại phần gạch chân phát âm /f/.", "ipas": ["/ˈfəʊtəʊ/", "/lɑːf/", "/ˈveri/", "/fəʊn/"], "vis": ["bức ảnh", "cười", "rất", "điện thoại"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["watch<u>ed</u>", "work<u>ed</u>", "need<u>ed</u>", "help<u>ed</u>"], "answer": 2, "explanation": "\"needed\" có đuôi \"-ed\" phát âm /ɪd/, ba từ còn lại phát âm /t/.", "ipas": ["/wɒtʃt/", "/wɜːkt/", "/ˈniːdɪd/", "/helpt/"], "vis": ["đã xem", "đã làm việc", "đã cần", "đã giúp"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["b<u>ir</u>d", "g<u>ir</u>l", "w<u>or</u>d", "ab<u>ou</u>t"], "answer": 3, "explanation": "\"about\" có \"ou\" phát âm /aʊ/, ba từ còn lại phần gạch chân phát âm /ɜː/.", "ipas": ["/bɜːd/", "/ɡɜːl/", "/wɜːd/", "/əˈbaʊt/"], "vis": ["con chim", "cô gái", "từ", "về"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["exhibi<u>ti</u>on", "clo<u>s</u>ure", "so<u>ci</u>al", "o<u>ce</u>an"], "answer": 1, "explanation": "\"closure\" có \"s\" phát âm /ʒ/, ba từ còn lại phần gạch chân phát âm /ʃ/.", "ipas": ["/ˌeksɪˈbɪʃn/", "/ˈkləʊʒə/", "/ˈsəʊʃl/", "/ˈəʊʃn/"], "vis": ["triển lãm", "sự đóng cửa", "thuộc xã hội", "đại dương"]}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "Which word has a different stress pattern from that of the others?", "options": ["anthem", "artist", "affect", "colour"], "answer": 2, "explanation": "\"affect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈænθəm/", "/ˈɑːtɪst/", "/əˈfekt/", "/ˈkʌlə/"], "vis": ["bài ca ngợi, quốc ca", "nghệ sĩ", "ảnh hưởng", "màu sắc"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["carpenter", "celebrate", "exhibit", "educate"], "answer": 2, "explanation": "\"exhibit\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈkɑːpəntə/", "/ˈselɪbreɪt/", "/ɪɡˈzɪbɪt/", "/ˈedʒukeɪt/"], "vis": ["thợ mộc", "ăn mừng", "trưng bày", "giáo dục"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["compel", "critic", "music", "famous"], "answer": 0, "explanation": "\"compel\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/kəmˈpel/", "/ˈkrɪtɪk/", "/ˈmjuːzɪk/", "/ˈfeɪməs/"], "vis": ["ép buộc", "nhà phê bình", "âm nhạc", "nổi tiếng"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["rural", "parade", "puppet", "photo"], "answer": 1, "explanation": "\"parade\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈrʊərəl/", "/pəˈreɪd/", "/ˈpʌpɪt/", "/ˈfəʊtəʊ/"], "vis": ["thuộc nông thôn", "cuộc diễu hành", "con rối", "bức ảnh"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["portrait", "famous", "prefer", "critic"], "answer": 2, "explanation": "\"prefer\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈpɔːtreɪt/", "/ˈfeɪməs/", "/prɪˈfɜː/", "/ˈkrɪtɪk/"], "vis": ["chân dung", "nổi tiếng", "thích hơn", "nhà phê bình"]}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "The Louvre is one of the most famous ______ in the world.", "options": ["museums", "puppets", "parades", "anthems"], "answer": 0, "explanation": "Louvre là bảo tàng (museum) nổi tiếng.", "vi": "Louvre là một trong những bảo tàng nổi tiếng nhất thế giới.", "tags": ["vocab"]}, {"q": "The orchestra will ______ at the concert hall tonight.", "options": ["paint", "perform", "exhibit", "choose"], "answer": 1, "explanation": "Dàn nhạc biểu diễn (perform).", "vi": "Dàn nhạc sẽ biểu diễn tại phòng hòa nhạc tối nay.", "tags": ["vocab"]}, {"q": "Van Cao was a great Vietnamese ______ and composer.", "options": ["artist", "carpenter", "critic", "puppet"], "answer": 0, "explanation": "Văn Cao là nghệ sĩ (artist) và nhà soạn nhạc.", "vi": "Văn Cao là một nghệ sĩ và nhà soạn nhạc vĩ đại của Việt Nam.", "tags": ["vocab"]}, {"q": "The little girl's ______ of her kitten is very beautiful.", "options": ["drawing", "music", "parade", "anthem"], "answer": 0, "explanation": "\"drawing of\" = bức vẽ về.", "vi": "Bức vẽ chú mèo con của cô bé rất đẹp.", "tags": ["vocab"]}, {"q": "Water puppetry is a traditional art ______ in Viet Nam.", "options": ["form", "colour", "photo", "plan"], "answer": 0, "explanation": "\"art form\" = loại hình nghệ thuật.", "vi": "Múa rối nước là một loại hình nghệ thuật truyền thống ở Việt Nam.", "tags": ["vocab"]}, {"q": "My sister prefers classical music ______ pop music.", "options": ["with", "to", "from", "as"], "answer": 1, "explanation": "\"prefer A to B\" = thích A hơn B.", "vi": "Chị tôi thích nhạc cổ điển hơn nhạc pop.", "tags": ["vocab"]}, {"q": "This painting is ______ colourful as that one.", "options": ["as", "more", "different", "same"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Bức tranh này nhiều màu sắc như bức kia.", "tags": ["grammar"]}, {"q": "The new concert hall is not ______ large as the old one.", "options": ["so", "than", "more", "same"], "answer": 0, "explanation": "Phủ định so sánh bằng: not so/as + adj + as.", "vi": "Phòng hòa nhạc mới không lớn bằng phòng cũ.", "tags": ["grammar"]}, {"q": "My guitar is different ______ yours.", "options": ["with", "from", "to", "as"], "answer": 1, "explanation": "\"different from\" = khác với.", "vi": "Cây ghi-ta của tôi khác với của bạn.", "tags": ["vocab"]}, {"q": "Lan has the same music taste ______ her brother.", "options": ["than", "as", "from", "to"], "answer": 1, "explanation": "\"the same ... as\" = giống như.", "vi": "Lan có gu âm nhạc giống anh trai.", "tags": ["vocab"]}, {"q": "The singer has a very ______ voice.", "options": ["beauty", "beautiful", "beautifully", "beautify"], "answer": 1, "explanation": "Tính từ bổ nghĩa cho \"voice\": beautiful.", "vi": "Ca sĩ có một giọng hát rất đẹp.", "tags": ["vocab"]}, {"q": "The Dan Bau is a traditional Vietnamese musical ______.", "options": ["instrument", "portrait", "gallery", "critic"], "answer": 0, "explanation": "\"musical instrument\" = nhạc cụ.", "vi": "Đàn bầu là một nhạc cụ truyền thống của Việt Nam.", "tags": ["vocab"]}, {"q": "The art club will ______ students' paintings next Friday.", "options": ["exhibit", "celebrate", "compel", "prefer"], "answer": 0, "explanation": "\"exhibit paintings\" = trưng bày tranh.", "vi": "Câu lạc bộ nghệ thuật sẽ trưng bày tranh của học sinh thứ Sáu tới.", "tags": ["vocab"]}, {"q": "The audience clapped loudly after the excellent ______.", "options": ["performance", "origin", "fame", "curriculum"], "answer": 0, "explanation": "\"performance\" = buổi biểu diễn.", "vi": "Khán giả vỗ tay lớn sau buổi biểu diễn xuất sắc.", "tags": ["vocab"]}, {"q": "A ______ is a person who gives opinions about works of art, music or films.", "options": ["critic", "artist", "carpenter", "composer"], "answer": 0, "explanation": "\"critic\" = nhà phê bình.", "vi": "Nhà phê bình là người đưa ra ý kiến về các tác phẩm nghệ thuật, âm nhạc hoặc phim.", "tags": ["vocab"]}, {"q": "The school is planning a music ______ for the end of the term.", "options": ["concert", "photo", "colour", "origin"], "answer": 0, "explanation": "\"music concert\" = buổi hòa nhạc.", "vi": "Nhà trường đang lên kế hoạch cho một buổi hòa nhạc vào cuối học kỳ.", "tags": ["vocab"]}, {"q": "The room is very ______, so we can hear every small sound.", "options": ["quiet", "loud", "famous", "recent"], "answer": 0, "explanation": "Nghe được mọi âm thanh nhỏ → phòng rất yên tĩnh (quiet).", "vi": "Căn phòng rất yên tĩnh, nên chúng tôi nghe được mọi âm thanh nhỏ.", "tags": ["vocab"]}, {"q": "This year's festival is ______ from last year's festival.", "options": ["different", "same", "similar", "as"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Lễ hội năm nay khác với lễ hội năm ngoái.", "tags": ["vocab"]}, {"q": "Her picture is ______ beautiful as mine.", "options": ["as", "than", "more", "most"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Bức tranh của cô ấy đẹp như của tôi.", "tags": ["grammar"]}, {"q": "Pop music is not ______ exciting as rock music for Nam.", "options": ["as", "than", "the", "more"], "answer": 0, "explanation": "Phủ định so sánh bằng: not as + adj + as.", "vi": "Với Nam, nhạc pop không thú vị bằng nhạc rock.", "tags": ["grammar"]}, {"q": "The museum has a large collection of modern ______.", "options": ["art", "artist", "artistic", "artists"], "answer": 0, "explanation": "\"modern art\" = nghệ thuật hiện đại (danh từ không đếm được).", "vi": "Bảo tàng có một bộ sưu tập lớn về nghệ thuật hiện đại.", "tags": ["vocab"]}, {"q": "We watched the talent show ______ on television.", "options": ["live", "lively", "living", "life"], "answer": 0, "explanation": "\"live on television\" = trực tiếp trên truyền hình.", "vi": "Chúng tôi xem chương trình tài năng trực tiếp trên TV.", "tags": ["mixed"]}, {"q": "The school ______ its 50th anniversary with a music show last month.", "options": ["celebrated", "considered", "compelled", "preferred"], "answer": 0, "explanation": "\"celebrate an anniversary\" = kỷ niệm.", "vi": "Trường đã kỷ niệm 50 năm thành lập bằng một chương trình ca nhạc tháng trước.", "tags": ["vocab"]}, {"q": "She wants to ______ the red dress because it looks better on stage.", "options": ["choose", "appear", "educate", "originate"], "answer": 0, "explanation": "\"choose\" = chọn.", "vi": "Cô ấy muốn chọn chiếc váy đỏ vì nó trông đẹp hơn trên sân khấu.", "tags": ["vocab"]}, {"q": "The students painted a ______ of their English teacher.", "options": ["portrait", "puppet", "parade", "anthem"], "answer": 0, "explanation": "\"portrait\" = bức chân dung.", "vi": "Các học sinh đã vẽ một bức chân dung của giáo viên tiếng Anh.", "tags": ["mixed"]}, {"q": "The concert was a great success because the musicians played ______.", "options": ["well", "good", "best", "better"], "answer": 0, "explanation": "Trạng từ bổ nghĩa cho \"played\": well.", "vi": "Buổi hòa nhạc thành công rực rỡ vì các nhạc công chơi rất hay.", "tags": ["vocab"]}, {"q": "This photo is not the same ______ the one in the book.", "options": ["as", "from", "to", "with"], "answer": 0, "explanation": "\"the same as\" = giống như.", "vi": "Bức ảnh này không giống với bức trong sách.", "tags": ["vocab"]}, {"q": "Her school bag has the same colour ______ mine.", "options": ["as", "from", "than", "like"], "answer": 0, "explanation": "\"the same + N + as\".", "vi": "Cặp sách của cô ấy cùng màu với của tôi.", "tags": ["mixed"]}, {"q": "My brother can play the guitar ______ well as his friend.", "options": ["as", "so", "more", "much"], "answer": 0, "explanation": "So sánh bằng với trạng từ (câu khẳng định): as + adv + as.", "vi": "Anh tôi có thể chơi ghi-ta hay như bạn của anh ấy.", "tags": ["grammar"]}, {"q": "Traditional music is an important part of our cultural ______.", "options": ["heritage", "traffic", "disease", "shopping"], "answer": 0, "explanation": "\"cultural heritage\" = di sản văn hóa.", "vi": "Âm nhạc truyền thống là một phần quan trọng của di sản văn hóa chúng ta.", "tags": ["vocab"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "The school has a new art ________________ this month.", "hint": "(exhibit)", "answer": "exhibition", "explanation": "Sau \"a new art\" cần danh từ: exhibition (triển lãm).", "vi": "Trường có một triển lãm nghệ thuật mới trong tháng này.", "family": ["exhibit (v): trưng bày", "exhibition (n): cuộc triển lãm"]}, {"q": "Mozart was a very famous ________________.", "hint": "(music)", "answer": "musician", "explanation": "Danh từ chỉ người: musician (nhạc sĩ).", "vi": "Mozart là một nhạc sĩ rất nổi tiếng.", "family": ["music (n): âm nhạc", "musical (adj): thuộc âm nhạc", "musician (n): nhạc sĩ"]}, {"q": "Her dance ________________ was excellent.", "hint": "(perform)", "answer": "performance", "explanation": "Danh từ ghép: dance performance (buổi biểu diễn múa).", "vi": "Màn biểu diễn múa của cô ấy thật xuất sắc.", "family": ["perform (v): biểu diễn", "performance (n): buổi biểu diễn", "performer (n): người biểu diễn"]}, {"q": "The children were excited about the ________________ puppet show.", "hint": "(tradition)", "answer": "traditional", "explanation": "Tính từ bổ nghĩa cho \"puppet show\": traditional.", "vi": "Bọn trẻ hào hứng với buổi múa rối truyền thống.", "family": ["tradition (n): truyền thống", "traditional (adj): thuộc truyền thống", "traditionally (adv): theo truyền thống"]}, {"q": "This singer became ________________ after winning the competition.", "hint": "(fame)", "answer": "famous", "explanation": "Sau \"became\" dùng tính từ: famous.", "vi": "Ca sĩ này trở nên nổi tiếng sau khi thắng cuộc thi.", "family": ["fame (n): danh tiếng", "famous (adj): nổi tiếng", "famously (adv): một cách nổi tiếng"]}, {"q": "Photography is a popular form of ________________.", "hint": "(art)", "answer": "art", "explanation": "\"form of art\" = loại hình nghệ thuật.", "vi": "Nhiếp ảnh là một loại hình nghệ thuật phổ biến.", "family": ["art (n): nghệ thuật", "artist (n): nghệ sĩ", "artistic (adj): thuộc nghệ thuật"]}, {"q": "The concert was really ________________.", "hint": "(excite)", "answer": "exciting", "explanation": "Tính từ -ing chỉ tính chất sự vật: exciting.", "vi": "Buổi hòa nhạc thực sự thú vị.", "family": ["excite (v): làm phấn khích", "exciting (adj): thú vị (sự vật)", "excited (adj): hào hứng (người)", "excitement (n): sự hào hứng"]}, {"q": "We received an ________________ to the school music festival.", "hint": "(invite)", "answer": "invitation", "explanation": "Sau \"an\" cần danh từ: invitation (lời mời).", "vi": "Chúng tôi nhận được lời mời đến lễ hội âm nhạc của trường.", "family": ["invite (v): mời", "invitation (n): lời mời"]}, {"q": "The two paintings are completely ________________ from each other.", "hint": "(differ)", "answer": "different", "explanation": "\"be different from\" = khác với.", "vi": "Hai bức tranh hoàn toàn khác nhau.", "family": ["differ (v): khác", "difference (n): sự khác biệt", "different (adj): khác", "differently (adv): một cách khác"]}, {"q": "The students listened ________________ to the classical music.", "hint": "(quiet)", "answer": "quietly", "explanation": "Trạng từ bổ nghĩa cho \"listened\": quietly.", "vi": "Các học sinh lặng lẽ lắng nghe nhạc cổ điển.", "family": ["quiet (adj): yên tĩnh", "quietly (adv): một cách yên lặng", "quietness (n): sự yên tĩnh"]}, {"q": "The art teacher praised her ________________ picture.", "hint": "(colour)", "answer": "colourful", "explanation": "Tính từ bổ nghĩa cho \"picture\": colourful.", "vi": "Giáo viên mỹ thuật khen bức tranh nhiều màu sắc của cô ấy.", "family": ["colour (n/v): màu sắc; tô màu", "colourful (adj): nhiều màu sắc", "colourfully (adv): sặc sỡ"]}, {"q": "The museum has many ________________ works of art.", "hint": "(value)", "answer": "valuable", "explanation": "Tính từ bổ nghĩa cho \"works of art\": valuable (giá trị).", "vi": "Bảo tàng có nhiều tác phẩm nghệ thuật giá trị.", "family": ["value (n/v): giá trị; đánh giá", "valuable (adj): có giá trị", "valueless (adj): vô giá trị"]}, {"q": "He is an ____________ young painter.", "hint": "(excellence)", "answer": "excellent", "explanation": "Tính từ bổ nghĩa cho \"painter\": excellent.", "vi": "Anh ấy là một họa sĩ trẻ xuất sắc.", "family": ["excellence (n): sự xuất sắc", "excellent (adj): xuất sắc", "excellently (adv): một cách xuất sắc"]}, {"q": "The band gave a wonderful ________________ last night.", "hint": "(perform)", "answer": "performance", "explanation": "Sau \"a wonderful\" cần danh từ: performance.", "vi": "Ban nhạc đã có một buổi biểu diễn tuyệt vời tối qua.", "family": ["perform (v): biểu diễn", "performance (n): buổi biểu diễn", "performer (n): người biểu diễn"]}, {"q": "She plays the piano very ________________.", "hint": "(beautiful)", "answer": "beautifully", "explanation": "Trạng từ bổ nghĩa cho \"plays\": beautifully.", "vi": "Cô ấy chơi piano rất hay.", "family": ["beauty (n): vẻ đẹp", "beautiful (adj): đẹp", "beautifully (adv): một cách đẹp đẽ"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "Music Tastes", "html": "James says his <span class='blank-tag'>(1)</span> ______ type of music ranges from Rap and R&B to Punk and even Hard Rock. The only kind of music he does not really care for is Country. He thinks it is a <span class='blank-tag'>(2)</span> ______ thing to have a wide taste in music. Joongih, however, does not have one favourite type. If a song comes on the <span class='blank-tag'>(3)</span> ______ and catches his attention, he finds out the name of the artist or group. Then he <span class='blank-tag'>(4)</span> ______ the song and saves it. After some time, songs from many different genres become part of what he listens to in his <span class='blank-tag'>(5)</span> ______ time. Both boys enjoy music, <span class='blank-tag'>(6)</span> ______ their tastes are not exactly the same.", "vi": "James nói thể loại nhạc (1) yêu thích của cậu trải dài từ Rap và R&B đến Punk và thậm chí Hard Rock. Thể loại duy nhất cậu không thực sự thích là nhạc Đồng quê. Cậu nghĩ có gu âm nhạc rộng là một điều (2) tốt. Tuy nhiên, Joongih không có một thể loại yêu thích nào. Nếu một bài hát phát trên (3) đài và thu hút sự chú ý của cậu, cậu tìm tên nghệ sĩ hoặc nhóm nhạc. Sau đó cậu (4) tải bài hát về và lưu lại. Sau một thời gian, các bài hát từ nhiều thể loại khác nhau trở thành một phần những gì cậu nghe trong thời gian (5) rảnh. Cả hai cậu bé đều thích âm nhạc, (6) nhưng gu của họ không hoàn toàn giống nhau."}, "questions": [{"q": "(1) James says his ______ type of music ranges from Rap to Hard Rock.", "options": ["favourite", "fame", "recent", "quiet"], "answer": 0, "explanation": "\"favourite type of music\" = thể loại nhạc yêu thích.", "vi": null, "vis": ["yêu thích", "danh tiếng", "gần đây", "yên tĩnh"]}, {"q": "(2) He thinks it is a ______ thing to have a wide taste in music.", "options": ["good", "loud", "rural", "necessary"], "answer": 0, "explanation": "Có gu âm nhạc rộng là điều tốt (good thing).", "vi": null, "vis": ["tốt", "ồn ào", "thuộc nông thôn", "cần thiết"]}, {"q": "(3) If a song comes on the ______ and catches his attention...", "options": ["radio", "portrait", "gallery", "puppet"], "answer": 0, "explanation": "\"a song comes on the radio\" = bài hát phát trên đài.", "vi": null, "vis": ["đài phát thanh", "chân dung", "phòng tranh", "con rối"]}, {"q": "(4) Then he ______ the song and saves it.", "options": ["downloads", "paints", "performs", "celebrates"], "answer": 0, "explanation": "\"download the song and save it\" = tải bài hát và lưu lại.", "vi": null, "vis": ["tải xuống", "vẽ", "biểu diễn", "ăn mừng"]}, {"q": "(5) What he listens to in his ______ time.", "options": ["spare", "academic", "live", "folk"], "answer": 0, "explanation": "\"spare time\" = thời gian rảnh.", "vi": null, "vis": ["rảnh rỗi", "học thuật", "trực tiếp", "dân gian"]}, {"q": "(6) Both boys enjoy music, ______ their tastes are not exactly the same.", "options": ["but", "so", "because", "or"], "answer": 0, "explanation": "Ý tương phản → but.", "vi": null, "vis": ["nhưng", "vì vậy", "bởi vì", "hoặc"]}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "The Beatles", "html": "In the 1960s, The Beatles were one of the most famous pop groups in the world. The four members came from the north of England, and none of them had formal training in music. At first, they performed and recorded songs written by black American musicians. They had some success with these songs, but they became much more popular when they started writing their own music. Their success helped change pop music. After The Beatles, it became much more common for groups and singers to write the songs they performed themselves.", "vi": "Vào những năm 1960, The Beatles là một trong những nhóm nhạc pop nổi tiếng nhất thế giới. Bốn thành viên đến từ miền bắc nước Anh, và không ai trong số họ được đào tạo âm nhạc bài bản. Ban đầu, họ biểu diễn và thu âm những bài hát do các nhạc sĩ người Mỹ da đen sáng tác. Họ có chút thành công với những bài hát này, nhưng họ trở nên nổi tiếng hơn nhiều khi bắt đầu tự sáng tác nhạc. Thành công của họ đã góp phần thay đổi nhạc pop. Sau The Beatles, việc các nhóm nhạc và ca sĩ tự viết bài hát mình biểu diễn trở nên phổ biến hơn nhiều."}, "questions": [{"q": "The Beatles were famous in the 1960s.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"In the 1960s, The Beatles were one of the most famous pop groups\" → Đúng.", "vi": "The Beatles nổi tiếng vào những năm 1960.", "vis": ["Đúng", "Sai"]}, {"q": "All four members had formal music training.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"none of them had formal training in music\" → Sai.", "vi": "Cả bốn thành viên đều được đào tạo âm nhạc bài bản.", "vis": ["Đúng", "Sai"]}, {"q": "At first, they performed songs by black American musicians.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"At first, they performed and recorded songs written by black American musicians\" → Đúng.", "vi": "Ban đầu, họ biểu diễn các bài hát của nhạc sĩ người Mỹ da đen.", "vis": ["Đúng", "Sai"]}, {"q": "They became more popular after writing their own songs.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"they became much more popular when they started writing their own music\" → Đúng.", "vi": "Họ trở nên nổi tiếng hơn sau khi tự sáng tác.", "vis": ["Đúng", "Sai"]}, {"q": "Where did the members of The Beatles come from?", "options": ["the north of England", "the south of England", "the USA", "Australia"], "answer": 0, "explanation": "Bài đọc: \"came from the north of England\".", "vi": "Các thành viên The Beatles đến từ đâu?", "vis": ["miền bắc nước Anh", "miền nam nước Anh", "Hoa Kỳ", "Úc"]}, {"q": "What became more common after The Beatles became successful?", "options": ["Groups wrote their own songs.", "Groups stopped performing live.", "Singers studied painting.", "Musicians avoided pop music."], "answer": 0, "explanation": "Bài đọc: \"it became much more common for groups and singers to write the songs they performed themselves\".", "vi": "Điều gì trở nên phổ biến hơn sau thành công của The Beatles?", "vis": ["Các nhóm tự viết bài hát.", "Các nhóm ngừng diễn trực tiếp.", "Ca sĩ học vẽ.", "Nhạc sĩ tránh nhạc pop."]}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "R1.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>Japanese / well / Lan / as / learns / as / he / does.</b>", "starter": "", "answer": "Lan learns Japanese as well as he does.", "accepted": null, "explanation": "S + V + O + as + adv + as + S + auxiliary.", "vi": "Lan học tiếng Nhật giỏi như cậu ấy.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R2.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>Nha Trang / as / city / is / as / not / Hue. / cold</b>", "starter": "", "answer": "Nha Trang city is not as cold as Hue.", "accepted": null, "explanation": "S + be + not + as + adj + as + O.", "vi": "Thành phố Nha Trang không lạnh bằng Huế.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R3.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>not / music / Pop / is / roll. / exciting / as / rock / and / as</b>", "starter": "", "answer": "Pop music is not as exciting as rock and roll.", "accepted": null, "explanation": "S + be + not + as + adj + as + O.", "vi": "Nhạc pop không thú vị bằng rock and roll.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R4.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>one. / This / is / novel / same / as / that / the</b>", "starter": "", "answer": "This novel is the same as that one.", "accepted": null, "explanation": "N1 + be + the same as + N2.", "vi": "Cuốn tiểu thuyết này giống cuốn kia.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R5.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>Her / is / different / lifestyle / from / yours.</b>", "starter": "", "answer": "Her lifestyle is different from yours.", "accepted": null, "explanation": "N1 + be + different from + N2.", "vi": "Lối sống của cô ấy khác với của bạn.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "T1.", "original": "This painting is more colourful than that one.", "starter": "That painting is not", "answer": "as colourful as this one", "accepted": ["as colourful as this one", "so colourful as this one", "as colorful as this one"], "explanation": "A hơn B = B không bằng A: not as + adj + as.", "vi": "Bức tranh kia không nhiều màu sắc bằng bức này.", "note": "A + be + more + adj + than + B → B + be + not as + adj + as + A"}, {"q": "T2.", "original": "My guitar and Nam's guitar have the same colour.", "starter": "My guitar has the same", "answer": "colour as Nam's guitar", "accepted": ["colour as Nam's guitar", "colour as Nam's", "color as Nam's guitar"], "explanation": "\"the same + N + as\".", "vi": "Cây ghi-ta của tôi cùng màu với cây ghi-ta của Nam.", "note": "A and B have the same N → A has the same N as B"}, {"q": "T3.", "original": "The concert hall in our town is smaller than the city concert hall.", "starter": "The concert hall in our town is not", "answer": "as big as the city concert hall", "accepted": ["as big as the city concert hall", "as large as the city concert hall", "so big as the city concert hall", "so large as the city concert hall"], "explanation": "smaller than = not as big/large as.", "vi": "Phòng hòa nhạc ở thị trấn chúng tôi không lớn bằng phòng hòa nhạc thành phố.", "note": "A + be + smaller than + B → A + be + not as big/large as + B"}, {"q": "T4.", "original": "Lan's music taste is different from mine.", "starter": "My music taste is not", "answer": "the same as Lan's", "accepted": ["the same as Lan's", "the same as Lan's music taste"], "explanation": "different from = not the same as.", "vi": "Gu âm nhạc của tôi không giống của Lan.", "note": "A + be + different from + B → B + be + not the same as + A"}, {"q": "T5.", "original": "This year's puppet show is as interesting as last year's.", "starter": "This year's puppet show is the same", "answer": "as last year's", "accepted": null, "explanation": "as ... as = the same as.", "vi": "Buổi múa rối năm nay giống như năm ngoái.", "note": "A + be + as + adj + as + B → A + be + the same as + B"}, {"q": "T6.", "original": "My sister's piano is different from my piano.", "starter": "My sister's piano is not the", "answer": "same as my piano", "accepted": ["same as my piano", "same as mine"], "explanation": "different from = not the same as.", "vi": "Đàn piano của chị tôi không giống đàn piano của tôi.", "note": "A + be + different from + B → A + be + not the same as + B"}, {"q": "T7.", "original": "The red portrait and the blue portrait are the same.", "starter": "The red portrait is the same", "answer": "as the blue portrait", "accepted": ["as the blue portrait", "as the blue one"], "explanation": "A and B are the same = A is the same as B.", "vi": "Bức chân dung đỏ giống bức chân dung xanh.", "note": "A and B are the same → A is the same as B"}, {"q": "T8.", "original": "The red portrait and the blue portrait are the same.", "starter": "The red portrait is similar", "answer": "to the blue portrait", "accepted": ["to the blue portrait", "to the blue one"], "explanation": "the same = similar to.", "vi": "Bức chân dung đỏ tương tự bức chân dung xanh.", "note": "A and B are the same → A is similar to B"}, {"q": "T9.", "original": "Rock music is more exciting than classical music for Tom.", "starter": "Classical music is not", "answer": "as exciting as rock music for Tom", "accepted": ["as exciting as rock music for Tom", "so exciting as rock music for Tom"], "explanation": "A hơn B = B không bằng A.", "vi": "Với Tom, nhạc cổ điển không thú vị bằng nhạc rock.", "note": "A + be + more + adj + than + B → B + be + not as + adj + as + A"}, {"q": "T10.", "original": "Mai's dress is similar to Hoa's dress.", "starter": "Mai's dress looks", "answer": "like Hoa's dress", "accepted": ["like Hoa's dress", "like Hoa's"], "explanation": "similar to = look like.", "vi": "Váy của Mai trông giống váy của Hoa.", "note": "A + be + similar to + B → A + look(s) like + B"}, {"q": "T11.", "original": "This photo is different from the photo in the book.", "starter": "This photo is not", "answer": "the same as the photo in the book", "accepted": ["the same as the photo in the book", "the same as the one in the book"], "explanation": "different from = not the same as.", "vi": "Bức ảnh này không giống bức ảnh trong sách.", "note": "A + be + different from + B → A + be + not the same as + B"}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"performance\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "performance", "ipa": "/pəˈfɔːməns/", "pos": "noun", "senses": [{"def": "an act of performing a play, concert, or other form of entertainment", "examples": ["The dance performance lasted about an hour.", "Critics praised her performance in the new film.", "The school is holding a music performance next Friday.", "We watched an amazing puppet performance at the festival."]}], "vi": "<b>performance</b> /pəˈfɔːməns/ (danh từ)<br>một buổi trình diễn kịch, hòa nhạc, hoặc hình thức giải trí khác.<br>• Buổi biểu diễn múa kéo dài khoảng một tiếng.<br>• Các nhà phê bình khen ngợi màn trình diễn của cô trong bộ phim mới.<br>• Trường sẽ tổ chức buổi biểu diễn âm nhạc vào thứ Sáu tới.<br>• Chúng tôi đã xem một buổi biểu diễn rối tuyệt vời tại lễ hội."}, "questions": [{"q": "A. The school is holding a music ________________ next Friday.", "answer": "performance", "explanation": "Dựa vào ví dụ: music performance.", "vi": "Trường sẽ tổ chức buổi biểu diễn âm nhạc vào thứ Sáu tới."}, {"q": "B. We watched an amazing puppet ________________ at the festival.", "answer": "performance", "explanation": "Dựa vào ví dụ: puppet performance.", "vi": "Chúng tôi đã xem một buổi biểu diễn rối tuyệt vời tại lễ hội."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"exhibition\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "exhibition", "ipa": "/ˌeksɪˈbɪʃn/", "pos": "noun", "senses": [{"def": "a collection of things, for example works of art, that are shown to the public", "examples": ["The gallery is holding an exhibition of modern paintings.", "We visited a photography exhibition at the museum.", "Her paintings were on exhibition for two weeks.", "The art exhibition attracted thousands of visitors."]}], "vi": "<b>exhibition</b> /ˌeksɪˈbɪʃn/ (danh từ)<br>bộ sưu tập các thứ, ví dụ tác phẩm nghệ thuật, được trưng bày cho công chúng xem.<br>• Phòng tranh đang tổ chức triển lãm tranh hiện đại.<br>• Chúng tôi đã thăm triển lãm nhiếp ảnh tại bảo tàng.<br>• Tranh của cô ấy được trưng bày trong hai tuần.<br>• Triển lãm nghệ thuật thu hút hàng nghìn du khách."}, "questions": [{"q": "A. The art ________________ attracted thousands of visitors last month.", "answer": "exhibition", "explanation": "Dựa vào ví dụ: The art exhibition attracted thousands of visitors.", "vi": "Triển lãm nghệ thuật đã thu hút hàng nghìn du khách tháng trước."}, {"q": "B. We visited a photography ________________ at the museum yesterday.", "answer": "exhibition", "explanation": "Dựa vào ví dụ: a photography exhibition.", "vi": "Hôm qua chúng tôi đã thăm một triển lãm nhiếp ảnh tại bảo tàng."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "What activity does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🏃</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["cycling", "swimming", "playing volleyball", "jogging"], "answer": 3, "explanation": "Hình một người đang chạy bộ → jogging.", "vis": ["đạp xe", "bơi lội", "chơi bóng chuyền", "chạy bộ"]}, {"q": "What does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🎭🪆</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["a paint palette", "a puppet theatre", "a concert hall", "a camera"], "answer": 1, "explanation": "Hình sân khấu với những con rối → nhà hát múa rối (puppet theatre).", "vis": ["bảng màu vẽ", "nhà hát múa rối", "phòng hòa nhạc", "máy ảnh"]}, {"q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🎟️</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">SOLD OUT</p></div>", "options": ["There are no tickets left.", "Tickets are sold outside.", "Please go out to buy your tickets.", "You can eat and drink here."], "answer": 0, "explanation": "\"SOLD OUT\" = đã bán hết vé.", "vis": ["Không còn vé nào.", "Vé được bán bên ngoài.", "Vui lòng ra ngoài mua vé.", "Bạn có thể ăn uống ở đây."]}]}, {"roman": "", "navLabel": "GP1: as...as", "title": "Grammar Practice 1: Comparison of equality (as ... as)", "icon": "scale-balanced", "instructions": "Viết dạng so sánh bằng (as ... as) của từ trong ngoặc (nhấn Enter để kiểm tra).", "type": "fill", "instant": true, "questions": [{"q": "This cake is ______________ that cake.", "answer": "as sweet as", "explanation": "So sánh bằng: as + sweet + as.", "hint": "(sweet)", "vi": "Cái bánh này ngọt như cái bánh kia."}, {"q": "My laptop is ______________ yours.", "answer": "as expensive as", "explanation": "So sánh bằng: as + expensive + as.", "hint": "(expensive)", "vi": "Laptop của tôi đắt như của bạn."}, {"q": "This actress acts ______________ that one.", "answer": "as excellently as", "explanation": "So sánh bằng: as + excellently + as.", "hint": "(excellently)", "vi": "Nữ diễn viên này diễn xuất sắc như nữ diễn viên kia."}, {"q": "Does a tiger run ______________ a cheetah?", "answer": "as fast as", "explanation": "So sánh bằng: as + fast + as.", "hint": "(fast)", "vi": "Hổ có chạy nhanh như báo không?"}, {"q": "Simon is ______________ his brother.", "answer": "as brave as", "explanation": "So sánh bằng: as + brave + as.", "hint": "(brave)", "vi": "Simon dũng cảm như anh trai."}, {"q": "Is an elephant ______________ a whale?", "answer": "as heavy as", "explanation": "So sánh bằng: as + heavy + as.", "hint": "(heavy)", "vi": "Voi có nặng như cá voi không?"}, {"q": "Emma is ______________ Judy.", "answer": "as studious as", "explanation": "So sánh bằng: as + studious + as.", "hint": "(studious)", "vi": "Emma chăm học như Judy."}, {"q": "Did he do the test ______________ you?", "answer": "as badly as", "explanation": "So sánh bằng: as + badly + as.", "hint": "(badly)", "vi": "Anh ấy có làm bài kiểm tra tệ như bạn không?"}, {"q": "I slept ______________ my mother last night.", "answer": "as well as", "explanation": "So sánh bằng: as + well + as.", "hint": "(well)", "vi": "Tối qua tôi ngủ ngon như mẹ tôi."}, {"q": "Ben cooks ______________ his friend, John.", "answer": "as badly as", "explanation": "So sánh bằng: as + badly + as.", "hint": "(badly)", "vi": "Ben nấu ăn dở như bạn của cậu ấy, John."}]}, {"roman": "", "navLabel": "GP2: not as...as", "title": "Grammar Practice 2: Inequality (not as / so ... as)", "icon": "scale-unbalanced", "instructions": "Viết dạng so sánh không bằng (not as/so ... as) của từ trong ngoặc.", "type": "fill", "instant": true, "questions": [{"q": "She is not ______________ her sister.", "answer": "as charming as", "explanation": "Phủ định so sánh bằng: not as/so + charming + as.", "hint": "(charming)", "vi": "Cô ấy không quyến rũ bằng chị gái.", "accepted": ["as charming as", "so charming as"]}, {"q": "My car isn't running ______________ that one.", "answer": "as fast as", "explanation": "Phủ định so sánh bằng: not as/so + fast + as.", "hint": "(fast)", "vi": "Xe của tôi không chạy nhanh bằng chiếc kia.", "accepted": ["as fast as", "so fast as"]}, {"q": "A bird is not ______________ a butterfly.", "answer": "as colourful as", "explanation": "Phủ định so sánh bằng: not as/so + colourful + as.", "hint": "(colourful)", "vi": "Chim không sặc sỡ bằng bướm.", "accepted": ["as colourful as", "so colourful as"]}, {"q": "A wolf is not ______________ a puppy.", "answer": "as friendly as", "explanation": "Phủ định so sánh bằng: not as/so + friendly + as.", "hint": "(friendly)", "vi": "Sói không thân thiện bằng chó con.", "accepted": ["as friendly as", "so friendly as"]}, {"q": "Fast food isn't ______________ salad.", "answer": "as healthy as", "explanation": "Phủ định so sánh bằng: not as/so + healthy + as.", "hint": "(healthy)", "vi": "Đồ ăn nhanh không lành mạnh bằng sa-lát.", "accepted": ["as healthy as", "so healthy as"]}, {"q": "Those shoes aren't ______________ these ones.", "answer": "as loose as", "explanation": "Phủ định so sánh bằng: not as/so + loose + as.", "hint": "(loose)", "vi": "Đôi giày kia không rộng bằng đôi này.", "accepted": ["as loose as", "so loose as"]}, {"q": "We don't work ______________ him.", "answer": "as hard as", "explanation": "Phủ định so sánh bằng: not as/so + hard + as.", "hint": "(hard)", "vi": "Chúng tôi không làm việc chăm chỉ bằng anh ấy.", "accepted": ["as hard as", "so hard as"]}, {"q": "I didn't leave home ______________ them.", "answer": "as early as", "explanation": "Phủ định so sánh bằng: not as/so + early + as.", "hint": "(early)", "vi": "Tôi không rời nhà sớm bằng họ.", "accepted": ["as early as", "so early as"]}, {"q": "She doesn't take care of babies ______________ my mom.", "answer": "as carefully as", "explanation": "Phủ định so sánh bằng: not as/so + carefully + as.", "hint": "(carefully)", "vi": "Cô ấy không chăm em bé cẩn thận bằng mẹ tôi.", "accepted": ["as carefully as", "so carefully as"]}, {"q": "A computer isn't ______________ a book.", "answer": "as light as", "explanation": "Phủ định so sánh bằng: not as/so + light + as.", "hint": "(light)", "vi": "Máy tính không nhẹ bằng một cuốn sách.", "accepted": ["as light as", "so light as"]}]}, {"roman": "", "navLabel": "GP3: different/same", "title": "Grammar Practice 3: different or the same", "icon": "code-compare", "instructions": "Chọn \"different\" hoặc \"the same\" để hoàn thành câu.", "type": "mcq", "instant": true, "questions": [{"q": "Your house looks __________ from my house.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Nhà bạn trông khác nhà tôi."}, {"q": "John has __________ job as my brother.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "John có cùng công việc với anh tôi."}, {"q": "His ideas are little __________ from those of his friends.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Ý tưởng của anh ấy hơi khác với của bạn bè."}, {"q": "The book's __________ from the last time I read it.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Cuốn sách khác so với lần trước tôi đọc."}, {"q": "My opinion is __________ from yours.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Ý kiến của tôi khác với của bạn."}, {"q": "Ann's salary is __________ as mine.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Lương của Ann bằng của tôi."}, {"q": "Your motorbike has __________ weight as my motorbike.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Xe máy của bạn có cùng trọng lượng với xe của tôi."}, {"q": "Humans are __________ from other animals.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Con người khác với các loài động vật khác."}, {"q": "This apple has __________ flavor as that apple.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Quả táo này có cùng hương vị với quả táo kia."}, {"q": "The apple is __________ weight as the orange.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Quả táo có cùng trọng lượng với quả cam."}]}, {"roman": "", "navLabel": "GP4: Chọn đúng", "title": "Grammar Practice 4: Circle the correct answers", "icon": "circle-check", "instructions": "Chọn đáp án đúng trong ngoặc.", "type": "mcq", "instant": true, "questions": [{"q": "My younger brother has as many toys (as / from) me.", "options": ["as", "from"], "answer": 0, "explanation": "as many + N + as.", "vi": "Em trai tôi có nhiều đồ chơi như tôi."}, {"q": "No other island in the world is (as large as / different large from) Greenland.", "options": ["as large as", "different large from"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Không hòn đảo nào trên thế giới lớn bằng Greenland."}, {"q": "The cake tastes (different / the same) as chocolate.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\"; \"different\" đi với \"from\".", "vi": "Cái bánh có vị giống sô-cô-la."}, {"q": "I have (different / as) much money as my older brother.", "options": ["different", "as"], "answer": 1, "explanation": "as much + N + as.", "vi": "Tôi có nhiều tiền như anh trai tôi."}, {"q": "Life in the city is (different / the same) from life in the countryside.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\".", "vi": "Cuộc sống ở thành phố khác với ở nông thôn."}, {"q": "My book is (same / as) interesting as yours.", "options": ["same", "as"], "answer": 1, "explanation": "as + adj + as.", "vi": "Sách của tôi thú vị như của bạn."}, {"q": "His house is different (from / as) my house.", "options": ["from", "as"], "answer": 0, "explanation": "\"different from\".", "vi": "Nhà anh ấy khác nhà tôi."}, {"q": "No other writer in English (is / are) as famous as Shakespeare.", "options": ["is", "are"], "answer": 0, "explanation": "Chủ ngữ \"No other writer\" số ít → is.", "vi": "Không nhà văn tiếng Anh nào nổi tiếng như Shakespeare."}, {"q": "No other metal is as (use / useful) as iron.", "options": ["use", "useful"], "answer": 1, "explanation": "Giữa as ... as cần tính từ: useful.", "vi": "Không kim loại nào hữu ích như sắt."}, {"q": "Your hat (look / looks) the same as Mary's.", "options": ["look", "looks"], "answer": 1, "explanation": "Chủ ngữ số ít \"Your hat\" → looks.", "vi": "Cái mũ của bạn trông giống của Mary."}]}, {"roman": "", "navLabel": "GP5: Trắc nghiệm", "title": "Grammar Practice 5: Circle the best answers", "icon": "list-check", "instructions": "Chọn đáp án đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "No one else in the class plays the guitar ______ John.", "options": ["as well", "as far as", "so well as", "as soon as"], "answer": 2, "explanation": "So sánh bằng với trạng từ trong câu phủ định (No one): as/so + well + as.", "vi": "Không ai khác trong lớp chơi ghi-ta hay như John."}, {"q": "The Brit School is the most famous ______ arts school in Britain.", "options": ["performing", "performance", "perform", "performed"], "answer": 0, "explanation": "\"performing arts\" = nghệ thuật biểu diễn.", "vi": "Trường Brit là trường nghệ thuật biểu diễn nổi tiếng nhất nước Anh."}, {"q": "Jane is not ______ her brother.", "options": ["more intelligent as", "intelligent as", "so intelligent as", "so intelligent that"], "answer": 2, "explanation": "Phủ định so sánh bằng: not so + adj + as.", "vi": "Jane không thông minh bằng anh trai."}, {"q": "Since the 1970s, the festival in Glastonbury has taken ______ almost every year and has grown in size.", "options": ["part", "place", "note", "notice"], "answer": 1, "explanation": "\"take place\" = diễn ra.", "vi": "Từ những năm 1970, lễ hội ở Glastonbury diễn ra hầu như mỗi năm và ngày càng lớn."}, {"q": "He drives as ______ his father does.", "options": ["careful as", "more carefully", "the most careful", "carefully as"], "answer": 3, "explanation": "So sánh bằng với trạng từ: as + carefully + as.", "vi": "Anh ấy lái xe cẩn thận như bố anh ấy."}, {"q": "Dong Ho paintings are made on ______ paper with beautiful ______ colors.", "options": ["traditional - nature", "tradition – natural", "tradition - nature", "traditional – natural"], "answer": 3, "explanation": "Cần hai tính từ bổ nghĩa cho danh từ: traditional paper, natural colors.", "vi": "Tranh Đông Hồ được làm trên giấy truyền thống với màu sắc tự nhiên đẹp mắt."}, {"q": "I'll be there ______ I can.", "options": ["sooner as", "no sooner as", "as soon as", "soonest as"], "answer": 2, "explanation": "\"as soon as\" = ngay khi.", "vi": "Tôi sẽ có mặt ngay khi có thể."}, {"q": "My village is not ______ it was ten years ago.", "options": ["the same as", "the same to", "same as", "the same"], "answer": 0, "explanation": "\"the same as\" = giống như.", "vi": "Làng tôi không còn như mười năm trước."}, {"q": "The villagers are ______ they were years ago. There is no change at all.", "options": ["differently from", "not as friendly as", "as friend as", "as friendly as"], "answer": 3, "explanation": "Không có gì thay đổi → vẫn thân thiện như xưa: as friendly as.", "vi": "Dân làng vẫn thân thiện như nhiều năm trước. Không có gì thay đổi cả."}, {"q": "Water puppetry ______ in the 11th century in the villages of the Red River Delta of North Viet Nam.", "options": ["originated", "formed", "started", "began"], "answer": 0, "explanation": "\"originate in\" = bắt nguồn từ.", "vi": "Múa rối nước bắt nguồn từ thế kỷ 11 ở các làng thuộc đồng bằng sông Hồng, miền Bắc Việt Nam."}, {"q": "The puppet shows present ______ themes of Vietnamese villages.", "options": ["city", "urban", "village", "rural"], "answer": 3, "explanation": "\"rural themes\" = chủ đề nông thôn.", "vi": "Các buổi múa rối thể hiện những chủ đề nông thôn của làng quê Việt Nam."}, {"q": "No one in my class is ______ beautiful ______ her.", "options": ["as - as", "more - as", "as - than", "the – more"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Không ai trong lớp tôi đẹp như cô ấy."}, {"q": "The group is ______ for their albums and tours around the world.", "options": ["well-knows", "know-how", "well-prepared", "well-known"], "answer": 3, "explanation": "\"be well-known for\" = nổi tiếng về.", "vi": "Nhóm nhạc nổi tiếng với các album và chuyến lưu diễn khắp thế giới."}, {"q": "Going by train isn't ______ convenient as going by car.", "options": ["so", "as", "more", "A & B are correct."], "answer": 3, "explanation": "Phủ định so sánh bằng dùng được cả not as/so ... as.", "vi": "Đi tàu không tiện bằng đi ô tô."}, {"q": "The performance of puppetry show ______ in the countryside and ______.", "options": ["everyday life – folk rock", "every day life – folk people", "everyday life – folktales", "every day life – folk stories"], "answer": 2, "explanation": "\"everyday life\" (tính từ ghép) và \"folktales\" (truyện dân gian).", "vi": "Buổi múa rối thể hiện cuộc sống thường ngày ở nông thôn và các câu chuyện dân gian."}, {"q": "Classical music is not ______ as pop music.", "options": ["exciting", "more excited", "as exciting", "as excited"], "answer": 2, "explanation": "not as + adj (exciting: tính từ chỉ sự vật) + as.", "vi": "Nhạc cổ điển không thú vị bằng nhạc pop."}, {"q": "The test is not ______ difficult ______ it was last month.", "options": ["as - as", "so - as", "more - as", "A & B are correct."], "answer": 3, "explanation": "Phủ định so sánh bằng: not as/so ... as.", "vi": "Bài kiểm tra không khó như tháng trước."}, {"q": "This year's musical festival is not ______ it was last year.", "options": ["different from", "worse", "as good as", "as well as"], "answer": 2, "explanation": "Sau \"is not\" cần tính từ so sánh bằng: as good as.", "vi": "Lễ hội âm nhạc năm nay không hay bằng năm ngoái."}, {"q": "He works ______ we do.", "options": ["harder", "as hard as", "harder", "so hard as"], "answer": 1, "explanation": "Câu khẳng định dùng as + adv + as.", "vi": "Anh ấy làm việc chăm chỉ như chúng tôi."}, {"q": "Marie is not ______ intelligent ______ her sister.", "options": ["more-as", "so-so", "so-as", "the-of"], "answer": 2, "explanation": "Phủ định so sánh bằng: not so + adj + as.", "vi": "Marie không thông minh bằng chị gái."}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 4", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 4 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>musi<u>ci</u>an</b> <span class='text-slate-400'>/mjuˈzɪʃn/</span> · <b class='text-emerald-700'>televi<u>si</u>on</b> <span class='text-slate-400'>/ˈtelɪvɪʒn/</span> · <b class='text-slate-500'><u>sh</u>ow</b> <span class='text-slate-400'>/ʃəʊ/</span> · <b class='text-slate-500'>na<u>ti</u>on</b> <span class='text-slate-400'>/ˈneɪʃn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"television\" có \"si\" phát âm /ʒ/ (hữu thanh), ba từ còn lại phần gạch chân phát âm /ʃ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>plea<u>s</u>ure</b> <span class='text-slate-400'>/ˈpleʒə/</span> · <b class='text-slate-500'>u<u>s</u>ual</b> <span class='text-slate-400'>/ˈjuːʒuəl/</span> · <b class='text-slate-500'>deci<u>si</u>on</b> <span class='text-slate-400'>/dɪˈsɪʒn/</span> · <b class='text-emerald-700'>spe<u>ci</u>al</b> <span class='text-slate-400'>/ˈspeʃl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"special\" có \"ci\" phát âm /ʃ/, ba từ còn lại phần gạch chân phát âm /ʒ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'><u>ph</u>oto</b> <span class='text-slate-400'>/ˈfəʊtəʊ/</span> · <b class='text-slate-500'>lau<u>gh</u></b> <span class='text-slate-400'>/lɑːf/</span> · <b class='text-emerald-700'><u>v</u>ery</b> <span class='text-slate-400'>/ˈveri/</span> · <b class='text-slate-500'><u>ph</u>one</b> <span class='text-slate-400'>/fəʊn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"very\" có \"v\" phát âm /v/ (hữu thanh), ba từ còn lại phần gạch chân phát âm /f/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>watch<u>ed</u></b> <span class='text-slate-400'>/wɒtʃt/</span> · <b class='text-slate-500'>work<u>ed</u></b> <span class='text-slate-400'>/wɜːkt/</span> · <b class='text-emerald-700'>need<u>ed</u></b> <span class='text-slate-400'>/ˈniːdɪd/</span> · <b class='text-slate-500'>help<u>ed</u></b> <span class='text-slate-400'>/helpt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"needed\" có đuôi \"-ed\" phát âm /ɪd/, ba từ còn lại phát âm /t/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>b<u>ir</u>d</b> <span class='text-slate-400'>/bɜːd/</span> · <b class='text-slate-500'>g<u>ir</u>l</b> <span class='text-slate-400'>/ɡɜːl/</span> · <b class='text-slate-500'>w<u>or</u>d</b> <span class='text-slate-400'>/wɜːd/</span> · <b class='text-emerald-700'>ab<u>ou</u>t</b> <span class='text-slate-400'>/əˈbaʊt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"about\" có \"ou\" phát âm /aʊ/, ba từ còn lại phần gạch chân phát âm /ɜː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-slate-500'>exhibi<u>ti</u>on</b> <span class='text-slate-400'>/ˌeksɪˈbɪʃn/</span> · <b class='text-emerald-700'>clo<u>s</u>ure</b> <span class='text-slate-400'>/ˈkləʊʒə/</span> · <b class='text-slate-500'>so<u>ci</u>al</b> <span class='text-slate-400'>/ˈsəʊʃl/</span> · <b class='text-slate-500'>o<u>ce</u>an</b> <span class='text-slate-400'>/ˈəʊʃn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"closure\" có \"s\" phát âm /ʒ/, ba từ còn lại phần gạch chân phát âm /ʃ/.</p></div></div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Trọng âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>anthem</b> <span class='text-slate-400'>/ˈænθəm/</span> · <b class='text-slate-500'>artist</b> <span class='text-slate-400'>/ˈɑːtɪst/</span> · <b class='text-emerald-700'>affect</b> <span class='text-slate-400'>/əˈfekt/</span> · <b class='text-slate-500'>colour</b> <span class='text-slate-400'>/ˈkʌlə/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"affect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>carpenter</b> <span class='text-slate-400'>/ˈkɑːpəntə/</span> · <b class='text-slate-500'>celebrate</b> <span class='text-slate-400'>/ˈselɪbreɪt/</span> · <b class='text-emerald-700'>exhibit</b> <span class='text-slate-400'>/ɪɡˈzɪbɪt/</span> · <b class='text-slate-500'>educate</b> <span class='text-slate-400'>/ˈedʒukeɪt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"exhibit\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-emerald-700'>compel</b> <span class='text-slate-400'>/kəmˈpel/</span> · <b class='text-slate-500'>critic</b> <span class='text-slate-400'>/ˈkrɪtɪk/</span> · <b class='text-slate-500'>music</b> <span class='text-slate-400'>/ˈmjuːzɪk/</span> · <b class='text-slate-500'>famous</b> <span class='text-slate-400'>/ˈfeɪməs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"compel\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>rural</b> <span class='text-slate-400'>/ˈrʊərəl/</span> · <b class='text-emerald-700'>parade</b> <span class='text-slate-400'>/pəˈreɪd/</span> · <b class='text-slate-500'>puppet</b> <span class='text-slate-400'>/ˈpʌpɪt/</span> · <b class='text-slate-500'>photo</b> <span class='text-slate-400'>/ˈfəʊtəʊ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"parade\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>portrait</b> <span class='text-slate-400'>/ˈpɔːtreɪt/</span> · <b class='text-slate-500'>famous</b> <span class='text-slate-400'>/ˈfeɪməs/</span> · <b class='text-emerald-700'>prefer</b> <span class='text-slate-400'>/prɪˈfɜː/</span> · <b class='text-slate-500'>critic</b> <span class='text-slate-400'>/ˈkrɪtɪk/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"prefer\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. So sánh bằng (as...as)</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + be/V + as + adj/adv + as + N/pronoun</td><td class=\"border px-2 py-1 italic\">This song is as popular as that one. <span class=\"not-italic text-slate-500\">— Bài hát này nổi tiếng như bài kia.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + be/V + not as/so + adj/adv + as</td><td class=\"border px-2 py-1 italic\">She is not as tall as her sister. <span class=\"not-italic text-slate-500\">— Cô ấy không cao bằng chị mình.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Với danh từ đếm được</td><td class=\"border px-2 py-1\">as many + N (số nhiều) + as</td><td class=\"border px-2 py-1 italic\">as many toys as <span class=\"not-italic text-slate-500\">— nhiều đồ chơi như...</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Với danh từ không đếm được</td><td class=\"border px-2 py-1\">as much + N (không đếm được) + as</td><td class=\"border px-2 py-1 italic\">as much water as <span class=\"not-italic text-slate-500\">— nhiều nước như...</span></td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-equals mr-1\"></i>2. Different from / The same as</p>\n    <div class=\"overflow-x-auto\">\n    <
