ết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkætl/", "/ˈferi/", "/kəˈlekt/", "/ˈɔːtʃəd/"], "vis": ["gia súc", "phà", "thu thập", "vườn cây ăn quả"], "image": null}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["speed", "step", "pace", "rate"], "answer": 2, "explanation": "\"pace of life\" = nhịp sống.", "vi": null, "passage": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."}, {"id": "MCQ29", "type": "mcq", "q": "29. The landscape in this mountainous region is incredibly ________, with rolling green hills and traditional wooden stilt houses.", "options": ["vast", "dry", "well-trained", "picturesque"], "answer": 3, "explanation": "\"picturesque\" = đẹp như tranh vẽ — hợp nghĩa miêu tả phong cảnh.", "vi": null, "ipas": null, "vis": ["rộng lớn (không sai nhưng chưa sát nghĩa nhất)", "khô (sai nghĩa)", "lành nghề (sai — không tả cảnh vật)", "đẹp như tranh (đúng)"], "image": null}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["for", "with", "of", "by"], "answer": 0, "explanation": "\"be famous for\" = nổi tiếng vì cái gì.", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "MCQ23", "type": "mcq", "q": "23. Student A: You look nice today.  Student B: ______", "options": ["Do you really think so?", "I don't think so.", "I beg your pardon.", "I'm fine, thank you."], "answer": 0, "explanation": "Phản hồi lại lời khen xã giao một cách khiêm tốn.", "vi": null, "ipas": null, "vis": ["bạn thật sự nghĩ vậy à? (đúng — khiêm tốn trước lời khen)", "tôi không nghĩ vậy (không tự nhiên)", "xin lỗi, bạn nói lại được không (lạc đề)", "tôi khỏe, cảm ơn (lạc đề — không phải trả lời sức khỏe)"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. The majority of Americans live outside cities or towns.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"About a quarter of Americans live outside...\" → chỉ khoảng 1/4, không phải đa số → Sai.", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}], [{"id": "TR2", "type": "sentence", "q": "Hoa is a more careful taxi driver than Nam.", "starter": "Hoa drives", "answer": "more carefully than Nam", "accepted": ["more carefully than Nam", "a taxi more carefully than Nam"], "explanation": "\"careful\" là tính từ dài → trạng từ tương ứng \"carefully\" cũng dùng \"more\" khi so sánh hơn.", "vi": "Hoa lái taxi cẩn thận hơn Nam.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["fascinating", "boring", "terrible", "ordinary"], "answer": 0, "explanation": "\"fascinating sights\" = cảnh đẹp hấp dẫn/lôi cuốn.", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "MCQ17", "type": "mcq", "q": "17. My father asked us_________too much time playing computer games last night.", "options": ["not to spending", "didn't spend", "not to spend", "to not spent"], "answer": 2, "explanation": "Cấu trúc: ask sb not to do sth → not to spend.", "vi": null, "ipas": null, "vis": ["sai ngữ pháp", "sai cấu trúc", "đúng — không làm gì", "sai vị trí \"not\""], "image": null}, {"id": "TFB6", "type": "mcq", "q": "6. What happens to many children of rural Americans when they grow up according to the passage?", "options": ["They stay in the countryside to work on farms.", "They often move to a town or city.", "They build more schools in rural areas.", "They travel a long way to go to school."], "answer": 1, "explanation": "Bài đọc: \"their children often move to a town or city when they grow up\".", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}, {"id": "MCQ26", "type": "mcq", "q": "26. Student A: Why do you like living in the countryside? Student B: ______", "options": ["Because there's a great sense of community there.", "Because I like the excitement of the city.", "Because life in the countryside is boring.", "Because I don't like the public transport here."], "answer": 0, "explanation": "Trả lời trực tiếp và hợp lý cho câu hỏi vì sao thích sống ở nông thôn.", "vi": null, "ipas": null, "vis": ["vì ở đó có tình làng nghĩa xóm gắn kết (đúng)", "vì tôi thích sự sôi động thành phố (mâu thuẫn với câu hỏi)", "vì cuộc sống nông thôn nhàm chán (mâu thuẫn — đây là lý do KHÔNG thích)", "vì tôi không thích giao thông công cộng (lạc đề)"], "image": null}, {"id": "MCQ15", "type": "mcq", "q": "15. This is ________ city that I have ever been to.", "options": ["the busiest", "the busier", "the most busy", "the most busiest"], "answer": 0, "explanation": "So sánh nhất với tính từ ngắn \"busy\" → the busiest.", "vi": null, "ipas": null, "vis": ["nhộn nhịp nhất (đúng)", "nhộn nhịp hơn (so sánh hơn, sai)", "nhộn nhịp nhất (sai — thừa \"most\")", "sai ngữ pháp (thừa cả 2 cách)"], "image": null}, {"id": "MCQ27", "type": "mcq", "q": "27. Student A: Let me congratulate you on your cake! Student B: ______", "options": ["That's my strong point!", "Making cakes is not my forte.", "Why do you say that?", "That's very kind of you!"], "answer": 3, "explanation": "Đáp lại lời chúc mừng/khen ngợi một cách lịch sự.", "vi": null, "ipas": null, "vis": ["đó là sở trường của tôi (hơi tự mãn, không tự nhiên)", "làm bánh không phải sở trường của tôi (mâu thuẫn — vừa được khen)", "sao bạn lại nói vậy? (không tự nhiên khi được khen)", "bạn thật tốt bụng (đúng — đáp lại lời khen lịch sự)"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. Please, write ________. I can't wait for you.", "options": ["more quickly", "quicker", "more quicker", "quick"], "answer": 0, "explanation": "\"quickly\" là trạng từ dài (thực ra là trạng từ có -ly), so sánh hơn dùng \"more quickly\" bổ nghĩa cho động từ \"write\".", "vi": null, "ipas": null, "vis": ["nhanh hơn (đúng — more + trạng từ)", "nhanh hơn (sai — thiếu \"more\" cho trạng từ)", "nhanh hơn (sai — thừa cả \"more\" và \"-er\")", "nhanh (sai — tính từ, không bổ nghĩa được cho động từ)"], "image": null}, {"id": "STR3", "type": "mcq", "q": "3. Which word has a different stress pattern from that of the others?", "options": ["tradition", "collection", "picturesque", "developer"], "answer": 2, "explanation": "\"picturesque\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/trəˈdɪʃn/", "/kəˈlekʃn/", "/ˌpɪktʃəˈresk/", "/dɪˈveləpər/"], "vis": ["truyền thống", "bộ sưu tập", "đẹp như tranh", "nhà phát triển"], "image": null}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["to help", "helping", "help", "to helping"], "answer": 0, "explanation": "Cấu trúc \"be willing to V\" = sẵn lòng làm gì.", "vi": null, "passage": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["spread", "ready", "seaside", "heavy"], "answer": 2, "explanation": "\"seaside\" có \"ea\" phát âm /iː/, ba từ còn lại phát âm /e/.", "vi": null, "ipas": ["/spred/", "/ˈredi/", "/ˈsiːsaɪd/", "/ˈhevi/"], "vis": ["lan rộng", "sẵn sàng", "bờ biển", "nặng"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. The man ______ the vegetables in the field and then drives home.", "options": ["makes", "loads", "catches", "uploads"], "answer": 1, "explanation": "\"load vegetables\" = chất/bốc rau củ lên xe — hợp nghĩa với việc lái xe về sau đó.", "vi": null, "ipas": null, "vis": ["làm (sai nghĩa)", "chất, bốc lên xe (đúng)", "bắt (sai nghĩa)", "tải lên mạng (sai nghĩa)"], "image": null}, {"id": "PIC2", "type": "mcq", "q": "2. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫📷</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO PHOTOGRAPHS</p></div>", "options": ["Should take photographs here.", "You can take photographs here.", "You don't have to take photographs here.", "You must not take photographs here."], "answer": 3, "explanation": "Biểu tượng máy ảnh gạch chéo → cấm chụp ảnh.", "vi": null}, {"id": "WF2", "type": "fill", "q": "2. She has a valuable ___________ of ancient coins that she has gathered over the past ten years. (COLLECT)", "answer": "collection", "explanation": "Sau \"a valuable\" cần DANH TỪ → collect + ion = collection.", "vi": "Cô ấy có một bộ sưu tập tiền xu cổ quý giá mà cô đã gom góp trong mười năm qua."}, {"id": "MCQ24", "type": "mcq", "q": "24. Student A: I've had a very enjoyable summer holiday with my family. Student B: ______", "options": ["I'm jealous of your holiday.", "I envy you.", "That's great, thanks.", "No, I don't envy you."], "answer": 1, "explanation": "Bày tỏ sự ghen tị/ngưỡng mộ một cách tự nhiên với kỳ nghỉ của người khác.", "vi": null, "ipas": null, "vis": ["tôi ghen tị với kỳ nghỉ của bạn (ít tự nhiên hơn)", "tôi ghen tị với bạn (đúng — tự nhiên nhất)", "thật tuyệt, cảm ơn (lạc đề — không phải lời cảm ơn)", "không, tôi không ghen tị (mâu thuẫn ngữ cảnh)"], "image": null}, {"id": "MCQ10", "type": "mcq", "q": "10. When my father was young, he enjoyed _____ early to do the gardening.", "options": ["get up", "getting up", "to get up", "to getting up"], "answer": 1, "explanation": "Cấu trúc: enjoy + V-ing → getting up.", "vi": null, "ipas": null, "vis": ["dậy sớm (nguyên mẫu, sai)", "dậy sớm (V-ing, đúng)", "dậy sớm (to-V, sai)", "dậy sớm (sai — không tồn tại dạng này)"], "image": null}, {"id": "WF8", "type": "fill", "q": "8. Because of his _______________ driving, he ended up causing a minor accident on the highway. (CARE)", "answer": "careless", "explanation": "Bổ nghĩa cho danh từ \"driving\" cần TÍNH TỪ mang nghĩa tiêu cực → careless (bất cẩn).", "vi": "Vì lái xe bất cẩn, anh ấy đã gây ra một vụ tai nạn nhỏ trên đường cao tốc."}, {"id": "MCQ28", "type": "mcq", "q": "28. After a long day of working, the farmers had to ________ the heavy bags of rice onto the back of the truck to transport them to the market.", "options": ["unload", "load", "stretch", "cultivate"], "answer": 1, "explanation": "\"load bags onto truck\" = chất các bao tải lên xe.", "vi": null, "ipas": null, "vis": ["dỡ hàng (sai — trái nghĩa)", "chất hàng lên (đúng)", "kéo dài (sai nghĩa)", "trồng trọt (sai nghĩa)"], "image": null}, {"id": "TR10", "type": "sentence", "q": "It takes my father two hours to repair his motorbike.", "starter": "My father spends", "answer": "two hours repairing his motorbike", "accepted": null, "explanation": "It takes + O + time + to V = S + spend + time + V-ing.", "vi": "Bố tôi mất hai tiếng để sửa xe máy.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"id": "MCQ5", "type": "mcq", "q": "5. If the weather gets ________ tomorrow, we won't go to the beach.", "options": ["worse", "nicer", "more bad", "better"], "answer": 0, "explanation": "Ngữ cảnh phủ định (won't go to the beach) hợp lý nhất với \"worse\" (tệ hơn) — so sánh hơn bất quy tắc của \"bad\".", "vi": null, "ipas": null, "vis": ["tệ hơn (đúng, hợp ngữ cảnh)", "đẹp hơn (sai ngữ cảnh)", "tệ hơn (sai — dạng so sánh sai của \"bad\")", "tốt hơn (sai ngữ cảnh)"], "image": null}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"health\"] B. After months of regular exercise and a balanced diet, she is now __________ and feels energetic every day.", "answer": "in excellent health", "explanation": "Dựa vào ví dụ: in excellent health.", "vi": "Sau nhiều tháng tập luyện đều đặn và ăn uống cân bằng, cô ấy hiện có sức khỏe tuyệt vời và cảm thấy tràn đầy năng lượng mỗi ngày."}, {"id": "TR11", "type": "sentence", "q": "It takes me 20 minutes to cook dinner every evening.", "starter": "I spend", "answer": "20 minutes cooking dinner every evening", "accepted": null, "explanation": "It takes + O + time + to V = S + spend + time + V-ing.", "vi": "Tôi mất 20 phút để nấu bữa tối mỗi tối.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"id": "STR10", "type": "mcq", "q": "10. Which word has a different stress pattern from that of the others?", "options": ["villager", "carefully", "collector", "farming"], "answer": 2, "explanation": "\"collector\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈvɪlɪdʒər/", "/ˈkeəfəli/", "/kəˈlektər/", "/ˈfɑːmɪŋ/"], "vis": ["dân làng", "một cách cẩn thận", "người sưu tầm", "nghề nông"], "image": null}, {"id": "TR7", "type": "sentence", "q": "Jane is a more beautiful dancer than Huy.", "starter": "Jane dances", "answer": "more beautifully than Huy", "accepted": null, "explanation": "\"beautiful\" là tính từ dài → trạng từ \"beautifully\" cũng dùng \"more\".", "vi": "Jane nhảy đẹp hơn Huy.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"id": "TFA6", "type": "mcq", "q": "6. According to the passage, what do British people usually associate the countryside with?", "options": ["Only national parks and wild coastlines.", "Farmland, open spaces, and green fields enclosed by hedges or stone walls.", "Modern buildings and busy roads.", "Large forests without any farms."], "answer": 1, "explanation": "Bài đọc: \"British people often associate the countryside with farmland, open spaces...\".", "vi": null, "passage": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."}, {"id": "MCQ21", "type": "mcq", "q": "21. From the hilltop, we can see row after row of orange trees ______ to the horizon.", "options": ["running", "expanding", "enlarging", "stretching"], "answer": 3, "explanation": "\"stretch to the horizon\" = trải dài tới tận chân trời.", "vi": null, "ipas": null, "vis": ["chạy (sai nghĩa)", "mở rộng (sai nghĩa)", "phóng to (sai nghĩa)", "trải dài (đúng)"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["kids", "crops", "banks", "harvests"], "answer": 0, "explanation": "\"kids\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/.", "vi": null, "ipas": ["/kɪdz/", "/krɒps/", "/bæŋks/", "/ˈhɑːvɪsts/"], "vis": ["trẻ em", "vụ mùa", "ngân hàng", "vụ thu hoạch"], "image": null}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["heading", "reading", "cleaning", "teaching"], "answer": 0, "explanation": "\"heading\" có \"ea\" phát âm /e/, ba từ còn lại phát âm /iː/.", "vi": null, "ipas": ["/ˈhedɪŋ/", "/ˈriːdɪŋ/", "/ˈkliːnɪŋ/", "/ˈtiːtʃɪŋ/"], "vis": ["tiêu đề", "đọc", "dọn dẹp", "dạy học"], "image": null}, {"id": "TFA4", "type": "mcq", "q": "4. Today, many people living in rural areas travel to work in towns every day.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Many of them commute to work in towns\" (commute = đi lại làm việc hàng ngày) → Đúng.", "vi": null, "passage": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["bustling", "priceless", "peaceful", "rare"], "answer": 2, "explanation": "\"peaceful atmosphere\" = bầu không khí yên bình.", "vi": null, "passage": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."}, {"id": "TR5", "type": "sentence", "q": "Nam is a more wonderful tennis player than his brother.", "starter": "Nam plays", "answer": "tennis more wonderfully than his brother", "accepted": null, "explanation": "\"wonderful\" là tính từ dài → trạng từ \"wonderfully\" cũng dùng \"more\" khi so sánh hơn.", "vi": "Nam chơi tennis giỏi hơn anh trai mình.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["lighthouse", "unload", "friendly", "harvest"], "answer": 1, "explanation": "\"unload\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈlaɪthaʊs/", "/ʌnˈləʊd/", "/ˈfrendli/", "/ˈhɑːvɪst/"], "vis": ["hải đăng", "dỡ hàng", "thân thiện", "vụ thu hoạch"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Which word has a different stress pattern from that of the others?", "options": ["traditional", "hospitable", "development", "speciality"], "answer": 3, "explanation": "\"speciality\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/trəˈdɪʃənl/", "/ˈhɒspɪtəbl/", "/dɪˈveləpmənt/", "/ˌspeʃiˈæləti/"], "vis": ["thuộc truyền thống", "mến khách", "sự phát triển", "đặc sản"], "image": null}, {"id": "TFA1", "type": "mcq", "q": "1. The British countryside is known only for its beautiful scenery without any contrasts.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"well known for its many contrasts\" → có nhiều tương phản, không phải chỉ đẹp → Sai.", "vi": null, "passage": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."}, {"id": "MCQ30", "type": "mcq", "q": "30. Every morning, Uncle Tom wakes up early to ________ the cows and collect fresh milk for his family.", "options": ["herd", "milk", "feed", "catch"], "answer": 1, "explanation": "\"milk the cows\" = vắt sữa bò — hợp nghĩa với \"collect fresh milk\" ngay sau đó.", "vi": null, "ipas": null, "vis": ["chăn giữ (sai — không khớp \"collect fresh milk\" ngay sau)", "vắt sữa (đúng)", "cho ăn (sai nghĩa hợp lý nhưng không khớp bằng)", "bắt (sai nghĩa)"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. The majority of Americans live outside cities or towns.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"About a quarter of Americans live outside...\" → chỉ khoảng 1/4, không phải đa số → Sai.", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"health\"] A. Eating too much fast food is __________ because it contains a lot of fat and sugar.", "answer": "bad for your health", "explanation": "Dựa vào ví dụ: bad for your health.", "vi": "Ăn quá nhiều thức ăn nhanh có hại cho sức khỏe vì chứa nhiều chất béo và đường."}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["speed", "step", "pace", "rate"], "answer": 2, "explanation": "\"pace of life\" = nhịp sống.", "vi": null, "passage": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."}, {"id": "PIC1", "type": "mcq", "q": "1. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫🖐️</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">DO NOT TOUCH</p></div>", "options": ["Be aware of pickpocketing.", "You are not allowed to touch this.", "You are allowed to take money here.", "Don't pick up trash."], "answer": 1, "explanation": "Biểu tượng bàn tay gạch chéo → không được phép chạm vào.", "vi": null}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["modern", "ancient", "crowded", "noisy"], "answer": 1, "explanation": "\"ancient villages\" = làng cổ Đường Lâm.", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["located", "built", "designed", "decorated"], "answer": 0, "explanation": "\"be located in\" = nằm ở/được đặt tại.", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "TFB4", "type": "mcq", "q": "4. Many Americans choose to live in the countryside because everything is convenient there.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"...because of its safe, clean, and attractive environment\" → vì môi trường an toàn sạch sẽ, không phải vì tiện nghi (bài còn nói xa trường học/bệnh viện) → Sai.", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}, {"id": "WF6", "type": "fill", "q": "6. Modern ____________ methods have helped to significantly increase crop yields in this region. (FARM)", "answer": "farming", "explanation": "Bổ nghĩa cho danh từ \"methods\" (danh từ ghép) → farming methods.", "vi": "Các phương pháp canh tác hiện đại đã giúp tăng đáng kể năng suất cây trồng ở vùng này."}, {"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["cultivate", "unload", "muscle", "cruel"], "answer": 3, "explanation": "\"cruel\" phát âm /uː/, ba từ còn lại phát âm /ʌ/.", "vi": null, "ipas": ["/ˈkʌltɪveɪt/", "/ʌnˈləʊd/", "/ˈmʌsl/", "/ˈkruːəl/"], "vis": ["trồng trọt", "dỡ hàng", "cơ bắp", "tàn nhẫn"], "image": null}, {"id": "WF7", "type": "fill", "q": "7. Many _______________ nations are facing economic challenges due to the global crisis. (DEVELOP)", "answer": "developing", "explanation": "Bổ nghĩa cho danh từ \"nations\" cần TÍNH TỪ → developing (đang phát triển).", "vi": "Nhiều quốc gia đang phát triển đang đối mặt với các thách thức kinh tế do khủng hoảng toàn cầu."}], [{"id": "TFB2", "type": "mcq", "q": "2. There are very large fields of corn or wheat in Ohio, Indiana, Illinois, and other Midwestern states.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"there are very large fields of corn or wheat...\" → Đúng.", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}, {"id": "TR12", "type": "sentence", "q": "It took her 3 hours to finish the English test.", "starter": "She spent", "answer": "3 hours finishing the English test", "accepted": null, "explanation": "Ở thì quá khứ: It took + O + time + to V = S + spent + time + V-ing.", "vi": "Cô ấy mất 3 tiếng để làm xong bài kiểm tra tiếng Anh.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["urban", "rural", "suburban", "metropolitan"], "answer": 1, "explanation": "\"rural peace and quiet\" = sự bình yên vùng nông thôn.", "vi": null, "passage": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."}, {"id": "TR8", "type": "sentence", "q": "Julie is a slower runner than I do.", "starter": "Julie runs", "answer": "more slowly than I do", "accepted": ["more slowly than I do", "more slowly than me"], "explanation": "\"slow\" là tính từ ngắn nhưng trạng từ \"slowly\" có đuôi -ly → dùng \"more slowly\".", "vi": "Julie chạy chậm hơn tôi.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["However", "Therefore", "Besides", "Although"], "answer": 2, "explanation": "\"Besides these\" = bên cạnh những điều này (thêm thông tin, không tương phản).", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "TFA3", "type": "mcq", "q": "3. Most farmland in Britain is owned by the government.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Most farmland is now owned by individual people or independent companies\" → cá nhân/công ty tư nhân sở hữu, không phải chính phủ → Sai.", "vi": null, "passage": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."}, {"id": "MCQ20", "type": "mcq", "q": "20. My uncle hired extra workers to help at harvest ______.", "options": ["time", "point", "period", "season"], "answer": 0, "explanation": "\"harvest time\" = mùa thu hoạch/thời điểm thu hoạch — collocation phổ biến.", "vi": null, "ipas": null, "vis": ["mùa, thời điểm (đúng)", "điểm (sai collocation)", "giai đoạn (sai collocation)", "mùa (sai collocation với harvest)"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["spread", "ready", "seaside", "heavy"], "answer": 2, "explanation": "\"seaside\" có \"ea\" phát âm /iː/, ba từ còn lại phát âm /e/.", "vi": null, "ipas": ["/spred/", "/ˈredi/", "/ˈsiːsaɪd/", "/ˈhevi/"], "vis": ["lan rộng", "sẵn sàng", "bờ biển", "nặng"], "image": null}, {"id": "MCQ25", "type": "mcq", "q": "25. Student A: Ooh, what a great tie! Where did you get it? Student B: ______", "options": ["Oh, thank you! I got it at a shop in Le Loi Street.", "Don't mention it. I bought it at a shop in Ha Noi.", "No, it doesn't look great at all.", "Yes, I like it very much."], "answer": 0, "explanation": "Cảm ơn lời khen rồi trả lời nguồn gốc món đồ theo đúng câu hỏi \"Where\".", "vi": null, "ipas": null, "vis": ["cảm ơn! tôi mua ở phố Lê Lợi (đúng — cảm ơn + trả lời where)", "không có gì, tôi mua ở Hà Nội (sai — \"don't mention it\" dùng khi đáp lại lời cảm ơn)", "không, nó không đẹp chút nào (mâu thuẫn với lời khen)", "vâng, tôi rất thích nó (không trả lời câu hỏi where)"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. The man ______ the vegetables in the field and then drives home.", "options": ["makes", "loads", "catches", "uploads"], "answer": 1, "explanation": "\"load vegetables\" = chất/bốc rau củ lên xe — hợp nghĩa với việc lái xe về sau đó.", "vi": null, "ipas": null, "vis": ["làm (sai nghĩa)", "chất, bốc lên xe (đúng)", "bắt (sai nghĩa)", "tải lên mạng (sai nghĩa)"], "image": null}, {"id": "TFA6", "type": "mcq", "q": "6. According to the passage, what do British people usually associate the countryside with?", "options": ["Only national parks and wild coastlines.", "Farmland, open spaces, and green fields enclosed by hedges or stone walls.", "Modern buildings and busy roads.", "Large forests without any farms."], "answer": 1, "explanation": "Bài đọc: \"British people often associate the countryside with farmland, open spaces...\".", "vi": null, "passage": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."}, {"id": "MCQ11", "type": "mcq", "q": "11. His uncle likes ______ some fish from nearby lakes and ponds after school.", "options": ["catching", "holding", "buying", "meeting"], "answer": 0, "explanation": "\"catch fish\" = câu/bắt cá — hợp nghĩa với \"lakes and ponds\".", "vi": null, "ipas": null, "vis": ["câu, bắt (đúng)", "cầm, giữ (sai nghĩa)", "mua (sai nghĩa)", "gặp (sai nghĩa)"], "image": null}, {"id": "PIC1", "type": "mcq", "q": "1. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫🖐️</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">DO NOT TOUCH</p></div>", "options": ["Be aware of pickpocketing.", "You are not allowed to touch this.", "You are allowed to take money here.", "Don't pick up trash."], "answer": 1, "explanation": "Biểu tượng bàn tay gạch chéo → không được phép chạm vào.", "vi": null}, {"id": "TR9", "type": "sentence", "q": "It takes us an hour to run in the morning.", "starter": "We spend", "answer": "an hour running in the morning", "accepted": null, "explanation": "It takes + O + time + to V = S + spend + time + V-ing.", "vi": "Chúng tôi mất một tiếng để chạy bộ vào buổi sáng.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"id": "MCQ2", "type": "mcq", "q": "2. I ________ a short cut through the park. It'll take much less time.", "options": ["take", "to take", "taking", "took"], "answer": 0, "explanation": "Câu gợi ý/mệnh lệnh nhẹ ở hiện tại đơn → take (nguyên mẫu, ngôi thứ nhất).", "vi": null, "ipas": null, "vis": ["đi tắt (đúng, gợi ý hành động)", "to-V (sai cấu trúc)", "V-ing (sai cấu trúc)", "đã đi (sai thì)"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. Tom helps his family to herd ______ at weekends.", "options": ["cattle", "poultry", "cats", "fruit"], "answer": 0, "explanation": "\"herd cattle\" = chăn thả gia súc — collocation đúng với \"herd\".", "vi": null, "ipas": null, "vis": ["gia súc (đúng)", "gia cầm (sai — không \"herd\" gia cầm)", "mèo (sai nghĩa)", "trái cây (sai nghĩa)"], "image": null}, {"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"important\"] A. Teachers play an ______________________ in shaping the future of students.", "answer": "important role", "explanation": "Dựa vào ví dụ: important role.", "vi": "Giáo viên đóng vai trò quan trọng trong việc định hình tương lai của học sinh."}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["located", "built", "designed", "decorated"], "answer": 0, "explanation": "\"be located in\" = nằm ở/được đặt tại.", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "WF5", "type": "fill", "q": "5. There are many professional _______________ training hard for the upcoming cycling race. (RIDE)", "answer": "riders", "explanation": "Sau \"professional\" cần DANH TỪ SỐ NHIỀU chỉ người → riders.", "vi": "Có nhiều tay đua chuyên nghiệp đang tập luyện chăm chỉ cho cuộc đua xe đạp sắp tới."}, {"id": "MCQ4", "type": "mcq", "q": "4. My father ________ for the car factory in 1995.", "options": ["worked", "was working", "has worked", "is working"], "answer": 0, "explanation": "Có mốc thời gian xác định trong quá khứ \"in 1995\" → thì quá khứ đơn: worked.", "vi": null, "ipas": null, "vis": ["đã làm việc (đúng — quá khứ đơn)", "đang làm việc (sai thì)", "đã làm việc (hiện tại hoàn thành, sai)", "đang làm việc (hiện tại tiếp diễn, sai)"], "image": null}, {"id": "WF2", "type": "fill", "q": "2. She has a valuable ___________ of ancient coins that she has gathered over the past ten years. (COLLECT)", "answer": "collection", "explanation": "Sau \"a valuable\" cần DANH TỪ → collect + ion = collection.", "vi": "Cô ấy có một bộ sưu tập tiền xu cổ quý giá mà cô đã gom góp trong mười năm qua."}, {"id": "TR1", "type": "sentence", "q": "Minh is a better swimmer than Hieu.", "starter": "Minh swims", "answer": "better than Hieu", "accepted": null, "explanation": "be + a + so sánh hơn (adj) + N + than B → V + so sánh hơn (adv) + than B. \"good→better\" là dạng bất quy tắc.", "vi": "Minh bơi giỏi hơn Hiếu.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"id": "PIC4", "type": "mcq", "q": "4. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔌🚗</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">ELECTRIC VEHICLES ONLY</p></div>", "options": ["All vehicles are not allowed to park here.", "Drivers must not go on this way.", "There is a shop selling electric vehicles ahead.", "Only electric cars can be parked at this place."], "answer": 3, "explanation": "Biểu tượng phích cắm điện + ô tô → chỉ xe điện được đỗ ở đây.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["bustling", "priceless", "peaceful", "rare"], "answer": 2, "explanation": "\"peaceful atmosphere\" = bầu không khí yên bình.", "vi": null, "passage": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."}, {"id": "WF9", "type": "fill", "q": "9. Her warmth and _______________ made everyone at the party feel extremely welcome. (FRIEND)", "answer": "friendliness", "explanation": "Song song với danh từ \"warmth\", cần DANH TỪ → friendliness (sự thân thiện).", "vi": "Sự ấm áp và thân thiện của cô ấy khiến mọi người ở bữa tiệc cảm thấy vô cùng được chào đón."}, {"id": "MCQ18", "type": "mcq", "q": "18. The workers are ______ a truck with timber.", "options": ["unloading", "loading", "taking", "filling"], "answer": 1, "explanation": "\"load A with B\" = chất/bốc cái gì lên xe.", "vi": null, "ipas": null, "vis": ["đang dỡ hàng (sai nghĩa)", "đang chất hàng (đúng)", "đang lấy (sai nghĩa)", "đang đổ đầy (sai collocation)"], "image": null}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["collector", "colorful", "farmer", "friendship"], "answer": 0, "explanation": "\"collector\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/kəˈlektər/", "/ˈkʌlərfl/", "/ˈfɑːmər/", "/ˈfrendʃɪp/"], "vis": ["người sưu tầm", "nhiều màu sắc", "nông dân", "tình bạn"], "image": null}, {"id": "TFA5", "type": "mcq", "q": "5. What is the main idea of the passage?", "options": ["The history of British farmland ownership.", "The contrasts, features, and lifestyle in the British countryside.", "The best outdoor activities for British people.", "The reasons why national parks are famous."], "answer": 1, "explanation": "Bài đọc tổng quát về sự tương phản, đặc điểm và lối sống ở nông thôn Anh.", "vi": null, "passage": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["looked", "cultivated", "herded", "unloaded"], "answer": 0, "explanation": "\"looked\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /ɪd/.", "vi": null, "ipas": ["/lʊkt/", "/ˈkʌltɪveɪtɪd/", "/ˈhɜːdɪd/", "/ʌnˈləʊdɪd/"], "vis": ["đã nhìn", "đã trồng trọt", "đã chăn giữ", "đã dỡ hàng"], "image": null}, {"id": "TR3", "type": "sentence", "q": "Mr Thanh is a quicker English speaker than I.", "starter": "Mr Thanh speaks", "answer": "English more quickly than I do", "accepted": ["English more quickly than I do", "English more quickly than me"], "explanation": "\"quick\" là tính từ ngắn nhưng trạng từ tương ứng \"quickly\" có đuôi -ly (được xem là trạng từ dài) → dùng \"more quickly\".", "vi": "Ông Thanh nói tiếng Anh nhanh hơn tôi.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["collective", "carefully", "carefully", "friendliness"], "answer": 0, "explanation": "\"collective\" trọng âm rơi vào âm tiết 2, ba từ/cụm còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/kəˈlektɪv/", "/ˈkeəfəli/", "/ˈkeəfəli/", "/ˈfrendlinəs/"], "vis": ["tập thể", "một cách cẩn thận", "một cách cẩn thận", "sự thân thiện"], "image": null}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"health\"] B. After months of regular exercise and a balanced diet, she is now __________ and feels energetic every day.", "answer": "in excellent health", "explanation": "Dựa vào ví dụ: in excellent health.", "vi": "Sau nhiều tháng tập luyện đều đặn và ăn uống cân bằng, cô ấy hiện có sức khỏe tuyệt vời và cảm thấy tràn đầy năng lượng mỗi ngày."}, {"id": "MCQ15", "type": "mcq", "q": "15. This is ________ city that I have ever been to.", "options": ["the busiest", "the busier", "the most busy", "the most busiest"], "answer": 0, "explanation": "So sánh nhất với tính từ ngắn \"busy\" → the busiest.", "vi": null, "ipas": null, "vis": ["nhộn nhịp nhất (đúng)", "nhộn nhịp hơn (so sánh hơn, sai)", "nhộn nhịp nhất (sai — thừa \"most\")", "sai ngữ pháp (thừa cả 2 cách)"], "image": null}, {"id": "TFB1", "type": "mcq", "q": "1. A large number of people live in the areas in the West, such as Montana and Colorado.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Few Americans live...\" → rất ít người, không phải \"a large number\" → Sai.", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["kids", "crops", "banks", "harvests"], "answer": 0, "explanation": "\"kids\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/.", "vi": null, "ipas": ["/kɪdz/", "/krɒps/", "/bæŋks/", "/ˈhɑːvɪsts/"], "vis": ["trẻ em", "vụ mùa", "ngân hàng", "vụ thu hoạch"], "image": null}, {"id": "MCQ7", "type": "mcq", "q": "7. Mr Triet ________ in London at the moment.", "options": ["studies", "is studying", "has studied", "will study"], "answer": 1, "explanation": "Dấu hiệu \"at the moment\" → thì hiện tại tiếp diễn: is studying.", "vi": null, "ipas": null, "vis": ["học (hiện tại đơn, sai thì)", "đang học (đúng)", "đã học (hiện tại hoàn thành, sai)", "sẽ học (tương lai, sai)"], "image": null}, {"id": "MCQ21", "type": "mcq", "q": "21. From the hilltop, we can see row after row of orange trees ______ to the horizon.", "options": ["running", "expanding", "enlarging", "stretching"], "answer": 3, "explanation": "\"stretch to the horizon\" = trải dài tới tận chân trời.", "vi": null, "ipas": null, "vis": ["chạy (sai nghĩa)", "mở rộng (sai nghĩa)", "phóng to (sai nghĩa)", "trải dài (đúng)"], "image": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["nature", "environment", "countryside", "scenery"], "answer": 0, "explanation": "\"enjoy nature\" = hòa mình vào thiên nhiên.", "vi": null, "passage": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."}, {"id": "TFB4", "type": "mcq", "q": "4. Many Americans choose to live in the countryside because everything is convenient there.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"...because of its safe, clean, and attractive environment\" → vì môi trường an toàn sạch sẽ, không phải vì tiện nghi (bài còn nói xa trường học/bệnh viện) → Sai.", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}, {"id": "WF10", "type": "fill", "q": "10. _______, the Mid-Autumn Festival is celebrated on the 15th day of the eighth lunar month. (TRADITION)", "answer": "Traditionally", "explanation": "Đứng đầu câu, bổ nghĩa cho cả câu → TRẠNG TỪ → Traditionally.", "vi": "Theo truyền thống, Tết Trung thu được tổ chức vào ngày 15 tháng 8 âm lịch."}, {"id": "PRON2", "type": "mcq", "q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["hoped", "played", "used", "cleaned"], "answer": 0, "explanation": "\"hoped\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /d/.", "vi": null, "ipas": ["/hoʊpt/", "/pleɪd/", "/juːzd/", "/kliːnd/"], "vis": ["đã hy vọng", "đã chơi", "đã dùng", "đã dọn dẹp"], "image": null}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["modern", "ancient", "crowded", "noisy"], "answer": 1, "explanation": "\"ancient villages\" = làng cổ Đường Lâm.", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["lighthouse", "unload", "friendly", "harvest"], "answer": 1, "explanation": "\"unload\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈlaɪthaʊs/", "/ʌnˈləʊd/", "/ˈfrendli/", "/ˈhɑːvɪst/"], "vis": ["hải đăng", "dỡ hàng", "thân thiện", "vụ thu hoạch"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "28. After a long day of working, the farmers had to ________ the heavy bags of rice onto the back of the truck to transport them to the market.", "options": ["unload", "load", "stretch", "cultivate"], "answer": 1, "explanation": "\"load bags onto truck\" = chất các bao tải lên xe.", "vi": null, "ipas": null, "vis": ["dỡ hàng (sai — trái nghĩa)", "chất hàng lên (đúng)", "kéo dài (sai nghĩa)", "trồng trọt (sai nghĩa)"], "image": null}, {"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["cattle", "ferry", "collect", "orchard"], "answer": 2, "explanation": "\"collect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkætl/", "/ˈferi/", "/kəˈlekt/", "/ˈɔːtʃəd/"], "vis": ["gia súc", "phà", "thu thập", "vườn cây ăn quả"], "image": null}], [{"id": "TR6", "type": "sentence", "q": "Mono dances more beautifully than Son Tung.", "starter": "Mono is a", "answer": "more beautiful dancer than Son Tung", "accepted": null, "explanation": "Chiều ngược lại: V + so sánh hơn (adv) + than B → be + a + so sánh hơn (adj) + N + than B.", "vi": "Mono nhảy đẹp hơn Sơn Tùng.", "note": "A + V + so sánh hơn (adv) + than B → A + be + a/an + so sánh hơn (adj) + N + than B"}, {"id": "PIC3", "type": "mcq", "q": "3. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🅿️⏰</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">NO PARKING 8:30-17:30</p></div>", "options": ["This is not a parking place.", "You can't park here from 8:30 a.m. to 5:30 p.m.", "You can park here only from 8:30 a.m. to 5:30 p.m.", "You have to pay a fee if you want to park here."], "answer": 1, "explanation": "Biển \"P\" kèm khung giờ → cấm đỗ trong khoảng giờ đó.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["safe", "safety", "safely", "safer"], "answer": 2, "explanation": "Trạng từ \"safely\" bổ nghĩa cho động từ \"live and move about\".", "vi": null, "passage": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life."}, {"id": "TR8", "type": "sentence", "q": "Julie is a slower runner than I do.", "starter": "Julie runs", "answer": "more slowly than I do", "accepted": ["more slowly than I do", "more slowly than me"], "explanation": "\"slow\" là tính từ ngắn nhưng trạng từ \"slowly\" có đuôi -ly → dùng \"more slowly\".", "vi": "Julie chạy chậm hơn tôi.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"id": "MCQ28", "type": "mcq", "q": "28. After a long day of working, the farmers had to ________ the heavy bags of rice onto the back of the truck to transport them to the market.", "options": ["unload", "load", "stretch", "cultivate"], "answer": 1, "explanation": "\"load bags onto truck\" = chất các bao tải lên xe.", "vi": null, "ipas": null, "vis": ["dỡ hàng (sai — trái nghĩa)", "chất hàng lên (đúng)", "kéo dài (sai nghĩa)", "trồng trọt (sai nghĩa)"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["lighthouse", "unload", "friendly", "harvest"], "answer": 1, "explanation": "\"unload\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈlaɪthaʊs/", "/ʌnˈləʊd/", "/ˈfrendli/", "/ˈhɑːvɪst/"], "vis": ["hải đăng", "dỡ hàng", "thân thiện", "vụ thu hoạch"], "image": null}, {"id": "MCQ26", "type": "mcq", "q": "26. Student A: Why do you like living in the countryside? Student B: ______", "options": ["Because there's a great sense of community there.", "Because I like the excitement of the city.", "Because life in the countryside is boring.", "Because I don't like the public transport here."], "answer": 0, "explanation": "Trả lời trực tiếp và hợp lý cho câu hỏi vì sao thích sống ở nông thôn.", "vi": null, "ipas": null, "vis": ["vì ở đó có tình làng nghĩa xóm gắn kết (đúng)", "vì tôi thích sự sôi động thành phố (mâu thuẫn với câu hỏi)", "vì cuộc sống nông thôn nhàm chán (mâu thuẫn — đây là lý do KHÔNG thích)", "vì tôi không thích giao thông công cộng (lạc đề)"], "image": null}, {"id": "MCQ8", "type": "mcq", "q": "8. Hoa danced ________ than me.", "options": ["beautiful", "more beautiful", "beautifuler", "more beautifully"], "answer": 3, "explanation": "Bổ nghĩa cho động từ \"danced\" cần TRẠNG TỪ so sánh hơn (trạng từ dài) → more beautifully.", "vi": null, "ipas": null, "vis": ["đẹp (tính từ, sai)", "đẹp hơn (tính từ so sánh, sai vì cần trạng từ)", "đẹp hơn (sai — không tồn tại dạng này)", "đẹp hơn (đúng — trạng từ so sánh hơn)"], "image": null}, {"id": "TR13", "type": "sentence", "q": "It took us a lot of effort to finish this project on time.", "starter": "We spent", "answer": "a lot of effort finishing this project on time", "accepted": null, "explanation": "Ở thì quá khứ: It took + O + time/effort + to V = S + spent + time/effort + V-ing.", "vi": "Chúng tôi đã tốn rất nhiều công sức để hoàn thành dự án đúng hạn.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"id": "TFB5", "type": "mcq", "q": "5. What is the passage mainly about?", "options": ["The most beautiful states in the USA.", "The agricultural products of the Midwest.", "Where Americans live and why they choose to live there.", "The reasons why children leave the countryside."], "answer": 2, "explanation": "Bài đọc nói chung về nơi người Mỹ sinh sống và lý do họ chọn nơi đó.", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["make", "to make", "making", "made"], "answer": 0, "explanation": "Cấu trúc: observe sb do sth — quan sát ai đó làm gì từ đầu đến cuối.", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "TR10", "type": "sentence", "q": "It takes my father two hours to repair his motorbike.", "starter": "My father spends", "answer": "two hours repairing his motorbike", "accepted": null, "explanation": "It takes + O + time + to V = S + spend + time + V-ing.", "vi": "Bố tôi mất hai tiếng để sửa xe máy.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"id": "TFA1", "type": "mcq", "q": "1. The British countryside is known only for its beautiful scenery without any contrasts.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"well known for its many contrasts\" → có nhiều tương phản, không phải chỉ đẹp → Sai.", "vi": null, "passage": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle."}, {"id": "MCQ2", "type": "mcq", "q": "2. I ________ a short cut through the park. It'll take much less time.", "options": ["take", "to take", "taking", "took"], "answer": 0, "explanation": "Câu gợi ý/mệnh lệnh nhẹ ở hiện tại đơn → take (nguyên mẫu, ngôi thứ nhất).", "vi": null, "ipas": null, "vis": ["đi tắt (đúng, gợi ý hành động)", "to-V (sai cấu trúc)", "V-ing (sai cấu trúc)", "đã đi (sai thì)"], "image": null}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["modern", "ancient", "crowded", "noisy"], "answer": 1, "explanation": "\"ancient villages\" = làng cổ Đường Lâm.", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "MCQ12", "type": "mcq", "q": "12. Tom helps his family to herd ______ at weekends.", "options": ["cattle", "poultry", "cats", "fruit"], "answer": 0, "explanation": "\"herd cattle\" = chăn thả gia súc — collocation đúng với \"herd\".", "vi": null, "ipas": null, "vis": ["gia súc (đúng)", "gia cầm (sai — không \"herd\" gia cầm)", "mèo (sai nghĩa)", "trái cây (sai nghĩa)"], "image": null}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["collective", "carefully", "carefully", "friendliness"], "answer": 0, "explanation": "\"collective\" trọng âm rơi vào âm tiết 2, ba từ/cụm còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/kəˈlektɪv/", "/ˈkeəfəli/", "/ˈkeəfəli/", "/ˈfrendlinəs/"], "vis": ["tập thể", "một cách cẩn thận", "một cách cẩn thận", "sự thân thiện"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. She felt tired. __________, she had to finish her homework.", "options": ["However", "Therefore", "So", "Although"], "answer": 0, "explanation": "Ý tương phản (mệt nhưng vẫn phải làm bài) → However.", "vi": null, "ipas": null, "vis": ["tuy nhiên (đúng)", "vì vậy (sai — không phải quan hệ nguyên nhân)", "vì vậy (sai — không viết hoa như vậy đầu câu)", "mặc dù (sai — cần nối 2 mệnh đề trong 1 câu)"], "image": null}, {"id": "MCQ20", "type": "mcq", "q": "20. My uncle hired extra workers to help at harvest ______.", "options": ["time", "point", "period", "season"], "answer": 0, "explanation": "\"harvest time\" = mùa thu hoạch/thời điểm thu hoạch — collocation phổ biến.", "vi": null, "ipas": null, "vis": ["mùa, thời điểm (đúng)", "điểm (sai collocation)", "giai đoạn (sai collocation)", "mùa (sai collocation với harvest)"], "image": null}, {"id": "TFB2", "type": "mcq", "q": "2. There are very large fields of corn or wheat in Ohio, Indiana, Illinois, and other Midwestern states.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"there are very large fields of corn or wheat...\" → Đúng.", "vi": null, "passage": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up."}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["However", "Therefore", "Besides", "Although"], "answer": 2, "explanation": "\"Besides these\" = bên cạnh những điều này (thêm thông tin, không tương phản).", "vi": null, "passage": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry."}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["heading", "reading", "cleaning", "teaching"], "answer": 0, "explanation": "\"heading\" có \"ea\" phát âm /e/, ba từ còn lại phát âm /iː/.", "vi": null, "ipas": ["/ˈhedɪŋ/", "/ˈriːdɪŋ/", "/ˈkliːnɪŋ/", "/ˈtiːtʃɪŋ/"], "vis": ["tiêu đề", "đọc", "dọn dẹp", "dạy học"], "image": null}, {"id": "STR2", "type": "mcq", "q": "2. Which word has a different stress pattern from that of the others?", "options": ["cultivate", "develop", "villager", "farmhouse"], "answer": 1, "explanation": "\"develop\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkʌltɪveɪt/", "/dɪˈveləp/", "/ˈvɪlɪdʒər/", "/ˈfɑːmhaʊs/"], "vis": ["trồng trọt", "phát triển", "dân làng", "nhà nông trại"], "image": null}, {"id": "TR12", "type": "sentence", "q": "It took her 3 hours to finish the English test.", "starter": "She spent", "answer": "3 hours finishing the English test", "accepted": null, "explanation": "Ở thì quá khứ: It took + O + time + to V = S + spent + time + V-ing.", "vi": "Cô ấy mất 3 tiếng để làm xong bài kiểm tra tiếng Anh.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"id": "PIC2", "type": "mcq", "q": "2. What does the sign mean?", "image": "<div clas
