10", "type": "fill", "q": "10. My dad was _______________ when I could repair my own bike. (surprise)", "answer": "surprised", "explanation": "Sau \"was\" chủ ngữ là người → dùng tính từ đuôi -ed (chỉ cảm xúc của người) → surprised.", "vi": "Bố tôi đã rất ngạc nhiên khi tôi có thể tự sửa xe đạp của mình."}, {"id": "MCQ1", "type": "mcq", "q": "1. About 16% of them love ________ swimming.", "options": ["to go", "go", "going", "went"], "answer": 2, "explanation": "\"love\" có thể theo sau bởi V-ing hoặc to-V; đáp án chính thức là going.", "vi": "Khoảng 16% trong số họ rất thích bơi lội.", "ipas": null, "vis": ["đi (to-V, ít dùng sau love)", "đi (nguyên mẫu, thiếu to/-ing)", "đi (V-ing, đúng: love + V-ing)", "đã đi (quá khứ, sai thì)"], "image": null}, {"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["leisure", "puzzle", "enjoy", "message"], "answer": 2, "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈliːʒər/", "/ˈpʌzl/", "/ɪnˈdʒɔɪ/", "/ˈmesɪdʒ/"], "vis": ["thời gian rảnh", "trò chơi xếp hình", "thích thú", "tin nhắn"], "image": null}, {"id": "MCQ18", "type": "mcq", "q": "18. Visiting _______ increases my knowledge about cultures in the past.", "options": ["museums", "cinemas", "hometown", "city"], "answer": 0, "explanation": "Thăm bảo tàng giúp tăng hiểu biết về văn hóa trong quá khứ.", "vi": "Việc thăm các bảo tàng giúp tôi tăng thêm hiểu biết về các nền văn hóa trong quá khứ.", "ipas": null, "vis": ["bảo tàng (đúng)", "rạp chiếu phim", "quê hương", "thành phố"], "image": null}, {"id": "MCQ16", "type": "mcq", "q": "16. It was cold and wet, ______ Bob still went to the beach.", "options": ["therefore", "so", "but", "because"], "answer": 2, "explanation": "Ý tương phản (trời lạnh ướt nhưng Bob vẫn đi biển) → but.", "vi": "Trời lạnh và ẩm ướt, nhưng Bob vẫn đi biển.", "ipas": null, "vis": ["vì vậy", "vì vậy", "nhưng (đúng — ý tương phản)", "bởi vì"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["home-made", "snowboarding", "puzzle", "balance"], "answer": 0, "explanation": "\"home-made\" trọng âm rơi vào âm tiết thứ 2 (\"made\"), ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌhoʊmˈmeɪd/", "/ˈsnoʊbɔːrdɪŋ/", "/ˈpʌzl/", "/ˈbæləns/"], "vis": ["tự làm tại nhà", "trượt ván tuyết", "trò chơi xếp hình", "sự cân bằng"], "image": null}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["award", "gift", "prize", "medal"], "answer": 2, "explanation": "\"win the first prize\" = giành giải nhất (trong cuộc thi trang phục).", "vi": null, "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"id": "MCQ20", "type": "mcq", "q": "20. Last school year, my students were very keen on _______. They decorated and repaired the classroom by themselves.", "options": ["cooking", "doing origami", "doing DIY", "playing sports"], "answer": 2, "explanation": "Tự trang trí, sửa chữa lớp học → doing DIY.", "vi": "Năm học trước, học sinh của tôi rất say mê làm đồ tự chế (DIY). Các em đã tự trang trí và sửa chữa lớp học.", "ipas": null, "vis": ["nấu ăn", "gấp giấy nghệ thuật", "làm đồ tự chế (đúng — tự trang trí, sửa lớp học)", "chơi thể thao"], "image": null}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"entertainment\"] B. Radio, television and the Internet are popular __________ for people of all ages.", "answer": "forms of entertainment", "explanation": "Dựa vào ví dụ: forms of entertainment.", "vi": "Radio, truyền hình và Internet là những hình thức giải trí phổ biến với mọi lứa tuổi."}], [{"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["to", "with", "from", "on"], "answer": 1, "explanation": "\"connect with sb\" = kết nối, gắn kết với ai.", "vi": null, "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"id": "WF8", "type": "fill", "q": "8. Messaging has won ______________ among students nowadays. (popular)", "answer": "popularity", "explanation": "Sau động từ \"won\" cần DANH TỪ → popular + ity = popularity.", "vi": "Nhắn tin đã trở nên phổ biến trong giới học sinh ngày nay."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"entertainment\"] B. Radio, television and the Internet are popular __________ for people of all ages.", "answer": "forms of entertainment", "explanation": "Dựa vào ví dụ: forms of entertainment.", "vi": "Radio, truyền hình và Internet là những hình thức giải trí phổ biến với mọi lứa tuổi."}, {"id": "TR4", "type": "sentence", "q": "He likes swimming and sunbathing.", "starter": "He is interested", "answer": "in swimming and sunbathing", "accepted": null, "explanation": "like + V-ing = be interested in + V-ing.", "vi": "Anh ấy thích bơi lội và tắm nắng.", "note": "S + like + V-ing → S + be interested in + V-ing"}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["indoor", "inside", "within", "among"], "answer": 1, "explanation": "\"inside your home\" = bên trong nhà bạn (giới từ + your home).", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["spending", "to spend", "spend", "spends"], "answer": 0, "explanation": "\"enjoy + V-ing\" = thích thú làm gì.", "vi": null, "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["decrease", "reduce", "increase", "raise"], "answer": 2, "explanation": "\"increase your strength\" = tăng cường sức mạnh của bạn.", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "TR10", "type": "sentence", "q": "I don't like to get up early and prepare breakfast in the cold winter days.", "starter": "I hate", "answer": "getting up early and preparing breakfast on cold winter days", "accepted": ["getting up early and preparing breakfast on cold winter days", "getting up early and preparing breakfast in the cold winter days"], "explanation": "don't like + to-V = hate + V-ing (đồng nghĩa).", "vi": "Tôi không thích dậy sớm và chuẩn bị bữa sáng vào những ngày mùa đông lạnh giá.", "note": "S + don't like + to V → S + hate + V-ing"}, {"id": "MCQ26", "type": "mcq", "q": "26. My grandparents love ______ very much. There are a lot of beautiful flowers and fresh vegetables in their garden.", "options": ["doing garden", "doing gardening", "do gardening", "to do garden"], "answer": 1, "explanation": "\"do gardening\" ở dạng V-ing sau \"love\": doing gardening.", "vi": "Ông bà tôi rất thích làm vườn. Trong vườn của ông bà có rất nhiều hoa đẹp và rau tươi.", "ipas": null, "vis": ["làm vườn (sai — thiếu -ing ở 'garden')", "làm vườn (V-ing, đúng)", "làm vườn (nguyên mẫu, sai)", "làm vườn (to + V nguyên mẫu, sai cấu trúc)"], "image": null}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"entertainment\"] A. There will be __________ at the hotel party tonight, including singers and dancers.", "answer": "live entertainment", "explanation": "Dựa vào ví dụ: live entertainment.", "vi": "Sẽ có buổi biểu diễn trực tiếp tại bữa tiệc khách sạn tối nay, gồm ca sĩ và vũ công."}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["pudding", "push", "cushion", "include"], "answer": 3, "explanation": "\"include\" có \"u\" phát âm /uː/, ba từ còn lại phát âm /ʊ/.", "vi": null, "ipas": ["/ˈpʊdɪŋ/", "/pʊʃ/", "/ˈkʊʃn/", "/ɪnˈkluːd/"], "vis": ["bánh pudding", "đẩy", "đệm, gối tựa", "bao gồm"], "image": null}, {"id": "MCQ27", "type": "mcq", "q": "27. You should avoid ______ too much TV. It's not good for your eyes.", "options": ["seeing", "looking", "watching", "glancing"], "answer": 2, "explanation": "\"avoid + V-ing\"; \"watch TV\" là collocation đúng.", "vi": "Bạn nên tránh xem TV quá nhiều. Điều đó không tốt cho mắt của bạn.", "ipas": null, "vis": ["nhìn thấy (sai — không đi với TV theo cách này)", "nhìn (sai — không phải collocation đúng)", "xem (đúng: watch TV)", "liếc nhìn (sai nghĩa)"], "image": null}, {"id": "WF6", "type": "fill", "q": "6. Little John is keen on acting at school shows, and he wants to be a __________ in the future. (comedy)", "answer": "comedian", "explanation": "Sau mạo từ \"a\" cần DANH TỪ CHỈ NGƯỜI → comedy + ian = comedian.", "vi": "Cậu bé John rất say mê diễn kịch ở trường và muốn trở thành diễn viên hài trong tương lai."}, {"id": "TFA6", "type": "mcq", "q": "6. Other teenagers like outdoor activities such as _________ with friends.", "options": ["sports", "cycling", "hanging out", "A, B and C are correct"], "answer": 3, "explanation": "Bài đọc liệt kê cả ba: sports, cycling, hanging out with friends.", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "MCQ28", "type": "mcq", "q": "28. Most people now enjoy shorter working hours and more _______.", "options": ["message friends", "paper folding", "leisure time", "muscle strength"], "answer": 2, "explanation": "\"leisure time\" = thời gian rảnh rỗi, hợp nghĩa với giờ làm việc ngắn hơn.", "vi": "Hầu hết mọi người hiện nay có giờ làm việc ngắn hơn và nhiều thời gian rảnh hơn.", "ipas": null, "vis": ["nhắn tin bạn bè", "gấp giấy", "thời gian rảnh rỗi (đúng)", "sức mạnh cơ bắp"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. Nam's mother showed him how to knit.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"My mother also taught me how to knit\" → Đúng.", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["pictures", "watches", "buses", "brushes"], "answer": 0, "explanation": "\"pictures\" có đuôi \"-s\" phát âm /z/, ba từ còn lại có đuôi \"-es\" phát âm /ɪz/.", "vi": null, "ipas": ["/ˈpɪktʃərz/", "/ˈwɒtʃɪz/", "/ˈbʌsɪz/", "/ˈbrʌʃɪz/"], "vis": ["những bức tranh", "đồng hồ (số nhiều)", "xe buýt (số nhiều)", "bàn chải (số nhiều)"], "image": null}, {"id": "TFA4", "type": "mcq", "q": "4. Leisure activities only help teenagers relax but do not help them develop skills.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"These activities help them relax and develop new skills\" → Sai.", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "WF7", "type": "fill", "q": "7. ________improves my overall health and balance, so I practice the sport every weekend. (Snowboard)", "answer": "Snowboarding", "explanation": "Đứng đầu câu, làm chủ ngữ, cần DANH TỪ → Snowboard + ing = Snowboarding.", "vi": "Trượt ván tuyết giúp cải thiện sức khỏe tổng thể và sự cân bằng của tôi."}, {"id": "MCQ5", "type": "mcq", "q": "5. Nam usually _________ football with his friends after school.", "options": ["plays", "playing", "play", "to play"], "answer": 0, "explanation": "Chủ ngữ số ít \"Nam\", thì hiện tại đơn → plays.", "vi": "Nam thường chơi bóng đá với bạn bè sau giờ học.", "ipas": null, "vis": ["chơi (chia đúng ngôi thứ 3 số ít 'plays')", "chơi (V-ing, sai vì cần động từ chính)", "chơi (nguyên mẫu, thiếu -s)", "chơi (to-V, sai cấu trúc)"], "image": null}, {"id": "TR6", "type": "sentence", "q": "Ngoc dislikes doing any sports or exercises, so her health is not good enough to study.", "starter": "Ngoc doesn't like", "answer": "doing any sports or exercises, so her health is not good enough to study", "accepted": null, "explanation": "dislike + V-ing = don't/doesn't like + V-ing (đồng nghĩa).", "vi": "Ngọc không thích chơi thể thao hay tập thể dục, vì vậy sức khỏe của bạn ấy không đủ tốt để học.", "note": "S + dislike(s) + V-ing → S + don't/doesn't like + V-ing"}, {"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["school", "school", "door", "pool"], "answer": 2, "explanation": "\"door\" phát âm /ɔː/, các từ còn lại có \"oo\" phát âm /uː/.", "vi": null, "ipas": ["/skuːl/", "/skuːl/", "/dɔːr/", "/puːl/"], "vis": ["trường học", "trường học", "cửa", "hồ bơi"], "image": null}, {"id": "TFB6", "type": "mcq", "q": "6. Doing DIYs and baking makes Nam feel ____________.", "options": ["enjoyable", "pleased", "tired", "happy"], "answer": 0, "explanation": "Theo đáp án chính thức của đề cương: enjoyable (thú vị, đáng tận hưởng).", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "TR13", "type": "sentence", "q": "They spent two months building this bridge.", "starter": "It took them", "answer": "two months to build this bridge", "accepted": null, "explanation": "Ở thì quá khứ: S + spent + time + V-ing = It took + O + time + to V.", "vi": "Họ đã mất hai tháng để xây cây cầu này.", "note": "S + spent + time + V-ing → It took + O + time + to V"}, {"id": "MCQ15", "type": "mcq", "q": "15. It rained hard. ______, my father went to work.", "options": ["Therefore", "However", "Because", "A and B are correct"], "answer": 1, "explanation": "Ý tương phản (trời mưa to nhưng bố vẫn đi làm) → However.", "vi": "Trời mưa to. Tuy nhiên, bố tôi vẫn đi làm.", "ipas": null, "vis": ["Vì vậy", "Tuy nhiên (đúng — ý tương phản)", "Bởi vì", "Cả A và B đều đúng"], "image": null}, {"id": "WF2", "type": "fill", "q": "2. To play video games, these computers must be used over a Wi-Fi internet ____________. (connect)", "answer": "connection", "explanation": "Sau tính từ sở hữu \"internet\" cần DANH TỪ → connect + ion = connection.", "vi": "Để chơi trò chơi điện tử, những chiếc máy tính này phải được kết nối qua Wi-Fi."}, {"id": "MCQ10", "type": "mcq", "q": "10. _______ is a design that you use to make something.", "options": ["Pattern", "Pastime", "Needles", "A and B are correct"], "answer": 0, "explanation": "\"pattern\" = mẫu, khuôn thiết kế dùng để tạo ra vật gì đó.", "vi": "Mẫu (pattern) là một thiết kế mà bạn dùng để làm ra thứ gì đó.", "ipas": null, "vis": ["Mẫu, khuôn thiết kế (đúng)", "Thú vui, việc làm lúc rảnh", "Kim đan len", "Cả A và B đều đúng"], "image": null}, {"id": "MCQ30", "type": "mcq", "q": "30. A: Would you like to go to the cinema with me?", "options": ["Yes, I watch films every day.", "Yes, I don't like it.", "I'd love to.", "We can go there together."], "answe climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "TR12", "type": "sentence", "q": "My sister spends 30 minutes walking to school every day.", "starter": "It takes my sister", "answer": "30 minutes to walk to school every day", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Chị tôi mất 30 phút để đi bộ đến trường mỗi ngày.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["connect", "connecting", "connected", "connection"], "answer": 0, "explanation": "\"a great way to connect with them\" = to + V nguyên thể.", "vi": null, "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"id": "MCQ21", "type": "mcq", "q": "21. ________ is an increasingly popular method of communicating over the internet. People often send short messages using a mobile phone or computer.", "options": ["Messaging", "Volunteering", "Snowboarding", "Knitting"], "answer": 0, "explanation": "Gửi tin nhắn ngắn qua điện thoại/máy tính → Messaging.", "vi": "Nhắn tin là một phương thức giao tiếp qua internet ngày càng phổ biến.", "ipas": null, "vis": ["Nhắn tin (đúng)", "Làm tình nguyện", "Trượt ván tuyết", "Đan len"], "image": null}, {"id": "TR11", "type": "sentence", "q": "Lan spends 3 hours a day doing her homework.", "starter": "It takes Lan", "answer": "3 hours a day to do her homework", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Lan mất 3 tiếng mỗi ngày để làm bài tập về nhà.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"id": "MCQ24", "type": "mcq", "q": "24. Ms. Janny loves _______very much. There are a lot of beautiful flowers and fresh vegetables in her garden.", "options": ["doing gardening", "to doing garden", "to do garden", "do gardening"], "answer": 0, "explanation": "\"do gardening\" ở dạng V-ing sau \"loves\": doing gardening.", "vi": "Cô Janny rất thích làm vườn. Trong vườn của cô có rất nhiều hoa đẹp và rau tươi.", "ipas": null, "vis": ["làm vườn (V-ing, đúng)", "làm vườn (sai — 'to doing' không tồn tại)", "làm vườn (to + V nguyên mẫu, sai sau loves)", "làm vườn (nguyên mẫu, thiếu -ing)"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["worked", "watched", "needed", "walked"], "answer": 2, "explanation": "\"needed\" có đuôi \"-ed\" phát âm /ɪd/ (vì \"need\" tận cùng bằng /d/), ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/wɜːrkt/", "/wɒtʃt/", "/ˈniːdɪd/", "/wɔːkt/"], "vis": ["đã làm việc", "đã xem", "đã cần", "đã đi bộ"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. A lot of young families in Viet Nam prefer _______ time doing outdoor activities together.", "options": ["spending", "spend", "spent", "to spend"], "answer": 0, "explanation": "Cấu trúc \"prefer + V-ing\"; đây cũng là cấu trúc \"spend time V-ing\".", "vi": "Nhiều gia đình trẻ ở Việt Nam thích dành thời gian cùng nhau làm các hoạt động ngoài trời.", "ipas": null, "vis": ["spending (V-ing, đúng: prefer + V-ing)", "spend (nguyên mẫu, thiếu to/-ing)", "spent (quá khứ, sai)", "to spend (to-V, không phải đáp án chính)"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. Origami is the art of paper _________.", "options": ["fold", "folding", "to fold", "folds"], "answer": 1, "explanation": "\"paper folding\" = nghệ thuật gấp giấy (danh từ ghép).", "vi": "Origami là nghệ thuật gấp giấy.", "ipas": null, "vis": ["gấp (nguyên mẫu, sai — cần danh từ ghép)", "gấp (danh động từ, đúng: paper folding = gấp giấy)", "gấp (to-V, sai)", "gấp (chia số ít, sai)"], "image": null}, {"id": "STR10", "type": "mcq", "q": "10. Which word has a different stress pattern from that of the others?", "options": ["detest", "message friends", "folding", "fancy"], "answer": 0, "explanation": "\"detest\" trọng âm rơi vào âm tiết 2, ba từ/cụm còn lại trọng âm chính rơi vào âm tiết 1.", "vi": null, "ipas": ["/dɪˈtest/", "/ˈmesɪdʒ frendz/", "/ˈfoʊldɪŋ/", "/ˈfænsi/"], "vis": ["ghét cay ghét đắng", "nhắn tin cho bạn bè", "gấp", "thích, muốn"], "image": null}, {"id": "STR3", "type": "mcq", "q": "3. Which word has a different stress pattern from that of the others?", "options": ["balance", "muscle", "improve", "fancy"], "answer": 2, "explanation": "\"improve\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbæləns/", "/ˈmʌsl/", "/ɪmˈpruːv/", "/ˈfænsi/"], "vis": ["sự cân bằng", "cơ bắp", "cải thiện", "thích, muốn"], "image": null}, {"id": "MCQ17", "type": "mcq", "q": "17. _______ is something that you enjoy doing when you are not working", "options": ["Pastime", "Pattern", "Magical", "Stitches"], "answer": 0, "explanation": "\"pastime\" = thú vui, việc bạn thích làm khi không phải làm việc.", "vi": "Thú vui (pastime) là điều bạn thích làm khi không phải làm việc.", "ipas": null, "vis": ["Thú vui (đúng)", "Mẫu, khuôn thiết kế", "Kỳ diệu", "Các mũi đan"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["home-made", "snowboarding", "puzzle", "balance"], "answer": 0, "explanation": "\"home-made\" trọng âm rơi vào âm tiết thứ 2 (\"made\"), ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌhoʊmˈmeɪd/", "/ˈsnoʊbɔːrdɪŋ/", "/ˈpʌzl/", "/ˈbæləns/"], "vis": ["tự làm tại nhà", "trượt ván tuyết", "trò chơi xếp hình", "sự cân bằng"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Which word has a different stress pattern from that of the others?", "options": ["resort", "puzzle", "adore", "prefer"], "answer": 1, "explanation": "\"puzzle\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/rɪˈzɔːrt/", "/ˈpʌzl/", "/əˈdɔːr/", "/prɪˈfɜːr/"], "vis": ["khu nghỉ dưỡng", "trò chơi xếp hình", "rất thích, mê", "thích hơn"], "image": null}, {"id": "TFA1", "type": "mcq", "q": "1. Teenagers nowadays only prefer indoor activities in their free time.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nêu cả hoạt động trong nhà lẫn ngoài trời, không chỉ trong nhà → Sai.", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}], [{"id": "TFA3", "type": "mcq", "q": "3. Joining clubs and doing craft kits are unpopular choices for teenagers.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"joining clubs or doing craft kits are also popular choices\" → Sai.", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "WF9", "type": "fill", "q": "9. Having leisure activities is one of the best ways to make you feel _________. (comfort)", "answer": "comfortable", "explanation": "Sau \"feel\" cần TÍNH TỪ → comfort + able = comfortable.", "vi": "Có các hoạt động giải trí là một trong những cách tốt nhất để khiến bạn cảm thấy thoải mái."}, {"id": "MCQ4", "type": "mcq", "q": "4. My sister hates ______ up early to do exercise.", "options": ["getting", "get", "gets", "to get"], "answer": 0, "explanation": "\"hate\" theo sau bởi V-ing hoặc to-V; đáp án chính thức là getting.", "vi": "Chị tôi ghét việc dậy sớm để tập thể dục.", "ipas": null, "vis": ["getting (V-ing, đúng: hate + V-ing)", "get (nguyên mẫu, thiếu to/-ing)", "gets (chia sai)", "to get (to-V, không phải đáp án chính)"], "image": null}, {"id": "WF2", "type": "fill", "q": "2. To play video games, these computers must be used over a Wi-Fi internet ____________. (connect)", "answer": "connection", "explanation": "Sau tính từ sở hữu \"internet\" cần DANH TỪ → connect + ion = connection.", "vi": "Để chơi trò chơi điện tử, những chiếc máy tính này phải được kết nối qua Wi-Fi."}, {"id": "TR2", "type": "sentence", "q": "Watching historical films is very interesting to my younger brother.", "starter": "My younger brother enjoys", "answer": "watching historical films", "accepted": null, "explanation": "V-ing... is interesting to sb = sb + enjoys + V-ing.", "vi": "Xem phim lịch sử rất thú vị đối với em trai tôi.", "note": "V-ing + be interesting to sb → sb + enjoys + V-ing"}, {"id": "PIC2", "type": "mcq", "q": "2. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫🧒💺</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">FRONT SEATS: NOT FOR CHILDREN</p></div>", "options": ["The front seats are only for children.", "Children are not allowed to sit here.", "Adults have to sit at the front.", "There is no more seat for adults."], "answer": 1, "explanation": "Biểu tượng cấm trẻ em ngồi ghế trước → trẻ em không được phép ngồi ở đây.", "vi": null}, {"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["leisure", "puzzle", "enjoy", "message"], "answer": 2, "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈliːʒər/", "/ˈpʌzl/", "/ɪnˈdʒɔɪ/", "/ˈmesɪdʒ/"], "vis": ["thời gian rảnh", "trò chơi xếp hình", "thích thú", "tin nhắn"], "image": null}, {"id": "MCQ18", "type": "mcq", "q": "18. Visiting _______ increases my knowledge about cultures in the past.", "options": ["museums", "cinemas", "hometown", "city"], "answer": 0, "explanation": "Thăm bảo tàng giúp tăng hiểu biết về văn hóa trong quá khứ.", "vi": "Việc thăm các bảo tàng giúp tôi tăng thêm hiểu biết về các nền văn hóa trong quá khứ.", "ipas": null, "vis": ["bảo tàng (đúng)", "rạp chiếu phim", "quê hương", "thành phố"], "image": null}, {"id": "TFB2", "type": "mcq", "q": "2. Making a paper house is very expensive.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"It doesn't cost much\" → Sai.", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "TFA6", "type": "mcq", "q": "6. Other teenagers like outdoor activities such as _________ with friends.", "options": ["sports", "cycling", "hanging out", "A, B and C are correct"], "answer": 3, "explanation": "Bài đọc liệt kê cả ba: sports, cycling, hanging out with friends.", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["keep", "stay", "go", "give"], "answer": 1, "explanation": "\"stay fit\" = giữ dáng, giữ sức khỏe tốt.", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "TR7", "type": "sentence", "q": "She cannot bear talking with him about what he likes.", "starter": "She hates", "answer": "talking with him about what he likes", "accepted": null, "explanation": "cannot bear + V-ing = hate(s) + V-ing (đồng nghĩa).", "vi": "Cô ấy không thể chịu đựng được việc nói chuyện với anh ta về những gì anh ta thích.", "note": "S + can't bear + V-ing → S + hate(s) + V-ing"}, {"id": "WF5", "type": "fill", "q": "5. I like doing DIY because it helps me to save money and increase my ____________ as well. (create)", "answer": "creativity", "explanation": "Sau tính từ sở hữu \"my\" cần DANH TỪ chỉ khả năng → create + ivity = creativity.", "vi": "Tôi thích làm đồ tự chế vì nó giúp tôi tiết kiệm tiền và tăng khả năng sáng tạo của mình."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"leisure\"] B. Playing sports and collecting stamps are healthy _______ that help teenagers relax after school.", "answer": "leisure activities", "explanation": "Dựa vào ví dụ: leisure activities.", "vi": "Chơi thể thao và sưu tầm tem là những hoạt động giải trí lành mạnh giúp thanh thiếu niên thư giãn."}, {"id": "TR9", "type": "sentence", "q": "The thing that I hate most is motor racing, and I will never do it in my life.", "starter": "I detest", "answer": "motor racing, and I will never do it in my life", "accepted": null, "explanation": "the thing I hate most is N = detest + N (đồng nghĩa, ghét cay ghét đắng).", "vi": "Điều tôi ghét nhất là đua xe, và tôi sẽ không bao giờ làm việc đó trong đời.", "note": "The thing that I hate most is + N → I + detest + N"}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"entertainment\"] B. Radio, television and the Internet are popular __________ for people of all ages.", "answer": "forms of entertainment", "explanation": "Dựa vào ví dụ: forms of entertainment.", "vi": "Radio, truyền hình và Internet là những hình thức giải trí phổ biến với mọi lứa tuổi."}, {"id": "TFB4", "type": "mcq", "q": "4. Nam can knit a large blanket.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"I can knit a small scarf\" (khăn quàng nhỏ), không phải chăn lớn → Sai.", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["connect", "activate", "create", "surprise"], "answer": 1, "explanation": "\"activate\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/kəˈnekt/", "/ˈæktɪveɪt/", "/kriˈeɪt/", "/sərˈpraɪz/"], "vis": ["kết nối", "kích hoạt", "tạo ra", "làm ngạc nhiên"], "image": null}, {"id": "MCQ21", "type": "mcq", "q": "21. ________ is an increasingly popular method of communicating over the internet. People often send short messages using a mobile phone or computer.", "options": ["Messaging", "Volunteering", "Snowboarding", "Knitting"], "answer": 0, "explanation": "Gửi tin nhắn ngắn qua điện thoại/máy tính → Messaging.", "vi": "Nhắn tin là một phương thức giao tiếp qua internet ngày càng phổ biến.", "ipas": null, "vis": ["Nhắn tin (đúng)", "Làm tình nguyện", "Trượt ván tuyết", "Đan len"], "image": null}, {"id": "TFA5", "type": "mcq", "q": "5. _______ with friends are considered outdoor activities.", "options": ["Cycling and hanging out", "Joining clubs and doing craft kits", "Leisure activities", "Surfing and doing DIYs"], "answer": 0, "explanation": "Bài đọc: \"outdoor activities such as sports, cycling, or hanging out with friends\".", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["spending", "to spend", "spend", "spends"], "answer": 0, "explanation": "\"enjoy + V-ing\" = thích thú làm gì.", "vi": null, "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["them", "they", "theirs", "their"], "answer": 0, "explanation": "\"one of them\" = một trong số chúng, cần đại từ tân ngữ sau \"of\".", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["choose", "look", "spoon", "food"], "answer": 1, "explanation": "\"look\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/tʃuːz/", "/lʊk/", "/spuːn/", "/fuːd/"], "vis": ["chọn", "nhìn", "cái thìa", "thức ăn"], "image": null}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["to", "with", "from", "on"], "answer": 1, "explanation": "\"connect with sb\" = kết nối, gắn kết với ai.", "vi": null, "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"id": "PRON2", "type": "mcq", "q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["choose", "cool", "good", "tool"], "answer": 2, "explanation": "\"good\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/tʃuːz/", "/kuːl/", "/ɡʊd/", "/tuːl/"], "vis": ["chọn", "mát mẻ", "tốt", "dụng cụ"], "image": null}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["what", "when", "how", "why"], "answer": 3, "explanation": "\"Why don't you...?\" = sao bạn không...? (lời đề nghị).", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "TR4", "type": "sentence", "q": "He likes swimming and sunbathing.", "starter": "He is interested", "answer": "in swimming and sunbathing", "accepted": null, "explanation": "like + V-ing = be interested in + V-ing.", "vi": "Anh ấy thích bơi lội và tắm nắng.", "note": "S + like + V-ing → S + be interested in + V-ing"}, {"id": "MCQ7", "type": "mcq", "q": "7. Mark spends a lot of time ________ the internet. He visits one website after another just to watch short videos.", "options": ["doing", "taking", "surfing", "knitting"], "answer": 2, "explanation": "\"surf the internet\" = lướt mạng.", "vi": "Mark dành nhiều thời gian lướt mạng. Cậu ấy vào hết trang này đến trang khác chỉ để xem video ngắn.", "ipas": null, "vis": ["làm (chung chung, sai)", "lấy, mang (sai nghĩa)", "lướt (đúng: surf the internet)", "đan len (sai nghĩa)"], "image": null}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["puzzle", "detest", "prefer", "improve"], "answer": 0, "explanation": "\"puzzle\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈpʌzl/", "/dɪˈtest/", "/prɪˈfɜːr/", "/ɪmˈpruːv/"], "vis": ["trò chơi xếp hình", "ghét cay ghét đắng", "thích hơn", "cải thiện"], "image": null}, {"id": "WF10", "type": "fill", "q": "10. My dad was _______________ when I could repair my own bike. (surprise)", "answer": "surprised", "explanation": "Sau \"was\" chủ ngữ là người → dùng tính từ đuôi -ed (chỉ cảm xúc của người) → surprised.", "vi": "Bố tôi đã rất ngạc nhiên khi tôi có thể tự sửa xe đạp của mình."}, {"id": "TR8", "type": "sentence", "q": "Jane likes skateboarding although this has hurt her leg and arm some times.", "starter": "Jane fancies", "answer": "skateboarding although this has hurt her leg and arm some times", "accepted": null, "explanation": "like + V-ing = fancy/fancies + V-ing (đồng nghĩa).", "vi": "Jane thích trượt ván mặc dù việc này đã làm cô ấy bị đau chân và tay vài lần.", "note": "S + like(s) + V-ing → S + fancies + V-ing"}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["eat", "cook", "cooks", "cooking"], "answer": 1, "explanation": "\"prepare the ingredients and cook\" — hai động từ nguyên thể song song sau \"we\".", "vi": null, "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"id": "MCQ25", "type": "mcq", "q": "25. I'm so thirsty after a long run. I would like _________ a full glass of orange juice.", "options": ["drink", "to drink", "drank", "drinking"], "answer": 1, "explanation": "\"would like to V\" = muốn làm gì.", "vi": "Tôi khát nước quá sau khi chạy một quãng dài. Tôi muốn uống một ly nước cam đầy.", "ipas": null, "vis": ["uống (nguyên mẫu, sai)", "uống (to-V, đúng: would like to V)", "đã uống (quá khứ, sai)", "uống (V-ing, sai cấu trúc)"], "image": null}, {"id": "MCQ11", "type": "mcq", "q": "11. _________ do you do with your friends in your free time?", "options": ["What", "How", "Who", "When"], "answer": 0, "explanation": "Câu hỏi về hoạt động → What.", "vi": "Bạn làm gì với bạn bè trong thời gian rảnh?", "ipas": null, "vis": ["Cái gì (đúng — hỏi về hoạt động)", "Như thế nào", "Ai", "Khi nào"], "image": null}, {"id": "PIC4", "type": "mcq", "q": "4. What does the sign warn drivers?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">📵🚗</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO PHONE WHILE DRIVING</p></div>", "options": ["not to use your phone when driving.", "to talk with friends when driving.", "not to play games when driving.", "to drive and keep your phone in hand."], "answer": 0, "explanation": "Biểu tượng điện thoại gạch chéo trên nền xe hơi → cấm dùng điện thoại khi lái xe.", "vi": null}, {"id": "TR6", "type": "sentence", "q": "Ngoc dislikes doing any sports or exercises, so her health is not good enough to study.", "starter": "Ngoc doesn't like", "answer": "doing any sports or exercises, so her health is not good enough to study", "accepted": null, "explanation": "dislike + V-ing = don't/doesn't like + V-ing (đồng nghĩa).", "vi": "Ngọc không thích chơi thể thao hay tập thể dục, vì vậy sức khỏe của bạn ấy không đủ tốt để học.", "note": "S + dislike(s) + V-ing → S + don't/doesn't like + V-ing"}, {"id": "MCQ20", "type": "mcq", "q": "20. Last school year, my students were very keen on _______. They decorated and repaired the classroom by themselves.", "options": ["cooking", "doing origami", "doing DIY", "playing sports"], "answer": 2, "explanation": "Tự trang trí, sửa chữa lớp học → doing DIY.", "vi": "Năm học trước, học sinh của tôi rất say mê làm đồ tự chế (DIY). Các em đã tự trang trí và sửa chữa lớp học.", "ipas": null, "vis": ["nấu ăn", "gấp giấy nghệ thuật", "làm đồ tự chế (đúng — tự trang trí, sửa lớp học)", "chơi thể thao"], "image": null}, {"id": "MCQ2", "type": "mcq", "q": "2. My father likes _________ books and _________ in the pool.", "options": ["reading - swim", "to read - swimming", "read - swim", "reading - swimming"], "answer": 3, "explanation": "Hai động từ song song sau \"likes\" phải cùng dạng V-ing: reading - swimming.", "vi": "Bố tôi thích đọc sách và bơi trong hồ bơi.", "ipas": null, "vis": ["reading - swim (không song song)", "to read - swimming (không song song)", "read - swim (sai cấu trúc)", "reading - swimming (đúng: hai V-ing song song sau likes)"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. _______ is small circles of wool made around knitting needles.", "options": ["Stitches", "Magical", "Pastime", "Pattern"], "answer": 0, "explanation": "\"stitches\" = các mũi đan (vò ˈpʌzl/", "/ˈbæləns/"], "vis": ["tự làm tại nhà", "trượt ván tuyết", "trò chơi xếp hình", "sự cân bằng"], "image": null}, {"id": "MCQ15", "type": "mcq", "q": "15. It rained hard. ______, my father went to work.", "options": ["Therefore", "However", "Because", "A and B are correct"], "answer": 1, "explanation": "Ý tương phản (trời mưa to nhưng bố vẫn đi làm) → However.", "vi": "Trời mưa to. Tuy nhiên, bố tôi vẫn đi làm.", "ipas": null, "vis": ["Vì vậy", "Tuy nhiên (đúng — ý tương phản)", "Bởi vì", "Cả A và B đều đúng"], "image": null}, {"id": "TFB1", "type": "mcq", "q": "1. Nam and his sister made a paper house in three hours.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"my sister and I made a small paper house, which took us 3 hours\" → Đúng.", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["worked", "watched", "needed", "walked"], "answer": 2, "explanation": "\"needed\" có đuôi \"-ed\" phát âm /ɪd/ (vì \"need\" tận cùng bằng /d/), ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/wɜːrkt/", "/wɒtʃt/", "/ˈniːdɪd/", "/wɔːkt/"], "vis": ["đã làm việc", "đã xem", "đã cần", "đã đi bộ"], "image": null}], [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"leisure\"] A. The government is building new _________ like swimming pools for the residents.", "answer": "leisure facilities", "explanation": "Dựa vào ví dụ: leisure facilities.", "vi": "Chính phủ đang xây các cơ sở giải trí mới như hồ bơi cho cư dân."}, {"id": "MCQ25", "type": "mcq", "q": "25. I'm so thirsty after a long run. I would like _________ a full glass of orange juice.", "options": ["drink", "to drink", "drank", "drinking"], "answer": 1, "explanation": "\"would like to V\" = muốn làm gì.", "vi": "Tôi khát nước quá sau khi chạy một quãng dài. Tôi muốn uống một ly nước cam đầy.", "ipas": null, "vis": ["uống (nguyên mẫu, sai)", "uống (to-V, đúng: would like to V)", "đã uống (quá khứ, sai)", "uống (V-ing, sai cấu trúc)"], "image": null}, {"id": "MCQ26", "type": "mcq", "q": "26. My grandparents love ______ very much. There are a lot of beautiful flowers and fresh vegetables in their garden.", "options": ["doing garden", "doing gardening", "do gardening", "to do garden"], "answer": 1, "explanation": "\"do gardening\" ở dạng V-ing sau \"love\": doing gardening.", "vi": "Ông bà tôi rất thích làm vườn. Trong vườn của ông bà có rất nhiều hoa đẹp và rau tươi.", "ipas": null, "vis": ["làm vườn (sai — thiếu -ing ở 'garden')", "làm vườn (V-ing, đúng)", "làm vườn (nguyên mẫu, sai)", "làm vườn (to + V nguyên mẫu, sai cấu trúc)"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["home-made", "snowboarding", "puzzle", "balance"], "answer": 0, "explanation": "\"home-made\" trọng âm rơi vào âm tiết thứ 2 (\"made\"), ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌhoʊmˈmeɪd/", "/ˈsnoʊbɔːrdɪŋ/", "/ˈpʌzl/", "/ˈbæləns/"], "vis": ["tự làm tại nhà", "trượt ván tuyết", "trò chơi xếp hình", "sự cân bằng"], "image": null}, {"id": "WF4", "type": "fill", "q": "4. It .is very _______________ to watch these movies. I think you should watch them. (entertain)", "answer": "entertaining", "explanation": "Sau \"very\" cần TÍNH TỪ, chủ ngữ giả \"It\" mang tính chất gây giải trí → entertain + ing = entertaining.", "vi": "Xem những bộ phim này rất thú vị. Tôi nghĩ bạn nên xem chúng."}, {"id": "TFA6", "type": "mcq", "q": "6. Other teenagers like outdoor activities such as _________ with friends.", "options": ["sports", "cycling", "hanging out", "A, B and C are correct"], "answer": 3, "explanation": "Bài đọc liệt kê cả ba: sports, cycling, hanging out with friends.", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["choose", "look", "spoon", "food"], "answer": 1, "explanation": "\"look\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/tʃuːz/", "/lʊk/", "/spuːn/", "/fuːd/"], "vis": ["chọn", "nhìn", "cái thìa", "thức ăn"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. Nam's mother showed him how to knit.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"My mother also taught me how to knit\" → Đúng.", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "TR5", "type": "sentence", "q": "It is not a problem to me whether I have to pick her up to the cinema or not.", "starter": "I don't mind", "answer": "picking her up to the cinema", "accepted": null, "explanation": "It is not a problem to sb whether... = sb don't mind + V-ing.", "vi": "Việc tôi có phải đón cô ấy đi xem phim hay không cũng không phải vấn đề gì với tôi.", "note": "It is not a problem to sb whether S + V or not → S + don't mind + V-ing"}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["award", "gift", "prize", "medal"], "answer": 2, "explanation": "\"win the first prize\" = giành giải nhất (trong cuộc thi trang phục).", "vi": null, "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"id": "TFB5", "type": "mcq", "q": "5. Nam enjoys _____ the Internet for new baking recipes.", "options": ["searching", "knitting", "banking", "surfing"], "answer": 3, "explanation": "Bài đọc: \"I love surfing the Internet to find new recipes for baking\".", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "MCQ6", "type": "mcq", "q": "6. ________ helps to improve physical health and sometimes gives us a chance to make friends.", "options": ["Messaging", "Playing computer games", "Surfing the net", "Playing sports"], "answer": 3, "explanation": "Chơi thể thao giúp cải thiện sức khỏe thể chất và có cơ hội kết bạn.", "vi": "Chơi thể thao giúp cải thiện sức khỏe thể chất và đôi khi cho ta cơ hội kết bạn.", "ipas": null, "vis": ["Nhắn tin", "Chơi trò chơi điện tử", "Lướt mạng", "Chơi thể thao (đúng — cải thiện sức khỏe & kết bạn)"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "28. Most people now enjoy shorter working hours and more _______.", "options": ["message friends", "paper folding", "leisure time", "muscle strength"], "answer": 2, "explanation": "\"leisure time\" = thời gian rảnh rỗi, hợp nghĩa với giờ làm việc ngắn hơn.", "vi": "Hầu hết mọi người hiện nay có giờ làm việc ngắn hơn và nhiều thời gian rảnh hơn.", "ipas": null, "vis": ["nhắn tin bạn bè", "gấp giấy", "thời gian rảnh rỗi (đúng)", "sức mạnh cơ bắp"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. _______ is small circles of wool made around knitting needles.", "options": ["Stitches", "Magical", "Pastime", "Pattern"], "answer": 0, "explanation": "\"stitches\" = các mũi đan (vòng len nhỏ quanh que đan).", "vi": "Các mũi đan là những vòng len nhỏ được tạo quanh que đan.", "ipas": null, "vis": ["Các mũi đan (đúng)", "Kỳ diệu, huyền bí", "Thú vui", "Mẫu, khuôn thiết kế"], "image": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["keep", "stay", "go", "give"], "answer": 1, "explanation": "\"stay fit\" = giữ dáng, giữ sức khỏe tốt.", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)_
