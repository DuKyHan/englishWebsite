<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 1 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 1 · Leisure Time</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["school", "school", "door", "pool"], "answer": 2, "explanation": "\"door\" phát âm /ɔː/, các từ còn lại có \"oo\" phát âm /uː/.", "vi": null, "ipas": ["/skuːl/", "/skuːl/", "/dɔːr/", "/puːl/"], "vis": ["trường học", "trường học", "cửa", "hồ bơi"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["choose", "cool", "good", "tool"], "answer": 2, "explanation": "\"good\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/tʃuːz/", "/kuːl/", "/ɡʊd/", "/tuːl/"], "vis": ["chọn", "mát mẻ", "tốt", "dụng cụ"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["june", "bull", "truth", "flu"], "answer": 1, "explanation": "\"bull\" có \"u\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/dʒuːn/", "/bʊl/", "/truːθ/", "/fluː/"], "vis": ["tháng Sáu", "con bò đực", "sự thật", "cúm"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["pictures", "watches", "buses", "brushes"], "answer": 0, "explanation": "\"pictures\" có đuôi \"-s\" phát âm /z/, ba từ còn lại có đuôi \"-es\" phát âm /ɪz/.", "vi": null, "ipas": ["/ˈpɪktʃərz/", "/ˈwɒtʃɪz/", "/ˈbʌsɪz/", "/ˈbrʌʃɪz/"], "vis": ["những bức tranh", "đồng hồ (số nhiều)", "xe buýt (số nhiều)", "bàn chải (số nhiều)"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "5. Which word has the underlined part pronounced differently from that of the others?", "options": ["woman", "who", "move", "lose"], "answer": 0, "explanation": "\"woman\" có \"o\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/ˈwʊmən/", "/huː/", "/muːv/", "/luːz/"], "vis": ["người phụ nữ", "ai", "di chuyển", "mất, thua"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["worked", "watched", "needed", "walked"], "answer": 2, "explanation": "\"needed\" có đuôi \"-ed\" phát âm /ɪd/ (vì \"need\" tận cùng bằng /d/), ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/wɜːrkt/", "/wɒtʃt/", "/ˈniːdɪd/", "/wɔːkt/"], "vis": ["đã làm việc", "đã xem", "đã cần", "đã đi bộ"], "image": null}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["pudding", "push", "cushion", "include"], "answer": 3, "explanation": "\"include\" có \"u\" phát âm /uː/, ba từ còn lại phát âm /ʊ/.", "vi": null, "ipas": ["/ˈpʊdɪŋ/", "/pʊʃ/", "/ˈkʊʃn/", "/ɪnˈkluːd/"], "vis": ["bánh pudding", "đẩy", "đệm, gối tựa", "bao gồm"], "image": null}, {"id": "PRON8", "type": "mcq", "q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["finish", "find", "tired", "dislike"], "answer": 0, "explanation": "\"finish\" có \"i\" phát âm /ɪ/, ba từ còn lại có \"i\" phát âm /aɪ/.", "vi": null, "ipas": ["/ˈfɪnɪʃ/", "/faɪnd/", "/ˈtaɪərd/", "/dɪsˈlaɪk/"], "vis": ["hoàn thành", "tìm thấy", "mệt mỏi", "không thích"], "image": null}, {"id": "PRON9", "type": "mcq", "q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["wood", "moon", "soon", "loose"], "answer": 0, "explanation": "\"wood\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/wʊd/", "/muːn/", "/suːn/", "/luːs/"], "vis": ["gỗ", "mặt trăng", "sớm", "lỏng lẻo"], "image": null}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["choose", "look", "spoon", "food"], "answer": 1, "explanation": "\"look\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/tʃuːz/", "/lʊk/", "/spuːn/", "/fuːd/"], "vis": ["chọn", "nhìn", "cái thìa", "thức ăn"], "image": null}]}, {"key": "stress0", "title": "Stressed syllable", "emoji": "🎯", "vi": "Trọng âm", "items": [{"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["leisure", "puzzle", "enjoy", "message"], "answer": 2, "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈliːʒər/", "/ˈpʌzl/", "/ɪnˈdʒɔɪ/", "/ˈmesɪdʒ/"], "vis": ["thời gian rảnh", "trò chơi xếp hình", "thích thú", "tin nhắn"], "image": null}, {"id": "STR2", "type": "mcq", "q": "2. Which word has a different stress pattern from that of the others?", "options": ["enjoy", "dislike", "relax", "muscle"], "answer": 3, "explanation": "\"muscle\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ɪnˈdʒɔɪ/", "/dɪsˈlaɪk/", "/rɪˈlæks/", "/ˈmʌsl/"], "vis": ["thích thú", "không thích", "thư giãn", "cơ bắp"], "image": null}, {"id": "STR3", "type": "mcq", "q": "3. Which word has a different stress pattern from that of the others?", "options": ["balance", "muscle", "improve", "fancy"], "answer": 2, "explanation": "\"improve\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbæləns/", "/ˈmʌsl/", "/ɪmˈpruːv/", "/ˈfænsi/"], "vis": ["sự cân bằng", "cơ bắp", "cải thiện", "thích, muốn"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["home-made", "snowboarding", "puzzle", "balance"], "answer": 0, "explanation": "\"home-made\" trọng âm rơi vào âm tiết thứ 2 (\"made\"), ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌhoʊmˈmeɪd/", "/ˈsnoʊbɔːrdɪŋ/", "/ˈpʌzl/", "/ˈbæləns/"], "vis": ["tự làm tại nhà", "trượt ván tuyết", "trò chơi xếp hình", "sự cân bằng"], "image": null}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["puzzle", "detest", "prefer", "improve"], "answer": 0, "explanation": "\"puzzle\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈpʌzl/", "/dɪˈtest/", "/prɪˈfɜːr/", "/ɪmˈpruːv/"], "vis": ["trò chơi xếp hình", "ghét cay ghét đắng", "thích hơn", "cải thiện"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Which word has a different stress pattern from that of the others?", "options": ["resort", "puzzle", "adore", "prefer"], "answer": 1, "explanation": "\"puzzle\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/rɪˈzɔːrt/", "/ˈpʌzl/", "/əˈdɔːr/", "/prɪˈfɜːr/"], "vis": ["khu nghỉ dưỡng", "trò chơi xếp hình", "rất thích, mê", "thích hơn"], "image": null}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["connect", "activate", "create", "surprise"], "answer": 1, "explanation": "\"activate\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/kəˈnekt/", "/ˈæktɪveɪt/", "/kriˈeɪt/", "/sərˈpraɪz/"], "vis": ["kết nối", "kích hoạt", "tạo ra", "làm ngạc nhiên"], "image": null}, {"id": "STR8", "type": "mcq", "q": "8. Which word has a different stress pattern from that of the others?", "options": ["entertain", "popularize", "activate", "leisure"], "answer": 0, "explanation": "\"entertain\" trọng âm rơi vào âm tiết cuối, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌentərˈteɪn/", "/ˈpɒpjələraɪz/", "/ˈæktɪveɪt/", "/ˈliːʒər/"], "vis": ["giải trí", "phổ biến hóa", "kích hoạt", "thời gian rảnh"], "image": null}, {"id": "STR9", "type": "mcq", "q": "9. Which word has a different stress pattern from that of the others?", "options": ["adore", "enjoy", "prefer", "listen"], "answer": 3, "explanation": "\"listen\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/əˈdɔːr/", "/ɪnˈdʒɔɪ/", "/prɪˈfɜːr/", "/ˈlɪsn/"], "vis": ["rất thích, mê", "thích thú", "thích hơn", "lắng nghe"], "image": null}, {"id": "STR10", "type": "mcq", "q": "10. Which word has a different stress pattern from that of the others?", "options": ["detest", "message friends", "folding", "fancy"], "answer": 0, "explanation": "\"detest\" trọng âm rơi vào âm tiết 2, ba từ/cụm còn lại trọng âm chính rơi vào âm tiết 1.", "vi": null, "ipas": ["/dɪˈtest/", "/ˈmesɪdʒ frendz/", "/ˈfoʊldɪŋ/", "/ˈfænsi/"], "vis": ["ghét cay ghét đắng", "nhắn tin cho bạn bè", "gấp", "thích, muốn"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "1. About 16% of them love ________ swimming.", "options": ["to go", "go", "going", "went"], "answer": 2, "explanation": "\"love\" có thể theo sau bởi V-ing hoặc to-V; đáp án chính thức là going.", "vi": "Khoảng 16% trong số họ rất thích bơi lội.", "ipas": null, "vis": ["đi (to-V, ít dùng sau love)", "đi (nguyên mẫu, thiếu to/-ing)", "đi (V-ing, đúng: love + V-ing)", "đã đi (quá khứ, sai thì)"], "image": null}, {"id": "MCQ2", "type": "mcq", "q": "2. My father likes _________ books and _________ in the pool.", "options": ["reading - swim", "to read - swimming", "read - swim", "reading - swimming"], "answer": 3, "explanation": "Hai động từ song song sau \"likes\" phải cùng dạng V-ing: reading - swimming.", "vi": "Bố tôi thích đọc sách và bơi trong hồ bơi.", "ipas": null, "vis": ["reading - swim (không song song)", "to read - swimming (không song song)", "read - swim (sai cấu trúc)", "reading - swimming (đúng: hai V-ing song song sau likes)"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. A lot of young families in Viet Nam prefer _______ time doing outdoor activities together.", "options": ["spending", "spend", "spent", "to spend"], "answer": 0, "explanation": "Cấu trúc \"prefer + V-ing\"; đây cũng là cấu trúc \"spend time V-ing\".", "vi": "Nhiều gia đình trẻ ở Việt Nam thích dành thời gian cùng nhau làm các hoạt động ngoài trời.", "ipas": null, "vis": ["spending (V-ing, đúng: prefer + V-ing)", "spend (nguyên mẫu, thiếu to/-ing)", "spent (quá khứ, sai)", "to spend (to-V, không phải đáp án chính)"], "image": null}, {"id": "MCQ4", "type": "mcq", "q": "4. My sister hates ______ up early to do exercise.", "options": ["getting", "get", "gets", "to get"], "answer": 0, "explanation": "\"hate\" theo sau bởi V-ing hoặc to-V; đáp án chính thức là getting.", "vi": "Chị tôi ghét việc dậy sớm để tập thể dục.", "ipas": null, "vis": ["getting (V-ing, đúng: hate + V-ing)", "get (nguyên mẫu, thiếu to/-ing)", "gets (chia sai)", "to get (to-V, không phải đáp án chính)"], "image": null}, {"id": "MCQ5", "type": "mcq", "q": "5. Nam usually _________ football with his friends after school.", "options": ["plays", "playing", "play", "to play"], "answer": 0, "explanation": "Chủ ngữ số ít \"Nam\", thì hiện tại đơn → plays.", "vi": "Nam thường chơi bóng đá với bạn bè sau giờ học.", "ipas": null, "vis": ["chơi (chia đúng ngôi thứ 3 số ít 'plays')", "chơi (V-ing, sai vì cần động từ chính)", "chơi (nguyên mẫu, thiếu -s)", "chơi (to-V, sai cấu trúc)"], "image": null}, {"id": "MCQ6", "type": "mcq", "q": "6. ________ helps to improve physical health and sometimes gives us a chance to make friends.", "options": ["Messaging", "Playing computer games", "Surfing the net", "Playing sports"], "answer": 3, "explanation": "Chơi thể thao giúp cải thiện sức khỏe thể chất và có cơ hội kết bạn.", "vi": "Chơi thể thao giúp cải thiện sức khỏe thể chất và đôi khi cho ta cơ hội kết bạn.", "ipas": null, "vis": ["Nhắn tin", "Chơi trò chơi điện tử", "Lướt mạng", "Chơi thể thao (đúng — cải thiện sức khỏe & kết bạn)"], "image": null}, {"id": "MCQ7", "type": "mcq", "q": "7. Mark spends a lot of time ________ the internet. He visits one website after another just to watch short videos.", "options": ["doing", "taking", "surfing", "knitting"], "answer": 2, "explanation": "\"surf the internet\" = lướt mạng.", "vi": "Mark dành nhiều thời gian lướt mạng. Cậu ấy vào hết trang này đến trang khác chỉ để xem video ngắn.", "ipas": null, "vis": ["làm (chung chung, sai)", "lấy, mang (sai nghĩa)", "lướt (đúng: surf the internet)", "đan len (sai nghĩa)"], "image": null}, {"id": "MCQ8", "type": "mcq", "q": "8. Our cousins detest ________ books and _________ .", "options": ["reading / draw", "reading / drawing", "to read / to draw", "read/ draw"], "answer": 1, "explanation": "Hai động từ song song sau \"detest\" phải cùng dạng V-ing: reading / drawing.", "vi": "Anh chị em họ của chúng tôi rất ghét đọc sách và vẽ.", "ipas": null, "vis": ["reading / draw (không song song)", "reading / drawing (đúng: hai V-ing song song sau detest)", "to read / to draw (sai cấu trúc)", "read/ draw (nguyên mẫu, sai)"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. Alice spends a lot of time _______ her own; she always exercises regularly and does what she enjoys.", "options": ["on", "in", "about", "for"], "answer": 0, "explanation": "\"spend time on your own\" = dành thời gian một mình.", "vi": "Alice dành nhiều thời gian ở một mình; cô ấy luôn tập thể dục đều đặn và làm những gì mình thích.", "ipas": null, "vis": ["on (đúng: spend time on your own = dành thời gian một mình)", "in (sai giới từ)", "about (sai giới từ)", "for (sai giới từ)"], "image": null}, {"id": "MCQ10", "type": "mcq", "q": "10. _______ is a design that you use to make something.", "options": ["Pattern", "Pastime", "Needles", "A and B are correct"], "answer": 0, "explanation": "\"pattern\" = mẫu, khuôn thiết kế dùng để tạo ra vật gì đó.", "vi": "Mẫu (pattern) là một thiết kế mà bạn dùng để làm ra thứ gì đó.", "ipas": null, "vis": ["Mẫu, khuôn thiết kế (đúng)", "Thú vui, việc làm lúc rảnh", "Kim đan len", "Cả A và B đều đúng"], "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "11. _________ do you do with your friends in your free time?", "options": ["What", "How", "Who", "When"], "answer": 0, "explanation": "Câu hỏi về hoạt động → What.", "vi": "Bạn làm gì với bạn bè trong thời gian rảnh?", "ipas": null, "vis": ["Cái gì (đúng — hỏi về hoạt động)", "Như thế nào", "Ai", "Khi nào"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. _______ is small circles of wool made around knitting needles.", "options": ["Stitches", "Magical", "Pastime", "Pattern"], "answer": 0, "explanation": "\"stitches\" = các mũi đan (vòng len nhỏ quanh que đan).", "vi": "Các mũi đan là những vòng len nhỏ được tạo quanh que đan.", "ipas": null, "vis": ["Các mũi đan (đúng)", "Kỳ diệu, huyền bí", "Thú vui", "Mẫu, khuôn thiết kế"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. Origami is the art of paper _________.", "options": ["fold", "folding", "to fold", "folds"], "answer": 1, "explanation": "\"paper folding\" = nghệ thuật gấp giấy (danh từ ghép).", "vi": "Origami là nghệ thuật gấp giấy.", "ipas": null, "vis": ["gấp (nguyên mẫu, sai — cần danh từ ghép)", "gấp (danh động từ, đúng: paper folding = gấp giấy)", "gấp (to-V, sai)", "gấp (chia số ít, sai)"], "image": null}, {"id": "MCQ14", "type": "mcq", "q": "14. About favorite leisure activities, she and I share many things in _______.", "options": ["similarity", "general", "common", "the same"], "answer": 2, "explanation": "\"have things in common\" = có nhiều điểm chung.", "vi": "Về các hoạt động giải trí yêu thích, cô ấy và tôi có nhiều điểm chung.", "ipas": null, "vis": ["sự giống nhau (danh từ, sai cụm)", "chung chung", "chung, giống nhau (đúng: have things in common)", "giống hệt"], "image": null}, {"id": "MCQ15", "type": "mcq", "q": "15. It rained hard. ______, my father went to work.", "options": ["Therefore", "However", "Because", "A and B are correct"], "answer": 1, "explanation": "Ý tương phản (trời mưa to nhưng bố vẫn đi làm) → However.", "vi": "Trời mưa to. Tuy nhiên, bố tôi vẫn đi làm.", "ipas": null, "vis": ["Vì vậy", "Tuy nhiên (đúng — ý tương phản)", "Bởi vì", "Cả A và B đều đúng"], "image": null}, {"id": "MCQ16", "type": "mcq", "q": "16. It was cold and wet, ______ Bob still went to the beach.", "options": ["therefore", "so", "but", "because"], "answer": 2, "explanation": "Ý tương phản (trời lạnh ướt nhưng Bob vẫn đi biển) → but.", "vi": "Trời lạnh và ẩm ướt, nhưng Bob vẫn đi biển.", "ipas": null, "vis": ["vì vậy", "vì vậy", "nhưng (đúng — ý tương phản)", "bởi vì"], "image": null}, {"id": "MCQ17", "type": "mcq", "q": "17. _______ is something that you enjoy doing when you are not working", "options": ["Pastime", "Pattern", "Magical", "Stitches"], "answer": 0, "explanation": "\"pastime\" = thú vui, việc bạn thích làm khi không phải làm việc.", "vi": "Thú vui (pastime) là điều bạn thích làm khi không phải làm việc.", "ipas": null, "vis": ["Thú vui (đúng)", "Mẫu, khuôn thiết kế", "Kỳ diệu", "Các mũi đan"], "image": null}, {"id": "MCQ18", "type": "mcq", "q": "18. Visiting _______ increases my knowledge about cultures in the past.", "options": ["museums", "cinemas", "hometown", "city"], "answer": 0, "explanation": "Thăm bảo tàng giúp tăng hiểu biết về văn hóa trong quá khứ.", "vi": "Việc thăm các bảo tàng giúp tôi tăng thêm hiểu biết về các nền văn hóa trong quá khứ.", "ipas": null, "vis": ["bảo tàng (đúng)", "rạp chiếu phim", "quê hương", "thành phố"], "image": null}, {"id": "MCQ19", "type": "mcq", "q": "19. ________ is having a special quality that makes something seem different from ordinary things.", "options": ["Stitches", "Similarity", "Magical", "creative"], "answer": 2, "explanation": "\"magical\" = có phẩm chất đặc biệt khiến thứ gì đó khác biệt so với bình thường.", "vi": "Từ \"magical\" chỉ việc có một phẩm chất đặc biệt khiến điều gì đó có vẻ khác so với những thứ bình thường.", "ipas": null, "vis": ["Các mũi đan", "Sự giống nhau", "Kỳ diệu, đặc biệt (đúng)", "sáng tạo"], "image": null}, {"id": "MCQ20", "type": "mcq", "q": "20. Last school year, my students were very keen on _______. They decorated and repaired the classroom by themselves.", "options": ["cooking", "doing origami", "doing DIY", "playing sports"], "answer": 2, "explanation": "Tự trang trí, sửa chữa lớp học → doing DIY.", "vi": "Năm học trước, học sinh của tôi rất say mê làm đồ tự chế (DIY). Các em đã tự trang trí và sửa chữa lớp học.", "ipas": null, "vis": ["nấu ăn", "gấp giấy nghệ thuật", "làm đồ tự chế (đúng — tự trang trí, sửa lớp học)", "chơi thể thao"], "image": null}]}, {"key": "mcq2", "title": "Vocabulary & Grammar (21-30)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ21", "type": "mcq", "q": "21. ________ is an increasingly popular method of communicating over the internet. People often send short messages using a mobile phone or computer.", "options": ["Messaging", "Volunteering", "Snowboarding", "Knitting"], "answer": 0, "explanation": "Gửi tin nhắn ngắn qua điện thoại/máy tính → Messaging.", "vi": "Nhắn tin là một phương thức giao tiếp qua internet ngày càng phổ biến.", "ipas": null, "vis": ["Nhắn tin (đúng)", "Làm tình nguyện", "Trượt ván tuyết", "Đan len"], "image": null}, {"id": "MCQ22", "type": "mcq", "q": "22. Minh ______ to play football, and so does his brother.", "options": ["likes", "enjoys", "fancies", "detest"], "answer": 0, "explanation": "\"like to V\" đúng ngữ pháp và hợp nghĩa; \"fancy\" và \"enjoy\" không đi với to-V.", "vi": "Minh thích chơi bóng đá, và anh trai cậu ấy cũng vậy.", "ipas": null, "vis": ["thích (đúng, đi được với to-V)", "thích thú (chỉ đi với V-ing, sai)", "thích, muốn (chỉ đi với V-ing, sai)", "ghét (sai nghĩa & thiếu -s)"], "image": null}, {"id": "MCQ23", "type": "mcq", "q": "23. She loves going out _______ her friends.", "options": ["for", "with", "between", "in"], "answer": 1, "explanation": "\"go out with sb\" = đi chơi cùng ai.", "vi": "Cô ấy rất thích đi chơi cùng bạn bè.", "ipas": null, "vis": ["cho", "với, cùng (đúng: go out with sb)", "giữa", "trong, vào"], "image": null}, {"id": "MCQ24", "type": "mcq", "q": "24. Ms. Janny loves _______very much. There are a lot of beautiful flowers and fresh vegetables in her garden.", "options": ["doing gardening", "to doing garden", "to do garden", "do gardening"], "answer": 0, "explanation": "\"do gardening\" ở dạng V-ing sau \"loves\": doing gardening.", "vi": "Cô Janny rất thích làm vườn. Trong vườn của cô có rất nhiều hoa đẹp và rau tươi.", "ipas": null, "vis": ["làm vườn (V-ing, đúng)", "làm vườn (sai — 'to doing' không tồn tại)", "làm vườn (to + V nguyên mẫu, sai sau loves)", "làm vườn (nguyên mẫu, thiếu -ing)"], "image": null}, {"id": "MCQ25", "type": "mcq", "q": "25. I'm so thirsty after a long run. I would like _________ a full glass of orange juice.", "options": ["drink", "to drink", "drank", "drinking"], "answer": 1, "explanation": "\"would like to V\" = muốn làm gì.", "vi": "Tôi khát nước quá sau khi chạy một quãng dài. Tôi muốn uống một ly nước cam đầy.", "ipas": null, "vis": ["uống (nguyên mẫu, sai)", "uống (to-V, đúng: would like to V)", "đã uống (quá khứ, sai)", "uống (V-ing, sai cấu trúc)"], "image": null}, {"id": "MCQ26", "type": "mcq", "q": "26. My grandparents love ______ very much. There are a lot of beautiful flowers and fresh vegetables in their garden.", "options": ["doing garden", "doing gardening", "do gardening", "to do garden"], "answer": 1, "explanation": "\"do gardening\" ở dạng V-ing sau \"love\": doing gardening.", "vi": "Ông bà tôi rất thích làm vườn. Trong vườn của ông bà có rất nhiều hoa đẹp và rau tươi.", "ipas": null, "vis": ["làm vườn (sai — thiếu -ing ở 'garden')", "làm vườn (V-ing, đúng)", "làm vườn (nguyên mẫu, sai)", "làm vườn (to + V nguyên mẫu, sai cấu trúc)"], "image": null}, {"id": "MCQ27", "type": "mcq", "q": "27. You should avoid ______ too much TV. It's not good for your eyes.", "options": ["seeing", "looking", "watching", "glancing"], "answer": 2, "explanation": "\"avoid + V-ing\"; \"watch TV\" là collocation đúng.", "vi": "Bạn nên tránh xem TV quá nhiều. Điều đó không tốt cho mắt của bạn.", "ipas": null, "vis": ["nhìn thấy (sai — không đi với TV theo cách này)", "nhìn (sai — không phải collocation đúng)", "xem (đúng: watch TV)", "liếc nhìn (sai nghĩa)"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "28. Most people now enjoy shorter working hours and more _______.", "options": ["message friends", "paper folding", "leisure time", "muscle strength"], "answer": 2, "explanation": "\"leisure time\" = thời gian rảnh rỗi, hợp nghĩa với giờ làm việc ngắn hơn.", "vi": "Hầu hết mọi người hiện nay có giờ làm việc ngắn hơn và nhiều thời gian rảnh hơn.", "ipas": null, "vis": ["nhắn tin bạn bè", "gấp giấy", "thời gian rảnh rỗi (đúng)", "sức mạnh cơ bắp"], "image": null}, {"id": "MCQ29", "type": "mcq", "q": "29. A: How do you feel when you spend time with your mum?", "options": ["Yes, I'd love to.", "I feel very happy.", "I like it too", "I love cooking with her."], "answer": 1, "explanation": "Câu hỏi \"How do you feel...?\" cần trả lời về cảm xúc → I feel very happy.", "vi": "A: Bạn cảm thấy thế nào khi ở bên mẹ? B: Tôi cảm thấy rất vui.", "ipas": null, "vis": ["Vâng, tôi rất muốn. (sai — không hợp câu hỏi về cảm xúc)", "Tôi cảm thấy rất vui. (đúng — trả lời cảm xúc)", "Tôi cũng thích điều đó. (sai — lạc đề)", "Tôi thích nấu ăn cùng mẹ. (sai — lạc đề)"], "image": null}, {"id": "MCQ30", "type": "mcq", "q": "30. A: Would you like to go to the cinema with me?", "options": ["Yes, I watch films every day.", "Yes, I don't like it.", "I'd love to.", "We can go there together."], "answer": 2, "explanation": "Lời mời \"Would you like to...?\" → đồng ý bằng \"I'd love to.\"", "vi": "A: Bạn có muốn đi xem phim với tôi không? B: Tôi rất muốn.", "ipas": null, "vis": ["Vâng, tôi xem phim mỗi ngày. (sai — không đáp lời mời)", "Vâng, tôi không thích nó. (mâu thuẫn logic — sai)", "Tôi rất muốn. (đúng — nhận lời mời)", "Chúng ta có thể đi cùng nhau. (không tự nhiên bằng đáp án đúng)"], "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "1. The most popular leisure _____________ in Britain is going for a walk. (act)", "answer": "activity", "explanation": "Sau tính từ \"popular leisure\" và trước động từ \"is\" cần một DANH TỪ → act + ivity = activity.", "vi": "Hoạt động giải trí phổ biến nhất ở Anh là đi bộ."}, {"id": "WF2", "type": "fill", "q": "2. To play video games, these computers must be used over a Wi-Fi internet ____________. (connect)", "answer": "connection", "explanation": "Sau tính từ sở hữu \"internet\" cần DANH TỪ → connect + ion = connection.", "vi": "Để chơi trò chơi điện tử, những chiếc máy tính này phải được kết nối qua Wi-Fi."}, {"id": "WF3", "type": "fill", "q": "3. I think badminton is an easy sport which helps to improve my muscle ______________. (strong)", "answer": "strength", "explanation": "Sau tính từ sở hữu \"muscle\" cần DANH TỪ → strong → strength (đổi đuôi bất quy tắc).", "vi": "Tôi nghĩ cầu lông là môn thể thao dễ giúp cải thiện sức mạnh cơ bắp của tôi."}, {"id": "WF4", "type": "fill", "q": "4. It .is very _______________ to watch these movies. I think you should watch them. (entertain)", "answer": "entertaining", "explanation": "Sau \"very\" cần TÍNH TỪ, chủ ngữ giả \"It\" mang tính chất gây giải trí → entertain + ing = entertaining.", "vi": "Xem những bộ phim này rất thú vị. Tôi nghĩ bạn nên xem chúng."}, {"id": "WF5", "type": "fill", "q": "5. I like doing DIY because it helps me to save money and increase my ____________ as well. (create)", "answer": "creativity", "explanation": "Sau tính từ sở hữu \"my\" cần DANH TỪ chỉ khả năng → create + ivity = creativity.", "vi": "Tôi thích làm đồ tự chế vì nó giúp tôi tiết kiệm tiền và tăng khả năng sáng tạo của mình."}, {"id": "WF6", "type": "fill", "q": "6. Little John is keen on acting at school shows, and he wants to be a __________ in the future. (comedy)", "answer": "comedian", "explanation": "Sau mạo từ \"a\" cần DANH TỪ CHỈ NGƯỜI → comedy + ian = comedian.", "vi": "Cậu bé John rất say mê diễn kịch ở trường và muốn trở thành diễn viên hài trong tương lai."}, {"id": "WF7", "type": "fill", "q": "7. ________improves my overall health and balance, so I practice the sport every weekend. (Snowboard)", "answer": "Snowboarding", "explanation": "Đứng đầu câu, làm chủ ngữ, cần DANH TỪ → Snowboard + ing = Snowboarding.", "vi": "Trượt ván tuyết giúp cải thiện sức khỏe tổng thể và sự cân bằng của tôi."}, {"id": "WF8", "type": "fill", "q": "8. Messaging has won ______________ among students nowadays. (popular)", "answer": "popularity", "explanation": "Sau động từ \"won\" cần DANH TỪ → popular + ity = popularity.", "vi": "Nhắn tin đã trở nên phổ biến trong giới học sinh ngày nay."}, {"id": "WF9", "type": "fill", "q": "9. Having leisure activities is one of the best ways to make you feel _________. (comfort)", "answer": "comfortable", "explanation": "Sau \"feel\" cần TÍNH TỪ → comfort + able = comfortable.", "vi": "Có các hoạt động giải trí là một trong những cách tốt nhất để khiến bạn cảm thấy thoải mái."}, {"id": "WF10", "type": "fill", "q": "10. My dad was _______________ when I could repair my own bike. (surprise)", "answer": "surprised", "explanation": "Sau \"was\" chủ ngữ là người → dùng tính từ đuôi -ed (chỉ cảm xúc của người) → surprised.", "vi": "Bố tôi đã rất ngạc nhiên khi tôi có thể tự sửa xe đạp của mình."}]}, {"key": "readingA", "title": "A) Mountain climbing", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["them", "they", "theirs", "their"], "answer": 0, "explanation": "\"one of them\" = một trong số chúng, cần đại từ tân ngữ sau \"of\".", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["decrease", "reduce", "increase", "raise"], "answer": 2, "explanation": "\"increase your strength\" = tăng cường sức mạnh của bạn.", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["indoor", "inside", "within", "among"], "answer": 1, "explanation": "\"inside your home\" = bên trong nhà bạn (giới từ + your home).", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["keep", "stay", "go", "give"], "answer": 1, "explanation": "\"stay fit\" = giữ dáng, giữ sức khỏe tốt.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["effective", "effect", "effectively", "effectiveness"], "answer": 2, "explanation": "Trạng từ bổ nghĩa cho động từ \"use\": effectively (một cách hiệu quả).", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["what", "when", "how", "why"], "answer": 3, "explanation": "\"Why don't you...?\" = sao bạn không...? (lời đề nghị).", "vi": null}], "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"key": "readingB", "title": "B) Leisure time with family", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["spending", "to spend", "spend", "spends"], "answer": 0, "explanation": "\"enjoy + V-ing\" = thích thú làm gì.", "vi": null}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["to", "with", "from", "on"], "answer": 1, "explanation": "\"connect with sb\" = kết nối, gắn kết với ai.", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["air pollution", "water pollution", "environmental pollution", "fresh air"], "answer": 3, "explanation": "Đạp xe ra làng quê để tận hưởng không khí trong lành → fresh air.", "vi": null}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["eat", "cook", "cooks", "cooking"], "answer": 1, "explanation": "\"prepare the ingredients and cook\" — hai động từ nguyên thể song song sau \"we\".", "vi": null}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["award", "gift", "prize", "medal"], "answer": 2, "explanation": "\"win the first prize\" = giành giải nhất (trong cuộc thi trang phục).", "vi": null}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["connect", "connecting", "connected", "connection"], "answer": 0, "explanation": "\"a great way to connect with them\" = to + V nguyên thể.", "vi": null}], "passage": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and ___(4)___. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. Once I won the first ___(5)___ in a costume contest at my school because my mum helped me a lot. I love spending time with my family because it is a great way to ___(6)___ with them."}, {"key": "tfA", "title": "Teenagers' leisure activities", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "1. Teenagers nowadays only prefer indoor activities in their free time.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nêu cả hoạt động trong nhà lẫn ngoài trời, không chỉ trong nhà → Sai.", "vi": null}, {"id": "TFA2", "type": "mcq", "q": "2. Teenagers are called a “technology generation” because they spend a lot of time on devices.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Teenagers can be called a 'technology generation' because they spend much of their free time on devices\" → Đúng.", "vi": null}, {"id": "TFA3", "type": "mcq", "q": "3. Joining clubs and doing craft kits are unpopular choices for teenagers.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"joining clubs or doing craft kits are also popular choices\" → Sai.", "vi": null}, {"id": "TFA4", "type": "mcq", "q": "4. Leisure activities only help teenagers relax but do not help them develop skills.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"These activities help them relax and develop new skills\" → Sai.", "vi": null}, {"id": "TFA5", "type": "mcq", "q": "5. _______ with friends are considered outdoor activities.", "options": ["Cycling and hanging out", "Joining clubs and doing craft kits", "Leisure activities", "Surfing and doing DIYs"], "answer": 0, "explanation": "Bài đọc: \"outdoor activities such as sports, cycling, or hanging out with friends\".", "vi": null}, {"id": "TFA6", "type": "mcq", "q": "6. Other teenagers like outdoor activities such as _________ with friends.", "options": ["sports", "cycling", "hanging out", "A, B and C are correct"], "answer": 3, "explanation": "Bài đọc liệt kê cả ba: sports, cycling, hanging out with friends.", "vi": null}], "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"key": "tfB", "title": "Nam's DIY hobby", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFB1", "type": "mcq", "q": "1. Nam and his sister made a paper house in three hours.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"my sister and I made a small paper house, which took us 3 hours\" → Đúng.", "vi": null}, {"id": "TFB2", "type": "mcq", "q": "2. Making a paper house is very expensive.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"It doesn't cost much\" → Sai.", "vi": null}, {"id": "TFB3", "type": "mcq", "q": "3. Nam's mother showed him how to knit.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"My mother also taught me how to knit\" → Đúng.", "vi": null}, {"id": "TFB4", "type": "mcq", "q": "4. Nam can knit a large blanket.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"I can knit a small scarf\" (khăn quàng nhỏ), không phải chăn lớn → Sai.", "vi": null}, {"id": "TFB5", "type": "mcq", "q": "5. Nam enjoys _____ the Internet for new baking recipes.", "options": ["searching", "knitting", "banking", "surfing"], "answer": 3, "explanation": "Bài đọc: \"I love surfing the Internet to find new recipes for baking\".", "vi": null}, {"id": "TFB6", "type": "mcq", "q": "6. Doing DIYs and baking makes Nam feel ____________.", "options": ["enjoyable", "pleased", "tired", "happy"], "answer": 0, "explanation": "Theo đáp án chính thức của đề cương: enjoyable (thú vị, đáng tận hưởng).", "vi": null}], "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"key": "transform0", "title": "Sentence Transformation (Part 1)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "It is really interesting for him to talk with his music teacher about jazz.", "starter": "He fancies", "answer": "talking with his music teacher about jazz", "accepted": null, "explanation": "It is interesting for sb to V = sb fancies + V-ing.", "vi": "Việc trò chuyện với giáo viên âm nhạc về nhạc jazz thực sự rất thú vị đối với cậu ấy.", "note": "It is interesting for sb to V → sb + fancies + V-ing"}, {"id": "TR2", "type": "sentence", "q": "Watching historical films is very interesting to my younger brother.", "starter": "My younger brother enjoys", "answer": "watching historical films", "accepted": null, "explanation": "V-ing... is interesting to sb = sb + enjoys + V-ing.", "vi": "Xem phim lịch sử rất thú vị đối với em trai tôi.", "note": "V-ing + be interesting to sb → sb + enjoys + V-ing"}, {"id": "TR3", "type": "sentence", "q": "We usually visit museums when we have leisure time.", "starter": "We enjoy", "answer": "visiting museums when we have leisure time", "accepted": null, "explanation": "usually + V (hiện tại đơn) = enjoy + V-ing.", "vi": "Chúng tôi thường đi thăm bảo tàng khi có thời gian rảnh.", "note": "S + usually + V → S + enjoy + V-ing"}, {"id": "TR4", "type": "sentence", "q": "He likes swimming and sunbathing.", "starter": "He is interested", "answer": "in swimming and sunbathing", "accepted": null, "explanation": "like + V-ing = be interested in + V-ing.", "vi": "Anh ấy thích bơi lội và tắm nắng.", "note": "S + like + V-ing → S + be interested in + V-ing"}, {"id": "TR5", "type": "sentence", "q": "It is not a problem to me whether I have to pick her up to the cinema or not.", "starter": "I don't mind", "answer": "picking her up to the cinema", "accepted": null, "explanation": "It is not a problem to sb whether... = sb don't mind + V-ing.", "vi": "Việc tôi có phải đón cô ấy đi xem phim hay không cũng không phải vấn đề gì với tôi.", "note": "It is not a problem to sb whether S + V or not → S + don't mind + V-ing"}, {"id": "TR6", "type": "sentence", "q": "Ngoc dislikes doing any sports or exercises, so her health is not good enough to study.", "starter": "Ngoc doesn't like", "answer": "doing any sports or exercises, so her health is not good enough to study", "accepted": null, "explanation": "dislike + V-ing = don't/doesn't like + V-ing (đồng nghĩa).", "vi": "Ngọc không thích chơi thể thao hay tập thể dục, vì vậy sức khỏe của bạn ấy không đủ tốt để học.", "note": "S + dislike(s) + V-ing → S + don't/doesn't like + V-ing"}, {"id": "TR7", "type": "sentence", "q": "She cannot bear talking with him about what he likes.", "starter": "She hates", "answer": "talking with him about what he likes", "accepted": null, "explanation": "cannot bear + V-ing = hate(s) + V-ing (đồng nghĩa).", "vi": "Cô ấy không thể chịu đựng được việc nói chuyện với anh ta về những gì anh ta thích.", "note": "S + can't bear + V-ing → S + hate(s) + V-ing"}, {"id": "TR8", "type": "sentence", "q": "Jane likes skateboarding although this has hurt her leg and arm some times.", "starter": "Jane fancies", "answer": "skateboarding although this has hurt her leg and arm some times", "accepted": null, "explanation": "like + V-ing = fancy/fancies + V-ing (đồng nghĩa).", "vi": "Jane thích trượt ván mặc dù việc này đã làm cô ấy bị đau chân và tay vài lần.", "note": "S + like(s) + V-ing → S + fancies + V-ing"}, {"id": "TR9", "type": "sentence", "q": "The thing that I hate most is motor racing, and I will never do it in my life.", "starter": "I detest", "answer": "motor racing, and I will never do it in my life", "accepted": null, "explanation": "the thing I hate most is N = detest + N (đồng nghĩa, ghét cay ghét đắng).", "vi": "Điều tôi ghét nhất là đua xe, và tôi sẽ không bao giờ làm việc đó trong đời.", "note": "The thing that I hate most is + N → I + detest + N"}, {"id": "TR10", "type": "sentence", "q": "I don't like to get up early and prepare breakfast in the cold winter days.", "starter": "I hate", "answer": "getting up early and preparing breakfast on cold winter days", "accepted": ["getting up early and preparing breakfast on cold winter days", "getting up early and preparing breakfast in the cold winter days"], "explanation": "don't like + to-V = hate + V-ing (đồng nghĩa).", "vi": "Tôi không thích dậy sớm và chuẩn bị bữa sáng vào những ngày mùa đông lạnh giá.", "note": "S + don't like + to V → S + hate + V-ing"}]}, {"key": "transform1", "title": "Sentence Transformation (Part 2)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR11", "type": "sentence", "q": "Lan spends 3 hours a day doing her homework.", "starter": "It takes Lan", "answer": "3 hours a day to do her homework", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Lan mất 3 tiếng mỗi ngày để làm bài tập về nhà.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"id": "TR12", "type": "sentence", "q": "My sister spends 30 minutes walking to school every day.", "starter": "It takes my sister", "answer": "30 minutes to walk to school every day", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Chị tôi mất 30 phút để đi bộ đến trường mỗi ngày.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"id": "TR13", "type": "sentence", "q": "They spent two months building this bridge.", "starter": "It took them", "answer": "two months to build this bridge", "accepted": null, "explanation": "Ở thì quá khứ: S + spent + time + V-ing = It took + O + time + to V.", "vi": "Họ đã mất hai tháng để xây cây cầu này.", "note": "S + spent + time + V-ing → It took + O + time + to V"}, {"id": "TR14", "type": "sentence", "q": "We spend 15 minutes cleaning our classroom after school.", "starter": "It takes us", "answer": "15 minutes to clean our classroom after school", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Chúng tôi mất 15 phút để dọn lớp sau giờ học.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"id": "TR15", "type": "sentence", "q": "Her grandmother spends an hour gardening every day.", "starter": "It takes her grandmother", "answer": "an hour to garden every day", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Bà của cô ấy mất một tiếng để làm vườn mỗi ngày.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"leisure\"] A. The government is building new _________ like swimming pools for the residents.", "answer": "leisure facilities", "explanation": "Dựa vào ví dụ: leisure facilities.", "vi": "Chính phủ đang xây các cơ sở giải trí mới như hồ bơi cho cư dân."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"leisure\"] B. Playing sports and collecting stamps are healthy _______ that help teenagers relax after school.", "answer": "leisure activities", "explanation": "Dựa vào ví dụ: leisure activities.", "vi": "Chơi thể thao và sưu tầm tem là những hoạt động giải trí lành mạnh giúp thanh thiếu niên thư giãn."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"entertainment\"] A. There will be __________ at the hotel party tonight, including singers and dancers.", "answer": "live entertainment", "explanation": "Dựa vào ví dụ: live entertainment.", "vi": "Sẽ có buổi biểu diễn trực tiếp tại bữa tiệc khách sạn tối nay, gồm ca sĩ và vũ công."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"entertainment\"] B. Radio, television and the Internet are popular __________ for people of all ages.", "answer": "forms of entertainment", "explanation": "Dựa vào ví dụ: forms of entertainment.", "vi": "Radio, truyền hình và Internet là những hình thức giải trí phổ biến với mọi lứa tuổi."}]}, {"key": "pictures", "title": "Pictures & Signs", "emoji": "🚦", "vi": "Biển báo", "items": [{"id": "PIC1", "type": "mcq", "q": "1. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-44 bg-white border-2 border-slate-200 rounded-xl p-3 shadow-sm\"><svg viewBox=\"0 0 100 100\" class=\"w-16 h-16\" aria-hidden=\"true\"><rect x=\"10\" y=\"10\" width=\"80\" height=\"80\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#f59e0b\" stroke-width=\"4\"/><path d=\"M20 70 L45 30 L60 55 L70 40 L82 70 Z\" fill=\"#0891b2\"/><circle cx=\"30\" cy=\"25\" r=\"7\" fill=\"#f59e0b\"/><line x1=\"14\" y1=\"78\" x2=\"86\" y2=\"78\" stroke=\"#7c2d12\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight mt-1\">QUAYSIDE OR RIVERBANK AHEAD</p></div>", "options": ["Dangerous dip", "Slippery road", "Quayside or riverbank ahead", "Compulsory ahead only"], "answer": 2, "explanation": "Biển báo hình chữ nhật màu vàng với người đi về phía mép nước cảnh báo có bến tàu/bờ sông phía trước.", "vi": null}, {"id": "PIC2", "type": "mcq", "q": "2. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫🧒💺</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">FRONT SEATS: NOT FOR CHILDREN</p></div>", "options": ["The front seats are only for children.", "Children are not allowed to sit here.", "Adults have to sit at the front.", "There is no more seat for adults."], "answer": 1, "explanation": "Biểu tượng cấm trẻ em ngồi ghế trước → trẻ em không được phép ngồi ở đây.", "vi": null}, {"id": "PIC3", "type": "mcq", "q": "3. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><svg viewBox=\"0 0 100 100\" class=\"w-16 h-16\" aria-hidden=\"true\"><rect x=\"10\" y=\"10\" width=\"80\" height=\"80\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#16a34a\" stroke-width=\"4\"/><rect x=\"18\" y=\"55\" width=\"64\" height=\"20\" fill=\"#16a34a\" opacity=\"0.5\"/><circle cx=\"40\" cy=\"35\" r=\"9\" fill=\"#fbbf24\"/><path d=\"M40 44 L40 60 M40 60 L30 75 M40 60 L50 75\" stroke=\"#7c2d12\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"14\" y1=\"82\" x2=\"86\" y2=\"18\" stroke=\"#dc2626\" stroke-width=\"5\"/></svg><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight mt-1\">KEEP OFF THE GRASS</p></div>", "options": ["Do not leave your feet touching the grass.", "Riding your bicycle in this area.", "You can play soccer in this place.", "You can throw the trash here."], "answer": 0, "explanation": "Biển \"Keep off the grass\" với hình gạch chéo trên bãi cỏ → không được giẫm/để chân chạm cỏ.", "vi": null}, {"id": "PIC4", "type": "mcq", "q": "4. What does the sign warn drivers?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">📵🚗</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO PHONE WHILE DRIVING</p></div>", "options": ["not to use your phone when driving.", "to talk with friends when driving.", "not to play games when driving.", "to drive and keep your phone in hand."], "answer": 0, "explanation": "Biểu tượng điện thoại gạch chéo trên nền xe hơi → cấm dùng điện thoại khi lái xe.", "vi": null}]}], "total": 107, "examPapers": [[{"id": "MCQ2", "type": "mcq", "q": "2. My father likes _________ books and _________ in the pool.", "options": ["reading - swim", "to read - swimming", "read - swim", "reading - swimming"], "answer": 3, "explanation": "Hai động từ song song sau \"likes\" phải cùng dạng V-ing: reading - swimming.", "vi": "Bố tôi thích đọc sách và bơi trong hồ bơi.", "ipas": null, "vis": ["reading - swim (không song song)", "to read - swimming (không song song)", "read - swim (sai cấu trúc)", "reading - swimming (đúng: hai V-ing song song sau likes)"], "image": null}, {"id": "TFA5", "type": "mcq", "q": "5. _______ with friends are considered outdoor activities.", "options": ["Cycling and hanging out", "Joining clubs and doing craft kits", "Leisure activities", "Surfing and doing DIYs"], "answer": 0, "explanation": "Bài đọc: \"outdoor activities such as sports, cycling, or hanging out with friends\".", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "PIC3", "type": "mcq", "q": "3. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><svg viewBox=\"0 0 100 100\" class=\"w-16 h-16\" aria-hidden=\"true\"><rect x=\"10\" y=\"10\" width=\"80\" height=\"80\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#16a34a\" stroke-width=\"4\"/><rect x=\"18\" y=\"55\" width=\"64\" height=\"20\" fill=\"#16a34a\" opacity=\"0.5\"/><circle cx=\"40\" cy=\"35\" r=\"9\" fill=\"#fbbf24\"/><path d=\"M40 44 L40 60 M40 60 L30 75 M40 60 L50 75\" stroke=\"#7c2d12\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"14\" y1=\"82\" x2=\"86\" y2=\"18\" stroke=\"#dc2626\" stroke-width=\"5\"/></svg><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight mt-1\">KEEP OFF THE GRASS</p></div>", "options": ["Do not leave your feet touching the grass.", "Riding your bicycle in this area.", "You can play soccer in this place.", "You can throw the trash here."], "answer": 0, "explanation": "Biển \"Keep off the grass\" với hình gạch chéo trên bãi cỏ → không được giẫm/để chân chạm cỏ.", "vi": null}, {"id": "PRON3", "type": "mcq", "q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["june", "bull", "truth", "flu"], "answer": 1, "explanation": "\"bull\" có \"u\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/dʒuːn/", "/bʊl/", "/truːθ/", "/fluː/"], "vis": ["tháng Sáu", "con bò đực", "sự thật", "cúm"], "image": null}, {"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["school", "school", "door", "pool"], "answer": 2, "explanation": "\"door\" phát âm /ɔː/, các từ còn lại có \"oo\" phát âm /uː/.", "vi": null, "ipas": ["/skuːl/", "/skuːl/", "/dɔːr/", "/puːl/"], "vis": ["trường học", "trường học", "cửa", "hồ bơi"], "image": null}, {"id": "MCQ11", "type": "mcq", "q": "11. _________ do you do with your friends in your free time?", "options": ["What", "How", "Who", "When"], "answer": 0, "explanation": "Câu hỏi về hoạt động → What.", "vi": "Bạn làm gì với bạn bè trong thời gian rảnh?", "ipas": null, "vis": ["Cái gì (đúng — hỏi về hoạt động)", "Như thế nào", "Ai", "Khi nào"], "image": null}, {"id": "TFB4", "type": "mcq", "q": "4. Nam can knit a large blanket.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"I can knit a small scarf\" (khăn quàng nhỏ), không phải chăn lớn → Sai.", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "TR15", "type": "sentence", "q": "Her grandmother spends an hour gardening every day.", "starter": "It takes her grandmother", "answer": "an hour to garden every day", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Bà của cô ấy mất một tiếng để làm vườn mỗi ngày.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["indoor", "inside", "within", "among"], "answer": 1, "explanation": "\"inside your home\" = bên trong nhà bạn (giới từ + your home).", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "TFB2", "type": "mcq", "q": "2. Making a paper house is very expensive.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"It doesn't cost much\" → Sai.", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "WF1", "type": "fill", "q": "1. The most popular leisure _____________ in Britain is going for a walk. (act)", "answer": "activity", "explanation": "Sau tính từ \"popular leisure\" và trước động từ \"is\" cần một DANH TỪ → act + ivity = activity.", "vi": "Hoạt động giải trí phổ biến nhất ở Anh là đi bộ."}, {"id": "PRON9", "type": "mcq", "q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["wood", "moon", "soon", "loose"], "answer": 0, "explanation": "\"wood\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/wʊd/", "/muːn/", "/suːn/", "/luːs/"], "vis": ["gỗ", "mặt trăng", "sớm", "lỏng lẻo"], "image": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["keep", "stay", "go", "give"], "answer": 1, "explanation": "\"stay fit\" = giữ dáng, giữ sức khỏe tốt.", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["decrease", "reduce", "increase", "raise"], "answer": 2, "explanation": "\"increase your strength\" = tăng cường sức mạnh của bạn.", "vi": null, "passage": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?"}, {"id": "PRON8", "type": "mcq", "q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["finish", "find", "tired", "dislike"], "answer": 0, "explanation": "\"finish\" có \"i\" phát âm /ɪ/, ba từ còn lại có \"i\" phát âm /aɪ/.", "vi": null, "ipas": ["/ˈfɪnɪʃ/", "/faɪnd/", "/ˈtaɪərd/", "/dɪsˈlaɪk/"], "vis": ["hoàn thành", "tìm thấy", "mệt mỏi", "không thích"], "image": null}, {"id": "TR12", "type": "sentence", "q": "My sister spends 30 minutes walking to school every day.", "starter": "It takes my sister", "answer": "30 minutes to walk to school every day", "accepted": null, "explanation": "S + spend(s) + time + V-ing = It takes + O + time + to V.", "vi": "Chị tôi mất 30 phút để đi bộ đến trường mỗi ngày.", "note": "S + spend(s) + time + V-ing → It takes + O + time + to V"}, {"id": "MCQ30", "type": "mcq", "q": "30. A: Would you like to go to the cinema with me?", "options": ["Yes, I watch films every day.", "Yes, I don't like it.", "I'd love to.", "We can go there together."], "answer": 2, "explanation": "Lời mời \"Would you like to...?\" → đồng ý bằng \"I'd love to.\"", "vi": "A: Bạn có muốn đi xem phim với tôi không? B: Tôi rất muốn.", "ipas": null, "vis": ["Vâng, tôi xem phim mỗi ngày. (sai — không đáp lời mời)", "Vâng, tôi không thích nó. (mâu thuẫn logic — sai)", "Tôi rất muốn. (đúng — nhận lời mời)", "Chúng ta có thể đi cùng nhau. (không tự nhiên bằng đáp án đúng)"], "image": null}, {"id": "TFA3", "type": "mcq", "q": "3. Joining clubs and doing craft kits are unpopular choices for teenagers.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"joining clubs or doing craft kits are also popular choices\" → Sai.", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "TR8", "type": "sentence", "q": "Jane likes skateboarding although this has hurt her leg and arm some times.", "starter": "Jane fancies", "answer": "skateboarding although this has hurt her leg and arm some times", "accepted": null, "explanation": "like + V-ing = fancy/fancies + V-ing (đồng nghĩa).", "vi": "Jane thích trượt ván mặc dù việc này đã làm cô ấy bị đau chân và tay vài lần.", "note": "S + like(s) + V-ing → S + fancies + V-ing"}, {"id": "MCQ19", "type": "mcq", "q": "19. ________ is having a special quality that makes something seem different from ordinary things.", "options": ["Stitches", "Similarity", "Magical", "creative"], "answer": 2, "explanation": "\"magical\" = có phẩm chất đặc biệt khiến thứ gì đó khác biệt so với bình thường.", "vi": "Từ \"magical\" chỉ việc có một phẩm chất đặc biệt khiến điều gì đó có vẻ khác so với những thứ bình thường.", "ipas": null, "vis": ["Các mũi đan", "Sự giống nhau", "Kỳ diệu, đặc biệt (đúng)", "sáng tạo"], "image": null}, {"id": "TFA2", "type": "mcq", "q": "2. Teenagers are called a “technology generation” because they spend a lot of time on devices.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Teenagers can be called a 'technology generation' because they spend much of their free time on devices\" → Đúng.", "vi": null, "passage": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills."}, {"id": "TFB3", "type": "mcq", "q": "3. Nam's mother showed him how to knit.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"My mother also taught me how to knit\" → Đúng.", "vi": null, "passage": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time."}, {"id": "TR6", "type": "sentence", "q": "Ngoc dislikes doing any sports or exercises, so her health is not good enough to study.", "starter": "Ngoc doesn't like", "answer": "
