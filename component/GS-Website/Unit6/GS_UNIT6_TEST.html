<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 6 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 6 · Life Styles</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["breakfast", "brief", "bright", "climb"], "answer": 3, "explanation": "\"climb\" có \"b\" câm (không phát âm), khác biệt với cách phát âm của các từ còn lại.", "vi": null, "ipas": ["/ˈbrekfəst/", "/briːf/", "/braɪt/", "/klaɪm/"], "vis": ["bữa sáng", "ngắn gọn", "sáng, tươi sáng", "leo, trèo"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["practice", "cupboard", "pray", "plan"], "answer": 2, "explanation": "\"pray\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"a\" phát âm khác (/æ/ hoặc âm câm).", "vi": null, "ipas": ["/ˈpræktɪs/", "/ˈkʌbərd/", "/preɪ/", "/plæn/"], "vis": ["thực hành", "cái tủ", "cầu nguyện", "kế hoạch"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["express", "precious", "present", "celebrate"], "answer": 0, "explanation": "\"express\" có \"e\" đầu phát âm /ɪ/, ba từ còn lại phát âm /e/.", "vi": null, "ipas": ["/ɪkˈspres/", "/ˈpreʃəs/", "/ˈpreznt/", "/ˈselɪbreɪt/"], "vis": ["diễn đạt, thể hiện", "quý giá", "hiện tại, món quà", "kỷ niệm"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["greet", "weave", "each", "head"], "answer": 3, "explanation": "\"head\" có \"ea\" phát âm /e/, ba từ còn lại phát âm /iː/.", "vi": null, "ipas": ["/ɡriːt/", "/wiːv/", "/iːtʃ/", "/hed/"], "vis": ["chào", "dệt", "mỗi", "đầu"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "5. Which word has the underlined part pronounced differently from that of the others?", "options": ["simple", "practice", "tribal", "bridge"], "answer": 2, "explanation": "\"tribal\" có \"i\" phát âm /aɪ/, ba từ còn lại phát âm /ɪ/.", "vi": null, "ipas": ["/ˈsɪmpl/", "/ˈpræktɪs/", "/ˈtraɪbl/", "/brɪdʒ/"], "vis": ["đơn giản", "thực hành", "bộ lạc, thuộc bộ lạc", "cây cầu"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["adult", "artisan", "avoid", "alive"], "answer": 1, "explanation": "\"artisan\" có \"a\" đầu phát âm /ɑː/, ba từ còn lại phát âm /ə/.", "vi": null, "ipas": ["/ˈædʌlt/", "/ˈɑːrtɪzən/", "/əˈvɔɪd/", "/əˈlaɪv/"], "vis": ["người trưởng thành", "nghệ nhân", "tránh", "còn sống"], "image": null}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["balance", "base", "artisan", "practice"], "answer": 1, "explanation": "\"base\" có \"a\" phát âm /eɪ/, ba từ còn lại phát âm /æ/ hoặc /ɑː/.", "vi": null, "ipas": ["/ˈbæləns/", "/beɪs/", "/ˈɑːrtɪzən/", "/ˈpræktɪs/"], "vis": ["sự cân bằng", "nền tảng, cơ sở", "nghệ nhân", "thực hành"], "image": null}, {"id": "PRON8", "type": "mcq", "q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["hold", "improve", "nomad", "notice"], "answer": 1, "explanation": "\"improve\" có \"o\" phát âm /uː/, ba từ còn lại phát âm /oʊ/.", "vi": null, "ipas": ["/hoʊld/", "/ɪmˈpruːv/", "/ˈnoʊmæd/", "/ˈnoʊtɪs/"], "vis": ["giữ, cầm", "cải thiện", "người du mục", "chú ý"], "image": null}, {"id": "PRON9", "type": "mcq", "q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["precious", "serve", "technology", "resident"], "answer": 1, "explanation": "\"serve\" có \"er\" phát âm /ɜːr/, ba từ còn lại có \"e\" phát âm /e/.", "vi": null, "ipas": ["/ˈpreʃəs/", "/sɜːrv/", "/tekˈnɒlədʒi/", "/ˈrezɪdənt/"], "vis": ["quý giá", "phục vụ", "công nghệ", "cư dân"], "image": null}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["diet", "furious", "artisan", "greeting"], "answer": 0, "explanation": "\"diet\" có \"i\" phát âm /aɪ/, ba từ còn lại phát âm /i/ hoặc /iː/.", "vi": null, "ipas": ["/ˈdaɪət/", "/ˈfjʊəriəs/", "/ˈɑːrtɪzən/", "/ˈɡriːtɪŋ/"], "vis": ["chế độ ăn", "giận dữ, dữ dội", "nghệ nhân", "lời chào"], "image": null}]}, {"key": "stress0", "title": "Stressed syllable", "emoji": "🎯", "vi": "Trọng âm", "items": [{"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["famous", "common", "staple", "avoid"], "answer": 3, "explanation": "\"avoid\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈfeɪməs/", "/ˈkɒmən/", "/ˈsteɪpl/", "/əˈvɔɪd/"], "vis": ["nổi tiếng", "phổ biến, chung", "chủ yếu, thiết yếu", "tránh"], "image": null}, {"id": "STR2", "type": "mcq", "q": "2. Which word has a different stress pattern from that of the others?", "options": ["occasion", "disagree", "tradition", "expensive"], "answer": 1, "explanation": "\"disagree\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/əˈkeɪʒn/", "/ˌdɪsəˈɡriː/", "/trəˈdɪʃn/", "/ɪkˈspensɪv/"], "vis": ["dịp, sự kiện", "không đồng ý", "truyền thống", "đắt tiền"], "image": null}, {"id": "STR3", "type": "mcq", "q": "3. Which word has a different stress pattern from that of the others?", "options": ["harmful", "maintain", "lifestyle", "freedom"], "answer": 1, "explanation": "\"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhɑːrmfl/", "/meɪnˈteɪn/", "/ˈlaɪfstaɪl/", "/ˈfriːdəm/"], "vis": ["có hại", "duy trì", "lối sống", "sự tự do"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["healthy", "hurry", "support", "modern"], "answer": 2, "explanation": "\"support\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhelθi/", "/ˈhʌri/", "/səˈpɔːrt/", "/ˈmɒdərn/"], "vis": ["khỏe mạnh", "vội vàng", "ủng hộ, hỗ trợ", "hiện đại"], "image": null}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["improve", "habit", "native", "famous"], "answer": 0, "explanation": "\"improve\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ɪmˈpruːv/", "/ˈhæbɪt/", "/ˈneɪtɪv/", "/ˈfeɪməs/"], "vis": ["cải thiện", "thói quen", "bản địa, bẩm sinh", "nổi tiếng"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Which word has a different stress pattern from that of the others?", "options": ["balance", "common", "cuisine", "diet"], "answer": 2, "explanation": "\"cuisine\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbæləns/", "/ˈkɒmən/", "/kwɪˈziːn/", "/ˈdaɪət/"], "vis": ["sự cân bằng", "phổ biến, chung", "ẩm thực", "chế độ ăn"], "image": null}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["online", "offline", "musher", "igloo"], "answer": 1, "explanation": "\"offline\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌɒnˈlaɪn/", "/ˌɒfˈlaɪn/", "/ˈmʌʃər/", "/ˈɪɡluː/"], "vis": ["trực tuyến", "trực tiếp, ngoại tuyến", "người điều khiển xe chó kéo", "lều tuyết"], "image": null}, {"id": "STR8", "type": "mcq", "q": "8. Which word has a different stress pattern from that of the others?", "options": ["experience", "enhance", "maintain", "general"], "answer": 3, "explanation": "\"general\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ɪkˈspɪəriəns/", "/ɪnˈhæns/", "/meɪnˈteɪn/", "/ˈdʒenrəl/"], "vis": ["kinh nghiệm", "nâng cao", "duy trì", "chung, tổng quát"], "image": null}, {"id": "STR9", "type": "mcq", "q": "9. Which word has a different stress pattern from that of the others?", "options": ["independent", "interaction", "technology", "dedication"], "answer": 2, "explanation": "\"technology\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/ˌɪndɪˈpendənt/", "/ˌɪntərˈækʃn/", "/tekˈnɒlədʒi/", "/ˌdedɪˈkeɪʃn/"], "vis": ["độc lập", "sự tương tác", "công nghệ", "sự cống hiến"], "image": null}, {"id": "STR10", "type": "mcq", "q": "10. Which word has a different stress pattern from that of the others?", "options": ["hurry", "improve", "lifestyle", "mealtime"], "answer": 1, "explanation": "\"improve\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhʌri/", "/ɪmˈpruːv/", "/ˈlaɪfstaɪl/", "/ˈmiːltaɪm/"], "vis": ["vội vàng", "cải thiện", "lối sống", "giờ ăn"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "1. Another programme takes families for a _______ adventure in the surrounding woods.", "options": ["dogsled", "diet", "habit", "street"], "answer": 0, "explanation": "\"dogsled adventure\" = cuộc phiêu lưu bằng xe trượt tuyết chó kéo.", "vi": null, "ipas": null, "vis": ["xe trượt tuyết chó kéo (đúng)", "chế độ ăn", "thói quen", "đường phố"], "image": null}, {"id": "MCQ2", "type": "mcq", "q": "2. We need to find some other _______ of transportation.", "options": ["means", "styles", "cuisines", "leisure"], "answer": 0, "explanation": "\"means of transportation\" = phương tiện giao thông.", "vi": null, "ipas": null, "vis": ["phương tiện (đúng)", "kiểu, phong cách", "ẩm thực", "sự nhàn rỗi"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. It's a simple _______ to prepare, consisting mainly of rice and vegetables.", "options": ["waiter", "street", "dish", "title"], "answer": 2, "explanation": "\"dish\" = món ăn — hợp nghĩa với \"consisting of rice and vegetables\".", "vi": null, "ipas": null, "vis": ["người phục vụ", "đường phố", "món ăn (đúng)", "tiêu đề"], "image": null}, {"id": "MCQ4", "type": "mcq", "q": "4. The hotel restaurant is known for its excellent French _______.", "options": ["craft", "cuisine", "musher", "dogsled"], "answer": 1, "explanation": "\"cuisine\" = nền ẩm thực — hợp nghĩa với \"French cuisine\".", "vi": null, "ipas": null, "vis": ["thủ công", "ẩm thực (đúng)", "người điều khiển xe chó kéo", "xe trượt tuyết chó kéo"], "image": null}, {"id": "MCQ5", "type": "mcq", "q": "5. The 1,100-mile race from Anchorage to Nome allows _____ to drop injured, sick or tired dogs.", "options": ["tribes", "mushers", "waiters", "cuisines"], "answer": 1, "explanation": "\"mushers\" = người điều khiển xe trượt tuyết chó kéo.", "vi": null, "ipas": null, "vis": ["các bộ lạc", "người điều khiển xe chó kéo (đúng)", "người phục vụ", "các nền ẩm thực"], "image": null}, {"id": "MCQ6", "type": "mcq", "q": "6. They share a(n) _______ interest in photography.", "options": ["common", "nomadic", "different", "independent"], "answer": 0, "explanation": "\"common interest\" = sở thích chung.", "vi": null, "ipas": null, "vis": ["chung (đúng)", "du mục", "khác nhau", "độc lập"], "image": null}, {"id": "MCQ7", "type": "mcq", "q": "7. We enjoyed a(n) _______ picnic lunch on the lawn.", "options": ["different", "alive", "leisurely", "unique"], "answer": 2, "explanation": "\"leisurely\" = thong thả, nhàn nhã — hợp nghĩa với bữa picnic thư giãn.", "vi": null, "ipas": null, "vis": ["khác nhau", "còn sống", "thong thả (đúng)", "độc đáo"], "image": null}, {"id": "MCQ8", "type": "mcq", "q": "8. I don't eat much for lunch —just a(n) _______ snack.", "options": ["light", "nomadic", "best-known", "balanced"], "answer": 0, "explanation": "\"a light snack\" = một bữa ăn nhẹ.", "vi": null, "ipas": null, "vis": ["nhẹ (đúng)", "du mục", "nổi tiếng nhất", "cân bằng"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. The Aborigines are the _______ inhabitants of Australia.", "options": ["unusual", "unique", "traditional", "native"], "answer": 3, "explanation": "\"native inhabitants\" = cư dân bản địa.", "vi": null, "ipas": null, "vis": ["khác thường", "độc đáo, duy nhất", "truyền thống", "bản địa (đúng)"], "image": null}, {"id": "MCQ10", "type": "mcq", "q": "10. The city _______ seems to suit her — she's certainly looking very well.", "options": ["practice", "hurry", "lifestyle", "title"], "answer": 2, "explanation": "\"city lifestyle\" = lối sống thành thị.", "vi": null, "ipas": null, "vis": ["thực hành", "vội vàng", "lối sống (đúng)", "tiêu đề"], "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "11. If it _______ convenient, let's go out for dinner tonight.", "options": ["be", "is", "was", "were"], "answer": 1, "explanation": "Câu điều kiện loại 1: mệnh đề If dùng thì hiện tại đơn → is.", "vi": null, "ipas": null, "vis": ["nguyên mẫu (sai)", "hiện tại đơn (đúng)", "quá khứ (sai)", "quá khứ, giả định (sai)"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. If we meet at 9:00, we ___________ plenty of time to talk.", "options": ["have", "is having", "will have", "had"], "answer": 2, "explanation": "Câu điều kiện loại 1: mệnh đề chính dùng tương lai đơn → will have.", "vi": null, "ipas": null, "vis": ["hiện tại đơn (sai)", "hiện tại tiếp diễn (sai)", "tương lai đơn (đúng)", "quá khứ (sai)"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. If you learn online, you will find it difficult ___________.", "options": ["concentrated", "concentrating", "concentrate", "to concentrate"], "answer": 3, "explanation": "Cấu trúc: find it + adj + to V (thấy khó/dễ để làm gì).", "vi": null, "ipas": null, "vis": ["quá khứ (sai)", "V-ing (sai cấu trúc)", "nguyên mẫu (sai cấu trúc)", "to-V (đúng)"], "image": null}, {"id": "MCQ14", "type": "mcq", "q": "14. Linh and Quan have similar ___________ about online learning.", "options": ["problem", "ideas", "idea", "ideal"], "answer": 1, "explanation": "\"similar\" + danh từ số nhiều (ý kiến của 2 người) → ideas.", "vi": null, "ipas": null, "vis": ["vấn đề (số ít, sai)", "ý tưởng (số nhiều, đúng)", "ý tưởng (số ít, sai)", "lý tưởng (sai từ loại)"], "image": null}, {"id": "MCQ15", "type": "mcq", "q": "15. What do people do to ___________ traditional lifestyles?", "options": ["maintain", "stay", "carry", "serve"], "answer": 0, "explanation": "\"maintain a lifestyle\" = duy trì lối sống.", "vi": null, "ipas": null, "vis": ["duy trì (đúng)", "ở lại", "mang theo", "phục vụ"], "image": null}, {"id": "MCQ16", "type": "mcq", "q": "16. Thais greet other people by ___________ \"sawadee\".", "options": ["bowing", "saying", "practicing", "telling"], "answer": 1, "explanation": "\"greet by saying...\" = chào bằng cách nói câu gì đó.", "vi": null, "ipas": null, "vis": ["cúi chào", "nói (đúng)", "luyện tập", "kể"], "image": null}, {"id": "MCQ17", "type": "mcq", "q": "17. What is the ___________ food in your area? - It's rice.", "options": ["core", "basic", "staple", "key"], "answer": 2, "explanation": "\"staple food\" = thực phẩm chính, chủ yếu.", "vi": null, "ipas": null, "vis": ["cốt lõi", "cơ bản", "chủ yếu (đúng)", "chủ chốt"], "image": null}, {"id": "MCQ18", "type": "mcq", "q": "18. Many students like studying online because it's ___________.", "options": ["harmful", "dependent", "convenient", "time-consuming"], "answer": 2, "explanation": "\"convenient\" = tiện lợi — lý do tích cực hợp ngữ cảnh.", "vi": null, "ipas": null, "vis": ["có hại", "phụ thuộc", "tiện lợi (đúng)", "tốn thời gian"], "image": null}, {"id": "MCQ19", "type": "mcq", "q": "19. India has a ___________ range of cuisines.", "options": ["deep", "large", "big", "vast"], "answer": 3, "explanation": "\"a vast range of\" = một phạm vi/loạt rộng lớn — collocation phổ biến.", "vi": null, "ipas": null, "vis": ["sâu", "lớn", "to (ít trang trọng hơn)", "rộng lớn (đúng, collocation chuẩn)"], "image": null}, {"id": "MCQ20", "type": "mcq", "q": "20. Sushi comes from ___________.", "options": ["The U.S.", "Japan", "Viet Nam", "Australia"], "answer": 1, "explanation": "Sushi có nguồn gốc từ Nhật Bản.", "vi": null, "ipas": null, "vis": ["Mỹ", "Nhật Bản (đúng)", "Việt Nam", "Úc"], "image": null}]}, {"key": "mcq2", "title": "Vocabulary & Grammar (21-30)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ21", "type": "mcq", "q": "21. The dogsled is still used as a ___________ of transport in Alaska today.", "options": ["mean", "way", "means", "method"], "answer": 2, "explanation": "\"a means of transport\" = một phương tiện giao thông (means không đổi dạng số ít/nhiều).", "vi": null, "ipas": null, "vis": ["sai chính tả", "cách thức (ít hợp collocation)", "phương tiện (đúng)", "phương pháp"], "image": null}, {"id": "MCQ22", "type": "mcq", "q": "22. The traditional craft of the villagers is ___________ bamboo baskets.", "options": ["weaving", "knitting", "carving", "moulding"], "answer": 0, "explanation": "\"weaving baskets\" = đan/dệt rổ (từ tre).", "vi": null, "ipas": null, "vis": ["đan, dệt (đúng)", "đan len", "chạm khắc", "đúc khuôn"], "image": null}, {"id": "MCQ23", "type": "mcq", "q": "23. Sticking out one's ___________ was a way of greeting in traditional Tibetan culture.", "options": ["lips", "throat", "mouth", "tongue"], "answer": 3, "explanation": "\"stick out one's tongue\" = thè lưỡi — cách chào truyền thống ở Tây Tạng.", "vi": null, "ipas": null, "vis": ["môi", "cổ họng", "miệng", "lưỡi (đúng)"], "image": null}, {"id": "MCQ24", "type": "mcq", "q": "24. Song Hye Kyo comes from South Korea, so her ___________ language is Korean.", "options": ["native", "practical", "modern", "local"], "answer": 0, "explanation": "\"native language\" = tiếng mẹ đẻ.", "vi": null, "ipas": null, "vis": ["bản địa, mẹ đẻ (đúng)", "thực tế", "hiện đại", "địa phương"], "image": null}, {"id": "MCQ25", "type": "mcq", "q": "25. ___________ hands is probably the most common way of greeting around the world.", "options": ["Shook", "Shakes", "Shaking", "Shake"], "answer": 2, "explanation": "Danh động từ làm chủ ngữ của câu → Shaking.", "vi": null, "ipas": null, "vis": ["đã bắt (quá khứ, sai)", "bắt (chia số ít, sai)", "bắt tay (V-ing làm chủ ngữ, đúng)", "bắt (nguyên mẫu, sai)"], "image": null}, {"id": "MCQ26", "type": "mcq", "q": "26. Buying street food is a common ___________ in our country.", "options": ["kind", "practice", "mode", "type"], "answer": 1, "explanation": "\"a common practice\" = một thông lệ/thói quen phổ biến.", "vi": null, "ipas": null, "vis": ["loại", "thông lệ (đúng)", "chế độ, phương thức", "kiểu"], "image": null}, {"id": "MCQ27", "type": "mcq", "q": "27. Are there any ___________ of modern technology on lifestyles?", "options": ["ways", "sides", "impact", "impacts"], "answer": 3, "explanation": "Sau \"any\" và \"of\" cần DANH TỪ SỐ NHIỀU → impacts (những tác động).", "vi": null, "ipas": null, "vis": ["cách thức", "mặt, phía", "ảnh hưởng (số ít, sai)", "ảnh hưởng (số nhiều, đúng)"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "28. Will online learning ___________ our IT skills? - Yes, it will.", "options": ["improve", "improves", "improving", "improved"], "answer": 0, "explanation": "Sau trợ động từ \"Will\" cần ĐỘNG TỪ NGUYÊN MẪU → improve.", "vi": null, "ipas": null, "vis": ["cải thiện (nguyên mẫu, đúng)", "chia số ít, sai", "V-ing, sai", "quá khứ, sai"], "image": null}, {"id": "MCQ29", "type": "mcq", "q": "29. If I have enough money, I ____________ a new smartphone.", "options": ["will buy", "buy", "to buy", "buying"], "answer": 0, "explanation": "Câu điều kiện loại 1: mệnh đề chính dùng tương lai đơn → will buy.", "vi": null, "ipas": null, "vis": ["sẽ mua (đúng)", "mua (hiện tại, sai)", "to-V, sai", "V-ing, sai"], "image": null}, {"id": "MCQ30", "type": "mcq", "q": "30. I ____________ the party tomorrow.", "options": ["attend", "attends", "will attend", "attending"], "answer": 2, "explanation": "Dấu hiệu \"tomorrow\" → thì tương lai đơn: will attend.", "vi": null, "ipas": null, "vis": ["hiện tại đơn, sai", "chia số ít, sai", "sẽ tham dự (đúng)", "V-ing, sai"], "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "1. I had a great _____________ skydiving for the first time last weekend. (experiential)", "answer": "experience", "explanation": "Sau \"a great\" cần DANH TỪ → experience (một trải nghiệm), không phải tính từ \"experiential\".", "vi": "Tôi đã có một trải nghiệm tuyệt vời khi nhảy dù lần đầu tiên cuối tuần trước."}, {"id": "WF2", "type": "fill", "q": "2. After finishing college, I moved to a new city and learned to be more __________, managing my own budget and making my own decisions. (depend)", "answer": "independent", "explanation": "Sau \"be more\" cần TÍNH TỪ → independent (độc lập).", "vi": "Sau khi tốt nghiệp đại học, tôi chuyển đến thành phố mới và học cách độc lập hơn, tự quản lý ngân sách và tự đưa ra quyết định."}, {"id": "WF3", "type": "fill", "q": "3. It's important to _____________ a healthy lifestyle by exercising regularly and eating a balanced diet. (maintenance)", "answer": "maintain", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → maintain, không phải danh từ \"maintenance\".", "vi": "Điều quan trọng là duy trì lối sống lành mạnh bằng cách tập thể dục đều đặn và ăn uống cân bằng."}, {"id": "WF4", "type": "fill", "q": "4. Some cultures have a tradition of leading a _______ lifestyle, moving from place to place to find food and water sources. (nomad)", "answer": "nomadic", "explanation": "Bổ nghĩa cho danh từ \"lifestyle\" cần TÍNH TỪ → nomadic (du mục).", "vi": "Một số nền văn hóa có truyền thống sống du mục, di chuyển từ nơi này sang nơi khác để tìm nguồn thức ăn và nước."}, {"id": "WF5", "type": "fill", "q": "5. The government is planning to ________ the old historical sites in the city to attract more tourists and preserve the local heritage. (revival)", "answer": "revive", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → revive (làm sống lại), không phải danh từ \"revival\".", "vi": "Chính phủ đang lên kế hoạch khôi phục các di tích lịch sử cũ trong thành phố để thu hút thêm du khách và bảo tồn di sản địa phương."}, {"id": "WF6", "type": "fill", "q": "6. I am going to visit Da Nang, so can you tell me what the greatest _______ in Da Nang are? (attract)", "answer": "attractions", "explanation": "Sau \"the greatest\" và trước \"are\" (số nhiều) cần DANH TỪ SỐ NHIỀU → attractions (điểm thu hút).", "vi": "Tôi sắp đi Đà Nẵng, bạn có thể cho tôi biết những điểm thu hút lớn nhất ở Đà Nẵng là gì không?"}, {"id": "WF7", "type": "fill", "q": "7. Don't worry about your travelling because the public transport here is convenient and ________. (rely)", "answer": "reliable", "explanation": "Song song với tính từ \"convenient\" cần TÍNH TỪ → reliable (đáng tin cậy).", "vi": "Đừng lo về việc đi lại vì phương tiện công cộng ở đây tiện lợi và đáng tin cậy."}, {"id": "WF8", "type": "fill", "q": "8. Sydney is a metropolitan and ______ city so you have a great variety of things and foods from different countries. (multiculture)", "answer": "multicultural", "explanation": "Song song với tính từ \"metropolitan\", bổ nghĩa cho \"city\" → multicultural (đa văn hóa).", "vi": "Sydney là một thành phố đô thị và đa văn hóa nên bạn có rất nhiều thứ và món ăn đa dạng từ nhiều quốc gia."}, {"id": "WF9", "type": "fill", "q": "9. My aunt lives in one of the most _______ parts in Paris. She is a well-known fashion designer there. (fashion)", "answer": "fashionable", "explanation": "Sau \"the most\" và bổ nghĩa cho \"parts\" cần TÍNH TỪ → fashionable (sành điệu, hợp thời trang).", "vi": "Dì tôi sống ở một trong những khu vực sành điệu nhất Paris. Dì là một nhà thiết kế thời trang nổi tiếng ở đó."}, {"id": "WF10", "type": "fill", "q": "10. The outdoor food markets in Singapore are fun and _________ so when you go there you should try some food there. (afford)", "answer": "affordable", "explanation": "Song song với tính từ \"fun\" cần TÍNH TỪ → affordable (giá cả phải chăng).", "vi": "Các chợ ẩm thực ngoài trời ở Singapore vừa vui vừa có giá phải chăng, vì vậy khi đến đó bạn nên thử một số món ăn."}]}, {"key": "readingA", "title": "A) Cultural differences when travelling abroad", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["plans", "tips", "arguments", "choices"], "answer": 1, "explanation": "\"tips on how to fit in\" = mẹo để hòa nhập.", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["unsafe", "excited", "satisfied", "awkward"], "answer": 3, "explanation": "\"feels awkward\" = cảm thấy lúng túng khi ở nước ngoài.", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["but", "because", "so", "or"], "answer": 1, "explanation": "Ăn mặc quan trọng BỞI VÌ người dân sẽ đánh giá qua trang phục.", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["leave", "make", "bring", "take"], "answer": 0, "explanation": "\"leave your torn jeans at home\" = để quần jean rách ở nhà.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["natural", "advisable", "cautious", "unnecessary"], "answer": 2, "explanation": "\"be cautious about expressing emotions\" = thận trọng khi thể hiện cảm xúc.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["in", "for", "at", "up"], "answer": 0, "explanation": "\"in public\" = ở nơi công cộng.", "vi": null}], "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public."}, {"key": "readingB", "title": "B) Technology and disaster rescue", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["connect", "connecting", "connection", "connector"], "answer": 2, "explanation": "Sau \"the high-speed Internet\" cần DANH TỪ → connection.", "vi": null}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["latest", "last", "later", "late"], "answer": 0, "explanation": "\"the latest news\" = tin tức mới nhất.", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["despite", "because", "thank", "thanks"], "answer": 3, "explanation": "\"thanks to\" = nhờ vào.", "vi": null}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["smoothy", "smoothly", "smooth", "smoother"], "answer": 1, "explanation": "Bổ nghĩa cho động từ \"goes\" cần TRẠNG TỪ → smoothly.", "vi": null}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["by", "with", "between", "from"], "answer": 2, "explanation": "\"communication between A and B\" = sự giao tiếp giữa A và B.", "vi": null}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["convenient", "inconvenient", "convenience", "inconvenience"], "answer": 0, "explanation": "Sau \"much more\" cần TÍNH TỪ → convenient.", "vi": null}], "passage": "Nowadays, with the high-speed Internet ___(1)___, people can quickly update the ___(2)___ news on the coming natural disasters in their neighborhood. For example, last year many flood victims in Da Nang were rescued from deep flooded areas ___(3)___ to the short videos and images of where they got stuck they posted on social networks like Facebook or TikTok. In addition, the collaborative work on storm and flood prevention between departments goes ___(4)___ because they can have video conferences to guide and evacuate locals from dangerous areas. In the future, the communication ___(5)___ people and the rescue teams might be much more ___(6)___ when telepathy technology has a breakthrough."}, {"key": "tfA", "title": "Life in the big city", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "1. There are countless job opportunities and activities in big cities.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"There are countless job opportunities and activities to occupy your time\" → Đúng.", "vi": null}, {"id": "TFA2", "type": "mcq", "q": "2. People living in big cities always find jobs easily because there are many job opportunities.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: nhiều việc làm nhưng cũng nhiều người cạnh tranh, vẫn có thể thất nghiệp → Sai.", "vi": null}, {"id": "TFA3", "type": "mcq", "q": "3. The cost of living is usually higher in big cities than in small towns.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"the cost of living is typically higher in big cities\" → Đúng.", "vi": null}, {"id": "TFA4", "type": "mcq", "q": "4. Heavy traffic in big cities contributes to pollution and affects people's health.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Heavy traffic also contributes to pollution... our health is affected...\" → Đúng.", "vi": null}, {"id": "TFA5", "type": "mcq", "q": "5. What does the phrase \"cost an arm and a leg\" mean?", "options": ["your legs and arms have good value", "cost a small amount of money", "you must work hard to earn money", "cost a lot of money"], "answer": 3, "explanation": "\"cost an arm and a leg\" = rất đắt đỏ (thành ngữ).", "vi": null}, {"id": "TFA6", "type": "mcq", "q": "6. According to the paragraph, city is not a perfect place for ____________.", "options": ["extroverted people", "introverted people", "people who hate driving in traffic", "people who prefer a busy life"], "answer": 2, "explanation": "Bài đọc: \"If you hate driving in traffic, then the big city life is not for you.\"", "vi": null}], "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"key": "tfB", "title": "Mongolian nomadic lifestyle", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFB1", "type": "mcq", "q": "1. Mongolians have lived in rural areas and moved to search for new grassland for their cattle for 3,000 years.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland...\" → Đúng.", "vi": null}, {"id": "TFB2", "type": "mcq", "q": "2. About half of Mongolia's population lives in gers and moves their camping equipment several times a year.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"about half of Mongolia's population is living in the ger and moving their camping equipment several times a year\" → Đúng.", "vi": null}, {"id": "TFB3", "type": "mcq", "q": "3. In winter, Mongolian nomads mainly eat milk products from their sheep and goats.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: mùa đông họ sống chủ yếu bằng THỊT NGỰA, sữa là vào mùa hè → Sai.", "vi": null}, {"id": "TFB4", "type": "mcq", "q": "4. Technology has brought some changes to the traditional Mongolian nomadic lifestyle.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable\" → Đúng.", "vi": null}, {"id": "TFB5", "type": "mcq", "q": "5. What is the Mongolian's main food in winter?", "options": ["horse meat", "sheep meat", "goat meat", "airag"], "answer": 0, "explanation": "Bài đọc: \"they stay indoors and survive on horse meat\".", "vi": null}, {"id": "TFB6", "type": "mcq", "q": "6. Today, Mongolian nomads _______.", "options": ["use solar energy to power electronic devices", "don't lead their lifestyles as herders any more", "use ox carts to move their homes", "have the advantage of city life"], "answer": 0, "explanation": "Bài đọc: \"The nomads use solar energy to power TV sets and mobile phones.\"", "vi": null}], "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"key": "transform0", "title": "Sentence Transformation (Part 1)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "Turn off all the lights and you will not pay more money.", "starter": "If", "answer": "you turn off all the lights, you will not pay more money", "accepted": null, "explanation": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V", "vi": "Nếu bạn tắt hết đèn, bạn sẽ không phải trả nhiều tiền hơn.", "note": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V"}, {"id": "TR2", "type": "sentence", "q": "Unless she wears warm clothes, she will have a cold.", "starter": "If", "answer": "she doesn't wear warm clothes, she will have a cold", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu cô ấy không mặc ấm, cô ấy sẽ bị cảm lạnh.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"id": "TR3", "type": "sentence", "q": "Be careful or you may have an accident.", "starter": "If", "answer": "you aren't careful, you may have an accident", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không cẩn thận, bạn có thể gặp tai nạn.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "TR4", "type": "sentence", "q": "Phone your parents or you have a trouble.", "starter": "If", "answer": "you don't phone your parents, you will have trouble", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không gọi điện cho bố mẹ, bạn sẽ gặp rắc rối.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "TR5", "type": "sentence", "q": "Unless she whispers, everyone knows what she is saying.", "starter": "If", "answer": "she doesn't whisper, everyone will know what she is saying", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu cô ấy không thì thầm, mọi người sẽ biết cô ấy đang nói gì.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"id": "TR6", "type": "sentence", "q": "Stay here and you will feel safe.", "starter": "If", "answer": "you stay here, you will feel safe", "accepted": null, "explanation": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V", "vi": "Nếu bạn ở lại đây, bạn sẽ cảm thấy an toàn.", "note": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V"}, {"id": "TR7", "type": "sentence", "q": "Pay the electricity bill today or your electricity will be cut off.", "starter": "If", "answer": "you don't pay the electricity bill today, your electricity will be cut off", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không trả tiền điện hôm nay, điện của bạn sẽ bị cắt.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "TR8", "type": "sentence", "q": "Stop smoking otherwise your cough may be worse.", "starter": "If", "answer": "you don't stop smoking, your cough may be worse", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không bỏ hút thuốc, cơn ho của bạn có thể nặng hơn.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "TR9", "type": "sentence", "q": "Unless we use less fossil fuel, they will be run out soon.", "starter": "If", "answer": "we don't use less fossil fuel, they will run out soon", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu chúng ta không giảm dùng nhiên liệu hóa thạch, chúng sẽ cạn kiệt sớm.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"id": "TR10", "type": "sentence", "q": "Unless it stops raining today, we may be faced with a serious flood.", "starter": "If", "answer": "it doesn't stop raining today, we may be faced with a serious flood", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu trời không ngừng mưa hôm nay, chúng ta có thể phải đối mặt với lũ lụt nghiêm trọng.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}]}, {"key": "transform1", "title": "Sentence Transformation (Part 2)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR11", "type": "sentence", "q": "If they don't practise a lot, they will lose the game.", "starter": "Unless", "answer": "they practise a lot, they will lose the game", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi họ luyện tập nhiều, họ sẽ thua trận đấu.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"id": "TR12", "type": "sentence", "q": "I'll miss the train if I don't go now.", "starter": "Unless", "answer": "I go now, I'll miss the train", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi tôi đi ngay bây giờ, tôi sẽ lỡ chuyến tàu.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"id": "TR13", "type": "sentence", "q": "If she doesn't answer the phone, leave her a message.", "starter": "Unless", "answer": "she answers the phone, leave her a message", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi cô ấy trả lời điện thoại, hãy để lại lời nhắn cho cô ấy.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"id": "TR14", "type": "sentence", "q": "If you don't pay the bill, I'll call the police.", "starter": "Unless", "answer": "you pay the bill, I'll call the police", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi bạn trả hóa đơn, tôi sẽ gọi cảnh sát.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"id": "TR15", "type": "sentence", "q": "If he doesn't work hard, he won't pass the examination.", "starter": "Unless", "answer": "he works hard, he won't pass the examination", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi cậu ấy học chăm chỉ, cậu ấy sẽ không đỗ kỳ thi.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"pastime\"] A. What started as a simple hobby of making handmade jewelry quickly turned into a _______________ for the young artist.", "answer": "profitable pastime", "explanation": "Dựa vào ví dụ: profitable pastime.", "vi": "Điều bắt đầu như một sở thích đơn giản làm trang sức thủ công đã nhanh chóng trở thành thú vui sinh lời cho nghệ sĩ trẻ này."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"pastime\"] B. Going camping on weekends is a _______________ among young adults who love nature.", "answer": "popular pastime", "explanation": "Dựa vào ví dụ: popular pastime.", "vi": "Đi cắm trại vào cuối tuần là một thú vui phổ biến trong giới trẻ yêu thiên nhiên."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"picturesque\"] 3. Many visitors enjoy walking around and taking photos of the ______________ in the old quarter.", "answer": "picturesque streets", "explanation": "Dựa vào ví dụ: picturesque streets.", "vi": "Nhiều du khách thích đi dạo và chụp ảnh những con phố đẹp như tranh trong khu phố cổ."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"picturesque\"] 4. We spent our weekend in a _________________ surrounded by green hills and fresh air.", "answer": "picturesque cottage", "explanation": "Dựa vào ví dụ: picturesque cottage.", "vi": "Chúng tôi nghỉ cuối tuần trong một ngôi nhà tranh đẹp như tranh, bao quanh bởi đồi xanh và không khí trong lành."}]}, {"key": "pictures", "title": "Pictures & Signs", "emoji": "🚦", "vi": "Biển báo", "items": [{"id": "PIC1", "type": "mcq", "q": "1. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">💳🚫💵</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">CARD / DIGITAL PAYMENT ONLY</p></div>", "options": ["You must have the exact amount of cash to buy things.", "Only cash payments are allowed at this store.", "This place accepts card or digital payments, not cash.", "You can pay with cash or a credit card here."], "answer": 2, "explanation": "Biểu tượng thẻ + gạch chéo tiền mặt → chỉ nhận thanh toán thẻ/kỹ thuật số.", "vi": null}, {"id": "PIC2", "type": "mcq", "q": "2. What does this notice tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">📱🔇</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">PHONE ON SILENT MODE</p></div>", "options": ["You cannot bring your phone inside this building.", "You can listen to loud music through your phone speaker.", "You should keep your mobile phone on silent mode.", "You are allowed to talk loudly on your phone."], "answer": 2, "explanation": "Biểu tượng điện thoại + loa gạch chéo → yêu cầu để chế độ im lặng.", "vi": null}, {"id": "PIC3", "type": "mcq", "q": "3. What does this sign tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫⛏️🌳</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">TREE PLANTING ZONE — DO NOT DIG</p></div>", "options": ["You must use heavy machinery to remove trees.", "You should not cut down any big plants here.", "You should plant new green trees in this area.", "You should not dig up the ground in this area."], "answer": 3, "explanation": "Biển \"Tree planting zone — Do not dig\" → khu vực trồng cây, cấm đào xới.", "vi": null}, {"id": "PIC4", "type": "mcq", "q": "4. What does this notification from the school library mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-rose-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫💻🔇</div><p class=\"text-[11px] font-black text-center text-rose-700 leading-tight\">NO COMPUTERS — SILENT STUDY AREA</p></div>", "options": ["You can return or check out reference books.", "You are allowed to talk quietly with your peers.", "You cannot use the computer devices at this time.", "You can read newspapers loudly with your friends."], "answer": 2, "explanation": "Biển \"No computers — Silent study area\" → không dùng máy tính trong khu vực học im lặng.", "vi": null}]}], "total": 107, "examPapers": [[{"id": "MCQ2", "type": "mcq", "q": "2. We need to find some other _______ of transportation.", "options": ["means", "styles", "cuisines", "leisure"], "answer": 0, "explanation": "\"means of transportation\" = phương tiện giao thông.", "vi": null, "ipas": null, "vis": ["phương tiện (đúng)", "kiểu, phong cách", "ẩm thực", "sự nhàn rỗi"], "image": null}, {"id": "TFA5", "type": "mcq", "q": "5. What does the phrase \"cost an arm and a leg\" mean?", "options": ["your legs and arms have good value", "cost a small amount of money", "you must work hard to earn money", "cost a lot of money"], "answer": 3, "explanation": "\"cost an arm and a leg\" = rất đắt đỏ (thành ngữ).", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "PIC3", "type": "mcq", "q": "3. What does this sign tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫⛏️🌳</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">TREE PLANTING ZONE — DO NOT DIG</p></div>", "options": ["You must use heavy machinery to remove trees.", "You should not cut down any big plants here.", "You should plant new green trees in this area.", "You should not dig up the ground in this area."], "answer": 3, "explanation": "Biển \"Tree planting zone — Do not dig\" → khu vực trồng cây, cấm đào xới.", "vi": null}, {"id": "PRON3", "type": "mcq", "q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["express", "precious", "present", "celebrate"], "answer": 0, "explanation": "\"express\" có \"e\" đầu phát âm /ɪ/, ba từ còn lại phát âm /e/.", "vi": null, "ipas": ["/ɪkˈspres/", "/ˈpreʃəs/", "/ˈpreznt/", "/ˈselɪbreɪt/"], "vis": ["diễn đạt, thể hiện", "quý giá", "hiện tại, món quà", "kỷ niệm"], "image": null}, {"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["breakfast", "brief", "bright", "climb"], "answer": 3, "explanation": "\"climb\" có \"b\" câm (không phát âm), khác biệt với cách phát âm của các từ còn lại.", "vi": null, "ipas": ["/ˈbrekfəst/", "/briːf/", "/braɪt/", "/klaɪm/"], "vis": ["bữa sáng", "ngắn gọn", "sáng, tươi sáng", "leo, trèo"], "image": null}, {"id": "MCQ11", "type": "mcq", "q": "11. If it _______ convenient, let's go out for dinner tonight.", "options": ["be", "is", "was", "were"], "answer": 1, "explanation": "Câu điều kiện loại 1: mệnh đề If dùng thì hiện tại đơn → is.", "vi": null, "ipas": null, "vis": ["nguyên mẫu (sai)", "hiện tại đơn (đúng)", "quá khứ (sai)", "quá khứ, giả định (sai)"], "image": null}, {"id": "TFB4", "type": "mcq", "q": "4. Technology has brought some changes to the traditional Mongolian nomadic lifestyle.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable\" → Đúng.", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "TR15", "type": "sentence", "q": "If he doesn't work hard, he won't pass the examination.", "starter": "Unless", "answer": "he works hard, he won't pass the examination", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi cậu ấy học chăm chỉ, cậu ấy sẽ không đỗ kỳ thi.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["but", "because", "so", "or"], "answer": 1, "explanation": "Ăn mặc quan trọng BỞI VÌ người dân sẽ đánh giá qua trang phục.", "vi": null, "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public."}, {"id": "TFB2", "type": "mcq", "q": "2. About half of Mongolia's population lives in gers and moves their camping equipment several times a year.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"about half of Mongolia's population is living in the ger and moving their camping equipment several times a year\" → Đúng.", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "WF1", "type": "fill", "q": "1. I had a great _____________ skydiving for the first time last weekend. (experiential)", "answer": "experience", "explanation": "Sau \"a great\" cần DANH TỪ → experience (một trải nghiệm), không phải tính từ \"experiential\".", "vi": "Tôi đã có một trải nghiệm tuyệt vời khi nhảy dù lần đầu tiên cuối tuần trước."}, {"id": "PRON9", "type": "mcq", "q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["precious", "serve", "technology", "resident"], "answer": 1, "explanation": "\"serve\" có \"er\" phát âm /ɜːr/, ba từ còn lại có \"e\" phát âm /e/.", "vi": null, "ipas": ["/ˈpreʃəs/", "/sɜːrv/", "/tekˈnɒlədʒi/", "/ˈrezɪdənt/"], "vis": ["quý giá", "phục vụ", "công nghệ", "cư dân"], "image": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["leave", "make", "bring", "take"], "answer": 0, "explanation": "\"leave your torn jeans at home\" = để quần jean rách ở nhà.", "vi": null, "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public."}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["unsafe", "excited", "satisfied", "awkward"], "answer": 3, "explanation": "\"feels awkward\" = cảm thấy lúng túng khi ở nước ngoài.", "vi": null, "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public."}, {"id": "PRON8", "type": "mcq", "q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["hold", "improve", "nomad", "notice"], "answer": 1, "explanation": "\"improve\" có \"o\" phát âm /uː/, ba từ còn lại phát âm /oʊ/.", "vi": null, "ipas": ["/hoʊld/", "/ɪmˈpruːv/", "/ˈnoʊmæd/", "/ˈnoʊtɪs/"], "vis": ["giữ, cầm", "cải thiện", "người du mục", "chú ý"], "image": null}, {"id": "TR12", "type": "sentence", "q": "I'll miss the train if I don't go now.", "starter": "Unless", "answer": "I go now, I'll miss the train", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi tôi đi ngay bây giờ, tôi sẽ lỡ chuyến tàu.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"id": "MCQ30", "type": "mcq", "q": "30. I ____________ the party tomorrow.", "options": ["attend", "attends", "will attend", "attending"], "answer": 2, to be a victim of a crime living in a big city than in a small town."}, {"id": "TR8", "type": "sentence", "q": "Stop smoking otherwise your cough may be worse.", "starter": "If", "answer": "you don't stop smoking, your cough may be worse", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không bỏ hút thuốc, cơn ho của bạn có thể nặng hơn.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "MCQ19", "type": "mcq", "q": "19. India has a ___________ range of cuisines.", "options": ["deep", "large", "big", "vast"], "answer": 3, "explanation": "\"a vast range of\" = một phạm vi/loạt rộng lớn — collocation phổ biến.", "vi": null, "ipas": null, "vis": ["sâu", "lớn", "to (ít trang trọng hơn)", "rộng lớn (đúng, collocation chuẩn)"], "image": null}, {"id": "TFA2", "type": "mcq", "q": "2. People living in big cities always find jobs easily because there are many job opportunities.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: nhiều việc làm nhưng cũng nhiều người cạnh tranh, vẫn có thể thất nghiệp → Sai.", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "TFB3", "type": "mcq", "q": "3. In winter, Mongolian nomads mainly eat milk products from their sheep and goats.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: mùa đông họ sống chủ yếu bằng THỊT NGỰA, sữa là vào mùa hè → Sai.", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "TR6", "type": "sentence", "q": "Stay here and you will feel safe.", "starter": "If", "answer": "you stay here, you will feel safe", "accepted": null, "explanation": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V", "vi": "Nếu bạn ở lại đây, bạn sẽ cảm thấy an toàn.", "note": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V"}, {"id": "WF4", "type": "fill", "q": "4. Some cultures have a tradition of leading a _______ lifestyle, moving from place to place to find food and water sources. (nomad)", "answer": "nomadic", "explanation": "Bổ nghĩa cho danh từ \"lifestyle\" cần TÍNH TỪ → nomadic (du mục).", "vi": "Một số nền văn hóa có truyền thống sống du mục, di chuyển từ nơi này sang nơi khác để tìm nguồn thức ăn và nước."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"pastime\"] B. Going camping on weekends is a _______________ among young adults who love nature.", "answer": "popular pastime", "explanation": "Dựa vào ví dụ: popular pastime.", "vi": "Đi cắm trại vào cuối tuần là một thú vui phổ biến trong giới trẻ yêu thiên nhiên."}, {"id": "TR3", "type": "sentence", "q": "Be careful or you may have an accident.", "starter": "If", "answer": "you aren't careful, you may have an accident", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không cẩn thận, bạn có thể gặp tai nạn.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "WF3", "type": "fill", "q": "3. It's important to _____________ a healthy lifestyle by exercising regularly and eating a balanced diet. (maintenance)", "answer": "maintain", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → maintain, không phải danh từ \"maintenance\".", "vi": "Điều quan trọng là duy trì lối sống lành mạnh bằng cách tập thể dục đều đặn và ăn uống cân bằng."}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["online", "offline", "musher", "igloo"], "answer": 1, "explanation": "\"offline\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌɒnˈlaɪn/", "/ˌɒfˈlaɪn/", "/ˈmʌʃər/", "/ˈɪɡluː/"], "vis": ["trực tuyến", "trực tiếp, ngoại tuyến", "người điều khiển xe chó kéo", "lều tuyết"], "image": null}, {"id": "PIC2", "type": "mcq", "q": "2. What does this notice tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">📱🔇</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">PHONE ON SILENT MODE</p></div>", "options": ["You cannot bring your phone inside this building.", "You can listen to loud music through your phone speaker.", "You should keep your mobile phone on silent mode.", "You are allowed to talk loudly on your phone."], "answer": 2, "explanation": "Biểu tượng điện thoại + loa gạch chéo → yêu cầu để chế độ im lặng.", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["despite", "because", "thank", "thanks"], "answer": 3, "explanation": "\"thanks to\" = nhờ vào.", "vi": null, "passage": "Nowadays, with the high-speed Internet ___(1)___, people can quickly update the ___(2)___ news on the coming natural disasters in their neighborhood. For example, last year many flood victims in Da Nang were rescued from deep flooded areas ___(3)___ to the short videos and images of where they got stuck they posted on social networks like Facebook or TikTok. In addition, the collaborative work on storm and flood prevention between departments goes ___(4)___ because they can have video conferences to guide and evacuate locals from dangerous areas. In the future, the communication ___(5)___ people and the rescue teams might be much more ___(6)___ when telepathy technology has a breakthrough."}, {"id": "MCQ23", "type": "mcq", "q": "23. Sticking out
