ght be much more ___(6)___ when telepathy technology has a breakthrough."}, {"id": "WF8", "type": "fill", "q": "8. Sydney is a metropolitan and ______ city so you have a great variety of things and foods from different countries. (multiculture)", "answer": "multicultural", "explanation": "Song song với tính từ \"metropolitan\", bổ nghĩa cho \"city\" → multicultural (đa văn hóa).", "vi": "Sydney là một thành phố đô thị và đa văn hóa nên bạn có rất nhiều thứ và món ăn đa dạng từ nhiều quốc gia."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"picturesque\"] 4. We spent our weekend in a _________________ surrounded by green hills and fresh air.", "answer": "picturesque cottage", "explanation": "Dựa vào ví dụ: picturesque cottage.", "vi": "Chúng tôi nghỉ cuối tuần trong một ngôi nhà tranh đẹp như tranh, bao quanh bởi đồi xanh và không khí trong lành."}, {"id": "TR4", "type": "sentence", "q": "Phone your parents or you have a trouble.", "starter": "If", "answer": "you don't phone your parents, you will have trouble", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không gọi điện cho bố mẹ, bạn sẽ gặp rắc rối.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["but", "because", "so", "or"], "answer": 1, "explanation": "Ăn mặc quan trọng BỞI VÌ người dân sẽ đánh giá qua trang phục.", "vi": null, "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public."}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["connect", "connecting", "connection", "connector"], "answer": 2, "explanation": "Sau \"the high-speed Internet\" cần DANH TỪ → connection.", "vi": null, "passage": "Nowadays, with the high-speed Internet ___(1)___, people can quickly update the ___(2)___ news on the coming natural disasters in their neighborhood. For example, last year many flood victims in Da Nang were rescued from deep flooded areas ___(3)___ to the short videos and images of where they got stuck they posted on social networks like Facebook or TikTok. In addition, the collaborative work on storm and flood prevention between departments goes ___(4)___ because they can have video conferences to guide and evacuate locals from dangerous areas. In the future, the communication ___(5)___ people and the rescue teams might be much more ___(6)___ when telepathy technology has a breakthrough."}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["unsafe", "excited", "satisfied", "awkward"], "answer": 3, "explanation": "\"feels awkward\" = cảm thấy lúng túng khi ở nước ngoài.", "vi": null, "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public."}, {"id": "TR10", "type": "sentence", "q": "Unless it stops raining today, we may be faced with a serious flood.", "starter": "If", "answer": "it doesn't stop raining today, we may be faced with a serious flood", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu trời không ngừng mưa hôm nay, chúng ta có thể phải đối mặt với lũ lụt nghiêm trọng.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"id": "MCQ26", "type": "mcq", "q": "26. Buying street food is a common ___________ in our country.", "options": ["kind", "practice", "mode", "type"], "answer": 1, "explanation": "\"a common practice\" = một thông lệ/thói quen phổ biến.", "vi": null, "ipas": null, "vis": ["loại", "thông lệ (đúng)", "chế độ, phương thức", "kiểu"], "image": null}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"picturesque\"] 3. Many visitors enjoy walking around and taking photos of the ______________ in the old quarter.", "answer": "picturesque streets", "explanation": "Dựa vào ví dụ: picturesque streets.", "vi": "Nhiều du khách thích đi dạo và chụp ảnh những con phố đẹp như tranh trong khu phố cổ."}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["balance", "base", "artisan", "practice"], "answer": 1, "explanation": "\"base\" có \"a\" phát âm /eɪ/, ba từ còn lại phát âm /æ/ hoặc /ɑː/.", "vi": null, "ipas": ["/ˈbæləns/", "/beɪs/", "/ˈɑːrtɪzən/", "/ˈpræktɪs/"], "vis": ["sự cân bằng", "nền tảng, cơ sở", "nghệ nhân", "thực hành"], "image": null}, {"id": "MCQ27", "type": "mcq", "q": "27. Are there any ___________ of modern technology on lifestyles?", "options": ["ways", "sides", "impact", "impacts"], "answer": 3, "explanation": "Sau \"any\" và \"of\" cần DANH TỪ SỐ NHIỀU → impacts (những tác động).", "vi": null, "ipas": null, "vis": ["cách thức", "mặt, phía", "ảnh hưởng (số ít, sai)", "ảnh hưởng (số nhiều, đúng)"], "image": null}, {"id": "WF6", "type": "fill", "q": "6. I am going to visit Da Nang, so can you tell me what the greatest _______ in Da Nang are? (attract)", "answer": "attractions", "explanation": "Sau \"the greatest\" và trước \"are\" (số nhiều) cần DANH TỪ SỐ NHIỀU → attractions (điểm thu hút).", "vi": "Tôi sắp đi Đà Nẵng, bạn có thể cho tôi biết những điểm thu hút lớn nhất ở Đà Nẵng là gì không?"}, {"id": "TFA6", "type": "mcq", "q": "6. According to the paragraph, city is not a perfect place for ____________.", "options": ["extroverted people", "introverted people", "people who hate driving in traffic", "people who prefer a busy life"], "answer": 2, "explanation": "Bài đọc: \"If you hate driving in traffic, then the big city life is not for you.\"", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "MCQ28", "type": "mcq", "q": "28. Will online learning ___________ our IT skills? - Yes, it will.", "options": ["improve", "improves", "improving", "improved"], "answer": 0, "explanation": "Sau trợ động từ \"Will\" cần ĐỘNG TỪ NGUYÊN MẪU → improve.", "vi": null, "ipas": null, "vis": ["cải thiện (nguyên mẫu, đúng)", "chia số ít, sai", "V-ing, sai", "quá khứ, sai"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. In winter, Mongolian nomads mainly eat milk products from their sheep and goats.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: mùa đông họ sống chủ yếu bằng THỊT NGỰA, sữa là vào mùa hè → Sai.", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["greet", "weave", "each", "head"], "answer": 3, "explanation": "\"head\" có \"ea\" phát âm /e/, ba từ còn lại phát âm /iː/.", "vi": null, "ipas": ["/ɡriːt/", "/wiːv/", "/iːtʃ/", "/hed/"], "vis": ["chào", "dệt", "mỗi", "đầu"], "image": null}, {"id": "TFA4", "type": "mcq", "q": "4. Heavy traffic in big cities contributes to pollution and affects people's health.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Heavy traffic also contributes to pollution... our health is affected...\" → Đúng.", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "WF7", "type": "fill", "q": "7. Don't worry about your travelling because the public transport here is convenient and ________. (rely)", "answer": "reliable", "explanation": "Song song với tính từ \"convenient\" cần TÍNH TỪ → reliable (đáng tin cậy).", "vi": "Đừng lo về việc đi lại vì phương tiện công cộng ở đây tiện lợi và đáng tin cậy."}, {"id": "MCQ5", "type": "mcq", "q": "5. The 1,100-mile race from Anchorage to Nome allows _____ to drop injured, sick or tired dogs.", "options": ["tribes", "mushers", "waiters", "cuisines"], "answer": 1, "explanation": "\"mushers\" = người điều khiển xe trượt tuyết chó kéo.", "vi": null, "ipas": null, "vis": ["các bộ lạc", "người điều khiển xe chó kéo (đúng)", "người phục vụ", "các nền ẩm thực"], "image": null}, {"id": "TR6", "type": "sentence", "q": "Stay here and you will feel safe.", "starter": "If", "answer": "you stay here, you will feel safe", "accepted": null, "explanation": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V", "vi": "Nếu bạn ở lại đây, bạn sẽ cảm thấy an toàn.", "note": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V"}, {"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["breakfast", "brief", "bright", "climb"], "answer": 3, "explanation": "\"climb\" có \"b\" câm (không phát âm), khác biệt với cách phát âm của các từ còn lại.", "vi": , the collaborative work on storm and flood prevention between departments goes ___(4)___ because they can have video conferences to guide and evacuate locals from dangerous areas. In the future, the communication ___(5)___ people and the rescue teams might be much more ___(6)___ when telepathy technology has a breakthrough."}, {"id": "MCQ21", "type": "mcq", "q": "21. The dogsled is still used as a ___________ of transport in Alaska today.", "options": ["mean", "way", "means", "method"], "answer": 2, "explanation": "\"a means of transport\" = một phương tiện giao thông (means không đổi dạng số ít/nhiều).", "vi": null, "ipas": null, "vis": ["sai chính tả", "cách thức (ít hợp collocation)", "phương tiện (đúng)", "phương pháp"], "image": null}, {"id": "TR11", "type": "sentence", "q": "If they don't practise a lot, they will lose the game.", "starter": "Unless", "answer": "they practise a lot, they will lose the game", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi họ luyện tập nhiều, họ sẽ thua trận đấu.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"id": "MCQ24", "type": "mcq", "q": "24. Song Hye Kyo comes from South Korea, so her ___________ language is Korean.", "options": ["native", "practical", "modern", "local"], "answer": 0, "explanation": "\"native language\" = tiếng mẹ đẻ.", "vi": null, "ipas": null, "vis": ["bản địa, mẹ đẻ (đúng)", "thực tế", "hiện đại", "địa phương"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["adult", "artisan", "avoid", "alive"], "answer": 1, "explanation": "\"artisan\" có \"a\" đầu phát âm /ɑː/, ba từ còn lại phát âm /ə/.", "vi": null, "ipas": ["/ˈædʌlt/", "/ˈɑːrtɪzən/", "/əˈvɔɪd/", "/əˈlaɪv/"], "vis": ["người trưởng thành", "nghệ nhân", "tránh", "còn sống"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. It's a simple _______ to prepare others?", "options": ["healthy", "hurry", "support", "modern"], "answer": 2, "explanation": "\"support\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhelθi/", "/ˈhʌri/", "/səˈpɔːrt/", "/ˈmɒdərn/"], "vis": ["khỏe mạnh", "vội vàng", "ủng hộ, hỗ trợ", "hiện đại"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Which word has a different stress pattern from that of the others?", "options": ["balance", "common", "cuisine", "diet"], "answer": 2, "explanation": "\"cuisine\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbæləns/", "/ˈkɒmən/", "/kwɪˈziːn/", "/ˈdaɪət/"], "vis": ["sự cân bằng", "phổ biến, chung", "ẩm thực", "chế độ ăn"], "image": null}, {"id": "TFA1", "type": "mcq", "q": "1. There are countless job opportunities and activities in big cities.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"There are countless job opportunities and activities to occupy your time\" → Đúng.", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}], [{"id": "TFA3", "type": "mcq", "q": "3. The cost of living is usually higher in big cities than in small towns.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"the cost of living is typically higher in big cities\" → Đúng.", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "WF9", "type": "fill", "q": "9. My aunt lives in one of the most _______ parts in Paris. She is a well-known fashion designer there. (fashion)", "answer": "fashionable", "explanation": "Sau \"the most\" và bổ nghĩa cho \"parts\" cần TÍNH TỪ → fashionable (sành điệu, hợp thời trang).", "vi": "Dì tôi sống ở một trong những khu vực sành điệu nhất Paris. Dì là một nhà thiết kế thời trang nổi tiếng ở đó."}, {"id": "MCQ4", "type": "mcq", "q": "4. The hotel restaurant is known for its excellent French _______.", "options": ["craft", "cuisine", "musher", "dogsled"], "answer": 1, "explanation": "\"cuisine\" = nền ẩm thực — hợp nghĩa với \"French cuisine\".", "vi": null, "ipas": null, "vis": ["thủ công", "ẩm thực (đúng)", "người điều khiển xe chó kéo", "xe trượt tuyết chó kéo"], "image": null}, {"id": "WF2", "type": "fill", "q": "2. After finishing college, I moved to a new city and learned to be more __________, managing my own budget and making my own decisions. (depend)", "answer": "independent", "explanation": "Sau \"be more\" cần TÍNH TỪ → independent (độc lập).", "vi": "Sau khi tốt nghiệp đại học, tôi chuyển đến thành phố mới và học cách độc lập hơn, tự quản lý ngân sách và tự đưa ra quyết định."}, {"id": "TR2", "type": "sentence", "q": "Unless she wears warm clothes, she will have a cold.", "starter": "If", "answer": "she doesn't wear warm clothes, she will have a cold", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu cô ấy không mặc ấm, cô ấy sẽ bị cảm lạnh.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"id": "PIC2", "type": "mcq", "q": "2. What does this notice tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">📱🔇</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">PHONE ON SILENT MODE</p></div>", "options": ["You cannot bring your phone inside this building.", "You can listen to loud music through your phone speaker.", "You should keep your mobile phone on silent mode.", "You are allowed to talk loudly on your phone."], "answer": 2, "explanation": "Biểu tượng điện thoại + loa gạch chéo → yêu cầu để chế độ im lặng.", "vi": null}, {"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["famous", "common", "staple", "avoid"], "answer": 3, "explanation": "\"avoid\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈfeɪməs/", "/ˈkɒmən/", "/ˈsteɪpl/", "/əˈvɔɪd/"], "vis": ["nổi tiếng", "phổ biến, chung", "chủ yếu, thiết yếu", "tránh"], "image": null}, {"id": "MCQ18", "type": "mcq", "q": "18. Many students like studying online because it's ___________.", "options": ["harmful", "dependent", "convenient", "time-consuming"], "answer": 2, "explanation": "\"convenient\" = tiện lợi — lý do tích cực hợp ngữ cảnh.", "vi": null, "ipas": null, "vis": ["có hại", "phụ thuộc", "tiện lợi (đúng)", "tốn thời gian"], "image": null}, {"id": "TFB2", "type": "mcq", "q": "2. About half of Mongolia's population lives in gers and moves their camping equipment several times a year.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"about half of Mongolia's population is living in the ger and moving their camping equipment several times a year\" → Đúng.", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "TFA6", "type": "mcq", "q": "6. According to the paragraph, city is not a perfect place for ____________.", "options": ["extroverted people", "introverted people", "people who hate driving in traffic", "people who prefer a busy life"], "answer": 2, "explanation": "Bài đọc: \"If you hate driving in traffic, then the big city life is not for you.\"", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["leave", "make", "bring", "take"], "answer": 0, "explanation": "\"leave your torn jeans at home\" = để quần jean rách ở nhà.", "vi": null, "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public."}, {"id": "TR7", "type": "sentence", "q": "Pay the electricity bill today or your electricity will be cut off.", "starter": "If", "answer": "you don't pay the electricity bill today, your electricity will be cut off", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không trả tiền điện hôm nay, điện của bạn sẽ bị cắt.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "WF5", "type": "fill", "q": "5. The government is planning to ________ the old historical sites in the city to attract more tourists and preserve the local heritage. (revival)", "answer": "revive", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → revive (làm sống lại), không phải danh từ \"revival\".", "vi": "Chính phủ đang lên kế hoạch khôi phục các di tích lịch sử cũ trong thành phố để thu hút thêm du khách và bảo tồn di sản địa phương."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"pastime\"] B. Going camping on weekends is a _______________ among young adults who love nature.", "answer": "popular pastime", "explanation": "Dựa vào ví dụ: popular pastime.", "vi": "Đi cắm trại vào cuối tuần là một thú vui phổ biến trong giới trẻ yêu thiên nhiên."}, {"id": "TR9", "type": "sentence", "q": "Unless we use less fossil fuel, they will be run out soon.", "starter": "If", "answer": "we don't use less fossil fuel, they will run out soon", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu chúng ta không giảm dùng nhiên liệu hóa thạch, chúng sẽ cạn kiệt sớm.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"picturesque\"] 4. We spent our weekend in a _________________ surrounded by green hills and fresh air.", "answer": "picturesque cottage", "explanation": "Dựa vào ví dụ: picturesque cottage.", "vi": "Chúng tôi nghỉ cuối tuần trong một ngôi nhà tranh đẹp như tranh, bao quanh bởi đồi xanh và không khí trong lành."}, {"id": "TFB4", "type": "mcq", "q": "4. Technology has brought some changes to the traditional Mongolian nomadic lifestyle.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable\" → Đúng.", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["online", "offline", "musher", "igloo"], "answer": 1, "explanation": "\"offline\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌɒnˈlaɪn/", "/ˌɒfˈlaɪn/", "/ˈmʌʃər/", "/ˈɪɡluː/"], "vis": ["trực tuyến", "trực tiếp, ngoại tuyến", "người điều khiển xe chó kéo", "lều tuyết"], "image": null}, {"id": "MCQ21", "type": "mcq", "q": "21. The dogsled is still used as a ___________ of transport in Alaska today.", "options": ["mean", "way", "means", "method"], "answer": 2, "explanation": "\"a means of transport\" = một phương tiện giao thông (means không đổi dạng số ít/nhiều).", "vi": null, "ipas": null, "vis": ["sai chính tả", "cách thức (ít hợp collocation)", "phương tiện (đúng)", "phương pháp"], "image": null}, {"id": "TFA5", "type": "mcq", "q": "5. What does the phrase \"cost an arm and a leg\" mean?", "options": ["your legs and arms have good value", "cost a small amount of money", "you must work hard to earn money", "cost a lot of money"], "answer": 3, "explanation": "\"cost an arm and a leg\" = rất đắt đỏ (thành ngữ).", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["connect", "connecting", "connection", "connector"], "answer": 2, "explanation": "Sau \"the high-speed Internet\" cần DANH TỪ → connection.", "vi": null, "passage": "Nowadays, with the high-speed Internet ___(1)___, people can quickly update the ___(2)___ news on the coming natural disasters in their neighborhood. For example, last year many flood victims in Da Nang were rescued from deep flooded areas ___(3)___ to the short videos and images of where they got stuck they posted on social networks like Facebook or TikTok. In addition, the collaborative work on storm and flood prevention between departments goes ___(4)___ because they can have video conferences to guide and evacuate locals from dangerous areas. In the future, the communication ___(5)___ people and the rescue teams might be much more ___(6)___ when telepathy technology has a breakthrough."}, {"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["plans", "tips", "arguments", "choices"], "answer": 1, "explanation": "\"tips on how to fit in\" = mẹo để hòa nhập.", "vi": null, "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes y 6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["adult", "artisan", "avoid", "alive"], "answer": 1, "explanation": "\"artisan\" có \"a\" đầu phát âm /ɑː/, ba từ còn lại phát âm /ə/.", "vi": null, "ipas": ["/ˈædʌlt/", "/ˈɑːrtɪzən/", "/əˈvɔɪd/", "/əˈlaɪv/"], "vis": ["người trưởng thành", "nghệ nhân", "tránh", "còn sống"], "image": null}], [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"pastime\"] A. What started as a simple hobby of making handmade jewelry quickly turned into a _______________ for the young artist.", "answer": "profitable pastime", "explanation": "Dựa vào ví dụ: profitable pastime.", "vi": "Điều bắt đầu như một sở thích đơn giản làm trang sức thủ công đã nhanh chóng trở thành thú vui sinh lời cho nghệ sĩ trẻ này."}, {"id": "MCQ25", "type": "mcq", "q": "25. ___________ hands is probably the most common way of greeting around the world.", "options": ["Shook", "Shakes", "Shaking", "Shake"], "answer": 2, "explanation": "Danh động từ làm chủ ngữ của câu → Shaking.", "vi": null, "ipas": null, "vis": ["đã bắt (quá khứ, sai)", "bắt (chia số ít, sai)", "bắt tay (V-ing làm chủ ngữ, đúng)", "bắt (nguyên mẫu, sai)"], "image": null}, {"id": "MCQ26", "type": "mcq", "q": "26. Buying street food is a common ___________ in our country.", "options": ["kind", "practice", "mode", "type"], "answer": 1, "explanation": "\"a common practice\" = một thông lệ/thói quen phổ biến.", "vi": null, "ipas": null, "vis": ["loại", "thông lệ (đúng)", "chế độ, phương thức", "kiểu"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["healthy", "hurry", "support", "modern"], "answer": 2, "explanation": "\"support\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhelθi/", "/ˈhʌri/", "/səˈpɔːrt/", "/ˈmɒdərn/"], "vis": ["khỏe mạnh", "vội vàng", "ủng hộ, hỗ trợ", "hiện đại"], "image": null}, {"id": "WF4", "type": "fill", "q": "4. Some cultures have a tradition of leading a _______ lifestyle, moving from place to place to find food and water sources. (nomad)", "answer": "nomadic", "explanation": "Bổ nghĩa cho danh từ \"lifestyle\" cần TÍNH TỪ → nomadic (du mục).", "vi": "Một số nền văn hóa có truyền thống sống du mục, di chuyển từ nơi này sang nơi khác để tìm nguồn thức ăn và nước."}, {"id": "TFA6", "type": "mcq", "q": "6. According to the paragraph, city is not a perfect place for ____________.", "options": ["extroverted people", "introverted people", "people who hate driving in traffic", "people who prefer a busy life"], "answer": 2, "explanation": "Bài đọc: \"If you hate driving in traffic, then the big city life is not for you.\"", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["diet", "furious", "artisan", "greeting"], "answer": 0, "explanation": "\"diet\" có \"i\" phát âm /aɪ/, ba từ còn lại phát âm /i/ hoặc /iː/.", "vi": null, "ipas": ["/ˈdaɪət/", "/ˈfjʊəriəs/", "/ˈɑːrtɪzən/", "/ˈɡriːtɪŋ/"], "vis": ["chế độ ăn", "giận dữ, dữ dội", "nghệ nhân", "lời chào"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. In winter, Mongolian nomads mainly eat milk products from their sheep and goats.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: mùa đông họ sống chủ yếu bằng THỊT NGỰA, sữa là vào mùa hè → Sai.", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "TR5", "type": "sentence", "q": "Unless she whispers, everyone knows what she is saying.", "starter": "If", "answer": "she doesn't whisper, everyone will know what she is saying", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu cô ấy không thì thầm, mọi người sẽ biết cô ấy đang nói gì.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["by", "with", "between", "from"], "answer": 2, "explanation": "\"communication between A and B\" = sự giao tiếp giữa A và B.", "vi": null, "passage": "Nowadays, with the high-speed Internet ___(1)___, people can quickly update the ___(2)___ news on the coming natural disasters in their neighborhood. For example, last year many flood victims in Da Nang were rescued from deep flooded areas ___(3)___ to the short videos and images of where they got stuck they posted on social networks like Facebook or TikTok. In addition, the collaborative work on storm and flood prevention between departments goes ___(4)___ because they can have video conferences to guide and evacuate locals from dangerous areas. In the future, the communication ___(5)___ people and the rescue teams might be much more ___(6)___ when telepathy technology has a breakthrough."}, {"id": "TFB5", "type": "mcq", "q": "5. What is the Mongolian's main food in winter?", "options": ["horse meat", "sheep meat", "goat meat", "airag"], "answer": 0, "explanation": "Bài đọc: \"they stay indoors and survive on horse meat\".", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "MCQ6", "type": "mcq", "q": "6. They share a(n) _______ interest in photography.", "options": ["common", "nomadic", "different", "independent"], "answer": 0, "explanation": "\"common interest\" = sở thích chung.", "vi": null, "ipas": null, "vis": ["chung (đúng)", "du mục", "khác nhau", "độc lập"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "28. Will online learning ___________ our IT skills? - Yes, it will.", "options": ["improve", "improves", "improving", "improved"], "answer": 0, "explanation": "Sau trợ động từ \"Will\" cần ĐỘNG TỪ NGUYÊN MẪU → improve.", "vi": null, "ipas": null, "vis": ["cải thiện (nguyên mẫu, đúng)", "chia số ít, sai", "V-ing, sai", "quá khứ, sai"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. If we meet at 9:00, we ___________ plenty of time to talk.", "options": ["have", "is having", "will have", "had"], "answer": 2, "explanation": "Câu điều kiện loại 1: mệnh đề chính dùng tương lai đơn → will have.", "vi": null, "ipas": null, "vis": ["hiện tại đơn (sai)", "hiện tại tiếp diễn (sai)", "tương lai đơn (đúng)", "quá khứ (sai)"], "image": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["leave", "make", "bring", "take"], "answer": 0, "explanation": "\"leave your torn jeans at home\" = để quần jean rách ở nhà.", "vi": null, "passage": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public."}, {"id": "MCQ2", "type": "mcq", "q": "2. We need to find some other _______ of transportation.", "options": ["means", "styles", "cuisines", "leisure"], "answer": 0, "explanation": "\"means of transportation\" = phương tiện giao thông.", "vi": null, "ipas": null, "vis": ["phương tiện (đúng)", "kiểu, phong cách", "ẩm thực", "sự nhàn rỗi"], "image": null}, {"id": "TR7", "type": "sentence", "q": "Pay the electricity bill today or your electricity will be cut off.", "starter": "If", "answer": "you don't pay the electricity bill today, your electricity will be cut off", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không trả tiền điện hôm nay, điện của bạn sẽ bị cắt.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["connect", "connecting", "connection", "connector"], "answer": 2, "explanation": "Sau \"the high-speed Internet\" cần DANH TỪ → connection.", "vi": null, "passage": "Nowadays, with the high-speed Internet ___(1)___, people can quickly update the ___(2)___ news on the coming natural disasters in their neighborhood. For example, last year many flood victims in Da Nang were rescued from deep flooded areas ___(3)___ to the short videos and images of where they got stuck they posted on social networks like Facebook or TikTok. In addition, the collaborative work on storm and flood prevention between departments goes ___(4)___ because they can have video conferences to guide and evacuate locals from dangerous areas. In the future, the communication ___(5)___ people and the rescue teams might be much more ___(6)___ when telepathy technology has a breakthrough."}, {"id": "TR9", "type": "sentence", "q": "Unless we use less fossil fuel, they will be run out soon.", "starter": "If", "answer": "we don't use less fossil fuel, they will run out soon", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu chúng ta không giảm dùng nhiên liệu hóa thạch, chúng sẽ cạn kiệt sớm.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"id": "WF5", "type": "fill", "q": "5. The government is planning to ________ the old historical sites in the city to attract more tourists and preserve the local heritage. (revival)", "answer": "revive", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → revive (làm sống lại), không phải danh từ \"revival\".", "vi": "Chính phủ đang lên kế hoạch khôi phục các di tích lịch sử cũ trong thành phố để thu hút thêm du khách và bảo tồn di sản địa phương."}, {"id": "TFA2", "type": "mcq", "q": "2. People living in big cities always find jobs easily because there are many job opportunities.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: nhiều việc làm nhưng cũng nhiều người cạnh tranh, vẫn có thể thất nghiệp → Sai.", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people compe vi": null, "ipas": ["/ˈbæləns/", "/beɪs/", "/ˈɑːrtɪzən/", "/ˈpræktɪs/"], "vis": ["sự cân bằng", "nền tảng, cơ sở", "nghệ nhân", "thực hành"], "image": null}, {"id": "TFA1", "type": "mcq", "q": "1. There are countless job opportunities and activities in big cities.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"There are countless job opportunities and activities to occupy your time\" → Đúng.", "vi": null, "passage": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town."}, {"id": "TR1", "type": "sentence", "q": "Turn off all the lights and you will not pay more money.", "starter": "If", "answer": "you turn off all the lights, you will not pay more money", "accepted": null, "explanation": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V", "vi": "Nếu bạn tắt hết đèn, bạn sẽ không phải trả nhiều tiền hơn.", "note": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V"}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["improve", "habit", "native", "famous"], "answer": 0, "explanation": "\"improve\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ɪmˈpruːv/", "/ˈhæbɪt/", "/ˈneɪtɪv/", "/ˈfeɪməs/"], "vis": ["cải thiện", "thói quen", "bản địa, bẩm sinh", "nổi tiếng"], "image": null}, {"id": "MCQ4", "type": "mcq", "q": "4. The hotel restaurant is known for its excellent French _______.", "options": ["craft", "cuisine", "musher", "dogsled"], "answer": 1, "explanation": "\"cuisine\" = nền ẩm thực — hợp nghĩa với \"French cuisine\".", "vi": null, "ipas": null, "vis": ["thủ công", "ẩm thực (đúng)", "người điều khiển xe chó kéo", "xe trượt tuyết chó kéo"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. The Aborigines are the _______ inhabitants of Australia.", "options": ["unusual", "unique", "traditional", "native"], "answer": 3, "explanation": "\"native inhabitants\" = cư dân bản địa.", "vi": null, "ipas": null, "vis": ["khác thường", "độc đáo, duy nhất", "truyền thống", "bản địa (đúng)"], "image": null}, {"id": "WF7", "type": "fill", "q": "7. Don't worry about your travelling because the public transport here is convenient and ________. (rely)", "answer": "reliable", "explanation": "Song song với tính từ \"convenient\" cần TÍNH TỪ → reliable (đáng tin cậy).", "vi": "Đừng lo về việc đi lại vì phương tiện công cộng ở đây tiện lợi và đáng tin cậy."}, {"id": "TR14", "type": "sentence", "q": "If you don't pay the bill, I'll call the police.", "starter": "Unless", "answer": "you pay the bill, I'll call the police", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi bạn trả hóa đơn, tôi sẽ gọi cảnh sát.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"id": "TFB2", "type": "mcq", "q": "2. About half of Mongolia's population lives in gers and moves their camping equipment several times a year.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"about half of Mongolia's population is living in the ger and moving their camping equipment several times a year\" → Đúng.", "vi": null, "passage": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones."}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["natural", "advisable", "cautious", "unnecessary"], "answer": 2, "explanation": "\"be cautious about expressing emotions\" = thận trọng khi thể hiện cảm xúc.", "vi": null, "passage": "Cultural differences oc const STAGES = STAGES_RAW.stages;
const TOTAL_EXPECTED = STAGES_RAW.total;
const EXAM_PAPERS = STAGES_RAW.examPapers;
const STORE_KEY = 'gs_unit6_fulltest_v1';

(function validate(){
  const ids = [];
  let missingAnswer=0, missingExplanation=0;
  STAGES.forEach(s=>{
    s.items.forEach(it=>{
      ids.push(it.id);
      if(it.type==='mcq' && (it.answer===undefined || it.answer===null || it.answer<0 || it.answer>=it.options.length)) missingAnswer++;
      if((it.type==='fill'||it.type==='sentence') && !it.answer) missingAnswer++;
      if(!it.explanation) missingExplanation++;
    });
  });
  const dupSet = new Set(); let dupes=0;
  ids.forEach(id=>{ if(dupSet.has(id)) dupes++; dupSet.add(id); });
  const totalActual = ids.length;
  const problems = [];
  if(totalActual !== TOTAL_EXPECTED) problems.push(`Tổng số câu thực tế (${totalActual}) khác kỳ vọng (${TOTAL_EXPECTED})`);
  if(dupes>0) problems.push(`${dupes} ID bị trùng`);
  if(missingAnswer>0) problems.push(`${missingAnswer} câu thiếu đáp án hợp lệ`);
  if(missingExplanation>0) problems.push(`${missingExplanation} câu thiếu giải thích`);
  EXAM_PAPERS.forEach((paper,i)=>{
    if(paper.length < 40 || paper.length > 50) problems.push(`Đề ${i+1} có ${paper.length} câu (ngoài khoảng 40-50)`);
    const pids = new Set(paper.map(it=>it.id));
    if(pids.size !== paper.length) problems.push(`Đề ${i+1} có câu trùng lặp`);
  });
  // Every stage/category should appear in EVERY paper — catches the class
  // of bug where two small categories get merged into one "family" and
  // random distribution leaves one of them at 0 in some paper.
  const familyOf = (id) => id.replace(/[\d_]+$/, '');
  const stageFamilies = new Set(STAGES.map(s => familyOf(s.items[0] ? s.items[0].id : '')));
  EXAM_PAPERS.forEach((paper,i)=>{
    const presentFamilies = new Set(paper.map(it => familyOf(it.id)));
    stageFamilies.forEach(fam => {
      if(fam && !presentFamilies.has(fam)) problems.push(`Đề ${i+1} thiếu hẳn nhóm câu hỏi "${fam}"`);
    });
  });
  const coveredIds = new Set(); EXAM_PAPERS.forEach(paper=>paper.forEach(it=>coveredIds.add(it.id)));
  const allStageIds = new Set(ids);
  let uncovered = 0; allStageIds.forEach(id=>{ if(!coveredIds.has(id)) uncovered++; });
  if(uncovered>0) problems.push(`${uncovered} câu trong Unit không xuất hiện ở đề kiểm tra nào`);
  const banner = document.getElementById('auditBanner');
  if(problems.length){
    banner.classList.add('show');
    banner.textContent = '⚠️ Content audit: ' + problems.join(' · ');
    console.error('CONTENT AUDIT FAILED', problems);
  } else {
    console.log(`Content audit OK: ${totalActual}/${TOTAL_EXPECTED} câu, ${EXAM_PAPERS.length} đề kiểm tra (mỗi đề ~${EXAM_PAPERS[0].length} câu, cùng nhau phủ đủ 100% câu hỏi), 0 lỗi.`);
  }
})();

function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let STORE = Object.assign({xp:0, streak:0, lastPlay:null, badges:[], stageBest:{}}, loadStore());

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(STORE.lastPlay === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  STORE.streak = (STORE.lastPlay===y) ? STORE.streak+1 : 1;
  STORE.lastPlay = today;
  saveStore(STORE);
}


function normalize(s){ return (s||'').trim().toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d"]/g,'').replace(/[.,!?;:]/g,'').replace(/\s+/g,' '); }
function optionLetter(i){ return ['A','B','C','D'][i]; }
function shuffleArr(a){ return a.slice().sort(()=>Math.random()-0.5); }


function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }

function renderHome(){
  document.getElementById('xpDisplay').textContent = `${STORE.xp} XP`;
  document.getElementById('streakDisplay').textContent = `🔥 ${STORE.streak} ngày`;
  document.getElementById('stageCountHeader').textContent = `${STAGES.length}`;
  document.getElementById('totalCountHeader').textContent = `${TOTAL_EXPECTED}`;
  document.getElementById('totalCount').textContent = `${TOTAL_EXPECTED}`;
  const examGrid = document.getElementById('examGrid');
  examGrid.innerHTML = EXAM_PAPERS.map((paper,i)=>{
    const best = (STORE.examBest||{})[i];
    return `<div class="bg-gradient-to-r from-red-700 to-orange-500 text-white rounded-2xl shadow-lg p-5 cursor-pointer hover:brightness-105 transition" onclick="startExam(${i})">
      <p class="text-lg font-extrabold mb-1">📝 Đề ${i+1}</p>
      <p class="text-sm opacity-90">${paper.length} câu — xáo trộn ngẫu nhiên mỗi lần làm, có tính giờ &amp; điểm</p>
      <p class="text-xs opacity-80 mt-1">${best ? `🏆 ${best.correct}/${best.total} · ⏱️ ${formatTime(best.seconds)}` : 'Chưa làm lần nào'}</p>
    </div>`;
  }).join('');
  document.getElementById('badgesWrap').innerHTML = (STORE.badges||[]).map(b=>`<span class="badge-pill text-xs font-bold px-3 py-1 rounded-full">${b}</span>`).join('');
  let bestSum=0;
  STAGES.forEach(s=>{ const b=STORE.stageBest[s.key]; if(b!==undefined) bestSum+=b; });
  const pct = Math.round(bestSum/TOTAL_EXPECTED*100);
  document.getElementById('overallBar').style.width = pct+'%';
  document.getElementById('overallText').textContent = `${bestSum} / ${TOTAL_EXPECTED} câu (điểm tốt nhất mỗi chặng) — ${pct}%`;
  const grid = document.getElementById('stageGrid');
  grid.innerHTML = STAGES.map(st=>{
    const best = STORE.stageBest[st.key];
    return `<div class="stage-card bg-white rounded-2xl shadow-md p-5" onclick="startStage('${st.key}')">
      <p class="text-3xl mb-1">${st.emoji}</p>
      <p class="font-extrabold text-red-900">${st.title}</p>
      <p class="text-xs text-slate-400">${st.vi} · ${st.items.length} câu</p>
      ${best!==undefined ? `<p class="text-xs text-emerald-600 mt-2 font-bold">🏆 Điểm tốt nhất: ${best}/${st.items.length}</p>` : `<p class="text-xs text-slate-400 mt-2">Chưa làm</p>`}
    </div>`;
  }).join('');
}

let PLAY = null;
function startStage(key, itemsOverride){
  const st = STAGES.find(s=>s.key===key);
  const items = itemsOverride || shuffleArr(st.items);
  PLAY = { key, st, items, i:0, correct:0, wrongList:[], answers:[] };
  showScreen('screen-play');
  renderPlayItem();
}
function quitStage(){ showScreen('screen-home'); renderHome(); }
function goHome(){ showScreen('screen-home'); renderHome(); }

function renderDots(){
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = PLAY.items.map((_,i)=>`<span class="progress-dot ${i<PLAY.i?'done':''}"></span>`).join('');
}
function renderPlayItem(){
  renderDots();
  document.getElementById('playCounter').textContent = `${PLAY.i+1}/${PLAY.items.length}`;
  const it = PLAY.items[PLAY.i];
  const passageBox = document.getElementById('playPassage');
  if(PLAY.st.passage){ passageBox.classList.remove('hidden'); passageBox.innerHTML = PLAY.st.passage; } else { passageBox.classList.add('hidden'); passageBox.innerHTML=''; }
  const card = document.getElementById('playCard');
  let html = `<p class="font-bold text-slate-800 mb-4 text-lg">${it.q}</p>`;
  if(it.image) html = `<div class="mb-3">${it.image}</div>` + html;
  if(it.type==='mcq'){
    html += `<div class="grid gap-2" id="optWrap">` + it.options.map((o,j)=>`<label class="option-label rounded-xl px-4 py-3 text-sm font-semibold flex items-center gap-2" id="opt_${j}" onclick="pickMcq(${j})"><span class="font-black text-red-700">${optionLetter(j)}.</span> ${o}</label>`).join('') + `</div>`;
  } else if(it.type==='fill'){
    html += `<input type="text" id="fillInp" class="answer-input w-full px-4 py-3 rounded-xl text-base font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitFill()">
      <button onclick="submitFill()" class="mt-3 bg-red-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Kiểm tra</button>`;
  } else if(it.type==='sentence'){
    const starterHtml = it.starter ? `<span class="font-extrabold">${it.starter}</span>` : '';
    html += `<div class="flex items-center gap-3 flex-wrap">${starterHtml}
      <input type="text" id="fillInp" class="answer-input flex-1 min-w-[180px] px-4 py-3 rounded-xl text-base font-semibold" placeholder="..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitFill()"></div>
      <button onclick="submitFill()" class="mt-3 bg-red-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Kiểm tra</button>`;
  }
  html += `<div id="feedback" class="hidden mt-4 p-3 rounded-xl text-sm"></div>
    <button id="nextBtn" onclick="nextItem()" class="hidden mt-3 bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-6 py-2.5 rounded-full text-sm">Câu tiếp theo →</button>`;
  card.innerHTML = html;
}
function pickMcq(j){
  const it = PLAY.items[PLAY.i];
  document.querySelectorAll('#optWrap .option-label').forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${j}`).classList.add('selected');
  const ok = j===it.answer;
  it.options.forEach((o,k)=>{ const el=document.getElementById(`opt_${k}`); if(k===it.answer) el.classList.add('correct-opt'); else if(k===j) el.classList.add('wrong-opt'); el.onclick=null; });
  finishAnswer(ok, `${optionLetter(it.answer)}. ${it.options[it.answer]}`);
}
function submitFill(){
  const it = PLAY.items[PLAY.i];
  const inp = document.getElementById('fillInp');
  const val = normalize(inp.value);
  const acc = (it.accepted||[it.answer]).map(normalize);
  const ok = val!=='' && acc.includes(val);
  inp.classList.add(ok?'correct-input':'wrong-input');
  inp.disabled = true;
  const btn = document.querySelector('#playCard button[onclick="submitFill()"]');
  if(btn) btn.classList.add('hidden');
  finishAnswer(ok, it.answer);
}
function finishAnswer(ok, answerLabel){
  const it = PLAY.items[PLAY.i];
  if(ok) PLAY.correct++; else PLAY.wrongList.push(PLAY.i);
  PLAY.answers.push({ok, item:it});
  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  fb.className = 'mt-4 p-3 rounded-xl text-sm ' + (ok? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-700');
  fb.innerHTML = (ok? '✅ Chính xác!' : `❌ Chưa đúng. Đáp án đúng: <b>${answerLabel}</b>`) + (it.explanation?`<br>💡 ${it.explanation}`:'') + (it.vi?`<br>📖 <i>${it.vi}</i>`:'') + (it.note?`<br>📐 <b>${it.note}</b>`:'');
  document.getElementById('nextBtn').classList.remove('hidden');
}
function nextItem(){
  PLAY.i++;
  if(PLAY.i < PLAY.items.length) renderPlayItem();
  else finishStage();
}
function finishStage(){
  bumpStreak();
  const st = PLAY.st;
  const total = PLAY.items.length;
  const pct = Math.round(PLAY.correct/total*100);
  STORE.xp += PLAY.correct*10 + (pct===100?30:0);
  const prevBest = STORE.stageBest[st.key];
  if(prevBest===undefined || PLAY.correct>prevBest) STORE.stageBest[st.key]=PLAY.correct;
  const newBadges=[];
  if(pct===100 && !STORE.badges.includes(`🏆 ${st.title} Perfect`)) newBadges.push(`🏆 ${st.title} Perfect`);
  if(pct>=80 && !STORE.badges.includes(`⭐ ${st.title} Mastered`)) newBadges.push(`⭐ ${st.title} Mastered`);
  const allDone = STAGES.every(s=>STORE.stageBest[s.key]!==undefined || s.key===st.key);
  if(allDone && !STORE.badges.includes('🎓 Unit Complete')) newBadges.push('🎓 Unit Complete');
  STORE.badges = (STORE.badges||[]).concat(newBadges);
  saveStore(STORE);

  showScreen('screen-result');
  document.getElementById('resultEmoji').textContent = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById('resultTitle').textContent = `${st.emoji} ${st.title} — Hoàn thành!`;
  document.getElementById('resultScore').textContent = `${PLAY.correct} / ${total}`;
  document.getElementById('resultAccuracy').textContent = `Độ chính xác: ${pct}%` + (prevBest!==undefined?` · Lần trước: ${prevBest}/${total}`:'');
  document.getElementById('reviewWrongBtn').classList.toggle('hidden', PLAY.wrongList.length===0);
  document.getElementById('retryWrongBtn').classList.toggle('hidden', PLAY.wrongList.length===0);
  document.getElementById('reviewWrap').innerHTML='';
  if(pct>=60) fireConfetti();
}
function showReview(onlyWrong){
  const wrap = document.getElementById('reviewWrap');
  const list = onlyWrong ? PLAY.answers.filter(a=>!a.ok) : PLAY.answers;
  wrap.innerHTML = list.map(a=>{
    const it=a.item;
    const answerLabel = it.type==='mcq' ? `${optionLetter(it.answer)}. ${it.options[it.answer]}` : it.answer;
    return `<div class="bg-white rounded-xl shadow-sm p-4 ${a.ok?'border-l-4 border-emerald-400':'border-l-4 border-rose-400'}">
      <p class="font-bold text-slate-800 text-sm mb-1">${a.ok?'✅':'❌'} ${it.q}</p>
      <p class="text-sm text-slate-600">Đáp án đúng: <b>${answerLabel}</b></p>
      ${it.explanation?`<p class="text-xs text-blue-700 mt-1">💡 ${it.explanation}</p>`:''}
      ${it.vi?`<p class="text-xs text-slate-400 mt-1">📖 ${it.vi}</p>`:''}
      ${it.note?`<p class="text-xs text-violet-600 mt-1">📐 ${it.note}</p>`:''}
    </div>`;
  }).join('');
  wrap.scrollIntoView({behavior:'smooth'});
}
function retryWrongInStage(){
  if(!PLAY.wrongList.length) return;
  const items = PLAY.wrongList.map(i=>PLAY.items[i]);
  startStage(PLAY.key, items);
}


function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

function confirmReset(){
  if(confirm('Xoá toàn bộ tiến độ, XP, huy hiệu? Hành động này không thể hoàn tác.')){
    localStorage.removeItem(STORE_KEY);
    STORE = {xp:0, streak:0, lastPlay:null, badges:[], stageBest:{}};
    renderHome();
  }
}

// ---------- ĐỀ KIỂM TRA TỔNG HỢP (4 fixed papers; together they cover
// every item in the unit at least once. Each ~40-50 items, order
// reshuffled per attempt, timed, hidden feedback until submit, then
// wrong-answer review + retry) ----------
let EXAM = null;
let EXAM_ANSWERS = {};
function formatTime(s){ const m=Math.floor(s/60); const sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }
function startExam(paperIndex, itemsOverride){
  const isRetry = !!itemsOverride;
  const pIdx = paperIndex!==undefined ? paperIndex : (EXAM ? EXAM.paperIndex : 0);
  const items = shuffleArr(itemsOverride || EXAM_PAPERS[pIdx]);
  EXAM = { paperIndex: pIdx, isRetry, items, seconds:0, timer:null, wrongList:[], answers:[] };
  EXAM_ANSWERS = {};
  EXAM_TEXT_ANSWERED.clear();
  showScreen('screen-exam');
  document.getElementById('examTitleBar').textContent = `📝 Đề ${pIdx+1}` + (isRetry ? ' — Làm lại câu sai' : '');
  document.getElementById('examSubmitBar').classList.remove('hidden');
  document.getElementById('examResultBar').classList.add('hidden');
  document.getElementById('examTotalCount').textContent = items.length;
  document.getElementById('examAnsweredCount').textContent = '0';
  renderExam();
  if(EXAM.timer) clearInterval(EXAM.timer);
  EXAM.timer = setInterval(()=>{ EXAM.seconds++; document.getElementById('examTimer').textContent = formatTime(EXAM.seconds); }, 1000);
}
function quitExam(){
  if(EXAM && EXAM.timer) clearInterval(EXAM.timer);
  showScreen('screen-home'); renderHome();
}
function renderExam(){
  const wrap = document.getElementById('examItemsWrap');
  const seenPassages = new Set();
  wrap.innerHTML = EXAM.items.map((it,i)=>{
    let passageHtml = '';
    if(it.passage && !seenPassages.has(it.passage)){
      seenPassages.add(it.passage);
      passageHtml = `<div class="bg-white border border-slate-200 rounded-xl p-4 mb-2 text-sm leading-relaxed text-slate-700">${it.passage}</div>`;
    }
    let body = `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${it.q}</p>`;
    if(it.image) body = `<div class="mb-2">${it.image}</div>` + body;
    if(it.type==='mcq'){
      body += `<div class="grid sm:grid-cols-2 gap-2">` + it.options.map((o,j)=>`<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="examOpt_${i}_${j}" onclick="selectExamMcq(${i},${j})"><span class="font-black text-red-700">${optionLetter(j)}.</span> ${o}</label>`).join('') + `</div>`;
    } else if(it.starter){
      body += `<div class="flex items-center gap-2 flex-wrap"><span class="font-extrabold">${it.starter}</span><input type="text" id="examInp_${i}" class="answer-input flex-1 min-w-[160px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false" oninput="markExamAnswered(${i})"></div>`;
    } else {
      body += `<input type="text" id="examInp_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false" oninput="markExamAnswered(${i})">`;
    }
    body += `<div class="mt-2 text-sm hidden" id="examFb_${i}"></div>`;
    return `<div class="bg-white rounded-2xl shadow-md p-4 mb-3">${passageHtml}${body}</div>`;
  }).join('');
}
const EXAM_TEXT_ANSWERED = new Set();
function markExamAnswered(i){
  const inp = document.getElementById(`examInp_${i}`);
  if(inp && inp.value.trim()!=='') EXAM_TEXT_ANSWERED.add(i); else EXAM_TEXT_ANSWERED.delete(i);
  updateExamAnsweredCount();
}
function updateExamAnsweredCount(){
  const count = Object.keys(EXAM_ANSWERS).length + EXAM_TEXT_ANSWERED.size;
  document.getElementById('examAnsweredCount').textContent = count;
}
function selectExamMcq(i,j){
  document.querySelectorAll(`[id^="examOpt_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`examOpt_${i}_${j}`).classList.add('selected');
  EXAM_ANSWERS[i] = j;
  updateExamAnsweredCount();
}
function submitExam(){
  if(EXAM.timer) clearInterval(EXAM.timer);
  let correct=0; EXAM.wrongList=[]; EXAM.answers=[];
  EXAM.items.forEach((it,i)=>{
    let ok=false, answerLabel='';
    if(it.type==='mcq'){
      const chosen = EXAM_ANSWERS[i];
      ok = chosen===it.answer;
      answerLabel = `${optionLetter(it.answer)}. ${it.options[it.answer]}`;
      it.options.forEach((o,j)=>{ const el=document.getElementById(`examOpt_${i}_${j}`); el.onclick=null; if(j===it.answer) el.classList.add('correct-opt'); else if(j===chosen) el.classList.add('wrong-opt'); });
    } else {
      const inp = document.getElementById(`examInp_${i}`);
      const val = normalize(inp.value);
      const acc = (it.accepted||[it.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.disabled = true;
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = it.answer;
    }
    if(ok) correct++; else EXAM.wrongList.push(i);
    EXAM.answers.push({ok, item:it});
    const fb = document.getElementById(`examFb_${i}`);
    fb.classList.remove('hidden');
    fb.className = 'mt-2 text-sm p-2 rounded-lg ' + (ok?'bg-emerald-50 border border-emerald-200 text-emerald-800':'bg-rose-50 border border-rose-200 text-rose-700');
    fb.innerHTML = (ok?'✅ Chính xác!':`❌ Chưa đúng. Đáp án đúng: <b>${answerLabel}</b>`) + (it.explanation?`<br>💡 ${it.explanation}`:'') + (it.vi?`<br>📖 <i>${it.vi}</i>`:'') + (it.note?`<br>📐 <b>${it.note}</b>`:'');
  });
  const total = EXAM.items.length;
  const pct = Math.round(correct/total*100);
  bumpStreak();
  STORE.xp += correct*10 + (pct===100?50:0);
  if(!EXAM.isRetry){
    STORE.examBest = STORE.examBest || {};
    const prevBest = STORE.examBest[EXAM.paperIndex];
    if(!prevBest || correct>prevBest.correct || (correct===prevBest.correct && EXAM.seconds<prevBest.seconds)){
      STORE.examBest[EXAM.paperIndex] = {correct, total, seconds:EXAM.seconds};
    }
  }
  const newBadges=[];
  const paperLabel = `Đề ${EXAM.paperIndex+1}`;
  if(pct===100 && !STORE.badges.includes(`🏆 ${paperLabel} 100%`)) newBadges.push(`🏆 ${paperLabel} 100%`);
  if(pct>=80 && !STORE.badges.includes(`⭐ ${paperLabel} giỏi (≥80%)`)) newBadges.push(`⭐ ${paperLabel} giỏi (≥80%)`);
  STORE.badges = (STORE.badges||[]).concat(newBadges);
  saveStore(STORE);

  document.getElementById('examSubmitBar').classList.add('hidden');
  document.getElementById('examResultBar').classList.remove('hidden');
  document.getElementById('examResultEmoji').textContent = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById('examResultText').textContent = `${correct} / ${total} câu đúng (${pct}%) · ⏱️ Thời gian: ${formatTime(EXAM.seconds)}`;
  document.getElementById('examRetryBtn').classList.toggle('hidden', EXAM.wrongList.length===0);
  if(pct>=60) fireConfetti();
  document.getElementById('examResultBar').scrollIntoView({behavior:'smooth'});
}
function retryExamWrong(){
  if(!EXAM.wrongList.length) return;
  const items = EXAM.wrongList.map(i=>EXAM.items[i]);
  startExam(EXAM.paperIndex, items);
}
function retryExamSamePaper(){ startExam(EXAM.paperIndex); }

renderHome();
</script>
