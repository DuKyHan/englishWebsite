<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{ --accent:#1d4ed8; --accent2:#0891b2; }
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#f5f3ff; }

  .tab-btn{ transition: all .2s ease; }
  .tab-btn.active{ background: linear-gradient(135deg, #7c2d12, #f59e0b); color:#fff; box-shadow:0 4px 14px rgba(124,45,18,.35); transform:translateY(-1px); }
  .task-card{ transition: box-shadow .2s, transform .2s; }
  .task-card:hover{ transform: translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  .mcq-detail-hidden{ display:none; }
  .show-mcq-detail .mcq-detail-hidden{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:var(--accent); }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .voice-ok{ color:#16a34a; } .voice-warn{ color:#d97706; }

  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
  table.border-collapse td, table.border-collapse th{ border:1px solid #e2e8f0; }

<script>
const DATA = {"unit": 6, "sections": [{"roman": "", "navLabel": "Lý thuyết", "title": "Từ vựng - Ngữ pháp - Hướng dẫn Word Form", "icon": "lightbulb", "type": "info", "info": "<div class='mb-5'><p class=\"text-sm text-slate-500 italic mb-3\">Ôn lại từ vựng, ngữ pháp trọng tâm và cách làm dạng bài Word Form trước khi luyện tập.</p></div><div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. dogsled</span><span class='text-slate-400 text-xs'>(n) /ˈdɒɡsled/</span><span class='text-slate-500 text-xs ml-auto'>xe trượt tuyết chó kéo</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. experience</span><span class='text-slate-400 text-xs'>(n, v) /ɪkˈspɪəriəns/</span><span class='text-slate-500 text-xs ml-auto'>kinh nghiệm, trải nghiệm</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. greet</span><span class='text-slate-400 text-xs'>(v) /ɡriːt/</span><span class='text-slate-500 text-xs ml-auto'>chào, chào hỏi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. greeting</span><span class='text-slate-400 text-xs'>(n) /ˈɡriːtɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>lời chào</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. habit</span><span class='text-slate-400 text-xs'>(n) /ˈhæbɪt/</span><span class='text-slate-500 text-xs ml-auto'>thói quen</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. in the habit of</span><span class='text-slate-400 text-xs'>(phr) /ɪn ðə ˈhæbɪt əv/</span><span class='text-slate-500 text-xs ml-auto'>có thói quen làm gì</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. hurry</span><span class='text-slate-400 text-xs'>(n, v) /ˈhʌri/</span><span class='text-slate-500 text-xs ml-auto'>vội vàng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. in a hurry</span><span class='text-slate-400 text-xs'>(phr) /ɪn ə ˈhʌri/</span><span class='text-slate-500 text-xs ml-auto'>đang vội</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. igloo</span><span class='text-slate-400 text-xs'>(n) /ˈɪɡluː/</span><span class='text-slate-500 text-xs ml-auto'>lều tuyết</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. impact</span><span class='text-slate-400 text-xs'>(n) /ˈɪmpækt/</span><span class='text-slate-500 text-xs ml-auto'>sự ảnh hưởng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. independent</span><span class='text-slate-400 text-xs'>(adj) /ˌɪndɪˈpendənt/</span><span class='text-slate-500 text-xs ml-auto'>độc lập</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. interact</span><span class='text-slate-400 text-xs'>(v) /ˌɪntərˈækt/</span><span class='text-slate-500 text-xs ml-auto'>tương tác</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. interaction</span><span class='text-slate-400 text-xs'>(n) /ˌɪntərˈækʃn/</span><span class='text-slate-500 text-xs ml-auto'>sự tương tác</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. lifestyle</span><span class='text-slate-400 text-xs'>(n) /ˈlaɪfstaɪl/</span><span class='text-slate-500 text-xs ml-auto'>lối sống</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. make craft</span><span class='text-slate-400 text-xs'>(phr) /meɪk krɑːft/</span><span class='text-slate-500 text-xs ml-auto'>làm hàng thủ công</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. maintain</span><span class='text-slate-400 text-xs'>(v) /meɪnˈteɪn/</span><span class='text-slate-500 text-xs ml-auto'>duy trì, gìn giữ</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. musher</span><span class='text-slate-400 text-xs'>(n) /ˈmʌʃər/</span><span class='text-slate-500 text-xs ml-auto'>người điều khiển xe chó kéo</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. nomadic</span><span class='text-slate-400 text-xs'>(adj) /noʊˈmædɪk/</span><span class='text-slate-500 text-xs ml-auto'>du mục</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. offline</span><span class='text-slate-400 text-xs'>(adj, adv) /ˌɒfˈlaɪn/</span><span class='text-slate-500 text-xs ml-auto'>trực tiếp, ngoại tuyến</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. online</span><span class='text-slate-400 text-xs'>(adj, adv) /ˌɒnˈlaɪn/</span><span class='text-slate-500 text-xs ml-auto'>trực tuyến</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. online learning</span><span class='text-slate-400 text-xs'>(n) /ˌɒnˈlaɪn ˈlɜːrnɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>việc học trực tuyến</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. revive</span><span class='text-slate-400 text-xs'>(v) /rɪˈvaɪv/</span><span class='text-slate-500 text-xs ml-auto'>làm sống lại, hồi sinh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>23. serve</span><span class='text-slate-400 text-xs'>(v) /sɜːrv/</span><span class='text-slate-500 text-xs ml-auto'>phục vụ</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Thì tương lai đơn (Future Simple)</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + will + V (nguyên mẫu)</td><td class=\"border px-2 py-1 italic\">We will go to the museum. <span class=\"not-italic text-slate-500\">— Chúng tôi sẽ đi bảo tàng.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + will not (won't) + V</td><td class=\"border px-2 py-1 italic\">She won't attend the festival. <span class=\"not-italic text-slate-500\">— Cô ấy sẽ không tham dự lễ hội.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Nghi vấn</td><td class=\"border px-2 py-1\">Will + S + V?</td><td class=\"border px-2 py-1 italic\">Will he join the dance? <span class=\"not-italic text-slate-500\">— Anh ấy sẽ tham gia điệu nhảy chứ?</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-sm text-slate-700 mt-2\"><b>Cách dùng:</b> diễn tả sự việc trong tương lai; quyết định tại thời điểm nói; dự đoán; lời yêu cầu/đề nghị/mời; lời hứa; mệnh đề chính của câu điều kiện loại 1.</p>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Dấu hiệu nhận biết: soon, tomorrow, in the future, next week/month/year...</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-code-branch mr-1\"></i>2. Câu điều kiện loại 1 (First Conditional)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Diễn tả sự việc CÓ THỂ xảy ra trong tương lai khi có một điều kiện nhất định.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Mệnh đề If</th><th class=\"border px-2 py-1\">Mệnh đề chính</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">If + S + V (hiện tại đơn)</td><td class=\"border px-2 py-1 font-bold\">, S + will/won't + V (nguyên mẫu)</td></tr>\n    </table>\n    </div>\n    <p class=\"text-sm text-slate-700 mt-2 italic\">VD: If the baby is hungry, he will cry. <span class=\"not-italic text-slate-500\">— Nếu em bé đói, nó sẽ khóc.</span></p>\n    <p class=\"text-sm text-slate-700 mt-2\"><b>Cách dùng:</b> dự đoán một hành động có thể xảy ra; đưa ra lời đề nghị/gợi ý; đưa ra cảnh báo/đe dọa.</p>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Mệnh đề chính có thể đứng trước mệnh đề If (không dùng dấu phẩy): You will finish the report if you keep working. Mệnh đề chính cũng có thể dùng modal verbs: can, may, must...</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-not-equal mr-1\"></i>3. \"Unless\" trong câu điều kiện</p>\n    <p class=\"text-sm text-slate-700\">\"Unless\" = \"If... not...\" (nếu không). <b>Unless + S + V (khẳng định) = If + S + don't/doesn't + V.</b></p>\n    <p class=\"text-sm text-slate-700 mt-1 italic\">VD: Unless you study harder, you will fail the test. = If you don't study harder, you will fail the test. <span class=\"not-italic text-slate-500\">(Nếu bạn không học chăm hơn, bạn sẽ trượt.)</span></p>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>If it will rain, we will stay home.</s> ❌ → <b>If it rains, we will stay home.</b> ✅ — mệnh đề If dùng HIỆN TẠI ĐƠN, không dùng \"will\".</li>\n      <li><s>If you don't study, you fail.</s> ❌ → <b>If you don't study, you will fail.</b> ✅ — mệnh đề chính cần \"will\" để chỉ tương lai.</li>\n      <li><s>Unless you don't hurry, you will be late.</s> ❌ → <b>Unless you hurry, you will be late.</b> ✅ — \"unless\" đã mang nghĩa phủ định, không thêm \"don't\" nữa.</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"If + S + V (hiện tại đơn), S + will + V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">If + S + V (hiện tại đơn), S + will + V</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Unless + S + V (khẳng định) = If + S + don't/doesn't + V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">Unless + S + V (khẳng định)<br>= If + S + don't/doesn't + V</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["breakfast", "brief", "bright", "climb"], "answer": 3, "ipas": ["/ˈbrekfəst/", "/briːf/", "/braɪt/", "/klaɪm/"], "vis": ["bữa sáng", "ngắn gọn", "sáng, tươi sáng", "leo, trèo"], "explanation": "\"climb\" có \"b\" câm (không phát âm), khác biệt với cách phát âm của các từ còn lại."}, {"q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["practice", "cupboard", "pray", "plan"], "answer": 2, "ipas": ["/ˈpræktɪs/", "/ˈkʌbərd/", "/preɪ/", "/plæn/"], "vis": ["thực hành", "cái tủ", "cầu nguyện", "kế hoạch"], "explanation": "\"pray\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"a\" phát wer": 3, "ipas": ["/ɪkˈspɪəriəns/", "/ɪnˈhæns/", "/meɪnˈteɪn/", "/ˈdʒenrəl/"], "vis": ["kinh nghiệm", "nâng cao", "duy trì", "chung, tổng quát"], "explanation": "\"general\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "9. Which word has a different stress pattern from that of the others?", "options": ["independent", "interaction", "technology", "dedication"], "answer": 2, "ipas": ["/ˌɪndɪˈpendənt/", "/ˌɪntərˈækʃn/", "/tekˈnɒlədʒi/", "/ˌdedɪˈkeɪʃn/"], "vis": ["độc lập", "sự tương tác", "công nghệ", "sự cống hiến"], "explanation": "\"technology\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3."}, {"q": "10. Which word has a different stress pattern from that of the others?", "options": ["hurry", "improve", "lifestyle", "mealtime"], "answer": 1, "ipas": ["/ˈhʌri/", "/ɪmˈpruːv/", "/ˈlaɪfstaɪl/", "/ˈmiːltaɪm/"], "vis": ["vội vàng", "cải thiện", "lối sống", "giờ ăn"], "explanation": "\"improve\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. Another programme takes families for a _______ adventure in the surrounding woods.", "options": ["dogsled", "diet", "habit", "street"], "answer": 0, "explanation": "\"dogsled adventure\" = cuộc phiêu lưu bằng xe trượt tuyết chó kéo.", "vis": ["xe trượt tuyết chó kéo (đúng)", "chế độ ăn", "thói quen", "đường phố"], "tags": ["vocab"]}, {"q": "2. We need to find some other _______ of transportation.", "options": ["means", "styles", "cuisines", "leisure"], "answer": 0, "explanation": "\"means of transportation\" = phương tiện giao thông.", "vis": ["phương tiện (đúng)", "kiểu, phong cách", "ẩm thực", "sự nhàn rỗi"], "tags": ["vocab"]}, {"q": "3. It's a simple _______ to prepare, consisting mainly of rice and vegetables.", "options": ["waiter", "street", "dish", "title"], "answer": 2, "explanation": "\"dish\" = món ăn — hợp nghĩa với \"consisting of rice and vegetables\".", "vis": ["người phục vụ", "đường phố", "món ăn (đúng)", "tiêu đề"], "tags": ["vocab"]}, {"q": "4. The hotel restaurant is known for its excellent French _______.", "options": ["craft", "cuisine", "musher", "dogsled"], "answer": 1, "explanation": "\"cuisine\" = nền ẩm thực — hợp nghĩa với \"French cuisine\".", "vis": ["thủ công", "ẩm thực (đúng)", "người điều khiển xe chó kéo", "xe trượt tuyết chó kéo"], "tags": ["vocab"]}, {"q": "5. The 1,100-mile race from Anchorage to Nome allows _____ to drop injured, sick or tired dogs.", "options": ["tribes", "mushers", "waiters", "cuisines"], "answer": 1, "explanation": "\"mushers\" = người điều khiển xe trượt tuyết chó kéo.", "vis": ["các bộ lạc", "người điều khiển xe chó kéo (đúng)", "người phục vụ", "các nền ẩm thực"], "tags": ["vocab"]}, {"q": "6. They share a(n) _______ interest in photography.", "options": ["common", "nomadic", "different", "independent"], "answer": 0, "explanation": "\"common interest\" = sở thích chung.", "vis": ["chung (đúng)", "du mục", "khác nhau", "độc lập"], "tags": ["vocab"]}, {"q": "7. We enjoyed a(n) _______ picnic lunch on the lawn.", "options": ["different", "alive", "leisurely", "unique"], "answer": 2, "explanation": "\"leisurely\" = thong thả, nhàn nhã — hợp nghĩa với bữa picnic thư giãn.", "vis": ["khác nhau", "còn sống", "thong thả (đúng)", "độc đáo"], "tags": ["vocab"]}, {"q": "8. I don't eat much for lunch —just a(n) _______ snack.", "options": ["light", "nomadic", "best-known", "balanced"], "answer": 0, "explanation": "\"a light snack\" = một bữa ăn nhẹ.", "vis": ["nhẹ (đúng)", "du mục", "nổi tiếng nhất", "cân bằng"], "tags": ["vocab"]}, {"q": "9. The Aborigines are the _______ inhabitants of Australia.", "options": ["unusual", "unique", "traditional", "native"], "answer": 3, "explanation": "\"native inhabitants\" = cư dân bản địa.", "vis": ["khác thường", "độc đáo, duy nhất", "truyền thống", "bản địa (đúng)"], "tags": ["vocab"]}, {"q": "10. The city _______ seems to suit her — she's certainly looking very well.", "options": ["practice", "hurry", "lifestyle", "title"], "answer": 2, "explanation": "\"city lifestyle\" = lối sống thành thị.", "vis": ["thực hành", "vội vàng", "lối sống (đúng)", "tiêu đề"], "tags": ["vocab"]}, {"q": "11. If it _______ convenient, let's go out for dinner tonight.", "options": ["be", "is", "was", "were"], "answer": 1, "explanation": "Câu điều kiện loại 1: mệnh đề If dùng thì hiện tại đơn → is.", "vis": ["nguyên mẫu (sai)", "hiện tại đơn (đúng)", "quá khứ (sai)", "quá khứ, giả định (sai)"], "tags": ["grammar"]}, {"q": "12. If we meet at 9:00, we ___________ plenty of time to talk.", "options": ["have", "is having", "will have", "had"], "answer": 2, "explanation": "Câu điều kiện loại 1: mệnh đề chính dùng tương lai đơn → will have.", "vis": ["hiện tại đơn (sai)", "hiện tại tiếp diễn (sai)", "tương lai đơn (đúng)", "quá khứ (sai)"], "tags": ["grammar"]}, {"q": "13. If you learn online, you will find it difficult ___________.", "options": ["concentrated", "concentrating", "concentrate", "to concentrate"], "answer": 3, "explanation": "Cấu trúc: find it + adj + to V (thấy khó/dễ để làm gì).", "vis": ["quá khứ (sai)", "V-ing (sai cấu trúc)", "nguyên mẫu (sai cấu trúc)", "to-V (đúng)"], "tags": ["grammar"]}, {"q": "14. Linh and Quan have similar ___________ about online learning.", "options": ["problem", "ideas", "idea", "ideal"], "answer": 1, "explanation": "\"similar\" + danh từ số nhiều (ý kiến của 2 người) → ideas.", "vis": ["vấn đề (số ít, sai)", "ý tưởng (số nhiều, đúng)", "ý tưởng (số ít, sai)", "lý tưởng (sai từ loại)"], "tags": ["grammar"]}, {"q": "15. What do people do to ___________ traditional lifestyles?", "options": ["maintain", "stay", "carry", "serve"], "answer": 0, "explanation": "\"maintain a lifestyle\" = duy trì lối sống.", "vis": ["duy trì (đúng)", "ở lại", "mang theo", "phục vụ"], "tags": ["vocab"]}, {"q": "16. Thais greet other people by ___________ \"sawadee\".", "options": ["bowing", "saying", "practicing", "telling"], "answer": 1, "explanation": "\"greet by saying...\" = chào bằng cách nói câu gì đó.", "vis": ["cúi chào", "nói (đúng)", "luyện tập", "kể"], "tags": ["vocab"]}, {"q": "17. What is the ___________ food in your area? - It's rice.", "options": ["core", "basic", "staple", "key"], "answer": 2, "explanation": "\"staple food\" = thực phẩm chính, chủ yếu.", "vis": ["cốt lõi", "cơ bản", "chủ yếu (đúng)", "chủ chốt"], "tags": ["vocab"]}, {"q": "18. Many students like studying online because it's ___________.", "options": ["harmful", "dependent", "convenient", "time-consuming"], "answer": 2, "explanation": "\"convenient\" = tiện lợi — lý do tích cực hợp ngữ cảnh.", "vis": ["có hại", "phụ thuộc", "tiện lợi (đúng)", "tốn thời gian"], "tags": ["vocab"]}, {"q": "19. India has a ___________ range of cuisines.", "options": ["deep", "large", "big", "vast"], "answer": 3, "explanation": "\"a vast range of\" = một phạm vi/loạt rộng lớn — collocation phổ biến.", "vis": ["sâu", "lớn", "to (ít trang trọng hơn)", "rộng lớn (đúng, collocation chuẩn)"], "tags": ["vocab"]}, {"q": "20. Sushi comes from ___________.", "options": ["The U.S.", "Japan", "Viet Nam", "Australia"], "answer": 1, "explanation": "Sushi có nguồn gốc từ Nhật Bản.", "vis": ["Mỹ", "Nhật Bản (đúng)", "Việt Nam", "Úc"], "tags": ["vocab"]}, {"q": "21. The dogsled is still used as a ___________ of transport in Alaska today.", "options": ["mean", "way", "means", "method"], "answer": 2, "explanation": "\"a means of transport\" = một phương tiện giao thông (means không đổi dạng số ít/nhiều).", "vis": ["sai chính tả", "cách thức (ít hợp collocation)", "phương tiện (đúng)", "phương pháp"], "tags": ["vocab"]}, {"q": "22. The traditional craft of the villagers is ___________ bamboo baskets.", "options": ["weaving", "knitting", "carving", "moulding"], "answer": 0, "explanation": "\"weaving baskets\" = đan/dệt rổ (từ tre).", "vis": ["đan, dệt (đúng)", "đan len", "chạm khắc", "đúc khuôn"], "tags": ["vocab"]}, {"q": "23. Sticking out one's ___________ was a way of greeting in traditional Tibetan culture.", "options": ["lips", "throat", "mouth", "tongue"], "answer": 3, "explanation": "\"stick out one's tongue\" = thè lưỡi — cách chào truyền thống ở Tây Tạng.", "vis": ["môi", "cổ họng", "miệng", "lưỡi (đúng)"], "tags": ["vocab"]}, {"q": "24. Song Hye Kyo comes from South Korea, so her ___________ language is Korean.", "options": ["native", "practical", "modern", "local"], "answer": 0, "explanation": "\"native language\" = tiếng mẹ đẻ.", "vis": ["bản địa, mẹ đẻ (đúng)", "thực tế", "hiện đại", "địa phương"], "tags": ["vocab"]}, {"q": "25. ___________ hands is probably the most common way of greeting around the world.", "options": ["Shook", "Shakes", "Shaking", "Shake"], "answer": 2, "explanation": "Danh động từ làm chủ ngữ của câu → Shaking.", "vis": ["đã bắt (quá khứ, sai)", "bắt (chia số ít, sai)", "bắt tay (V-ing làm chủ ngữ, đúng)", "bắt (nguyên mẫu, sai)"], "tags": ["grammar"]}, {"q": "26. Buying street food is a common ___________ in our country.", "options": ["kind", "practice", "mode", "type"], "answer": 1, "explanation": "\"a common practice\" = một thông lệ/thói quen phổ biến.", "vis": ["loại", "thông lệ (đúng)", "chế độ, phương thức", "kiểu"], "tags": ["vocab"]}, {"q": "27. Are there any ___________ of modern technology on lifestyles?", "options": ["ways", "sides", "impact", "impacts"], "answer": 3, "explanation": "Sau \"any\" và \"of\" cần DANH TỪ SỐ NHIỀU → impacts (những tác động).", "vis": ["cách thức", "mặt, phía", "ảnh hưởng (số ít, sai)", "ảnh hưởng (số nhiều, đúng)"], "tags": ["grammar"]}, {"q": "28. Will online learning ___________ our IT skills? - Yes, it will.", "options": ["improve", "improves", "improving", "improved"], "answer": 0, "explanation": "Sau trợ động từ \"Will\" cần ĐỘNG TỪ NGUYÊN MẪU → improve.", "vis": ["cải thiện (nguyên mẫu, đúng)", "chia số ít, sai", "V-ing, sai", "quá khứ, sai"], "tags": ["grammar"]}, {"q": "29. If I have enough money, I ____________ a new smartphone.", "options": ["will buy", "buy", "to buy", "buying"], "answer": 0, "explanation": "Câu điều kiện loại 1: mệnh đề chính dùng tương lai đơn → will buy.", "vis": ["sẽ mua (đúng)", "mua (hiện tại, sai)", "to-V, sai", "V-ing, sai"], "tags": ["grammar"]}, {"q": "30. I ____________ the party tomorrow.", "options": ["attend", "attends", "will attend", "attending"], "answer": 2, "explanation": "Dấu hiệu \"tomorrow\" → thì tương lai đơn: will attend.", "vis": ["hiện tại đơn, sai", "chia số ít, sai", "sẽ tham dự (đúng)", "V-ing, sai"], "tags": ["grammar"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "1. I had a great _____________ skydiving for the first time last weekend.", "hint": "(experiential)", "answer": "experience", "explanation": "Sau \"a great\" cần DANH TỪ → experience (một trải nghiệm), không phải tính từ \"experiential\".", "vi": "Tôi đã có một trải nghiệm tuyệt vời khi nhảy dù lần đầu tiên cuối tuần trước.", "family": ["experience (n/v): kinh nghiệm; trải nghiệm", "experienced (adj): có kinh nghiệm", "experiential (adj): thuộc về trải nghiệm"]}, {"q": "2. After finishing college, I moved to a new city and learned to be more __________, managing my own budget and making my own decisions.", "hint": "(depend)", "answer": "independent", "explanation": "Sau \"be more\" cần TÍNH TỪ → independent (độc lập).", "vi": "Sau khi tốt nghiệp đại học, tôi chuyển đến thành phố mới và học cách độc lập hơn, tự quản lý ngân sách và tự đưa ra quyết định.", "family": ["depend (v): phụ thuộc", "dependent (adj): phụ thuộc", "independent (adj): độc lập", "independence (n): sự độc lập"]}, {"q": "3. It's important to _____________ a healthy lifestyle by exercising regularly and eating a balanced diet.", "hint": "(maintenance)", "answer": "maintain", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → maintain, không phải danh từ \"maintenance\".", "vi": "Điều quan trọng là duy trì lối sống lành mạnh bằng cách tập thể dục đều đặn và ăn uống cân bằng.", "family": ["maintain (v): duy trì, gìn giữ", "maintenance (n): sự duy trì, bảo trì"]}, {"q": "4. Some cultures have a tradition of leading a _______ lifestyle, moving from place to place to find food and water sources.", "hint": "(nomad)", "answer": "nomadic", "explanation": "Bổ nghĩa cho danh từ \"lifestyle\" cần TÍNH TỪ → nomadic (du mục).", "vi": "Một số nền văn hóa có truyền thống sống du mục, di chuyển từ nơi này sang nơi khác để tìm nguồn thức ăn và nước.", "family": ["nomad (n): người du mục", "nomadic (adj): du mục"]}, {"q": "5. The government is planning to ________ the old historical sites in the city to attract more tourists and preserve the local heritage.", "hint": "(revival)", "answer": "revive", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → revive (làm sống lại), không phải danh từ \"revival\".", "vi": "Chính phủ đang lên kế hoạch khôi phục các di tích lịch sử cũ trong thành phố để thu hút thêm du khách và bảo tồn di sản địa phương.", "family": ["revive (v): làm sống lại, hồi sinh", "revival (n): sự hồi sinh, sự khôi phục"]}, {"q": "6. I am going to visit Da Nang, so can you tell me what the greatest _______ in Da Nang are?", "hint": "(attract)", "answer": "attractions", "explanation": "Sau \"the greatest\" và trước \"are\" (số nhiều) cần DANH TỪ SỐ NHIỀU → attractions (điểm thu hút).", "vi": "Tôi sắp đi Đà Nẵng, bạn có thể cho tôi biết những điểm thu hút lớn nhất ở Đà Nẵng là gì không?", "family": ["attract (v): thu hút", "attraction (n): điểm thu hút, sự thu hút", "attractive (adj): hấp dẫn, thu hút"]}, {"q": "7. Don't worry about your travelling because the public transport here is convenient and ________.", "hint": "(rely)", "answer": "reliable", "explanation": "Song song với tính từ \"convenient\" cần TÍNH TỪ → reliable (đáng tin cậy).", "vi": "Đừng lo về việc đi lại vì phương tiện công cộng ở đây tiện lợi và đáng tin cậy.", "family": ["rely (v): tin cậy, dựa vào", "reliable (adj): đáng tin cậy", "reliability (n): độ tin cậy"]}, {"q": "8. Sydney is a metropolitan and ______ city so you have a great variety of things and foods from different countries.", "hint": "(multiculture)", "answer": "multicultural", "explanation": "Song song với tính từ \"metropolitan\", bổ nghĩa cho \"city\" → multicultural (đa văn hóa).", "vi": "Sydney là một thành phố đô thị và đa văn hóa nên bạn có rất nhiều thứ và món ăn đa dạng từ nhiều quốc gia.", "family": ["multiculturalism (n): chủ nghĩa đa văn hóa", "multicultural (adj): đa văn hóa"]}, {"q": "9. My aunt lives in one of the most _______ parts in Paris. She is a well-known fashion designer there.", "hint": "(fashion)", "answer": "fashionable", "explanation": "Sau \"the most\" và bổ nghĩa cho \"parts\" cần TÍNH TỪ → fashionable (sành điệu, hợp thời trang).", "vi": "Dì tôi sống ở một trong những khu vực sành điệu nhất Paris. Dì là một nhà thiết kế thời trang nổi tiếng ở đó.", "family": ["fashion (n): thời trang", "fashionable (adj): hợp thời trang, sành điệu", "fashionably (adv): một cách hợp thời trang"]}, {"q": "10. The outdoor food markets in Singapore are fun and _________ so when you go there you should try some food there.", "hint": "(afford)", "answer": "affordable", "explanation": "Song song với tính từ \"fun\" cần TÍNH TỪ → affordable (giá cả phải chăng).", "vi": "Các chợ ẩm thực ngoài trời ở Singapore vừa vui vừa có giá phải chăng, vì vậy khi đến đó bạn nên thử một số món ăn.", "family": ["afford (v): có khả năng chi trả", "affordable (adj): giá cả phải chăng", "affordably (adv): với giá phải chăng"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "A) Cultural differences when travelling abroad", "html": "Cultural differences occur wherever you go abroad. When visiting another country, you should be aware of those differences and respect them. Here are some ___(1)___ on how to fit in. Every traveller to a foreign country feels ___(2)___ at some point. How you act may make locals laugh. Your best defense is a sense of humor. If you can laugh off eating with the wrong hand in India, locals will be more accepting of you. Wearing proper clothes is important too ___(3)___ locals will judge you by what you wear. In some Middle Eastern countries, exposing your flesh is forbidden, especially if you are a woman. So ___(4)___ your torn jeans at home. Also be ___(5)___ about expressing emotions. Getting angry in Southeast Asia just makes you look silly. In some countries it is unwise to kiss ___(6)___ public.", "vi": "Sự khác biệt văn hóa xảy ra ở bất cứ nơi nào bạn đến. Khi thăm một quốc gia khác, bạn nên nhận thức và tôn trọng những khác biệt đó. Dưới đây là vài mẹo để hòa nhập. Mọi du khách đều cảm thấy lúng túng vào lúc nào đó — hành động của bạn có thể khiến người dân địa phương cười. Cách phòng thủ tốt nhất là óc hài hước. Nếu bạn có thể cười xòa việc ăn bằng tay sai ở Ấn Độ, người dân sẽ dễ chấp nhận bạn hơn. Ăn mặc phù hợp cũng quan trọng vì người dân sẽ đánh giá bạn qua trang phục. Ở một số nước Trung Đông, để lộ da thịt là điều cấm kỵ, đặc biệt với phụ nữ, vì vậy hãy để quần jean rách ở nhà. Cũng nên thận trọng khi thể hiện cảm xúc — nổi giận ở Đông Nam Á chỉ khiến bạn trông ngớ ngẩn. Ở một số nước, hôn nhau nơi công cộng là điều không nên."}, "questions": [{"q": "1.", "options": ["plans", "tips", "arguments", "choices"], "answer": 1, "vis": ["kế hoạch", "mẹo nhỏ (đúng)", "lập luận", "lựa chọn"], "explanation": "\"tips on how to fit in\" = mẹo để hòa nhập."}, {"q": "2.", "options": ["unsafe", "excited", "satisfied", "awkward"], "answer": 3, "vis": ["không an toàn", "hào hứng", "hài lòng", "lúng túng, ngượng ngùng (đúng)"], "explanation": "\"feels awkward\" = cảm thấy lúng túng khi ở nước ngoài."}, {"q": "3.", "options": ["but", "because", "so", "or"], "answer": 1, "vis": ["nhưng", "bởi vì (đúng)", "vì vậy", "hoặc"], "explanation": "Ăn mặc quan trọng BỞI VÌ người dân sẽ đánh giá qua trang phục."}, {"q": "4.", "options": ["leave", "make", "bring", "take"], "answer": 0, "vis": ["để lại (đúng)", "làm", "mang theo", "lấy"], "explanation": "\"leave your torn jeans at home\" = để quần jean rách ở nhà."}, {"q": "5.", "options": ["natural", "advisable", "cautious", "unnecessary"], "answer": 2, "vis": ["tự nhiên", "nên làm", "thận trọng (đúng)", "không cần thiết"], "explanation": "\"be cautious about expressing emotions\" = thận trọng khi thể hiện cảm xúc."}, {"q": "6.", "options": ["in", "for", "at", "up"], "answer": 0, "vis": ["ở, nơi (đúng — in public)", "cho", "tại", "lên"], "explanation": "\"in public\" = ở nơi công cộng."}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "B) Technology and disaster rescue", "html": "Nowadays, with the high-speed Internet ___(1)___, people can quickly update the ___(2)___ news on the coming natural disasters in their neighborhood. For example, last year many flood victims in Da Nang were rescued from deep flooded areas ___(3)___ to the short videos and images of where they got stuck they posted on social networks like Facebook or TikTok. In addition, the collaborative work on storm and flood prevention between departments goes ___(4)___ because they can have video conferences to guide and evacuate locals from dangerous areas. In the future, the communication ___(5)___ people and the rescue teams might be much more ___(6)___ when telepathy technology has a breakthrough.", "vi": "Ngày nay, nhờ kết nối Internet tốc độ cao, người dân có thể nhanh chóng cập nhật tin tức mới nhất về các thiên tai sắp xảy ra gần nơi họ sống. Ví dụ, năm ngoái nhiều nạn nhân lũ lụt ở Đà Nẵng đã được cứu khỏi vùng ngập sâu nhờ những video/hình ảnh ngắn về nơi họ mắc kẹt mà họ đăng lên mạng xã hội như Facebook hay TikTok. Ngoài ra, công tác phối hợp phòng chống bão lũ giữa các ban ngành diễn ra suôn sẻ hơn vì họ có thể họp trực tuyến để hướng dẫn và sơ tán người dân khỏi vùng nguy hiểm. Trong tương lai, việc liên lạc giữa người dân và đội cứu hộ có thể tiện lợi hơn nhiều khi công nghệ thần giao cách cảm có bước đột phá."}, "questions": [{"q": "1.", "options": ["connect", "connecting", "connection", "connector"], "answer": 2, "vis": ["kết nối (động từ, sai)", "đang kết nối (sai)", "sự kết nối (đúng, danh từ)", "đầu nối (sai nghĩa)"], "explanation": "Sau \"the high-speed Internet\" cần DANH TỪ → connection."}, {"q": "2.", "options": ["latest", "last", "later", "late"], "answer": 0, "vis": ["mới nhất (đúng)", "cuối cùng, vừa qua", "muộn hơn", "muộn"], "explanation": "\"the latest news\" = tin tức mới nhất."}, {"q": "3.", "options": ["despite", "because", "thank", "thanks"], "answer": 3, "vis": ["mặc dù", "bởi vì (sai cấu trúc)", "cảm ơn (động từ, sai)", "nhờ vào (đúng — thanks to)"], "explanation": "\"thanks to\" = nhờ vào."}, {"q": "4.", "options": ["smoothy", "smoothly", "smooth", "smoother"], "answer": 1, "vis": ["sai chính tả", "suôn sẻ (đúng, trạng từ)", "trơn tru (tính từ, sai)", "trơn tru hơn (sai)"], "explanation": "Bổ nghĩa cho động từ \"goes\" cần TRẠNG TỪ → smoothly."}, {"q": "5.", "options": ["by", "with", "between", "from"], "answer": 2, "vis": ["bởi", "với", "giữa (đúng)", "từ"], "explanation": "\"communication between A and B\" = sự giao tiếp giữa A và B."}, {"q": "6.", "options": ["convenient", "inconvenient", "convenience", "inconvenience"], "answer": 0, "vis": ["tiện lợi (đúng, tính từ)", "bất tiện", "sự tiện lợi (danh từ, sai)", "sự bất tiện"], "explanation": "Sau \"much more\" cần TÍNH TỪ → convenient."}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Life in the big city", "html": "Life in the big city is fast-paced, fun and exciting. There are countless job opportunities and activities to occupy your time. However, with the good, there also comes the bad. Although the big city has more job opportunities, there are also more people competing for a single job. This can make your job search frustrating. Oddly enough, you will see hundreds, if not thousands of jobs available each week, but you still might remain unemployed, especially when the economy is down. In addition, the cost of living is typically higher in big cities, and it can cost you an arm and a leg for a small apartment in a decent area of the city, not to mention other costs to fulfill your basic demands. Diversity is a good thing, but the number of people can be a bit overwhelming if you are not accustomed to it. There will always be crowds and always be people around. Moreover, traffic can be a nightmare in the big city. It can get so bad that it can turn you into an evil person. If you hate driving in traffic, then the big city life is not for you. Heavy traffic also contributes to pollution, which is one of the biggest disadvantages of living in the city. Obviously, our health is affected most by certain diseases relating to the respiratory system and other body parts. A lot of premature deaths are supposed to be the result of long-term exposure to small particles. Most importantly, there is always more crime in a big city, causing you to reconsider your decision for living in a big city. You are much more likely to be a victim of a crime living in a big city than in a small town.", "vi": "Cuộc sống ở thành phố lớn nhanh, vui và thú vị, với vô số cơ hội việc làm và hoạt động. Nhưng bên cạnh cái tốt cũng có cái xấu: nhiều cơ hội việc làm hơn nhưng cũng nhiều người cạnh tranh hơn cho một vị trí, khiến việc tìm việc dễ nản lòng — có hàng trăm, hàng nghìn việc mỗi tuần nhưng vẫn có thể thất nghiệp, đặc biệt khi kinh tế suy thoái. Ngoài ra, chi phí sinh hoạt thường cao hơn, một căn hộ nhỏ ở khu tốt có thể rất đắt đỏ, chưa kể các chi phí khác. Sự đa dạng là điều tốt nhưng số lượng người đông có thể gây choáng ngợp nếu chưa quen. Giao thông có thể là cơn ác mộng, gây ô nhiễm — một trong những bất lợi lớn nhất của việc sống ở thành phố, ảnh hưởng tới sức khỏe hô hấp. Quan trọng nhất, tội phạm luôn nhiều hơn ở thành phố lớn, khiến bạn dễ trở thành nạn nhân hơn so với ở thị trấn nhỏ."}, "questions": [{"q": "1. There are countless job opportunities and activities in big cities.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"There are countless job opportunities and activities to occupy your time\" → Đúng."}, {"q": "2. People living in big cities always find jobs easily because there are many job opportunities.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: nhiều việc làm nhưng cũng nhiều người cạnh tranh, vẫn có thể thất nghiệp → Sai."}, {"q": "3. The cost of living is usually higher in big cities than in small towns.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"the cost of living is typically higher in big cities\" → Đúng."}, {"q": "4. Heavy traffic in big cities contributes to pollution and affects people's health.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Heavy traffic also contributes to pollution... our health is affected...\" → Đúng."}, {"q": "5. What does the phrase \"cost an arm and a leg\" mean?", "options": ["your legs and arms have good value", "cost a small amount of money", "you must work hard to earn money", "cost a lot of money"], "answer": 3, "explanation": "\"cost an arm and a leg\" = rất đắt đỏ (thành ngữ)."}, {"q": "6. According to the paragraph, city is not a perfect place for ____________.", "options": ["extroverted people", "introverted people", "people who hate driving in traffic", "people who prefer a busy life"], "answer": 2, "explanation": "Bài đọc: \"If you hate driving in traffic, then the big city life is not for you.\""}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Mongolian nomadic lifestyle", "html": "For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland for their cattle. They depend on their livestock for a living. Today, about half of Mongolia's population is living in the ger and moving their camping equipment several times a year. Nomadic life develops in summer and survives in winter. When the weather is warm, they work hard on their farms to get milk and make airag — a type of milk alcohol, consuming meat from their sheep and goats. Once winter comes, temperatures drop quickly and they stay indoors and survive on horse meat. With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable. Many herders use motorbikes to herd cattle and horses. To move their homes, they use trucks instead of ox carts. Solar panels are also becoming an addition to the ger, giving them access to electricity without being confined to one place. The nomads use solar energy to power TV sets and mobile phones.", "vi": "Trong suốt 3.000 năm, người Mông Cổ đã sống ở vùng nông thôn, di chuyển tìm đồng cỏ mới cho gia súc. Họ dựa vào chăn nuôi để sinh sống. Ngày nay, khoảng một nửa dân số Mông Cổ sống trong lều ger và di chuyển đồ đạc cắm trại vài lần một năm. Cuộc sống du mục phát triển mạnh vào mùa hè và duy trì qua mùa đông. Khi thời tiết ấm, họ làm việc chăm chỉ trên nông trại để lấy sữa và làm airag — một loại rượu sữa, và ăn thịt cừu, dê. Khi mùa đông đến, nhiệt độ giảm nhanh, họ ở trong nhà và sống chủ yếu bằng thịt ngựa. Với sự phát triển công nghệ, những thay đổi trong lối sống du mục Mông Cổ gần như không thể tránh khỏi: nhiều người chăn nuôi dùng xe máy để chăn gia súc và ngựa, dùng xe tải thay xe bò để di chuyển nhà, và tấm pin mặt trời đang trở thành vật dụng thêm cho lều ger, giúp họ có điện mà không bị giới hạn ở một chỗ — dùng năng lượng mặt trời để chạy TV và điện thoại di động."}, "questions": [{"q": "1. Mongolians have lived in rural areas and moved to search for new grassland for their cattle for 3,000 years.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"For 3,000 years, Mongolians have lived in the rural areas, moving to search new grassland...\" → Đúng."}, {"q": "2. About half of Mongolia's population lives in gers and moves their camping equipment several times a year.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"about half of Mongolia's population is living in the ger and moving their camping equipment several times a year\" → Đúng."}, {"q": "3. In winter, Mongolian nomads mainly eat milk products from their sheep and goats.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: mùa đông họ sống chủ yếu bằng THỊT NGỰA, sữa là vào mùa hè → Sai."}, {"q": "4. Technology has brought some changes to the traditional Mongolian nomadic lifestyle.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"With the rise of technology, changes in the Mongolian nomadic lifestyle are almost inevitable\" → Đúng."}, {"q": "5. What is the Mongolian's main food in winter?", "options": ["horse meat", "sheep meat", "goat meat", "airag"], "answer": 0, "explanation": "Bài đọc: \"they stay indoors and survive on horse meat\"."}, {"q": "6. Today, Mongolian nomads _______.", "options": ["use solar energy to power electronic devices", "don't lead their lifestyles as herders any more", "use ox carts to move their homes", "have the advantage of city life"], "answer": 0, "explanation": "Bài đọc: \"The nomads use solar energy to power TV sets and mobile phones.\""}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "1.", "original": "Turn off all the lights and you will not pay more money.", "starter": "If", "answer": "you turn off all the lights, you will not pay more money", "accepted": null, "explanation": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V", "vi": "Nếu bạn tắt hết đèn, bạn sẽ không phải trả nhiều tiền hơn.", "note": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V"}, {"q": "2.", "original": "Unless she wears warm clothes, she will have a cold.", "starter": "If", "answer": "she doesn't wear warm clothes, she will have a cold", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu cô ấy không mặc ấm, cô ấy sẽ bị cảm lạnh.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"q": "3.", "original": "Be careful or you may have an accident.", "starter": "If", "answer": "you aren't careful, you may have an accident", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không cẩn thận, bạn có thể gặp tai nạn.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"q": "4.", "original": "Phone your parents or you have a trouble.", "starter": "If", "answer": "you don't phone your parents, you will have trouble", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không gọi điện cho bố mẹ, bạn sẽ gặp rắc rối.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"q": "5.", "original": "Unless she whispers, everyone knows what she is saying.", "starter": "If", "answer": "she doesn't whisper, everyone will know what she is saying", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu cô ấy không thì thầm, mọi người sẽ biết cô ấy đang nói gì.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"q": "6.", "original": "Stay here and you will feel safe.", "starter": "If", "answer": "you stay here, you will feel safe", "accepted": null, "explanation": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V", "vi": "Nếu bạn ở lại đây, bạn sẽ cảm thấy an toàn.", "note": "Imperative + and + S will V = If + S + V (hiện tại đơn), S + will + V"}, {"q": "7.", "original": "Pay the electricity bill today or your electricity will be cut off.", "starter": "If", "answer": "you don't pay the electricity bill today, your electricity will be cut off", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không trả tiền điện hôm nay, điện của bạn sẽ bị cắt.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"q": "8.", "original": "Stop smoking otherwise your cough may be worse.", "starter": "If", "answer": "you don't stop smoking, your cough may be worse", "accepted": null, "explanation": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V", "vi": "Nếu bạn không bỏ hút thuốc, cơn ho của bạn có thể nặng hơn.", "note": "Imperative + or + S will V = If + S + don't/doesn't + V, S + will + V"}, {"q": "9.", "original": "Unless we use less fossil fuel, they will be run out soon.", "starter": "If", "answer": "we don't use less fossil fuel, they will run out soon", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu chúng ta không giảm dùng nhiên liệu hóa thạch, chúng sẽ cạn kiệt sớm.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"q": "10.", "original": "Unless it stops raining today, we may be faced with a serious flood.", "starter": "If", "answer": "it doesn't stop raining today, we may be faced with a serious flood", "accepted": null, "explanation": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V", "vi": "Nếu trời không ngừng mưa hôm nay, chúng ta có thể phải đối mặt với lũ lụt nghiêm trọng.", "note": "Unless + S + V (khẳng định) = If + S + don't/doesn't + V"}, {"q": "11.", "original": "If they don't practise a lot, they will lose the game.", "starter": "Unless", "answer": "they practise a lot, they will lose the game", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi họ luyện tập nhiều, họ sẽ thua trận đấu.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"q": "12.", "original": "I'll miss the train if I don't go now.", "starter": "Unless", "answer": "I go now, I'll miss the train", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi tôi đi ngay bây giờ, tôi sẽ lỡ chuyến tàu.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"q": "13.", "original": "If she doesn't answer the phone, leave her a message.", "starter": "Unless", "answer": "she answers the phone, leave her a message", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi cô ấy trả lời điện thoại, hãy để lại lời nhắn cho cô ấy.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"q": "14.", "original": "If you don't pay the bill, I'll call the police.", "starter": "Unless", "answer": "you pay the bill, I'll call the police", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi bạn trả hóa đơn, tôi sẽ gọi cảnh sát.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}, {"q": "15.", "original": "If he doesn't work hard, he won't pass the examination.", "starter": "Unless", "answer": "he works hard, he won't pass the examination", "accepted": null, "explanation": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)", "vi": "Trừ khi cậu ấy học chăm chỉ, cậu ấy sẽ không đỗ kỳ thi.", "note": "If + S + don't/doesn't + V = Unless + S + V (khẳng định)"}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"pastime\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "pastime", "ipa": "/ˈpɑːstaɪm/", "pos": "noun", "senses": [{"def": "something that you enjoy doing when you are not working (synonym: hobby)", "examples": ["Watching television is still the nation's favorite pastime.", "Gardening is a popular pastime among older people.", "For many people, photography is a pleasant pastime to relieve stress.", "Cooking has become a profitable pastime for her since she started selling her bakes."]}], "vi": "<b>pastime</b> /ˈpɑːstaɪm/ (danh từ)<br>điều bạn thích làm khi không phải làm việc (đồng nghĩa: hobby).<br>• Xem TV vẫn là thú vui yêu thích nhất của cả nước.<br>• Làm vườn là thú vui phổ biến ở người lớn tuổi.<br>• Với nhiều người, nhiếp ảnh là một thú vui dễ chịu để giảm căng thẳng.<br>• Nấu ăn đã trở thành thú vui sinh lời cho cô ấy từ khi cô bắt đầu bán đồ nướng."}, "questions": [{"q": "A. What started as a simple hobby of making handmade jewelry quickly turned into a _______________ for the young artist.", "answer": "profitable pastime", "explanation": "Dựa vào ví dụ: profitable pastime.", "vi": "Điều bắt đầu như một sở thích đơn giản làm trang sức thủ công đã nhanh chóng trở thành thú vui sinh lời cho nghệ sĩ trẻ này."}, {"q": "B. Going camping on weekends is a _______________ among young adults who love nature.", "answer": "popular pastime", "explanation": "Dựa vào ví dụ: popular pastime.", "vi": "Đi cắm trại vào cuối tuần là một thú vui phổ biến trong giới trẻ yêu thiên nhiên."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"picturesque\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "picturesque", "ipa": "/ˌpɪktʃərˈesk/", "pos": "adjective", "senses": [{"def": "(of a place, building, or scene) attractive in a pretty, old-fashioned way", "examples": ["The town is famous for its picturesque streets lined with colorful flowers.", "We decided to take a picturesque route through the mountains instead of the highway.", "The guide showed us a picturesque village nestled in the valley.", "They stayed in a picturesque cottage by the lake during their summer holiday."]}], "vi": "<b>picturesque</b> /ˌpɪktʃərˈesk/ (tính từ)<br>(nơi chốn, tòa nhà, cảnh vật) đẹp, hấp dẫn theo kiểu cổ điển.<br>• Thị trấn nổi tiếng với những con phố đẹp như tranh, rợp hoa nhiều màu.<br>• Chúng tôi quyết định đi theo con đường đẹp qua núi thay vì đường cao tốc.<br>• Hướng dẫn viên đưa chúng tôi đến một ngôi làng đẹp như tranh nép mình trong thung lũng.<br>• Họ nghỉ trong một ngôi nhà tranh đẹp như tranh bên hồ vào kỳ nghỉ hè."}, "questions": [{"q": "3. Many visitors enjoy walking around and taking photos of the ______________ in the old quarter.", "answer": "picturesque streets", "explanation": "Dựa vào ví dụ: picturesque streets.", "vi": "Nhiều du khách thích đi dạo và chụp ảnh những con phố đẹp như tranh trong khu phố cổ."}, {"q": "4. We spent our weekend in a _________________ surrounded by green hills and fresh air.", "answer": "picturesque cottage", "explanation": "Dựa vào ví dụ: picturesque cottage.", "vi": "Chúng tôi nghỉ cuối tuần trong một ngôi nhà tranh đẹp như tranh, bao quanh bởi đồi xanh và không khí trong lành."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">💳🚫💵</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">CARD / DIGITAL PAYMENT ONLY</p></div>", "options": ["You must have the exact amount of cash to buy things.", "Only cash payments are allowed at this store.", "This place accepts card or digital payments, not cash.", "You can pay with cash or a credit card here."], "answer": 2, "vis": ["Bạn phải có đúng số tiền mặt để mua đồ.", "Cửa hàng chỉ nhận tiền mặt.", "Nơi này chỉ nhận thanh toán thẻ/kỹ thuật số, không tiền mặt (đúng).", "Bạn có thể trả bằng tiền mặt hoặc thẻ ở đây."], "explanation": "Biểu tượng thẻ + gạch chéo tiền mặt → chỉ nhận thanh toán thẻ/kỹ thuật số."}, {"q": "2. What does this notice tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">📱🔇</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">PHONE ON SILENT MODE</p></div>", "options": ["You cannot bring your phone inside this building.", "You can listen to loud music through your phone speaker.", "You should keep your mobile phone on silent mode.", "You are allowed to talk loudly on your phone."], "answer": 2, "vis": ["Bạn không được mang điện thoại vào tòa nhà này.", "Bạn có thể nghe nhạc to qua loa điện thoại.", "Bạn nên để điện thoại ở chế độ im lặng (đúng).", "Bạn được phép nói to qua điện thoại."], "explanation": "Biểu tượng điện thoại + loa gạch chéo → yêu cầu để chế độ im lặng."}, {"q": "3. What does this sign tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫⛏️🌳</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">TREE PLANTING ZONE — DO NOT DIG</p></div>", "options": ["You must use heavy machinery to remove trees.", "You should not cut down any big plants here.", "You should plant new green trees in this area.", "You should not dig up the ground in this area."], "answer": 3, "vis": ["Bạn phải dùng máy móc hạng nặng để loại bỏ cây cối.", "Bạn không nên chặt cây to ở đây.", "Bạn nên trồng cây xanh mới ở khu vực này.", "Bạn không nên đào xới đất ở khu vực này (đúng)."], "explanation": "Biển \"Tree planting zone — Do not dig\" → khu vực trồng cây, cấm đào xới."}, {"q": "4. What does this notification from the school library mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-rose-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫💻🔇</div><p class=\"text-[11px] font-black text-center text-rose-700 leading-tight\">NO COMPUTERS — SILENT STUDY AREA</p></div>", "options": ["You can return or check out reference books.", "You are allowed to talk quietly with your peers.", "You cannot use the computer devices at this time.", "You can read newspapers loudly with your friends."], "answer": 2, "vis": ["Bạn có thể trả hoặc mượn sách tham khảo.", "Bạn được phép nói chuyện nhỏ với bạn bè.", "Bạn không được dùng máy tính lúc này (đúng).", "Bạn có thể đọc báo to cùng bạn bè."], "explanation": "Biển \"No computers — Silent study area\" → không dùng máy tính trong khu vực học im lặng."}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 6", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 6 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n
