const STAGES = STAGES_RAW.stages;
const TOTAL_EXPECTED = STAGES_RAW.total;
const EXAM_PAPERS = STAGES_RAW.examPapers;
const STORE_KEY = 'gs_unit5_fulltest_v1';

(function validate(){
  const ids = [];
  let missingAnswer=0, missingExplanation=0;
  STAGES.forEach(s=>{
    s.items.forEach(it=>{
      ids.push(it.id);
      if(it.type==='mcq' && (it.answer===undefined || it.answer===null || it.answer<0 || it.answer>=it.options.length)) missingAnswer++;
      if((it.type==='fill'||it.type==='sentence') && !it.answer) missingAnswer++;
      if(!it.explanation) missingExplanation++;
    });
  });
  const dupSet = new Set(); let dupes=0;
  ids.forEach(id=>{ if(dupSet.has(id)) dupes++; dupSet.add(id); });
  const totalActual = ids.length;
  const problems = [];
  if(totalActual !== TOTAL_EXPECTED) problems.push(`Tổng số câu thực tế (${totalActual}) khác kỳ vọng (${TOTAL_EXPECTED})`);
  if(dupes>0) problems.push(`${dupes} ID bị trùng`);
  if(missingAnswer>0) problems.push(`${missingAnswer} câu thiếu đáp án hợp lệ`);
  if(missingExplanation>0) problems.push(`${missingExplanation} câu thiếu giải thích`);
  EXAM_PAPERS.forEach((paper,i)=>{
    if(paper.length < 40 || paper.length > 50) problems.push(`Đề ${i+1} có ${paper.length} câu (ngoài khoảng 40-50)`);
    const pids = new Set(paper.map(it=>it.id));
    if(pids.size !== paper.length) problems.push(`Đề ${i+1} có câu trùng lặp`);
  });
  // Every stage/category should appear in EVERY paper — catches the class
  // of bug where two small categories get merged into one "family" and
  // random distribution leaves one of them at 0 in some paper.
  const familyOf = (id) => id.replace(/[\d_]+$/, '');
  const stageFamilies = new Set(STAGES.map(s => familyOf(s.items[0] ? s.items[0].id : '')));
  EXAM_PAPERS.forEach((paper,i)=>{
    const presentFamilies = new Set(paper.map(it => familyOf(it.id)));
    stageFamilies.forEach(fam => {
      if(fam && !presentFamilies.has(fam)) problems.push(`Đề ${i+1} thiếu hẳn nhóm câu hỏi "${fam}"`);
    });
  });
  const coveredIds = new Set(); EXAM_PAPERS.forEach(paper=>paper.forEach(it=>coveredIds.add(it.id)));
  const allStageIds = new Set(ids);
  let uncovered = 0; allStageIds.forEach(id=>{ if(!coveredIds.has(id)) uncovered++; });
  if(uncovered>0) problems.push(`${uncovered} câu trong Unit không xuất hiện ở đề kiểm tra nào`);
  const banner = document.getElementById('auditBanner');
  if(problems.length){
    banner.classList.add('show');
    banner.textContent = '⚠️ Content audit: ' + problems.join(' · ');
    console.error('CONTENT AUDIT FAILED', problems);
  } else {
    console.log(`Content audit OK: ${totalActual}/${TOTAL_EXPECTED} câu, ${EXAM_PAPERS.length} đề kiểm tra (mỗi đề ~${EXAM_PAPERS[0].length} câu, cùng nhau phủ đủ 100% câu hỏi), 0 lỗi.`);
  }
})();

function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let STORE = Object.assign({xp:0, streak:0, lastPlay:null, badges:[], stageBest:{}}, loadStore());

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(STORE.lastPlay === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  STORE.streak = (STORE.lastPlay===y) ? STORE.streak+1 : 1;
  STORE.lastPlay = today;
  saveStore(STORE);
}


function normalize(s){ return (s||'').trim().toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d"]/g,'').replace(/[.,!?;:]/g,'').replace(/\s+/g,' '); }
function optionLetter(i){ return ['A','B','C','D'][i]; }
function shuffleArr(a){ return a.slice().sort(()=>Math.random()-0.5); }


function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }

function renderHome(){
  document.getElementById('xpDisplay').textContent = `${STORE.xp} XP`;
  document.getElementById('streakDisplay').textContent = `🔥 ${STORE.streak} ngày`;
  document.getElementById('stageCountHeader').textContent = `${STAGES.length}`;
  document.getElementById('totalCountHeader').textContent = `${TOTAL_EXPECTED}`;
  document.getElementById('totalCount').textContent = `${TOTAL_EXPECTED}`;
  const examGrid = document.getElementById('examGrid');
  examGrid.innerHTML = EXAM_PAPERS.map((paper,i)=>{
    const best = (STORE.examBest||{})[i];
    return `<div class="bg-gradient-to-r from-red-700 to-orange-500 text-white rounded-2xl shadow-lg p-5 cursor-pointer hover:brightness-105 transition" onclick="startExam(${i})">
      <p class="text-lg font-extrabold mb-1">📝 Đề ${i+1}</p>
      <p class="text-sm opacity-90">${paper.length} câu — xáo trộn ngẫu nhiên mỗi lần làm, có tính giờ &amp; điểm</p>
      <p class="text-xs opacity-80 mt-1">${best ? `🏆 ${best.correct}/${best.total} · ⏱️ ${formatTime(best.seconds)}` : 'Chưa làm lần nào'}</p>
    </div>`;
  }).join('');
  document.getElementById('badgesWrap').innerHTML = (STORE.badges||[]).map(b=>`<span class="badge-pill text-xs font-bold px-3 py-1 rounded-full">${b}</span>`).join('');
  let bestSum=0;
  STAGES.forEach(s=>{ const b=STORE.stageBest[s.key]; if(b!==undefined) bestSum+=b; });
  const pct = Math.round(bestSum/TOTAL_EXPECTED*100);
  document.getElementById('overallBar').style.width = pct+'%';
  document.getElementById('overallText').textContent = `${bestSum} / ${TOTAL_EXPECTED} câu (điểm tốt nhất mỗi chặng) — ${pct}%`;
  const grid = document.getElementById('stageGrid');
  grid.innerHTML = STAGES.map(st=>{
    const best = STORE.stageBest[st.key];
    return `<div class="stage-card bg-white rounded-2xl shadow-md p-5" onclick="startStage('${st.key}')">
      <p class="text-3xl mb-1">${st.emoji}</p>
      <p class="font-extrabold text-red-900">${st.title}</p>
      <p class="text-xs text-slate-400">${st.vi} · ${st.items.length} câu</p>
      ${best!==undefined ? `<p class="text-xs text-emerald-600 mt-2 font-bold">🏆 Điểm tốt nhất: ${best}/${st.items.length}</p>` : `<p class="text-xs text-slate-400 mt-2">Chưa làm</p>`}
    </div>`;
  }).join('');
}

let PLAY = null;
function startStage(key, itemsOverride){
  const st = STAGES.find(s=>s.key===key);
  const items = itemsOverride || shuffleArr(st.items);
  PLAY = { key, st, items, i:0, correct:0, wrongList:[], answers:[] };
  showScreen('screen-play');
  renderPlayItem();
}
function quitStage(){ showScreen('screen-home'); renderHome(); }
function goHome(){ showScreen('screen-home'); renderHome(); }

function renderDots(){
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = PLAY.items.map((_,i)=>`<span class="progress-dot ${i<PLAY.i?'done':''}"></span>`).join('');
}
function renderPlayItem(){
  renderDots();
  document.getElementById('playCounter').textContent = `${PLAY.i+1}/${PLAY.items.length}`;
  const it = PLAY.items[PLAY.i];
  const passageBox = document.getElementById('playPassage');
  if(PLAY.st.passage){ passageBox.classList.remove('hidden'); passageBox.innerHTML = PLAY.st.passage; } else { passageBox.classList.add('hidden'); passageBox.innerHTML=''; }
  const card = document.getElementById('playCard');
  let html = `<p class="font-bold text-slate-800 mb-4 text-lg">${it.q}</p>`;
  if(it.image) html = `<div class="mb-3">${it.image}</div>` + html;
  if(it.type==='mcq'){
    html += `<div class="grid gap-2" id="optWrap">` + it.options.map((o,j)=>`<label class="option-label rounded-xl px-4 py-3 text-sm font-semibold flex items-center gap-2" id="opt_${j}" onclick="pickMcq(${j})"><span class="font-black text-red-700">${optionLetter(j)}.</span> ${o}</label>`).join('') + `</div>`;
  } else if(it.type==='fill'){
    html += `<input type="text" id="fillInp" class="answer-input w-full px-4 py-3 rounded-xl text-base font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitFill()">
      <button onclick="submitFill()" class="mt-3 bg-red-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Kiểm tra</button>`;
  } else if(it.type==='sentence'){
    const starterHtml = it.starter ? `<span class="font-extrabold">${it.starter}</span>` : '';
    html += `<div class="flex items-center gap-3 flex-wrap">${starterHtml}
      <input type="text" id="fillInp" class="answer-input flex-1 min-w-[180px] px-4 py-3 rounded-xl text-base font-semibold" placeholder="..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitFill()"></div>
      <button onclick="submitFill()" class="mt-3 bg-red-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Kiểm tra</button>`;
  }
  html += `<div id="feedback" class="hidden mt-4 p-3 rounded-xl text-sm"></div>
    <button id="nextBtn" onclick="nextItem()" class="hidden mt-3 bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-6 py-2.5 rounded-full text-sm">Câu tiếp theo →</button>`;
  card.innerHTML = html;
}
function pickMcq(j){
  const it = PLAY.items[PLAY.i];
  document.querySelectorAll('#optWrap .option-label').forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${j}`).classList.add('selected');
  const ok = j===it.answer;
  it.options.forEach((o,k)=>{ const el=document.getElementById(`opt_${k}`); if(k===it.answer) el.classList.add('correct-opt'); else if(k===j) el.classList.add('wrong-opt'); el.onclick=null; });
  finishAnswer(ok, `${optionLetter(it.answer)}. ${it.options[it.answer]}`);
}
function submitFill(){
  const it = PLAY.items[PLAY.i];
  const inp = document.getElementById('fillInp');
  const val = normalize(inp.value);
  const acc = (it.accepted||[it.answer]).map(normalize);
  const ok = val!=='' && acc.includes(val);
  inp.classList.add(ok?'correct-input':'wrong-input');
  inp.disabled = true;
  const btn = document.querySelector('#playCard button[onclick="submitFill()"]');
  if(btn) btn.classList.add('hidden');
  finishAnswer(ok, it.answer);
}
function finishAnswer(ok, answerLabel){
  const it = PLAY.items[PLAY.i];
  if(ok) PLAY.correct++; else PLAY.wrongList.push(PLAY.i);
  PLAY.answers.push({ok, item:it});
  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  fb.className = 'mt-4 p-3 rounded-xl text-sm ' + (ok? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-700');
  fb.innerHTML = (ok? '✅ Chính xác!' : `❌ Chưa đúng. Đáp án đúng: <b>${answerLabel}</b>`) + (it.explanation?`<br>💡 ${it.explanation}`:'') + (it.vi?`<br>📖 <i>${it.vi}</i>`:'') + (it.note?`<br>📐 <b>${it.note}</b>`:'');
  document.getElementById('nextBtn').classList.remove('hidden');
}
function nextItem(){
  PLAY.i++;
  if(PLAY.i < PLAY.items.length) renderPlayItem();
  else finishStage();
}
function finishStage(){
  bumpStreak();
  const st = PLAY.st;
  const total = PLAY.items.length;
  const pct = Math.round(PLAY.correct/total*100);
  STORE.xp += PLAY.correct*10 + (pct===100?30:0);
  const prevBest = STORE.stageBest[st.key];
  if(prevBest===undefined || PLAY.correct>prevBest) STORE.stageBest[st.key]=PLAY.correct;
  const newBadges=[];
  if(pct===100 && !STORE.badges.includes(`🏆 ${st.title} Perfect`)) newBadges.push(`🏆 ${st.title} Perfect`);
  if(pct>=80 && !STORE.badges.includes(`⭐ ${st.title} Mastered`)) newBadges.push(`⭐ ${st.title} Mastered`);
  const allDone = STAGES.every(s=>STORE.stageBest[s.key]!==undefined || s.key===st.key);
  if(allDone && !STORE.badges.includes('🎓 Unit Complete')) newBadges.push('🎓 Unit Complete');
  STORE.badges = (STORE.badges||[]).concat(newBadges);
  saveStore(STORE);

  showScreen('screen-result');
  document.getElementById('resultEmoji').textContent = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById('resultTitle').textContent = `${st.emoji} ${st.title} — Hoàn thành!`;
  document.getElementById('resultScore').textContent = `${PLAY.correct} / ${total}`;
  document.getElementById('resultAccuracy').textContent = `Độ chính xác: ${pct}%` + (prevBest!==undefined?` · Lần trước: ${prevBest}/${total}`:'');
  document.getElementById('reviewWrongBtn').classList.toggle('hidden', PLAY.wrongList.length===0);
  document.getElementById('retryWrongBtn').classList.toggle('hidden', PLAY.wrongList.length===0);
  document.getElementById('reviewWrap').innerHTML='';
  if(pct>=60) fireConfetti();
}
function showReview(onlyWrong){
  const wrap = document.getElementById('reviewWrap');
  const list = onlyWrong ? PLAY.answers.filter(a=>!a.ok) : PLAY.answers;
  wrap.innerHTML = list.map(a=>{
    const it=a.item;
    const answerLabel = it.type==='mcq' ? `${optionLetter(it.answer)}. ${it.options[it.answer]}` : it.answer;
    return `<div class="bg-white rounded-xl shadow-sm p-4 ${a.ok?'border-l-4 border-emerald-400':'border-l-4 border-rose-400'}">
      <p class="font-bold text-slate-800 text-sm mb-1">${a.ok?'✅':'❌'} ${it.q}</p>
      <p class="text-sm text-slate-600">Đáp án đúng: <b>${answerLabel}</b></p>
      ${it.explanation?`<p class="text-xs text-blue-700 mt-1">💡 ${it.explanation}</p>`:''}
      ${it.vi?`<p class="text-xs text-slate-400 mt-1">📖 ${it.vi}</p>`:''}
      ${it.note?`<p class="text-xs text-violet-600 mt-1">📐 ${it.note}</p>`:''}
    </div>`;
  }).join('');
  wrap.scrollIntoView({behavior:'smooth'});
}
function retryWrongInStage(){
  if(!PLAY.wrongList.length) return;
  const items = PLAY.wrongList.map(i=>PLAY.items[i]);
  startStage(PLAY.key, items);
}


function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

function confirmReset(){
  if(confirm('Xoá toàn bộ tiến độ, XP, huy hiệu? Hành động này không thể hoàn tác.')){
    localStorage.removeItem(STORE_KEY);
    STORE = {xp:0, streak:0, lastPlay:null, badges:[], stageBest:{}};
    renderHome();
  }
}

// ---------- ĐỀ KIỂM TRA TỔNG HỢP (4 fixed papers; together they cover
// every item in the unit at least once. Each ~40-50 items, order
// reshuffled per attempt, timed, hidden feedback until submit, then
// wrong-answer review + retry) ----------
let EXAM = null;
let EXAM_ANSWERS = {};
function formatTime(s){ const m=Math.floor(s/60); const sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }
function startExam(paperIndex, itemsOverride){
  const isRetry = !!itemsOverride;
  const pIdx = paperIndex!==undefined ? paperIndex : (EXAM ? EXAM.paperIndex : 0);
  const items = shuffleArr(itemsOverride || EXAM_PAPERS[pIdx]);
  EXAM = { paperIndex: pIdx, isRetry, items, seconds:0, timer:null, wrongList:[], answers:[] };
  EXAM_ANSWERS = {};
  EXAM_TEXT_ANSWERED.clear();
  showScreen('screen-exam');
  document.getElementById('examTitleBar').textContent = `📝 Đề ${pIdx+1}` + (isRetry ? ' — Làm lại câu sai' : '');
  document.getElementById('examSubmitBar').classList.remove('hidden');
  document.getElementById('examResultBar').classList.add('hidden');
  document.getElementById('examTotalCount').textContent = items.length;
  document.getElementById('examAnsweredCount').textContent = '0';
  renderExam();
  if(EXAM.timer) clearInterval(EXAM.timer);
  EXAM.timer = setInterval(()=>{ EXAM.seconds++; document.getElementById('examTimer').textContent = formatTime(EXAM.seconds); }, 1000);
}
function quitExam(){
  if(EXAM && EXAM.timer) clearInterval(EXAM.timer);
  showScreen('screen-home'); renderHome();
}
function renderExam(){
  const wrap = document.getElementById('examItemsWrap');
  const seenPassages = new Set();
  wrap.innerHTML = EXAM.items.map((it,i)=>{
    let passageHtml = '';
    if(it.passage && !seenPassages.has(it.passage)){
      seenPassages.add(it.passage);
      passageHtml = `<div class="bg-white border border-slate-200 rounded-xl p-4 mb-2 text-sm leading-relaxed text-slate-700">${it.passage}</div>`;
    }
    let body = `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${it.q}</p>`;
    if(it.image) body = `<div class="mb-2">${it.image}</div>` + body;
    if(it.type==='mcq'){
      body += `<div class="grid sm:grid-cols-2 gap-2">` + it.options.map((o,j)=>`<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="examOpt_${i}_${j}" onclick="selectExamMcq(${i},${j})"><span class="font-black text-red-700">${optionLetter(j)}.</span> ${o}</label>`).join('') + `</div>`;
    } else if(it.starter){
      body += `<div class="flex items-center gap-2 flex-wrap"><span class="font-extrabold">${it.starter}</span><input type="text" id="examInp_${i}" class="answer-input flex-1 min-w-[160px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false" oninput="markExamAnswered(${i})"></div>`;
    } else {
      body += `<input type="text" id="examInp_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false" oninput="markExamAnswered(${i})">`;
    }
    body += `<div class="mt-2 text-sm hidden" id="examFb_${i}"></div>`;
    return `<div class="bg-white rounded-2xl shadow-md p-4 mb-3">${passageHtml}${body}</div>`;
  }).join('');
}
const EXAM_TEXT_ANSWERED = new Set();
function markExamAnswered(i){
  const inp = document.getElementById(`examInp_${i}`);
  if(inp && inp.value.trim()!=='') EXAM_TEXT_ANSWERED.add(i); else EXAM_TEXT_ANSWERED.delete(i);
  updateExamAnsweredCount();
}
function updateExamAnsweredCount(){
  const count = Object.keys(EXAM_ANSWERS).length + EXAM_TEXT_ANSWERED.size;
  document.getElementById('examAnsweredCount').textContent = count;
}
function selectExamMcq(i,j){
  document.querySelectorAll(`[id^="examOpt_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`examOpt_${i}_${j}`).classList.add('selected');
  EXAM_ANSWERS[i] = j;
  updateExamAnsweredCount();
}
function submitExam(){
  if(EXAM.timer) clearInterval(EXAM.timer);
  let correct=0; EXAM.wrongList=[]; EXAM.answers=[];
  EXAM.items.forEach((it,i)=>{
    let ok=false, answerLabel='';
    if(it.type==='mcq'){
      const chosen = EXAM_ANSWERS[i];
      ok = chosen===it.answer;
      answerLabel = `${optionLetter(it.answer)}. ${it.options[it.answer]}`;
      it.options.forEach((o,j)=>{ const el=document.getElementById(`examOpt_${i}_${j}`); el.onclick=null; if(j===it.answer) el.classList.add('correct-opt'); else if(j===chosen) el.classList.add('wrong-opt'); });
    } else {
      const inp = document.getElementById(`examInp_${i}`);
      const val = normalize(inp.value);
      const acc = (it.accepted||[it.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.disabled = true;
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = it.answer;
    }
    if(ok) correct++; else EXAM.wrongList.push(i);
    EXAM.answers.push({ok, item:it});
    const fb = document.getElementById(`examFb_${i}`);
    fb.classList.remove('hidden');
    fb.className = 'mt-2 text-sm p-2 rounded-lg ' + (ok?'bg-emerald-50 border border-emerald-200 text-emerald-800':'bg-rose-50 border border-rose-200 text-rose-700');
    fb.innerHTML = (ok?'✅ Chính xác!':`❌ Chưa đúng. Đáp án đúng: <b>${answerLabel}</b>`) + (it.explanation?`<br>💡 ${it.explanation}`:'') + (it.vi?`<br>📖 <i>${it.vi}</i>`:'') + (it.note?`<br>📐 <b>${it.note}</b>`:'');
  });
  const total = EXAM.items.length;
  const pct = Math.round(correct/total*100);
  bumpStreak();
  STORE.xp += correct*10 + (pct===100?50:0);
  if(!EXAM.isRetry){
    STORE.examBest = STORE.examBest || {};
    const prevBest = STORE.examBest[EXAM.paperIndex];
    if(!prevBest || correct>prevBest.correct || (correct===prevBest.correct && EXAM.seconds<prevBest.seconds)){
      STORE.examBest[EXAM.paperIndex] = {correct, total, seconds:EXAM.seconds};
    }
  }
  const newBadges=[];
  const paperLabel = `Đề ${EXAM.paperIndex+1}`;
  if(pct===100 && !STORE.badges.includes(`🏆 ${paperLabel} 100%`)) newBadges.push(`🏆 ${paperLabel} 100%`);
  if(pct>=80 && !STORE.badges.includes(`⭐ ${paperLabel} giỏi (≥80%)`)) newBadges.push(`⭐ ${paperLabel} giỏi (≥80%)`);
  STORE.badges = (STORE.badges||[]).concat(newBadges);
  saveStore(STORE);

  document.getElementById('examSubmitBar').classList.add('hidden');
  document.getElementById('examResultBar').classList.remove('hidden');
  document.getElementById('examResultEmoji').textContent = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById('examResultText').textContent = `${correct} / ${total} câu đúng (${pct}%) · ⏱️ Thời gian: ${formatTime(EXAM.seconds)}`;
  document.getElementById('examRetryBtn').classList.toggle('hidden', EXAM.wrongList.length===0);
  if(pct>=60) fireConfetti();
  document.getElementById('examResultBar').scrollIntoView({behavior:'smooth'});
}
function retryExamWrong(){
  if(!EXAM.wrongList.length) return;
  const items = EXAM.wrongList.map(i=>EXAM.items[i]);
  startExam(EXAM.paperIndex, items);
}
function retryExamSamePaper(){ startExam(EXAM.paperIndex); }

renderHome();
</script>
</body>
