ns with others, especially with older people.", "starter": "We had better not", "answer": "use bad words in conversations with others, especially with older people", "accepted": null, "explanation": "Never + V = We had better not + V", "vi": "Chúng ta không nên dùng lời lẽ thô tục khi nói chuyện với người khác, đặc biệt là người lớn tuổi.", "note": "Never + V = We had better not + V"}, {"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["carp", "article", "party", "tradition"], "answer": 3, "explanation": "\"tradition\" có \"a\" phát âm /ə/, ba từ còn lại phát âm /ɑː/.", "vi": null, "ipas": ["/kɑːp/", "/ˈɑːrtɪkl/", "/ˈpɑːrti/", "/trəˈdɪʃn/"], "vis": ["cá chép", "bài báo", "bữa tiệc", "truyền thống"], "image": null}, {"id": "TFB4", "type": "mcq", "q": "4. Vietnamese people are always required to open a gift immediately in front of the giver.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Vietnamese may or may not open these gifts when they are received; leave the option to them\" → Sai.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "MCQ26", "type": "mcq", "q": "26. We had ________ meal in a restaurant.", "options": ["the", "an", "Ø", "a"], "answer": 3, "explanation": "Danh từ số ít đếm được, nhắc lần đầu, không xác định → a.", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một, trước nguyên âm (sai)", "không mạo từ (sai)", "một (đúng)"], "image": null}, {"id": "MCQ24", "type": "mcq", "q": "24. My aunt has ________ interesting novel.", "options": ["an", "Ø", "the", "a"], "answer": 0, "explanation": "\"interesting\" bắt đầu bằng nguyên âm → dùng \"an\".", "vi": null, "ipas": null, "vis": ["một, trước nguyên âm (đúng)", "không mạo từ (sai)", "xác định (sai)", "một, trước phụ âm (sai)"], "image": null}, {"id": "WF7", "type": "fill", "q": "7. Whether a custom is good or bad is always _______________. (contest)", "answer": "contestable", "explanation": "Sau \"is always\" cần TÍNH TỪ → contestable (có thể tranh cãi).", "vi": "Một phong tục là tốt hay xấu luôn là điều có thể tranh cãi."}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["custom", "correct", "clockwise", "opinion"], "answer": 0, "explanation": "\"custom\" có \"c\" đầu phát âm /k/ nhưng trọng tâm khác biệt về nguyên âm — theo đáp án chính thức khác 3 từ còn lại.", "vi": null, "ipas": ["/ˈkʌstəm/", "/kəˈrekt/", "/ˈklɒkwaɪz/", "/əˈpɪnjən/"], "vis": ["phong tục", "đúng, sửa", "theo chiều kim đồng hồ", "ý kiến"], "image": null}, {"id": "WF8", "type": "fill", "q": "8. The lanterns were hung _______________ across the street for the Mid-Autumn Festival. (decoration)", "answer": "decoratively", "explanation": "Bổ nghĩa cho động từ \"hung\" cần TRẠNG TỪ → decoratively.", "vi": "Những chiếc đèn lồng được treo trang trí khắp phố cho Tết Trung thu."}, {"id": "TFA4", "type": "mcq", "q": "4. The man who catches the garter will be the last person to get married.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: người bắt được nịt tất sẽ là người kết hôn TIẾP THEO, không phải cuối cùng → Sai.", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "MCQ15", "type": "mcq", "q": "15. Many people visit ________ to take pictures with the blooming flowers.", "options": ["flower villages", "Buddhist temples", "ornamental tree", "kumquat tree"], "answer": 0, "explanation": "\"flower villages\" = làng hoa — nơi có nhiều hoa nở để chụp ảnh.", "vi": null, "ipas": null, "vis": ["làng hoa (đúng)", "chùa Phật giáo", "cây cảnh", "cây quất"], "image": null}, {"id": "MCQ10", "type": "mcq", "q": "10. How many people were there at the family ________ last weekend?", "options": ["reunion", "union", "unit", "united"], "answer": 0, "explanation": "\"family reunion\" = sự đoàn tụ gia đình.", "vi": null, "ipas": null, "vis": ["đoàn tụ (đúng)", "liên minh", "đơn vị", "đã đoàn kết"], "image": null}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"tradition\"] A. Nam is _______________________ of making Chung cakes every Tet.", "answer": "carrying on the family tradition", "explanation": "Dựa vào ví dụ: carrying on the family tradition.", "vi": "Nam đang tiếp nối truyền thống gia đình làm bánh chưng mỗi dịp Tết."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"tradition\"] B. This year, our class decided to _______________________ and celebrate Christmas at the beach instead of at school.", "answer": "break with tradition", "explanation": "Dựa vào ví dụ: break with tradition.", "vi": "Năm nay, lớp chúng tôi quyết định phá vỡ truyền thống và đón Giáng sinh ở biển thay vì ở trường."}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["to", "for", "at", "in"], "answer": 2, "explanation": "\"at home\" = tại nhà.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}, {"id": "MCQ28", "type": "mcq", "q": "28. He tried to park his car but ________ space wasn't big enough.", "options": ["the", "Ø", "a", "an"], "answer": 0, "explanation": "Chỗ đỗ xe CỤ THỂ đang nói tới (đã xác định trong ngữ cảnh) → the.", "vi": null, "ipas": null, "vis": ["xác định (đúng)", "không mạo từ (sai)", "một (sai)", "một, trước nguyên âm (sai)"], "image": null}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["import", "important", "importance", "importantly"], "answer": 1, "explanation": "Bổ nghĩa cho danh từ \"part\" cần TÍNH TỪ → important.", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "PIC4", "type": "mcq", "q": "4. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🧤✅</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">GLOVES MUST BE WORN</p></div>", "options": ["It's a good idea to wear gloves in this place.", "Hand protection is mandatory before entering this place.", "Remember to bring your own gloves to this zone.", "You don't have to wear gloves in this place."], "answer": 1, "explanation": "Biển báo bắt buộc đeo găng tay.", "vi": null}, {"id": "MCQ5", "type": "mcq", "q": "5. We have a ________ every New Year's Day.", "options": ["martial arts", "table manners", "chase away", "family reunion"], "answer": 3, "explanation": "\"family reunion\" = sự đoàn tụ gia đình — hợp nghĩa với ngày đầu năm mới.", "vi": null, "ipas": null, "vis": ["võ thuật", "phép tắc ăn uống", "xua đuổi", "đoàn tụ gia đình (đúng)"], "image": null}, {"id": "TR7", "type": "sentence", "q": "It's a good idea to hand bowls with both hands.", "starter": "We should", "answer": "hand bowls with both hands", "accepted": null, "explanation": "It's a good idea to V = We should + V", "vi": "Nên đưa bát bằng cả hai tay.", "note": "It's a good idea to V = We should + V"}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["some", "the", "a", "an"], "answer": 1, "explanation": "\"the custom\" — phong tục cụ thể được nhắc tới, dùng \"the\".", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "MCQ21", "type": "mcq", "q": "21. Thank you. That was ________ very nice lunch.", "options": ["the", "a", "an", "Ø"], "answer": 1, "explanation": "\"nice\" bắt đầu bằng phụ âm /n/ → dùng \"a\", và đây là danh từ đếm được số ít được nhắc lần đầu.", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một (đúng)", "một (trước nguyên âm, sai)", "không mạo từ (sai)"], "image": null}, {"id": "TFB6", "type": "mcq", "q": "6. Which of the following is NOT true about gift-giving customs in Viet Nam?", "options": ["Gift-giving is a good way of strengthening relationships.", "Gifts for your partners should be given at private occasions.", "You should avoid giving anything sharp.", "It is considered rude not to open the gift in front of the giver."], "answer": 3, "explanation": "Bài đọc nói ngược lại: người Việt có thể KHÔNG mở quà ngay trước mặt người tặng, không có gì bất lịch sự cả.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "PIC1", "type": "mcq", "q": "1. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">⚠️💧🚶</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">CAUTION — WET FLOOR</p></div>", "options": ["The floor is wet, so you should walk carefully.", "You are responsible for cleaning this floor.", "You are not allowed to use this floor for walking.", "It is safe to run fast in this area."], "answer": 0, "explanation": "Biển báo \"Caution — Wet floor\" → sàn ướt, cần đi cẩn thận.", "vi": null}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["generation", "ancestor", "ceremony", "worshiper"], "answer": 0, "explanation": "\"from one generation to another\" = từ thế hệ này sang thế hệ khác.", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["design", "preserve", "basic", "physical"], "answer": 2, "explanation": "\"basic\" có \"s\" phát âm /s/, ba từ còn lại phát âm /z/.", "vi": null, "ipas": ["/dɪˈzaɪn/", "/prɪˈzɜːrv/", "/ˈbeɪsɪk/", "/ˈfɪzɪkl/"], "vis": ["thiết kế", "bảo tồn", "cơ bản", "thuộc về thể chất"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. Taking care of the family is ________ considered women's duty in many Eastern countries.", "options": ["traditional", "traditionally", "tradition", "traditionalism"], "answer": 1, "explanation": "Bổ nghĩa cho động từ bị động \"is considered\" cần TRẠNG TỪ → traditionally.", "vi": null, "ipas": null, "vis": ["thuộc truyền thống (tính từ, sai)", "theo truyền thống (đúng, trạng từ)", "truyền thống (danh từ, sai)", "chủ nghĩa truyền thống (sai)"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. Many young people don't ________ the tradition of living with their parents when they are eighteen.", "options": ["try", "follow", "obey", "take"], "answer": 1, "explanation": "\"follow a tradition\" = tuân theo/làm theo truyền thống.", "vi": null, "ipas": null, "vis": ["thử", "tuân theo (đúng)", "vâng lời (không hợp collocation với tradition)", "lấy"], "image": null}, {"id": "STR10", "type": "mcq", "q": "10. Which word has a different stress pattern from that of the others?", "options": ["custom", "explain", "chopstick", "manner"], "answer": 1, "explanation": "\"explain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkʌstəm/", "/ɪkˈspleɪn/", "/ˈtʃɒpstɪk/", "/ˈmænər/"], "vis": ["phong tục", "giải thích", "đũa", "cách cư xử"], "image": null}, {"id": "STR3", "type": "mcq", "q": "3. Which word has a different stress pattern from that of the others?", "options": ["resident", "cutlery", "ancestor", "permission"], "answer": 3, "explanation": "\"permission\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈrezɪdənt/", "/ˈkʌtləri/", "/ˈænsestər/", "/pərˈmɪʃn/"], "vis": ["cư dân", "dao dĩa", "tổ tiên", "sự cho phép"], "image": null}, {"id": "MCQ17", "type": "mcq", "q": "17. Festivals are important because they keep some village traditions ________.", "options": ["alive", "lively", "living", "live"], "answer": 0, "explanation": "\"keep sth alive\" = giữ cho cái gì tồn tại/sống động.", "vi": null, "ipas": null, "vis": ["còn tồn tại (đúng — keep...alive)", "sinh động (tính từ khác nghĩa)", "đang sống", "trực tiếp"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["generation", "presentation", "necessity", "obligation"], "answer": 2, "explanation": "\"necessity\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/ˌdʒenəˈreɪʃn/", "/ˌpreznˈteɪʃn/", "/nəˈsesəti/", "/ˌɒblɪˈɡeɪʃn/"], "vis": ["thế hệ", "sự trình bày", "sự cần thiết", "nghĩa vụ"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Which word has a different stress pattern from that of the others?", "options": ["village", "bamboo", "away", "obey"], "answer": 0, "explanation": "\"village\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈvɪlɪdʒ/", "/bæmˈbuː/", "/əˈweɪ/", "/oʊˈbeɪ/"], "vis": ["làng", "tre", "đi xa", "vâng lời"], "image": null}, {"id": "TFA1", "type": "mcq", "q": "1. The saying \"something old, something new, something borrowed, something blue\" dates back to 19th century England.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"an old saying that dates back to 19th century England\" → Đúng.", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "MCQ30", "type": "mcq", "q": "30. Where can ________ people buy everything they need?", "options": ["Ø", "a", "an", "the"], "answer": 0, "explanation": "Danh từ số nhiều mang nghĩa chung chung → không mạo từ.", "vi": null, "ipas": null, "vis": ["không mạo từ (đúng)", "một (sai — people số nhiều)", "một, trước nguyên âm (sai)", "xác định (sai — nghĩa chung)"], "image": null}, {"id": "TR2", "type": "sentence", "q": "Last year we went to Thailand on Tet holiday.", "starter": "Last year we broke with tradition by", "answer": "going to Thailand on Tet holiday", "accepted": null, "explanation": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing", "vi": "Năm ngoái chúng tôi đã phá vỡ truyền thống bằng cách đi Thái Lan vào dịp Tết.", "note": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing"}, {"id": "TFB3", "type": "mcq", "q": "3. Sharp objects such as scissors or knives should be avoided as gifts because they symbolize cutting the relationship.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Gifts that symbolize cutting... should be avoided because they mean the cutting of the relationship\" → Đúng.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "WF6", "type": "fill", "q": "6. The children looked at the folk artists with great _______________. (admire)", "answer": "admiration", "explanation": "Sau \"with great\" cần DANH TỪ → admiration (sự ngưỡng mộ).", "vi": "Bọn trẻ nhìn các nghệ nhân dân gian với sự ngưỡng mộ lớn."}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["delicious", "traditional", "spicy", "tradition"], "answer": 1, "explanation": "\"traditional foods\" = món ăn truyền thống.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}], [{"id": "TFB2", "type": "mcq", "q": "2. It is acceptable to wrap a gift in black paper in Viet Nam.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Do not wrap a gift in black paper because this color is unlucky\" → Sai.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "TR9", "type": "sentence", "q": "Don't sweep the floor on the first three days of Tet.", "starter": "We shouldn't", "answer": "sweep the floor on the first three days of Tet", "accepted": null, "explanation": "Don't + V = We shouldn't + V", "vi": "Chúng ta không nên quét nhà trong ba ngày đầu năm mới.", "note": "Don't + V = We shouldn't + V"}, {"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["celebrate", "join", "take part in", "participate"], "answer": 0, "explanation": "\"celebrate Tet\" = đón/mừng Tết.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}, {"id": "TR8", "type": "sentence", "q": "We should wait for the host to start eating.", "starter": "We had better", "answer": "wait for the host to start eating", "accepted": null, "explanation": "We should + V = We had better + V", "vi": "Chúng ta nên đợi chủ nhà bắt đầu ăn trước.", "note": "We should + V = We had better + V"}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["reunion", "festival", "tradition", "worship"], "answer": 2, "explanation": "\"this beautiful old tradition\" = truyền thống đẹp cổ xưa này.", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "TFA3", "type": "mcq", "q": "3. Something borrowed shows that the bride has friends and family who are willing to help her.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Something borrowed... means the bride has friends and family who are willing to help her\" → Đúng.", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "MCQ20", "type": "mcq", "q": "20. Tet's ________ is the longest holiday which may last up to seven to nine days.", "options": ["celebration", "celebratory", "celebrated", "celebrate"], "answer": 0, "explanation": "Làm chủ ngữ của câu cần DANH TỪ → celebration.", "vi": null, "ipas": null, "vis": ["lễ kỷ niệm (đúng, danh từ)", "có tính chất kỷ niệm (tính từ)", "đã kỷ niệm (quá khứ)", "kỷ niệm (động từ)"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["custom", "correct", "clockwise", "opinion"], "answer": 0, "explanation": "\"custom\" có \"c\" đầu phát âm /k/ nhưng trọng tâm khác biệt về nguyên âm — theo đáp án chính thức khác 3 từ còn lại.", "vi": null, "ipas": ["/ˈkʌstəm/", "/kəˈrekt/", "/ˈklɒkwaɪz/", "/əˈpɪnjən/"], "vis": ["phong tục", "đúng, sửa", "theo chiều kim đồng hồ", "ý kiến"], "image": null}, {"id": "MCQ25", "type": "mcq", "q": "25. ________ used razor blade is useless.", "options": ["The", "A", "Ø", "An"], "answer": 1, "explanation": "\"used\" bắt đầu bằng phụ âm /j/ (như \"u\" trong uniform) → dùng \"a\".", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một (đúng)", "không mạo từ (sai)", "một, trước nguyên âm (sai)"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. Many young people don't ________ the tradition of living with their parents when they are eighteen.", "options": ["try", "follow", "obey", "take"], "answer": 1, "explanation": "\"follow a tradition\" = tuân theo/làm theo truyền thống.", "vi": null, "ipas": null, "vis": ["thử", "tuân theo (đúng)", "vâng lời (không hợp collocation với tradition)", "lấy"], "image": null}, {"id": "TFA6", "type": "mcq", "q": "6. Why do some brides wear a blue garter on their leg?", "options": ["Because too many brides paint their fingernails a light blue color.", "Because it is a symbol of trust and faith between the bride and the groom.", "To show how the couple can be lucky in their marriage.", "To show how popular something blue is in a wedding."], "answer": 1, "explanation": "Bài đọc: \"Something blue is a symbol of trust and faith between the couple.\"", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "MCQ11", "type": "mcq", "q": "11. We should buy some ________ for the house before Tet.", "options": ["decoratively", "decorate", "decorations", "decorative"], "answer": 2, "explanation": "Sau \"some\" cần DANH TỪ số nhiều → decorations (đồ trang trí).", "vi": null, "ipas": null, "vis": ["một cách trang trí (trạng từ, sai)", "trang trí (động từ, sai)", "đồ trang trí (đúng)", "mang tính trang trí (tính từ, sai)"], "image": null}, {"id": "PIC1", "type": "mcq", "q": "1. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">⚠️💧🚶</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">CAUTION — WET FLOOR</p></div>", "options": ["The floor is wet, so you should walk carefully.", "You are responsible for cleaning this floor.", "You are not allowed to use this floor for walking.", "It is safe to run fast in this area."], "answer": 0, "explanation": "Biển báo \"Caution — Wet floor\" → sàn ướt, cần đi cẩn thận.", "vi": null}, {"id": "TR2", "type": "sentence", "q": "Last year we went to Thailand on Tet holiday.", "starter": "Last year we broke with tradition by", "answer": "going to Thailand on Tet holiday", "accepted": null, "explanation": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing", "vi": "Năm ngoái chúng tôi đã phá vỡ truyền thống bằng cách đi Thái Lan vào dịp Tết.", "note": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing"}, {"id": "MCQ2", "type": "mcq", "q": "2. The Vietnamese New Year ________ from the first day of the first month of the Lunar calendar for at least three days.", "options": ["take after", "take off", "take up", "take place"], "answer": 3, "explanation": "\"take place\" = diễn ra — hợp nghĩa với thời gian bắt đầu và kéo dài của Tết.", "vi": null, "ipas": null, "vis": ["giống ai đó", "cởi ra, cất cánh", "bắt đầu làm", "diễn ra (đúng)"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. In Maori culture, it's the _________ for people to press their noses when it comes to greeting.", "options": ["customer", "customize", "customary", "custom"], "answer": 2, "explanation": "\"it's customary for sb to V\" = theo lệ thường/tập quán thì ai đó làm gì.", "vi": null, "ipas": null, "vis": ["khách hàng", "tùy chỉnh", "theo tập quán (đúng)", "phong tục (danh từ, không hợp cấu trúc \"the ___ for\")"], "image": null}, {"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"custom\"] A. Every Tet, Vietnamese people _______________________ visiting their relatives and giving lucky money to children.", "answer": "follow the custom of", "explanation": "Dựa vào ví dụ: follow the custom of.", "vi": "Mỗi dịp Tết, người Việt theo phong tục thăm họ hàng và mừng tuổi trẻ em."}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["some", "the", "a", "an"], "answer": 1, "explanation": "\"the custom\" — phong tục cụ thể được nhắc tới, dùng \"the\".", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "WF5", "type": "fill", "q": "5. They were willing to show their _______________ of the new rules. (accept)", "answer": "acceptance", "explanation": "Sau tính từ sở hữu \"their\" cần DANH TỪ → acceptance.", "vi": "Họ sẵn lòng thể hiện sự chấp nhận các quy định mới."}, {"id": "MCQ4", "type": "mcq", "q": "4. It's considered good manners ________ younger generations in the family to invite elders to eat before starting a meal.", "options": ["at", "up", "on", "for"], "answer": 3, "explanation": "Cấu trúc: it's + adj + for sb + to V.", "vi": null, "ipas": null, "vis": ["tại", "lên", "trên", "cho (đúng — for sb to V)"], "image": null}, {"id": "WF2", "type": "fill", "q": "2. The whole town was full of _______________ and happiness during the New Year. (festive)", "answer": "festivity", "explanation": "Sau \"full of\" và song song với \"happiness\" (danh từ) cần DANH TỪ → festivity.", "vi": "Cả thị trấn tràn ngập không khí lễ hội và niềm vui trong dịp năm mới."}, {"id": "TR1", "type": "sentence", "q": "There's a tradition that English people drink a lot of tea.", "starter": "English people follow", "answer": "the tradition of drinking a lot of tea", "accepted": null, "explanation": "There's a tradition that S + V = S + follow(s) the tradition of + V-ing", "vi": "Người Anh có truyền thống uống rất nhiều trà.", "note": "There's a tradition that S + V = S + follow(s) the tradition of + V-ing"}, {"id": "PIC5", "type": "mcq", "q": "5. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫✂️🔪</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO SHARP OBJECTS ON BOARD</p></div>", "options": ["You can't buy sharp objects like scissors or knives during the flight.", "Using both scissors and knives at the same time is prohibited on the plane.", "You can't bring any sharp objects on the plane.", "You can't use scissors or knives because they are sharp."], "answer": 2, "explanation": "Biển báo cấm mang vật sắc nhọn lên máy bay.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["to", "for", "at", "in"], "answer": 2, "explanation": "\"at home\" = tại nhà.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}, {"id": "WF9", "type": "fill", "q": "9. I felt _______________ to help my neighbor prepare the Tet feast. (obligation)", "answer": "obliged", "explanation": "Sau \"felt\" cần TÍNH TỪ chỉ cảm giác → obliged (cảm thấy có nghĩa vụ).", "vi": "Tôi cảm thấy có trách nhiệm phải giúp hàng xóm chuẩn bị mâm cỗ Tết."}, {"id": "MCQ18", "type": "mcq", "q": "18. The Japanese perform ________ during New Year celebrations.", "options": ["bamboo dance", "flower village", "lion dance", "festival goer"], "answer": 2, "explanation": "\"lion dance\" = múa lân — biểu diễn phổ biến dịp năm mới ở Nhật.", "vi": null, "ipas": null, "vis": ["múa tre", "làng hoa", "múa lân (đúng)", "người đi lễ hội"], "image": null}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["custom", "worship", "maintain", "midnight"], "answer": 2, "explanation": "\"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkʌstəm/", "/ˈwɜːrʃɪp/", "/meɪnˈteɪn/", "/ˈmɪdnaɪt/"], "vis": ["phong tục", "thờ cúng", "duy trì", "nửa đêm"], "image": null}, {"id": "TFA5", "type": "mcq", "q": "5. Which of the following is a good title for the text?", "options": ["Various types of weddings.", "A wedding tradition and its meaning.", "What should be worn on your wedding day.", "How to plan a traditional wedding."], "answer": 1, "explanation": "Bài đọc chủ yếu giải thích ý nghĩa của một truyền thống cưới cụ thể.", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["occupation", "occasion", "shake", "miraculous"], "answer": 3, "explanation": "\"miraculous\" có \"a\" phát âm /æ/, ba từ còn lại phát âm /eɪ/.", "vi": null, "ipas": ["/ˌɒkjuˈpeɪʃn/", "/əˈkeɪʒn/", "/ʃeɪk/", "/mɪˈrækjələs/"], "vis": ["nghề nghiệp", "dịp, cơ hội", "lay, rung", "kỳ diệu"], "image": null}, {"id": "TR3", "type": "sentence", "q": "The Vietnamese have the custom of worshipping ancestors.", "starter": "In Viet Nam there is", "answer": "a custom of worshipping ancestors", "accepted": null, "explanation": "S + have/has the custom of + V-ing = There + is/are + a custom of + V-ing", "vi": "Ở Việt Nam có phong tục thờ cúng tổ tiên.", "note": "S + have/has the custom of + V-ing = There + is/are + a custom of + V-ing"}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["festival", "contestant", "atmosphere", "family"], "answer": 1, "explanation": "\"contestant\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈfestɪvl/", "/kənˈtestənt/", "/ˈætməsfɪr/", "/ˈfæməli/"], "vis": ["lễ hội", "thí sinh", "bầu không khí", "gia đình"], "image": null}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"tradition\"] B. This year, our class decided to _______________________ and celebrate Christmas at the beach instead of at school.", "answer": "break with tradition", "explanation": "Dựa vào ví dụ: break with tradition.", "vi": "Năm nay, lớp chúng tôi quyết định phá vỡ truyền thống và đón Giáng sinh ở biển thay vì ở trường."}, {"id": "MCQ15", "type": "mcq", "q": "15. Many people visit ________ to take pictures with the blooming flowers.", "options": ["flower villages", "Buddhist temples", "ornamental tree", "kumquat tree"], "answer": 0, "explanation": "\"flower villages\" = làng hoa — nơi có nhiều hoa nở để chụp ảnh.", "vi": null, "ipas": null, "vis": ["làng hoa (đúng)", "chùa Phật giáo", "cây cảnh", "cây quất"], "image": null}, {"id": "TFB1", "type": "mcq", "q": "1. Personal relationships play an important role in gift-giving customs in Viet Nam.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Gift-giving is important... because of the significance of interpersonal relationships\" → Đúng.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["design", "preserve", "basic", "physical"], "answer": 2, "explanation": "\"basic\" có \"s\" phát âm /s/, ba từ còn lại phát âm /z/.", "vi": null, "ipas": ["/dɪˈzaɪn/", "/prɪˈzɜːrv/", "/ˈbeɪsɪk/", "/ˈfɪzɪkl/"], "vis": ["thiết kế", "bảo tồn", "cơ bản", "thuộc về thể chất"], "image": null}, {"id": "MCQ7", "type": "mcq", "q": "7. They ________ presents under the Christmas trees on Christmas day.", "options": ["maintain", "place", "release", "pray"], "answer": 1, "explanation": "\"place presents\" = đặt quà — hợp nghĩa với việc đặt quà dưới cây thông.", "vi": null, "ipas": null, "vis": ["duy trì", "đặt (đúng)", "thả, phóng thích", "cầu nguyện"], "image": null}, {"id": "MCQ21", "type": "mcq", "q": "21. Thank you. That was ________ very nice lunch.", "options": ["the", "a", "an", "Ø"], "answer": 1, "explanation": "\"nice\" bắt đầu bằng phụ âm /n/ → dùng \"a\", và đây là danh từ đếm được số ít được nhắc lần đầu.", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một (đúng)", "một (trước nguyên âm, sai)", "không mạo từ (sai)"], "image": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["to make", "making", "make", "makes"], "answer": 0, "explanation": "Cấu trúc: difficult + to V.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}, {"id": "TFB4", "type": "mcq", "q": "4. Vietnamese people are always required to open a gift immediately in front of the giver.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Vietnamese may or may not open these gifts when they are received; leave the option to them\" → Sai.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "WF10", "type": "fill", "q": "10. The best way to learn about other cultures is to _______________ with local people. (social)", "answer": "socialize", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → socialize (giao lưu, hòa nhập).", "vi": "Cách tốt nhất để tìm hiểu văn hóa khác là giao lưu với người dân địa phương."}, {"id": "PRON2", "type": "mcq", "q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["connect", "cook", "dance", "control"], "answer": 2, "explanation": "\"dance\" có \"c\" phát âm /s/, ba từ còn lại phát âm /k/.", "vi": null, "ipas": ["/kəˈnekt/", "/kʊk/", "/dæns/", "/kənˈtroʊl/"], "vis": ["kết nối", "nấu ăn", "nhảy múa", "kiểm soát"], "image": null}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["generation", "ancestor", "ceremony", "worshiper"], "answer": 0, "explanation": "\"from one generation to another\" = từ thế hệ này sang thế hệ khác.", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["generation", "presentation", "necessity", "obligation"], "answer": 2, "explanation": "\"necessity\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/ˌdʒenəˈreɪʃn/", "/ˌpreznˈteɪʃn/", "/nəˈsesəti/", "/ˌɒblɪˈɡeɪʃn/"], "vis": ["thế hệ", "sự trình bày", "sự cần thiết", "nghĩa vụ"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "28. He tried to park his car but ________ space wasn't big enough.", "options": ["the", "Ø", "a", "an"], "answer": 0, "explanation": "Chỗ đỗ xe CỤ THỂ đang nói tới (đã xác định trong ngữ cảnh) → the.", "vi": null, "ipas": null, "vis": ["xác định (đúng)", "không mạo từ (sai)", "một (sai)", "một, trước nguyên âm (sai)"], "image": null}, {"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["holiday", "decorate", "offering", "addition"], "answer": 3, "explanation": "\"addition\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhɒlədeɪ/", "/ˈdekəreɪt/", "/ˈɒfərɪŋ/", "/əˈdɪʃn/"], "vis": ["ngày nghỉ lễ", "trang trí", "lễ vật", "sự thêm vào"], "image": null}], [{"id": "TR6", "type": "sentence", "q": "The Ok Om Bok Festival takes place in October.", "starter": "People organize", "answer": "the Ok Om Bok Festival in October", "accepted": null, "explanation": "S + take(s) place = People + organize/hold/celebrate + O", "vi": "Người ta tổ chức lễ hội Ok Om Bok vào tháng Mười.", "note": "S + take(s) place = People + organize/hold/celebrate + O"}, {"id": "PIC2", "type": "mcq", "q": "2. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔄🚗⭕</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">ROUNDABOUT — GO AROUND</p></div>", "options": ["All vehicles must drive through the center of the circle.", "You must drive straight ahead at the intersection.", "Vehicles must travel on top of the traffic circle.", "Drivers are required to move around the traffic circle."], "answer": 3, "explanation": "Biển báo bùng binh (roundabout) → phải đi vòng quanh.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["touched", "smelled", "looked", "served"], "answer": 3, "explanation": "\"served immediately\" = được dọn/ăn ngay lập tức.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___ ụ"], "image": null}, {"id": "MCQ26", "type": "mcq", "q": "26. We had ________ meal in a restaurant.", "options": ["the", "an", "Ø", "a"], "answer": 3, "explanation": "Danh từ số ít đếm được, nhắc lần đầu, không xác định → a.", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một, trước nguyên âm (sai)", "không mạo từ (sai)", "một (đúng)"], "image": null}, {"id": "MCQ8", "type": "mcq", "q": "8. People in Hanoi ________ to give Ong Cong Ong Tao a ride to Heaven.", "options": ["release carps", "unicorn dance", "release lanterns", "bad spirit"], "answer": 0, "explanation": "Tục thả cá chép để tiễn ông Công ông Táo về trời → release carps.", "vi": null, "ipas": null, "vis": ["thả cá chép (đúng)", "múa lân", "thả đèn lồng", "tà ma"], "image": null}, {"id": "TR12", "type": "sentence", "q": "Organising the festivals is one way for us to maintain our traditions.", "starter": "We can maintain our traditions by", "answer": "organising the festivals", "accepted": null, "explanation": "V-ing... is one way for us to V2 = We can + V2 + by + V-ing", "vi": "Tổ chức các lễ hội là một cách để chúng ta duy trì truyền thống.", "note": "V-ing... is one way for us to V2 = We can + V2 + by + V-ing"}, {"id": "TFB5", "type": "mcq", "q": "5. According to the passage, why is gift-giving important in Viet Nam?", "options": ["Because it helps to establish a friendship.", "Because it's common in Vietnamese culture.", "Because it's the best way to build up a stable relationship.", "Because personal relationships play a vital role in Vietnamese culture."], "answer": 3, "explanation": "Bài đọc mở đầu: \"Gift-giving is important in Viet Nam because of the significance of interpersonal relationships...\".", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["to light", "lighting", "light", "lighted"], "answer": 0, "explanation": "Cấu trúc \"be used to V\" (mục đích: được dùng để làm gì) → to light.", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "TR3", "type": "sentence", "q": "The Vietnamese have the custom of worshipping ancestors.", "starter": "In Viet Nam there is", "answer": "a custom of worshipping ancestors", "accepted": null, "explanation": "S + have/has the custom of + V-ing = There + is/are + a custom of + V-ing", "vi": "Ở Việt Nam có phong tục thờ cúng tổ tiên.", "note": "S + have/has the custom of + V-ing = There + is/are + a custom of + V-ing"}, {"id": "TFA1", "type": "mcq", "q": "1. The saying \"something old, something new, something borrowed, something blue\" dates back to 19th century England.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"an old saying that dates back to 19th century England\" → Đúng.", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "MCQ2", "type": "mcq", "q": "2. The Vietnamese New Year ________ from the first day of the first month of the Lunar calendar for at least three days.", "options": ["take after", "take off", "take up", "take place"], "answer": 3, "explanation": "\"take place\" = diễn ra — hợp nghĩa với thời gian bắt đầu và kéo dài của Tết.", "vi": null, "ipas": null, "vis": ["giống ai đó", "cởi ra, cất cánh", "bắt đầu làm", "diễn ra (đúng)"], "image": null}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["generation", "ancestor", "ceremony", "worshiper"], "answer": 0, "explanation": "\"from one generation to another\" = từ thế hệ này sang thế hệ khác.", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "MCQ12", "type": "mcq", "q": "12. In Maori culture, it's the _________ for people to press their noses when it comes to greeting.", "options": ["customer", "customize", "customary", "custom"], "answer": 2, "explanation": "\"it's customary for sb to V\" = theo lệ thường/tập quán thì ai đó làm gì.", "vi": null, "ipas": null, "vis": ["khách hàng", "tùy chỉnh", "theo tập quán (đúng)", "phong tục (danh từ, không hợp cấu trúc \"the ___ for\")"], "image": null}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["festival", "contestant", "atmosphere", "family"], "answer": 1, "explanation": "\"contestant\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈfestɪvl/", "/kənˈtestənt/", "/ˈætməsfɪr/", "/ˈfæməli/"], "vis": ["lễ hội", "thí sinh", "bầu không khí", "gia đình"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. Shaking hands is the most popular way ________ greeting in Britain.", "options": ["at", "of", "against", "to"], "answer": 1, "explanation": "Cấu trúc: a way of + V-ing.", "vi": null, "ipas": null, "vis": ["tại", "của (đúng — a way of)", "chống lại", "đến"], "image": null}, {"id": "MCQ20", "type": "mcq", "q": "20. Tet's ________ is the longest holiday which may last up to seven to nine days.", "options": ["celebration", "celebratory", "celebrated", "celebrate"], "answer": 0, "explanation": "Làm chủ ngữ của câu cần DANH TỪ → celebration.", "vi": null, "ipas": null, "vis": ["lễ kỷ niệm (đúng, danh từ)", "có tính chất kỷ niệm (tính từ)", "đã kỷ niệm (quá khứ)", "kỷ niệm (động từ)"], "image": null}, {"id": "TFB2", "type": "mcq", "q": "2. It is acceptable to wrap a gift in black paper in Viet Nam.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Do not wrap a gift in black paper because this color is unlucky\" → Sai.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["reunion", "festival", "tradition", "worship"], "answer": 2, "explanation": "\"this beautiful old tradition\" = truyền thống đẹp cổ xưa này.", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["cousin", "interesting", "link", "fond"], "answer": 2, "explanation": "\"link\" phát âm /ɪ/ (nguyên âm ngắn khác biệt), ba từ còn lại chung nhóm âm khác theo đáp án chính thức.", "vi": null, "ipas": ["/ˈkʌzn/", "/ˈɪntrəstɪŋ/", "/lɪŋk/", "/fɒnd/"], "vis": ["anh chị em họ", "thú vị", "liên kết", "yêu thích"], "image": null}, {"id": "STR2", "type": "mcq", "q": "2. Which word has a different stress pattern from that of the others?", "options": ["laughter", "prepare", "chopstick", "heaven"], "answer": 1, "explanation": "\"prepare\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈlæftər/", "/prɪˈper/", "/ˈtʃɒpstɪk/", "/ˈhevn/"], "vis": ["tiếng cười", "chuẩn bị", "đũa", "thiên đàng"], "image": null}, {"id": "TR9", "type": "sentence", "q": "Don't sweep the floor on the first three days of Tet.", "starter": "We shouldn't", "answer": "sweep the floor on the first three days of Tet", "accepted": null, "explanation": "Don't + V = We shouldn't + V", "vi": "Chúng ta không nên quét nhà trong ba ngày đầu năm mới.", "note": "Don't + V = We shouldn't + V"}, {"id": "PIC5", "type": "mcq", "q": "5. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫✂️🔪</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO SHARP OBJECTS ON BOARD</p></div>", "options": ["You can't buy sharp objects like scissors or knives during the flight.", "Using both scissors and knives at the same time is prohibited on the plane.", "You can't bring any sharp objects on the plane.", "You can't use scissors or knives because they are sharp."], "answer": 2, "explanation": "Biển báo cấm mang vật sắc nhọn lên máy bay.", "vi": null}, {"id": "WF4", "type": "fill", "q": "4. Children should talk _______________ to their grandparents and elders. (respect)", "answer": "respectfully", "explanation": "Bổ nghĩa cho động từ \"talk\" cần TRẠNG TỪ → respectfully.", "vi": "Trẻ em nên nói chuyện lễ phép với ông bà và người lớn tuổi."}, {"id": "WF5", "type": "fill", "q": "5. They were willing to show their _______________ of the new rules. (accept)", "answer": "acceptance", "explanation": "Sau tính từ sở hữu \"their\" cần DANH TỪ → acceptance.", "vi": "Họ sẵn lòng thể hiện sự chấp nhận các quy định mới."}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["occupation", "occasion", "shake", "miraculous"], "answer": 3, "explanation": "\"miraculous\" có \"a\" phát âm /æ/, ba từ còn lại phát âm /eɪ/.", "vi": null, "ipas": ["/ˌɒkjuˈpeɪʃn/", "/əˈkeɪʒn/", "/ʃeɪk/", "/mɪˈrækjələs/"], "vis": ["nghề nghiệp", "dịp, cơ hội", "lay, rung", "kỳ diệu"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "5. Which word has the underlined part pronounced differently from that of the others?", "options": ["kidding", "generate", "sponge", "oblige"], "answer": 0, "explanation": "\"kidding\" có \"g\" phát âm /ɡ/, ba từ còn lại phát âm /dʒ/.", "vi": null, "ipas": ["/ˈkɪdɪŋ/", "/ˈdʒenəreɪt/", "/spʌndʒ/", "/əˈblaɪdʒ/"], "vis": ["đùa giỡn", "tạo ra", "miếng bọt biển", "bắt buộc"], "image": null}, {"id": "STR8", "type": "mcq", "q": "8. Which word has a different stress pattern from that of the others?", "options": ["respect", "mention", "expert", "worship"], "answer": 0, "explanation": "\"respect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/rɪˈspekt/", "/ˈmenʃn/", "/ˈekspɜːrt/", "/ˈwɜːrʃɪp/"], "vis": ["tôn trọng", "đề cập", "chuyên gia", "thờ cúng"], "image": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["to make", "making", "make", "makes"], "answer": 0, "explanation": "Cấu trúc: difficult + to V.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}, {"id": "PRON2", "type": "mcq", "q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["connect", "cook", "dance", "control"], "answer": 2, "explanation": "\"dance\" có \"c\" phát âm /s/, ba từ còn lại phát âm /k/.", "vi": null, "ipas": ["/kəˈnekt/", "/kʊk/", "/dæns/", "/kənˈtroʊl/"], "vis": ["kết nối", "nấu ăn", "nhảy múa", "kiểm soát"], "image": null}, {"id": "WF8", "type": "fill", "q": "8. The lanterns were hung _______________ across the street for the Mid-Autumn Festival. (decoration)", "answer": "decoratively", "explanation": "Bổ nghĩa cho động từ \"hung\" cần TRẠNG TỪ → decoratively.", "vi": "Những chiếc đèn lồng được treo trang trí khắp phố cho Tết Trung thu."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"custom\"] B. _______________________ here for the bride to wear a red ao dai on her wedding day.", "answer": "It is the custom", "explanation": "Dựa vào ví dụ: It is the custom.", "vi": "Ở đây có phong tục cô dâu mặc áo dài đỏ trong ngày cưới."}, {"id": "MCQ22", "type": "mcq", "q": "22. He majors in ________ English.", "options": ["a", "Ø", "the", "an"], "answer": 1, "explanation": "Tên môn học/ngôn ngữ chung chung không dùng mạo từ.", "vi": null, "ipas": null, "vis": ["một (sai)", "không mạo từ (đúng)", "xác định (sai)", "một, trước nguyên âm (sai)"], "image": null}, {"id": "MCQ25", "type": "mcq", "q": "25. ________ used razor blade is useless.", "options": ["The", "A", "Ø", "An"], "answer": 1, "explanation": "\"used\" bắt đầu bằng phụ âm /j/ (như \"u\" trong uniform) → dùng \"a\".", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một (đúng)", "không mạo từ (sai)", "một, trước nguyên âm (sai)"], "image": null}, {"id": "WF7", "type": "fill", "q": "7. Whether a custom is good or bad is always _______________. (contest)", "answer": "contestable", "explanation": "Sau \"is always\" cần TÍNH TỪ → contestable (có thể tranh cãi).", "vi": "Một phong tục là tốt hay xấu luôn là điều có thể tranh cãi."}, {"id": "MCQ3", "type": "mcq", "q": "3. Taking care of the family is ________ considered women's duty in many Eastern countries.", "options": ["traditional", "traditionally", "tradition", "traditionalism"], "answer": 1, "explanation": "Bổ nghĩa cho động từ bị động \"is considered\" cần TRẠNG TỪ → traditionally.", "vi": null, "ipas": null, "vis": ["thuộc truyền thống (tính từ, sai)", "theo truyền thống (đúng, trạng từ)", "truyền thống (danh từ, sai)", "chủ nghĩa truyền thống (sai)"], "image": null}, {"id": "MCQ6", "type": "mcq", "q": "6. It's the ________ in that country for women to get married in white.", "options": ["habit", "custom", "costume", "hobby"], "answer": 1, "explanation": "\"custom\" = phong tục (của một cộng đồng/quốc gia), khác \"habit\" (thói quen cá nhân).", "vi": null, "ipas": null, "vis": ["thói quen cá nhân", "phong tục (đúng)", "trang phục", "sở thích"], "image": null}, {"id": "MCQ4", "type": "mcq", "q
