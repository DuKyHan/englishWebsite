<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 5 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 5 · Festivals in Viet Nam</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["carp", "article", "party", "tradition"], "answer": 3, "explanation": "\"tradition\" có \"a\" phát âm /ə/, ba từ còn lại phát âm /ɑː/.", "vi": null, "ipas": ["/kɑːp/", "/ˈɑːrtɪkl/", "/ˈpɑːrti/", "/trəˈdɪʃn/"], "vis": ["cá chép", "bài báo", "bữa tiệc", "truyền thống"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["connect", "cook", "dance", "control"], "answer": 2, "explanation": "\"dance\" có \"c\" phát âm /s/, ba từ còn lại phát âm /k/.", "vi": null, "ipas": ["/kəˈnekt/", "/kʊk/", "/dæns/", "/kənˈtroʊl/"], "vis": ["kết nối", "nấu ăn", "nhảy múa", "kiểm soát"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["pass", "palm", "sharp", "man"], "answer": 3, "explanation": "\"man\" phát âm /æ/, ba từ còn lại phát âm /ɑː/.", "vi": null, "ipas": ["/pæs/", "/pɑːm/", "/ʃɑːrp/", "/mæn/"], "vis": ["đi qua", "lòng bàn tay", "sắc bén", "đàn ông"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["custom", "correct", "clockwise", "opinion"], "answer": 0, "explanation": "\"custom\" có \"c\" đầu phát âm /k/ nhưng trọng tâm khác biệt về nguyên âm — theo đáp án chính thức khác 3 từ còn lại.", "vi": null, "ipas": ["/ˈkʌstəm/", "/kəˈrekt/", "/ˈklɒkwaɪz/", "/əˈpɪnjən/"], "vis": ["phong tục", "đúng, sửa", "theo chiều kim đồng hồ", "ý kiến"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "5. Which word has the underlined part pronounced differently from that of the others?", "options": ["kidding", "generate", "sponge", "oblige"], "answer": 0, "explanation": "\"kidding\" có \"g\" phát âm /ɡ/, ba từ còn lại phát âm /dʒ/.", "vi": null, "ipas": ["/ˈkɪdɪŋ/", "/ˈdʒenəreɪt/", "/spʌndʒ/", "/əˈblaɪdʒ/"], "vis": ["đùa giỡn", "tạo ra", "miếng bọt biển", "bắt buộc"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["design", "preserve", "basic", "physical"], "answer": 2, "explanation": "\"basic\" có \"s\" phát âm /s/, ba từ còn lại phát âm /z/.", "vi": null, "ipas": ["/dɪˈzaɪn/", "/prɪˈzɜːrv/", "/ˈbeɪsɪk/", "/ˈfɪzɪkl/"], "vis": ["thiết kế", "bảo tồn", "cơ bản", "thuộc về thể chất"], "image": null}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["cousin", "interesting", "link", "fond"], "answer": 2, "explanation": "\"link\" phát âm /ɪ/ (nguyên âm ngắn khác biệt), ba từ còn lại chung nhóm âm khác theo đáp án chính thức.", "vi": null, "ipas": ["/ˈkʌzn/", "/ˈɪntrəstɪŋ/", "/lɪŋk/", "/fɒnd/"], "vis": ["anh chị em họ", "thú vị", "liên kết", "yêu thích"], "image": null}, {"id": "PRON8", "type": "mcq", "q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["lantern", "important", "money", "thank"], "answer": 3, "explanation": "\"thank\" có \"th\" phát âm /θ/ (âm cắn lưỡi), khác biệt với phụ âm mũi ở 3 từ còn lại.", "vi": null, "ipas": ["/ˈlæntərn/", "/ɪmˈpɔːrtnt/", "/ˈmʌni/", "/θæŋk/"], "vis": ["đèn lồng", "quan trọng", "tiền", "cảm ơn"], "image": null}, {"id": "PRON9", "type": "mcq", "q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["many", "take", "place", "wake"], "answer": 0, "explanation": "\"many\" có \"a\" phát âm /e/, ba từ còn lại phát âm /eɪ/.", "vi": null, "ipas": ["/ˈmeni/", "/teɪk/", "/pleɪs/", "/weɪk/"], "vis": ["nhiều", "lấy", "đặt, nơi chốn", "thức dậy"], "image": null}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["occupation", "occasion", "shake", "miraculous"], "answer": 3, "explanation": "\"miraculous\" có \"a\" phát âm /æ/, ba từ còn lại phát âm /eɪ/.", "vi": null, "ipas": ["/ˌɒkjuˈpeɪʃn/", "/əˈkeɪʒn/", "/ʃeɪk/", "/mɪˈrækjələs/"], "vis": ["nghề nghiệp", "dịp, cơ hội", "lay, rung", "kỳ diệu"], "image": null}]}, {"key": "stress0", "title": "Stressed syllable", "emoji": "🎯", "vi": "Trọng âm", "items": [{"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["holiday", "decorate", "offering", "addition"], "answer": 3, "explanation": "\"addition\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhɒlədeɪ/", "/ˈdekəreɪt/", "/ˈɒfərɪŋ/", "/əˈdɪʃn/"], "vis": ["ngày nghỉ lễ", "trang trí", "lễ vật", "sự thêm vào"], "image": null}, {"id": "STR2", "type": "mcq", "q": "2. Which word has a different stress pattern from that of the others?", "options": ["laughter", "prepare", "chopstick", "heaven"], "answer": 1, "explanation": "\"prepare\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈlæftər/", "/prɪˈper/", "/ˈtʃɒpstɪk/", "/ˈhevn/"], "vis": ["tiếng cười", "chuẩn bị", "đũa", "thiên đàng"], "image": null}, {"id": "STR3", "type": "mcq", "q": "3. Which word has a different stress pattern from that of the others?", "options": ["resident", "cutlery", "ancestor", "permission"], "answer": 3, "explanation": "\"permission\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈrezɪdənt/", "/ˈkʌtləri/", "/ˈænsestər/", "/pərˈmɪʃn/"], "vis": ["cư dân", "dao dĩa", "tổ tiên", "sự cho phép"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["generation", "presentation", "necessity", "obligation"], "answer": 2, "explanation": "\"necessity\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/ˌdʒenəˈreɪʃn/", "/ˌpreznˈteɪʃn/", "/nəˈsesəti/", "/ˌɒblɪˈɡeɪʃn/"], "vis": ["thế hệ", "sự trình bày", "sự cần thiết", "nghĩa vụ"], "image": null}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["festival", "contestant", "atmosphere", "family"], "answer": 1, "explanation": "\"contestant\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈfestɪvl/", "/kənˈtestənt/", "/ˈætməsfɪr/", "/ˈfæməli/"], "vis": ["lễ hội", "thí sinh", "bầu không khí", "gia đình"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Which word has a different stress pattern from that of the others?", "options": ["village", "bamboo", "away", "obey"], "answer": 0, "explanation": "\"village\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈvɪlɪdʒ/", "/bæmˈbuː/", "/əˈweɪ/", "/oʊˈbeɪ/"], "vis": ["làng", "tre", "đi xa", "vâng lời"], "image": null}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["custom", "worship", "maintain", "midnight"], "answer": 2, "explanation": "\"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkʌstəm/", "/ˈwɜːrʃɪp/", "/meɪnˈteɪn/", "/ˈmɪdnaɪt/"], "vis": ["phong tục", "thờ cúng", "duy trì", "nửa đêm"], "image": null}, {"id": "STR8", "type": "mcq", "q": "8. Which word has a different stress pattern from that of the others?", "options": ["respect", "mention", "expert", "worship"], "answer": 0, "explanation": "\"respect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/rɪˈspekt/", "/ˈmenʃn/", "/ˈekspɜːrt/", "/ˈwɜːrʃɪp/"], "vis": ["tôn trọng", "đề cập", "chuyên gia", "thờ cúng"], "image": null}, {"id": "STR9", "type": "mcq", "q": "9. Which word has a different stress pattern from that of the others?", "options": ["pagoda", "complement", "society", "tradition"], "answer": 1, "explanation": "\"complement\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/pəˈɡoʊdə/", "/ˈkɒmplɪmənt/", "/səˈsaɪəti/", "/trəˈdɪʃn/"], "vis": ["ngôi chùa", "bổ ngữ", "xã hội", "truyền thống"], "image": null}, {"id": "STR10", "type": "mcq", "q": "10. Which word has a different stress pattern from that of the others?", "options": ["custom", "explain", "chopstick", "manner"], "answer": 1, "explanation": "\"explain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkʌstəm/", "/ɪkˈspleɪn/", "/ˈtʃɒpstɪk/", "/ˈmænər/"], "vis": ["phong tục", "giải thích", "đũa", "cách cư xử"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "1. Kung Fu and Karate are my favorite ________.", "options": ["lion dance", "table manners", "martial arts", "flower village"], "answer": 2, "explanation": "\"martial arts\" = võ thuật — Kung Fu, Karate đều thuộc nhóm này.", "vi": null, "ipas": null, "vis": ["múa lân", "phép tắc ăn uống", "võ thuật (đúng)", "làng hoa"], "image": null}, {"id": "MCQ2", "type": "mcq", "q": "2. The Vietnamese New Year ________ from the first day of the first month of the Lunar calendar for at least three days.", "options": ["take after", "take off", "take up", "take place"], "answer": 3, "explanation": "\"take place\" = diễn ra — hợp nghĩa với thời gian bắt đầu và kéo dài của Tết.", "vi": null, "ipas": null, "vis": ["giống ai đó", "cởi ra, cất cánh", "bắt đầu làm", "diễn ra (đúng)"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. Taking care of the family is ________ considered women's duty in many Eastern countries.", "options": ["traditional", "traditionally", "tradition", "traditionalism"], "answer": 1, "explanation": "Bổ nghĩa cho động từ bị động \"is considered\" cần TRẠNG TỪ → traditionally.", "vi": null, "ipas": null, "vis": ["thuộc truyền thống (tính từ, sai)", "theo truyền thống (đúng, trạng từ)", "truyền thống (danh từ, sai)", "chủ nghĩa truyền thống (sai)"], "image": null}, {"id": "MCQ4", "type": "mcq", "q": "4. It's considered good manners ________ younger generations in the family to invite elders to eat before starting a meal.", "options": ["at", "up", "on", "for"], "answer": 3, "explanation": "Cấu trúc: it's + adj + for sb + to V.", "vi": null, "ipas": null, "vis": ["tại", "lên", "trên", "cho (đúng — for sb to V)"], "image": null}, {"id": "MCQ5", "type": "mcq", "q": "5. We have a ________ every New Year's Day.", "options": ["martial arts", "table manners", "chase away", "family reunion"], "answer": 3, "explanation": "\"family reunion\" = sự đoàn tụ gia đình — hợp nghĩa với ngày đầu năm mới.", "vi": null, "ipas": null, "vis": ["võ thuật", "phép tắc ăn uống", "xua đuổi", "đoàn tụ gia đình (đúng)"], "image": null}, {"id": "MCQ6", "type": "mcq", "q": "6. It's the ________ in that country for women to get married in white.", "options": ["habit", "custom", "costume", "hobby"], "answer": 1, "explanation": "\"custom\" = phong tục (của một cộng đồng/quốc gia), khác \"habit\" (thói quen cá nhân).", "vi": null, "ipas": null, "vis": ["thói quen cá nhân", "phong tục (đúng)", "trang phục", "sở thích"], "image": null}, {"id": "MCQ7", "type": "mcq", "q": "7. They ________ presents under the Christmas trees on Christmas day.", "options": ["maintain", "place", "release", "pray"], "answer": 1, "explanation": "\"place presents\" = đặt quà — hợp nghĩa với việc đặt quà dưới cây thông.", "vi": null, "ipas": null, "vis": ["duy trì", "đặt (đúng)", "thả, phóng thích", "cầu nguyện"], "image": null}, {"id": "MCQ8", "type": "mcq", "q": "8. People in Hanoi ________ to give Ong Cong Ong Tao a ride to Heaven.", "options": ["release carps", "unicorn dance", "release lanterns", "bad spirit"], "answer": 0, "explanation": "Tục thả cá chép để tiễn ông Công ông Táo về trời → release carps.", "vi": null, "ipas": null, "vis": ["thả cá chép (đúng)", "múa lân", "thả đèn lồng", "tà ma"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. Shaking hands is the most popular way ________ greeting in Britain.", "options": ["at", "of", "against", "to"], "answer": 1, "explanation": "Cấu trúc: a way of + V-ing.", "vi": null, "ipas": null, "vis": ["tại", "của (đúng — a way of)", "chống lại", "đến"], "image": null}, {"id": "MCQ10", "type": "mcq", "q": "10. How many people were there at the family ________ last weekend?", "options": ["reunion", "union", "unit", "united"], "answer": 0, "explanation": "\"family reunion\" = sự đoàn tụ gia đình.", "vi": null, "ipas": null, "vis": ["đoàn tụ (đúng)", "liên minh", "đơn vị", "đã đoàn kết"], "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "11. We should buy some ________ for the house before Tet.", "options": ["decoratively", "decorate", "decorations", "decorative"], "answer": 2, "explanation": "Sau \"some\" cần DANH TỪ số nhiều → decorations (đồ trang trí).", "vi": null, "ipas": null, "vis": ["một cách trang trí (trạng từ, sai)", "trang trí (động từ, sai)", "đồ trang trí (đúng)", "mang tính trang trí (tính từ, sai)"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. In Maori culture, it's the _________ for people to press their noses when it comes to greeting.", "options": ["customer", "customize", "customary", "custom"], "answer": 2, "explanation": "\"it's customary for sb to V\" = theo lệ thường/tập quán thì ai đó làm gì.", "vi": null, "ipas": null, "vis": ["khách hàng", "tùy chỉnh", "theo tập quán (đúng)", "phong tục (danh từ, không hợp cấu trúc \"the ___ for\")"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. Many young people don't ________ the tradition of living with their parents when they are eighteen.", "options": ["try", "follow", "obey", "take"], "answer": 1, "explanation": "\"follow a tradition\" = tuân theo/làm theo truyền thống.", "vi": null, "ipas": null, "vis": ["thử", "tuân theo (đúng)", "vâng lời (không hợp collocation với tradition)", "lấy"], "image": null}, {"id": "MCQ14", "type": "mcq", "q": "14. In Japan, take ________ your shoes at the entrance to all home, and most businesses and hotels.", "options": ["off", "at", "in", "to"], "answer": 0, "explanation": "\"take off your shoes\" = cởi giày ra.", "vi": null, "ipas": null, "vis": ["cởi ra (đúng)", "tại", "trong", "đến"], "image": null}, {"id": "MCQ15", "type": "mcq", "q": "15. Many people visit ________ to take pictures with the blooming flowers.", "options": ["flower villages", "Buddhist temples", "ornamental tree", "kumquat tree"], "answer": 0, "explanation": "\"flower villages\" = làng hoa — nơi có nhiều hoa nở để chụp ảnh.", "vi": null, "ipas": null, "vis": ["làng hoa (đúng)", "chùa Phật giáo", "cây cảnh", "cây quất"], "image": null}, {"id": "MCQ16", "type": "mcq", "q": "16. We ________ the Spring Festival on the 15th of January in the lunar calendar.", "options": ["occur", "hold", "happen", "take place"], "answer": 1, "explanation": "\"hold a festival\" = tổ chức lễ hội (chủ động), khác \"occur/happen/take place\" (tự xảy ra, không có tân ngữ).", "vi": null, "ipas": null, "vis": ["tự xảy ra (nội động từ, sai)", "tổ chức (đúng — ngoại động từ)", "tự xảy ra (nội động từ, sai)", "diễn ra (nội động từ, sai)"], "image": null}, {"id": "MCQ17", "type": "mcq", "q": "17. Festivals are important because they keep some village traditions ________.", "options": ["alive", "lively", "living", "live"], "answer": 0, "explanation": "\"keep sth alive\" = giữ cho cái gì tồn tại/sống động.", "vi": null, "ipas": null, "vis": ["còn tồn tại (đúng — keep...alive)", "sinh động (tính từ khác nghĩa)", "đang sống", "trực tiếp"], "image": null}, {"id": "MCQ18", "type": "mcq", "q": "18. The Japanese perform ________ during New Year celebrations.", "options": ["bamboo dance", "flower village", "lion dance", "festival goer"], "answer": 2, "explanation": "\"lion dance\" = múa lân — biểu diễn phổ biến dịp năm mới ở Nhật.", "vi": null, "ipas": null, "vis": ["múa tre", "làng hoa", "múa lân (đúng)", "người đi lễ hội"], "image": null}, {"id": "MCQ19", "type": "mcq", "q": "19. Linda fell in love with Peter without knowing about his real ________ status.", "options": ["social", "socialability", "society", "socialable"], "answer": 0, "explanation": "Bổ nghĩa cho danh từ \"status\" cần TÍNH TỪ → social.", "vi": null, "ipas": null, "vis": ["thuộc xã hội (đúng, tính từ)", "sai chính tả", "xã hội (danh từ, sai)", "sai chính tả"], "image": null}, {"id": "MCQ20", "type": "mcq", "q": "20. Tet's ________ is the longest holiday which may last up to seven to nine days.", "options": ["celebration", "celebratory", "celebrated", "celebrate"], "answer": 0, "explanation": "Làm chủ ngữ của câu cần DANH TỪ → celebration.", "vi": null, "ipas": null, "vis": ["lễ kỷ niệm (đúng, danh từ)", "có tính chất kỷ niệm (tính từ)", "đã kỷ niệm (quá khứ)", "kỷ niệm (động từ)"], "image": null}]}, {"key": "mcq2", "title": "Vocabulary & Grammar (21-30)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ21", "type": "mcq", "q": "21. Thank you. That was ________ very nice lunch.", "options": ["the", "a", "an", "Ø"], "answer": 1, "explanation": "\"nice\" bắt đầu bằng phụ âm /n/ → dùng \"a\", và đây là danh từ đếm được số ít được nhắc lần đầu.", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một (đúng)", "một (trước nguyên âm, sai)", "không mạo từ (sai)"], "image": null}, {"id": "MCQ22", "type": "mcq", "q": "22. He majors in ________ English.", "options": ["a", "Ø", "the", "an"], "answer": 1, "explanation": "Tên môn học/ngôn ngữ chung chung không dùng mạo từ.", "vi": null, "ipas": null, "vis": ["một (sai)", "không mạo từ (đúng)", "xác định (sai)", "một, trước nguyên âm (sai)"], "image": null}, {"id": "MCQ23", "type": "mcq", "q": "23. We often watch ________ television.", "options": ["a", "an", "the", "x"], "answer": 3, "explanation": "\"watch television\" (xem TV nói chung) không dùng mạo từ.", "vi": null, "ipas": null, "vis": ["một (sai)", "một, trước nguyên âm (sai)", "xác định (sai)", "không mạo từ (đúng)"], "image": null}, {"id": "MCQ24", "type": "mcq", "q": "24. My aunt has ________ interesting novel.", "options": ["an", "Ø", "the", "a"], "answer": 0, "explanation": "\"interesting\" bắt đầu bằng nguyên âm → dùng \"an\".", "vi": null, "ipas": null, "vis": ["một, trước nguyên âm (đúng)", "không mạo từ (sai)", "xác định (sai)", "một, trước phụ âm (sai)"], "image": null}, {"id": "MCQ25", "type": "mcq", "q": "25. ________ used razor blade is useless.", "options": ["The", "A", "Ø", "An"], "answer": 1, "explanation": "\"used\" bắt đầu bằng phụ âm /j/ (như \"u\" trong uniform) → dùng \"a\".", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một (đúng)", "không mạo từ (sai)", "một, trước nguyên âm (sai)"], "image": null}, {"id": "MCQ26", "type": "mcq", "q": "26. We had ________ meal in a restaurant.", "options": ["the", "an", "Ø", "a"], "answer": 3, "explanation": "Danh từ số ít đếm được, nhắc lần đầu, không xác định → a.", "vi": null, "ipas": null, "vis": ["xác định (sai)", "một, trước nguyên âm (sai)", "không mạo từ (sai)", "một (đúng)"], "image": null}, {"id": "MCQ27", "type": "mcq", "q": "27. Can you turn off ________ television, please?", "options": ["the", "a", "an", "Ø"], "answer": 0, "explanation": "Chỉ CÁI TIVI CỤ THỂ trong phòng (đã xác định) → the.", "vi": null, "ipas": null, "vis": ["xác định (đúng)", "một (sai)", "một, trước nguyên âm (sai)", "không mạo từ (sai)"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "28. He tried to park his car but ________ space wasn't big enough.", "options": ["the", "Ø", "a", "an"], "answer": 0, "explanation": "Chỗ đỗ xe CỤ THỂ đang nói tới (đã xác định trong ngữ cảnh) → the.", "vi": null, "ipas": null, "vis": ["xác định (đúng)", "không mạo từ (sai)", "một (sai)", "một, trước nguyên âm (sai)"], "image": null}, {"id": "MCQ29", "type": "mcq", "q": "29. We live at ________ third house from the church.", "options": ["Ø", "an", "a", "the"], "answer": 3, "explanation": "Trước số thứ tự (third) → the.", "vi": null, "ipas": null, "vis": ["không mạo từ (sai)", "một, trước nguyên âm (sai)", "một (sai)", "xác định (đúng — trước số thứ tự)"], "image": null}, {"id": "MCQ30", "type": "mcq", "q": "30. Where can ________ people buy everything they need?", "options": ["Ø", "a", "an", "the"], "answer": 0, "explanation": "Danh từ số nhiều mang nghĩa chung chung → không mạo từ.", "vi": null, "ipas": null, "vis": ["không mạo từ (đúng)", "một (sai — people số nhiều)", "một, trước nguyên âm (sai)", "xác định (sai — nghĩa chung)"], "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "1. Wearing new clothes on Tet is a long-standing _______________ in Vietnam. (traditional)", "answer": "tradition", "explanation": "Sau \"a long-standing\" cần DANH TỪ → tradition (không phải tính từ traditional).", "vi": "Mặc quần áo mới vào dịp Tết là một truyền thống lâu đời ở Việt Nam."}, {"id": "WF2", "type": "fill", "q": "2. The whole town was full of _______________ and happiness during the New Year. (festive)", "answer": "festivity", "explanation": "Sau \"full of\" và song song với \"happiness\" (danh từ) cần DANH TỪ → festivity.", "vi": "Cả thị trấn tràn ngập không khí lễ hội và niềm vui trong dịp năm mới."}, {"id": "WF3", "type": "fill", "q": "3. It's important to _______________ the beautiful customs of our ancestors. (maintenance)", "answer": "maintain", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → maintain (không phải danh từ maintenance).", "vi": "Điều quan trọng là duy trì những phong tục đẹp của tổ tiên chúng ta."}, {"id": "WF4", "type": "fill", "q": "4. Children should talk _______________ to their grandparents and elders. (respect)", "answer": "respectfully", "explanation": "Bổ nghĩa cho động từ \"talk\" cần TRẠNG TỪ → respectfully.", "vi": "Trẻ em nên nói chuyện lễ phép với ông bà và người lớn tuổi."}, {"id": "WF5", "type": "fill", "q": "5. They were willing to show their _______________ of the new rules. (accept)", "answer": "acceptance", "explanation": "Sau tính từ sở hữu \"their\" cần DANH TỪ → acceptance.", "vi": "Họ sẵn lòng thể hiện sự chấp nhận các quy định mới."}, {"id": "WF6", "type": "fill", "q": "6. The children looked at the folk artists with great _______________. (admire)", "answer": "admiration", "explanation": "Sau \"with great\" cần DANH TỪ → admiration (sự ngưỡng mộ).", "vi": "Bọn trẻ nhìn các nghệ nhân dân gian với sự ngưỡng mộ lớn."}, {"id": "WF7", "type": "fill", "q": "7. Whether a custom is good or bad is always _______________. (contest)", "answer": "contestable", "explanation": "Sau \"is always\" cần TÍNH TỪ → contestable (có thể tranh cãi).", "vi": "Một phong tục là tốt hay xấu luôn là điều có thể tranh cãi."}, {"id": "WF8", "type": "fill", "q": "8. The lanterns were hung _______________ across the street for the Mid-Autumn Festival. (decoration)", "answer": "decoratively", "explanation": "Bổ nghĩa cho động từ \"hung\" cần TRẠNG TỪ → decoratively.", "vi": "Những chiếc đèn lồng được treo trang trí khắp phố cho Tết Trung thu."}, {"id": "WF9", "type": "fill", "q": "9. I felt _______________ to help my neighbor prepare the Tet feast. (obligation)", "answer": "obliged", "explanation": "Sau \"felt\" cần TÍNH TỪ chỉ cảm giác → obliged (cảm thấy có nghĩa vụ).", "vi": "Tôi cảm thấy có trách nhiệm phải giúp hàng xóm chuẩn bị mâm cỗ Tết."}, {"id": "WF10", "type": "fill", "q": "10. The best way to learn about other cultures is to _______________ with local people. (social)", "answer": "socialize", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → socialize (giao lưu, hòa nhập).", "vi": "Cách tốt nhất để tìm hiểu văn hóa khác là giao lưu với người dân địa phương."}]}, {"key": "readingA", "title": "A) Tet food", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["celebrate", "join", "take part in", "participate"], "answer": 0, "explanation": "\"celebrate Tet\" = đón/mừng Tết.", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["delicious", "traditional", "spicy", "tradition"], "answer": 1, "explanation": "\"traditional foods\" = món ăn truyền thống.", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["because", "while", "therefore", "however"], "answer": 2, "explanation": "\"therefore\" chỉ kết quả của việc bánh làm cầu kỳ → cần nhiều công chuẩn bị.", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["to make", "making", "make", "makes"], "answer": 0, "explanation": "Cấu trúc: difficult + to V.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["touched", "smelled", "looked", "served"], "answer": 3, "explanation": "\"served immediately\" = được dọn/ăn ngay lập tức.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["to", "for", "at", "in"], "answer": 2, "explanation": "\"at home\" = tại nhà.", "vi": null}], "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}, {"key": "readingB", "title": "B) Wedding traditions around the world", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["generation", "ancestor", "ceremony", "worshiper"], "answer": 0, "explanation": "\"from one generation to another\" = từ thế hệ này sang thế hệ khác.", "vi": null}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["some", "the", "a", "an"], "answer": 1, "explanation": "\"the custom\" — phong tục cụ thể được nhắc tới, dùng \"the\".", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["have been", "were", "had been", "are"], "answer": 1, "explanation": "\"Until recently\" gợi ý thì quá khứ đơn → were.", "vi": null}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["reunion", "festival", "tradition", "worship"], "answer": 2, "explanation": "\"this beautiful old tradition\" = truyền thống đẹp cổ xưa này.", "vi": null}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["to light", "lighting", "light", "lighted"], "answer": 0, "explanation": "Cấu trúc \"be used to V\" (mục đích: được dùng để làm gì) → to light.", "vi": null}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["import", "important", "importance", "importantly"], "answer": 1, "explanation": "Bổ nghĩa cho danh từ \"part\" cần TÍNH TỪ → important.", "vi": null}], "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"key": "tfA", "title": "Something old, something new", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "1. The saying \"something old, something new, something borrowed, something blue\" dates back to 19th century England.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"an old saying that dates back to 19th century England\" → Đúng.", "vi": null}, {"id": "TFA2", "type": "mcq", "q": "2. A bride wears something new to remind her of her family and the past.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"something OLD\" (không phải new) dùng để nhớ về gia đình và quá khứ → Sai.", "vi": null}, {"id": "TFA3", "type": "mcq", "q": "3. Something borrowed shows that the bride has friends and family who are willing to help her.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Something borrowed... means the bride has friends and family who are willing to help her\" → Đúng.", "vi": null}, {"id": "TFA4", "type": "mcq", "q": "4. The man who catches the garter will be the last person to get married.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: người bắt được nịt tất sẽ là người kết hôn TIẾP THEO, không phải cuối cùng → Sai.", "vi": null}, {"id": "TFA5", "type": "mcq", "q": "5. Which of the following is a good title for the text?", "options": ["Various types of weddings.", "A wedding tradition and its meaning.", "What should be worn on your wedding day.", "How to plan a traditional wedding."], "answer": 1, "explanation": "Bài đọc chủ yếu giải thích ý nghĩa của một truyền thống cưới cụ thể.", "vi": null}, {"id": "TFA6", "type": "mcq", "q": "6. Why do some brides wear a blue garter on their leg?", "options": ["Because too many brides paint their fingernails a light blue color.", "Because it is a symbol of trust and faith between the bride and the groom.", "To show how the couple can be lucky in their marriage.", "To show how popular something blue is in a wedding."], "answer": 1, "explanation": "Bài đọc: \"Something blue is a symbol of trust and faith between the couple.\"", "vi": null}], "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"key": "tfB", "title": "Gift-giving customs in Viet Nam", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFB1", "type": "mcq", "q": "1. Personal relationships play an important role in gift-giving customs in Viet Nam.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Gift-giving is important... because of the significance of interpersonal relationships\" → Đúng.", "vi": null}, {"id": "TFB2", "type": "mcq", "q": "2. It is acceptable to wrap a gift in black paper in Viet Nam.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Do not wrap a gift in black paper because this color is unlucky\" → Sai.", "vi": null}, {"id": "TFB3", "type": "mcq", "q": "3. Sharp objects such as scissors or knives should be avoided as gifts because they symbolize cutting the relationship.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Gifts that symbolize cutting... should be avoided because they mean the cutting of the relationship\" → Đúng.", "vi": null}, {"id": "TFB4", "type": "mcq", "q": "4. Vietnamese people are always required to open a gift immediately in front of the giver.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Vietnamese may or may not open these gifts when they are received; leave the option to them\" → Sai.", "vi": null}, {"id": "TFB5", "type": "mcq", "q": "5. According to the passage, why is gift-giving important in Viet Nam?", "options": ["Because it helps to establish a friendship.", "Because it's common in Vietnamese culture.", "Because it's the best way to build up a stable relationship.", "Because personal relationships play a vital role in Vietnamese culture."], "answer": 3, "explanation": "Bài đọc mở đầu: \"Gift-giving is important in Viet Nam because of the significance of interpersonal relationships...\".", "vi": null}, {"id": "TFB6", "type": "mcq", "q": "6. Which of the following is NOT true about gift-giving customs in Viet Nam?", "options": ["Gift-giving is a good way of strengthening relationships.", "Gifts for your partners should be given at private occasions.", "You should avoid giving anything sharp.", "It is considered rude not to open the gift in front of the giver."], "answer": 3, "explanation": "Bài đọc nói ngược lại: người Việt có thể KHÔNG mở quà ngay trước mặt người tặng, không có gì bất lịch sự cả.", "vi": null}], "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"key": "transform0", "title": "Sentence Transformation (Part 1)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "There's a tradition that English people drink a lot of tea.", "starter": "English people follow", "answer": "the tradition of drinking a lot of tea", "accepted": null, "explanation": "There's a tradition that S + V = S + follow(s) the tradition of + V-ing", "vi": "Người Anh có truyền thống uống rất nhiều trà.", "note": "There's a tradition that S + V = S + follow(s) the tradition of + V-ing"}, {"id": "TR2", "type": "sentence", "q": "Last year we went to Thailand on Tet holiday.", "starter": "Last year we broke with tradition by", "answer": "going to Thailand on Tet holiday", "accepted": null, "explanation": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing", "vi": "Năm ngoái chúng tôi đã phá vỡ truyền thống bằng cách đi Thái Lan vào dịp Tết.", "note": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing"}, {"id": "TR3", "type": "sentence", "q": "The Vietnamese have the custom of worshipping ancestors.", "starter": "In Viet Nam there is", "answer": "a custom of worshipping ancestors", "accepted": null, "explanation": "S + have/has the custom of + V-ing = There + is/are + a custom of + V-ing", "vi": "Ở Việt Nam có phong tục thờ cúng tổ tiên.", "note": "S + have/has the custom of + V-ing = There + is/are + a custom of + V-ing"}, {"id": "TR4", "type": "sentence", "q": "It's the custom for Vietnamese parents to celebrate their baby's first month.", "starter": "Vietnamese parents have", "answer": "the custom of celebrating their baby's first month", "accepted": null, "explanation": "It's the custom for sb to V = sb + have/has the custom of + V-ing", "vi": "Cha mẹ Việt Nam có phong tục tổ chức lễ đầy tháng cho con.", "note": "It's the custom for sb to V = sb + have/has the custom of + V-ing"}, {"id": "TR5", "type": "sentence", "q": "According to tradition, Vietnamese people celebrate the Mid-Autumn Festival every year.", "starter": "Vietnamese people have", "answer": "a tradition of celebrating the Mid-Autumn Festival every year", "accepted": null, "explanation": "According to tradition, S + V (hiện tại đơn) = S + have/has a tradition of + V-ing", "vi": "Theo truyền thống, người Việt tổ chức Tết Trung thu hàng năm.", "note": "According to tradition, S + V (hiện tại đơn) = S + have/has a tradition of + V-ing"}, {"id": "TR6", "type": "sentence", "q": "The Ok Om Bok Festival takes place in October.", "starter": "People organize", "answer": "the Ok Om Bok Festival in October", "accepted": null, "explanation": "S + take(s) place = People + organize/hold/celebrate + O", "vi": "Người ta tổ chức lễ hội Ok Om Bok vào tháng Mười.", "note": "S + take(s) place = People + organize/hold/celebrate + O"}, {"id": "TR7", "type": "sentence", "q": "It's a good idea to hand bowls with both hands.", "starter": "We should", "answer": "hand bowls with both hands", "accepted": null, "explanation": "It's a good idea to V = We should + V", "vi": "Nên đưa bát bằng cả hai tay.", "note": "It's a good idea to V = We should + V"}, {"id": "TR8", "type": "sentence", "q": "We should wait for the host to start eating.", "starter": "We had better", "answer": "wait for the host to start eating", "accepted": null, "explanation": "We should + V = We had better + V", "vi": "Chúng ta nên đợi chủ nhà bắt đầu ăn trước.", "note": "We should + V = We had better + V"}, {"id": "TR9", "type": "sentence", "q": "Don't sweep the floor on the first three days of Tet.", "starter": "We shouldn't", "answer": "sweep the floor on the first three days of Tet", "accepted": null, "explanation": "Don't + V = We shouldn't + V", "vi": "Chúng ta không nên quét nhà trong ba ngày đầu năm mới.", "note": "Don't + V = We shouldn't + V"}, {"id": "TR10", "type": "sentence", "q": "Never use bad words in conversations with others, especially with older people.", "starter": "We had better not", "answer": "use bad words in conversations with others, especially with older people", "accepted": null, "explanation": "Never + V = We had better not + V", "vi": "Chúng ta không nên dùng lời lẽ thô tục khi nói chuyện với người khác, đặc biệt là người lớn tuổi.", "note": "Never + V = We had better not + V"}]}, {"key": "transform1", "title": "Sentence Transformation (Part 2)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR11", "type": "sentence", "q": "Taking care of the family is traditionally considered women's duty in many Eastern countries.", "starter": "Traditionally,", "answer": "taking care of the family is considered women's duty in many Eastern countries", "accepted": null, "explanation": "S + be + traditionally + considered... = Traditionally, + S + be considered...", "vi": "Theo truyền thống, việc chăm sóc gia đình được coi là bổn phận của phụ nữ ở nhiều nước phương Đông.", "note": "S + be + traditionally + considered... = Traditionally, + S + be considered..."}, {"id": "TR12", "type": "sentence", "q": "Organising the festivals is one way for us to maintain our traditions.", "starter": "We can maintain our traditions by", "answer": "organising the festivals", "accepted": null, "explanation": "V-ing... is one way for us to V2 = We can + V2 + by + V-ing", "vi": "Tổ chức các lễ hội là một cách để chúng ta duy trì truyền thống.", "note": "V-ing... is one way for us to V2 = We can + V2 + by + V-ing"}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"custom\"] A. Every Tet, Vietnamese people _______________________ visiting their relatives and giving lucky money to children.", "answer": "follow the custom of", "explanation": "Dựa vào ví dụ: follow the custom of.", "vi": "Mỗi dịp Tết, người Việt theo phong tục thăm họ hàng và mừng tuổi trẻ em."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"custom\"] B. _______________________ here for the bride to wear a red ao dai on her wedding day.", "answer": "It is the custom", "explanation": "Dựa vào ví dụ: It is the custom.", "vi": "Ở đây có phong tục cô dâu mặc áo dài đỏ trong ngày cưới."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"tradition\"] A. Nam is _______________________ of making Chung cakes every Tet.", "answer": "carrying on the family tradition", "explanation": "Dựa vào ví dụ: carrying on the family tradition.", "vi": "Nam đang tiếp nối truyền thống gia đình làm bánh chưng mỗi dịp Tết."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"tradition\"] B. This year, our class decided to _______________________ and celebrate Christmas at the beach instead of at school.", "answer": "break with tradition", "explanation": "Dựa vào ví dụ: break with tradition.", "vi": "Năm nay, lớp chúng tôi quyết định phá vỡ truyền thống và đón Giáng sinh ở biển thay vì ở trường."}]}, {"key": "pictures", "title": "Pictures & Signs", "emoji": "🚦", "vi": "Biển báo", "items": [{"id": "PIC1", "type": "mcq", "q": "1. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">⚠️💧🚶</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">CAUTION — WET FLOOR</p></div>", "options": ["The floor is wet, so you should walk carefully.", "You are responsible for cleaning this floor.", "You are not allowed to use this floor for walking.", "It is safe to run fast in this area."], "answer": 0, "explanation": "Biển báo \"Caution — Wet floor\" → sàn ướt, cần đi cẩn thận.", "vi": null}, {"id": "PIC2", "type": "mcq", "q": "2. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔄🚗⭕</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">ROUNDABOUT — GO AROUND</p></div>", "options": ["All vehicles must drive through the center of the circle.", "You must drive straight ahead at the intersection.", "Vehicles must travel on top of the traffic circle.", "Drivers are required to move around the traffic circle."], "answer": 3, "explanation": "Biển báo bùng binh (roundabout) → phải đi vòng quanh.", "vi": null}, {"id": "PIC3", "type": "mcq", "q": "3. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-rose-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🐕⚠️</div><p class=\"text-[11px] font-black text-center text-rose-700 leading-tight\">CAUTION — DOG ON PREMISES</p></div>", "options": ["You need to walk the dog in this area.", "You should be cautious because there is a dog here.", "Do not provide food for the animal.", "It's safe to interact with the dog."], "answer": 1, "explanation": "Biển \"Caution — dog on premises\" → cẩn thận vì có chó.", "vi": null}, {"id": "PIC4", "type": "mcq", "q": "4. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🧤✅</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">GLOVES MUST BE WORN</p></div>", "options": ["It's a good idea to wear gloves in this place.", "Hand protection is mandatory before entering this place.", "Remember to bring your own gloves to this zone.", "You don't have to wear gloves in this place."], "answer": 1, "explanation": "Biển báo bắt buộc đeo găng tay.", "vi": null}, {"id": "PIC5", "type": "mcq", "q": "5. What does the sign say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫✂️🔪</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO SHARP OBJECTS ON BOARD</p></div>", "options": ["You can't buy sharp objects like scissors or knives during the flight.", "Using both scissors and knives at the same time is prohibited on the plane.", "You can't bring any sharp objects on the plane.", "You can't use scissors or knives because they are sharp."], "answer": 2, "explanation": "Biển báo cấm mang vật sắc nhọn lên máy bay.", "vi": null}]}], "total": 105, "examPapers": [[{"id": "TFA5", "type": "mcq", "q": "5. Which of the following is a good title for the text?", "options": ["Various types of weddings.", "A wedding tradition and its meaning.", "What should be worn on your wedding day.", "How to plan a traditional wedding."], "answer": 1, "explanation": "Bài đọc chủ yếu giải thích ý nghĩa của một truyền thống cưới cụ thể.", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "TFB2", "type": "mcq", "q": "2. It is acceptable to wrap a gift in black paper in Viet Nam.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Do not wrap a gift in black paper because this color is unlucky\" → Sai.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "MCQ2", "type": "mcq", "q": "2. The Vietnamese New Year ________ from the first day of the first month of the Lunar calendar for at least three days.", "options": ["take after", "take off", "take up", "take place"], "answer": 3, "explanation": "\"take place\" = diễn ra — hợp nghĩa với thời gian bắt đầu và kéo dài của Tết.", "vi": null, "ipas": null, "vis": ["giống ai đó", "cởi ra, cất cánh", "bắt đầu làm", "diễn ra (đúng)"], "image": null}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["import", "important", "importance", "importantly"], "answer": 1, "explanation": "Bổ nghĩa cho danh từ \"part\" cần TÍNH TỪ → important.", "vi": null, "passage": "A lovely custom from France comes in the form of a two handled cup called the \"coup de marriage\". The cup was saved to be used from one ___(1)___ to another, of course, ___(2)___ custom has long been established of drinking a toast to one another, but the two handled cup adds a special touch to the weddings of today. Until recently, these cups ___(3)___ very difficult to find. Drinking from the same cup denotes \"togetherness\". At a wedding in Germany, the bride and groom hold candles trimmed with flowers and ribbons. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "WF3", "type": "fill", "q": "3. It's important to _______________ the beautiful customs of our ancestors. (maintenance)", "answer": "maintain", "explanation": "Sau \"to\" cần ĐỘNG TỪ nguyên mẫu → maintain (không phải danh từ maintenance).", "vi": "Điều quan trọng là duy trì những phong tục đẹp của tổ tiên chúng ta."}, {"id": "TR2", "type": "sentence", "q": "Last year we went to Thailand on Tet holiday.", "starter": "Last year we broke with tradition by", "answer": "going to Thailand on Tet holiday", "accepted": null, "explanation": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing", "vi": "Năm ngoái chúng tôi đã phá vỡ truyền thống bằng cách đi Thái Lan vào dịp Tết.", "note": "S + V (past, một sự việc khác lệ) = S + broke with tradition by + V-ing"}, {"id": "PRON3", "type": "mcq", "q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["pass", "palm", "sharp", "man"], "answer": 3, "explanation": "\"man\" phát âm /æ/, ba từ còn lại phát âm /ɑː/.", "vi": null, "ipas": ["/pæs/", "/pɑːm/", "/ʃɑːrp/", "/mæn/"], "vis": ["đi qua", "lòng bàn tay", "sắc bén", "đàn ông"], "image": null}, {"id": "PRON9", "type": "mcq", "q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["many", "take", "place", "wake"], "answer": 0, "explanation": "\"many\" có \"a\" phát âm /e/, ba từ còn lại phát âm /eɪ/.", "vi": null, "ipas": ["/ˈmeni/", "/teɪk/", "/pleɪs/", "/weɪk/"], "vis": ["nhiều", "lấy", "đặt, nơi chốn", "thức dậy"], "image": null}, {"id": "MCQ19", "type": "mcq", "q": "19. Linda fell in love with Peter without knowing about his real ________ status.", "options": ["social", "socialability", "society", "socialable"], "answer": 0, "explanation": "Bổ nghĩa cho danh từ \"status\" cần TÍNH TỪ → social.", "vi": null, "ipas": null, "vis": ["thuộc xã hội (đúng, tính từ)", "sai chính tả", "xã hội (danh từ, sai)", "sai chính tả"], "image": null}, {"id": "PRON8", "type": "mcq", "q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["lantern", "important", "money", "thank"], "answer": 3, "explanation": "\"thank\" có \"th\" phát âm /θ/ (âm cắn lưỡi), khác biệt với phụ âm mũi ở 3 từ còn lại.", "vi": null, "ipas": ["/ˈlæntərn/", "/ɪmˈpɔːrtnt/", "/ˈmʌni/", "/θæŋk/"], "vis": ["đèn lồng", "quan trọng", "tiền", "cảm ơn"], "image": null}, {"id": "MCQ30", "type": "mcq", "q": "30. Where can ________ people buy everything they need?", "options": ["Ø", "a", "an", "the"], "answer": 0, "explanation": "Danh từ số nhiều mang nghĩa chung chung → không mạo từ.", "vi": null, "ipas": null, "vis": ["không mạo từ (đúng)", "một (sai — people số nhiều)", "một, trước nguyên âm (sai)", "xác định (sai — nghĩa chung)"], "image": null}, {"id": "PIC3", "type": "mcq", "q": "3. What does the notice say?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-rose-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🐕⚠️</div><p class=\"text-[11px] font-black text-center text-rose-700 leading-tight\">CAUTION — DOG ON PREMISES</p></div>", "options": ["You need to walk the dog in this area.", "You should be cautious because there is a dog here.", "Do not provide food for the animal.", "It's safe to interact with the dog."], "answer": 1, "explanation": "Biển \"Caution — dog on premises\" → cẩn thận vì có chó.", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["to make", "making", "make", "makes"], "answer": 0, "explanation": "Cấu trúc: difficult + to V.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}, {"id": "STR9", "type": "mcq", "q": "9. Which word has a different stress pattern from that of the others?", "options": ["pagoda", "complement", "society", "tradition"], "answer": 1, "explanation": "\"complement\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/pəˈɡoʊdə/", "/ˈkɒmplɪmənt/", "/səˈsaɪəti/", "/trəˈdɪʃn/"], "vis": ["ngôi chùa", "bổ ngữ", "xã hội", "truyền thống"], "image": null}, {"id": "MCQ11", "type": "mcq", "q": "11. We should buy some ________ for the house before Tet.", "options": ["decoratively", "decorate", "decorations", "decorative"], "answer": 2, "explanation": "Sau \"some\" cần DANH TỪ số nhiều → decorations (đồ trang trí).", "vi": null, "ipas": null, "vis": ["một cách trang trí (trạng từ, sai)", "trang trí (động từ, sai)", "đồ trang trí (đúng)", "mang tính trang trí (tính từ, sai)"], "image": null}, {"id": "WF4", "type": "fill", "q": "4. Children should talk _______________ to their grandparents and elders. (respect)", "answer": "respectfully", "explanation": "Bổ nghĩa cho động từ \"talk\" cần TRẠNG TỪ → respectfully.", "vi": "Trẻ em nên nói chuyện lễ phép với ông bà và người lớn tuổi."}, {"id": "MCQ8", "type": "mcq", "q": "8. People in Hanoi ________ to give Ong Cong Ong Tao a ride to Heaven.", "options": ["release carps", "unicorn dance", "release lanterns", "bad spirit"], "answer": 0, "explanation": "Tục thả cá chép để tiễn ông Công ông Táo về trời → release carps.", "vi": null, "ipas": null, "vis": ["thả cá chép (đúng)", "múa lân", "thả đèn lồng", "tà ma"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. Sharp objects such as scissors or knives should be avoided as gifts because they symbolize cutting the relationship.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Gifts that symbolize cutting... should be avoided because they mean the cutting of the relationship\" → Đúng.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "TR7", "type": "sentence", "q": "It's a good idea to hand bowls with both hands.", "starter": "We should", "answer": "hand bowls with both hands", "accepted": null, "explanation": "It's a good idea to V = We should + V", "vi": "Nên đưa bát bằng cả hai tay.", "note": "It's a good idea to V = We should + V"}, {"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"custom\"] A. Every Tet, Vietnamese people _______________________ visiting their relatives and giving lucky money to children.", "answer": "follow the custom of", "explanation": "Dựa vào ví dụ: follow the custom of.", "vi": "Mỗi dịp Tết, người Việt theo phong tục thăm họ hàng và mừng tuổi trẻ em."}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["custom", "worship", "maintain", "midnight"], "answer": 2, "explanation": "\"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkʌstəm/", "/ˈwɜːrʃɪp/", "/meɪnˈteɪn/", "/ˈmɪdnaɪt/"], "vis": ["phong tục", "thờ cúng", "duy trì", "nửa đêm"], "image": null}, {"id": "TR4", "type": "sentence", "q": "It's the custom for Vietnamese parents to celebrate their baby's first month.", "starter": "Vietnamese parents have", "answer": "the custom of celebrating their baby's first month", "accepted": null, "explanation": "It's the custom for sb to V = sb + have/has the custom of + V-ing", "vi": "Cha mẹ Việt Nam có phong tục tổ chức lễ đầy tháng cho con.", "note": "It's the custom for sb to V = sb + have/has the custom of + V-ing"}, {"id": "MCQ23", "type": "mcq", "q": "23. We often watch ________ television.", "options": ["a", "an", "the", "x"], "answer": 3, "explanation": "\"watch television\" (xem TV nói chung) không dùng mạo từ.", "vi": null, "ipas": null, "vis": ["một (sai)", "một, trước nguyên âm (sai)", "xác định (sai)", "không mạo từ (đúng)"], "image": null}, {"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["carp", "article", "party", "tradition"], "answer": 3, "explanation": "\"tradition\" có \"a\" phát âm /ə/, ba từ còn lại phát âm /ɑː/.", "vi": null, "ipas": ["/kɑːp/", "/ˈɑːrtɪkl/", "/ˈpɑːrti/", "/trəˈdɪʃn/"], "vis": ["cá chép", "bài báo", "bữa tiệc", "truyền thống"], "image": null}, {"id": "TFA3", "type": "mcq", "q": "3. Something borrowed shows that the bride has friends and family who are willing to help her.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Something borrowed... means the bride has friends and family who are willing to help her\" → Đúng.", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "TFB4", "type": "mcq", "q": "4. Vietnamese people are always required to open a gift immediately in front of the giver.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Vietnamese may or may not open these gifts when they are received; leave the option to them\" → Sai.", "vi": null, "passage": "Gift-giving is important in Viet Nam because of the significance of interpersonal relationships in Vietnamese culture. First and foremost, do not encourage corruption. There is a clear cut between gift-giving and bribery. Nevertheless, it is common in Viet Nam for exchanging small gifts on certain occasions such as anniversaries, Tet holidays... to express respect, love, appreciation, or gratitude. Gift-giving customs depend on the context. If it is a private gift for one Vietnamese partner you should give the gift at a private occasion. If you have a gift for the whole office or company, you should give it after the business meeting with the whole office employee. Do not wrap a gift in black paper because this color is unlucky and associated with funerals in Viet Nam. Gifts that symbolize cutting such as scissors, knives, and other sharp objects should be avoided because they mean the cutting of the relationship. Vietnamese may or may not open these gifts when they are received; leave the option to them. You will also receive gifts and should defer to your host as to whether you should open them when receiving or not. Regardless of when it is opened or what it is, profuse thanks are always appropriate."}, {"id": "MCQ14", "type": "mcq", "q": "14. In Japan, take ________ your shoes at the entrance to all home, and most businesses and hotels.", "options": ["off", "at", "in", "to"], "answer": 0, "explanation": "\"take off your shoes\" = cởi giày ra.", "vi": null, "ipas": null, "vis": ["cởi ra (đúng)", "tại", "trong", "đến"], "image": null}, {"id": "TFA2", "type": "mcq", "q": "2. A bride wears something new to remind her of her family and the past.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"something OLD\" (không phải new) dùng để nhớ về gia đình và quá khứ → Sai.", "vi": null, "passage": "Although there various wedding styles in America, most weddings still follow certain traditions. One of those is an old saying that dates back to 19th century England about what a bride should wear or carry: \"Something old, something new, something borrowed, something blue.\" A bride wears something old to remind her of her family and the past. Some brides wear their mother's wedding dress or a piece of her jewelry. Something new means good luck and hope for a happy future with her new husband. Again, this item may be the dress, but often it is a pair of new shoes. Something borrowed such as a friend's handkerchief a married friend's bridal veil means the bride has friends and family who are willing to help her. Something blue is a symbol of trust and faith between the couple. These days, some brides are creative with this item by painting their fingernails a light blue color or wearing a garter on their leg. Another tradition says that the groom should take the garter after the ceremony and throw it to the single men. The man who catches it will be the next one to get married."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"tradition\"] A. Nam is _______________________ of making Chung cakes every Tet.", "answer": "carrying on the family tradition", "explanation": "Dựa vào ví dụ: carrying on the family tradition.", "vi": "Nam đang tiếp nối truyền thống gia đình làm bánh chưng mỗi dịp Tết."}, {"id": "MCQ29", "type": "mcq", "q": "29. We live at ________ third house from the church.", "options": ["Ø", "an", "a", "the"], "answer": 3, "explanation": "Trước số thứ tự (third) → the.", "vi": null, "ipas": null, "vis": ["không mạo từ (sai)", "một, trước nguyên âm (sai)", "một (sai)", "xác định (đúng — trước số thứ tự)"], "image": null}, {"id": "TR5", "type": "sentence", "q": "According to tradition, Vietnamese people celebrate the Mid-Autumn Festival every year.", "starter": "Vietnamese people have", "answer": "a tradition of celebrating the Mid-Autumn Festival every year", "accepted": null, "explanation": "According to tradition, S + V (hiện tại đơn) = S + have/has a tradition of + V-ing ns. This beautiful old ___(4)___ could be included in a wedding of today, with the couple placing candles they have carried to the altar beside their unity candle. These candles could then be used ___(5)___ the unity candle at the end of the ceremony. Flowers have always played a very ___(6)___ part in Indian weddings. A lasting tradition passed along from generation to generation is that of the brother of the groom sprinkling flower petals over the heads of the couple following the wedding vows and at the end of the ceremony."}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["because", "while", "therefore", "however"], "answer": 2, "explanation": "\"therefore\" chỉ kết quả của việc bánh làm cầu kỳ → cần nhiều công chuẩn bị.", "vi": null, "passage": "Tet is the biggest festival in Vietnam. To ___(1)___ Tet, Vietnamese people make many tasty ___(2)___ foods. The most important food includes Chung cakes, sausages, boiled chicken, spring rolls, and sticky rice. Chung cake is made of sticky rice, pork, green beans, and other spices, wrapped in green leaves; ___(3)___, this cake needs a lot of preparation. This cake can be kept for a long time, even though the weather is often humid during Tet. Other significant foods that cannot be missed to worship the ancestors are sausages, spring rolls, and sticky rice. Because sausages are difficult ___(4)___, people often buy them from famous suppliers. However, sticky rice and spring rolls are easier to prepare and must be ___(5)___ immediately after they are cooked, so they are often made ___(6)___ home."}, {"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["holiday", "decorate", "offering", "addition"], "answer": 3, "explanation": "\"addition\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhɒlədeɪ/", "/ˈdekəreɪt/", "/ˈɒfərɪŋ/", "/əˈdɪʃn/"], "vis": ["ngày nghỉ lễ", "trang trí", "lễ vật", "sự thêm vào"
