<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 2 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 2 · Healthy Living</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["h<u>ea</u>lthy", "w<u>a</u>ter", "dis<u>ea</u>se", "s<u>i</u>mple"], "answer": 2, "explanation": "\"disease\" có \"ea\" phát âm /iː/ (nguyên âm dài), \"healthy\" có \"ea\" phát âm /e/, \"simple\" /ɪ/, \"water\" /ɔː/. Theo đáp án gợi ý: disease.", "vi": null, "ipas": ["/ˈhelθi/", "/ˈwɔːtə/", "/dɪˈziːz/", "/ˈsɪmpl/"], "vis": ["khỏe mạnh", "nước", "bệnh", "đơn giản"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["<u>e</u>xercise", "<u>e</u>nergy", "v<u>e</u>getable", "<u>i</u>mportant"], "answer": 3, "explanation": "\"important\" có \"i\" phát âm /ɪ/, ba từ còn lại có \"e\" phát âm /e/.", "vi": null, "ipas": ["/ˈeksəsaɪz/", "/ˈenədʒi/", "/ˈvedʒtəbl/", "/ɪmˈpɔːtnt/"], "vis": ["bài tập thể dục", "năng lượng", "rau củ", "quan trọng"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["b<u>a</u>lance", "l<u>i</u>festyle", "rout<u>i</u>ne", "adv<u>i</u>ce"], "answer": 2, "explanation": "\"routine\" có \"i\" phát âm /iː/, \"lifestyle\" và \"advice\" có \"i\" phát âm /aɪ/. Theo đáp án gợi ý: routine.", "vi": null, "ipas": ["/ˈbæləns/", "/ˈlaɪfstaɪl/", "/ruːˈtiːn/", "/ədˈvaɪs/"], "vis": ["sự cân bằng", "lối sống", "thói quen hằng ngày", "lời khuyên"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["<u>e</u>xercise", "w<u>o</u>nderful", "r<u>e</u>gular", "<u>e</u>ducation"], "answer": 1, "explanation": "\"wonderful\" có \"o\" phát âm /ʌ/, ba từ còn lại có \"e\" phát âm /e/.", "vi": null, "ipas": ["/ˈeksəsaɪz/", "/ˈwʌndəfl/", "/ˈreɡjələ/", "/ˌedʒuˈkeɪʃn/"], "vis": ["bài tập thể dục", "tuyệt vời", "đều đặn", "giáo dục"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["m<u>e</u>dicine", "v<u>i</u>tamin", "<u>a</u>llergy", "pr<u>o</u>tect"], "answer": 1, "explanation": "\"vitamin\" (Anh-Mỹ /ˈvaɪtəmɪn/) có nguyên âm đôi /aɪ/, ba từ còn lại là nguyên âm ngắn /e/, /æ/, /ə/. Theo đáp án gợi ý: vitamin.", "vi": null, "ipas": ["/ˈmedsn/", "/ˈvaɪtəmɪn/", "/ˈælədʒi/", "/prəˈtekt/"], "vis": ["thuốc", "vitamin", "dị ứng", "bảo vệ"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["h<u>ea</u>lthy", "c<u>a</u>reful", "<u>a</u>ctive", "dis<u>ea</u>se"], "answer": 3, "explanation": "\"disease\" có \"ea\" phát âm /iː/; \"healthy\" /e/, \"active\" /æ/, \"careful\" /eə/. Theo đáp án gợi ý: disease.", "vi": null, "ipas": ["/ˈhelθi/", "/ˈkeəfl/", "/ˈæktɪv/", "/dɪˈziːz/"], "vis": ["khỏe mạnh", "cẩn thận", "năng động", "bệnh"], "image": null}]}, {"key": "stress0", "title": "Stressed syllable", "emoji": "🎯", "vi": "Trọng âm", "items": [{"id": "STR1", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["healthy", "avoid", "advice", "disease"], "answer": 0, "explanation": "\"healthy\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈhelθi/", "/əˈvɔɪd/", "/ədˈvaɪs/", "/dɪˈziːz/"], "vis": ["khỏe mạnh", "tránh", "lời khuyên", "bệnh"], "image": null}, {"id": "STR2", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["calorie", "vegetable", "important", "exercise"], "answer": 2, "explanation": "\"important\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkæləri/", "/ˈvedʒtəbl/", "/ɪmˈpɔːtnt/", "/ˈeksəsaɪz/"], "vis": ["calo", "rau củ", "quan trọng", "bài tập thể dục"], "image": null}, {"id": "STR3", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["breakfast", "dinner", "enjoy", "water"], "answer": 2, "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbrekfəst/", "/ˈdɪnə/", "/ɪnˈdʒɔɪ/", "/ˈwɔːtə/"], "vis": ["bữa sáng", "bữa tối", "thích thú", "nước"], "image": null}, {"id": "STR4", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["fitness", "become", "habit", "cycle"], "answer": 1, "explanation": "\"become\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈfɪtnəs/", "/bɪˈkʌm/", "/ˈhæbɪt/", "/ˈsaɪkl/"], "vis": ["sự cân đối", "trở nên", "thói quen", "đạp xe, chu kỳ"], "image": null}, {"id": "STR5", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["dentist", "doctor", "instead", "patient"], "answer": 2, "explanation": "\"instead\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈdentɪst/", "/ˈdɒktə/", "/ɪnˈsted/", "/ˈpeɪʃnt/"], "vis": ["nha sĩ", "bác sĩ", "thay vào đó", "bệnh nhân; kiên nhẫn"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "You should eat a lot of fruits and vegetables because they ______ much vitamin A.", "options": ["run", "take", "have", "get"], "answer": 2, "explanation": "Trái cây và rau chứa (have) nhiều vitamin A.", "vi": "Bạn nên ăn nhiều trái cây và rau vì chúng có nhiều vitamin A.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ2", "type": "mcq", "q": "The seafood I ate this morning makes me feel ______ all over.", "options": ["itchy", "weak", "running", "well"], "answer": 0, "explanation": "Ăn hải sản bị dị ứng → ngứa khắp người: itchy.", "vi": "Hải sản tôi ăn sáng nay khiến tôi ngứa khắp người.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ3", "type": "mcq", "q": "If you want to be fit, stay outdoors more and do more ______ activities.", "options": ["physics", "physic", "physical", "physically"], "answer": 2, "explanation": "Tính từ bổ nghĩa cho \"activities\": physical (thể chất).", "vi": "Nếu muốn khỏe mạnh, hãy ra ngoài trời nhiều hơn và làm nhiều hoạt động thể chất hơn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ4", "type": "mcq", "q": "Do more exercise ______ eat more fruit and vegetables.", "options": ["and", "so", "but", "although"], "answer": 0, "explanation": "Hai mệnh lệnh cùng chiều → nối bằng and.", "vi": "Hãy tập thể dục nhiều hơn và ăn nhiều trái cây, rau củ hơn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ5", "type": "mcq", "q": "After working on a computer for long hours, you should ______ your eyes and relax.", "options": ["wake", "rest", "sleep", "sleep in"], "answer": 1, "explanation": "\"rest your eyes\" = cho mắt nghỉ ngơi.", "vi": "Sau khi làm việc với máy tính nhiều giờ, bạn nên cho mắt nghỉ và thư giãn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ6", "type": "mcq", "q": "Eat less high-fat food to keep you from ______ weight.", "options": ["gaining", "reducing", "rising", "losing"], "answer": 0, "explanation": "\"gain weight\" = tăng cân; keep sb from + V-ing.", "vi": "Ăn ít đồ nhiều chất béo để tránh tăng cân.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ7", "type": "mcq", "q": "We should follow advice from doctors and health ______ to keep fit.", "options": ["managers", "experts", "workers", "players"], "answer": 1, "explanation": "\"health experts\" = chuyên gia sức khỏe.", "vi": "Chúng ta nên làm theo lời khuyên của bác sĩ và chuyên gia sức khỏe để giữ dáng.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ8", "type": "mcq", "q": "Have a healthy ______ and you can enjoy your life.", "options": ["lifeline", "lively", "lives", "lifestyle"], "answer": 3, "explanation": "\"healthy lifestyle\" = lối sống lành mạnh.", "vi": "Hãy có một lối sống lành mạnh và bạn có thể tận hưởng cuộc sống.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ9", "type": "mcq", "q": "Rob eats a lot of fast food, so he ______ on a lot of weight.", "options": ["spends", "brings", "takes", "puts"], "answer": 3, "explanation": "\"put on weight\" = tăng cân.", "vi": "Rob ăn nhiều đồ ăn nhanh, nên cậu ấy tăng cân nhiều.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ10", "type": "mcq", "q": "We need to spend less time ______ computer games.", "options": ["playing", "to playing", "play", "to play"], "answer": 0, "explanation": "\"spend time + V-ing\" → playing.", "vi": "Chúng ta cần dành ít thời gian hơn để chơi game máy tính.", "ipas": null, "vis": null, "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "To prevent ______, you should eat well and keep your body warm.", "options": ["flu", "toothache", "sunburn", "obesity"], "answer": 0, "explanation": "Ăn uống tốt và giữ ấm cơ thể → phòng cúm (flu).", "vi": "Để phòng cúm, bạn nên ăn uống đầy đủ và giữ ấm cơ thể.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ12", "type": "mcq", "q": "Be careful with ______ you eat and drink.", "options": ["who", "where", "what", "when"], "answer": 2, "explanation": "\"what you eat and drink\" = những gì bạn ăn và uống.", "vi": "Hãy cẩn thận với những gì bạn ăn và uống.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ13", "type": "mcq", "q": "Eating a lot of junk food may lead to ______.", "options": ["fitness", "obesity", "energy", "health"], "answer": 1, "explanation": "Ăn nhiều đồ ăn vặt → béo phì (obesity).", "vi": "Ăn nhiều đồ ăn vặt có thể dẫn đến béo phì.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ14", "type": "mcq", "q": "Which food is the healthiest?", "options": ["chips", "soft drinks", "fresh fruit", "candy"], "answer": 2, "explanation": "Trái cây tươi là thực phẩm lành mạnh nhất.", "vi": "Thực phẩm nào lành mạnh nhất?", "ipas": null, "vis": null, "image": null}, {"id": "MCQ15", "type": "mcq", "q": "Don't ______ too much time playing computer games.", "options": ["spend", "spends", "spending", "to spend"], "answer": 0, "explanation": "Câu mệnh lệnh phủ định: Don't + V nguyên thể.", "vi": "Đừng dành quá nhiều thời gian chơi game máy tính.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ16", "type": "mcq", "q": "You have chapped lips. You should use some ______.", "options": ["eye drops", "lip balm", "tofu", "sunburn"], "answer": 1, "explanation": "Môi nứt nẻ → dùng kem dưỡng môi (lip balm).", "vi": "Môi bạn bị nứt nẻ. Bạn nên dùng kem dưỡng môi.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ17", "type": "mcq", "q": "You should use ______ if your eyes are dry.", "options": ["lip balm", "junk food", "protein", "eye drops"], "answer": 3, "explanation": "Mắt khô → dùng thuốc nhỏ mắt (eye drops).", "vi": "Bạn nên dùng thuốc nhỏ mắt nếu mắt bị khô.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ18", "type": "mcq", "q": "Tofu and soybeans are good sources of ______.", "options": ["calories", "protein", "viruses", "acne"], "answer": 1, "explanation": "Đậu phụ và đậu nành là nguồn đạm (protein) tốt.", "vi": "Đậu phụ và đậu nành là nguồn chất đạm tốt.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ19", "type": "mcq", "q": "Eating too much candy is not good ______ your teeth.", "options": ["at", "from", "for", "with"], "answer": 2, "explanation": "\"be good/bad for\" = tốt/xấu cho.", "vi": "Ăn quá nhiều kẹo không tốt cho răng của bạn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ20", "type": "mcq", "q": "You should drink ______ water when the weather is hot.", "options": ["fewer", "little", "less", "more"], "answer": 3, "explanation": "Trời nóng → uống nhiều nước hơn: more.", "vi": "Bạn nên uống nhiều nước hơn khi trời nóng.", "ipas": null, "vis": null, "image": null}]}, {"key": "mcq2", "title": "Vocabulary & Grammar (21-30)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ21", "type": "mcq", "q": "If you want to stay in shape, ______ more exercise.", "options": ["make", "do", "take", "play"], "answer": 1, "explanation": "\"do exercise\" = tập thể dục.", "vi": "Nếu muốn giữ dáng, hãy tập thể dục nhiều hơn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ22", "type": "mcq", "q": "Don't stay up too late, ______ you may feel tired the next day.", "options": ["so", "and", "but", "or"], "answer": 3, "explanation": "Mệnh lệnh + or = nếu không thì... (hậu quả).", "vi": "Đừng thức quá khuya, nếu không bạn có thể thấy mệt vào hôm sau.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ23", "type": "mcq", "q": "Lan has an allergy, ______ she avoids some kinds of seafood.", "options": ["so", "but", "or", "yet"], "answer": 0, "explanation": "Nguyên nhân → kết quả: dùng so.", "vi": "Lan bị dị ứng, vì vậy cô ấy tránh một số loại hải sản.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ24", "type": "mcq", "q": "Nam wants to lose weight, ______ he still eats a lot of junk food.", "options": ["so", "and", "but", "for"], "answer": 2, "explanation": "Ý tương phản (muốn giảm cân nhưng vẫn ăn đồ ăn vặt) → but.", "vi": "Nam muốn giảm cân, nhưng cậu ấy vẫn ăn nhiều đồ ăn vặt.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ25", "type": "mcq", "q": "You should eat less fast food ______ more vegetables.", "options": ["but", "and", "or", "yet"], "answer": 1, "explanation": "Hai lời khuyên cùng chiều → and.", "vi": "Bạn nên ăn ít đồ ăn nhanh hơn và nhiều rau hơn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ26", "type": "mcq", "q": "A healthy diet gives your body enough ______.", "options": ["pimples", "coughs", "viruses", "vitamins"], "answer": 3, "explanation": "Chế độ ăn lành mạnh cung cấp đủ vitamin.", "vi": "Một chế độ ăn lành mạnh cung cấp cho cơ thể bạn đủ vitamin.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ27", "type": "mcq", "q": "Too much sun can cause ______.", "options": ["a cough", "a virus", "a calorie", "sunburn"], "answer": 3, "explanation": "Nắng nhiều → cháy nắng (sunburn).", "vi": "Quá nhiều nắng có thể gây cháy nắng.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ28", "type": "mcq", "q": "Acne is a common skin ______ among teenagers.", "options": ["condition", "calorie", "expert", "shape"], "answer": 0, "explanation": "\"skin condition\" = tình trạng da.", "vi": "Mụn trứng cá là một tình trạng da phổ biến ở thanh thiếu niên.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ29", "type": "mcq", "q": "You should ______ touching your face with dirty hands.", "options": ["pop", "put", "avoid", "coordinate"], "answer": 2, "explanation": "\"avoid + V-ing\" = tránh làm gì.", "vi": "Bạn nên tránh chạm tay bẩn lên mặt.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ30", "type": "mcq", "q": "Regular exercise helps you stay ______.", "options": ["itchy", "dim", "chapped", "fit"], "answer": 3, "explanation": "\"stay fit\" = giữ dáng, khỏe mạnh.", "vi": "Tập thể dục đều đặn giúp bạn giữ được sự cân đối, khỏe mạnh.", "ipas": null, "vis": null, "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "Doing exercise every day is good for your ________________. (health)", "answer": "health", "explanation": "Sau tính từ sở hữu \"your\" cần danh từ: health.", "vi": "Tập thể dục mỗi ngày tốt cho sức khỏe của bạn."}, {"id": "WF2", "type": "fill", "q": "Eating too much fast food is _______________ for us. (health)", "answer": "unhealthy", "explanation": "Ăn quá nhiều đồ ăn nhanh là không lành mạnh: unhealthy.", "vi": "Ăn quá nhiều đồ ăn nhanh không tốt cho sức khỏe chúng ta."}, {"id": "WF3", "type": "fill", "q": "My father always drives his car ________________. (care)", "answer": "carefully", "explanation": "Trạng từ bổ nghĩa cho động từ \"drives\": carefully.", "vi": "Bố tôi luôn lái xe cẩn thận."}, {"id": "WF4", "type": "fill", "q": "Remember to drive ________________ when it rains. (care)", "answer": "carefully", "explanation": "Trạng từ bổ nghĩa cho \"drive\": carefully.", "vi": "Nhớ lái xe cẩn thận khi trời mưa."}, {"id": "WF5", "type": "fill", "q": "Fruit gives us a lot of ________________. (energy)", "answer": "energy", "explanation": "Sau \"a lot of\" cần danh từ: energy.", "vi": "Trái cây cho chúng ta nhiều năng lượng."}, {"id": "WF6", "type": "fill", "q": "Tuấn is a _____________ student, he rarely makes mistakes in the tests. (care)", "answer": "careful", "explanation": "Tính từ bổ nghĩa cho danh từ \"student\": careful.", "vi": "Tuấn là một học sinh cẩn thận, cậu ấy hiếm khi mắc lỗi trong bài kiểm tra."}, {"id": "WF7", "type": "fill", "q": "Running is a good outdoor ________________. (act)", "answer": "activity", "explanation": "Sau \"a good outdoor\" cần danh từ số ít: activity.", "vi": "Chạy bộ là một hoạt động ngoài trời tốt."}, {"id": "WF8", "type": "fill", "q": "You have to brush your teeth ________________. (regular)", "answer": "regularly", "explanation": "Trạng từ bổ nghĩa cho động từ \"brush\": regularly.", "vi": "Bạn phải đánh răng đều đặn."}, {"id": "WF9", "type": "fill", "q": "We should eat a ________________ diet. (balance)", "answer": "balanced", "explanation": "Tính từ -ed bổ nghĩa cho \"diet\": balanced (cân bằng).", "vi": "Chúng ta nên ăn một chế độ ăn cân bằng."}, {"id": "WF10", "type": "fill", "q": "My eating habits are ________________ from yours. (differ)", "answer": "different", "explanation": "\"be different from\" = khác với.", "vi": "Thói quen ăn uống của tôi khác với của bạn."}, {"id": "WF11", "type": "fill", "q": "A ______________ lifestyle helps you live longer. (health)", "answer": "healthy", "explanation": "Tính từ bổ nghĩa cho \"lifestyle\": healthy.", "vi": "Một lối sống lành mạnh giúp bạn sống lâu hơn."}, {"id": "WF12", "type": "fill", "q": "We feel really ______________ when the doctor says we're great. (happiness)", "answer": "happy", "explanation": "Sau \"feel\" dùng tính từ: happy.", "vi": "Chúng ta cảm thấy rất vui khi bác sĩ nói chúng ta khỏe."}, {"id": "WF13", "type": "fill", "q": "You should do _______________ exercise every morning. (regular)", "answer": "regular", "explanation": "Tính từ bổ nghĩa cho \"exercise\": regular.", "vi": "Bạn nên tập thể dục đều đặn mỗi sáng."}, {"id": "WF14", "type": "fill", "q": "Good health brings ________________ to people. (happy)", "answer": "happiness", "explanation": "Sau động từ \"brings\" cần danh từ làm tân ngữ: happiness.", "vi": "Sức khỏe tốt mang lại hạnh phúc cho mọi người."}, {"id": "WF15", "type": "fill", "q": "Thank you a lot. This advice is very ________________. (use)", "answer": "useful", "explanation": "Tính từ sau \"very\": useful (hữu ích).", "vi": "Cảm ơn rất nhiều. Lời khuyên này rất hữu ích."}]}, {"key": "readingA", "title": "Passage 1: Healthy Habits", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "(1) Everyone should ______ healthy food.", "options": ["eat", "eats", "eating", "ate"], "answer": 0, "explanation": "Sau \"should\" dùng động từ nguyên thể: eat.", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "(2) Fruit and vegetables are good ______ our bodies.", "options": ["at", "for", "in", "on"], "answer": 1, "explanation": "\"be good for\" = tốt cho.", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "(3) We should drink enough ______ every day.", "options": ["milk", "juice", "water", "cola"], "answer": 2, "explanation": "Câu sau nói về \"Drinking water\" → water.", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "(4) It is also important to ______ exercise regularly.", "options": ["do", "make", "play", "take"], "answer": 0, "explanation": "\"do exercise\" = tập thể dục.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "(5) Don't eat too ______ junk food.", "options": ["many", "much", "lot", "more"], "answer": 1, "explanation": "\"junk food\" không đếm được → too much.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "(6) It is not good for your ______.", "options": ["health", "healthy", "healthily", "healthier"], "answer": 0, "explanation": "Sau \"your\" cần danh từ: health.", "vi": null}], "passage": "Healthy habits are important for students because they help us feel active and study better every day. Everyone should <span class='blank-tag'>(1)</span> ______ healthy food. Fruit and vegetables are good <span class='blank-tag'>(2)</span> ______ our bodies. They give us vitamins and energy for school and daily activities. We should drink enough <span class='blank-tag'>(3)</span> ______ every day. Drinking water is especially important after playing sports or spending time outdoors. It is also important to <span class='blank-tag'>(4)</span> ______ exercise regularly. Walking, cycling, or playing badminton are simple ways to keep fit. Don't eat too <span class='blank-tag'>(5)</span> ______ junk food because it is not good for your <span class='blank-tag'>(6)</span> ______. We should also sleep about eight hours each night and take short breaks when we feel tired. Small healthy choices can make a big difference to our lives."}, {"key": "readingB", "title": "Passage 2: A Healthy Day", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGB1", "type": "mcq", "q": "(1) She gets ______ early every morning.", "options": ["on", "up", "in", "out"], "answer": 1, "explanation": "\"get up\" = thức dậy.", "vi": null}, {"id": "READINGB2", "type": "mcq", "q": "(2) She usually ______ breakfast before school.", "options": ["has", "have", "having", "had"], "answer": 0, "explanation": "Chủ ngữ \"She\" + hiện tại đơn → has breakfast.", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "(3) After school, she often plays ______ with her friends.", "options": ["games", "homework", "piano", "books"], "answer": 0, "explanation": "\"play games with friends\" = chơi trò chơi với bạn bè.", "vi": null}, {"id": "READINGB4", "type": "mcq", "q": "(4) She doesn't watch TV for too ______.", "options": ["many", "long", "much", "often"], "answer": 1, "explanation": "\"for too long\" = quá lâu.", "vi": null}, {"id": "READINGB5", "type": "mcq", "q": "(5) She goes to bed ______ because sleep is important.", "options": ["late", "early", "slowly", "never"], "answer": 1, "explanation": "Lối sống lành mạnh → đi ngủ sớm: early.", "vi": null}, {"id": "READINGB6", "type": "mcq", "q": "(6) Sleep is important for good ______.", "options": ["healthy", "health", "healthily", "healthier"], "answer": 1, "explanation": "Sau tính từ \"good\" cần danh từ: health.", "vi": null}], "passage": "Lan is a 7th grade student in Hoa Mai secondary school. She wants to stay healthy for her studying. She gets <span class='blank-tag'>(1)</span> ______ early every morning, at about 5:30 a.m. She usually <span class='blank-tag'>(2)</span> ______ breakfast before school. Then she walks to her school and begins her morning classes. After school, she often plays <span class='blank-tag'>(3)</span> ______ with her friends. In the evening, she doesn't watch TV for too <span class='blank-tag'>(4)</span> ______. Lan always has vegetables in her meals. Sometimes she drinks soft drink after meals, but she often drinks milk instead. She goes to bed <span class='blank-tag'>(5)</span> ______ because sleep is important for good <span class='blank-tag'>(6)</span> ______. You should follow Lan's healthy living, so that you can get your best health condition and studying."}, {"key": "tfA", "title": "Passage 1: Tom's Healthy Lifestyle", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "Tom is 13 years old.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Tom is thirteen years old\" → Đúng.", "vi": "Tom 13 tuổi."}, {"id": "TFA2", "type": "mcq", "q": "He drinks little water every day.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"drinks plenty of water\" (uống nhiều nước) → Sai.", "vi": "Cậu ấy uống ít nước mỗi ngày."}, {"id": "TFA3", "type": "mcq", "q": "He rides a bike to school.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"He rides his bike to school\" → Đúng.", "vi": "Cậu ấy đạp xe đến trường."}, {"id": "TFA4", "type": "mcq", "q": "He often eats fast food to stay healthy.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"He rarely eats fast food\" → Sai.", "vi": "Cậu ấy thường ăn đồ ăn nhanh để giữ sức khỏe."}, {"id": "TFA5", "type": "mcq", "q": "How often does Tom play badminton?", "options": ["every day", "twice a week", "three times a week", "once a week"], "answer": 2, "explanation": "Bài đọc: \"plays badminton three times a week\".", "vi": "Tom chơi cầu lông bao lâu một lần?"}, {"id": "TFA6", "type": "mcq", "q": "Why does Tom rarely eat fast food?", "options": ["To stay healthy.", "To save money.", "To ride faster.", "To sleep early."], "answer": 0, "explanation": "Bài đọc: \"because he wants to stay healthy\".", "vi": "Tại sao Tom hiếm khi ăn đồ ăn nhanh?"}], "passage": "Tom is thirteen years old. He's now living with his parents and his two younger brother and sister. Let's take a look at his living style. He eats fruits every day and drinks plenty of water. He rides his bike to school and plays badminton three times a week. Sometimes he and his 2 siblings go swimming on the weekend. He rarely eats fast food because he wants to stay healthy. Everyone in his family usually has vegetables in their meals. He often goes to bed at 9 p.m. with his 2 siblings, so they can get up on time next morning and study well all day."}, {"key": "tfB", "title": "Passage 2: Mai's Habits", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFB1", "type": "mcq", "q": "Mai dislikes vegetables.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Mai likes vegetables and milk\" → Sai.", "vi": "Mai không thích rau."}, {"id": "TFB2", "type": "mcq", "q": "She sleeps late every night.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: đi ngủ lúc 10 giờ tối và dậy sớm → không ngủ muộn → Sai.", "vi": "Cô ấy ngủ muộn mỗi đêm."}, {"id": "TFB3", "type": "mcq", "q": "She exercises for one hour after school.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"She spends one hour exercising after school\" → Đúng.", "vi": "Cô ấy tập thể dục một tiếng sau giờ học."}, {"id": "TFB4", "type": "mcq", "q": "She feels active and happy.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"She feels active and happy\" → Đúng.", "vi": "Cô ấy cảm thấy năng động và vui vẻ."}, {"id": "TFB5", "type": "mcq", "q": "What time does Mai go to bed every day?", "options": ["8 p.m.", "9 p.m.", "10 p.m.", "11 p.m."], "answer": 2, "explanation": "Bài đọc: \"She goes to bed at 10 p.m. every day\".", "vi": "Mai đi ngủ lúc mấy giờ mỗi ngày?"}, {"id": "TFB6", "type": "mcq", "q": "How long does Mai exercise after school?", "options": ["thirty minutes", "one hour", "two hours", "three hours"], "answer": 1, "explanation": "Bài đọc: \"She spends one hour exercising after school\".", "vi": "Mai tập thể dục bao lâu sau giờ học?"}], "passage": "Mai likes vegetables and milk. She usually has a simple breakfast before school and takes a bottle of water with her. At school, she enjoys learning and tries not to eat too much fast food. She goes to bed at 10 p.m. every day and gets up early. After getting up, she often does some light exercise and helps her mother prepare breakfast. She spends one hour exercising after school. Sometimes she walks in the park with her friends, and on other days she rides her bike around her neighbourhood. In the evening, Mai finishes her homework before relaxing with a book or some music. She feels active and happy. Mai believes that healthy habits help her study better and have more energy for school activities."}, {"key": "transform0", "title": "Sentence Transformation (Part 1)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>keep/ We/ to avoid/ should/ warm/ a cold./</b>", "starter": "", "answer": "We should keep warm to avoid a cold.", "accepted": null, "explanation": "S + should + V + to V (mục đích).", "vi": "Chúng ta nên giữ ấm để tránh bị cảm lạnh.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR2", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>Getting/ study/ you/ well./ enough sleep/ helps/</b>", "starter": "", "answer": "Getting enough sleep helps you study well.", "accepted": null, "explanation": "V-ing (chủ ngữ) + helps + sb + V.", "vi": "Ngủ đủ giấc giúp bạn học tốt.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR3", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>in our diet/. /an important role/ play/ Vitamins/</b>", "starter": "", "answer": "Vitamins play an important role in our diet.", "accepted": null, "explanation": "\"play an important role in\" = đóng vai trò quan trọng trong.", "vi": "Vitamin đóng vai trò quan trọng trong chế độ ăn của chúng ta.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR4", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>should not/ more/ computer games./ play/ You/</b>", "starter": "", "answer": "You should not play more computer games.", "accepted": null, "explanation": "S + should not + V + O.", "vi": "Bạn không nên chơi thêm game máy tính nữa.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR5", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>Mai/ see/ tomorrow./ will/ the doctor/ go to/</b>", "starter": "", "answer": "Mai will go to see the doctor tomorrow.", "accepted": null, "explanation": "S + will + go to see + O + tomorrow.", "vi": "Mai sẽ đi khám bác sĩ vào ngày mai.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR6", "type": "sentence", "q": "It's a good idea to drink more water.", "starter": "You should", "answer": "drink more water", "accepted": null, "explanation": "It's a good idea to + V = You should + V.", "vi": "Bạn nên uống nhiều nước hơn.", "note": "It's a good idea to + V → S + should + V"}, {"id": "TR7", "type": "sentence", "q": "Don't eat too much junk food.", "starter": "You shouldn't", "answer": "eat too much junk food", "accepted": null, "explanation": "Don't + V = You shouldn't + V.", "vi": "Bạn không nên ăn quá nhiều đồ ăn vặt.", "note": "Don't + V → S + shouldn't + V"}, {"id": "TR8", "type": "sentence", "q": "My brother cycles to school every day.", "starter": "My brother goes", "answer": "to school by bike every day", "accepted": ["to school by bike every day", "to school by bicycle every day"], "explanation": "cycle = go by bike/bicycle.", "vi": "Anh tôi đi học bằng xe đạp mỗi ngày.", "note": "S + cycle(s) + to + place → S + go(es) + to + place + by bike"}, {"id": "TR9", "type": "sentence", "q": "Let's play badminton.", "starter": "Why don't we", "answer": "play badminton", "accepted": null, "explanation": "Let's + V = Why don't we + V?", "vi": "Sao chúng ta không chơi cầu lông nhỉ?", "note": "Let's + V → Why don't we + V?"}, {"id": "TR10", "type": "sentence", "q": "It is important to exercise every day.", "starter": "We should", "answer": "exercise every day", "accepted": ["exercise every day", "do exercise every day"], "explanation": "It is important to + V = We should + V.", "vi": "Chúng ta nên tập thể dục mỗi ngày.", "note": "It is important to + V → S + should + V"}]}, {"key": "transform1", "title": "Sentence Transformation (Part 2)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR11", "type": "sentence", "q": "Lan likes eating healthy food because she wants to be fit.", "starter": "Lan is", "answer": "interested in eating healthy food because she wants to be fit", "accepted": ["interested in eating healthy food because she wants to be fit", "fond of eating healthy food because she wants to be fit", "keen on eating healthy food because she wants to be fit"], "explanation": "like + V-ing = be interested in / fond of / keen on + V-ing.", "vi": "Lan thích ăn thực phẩm lành mạnh vì cô ấy muốn khỏe mạnh.", "note": "S + like + V-ing → S + be interested in / fond of / keen on + V-ing"}, {"id": "TR12", "type": "sentence", "q": "Nam doesn't drink enough water.", "starter": "Nam should", "answer": "drink more water", "accepted": null, "explanation": "Không uống đủ nước → nên uống nhiều nước hơn.", "vi": "Nam nên uống nhiều nước hơn.", "note": "S + doesn't + V + enough + N → S + should + V + more + N"}, {"id": "TR13", "type": "sentence", "q": "Walking regularly is good for your health.", "starter": "You should", "answer": "walk regularly", "accepted": null, "explanation": "V-ing + is good for you = You should + V.", "vi": "Bạn nên đi bộ thường xuyên.", "note": "V-ing + is good for your health → S + should + V"}, {"id": "TR14", "type": "sentence", "q": "You must wash your hands before meals.", "starter": "Don't forget", "answer": "to wash your hands before meals", "accepted": null, "explanation": "must + V = Don't forget to + V.", "vi": "Đừng quên rửa tay trước bữa ăn.", "note": "S + must + V → Don't forget to + V"}, {"id": "TR15", "type": "sentence", "q": "It is not good to stay up late.", "starter": "I think you shouldn't", "answer": "stay up late", "accepted": null, "explanation": "It is not good to + V = You shouldn't + V.", "vi": "Tôi nghĩ bạn không nên thức khuya.", "note": "It is not good to + V → S + shouldn't + V"}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ đi r best health condition and studying."}, {"id": "TFA6", "type": "mcq", "q": "Why does Tom rarely eat fast food?", "options": ["To stay healthy.", "To save money.", "To ride faster.", "To sleep early."], "answer": 0, "explanation": "Bài đọc: \"because he wants to stay healthy\".", "vi": "Tại sao Tom hiếm khi ăn đồ ăn nhanh?", "passage": "Tom is thirteen years old. He's now living with his parents and his two younger brother and sister. Let's take a look at his living style. He eats fruits every day and drinks plenty of water. He rides his bike to school and plays badminton three times a week. Sometimes he and his 2 siblings go swimming on the weekend. He rarely eats fast food because he wants to stay healthy. Everyone in his family usually has vegetables in their meals. He often goes to bed at 9 p.m. with his 2 siblings, so they can get up on time next morning and study well all day."}, {"id": "STR3", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["breakfast", "dinner", "enjoy", "water"], "answer": 2, "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbrekfəst/", "/ˈdɪnə/", "/ɪnˈdʒɔɪ/", "/ˈwɔːtə/"], "vis": ["bữa sáng", "bữa tối", "thích thú", "nước"], "image": null}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"avoid\"] A. To stay healthy, you should _______________ eating too much fast food.", "answer": "avoid", "explanation": "Dựa vào ví dụ: avoid eating too much sugar.", "vi": "Để giữ sức khỏe, bạn nên tránh ăn quá nhiều đồ ăn nhanh."}, {"id": "PRON3", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["b<u>a</u>lance", "l<u>i</u>festyle", "rout<u>i</u>ne", "adv<u>i</u>ce"], "answer": 2, "explanation": "\"routine\" có \"i\" phát âm /iː/, \"lifestyle\" và \"advice\" có \"i\" phát âm /aɪ/. Theo đáp án gợi ý: routine.", "vi": null, "ipas": ["/ˈbæləns/", "/ˈlaɪfstaɪl/", "/r ll day."}, {"id": "PIC2", "type": "mcq", "q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🚯</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO LITTERING</p></div>", "options": ["No running.", "No parking.", "No littering.", "No camping."], "answer": 2, "explanation": "Biển có hình người vứt rác bị gạch chéo → cấm xả rác.", "vi": null}, {"id": "PRON4", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["<u>e</u>xercise", "w<u>o</u>nderful", "r<u>e</u>gular", "<u>e</u>ducation"], "answer": 1, "explanation": "\"wonderful\" có \"o\" phát âm /ʌ/, ba từ còn lại có \"e\" phát âm /e/.", "vi": null, "ipas": ["/ˈeksəsaɪz/", "/ˈwʌndəfl/", "/ˈreɡjələ/", "/ˌedʒuˈkeɪʃn/"], "vis": ["bài tập thể dục", "tuyệt vời", "đều đặn", "giáo dục"], "image": null}, {"id": "TR13", "type": "sentence", "q": "Walking regularly is good for your health.", "starter": "You should", "answer": "walk regularly", "accepted": null, "explanation": "V-ing + is good for you = You should + V.", "vi": "Bạn nên đi bộ thường xuyên.", "note": "V-ing + is good for your health → S + should + V"}, {"id": "PRON6", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["h<u>ea</u>lthy", "c<u>a</u>reful", "<u>a</u>ctive", "dis<u>ea</u>se"], "answer": 3, "explanation": "\"disease\" có \"ea\" phát âm /iː/; \"healthy\" /e/, \"active\" /æ/, \"careful\" /eə/. Theo đáp án gợi ý: disease.", "vi": null, "ipas": ["/ˈhelθi/", "/ˈkeəfl/", "/ˈæktɪv/", "/dɪˈziːz/"], "vis": ["khỏe mạnh", "cẩn thận", "năng động", "bệnh"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "Rob eats a lot of fast food, so he ______ on a lot of weight.", "options": ["spends", "brings", "takes", "puts"], "answer": 3, "explanation": "\"put on weight\" = tăng cân.", "vi": "Rob ăn nhiều đồ ăn nhanh, nên cậu ấy tăng cân nhiều.", "ipas": null, "vis": null, "image": null}, {"id": "STR3", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["breakfast", "dinner", "enjoy", "water"], "answer": 2, "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbrekfəst/", "/ˈdɪnə/", "/ɪnˈdʒɔɪ/", "/ˈwɔːtə/"], "vis": ["bữa sáng", "bữa tối", "thích thú", "nước"], "image": null}, {"id": "READINGB3", "type": "mcq", "q": "(3) After school, she often plays ______ with her friends.", "options": ["games", "homework", "piano", "books"], "answer": 0, "explanation": "\"play games with friends\" = chơi trò chơi với bạn bè.", "vi": null, "passage": "Lan is a 7th grade student in Hoa Mai secondary school. She wants to stay healthy for her studying. She gets <span class='blank-tag'>(1)</span> ______ early every morning, at about 5:30 a.m. She usually <span class='blank-tag'>(2)</span> ______ breakfast before school. Then she walks to her school and begins her morning classes. After school, she often plays <span class='blank-tag'>(3)</span> ______ with her friends. In the evening, she doesn't watch TV for too <span class='blank-tag'>(4)</span> ______. Lan always has vegetables in her meals. Sometimes she drinks soft drink after meals, but she often drinks milk instead. She goes to bed <span class='blank-tag'>(5)</span> ______ because sleep is important for good <span class='blank-tag'>(6)</span> ______. You should follow Lan's healthy living, so that you can get your best health condition and studying."}, {"id": "MCQ18", "type": "mcq", "q": "Tofu and soybeans are good sources of ______.", "options": ["calories", "protein", "viruses", "acne"], "answer": 1, "explanation": "Đậu phụ và đậu nành là nguồn đạm (protein) tốt.", "vi": "Đậu phụ và đậu nành là nguồn chất đạm tốt.", "ipas": null, "vis": null, "image": null}, {"id": "STR5", "type": "mcq", "q : 1, "explanation": "\"get up\" = thức dậy.", "vi": null, "passage": "Lan is a 7th grade student in Hoa Mai secondary school. She wants to stay healthy for her studying. She gets <span class='blank-tag'>(1)</span> ______ early every morning, at about 5:30 a.m. She usually <span class='blank-tag'>(2)</span> ______ breakfast before school. Then she walks to her school and begins her morning classes. After school, she often plays <span class='blank-tag'>(3)</span> ______ with her friends. In the evening, she doesn't watch TV for too <span class='blank-tag'>(4)</span> ______. Lan always has vegetables in her meals. Sometimes she drinks soft drink after meals, but she often drinks milk instead. She goes to bed <span class='blank-tag'>(5)</span> ______ because sleep is important for good <span class='blank-tag'>(6)</span> ______. You should follow Lan's healthy living, so that you can get your best health condition and studying."}, {"id": "WF12", "type": "fill", "q": "We feel really ______________ when the doctor says we're great. (happiness)", "answer": "happy", "explanation": "Sau \"feel\" dùng tính từ: happy.", "vi": "Chúng ta cảm thấy rất vui khi bác sĩ nói chúng ta khỏe."}, {"id": "MCQ10", "type": "mcq", "q": "We need to spend less time ______ computer games.", "options": ["playing", "to playing", "play", "to play"], "answer": 0, "explanation": "\"spend time + V-ing\" → playing.", "vi": "Chúng ta cần dành ít thời gian hơn để chơi game máy tính.", "ipas": null, "vis": null, "image": null}, {"id": "TFB2", "type": "mcq", "q": "She sleeps late every night.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: đi ngủ lúc 10 giờ tối và dậy sớm → không ngủ muộn → Sai.", "vi": "Cô ấy ngủ muộn mỗi đêm.", "passage": "Mai likes vegetables and milk. She usually has a simple breakfast before school and takes a bottle of water with her. At school, she enjoys learning and tries not to eat too much fast food. She goes to bed at 10 p.m. every day and gets up early. After getting up, she often does some light exercise and helps her mother prepare breakfast. She spends one hour exercising after school. Sometimes she walks in the park with her friends, and on other days she rides her bike around her neighbourhood. In the evening, Mai finishes her homework before relaxing with a book or some music. She feels active and happy. Mai believes that healthy habits help her study better and have more energy for school activities."}, {"id": "WF3", "type": "fill", "q": "My father always drives his car ________________. (care)", "answer": "carefully", "explanation": "Trạng từ bổ nghĩa cho động từ \"drives\": carefully.", "vi": "Bố tôi luôn lái xe cẩn thận."}, {"id": "TR5", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>Mai/ see/ tomorrow./ will/ the doctor/ go to/</b>", "starter": "", "answer": "Mai will go to see the doctor tomorrow.", "accepted": null, "explanation": "S + will + go to see + O + tomorrow.", "vi": "Mai sẽ đi khám bác sĩ vào ngày mai.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}]]};
const STAGES = STAGES_RAW.stages;
const TOTAL_EXPECTED = STAGES_RAW.total;
const EXAM_PAPERS = STAGES_RAW.examPapers;
const STORE_KEY = 'gs_unit2_fulltest_v1';

(function validate(){
  const ids = [];
  let missingAnswer=0, missingExplanation=0;
  STAGES.forEach(s=>{
    s.items.forEach(it=>{
      ids.push(it.id);
      if(it.type==='mcq' && (it.answer===undefined || it.answer===null || it.answer<0 || it.answer>=it.options.length)) missingAnswer++;
      if((it.type==='fill'||it.type==='sentence') && !it.answer) missingAnswer++;
      if(!it.explanation) missingExplanation++;
    });
  });
  const dupSet = new Set(); let dupes=0;
  ids.forEach(id=>{ if(dupSet.has(id)) dupes++; dupSet.add(id); });
  const totalActual = ids.length;
  const problems = [];
  if(totalActual !== TOTAL_EXPECTED) problems.push(`Tổng số câu thực tế (${totalActual}) khác kỳ vọng (${TOTAL_EXPECTED})`);
  if(dupes>0) problems.push(`${dupes} ID bị trùng`);
  if(missingAnswer>0) problems.push(`${missingAnswer} câu thiếu đáp án hợp lệ`);
  if(missingExplanation>0) problems.push(`${missingExplanation} câu thiếu giải thích`);
  EXAM_PAPERS.forEach((paper,i)=>{
    if(paper.length < 40 || paper.length > 50) problems.push(`Đề ${i+1} có ${paper.length} câu (ngoài khoảng 40-50)`);
    const pids = new Set(paper.map(it=>it.id));
    if(pids.size !== paper.length) problems.push(`Đề ${i+1} có câu trùng lặp`);
  });
  // Every stage/category should appear in EVERY paper — catches the class
  // of bug where two small categories get merged into one "family" and
  // random distribution leaves one of them at 0 in some paper.
  const familyOf = (id) => id.replace(/[\d_]+$/, '');
  const stageFamilies = new Set(STAGES.map(s => familyOf(s.items[0] ? s.items[0].id : '')));
  EXAM_PAPERS.forEach((paper,i)=>{
    const presentFamilies = new Set(paper.map(it => familyOf(it.id)));
    stageFamilies.forEach(fam => {
      if(fam && !presentFamilies.has(fam)) problems.push(`Đề ${i+1} thiếu hẳn nhóm câu hỏi "${fam}"`);
    });
  });
  const coveredIds = new Set(); EXAM_PAPERS.forEach(paper=>paper.forEach(it=>coveredIds.add(it.id)));
  const allStageIds = new Set(ids);
  let uncovered = 0; allStageIds.forEach(id=>{ if(!coveredIds.has(id)) uncovered++; });
  if(uncovered>0) problems.push(`${uncovered} câu trong Unit không xuất hiện ở đề kiểm tra nào`);
  const banner = document.getElementById('auditBanner');
  if(problems.length){
    banner.classList.add('show');
    banner.textContent = '⚠️ Content audit: ' + problems.join(' · ');
    console.error('CONTENT AUDIT FAILED', problems);
  } else {
    console.log(`Content audit OK: ${totalActual}/${TOTAL_EXPECTED} câu, ${EXAM_PAPERS.length} đề kiểm tra (mỗi đề ~${EXAM_PAPERS[0].length} câu, cùng nhau phủ đủ 100% câu hỏi), 0 lỗi.`);
  }
})();

function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let STORE = Object.assign({xp:0, streak:0, lastPlay:null, badges:[], stageBest:{}}, loadStore());

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(STORE.lastPlay === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  STORE.streak = (STORE.lastPlay===y) ? STORE.streak+1 : 1;
  STORE.lastPlay = today;
  saveStore(STORE);
}


function normalize(s){ return (s||'').trim().toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d"]/g,'').replace(/[.,!?;:]/g,'').replace(/\s+/g,' '); }
function optionLetter(i){ return ['A','B','C','D'][i]; }
function shuffleArr(a){ return a.slice().sort(()=>Math.random()-0.5); }


function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }

function renderHome(){
  document.getElementById('xpDisplay').textContent = `${STORE.xp} XP`;
  document.getElementById('streakDisplay').textContent = `🔥 ${STORE.streak} ngày`;
  document.getElementById('stageCountHeader').textContent = `${STAGES.length}`;
  document.getElementById('totalCountHeader').textContent = `${TOTAL_EXPECTED}`;
  document.getElementById('totalCount').textContent = `${TOTAL_EXPECTED}`;
  const examGrid = document.getElementById('examGrid');
  examGrid.innerHTML = EXAM_PAPERS.map((paper,i)=>{
    const best = (STORE.examBest||{})[i];
    return `<div class="bg-gradient-to-r from-red-700 to-orange-500 text-white rounded-2xl shadow-lg p-5 cursor-pointer hover:brightness-105 transition" onclick="startExam(${i})">
      <p class="text-lg font-extrabold mb-1">📝 Đề ${i+1}</p>
      <p class="text-sm opacity-90">${paper.length} câu — xáo trộn ngẫu nhiên mỗi lần làm, có tính giờ &amp; điểm</p>
      <p class="text-xs opacity-80 mt-1">${best ? `🏆 ${best.correct}/${best.total} · ⏱️ ${formatTime(best.seconds)}` : 'Chưa làm lần nào'}</p>
    </div>`;
  }).join('');
  document.getElementById('badgesWrap').innerHTML = (STORE.badges||[]).map(b=>`<span class="badge-pill text-xs font-bold px-3 py-1 rounded-full">${b}</span>`).join('');
  let bestSum=0;
  STAGES.forEach(s=>{ const b=STORE.stageBest[s.key]; if(b!==undefined) bestSum+=b; });
  const pct = Math.round(bestSum/TOTAL_EXPECTED*100);
  document.getElementById('overallBar').style.width = pct+'%';
  document.getElementById('overallText').textContent = `${bestSum} / ${TOTAL_EXPECTED} câu (điểm tốt nhất mỗi chặng) — ${pct}%`;
  const grid = document.getElementById('stageGrid');
  grid.innerHTML = STAGES.map(st=>{
    const best = STORE.stageBest[st.key];
    return `<div class="stage-card bg-white rounded-2xl shadow-md p-5" onclick="startStage('${st.key}')">
      <p class="text-3xl mb-1">${st.emoji}</p>
      <p class="font-extrabold text-red-900">${st.title}</p>
      <p class="text-xs text-slate-400">${st.vi} · ${st.items.length} câu</p>
      ${best!==undefined ? `<p class="text-xs text-emerald-600 mt-2 font-bold">🏆 Điểm tốt nhất: ${best}/${st.items.length}</p>` : `<p class="text-xs text-slate-400 mt-2">Chưa làm</p>`}
    </div>`;
  }).join('');
}

let PLAY = null;
function startStage(key, itemsOverride){
  const st = STAGES.find(s=>s.key===key);
  const items = itemsOverride || shuffleArr(st.items);
  PLAY = { key, st, items, i:0, correct:0, wrongList:[], answers:[] };
  showScreen('screen-play');
  renderPlayItem();
}
function quitStage(){ showScreen('screen-home'); renderHome(); }
function goHome(){ showScreen('screen-home'); renderHome(); }

function renderDots(){
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = PLAY.items.map((_,i)=>`<span class="progress-dot ${i<PLAY.i?'done':''}"></span>`).join('');
}
function renderPlayItem(){
  renderDots();
  document.getElementById('playCounter').textContent = `${PLAY.i+1}/${PLAY.items.length}`;
  const it = PLAY.items[PLAY.i];
  const passageBox = document.getElementById('playPassage');
  if(PLAY.st.passage){ passageBox.classList.remove('hidden'); passageBox.innerHTML = PLAY.st.passage; } else { passageBox.classList.add('hidden'); passageBox.innerHTML=''; }
  const card = document.getElementById('playCard');
  let html = `<p class="font-bold text-slate-800 mb-4 text-lg">${it.q}</p>`;
  if(it.image) html = `<div class="mb-3">${it.image}</div>` + html;
  if(it.type==='mcq'){
    html += `<div class="grid gap-2" id="optWrap">` + it.options.map((o,j)=>`<label class="option-label rounded-xl px-4 py-3 text-sm font-semibold flex items-center gap-2" id="opt_${j}" onclick="pickMcq(${j})"><span class="font-black text-red-700">${optionLetter(j)}.</span> ${o}</label>`).join('') + `</div>`;
  } else if(it.type==='fill'){
    html += `<input type="text" id="fillInp" class="answer-input w-full px-4 py-3 rounded-xl text-base font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitFill()">
      <button onclick="submitFill()" class="mt-3 bg-red-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Kiểm tra</button>`;
  } else if(it.type==='sentence'){
    const starterHtml = it.starter ? `<span class="font-extrabold">${it.starter}</span>` : '';
    html += `<div class="flex items-center gap-3 flex-wrap">${starterHtml}
      <input type="text" id="fillInp" class="answer-input flex-1 min-w-[180px] px-4 py-3 rounded-xl text-base font-semibold" placeholder="..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitFill()"></div>
      <button onclick="submitFill()" class="mt-3 bg-red-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Kiểm tra</button>`;
  }
  html += `<div id="feedback" class="hidden mt-4 p-3 rounded-xl text-sm"></div>
    <button id="nextBtn" onclick="nextItem()" class="hidden mt-3 bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-6 py-2.5 rounded-full text-sm">Câu tiếp theo →</button>`;
  card.innerHTML = html;
}
function pickMcq(j){
  const it = PLAY.items[PLAY.i];
  document.querySelectorAll('#optWrap .option-label').forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${j}`).classList.add('selected');
  const ok = j===it.answer;
  it.options.forEach((o,k)=>{ const el=document.getElementById(`opt_${k}`); if(k===it.answer) el.classList.add('correct-opt'); else if(k===j) el.classList.add('wrong-opt'); el.onclick=null; });
  finishAnswer(ok, `${optionLetter(it.answer)}. ${it.options[it.answer]}`);
}
function submitFill(){
  const it = PLAY.items[PLAY.i];
  const inp = document.getElementById('fillInp');
  const val = normalize(inp.value);
  const acc = (it.accepted||[it.answer]).map(normalize);
  const ok = val!=='' && acc.includes(val);
  inp.classList.add(ok?'correct-input':'wrong-input');
  inp.disabled = true;
  const btn = document.querySelector('#playCard button[onclick="submitFill()"]');
  if(btn) btn.classList.add('hidden');
  finishAnswer(ok, it.answer);
}
function finishAnswer(ok, answerLabel){
  const it = PLAY.items[PLAY.i];
  if(ok) PLAY.correct++; else PLAY.wrongList.push(PLAY.i);
  PLAY.answers.push({ok, item:it});
  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  fb.className = 'mt-4 p-3 rounded-xl text-sm ' + (ok? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-700');
  fb.innerHTML = (ok? '✅ Chính xác!' : `❌ Chưa đúng. Đáp án đúng: <b>${answerLabel}</b>`) + (it.explanation?`<br>💡 ${it.explanation}`:'') + (it.vi?`<br>📖 <i>${it.vi}</i>`:'') + (it.note?`<br>📐 <b>${it.note}</b>`:'');
  document.getElementById('nextBtn').classList.remove('hidden');
}
function nextItem(){
  PLAY.i++;
  if(PLAY.i < PLAY.items.length) renderPlayItem();
  else finishStage();
}
function finishStage(){
  bumpStreak();
  const st = PLAY.st;
  const total = PLAY.items.length;
  const pct = Math.round(PLAY.correct/total*100);
  STORE.xp += PLAY.correct*10 + (pct===100?30:0);
  const prevBest = STORE.stageBest[st.key];
  if(prevBest===undefined || PLAY.correct>prevBest) STORE.stageBest[st.key]=PLAY.correct;
  const newBadges=[];
  if(pct===100 && !STORE.badges.includes(`🏆 ${st.title} Perfect`)) newBadges.push(`🏆 ${st.title} Perfect`);
  if(pct>=80 && !STORE.badges.includes(`⭐ ${st.title} Mastered`)) newBadges.push(`⭐ ${st.title} Mastered`);
  const allDone = STAGES.every(s=>STORE.stageBest[s.key]!==undefined || s.key===st.key);
  if(allDone && !STORE.badges.includes('🎓 Unit Complete')) newBadges.push('🎓 Unit Complete');
  STORE.badges = (STORE.badges||[]).concat(newBadges);
  saveStore(STORE);

  showScreen('screen-result');
  document.getElementById('resultEmoji').textContent = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById('resultTitle').textContent = `${st.emoji} ${st.title} — Hoàn thành!`;
  document.getElementById('resultScore').textContent = `${PLAY.correct} / ${total}`;
  document.getElementById('resultAccuracy').textContent = `Độ chính xác: ${pct}%` + (prevBest!==undefined?` · Lần trước: ${prevBest}/${total}`:'');
  document.getElementById('reviewWrongBtn').classList.toggle('hidden', PLAY.wrongList.length===0);
  document.getElementById('retryWrongBtn').classList.toggle('hidden', PLAY.wrongList.length===0);
  document.getElementById('reviewWrap').innerHTML='';
  if(pct>=60) fireConfetti();
}
function showReview(onlyWrong){
  const wrap = document.getElementById('reviewWrap');
  const list = onlyWrong ? PLAY.answers.filter(a=>!a.ok) : PLAY.answers;
  wrap.innerHTML = list.map(a=>{
    const it=a.item;
    const answerLabel = it.type==='mcq' ? `${optionLetter(it.answer)}. ${it.options[it.answer]}` : it.answer;
    return `<div class="bg-white rounded-xl shadow-sm p-4 ${a.ok?'border-l-4 border-emerald-400':'border-l-4 border-rose-400'}">
      <p class="font-bold text-slate-800 text-sm mb-1">${a.ok?'✅':'❌'} ${it.q}</p>
      <p class="text-sm text-slate-600">Đáp án đúng: <b>${answerLabel}</b></p>
      ${it.explanation?`<p class="text-xs text-blue-700 mt-1">💡 ${it.explanation}</p>`:''}
      ${it.vi?`<p class="text-xs text-slate-400 mt-1">📖 ${it.vi}</p>`:''}
      ${it.note?`<p class="text-xs text-violet-600 mt-1">📐 ${it.note}</p>`:''}
    </div>`;
  }).join('');
  wrap.scrollIntoView({behavior:'smooth'});
}
function retryWrongInStage(){
  if(!PLAY.wrongList.length) return;
  const items = PLAY.wrongList.map(i=>PLAY.items[i]);
  startStage(PLAY.key, items);
}


function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

function confirmReset(){
  if(confirm('Xoá toàn bộ tiến độ, XP, huy hiệu? Hành động này không thể hoàn tác.')){
    localStorage.removeItem(STORE_KEY);
    STORE = {xp:0, streak:0, lastPlay:null, badges:[], stageBest:{}};
    renderHome();
  }
}

// ---------- ĐỀ KIỂM TRA TỔNG HỢP (4 fixed papers; together they cover
// every item in the unit at least once. Each ~40-50 items, order
// reshuffled per attempt, timed, hidden feedback until submit, then
// wrong-answer review + retry) ----------
let EXAM = null;
let EXAM_ANSWERS = {};
function formatTime(s){ const m=Math.floor(s/60); const sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }
function startExam(paperIndex, itemsOverride){
  const isRetry = !!itemsOverride;
  const pIdx = paperIndex!==undefined ? paperIndex : (EXAM ? EXAM.paperIndex : 0);
  const items = shuffleArr(itemsOverride || EXAM_PAPERS[pIdx]);
  EXAM = { paperIndex: pIdx, isRetry, items, seconds:0, timer:null, wrongList:[], answers:[] };
  EXAM_ANSWERS = {};
  EXAM_TEXT_ANSWERED.clear();
  showScreen('screen-exam');
  document.getElementById('examTitleBar').textContent = `📝 Đề ${pIdx+1}` + (isRetry ? ' — Làm lại câu sai' : '');
  document.getElementById('examSubmitBar').classList.remove('hidden');
  document.getElementById('examResultBar').classList.add('hidden');
  document.getElementById('examTotalCount').textContent = items.length;
  document.getElementById('examAnsweredCount').textContent = '0';
  renderExam();
  if(EXAM.timer) clearInterval(EXAM.timer);
  EXAM.timer = setInterval(()=>{ EXAM.seconds++; document.getElementById('examTimer').textContent = formatTime(EXAM.seconds); }, 1000);
}
function quitExam(){
  if(EXAM && EXAM.timer) clearInterval(EXAM.timer);
  showScreen('screen-home'); renderHome();
}
function renderExam(){
  const wrap = document.getElementById('examItemsWrap');
  const seenPassages = new Set();
  wrap.innerHTML = EXAM.items.map((it,i)=>{
    let passageHtml = '';
    if(it.passage && !seenPassages.has(it.passage)){
      seenPassages.add(it.passage);
      passageHtml = `<div class="bg-white border border-slate-200 rounded-xl p-4 mb-2 text-sm leading-relaxed text-slate-700">${it.passage}</div>`;
    }
    let body = `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${it.q}</p>`;
    if(it.image) body = `<div class="mb-2">${it.image}</div>` + body;
    if(it.type==='mcq'){
      body += `<div class="grid sm:grid-cols-2 gap-2">` + it.options.map((o,j)=>`<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="examOpt_${i}_${j}" onclick="selectExamMcq(${i},${j})"><span class="font-black text-red-700">${optionLetter(j)}.</span> ${o}</label>`).join('') + `</div>`;
    } else if(it.starter){
      body += `<div class="flex items-center gap-2 flex-wrap"><span class="font-extrabold">${it.starter}</span><input type="text" id="examInp_${i}" class="answer-input flex-1 min-w-[160px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false" oninput="markExamAnswered(${i})"></div>`;
    } else {
      body += `<input type="text" id="examInp_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false" oninput="markExamAnswered(${i})">`;
    }
    body += `<div class="mt-2 text-sm hidden" id="examFb_${i}"></div>`;
    return `<div class="bg-white rounded-2xl shadow-md p-4 mb-3">${passageHtml}${body}</div>`;
  }).join('');
}
const EXAM_TEXT_ANSWERED = new Set();
function markExamAnswered(i){
  const inp = document.getElementById(`examInp_${i}`);
  if(inp && inp.value.trim()!=='') EXAM_TEXT_ANSWERED.add(i); else EXAM_TEXT_ANSWERED.delete(i);
  updateExamAnsweredCount();
}
function updateExamAnsweredCount(){
  const count = Object.keys(EXAM_ANSWERS).length + EXAM_TEXT_ANSWERED.size;
  document.getElementById('examAnsweredCount').textContent = count;
}
function selectExamMcq(i,j){
  document.querySelectorAll(`[id^="examOpt_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`examOpt_${i}_${j}`).classList.add('selected');
  EXAM_ANSWERS[i] = j;
  updateExamAnsweredCount();
}
function submitExam(){
  if(EXAM.timer) clearInterval(EXAM.timer);
  let correct=0; EXAM.wrongList=[]; EXAM.answers=[];
  EXAM.items.forEach((it,i)=>{
    let ok=false, answerLabel='';
    if(it.type==='mcq'){
      const chosen = EXAM_ANSWERS[i];
      ok = chosen===it.answer;
      answerLabel = `${optionLetter(it.answer)}. ${it.options[it.answer]}`;
      it.options.forEach((o,j)=>{ const el=document.getElementById(`examOpt_${i}_${j}`); el.onclick=null; if(j===it.answer) el.classList.add('correct-opt'); else if(j===chosen) el.classList.add('wrong-opt'); });
    } else {
      const inp = document.getElementById(`examInp_${i}`);
      const val = normalize(inp.value);
      const acc = (it.accepted||[it.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.disabled = true;
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = it.answer;
    }
    if(ok) correct++; else EXAM.wrongList.push(i);
    EXAM.answers.push({ok, item:it});
    const fb = document.getElementById(`examFb_${i}`);
    fb.classList.remove('hidden');
    fb.className = 'mt-2 text-sm p-2 rounded-lg ' + (ok?'bg-emerald-50 border border-emerald-200 text-emerald-800':'bg-rose-50 border border-rose-200 text-rose-700');
    fb.innerHTML = (ok?'✅ Chính xác!':`❌ Chưa đúng. Đáp án đúng: <b>${answerLabel}</b>`) + (it.explanation?`<br>💡 ${it.explanation}`:'') + (it.vi?`<br>📖 <i>${it.vi}</i>`:'') + (it.note?`<br>📐 <b>${it.note}</b>`:'');
  });
  const total = EXAM.items.length;
  const pct = Math.round(correct/total*100);
  bumpStreak();
  STORE.xp += correct*10 + (pct===100?50:0);
  if(!EXAM.isRetry){
    STORE.examBest = STORE.examBest || {};
    const prevBest = STORE.examBest[EXAM.paperIndex];
    if(!prevBest || correct>prevBest.correct || (correct===prevBest.correct && EXAM.seconds<prevBest.seconds)){
      STORE.examBest[EXAM.paperIndex] = {correct, total, seconds:EXAM.seconds};
    }
  }
  const newBadges=[];
  const paperLabel = `Đề ${EXAM.paperIndex+1}`;
  if(pct===100 && !STORE.badges.includes(`🏆 ${paperLabel} 100%`)) newBadges.push(`🏆 ${paperLabel} 100%`);
  if(pct>=80 && !STORE.badges.includes(`⭐ ${paperLabel} giỏi (≥80%)`)) newBadges.push(`⭐ ${paperLabel} giỏi (≥80%)`);
  STORE.badges = (STORE.badges||[]).concat(newBadges);
  saveStore(STORE);

  document.getElementById('examSubmitBar').classList.add('hidden');
  document.getElementById('examResultBar').classList.remove('hidden');
  document.getElementById('examResultEmoji').textContent = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById('examResultText').textContent = `${correct} / ${total} câu đúng (${pct}%) · ⏱️ Thời gian: ${formatTime(EXAM.seconds)}`;
  document.getElementById('examRetryBtn').classList.toggle('hidden', EXAM.wrongList.length===0);
  if(pct>=60) fireConfetti();
  document.getElementById('examResultBar').scrollIntoView({behavior:'smooth'});
}
function retryExamWrong(){
  if(!EXAM.wrongList.length) return;
  const items = EXAM.wrongList.map(i=>EXAM.items[i]);
  startExam(EXAM.paperIndex, items);
}
function retryExamSamePaper(){ startExam(EXAM.paperIndex); }

renderHome();
</script>
