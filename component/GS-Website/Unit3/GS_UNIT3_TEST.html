hẩy, chỉ KẾT QUẢ (thích khoe nên hay đăng ảnh) → therefore.", "vi": null, "ipas": null, "vis": ["bởi vì (sai — cần mệnh đề, đây là 2 câu độc lập)", "do đó (đúng)", "mặc dù (sai quan hệ)", "nhưng (sai quan hệ)"], "image": null}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"bully\"] A. With the rise of smartphones, it has become easier for teenagers to _______________________, which causes severe mental health issues.", "answer": "cyberbully younger students", "explanation": "Dựa vào ví dụ: cyberbully younger students.", "vi": "Với sự phổ biến của điện thoại thông minh, việc bắt nạt qua mạng các học sinh nhỏ tuổi hơn trở nên dễ dàng hơn, gây ra các vấn đề tâm lý nghiêm trọng."}, {"id": "TFB6", "type": "mcq", "q": "6. According to the passage, where can students find like-minded ones?", "options": ["Facebook Messenger", "Facebook comments", "Facebook pages", "Facebook wall"], "answer": 2, "explanation": "Bài đọc: \"...through various Facebook pages where they enjoy reading top comments...\".", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "STR3", "type": "mcq", "q": "3. Choose the word whose stress is not the same as that of the other three.", "options": ["adolescence", "independence", "discipline", "metropolitan"], "answer": 2, "explanation": "\"discipline\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/ˌædəˈlesns/", "/ˌɪndɪˈpendəns/", "/ˈdɪsəplɪn/", "/ˌmetrəˈpɒlɪtən/"], "vis": ["tuổi vị thành niên", "sự độc lập", "kỷ luật", "thuộc đô thị lớn"], "image": null}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"bully\"] B. The school has a strict rule against students who try to _______________________ during break time.", "answer": "bully", "explanation": "Điền động từ \"bully\" (bắt nạt) theo đúng nghĩa từ điển.", "vi": "Nhà trường có quy định nghiêm ngặt đối với học sinh cố tình bắt nạt bạn khác trong giờ ra chơi."}, {"id": "MCQ18", "type": "mcq", "q": "18. Every road user ________ obey traffic rules strictly to prevent accidents.", "options": ["ought", "must", "could", "may"], "answer": 1, "explanation": "\"must\" diễn tả sự bắt buộc phải tuân thủ luật lệ giao thông.", "vi": null, "ipas": null, "vis": ["nên (thiếu \"to\" sau ought, sai cấu trúc)", "phải (đúng — bắt buộc)", "có thể (sai nghĩa — chỉ khả năng)", "có thể (sai nghĩa — chỉ sự cho phép)"], "image": null}, {"id": "TFA2", "type": "mcq", "q": "2. Mandi told Tom that she was thirteen years old.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: Mandi thực ra 13 tuổi nhưng nói dối Tom là 16 tuổi (\"I told him I was 16\") → Sai.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["is", "are", "isn't", "aren't"], "answer": 1, "explanation": "\"several advantages\" là danh từ số nhiều → dùng \"are\".", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "STR4", "type": "mcq", "q": "4. Choose the word whose stress is not the same as that of the other three.", "options": ["worried", "relaxed", "resolved", "aware"], "answer": 0, "explanation": "\"worried\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈwʌrid/", "/rɪˈlækst/", "/rɪˈzɒlvd/", "/əˈweər/"], "vis": ["lo lắng", "thư giãn", "đã giải quyết", "nhận thức được"], "image": null}, {"id": "TFB4", "type": "mcq", "q": "4. Students cannot use Facebook Messenger to prepare for presentations or do assignments together.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nói ngược lại: rất tiện lợi để chuẩn bị thuyết trình và làm bài tập cùng nhau qua Messenger → Sai.", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "MCQ17", "type": "mcq", "q": "17. Ba wanted ________ with his family on a day trip to his home village.", "options": ["to join", "join", "joining", "will join"], "answer": 0, "explanation": "Cấu trúc: want + to V.", "vi": null, "ipas": null, "vis": ["tham gia (to-V, đúng)", "tham gia (nguyên mẫu, sai)", "tham gia (V-ing, sai)", "sẽ tham gia (sai)"], "image": null}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["quick", "quickly", "quicker", "quickest"], "answer": 1, "explanation": "Động từ \"drive\" cần trạng từ \"quickly\" bổ nghĩa.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "TFB2", "type": "mcq", "q": "2. Students only use Facebook for entertainment purposes.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: học sinh dùng Facebook cho cả giải trí lẫn học tập (\"including entertainment or academic learning\") → Sai.", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "WF9", "type": "fill", "q": "9. The article was written before the election resulted in the clear ___________________ of a Labour victory. (EXPECT)", "answer": "expectation", "explanation": "Sau tính từ \"clear\" cần DANH TỪ → expectation.", "vi": "Bài báo được viết trước khi cuộc bầu cử dẫn đến sự kì vọng rõ ràng về chiến thắng của Đảng Lao động."}, {"id": "MCQ3", "type": "mcq", "q": "3. Parents should give teens some freedom, _________ they should also set limits.", "options": ["so", "but", "for", "however"], "answer": 1, "explanation": "Hai mệnh đề đối lập trong CÙNG một câu (nối bằng dấu phẩy) → dùng liên từ kết hợp \"but\".", "vi": null, "ipas": null, "vis": ["vì vậy (sai quan hệ)", "nhưng (đúng)", "vì, bởi (sai quan hệ)", "tuy nhiên (sai — \"however\" không nối trực tiếp bằng dấu phẩy đơn giữa 2 mệnh đề)"], "image": null}, {"id": "WF5", "type": "fill", "q": "5. It's time for him to match his _________ with his golf and realise he's not going to win every time. (MATURE)", "answer": "maturity", "explanation": "Sau tính từ sở hữu \"his\" cần DANH TỪ → maturity (sự trưởng thành).", "vi": "Đã đến lúc anh ấy cần trưởng thành hơn trong môn golf và nhận ra mình không thể thắng mọi lúc."}, {"id": "MCQ4", "type": "mcq", "q": "4. Nam often ________ to her Instagram account to chat with her sister in Ha Noi.", "options": ["logs on", "connects", "uploads", "checks"], "answer": 0, "explanation": "\"log on to\" = đăng nhập vào (tài khoản).", "vi": null, "ipas": null, "vis": ["đăng nhập (đúng)", "kết nối (sai — không đi với \"to account\" theo cách này)", "tải lên (sai nghĩa)", "kiểm tra (sai nghĩa)"], "image": null}, {"id": "TR4", "type": "sentence", "q": "Mono bought a lot of books, for he likes reading.", "starter": "Mono bought a lot of books", "answer": "because he likes reading", "accepted": null, "explanation": "S1, for S2 (lý do) → S1 because S2. \"for\" mang nghĩa \"vì\" trong văn viết trang trọng, chuyển thành \"because\" thông dụng hơn.", "vi": "Mono mua nhiều sách vì cậu ấy thích đọc.", "note": "S1, for S2 (lý do) → S1 because S2"}, {"id": "TR1", "type": "sentence", "q": "Jack has a new laptop; however, he never logs on his account on the Facebook.", "starter": "Although", "answer": "Jack has a new laptop, he never logs on his account on Facebook", "accepted": null, "explanation": "S1; however, S2 → Although S1, S2 — nối 2 ý đối lập bằng \"although\" thay vì \"however\".", "vi": "Mặc dù Jack có laptop mới, cậu ấy không bao giờ đăng nhập tài khoản Facebook.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["harmless", "better", "benefits", "harmful"], "answer": 3, "explanation": "Dùng quá mức (excessively) sẽ gây hại (harmful).", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "TFA5", "type": "mcq", "q": "5. Why has Mandi written this?", "options": ["to describe her boyfriend", "to explain a problem", "to defend her actions", "to prove how clever she is"], "answer": 1, "explanation": "Mandi viết thư để kể về rắc rối của mình và xin lời khuyên.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "STR6", "type": "mcq", "q": "6. Choose the word whose stress is not the same as that of the other three.", "options": ["cognitive", "adulthood", "confident", "encourage"], "answer": 3, "explanation": "\"encourage\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkɒɡnətɪv/", "/əˈdʌlthʊd/", "/ˈkɒnfɪdənt/", "/ɪnˈkʌrɪdʒ/"], "vis": ["thuộc nhận thức", "tuổi trưởng thành", "tự tin", "khuyến khích"], "image": null}, {"id": "PRON1", "type": "mcq", "q": "1. Find the word which has a different sound in the part underlined.", "options": ["boy", "coin", "foil", "assure"], "answer": 3, "explanation": "\"assure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/bɔɪ/", "/kɔɪn/", "/fɔɪl/", "/əˈʃʊər/"], "vis": ["con trai", "đồng xu", "giấy bạc", "đảm bảo"], "image": null}, {"id": "TR6", "type": "sentence", "q": "Phong didn't study hard, so he didn't pass the entrance exam.", "starter": "Because", "answer": "Phong didn't study hard, he didn't pass the entrance exam", "accepted": null, "explanation": "S1, so S2 → Because S1, S2.", "vi": "Bởi vì Phong không học chăm, cậu ấy đã trượt kỳ thi tuyển sinh.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}], [{"id": "PRON4", "type": "mcq", "q": "4. Find the word which has a different sound in the part underlined.", "options": ["joy", "sure", "point", "destroy"], "answer": 1, "explanation": "\"sure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/dʒɔɪ/", "/ʃʊər/", "/pɔɪnt/", "/dɪˈstrɔɪ/"], "vis": ["niềm vui", "chắc chắn", "điểm", "phá hủy"], "image": null}, {"id": "WF7", "type": "fill", "q": "7. She's very good at coping in ___________________ situations. (STRESS)", "answer": "stressful", "explanation": "Bổ nghĩa cho danh từ \"situations\" (tình huống gây ra căng thẳng) → stressful.", "vi": "Cô ấy rất giỏi ứng phó trong những tình huống căng thẳng."}, {"id": "PIC2", "type": "mcq", "q": "16. What does this notification from the school library mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫💻🔇</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">NO COMPUTERS — SILENT STUDY AREA</p></div>", "options": ["You can return or check out reference books.", "You are allowed to talk quietly with your peers.", "You cannot use the computer devices at this time.", "You can read newspapers loudly with your friends."], "answer": 2, "explanation": "Biển \"No computers — Silent study area\" → không dùng máy tính trong khu vực học im lặng.", "vi": null}, {"id": "PRON10", "type": "mcq", "q": "10. Find the word which has a different sound in the part underlined.", "options": ["embarrass", "missing", "classmate", "pressure"], "answer": 3, "explanation": "\"ss\" trong \"pressure\" phát âm /ʃ/ (s nặng), ba từ còn lại phát âm /s/.", "vi": null, "ipas": ["/ɪmˈbærəs/", "/ˈmɪsɪŋ/", "/ˈklɑːsmeɪt/", "/ˈpreʃər/"], "vis": ["làm xấu hổ", "đang thiếu", "bạn cùng lớp", "áp lực"], "image": null}, {"id": "TFB1", "type": "mcq", "q": "1. Facebook had approximately 2.96 billion users in 2022.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"With approximately 2.96 billion users as of 2022...\" → Đúng.", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "WF5", "type": "fill", "q": "5. It's time for him to match his _________ with his golf and realise he's not going to win every time. (MATURE)", "answer": "maturity", "explanation": "Sau tính từ sở hữu \"his\" cần DANH TỪ → maturity (sự trưởng thành).", "vi": "Đã đến lúc anh ấy cần trưởng thành hơn trong môn golf và nhận ra mình không thể thắng mọi lúc."}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["by", "in", "at", "on"], "answer": 0, "explanation": "Cụm \"by taxi\" = bằng xe taxi.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "STR1", "type": "mcq", "q": "1. Choose the word whose stress is not the same as that of the other three.", "options": ["worried", "cognitive", "concentrate", "frustrated"], "answer": 3, "explanation": "\"frustrated\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈwʌrid/", "/ˈkɒɡnətɪv/", "/ˈkɒnsntreɪt/", "/frʌˈstreɪtɪd/"], "vis": ["lo lắng", "thuộc nhận thức", "tập trung", "thất vọng, bực bội"], "image": null}, {"id": "TR2", "type": "sentence", "q": "Lan wants to study better, so she turns off her mobile phone.", "starter": "Because", "answer": "Lan wants to study better, she turns off her mobile phone", "accepted": null, "explanation": "S1, so S2 → Because S1, S2 (S2 là kết quả của việc S1).", "vi": "Vì Lan muốn học tốt hơn nên cô ấy tắt điện thoại.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["is", "are", "isn't", "aren't"], "answer": 1, "explanation": "\"several advantages\" là danh từ số nhiều → dùng \"are\".", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "MCQ14", "type": "mcq", "q": "14. Lam is very sensitive, _________you shouldn't comment on his new shoes.", "options": ["but", "therefore", "however", "so"], "answer": 3, "explanation": "Mệnh đề sau chỉ KẾT QUẢ (vì nhạy cảm nên đừng bình luận) → so.", "vi": null, "ipas": null, "vis": ["nhưng (sai quan hệ)", "do đó (sai vị trí — cần dấu ; trước \"therefore\", ở đây chỉ có dấu phẩy)", "tuy nhiên (sai quan hệ)", "vì vậy (đúng)"], "image": null}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["quick", "quickly", "quicker", "quickest"], "answer": 1, "explanation": "Động từ \"drive\" cần trạng từ \"quickly\" bổ nghĩa.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "TFA4", "type": "mcq", "q": "4. Mandi is asking for advice because she is worried about her situation.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"I'm really worried... I need some advice now.\" → Đúng.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"bully\"] B. The school has a strict rule against students who try to _______________________ during break time.", "answer": "bully", "explanation": "Điền động từ \"bully\" (bắt nạt) theo đúng nghĩa từ điển.", "vi": "Nhà trường có quy định nghiêm ngặt đối với học sinh cố tình bắt nạt bạn khác trong giờ ra chơi."}, {"id": "TFA2", "type": "mcq", "q": "2. Mandi told Tom that she was thirteen years old.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: Mandi thực ra 13 tuổi nhưng nói dối Tom là 16 tuổi (\"I told him I was 16\") → Sai.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "PRON2", "type": "mcq", "q": "2. Find the word which has a different sound in the part underlined.", "options": ["insurance", "toil", "voice", "enjoy"], "answer": 0, "explanation": "\"insurance\" phát âm /ʊə/ hoặc /ʃʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/ɪnˈʃʊərəns/", "/tɔɪl/", "/vɔɪs/", "/ɪnˈdʒɔɪ/"], "vis": ["bảo hiểm", "làm việc vất vả", "giọng nói", "thích thú"], "image": null}, {"id": "WF9", "type": "fill", "q": "9. The article was written before the election resulted in the clear ___________________ of a Labour victory. (EXPECT)", "answer": "expectation", "explanation": "Sau tính từ \"clear\" cần DANH TỪ → expectation.", "vi": "Bài báo được viết trước khi cuộc bầu cử dẫn đến sự kì vọng rõ ràng về chiến thắng của Đảng Lao động."}, {"id": "PRON6", "type": "mcq", "q": "6. Find the word which has a different sound in the part underlined.", "options": ["advice", "decision", "delighted", "helpline"], "answer": 1, "explanation": "\"decision\" phát âm /ɪ/ (i ngắn), ba từ còn lại phát âm /aɪ/.", "vi": null, "ipas": ["/ədˈvaɪs/", "/dɪˈsɪʒn/", "/dɪˈlaɪtɪd/", "/ˈhelplaɪn/"], "vis": ["lời khuyên", "quyết định", "vui sướng", "đường dây trợ giúp"], "image": null}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"bully\"] A. With the rise of smartphones, it has become easier for teenagers to _______________________, which causes severe mental health issues.", "answer": "cyberbully younger students", "explanation": "Dựa vào ví dụ: cyberbully younger students.", "vi": "Với sự phổ biến của điện thoại thông minh, việc bắt nạt qua mạng các học sinh nhỏ tuổi hơn trở nên dễ dàng hơn, gây ra các vấn đề tâm lý nghiêm trọng."}, {"id": "MCQ19", "type": "mcq", "q": "19. Listening to folk songs ________ me a great pleasure and I feel very stressed.", "options": ["give", "are giving", "gave", "gives"], "answer": 3, "explanation": "Chủ ngữ là danh động từ \"Listening\" (số ít) → động từ chia số ít: gives.", "vi": null, "ipas": null, "vis": ["cho (thiếu -s, sai)", "đang cho (sai thì)", "đã cho (sai thì)", "cho (đúng — chia đúng ngôi số ít)"], "image": null}, {"id": "TR6", "type": "sentence", "q": "Phong didn't study hard, so he didn't pass the entrance exam.", "starter": "Because", "answer": "Phong didn't study hard, he didn't pass the entrance exam", "accepted": null, "explanation": "S1, so S2 → Because S1, S2.", "vi": "Bởi vì Phong không học chăm, cậu ấy đã trượt kỳ thi tuyển sinh.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"id": "TR8", "type": "sentence", "q": "She first disagreed to join our journey. She changed her mind later. (however)", "starter": "She first disagreed to join our journey;", "answer": "however, she changed her mind later", "accepted": null, "explanation": "Câu1. Câu2. (however) → Câu1; however, câu2. — trạng từ liên kết \"however\" đứng sau dấu chấm phẩy, trước dấu phẩy.", "vi": "Ban đầu cô ấy không đồng ý tham gia chuyến đi của chúng tôi; tuy nhiên, sau đó cô ấy đã đổi ý.", "note": "Câu1. Câu2. (+ liên từ gợi ý) → Câu1; liên từ, câu2."}, {"id": "TR7", "type": "sentence", "q": "He has a smart phone, but he never logs on his account on Facebook.", "starter": "Although", "answer": "he has a smart phone, he never logs on his account on Facebook", "accepted": null, "explanation": "S1, but S2 → Although S1, S2.", "vi": "Mặc dù có điện thoại thông minh, cậu ấy không bao giờ đăng nhập Facebook.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"id": "MCQ3", "type": "mcq", "q": "3. Parents should give teens some freedom, _________ they should also set limits.", "options": ["so", "but", "for", "however"], "answer": 1, "explanation": "Hai mệnh đề đối lập trong CÙNG một câu (nối bằng dấu phẩy) → dùng liên từ kết hợp \"but\".", "vi": null, "ipas": null, "vis": ["vì vậy (sai quan hệ)", "nhưng (đúng)", "vì, bởi (sai quan hệ)", "tuy nhiên (sai — \"however\" không nối trực tiếp bằng dấu phẩy đơn giữa 2 mệnh đề)"], "image": null}, {"id": "PIC4", "type": "mcq", "q": "18. What does this notice mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔧📚🚪</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">LIBRARY CLOSED JUNE 7 — REPAIR WORK</p></div>", "options": ["The library will permanently shut down from June.", "Students cannot enter the library on June 7 due to repair work.", "The library will be open normally on June 7.", "You can return books late without paying any fee."], "answer": 1, "explanation": "Biển báo thông báo thư viện đóng cửa để bảo trì vào ngày 7/6.", "vi": null}, {"id": "MCQ15", "type": "mcq", "q": "15. Mr Buong likes showing off his new things;_________, he often posts pictures on social media.", "options": ["because", "therefore", "although", "but"], "answer": 1, "explanation": "Đứng sau dấu chấm phẩy, chỉ KẾT QUẢ (thích khoe nên hay đăng ảnh) → therefore.", "vi": null, "ipas": null, "vis": ["bởi vì (sai — cần mệnh đề, đây là 2 câu độc lập)", "do đó (đúng)", "mặc dù (sai quan hệ)", "nhưng (sai quan hệ)"], "image": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["because", "Although", "If", "While"], "answer": 2, "explanation": "Câu điều kiện loại 1: \"If social media is not used responsibly, it can...\".", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "STR5", "type": "mcq", "q": "5. Choose the word whose stress is not the same as that of the other three.", "options": ["relate", "contain", "boredom", "informed"], "answer": 2, "explanation": "\"boredom\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/rɪˈleɪt/", "/kənˈteɪn/", "/ˈbɔːdəm/", "/ɪnˈfɔːmd/"], "vis": ["liên quan", "chứa đựng", "sự buồn chán", "được biết tin"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Choose the word whose stress is not the same as that of the other three.", "options": ["worried", "relaxed", "resolved", "aware"], "answer": 0, "explanation": "\"worried\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈwʌrid/", "/rɪˈlækst/", "/rɪˈzɒlvd/", "/əˈweər/"], "vis": ["lo lắng", "thư giãn", "đã giải quyết", "nhận thức được"], "image": null}, {"id": "TFA3", "type": "mcq", "q": "3. Mandi has to lie to her parents when she goes out with Tom.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"I've had to lie to my parents about where I'm going and who with\" → Đúng.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["at", "for", "in", "on"], "answer": 0, "explanation": "Cụm từ \"look at\" = nhìn vào, xem xét.", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "MCQ8", "type": "mcq", "q": "8. She worked hard, _______she passed the exam easily.", "options": ["so", "because", "if", "although"], "answer": 0, "explanation": "Mệnh đề sau chỉ KẾT QUẢ của việc học chăm chỉ → so.", "vi": null, "ipas": null, "vis": ["vì vậy (đúng)", "bởi vì (sai quan hệ — đây không phải nguyên nhân)", "nếu (sai nghĩa)", "mặc dù (sai quan hệ)"], "image": null}, {"id": "TFB2", "type": "mcq", "q": "2. Students only use Facebook for entertainment purposes.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: học sinh dùng Facebook cho cả giải trí lẫn học tập (\"including entertainment or academic learning\") → Sai.", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["Therefore", "so", "Although", "However"], "answer": 0, "explanation": "\"Therefore\" (vì thế) chỉ kết quả của việc có bản đồ tốt.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "STR7", "type": "mcq", "q": "7. Choose the word whose stress is not the same as that of the other three.", "options": ["delighted", "manage", "convince", "depress"], "answer": 1, "explanation": "\"manage\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/dɪˈlaɪtɪd/", "/ˈmænɪdʒ/", "/kənˈvɪns/", "/dɪˈpres/"], "vis": ["vui sướng", "quản lý", "thuyết phục", "làm chán nản"], "image": null}, {"id": "MCQ2", "type": "mcq", "q": "2. We often post many questions to discuss on a/an _______ after school.", "options": ["forum", "market", "club", "office"], "answer": 0, "explanation": "\"forum\" = diễn đàn — nơi để đăng câu hỏi thảo luận.", "vi": null, "ipas": null, "vis": ["diễn đàn (đúng)", "chợ (sai nghĩa)", "câu lạc bộ (sai nghĩa)", "văn phòng (sai nghĩa)"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. Facebook allows students to connect with people who have similar interests.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"they can easily connect with those who have the same interests...\" → Đúng.", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "MCQ11", "type": "mcq", "q": "11. He isn't going to the concert………….the tickets are too expensive.", "options": ["Though", "in spite of", "because", "because of"], "answer": 2, "explanation": "Sau chỗ trống là một MỆNH ĐỀ (S+V: \"the tickets are too expensive\") → dùng \"because\".", "vi": null, "ipas": null, "vis": ["mặc dù (sai — cần mệnh đề đối lập, ở đây là nguyên nhân)", "mặc dù (sai — đi với cụm danh từ, không phải mệnh đề)", "bởi vì (đúng — đi với mệnh đề)", "bởi vì (sai — đi với cụm danh từ, không phải mệnh đề)"], "image": null}, {"id": "WF6", "type": "fill", "q": "6. When _______ enger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["excited", "unpopular", "popular", "interesting"], "answer": 2, "explanation": "\"popular\" hợp nghĩa với bối cảnh mạng xã hội ngày càng phổ biến.", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "STR5", "type": "mcq", "q": "5. Choose the word whose stress is not the same as that of the other three.", "options": ["relate", "contain", "boredom", "informed"], "answer": 2, "explanation": "\"boredom\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/rɪˈleɪt/", "/kənˈteɪn/", "/ˈbɔːdəm/", "/ɪnˈfɔːmd/"], "vis": ["liên quan", "chứa đựng", "sự buồn chán", "được biết tin"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Choose the word whose stress is not the same as that of the other three.", "options": ["worried", "relaxed", "resolved", "aware"], "answer": 0, "explanation": "\"worried\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈwʌrid/", "/rɪˈlækst/", "/rɪˈzɒlvd/", "/əˈweər/"], "vis": ["lo lắng", "thư giãn", "đã giải quyết", "nhận thức được"], "image": null}, {"id": "TFA1", "type": "mcq", "q": "1. Mandi met Tom at a disco three months ago.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Three months ago, I went to a disco where I met a boy called Tom.\" → Đúng.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "TFA5", "type": "mcq", "q": "5. Why has Mandi written this?", "options": ["to describe her boyfriend", "to explain a problem", "to defend her actions", "to prove how clever she is"], "answer": 1, "explanation": "Mandi viết thư để kể về rắc rối của mình và xin lời khuyên.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["quick", "quickly", "quicker", "quickest"], "answer": 1, "explanation": "Động từ \"drive\" cần trạng từ \"quickly\" bổ nghĩa.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"pressure\"] B. The manager had to change his mind because he was ______________ from the team.", "answer": "under pressure", "explanation": "Dựa vào ví dụ: under pressure.", "vi": "Người quản lý phải đổi ý vì chịu áp lực từ đội nhóm."}, {"id": "WF6", "type": "fill", "q": "6. When _____________, we release c const STAGES = STAGES_RAW.stages;
const TOTAL_EXPECTED = STAGES_RAW.total;
const EXAM_PAPERS = STAGES_RAW.examPapers;
const STORE_KEY = 'gs_unit3_fulltest_v1';

(function validate(){
  const ids = [];
  let missingAnswer=0, missingExplanation=0;
  STAGES.forEach(s=>{
    s.items.forEach(it=>{
      ids.push(it.id);
      if(it.type==='mcq' && (it.answer===undefined || it.answer===null || it.answer<0 || it.answer>=it.options.length)) missingAnswer++;
      if((it.type==='fill'||it.type==='sentence') && !it.answer) missingAnswer++;
      if(!it.explanation) missingExplanation++;
    });
  });
  const dupSet = new Set(); let dupes=0;
  ids.forEach(id=>{ if(dupSet.has(id)) dupes++; dupSet.add(id); });
  const totalActual = ids.length;
  const problems = [];
  if(totalActual !== TOTAL_EXPECTED) problems.push(`Tổng số câu thực tế (${totalActual}) khác kỳ vọng (${TOTAL_EXPECTED})`);
  if(dupes>0) problems.push(`${dupes} ID bị trùng`);
  if(missingAnswer>0) problems.push(`${missingAnswer} câu thiếu đáp án hợp lệ`);
  if(missingExplanation>0) problems.push(`${missingExplanation} câu thiếu giải thích`);
  EXAM_PAPERS.forEach((paper,i)=>{
    if(paper.length < 40 || paper.length > 50) problems.push(`Đề ${i+1} có ${paper.length} câu (ngoài khoảng 40-50)`);
    const pids = new Set(paper.map(it=>it.id));
    if(pids.size !== paper.length) problems.push(`Đề ${i+1} có câu trùng lặp`);
  });
  // Every stage/category should appear in EVERY paper — catches the class
  // of bug where two small categories get merged into one "family" and
  // random distribution leaves one of them at 0 in some paper.
  const familyOf = (id) => id.replace(/[\d_]+$/, '');
  const stageFamilies = new Set(STAGES.map(s => familyOf(s.items[0] ? s.items[0].id : '')));
  EXAM_PAPERS.forEach((paper,i)=>{
    const presentFamilies = new Set(paper.map(it => familyOf(it.id)));
    stageFamilies.forEach(fam => {
      if(fam && !presentFamilies.has(fam)) problems.push(`Đề ${i+1} thiếu hẳn nhóm câu hỏi "${fam}"`);
    });
  });
  const coveredIds = new Set(); EXAM_PAPERS.forEach(paper=>paper.forEach(it=>coveredIds.add(it.id)));
  const allStageIds = new Set(ids);
  let uncovered = 0; allStageIds.forEach(id=>{ if(!coveredIds.has(id)) uncovered++; });
  if(uncovered>0) problems.push(`${uncovered} câu trong Unit không xuất hiện ở đề kiểm tra nào`);
  const banner = document.getElementById('auditBanner');
  if(problems.length){
    banner.classList.add('show');
    banner.textContent = '⚠️ Content audit: ' + problems.join(' · ');
    console.error('CONTENT AUDIT FAILED', problems);
  } else {
    console.log(`Content audit OK: ${totalActual}/${TOTAL_EXPECTED} câu, ${EXAM_PAPERS.length} đề kiểm tra (mỗi đề ~${EXAM_PAPERS[0].length} câu, cùng nhau phủ đủ 100% câu hỏi), 0 lỗi.`);
  }
})();

function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let STORE = Object.assign({xp:0, streak:0, lastPlay:null, badges:[], stageBest:{}}, loadStore());

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(STORE.lastPlay === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  STORE.streak = (STORE.lastPlay===y) ? STORE.streak+1 : 1;
  STORE.lastPlay = today;
  saveStore(STORE);
}


function normalize(s){ return (s||'').trim().toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d"]/g,'').replace(/[.,!?;:]/g,'').replace(/\s+/g,' '); }
function optionLetter(i){ return ['A','B','C','D'][i]; }
function shuffleArr(a){ return a.slice().sort(()=>Math.random()-0.5); }


function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); }

function renderHome(){
  document.getElementById('xpDisplay').textContent = `${STORE.xp} XP`;
  document.getElementById('streakDisplay').textContent = `🔥 ${STORE.streak} ngày`;
  document.getElementById('stageCountHeader').textContent = `${STAGES.length}`;
  document.getElementById('totalCountHeader').textContent = `${TOTAL_EXPECTED}`;
  document.getElementById('totalCount').textContent = `${TOTAL_EXPECTED}`;
  const examGrid = document.getElementById('examGrid');
  examGrid.innerHTML = EXAM_PAPERS.map((paper,i)=>{
    const best = (STORE.examBest||{})[i];
    return `<div class="bg-gradient-to-r from-red-700 to-orange-500 text-white rounded-2xl shadow-lg p-5 cursor-pointer hover:brightness-105 transition" onclick="startExam(${i})">
      <p class="text-lg font-extrabold mb-1">📝 Đề ${i+1}</p>
      <p class="text-sm opacity-90">${paper.length} câu — xáo trộn ngẫu nhiên mỗi lần làm, có tính giờ &amp; điểm</p>
      <p class="text-xs opacity-80 mt-1">${best ? `🏆 ${best.correct}/${best.total} · ⏱️ ${formatTime(best.seconds)}` : 'Chưa làm lần nào'}</p>
    </div>`;
  }).join('');
  document.getElementById('badgesWrap').innerHTML = (STORE.badges||[]).map(b=>`<span class="badge-pill text-xs font-bold px-3 py-1 rounded-full">${b}</span>`).join('');
  let bestSum=0;
  STAGES.forEach(s=>{ const b=STORE.stageBest[s.key]; if(b!==undefined) bestSum+=b; });
  const pct = Math.round(bestSum/TOTAL_EXPECTED*100);
  document.getElementById('overallBar').style.width = pct+'%';
  document.getElementById('overallText').textContent = `${bestSum} / ${TOTAL_EXPECTED} câu (điểm tốt nhất mỗi chặng) — ${pct}%`;
  const grid = document.getElementById('stageGrid');
  grid.innerHTML = STAGES.map(st=>{
    const best = STORE.stageBest[st.key];
    return `<div class="stage-card bg-white rounded-2xl shadow-md p-5" onclick="startStage('${st.key}')">
      <p class="text-3xl mb-1">${st.emoji}</p>
      <p class="font-extrabold text-red-900">${st.title}</p>
      <p class="text-xs text-slate-400">${st.vi} · ${st.items.length} câu</p>
      ${best!==undefined ? `<p class="text-xs text-emerald-600 mt-2 font-bold">🏆 Điểm tốt nhất: ${best}/${st.items.length}</p>` : `<p class="text-xs text-slate-400 mt-2">Chưa làm</p>`}
    </div>`;
  }).join('');
}

let PLAY = null;
function startStage(key, itemsOverride){
  const st = STAGES.find(s=>s.key===key);
  const items = itemsOverride || shuffleArr(st.items);
  PLAY = { key, st, items, i:0, correct:0, wrongList:[], answers:[] };
  showScreen('screen-play');
  renderPlayItem();
}
function quitStage(){ showScreen('screen-home'); renderHome(); }
function goHome(){ showScreen('screen-home'); renderHome(); }

function renderDots(){
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = PLAY.items.map((_,i)=>`<span class="progress-dot ${i<PLAY.i?'done':''}"></span>`).join('');
}
function renderPlayItem(){
  renderDots();
  document.getElementById('playCounter').textContent = `${PLAY.i+1}/${PLAY.items.length}`;
  const it = PLAY.items[PLAY.i];
  const passageBox = document.getElementById('playPassage');
  if(PLAY.st.passage){ passageBox.classList.remove('hidden'); passageBox.innerHTML = PLAY.st.passage; } else { passageBox.classList.add('hidden'); passageBox.innerHTML=''; }
  const card = document.getElementById('playCard');
  let html = `<p class="font-bold text-slate-800 mb-4 text-lg">${it.q}</p>`;
  if(it.image) html = `<div class="mb-3">${it.image}</div>` + html;
  if(it.type==='mcq'){
    html += `<div class="grid gap-2" id="optWrap">` + it.options.map((o,j)=>`<label class="option-label rounded-xl px-4 py-3 text-sm font-semibold flex items-center gap-2" id="opt_${j}" onclick="pickMcq(${j})"><span class="font-black text-red-700">${optionLetter(j)}.</span> ${o}</label>`).join('') + `</div>`;
  } else if(it.type==='fill'){
    html += `<input type="text" id="fillInp" class="answer-input w-full px-4 py-3 rounded-xl text-base font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitFill()">
      <button onclick="submitFill()" class="mt-3 bg-red-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Kiểm tra</button>`;
  } else if(it.type==='sentence'){
    const starterHtml = it.starter ? `<span class="font-extrabold">${it.starter}</span>` : '';
    html += `<div class="flex items-center gap-3 flex-wrap">${starterHtml}
      <input type="text" id="fillInp" class="answer-input flex-1 min-w-[180px] px-4 py-3 rounded-xl text-base font-semibold" placeholder="..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter') submitFill()"></div>
      <button onclick="submitFill()" class="mt-3 bg-red-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">Kiểm tra</button>`;
  }
  html += `<div id="feedback" class="hidden mt-4 p-3 rounded-xl text-sm"></div>
    <button id="nextBtn" onclick="nextItem()" class="hidden mt-3 bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-6 py-2.5 rounded-full text-sm">Câu tiếp theo →</button>`;
  card.innerHTML = html;
}
function pickMcq(j){
  const it = PLAY.items[PLAY.i];
  document.querySelectorAll('#optWrap .option-label').forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${j}`).classList.add('selected');
  const ok = j===it.answer;
  it.options.forEach((o,k)=>{ const el=document.getElementById(`opt_${k}`); if(k===it.answer) el.classList.add('correct-opt'); else if(k===j) el.classList.add('wrong-opt'); el.onclick=null; });
  finishAnswer(ok, `${optionLetter(it.answer)}. ${it.options[it.answer]}`);
}
function submitFill(){
  const it = PLAY.items[PLAY.i];
  const inp = document.getElementById('fillInp');
  const val = normalize(inp.value);
  const acc = (it.accepted||[it.answer]).map(normalize);
  const ok = val!=='' && acc.includes(val);
  inp.classList.add(ok?'correct-input':'wrong-input');
  inp.disabled = true;
  const btn = document.querySelector('#playCard button[onclick="submitFill()"]');
  if(btn) btn.classList.add('hidden');
  finishAnswer(ok, it.answer);
}
function finishAnswer(ok, answerLabel){
  const it = PLAY.items[PLAY.i];
  if(ok) PLAY.correct++; else PLAY.wrongList.push(PLAY.i);
  PLAY.answers.push({ok, item:it});
  const fb = document.getElementById('feedback');
  fb.classList.remove('hidden');
  fb.className = 'mt-4 p-3 rounded-xl text-sm ' + (ok? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-700');
  fb.innerHTML = (ok? '✅ Chính xác!' : `❌ Chưa đúng. Đáp án đúng: <b>${answerLabel}</b>`) + (it.explanation?`<br>💡 ${it.explanation}`:'') + (it.vi?`<br>📖 <i>${it.vi}</i>`:'') + (it.note?`<br>📐 <b>${it.note}</b>`:'');
  document.getElementById('nextBtn').classList.remove('hidden');
}
function nextItem(){
  PLAY.i++;
  if(PLAY.i < PLAY.items.length) renderPlayItem();
  else finishStage();
}
function finishStage(){
  bumpStreak();
  const st = PLAY.st;
  const total = PLAY.items.length;
  const pct = Math.round(PLAY.correct/total*100);
  STORE.xp += PLAY.correct*10 + (pct===100?30:0);
  const prevBest = STORE.stageBest[st.key];
  if(prevBest===undefined || PLAY.correct>prevBest) STORE.stageBest[st.key]=PLAY.correct;
  const newBadges=[];
  if(pct===100 && !STORE.badges.includes(`🏆 ${st.title} Perfect`)) newBadges.push(`🏆 ${st.title} Perfect`);
  if(pct>=80 && !STORE.badges.includes(`⭐ ${st.title} Mastered`)) newBadges.push(`⭐ ${st.title} Mastered`);
  const allDone = STAGES.every(s=>STORE.stageBest[s.key]!==undefined || s.key===st.key);
  if(allDone && !STORE.badges.includes('🎓 Unit Complete')) newBadges.push('🎓 Unit Complete');
  STORE.badges = (STORE.badges||[]).concat(newBadges);
  saveStore(STORE);

  showScreen('screen-result');
  document.getElementById('resultEmoji').textContent = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById('resultTitle').textContent = `${st.emoji} ${st.title} — Hoàn thành!`;
  document.getElementById('resultScore').textContent = `${PLAY.correct} / ${total}`;
  document.getElementById('resultAccuracy').textContent = `Độ chính xác: ${pct}%` + (prevBest!==undefined?` · Lần trước: ${prevBest}/${total}`:'');
  document.getElementById('reviewWrongBtn').classList.toggle('hidden', PLAY.wrongList.length===0);
  document.getElementById('retryWrongBtn').classList.toggle('hidden', PLAY.wrongList.length===0);
  document.getElementById('reviewWrap').innerHTML='';
  if(pct>=60) fireConfetti();
}
function showReview(onlyWrong){
  const wrap = document.getElementById('reviewWrap');
  const list = onlyWrong ? PLAY.answers.filter(a=>!a.ok) : PLAY.answers;
  wrap.innerHTML = list.map(a=>{
    const it=a.item;
    const answerLabel = it.type==='mcq' ? `${optionLetter(it.answer)}. ${it.options[it.answer]}` : it.answer;
    return `<div class="bg-white rounded-xl shadow-sm p-4 ${a.ok?'border-l-4 border-emerald-400':'border-l-4 border-rose-400'}">
      <p class="font-bold text-slate-800 text-sm mb-1">${a.ok?'✅':'❌'} ${it.q}</p>
      <p class="text-sm text-slate-600">Đáp án đúng: <b>${answerLabel}</b></p>
      ${it.explanation?`<p class="text-xs text-blue-700 mt-1">💡 ${it.explanation}</p>`:''}
      ${it.vi?`<p class="text-xs text-slate-400 mt-1">📖 ${it.vi}</p>`:''}
      ${it.note?`<p class="text-xs text-violet-600 mt-1">📐 ${it.note}</p>`:''}
    </div>`;
  }).join('');
  wrap.scrollIntoView({behavior:'smooth'});
}
function retryWrongInStage(){
  if(!PLAY.wrongList.length) return;
  const items = PLAY.wrongList.map(i=>PLAY.items[i]);
  startStage(PLAY.key, items);
}


function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

function confirmReset(){
  if(confirm('Xoá toàn bộ tiến độ, XP, huy hiệu? Hành động này không thể hoàn tác.')){
    localStorage.removeItem(STORE_KEY);
    STORE = {xp:0, streak:0, lastPlay:null, badges:[], stageBest:{}};
    renderHome();
  }
}

// ---------- ĐỀ KIỂM TRA TỔNG HỢP (4 fixed papers; together they cover
// every item in the unit at least once. Each ~40-50 items, order
// reshuffled per attempt, timed, hidden feedback until submit, then
// wrong-answer review + retry) ----------
let EXAM = null;
let EXAM_ANSWERS = {};
function formatTime(s){ const m=Math.floor(s/60); const sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }
function startExam(paperIndex, itemsOverride){
  const isRetry = !!itemsOverride;
  const pIdx = paperIndex!==undefined ? paperIndex : (EXAM ? EXAM.paperIndex : 0);
  const items = shuffleArr(itemsOverride || EXAM_PAPERS[pIdx]);
  EXAM = { paperIndex: pIdx, isRetry, items, seconds:0, timer:null, wrongList:[], answers:[] };
  EXAM_ANSWERS = {};
  EXAM_TEXT_ANSWERED.clear();
  showScreen('screen-exam');
  document.getElementById('examTitleBar').textContent = `📝 Đề ${pIdx+1}` + (isRetry ? ' — Làm lại câu sai' : '');
  document.getElementById('examSubmitBar').classList.remove('hidden');
  document.getElementById('examResultBar').classList.add('hidden');
  document.getElementById('examTotalCount').textContent = items.length;
  document.getElementById('examAnsweredCount').textContent = '0';
  renderExam();
  if(EXAM.timer) clearInterval(EXAM.timer);
  EXAM.timer = setInterval(()=>{ EXAM.seconds++; document.getElementById('examTimer').textContent = formatTime(EXAM.seconds); }, 1000);
}
function quitExam(){
  if(EXAM && EXAM.timer) clearInterval(EXAM.timer);
  showScreen('screen-home'); renderHome();
}
function renderExam(){
  const wrap = document.getElementById('examItemsWrap');
  const seenPassages = new Set();
  wrap.innerHTML = EXAM.items.map((it,i)=>{
    let passageHtml = '';
    if(it.passage && !seenPassages.has(it.passage)){
      seenPassages.add(it.passage);
      passageHtml = `<div class="bg-white border border-slate-200 rounded-xl p-4 mb-2 text-sm leading-relaxed text-slate-700">${it.passage}</div>`;
    }
    let body = `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${it.q}</p>`;
    if(it.image) body = `<div class="mb-2">${it.image}</div>` + body;
    if(it.type==='mcq'){
      body += `<div class="grid sm:grid-cols-2 gap-2">` + it.options.map((o,j)=>`<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="examOpt_${i}_${j}" onclick="selectExamMcq(${i},${j})"><span class="font-black text-red-700">${optionLetter(j)}.</span> ${o}</label>`).join('') + `</div>`;
    } else if(it.starter){
      body += `<div class="flex items-center gap-2 flex-wrap"><span class="font-extrabold">${it.starter}</span><input type="text" id="examInp_${i}" class="answer-input flex-1 min-w-[160px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false" oninput="markExamAnswered(${i})"></div>`;
    } else {
      body += `<input type="text" id="examInp_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false" oninput="markExamAnswered(${i})">`;
    }
    body += `<div class="mt-2 text-sm hidden" id="examFb_${i}"></div>`;
    return `<div class="bg-white rounded-2xl shadow-md p-4 mb-3">${passageHtml}${body}</div>`;
  }).join('');
}
const EXAM_TEXT_ANSWERED = new Set();
function markExamAnswered(i){
  const inp = document.getElementById(`examInp_${i}`);
  if(inp && inp.value.trim()!=='') EXAM_TEXT_ANSWERED.add(i); else EXAM_TEXT_ANSWERED.delete(i);
  updateExamAnsweredCount();
}
function updateExamAnsweredCount(){
  const count = Object.keys(EXAM_ANSWERS).length + EXAM_TEXT_ANSWERED.size;
  document.getElementById('examAnsweredCount').textContent = count;
}
function selectExamMcq(i,j){
  document.querySelectorAll(`[id^="examOpt_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`examOpt_${i}_${j}`).classList.add('selected');
  EXAM_ANSWERS[i] = j;
  updateExamAnsweredCount();
}
function submitExam(){
  if(EXAM.timer) clearInterval(EXAM.timer);
  let correct=0; EXAM.wrongList=[]; EXAM.answers=[];
  EXAM.items.forEach((it,i)=>{
    let ok=false, answerLabel='';
    if(it.type==='mcq'){
      const chosen = EXAM_ANSWERS[i];
      ok = chosen===it.answer;
      answerLabel = `${optionLetter(it.answer)}. ${it.options[it.answer]}`;
      it.options.forEach((o,j)=>{ const el=document.getElementById(`examOpt_${i}_${j}`); el.onclick=null; if(j===it.answer) el.classList.add('correct-opt'); else if(j===chosen) el.classList.add('wrong-opt'); });
    } else {
      const inp = document.getElementById(`examInp_${i}`);
      const val = normalize(inp.value);
      const acc = (it.accepted||[it.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.disabled = true;
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = it.answer;
    }
    if(ok) correct++; else EXAM.wrongList.push(i);
    EXAM.answers.push({ok, item:it});
    const fb = document.getElementById(`examFb_${i}`);
    fb.classList.remove('hidden');
    fb.className = 'mt-2 text-sm p-2 rounded-lg ' + (ok?'bg-emerald-50 border border-emerald-200 text-emerald-800':'bg-rose-50 border border-rose-200 text-rose-700');
    fb.innerHTML = (ok?'✅ Chính xác!':`❌ Chưa đúng. Đáp án đúng: <b>${answerLabel}</b>`) + (it.explanation?`<br>💡 ${it.explanation}`:'') + (it.vi?`<br>📖 <i>${it.vi}</i>`:'') + (it.note?`<br>📐 <b>${it.note}</b>`:'');
  });
  const total = EXAM.items.length;
  const pct = Math.round(correct/total*100);
  bumpStreak();
  STORE.xp += correct*10 + (pct===100?50:0);
  if(!EXAM.isRetry){
    STORE.examBest = STORE.examBest || {};
    const prevBest = STORE.examBest[EXAM.paperIndex];
    if(!prevBest || correct>prevBest.correct || (correct===prevBest.correct && EXAM.seconds<prevBest.seconds)){
      STORE.examBest[EXAM.paperIndex] = {correct, total, seconds:EXAM.seconds};
    }
  }
  const newBadges=[];
  const paperLabel = `Đề ${EXAM.paperIndex+1}`;
  if(pct===100 && !STORE.badges.includes(`🏆 ${paperLabel} 100%`)) newBadges.push(`🏆 ${paperLabel} 100%`);
  if(pct>=80 && !STORE.badges.includes(`⭐ ${paperLabel} giỏi (≥80%)`)) newBadges.push(`⭐ ${paperLabel} giỏi (≥80%)`);
  STORE.badges = (STORE.badges||[]).concat(newBadges);
  saveStore(STORE);

  document.getElementById('examSubmitBar').classList.add('hidden');
  document.getElementById('examResultBar').classList.remove('hidden');
  document.getElementById('examResultEmoji').textContent = pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById('examResultText').textContent = `${correct} / ${total} câu đúng (${pct}%) · ⏱️ Thời gian: ${formatTime(EXAM.seconds)}`;
  document.getElementById('examRetryBtn').classList.toggle('hidden', EXAM.wrongList.length===0);
  if(pct>=60) fireConfetti();
  document.getElementById('examResultBar').scrollIntoView({behavior:'smooth'});
}
function retryExamWrong(){
  if(!EXAM.wrongList.length) return;
  const items = EXAM.wrongList.map(i=>EXAM.items[i]);
  startExam(EXAM.paperIndex, items);
}
function retryExamSamePaper(){ startExam(EXAM.paperIndex); }

renderHome();
</script>
