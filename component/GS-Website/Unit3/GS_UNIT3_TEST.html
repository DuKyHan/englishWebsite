<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 3 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 3 · Teenagers</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "1. Find the word which has a different sound in the part underlined.", "options": ["boy", "coin", "foil", "assure"], "answer": 3, "explanation": "\"assure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/bɔɪ/", "/kɔɪn/", "/fɔɪl/", "/əˈʃʊər/"], "vis": ["con trai", "đồng xu", "giấy bạc", "đảm bảo"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "2. Find the word which has a different sound in the part underlined.", "options": ["insurance", "toil", "voice", "enjoy"], "answer": 0, "explanation": "\"insurance\" phát âm /ʊə/ hoặc /ʃʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/ɪnˈʃʊərəns/", "/tɔɪl/", "/vɔɪs/", "/ɪnˈdʒɔɪ/"], "vis": ["bảo hiểm", "làm việc vất vả", "giọng nói", "thích thú"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "3. Find the word which has a different sound in the part underlined.", "options": ["oil", "boil", "poor", "toy"], "answer": 2, "explanation": "\"poor\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/ɔɪl/", "/bɔɪl/", "/pʊər/", "/tɔɪ/"], "vis": ["dầu", "luộc, sôi", "nghèo", "đồ chơi"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "4. Find the word which has a different sound in the part underlined.", "options": ["joy", "sure", "point", "destroy"], "answer": 1, "explanation": "\"sure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/dʒɔɪ/", "/ʃʊər/", "/pɔɪnt/", "/dɪˈstrɔɪ/"], "vis": ["niềm vui", "chắc chắn", "điểm", "phá hủy"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "5. Find the word which has a different sound in the part underlined.", "options": ["skill", "house-keeping", "tense", "decision"], "answer": 2, "explanation": "\"tense\" phát âm /e/, ba từ còn lại chứa âm /ɪ/ hoặc /i/.", "vi": null, "ipas": ["/skɪl/", "/ˈhaʊskiːpɪŋ/", "/tens/", "/dɪˈsɪʒn/"], "vis": ["kỹ năng", "việc nội trợ", "căng "worried\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈwʌrid/", "/rɪˈlækst/", "/rɪˈzɒlvd/", "/əˈweər/"], "vis": ["lo lắng", "thư giãn", "đã giải quyết", "nhận thức được"], "image": null}, {"id": "STR5", "type": "mcq", "q": "5. Choose the word whose stress is not the same as that of the other three.", "options": ["relate", "contain", "boredom", "informed"], "answer": 2, "explanation": "\"boredom\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/rɪˈleɪt/", "/kənˈteɪn/", "/ˈbɔːdəm/", "/ɪnˈfɔːmd/"], "vis": ["liên quan", "chứa đựng", "sự buồn chán", "được biết tin"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Choose the word whose stress is not the same as that of the other three.", "options": ["cognitive", "adulthood", "confident", "encourage"], "answer": 3, "explanation": "\"encourage\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkɒɡnətɪv/", "/əˈdʌlthʊd/", "/ˈkɒnfɪdənt/", "/ɪnˈkʌrɪdʒ/"], "vis": ["thuộc nhận thức", "tuổi trưởng thành", "tự tin", "khuyến khích"], "image": null}, {"id": "STR7", "type": "mcq", "q": "7. Choose the word whose stress is not the same as that of the other three.", "options": ["delighted", "manage", "convince", "depress"], "answer": 1, "explanation": "\"manage\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/dɪˈlaɪtɪd/", "/ˈmænɪdʒ/", "/kənˈvɪns/", "/dɪˈpres/"], "vis": ["vui sướng", "quản lý", "thuyết phục", "làm chán nản"], "image": null}, {"id": "STR8", "type": "mcq", "q": "8. Choose the word whose stress is not the same as that of the other three.", "options": ["confident", "abandon", "depressed", "important"], "answer": 0, "explanation": "\"confident\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈkɒnfɪdənt/", "/əˈbændən/", "/dɪˈprest/", "/ɪmˈpɔːtnt/"], "vis": ["tự tin", "từ bỏ", "chán nản", "quan trọng"], "image": null}, {"id": "STR9", "type": "mcq", "q": "9. Choose the word whose stress is not the same as that of the other three.", "options": ["communicate", "disappointed", "preparation", "adolescence"], "answer": 0, "explanation": "\"communicate\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/kəˈmjuːnɪkeɪt/", "/ˌdɪsəˈpɔɪntɪd/", "/ˌprepəˈreɪʃn/", "/ˌædəˈlesns/"], "vis": ["giao tiếp", "thất vọng", "sự chuẩn bị", "tuổi vị thành niên"], "image": null}, {"id": "STR10", "type": "mcq", "q": "10. Choose the word whose stress is not the same as that of the other three.", "options": ["pressure", "decision", "friendship", "guidance"], "answer": 1, "explanation": "\"decision\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈpreʃər/", "/dɪˈsɪʒn/", "/ˈfrendʃɪp/", "/ˈɡaɪdns/"], "vis": ["áp lực", "quyết định", "tình bạn", "sự hướng dẫn"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "1. Mono wants to become a singer; _________, he can't sing or play any instruments.", "options": ["therefore", "however", "because", "although"], "answer": 1, "explanation": "Hai mệnh đề mang ý đối lập (muốn thành ca sĩ nhưng không hát/chơi nhạc cụ được) → however.", "vi": null, "ipas": null, "vis": ["vì vậy (sai — không phải quan hệ kết quả)", "tuy nhiên (đúng)", "bởi vì (sai — cần mệnh đề, không đứng giữa 2 câu độc lập kiểu này)", "mặc dù (sai — cần đứng đầu mệnh đề phụ)"], "image": null}, {"id": "MCQ2", "type": "mcq", "q": "2. We often post many questions to discuss on a/an _______ after school.", "options": ["forum", "market", "club", "office"], "answer": 0, "explanation": "\"forum\" = diễn đàn — nơi để đăng câu hỏi thảo luận.", "vi": null, "ipas": null, "vis": ["diễn đàn (đúng)", "chợ (sai nghĩa)", "câu lạc bộ (sai nghĩa)", "văn phòng (sai nghĩa)"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. Parents should give teens some freedom, _________ they should also set limits.", "options": ["so", "but", "for", "however"], "answer": 1, "explanation": "Hai mệnh đề đối lập trong CÙNG một câu (nối bằng dấu phẩy) → dùng liên từ kết hợp \"but\".", "vi": null, "ipas": null, "vis": ["vì vậy (sai quan hệ)", "nhưng (đúng)", "vì, bởi (sai quan hệ)", "tuy nhiên (sai — \"however\" không nối trực tiếp bằng dấu phẩy đơn giữa 2 mệnh đề)"], "image": null}, {"id": "MCQ4", "type": "mcq", "q": "4. Nam often ________ to her Instagram account to chat with her sister in Ha Noi.", "options": ["logs on", "connects", "uploads", "checks"], "answer": 0, "explanation": "\"log on to\" = đăng nhập vào (tài khoản).", "vi": null, "ipas": null, "vis": ["đăng nhập (đúng)", "kết nối (sai — không đi với \"to account\" theo cách này)", "tải lên (sai nghĩa)", "kiểm tra (sai nghĩa)"], "image": null}, {"id": "MCQ5", "type": "mcq", "q": "5. Lan ______ with some friends, so she can't concentrate on the lesson now.", "options": ["is chatting", "chatted", "chatting", "will chat"], "answer": 0, "explanation": "Sự việc đang diễn ra ngay lúc nói (\"now\") → thì hiện tại tiếp diễn: is chatting.", "vi": null, "ipas": null, "vis": ["đang nhắn tin (đúng)", "đã nhắn tin (quá khứ, sai thì)", "nhắn tin (V-ing, thiếu trợ động từ, sai)", "sẽ nhắn tin (tương lai, sai)"], "image": null}, {"id": "MCQ6", "type": "mcq", "q": "6. She wanted to prepare for the exam; ______, she turned off her mobile phone.", "options": ["so", "but", "however", "therefore"], "answer": 3, "explanation": "Đứng sau dấu chấm phẩy, trước dấu phẩy, chỉ KẾT QUẢ → therefore (trạng từ liên kết).", "vi": null, "ipas": null, "vis": ["vì vậy (sai vị trí ngữ pháp — \"so\" không đứng sau dấu ;)", "nhưng (sai quan hệ — không đối lập)", "tuy nhiên (sai quan hệ — không đối lập)", "do đó (đúng)"], "image": null}, {"id": "MCQ7", "type": "mcq", "q": "7. Mr Buong decided______a new laptop last week.", "options": ["buy", "bought", "buying", "to buy"], "answer": 3, "explanation": "Cấu trúc: decide + to V.", "vi": null, "ipas": null, "vis": ["mua (nguyên mẫu, sai)", "đã mua (sai)", "mua (V-ing, sai)", "mua (to-V, đúng)"], "image": null}, {"id": "MCQ8", "type": "mcq", "q": "8. She worked hard, _______she passed the exam easily.", "options": ["so", "because", "if", "although"], "answer": 0, "explanation": "Mệnh đề sau chỉ KẾT QUẢ của việc học chăm chỉ → so.", "vi": null, "ipas": null, "vis": ["vì vậy (đúng)", "bởi vì (sai quan hệ — đây không phải nguyên nhân)", "nếu (sai nghĩa)", "mặc dù (sai quan hệ)"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. Mr. Quang used the facebook _______10 p.m last night.", "options": ["on", "in", "at", "for"], "answer": 2, "explanation": "Dùng giới từ \"at\" trước mốc giờ cụ thể.", "vi": null, "ipas": null, "vis": ["vào (dùng cho ngày/thứ, sai)", "trong (sai)", "vào lúc (đúng — dùng cho giờ)", "trong khoảng (sai)"], "image": null}, {"id": "MCQ10", "type": "mcq", "q": "10. Ba is tired _______he stayed up late watching the clips on Tiktok last night.", "options": ["because", "as", "since", "A, B, C are correct"], "answer": 3, "explanation": "\"because\", \"as\", \"since\" đều có nghĩa \"bởi vì\" và đều dùng được ở đây.", "vi": null, "ipas": null, "vis": ["bởi vì (đúng nhưng chưa đủ)", "vì, bởi (đúng nhưng chưa đủ)", "vì, bởi (đúng nhưng chưa đủ)", "cả A, B, C đều đúng (đúng nhất)"], "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "11. He isn't going to the concert………….the tickets are too expensive.", "options": ["Though", "in spite of", "because", "because of"], "answer": 2, "explanation": "Sau chỗ trống là một MỆNH ĐỀ (S+V: \"the tickets are too expensive\") → dùng \"because\".", "vi": null, "ipas": null, "vis": ["mặc dù (sai — cần mệnh đề đối lập, ở đây là nguyên nhân)", "mặc dù (sai — đi với cụm danh từ, không phải mệnh đề)", "bởi vì (đúng — đi với mệnh đề)", "bởi vì (sai — đi với cụm danh từ, không phải mệnh đề)"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. No one in the volunteer group is ______Jack is.", "options": ["more active as", "as active than", "more active", "so active as"], "answer": 3, "explanation": "Cấu trúc so sánh bằng ở thể phủ định: not... so/as + adj + as.", "vi": null, "ipas": null, "vis": ["sai cấu trúc (trộn lẫn 2 dạng)", "sai cấu trúc (trộn lẫn 2 dạng)", "thiếu \"as\" nên chưa hoàn chỉnh so sánh bằng", "tích cực bằng (đúng — so sánh bằng)"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. There is nothing _____________ than going swimming in hot weather.", "options": ["gooder", "good", "better", "more goodly"], "answer": 2, "explanation": "So sánh hơn bất quy tắc của \"good\" là \"better\".", "vi": null, "ipas": null, "vis": ["sai — không tồn tại dạng này", "tốt (nguyên thể, sai vì cần so sánh hơn)", "tốt hơn (đúng)", "sai — không tồn tại dạng này"], "image": null}, {"id": "MCQ14", "type": "mcq", "q": "14. Lam is very sensitive, _________you shouldn't comment on his new shoes.", "options": ["but", "therefore", "however", "so"], "answer": 3, "explanation": "Mệnh đề sau chỉ KẾT QUẢ (vì nhạy cảm nên đừng bình luận) → so.", "vi": null, "ipas": null, "vis": ["nhưng (sai quan hệ)", "do đó (sai vị trí — cần dấu ; trước \"therefore\", ở đây chỉ có dấu phẩy)", "tuy nhiên (sai quan hệ)", "vì vậy (đúng)"], "image": null}, {"id": "MCQ15", "type": "mcq", "q": "15. Mr Buong likes showing off his new things;_________, he often posts pictures on social media.", "options": ["because", "therefore", "although", "but"], "answer": 1, "explanation": "Đứng sau dấu chấm phẩy, chỉ KẾT QUẢ (thích khoe nên hay đăng ảnh) → therefore.", "vi": null, "ipas": null, "vis": ["bởi vì (sai — cần mệnh đề, đây là 2 câu độc lập)", "do đó (đúng)", "mặc dù (sai quan hệ)", "nhưng (sai quan hệ)"], "image": null}, {"id": "MCQ16", "type": "mcq", "q": "16. Nowadays, many people like to spend their free time ________ the Internet.", "options": ["surfing", "surf", "are surfing", "to surf"], "answer": 0, "explanation": "Cấu trúc: spend time + V-ing.", "vi": null, "ipas": null, "vis": ["lướt (V-ing, đúng)", "lướt (nguyên mẫu, sai)", "đang lướt (sai cấu trúc)", "lướt (to-V, sai)"], "image": null}, {"id": "MCQ17", "type": "mcq", "q": "17. Ba wanted ________ with his family on a day trip to his home village.", "options": ["to join", "join", "joining", "will join"], "answer": 0, "explanation": "Cấu trúc: want + to V.", "vi": null, "ipas": null, "vis": ["tham gia (to-V, đúng)", "tham gia (nguyên mẫu, sai)", "tham gia (V-ing, sai)", "sẽ tham gia (sai)"], "image": null}, {"id": "MCQ18", "type": "mcq", "q": "18. Every road user ________ obey traffic rules strictly to prevent accidents.", "options": ["ought", "must", "could", "may"], "answer": 1, "explanation": "\"must\" diễn tả sự bắt buộc phải tuân thủ luật lệ giao thông.", "vi": null, "ipas": null, "vis": ["nên (thiếu \"to\" sau ought, sai cấu trúc)", "phải (đúng — bắt buộc)", "có thể (sai nghĩa — chỉ khả năng)", "có thể (sai nghĩa — chỉ sự cho phép)"], "image": null}, {"id": "MCQ19", "type": "mcq", "q": "19. Listening to folk songs ________ me a great pleasure and I feel very stressed.", "options": ["give", "are giving", "gave", "gives"], "answer": 3, "explanation": "Chủ ngữ là danh động từ \"Listening\" (số ít) → động từ chia số ít: gives.", "vi": null, "ipas": null, "vis": ["cho (thiếu -s, sai)", "đang cho (sai thì)", "đã cho (sai thì)", "cho (đúng — chia đúng ngôi số ít)"], "image": null}, {"id": "MCQ20", "type": "mcq", "q": "20. My principal is always ________ first person to arrive at the school every morning.", "options": ["a", "an", "the", "Ø (no article)"], "answer": 2, "explanation": "Dùng mạo từ \"the\" trước số thứ tự/tính từ so sánh nhất (the first).", "vi": null, "ipas": null, "vis": ["một (sai — không dùng \"a\" trước số thứ tự)", "một (sai — không dùng \"an\" trước phụ âm)", "(đúng — mạo từ xác định trước \"first\")", "không mạo từ (sai — cần \"the\")"], "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "1. The women actively ___________________ in the creation of the artwork. (PARTICIPATE)", "answer": "participated", "explanation": "Cần ĐỘNG TỪ chia thì quá khứ (câu kể lại một việc đã xảy ra) → participated.", "vi": "Những người phụ nữ đã tích cực tham gia vào việc tạo ra tác phẩm nghệ thuật."}, {"id": "WF2", "type": "fill", "q": "2. We were very pleased with the high level of ________________ in the charity events. (PARTICIPATE)", "answer": "participation", "explanation": "Sau \"level of\" cần DANH TỪ → participation (sự tham gia).", "vi": "Chúng tôi rất hài lòng với mức độ tham gia cao trong các sự kiện từ thiện."}, {"id": "WF3", "type": "fill", "q": "3. The games is an international sporting event with more than three thousand ____________. (PARTICIPATE)", "answer": "participants", "explanation": "Sau số đếm \"three thousand\" cần DANH TỪ SỐ NHIỀU chỉ người → participants.", "vi": "Giải đấu là sự kiện thể thao quốc tế với hơn ba nghìn người tham dự."}, {"id": "WF4", "type": "fill", "q": "4. The interview showed her as a self-assured and ___________________ student. (MATURITY)", "answer": "mature", "explanation": "Bổ nghĩa cho \"student\", song song với tính từ \"self-assured\" → cần TÍNH TỪ → mature.", "vi": "Buổi phỏng vấn cho thấy cô ấy là một học sinh tự tin và chín chắn."}, {"id": "WF5", "type": "fill", "q": "5. It's time for him to match his _________ with his golf and realise he's not going to win every time. (MATURE)", "answer": "maturity", "explanation": "Sau tính từ sở hữu \"his\" cần DANH TỪ → maturity (sự trưởng thành).", "vi": "Đã đến lúc anh ấy cần trưởng thành hơn trong môn golf và nhận ra mình không thể thắng mọi lúc."}, {"id": "WF6", "type": "fill", "q": "6. When _____________, we release cortisone into the body, and this increases the appetite. (STRESS)", "answer": "stressed", "explanation": "Chỉ trạng thái con người bị căng thẳng → TÍNH TỪ đuôi -ed → stressed.", "vi": "Khi bị căng thẳng, cơ thể chúng ta tiết ra cortisone, làm tăng cảm giác thèm ăn."}, {"id": "WF7", "type": "fill", "q": "7. She's very good at coping in ___________________ situations. (STRESS)", "answer": "stressful", "explanation": "Bổ nghĩa cho danh từ \"situations\" (tình huống gây ra căng thẳng) → stressful.", "vi": "Cô ấy rất giỏi ứng phó trong những tình huống căng thẳng."}, {"id": "WF8", "type": "fill", "q": "8. There was a general air of ___________________ in the crowd. (EXPECT)", "answer": "expectation", "explanation": "Sau giới từ \"of\" cần DANH TỪ → expectation (sự mong chờ).", "vi": "Có một bầu không khí mong chờ chung trong đám đông."}, {"id": "WF9", "type": "fill", "q": "9. The article was written before the election resulted in the clear ___________________ of a Labour victory. (EXPECT)", "answer": "expectation", "explanation": "Sau tính từ \"clear\" cần DANH TỪ → expectation.", "vi": "Bài báo được viết trước khi cuộc bầu cử dẫn đến sự kì vọng rõ ràng về chiến thắng của Đảng Lao động."}, {"id": "WF10", "type": "fill", "q": "10. He looked ___________________ at Sarah, but she didn't speak. (EXPECT)", "answer": "expectantly", "explanation": "Bổ nghĩa cho động từ \"looked\" cần TRẠNG TỪ → expectantly (nhìn một cách mong đợi).", "vi": "Anh ấy nhìn Sarah một cách đầy mong đợi, nhưng cô ấy không nói gì."}]}, {"key": "readingA", "title": "A) Social networking", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["excited", "unpopular", "popular", "interesting"], "answer": 2, "explanation": "\"popular\" hợp nghĩa với bối cảnh mạng xã hội ngày càng phổ biến.", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["enable", "connects", "connecting", "cannot"], "answer": 0, "explanation": "Cấu trúc \"enable sb to do sth\" = cho phép ai làm gì.", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["at", "for", "in", "on"], "answer": 0, "explanation": "Cụm từ \"look at\" = nhìn vào, xem xét.", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["is", "are", "isn't", "aren't"], "answer": 1, "explanation": "\"several advantages\" là danh từ số nhiều → dùng \"are\".", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["because", "Although", "If", "While"], "answer": 2, "explanation": "Câu điều kiện loại 1: \"If social media is not used responsibly, it can...\".", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["harmless", "better", "benefits", "harmful"], "answer": 3, "explanation": "Dùng quá mức (excessively) sẽ gây hại (harmful).", "vi": null}], "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"key": "readingB", "title": "B) Getting around Singapore", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["by", "in", "at", "on"], "answer": 0, "explanation": "Cụm \"by taxi\" = bằng xe taxi.", "vi": null}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["quick", "quickly", "quicker", "quickest"], "answer": 1, "explanation": "Động từ \"drive\" cần trạng từ \"quickly\" bổ nghĩa.", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["at", "on", "for", "in"], "answer": 1, "explanation": "Dùng giới từ \"on\" trước thứ trong tuần.", "vi": null}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["so", "like", "than", "as"], "answer": 2, "explanation": "Cấu trúc so sánh hơn \"quicker than\".", "vi": null}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["who", "what", "when", "how"], "answer": 3, "explanation": "\"how to get to them\" = làm thế nào để đi đến đó.", "vi": null}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["Therefore", "so", "Although", "However"], "answer": 0, "explanation": "\"Therefore\" (vì thế) chỉ kết quả của việc có bản đồ tốt.", "vi": null}], "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"key": "tfA", "title": "C) Mandi's story", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "1. Mandi met Tom at a disco three months ago.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Three months ago, I went to a disco where I met a boy called Tom.\" → Đúng.", "vi": null}, {"id": "TFA2", "type": "mcq", "q": "2. Mandi told Tom that she was thirteen years old.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: Mandi thực ra 13 tuổi nhưng nói dối Tom là 16 tuổi (\"I told him I was 16\") → Sai.", "vi": null}, {"id": "TFA3", "type": "mcq", "q": "3. Mandi has to lie to her parents when she goes out with Tom.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"I've had to lie to my parents about where I'm going and who with\" → Đúng.", "vi": null}, {"id": "TFA4", "type": "mcq", "q": "4. Mandi is asking for advice because she is worried about her situation.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"I'm really worried... I need some advice now.\" → Đúng.", "vi": null}, {"id": "TFA5", "type": "mcq", "q": "5. Why has Mandi written this?", "options": ["to describe her boyfriend", "to explain a problem", "to defend her actions", "to prove how clever she is"], "answer": 1, "explanation": "Mandi viết thư để kể về rắc rối của mình và xin lời khuyên.", "vi": null}, {"id": "TFA6", "type": "mcq", "q": "6. Who is she writing to?", "options": ["her parents", "a teenage magazine", "her boyfriend", "a school friend"], "answer": 1, "explanation": "Cuối bài ghi rõ: \"From the helpline on the magazine for teens.\"", "vi": null}], "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"key": "tfB", "title": "D) Facebook and students", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFB1", "type": "mcq", "q": "1. Facebook had approximately 2.96 billion users in 2022.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"With approximately 2.96 billion users as of 2022...\" → Đúng.", "vi": null}, {"id": "TFB2", "type": "mcq", "q": "2. Students only use Facebook for entertainment purposes.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: học sinh dùng Facebook cho cả giải trí lẫn học tập (\"including entertainment or academic learning\") → Sai.", "vi": null}, {"id": "TFB3", "type": "mcq", "q": "3. Facebook allows students to connect with people who have similar interests.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"they can easily connect with those who have the same interests...\" → Đúng.", "vi": null}, {"id": "TFB4", "type": "mcq", "q": "4. Students cannot use Facebook Messenger to prepare for presentations or do assignments together.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nói ngược lại: rất tiện lợi để chuẩn bị thuyết trình và làm bài tập cùng nhau qua Messenger → Sai.", "vi": null}, {"id": "TFB5", "type": "mcq", "q": "5. What does the word \"it\" in line 4 mean?", "options": ["Facebook", "Entertainment", "School life", "The student"], "answer": 0, "explanation": "\"it\" thay thế cho danh từ chỉ nền tảng Facebook được nhắc ở câu trước.", "vi": null}, {"id": "TFB6", "type": "mcq", "q": "6. According to the passage, where can students find like-minded ones?", "options": ["Facebook Messenger", "Facebook comments", "Facebook pages", "Facebook wall"], "answer": 2, "explanation": "Bài đọc: \"...through various Facebook pages where they enjoy reading top comments...\".", "vi": null}], "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"key": "transform0", "title": "Sentence Transformation", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "Jack has a new laptop; however, he never logs on his account on the Facebook.", "starter": "Although", "answer": "Jack has a new laptop, he never logs on his account on Facebook", "accepted": null, "explanation": "S1; however, S2 → Although S1, S2 — nối 2 ý đối lập bằng \"although\" thay vì \"however\".", "vi": "Mặc dù Jack có laptop mới, cậu ấy không bao giờ đăng nhập tài khoản Facebook.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"id": "TR2", "type": "sentence", "q": "Lan wants to study better, so she turns off her mobile phone.", "starter": "Because", "answer": "Lan wants to study better, she turns off her mobile phone", "accepted": null, "explanation": "S1, so S2 → Because S1, S2 (S2 là kết quả của việc S1).", "vi": "Vì Lan muốn học tốt hơn nên cô ấy tắt điện thoại.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"id": "TR3", "type": "sentence", "q": "Tuan is hard-working, so he often gets good marks on exams.", "starter": "Because", "answer": "Tuan is hard-working, he often gets good marks on exams", "accepted": null, "explanation": "S1, so S2 → Because S1, S2. (Lưu ý: câu gốc trong đề cương có lỗi đánh máy \"Tuan is hard\", đã sửa thành \"Tuan is hard-working\" cho đúng nghĩa và ngữ pháp.)", "vi": "Vì Tuấn chăm chỉ nên cậu ấy thường đạt điểm cao trong các kỳ thi.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"id": "TR4", "type": "sentence", "q": "Mono bought a lot of books, for he likes reading.", "starter": "Mono bought a lot of books", "answer": "because he likes reading", "accepted": null, "explanation": "S1, for S2 (lý do) → S1 because S2. \"for\" mang nghĩa \"vì\" trong văn viết trang trọng, chuyển thành \"because\" thông dụng hơn.", "vi": "Mono mua nhiều sách vì cậu ấy thích đọc.", "note": "S1, for S2 (lý do) → S1 because S2"}, {"id": "TR5", "type": "sentence", "q": "Quan is a club member; however he never participates in any activities.", "starter": "Although", "answer": "Quan is a club member, he never participates in any activities", "accepted": null, "explanation": "S1; however, S2 → Although S1, S2.", "vi": "Mặc dù Quân là thành viên câu lạc bộ, cậu ấy không bao giờ tham gia hoạt động nào.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"id": "TR6", "type": "sentence", "q": "Phong didn't study hard, so he didn't pass the entrance exam.", "starter": "Because", "answer": "Phong didn't study hard, he didn't pass the entrance exam", "accepted": null, "explanation": "S1, so S2 → Because S1, S2.", "vi": "Bởi vì Phong không học chăm, cậu ấy đã trượt kỳ thi tuyển sinh.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"id": "TR7", "type": "sentence", "q": "He has a smart phone, but he never logs on his account on Facebook.", "starter": "Although", "answer": "he has a smart phone, he never logs on his account on Facebook", "accepted": null, "explanation": "S1, but S2 → Although S1, S2.", "vi": "Mặc dù có điện thoại thông minh, cậu ấy không bao giờ đăng nhập Facebook.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"id": "TR8", "type": "sentence", "q": "She first disagreed to join our journey. She changed her mind later. (however)", "starter": "She first disagreed to join our journey;", "answer": "however, she changed her mind later", "accepted": null, "explanation": "Câu1. Câu2. (however) → Câu1; however, câu2. — trạng từ liên kết \"however\" đứng sau dấu chấm phẩy, trước dấu phẩy.", "vi": "Ban đầu cô ấy không đồng ý tham gia chuyến đi của chúng tôi; tuy nhiên, sau đó cô ấy đã đổi ý.", "note": "Câu1. Câu2. (+ liên từ gợi ý) → Câu1; liên từ, câu2."}, {"id": "TR9", "type": "sentence", "q": "I was ill yesterday. I could not come. (therefore)", "starter": "I was ill yesterday;", "answer": "therefore, I could not come", "accepted": null, "explanation": "Câu1. Câu2. (therefore) → Câu1; therefore, câu2. — \"therefore\" chỉ kết quả.", "vi": "Hôm qua tôi bị ốm; do đó, tôi không thể đến.", "note": "Câu1. Câu2. (+ liên từ gợi ý) → Câu1; liên từ, câu2."}, {"id": "TR10", "type": "sentence", "q": "We will have five days off this holiday. It is preceded by a couple of weekends. (moreover)", "starter": "We will have five days off this holiday;", "answer": "moreover, it is preceded by a couple of weekends", "accepted": null, "explanation": "Câu1. Câu2. (moreover) → Câu1; moreover, câu2. — \"moreover\" bổ sung thêm thông tin.", "vi": "Chúng ta sẽ được nghỉ 5 ngày dịp này; hơn thế nữa, kỳ nghỉ còn được nối liền với 2 cuối tuần.", "note": "Câu1. Câu2. (+ liên từ gợi ý) → Câu1; liên từ, câu2."}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"pressure\"] A. There is ______________ from the public for the government to lower taxes this year.", "answer": "growing pressure", "explanation": "Dựa vào ví dụ: growing pressure.", "vi": "Có áp lực ngày càng tăng từ công chúng đòi chính phủ giảm thuế năm nay."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"pressure\"] B. The manager had to change his mind because he was ______________ from the team.", "answer": "under pressure", "explanation": "Dựa vào ví dụ: under pressure.", "vi": "Người quản lý phải đổi ý vì chịu áp lực từ đội nhóm."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"bully\"] A. With the rise of smartphones, it has become easier for teenagers to _______________________, which causes severe mental health issues.", "answer": "cyberbully younger students", "explanation": "Dựa vào ví dụ: cyberbully younger students.", "vi": "Với sự phổ biến của điện thoại thông minh, việc bắt nạt qua mạng các học sinh nhỏ tuổi hơn trở nên dễ dàng hơn, gây ra các vấn đề tâm lý nghiêm trọng."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"bully\"] B. The school has a strict rule against students who try to _______________________ during break time.", "answer": "bully", "explanation": "Điền động từ \"bully\" (bắt nạt) theo đúng nghĩa từ điển.", "vi": "Nhà trường có quy định nghiêm ngặt đối với học sinh cố tình bắt nạt bạn khác trong giờ ra chơi."}]}, {"key": "pictures", "title": "Pictures & Signs", "emoji": "🚦", "vi": "Biển báo", "items": [{"id": "PIC1", "type": "mcq", "q": "15. What does this sign tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫⛏️🌳</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">TREE PLANTING ZONE — DO NOT DIG</p></div>", "options": ["You must use heavy machinery to remove trees.", "You should not cut down any big plants here.", "You should plant new green trees in this area.", "You should not dig up the ground in this area."], "answer": 3, "explanation": "Biển báo \"Tree planting zone — Do not dig\" (khu vực trồng cây — không được đào xới).", "vi": null}, {"id": "PIC2", "type": "mcq", "q": "16. What does this notification from the school library mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫💻🔇</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">NO COMPUTERS — SILENT STUDY AREA</p></div>", "options": ["You can return or check out reference books.", "You are allowed to talk quietly with your peers.", "You cannot use the computer devices at this time.", "You can read newspapers loudly with your friends."], "answer": 2, "explanation": "Biển \"No computers — Silent study area\" → không dùng máy tính trong khu vực học im lặng.", "vi": null}, {"id": "PIC3", "type": "mcq", "q": "17. What does this sign tell you?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-rose-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫😡💬</div><p class=\"text-[11px] font-black text-center text-rose-700 leading-tight\">BE KIND — NO BULLYING ON THIS FORUM</p></div>", "options": ["Teenagers should use nice words and avoid bullying on the forum.", "You must share your personal account with other people.", "You are allowed to fight online.", "Only school pupils can see this notice."], "answer": 0, "explanation": "Biển báo yêu cầu trên diễn đàn cần tử tế, không bạo lực/bắt nạt.", "vi": null}, {"id": "PIC4", "type": "mcq", "q": "18. What does this notice mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔧📚🚪</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">LIBRARY CLOSED JUNE 7 — REPAIR WORK</p></div>", "options": ["The library will permanently shut down from June.", "Students cannot enter the library on June 7 due to repair work.", "The library will be open normally on June 7.", "You can return books late without paying any fee."], "answer": 1, "explanation": "Biển báo thông báo thư viện đóng cửa để bảo trì vào ngày 7/6.", "vi": null}]}], "total": 92, "examPapers": [[{"id": "WF1", "type": "fill", "q": "1. The women actively ___________________ in the creation of the artwork. (PARTICIPATE)", "answer": "participated", "explanation": "Cần ĐỘNG TỪ chia thì quá khứ (câu kể lại một việc đã xảy ra) → participated.", "vi": "Những người phụ nữ đã tích cực tham gia vào việc tạo ra tác phẩm nghệ thuật."}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["at", "on", "for", "in"], "answer": 1, "explanation": "Dùng giới từ \"on\" trước thứ trong tuần.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "TFA5", "type": "mcq", "q": "5. Why has Mandi written this?", "options": ["to describe her boyfriend", "to explain a problem", "to defend her actions", "to prove how clever she is"], "answer": 1, "explanation": "Mandi viết thư để kể về rắc rối của mình và xin lời khuyên.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "MCQ16", "type": "mcq", "q": "16. Nowadays, many people like to spend their free time ________ the Internet.", "options": ["surfing", "surf", "are surfing", "to surf"], "answer": 0, "explanation": "Cấu trúc: spend time + V-ing.", "vi": null, "ipas": null, "vis": ["lướt (V-ing, đúng)", "lướt (nguyên mẫu, sai)", "đang lướt (sai cấu trúc)", "lướt (to-V, sai)"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "3. Find the word which has a different sound in the part underlined.", "options": ["oil", "boil", "poor", "toy"], "answer": 2, "explanation": "\"poor\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/ɔɪl/", "/bɔɪl/", "/pʊər/", "/tɔɪ/"], "vis": ["dầu", "luộc, sôi", "nghèo", "đồ chơi"], "image": null}, {"id": "STR9", "type": "mcq", "q": "9. Choose the word whose stress is not the same as that of the other three.", "options": ["communicate", "disappointed", "preparation", "adolescence"], "answer": 0, "explanation": "\"communicate\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/kəˈmjuːnɪkeɪt/", "/ˌdɪsəˈpɔɪntɪd/", "/ˌprepəˈreɪʃn/", "/ˌædəˈlesns/"], "vis": ["giao tiếp", "thất vọng", "sự chuẩn bị", "tuổi vị thành niên"], "image": null}, {"id": "MCQ5", "type": "mcq", "q": "5. Lan ______ with some friends, so she can't concentrate on the lesson now.", "options": ["is chatting", "chatted", "chatting", "will chat"], "answer": 0, "explanation": "Sự việc đang diễn ra ngay lúc nói (\"now\") → thì hiện tại tiếp diễn: is chatting.", "vi": null, "ipas": null, "vis": ["đang nhắn tin (đúng)", "đã nhắn tin (quá khứ, sai thì)", "nhắn tin (V-ing, thiếu trợ động từ, sai)", "sẽ nhắn tin (tương lai, sai)"], "image": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["because", "Although", "If", "While"], "answer": 2, "explanation": "Câu điều kiện loại 1: \"If social media is not used responsibly, it can...\".", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "TFB2", "type": "mcq", "q": "2. Students only use Facebook for entertainment purposes.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: học sinh dùng Facebook cho cả giải trí lẫn học tập (\"including entertainment or academic learning\") → Sai.", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "STR1", "type": "mcq", "q": "1. Choose the word whose stress is not the same as that of the other three.", "options": ["worried", "cognitive", "concentrate", "frustrated"], "answer": 3, "explanation": "\"frustrated\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈwʌrid/", "/ˈkɒɡnətɪv/", "/ˈkɒnsntreɪt/", "/frʌˈstreɪtɪd/"], "vis": ["lo lắng", "thuộc nhận thức", "tập trung", "thất vọng, bực bội"], "image": null}, {"id": "MCQ6", "type": "mcq", "q": "6. She wanted to prepare for the exam; ______, she turned off her mobile phone.", "options": ["so", "but", "however", "therefore"], "answer": 3, "explanation": "Đứng sau dấu chấm phẩy, trước dấu phẩy, chỉ KẾT QUẢ → therefore (trạng từ liên kết).", "vi": null, "ipas": null, "vis": ["vì vậy (sai vị trí ngữ pháp — \"so\" không đứng sau dấu ;)", "nhưng (sai quan hệ — không đối lập)", "tuy nhiên (sai quan hệ — không đối lập)", "do đó (đúng)"], "image": null}, {"id": "MCQ17", "type": "mcq", "q": "17. Ba wanted ________ with his family on a day trip to his home village.", "options": ["to join", "join", "joining", "will join"], "answer": 0, "explanation": "Cấu trúc: want + to V.", "vi": null, "ipas": null, "vis": ["tham gia (to-V, đúng)", "tham gia (nguyên mẫu, sai)", "tham gia (V-ing, sai)", "sẽ tham gia (sai)"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "3. Facebook allows students to connect with people who have similar interests.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"they can easily connect with those who have the same interests...\" → Đúng.", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "MCQ1", "type": "mcq", "q": "1. Mono wants to become a singer; _________, he can't sing or play any instruments.", "options": ["therefore", "however", "because", "although"], "answer": 1, "explanation": "Hai mệnh đề mang ý đối lập (muốn thành ca sĩ nhưng không hát/chơi nhạc cụ được) → however.", "vi": null, "ipas": null, "vis": ["vì vậy (sai — không phải quan hệ kết quả)", "tuy nhiên (đúng)", "bởi vì (sai — cần mệnh đề, không đứng giữa 2 câu độc lập kiểu này)", "mặc dù (sai — cần đứng đầu mệnh đề phụ)"], "image": null}, {"id": "PIC3", "type": "mcq", "q": "17. What does this sign tell you?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-rose-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫😡💬</div><p class=\"text-[11px] font-black text-center text-rose-700 leading-tight\">BE KIND — NO BULLYING ON THIS FORUM</p></div>", "options": ["Teenagers should use nice words and avoid bullying on the forum.", "You must share your personal account with other people.", "You are allowed to fight online.", "Only school pupils can see this notice."], "answer": 0, "explanation": "Biển báo yêu cầu trên diễn đàn cần tử tế, không bạo lực/bắt nạt.", "vi": null}, {"id": "PRON8", "type": "mcq", "q": "8. Find the word which has a different sound in the part underlined.", "options": ["concentrate", "self-aware", "stressed", "tense"], "answer": 0, "explanation": "Âm \"e\" trong \"concentrate\" phát âm /ə/, ba từ còn lại phát âm /e/.", "vi": null, "ipas": ["/ˈkɒnsntreɪt/", "/ˌself əˈweər/", "/strest/", "/tens/"], "vis": ["tập trung", "tự nhận thức", "bị căng thẳng", "căng thẳng (adj)"], "image": null}, {"id": "TR7", "type": "sentence", "q": "He has a smart phone, but he never logs on his account on Facebook.", "starter": "Although", "answer": "he has a smart phone, he never logs on his account on Facebook", "accepted": null, "explanation": "S1, but S2 → Although S1, S2.", "vi": "Mặc dù có điện thoại thông minh, cậu ấy không bao giờ đăng nhập Facebook.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"id": "MCQ12", "type": "mcq", "q": "12. No one in the volunteer group is ______Jack is.", "options": ["more active as", "as active than", "more active", "so active as"], "answer": 3, "explanation": "Cấu trúc so sánh bằng ở thể phủ định: not... so/as + adj + as.", "vi": null, "ipas": null, "vis": ["sai cấu trúc (trộn lẫn 2 dạng)", "sai cấu trúc (trộn lẫn 2 dạng)", "thiếu \"as\" nên chưa hoàn chỉnh so sánh bằng", "tích cực bằng (đúng — so sánh bằng)"], "image": null}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["enable", "connects", "connecting", "cannot"], "answer": 0, "explanation": "Cấu trúc \"enable sb to do sth\" = cho phép ai làm gì.", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["Therefore", "so", "Although", "However"], "answer": 0, "explanation": "\"Therefore\" (vì thế) chỉ kết quả của việc có bản đồ tốt.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "TR3", "type": "sentence", "q": "Tuan is hard-working, so he often gets good marks on exams.", "starter": "Because", "answer": "Tuan is hard-working, he often gets good marks on exams", "accepted": null, "explanation": "S1, so S2 → Because S1, S2. (Lưu ý: câu gốc trong đề cương có lỗi đánh máy \"Tuan is hard\", đã sửa thành \"Tuan is hard-working\" cho đúng nghĩa và ngữ pháp.)", "vi": "Vì Tuấn chăm chỉ nên cậu ấy thường đạt điểm cao trong các kỳ thi.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"id": "TR5", "type": "sentence", "q": "Quan is a club member; however he never participates in any activities.", "starter": "Although", "answer": "Quan is a club member, he never participates in any activities", "accepted": null, "explanation": "S1; however, S2 → Although S1, S2.", "vi": "Mặc dù Quân là thành viên câu lạc bộ, cậu ấy không bao giờ tham gia hoạt động nào.", "note": "S1, but/however S2 → Although S1, S2 (nối 2 ý đối lập thành 1 câu phức)"}, {"id": "WF9", "type": "fill", "q": "9. The article was written before the election resulted in the clear ___________________ of a Labour victory. (EXPECT)", "answer": "expectation", "explanation": "Sau tính từ \"clear\" cần DANH TỪ → expectation.", "vi": "Bài báo được viết trước khi cuộc bầu cử dẫn đến sự kì vọng rõ ràng về chiến thắng của Đảng Lao động."}, {"id": "STR7", "type": "mcq", "q": "7. Choose the word whose stress is not the same as that of the other three.", "options": ["delighted", "manage", "convince", "depress"], "answer": 1, "explanation": "\"manage\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/dɪˈlaɪtɪd/", "/ˈmænɪdʒ/", "/kənˈvɪns/", "/dɪˈpres/"], "vis": ["vui sướng", "quản lý", "thuyết phục", "làm chán nản"], "image": null}, {"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["by", "in", "at", "on"], "answer": 0, "explanation": "Cụm \"by taxi\" = bằng xe taxi.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "MCQ4", "type": "mcq", "q": "4. Nam often ________ to her Instagram account to chat with her sister in Ha Noi.", "options": ["logs on", "connects", "uploads", "checks"], "answer": 0, "explanation": "\"log on to\" = đăng nhập vào (tài khoản).", "vi": null, "ipas": null, "vis": ["đăng nhập (đúng)", "kết nối (sai — không đi với \"to account\" theo cách này)", "tải lên (sai nghĩa)", "kiểm tra (sai nghĩa)"], "image": null}, {"id": "PRON9", "type": "mcq", "q": "9. Find the word which has a different sound in the part underlined.", "options": ["embarrassed", "depressed", "helpline", "empathize"], "answer": 2, "explanation": "Âm \"e\" trong \"helpline\" phát âm /e/, các từ \"embarrassed, depressed\" phát âm /ɪ/.", "vi": null, "ipas": ["/ɪmˈbærəst/", "/dɪˈprest/", "/ˈhelplaɪn/", "/ˈempəθaɪz/"], "vis": ["xấu hổ", "chán nản", "đường dây trợ giúp", "đồng cảm"], "image": null}, {"id": "TFA2", "type": "mcq", "q": "2. Mandi told Tom that she was thirteen years old.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: Mandi thực ra 13 tuổi nhưng nói dối Tom là 16 tuổi (\"I told him I was 16\") → Sai.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "PIC4", "type": "mcq", "q": "18. What does this notice mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔧📚🚪</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">LIBRARY CLOSED JUNE 7 — REPAIR WORK</p></div>", "options": ["The library will permanently shut down from June.", "Students cannot enter the library on June 7 due to repair work.", "The library will be open normally on June 7.", "You can return books late without paying any fee."], "answer": 1, "explanation": "Biển báo thông báo thư viện đóng cửa để bảo trì vào ngày 7/6.", "vi": null}, {"id": "STR4", "type": "mcq", "q": "4. Choose the word whose stress is not the same as that of the other three.", "options": ["worried", "relaxed", "resolved", "aware"], "answer": 0, "explanation": "\"worried\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈwʌrid/", "/rɪˈlækst/", "/rɪˈzɒlvd/", "/əˈweər/"], "vis": ["lo lắng", "thư giãn", "đã giải quyết", "nhận thức được"], "image": null}, {"id": "WF2", "type": "fill", "q": "2. We were very pleased with the high level of ________________ in the charity events. (PARTICIPATE)", "answer": "participation", "explanation": "Sau \"level of\" cần DANH TỪ → participation (sự tham gia).", "vi": "Chúng tôi rất hài lòng với mức độ tham gia cao trong các sự kiện từ thiện."}, {"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"pressure\"] A. There is ______________ from the public for the government to lower taxes this year.", "answer": "growing pressure", "explanation": "Dựa vào ví dụ: growing pressure.", "vi": "Có áp lực ngày càng tăng từ công chúng đòi chính phủ giảm thuế năm nay."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"bully\"] B. The school has a strict rule against students who try to _______________________ during break time.", "answer": "bully", "explanation": "Điền động từ \"bully\" (bắt nạt) theo đúng nghĩa từ điển.", "vi": "Nhà trường có quy định nghiêm ngặt đối với học sinh cố tình bắt nạt bạn khác trong giờ ra chơi."}, {"id": "TFB1", "type": "mcq", "q": "1. Facebook had approximately 2.96 billion users in 2022.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"With approximately 2.96 billion users as of 2022...\" → Đúng.", "vi": null, "passage": "With approximately 2.96 billion users as of 2022, Facebook is undoubtedly one of the favoured social networking sites in the globe. As for students, they use Facebook for different purposes, including entertainment or academic learning. First, it is a relaxing channel where students comfortably tend to vent their negative thoughts on their school life via a status, share unforgettable memories, or watch multiple funny clips to relieve stress. Additionally, they can easily connect with those who have the same interests through various Facebook pages where they enjoy reading top comments or discussing hot topics with each other. Second, Facebook, regarded as the biggest knowledge platform, enables learners to get access to an array of free learning materials and even ask for specialised knowledge from other friendly users. Besides, it's very convenient for students to create a Facebook group chat on Facebook Messenger to upload and share lectures, prepare for class presentations as well as do assignments together. In short, Facebook can contribute to students' academic achievements if they take full advantage of it in an appropriate way."}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["at", "for", "in", "on"], "answer": 0, "explanation": "Cụm từ \"look at\" = nhìn vào, xem xét.", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "PRON1", "type": "mcq", "q": "1. Find the word which has a different sound in the part underlined.", "options": ["boy", "coin", "foil", "assure"], "answer": 3, "explanation": "\"assure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/bɔɪ/", "/kɔɪn/", "/fɔɪl/", "/əˈʃʊər/"], "vis": ["con trai", "đồng xu", "giấy bạc", "đảm bảo"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. Mr. Quang used the facebook _______10 p.m last night.", "options": ["on", "in", "at", "for"], "answer": 2, "explanation": "Dùng giới từ \"at\" trước mốc giờ cụ thể.", "vi": null, "ipas": null, "vis": ["vào (dùng cho ngày/thứ, sai)", "trong (sai)", "vào lúc (đúng — dùng cho giờ)", "trong khoảng (sai)"], "image": null}, {"id": "TFA4", "type": "mcq", "q": "4. Mandi is asking for advice because she is worried about her situation.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"I'm really worried... I need some advice now.\" → Đúng.", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "TR2", "type": "sentence", "q": "Lan wants to study better, so she turns off her mobile phone.", "starter": "Because", "answer": "Lan wants to study better, she turns off her mobile phone", "accepted": null, "explanation": "S1, so S2 → Because S1, S2 (S2 là kết quả của việc S1).", "vi": "Vì Lan muốn học tốt hơn nên cô ấy tắt điện thoại.", "note": "S1, so S2 → Because S1, S2 (S2 là kết quả của S1)"}, {"id": "WF10", "type": "fill", "q": "10. He looked ___________________ at Sarah, but she didn't speak. (EXPECT)", "answer": "expectantly", "explanation": "Bổ nghĩa cho động từ \"looked\" cần TRẠNG TỪ → expectantly (nhìn một cách mong đợi).", "vi": "Anh ấy nhìn Sarah một cách đầy mong đợi, nhưng cô ấy không nói gì."}], [{"id": "PIC2", "type": "mcq", "q": "16. What does this notification from the school library mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫💻🔇</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">NO COMPUTERS — SILENT STUDY AREA</p></div>", "options": ["You can return or check out reference books.", "You are allowed to talk quietly with your peers.", "You cannot use the computer devices at this time.", "You can read newspapers loudly with your friends."], "answer": 2, "explanation": "Biển \"No computers — Silent study area\" → không dùng máy tính trong khu vực học im lặng.", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["at", "for", "in", "on"], "answer": 0, "explanation": "Cụm từ \"look at\" = nhìn vào, xem xét.", "vi": null, "passage": "Social networking is a technology that is becoming more and more ___(1)___ these days because of how user-friendly it is. Social media websites like Facebook, Instagram, Twitter, and others ___(2)___ people to communicate with one another across distances. When we look ___(3)___ social media's positive aspects, there ___(4)___ several advantages. Despite these clear benefits, social networking is viewed as one of society's most damaging forces. ___(5)___ social media is not used responsibly, it can have detrimental effects on a person who is using it. In conclusion, social networking has both advantages and disadvantages. Social media is ___(6)___ when used excessively but useful if used productively."}, {"id": "MCQ5", "type": "mcq", "q": "5. Lan ______ with some friends, so she can't concentrate on the lesson now.", "options": ["is chatting", "chatted", "chatting", "will chat"], "answer": 0, "explanation": "Sự việc đang diễn ra ngay lúc nói (\"now\") → thì hiện tại tiếp diễn: is chatting.", "vi": null, "ipas": null, "vis": ["đang nhắn tin (đúng)", "đã nhắn tin (quá khứ, sai thì)", "nhắn tin (V-ing, thiếu trợ động từ, sai)", "sẽ nhắn tin (tương lai, sai)"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "4. Find the word which has a different sound in the part underlined.", "options": ["joy", "sure", "point", "destroy"], "answer": 1, "explanation": "\"sure\" phát âm /ʊə/, ba từ còn lại phát âm /ɔɪ/.", "vi": null, "ipas": ["/dʒɔɪ/", "/ʃʊər/", "/pɔɪnt/", "/dɪˈstrɔɪ/"], "vis": ["niềm vui", "chắc chắn", "điểm", "phá hủy"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "6. Find the word which has a different sound in the part underlined.", "options": ["advice", "decision", "delighted", "helpline"], "answer": 1, "explanation": "\"decision\" phát âm /ɪ/ (i ngắn), ba từ còn lại phát âm /aɪ/.", "vi": null, "ipas": ["/ədˈvaɪs/", "/dɪˈsɪʒn/", "/dɪˈlaɪtɪd/", "/ˈhelplaɪn/"], "vis": ["lời khuyên", "quyết định", "vui sướng", "đường dây trợ giúp"], "image": null}, {"id": "TR9", "type": "sentence", "q": "I was ill yesterday. I could not come. (therefore)", "starter": "I was ill yesterday;", "answer": "therefore, I could not come", "accepted": null, "explanation": "Câu1. Câu2. (therefore) → Câu1; therefore, câu2. — \"therefore\" chỉ kết quả.", "vi": "Hôm qua tôi bị ốm; do đó, tôi không thể đến.", "note": "Câu1. Câu2. (+ liên từ gợi ý) → Câu1; liên từ, câu2."}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["at", "on", "for", "in"], "answer": 1, "explanation": "Dùng giới từ \"on\" trước thứ trong tuần.", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "MCQ13", "type": "mcq", "q": "13. There is nothing _____________ than going swimming in hot weather.", "options": ["gooder", "good", "better", "more goodly"], "answer": 2, "explanation": "So sánh hơn bất quy tắc của \"good\" là \"better\".", "vi": null, "ipas": null, "vis": ["sai — không tồn tại dạng này", "tốt (nguyên thể, sai vì cần so sánh hơn)", "tốt hơn (đúng)", "sai — không tồn tại dạng này"], "image": null}, {"id": "WF4", "type": "fill", "q": "4. The interview showed her as a self-assured and ___________________ student. (MATURITY)", "answer": "mature", "explanation": "Bổ nghĩa cho \"student\", song song với tính từ \"self-assured\" → cần TÍNH TỪ → mature.", "vi": "Buổi phỏng vấn cho thấy cô ấy là một học sinh tự tin và chín chắn."}, {"id": "TFA6", "type": "mcq", "q": "6. Who is she writing to?", "options": ["her parents", "a teenage magazine", "her boyfriend", "a school friend"], "answer": 1, "explanation": "Cuối bài ghi rõ: \"From the helpline on the magazine for teens.\"", "vi": null, "passage": "My name's Mandi. Three months ago, I went to a disco where I met a boy called Tom. I guessed he was older than me, but I liked him and thought it didn't matter. We danced a couple of times, then we chatted. He said he was 18, then asked how old I was. I told him I was 16. I thought that if I told him my real age, he wouldn't want to know me, as I'm only 13. After the disco we arranged to meet the following weekend. The next Saturday we went for a hamburger and had a real laugh. Afterwards he walked me to my street and kissed me goodnight. Things went really well. We see each other a couple of times a week, but I've had to lie to my parents about where I'm going and who with. I've always got on with them, but I know if they found out how old Tom was, they'd stop me seeing him. Now I really don't know what to do. I can't go on lying to my parents every time I go out, and Tom keeps asking why he can't come around to my house. I'm really worried and I feel complicated. I need some advice now. \"From the helpline on the magazine for teens.\""}, {"id": "MCQ7", "type": "mcq", "q": "7. Mr Buong decided______a new laptop last week.", "options": ["buy", "bought", "buying", "to buy"], "answer": 3, "explanation": "Cấu trúc: decide + to V.", "vi": null, "ipas": null, "vis": ["mua (nguyên mẫu, sai)", "đã mua (sai)", "mua (V-ing, sai)", "mua (to-V, đúng)"], "image": null}, {"id": "PIC1", "type": "mcq", "q": "15. What does this sign tell you to do?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫⛏️🌳</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">TREE PLANTING ZONE — DO NOT DIG</p></div>", "options": ["You must use heavy machinery to remove trees.", "You should not cut down any big plants here.", "You should plant new green trees in this area.", "You should not dig up the ground in this area."], "answer": 3, "explanation": "Biển báo \"Tree planting zone — Do not dig\" (khu vực trồng cây — không được đào xới).", "vi": null}, {"id": "STR10", "type": "mcq", "q": "10. Choose the word whose stress is not the same as that of the other three.", "options": ["pressure", "decision", "friendship", "guidance"], "answer": 1, "explanation": "\"decision\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈpreʃər/", "/dɪˈsɪʒn/", "/ˈfrendʃɪp/", "/ˈɡaɪdns/"], "vis": ["áp lực", "quyết định", "tình bạn", "sự hướng dẫn"], "image": null}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["so", "like", "than", "as"], "answer": 2, "explanation": "Cấu trúc so sánh hơn \"quicker than\".", "vi": null, "passage": "When you are in Singapore, you can go about ___(1)___ taxi, by bus, or by underground. I myself prefer the underground because it is fast, easy and cheap. There are many buses and taxis in Singapore and one cannot drive along the road ___(2)___ and without many stops, especially ___(3)___ Monday morning. The underground is therefore usually quicker ___(4)___ taxis or buses. If you do not know Singapore very well, it is difficult to find the bus you want. You can take a taxi, but it is more expensive than the underground or a bus. On the underground, you find good maps that tell you the names of the stations and show you ___(5)___ to get to them. ___(6)___, it is easy to find your way."}, {"id": "WF2", "type": "fill", "q": "2. We were very pleased with the high level of ________________ in the charity events. (PARTICIPATE)", "answer": "participation", "explanation": "Sau \"level of\" cần DANH TỪ → participation (sự tham gia).", "vi": "Chúng tôi rất hài lòng với mức độ tham gia cao trong các sự kiện từ thiện."}, {"id": "PRON7", "type": "mcq", "q": "7. Find the word which has a different sound in the part underlined.", "options": ["study", "adulthood", "columnist", "frustrated"], "answer": 2, "explanation": "Âm \"u\" trong \"columnist\" phát âm /ə/, ba từ còn lại phát âm /ʌ/.", "vi": null, "ipas": ["/ˈstʌdi/", "/əˈdʌlthʊd/", "/ˈkɒləmnɪst/", "/frʌˈstreɪtɪd/"], "vis": ["học tập", "tuổi trưởng thành", "người viết chuyên mục", "thất vọng, bực bội"], "image": null}, {"id": "MCQ15", "type": "mcq", "q": "15. Mr Buong likes showing off his new things;_________, he often posts pictures on social media.", "options": ["because", "therefore", "although", "but"], "answer": 1, "explanation": "Đứng sau dấu chấm p
