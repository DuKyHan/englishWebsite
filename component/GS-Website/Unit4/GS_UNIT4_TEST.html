<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 4 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 4 · Ethnic Groups of Viet Nam</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["bulb", "plumber", "profitable", "label"], "answer": 1, "explanation": "Chữ \"b\" trong \"plumber\" là âm câm (không phát âm); ba từ còn lại phát âm /b/.", "vi": null, "ipas": ["/bʌlb/", "/ˈplʌmər/", "/ˈprɒfɪtəbl/", "/ˈleɪbl/"], "vis": ["bóng đèn", "thợ ống nước", "có lợi nhuận", "cái nhãn"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "2. Which word has the underlined part pronounced differently from that of the others?", "options": ["missed", "liked", "cleaned", "stopped"], "answer": 2, "explanation": "\"cleaned\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/mɪst/", "/laɪkt/", "/kliːnd/", "/stɒpt/"], "vis": ["đã nhớ", "đã thích", "đã dọn dẹp", "đã dừng"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["environment", "idea", "condition", "highland"], "answer": 2, "explanation": "\"condition\" có \"i\" phát âm /ɪ/, ba từ còn lại phát âm /aɪ/.", "vi": null, "ipas": ["/ɪnˈvaɪrənmənt/", "/aɪˈdiːə/", "/kənˈdɪʃn/", "/ˈhaɪlənd/"], "vis": ["môi trường", "ý tưởng", "điều kiện", "vùng cao"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "4. Which word has the underlined part pronounced differently from that of the others?", "options": ["brochure", "change", "machine", "champagne"], "answer": 1, "explanation": "\"change\" có \"ch\" phát âm /tʃ/, ba từ còn lại phát âm /ʃ/.", "vi": null, "ipas": ["/broʊˈʃʊr/", "/tʃeɪndʒ/", "/məˈʃiːn/", "/ʃæmˈpeɪn/"], "vis": ["tờ rơi, sách quảng cáo", "thay đổi", "máy móc", "rượu sâm-panh"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "5. Which word has the underlined part pronounced differently from that of the others?", "options": ["tests", "neighbors", "cooks", "roofs"], "answer": 1, "explanation": "\"neighbors\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/.", "vi": null, "ipas": ["/tests/", "/ˈneɪbərz/", "/kʊks/", "/ruːfs/"], "vis": ["các bài kiểm tra", "hàng xóm", "đầu bếp (số nhiều)", "mái nhà (số nhiều)"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "6. Which word has the underlined part pronounced differently from that of the others?", "options": ["rulers", "crops", "flutes", "posts"], "answer": 0, "explanation": "\"rulers\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/.", "vi": null, "ipas": ["/ˈruːlərz/", "/krɒps/", "/fluːts/", "/poʊsts/"], "vis": ["người cai trị (số nhiều)", "vụ mùa (số nhiều)", "cái sáo (số nhiều)", "cột (số nhiều)"], "image": null}, {"id": "PRON7", "type": "mcq", "q": "7. Which word has the underlined part pronounced differently from that of the others?", "options": ["flute", "feature", "costume", "livestock"], "answer": 1, "explanation": "\"feature\" có \"t\" phát âm /tʃ/, ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/fluːt/", "/ˈfiːtʃər/", "/ˈkɒstjuːm/", "/ˈlaɪvstɒk/"], "vis": ["cái sáo", "nét, đặc điểm", "trang phục", "gia súc"], "image": null}, {"id": "PRON8", "type": "mcq", "q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["knew", "flew", "grew", "drew"], "answer": 0, "explanation": "\"knew\" có \"ew\" phát âm /njuː/, ba từ còn lại phát âm /uː/.", "vi": null, "ipas": ["/njuː/", "/fluː/", "/ɡruː/", "/druː/"], "vis": ["đã biết", "đã bay", "đã lớn lên", "đã vẽ"], "image": null}, {"id": "PRON9", "type": "mcq", "q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["hear", "dear", "heart", "near"], "answer": 2, "explanation": "\"heart\" có \"ear\" phát âm /ɑːr/, ba từ còn lại phát âm /ɪr/.", "vi": null, "ipas": ["/hɪr/", "/dɪr/", "/hɑːrt/", "/nɪr/"], "vis": ["nghe", "thân yêu", "trái tim", "gần"], "image": null}, {"id": "PRON10", "type": "mcq", "q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["lived", "played", "promised", "cleaned"], "answer": 2, "explanation": "\"promised\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /d/.", "vi": null, "ipas": ["/lɪvd/", "/pleɪd/", "/ˈprɒmɪst/", "/kliːnd/"], "vis": ["đã sống", "đã chơi", "đã hứa", "đã dọn dẹp"], "image": null}]}, {"key": "stress0", "title": "Stressed syllable", "emoji": "🎯", "vi": "Trọng âm", "items": [{"id": "STR1", "type": "mcq", "q": "1. Which word has a different stress pattern from that of the others?", "options": ["invite", "computer", "minority", "highland"], "answer": 3, "explanation": "\"highland\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ɪnˈvaɪt/", "/kəmˈpjuːtər/", "/maɪˈnɒrəti/", "/ˈhaɪlənd/"], "vis": ["mời", "máy tính", "dân tộc thiểu số", "vùng cao"], "image": null}, {"id": "STR2", "type": "mcq", "q": "2. Which word has a different stress pattern from that of the others?", "options": ["wooden", "communal", "ethnic", "famous"], "answer": 1, "explanation": "\"communal\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈwʊdn/", "/kəˈmjuːnl/", "/ˈeθnɪk/", "/ˈfeɪməs/"], "vis": ["bằng gỗ", "chung, cộng đồng", "thuộc dân tộc", "nổi tiếng"], "image": null}, {"id": "STR3", "type": "mcq", "q": "3. Which word has a different stress pattern from that of the others?", "options": ["happen", "listen", "finish", "communal"], "answer": 3, "explanation": "\"communal\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhæpən/", "/ˈlɪsn/", "/ˈfɪnɪʃ/", "/kəˈmjuːnl/"], "vis": ["xảy ra", "lắng nghe", "hoàn thành", "chung, cộng đồng"], "image": null}, {"id": "STR4", "type": "mcq", "q": "4. Which word has a different stress pattern from that of the others?", "options": ["harvest", "arrange", "costume", "famous"], "answer": 1, "explanation": "\"arrange\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhɑːrvɪst/", "/əˈreɪndʒ/", "/ˈkɒstjuːm/", "/ˈfeɪməs/"], "vis": ["vụ mùa", "sắp xếp", "trang phục", "nổi tiếng"], "image": null}, {"id": "STR5", "type": "mcq", "q": "5. Which word has a different stress pattern from that of the others?", "options": ["gather", "statue", "ethnic", "unique"], "answer": 3, "explanation": "\"unique\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈɡæðər/", "/ˈstætʃuː/", "/ˈeθnɪk/", "/juˈniːk/"], "vis": ["thu thập, tụ họp", "tượng", "thuộc dân tộc", "độc đáo"], "image": null}, {"id": "STR6", "type": "mcq", "q": "6. Which word has a different stress pattern from that of the others?", "options": ["hunting", "custom", "feature", "overlook"], "answer": 3, "explanation": "\"overlook\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈhʌntɪŋ/", "/ˈkʌstəm/", "/ˈfiːtʃər/", "/ˌoʊvərˈlʊk/"], "vis": ["săn bắn", "phong tục", "nét, đặc điểm", "nhìn ra"], "image": null}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["invitation", "celebration", "tradition", "information"], "answer": 2, "explanation": "\"tradition\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/ˌɪnvɪˈteɪʃn/", "/ˌselɪˈbreɪʃn/", "/trəˈdɪʃn/", "/ˌɪnfərˈmeɪʃn/"], "vis": ["lời mời", "lễ kỷ niệm", "truyền thống", "thông tin"], "image": null}, {"id": "STR8", "type": "mcq", "q": "8. Which word has a different stress pattern from that of the others?", "options": ["custom", "invite", "greeting", "manner"], "answer": 1, "explanation": "\"invite\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkʌstəm/", "/ɪnˈvaɪt/", "/ˈɡriːtɪŋ/", "/ˈmænər/"], "vis": ["phong tục", "mời", "lời chào", "cách cư xử"], "image": null}, {"id": "STR9", "type": "mcq", "q": "9. Which word has a different stress pattern from that of the others?", "options": ["woman", "detest", "balloon", "police"], "answer": 0, "explanation": "\"woman\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈwʊmən/", "/dɪˈtest/", "/bəˈluːn/", "/pəˈliːs/"], "vis": ["người phụ nữ", "ghét", "bóng bay", "cảnh sát"], "image": null}, {"id": "STR10", "type": "mcq", "q": "10. Which word has a different stress pattern from that of the others?", "options": ["refuse", "enter", "deny", "delay"], "answer": 1, "explanation": "\"enter\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/rɪˈfjuːz/", "/ˈentər/", "/dɪˈnaɪ/", "/dɪˈleɪ/"], "vis": ["từ chối", "đi vào", "chối bỏ", "trì hoãn"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "1. ______ do you usually eat lunch? - At noon.", "options": ["Which", "When", "What", "How"], "answer": 1, "explanation": "Trả lời chỉ THỜI GIAN (At noon) → When.", "vi": null, "ipas": null, "vis": ["cái nào", "khi nào (đúng)", "cái gì", "như thế nào"], "image": null}, {"id": "MCQ2", "type": "mcq", "q": "2. ______ do you wash clothes? - Every week.", "options": ["Which", "Who", "What", "How often"], "answer": 3, "explanation": "Trả lời chỉ TẦN SUẤT (Every week) → How often.", "vi": null, "ipas": null, "vis": ["cái nào", "ai", "cái gì", "bao lâu một lần (đúng)"], "image": null}, {"id": "MCQ3", "type": "mcq", "q": "3. ______ does your father work? - At City Hall.", "options": ["Where", "Who", "What", "How"], "answer": 0, "explanation": "Trả lời chỉ NƠI CHỐN (At City Hall) → Where.", "vi": null, "ipas": null, "vis": ["ở đâu (đúng)", "ai", "cái gì", "như thế nào"], "image": null}, {"id": "MCQ4", "type": "mcq", "q": "4. ______ usually gets up the earliest in your family?", "options": ["Which", "Who", "What", "How"], "answer": 1, "explanation": "Hỏi về NGƯỜI làm chủ ngữ → Who.", "vi": null, "ipas": null, "vis": ["cái nào", "ai (đúng)", "cái gì", "như thế nào"], "image": null}, {"id": "MCQ5", "type": "mcq", "q": "5. ______ do you think of this hotel? - It's pretty good.", "options": ["Which", "Why", "What", "How"], "answer": 2, "explanation": "Cụm cố định \"What do you think of...?\" = bạn nghĩ gì về...?", "vi": null, "ipas": null, "vis": ["cái nào", "tại sao", "cái gì (đúng — What do you think of)", "như thế nào"], "image": null}, {"id": "MCQ6", "type": "mcq", "q": "6. ______ do you work at that company? - Because it's near my house.", "options": ["Which", "Who", "Why", "Which"], "answer": 2, "explanation": "Trả lời bắt đầu bằng \"Because\" (lý do) → Why.", "vi": null, "ipas": null, "vis": ["cái nào", "ai", "tại sao (đúng)", "cái nào"], "image": null}, {"id": "MCQ7", "type": "mcq", "q": "7. ______ dances the best in your family?", "options": ["Which", "Who", "What", "How"], "answer": 1, "explanation": "Hỏi về NGƯỜI làm chủ ngữ → Who.", "vi": null, "ipas": null, "vis": ["cái nào", "ai (đúng)", "cái gì", "như thế nào"], "image": null}, {"id": "MCQ8", "type": "mcq", "q": "8. ______ is it from the centre to the Museum of Ethnology? ~ It's about seven kilometers.", "options": ["How long", "How far", "How often", "How much"], "answer": 1, "explanation": "Trả lời chỉ KHOẢNG CÁCH (kilometers) → How far.", "vi": null, "ipas": null, "vis": ["bao lâu (thời gian)", "bao xa (đúng — khoảng cách)", "bao lâu một lần", "bao nhiêu (giá/lượng)"], "image": null}, {"id": "MCQ9", "type": "mcq", "q": "9. ______ can I buy some milk? - At the supermarket.", "options": ["Which", "Who", "Where", "How"], "answer": 2, "explanation": "Trả lời chỉ NƠI CHỐN (At the supermarket) → Where.", "vi": null, "ipas": null, "vis": ["cái nào", "ai", "ở đâu (đúng)", "như thế nào"], "image": null}, {"id": "MCQ10", "type": "mcq", "q": "10. ______ much do you weigh?", "options": ["Which", "Who", "What", "How"], "answer": 3, "explanation": "Cụm cố định \"How much do you weigh?\" = bạn nặng bao nhiêu?", "vi": null, "ipas": null, "vis": ["cái nào", "ai", "cái gì", "như thế nào (đúng — How much)"], "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "11. ______ hat is this? - It's my brother's.", "options": ["Which", "Whose", "What", "How"], "answer": 1, "explanation": "Trả lời chỉ SỞ HỮU (my brother's) → Whose.", "vi": null, "ipas": null, "vis": ["cái nào", "của ai (đúng)", "cái gì", "như thế nào"], "image": null}, {"id": "MCQ12", "type": "mcq", "q": "12. ______ do you like your tea? - I like it with cream and sugar.", "options": ["Which", "Who", "What", "How"], "answer": 3, "explanation": "Cụm cố định \"How do you like...?\" = bạn thích...như thế nào?", "vi": null, "ipas": null, "vis": ["cái nào", "ai", "cái gì", "như thế nào (đúng)"], "image": null}, {"id": "MCQ13", "type": "mcq", "q": "13. ______ picture do you prefer, this one or that one?", "options": ["Which", "Who", "What", "How"], "answer": 0, "explanation": "Hỏi CHỌN LỰA giữa các lựa chọn cụ thể (this one or that one) → Which.", "vi": null, "ipas": null, "vis": ["cái nào (đúng)", "ai", "cái gì", "như thế nào"], "image": null}, {"id": "MCQ14", "type": "mcq", "q": "14. ______ is that woman? - I think she is a teacher.", "options": ["Which", "Who", "When", "How"], "answer": 1, "explanation": "Hỏi về DANH TÍNH người → Who.", "vi": null, "ipas": null, "vis": ["cái nào", "ai (đúng)", "khi nào", "như thế nào"], "image": null}, {"id": "MCQ15", "type": "mcq", "q": "15. Do you know ______ language is spoken in Kenya?", "options": ["which", "who", "what", "how"], "answer": 0, "explanation": "Hỏi chọn lựa trong nhóm ngôn ngữ cụ thể → which (cũng có thể dùng what, đáp án chính là which).", "vi": null, "ipas": null, "vis": ["cái nào (đúng)", "ai", "cái gì", "như thế nào"], "image": null}, {"id": "MCQ16", "type": "mcq", "q": "16. My Son sanctuary has been recognized by UNESCO as a world _______.", "options": ["ethnic minorities", "open-air market", "heritage site", "terraced field"], "answer": 2, "explanation": "\"heritage site\" = di sản — hợp nghĩa với UNESCO công nhận.", "vi": null, "ipas": null, "vis": ["dân tộc thiểu số", "chợ ngoài trời", "di sản (đúng)", "ruộng bậc thang"], "image": null}, {"id": "MCQ17", "type": "mcq", "q": "17. If you go to Sapa, you can distinguish people from different ethnic groups by their _______.", "options": ["costumes", "livestock", "highlands", "staircases"], "answer": 0, "explanation": "\"costumes\" = trang phục — dùng để phân biệt các dân tộc.", "vi": null, "ipas": null, "vis": ["trang phục (đúng)", "gia súc", "vùng cao", "cầu thang"], "image": null}, {"id": "MCQ18", "type": "mcq", "q": "18. Xoe and Sap are _____ of Thai ethnic minority people.", "options": ["modern dances", "jazz dances", "lion dances", "folk dances"], "answer": 3, "explanation": "Xòe, Sạp là các điệu múa dân gian → folk dances.", "vi": null, "ipas": null, "vis": ["múa hiện đại", "múa jazz", "múa lân", "múa dân gian (đúng)"], "image": null}, {"id": "MCQ19", "type": "mcq", "q": "19. We spent hours in _______ house to talk with local people.", "options": ["terraced", "close", "communal", "awesome"], "answer": 2, "explanation": "\"communal house\" = nhà rông/nhà sinh hoạt cộng đồng.", "vi": null, "ipas": null, "vis": ["có bậc thang", "gần", "cộng đồng, chung (đúng)", "tuyệt vời"], "image": null}, {"id": "MCQ20", "type": "mcq", "q": "20. She wore a _______ costume of bright pink silk.", "options": ["peaceful", "ethnic", "musical", "traditional"], "answer": 3, "explanation": "\"traditional costume\" = trang phục truyền thống.", "vi": null, "ipas": null, "vis": ["yên bình", "thuộc dân tộc", "thuộc âm nhạc", "truyền thống (đúng)"], "image": null}]}, {"key": "mcq2", "title": "Vocabulary & Grammar (21-30)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ21", "type": "mcq", "q": "21. You can visit Gia Lai to enjoy the gong _______.", "options": ["special", "different", "communal", "festival"], "answer": 3, "explanation": "\"gong festival\" = lễ hội cồng chiêng.", "vi": null, "ipas": null, "vis": ["đặc biệt (sai từ loại)", "khác nhau", "cộng đồng", "lễ hội (đúng)"], "image": null}, {"id": "MCQ22", "type": "mcq", "q": "22. Some _______ farmers keep ducks and geese in their farms.", "options": ["feature", "post", "soil", "poultry"], "answer": 3, "explanation": "\"poultry\" = gia cầm (vịt, ngỗng...).", "vi": null, "ipas": null, "vis": ["đặc điểm", "cột", "đất trồng", "gia cầm (đúng)"], "image": null}, {"id": "MCQ23", "type": "mcq", "q": "23. We can _______ the sea from here.", "options": ["raise", "overlook", "enrich", "weave"], "answer": 1, "explanation": "\"overlook the sea\" = nhìn ra biển.", "vi": null, "ipas": null, "vis": ["chăn nuôi", "nhìn ra (đúng)", "làm giàu", "dệt, đan"], "image": null}, {"id": "MCQ24", "type": "mcq", "q": "24. Viet Nam has 54 ethnic _______.", "options": ["groups", "levels", "turkeys", "fields"], "answer": 0, "explanation": "\"ethnic groups\" = các nhóm/dân tộc.", "vi": null, "ipas": null, "vis": ["nhóm (đúng)", "cấp độ", "gà tây", "cánh đồng"], "image": null}, {"id": "MCQ25", "type": "mcq", "q": "25. The Nung mostly live in _______ though they also live in earthen houses.", "options": ["bamboo flute", "wooden statue", "stilt houses", "travel brochure"], "answer": 2, "explanation": "\"stilt houses\" = nhà sàn — nơi ở phổ biến của người Nùng.", "vi": null, "ipas": null, "vis": ["sáo tre", "tượng gỗ", "nhà sàn (đúng)", "tờ rơi du lịch"], "image": null}, {"id": "MCQ26", "type": "mcq", "q": "26. The Lunar New Year festival is important _____ the Kinh.", "options": ["to", "with", "for", "of"], "answer": 0, "explanation": "\"important to sb\" = quan trọng đối với ai.", "vi": null, "ipas": null, "vis": ["đối với (đúng)", "với", "cho", "của"], "image": null}, {"id": "MCQ27", "type": "mcq", "q": "27. Sa Pa is famous for the ______ located in the mountainous area.", "options": ["stilt houses", "heritage site", "terraced fields", "wooden statue"], "answer": 2, "explanation": "\"terraced fields\" = ruộng bậc thang — đặc trưng của Sa Pa.", "vi": null, "ipas": null, "vis": ["nhà sàn", "di sản", "ruộng bậc thang (đúng)", "tượng gỗ"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "28. Lahu, Mang, and Brau are ________ minorities in Viet Nam.", "options": ["traditional", "ethnic", "awesome", "natural"], "answer": 1, "explanation": "\"ethnic minorities\" = các dân tộc thiểu số.", "vi": null, "ipas": null, "vis": ["truyền thống", "dân tộc (đúng)", "tuyệt vời", "tự nhiên"], "image": null}, {"id": "MCQ29", "type": "mcq", "q": "29. The goods in the open-air market are _______. You can find almost everything there.", "options": ["diverse", "similar", "unlike", "like"], "answer": 0, "explanation": "\"diverse\" = đa dạng — hợp nghĩa với \"tìm thấy hầu như mọi thứ\".", "vi": null, "ipas": null, "vis": ["đa dạng (đúng)", "tương tự", "không giống", "giống"], "image": null}, {"id": "MCQ30", "type": "mcq", "q": "30. Most ethnic minority peoples are good _____ farming techniques.", "options": ["at", "for", "to", "on"], "answer": 0, "explanation": "\"be good at\" = giỏi về việc gì.", "vi": null, "ipas": null, "vis": ["giỏi về (đúng)", "cho", "đến", "trên"], "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "1. Vietnam is one of the most _____ diverse countries in South East Asia. (ETHNIC)", "answer": "ethnically", "explanation": "Bổ nghĩa cho tính từ \"diverse\" cần TRẠNG TỪ → ethnically.", "vi": "Việt Nam là một trong những quốc gia đa dạng về dân tộc nhất Đông Nam Á."}, {"id": "WF2", "type": "fill", "q": "2. The Pa Then believe that the god of fire brings them _______and prosperity. (PEACEFUL)", "answer": "peace", "explanation": "Song song với danh từ \"prosperity\" (sự thịnh vượng) → cần DANH TỪ → peace.", "vi": "Người Pà Thẻn tin rằng thần lửa mang lại cho họ hòa bình và sự thịnh vượng."}, {"id": "WF3", "type": "fill", "q": "3. The Tay community practice ________religious beliefs including ancestor worship. (TRADITION)", "answer": "traditional", "explanation": "Bổ nghĩa cho danh từ \"religious beliefs\" cần TÍNH TỪ → traditional.", "vi": "Cộng đồng người Tày thực hành các tín ngưỡng tôn giáo truyền thống bao gồm thờ cúng tổ tiên."}, {"id": "WF4", "type": "fill", "q": "4. The population of Vietnam contains a rich ______of ethnic groups. (DIVERSE)", "answer": "diversity", "explanation": "Sau tính từ \"rich\" cần DANH TỪ → diversity (sự đa dạng).", "vi": "Dân số Việt Nam có sự đa dạng phong phú về các nhóm dân tộc."}, {"id": "WF5", "type": "fill", "q": "5. Each time I returned I was struck by the ______ of Sapa and its people. (UNIQUE)", "answer": "uniqueness", "explanation": "Sau mạo từ \"the\" cần DANH TỪ → uniqueness (sự độc đáo).", "vi": "Mỗi lần trở lại, tôi đều ấn tượng bởi sự độc đáo của Sa Pa và con người nơi đây."}, {"id": "WF6", "type": "fill", "q": "6. Vietnam is a country of great cultural __________________ with 54 ethnic groups. (diverse)", "answer": "diversity", "explanation": "Sau tính từ \"cultural\" cần DANH TỪ → diversity.", "vi": "Việt Nam là một đất nước có sự đa dạng văn hóa lớn với 54 dân tộc."}, {"id": "WF7", "type": "fill", "q": "7. The museum collects and preserves many ___________ artifacts of ethnic cultures. (history)", "answer": "historical", "explanation": "Bổ nghĩa cho danh từ \"artifacts\" cần TÍNH TỪ → historical.", "vi": "Bảo tàng sưu tầm và lưu giữ nhiều hiện vật lịch sử của các nền văn hóa dân tộc."}, {"id": "WF8", "type": "fill", "q": "8. The Cham people once boasted a _____________ culture early in history. (flourish)", "answer": "flourishing", "explanation": "Bổ nghĩa cho danh từ \"culture\" cần TÍNH TỪ → flourishing (hưng thịnh).", "vi": "Người Chăm từng có một nền văn hóa hưng thịnh từ thời xa xưa."}, {"id": "WF9", "type": "fill", "q": "9. A number of ethnic minorities have _________ mastered farming techniques. (success)", "answer": "successfully", "explanation": "Bổ nghĩa cho động từ \"mastered\" cần TRẠNG TỪ → successfully.", "vi": "Nhiều dân tộc thiểu số đã thành công làm chủ các kỹ thuật canh tác."}, {"id": "WF10", "type": "fill", "q": "10. The exhibition of traditional costumes was _________________ beautiful. (impress)", "answer": "impressively", "explanation": "Bổ nghĩa cho tính từ \"beautiful\" cần TRẠNG TỪ → impressively.", "vi": "Buổi triển lãm trang phục truyền thống đẹp một cách ấn tượng."}]}, {"key": "readingA", "title": "A) Living in the mountains", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "1.", "options": ["collect", "grow", "feed", "upload"], "answer": 1, "explanation": "\"grow crops\" = trồng trọt mùa màng.", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "2.", "options": ["because", "when", "so", "although"], "answer": 0, "explanation": "Xây nhà khó vì đất không bằng phẳng → nguyên nhân, dùng \"because\".", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["Although", "But", "Despite", "Because"], "answer": 2, "explanation": "\"Despite + N\" = bất chấp điều gì; sau chỗ trống là cụm danh từ \"these challenges\".", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "4.", "options": ["a lot", "many", "a little", "a few"], "answer": 1, "explanation": "\"health benefits\" là danh từ đếm được số nhiều, và ngữ cảnh cần \"nhiều\" → many.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "5.", "options": ["cannot", "should", "musn't", "have to"], "answer": 3, "explanation": "Không có xe để đi nên BẮT BUỘC phải đi bộ → have to.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "6.", "options": ["friend", "unfriend", "friendly", "unfriendly"], "answer": 2, "explanation": "Bổ nghĩa cho \"simple and ___\" (giản dị và thân thiện) → friendly.", "vi": null}], "passage": "Living in the mountains can be very hard. First, there is not enough land to ___(1)___ crops or raise livestock. Building houses is also difficult ___(2)___ the land is not flat. The air in the mountains is another problem. The higher we get, the thinner the air becomes. This means there is less oxygen, which makes breathing harder. ___(3)___ these challenges, people around the world have lived and worked in mountainous areas for centuries. There are ___(4)___ health benefits of living in the mountains. Being on the mountaintops allows you to live far from pollution. The air you breathe is fresher. There are places where you cannot drive a car or a motorbike, so you ___(5)___ walk. Travelling up and down hills and mountains on foot helps keep you active. Finally, mountain people are quite simple and ___(6)___. They live a peaceful life."}, {"key": "readingB", "title": "B) Hill tribal markets", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGB1", "type": "mcq", "q": "1.", "options": ["village", "minority", "country", "highland"], "answer": 1, "explanation": "\"ethnic minority groups\" = các nhóm dân tộc thiểu số.", "vi": null}, {"id": "READINGB2", "type": "mcq", "q": "2.", "options": ["direction", "roads", "ways", "distances"], "answer": 3, "explanation": "\"long distances\" = khoảng cách xa giữa các cộng đồng.", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["with", "of", "about", "at"], "answer": 0, "explanation": "\"bustling with trade activities\" = nhộn nhịp với hoạt động buôn bán.", "vi": null}, {"id": "READINGB4", "type": "mcq", "q": "4.", "options": ["wash", "wear", "get", "put on"], "answer": 2, "explanation": "Cụm cố định \"get dressed\" = mặc quần áo.", "vi": null}, {"id": "READINGB5", "type": "mcq", "q": "5.", "options": ["a lot", "many", "much", "a little"], "answer": 1, "explanation": "\"events\" đếm được số nhiều → many.", "vi": null}, {"id": "READINGB6", "type": "mcq", "q": "6.", "options": ["and", "but", "so", "nor"], "answer": 0, "explanation": "Phục vụ cả người dân địa phương VÀ du khách → and.", "vi": null}], "passage": "Hill tribal markets are a distinctive feature in northern mountainous provinces in Viet Nam. Every year, these unique markets attract millions of holidaymakers who love finding out the culture of ethnic ___(1)___ groups like the Tay, the Hmong, etc. Most flea markets take place once a week, from early morning till noon due to the inconvenience of long ___(2)___ between neighbouring communities. Hence, on the market days, these places are quite bustling ___(3)___ trade activities. Visitors can watch and buy a lot of local specialties including corn wine, soy bean as well as five-colour sticky rice. It's also a special occasion for the ethnic people to ___(4)___ dressed in nice colourful clothes woven by skilled women, which motivates tourists to purchase brocatelle products for their own use. What's more, ___(5)___ exciting cultural events also happen at the fairs to serve the locals ___(6)___ tourists."}, {"key": "tfA", "title": "C) Cua Van floating village", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "1. Ha Long Bay is located in Quang Ninh Province, in the northeast of Viet Nam.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Ha Long Bay... Quang Ninh province, in the northeast of Viet Nam\" → Đúng.", "vi": null}, {"id": "TFA2", "type": "mcq", "q": "2. Cua Van is the only ancient floating fishing village that remains in Ha Long Bay.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"only Cua Van floating village remains\" → Đúng.", "vi": null}, {"id": "TFA3", "type": "mcq", "q": "3. The villagers usually buy fish from the mainland and sell it to other people.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: họ BÁN cá cho đất liền để đổi lấy thức ăn, không phải MUA cá từ đất liền → Sai.", "vi": null}, {"id": "TFA4", "type": "mcq", "q": "4. Most children in Cua Van floating village attend floating schools.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Most children go to floating schools\" → Đúng.", "vi": null}, {"id": "TFA5", "type": "mcq", "q": "5. The passage is mainly about:", "options": ["How Ha Long bay became a UNESCO World Heritage.", "The beauty of nature in Ha Long bay.", "The life of people in Cua Van ancient village.", "The geographical features of Ha Long bay."], "answer": 2, "explanation": "Bài đọc chủ yếu miêu tả cuộc sống của người dân làng cổ Cửa Vạn.", "vi": null}, {"id": "TFA6", "type": "mcq", "q": "6. The word \"they\" in paragraph 2 is closest in meaning to:", "options": ["the houses", "the villagers", "the builders", "the schools"], "answer": 1, "explanation": "\"they\" thay thế cho \"the villagers\" (những người dân làng).", "vi": null}], "passage": "There is an ethnic group living in Ha Long Bay which is a UNESCO World Heritage site in Quang Ninh province, in the northeast of Viet Nam. It has got over 1,600 islands and islets. Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains. All the houses and buildings in the village float on huge wooden rafts. The villagers spend their days fishing and looking after the sea life. Then they sail to the mainland to trade their fish for things like food, drinking water or clothes. Most children go to floating schools and then spend the rest of their time learning important skills like swimming and fishing. They also help out their parents as much as they can. This lifestyle may seem strange to many people, but it's so wonderful to live among such natural beauty and know you are protecting it. The villagers are able to help preserve their beautiful bay because they live directly on the water."}, {"key": "tfB", "title": "D) Ethnic Groups in Vietnam", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFB1", "type": "mcq", "q": "1. Vietnam has 54 ethnic groups.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Vietnam is a multi-ethnic country with 54 ethnic groups\" → Đúng.", "vi": null}, {"id": "TFB2", "type": "mcq", "q": "2. The Viet (Kinh) people make up 87% of Vietnam's population.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The Viet (Kinh) people account for 87%...\" → Đúng.", "vi": null}, {"id": "TFB3", "type": "mcq", "q": "3. All ethnic minority groups in Vietnam live in major cities.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: các dân tộc thiểu số sống rải rác ở vùng núi, không phải thành phố lớn → Sai.", "vi": null}, {"id": "TFB4", "type": "mcq", "q": "4. Wet rice cultivation is the main economic activity of most ethnic peoples.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The main economic activity of most ethnic peoples is wet rice cultivation\" → Đúng.", "vi": null}, {"id": "TFB5", "type": "mcq", "q": "5. Which ethnic group accounts for 87% of Vietnam's population?", "options": ["Tay", "Thai", "Viet (Kinh)", "Muong"], "answer": 2, "explanation": "Bài đọc: \"The Viet (Kinh) people account for 87%...\".", "vi": null}, {"id": "TFB6", "type": "mcq", "q": "6. Where do most ethnic minority groups live?", "options": ["In major cities", "In the Red River Delta", "In mountain areas", "In the Mekong Delta"], "answer": 2, "explanation": "Bài đọc: các dân tộc thiểu số \"scattered over mountain areas\".", "vi": null}], "passage": "Vietnam is a multi-ethnic country with 54 ethnic groups. The Viet (Kinh) people account for 87% of the country's population and mainly inhabit the Red River Delta, the central coastal delta, the Mekong Delta, and major cities. The other 53 ethnic minority groups, totaling over 8 million people, are scattered over mountain areas spreading from the North to the South. Among ethnic minorities, the most populated are Tay, Thai, Muong, Hoa, Khmer, and Nung, with a population of around 1 million each. Meanwhile, the least populated are Brau, Roman, and Odu, with several hundred people each. The main economic activity of most ethnic peoples is wet rice cultivation. Some ethnic minorities have mastered farming techniques, growing rice plants in flooded paddy fields and carrying out irrigation. Others go hunting, fishing, collecting, and live a semi-nomadic life. Each group has its own diverse and special culture. Beliefs and religions among Vietnamese ethnic minority groups are also different from one another."}, {"key": "transform0", "title": "Sentence Transformation (Part 1)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "It is not a problem to me whether I have to pick her up to the cinema or not.", "starter": "I don't mind", "answer": "picking her up to the cinema", "accepted": null, "explanation": "It is not a problem to sb whether S + V or not → sb + don't/doesn't mind + V-ing", "vi": "Việc tôi có phải đón cô ấy đi xem phim hay không cũng không phải vấn đề gì với tôi.", "note": "It is not a problem to sb whether S + V or not → sb + don't/doesn't mind + V-ing"}, {"id": "TR2", "type": "sentence", "q": "John cannot bear listening to such kind of noisy music.", "starter": "John dislikes", "answer": "listening to such kind of noisy music", "accepted": null, "explanation": "S + cannot bear + V-ing → S + dislike(s) + V-ing", "vi": "John không chịu được việc nghe loại nhạc ồn ào đó.", "note": "S + cannot bear + V-ing → S + dislike(s) + V-ing"}, {"id": "TR3", "type": "sentence", "q": "Watching historical films is very interesting to my younger brother.", "starter": "My younger brother enjoys", "answer": "watching historical films", "accepted": null, "explanation": "V-ing... + be interesting to sb → sb + enjoy(s) + V-ing", "vi": "Xem phim lịch sử rất thú vị đối với em trai tôi.", "note": "V-ing... + be interesting to sb → sb + enjoy(s) + V-ing"}, {"id": "TR4", "type": "sentence", "q": "She cannot bear talking with him about what he likes.", "starter": "She hates", "answer": "talking with him about what he likes", "accepted": null, "explanation": "S + cannot bear + V-ing → S + hate(s) + V-ing", "vi": "Cô ấy không thể chịu đựng được việc nói chuyện với anh ta về những gì anh ta thích.", "note": "S + cannot bear + V-ing → S + hate(s) + V-ing"}, {"id": "TR5", "type": "sentence", "q": "The thing that I hate most is motor racing, and I will never do it in my life.", "starter": "I detest", "answer": "motor racing, and I will never do it in my life", "accepted": null, "explanation": "The thing that S hate(s) most is N → S + detest(s) + N", "vi": "Điều tôi ghét nhất là đua xe, và tôi sẽ không bao giờ làm việc đó trong đời.", "note": "The thing that S hate(s) most is N → S + detest(s) + N"}, {"id": "TR6", "type": "sentence", "q": "It is really interesting for him to talk with his music teacher about jazz.", "starter": "He fancies", "answer": "talking with his music teacher about jazz", "accepted": null, "explanation": "It is interesting for sb to V → sb + fancy/fancies + V-ing", "vi": "Việc trò chuyện với giáo viên âm nhạc về nhạc jazz thực sự rất thú vị đối với cậu ấy.", "note": "It is interesting for sb to V → sb + fancy/fancies + V-ing"}, {"id": "TR7", "type": "sentence", "q": "He uses all his free time to look after his garden.", "starter": "He spends", "answer": "all his free time looking after his garden", "accepted": null, "explanation": "S + use(s) all + time + to V → S + spend(s) all + time + V-ing", "vi": "Cậu ấy dùng hết thời gian rảnh để chăm sóc khu vườn của mình.", "note": "S + use(s) all + time + to V → S + spend(s) all + time + V-ing"}, {"id": "TR8", "type": "sentence", "q": "Making crafts or collecting things like stamps and coins are very interesting.", "starter": "It's very interesting", "answer": "to make crafts or collect things like stamps and coins", "accepted": null, "explanation": "V-ing... + be very interesting (chủ ngữ là V-ing) → It's very interesting to V (chủ ngữ giả It)", "vi": "Làm đồ thủ công hoặc sưu tầm những thứ như tem và tiền xu rất thú vị.", "note": "V-ing... + be very interesting (chủ ngữ là V-ing) → It's very interesting to V (chủ ngữ giả It)"}, {"id": "TR9", "type": "sentence", "q": "We usually visit museums when we have leisure time.", "starter": "We enjoy", "answer": "visiting museums when we have leisure time", "accepted": null, "explanation": "S + usually + V → S + enjoy(s) + V-ing", "vi": "Chúng tôi thường đi thăm bảo tàng khi có thời gian rảnh.", "note": "S + usually + V → S + enjoy(s) + V-ing"}, {"id": "TR10", "type": "sentence", "q": "I don't like to get up early and prepare breakfast in the cold winter days.", "starter": "I hate", "answer": "getting up early and preparing breakfast in the cold winter days", "accepted": null, "explanation": "S + don't/doesn't like + to V → S + hate(s) + V-ing", "vi": "Tôi không thích dậy sớm và chuẩn bị bữa sáng vào những ngày mùa đông lạnh giá.", "note": "S + don't/doesn't like + to V → S + hate(s) + V-ing"}]}, {"key": "transform1", "title": "Sentence Transformation (Part 2)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR11", "type": "sentence", "q": "It took us 30 minutes to rehearse the song.", "starter": "We spent", "answer": "30 minutes rehearsing the song", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Chúng tôi mất 30 phút để tập bài hát.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}, {"id": "TR12", "type": "sentence", "q": "It took Tom one hour to travel to his hometown last week.", "starter": "Tom spent", "answer": "one hour travelling to his hometown last week", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Tom đã mất một tiếng để đi về quê tuần trước.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}, {"id": "TR13", "type": "sentence", "q": "It took him 30 minutes to watch the play.", "starter": "He spent", "answer": "30 minutes watching the play", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Cậu ấy đã mất 30 phút để xem vở kịch.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}, {"id": "TR14", "type": "sentence", "q": "He likes swimming and sunbathing.", "starter": "He is interested", "answer": "in swimming and sunbathing", "accepted": null, "explanation": "S + like(s) + V-ing → S + be interested in + V-ing", "vi": "Anh ấy thích bơi lội và tắm nắng.", "note": "S + like(s) + V-ing → S + be interested in + V-ing"}, {"id": "TR15", "type": "sentence", "q": "It took her nearly an hour to do the crossword.", "starter": "She spent", "answer": "nearly an hour doing the crossword", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Cô ấy đã mất gần một tiếng để giải ô chữ.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"costume\"] A. For the museum's opening night, the staff wore ____________________ from the 18th century.", "answer": "historical costumes", "explanation": "Dựa vào ví dụ \"elaborate historical costume\": historical costumes.", "vi": "Trong đêm khai mạc bảo tàng, nhân viên mặc trang phục lịch sử từ thế kỷ 18."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"costume\"] B. At the international cultural fair, each participant proudly wears their ____________________.", "answer": "national costume", "explanation": "Dựa vào ví dụ: national costume (trang phục dân tộc).", "vi": "Tại hội chợ văn hóa quốc tế, mỗi người tham gia tự hào mặc trang phục dân tộc của mình."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"minority\"] A. The festival celebrates the traditional music and dance of various __________________ in the region.", "answer": "ethnic minorities", "explanation": "Dựa vào ví dụ: ethnic minorities.", "vi": "Lễ hội tôn vinh âm nhạc và điệu múa truyền thống của các dân tộc thiểu số trong vùng."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"minority\"] B. The survey showed that only __________________ of people prefer working from home full-time.", "answer": "a minority", "explanation": "Dựa vào ví dụ: a minority (of people).", "vi": "Khảo sát cho thấy chỉ một số ít người thích làm việc tại nhà toàn thời gian."}]}, {"key": "pictures", "title": "Pictures & Signs", "emoji": "🚦", "vi": "Biển báo", "items": [{"id": "PIC1", "type": "mcq", "q": "15. What does the sign tell you?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫🐕</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO PETS ALLOWED</p></div>", "options": ["Only local pets are welcome here.", "Pets are allowed if they are on a leash.", "Pets are allowed in this area.", "You are not allowed to bring pets here."], "answer": 3, "explanation": "Biểu tượng chó gạch chéo → cấm mang thú cưng vào.", "vi": null}, {"id": "PIC2", "type": "mcq", "q": "16. What does this notice mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🎒📢🏫</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">LOST ITEM? CONTACT SCHOOL OFFICE</p></div>", "options": ["Contact the school office to get the lost item back.", "Go to the school gate if you want to sell your wallet.", "Wait for someone to call you from the school office.", "You can buy a handmade craft wallet at the school yard."], "answer": 0, "explanation": "Thông báo về đồ thất lạc, liên hệ văn phòng trường để nhận lại.", "vi": null}, {"id": "PIC3", "type": "mcq", "q": "17. What does this sign tell you?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🐢🚸🚗</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">SLOW DOWN — SCHOOL AHEAD</p></div>", "options": ["Drivers must slow down because school children are ahead.", "You can drive as fast as you want here.", "You should look for a parking lot near the school.", "High-speed vehicles are permitted on this road."], "answer": 0, "explanation": "Biển báo khu vực trường học → yêu cầu giảm tốc độ.", "vi": null}, {"id": "PIC4", "type": "mcq", "q": "18. What does this notice tell students?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🖥️📅✅</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">UPDATED VIRTUAL TOUR SCHEDULE — READY TOMORROW</p></div>", "options": ["The new schedule for the virtual tour cannot be changed.", "The updated schedule will be ready for viewing tomorrow.", "The virtual tour is canceled until next week.", "Students can join the virtual tour this afternoon."], "answer": 1, "explanation": "Thông báo: lịch trình cập nhật sẽ có vào ngày mai.", "vi": null}]}], "total": 107, "examPapers": [[{"id": "MCQ2", "type": "mcq", "q": "2. ______ do you wash clothes? - Every week.", "options": ["Which", "Who", "What", "How often"], "answer": 3, "explanation": "Trả lời chỉ TẦN SUẤT (Every week) → How often.", "vi": null, "ipas": null, "vis": ["cái nào", "ai", "cái gì", "bao lâu một lần (đúng)"], "image": null}, {"id": "TFA5", "type": "mcq", "q": "5. The passage is mainly about:", "options": ["How Ha Long bay became a UNESCO World Heritage.", "The beauty of nature in Ha Long bay.", "The life of people in Cua Van ancient village.", "The geographical features of Ha Long bay."], "answer": 2, "explanation": "Bài đọc chủ yếu miêu tả cuộc sống của người dân làng cổ Cửa Vạn.", "vi": null, "passage": "There is an ethnic group living in Ha Long Bay which is a UNESCO World Heritage site in Quang Ninh province, in the northeast of Viet Nam. It has got over 1,600 islands and islets. Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains. All the houses and buildings in the village float on huge wooden rafts. The villagers spend their days fishing and looking after the sea life. Then they sail to the mainland to trade their fish for things like food, drinking water or clothes. Most children go to floating schools and then spend the rest of their time learning important skills like swimming and fishing. They also help out their parents as much as they can. This lifestyle may seem strange to many people, but it's so wonderful to live among such natural beauty and know you are protecting it. The villagers are able to help preserve their beautiful bay because they live directly on the water."}, {"id": "PIC3", "type": "mcq", "q": "17. What does this sign tell you?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🐢🚸🚗</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">SLOW DOWN — SCHOOL AHEAD</p></div>", "options": ["Drivers must slow down because school children are ahead.", "You can drive as fast as you want here.", "You should look for a parking lot near the school.", "High-speed vehicles are permitted on this road."], "answer": 0, "explanation": "Biển báo khu vực trường học → yêu cầu giảm tốc độ.", "vi": null}, {"id": "PRON3", "type": "mcq", "q": "3. Which word has the underlined part pronounced differently from that of the others?", "options": ["environment", "idea", "condition", "highland"], "answer": 2, "explanation": "\"condition\" có \"i\" phát âm /ɪ/, ba từ còn lại phát âm /aɪ/.", "vi": null, "ipas": ["/ɪnˈvaɪrənmənt/", "/aɪˈdiːə/", "/kənˈdɪʃn/", "/ˈhaɪlənd/"], "vis": ["môi trường", "ý tưởng", "điều kiện", "vùng cao"], "image": null}, {"id": "PRON1", "type": "mcq", "q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["bulb", "plumber", "profitable", "label"], "answer": 1, "explanation": "Chữ \"b\" trong \"plumber\" là âm câm (không phát âm); ba từ còn lại phát âm /b/.", "vi": null, "ipas": ["/bʌlb/", "/ˈplʌmər/", "/ˈprɒfɪtəbl/", "/ˈleɪbl/"], "vis": ["bóng đèn", "thợ ống nước", "có lợi nhuận", "cái nhãn"], "image": null}, {"id": "MCQ11", "type": "mcq", "q": "11. ______ hat is this? - It's my brother's.", "options": ["Which", "Whose", "What", "How"], "answer": 1, "explanation": "Trả lời chỉ SỞ HỮU (my brother's) → Whose.", "vi": null, "ipas": null, "vis": ["cái nào", "của ai (đúng)", "cái gì", "như thế nào"], "image": null}, {"id": "TFB4", "type": "mcq", "q": "4. Wet rice cultivation is the main economic activity of most ethnic peoples.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The main economic activity of most ethnic peoples is wet rice cultivation\" → Đúng.", "vi": null, "passage": "Vietnam is a multi-ethnic country with 54 ethnic groups. The Viet (Kinh) people account for 87% of the country's population and mainly inhabit the Red River Delta, the central coastal delta, the Mekong Delta, and major cities. The other 53 ethnic minority groups, totaling over 8 million people, are scattered over mountain areas spreading from the North to the South. Among ethnic minorities, the most populated are Tay, Thai, Muong, Hoa, Khmer, and Nung, with a population of around 1 million each. Meanwhile, the least populated are Brau, Roman, and Odu, with several hundred people each. The main economic activity of most ethnic peoples is wet rice cultivation. Some ethnic minorities have mastered farming techniques, growing rice plants in flooded paddy fields and carrying out irrigation. Others go hunting, fishing, collecting, and live a semi-nomadic life. Each group has its own diverse and special culture. Beliefs and religions among Vietnamese ethnic minority groups are also different from one another."}, {"id": "TR15", "type": "sentence", "q": "It took her nearly an hour to do the crossword.", "starter": "She spent", "answer": "nearly an hour doing the crossword", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Cô ấy đã mất gần một tiếng để giải ô chữ.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}, {"id": "READINGA3", "type": "mcq", "q": "3.", "options": ["Although", "But", "Despite", "Because"], "answer": 2, "explanation": "\"Despite + N\" = bất chấp điều gì; sau chỗ trống là cụm danh từ \"these challenges\".", "vi": null, "passage": "Living in the mountains can be very hard. First, there is not enough land to ___(1)___ crops or raise livestock. Building houses is also difficult ___(2)___ the land is not flat. The air in the mountains is another problem. The higher we get, the thinner the air becomes. This means there is less oxygen, which makes breathing harder. ___(3)___ these challenges, people around the world have lived and worked in mountainous areas for centuries. There are ___(4)___ health benefits of living in the mountains. Being on the mountaintops allows you to live far from pollution. The air you breathe is fresher. There are places where you cannot drive a car or a motorbike, so you ___(5)___ walk. Travelling up and down hills and mountains on foot helps keep you active. Finally, mountain people are quite simple and ___(6)___. They live a peaceful life."}, {"id": "TFB2", "type": "mcq", "q": "2. The Viet (Kinh) people make up 87% of Vietnam's population.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The Viet (Kinh) people account for 87%...\" → Đúng.", "vi": null, "passage": "Vietnam is a multi-ethnic country with 54 ethnic groups. The Viet (Kinh) people account for 87% of the country's population and mainly inhabit the Red River Delta, the central coastal delta,  "/druː/"], "vis": ["đã biết", "đã bay", "đã lớn lên", "đã vẽ"], "image": null}, {"id": "TR12", "type": "sentence", "q": "It took Tom one hour to travel to his hometown last week.", "starter": "Tom spent", "answer": "one hour travelling to his hometown last week", "accepted": null, "explanation": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing", "vi": "Tom đã mất một tiếng để đi về quê tuần trước.", "note": "It took/takes + O + time + to V → S + spent/spend(s) + time + V-ing"}, {"id": "MCQ30", "type": "mcq", "q": "30. Most ethnic minority peoples are good _____ farming techniques.", "options": ["at", "for", "to", "on"], "answer": 0, "explanation": "\"be good at\" = giỏi về việc gì.", "vi": null, "ipas": null, "vis": ["giỏi về (đúng)", "cho", "đến", "trên"], "image": null}, {"id": "TFA3", "type": "mcq", "q": "3. The villagers usually buy fish from the mainland and sell it to other people.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: họ BÁN cá cho đất liền để đổi lấy thức ăn, không phải MUA cá từ đất liền → Sai.", "vi": null, "passage": "There is an ethnic group living in Ha Long Bay which is a UNESCO World Heritage site in Quang Ninh province, in the northeast of Viet Nam. It has got over 1,600 islands and islets. Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains. All the houses and buildings in the village float on huge wooden rafts. The villagers spend their days fishing and looking after the sea life. Then they sail to the mainland to trade their fish for things like food, drinking water or clothes. Most children go to floating schools and then spend the rest of their time learning important skills like swimming and fishing. They also help out their parents as much as they can. This lifestyle may seem strange to many people, but it's so wonderful to live among such natural beauty and know you are protecting it. The villagers are able to help preserve their beautiful bay because they live directly on the water."}, {"id": "TR8", "type": "sentence", "q": "Making crafts or collecting things like stamps and coins are very interesting.", "starter": "It's very interesting", "answer": "to make crafts or collect things like stamps and coins", "accepted": null, "explanation": "V-ing... + be very interesting (chủ ngữ là V-ing) → It's very interesting to V (chủ ngữ giả It)", "vi": "Làm đồ thủ công hoặc sưu tầm những thứ như tem và tiền xu rất thú vị.", "note": "V-ing... + be very interesting (chủ ngữ là V-ing) → It's very interesting to V (chủ ngữ giả It)"}, {"id": "MCQ19", "type": "mcq", "q": "19. We spent hours in _______ house to talk with local people.", "options": ["terraced", "close", "communal", "awesome"], "answer": 2, "explanation": "\"communal house\" = nhà rông/nhà sinh hoạt cộng đồng.", "vi": null, "ipas": null, "vis": ["có bậc thang", "gần", "cộng đồng, chung (đúng)", "tuyệt vời"], "image": null}, {"id": "TFA2", "type": "mcq", "q": "2. Cua Van is the only ancient floating fishing village that remains in Ha Long Bay.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"only Cua Van floating village remains\" → Đúng.", "vi": null, "passage": "There is an ethnic group living in Ha Long Bay which is a UNESCO World Heritage site in Quang Ninh province, in the northeast of Viet Nam. It has got over 1,600 islands and islets. Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains. All the houses and buildings in the village float on huge wooden rafts. The villagers spend their days fishing and looking after the sea life. Then they sail to the mainland to trade their fish for things like food, drinking water or clothes. Most children go to floating schools and then spend the rest of their time learning important skills like swimming and fishing. They also help out their parents as much as they can. This lifestyle may seem strange to many people, but it's so wonderful to live among such natural beauty and know you are protecting it. The villagers are able to help preserve their beautiful bay because they live directly on the water."}, {"id": "TFB3", "type": "mcq", "q": "3. All ethnic minority groups in Vietnam live in major cities.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: các dân tộc thiểu số sống rải rác ở vùng núi, không phải thành phố lớn → Sai.", "vi": null, "passage": "Vietnam is a multi-ethnic country with 54 ethnic groups. The Viet (Kinh) people account for 87% of the country's population and mainly inhabit the Red River Delta, the central coastal delta, the Mekong Delta, and major cities. The other 53 ethnic minority groups, totaling over 8 million people, are scattered over mountain areas spreading from the North to the South. Among ethnic minorities, the most populated are Tay, Thai, Muong, Hoa, Khmer, and Nung, with a population of around 1 million each. Meanwhile, the least populated are Brau, Roman, and Odu, with several hundred people each. The main economic activity of most ethnic peoples is wet rice cultivation. Some ethnic minorities have mastered farming techniques, growing rice plants in flooded paddy fields and carrying out irrigation. Others go hunting, fishing, collecting, and live a semi-nomadic life. Each group has its own diverse and special culture. Beliefs and religions among Vietnamese ethnic minority groups are also different from one another."}, {"id": "TR6", "type": "sentence", "q": "It is really interesting for him to talk with his music teacher about jazz.", "starter": "He fancies", "answer": "talking with his music teacher about jazz", "accepted": null, "explanation": "It is interesting for sb to V → sb + fancy/fancies + V-ing", "vi": "Việc trò chuyện với giáo viên âm nhạc về nhạc jazz thực sự rất thú vị đối với cậu ấy.", "note": "It is interesting for sb to V → sb + fancy/fancies + V-ing"}, {"id": "WF4", "type": "fill", "q": "4. The population of Vietnam contains a rich ______of ethnic groups. (DIVERSE)", "answer": "diversity", "explanation": "Sau tính từ \"rich\" cần DANH TỪ → diversity (sự đa dạng).", "vi": "Dân số Việt Nam có sự đa dạng phong phú về các nhóm dân tộc."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"costume\"] B. At the international cultural fair, each participant proudly wears their ____________________.", "answer": "national costume", "explanation": "Dựa vào ví dụ: national costume (trang phục dân tộc).", "vi": "Tại hội chợ văn hóa quốc tế, mỗi người tham gia tự hào mặc trang phục dân tộc của mình."}, {"id": "TR3", "type": "sentence", "q": "Watching historical films is very interesting to my younger brother.", "starter": "My younger brother enjoys", "answer": "watching historical films", "accepted": null, "explanation": "V-ing... + be interesting to sb → sb + enjoy(s) + V-ing", "vi": "Xem phim lịch sử rất thú vị đối với em trai tôi.", "note": "V-ing... + be interesting to sb → sb + enjoy(s) + V-ing"}, {"id": "WF3", "type": "fill", "q": "3. The Tay community practice ________religious beliefs including ancestor worship. (TRADITION)", "answer": "traditional", "explanation": "Bổ nghĩa cho danh từ \"religious beliefs\" cần TÍNH TỪ → traditional.", "vi": "Cộng đồng người Tày thực hành các tín ngưỡng tôn giáo truyền thống bao gồm thờ cúng tổ tiên."}, {"id": "STR7", "type": "mcq", "q": "7. Which word has a different stress pattern from that of the others?", "options": ["invitation", "celebration", "tradition", "information"], "answer": 2, "explanation": "\"tradition\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 3.", "vi": null, "ipas": ["/ˌɪnvɪˈteɪʃn/", "/ˌselɪˈbreɪʃn/", "/trəˈdɪʃn/", "/ˌɪnfərˈmeɪʃn/"], "vis": ["lời mời", "lễ kỷ niệm", "truyền thống", "thông tin"], "image": null}, {"id": "PIC2", "type": "mcq", "q": "16. What does this notice mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-indigo-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🎒📢🏫</div><p class=\"text-[11px] font-black text-center text-indigo-800 leading-tight\">LOST ITEM? CONTACT SCHOOL OFFICE</p></div>", "options": ["Contact the school office to get the lost item back.", "Go to the school gate if you want to sell your wallet.", "Wait for someone to call you from the school office.", "You can buy a handmade craft wallet at the school yard."], "answer": 0, "explanation": "Thông báo về đồ thất lạc, liên hệ văn phòng trường để nhận lại.", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "3.", "options": ["with", "of", "about", "at"], "answer": 0, "explanation": "\"bustling with trade activities\" = nhộn nhịp với hoạt động buôn bán.", "vi": null, "passage": "Hill tribal markets are a distinctive feature in northern mountainous provinces in Viet Nam. Every year, these unique markets attract millions of holidaymakers who love finding out the culture of ethnic ___(1)___ groups like the Tay, the Hmong, etc. Most flea markets take place once a week, from early morning till noon due to the inconvenience of long ___(2)___ between neighbouring communities. Hence, on the market days, these places are quite bustling ___(3)___ trade activities. Visitors can watch and buy a lot of local specialties including corn wine, soy bean as well as five-colour sticky rice. It's also a special occasion for the ethnic people to ___(4)___ dressed in nice colourful clothes woven by skilled women, which motivates tourists to purchase brocatelle products for their own use. What's more, ___(5)___ exciting cultural events also happen at the fairs to serve the locals ___(6)___ tourists."}, {"id": "MCQ23", "type": "mcq", "q": "23. We can _______ the sea from here.", "options": ["raise", "overlook", "enrich", "weave"], "answer": 1, "explanation": "\"overlook the sea\" = nhìn ra biển.", "vi": null, "ipas": null, "vis": ["chăn nuôi", "nhìn ra (đúng)", "làm giàu", "dệt, đan"], "image": null}, {"id": "STR9", "type": "mcq", "q": "9. Which word has a different stress pattern from
