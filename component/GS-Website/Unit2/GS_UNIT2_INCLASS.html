<!DOCTYPE html>

<title>Unit 2 - In-class Practice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{ --accent:#1d4ed8; --accent2:#0891b2; }
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#f5f3ff; }
  .hero-gradient{ background: linear-gradient(135deg, #7c2d12 0%, #ea580c 55%, #f59e0b 100%); }
  .tab-btn{ transition: all .2s ease; }
  .tab-btn.active{ background: linear-gradient(135deg, #7c2d12, #f59e0b); color:#fff; box-shadow:0 4px 14px rgba(124,45,18,.35); transform:translateY(-1px); }
  .task-card{ transition: box-shadow .2s, transform .2s; }
  .task-card:hover{ transform: translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  .mcq-detail-hidden{ display:none; }
  .show-mcq-detail .mcq-detail-hidden{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:var(--accent); }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .voice-ok{ color:#16a34a; } .voice-warn{ color:#d97706; }

  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
  table.border-collapse td, table.border-collapse th{ border:1px solid #e2e8f0; }
</style>

<script>
const DATA = {"unit": 2, "sections": [{"roman": "", "navLabel": "Lý thuyết", "title": "Từ vựng - Ngữ pháp - Hướng dẫn Word Form", "icon": "lightbulb", "type": "info", "info": "<div class='mb-5'><p class=\"text-sm text-slate-500 italic mb-3\">Ôn lại từ vựng, ngữ pháp trọng tâm và cách làm dạng bài Word Form trước khi luyện tập.</p></div><div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. catch</span><span class='text-slate-400 text-xs'>(v) /kætʃ/</span><span class='text-slate-500 text-xs ml-auto'>đánh được, câu được (cá)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. cattle</span><span class='text-slate-400 text-xs'>(n) /ˈkætl/</span><span class='text-slate-500 text-xs ml-auto'>gia súc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. combine harvester</span><span class='text-slate-400 text-xs'>(n) /ˈkɒmbaɪn ˈhɑːvɪstə/</span><span class='text-slate-500 text-xs ml-auto'>máy gặt đập liên hợp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. crop</span><span class='text-slate-400 text-xs'>(n) /krɒp/</span><span class='text-slate-500 text-xs ml-auto'>vụ, mùa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. cultivate</span><span class='text-slate-400 text-xs'>(v) /ˈkʌltɪveɪt/</span><span class='text-slate-500 text-xs ml-auto'>trồng trọt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. dry</span><span class='text-slate-400 text-xs'>(v) /draɪ/</span><span class='text-slate-500 text-xs ml-auto'>phơi khô, sấy khô</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. feed</span><span class='text-slate-400 text-xs'>(v) /fiːd/</span><span class='text-slate-500 text-xs ml-auto'>cho ăn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. ferry</span><span class='text-slate-400 text-xs'>(n) /ˈferi/</span><span class='text-slate-500 text-xs ml-auto'>phà</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. harvest</span><span class='text-slate-400 text-xs'>(n, v) /ˈhɑːvɪst/</span><span class='text-slate-500 text-xs ml-auto'>vụ thu hoạch, thu hoạch</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. herd</span><span class='text-slate-400 text-xs'>(v) /hɜːd/</span><span class='text-slate-500 text-xs ml-auto'>chăn giữ vật nuôi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. hospitable</span><span class='text-slate-400 text-xs'>(adj) /ˈhɒspɪtəbl/</span><span class='text-slate-500 text-xs ml-auto'>mến khách, hiếu khách</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. lighthouse</span><span class='text-slate-400 text-xs'>(n) /ˈlaɪthaʊs/</span><span class='text-slate-500 text-xs ml-auto'>đèn biển, hải đăng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. load</span><span class='text-slate-400 text-xs'>(v) /ləʊd/</span><span class='text-slate-500 text-xs ml-auto'>chất, chở</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. milk</span><span class='text-slate-400 text-xs'>(v) /mɪlk/</span><span class='text-slate-500 text-xs ml-auto'>vắt sữa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. orchard</span><span class='text-slate-400 text-xs'>(n) /ˈɔːtʃəd/</span><span class='text-slate-500 text-xs ml-auto'>vườn cây ăn quả</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. paddy field</span><span class='text-slate-400 text-xs'>(n) /ˈpædi fiːld/</span><span class='text-slate-500 text-xs ml-auto'>ruộng lúa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. picturesque</span><span class='text-slate-400 text-xs'>(adj) /ˌpɪktʃəˈresk/</span><span class='text-slate-500 text-xs ml-auto'>đẹp, hấp dẫn (phong cảnh)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. plough</span><span class='text-slate-400 text-xs'>(v) /plaʊ/</span><span class='text-slate-500 text-xs ml-auto'>cày (thửa ruộng)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. speciality</span><span class='text-slate-400 text-xs'>(n) /ˌspeʃiˈæləti/</span><span class='text-slate-500 text-xs ml-auto'>đặc sản</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. stretch</span><span class='text-slate-400 text-xs'>(v) /stretʃ/</span><span class='text-slate-500 text-xs ml-auto'>kéo dài ra</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. unload</span><span class='text-slate-400 text-xs'>(v) /ˌʌnˈləʊd/</span><span class='text-slate-500 text-xs ml-auto'>dỡ hàng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. vast</span><span class='text-slate-400 text-xs'>(adj) /vɑːst/</span><span class='text-slate-500 text-xs ml-auto'>rộng lớn, mênh mông, bao la</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>23. well-trained</span><span class='text-slate-400 text-xs'>(adj) /ˌwel ˈtreɪnd/</span><span class='text-slate-500 text-xs ml-auto'>lành nghề, có tay nghề</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>So sánh hơn của trạng từ (Comparative forms of adverbs)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Trạng từ dùng để bổ nghĩa cho động từ, tính từ hoặc trạng từ khác. Dùng để so sánh mức độ/cách thực hiện hành động giữa hai đối tượng.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trạng từ NGẮN (1 âm tiết)</th><th class=\"border px-2 py-1\">Trạng từ DÀI (≥2 âm tiết, thường đuôi -ly)</th></tr>\n      <tr><td class=\"border px-2 py-1 italic\">hard (chăm chỉ), fast (nhanh), near (gần), late (muộn)</td><td class=\"border px-2 py-1 italic\">quickly (nhanh chóng), interestingly (thú vị), carefully (cẩn thận)</td></tr>\n    </table>\n    </div>\n    <div class=\"mt-3 space-y-2 text-sm text-slate-700\">\n      <p><b>So sánh hơn với trạng từ NGẮN:</b> thêm đuôi <b>-ER</b>.<br><i>Cấu trúc: S1 + V + adv-er + than + S2 (+ auxiliary V) / O</i><br><i>VD: They work harder than I do. = They work harder than me. (Họ làm việc chăm chỉ hơn tôi.)</i></p>\n      <p><b>So sánh hơn với trạng từ DÀI:</b> thêm <b>MORE</b> trước trạng từ.<br><i>Cấu trúc: S1 + V + more + adv + than + S2 (+ auxiliary V) / O</i><br><i>VD: My friend did the test more carefully than I did. = My friend did the test more carefully than me. (Bạn tôi làm bài kiểm tra cẩn thận hơn tôi.)</i></p>\n    </div>\n    <div class=\"overflow-x-auto mt-3\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trạng từ bất quy tắc</th><th class=\"border px-2 py-1\">So sánh hơn</th></tr>\n      <tr><td class=\"border px-2 py-1\">well (giỏi, tốt)</td><td class=\"border px-2 py-1 font-bold\">better</td></tr>\n      <tr><td class=\"border px-2 py-1\">badly (tệ, kém)</td><td class=\"border px-2 py-1 font-bold\">worse</td></tr>\n      <tr><td class=\"border px-2 py-1\">much/many (nhiều)</td><td class=\"border px-2 py-1 font-bold\">more</td></tr>\n      <tr><td class=\"border px-2 py-1\">a little/little (ít)</td><td class=\"border px-2 py-1 font-bold\">less</td></tr>\n      <tr><td class=\"border px-2 py-1\">far (xa)</td><td class=\"border px-2 py-1 font-bold\">farther/further</td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>She writes more quicker than me.</s> ❌ → <b>She writes more quickly than me.</b> ✅ — không dùng cả \"more\" và \"-er\" cùng lúc.</li>\n      <li><s>He runs gooder than his brother.</s> ❌ → <b>He runs better than his brother.</b> ✅ — \"well\" so sánh hơn là \"better\", không phải \"gooder\".</li>\n      <li><s>This is the most busiest city.</s> ❌ → <b>This is the busiest city.</b> ✅ — tính từ ngắn chỉ thêm \"-est\", không thêm cả \"most\".</li>\n      <li><s>I spend two hours to read books.</s> ❌ → <b>I spend two hours reading books.</b> ✅ — \"spend + time\" đi với V-ing.</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Trạng từ ngắn: adv + ER\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">Trạng từ ngắn: <b>adv + ER</b></p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Trạng từ dài: MORE + adv\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">Trạng từ dài: <b>MORE + adv</b></p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"A + be + a/an + so sánh hơn (adj) + N + than B = A + V + so sánh hơn (adv) + than B\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 3</p>\n      <p class=\"text-sm text-slate-700\">A + be + a/an + adj-er/more adj + N + than B<br>= A + V + adv-er/more adv + than B</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 4</p>\n      <p class=\"text-sm text-slate-700\">S + spend(s)/spent + time + V-ing<br>= It takes/took + O + time + to V</p>\n    </div>\n  </div>\n\n  <div class=\"bg-amber-50 border border-amber-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-amber-800 mb-2\"><i class=\"fa-solid fa-lightbulb mr-1\"></i>Áp dụng phương pháp 6 bước (xem tab \"Cách viết lại câu\") vào bài này</p>\n    <p class=\"text-sm text-slate-700\">Ví dụ: <i>\"Minh is a better swimmer than Hieu.\"</i> → chuyển từ dạng \"be + adj + N\" sang dạng \"V + adv\" → giữ nguyên so sánh bất quy tắc \"better\" → <b>Minh swims better than Hieu.</b></p>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has the underlined part pronounced differently from that of the others?", "options": ["cultivate", "unload", "muscle", "cruel"], "answer": 3, "ipas": ["/ˈkʌltɪveɪt/", "/ʌnˈləʊd/", "/ˈmʌsl/", "/ˈkruːəl/"], "vis": ["trồng trọt", "dỡ hàng", "cơ bắp", "tàn nhẫn"], "explanation": "\"cruel\" phát âm /uː/, ba từ còn lại phát âm /ʌ/."}, {"q": "2. Which word has the underlined part pr ading\" có \"ea\" phát âm /e/, ba từ còn lại phát âm /iː/."}, {"q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["laugh", "rough", "plough", "enough"], "answer": 2, "ipas": ["/læf/", "/rʌf/", "/plaʊ/", "/ɪˈnʌf/"], "vis": ["cười", "thô ráp", "cày ruộng", "đủ"], "explanation": "\"plough\" có \"gh\" câm (không phát âm), ba từ còn lại phát âm /f/."}, {"q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["catch", "cattle", "vast", "paddy"], "answer": 2, "ipas": ["/kætʃ/", "/ˈkætl/", "/vɑːst/", "/ˈpædi/"], "vis": ["bắt, câu", "gia súc", "rộng lớn", "ruộng lúa"], "explanation": "\"vast\" phát âm /ɑː/, ba từ còn lại phát âm /æ/."}, {"q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["looked", "cultivated", "herded", "unloaded"], "answer": 0, "ipas": ["/lʊkt/", "/ˈkʌltɪveɪtɪd/", "/ˈhɜːdɪd/", "/ʌnˈləʊdɪd/"], "vis": ["đã nhìn", "đã trồng trọt", "đã chăn giữ", "đã dỡ hàng"], "explanation": "\"looked\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /ɪd/."}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has a different stress pattern from that of the others?", "options": ["cattle", "ferry", "collect", "orchard"], "answer": 2, "ipas": ["/ˈkætl/", "/ˈferi/", "/kəˈlekt/", "/ˈɔːtʃəd/"], "vis": ["gia súc", "phà", "thu thập", "vườn cây ăn quả"], "explanation": "\"collect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "2. Which word has a different stress pattern from that of the others?", "options": ["cultivate", "develop", "villager", "farmhouse"], "answer": 1, "ipas": ["/ˈkʌltɪveɪt/", "/dɪˈveləp/", "/ˈvɪlɪdʒər/", "/ˈfɑːmhaʊs/"], "vis": ["trồng trọt", "phát triển", "dân làng", "nhà nông trại"], "explanation": "\"develop\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "3. Which word has a different stress pattern from that of the others?", "options": ["tradition", "collection", "picturesque", "developer"], "answer": 2, "ipas": ["/trəˈdɪʃn/", "/kəˈlekʃn/", "/ˌpɪktʃəˈresk/", "/dɪˈveləpər/"], "vis": ["truyền thống", "bộ sưu tập", "đẹp như tranh", "nhà phát triển"], "explanation": "\"picturesque\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "4. Which word has a different stress pattern from that of the others?", "options": ["lighthouse", "unload", "friendly", "harvest"], "answer": 1, "ipas": ["/ˈlaɪthaʊs/", "/ʌnˈləʊd/", "/ˈfrendli/", "/ˈhɑːvɪst/"], "vis": ["hải đăng", "dỡ hàng", "thân thiện", "vụ thu hoạch"], "explanation": "\"unload\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "5. Which word has a different stress pattern from that of the others?", "options": ["collective", "carefully", "carefully", "friendliness"], "answer": 0, "ipas": ["/kəˈlektɪv/", "/ˈkeəfəli/", "/ˈkeəfəli/", "/ˈfrendlinəs/"], "vis": ["tập thể", "một cách cẩn thận", "một cách cẩn thận", "sự thân thiện"], "explanation": "\"collective\" trọng âm rơi vào âm tiết 2, ba từ/cụm còn lại trọng âm rơi vào âm tiết 1."}, {"q": "6. Which word has a different stress pattern from that of the others?", "options": ["traditional", "hospitable", "development", "speciality"], "answer": 3, "ipas": ["/trəˈdɪʃənl/", "/ˈhɒspɪtəbl/", "/dɪˈveləpmənt/", "/ˌspeʃiˈæləti/"], "vis": ["thuộc truyền thống", "mến khách", "sự phát triển", "đặc sản"], "explanation": "\"speciality\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "7. Which word has a different stress pattern from that of the others?", "options": ["collector", "colorful", "farmer", "friendship"], "answer": 0, "ipas": ["/kəˈlektər/", "/ˈkʌlərfl/", "/ˈfɑːmər/", "/ˈfrendʃɪp/"], "vis": ["người sưu tầm", "nhiều màu sắc", "nông dân", "tình bạn"], "explanation": "\"collector\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}, {"q": "8. Which word has a different stress pattern from that of the others?", "options": ["agricultural", "picturesque", "speciality", "hospitable"], "answer": 3, "ipas": ["/ˌæɡrɪˈkʌltʃərəl/", "/ˌpɪktʃəˈresk/", "/ˌspeʃiˈæləti/", "/ˈhɒspɪtəbl/"], "vis": ["thuộc nông nghiệp", "đẹp như tranh", "đặc sản", "mến khách"], "explanation": "\"hospitable\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 3."}, {"q": "9. Which word has a different stress pattern from that of the others?", "options": ["develop", "traditional", "carefully", "collectively"], "answer": 2, "ipas": ["/dɪˈveləp/", "/trəˈdɪʃənl/", "/ˈkeəfəli/", "/kəˈlektɪvli/"], "vis": ["phát triển", "thuộc truyền thống", "một cách cẩn thận", "một cách tập thể"], "explanation": "\"carefully\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2."}, {"q": "10. Which word has a different stress pattern from that of the others?", "options": ["villager", "carefully", "collector", "farming"], "answer": 2, "ipas": ["/ˈvɪlɪdʒər/", "/ˈkeəfəli/", "/kəˈlektər/", "/ˈfɑːmɪŋ/"], "vis": ["dân làng", "một cách cẩn thận", "người sưu tầm", "nghề nông"], "explanation": "\"collector\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1."}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. She'd love to take part in the evening class. ________, she has to look after the baby in the evening.", "options": ["Therefore", "However", "but", "Although"], "answer": 1, "explanation": "Ý tương phản (muốn đi học nhưng phải trông em) → However (đứng đầu câu, sau dấu phẩy).", "vis": ["vì vậy (sai — không phải ý tương phản)", "tuy nhiên (đúng)", "nhưng (sai — không viết hoa đầu câu như vậy)", "mặc dù (sai — cần mệnh đề đi kèm)"], "tags": ["grammar"]}, {"q": "2. I ________ a short cut through the park. It'll take much less time.", "options": ["take", "to take", "taking", "took"], "answer": 0, "explanation": "Câu gợi ý/mệnh lệnh nhẹ ở hiện tại đơn → take (nguyên mẫu, ngôi thứ nhất).", "vis": ["đi tắt (đúng, gợi ý hành động)", "to-V (sai cấu trúc)", "V-ing (sai cấu trúc)", "đã đi (sai thì)"], "tags": ["grammar"]}, {"q": "3. Please, write ________. I can't wait for you.", "options": ["more quickly", "quicker", "more quicker", "quick"], "answer": 0, "explanation": "\"quickly\" là trạng từ dài (thực ra là trạng từ có -ly), so sánh hơn dùng \"more quickly\" bổ nghĩa cho động từ \"write\".", "vis": ["nhanh hơn (đúng — more + trạng từ)", "nhanh hơn (sai — thiếu \"more\" cho trạng từ)", "nhanh hơn (sai — thừa cả \"more\" và \"-er\")", "nhanh (sai — tính từ, không bổ nghĩa được cho động từ)"], "tags": ["grammar"]}, {"q": "4. My father ________ for the car factory in 1995.", "options": ["worked", "was working", "has worked", "is working"], "answer": 0, "explanation": "Có mốc thời gian xác định trong quá khứ \"in 1995\" → thì quá khứ đơn: worked.", "vis": ["đã làm việc (đúng — quá khứ đơn)", "đang làm việc (sai thì)", "đã làm việc (hiện tại hoàn thành, sai)", "đang làm việc (hiện tại tiếp diễn, sai)"], "tags": ["grammar"]}, {"q": "5. If the weather gets ________ tomorrow, we won't go to the beach.", "options": ["worse", "nicer", "more bad", "better"], "answer": 0, "explanation": "Ngữ cảnh phủ định (won't go to the beach) hợp lý nhất với \"worse\" (tệ hơn) — so sánh hơn bất quy tắc của \"bad\".", "vis": ["tệ hơn (đúng, hợp ngữ cảnh)", "đẹp hơn (sai ngữ cảnh)", "tệ hơn (sai — dạng so sánh sai của \"bad\")", "tốt hơn (sai ngữ cảnh)"], "tags": ["vocab"]}, {"q": "6. Tung often helps his mom to pick ______ in the orchard.", "options": ["fruit", "trees", "plants", "songs"], "answer": 0, "explanation": "\"pick fruit\" = hái hoa quả/trái cây — hợp nghĩa với \"orchard\" (vườn cây ăn quả).", "vis": ["trái cây (đúng)", "cây cối (sai — không \"hái\" cây)", "cây trồng (sai nghĩa)", "bài hát (sai nghĩa)"], "tags": ["vocab"]}, {"q": "7. Mr Triet ________ in London at the moment.", "options": ["studies", "is studying", "has studied", "will study"], "answer": 1, "explanation": "Dấu hiệu \"at the moment\" → thì hiện tại tiếp diễn: is studying.", "vis": ["học (hiện tại đơn, sai thì)", "đang học (đúng)", "đã học (hiện tại hoàn thành, sai)", "sẽ học (tương lai, sai)"], "tags": ["grammar"]}, {"q": "8. Hoa danced ________ than me.", "options": ["beautiful", "more beautiful", "beautifuler", "more beautifully"], "answer": 3, "explanation": "Bổ nghĩa cho động từ \"danced\" cần TRẠNG TỪ so sánh hơn (trạng từ dài) → more beautifully.", "vis": ["đẹp (tính từ, sai)", "đẹp hơn (tính từ so sánh, sai vì cần trạng từ)", "đẹp hơn (sai — không tồn tại dạng này)", "đẹp hơn (đúng — trạng từ so sánh hơn)"], "tags": ["grammar"]}, {"q": "9. She felt tired. __________, she had to finish her homework.", "options": ["However", "Therefore", "So", "Although"], "answer": 0, "explanation": "Ý tương phản (mệt nhưng vẫn phải làm bài) → However.", "vis": ["tuy nhiên (đúng)", "vì vậy (sai — không phải quan hệ nguyên nhân)", "vì vậy (sai — không viết hoa như vậy đầu câu)", "mặc dù (sai — cần nối 2 mệnh đề trong 1 câu)"], "tags": ["grammar"]}, {"q": "10. When my father was young, he enjoyed _____ early to do the gardening.", "options": ["get up", "getting up", "to get up", "to getting up"], "answer": 1, "explanation": "Cấu trúc: enjoy + V-ing → getting up.", "vis": ["dậy sớm (nguyên mẫu, sai)", "dậy sớm (V-ing, đúng)", "dậy sớm (to-V, sai)", "dậy sớm (sai — không tồn tại dạng này)"], "tags": ["grammar"]}, {"q": "11. His uncle likes ______ some fish from nearby lakes and ponds after school.", "options": ["catching", "holding", "buying", "meeting"], "answer": 0, "explanation": "\"catch fish\" = câu/bắt cá — hợp nghĩa với \"lakes and ponds\".", "vis": ["câu, bắt (đúng)", "cầm, giữ (sai nghĩa)", "mua (sai nghĩa)", "gặp (sai nghĩa)"], "tags": ["vocab"]}, {"q": "12. Tom helps his family to herd ______ at weekends.", "options": ["cattle", "poultry", "cats", "fruit"], "answer": 0, "explanation": "\"herd cattle\" = chăn thả gia súc — collocation đúng với \"herd\".", "vis": ["gia súc (đúng)", "gia cầm (sai — không \"herd\" gia cầm)", "mèo (sai nghĩa)", "trái cây (sai nghĩa)"], "tags": ["vocab"]}, {"q": "13. The man ______ the vegetables in the field and then drives home.", "options": ["makes", "loads", "catches", "uploads"], "answer": 1, "explanation": "\"load vegetables\" = chất/bốc rau củ lên xe — hợp nghĩa với việc lái xe về sau đó.", "vis": ["làm (sai nghĩa)", "chất, bốc lên xe (đúng)", "bắt (sai nghĩa)", "tải lên mạng (sai nghĩa)"], "tags": ["vocab"]}, {"q": "14. The teacher told his students __________ laughing.", "options": ["stop", "stopping", "to stop", "stopped"], "answer": 2, "explanation": "Cấu trúc: tell sb to do sth → to stop.", "vis": ["dừng (nguyên mẫu, sai)", "dừng (V-ing, sai)", "dừng (to-V, đúng)", "đã dừng (sai)"], "tags": ["grammar"]}, {"q": "15. This is ________ city that I have ever been to.", "options": ["the busiest", "the busier", "the most busy", "the most busiest"], "answer": 0, "explanation": "So sánh nhất với tính từ ngắn \"busy\" → the busiest.", "vis": ["nhộn nhịp nhất (đúng)", "nhộn nhịp hơn (so sánh hơn, sai)", "nhộn nhịp nhất (sai — thừa \"most\")", "sai ngữ pháp (thừa cả 2 cách)"], "tags": ["grammar"]}, {"q": "16. We couldn't go out _________ it was very stormy.", "options": ["because of", "because", "so", "but"], "answer": 1, "explanation": "Liên từ chỉ nguyên nhân theo sau là một mệnh đề (S+V) → because.", "vis": ["bởi vì (sai — vì \"of\" cần đi với cụm danh từ)", "bởi vì (đúng — vì đi với mệnh đề)", "vì vậy (sai quan hệ)", "nhưng (sai quan hệ)"], "tags": ["grammar"]}, {"q": "17. My father asked us_________too much time playing computer games last night.", "options": ["not to spending", "didn't spend", "not to spend", "to not spent"], "answer": 2, "explanation": "Cấu trúc: ask sb not to do sth → not to spend.", "vis": ["sai ngữ pháp", "sai cấu trúc", "đúng — không làm gì", "sai vị trí \"not\""], "tags": ["grammar"]}, {"q": "18. The workers are ______ a truck with timber.", "options": ["unloading", "loading", "taking", "filling"], "answer": 1, "explanation": "\"load A with B\" = chất/bốc cái gì lên xe.", "vis": ["đang dỡ hàng (sai nghĩa)", "đang chất hàng (đúng)", "đang lấy (sai nghĩa)", "đang đổ đầy (sai collocation)"], "tags": ["vocab"]}, {"q": "19. He often ______ holes in his garden to plant trees.", "options": ["ploughs", "picks", "digs", "collects"], "answer": 2, "explanation": "\"dig holes\" = đào lỗ/hố — hợp nghĩa để trồng cây.", "vis": ["cày (sai nghĩa)", "hái, nhặt (sai nghĩa)", "đào (đúng)", "thu thập (sai nghĩa)"], "tags": ["vocab"]}, {"q": "20. My uncle hired extra workers to help at harvest ______.", "options": ["time", "point", "period", "season"], "answer": 0, "explanation": "\"harvest time\" = mùa thu hoạch/thời điểm thu hoạch — collocation phổ biến.", "vis": ["mùa, thời điểm (đúng)", "điểm (sai collocation)", "giai đoạn (sai collocation)", "mùa (sai collocation với harvest)"], "tags": ["vocab"]}, {"q": "21. From the hilltop, we can see row after row of orange trees ______ to the horizon.", "options": ["running", "expanding", "enlarging", "stretching"], "answer": 3, "explanation": "\"stretch to the horizon\" = trải dài tới tận chân trời.", "vis": ["chạy (sai nghĩa)", "mở rộng (sai nghĩa)", "phóng to (sai nghĩa)", "trải dài (đúng)"], "tags": ["vocab"]}, {"q": "22. People in my village grow rice in vast ______ fields.", "options": ["corn", "wheat", "pad", "paddy"], "answer": 3, "explanation": "\"paddy fields\" = cánh đồng lúa — hợp nghĩa với \"grow rice\".", "vis": ["ngô (sai nghĩa)", "lúa mì (sai nghĩa)", "không có nghĩa", "ruộng lúa (đúng)"], "tags": ["vocab"]}, {"q": "23. Student A: You look nice today.  Student B: ______", "options": ["Do you really think so?", "I don't think so.", "I beg your pardon.", "I'm fine, thank you."], "answer": 0, "explanation": "Phản hồi lại lời khen xã giao một cách khiêm tốn.", "vis": ["bạn thật sự nghĩ vậy à? (đúng — khiêm tốn trước lời khen)", "tôi không nghĩ vậy (không tự nhiên)", "xin lỗi, bạn nói lại được không (lạc đề)", "tôi khỏe, cảm ơn (lạc đề — không phải trả lời sức khỏe)"], "tags": ["mixed"]}, {"q": "24. Student A: I've had a very enjoyable summer holiday with my family. Student B: ______", "options": ["I'm jealous of your holiday.", "I envy you.", "That's great, thanks.", "No, I don't envy you."], "answer": 1, "explanation": "Bày tỏ sự ghen tị/ngưỡng mộ một cách tự nhiên với kỳ nghỉ của người khác.", "vis": ["tôi ghen tị với kỳ nghỉ của bạn (ít tự nhiên hơn)", "tôi ghen tị với bạn (đúng — tự nhiên nhất)", "thật tuyệt, cảm ơn (lạc đề — không phải lời cảm ơn)", "không, tôi không ghen tị (mâu thuẫn ngữ cảnh)"], "tags": ["mixed"]}, {"q": "25. Student A: Ooh, what a great tie! Where did you get it? Student B: ______", "options": ["Oh, thank you! I got it at a shop in Le Loi Street.", "Don't mention it. I bought it at a shop in Ha Noi.", "No, it doesn't look great at all.", "Yes, I like it very much."], "answer": 0, "explanation": "Cảm ơn lời khen rồi trả lời nguồn gốc món đồ theo đúng câu hỏi \"Where\".", "vis": ["cảm ơn! tôi mua ở phố Lê Lợi (đúng — cảm ơn + trả lời where)", "không có gì, tôi mua ở Hà Nội (sai — \"don't mention it\" dùng khi đáp lại lời cảm ơn)", "không, nó không đẹp chút nào (mâu thuẫn với lời khen)", "vâng, tôi rất thích nó (không trả lời câu hỏi where)"], "tags": ["mixed"]}, {"q": "26. Student A: Why do you like living in the countryside? Student B: ______", "options": ["Because there's a great sense of community there.", "Because I like the excitement of the city.", "Because life in the countryside is boring.", "Because I don't like the public transport here."], "answer": 0, "explanation": "Trả lời trực tiếp và hợp lý cho câu hỏi vì sao thích sống ở nông thôn.", "vis": ["vì ở đó có tình làng nghĩa xóm gắn kết (đúng)", "vì tôi thích sự sôi động thành phố (mâu thuẫn với câu hỏi)", "vì cuộc sống nông thôn nhàm chán (mâu thuẫn — đây là lý do KHÔNG thích)", "vì tôi không thích giao thông công cộng (lạc đề)"], "tags": ["mixed"]}, {"q": "27. Student A: Let me congratulate you on your cake! Student B: ______", "options": ["That's my strong point!", "Making cakes is not my forte.", "Why do you say that?", "That's very kind of you!"], "answer": 3, "explanation": "Đáp lại lời chúc mừng/khen ngợi một cách lịch sự.", "vis": ["đó là sở trường của tôi (hơi tự mãn, không tự nhiên)", "làm bánh không phải sở trường của tôi (mâu thuẫn — vừa được khen)", "sao bạn lại nói vậy? (không tự nhiên khi được khen)", "bạn thật tốt bụng (đúng — đáp lại lời khen lịch sự)"], "tags": ["mixed"]}, {"q": "28. After a long day of working, the farmers had to ________ the heavy bags of rice onto the back of the truck to transport them to the market.", "options": ["unload", "load", "stretch", "cultivate"], "answer": 1, "explanation": "\"load bags onto truck\" = chất các bao tải lên xe.", "vis": ["dỡ hàng (sai — trái nghĩa)", "chất hàng lên (đúng)", "kéo dài (sai nghĩa)", "trồng trọt (sai nghĩa)"], "tags": ["vocab"]}, {"q": "29. The landscape in this mountainous region is incredibly ________, with rolling green hills and traditional wooden stilt houses.", "options": ["vast", "dry", "well-trained", "picturesque"], "answer": 3, "explanation": "\"picturesque\" = đẹp như tranh vẽ — hợp nghĩa miêu tả phong cảnh.", "vis": ["rộng lớn (không sai nhưng chưa sát nghĩa nhất)", "khô (sai nghĩa)", "lành nghề (sai — không tả cảnh vật)", "đẹp như tranh (đúng)"], "tags": ["vocab"]}, {"q": "30. Every morning, Uncle Tom wakes up early to ________ the cows and collect fresh milk for his family.", "options": ["herd", "milk", "feed", "catch"], "answer": 1, "explanation": "\"milk the cows\" = vắt sữa bò — hợp nghĩa với \"collect fresh milk\" ngay sau đó.", "vis": ["chăn giữ (sai — không khớp \"collect fresh milk\" ngay sau)", "vắt sữa (đúng)", "cho ăn (sai nghĩa hợp lý nhưng không khớp bằng)", "bắt (sai nghĩa)"], "tags": ["vocab"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "1. Many local _________ protested against the construction of the new factory near their homes.", "hint": "(VILLAGE)", "answer": "villagers", "explanation": "Sau \"local\" và trước động từ \"protested\" cần DANH TỪ SỐ NHIỀU chỉ người → villagers.", "vi": "Nhiều người dân làng địa phương đã phản đối việc xây dựng nhà máy mới gần nhà họ.", "family": ["village (n): làng, xã", "villager (n): dân làng"]}, {"q": "2. She has a valuable ___________ of ancient coins that she has gathered over the past ten years.", "hint": "(COLLECT)", "answer": "collection", "explanation": "Sau \"a valuable\" cần DANH TỪ → collect + ion = collection.", "vi": "Cô ấy có một bộ sưu tập tiền xu cổ quý giá mà cô đã gom góp trong mười năm qua.", "family": ["collection (n): bộ sưu tập, sự thu thập", "collector (n): người sưu tầm", "collective (adj): tập thể, chung", "collectively (adv): một cách tập thể, cùng nhau"]}, {"q": "3. During the festival, the streets are always decorated _______________ with lanterns and ribbons.", "hint": "(COLOR)", "answer": "colorfully", "explanation": "Bổ nghĩa cho động từ \"decorated\" cần TRẠNG TỪ → colorfully.", "vi": "Trong lễ hội, đường phố luôn được trang trí sặc sỡ với đèn lồng và dải ruy băng.", "family": ["color (n): màu sắc", "colorful (adj): nhiều màu sắc, sặc sỡ", "colorfully (adv): một cách sặc sỡ"]}, {"q": "4. After a long, stressful week, they decided to spend a ___________ weekend in the countryside.", "hint": "(PEACE)", "answer": "peaceful", "explanation": "Bổ nghĩa cho danh từ \"weekend\" cần TÍNH TỪ → peaceful.", "vi": "Sau một tuần dài căng thẳng, họ quyết định dành một cuối tuần yên bình ở vùng quê.", "family": ["peace (n): hòa bình, sự yên bình", "peaceful (adj): yên bình, hòa bình", "peacefully (adv): một cách yên bình"]}, {"q": "5. There are many professional _______________ training hard for the upcoming cycling race.", "hint": "(RIDE)", "answer": "riders", "explanation": "Sau \"professional\" cần DANH TỪ SỐ NHIỀU chỉ người → riders.", "vi": "Có nhiều tay đua chuyên nghiệp đang tập luyện chăm chỉ cho cuộc đua xe đạp sắp tới.", "family": ["ride (n): chuyến đi, cuộc đi chơi (bằng xe)", "rider (n): người cưỡi, người đi xe", "riding (n): việc cưỡi, môn đi xe"]}, {"q": "6. Modern ____________ methods have helped to significantly increase crop yields in this region.", "hint": "(FARM)", "answer": "farming", "explanation": "Bổ nghĩa cho danh từ \"methods\" (danh từ ghép) → farming methods.", "vi": "Các phương pháp canh tác hiện đại đã giúp tăng đáng kể năng suất cây trồng ở vùng này.", "family": ["farm (n): nông trại", "farmer (n): nông dân", "farming (n): nghề nông, sự canh tác", "farmhouse (n): nhà ở nông trại"]}, {"q": "7. Many _______________ nations are facing economic challenges due to the global crisis.", "hint": "(DEVELOP)", "answer": "developing", "explanation": "Bổ nghĩa cho danh từ \"nations\" cần TÍNH TỪ → developing (đang phát triển).", "vi": "Nhiều quốc gia đang phát triển đang đối mặt với các thách thức kinh tế do khủng hoảng toàn cầu.", "family": ["development (n): sự phát triển", "developer (n): nhà phát triển", "developing (adj): đang phát triển", "developed (adj): đã phát triển"]}, {"q": "8. Because of his _______________ driving, he ended up causing a minor accident on the highway.", "hint": "(CARE)", "answer": "careless", "explanation": "Bổ nghĩa cho danh từ \"driving\" cần TÍNH TỪ mang nghĩa tiêu cực → careless (bất cẩn).", "vi": "Vì lái xe bất cẩn, anh ấy đã gây ra một vụ tai nạn nhỏ trên đường cao tốc.", "family": ["care (n): sự quan tâm, sự chăm sóc", "careful (adj): cẩn thận", "carefully (adv): một cách cẩn thận", "careless (adj): bất cẩn", "carelessly (adv): một cách bất cẩn"]}, {"q": "9. Her warmth and _______________ made everyone at the party feel extremely welcome.", "hint": "(FRIEND)", "answer": "friendliness", "explanation": "Song song với danh từ \"warmth\", cần DANH TỪ → friendliness (sự thân thiện).", "vi": "Sự ấm áp và thân thiện của cô ấy khiến mọi người ở bữa tiệc cảm thấy vô cùng được chào đón.", "family": ["friendship (n): tình bạn", "friendly (adj): thân thiện", "friendliness (n): sự thân thiện"]}, {"q": "10. _______, the Mid-Autumn Festival is celebrated on the 15th day of the eighth lunar month.", "hint": "(TRADITION)", "answer": "Traditionally", "explanation": "Đứng đầu câu, bổ nghĩa cho cả câu → TRẠNG TỪ → Traditionally.", "vi": "Theo truyền thống, Tết Trung thu được tổ chức vào ngày 15 tháng 8 âm lịch.", "family": ["tradition (n): truyền thống", "traditional (adj): thuộc về truyền thống", "traditionally (adv): theo truyền thống"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "A) A peaceful village", "html": "I live in a small village in Ninh Binh. I love the ___(1)___ peace and quiet of my village. The air is unpolluted, and the ___(2)___ of life is slow. The people in my village are friendly and hospitable. They are always willing ___(3)___ each other. We cultivate mainly rice and beans. We raise cows and buffaloes too. We can also enjoy ___(4)___ in the nearby area. It is actually a national park, so the wildlife there can live and move about ___(5)___. Every morning, I enjoy watching the sunrise over the vast rice fields and listening to the cheerful songs of birds. For me, this ___(6)___ atmosphere is an invaluable treasure that modern cities can hardly offer. All these things make me love my village more, and I intend to live here my whole life.", "vi": "Tôi sống trong một ngôi làng nhỏ ở Ninh Bình. Tôi yêu sự yên bình vùng nông thôn của làng mình. Không khí trong lành, và nhịp sống chậm rãi. Người dân trong làng thân thiện và hiếu khách, luôn sẵn lòng giúp đỡ nhau. Chúng tôi trồng chủ yếu lúa và đậu, nuôi bò và trâu. Chúng tôi cũng có thể tận hưởng thiên nhiên ở khu vực gần đó — thực chất là một vườn quốc gia, nên động vật hoang dã có thể sống và di chuyển an toàn. Mỗi sáng, tôi thích ngắm bình minh trên những cánh đồng lúa bao la và nghe tiếng chim hót. Với tôi, bầu không khí yên bình này là báu vật vô giá mà thành phố hiện đại khó có được."}, "questions": [{"q": "1.", "options": ["urban", "rural", "suburban", "metropolitan"], "answer": 1, "vis": ["thuộc đô thị", "thuộc nông thôn", "ngoại ô", "thuộc đô thị lớn"], "explanation": "\"rural peace and quiet\" = sự bình yên vùng nông thôn."}, {"q": "2.", "options": ["speed", "step", "pace", "rate"], "answer": 2, "vis": ["tốc độ (nhanh)", "bước", "nhịp độ", "tỉ lệ"], "explanation": "\"pace of life\" = nhịp sống."}, {"q": "3.", "options": ["to help", "helping", "help", "to helping"], "answer": 0, "vis": ["giúp (to-V, đúng)", "giúp (V-ing, sai)", "giúp (nguyên mẫu, sai)", "sai ngữ pháp"], "explanation": "Cấu trúc \"be willing to V\" = sẵn lòng làm gì."}, {"q": "4.", "options": ["nature", "environment", "countryside", "scenery"], "answer": 0, "vis": ["thiên nhiên (đúng)", "môi trường", "vùng quê", "phong cảnh"], "explanation": "\"enjoy nature\" = hòa mình vào thiên nhiên."}, {"q": "5.", "options": ["safe", "safety", "safely", "safer"], "answer": 2, "vis": ["an toàn (tính từ, sai)", "sự an toàn (danh từ, sai)", "một cách an toàn (đúng, trạng từ)", "an toàn hơn (sai)"], "explanation": "Trạng từ \"safely\" bổ nghĩa cho động từ \"live and move about\"."}, {"q": "6.", "options": ["bustling", "priceless", "peaceful", "rare"], "answer": 2, "vis": ["nhộn nhịp (sai nghĩa)", "vô giá (sai — từ này tả \"treasure\" không tả \"atmosphere\")", "yên bình (đúng)", "hiếm (sai nghĩa)"], "explanation": "\"peaceful atmosphere\" = bầu không khí yên bình."}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "B) Duong Lam & Hollum villages", "html": "Duong Lam, one of the most ___(1)___ villages in Ha Noi, is ___(2)___ in Son Tay. Visitors can get there from the centre of Ha Noi by car, bus or even by bicycle. It is famous ___(3)___ its ancient pagoda, traditional houses, and temples. ___(4)___ these, visitors can observe the locals ___(5)___ specialities, such as keo doi, che lam, etc. and then try them. Hollum is one of the ancient villages on the island of Ameland, the Netherlands. Many visitors come to the village because of its historical and cultural values. It is full of ___(6)___ sights, such as traditional houses, a museum, a church, a lighthouse, etc. Besides sightseeing, visitors can also take part in sports like kite-flying, surfing, etc. Visitors can reach the village by air or ferry.", "vi": "Đường Lâm, một trong những ngôi làng cổ nhất Hà Nội, nằm ở Sơn Tây. Du khách có thể đến đó từ trung tâm Hà Nội bằng ô tô, xe buýt hoặc thậm chí xe đạp. Nơi đây nổi tiếng với ngôi chùa cổ, những ngôi nhà truyền thống và các đền thờ. Bên cạnh đó, du khách có thể quan sát người dân làm các đặc sản như kẹo dồi, chè lam,... rồi thưởng thức. Hollum là một trong những ngôi làng cổ trên đảo Ameland, Hà Lan. Nhiều du khách đến làng vì giá trị lịch sử và văn hóa của nó. Nơi đây đầy những cảnh đẹp hấp dẫn như nhà truyền thống, bảo tàng, nhà thờ, hải đăng,... Ngoài tham quan, du khách còn có thể chơi các môn thể thao như thả diều, lướt sóng. Du khách có thể đến làng bằng đường hàng không hoặc phà."}, "questions": [{"q": "1.", "options": ["modern", "ancient", "crowded", "noisy"], "answer": 1, "vis": ["hiện đại", "cổ (đúng)", "đông đúc", "ồn ào"], "explanation": "\"ancient villages\" = làng cổ Đường Lâm."}, {"q": "2.", "options": ["located", "built", "designed", "decorated"], "answer": 0, "vis": ["nằm ở, tọa lạc (đúng)", "được xây", "được thiết kế", "được trang trí"], "explanation": "\"be located in\" = nằm ở/được đặt tại."}, {"q": "3.", "options": ["for", "with", "of", "by"], "answer": 0, "vis": ["vì (đúng — be famous for)", "với", "của", "bởi"], "explanation": "\"be famous for\" = nổi tiếng vì cái gì."}, {"q": "4.", "options": ["However", "Therefore", "Besides", "Although"], "answer": 2, "vis": ["tuy nhiên", "vì vậy", "bên cạnh đó (đúng)", "mặc dù"], "explanation": "\"Besides these\" = bên cạnh những điều này (thêm thông tin, không tương phản)."}, {"q": "5.", "options": ["make", "to make", "making", "made"], "answer": 0, "vis": ["làm (nguyên mẫu, đúng)", "làm (to-V, sai)", "làm (V-ing, sai)", "đã làm (sai)"], "explanation": "Cấu trúc: observe sb do sth — quan sát ai đó làm gì từ đầu đến cuối."}, {"q": "6.", "options": ["fascinating", "boring", "terrible", "ordinary"], "answer": 0, "vis": ["hấp dẫn, lôi cuốn (đúng)", "nhàm chán", "tệ hại", "bình thường"], "explanation": "\"fascinating sights\" = cảnh đẹp hấp dẫn/lôi cuốn."}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "The British countryside", "html": "Besides its beauty, the countryside of Britain is well known for its many contrasts: its bare mountains and moorland, its lakes, rivers and woods, and its long, often wild coastline. National parks which are protected from development by the government have the most beautiful and picturesque scenery. British people often associate the countryside with farmland, open spaces like fields of wheat and barley, green fields enclosed by hedges or stone walls in which cows or sheep are raised. Most farmland is now owned by individual people or independent companies. However, the government has built a network of public footpaths across the farmland. Many British people enjoy the peace and relaxation of life in the countryside where they can spend their free time walking, cycling, or going for a picnic or a pub lunch. In summer they can pick strawberries and other fruit in fruit farms. Nowadays, few rural people work on farms. Many of them commute to work in towns. Many others wish to live in the countryside so that they could have a better and healthier lifestyle.", "vi": "Bên cạnh vẻ đẹp, vùng nông thôn nước Anh nổi tiếng với nhiều sự tương phản: núi trọc và đầm lầy, hồ, sông và rừng, và bờ biển dài hoang sơ. Các vườn quốc gia được chính phủ bảo vệ khỏi sự phát triển có phong cảnh đẹp nhất. Người Anh thường liên tưởng nông thôn với đất nông nghiệp, không gian mở như cánh đồng lúa mì và lúa mạch, những cánh đồng xanh được bao quanh bởi hàng rào hoặc tường đá nơi nuôi bò hoặc cừu. Hầu hết đất nông nghiệp hiện do cá nhân hoặc công ty tư nhân sở hữu. Tuy nhiên, chính phủ đã xây dựng mạng lưới đường mòn công cộng xuyên qua các cánh đồng. Nhiều người Anh thích sự yên bình và thư giãn của cuộc sống nông thôn, nơi họ có thể đi bộ, đạp xe, hoặc đi dã ngoại. Vào mùa hè họ có thể hái dâu tây và trái cây khác. Ngày nay ít người ở nông thôn làm nông; nhiều người đi làm ở thị trấn hàng ngày. Nhiều người khác muốn sống ở nông thôn để có lối sống tốt hơn, lành mạnh hơn."}, "questions": [{"q": "1. The British countryside is known only for its beautiful scenery without any contrasts.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"well known for its many contrasts\" → có nhiều tương phản, không phải chỉ đẹp → Sai."}, {"q": "2. National parks in Britain are protected from development by the government.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"National parks which are protected from development by the government\" → Đúng."}, {"q": "3. Most farmland in Britain is owned by the government.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Most farmland is now owned by individual people or independent companies\" → cá nhân/công ty tư nhân sở hữu, không phải chính phủ → Sai."}, {"q": "4. Today, many people living in rural areas travel to work in towns every day.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Many of them commute to work in towns\" (commute = đi lại làm việc hàng ngày) → Đúng."}, {"q": "5. What is the main idea of the passage?", "options": ["The history of British farmland ownership.", "The contrasts, features, and lifestyle in the British countryside.", "The best outdoor activities for British people.", "The reasons why national parks are famous."], "answer": 1, "explanation": "Bài đọc tổng quát về sự tương phản, đặc điểm và lối sống ở nông thôn Anh."}, {"q": "6. According to the passage, what do British people usually associate the countryside with?", "options": ["Only national parks and wild coastlines.", "Farmland, open spaces, and green fields enclosed by hedges or stone walls.", "Modern buildings and busy roads.", "Large forests without any farms."], "answer": 1, "explanation": "Bài đọc: \"British people often associate the countryside with farmland, open spaces...\"."}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "The American countryside", "html": "Few Americans live in the areas of wild and beautiful scenery, like the Western states of Montana and Colorado. We often see small farms surrounded by hills and green areas in the New England states, such as Vermont and New Hampshire. In Ohio, Indiana, Illinois, and other Midwestern states, there are very large fields of corn or wheat with great distances between towns. About a quarter of Americans live outside cities and towns because life there is harder. Shops, post offices, hospitals, schools, etc. may be further away and it takes rural people a very long time to get there. However, many people choose to live in the countryside because of its safe, clean, and attractive environment. But their children often move to a town or city when they grow up.", "vi": "Rất ít người Mỹ sống ở các vùng có phong cảnh hoang sơ tuyệt đẹp như các bang miền Tây Montana và Colorado. Ta thường thấy các nông trại nhỏ được bao quanh bởi đồi và vùng xanh ở các bang New England như Vermont và New Hampshire. Ở Ohio, Indiana, Illinois và các bang Trung Tây khác, có những cánh đồng ngô hoặc lúa mì rất lớn với khoảng cách xa giữa các thị trấn. Khoảng một phần tư người Mỹ sống ngoài thành phố và thị trấn vì cuộc sống ở đó khó khăn hơn. Cửa hàng, bưu điện, bệnh viện, trường học,... có thể ở xa hơn và người dân nông thôn mất nhiều thời gian để đến đó. Tuy nhiên, nhiều người chọn sống ở nông thôn vì môi trường an toàn, sạch sẽ và hấp dẫn. Nhưng con cái họ thường chuyển đến thị trấn hoặc thành phố khi lớn lên."}, "questions": [{"q": "1. A large number of people live in the areas in the West, such as Montana and Colorado.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Few Americans live...\" → rất ít người, không phải \"a large number\" → Sai."}, {"q": "2. There are very large fields of corn or wheat in Ohio, Indiana, Illinois, and other Midwestern states.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"there are very large fields of corn or wheat...\" → Đúng."}, {"q": "3. The majority of Americans live outside cities or towns.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"About a quarter of Americans live outside...\" → chỉ khoảng 1/4, không phải đa số → Sai."}, {"q": "4. Many Americans choose to live in the countryside because everything is convenient there.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"...because of its safe, clean, and attractive environment\" → vì môi trường an toàn sạch sẽ, không phải vì tiện nghi (bài còn nói xa trường học/bệnh viện) → Sai."}, {"q": "5. What is the passage mainly about?", "options": ["The most beautiful states in the USA.", "The agricultural products of the Midwest.", "Where Americans live and why they choose to live there.", "The reasons why children leave the countryside."], "answer": 2, "explanation": "Bài đọc nói chung về nơi người Mỹ sinh sống và lý do họ chọn nơi đó."}, {"q": "6. What happens to many children of rural Americans when they grow up according to the passage?", "options": ["They stay in the countryside to work on farms.", "They often move to a town or city.", "They build more schools in rural areas.", "They travel a long way to go to school."], "answer": 1, "explanation": "Bài đọc: \"their children often move to a town or city when they grow up\"."}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "1.", "original": "Minh is a better swimmer than Hieu.", "starter": "Minh swims", "answer": "better than Hieu", "accepted": null, "explanation": "be + a + so sánh hơn (adj) + N + than B → V + so sánh hơn (adv) + than B. \"good→better\" là dạng bất quy tắc.", "vi": "Minh bơi giỏi hơn Hiếu.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"q": "2.", "original": "Hoa is a more careful taxi driver than Nam.", "starter": "Hoa drives", "answer": "more carefully than Nam", "accepted": ["more carefully than Nam", "a taxi more carefully than Nam"], "explanation": "\"careful\" là tính từ dài → trạng từ tương ứng \"carefully\" cũng dùng \"more\" khi so sánh hơn.", "vi": "Hoa lái taxi cẩn thận hơn Nam.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"q": "3.", "original": "Mr Thanh is a quicker English speaker than I.", "starter": "Mr Thanh speaks", "answer": "English more quickly than I do", "accepted": ["English more quickly than I do", "English more quickly than me"], "explanation": "\"quick\" là tính từ ngắn nhưng trạng từ tương ứng \"quickly\" có đuôi -ly (được xem là trạng từ dài) → dùng \"more quickly\".", "vi": "Ông Thanh nói tiếng Anh nhanh hơn tôi.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"q": "4.", "original": "Minh is a better typist than Hieu.", "starter": "Minh types", "answer": "better than Hieu", "accepted": null, "explanation": "\"good→better\" là dạng so sánh bất quy tắc của trạng từ \"well\".", "vi": "Minh đánh máy giỏi hơn Hiếu.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"q": "5.", "original": "Nam is a more wonderful tennis player than his brother.", "starter": "Nam plays", "answer": "tennis more wonderfully than his brother", "accepted": null, "explanation": "\"wonderful\" là tính từ dài → trạng từ \"wonderfully\" cũng dùng \"more\" khi so sánh hơn.", "vi": "Nam chơi tennis giỏi hơn anh trai mình.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"q": "6.", "original": "Mono dances more beautifully than Son Tung.", "starter": "Mono is a", "answer": "more beautiful dancer than Son Tung", "accepted": null, "explanation": "Chiều ngược lại: V + so sánh hơn (adv) + than B → be + a + so sánh hơn (adj) + N + than B.", "vi": "Mono nhảy đẹp hơn Sơn Tùng.", "note": "A + V + so sánh hơn (adv) + than B → A + be + a/an + so sánh hơn (adj) + N + than B"}, {"q": "7.", "original": "Jane is a more beautiful dancer than Huy.", "starter": "Jane dances", "answer": "more beautifully than Huy", "accepted": null, "explanation": "\"beautiful\" là tính từ dài → trạng từ \"beautifully\" cũng dùng \"more\".", "vi": "Jane nhảy đẹp hơn Huy.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"q": "8.", "original": "Julie is a slower runner than I do.", "starter": "Julie runs", "answer": "more slowly than I do", "accepted": ["more slowly than I do", "more slowly than me"], "explanation": "\"slow\" là tính từ ngắn nhưng trạng từ \"slowly\" có đuôi -ly → dùng \"more slowly\".", "vi": "Julie chạy chậm hơn tôi.", "note": "A + be + a/an + so sánh hơn (adj) + N + than B → A + V + so sánh hơn (adv) + than B"}, {"q": "9.", "original": "It takes us an hour to run in the morning.", "starter": "We spend", "answer": "an hour running in the morning", "accepted": null, "explanation": "It takes + O + time + to V = S + spend + time + V-ing.", "vi": "Chúng tôi mất một tiếng để chạy bộ vào buổi sáng.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"q": "10.", "original": "It takes my father two hours to repair his motorbike.", "starter": "My father spends", "answer": "two hours repairing his motorbike", "accepted": null, "explanation": "It takes + O + time + to V = S + spend + time + V-ing.", "vi": "Bố tôi mất hai tiếng để sửa xe máy.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"q": "11.", "original": "It takes me 20 minutes to cook dinner every evening.", "starter": "I spend", "answer": "20 minutes cooking dinner every evening", "accepted": null, "explanation": "It takes + O + time + to V = S + spend + time + V-ing.", "vi": "Tôi mất 20 phút để nấu bữa tối mỗi tối.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"q": "12.", "original": "It took her 3 hours to finish the English test.", "starter": "She spent", "answer": "3 hours finishing the English test", "accepted": null, "explanation": "Ở thì quá khứ: It took + O + time + to V = S + spent + time + V-ing.", "vi": "Cô ấy mất 3 tiếng để làm xong bài kiểm tra tiếng Anh.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}, {"q": "13.", "original": "It took us a lot of effort to finish this project on time.", "starter": "We spent", "answer": "a lot of effort finishing this project on time", "accepted": null, "explanation": "Ở thì quá khứ: It took + O + time/effort + to V = S + spent + time/effort + V-ing.", "vi": "Chúng tôi đã tốn rất nhiều công sức để hoàn thành dự án đúng hạn.", "note": "S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V"}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"important\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "important", "ipa": "/ɪmˈpɔːtnt/", "pos": "adjective", "senses": [{"def": "having a great effect on people or things; of great value", "examples": ["Money played an important role in his life.", "The important thing is to keep trying.", "Many chemicals are important for our health.", "It is important to follow the manufacturer's instructions."]}], "vi": "<b>important</b> /ɪmˈpɔːtnt/ (tính từ)<br>có ảnh hưởng lớn tới người hoặc vật; có giá trị lớn.<br>• Tiền bạc đóng vai trò quan trọng trong cuộc đời anh ấy.<br>• Điều quan trọng là tiếp tục cố gắng.<br>• Nhiều hóa chất quan trọng đối với sức khỏe của chúng ta.<br>• Điều quan trọng là làm theo hướng dẫn của nhà sản xuất."}, "questions": [{"q": "A. Teachers play an ______________________ in shaping the future of students.", "answer": "important role", "explanation": "Dựa vào ví dụ: important role.", "vi": "Giáo viên đóng vai trò quan trọng trong việc định hình tương lai của học sinh."}, {"q": "B. It is ______________________ remember the traffic rules when riding a bike in the street.", "answer": "important to", "explanation": "Dựa vào ví dụ: important to.", "vi": "Điều quan trọng là phải nhớ luật giao thông khi đi xe đạp trên đường."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"health\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "health", "ipa": "/helθ/", "pos": "noun", "senses": [{"def": "the condition of a person's body or mind", "examples": ["Exhaust fumes are bad for your health.", "We are both in excellent health.", "Here are some simple ways to improve your health and fitness.", "There is no threat to public health from this paint."]}], "vi": "<b>health</b> /helθ/ (danh từ)<br>tình trạng cơ thể hoặc tinh thần của một người.<br>• Khí thải có hại cho sức khỏe của bạn.<br>• Cả hai chúng tôi đều có sức khỏe tuyệt vời.<br>• Đây là một số cách đơn giản để cải thiện sức khỏe và thể lực.<br>• Không có mối đe dọa nào tới sức khỏe cộng đồng từ loại sơn này."}, "questions": [{"q": "A. Eating too much fast food is __________ because it contains a lot of fat and sugar.", "answer": "bad for your health", "explanation": "Dựa vào ví dụ: bad for your health.", "vi": "Ăn quá nhiều thức ăn nhanh có hại cho sức khỏe vì chứa nhiều chất béo và đường."}, {"q": "B. After months of regular exercise and a balanced diet, she is now __________ and feels energetic every day.", "answer": "in excellent health", "explanation": "Dựa vào ví dụ: in excellent health.", "vi": "Sau nhiều tháng tập luyện đều đặn và ăn uống cân bằng, cô ấy hiện có sức khỏe tuyệt vời và cảm thấy tràn đầy năng lượng mỗi ngày."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫🖐️</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">DO NOT TOUCH</p></div>", "options": ["Be aware of pickpocketing.", "You are not allowed to touch this.", "You are allowed to take money here.", "Don't pick up trash."], "answer": 1, "vis": ["Cẩn thận móc túi.", "Bạn không được phép chạm vào cái này.", "Bạn được phép lấy tiền ở đây.", "Đừng nhặt rác."], "explanation": "Biểu tượng bàn tay gạch chéo → không được phép chạm vào."}, {"q": "2. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🚫📷</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO PHOTOGRAPHS</p></div>", "options": ["Should take photographs here.", "You can take photographs here.", "You don't have to take photographs here.", "You must not take photographs here."], "answer": 3, "vis": ["Nên chụp ảnh ở đây.", "Bạn có thể chụp ảnh ở đây.", "Bạn không cần phải chụp ảnh ở đây.", "Bạn không được chụp ảnh ở đây."], "explanation": "Biểu tượng máy ảnh gạch chéo → cấm chụp ảnh."}, {"q": "3. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🅿️⏰</div><p class=\"text-[11px] font-black text-center text-amber-800 leading-tight\">NO PARKING 8:30-17:30</p></div>", "options": ["This is not a parking place.", "You can't park here from 8:30 a.m. to 5:30 p.m.", "You can park here only from 8:30 a.m. to 5:30 p.m.", "You have to pay a fee if you want to park here."], "answer": 1, "vis": ["Đây không phải chỗ đỗ xe.", "Bạn không được đỗ xe ở đây từ 8h30 đến 17h30.", "Bạn chỉ được đỗ xe ở đây từ 8h30 đến 17h30.", "Bạn phải trả phí nếu muốn đỗ xe ở đây."], "explanation": "Biển \"P\" kèm khung giờ → cấm đỗ trong khoảng giờ đó."}, {"q": "4. What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-emerald-300 rounded-xl p-3 shadow-sm\"><div class=\"text-4xl mb-1\">🔌🚗</div><p class=\"text-[11px] font-black text-center text-emerald-800 leading-tight\">ELECTRIC VEHICLES ONLY</p></div>", "options": ["All vehicles are not allowed to park here.", "Drivers must not go on this way.", "There is a shop selling electric vehicles ahead.", "Only electric cars can be parked at this place."], "answer": 3, "vis": ["Mọi xe đều không được đỗ ở đây.", "Tài xế không được đi vào đường này.", "Phía trước có cửa hàng bán xe điện.", "Chỉ xe điện mới được đỗ tại chỗ này."], "explanation": "Biểu tượng phích cắm điện + ô tô → chỉ xe điện được đỗ ở đây."}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 2", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 2 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>cultivate</b> <span class='text-slate-400'>/ˈkʌltɪveɪt/</span> · <b class='text-slate-500'>unload</b> <span class='text-slate-400'>/ʌnˈləʊd/</span> · <b class='text-slate-500'>muscle</b> <span class='text-slate-400'>/ˈmʌsl/</span> · <b class='text-emerald-700'>cruel</b> <span class='text-slate-400'>/ˈkruːəl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"cruel\" phát âm /uː/, ba từ còn lại phát âm /ʌ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-emerald-700'>hoped</b> <span class='text-slate-400'>/hoʊpt/</span> · <b class='text-slate-500'>played</b> <span class='text-slate-400'>/pleɪd/</span> · <b class='text-slate-500'>used</b> <span class='text-slate-400'>/juːzd/</span> · <b class='text-slate-500'>cleaned</b> <span class='text-slate-400'>/kliːnd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"hoped\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /d/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>pick</b> <span class='text-slate-400'>/pɪk/</span> · <b class='text-emerald-700'>combine</b> <span class='text-slate-400'>/kəmˈbaɪn/</span> · <b class='text-slate-500'>live</b> <span class='text-slate-400'>/lɪv/</span> · <b class='text-slate-500'>village</b> <span class='text-slate-400'>/ˈvɪlɪdʒ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"combine\" có \"i\" phát âm /aɪ/, ba từ còn lại phát âm /ɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>spread</b> <span class='text-slate-400'>/spred/</span> · <b class='text-slate-500'>ready</b> <span class='text-slate-400'>/ˈredi/</span> · <b class='text-emerald-700'>seaside</b> <span class='text-slate-400'>/ˈsiːsaɪd/</span> · <b class='text-slate-500'>heavy</b> <span class='text-slate-400'>/ˈhevi/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"seaside\" có \"ea\" phát âm /iː/, ba từ còn lại phát âm /e/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>books</b> <span class='text-slate-400'>/bʊks/</span> · <b class='text-emerald-700'>clubs</b> <span class='text-slate-400'>/klʌbz/</span> · <b class='text-slate-500'>hats</b> <span class='text-slate-400'>/hæts/</span> · <b class='text-slate-500'>stamp</b> <span class='text-slate-400'>/stæmp/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"clubs\" có đuôi \"-s\" phát âm /z/, các từ còn lại phát âm /s/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-emerald-700'>kids</b> <span class='text-slate-400'>/kɪdz/</span> · <b class='text-slate-500'>crops</b> <span class='text-slate-400'>/krɒps/</span> · <b class='text-slate-500'>banks</b> <span class='text-slate-400'>/bæŋks/</span> · <b class='text-slate-500'>harvests</b> <span class='text-slate-400'>/ˈhɑːvɪsts/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"kids\" có đuôi \"-s\" phát âm /z/, ba từ còn lại phát âm /s/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>7. <b class='text-emerald-700'>heading</b> <span class='text-slate-400'>/ˈhedɪŋ/</span> · <b class='text-slate-500'>reading</b> <span class='text-slate-400'>/ˈriːdɪŋ/</span> · <b class='text-slate-500'>cleaning</b> <span class='text-slate-400'>/ˈkliːnɪŋ/</span> · <b class='text-slate-500'>teaching</b> <span class='text-slate-400'>/ˈtiːtʃɪŋ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"heading\" có \"ea\" phát âm /e/, ba từ còn lại phát âm /iː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>8. <b class='text-slate-500'>laugh</b> <span class='text-slate-400'>/læf/</span> · <b class='text-slate-500'>rough</b> <span class='text-slate-400'>/rʌf/</span> · <b class='text-emerald-700'>plough</b> <span class='text-slate-400'>/plaʊ/</span> · <b class='text-slate-500'>enough</b> <span class='text-slate-400'>/ɪˈnʌf/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"plough\" có \"gh\" câm (không phát âm), ba từ còn lại phát âm /f/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>9. <b class='text-slate-500'>catch</b> <span class='text-slate-400'>/kætʃ/</span> · <b class='text-slate-500'>cattle</b> <span class='text-slate-400'>/ˈkætl/</span> · <b class='text-emerald-700'>vast</b> <span class='text-slate-400'>/vɑːst/</span> · <b class='text-slate-500'>paddy</b> <span class='text-slate-400'>/ˈpædi/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"vast\" phát âm /ɑː/, ba từ còn lại phát âm /æ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>10. <b class='text-emerald-700'>looked</b> <span class='text-slate-400'>/lʊkt/</span> · <b class='text-slate-500'>cultivated</b> <span class='text-slate-400'>/ˈkʌltɪveɪtɪd/</span> · <b class='text-slate-500'>herded</b> <span class='text-slate-400'>/ˈhɜːdɪd/</span> · <b class='text-slate-500'>unloaded</b> <span class='text-slate-400'>/ʌnˈləʊdɪd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"looked\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /ɪd/.</p></div></div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Trọng âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>cattle</b> <span class='text-slate-400'>/ˈkætl/</span> · <b class='text-slate-500'>ferry</b> <span class='text-slate-400'>/ˈferi/</span> · <b class='text-emerald-700'>collect</b> <span class='text-slate-400'>/kəˈlekt/</span> · <b class='text-slate-500'>orchard</b> <span class='text-slate-400'>/ˈɔːtʃəd/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"collect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>cultivate</b> <span class='text-slate-400'>/ˈkʌltɪveɪt/</span> · <b class='text-emerald-700'>develop</b> <span class='text-slate-400'>/dɪˈveləp/</span> · <b class='text-slate-500'>villager</b> <span class='text-slate-400'>/ˈvɪlɪdʒər/</span> · <b class='text-slate-500'>farmhouse</b> <span class='text-slate-400'>/ˈfɑːmhaʊs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"develop\" trọng âm rơi vào âm tiết 2, ba từ còn lại
