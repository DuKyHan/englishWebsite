 trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>tradition</b> <span class='text-slate-400'>/trəˈdɪʃn/</span> · <b class='text-slate-500'>collection</b> <span class='text-slate-400'>/kəˈlekʃn/</span> · <b class='text-emerald-700'>picturesque</b> <span class='text-slate-400'>/ˌpɪktʃəˈresk/</span> · <b class='text-slate-500'>developer</b> <span class='text-slate-400'>/dɪˈveləpər/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"picturesque\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>lighthouse</b> <span class='text-slate-400'>/ˈlaɪthaʊs/</span> · <b class='text-emerald-700'>unload</b> <span class='text-slate-400'>/ʌnˈləʊd/</span> · <b class='text-slate-500'>friendly</b> <span class='text-slate-400'>/ˈfrendli/</span> · <b class='text-slate-500'>harvest</b> <span class='text-slate-400'>/ˈhɑːvɪst/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"unload\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-emerald-700'>collective</b> <span class='text-slate-400'>/kəˈlektɪv/</span> · <b class='text-slate-500'>carefully</b> <span class='text-slate-400'>/ˈkeəfəli/</span> · <b class='text-slate-500'>carefully</b> <span class='text-slate-400'>/ˈkeəfəli/</span> · <b class='text-slate-500'>friendliness</b> <span class='text-slate-400'>/ˈfrendlinəs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"collective\" trọng âm rơi vào âm tiết 2, ba từ/cụm còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>6. <b class='text-slate-500'>traditional</b> <span class='text-slate-400'>/trəˈdɪʃənl/</span> · <b class='text-slate-500'>hospitable</b> <span class='text-slate-400'>/ˈhɒspɪtəbl/</span> · <b class='text-slate-500'>development</b> <span class='text-slate-400'>/dɪˈveləpmənt/</span> · <b class='text-emerald-700'>speciality</b> <span class='text-slate-400'>/ˌspeʃiˈæləti/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"speciality\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>7. <b class='text-emerald-700'>collector</b> <span class='text-slate-400'>/kəˈlektər/</span> · <b class='text-slate-500'>colorful</b> <span class='text-slate-400'>/ˈkʌlərfl/</span> · <b class='text-slate-500'>farmer</b> <span class='text-slate-400'>/ˈfɑːmər/</span> · <b class='text-slate-500'>friendship</b> <span class='text-slate-400'>/ˈfrendʃɪp/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"collector\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>8. <b class='text-slate-500'>agricultural</b> <span class='text-slate-400'>/ˌæɡrɪˈkʌltʃərəl/</span> · <b class='text-slate-500'>picturesque</b> <span class='text-slate-400'>/ˌpɪktʃəˈresk/</span> · <b class='text-slate-500'>speciality</b> <span class='text-slate-400'>/ˌspeʃiˈæləti/</span> · <b class='text-emerald-700'>hospitable</b> <span class='text-slate-400'>/ˈhɒspɪtəbl/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"hospitable\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 3.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>9. <b class='text-slate-500'>develop</b> <span class='text-slate-400'>/dɪˈveləp/</span> · <b class='text-slate-500'>traditional</b> <span class='text-slate-400'>/trəˈdɪʃənl/</span> · <b class='text-emerald-700'>carefully</b> <span class='text-slate-400'>/ˈkeəfəli/</span> · <b class='text-slate-500'>collectively</b> <span class='text-slate-400'>/kəˈlektɪvli/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"carefully\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>10. <b class='text-slate-500'>villager</b> <span class='text-slate-400'>/ˈvɪlɪdʒər/</span> · <b class='text-slate-500'>carefully</b> <span class='text-slate-400'>/ˈkeəfəli/</span> · <b class='text-emerald-700'>collector</b> <span class='text-slate-400'>/kəˈlektər/</span> · <b class='text-slate-500'>farming</b> <span class='text-slate-400'>/ˈfɑːmɪŋ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"collector\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>So sánh hơn của trạng từ (Comparative forms of adverbs)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Trạng từ dùng để bổ nghĩa cho động từ, tính từ hoặc trạng từ khác. Dùng để so sánh mức độ/cách thực hiện hành động giữa hai đối tượng.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trạng từ NGẮN (1 âm tiết)</th><th class=\"border px-2 py-1\">Trạng từ DÀI (≥2 âm tiết, thường đuôi -ly)</th></tr>\n      <tr><td class=\"border px-2 py-1 italic\">hard (chăm chỉ), fast (nhanh), near (gần), late (muộn)</td><td class=\"border px-2 py-1 italic\">quickly (nhanh chóng), interestingly (thú vị), carefully (cẩn thận)</td></tr>\n    </table>\n    </div>\n    <div class=\"mt-3 space-y-2 text-sm text-slate-700\">\n      <p><b>So sánh hơn với trạng từ NGẮN:</b> thêm đuôi <b>-ER</b>.<br><i>Cấu trúc: S1 + V + adv-er + than + S2 (+ auxiliary V) / O</i><br><i>VD: They work harder than I do. = They work harder than me. (Họ làm việc chăm chỉ hơn tôi.)</i></p>\n      <p><b>So sánh hơn với trạng từ DÀI:</b> thêm <b>MORE</b> trước trạng từ.<br><i>Cấu trúc: S1 + V + more + adv + than + S2 (+ auxiliary V) / O</i><br><i>VD: My friend did the test more carefully than I did. = My friend did the test more carefully than me. (Bạn tôi làm bài kiểm tra cẩn thận hơn tôi.)</i></p>\n    </div>\n    <div class=\"overflow-x-auto mt-3\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Trạng từ bất quy tắc</th><th class=\"border px-2 py-1\">So sánh hơn</th></tr>\n      <tr><td class=\"border px-2 py-1\">well (giỏi, tốt)</td><td class=\"border px-2 py-1 font-bold\">better</td></tr>\n      <tr><td class=\"border px-2 py-1\">badly (tệ, kém)</td><td class=\"border px-2 py-1 font-bold\">worse</td></tr>\n      <tr><td class=\"border px-2 py-1\">much/many (nhiều)</td><td class=\"border px-2 py-1 font-bold\">more</td></tr>\n      <tr><td class=\"border px-2 py-1\">a little/little (ít)</td><td class=\"border px-2 py-1 font-bold\">less</td></tr>\n      <tr><td class=\"border px-2 py-1\">far (xa)</td><td class=\"border px-2 py-1 font-bold\">farther/further</td></tr>\n    </table>\n    </div>\n  </div>\n\n  <div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>She writes more quicker than me.</s> ❌ → <b>She writes more quickly than me.</b> ✅ — không dùng cả \"more\" và \"-er\" cùng lúc.</li>\n      <li><s>He runs gooder than his brother.</s> ❌ → <b>He runs better than his brother.</b> ✅ — \"well\" so sánh hơn là \"better\", không phải \"gooder\".</li>\n      <li><s>This is the most busiest city.</s> ❌ → <b>This is the busiest city.</b> ✅ — tính từ ngắn chỉ thêm \"-est\", không thêm cả \"most\".</li>\n      <li><s>I spend two hours to read books.</s> ❌ → <b>I spend two hours reading books.</b> ✅ — \"spend + time\" đi với V-ing.</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Trạng từ ngắn: adv + ER\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">Trạng từ ngắn: <b>adv + ER</b></p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"Trạng từ dài: MORE + adv\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">Trạng từ dài: <b>MORE + adv</b></p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"A + be + a/an + so sánh hơn (adj) + N + than B = A + V + so sánh hơn (adv) + than B\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 3</p>\n      <p class=\"text-sm text-slate-700\">A + be + a/an + adj-er/more adj + N + than B<br>= A + V + adv-er/more adv + than B</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + spend(s)/spent + time + V-ing = It takes/took + O + time + to V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 4</p>\n      <p class=\"text-sm text-slate-700\">S + spend(s)/spent + time + V-ing<br>= It takes/took + O + time + to V</p>\n    </div>\n  </div>\n\n  <div class=\"bg-amber-50 border border-amber-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-amber-800 mb-2\"><i class=\"fa-solid fa-lightbulb mr-1\"></i>Áp dụng phương pháp 6 bước (xem tab \"Cách viết lại câu\") vào bài này</p>\n    <p class=\"text-sm text-slate-700\">Ví dụ: <i>\"Minh is a better swimmer than Hieu.\"</i> → chuyển từ dạng \"be + adj + N\" sang dạng \"V + adv\" → giữ nguyên so sánh bất quy tắc \"better\" → <b>Minh swims better than Hieu.</b></p>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Ngữ pháp</p>\n  <div id=\"miniquiz-grammar\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-grammar\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Word Formation</p>\n  <div id=\"miniquiz-wf\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-wf\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n<div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. catch</span><span class='text-slate-400 text-xs'>(v) /kætʃ/</span><span class='text-slate-500 text-xs ml-auto'>đánh được, câu được (cá)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. cattle</span><span class='text-slate-400 text-xs'>(n) /ˈkætl/</span><span class='text-slate-500 text-xs ml-auto'>gia súc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. combine harvester</span><span class='text-slate-400 text-xs'>(n) /ˈkɒmbaɪn ˈhɑːvɪstə/</span><span class='text-slate-500 text-xs ml-auto'>máy gặt đập liên hợp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. crop</span><span class='text-slate-400 text-xs'>(n) /krɒp/</span><span class='text-slate-500 text-xs ml-auto'>vụ, mùa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. cultivate</span><span class='text-slate-400 text-xs'>(v) /ˈkʌltɪveɪt/</span><span class='text-slate-500 text-xs ml-auto'>trồng trọt</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. dry</span><span class='text-slate-400 text-xs'>(v) /draɪ/</span><span class='text-slate-500 text-xs ml-auto'>phơi khô, sấy khô</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. feed</span><span class='text-slate-400 text-xs'>(v) /fiːd/</span><span class='text-slate-500 text-xs ml-auto'>cho ăn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. ferry</span><span class='text-slate-400 text-xs'>(n) /ˈferi/</span><span class='text-slate-500 text-xs ml-auto'>phà</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. harvest</span><span class='text-slate-400 text-xs'>(n, v) /ˈhɑːvɪst/</span><span class='text-slate-500 text-xs ml-auto'>vụ thu hoạch, thu hoạch</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. herd</span><span class='text-slate-400 text-xs'>(v) /hɜːd/</span><span class='text-slate-500 text-xs ml-auto'>chăn giữ vật nuôi</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. hospitable</span><span class='text-slate-400 text-xs'>(adj) /ˈhɒspɪtəbl/</span><span class='text-slate-500 text-xs ml-auto'>mến khách, hiếu khách</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. lighthouse</span><span class='text-slate-400 text-xs'>(n) /ˈlaɪthaʊs/</span><span class='text-slate-500 text-xs ml-auto'>đèn biển, hải đăng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. load</span><span class='text-slate-400 text-xs'>(v) /ləʊd/</span><span class='text-slate-500 text-xs ml-auto'>chất, chở</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. milk</span><span class='text-slate-400 text-xs'>(v) /mɪlk/</span><span class='text-slate-500 text-xs ml-auto'>vắt sữa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. orchard</span><span class='text-slate-400 text-xs'>(n) /ˈɔːtʃəd/</span><span class='text-slate-500 text-xs ml-auto'>vườn cây ăn quả</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. paddy field</span><span class='text-slate-400 text-xs'>(n) /ˈpædi fiːld/</span><span class='text-slate-500 text-xs ml-auto'>ruộng lúa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. picturesque</span><span class='text-slate-400 text-xs'>(adj) /ˌpɪktʃəˈresk/</span><span class='text-slate-500 text-xs ml-auto'>đẹp, hấp dẫn (phong cảnh)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. plough</span><span class='text-slate-400 text-xs'>(v) /plaʊ/</span><span class='text-slate-500 text-xs ml-auto'>cày (thửa ruộng)</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. speciality</span><span class='text-slate-400 text-xs'>(n) /ˌspeʃiˈæləti/</span><span class='text-slate-500 text-xs ml-auto'>đặc sản</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. stretch</span><span class='text-slate-400 text-xs'>(v) /stretʃ/</span><span class='text-slate-500 text-xs ml-auto'>kéo dài ra</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. unload</span><span class='text-slate-400 text-xs'>(v) /ˌʌnˈləʊd/</span><span class='text-slate-500 text-xs ml-auto'>dỡ hàng</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. vast</span><span class='text-slate-400 text-xs'>(adj) /vɑːst/</span><span class='text-slate-500 text-xs ml-auto'>rộng lớn, mênh mông, bao la</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>23. well-trained</span><span class='text-slate-400 text-xs'>(adj) /ˌwel ˈtreɪnd/</span><span class='text-slate-500 text-xs ml-auto'>lành nghề, có tay nghề</span></div></div></div>"}], "miniQuizzes": {"sEs": [{"q": "Từ nào có đuôi \"-s\" phát âm khác với 3 từ còn lại?", "options": ["books", "cats", "buses", "maps"], "answer": 2, "explanation": "\"buses\" tận cùng bằng /s/ → thêm \"-es\" đọc /ɪz/. Ba từ còn lại tận cùng phụ âm vô thanh (k, t, p) → đọc /s/."}, {"q": "Từ nào có đuôi \"-s\" phát âm là /z/?", "options": ["plays", "helps", "asks", "laughs"], "answer": 0, "explanation": "\"plays\" tận cùng nguyên âm + phụ âm hữu thanh → đọc /z/. Ba từ còn lại tận cùng phụ âm vô thanh → đọc /s/."}, {"q": "Từ nào có đuôi \"-es\" phát âm là /ɪz/?", "options": ["loves", "washes", "drinks", "hopes"], "answer": 1, "explanation": "\"washes\" tận cùng bằng /ʃ/ (âm \"sh\") → thêm \"-es\" đọc /ɪz/. Ba từ còn lại đọc /z/ hoặc /s/."}, {"q": "Từ nào có đuôi \"-s/-es\" phát âm KHÁC với 3 từ còn lại?", "options": ["dishes", "boxes", "cups", "watches"], "answer": 2, "explanation": "\"cups\" tận cùng phụ âm vô thanh /p/ → đọc /s/. Ba từ còn lại tận cùng /ʃ/, /ks/, /tʃ/ → đều đọc /ɪz/."}], "ed": [{"q": "Từ nào có đuôi \"-ed\" phát âm là /ɪd/?", "options": ["worked", "played", "wanted", "laughed"], "answer": 2, "explanation": "\"wanted\" có động từ gốc tận cùng bằng /t/ → thêm \"-ed\" đọc /ɪd/. Ba từ còn lại đọc /t/ hoặc /d/."}, {"q": "Từ nào có đuôi \"-ed\" phát âm là /t/?", "options": ["cleaned", "watched", "loved", "opened"], "answer": 1, "explanation": "\"watched\" tận cùng bằng /tʃ/ (âm vô thanh) → đọc /t/. Ba từ còn lại tận cùng phụ âm/nguyên âm hữu thanh → đọc /d/."}, {"q": "Từ nào có đuôi \"-ed\" phát âm là /d/?", "options": ["helped", "stopped", "lived", "talked"], "answer": 2, "explanation": "\"lived\" tận cùng bằng /v/ (âm hữu thanh) → đọc /d/. Ba từ còn lại tận cùng phụ âm vô thanh → đọc /t/."}, {"q": "Từ nào có đuôi \"-ed\" phát âm KHÁC với 3 từ còn lại?", "options": ["needed", "decided", "visited", "washed"], "answer": 3, "explanation": "\"washed\" tận cùng bằng /ʃ/ (vô thanh) → đọc /t/. Ba từ còn lại có động từ gốc tận cùng /d/ hoặc /t/ → đọc /ɪd/."}], "stress": [{"q": "Từ nào có trọng âm rơi vào âm tiết THỨ HAI?", "options": ["TABLE", "HAPPY", "enJOY", "GARden"], "answer": 2, "explanation": "\"enjoy\" là động từ 2 âm tiết, theo xu hướng chung động từ thường nhấn âm tiết thứ hai. Ba từ còn lại là danh từ/tính từ, nhấn âm tiết đầu."}, {"q": "Từ nào có trọng âm rơi vào âm tiết ĐẦU TIÊN (đúng xu hướng danh từ)?", "options": ["reLAX", "PICture", "deCIDE", "reCEIVE"], "answer": 1, "explanation": "\"picture\" là danh từ 2 âm tiết, nhấn âm tiết đầu theo xu hướng chung. Ba từ còn lại là động từ, nhấn âm tiết thứ hai."}, {"q": "Cặp từ nào thể hiện đúng quy tắc \"danh từ nhấn âm 1 - động từ nhấn âm 2\"?", "options": ["PRESent (danh từ) / preSENT (động từ)", "preSENT (danh từ) / PRESent (động từ)", "Cả hai đều giống nhau", "Không có quy tắc nào đúng"], "answer": 0, "explanation": "Với các cặp từ vừa là danh từ vừa là động từ, danh từ thường nhấn âm 1 (PRESent = món quà), động từ thường nhấn âm 2 (preSENT = trình bày)."}, {"q": "Từ nào là NGOẠI LỆ của quy tắc \"động từ 2 âm tiết thường nhấn âm thứ hai\"?", "options": ["enjoy", "relax", "open", "prefer"], "answer": 2, "explanation": "\"open\" là động từ nhưng trọng âm lại rơi vào âm tiết ĐẦU (OPen), khác với xu hướng chung của enjoy, relax, prefer (đều nhấn âm 2)."}], "grammar": [{"q": "1. Trạng từ ngắn (1 âm tiết) khi so sánh hơn thường thêm gì?", "options": ["-ER", "MORE + adv", "-EST", "không đổi"], "answer": 0, "explanation": "Trạng từ ngắn (fast, hard, late...) thêm đuôi -ER khi so sánh hơn.", "vi": "VD: fast → faster."}, {"q": "2. Trạng từ dài (thường có đuôi -ly) khi so sánh hơn dùng cấu trúc nào?", "options": ["adv + ER", "MORE + adv", "adv + EST", "MOST + adv"], "answer": 1, "explanation": "Trạng từ dài dùng MORE đứng trước, không thêm đuôi -ER.", "vi": "VD: carefully → more carefully."}, {"q": "3. So sánh hơn của trạng từ \"well\" là gì?", "options": ["weller", "more well", "better", "gooder"], "answer": 2, "explanation": "\"well\" là trạng từ bất quy tắc, so sánh hơn là \"better\".", "vi": "VD: He sings better than me."}, {"q": "4. So sánh hơn của trạng từ \"badly\" là gì?", "options": ["badder", "more badly", "worse", "worst"], "answer": 2, "explanation": "\"badly\" là trạng từ bất quy tắc, so sánh hơn là \"worse\".", "vi": "VD: She played worse than last time."}], "wf": [{"q": "1. Many local _________ protested against the construction of the new factory near their homes.", "hint": "(VILLAGE)", "options": ["villagers", "village", "villager"], "answer": 0, "explanation": "Sau \"local\" và trước động từ \"protested\" cần DANH TỪ SỐ NHIỀU chỉ người → villagers.", "vi": "Nhiều người dân làng địa phương đã phản đối việc xây dựng nhà máy mới gần nhà họ."}, {"q": "2. She has a valuable ___________ of ancient coins that she has gathered over the past ten years.", "hint": "(COLLECT)", "options": ["collection", "collective", "collector", "collectively"], "answer": 0, "explanation": "Sau \"a valuable\" cần DANH TỪ → collect + ion = collection.", "vi": "Cô ấy có một bộ sưu tập tiền xu cổ quý giá mà cô đã gom góp trong mười năm qua."}, {"q": "3. During the festival, the streets are always decorated _______________ with lanterns and ribbons.", "hint": "(COLOR)", "options": ["colorful", "color", "colorfully"], "answer": 2, "explanation": "Bổ nghĩa cho động từ \"decorated\" cần TRẠNG TỪ → colorfully.", "vi": "Trong lễ hội, đường phố luôn được trang trí sặc sỡ với đèn lồng và dải ruy băng."}, {"q": "4. After a long, stressful week, they decided to spend a ___________ weekend in the countryside.", "hint": "(PEACE)", "options": ["peace", "peaceful", "peacefully"], "answer": 1, "explanation": "Bổ nghĩa cho danh từ \"weekend\" cần function normalize(s){ return (s||'').trim().toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d"]/g,'').replace(/[.,!?;:]/g,'').replace(/\s+/g,' '); }
function optionLetter(i){ return ['A','B','C','D'][i]; }
function shuffleArr(a){ return a.slice().sort(()=>Math.random()-0.5); }

function widthFor(ref){ const l=(ref||'').length; return l<7?'w-24':l<16?'w-40':'w-full'; }

let audioUnlocked=false, cachedVoices=[], chosenVoice=null;
const PREFERRED_VOICE_NAMES = [
  'Google US English','Microsoft Aria Online (Natural) - English (United States)',
  'Microsoft Jenny Online (Natural) - English (United States)','Samantha',
  'Microsoft Zira Desktop - English (United States)','Google UK English Female','Alex'
];
function unlockAudio(){ if(audioUnlocked) return; audioUnlocked=true;
  try{ const Ctx=window.AudioContext||window.webkitAudioContext; if(Ctx){ const ctx=new Ctx(); const buf=ctx.createBuffer(1,1,22050); const src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0);} }catch(e){}
  try{ window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){}
  loadVoices();
}
document.addEventListener('touchstart', unlockAudio, {once:true, passive:true});
document.addEventListener('click', unlockAudio, {once:true});
function pickBestVoice(){
  if(!cachedVoices.length) return null;
  for(const name of PREFERRED_VOICE_NAMES){ const v=cachedVoices.find(x=>x.name===name); if(v) return v; }
  const usEn = cachedVoices.filter(v=>/en[-_]us/i.test(v.lang));
  if(usEn.length){ const local = usEn.find(v=>v.localService); return local||usEn[0]; }
  const anyEn = cachedVoices.find(v=>/^en/i.test(v.lang));
  return anyEn||null;
}
function loadVoices(){
  cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  chosenVoice = pickBestVoice();
}
if('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,300); setTimeout(loadVoices,1000); }
let resumeInterval=null;
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if(resumeInterval){ clearInterval(resumeInterval); resumeInterval=null; }
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.88; u.pitch=1;
    if(!cachedVoices.length) loadVoices();
    if(chosenVoice) u.voice=chosenVoice;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>{btn.classList.remove('speaking'); if(resumeInterval){clearInterval(resumeInterval);resumeInterval=null;}}; }
    window.speechSynthesis.speak(u);
    resumeInterval=setInterval(()=>{ if(window.speechSynthesis.speaking){ window.speechSynthesis.pause(); window.speechSynthesis.resume(); } else { clearInterval(resumeInterval); resumeInterval=null; } },4000);
  }catch(e){}
}

function feedbackHTML(ok, answerLabel, explanation, vi, note){
  const okLine = ok? `<span class="text-emerald-700 font-bold">✅ Chính xác!</span>` : `<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án đúng: <b>${answerLabel}</b>`;
  const expLine = explanation? `<br><span class="text-blue-700">💡 ${explanation}</span>` : '';
  const viLine = vi? `<span class="text-slate-500">📖 Nghĩa: <i>${vi}</i></span>` : '';
  const noteLine = note? `<br><span class="text-violet-600">📐 Công thức: <b>${note}</b></span>` : '';
  if(note){ return (viLine?viLine+'<br>':'') + okLine + expLine + noteLine; }
  return okLine + expLine + (viLine?'<br>'+viLine:'') + noteLine;
}

function renderSection(s, idx){
  if(s.type==='info'){
    return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">
      <h2 class="text-xl md:text-2xl font-extrabold text-indigo-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'lightbulb'} text-amber-400"></i> ${s.title}</h2>

  if(s.instructions) inner += `<p class="text-sm text-slate-500 mb-3 italic">${s.instructions}</p>`;
  inner += renderPassage(s.passage, idx);
  inner += renderDict(s.dict, idx);

  inner += `<div class="space-y-4">`;
  s.questions.forEach((q,i)=>{
    inner += `<div class="task-card bg-white rounded-2xl shadow-md p-4" id="qblock_${idx}_${i}">`;
    if(q.image) inner += `<div class="mb-3">${q.image}</div>`;
    inner += `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${q.q}</p>`;
    if(s.type==='mcq'){
      inner += `<div class="grid sm:grid-cols-2 gap-2">`;
      q.options.forEach((opt,j)=>{
        const ipa = q.ipas ? q.ipas[j] : null;
        const optVi = q.vis ? q.vis[j] : null;
        const cleanWord = opt.replace(/<[^>]+>/g,'');
        const wordBlock = (ipa || optVi)
          ? `<span class="flex flex-col leading-tight"><span>${opt}</span>${ipa?`<span class="text-[10px] text-slate-400 font-normal mcq-detail-hidden">${ipa}</span>`:''}${optVi?`<span class="text-[10px] text-emerald-500 font-normal italic mcq-detail-hidden">${optVi}</span>`:''}</span>
             <button type="button" data-w="${cleanWord}" onclick="event.stopPropagation();event.preventDefault();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:scale-110 transition flex items-center justify-center ml-auto shrink-0 mcq-detail-hidden" title="Nghe phát âm" aria-label="Nghe phát âm ${cleanWord}"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`
          : `<span>${opt}</span>`;
        inner += `<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="opt_${idx}_${i}_${j}" onclick="selectMcq(${idx},${i},${j})">
          <input type="radio" name="mcq_${idx}_${i}" class="accent-indigo-700" style="display:none">
          <span class="font-black text-indigo-700">${optionLetter(j)}.</span> ${wordBlock}
        </label>`;
      });
      inner += `</div>`;
    } else if(s.type==='fill'){
      const w = widthFor(q.answer);
      const famBlock = q.family ? `<div class="wordfam-box mt-2">${q.family.map(f=>`<div>• ${f}</div>`).join('')}</div>` : '';
      inner += `<div class="flex items-center gap-2 flex-wrap">`;
      if(q.hint) inner += `<span class="blank-tag text-xs">${q.hint}</span>`;
      inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input ${w} px-3 py-1.5 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false"></div>${famBlock}`;
    } else if(s.type==='sentence'){
      const instantAttr = s.instant ? ` oninput="gradeOneSentence(${idx},${i})"` : '';
      if(q.starter){
        inner += `<p class="text-slate-700 text-sm mb-2">${q.original}</p>
        <div class="flex items-center gap-3 w-full flex-wrap">
          <span class="text-slate-800 font-extrabold text-base whitespace-nowrap">${q.starter}</span>
          <input type="text" id="inp_${idx}_${i}" class="answer-input flex-1 min-w-[180px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false"${instantAttr}>
        </div>`;
      } else {
        inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Viết câu trả lời..." autocomplete="off" spellcheck="false"${instantAttr}>`;
      }
    }
    inner += `<div class="explanation-box mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm text-blue-800" id="fb_${idx}_${i}"></div>`;
    inner += `</div>`;
  });
  inner += `</div>`;

  inner += `<div class="flex flex-wrap gap-2 mt-5">
    <button onclick="checkSection(${idx})" class="bg-gradient-to-r from-indigo-900 to-pink-600 text-white font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>

    <span id="score_${idx}" class="hidden ml-auto self-center font-extrabold text-emerald-600 text-sm score-badge"></span>
  </div>`;

  return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">${inner}</section>`;

function togglePassageVI(idx){ const el=document.getElementById(`passage_vi_${idx}`); if(el) el.classList.toggle('vi-hidden'); }
function selectMcq(idx,i,j){
  const q=DATA.sections[idx].questions[i];
  document.querySelectorAll(`[id^="opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${idx}_${i}_${j}`).classList.add('selected');
  document.getElementById(`opt_${idx}_${i}_${j}`).dataset.chosen = j;
  if(DATA.sections[idx].instant){ gradeOneMcq(idx,i); }
}

function gradeOneMcq(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const qblock=document.getElementById(`qblock_${idx}_${i}`);
  if(qblock) qblock.classList.add('show-mcq-detail');
  const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
  const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
  const ok = chosen === q.answer;
  const answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
  q.options.forEach((o,j)=>{
    const el=document.getElementById(`opt_${idx}_${i}_${j}`);
    el.classList.remove('correct-opt','wrong-opt');
    if(j===q.answer) el.classList.add('correct-opt');
    else if(j===chosen) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function gradeOneSentence(idx,i){
  const q=DATA.sections[idx].questions[i];
  const inp=document.getElementById(`inp_${idx}_${i}`);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(!inp || !fb) return;
  const raw=inp.value.trim();
  if(raw===''){
    inp.classList.remove('correct-input','wrong-input');
    fb.classList.remove('show'); fb.innerHTML='';
    return;
  }
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
}

function checkSection(idx){
  const s=DATA.sections[idx];
  let correct=0;
  s.questions.forEach((q,i)=>{
    let ok=false, answerLabel='';
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='mcq'){
      const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
      const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
      ok = chosen === q.answer;
      answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
        else if(j===chosen) el.classList.add('wrong-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      const val=normalize(inp.value);
      const acc=(q.accepted||[q.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.classList.remove('correct-input','wrong-input');
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = q.answer;
    }
    if(ok) correct++;
    fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
    fb.classList.add('show');
  });
  const total=s.questions.length;
  scores[idx]={correct,total};
  const scoreEl=document.getElementById(`score_${idx}`);
  scoreEl.textContent = `🏆 Điểm: ${correct}/${total}`;
  scoreEl.classList.remove('hidden');
  completedTasks.add(idx);
  updateProgress();
  if(completedTasks.size===TOTAL_TASKS) setTimeout(showCompletion,500);
}

function revealSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    let answerLabel = s.type==='mcq' ? `${optionLetter(q.answer)}. ${q.options[q.answer]}` : q.answer;
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    }
    fb.innerHTML = `👁️ Đáp án: <b>${answerLabel}</b>` + (q.explanation?`<br><span class="text-blue-700">💡 ${q.explanation}</span>`:'') + (q.vi?`<br><span class="text-slate-500">📖 Nghĩa: <i>${q.vi}</i></span>`:'') + (q.note?`<br><span class="text-violet-600">📐 Công thức: <b>${q.note}</b></span>`:'');
    fb.classList.add('show');
  });
}

function resetSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt','selected');
        delete el.dataset.chosen;
      });
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    }
    const qblock=document.getElementById(`qblock_${idx}_${i}`);
    if(qblock) qblock.classList.remove('show-mcq-detail');
    const fb=document.getElementById(`fb_${idx}_${i}`);
    fb.classList.remove('show'); fb.innerHTML='';
  });
  const scoreEl=document.getElementById(`score_${idx}`); scoreEl.classList.add('hidden');
  completedTasks.delete(idx); delete scores[idx]; updateProgress();
}

function showTab(idx){
  document.querySelectorAll('.section-page').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-slate-600');});
  document.getElementById(`tab-${idx}`).classList.add('active');
  const btn=document.getElementById(`navbtn_${idx}`);
  btn.classList.add('active'); btn.classList.remove('text-slate-600');
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=completedTasks.size;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TASKS} phần`;
  document.getElementById('progressBar').style.width = `${(done/TOTAL_TASKS)*100}%`;
}

function showCompletion(){
  fireConfetti();
  const banner=document.getElementById('completionBanner');
  banner.classList.remove('hidden'); banner.classList.add('show');
  let c=0,t=0; Object.values(scores).forEach(s=>{c+=s.correct; t+=s.total;});
  document.getElementById('finalScoreDisplay').textContent = `🎯 ${c} / ${t} câu đúng`;
}
function closeBanner(){ const b=document.getElementById('completionBanner'); b.classList.remove('show'); b.classList.add('hidden'); }

function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); if(!wrap) return; wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}


function renderMiniQuizzes(){
  Object.keys(DATA.miniQuizzes||{}).forEach(key=>{
    const wrap = document.getElementById('miniquiz-'+key);
    if(!wrap) return;
    wrap.innerHTML = DATA.miniQuizzes[key].map((q,i)=>`
      <div id="mqwrap_${key}_${i}">
        <p class="text-sm font-bold text-slate-800 mb-1.5">${i+1}. ${q.q}</p>
        <div class="grid sm:grid-cols-2 gap-2">${q.options.map((o,j)=>`<label class="option-label rounded-lg px-3 py-1.5 text-xs font-semibold" id="mq_${key}_${i}_${j}" onclick="answerMiniQuiz('${key}',${i},${j})"><span class="font-black text-emerald-700">${optionLetter(j)}.</span> ${o}</label>`).join('')}</div>
        <div class="mt-1 text-xs hidden bg-blue-50 border border-blue-200 rounded-lg px-2 py-1.5 text-blue-800" id="mq_fb_${key}_${i}"></div>
      </div>`).join('');
  });
}
const MINI_QUIZ_SCORE = {};
function answerMiniQuiz(key,i,j){
  const wrapEl = document.getElementById(`mqwrap_${key}_${i}`);
  if(wrapEl.dataset.answered) return;
  wrapEl.dataset.answered = '1';
  const q = DATA.miniQuizzes[key][i];
  const ok = j===q.answer;
  q.options.forEach((o,k)=>{
    const el=document.getElementById(`mq_${key}_${i}_${k}`);
    el.onclick=null;
    if(k===q.answer) el.classList.add('correct-opt');
    else if(k===j) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`mq_fb_${key}_${i}`);
  fb.classList.remove('hidden');
  fb.innerHTML = (ok?'<span class="text-emerald-700 font-bold">✅ Chính xác!</span>':`<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án: <b>${optionLetter(q.answer)}. ${q.options[q.answer]}</b>`) + (q.explanation?`<br>💡 ${q.explanation}`:'') + (q.vi?`<br>📖 <i>${q.vi}</i>`:'');
  if(!MINI_QUIZ_SCORE[key]) MINI_QUIZ_SCORE[key] = {correct:0, answered:0};
  MINI_QUIZ_SCORE[key].answered++;
  if(ok) MINI_QUIZ_SCORE[key].correct++;
  const scoreEl = document.getElementById(`miniquiz-score-${key}`);
  if(scoreEl) scoreEl.textContent = `🏆 ${MINI_QUIZ_SCORE[key].correct}/${MINI_QUIZ_SCORE[key].answered} đã trả lời`;
}

buildNav();
buildMain();
updateProgress();
renderMiniQuizzes();
</script>
</body>
</html>
