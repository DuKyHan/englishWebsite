<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 10: Energy Sources — Grammar Quest ⚡</title>
<style>
:root{
  --bg:#f4f6ff; --bg2:#ffffff; --card:#ffffff; --ink:#26283d; --ink-soft:#6b6e8a;
  --line:#e4e7f4; --shadow:0 4px 14px rgba(80,90,200,.10);
  --p:#6c4df6; --p-dark:#5438d6; --p-soft:#efeaff;
  --accent:#ff7ab8; --accent-soft:#ffe9f4;
  --good:#21c07a; --good-soft:#dcf9ec; --bad:#ff5a6a; --bad-soft:#ffe4e7;
  --gold:#ffb300; --gold-soft:#fff4d6;
  --teal:#19b8c9; --teal-soft:#e0f9fc;
  --r:18px;
}
[data-theme="dark"]{
  --bg:#141623; --bg2:#1c1f33; --card:#222640; --ink:#eceef8; --ink-soft:#a5a9c8;
  --line:#33375a; --shadow:0 4px 18px rgba(0,0,0,.35);
  --p:#8d72ff; --p-dark:#a18cff; --p-soft:#2c2a52;
  --accent:#ff8ec3; --accent-soft:#3a2438;
  --good:#2bd98c; --good-soft:#163b2c; --bad:#ff6b7a; --bad-soft:#3e1f26;
  --gold:#ffc233; --gold-soft:#3c3115;
  --teal:#2fd2e3; --teal-soft:#123a40;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Quicksand','Baloo 2','Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh; transition:background .3s,color .3s;
}
button{font-family:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 14px 90px}

header{position:sticky;top:0;z-index:60;background:var(--bg);padding:12px 0 8px;transition:background .3s}
.hd{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:0 14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.logo .badge-unit{background:linear-gradient(135deg,var(--p),var(--accent));color:#fff;border-radius:10px;padding:3px 10px;font-size:12px;letter-spacing:.05em}
.xp-pill{margin-left:auto;background:var(--gold-soft);border:2px solid var(--gold);color:var(--gold);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.streak-pill{background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
.theme-btn{background:var(--card);border:2px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;box-shadow:var(--shadow)}

nav{overflow-x:auto;scrollbar-width:none;margin-top:8px}
nav::-webkit-scrollbar{display:none}
.nav-in{display:flex;gap:8px;max-width:880px;margin:0 auto;padding:4px 14px 10px;width:max-content;min-width:100%}
.tab{flex:none;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:all .2s;white-space:nowrap}
.tab.active{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 4px 12px rgba(108,77,246,.35)}
.tab:hover:not(.active){border-color:var(--p);color:var(--p)}

section{display:none;animation:fadeUp .35s cubic-bezier(.22,1,.36,1)}
section.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h2.sec-title{font-size:23px;margin:18px 0 4px;display:flex;align-items:center;gap:10px}
p.sec-sub{color:var(--ink-soft);font-weight:600;font-size:14px;margin:0 0 18px}

.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.gstat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gpill{background:var(--p-soft);color:var(--p);font-weight:800;border-radius:99px;padding:5px 14px;font-size:14px}
.gpill.gold{background:var(--gold-soft);color:var(--gold)}
.gpill.teal{background:var(--teal-soft);color:var(--teal)}
.gpill.good{background:var(--good-soft);color:var(--good)}
.btn{border:none;border-radius:14px;padding:12px 24px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .1s,filter .2s;color:#fff;background:var(--p);box-shadow:0 4px 0 var(--p-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--p-dark)}
.btn.ghost{background:var(--card);color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.small{padding:8px 16px;font-size:13px;border-radius:11px}
.btn.good{background:var(--good);box-shadow:0 4px 0 #169a60}
.btn:disabled{filter:grayscale(.8);opacity:.5;cursor:not-allowed}

/* THEORY */
.theory-card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.theory-card h3{margin:0 0 4px;font-size:17px;color:var(--p);display:flex;align-items:center;gap:8px}
.theory-card .vi{color:var(--ink-soft);font-weight:700;font-size:13px;margin-bottom:12px}
.theory-card table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.theory-card th,.theory-card td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.theory-card th{background:var(--p-soft);color:var(--p);font-weight:800}
.theory-card tr:nth-child(even) td{background:var(--bg)}
.ex-line{background:var(--bg2);border-left:4px solid var(--teal);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px}
.ex-line b{color:var(--teal)}
.ex-line .vi-tr{display:block;color:var(--ink-soft);font-style:italic;font-size:13px;margin-top:2px}
.note-box{background:var(--gold-soft);border:2px dashed var(--gold);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-top:10px;color:var(--ink)}
.formula-box{background:var(--teal-soft);border:2px solid var(--teal);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:800;color:var(--teal);margin:8px 0}
.formula-box .fb-label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:var(--ink-soft);display:block;margin-bottom:4px}
.mistake-box{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13.5px}
.mistake-box .wrong{color:var(--bad);font-weight:800;text-decoration:line-through}
.mistake-box .right{color:var(--good);font-weight:800}
.mistake-box .vi-tr{display:block;color:var(--ink-soft);font-style:italic;font-size:12.5px;margin-top:2px}
textarea.ex-input{width:100%;min-height:64px;resize:vertical;font-family:inherit}
.written-tag{background:var(--teal-soft);color:var(--teal);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:800;margin-left:6px}
.ex-feedback.info-fb{background:var(--teal-soft);border:2px solid var(--teal)}
.cloze-passage{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.9;margin-bottom:12px}
.cloze-passage b{color:var(--p)}
.cloze-blank{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cloze-num{font-weight:800;color:var(--p);min-width:28px}
.cloze-opt{margin-bottom:0!important;padding:7px 12px!important;font-size:13.5px!important}
.theory-card ul{margin:8px 0;padding-left:20px}
.theory-card li{margin-bottom:6px}

/* EXERCISES */
.ex-card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.ex-card .ex-num{font-size:12px;font-weight:800;color:var(--p);background:var(--p-soft);border-radius:99px;padding:2px 10px;display:inline-block;margin-bottom:8px}
.ex-card .ex-prompt{font-size:15.5px;font-weight:700;margin-bottom:12px;line-height:1.6}
.ex-opt{display:block;width:100%;text-align:left;background:var(--bg2);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:11px 15px;font-weight:700;font-size:14.5px;color:var(--ink);cursor:pointer;margin-bottom:8px;transition:all .15s}
.ex-opt:hover:not(:disabled){border-color:var(--p)}
.ex-opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ex-opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ex-opt:disabled{cursor:not-allowed}
.ex-fill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ex-input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-family:inherit;font-weight:700;font-size:15px;background:var(--bg2);color:var(--ink);outline:none}
.ex-input:focus{border-color:var(--p)}
.ex-input.ok{border-color:var(--good);background:var(--good-soft)}
.ex-input.no{border-color:var(--bad);background:var(--bad-soft)}
.ex-feedback{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:13.5px;display:none}
.ex-feedback.show{display:block;animation:fadeUp .3s}
.ex-feedback.ok-fb{background:var(--good-soft);border:2px solid var(--good)}
.ex-feedback.no-fb{background:var(--bad-soft);border:2px solid var(--bad)}
.ex-feedback .verdict{font-weight:800;margin-bottom:4px;font-size:14.5px}
.ex-feedback .explain{margin-bottom:4px}
.ex-feedback .translate{color:var(--ink-soft);font-style:italic}
.ex-feedback .translate b{color:var(--ink);font-style:normal}

/* TEST (quiz flow) */
.q-progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.q-progress>div{height:100%;background:linear-gradient(90deg,var(--p),var(--accent));transition:width .4s;border-radius:99px}
.center{text-align:center}
.result-emoji{font-size:60px}

/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.dash-card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--shadow)}
.dash-card .v{font-size:26px;font-weight:800;color:var(--p)}
.dash-card .l{font-size:11.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.bar{height:18px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--good),var(--teal));border-radius:99px;transition:width .6s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:800}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:14px}
.bdg{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;opacity:.35;filter:grayscale(1);transition:all .4s}
.bdg.earned{opacity:1;filter:none;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.bdg .be{font-size:34px}
.bdg .bn{font-weight:800;font-size:13px;margin-top:4px}
.bdg .br{font-size:10.5px;color:var(--ink-soft);font-weight:700}
.score-list{list-style:none;padding:0;margin:8px 0 0}
.score-list li{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:6px;font-weight:700;font-size:14px;display:flex;justify-content:space-between}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);z-index:99;background:var(--ink);color:var(--bg);font-weight:800;border-radius:99px;padding:12px 24px;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.22,1,.36,1);font-size:15px}
#toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-12px;z-index:99;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header>
  <div class="hd">
    <div class="logo">⚡ Grammar Quest <span class="badge-unit">UNIT 10 · ENERGY SOURCES</span></div>
    <div class="streak-pill">🔥 <span id="streakVal">0</span> ngày</div>
    <div class="xp-pill">⚡ <span id="xpVal">0</span> XP</div>
    <button class="theme-btn" id="themeBtn" title="Đổi giao diện sáng/tối">🌙</button>
  </div>
  <nav><div class="nav-in" id="navBar"></div></nav>
</header>

<div class="wrap">
  <section id="sec-theory"></section>
  <section id="sec-level1"></section>
  <section id="sec-level2"></section>
  <section id="sec-level3"></section>
  <section id="sec-test"></section>
  <section id="sec-dash"></section>
</div>

<div id="toast"></div>

<script>
/* ====================================================
   DATA — Grade 7 (Global Success), Unit 10: Energy Sources
==================================================== */
const UNIT = {num:10, topicEn:"Energy Sources", topicVi:"Nguồn năng lượng", emoji:"⚡"};
const THEORY = [{"icon": "📌", "title_en": "Usage of the Present Continuous", "title_vi": "Cách dùng thì hiện tại tiếp diễn", "html": "\n<ul>\n<li>Diễn tả hành động đang xảy ra ngay tại thời điểm nói.</li>\n<li>Diễn tả một xu hướng, sự thay đổi đang diễn ra.</li>\n<li>Diễn tả một kế hoạch đã sắp xếp trong tương lai gần.</li>\n</ul>\n<div class='ex-line'><b>Scientists are looking for new renewable energy sources.</b><span class='vi-tr'>Các nhà khoa học đang tìm kiếm những nguồn năng lượng tái tạo mới.</span></div>\n"}, {"icon": "🧮", "title_en": "Quick formula", "title_vi": "Công thức nhanh — ghi nhớ trong 5 giây", "html": "<div class='formula-box'><span class='fb-label'>Công thức</span>S + am/is/are + V-ing</div>"}, {"icon": "🧩", "title_en": "Structure", "title_vi": "Cấu trúc thì hiện tại tiếp diễn", "html": "\n<table>\n<tr><th>Thể</th><th>Cấu trúc</th></tr>\n<tr><td>Khẳng định</td><td>S + am/is/are + V-ing</td></tr>\n<tr><td>Phủ định</td><td>S + am/is/are + not + V-ing</td></tr>\n<tr><td>Nghi vấn</td><td>Am/Is/Are + S + V-ing ... ?</td></tr>\n</table>\n"}, {"icon": "✍️", "title_en": "Spelling rules for -ing", "title_vi": "Quy tắc thêm -ing", "html": "\n<ul>\n<li>Đa số động từ: thêm <b>-ing</b> (work → working)</li>\n<li>Tận cùng -e (câm): bỏ e, thêm -ing (make → making)</li>\n<li>Tận cùng 1 nguyên âm + 1 phụ âm (âm tiết nhấn): gấp đôi phụ âm (run → running)</li>\n</ul>\n<div class='note-box'>💡 Dấu hiệu nhận biết: now, right now, at the moment, at present, Look!, Listen!</div>\n"}, {"icon": "⚠️", "title_en": "Common mistakes", "title_vi": "Lỗi thường gặp và cách sửa", "html": "<div class='mistake-box'><span class='wrong'>✗ She reading a book now.</span><br><span class='right'>✓ She is reading a book now.</span><span class='vi-tr'>Cô ấy đang đọc sách. — Quên trợ động từ 'to be' trong thì hiện tại tiếp diễn.</span></div><div class='mistake-box'><span class='wrong'>✗ He works now.</span><br><span class='right'>✓ He is working now.</span><span class='vi-tr'>Cậu ấy đang làm việc. — Có 'now' nhưng lại dùng thì hiện tại đơn thay vì tiếp diễn.</span></div>"}];
const EXERCISES = {"1": [{"id": "u10l1q1", "type": "mcq", "prompt": "Scientists ___ (look) for new renewable energy sources.", "options": ["look", "looks", "are looking", "looked"], "answer": "are looking", "explain": "Hành động đang diễn ra dùng am/is/are + V-ing.", "translate": "Các nhà khoa học đang tìm kiếm những nguồn năng lượng tái tạo mới."}, {"id": "u10l1q2", "type": "mcq", "prompt": "The solar panel ___ at the moment. (phủ định của 'work')", "options": ["isn't working", "doesn't work", "not working", "isn't work"], "answer": "isn't working", "explain": "Phủ định thì hiện tại tiếp diễn: am/is/are + not + V-ing.", "translate": "Tấm pin mặt trời hiện không hoạt động."}, {"id": "u10l1q3", "type": "mcq", "prompt": "___ you ___ (use) less electricity these days?", "options": ["Do...use", "Are...using", "Does...use", "Is...using"], "answer": "Are...using", "explain": "Chủ ngữ 'you' + 'are' + V-ing cho câu hỏi hiện tại tiếp diễn.", "translate": "Dạo này bạn có đang dùng ít điện hơn không?"}, {"id": "u10l1q4", "type": "fill", "prompt": "Right now, the wind turbines ___ (produce) clean electricity.", "answer": ["are producing"], "explain": "Chủ ngữ số nhiều 'turbines' + 'are' + V-ing.", "translate": "Ngay lúc này, các tua bin gió đang sản xuất điện sạch."}, {"id": "u10l1q5", "type": "mcq", "prompt": "Look! The wind turbine ___ very fast.", "options": ["turns", "turn", "is turning", "turning"], "answer": "is turning", "explain": "'Look!' là dấu hiệu của thì hiện tại tiếp diễn.", "translate": "Nhìn kìa! Tua bin gió đang quay rất nhanh."}, {"id": "u10l1q6", "type": "mcq", "prompt": "We ___ electricity these days. (phủ định của 'waste')", "options": ["don't waste", "doesn't waste", "aren't wasting", "isn't wasting"], "answer": "aren't wasting", "explain": "Chủ ngữ 'we' + 'aren't' + V-ing.", "translate": "Dạo này chúng tôi không lãng phí điện."}, {"id": "u10l1q5_d2", "type": "mcq", "prompt": "The engineers ___ a new wind farm this month.", "options": ["build", "builds", "are building", "built"], "answer": "are building", "explain": "", "translate": "Các kỹ sư đang xây dựng một trang trại gió mới trong tháng này."}, {"id": "u10l1q6_d2", "type": "mcq", "prompt": "___ the machine ___ properly now?", "options": ["Do...work", "Is...working", "Does...work", "Are...working"], "answer": "Is...working", "explain": "", "translate": "Máy có đang hoạt động bình thường không?"}, {"id": "u10g1_1", "type": "mcq", "prompt": "Right now, the engineer ___ a wind farm.", "options": ["build", "building", "builds", "builded"], "answer": "building", "explain": "Hành động đang diễn ra dùng am/is/are + V-ing.", "translate": "Kỹ sư đang xây dựng trang trại gió."}, {"id": "u10g1_2", "type": "mcq", "prompt": "Right now, She ___ a solar panel.", "options": ["test", "testing", "tests", "tested"], "answer": "testing", "explain": "Hành động đang diễn ra dùng am/is/are + V-ing.", "translate": "Cô ấy đang thử nghiệm tấm pin mặt trời."}, {"id": "u10g1_3", "type": "mcq", "prompt": "Right now, the factory ___ new technology.", "options": ["develop", "developing", "develops", "developed"], "answer": "developing", "explain": "Hành động đang diễn ra dùng am/is/are + V-ing.", "translate": "Nhà máy đang phát triển công nghệ mới."}, {"id": "u10g1_4", "type": "mcq", "prompt": "Right now, the engineer ___ new turbines.", "options": ["install", "installing", "installs", "installed"], "answer": "installing", "explain": "Hành động đang diễn ra dùng am/is/are + V-ing.", "translate": "Kỹ sư đang lắp đặt tua bin mới."}, {"id": "u10g1_5", "type": "mcq", "prompt": "Right now, She ___ renewable energy.", "options": ["study", "studying", "studies", "studied"], "answer": "studying", "explain": "Hành động đang diễn ra dùng am/is/are + V-ing.", "translate": "Cô ấy đang nghiên cứu năng lượng tái tạo."}, {"id": "u10g1_6", "type": "mcq", "prompt": "Right now, the factory ___ energy waste.", "options": ["reduce", "reducing", "reduces", "reduced"], "answer": "reducing", "explain": "Hành động đa /* ====================================================
   SAFE STORAGE (localStorage with in-memory fallback)
==================================================== */
const memStore = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v);}catch(e){ return k in memStore ? memStore[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ memStore[k]=v; } }
};
let S = store.get(STORAGE_KEY, {xp:0, theme:'light', streak:0, lastVisit:null, answered:{}, testScores:[]});
function save(){ store.set(STORAGE_KEY, S); }

const $ = s => document.querySelector(s);
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }
function addXP(n){
  S.xp += n; $('#xpVal').textContent = S.xp;
  BADGES.forEach(b=>{
    if(S.xp >= b.xp && !S['bdg_'+b.id]){ S['bdg_'+b.id]=true; toast(`🏅 Huy hiệu mới: ${b.emo} ${b.name}!`); confetti(30); }
  });
  save(); renderDash();
}
function confetti(n=60){
  const colors=['#6c4df6','#ff7ab8','#21c07a','#ffb300','#19b8c9'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='confetti';
    const s=6+Math.random()*8;
    c.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s*1.4}px;background:${colors[i%5]};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.6}s`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),5200);
  }
}
function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(S.lastVisit === today){ /* already counted */ }
  else {
    const y = new Date(); y.setDate(y.getDate()-1);
    const yStr = y.toISOString().slice(0,10);
    if(S.lastVisit === yStr) S.streak = (S.streak||0)+1;
    else S.streak = 1;
    S.lastVisit = today; save();
  }
  $('#streakVal').textContent = S.streak||0;
}

/* ====================================================
   EXERCISE RENDERING ENGINE
==================================================== */
function normalize(str){
  return str.toLowerCase().trim().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');
}
function checkAnswer(ex, userVal){
  if(ex.type==='mcq' || ex.type==='tf'){
    return normalize(userVal) === normalize(ex.answer);
  } else { // fill
    const accepted = Array.isArray(ex.answer) ? ex.answer : [ex.answer];
    return accepted.some(a=>normalize(userVal)===normalize(a));
  }
}
function markAnswered(ex, correct){
  if(!S.answered[ex.id]){
    S.answered[ex.id] = correct ? 'ok' : 'seen';
    if(correct) addXP(ex.xp||6);
    save();
  } else if(S.answered[ex.id]==='seen' && correct){
    S.answered[ex.id] = 'ok';
    addXP(ex.xp||6);
    save();
  }
}
function feedbackHTML(ex, correct){
  if(ex.type==='written'){
    return `
      <div class="ex-feedback show info-fb">
        <div class="verdict">📝 Đáp án gợi ý: “${ex.modelAnswer}”</div>
        <div class="explain">💡 <b>Giải thích:</b> ${ex.explain}</div>
        <div class="translate">🇻🇳 <b>Dịch nghĩa:</b> ${ex.translate}</div>
      </div>`;
  }
  const displayAnswer = Array.isArray(ex.answer) ? ex.answer[0] : ex.answer;
  return `
    <div class="ex-feedback show ${correct?'ok-fb':'no-fb'}">
      <div class="verdict">${correct? '✅ Chính xác!' : '❌ Chưa đúng — Đáp án đúng: '+displayAnswer}</div>
      <div class="explain">💡 <b>Giải thích:</b> ${ex.explain}</div>
      <div class="translate">🇻🇳 <b>Dịch nghĩa:</b> ${ex.translate}</div>
    </div>`;
}
function renderExerciseCard(ex, idx){
  let body = '';
  if(ex.type==='mcq'){
    body = ex.options.map(o=>`<button class="ex-opt" data-v="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('');
  } else if(ex.type==='tf'){
    body = `<button class="ex-opt" data-v="Đúng">Đúng</button><button class="ex-opt" data-v="Sai">Sai</button>`;
  } else if(ex.type==='written'){
    body = `<textarea class="ex-input" id="inp-${ex.id}" placeholder="Viết câu trả lời của em..."></textarea>
      <div style="margin-top:8px"><button class="btn small ghost" data-reveal="${ex.id}">📝 Xem đáp án gợi ý</button></div>`;
  } else if(ex.type==='error'){
    body = ex.options.map((o,oi)=>`<button class="ex-opt" data-v="${oi}">${o.replace(/"/g,'&quot;')} <b>(${String.fromCharCode(65+oi)})</b></button>`).join('');
  } else if(ex.type==='cloze'){
    const blanksHtml = ex.blanks.map((b,bi)=>`
      <div class="cloze-blank">
        <span class="cloze-num">(${bi+1})</span>
        ${b.options.map(o=>`<button class="ex-opt cloze-opt" data-bi="${bi}" data-v="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}
      </div>`).join('');
    body = `<div class="cloze-passage">${ex.passage}</div>${blanksHtml}
      <button class="btn small" data-clozecheck="${ex.id}" style="margin-top:10px">Kiểm tra tất cả</button>`;
  } else {
    body = `<div class="ex-fill-row">
      <input class="ex-input" id="inp-${ex.id}" placeholder="Nhập câu trả lời..." autocomplete="off" autocapitalize="off">
      <button class="btn small" data-check="${ex.id}">Kiểm tra</button>
    </div>`;
  }
  return `
    <div class="ex-card" id="card-${ex.id}">
      <span class="ex-num">Câu ${idx+1}${ex.type==='written'?'<span class=\'written-tag\'>✍️ Tự luận</span>':''}${ex.type==='cloze'?'<span class=\'written-tag\'>📄 Đoạn văn</span>':''}${ex.type==='error'?'<span class=\'written-tag\'>🔍 Tìm lỗi sai</span>':''}</span>
      <div class="ex-prompt">${ex.prompt||''}${ex.hint?`<br><small style="color:var(--ink-soft);font-weight:600">💡 ${ex.hint}</small>`:''}</div>
      ${body}
      <div class="ex-feedback-slot"></div>
    </div>`;
}
function wireExerciseCard(ex){
  const card = $('#card-'+ex.id);
  if(!card) return;
  if(ex.type==='mcq' || ex.type==='tf'){
    card.querySelectorAll('.ex-opt').forEach(btn=>{
      btn.onclick = ()=>{
        if(card.dataset.locked) return; card.dataset.locked = '1';
        const correct = checkAnswer(ex, btn.dataset.v);
        card.querySelectorAll('.ex-opt').forEach(b=>{
          b.disabled = true;
          if(normalize(b.dataset.v)===normalize(Array.isArray(ex.answer)?ex.answer[0]:ex.answer)) b.classList.add('ok');
        });
        if(!correct) btn.classList.add('no');
        card.querySelector('.ex-feedback-slot').innerHTML = feedbackHTML(ex, correct);
        markAnswered(ex, correct);
      };
    });
  } else if(ex.type==='error'){
    card.querySelectorAll('.ex-opt').forEach((btn,oi)=>{
      btn.onclick = ()=>{
        if(card.dataset.locked) return; card.dataset.locked = '1';
        const letter = String.fromCharCode(65+oi);
        const correct = letter === ex.answer;
        card.querySelectorAll('.ex-opt').forEach((b,bi)=>{
          b.disabled = true;
          if(String.fromCharCode(65+bi)===ex.answer) b.classList.add('ok');
        });
        if(!correct) btn.classList.add('no');
        card.querySelector('.ex-feedback-slot').innerHTML = feedbackHTML(ex, correct);
        markAnswered(ex, correct);
      };
    });
  } else if(ex.type==='cloze'){
    const selections = {};
    card.querySelectorAll('.cloze-opt').forEach(btn=>{
      btn.onclick = ()=>{
        if(card.dataset.locked) return;
        const bi = btn.dataset.bi;
        card.querySelectorAll(`.cloze-opt[data-bi="${bi}"]`).forEach(b=>b.classList.remove('sel'));
        btn.classList.add('sel'); btn.style.borderColor='var(--p)';
        card.querySelectorAll(`.cloze-opt[data-bi="${bi}"]`).forEach(b=>{ if(b!==btn) b.style.borderColor=''; });
        selections[bi] = btn.dataset.v;
      };
    });
    const checkBtn = card.querySelector('[data-clozecheck]');
    checkBtn.onclick = ()=>{
      if(card.dataset.locked) return; card.dataset.locked = '1';
      let numCorrect = 0;
      ex.blanks.forEach((b,bi)=>{
        const sel = selections[bi];
        const ok = sel!==undefined && normalize(sel)===normalize(b.answer);
        if(ok) numCorrect++;
        card.querySelectorAll(`.cloze-opt[data-bi="${bi}"]`).forEach(btn=>{
          btn.disabled = true;
          if(normalize(btn.dataset.v)===normalize(b.answer)) btn.classList.add('ok');
          else if(btn.dataset.v===sel) btn.classList.add('no');
        });
      });
      checkBtn.disabled = true;
      const allCorrect = numCorrect === ex.blanks.length;
      card.querySelector('.ex-feedback-slot').innerHTML = `
        <div class="ex-feedback show ${allCorrect?'ok-fb':'no-fb'}">
          <div class="verdict">${allCorrect?'✅ Chính xác toàn bộ!':'📊 Đúng '+numCorrect+'/'+ex.blanks.length+' chỗ trống'}</div>
          <div class="explain">💡 <b>Giải thích:</b> ${ex.explain}</div>
          <div class="translate">🇻🇳 <b>Dịch nghĩa:</b> ${ex.translate}</div>
        </div>`;
      markAnswered(ex, allCorrect);
    };
  } else if(ex.type==='written'){
    const btn = card.querySelector('[data-reveal]');
    btn.onclick = ()=>{
      if(card.dataset.locked) return; card.dataset.locked = '1';
      const inp = $('#inp-'+ex.id);
      if(inp) inp.disabled = true;
      btn.disabled = true;
      card.querySelector('.ex-feedback-slot').innerHTML = feedbackHTML(ex, true);
      markAnswered(ex, true);
    };
  } else {
    const inp = $('#inp-'+ex.id);
    const btn = card.querySelector('[data-check]');
    const go = ()=>{
      if(card.dataset.locked) return; card.dataset.locked = '1';
      const correct = checkAnswer(ex, inp.value);
      inp.disabled = true; btn.disabled = true;
      inp.classList.add(correct?'ok':'no');
      card.querySelector('.ex-feedback-slot').innerHTML = feedbackHTML(ex, correct);
      markAnswered(ex, correct);
    };
    btn.onclick = go;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  }
}

  sec.innerHTML = `

    <p class="sec-sub">Theo dõi hành trình chinh phục ngữ pháp Unit 10 của bạn!</p>
    <div class="dash-grid">
      <div class="dash-card"><div class="v">${doneOk}/${total}</div><div class="l">Câu đã làm đúng</div></div>
      <div class="dash-card"><div class="v">⚡${S.xp}</div><div class="l">Tổng XP</div></div>
      <div class="dash-card"><div class="v">🔥${S.streak||0}</div><div class="l">Chuỗi ngày học</div></div>
      <div class="dash-card"><div class="v">${S.testScores.length?S.testScores[S.testScores.length-1].pct+'%':'—'}</div><div class="l">Kiểm tra gần nhất</div></div>
      <div class="dash-card"><div class="v">${avg?avg+'%':'—'}</div><div class="l">Điểm TB kiểm tra</div></div>
    </div>
    <div class="panel">
      <b>📈 Tiến độ luyện tập (${total? Math.round(doneOk/total*100):0}%)</b>
      <div class="bar" style="margin-top:8px"><div style="width:${total? doneOk/total*100:0}%">${doneOk>0?Math.round(doneOk/total*100)+'%':''}</div></div>
      <p style="font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:0">💡 Làm đúng các câu ở Cấp độ 1, 2, 3 để lấp đầy thanh tiến độ.</p>
    </div>
    <div class="panel" style="margin-top:14px">
      <b>🏅 Huy hiệu (Badges)</b>
      <div class="badges">
        ${BADGES.map(b=>`
          <div class="bdg ${S['bdg_'+b.id]?'earned':''}">
            <div class="be">${b.emo}</div><div class="bn">${b.name}</div><div class="br">${b.vi}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="panel" style="margin-top:14px">
      <b>📝 Lịch sử kiểm tra</b>
      ${S.testScores.length
        ? `<ul class="score-list">${[...S.testScores].reverse().map(q=>`<li><span>📅 ${q.date}</span><b style="color:${q.pct>=70?'var(--good)':'var(--bad)'}">${q.pct}%</b></li>`).join('')}</ul>`
        : '<p style="color:var(--ink-soft);font-weight:600;font-size:14px;margin-bottom:0">Chưa có lượt kiểm tra nào — vào mục 🏆 Kiểm tra để làm bài đầu tiên!</p>'}
    </div>`;
}
renderDash();
</script>
