<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 1 - My Hobbies</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1e1b4b;--mut:#6b7280;--p:#4f46e5;--p2:#7c3aed;--pk:#db2777;--ok:#059669;--okbg:#ecfdf5;--bad:#dc2626;--badbg:#fef2f2;--am:#b45309;--ambg:#fffbeb;--line:#e4e6f7;--bg:#f3f4ff;--ph:"Doulos SIL","Charis SIL","Lucida Sans Unicode","Segoe UI",Arial,sans-serif}
html,body{height:469px;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:469px;max-width:1128px;margin:0 auto;background:var(--bg)}

/* sidebar */
.side{width:206px;flex:none;background:linear-gradient(175deg,#2e2a86 0%,#4f46e5 58%,#7c3aed 100%);color:#fff;display:flex;flex-direction:column;padding:12px 10px 10px;position:relative;overflow:hidden}
.side:before{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.logo{display:flex;align-items:center;gap:9px;padding:0 4px 9px;cursor:pointer;position:relative}
.logo .lg{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px}
.logo b{display:block;font-size:14px;letter-spacing:.05em}
.logo small{font-size:11px;opacity:.85}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;min-height:0;position:relative}
.ni{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:none;background:none;color:#e0e7ff;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;width:100%;transition:.15s}
.ni:hover{background:rgba(255,255,255,.13)}
.ni .n{width:18px;height:18px;flex:none;border-radius:50%;background:rgba(255,255,255,.2);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ni .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.on{background:#fff;color:#3730a3;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.ni.on .n{background:var(--p);color:#fff}
.ni.done .n{background:#34d399;color:#064e3b}
.ni.soon{opacity:.62}
.prog{padding:8px 4px 0;position:relative}
.pbar{height:7px;background:rgba(255,255,255,.22);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#34d399);border-radius:8px;transition:width .4s}
.prog small{display:flex;justify-content:space-between;font-size:10.5px;margin-top:4px;opacity:.9}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:11px;padding:11px 18px 2px}
.head .hi{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#c026d3);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 5px 14px rgba(99,102,241,.35);flex:none}
.head h1{font-size:18px;line-height:1.15;color:#312e81}
.head p{font-size:12px;color:var(--mut);margin-top:1px}
.subnav{display:flex;gap:6px;padding:8px 18px 7px;overflow-x:auto;flex:none}
.stab{flex:none;border:1px solid #d6dafc;background:#fff;color:#4338ca;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.stab:hover{background:#eef2ff;transform:translateY(-1px)}
.stab.on{background:linear-gradient(90deg,#4f46e5,#7c3aed);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.stab i{font-style:normal;margin-left:5px;font-size:10px;background:#34d399;color:#064e3b;border-radius:999px;padding:0 5px}
.body{flex:1;overflow:auto;padding:2px 18px 16px;min-height:0;animation:fade .25s}
.body.split{overflow:hidden;padding-bottom:12px}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* generic */
.btn{border:1px solid #c7d2fe;background:#fff;color:#4338ca;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;transition:.15s}
.btn:hover{background:#eef2ff;transform:translateY(-1px)}
.btn.solid{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(79,70,229,.28)}
.btn.solid:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:11px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.chip-s{display:inline-flex;align-items:center;gap:3px;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800}
.chip-s.ok{background:#d1fae5;color:#065f46}
.chip{display:inline-block;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:700}
.muted{color:var(--mut);font-size:12px}
.note{font-size:12.5px;background:#f5f3ff;border-left:3px solid #8b5cf6;border-radius:8px;padding:6px 10px;margin:6px 0;line-height:1.5}
.note.am{background:var(--ambg);border-color:#f59e0b}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 3px 12px rgba(67,56,202,.06)}
.card h3{font-size:14px;color:#312e81;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
mark{background:#fde68a;color:#78350f;border-radius:4px;padding:0 3px;font-weight:800;box-shadow:inset 0 -2px 0 #f59e0b}
u{text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:#e11d48}
.spk{border:none;background:#eef2ff;border-radius:7px;cursor:pointer;font-size:11px;padding:2px 6px;vertical-align:middle}
.spk:hover{background:#c7d2fe}
.ph{font-family:var(--ph)}
details.tr{margin-top:8px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.6}
details.tr summary{cursor:pointer;color:var(--p);font-weight:700}
details.tr p{margin-top:5px;color:#374151}
.kw{background:linear-gradient(transparent 55%,#fde68a 55%);font-weight:700;cursor:help}
.passage{font-size:13.5px;line-height:1.75;background:#fffdf5;border:1px solid #fde68a;border-radius:12px;padding:11px 14px;color:#1f2937}
.colh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7c3aed;margin:2px 0 6px}
.split>div{overflow:auto;height:100%;padding:0 2px 6px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* coming soon */
.soonbox{height:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--mut)}
.soonbox .big{font-size:54px;animation:float 3s ease-in-out infinite}
.soonbox b{font-size:18px;color:#312e81}
.soonbox span{font-size:13px;max-width:380px;line-height:1.5}
@keyframes float{50%{transform:translateY(-8px)}}

/* vocabulary */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.search{flex:1;border:1.5px solid #d6dafc;border-radius:10px;padding:7px 12px;font-size:12.5px;outline:none;background:#fff}
.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.vrow{display:grid;grid-template-columns:42px 34% 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:7px;transition:.15s}
.vrow:hover{border-color:#a5b4fc;box-shadow:0 5px 16px rgba(99,102,241,.14);transform:translateX(2px)}
.vem{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#eef2ff,#faf5ff);display:flex;align-items:center;justify-content:center;font-size:22px}
.vw{font-size:16px;font-weight:800;color:#312e81;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pos{font-size:10.5px;font-style:italic;font-weight:800;border-radius:999px;padding:1px 8px}
.pos-n{background:#dbeafe;color:#1d4ed8}.pos-v{background:#dcfce7;color:#15803d}.pos-adj{background:#ffedd5;color:#c2410c}.pos-idiom{background:#f3e8ff;color:#7e22ce}.pos-phr{background:#e0f2fe;color:#0369a1}
.vp{font-family:var(--ph);font-size:12.5px;color:var(--mut);margin-top:2px}
.vm{font-size:14px;font-weight:800;color:var(--ok)}
.ven{font-size:12.8px;line-height:1.5;margin-top:2px}
.vvi{font-size:12px;color:var(--mut);font-style:italic}
.hide-mean .vm:not(.rev),.hide-mean .vvi:not(.rev){filter:blur(6px);cursor:pointer;user-select:none}
.fcwrap{max-width:620px;margin:0 auto}
.fcnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.fcdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.fcdots i{width:9px;height:9px;border-radius:50%;background:#e0e7ff}
.fcdots i.k{background:#34d399}.fcdots i.cur{background:#6366f1;transform:scale(1.35)}
.fcard{min-height:176px;border-radius:20px;background:linear-gradient(135deg,#eef2ff,#faf5ff);border:2px solid #c7d2fe;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 24px;cursor:pointer;gap:6px;transition:.2s;box-shadow:0 10px 26px rgba(99,102,241,.14)}
.fcard.back{background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border-color:#6ee7b7}
.fcard:hover{transform:translateY(-2px)}
.fc-em{font-size:34px}.fc-w{font-size:30px;font-weight:900;color:#312e81}
.fc-p{font-family:var(--ph);font-size:16px;color:var(--mut)}
.fc-hint{font-size:11px;color:#9ca3af;margin-top:4px}
.fc-m{font-size:24px;font-weight:900;color:var(--ok)}
.fc-e{font-size:14px;line-height:1.5}.fc-v{font-size:12.5px;color:var(--mut);font-style:italic}
.fcbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

/* match game */
.mg-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.mc{border:2px solid #d6dafc;background:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;transition:.15s;min-height:40px;color:#312e81}
.mc:hover:not(.lock){border-color:#6366f1;background:#eef2ff;transform:scale(1.015)}
.mc.sel{border-color:#4f46e5;background:#e0e7ff;box-shadow:0 0 0 3px rgba(79,70,229,.2)}
.mc.lock{background:var(--okbg);border-color:#6ee7b7;color:#065f46;cursor:default;animation:pop .35s}
.mc.err{border-color:#f87171;background:var(--badbg);animation:shake .4s}
.mc.vi{font-weight:600;color:#374151}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* quiz */
.qz-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qz-title{font-size:13.5px;font-weight:800;color:#312e81;flex:1}
.qz-bar{height:6px;background:#e0e7ff;border-radius:8px;overflow:hidden;margin-bottom:10px}
.qz-bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#c026d3);border-radius:8px;transition:width .4s}
.qz-main{display:grid;grid-template-columns:1.08fr 1fr;gap:14px;align-items:start}
.qz-q{font-size:15px;line-height:1.55;font-weight:600;margin-bottom:10px;color:#1f2937}
.blank{display:inline-block;min-width:70px;border-bottom:3px dotted #6366f1;margin:0 2px}
.fillw{display:inline-block;background:#d1fae5;color:#065f46;border-radius:6px;padding:0 7px;font-weight:800}
.bigw{font-size:30px;font-weight:900;color:#312e81;letter-spacing:.02em;margin:2px 0}
.qz-opts{display:flex;flex-direction:column;gap:7px}
.qz-opts.tf{flex-direction:row}.qz-opts.tf .qo{flex:1;justify-content:center}
.qo{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid #d6dafc;background:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;cursor:pointer;transition:.15s;color:#1f2937}
.qo b{width:24px;height:24px;border-radius:8px;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.qo:hover:not(.lock){border-color:#6366f1;background:#f5f6ff;transform:translateX(3px)}
.qo.lock{cursor:default}
.qo.ok{border-color:#34d399;background:var(--okbg);color:#064e3b;font-weight:700;animation:pop .35s}
.qo.ok b{background:#10b981;color:#fff}
.qo.bad{border-color:#f87171;background:var(--badbg);color:#7f1d1d;animation:shake .4s}
.qo.bad b{background:#ef4444;color:#fff}
.fb{border-radius:14px;padding:10px 12px;font-size:12.8px;line-height:1.55;max-height:270px;overflow:auto;position:sticky;top:0}
.fb.idle{background:#f8faff;border:2px dashed #c7d2fe;text-align:center;color:var(--mut);padding:26px 14px}
.fb.idle .idle-i{font-size:30px}
.fb.ok{background:var(--okbg);border:1.5px solid #6ee7b7}
.fb.bad{background:var(--badbg);border:1.5px solid #fca5a5}
.fb-h{font-weight:900;font-size:14px;margin-bottom:5px}
.fb.ok .fb-h{color:#047857}.fb.bad .fb-h{color:#b91c1c}
.fb-h small{display:block;font-size:12px;font-weight:600;color:#374151;margin-top:1px}
.fb-b{color:#1f2937}
.fb-tr{margin-top:6px;background:rgba(255,255,255,.7);border-radius:8px;padding:5px 8px;color:#374151}
.fb-note{margin-top:5px;color:#4338ca;font-weight:600}
.fb-n{margin-top:9px;width:100%}
table.mt{width:100%;border-collapse:collapse;font-size:12.3px;margin-top:3px}
table.mt td{padding:2px 5px;border-bottom:1px dashed rgba(0,0,0,.1);vertical-align:top}
table.mt tr.hit td{background:rgba(16,185,129,.16);font-weight:700}
.qz-res{text-align:center;padding:6px 0}
.ring{width:96px;height:96px;border-radius:50%;margin:4px auto 8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#312e81;background:conic-gradient(#10b981 var(--pct),#e0e7ff 0);position:relative}
.ring:before{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}
.ring span{position:relative}
.qz-res h3{font-size:18px;color:#312e81}
.qz-res .acts{display:flex;gap:8px;justify-content:center;margin:10px 0}
.wl{text-align:left;margin-top:6px}
.wl details{background:#fff;border:1px solid #fecaca;border-radius:10px;padding:5px 10px;margin-bottom:5px;font-size:12.5px}
.wl summary{cursor:pointer;font-weight:700;color:#991b1b}
.wl .fb-b{margin-top:5px}
.confetti{position:fixed;top:-12px;font-size:18px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(500px) rotate(540deg);opacity:0}}

/* fill */
.fl-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.fl-top .t{font-size:13.5px;font-weight:800;color:#312e81;flex:1;min-width:200px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0;padding:8px 10px;background:#fff;border:2px dashed #c7d2fe;border-radius:12px}
.bk{border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px rgba(99,102,241,.3);transition:.15s}
.bk:hover:not(.used){transform:translateY(-2px)}
.bk.used{background:#e5e7eb;color:#9ca3af;box-shadow:none;cursor:default;text-decoration:line-through}
.fx{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:14px;line-height:2}
.fx .n{width:22px;height:22px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.fi{width:104px;border:none;border-bottom:2.5px dotted #6366f1;background:#f5f6ff;padding:1px 6px;font-size:14px;text-align:center;outline:none;border-radius:6px 6px 0 0;color:#1e1b4b;font-weight:700}
.fi:focus{background:#e0e7ff;border-bottom-style:solid}
.fi.good,.slot.good{border-bottom:2.5px solid #10b981;background:var(--okbg);color:#065f46}
.fi.bad,.slot.bad{border-bottom:2.5px solid #ef4444;background:var(--badbg);color:#991b1b}
.slot{min-width:104px;border:none;border-bottom:2.5px dotted #6366f1;background:#f5f6ff;padding:1px 8px;font-size:14px;font-weight:800;cursor:pointer;border-radius:6px 6px 0 0;color:#4338ca;height:26px}
.slot.act{background:#e0e7ff;border-bottom-style:solid;box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.fxfb{flex-basis:100%;font-size:12.5px;line-height:1.55;border-radius:10px;padding:5px 10px;margin:0 0 2px 28px}
.fxfb.ok{background:var(--okbg);border-left:3px solid #10b981;color:#064e3b}
.fxfb.bad{background:var(--badbg);border-left:3px solid #ef4444;color:#7f1d1d}
.fxfb .tr{display:block;color:#4b5563;font-style:italic}

/* sentence builder */
.bd-line{min-height:56px;border:2px dashed #a5b4fc;border-radius:14px;background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.bd-line.ok{border-color:#34d399;background:var(--okbg);border-style:solid}
.bd-line.bad{border-color:#f87171;background:var(--badbg);border-style:solid}
.bd-pool{display:flex;flex-wrap:wrap;gap:7px;min-height:44px;padding:4px}
.wd{border:none;background:#fff;border:2px solid #c7d2fe;color:#3730a3;border-radius:10px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 2px 0 #c7d2fe}
.wd:hover{transform:translateY(-2px);border-color:#6366f1}
.wd.in{background:#eef2ff}
.bd-hint{color:#9ca3af;font-size:12.5px}

/* signals */
.sg{display:flex;flex-wrap:wrap;gap:2px 1px;align-items:center;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:14.5px;line-height:1.9}
.sg .n{width:22px;height:22px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:3px}
.tok{padding:0 4px;border-radius:7px;cursor:pointer;transition:.12s}
.tok:hover{background:#e0e7ff}
.tok.sig{background:#fde68a;color:#78350f;font-weight:800;box-shadow:inset 0 -3px 0 #f59e0b;cursor:default}
.tok.err{background:#fee2e2;animation:shake .35s}
.sgnote{margin-left:6px;font-size:11.5px;background:#ede9fe;color:#5b21b6;border-radius:999px;padding:1px 9px;font-weight:700}

/* grammar theory */
.gc{border-radius:14px;padding:10px 13px;background:#fff;border:1px solid var(--line);border-top:5px solid #6366f1}
.gc.t2{border-top-color:#db2777}.gc.t3{border-top-color:#0d9488}
.gc .ic{font-size:24px}.gc h3{font-size:14px;margin:2px 0 4px;color:#312e81}
.gc p{font-size:12.8px;line-height:1.55}
.gex{margin-top:6px;background:#f5f3ff;border-radius:9px;padding:6px 9px;font-size:13px;line-height:1.5}
.gex i{display:block;color:#6b7280;font-size:12px}
.scale{display:flex;gap:6px;align-items:stretch;margin:6px 0}
.sc{flex:1;border-radius:11px;padding:7px 4px;text-align:center;color:#fff;font-size:12.5px;font-weight:800;line-height:1.3}
.sc small{display:block;font-weight:600;font-size:10.5px;opacity:.92}
.sc.a{background:#4f46e5}.sc.b{background:#6366f1}.sc.c{background:#8b5cf6}.sc.d{background:#a78bfa}.sc.e{background:#c4b5fd;color:#4c1d95}
.fm{display:inline-block;font-weight:800;color:#3730a3;background:#e0e7ff;border-radius:8px;padding:1px 9px;margin-bottom:3px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;line-height:1.5;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.t th{background:linear-gradient(90deg,#eef2ff,#faf5ff);color:#312e81;padding:7px 10px;text-align:left}
table.t td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.t i{color:#6b7280;display:block;font-size:12px}

/* pronunciation */
.pcard{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(67,56,202,.08)}
.pcard .ph2{display:flex;align-items:center;gap:10px;padding:9px 13px;color:#fff}
.pcard.c1 .ph2{background:linear-gradient(90deg,#4f46e5,#7c3aed)}.pcard.c2 .ph2{background:linear-gradient(90deg,#db2777,#f59e0b)}
.pcard .sym{font-family:var(--ph);font-size:27px;font-weight:700;background:rgba(255,255,255,.22);border-radius:11px;padding:0 11px}
.pcard .ph2 b{display:block;font-size:13px}.pcard .ph2 small{font-size:11.5px;opacity:.92}
.pbody{padding:9px 13px 11px}
.pbody figure{border:1px solid var(--line);border-radius:12px;padding:5px;text-align:center;background:#fff;margin-bottom:8px}
.pbody figure img{width:100%;height:108px;object-fit:contain}
.pbody figcaption{font-size:11.5px;color:var(--mut)}
.how{font-size:12.5px;line-height:1.55;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:6px 10px;margin-bottom:7px}
.plist{list-style:none}
.plist li{font-size:13.3px;padding:4px 0;border-bottom:1px dashed var(--line)}
.plist li:last-child{border:none}
.pw{font-weight:800;color:#312e81}.pp{font-family:var(--ph);color:var(--mut);font-size:12.5px}
.pw u,.pp u{color:#be123c}
.plist i{font-size:11px;color:#7c3aed}
.pics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.pic{position:relative;border:2px solid var(--line);border-radius:14px;padding:8px 7px 7px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.2s}
.pic img{height:64px;max-width:100%;object-fit:contain}
.pic .pn{position:absolute;top:5px;left:6px;font-size:10.5px;font-weight:900;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:0 7px}
.pic input{width:100%;padding:4px 6px;border:1.5px solid #c7d2fe;border-radius:8px;font-size:12.5px;text-align:center;outline:none}
.pic input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.pic input.good{border-color:#10b981;background:var(--okbg)}.pic input.bad{border-color:#ef4444;background:var(--badbg)}
.cols{display:flex;gap:5px}
.cb{font-family:var(--ph);border:1.5px solid #c7d2fe;background:#fff;border-radius:8px;padding:2px 11px;font-size:13px;cursor:pointer;color:#4338ca;font-weight:700}
.cb.sel{background:#4f46e5;color:#fff;border-color:#4f46e5}
.pic.okc{background:var(--okbg);border-color:#6ee7b7}
.pic.egp{background:#f5f3ff;border-color:#c4b5fd}
.pmsg{font-size:11px;color:var(--mut);min-height:28px;line-height:1.35}
.pic.okc .pmsg{color:#065f46}
.tchip{display:inline-block;margin:2px;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:800;animation:pop .35s}

/* speaking / writing */
.pickrow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.pk{border:2px solid #d6dafc;background:#fff;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:#3730a3;transition:.15s}
.pk:hover{border-color:#6366f1}.pk.on{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 3px 9px rgba(79,70,229,.3)}
.out{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.7;color:#1f2937}
.cue{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:13px}
.cue b{color:#7c3aed}
.ck{display:flex;gap:9px;align-items:center;padding:7px 10px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:6px;background:#fff;cursor:pointer;font-size:13px;transition:.15s}
.ck:hover{border-color:#a5b4fc}.ck.on{background:var(--okbg);border-color:#6ee7b7}
.ck .bx{width:20px;height:20px;border-radius:6px;border:2px solid #c7d2fe;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:none}
.ck.on .bx{background:#10b981;border-color:#10b981}
.wr{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--line)}
.wr .cues{flex-basis:100%;font-size:13px;color:#4338ca;font-weight:700;padding-left:28px}
.wr input{flex:1;min-width:260px;border:1.5px solid #c7d2fe;border-radius:10px;padding:6px 10px;font-size:13.5px;outline:none}
.wr input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.wr input.good{border-color:#10b981;background:var(--okbg)}.wr input.near{border-color:#f59e0b;background:var(--ambg)}
.wr .n{width:22px;height:22px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-top:5px}
textarea.ta{width:100%;min-height:110px;border:2px solid #c7d2fe;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.6;outline:none;resize:vertical}
textarea.ta:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.wc{display:flex;align-items:center;gap:8px;margin:6px 0}
.wcbar{flex:1;height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;position:relative}
.wcbar i{display:block;height:100%;background:#f59e0b;border-radius:8px;transition:width .2s,background .2s}
.wcn{font-weight:900;font-size:13px;min-width:92px;text-align:right}

/* listening */
.player{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#eef2ff,#faf5ff);border:1px solid #c7d2fe;border-radius:16px;padding:12px 14px;margin-bottom:8px}
.play{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,#4f46e5,#c026d3);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(79,70,229,.4);flex:none}
.play:hover{transform:scale(1.07)}
.ss{padding:1px 2px;border-radius:5px;transition:.2s}.ss.now{background:#fde68a}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:4px;background:#6366f1;border-radius:3px;height:6px}
.eq.on i{animation:eq .8s ease-in-out infinite}.eq.on i:nth-child(2){animation-delay:.15s}.eq.on i:nth-child(3){animation-delay:.3s}.eq.on i:nth-child(4){animation-delay:.45s}
@keyframes eq{50%{height:22px}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,27,75,.55);display:flex;align-items:center;justify-content:center;z-index:50;animation:fade .2s}
.mbox{width:min(560px,92%);max-height:430px;overflow:auto;background:#fff;border-radius:20px;padding:18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox h2{color:#312e81;font-size:19px}.mbox .sub{color:var(--mut);font-size:12.5px;margin-bottom:8px}
.obj{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5}
.obj .oi{font-size:19px}.obj b{color:#4338ca}

@media (max-width:760px){
  .app{flex-direction:column}.side{width:100%;flex-direction:row;align-items:center;padding:6px 8px;gap:6px;overflow-x:auto}
  .logo,.prog{display:none}.nav{flex-direction:row;flex:none}.ni{width:auto;flex:none}
  .grid2,.grid3,.split,.qz-main,.mg{grid-template-columns:1fr}.pics{grid-template-columns:repeat(2,1fr)}.vrow{grid-template-columns:40px 1fr}.vrow .vright{grid-column:1/-1}
  .body.split{overflow:auto}.split>div{height:auto;overflow:visible}
}

<body>
<div class="app">
  <aside class="side">
    <div class="logo" onclick="showObjectives()" title="Xem mục tiêu bài học">
      <div class="lg">🎯</div><div><b>UNIT 1</b><small>My Hobbies</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="prog"><div class="pbar"><i id="pbar"></i></div><small id="ptxt"></small></div>
  </aside>
  <main class="main">
    <header class="head"><div class="hi" id="hi"></div><div><h1 id="ttl"></h1><p id="dsc"></p></div></header>
    <div class="subnav" id="subnav"></div>
    <div class="body" id="body"></div>
  </main>
</div>
<script>/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normA = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,!?;:"“”]/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hl = s => s.replace(/\{\{(.+?)\}\}/g, '<mark>$1</mark>');
const plain = s => s.replace(/\{\{|\}\}/g, '').replace(/<[^>]+>/g, '');
function say(t, rate) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = rate || .9; speechSynthesis.speak(u); } catch (e) {} }
function sayEl(el) { say(el.dataset.w); }
const spk = w => `<button class="spk" data-w="${esc(plain(w))}" onclick="sayEl(this)" title="Nghe">🔊</button>`;
function confetti() {
  const em = ['🎉', '✨', '⭐', '🎊', '💜', '🌟'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = (10 + Math.random() * 80) + '%'; s.style.animationDelay = (Math.random() * .5) + 's'; s.style.fontSize = (14 + Math.random() * 14) + 'px';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2400);
  }
}

/* ================= component registry & progress ================= */
const COMP = {}, DONE = {};
function markDone(id, s, t) { DONE[id] = { s, t }; navRender(); }
function hydrate() { document.querySelectorAll('.comp').forEach(el => { const c = COMP[el.dataset.id]; if (c) c.render(el); }); }
function rerender(id) { const el = document.querySelector(`.comp[data-id="${id}"]`); if (el) COMP[id].render(el); }
const slot = id => `<div class="comp" data-id="${id}"></div>`;

/* ================= QUIZ (one question at a time, explanation panel) ================= */
function fillQ(q, txt) {
  const parts = txt.split(' - '); let k = 0;
  return q.replace(/_{3,}/g, () => `<span class="fillw">${parts[Math.min(k++, parts.length - 1)]}</span>`);
}
function quiz(id, cfg) {
  const prev = COMP[id];
  const st = prev ? prev.st : { i: 0, score: 0, sel: null, res: [], fin: false };
  if (prev) cfg.items = prev.cfg.items; else if (cfg.regen) cfg.items = cfg.regen();
  COMP[id] = { st, cfg, render: el => qzRender(id, el) };
  return slot(id);
}
function qzRender(id, el) {
  const { st, cfg } = COMP[id], items = cfg.items, n = items.length;
  if (st.fin) { el.innerHTML = qzResult(id); return; }
  const it = items[st.i], L = cfg.labels || ['A', 'B', 'C', 'D'], ans = st.sel !== null, ok = ans && st.sel === it.a;
  const opts = it.opts.map((o, j) => {
    let c = 'qo'; if (ans) { c += ' lock'; if (j === it.a) c += ' ok'; else if (j === st.sel) c += ' bad'; }
    return `<button class="${c}" onclick="qzPick('${id}',${j})"><b>${L[j]}</b><span>${o}</span></button>`;
  }).join('');
  const q = ans ? fillQ(it.q, it.opts[it.a]) : it.q.replace(/_{3,}/g, '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  const fb = ans
    ? `<div class="fb ${ok ? 'ok' : 'bad'}"><div class="fb-h">${ok ? '🎉 Chính xác!' : '❌ Chưa đúng'}<small>Đáp án đúng: <b>${L[it.a]}. ${it.opts[it.a]}</b></small></div><div class="fb-b">${it.exp || ''}</div></div>
       <button class="btn solid fb-n" onclick="qzNext('${id}')">${st.i === n - 1 ? 'Xem kết quả →' : 'Câu tiếp theo →'}</button>`
    : `<div class="fb idle"><div class="idle-i">💡</div><p>Chọn một đáp án.<br>Giải thích và nghĩa sẽ hiện ở đây.</p></div>`;
  el.innerHTML = `<div class="qz">
    <div class="qz-top"><span class="qz-title">${cfg.title}</span><span class="chip-s">Câu ${st.i + 1}/${n}</span><span class="chip-s ok">★ ${st.score}</span></div>
    <div class="qz-bar"><i style="width:${(st.i + (ans ? 1 : 0)) / n * 100}%"></i></div>
    ${cfg.note ? `<div class="note">${cfg.note}</div>` : ''}
    <div class="qz-main"><div><div class="qz-q">${q}</div><div class="qz-opts ${cfg.tf ? 'tf' : ''}">${opts}</div></div><div>${fb}</div></div></div>`;
}
function qzPick(id, j) {
  const { st, cfg } = COMP[id]; if (st.sel !== null) return;
  st.sel = j; st.res[st.i] = j; if (j === cfg.items[st.i].a) st.score++;
  rerender(id);
}
function qzNext(id) {
  const { st, cfg } = COMP[id]; st.sel = null; st.i++;
  if (st.i >= cfg.items.length) { st.fin = true; markDone(id, st.score, cfg.items.length); if (st.score === cfg.items.length) confetti(); }
  rerender(id);
}
function qzRestart(id) {
  const c = COMP[id]; Object.assign(c.st, { i: 0, score: 0, sel: null, res: [], fin: false });
  if (c.cfg.regen) c.cfg.items = c.cfg.regen();
  rerender(id);
}
function qzResult(id) {
  const { st, cfg } = COMP[id], n = cfg.items.length, pct = Math.round(st.score / n * 100), L = cfg.labels || ['A', 'B', 'C', 'D'];
  const msg = pct === 100 ? 'Xuất sắc! 🏆' : pct >= 80 ? 'Rất tốt! 👏' : pct >= 50 ? 'Khá ổn, cố thêm chút nữa! 💪' : 'Đừng nản, thử lại nhé! 🌱';
  const wrong = cfg.items.map((it, i) => ({ it, i })).filter(x => st.res[x.i] !== x.it.a);
  return `<div class="qz-res"><div class="ring" style="--pct:${pct}%"><span>${st.score}/${n}</span></div><h3>${msg}</h3>
    <p class="muted">${esc(plain(cfg.title))}</p>
    <div class="acts"><button class="btn solid" onclick="qzRestart('${id}')">↺ Làm lại</button></div>
    ${wrong.length ? `<div class="wl"><div class="colh">Các câu cần xem lại (${wrong.length})</div>${wrong.map(({ it, i }) => `<details><summary>Câu ${i + 1}: ${fillQ(it.q, it.opts[it.a])}</summary><div class="fb-b">Bạn chọn: <b>${L[st.res[i]]}. ${it.opts[st.res[i]]}</b> · Đáp án: <b>${L[it.a]}. ${it.opts[it.a]}</b><br>${it.exp || ''}</div></details>`).join('')}</div>` : '<p class="muted">Bạn đã trả lời đúng tất cả các câu 🎯</p>'}</div>`;
}
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  const m = document.querySelector('.comp .qz-main'); if (!m) return;
  const id = m.closest('.comp').dataset.id, { st, cfg } = COMP[id], k = e.key.toLowerCase();
  if (st.sel === null) {
    const labs = (cfg.labels || ['A', 'B', 'C', 'D']).map(x => x.toLowerCase());
    let j = labs.indexOf(k); if (j < 0) j = ['1', '2', '3', '4'].indexOf(k);
    if (j >= 0 && j < cfg.items[st.i].opts.length) qzPick(id, j);
  } else if (['enter', 'arrowright', ' '].includes(k)) { e.preventDefault(); qzNext(id); }
});
function meanExp(opts, mean, a, tr, note) {
  return `<table class="mt">${opts.map((o, j) => `<tr class="${j === a ? 'hit' : ''}"><td>${'ABCD'[j]}. <b>${o}</b></td><td>${mean[j]}</td></tr>`).join('')}</table>${note ? `<p class="fb-note">${note}</p>` : ''}${tr ? `<p class="fb-tr">🇻🇳 ${tr}</p>` : ''}`;
}
const ruleExp = (rule, tr) => `<p>${rule}</p>${tr ? `<p class="fb-tr">🇻🇳 ${tr}</p>` : ''}`;

/* ================= FILL (typing or tap-to-fill word bank) ================= */
function fill(id, cfg) {
  const prev = COMP[id];
  const st = prev ? prev.st : { vals: {}, checked: false, res: [], active: null, score: 0 };
  COMP[id] = { st, cfg, render: el => flRender(id, el) };
  return slot(id);
}
function flRender(id, el) {
  const { st, cfg } = COMP[id], bank = cfg.bank, items = cfg.items;
  const used = Object.values(st.vals);
  const rows = items.map((it, i) => {
    let k = 0;
    const q = it.q.replace(/___/g, () => {
      const key = i + '-' + k, v = st.vals[key] || '', kk = k++;
      const cls = st.checked ? (st.res[i] && st.res[i][kk] ? ' good' : ' bad') : '';
      if (bank) return `<button class="slot${st.active === key ? ' act' : ''}${cls}" onclick="flSlot('${id}','${key}')">${v || '&nbsp;'}</button>`;
      return `<input class="fi${cls}" data-key="${key}" value="${esc(v)}" autocomplete="off" spellcheck="false" oninput="COMP['${id}'].st.vals['${key}']=this.value" onkeydown="flKey(event,'${id}')">`;
    });
    let fb = '';
    if (st.checked) {
      const ok = st.res[i] && st.res[i].every(Boolean);
      fb = `<div class="fxfb ${ok ? 'ok' : 'bad'}">${ok ? '✓ Đúng.' : '✗ Đáp án: <b>' + it.a.map(x => x.split('/')[0]).join(' … ') + '</b>.'} ${it.exp || ''}${it.tr ? `<span class="tr">🇻🇳 ${it.tr}</span>` : ''}</div>`;
    }
    return `<div class="fx"><span class="n">${i + 1}</span><span>${q}</span>${fb}</div>`;
  }).join('');
  el.innerHTML = `<div class="fl-top"><span class="t">${cfg.title}</span>
      <span class="chip-s ok" ${st.checked ? '' : 'style="display:none"'}>★ ${st.score}/${items.length}</span>
      <button class="btn solid" onclick="flCheck('${id}')">✔ Kiểm tra</button><button class="btn" onclick="flReveal('${id}')">💡 Xem đáp án</button><button class="btn" onclick="flReset('${id}')">↺ Làm lại</button></div>
    ${cfg.note ? `<div class="note">${cfg.note}</div>` : ''}
    ${bank ? `<div class="bank">${bank.map(w => `<button class="bk${used.includes(w) ? ' used' : ''}" onclick="flPut('${id}',this.dataset.w)" data-w="${esc(w)}">${w}</button>`).join('')}</div>` : ''}
    ${rows}`;
}
function flKey(e, id) {
  if (e.key !== 'Enter') return;
  const ins = [...document.querySelectorAll(`.comp[data-id="${id}"] input.fi`)], i = ins.indexOf(e.target);
  if (i < ins.length - 1) ins[i + 1].focus(); else flCheck(id);
}
function flSlot(id, key) {
  const { st } = COMP[id]; if (st.checked) return;
  if (st.vals[key]) { delete st.vals[key]; st.active = key; } else st.active = st.active === key ? null : key;
  rerender(id);
}
function flPut(id, w) {
  const { st, cfg } = COMP[id]; if (st.checked || Object.values(st.vals).includes(w)) return;
  let key = st.active;
  if (!key || st.vals[key]) { key = null; cfg.items.forEach((it, i) => it.a.forEach((_, k) => { const kk = i + '-' + k; if (!key && !st.vals[kk]) key = kk; })); }
  if (!key) return;
  st.vals[key] = w; st.active = null;
  let nx = null; cfg.items.forEach((it, i) => it.a.forEach((_, k) => { const kk = i + '-' + k; if (!nx && !st.vals[kk]) nx = kk; }));
  st.active = nx; rerender(id);
}
function flCheck(id) {
  const { st, cfg } = COMP[id]; let s = 0;
  st.res = cfg.items.map((it, i) => it.a.map((a, k) => a.split('/').map(normA).includes(normA(st.vals[i + '-' + k] || ''))));
  cfg.items.forEach((it, i) => { if (st.res[i].every(Boolean)) s++; });
  st.score = s; st.checked = true; st.active = null; markDone(id, s, cfg.items.length);
  if (s === cfg.items.length) confetti(); rerender(id);
}
function flReveal(id) {
  const { st, cfg } = COMP[id];
  cfg.items.forEach((it, i) => it.a.forEach((a, k) => { st.vals[i + '-' + k] = a.split('/')[0]; })); flCheck(id);
}
function flReset(id) { const { st } = COMP[id]; Object.assign(st, { vals: {}, checked: false, res: [], active: null, score: 0 }); rerender(id); }

/* ================= SENTENCE BUILDER ================= */
function builder(id, cfg) {
  const prev = COMP[id];
  const st = prev ? prev.st : { i: 0, score: 0, fin: false, checked: false, ok: false, placed: [], pool: null };
  if (!st.pool) st.pool = bdShuffle(cfg.items[0].w);
  COMP[id] = { st, cfg, render: el => bdRender(id, el) };
  return slot(id);
}
function bdShuffle(w) { let p, tries = 0; do { p = shuffle(w.map((x, i) => i)); tries++; } while (p.join() === w.map((x, i) => i).join() && tries < 9); return p; }
function bdRender(id, el) {
  const { st, cfg } = COMP[id], items = cfg.items, n = items.length;

  const it = items[st.i], words = it.w;

  el.innerHTML = `<div class="qz-top"><span class="qz-title">${cfg.title}</span><span class="chip-s">Câu ${st.i + 1}/${n}</span><span class="chip-s ok">★ ${st.score}</span></div>

    <div class="bd-line ${st.checked ? (st.ok ? 'ok' : 'bad') : ''}">${st.placed.length ? st.placed.map(x => `<button class="wd in" onclick="bdBack('${id}',${x})">${words[x]}</button>`).join('') : '<span class="bd-hint">Câu của bạn sẽ hiện ở đây…</span>'}</div>
    <div class="bd-pool">${pool.map(x => `<button class="wd" onclick="bdAdd('${id}',${x})">${words[x]}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      ${st.checked ? `<button class="btn solid" onclick="bdNext('${id}')">${st.i === n - 1 ? 'Xem kết quả →' : 'Câu tiếp theo →'}</button>`
        : `<button class="btn solid" onclick="bdCheck('${id}')" ${st.placed.length ? '' : 'disabled'}>✔ Kiểm tra</button><button class="btn" onclick="bdClear('${id}')">Xóa hết</button>`}
    </div>
    ${st.checked ? `<div class="fb ${st.ok ? 'ok' : 'bad'}" style="margin-top:8px;position:static"><div class="fb-h">${st.ok ? '🎉 Chính xác!' : '❌ Chưa đúng'}<small>Câu đúng: <b>${words.join(' ')}</b></small></div><div class="fb-b">${it.exp || ''}<p class="fb-tr">🇻🇳 ${it.vi}</p></div></div>` : ''}`;
}
function bdAdd(id, x) { const { st } = COMP[id]; if (st.checked) return; st.placed.push(x); rerender(id); }
function bdBack(id, x) { const { st } = COMP[id]; if (st.checked) return; st.placed = st.placed.filter(y => y !== x); rerender(id); }
function bdClear(id) { COMP[id].st.placed = []; rerender(id); }
function bdCheck(id) {
  const { st, cfg } = COMP[id], w = cfg.items[st.i].w;
  st.ok = normA(st.placed.map(x => w[x]).join(' ')) === normA(w.join(' '));
  if (st.ok) st.score++; st.checked = true; rerender(id);
}
function bdNext(id) {
  const { st, cfg } = COMP[id]; st.i++; st.checked = false; st.placed = [];
  if (st.i >= cfg.items.length) { st.fin = true; markDone(id, st.score, cfg.items.length); if (st.score === cfg.items.length) confetti(); }
  else st.pool = bdShuffle(cfg.items[st.i].w);
  rerender(id);
}
function bdRestart(id) { const { st, cfg } = COMP[id]; Object.assign(st, { i: 0, score: 0, fin: false, checked: false, placed: [], pool: bdShuffle(cfg.items[0].w) }); rerender(id); }

/* ================= MATCH GAME ================= */
function matchGame(id, pool) {
  const prev = COMP[id];
  const st = prev ? prev.st : { round: null, sel: null, done: [], moves: 0, err: null, rounds: 0 };
  if (!st.round) matchNew(st, pool);
  COMP[id] = { st, pool, render: el => mgRender(id, el) };
  return slot(id);
}
function matchNew(st, pool) { const r = shuffle(pool).slice(0, 6); st.round = { L: r, R: shuffle(r) }; st.sel = null; st.done = []; st.moves = 0; st.err = null; }
function mgRender(id, el) {
  const { st } = COMP[id], { L, R } = st.round, fin = st.done.length === L.length;
  const left = L.map((v, i) => `<button class="mc ${st.done.includes(v.w) ? 'lock' : ''} ${st.sel && st.sel.side === 'L' && st.sel.w === v.w ? 'sel' : ''} ${st.err && st.err.includes('L:' + v.w) ? 'err' : ''}" onclick="mgPick('${id}','L',this.dataset.w)" data-w="${esc(v.w)}">${v.em || ''} ${v.w}</button>`);
  const right = R.map(v => `<button class="mc vi ${st.done.includes(v.w) ? 'lock' : ''} ${st.sel && st.sel.side === 'R' && st.sel.w === v.w ? 'sel' : ''} ${st.err && st.err.includes('R:' + v.w) ? 'err' : ''}" onclick="mgPick('${id}','R',this.dataset.w)" data-w="${esc(v.w)}">${v.vi}</button>`);
  el.innerHTML = `<div class="mg-top"><b style="color:#312e81;font-size:13.5px;flex:1">Ghép mỗi từ tiếng Anh với nghĩa tiếng Việt đúng</b><span class="chip-s">Ghép đúng ${st.done.length}/${L.length}</span><span class="chip-s">Lượt: ${st.moves}</span><button class="btn" onclick="mgNew('${id}')">🔀 Vòng mới</button></div>
    <div class="mg">${L.map((_, i) => left[i] + right[i]).join('')}</div>
    ${fin ? `<div class="note" style="margin-top:10px;background:#ecfdf5;border-color:#10b981">🎉 Hoàn thành sau <b>${st.moves}</b> lượt! Bấm “Vòng mới” để chơi với 6 từ khác.</div>` : ''}`;
}
function mgPick(id, side, w) {
  const { st } = COMP[id]; if (st.done.includes(w) || st.err) return;
  if (!st.sel || st.sel.side === side) { st.sel = { side, w }; rerender(id); return; }
  st.moves++; const a = st.sel; st.sel = null;
  if (a.w === w) { st.done.push(w); if (st.done.length === st.round.L.length) { markDone(id, st.round.L.length, st.moves); confetti(); } rerender(id); }
  else { st.err = [`${a.side}:${a.w}`, `${side}:${w}`]; rerender(id); setTimeout(() => { st.err = null; rerender(id); }, 520); }
}
function mgNew(id) { const c = COMP[id]; matchNew(c.st, c.pool); rerender(id); }

/* ================= SIGNAL FINDER (grammar) ================= */
function signals(id, items) {
  const prev = COMP[id];
  const st = prev ? prev.st : { found: {}, wrong: {}, err: null };
  COMP[id] = { st, items, render: el => sgRender(id, el) };
  return slot(id);
}
function sgIdx(it) {
  const toks = it.w.split(' '), ph = it.t.split(' ').map(normA), cl = toks.map(normA);
  for (let i = 0; i < toks.length; i++) { if (ph.every((p, k) => cl[i + k] === p)) return [i, i + ph.length - 1]; }
  return [0, 0];
}
function sgRender(id, el) {
  const { st, items } = COMP[id], n = items.length, nf = Object.keys(st.found).length;
  el.innerHTML = `<div class="fl-top"><span class="t">Tìm dấu hiệu nhận biết thì hiện tại đơn trong mỗi câu</span><span class="chip-s ok">Đã tìm ${nf}/${n}</span><button class="btn" onclick="sgReset('${id}')">↺ Làm lại</button></div>
    ${items.map((it, i) => {
      const [a, b] = sgIdx(it), found = st.found[i];
      return `<div class="sg"><span class="n">${i + 1}</span>${it.w.split(' ').map((t, k) => `<span class="tok ${found && k >= a && k <= b ? 'sig' : ''} ${st.err === i + '-' + k ? 'err' : ''}" onclick="sgPick('${id}',${i},${k})">${t}</span>`).join('')}${found ? `<span class="sgnote">✓ ${it.note}</span>` : ''}</div>`;
    }).join('')}
    ${nf === n ? `<div class="note" style="background:#ecfdf5;border-color:#10b981">🎉 Bạn đã tìm đủ! Số câu tìm đúng ngay lần đầu: <b>${n - Object.keys(st.wrong).length}/${n}</b></div>` : ''}`;
}
function sgPick(id, i, k) {
  const { st, items } = COMP[id]; if (st.found[i]) return;
  const [a, b] = sgIdx(items[i]);
  if (k >= a && k <= b) { st.found[i] = true; if (Object.keys(st.found).length === items.length) { markDone(id, items.length - Object.keys(st.wrong).length, items.length); confetti(); } rerender(id); }
  else { st.wrong[i] = true; st.err = i + '-' + k; rerender(id); setTimeout(() => { st.err = null; rerender(id); }, 400); }
}
function sgReset(id) { Object.assign(COMP[id].st, { found: {}, wrong: {}, err: null }); rerender(id); }

    <table class="t" style="margin-top:10px"><tr><th style="width:50%" class="ph">/ə/</th><th class="ph">/ɜː/</th></tr><tr><td><span class="tchip">${example.w}</span>${col('a')}</td><td>${col('3')}</td></tr></table>`;

function pcCol(id, i, c) { const { st } = COMP[id]; if (st.ok[i]) return; st.c[i] = c; rerender(id); }
function pcSave(id) { document.querySelectorAll(`.comp[data-id="${id}"] .pic input`).forEach((inp, i) => { COMP[id].st.v[i] = inp.value; }); }
function pcCheck(id, i, rr) {
  const { st, items } = COMP[id], p = items[i]; if (st.ok[i]) return;

  if (rr) rerender(id); if (st.ok.filter(Boolean).length === items.length) { markDone(id, items.length, items.length); confetti(); }
}
function pcCheckAll(id) { COMP[id].items.forEach((_, i) => pcCheck(id, i)); rerender(id); }
function pcReveal(id) { const { st, items } = COMP[id]; items.forEach((p, i) => { st.v[i] = p.w; st.c[i] = p.c; }); pcCheckAll(id); }

const WR2 = { text: '', sample: false };
function wcUpdate() {
  const t = document.getElementById('wr2t'); if (!t) return; WR2.text = t.value;
  const n = (t.value.trim().match(/\S+/g) || []).length, bar = document.getElementById('wcb'), lab = document.getElementById('wcn');
  const pct = Math.min(100, n / 80 * 100); bar.style.width = pct + '%';
  const ok = n >= 60 && n <= 80; bar.style.background = ok ? '#10b981' : n > 80 ? '#ef4444' : '#f59e0b';
  lab.textContent = n + ' từ' + (ok ? ' ✓' : n > 80 ? ' (quá dài)' : n >= 60 ? '' : ' (cần ≥ 60)'); lab.style.color = ok ? '#047857' : n > 80 ? '#b91c1c' : '#b45309';
  if (ok && !DONE.wr2) markDone('wr2', n, n);
}
function wcAdd(txt) { const t = document.getElementById('wr2t'); t.value += (t.value && !/\s$/.test(t.value) ? ' ' : '') + txt; t.focus(); wcUpdate(); }

/* ================= LISTENING PLAYER (browser text-to-speech) ================= */
const LS = { sents: [], idx: 0, playing: false, rate: 1 };
function lsPlay(script) {
  try { speechSynthesis.cancel(); } catch (e) { return; }
  LS.sents = script.match(/[^.!?]+[.!?]+/g) || [script]; LS.playing = true; lsUi();
  LS.sents.forEach((s, i) => {
    const u = new SpeechSynthesisUtterance(s.trim()); u.lang = 'en-GB'; u.rate = LS.rate;
    u.onstart = () => { LS.idx = i; document.querySelectorAll('.ss').forEach((e, k) => e.classList.toggle('now', k === i)); };
    if (i === LS.sents.length - 1) u.onend = () => { LS.playing = false; lsUi(); document.querySelectorAll('.ss').forEach(e => e.classList.remove('now')); };
    speechSynthesis.speak(u);
  });
}
function lsStop() { try { speechSynthesis.cancel(); } catch (e) {} LS.playing = false; lsUi(); document.querySelectorAll('.ss').forEach(e => e.classList.remove('now')); }
function lsUi() { const b = document.getElementById('lsbtn'), q = document.getElementById('lseq'); if (b) b.textContent = LS.playing ? '⏹' : '▶'; if (q) q.classList.toggle('on', LS.playing); }

/* ================= SHELL: navigation, sections ================= */
let cur = { s: 0, t: 0 };
function allEx() { return SECTIONS.flatMap(s => s.ex || []); }
function navRender() {
  const total = allEx().length, done = allEx().filter(id => DONE[id]).length;
  $('#nav').innerHTML = SECTIONS.map((s, i) => {
    const all = (s.ex || []).length && s.ex.every(id => DONE[id]);
    return `<button class="ni ${i === cur.s ? 'on' : ''} ${all ? 'done' : ''} ${s.soon ? 'soon' : ''}" onclick="show(${i},0)"><span class="n">${all ? '✓' : i + 1}</span><span class="t">${s.nav || s.title}</span></button>`;
  }).join('');
  $('#pbar').style.width = (total ? done / total * 100 : 0) + '%';
  $('#ptxt').innerHTML = `<span>Hoàn thành</span><b>${done}/${total} bài tập</b>`;
  const sec = SECTIONS[cur.s]; const tabs = document.querySelectorAll('.stab');
  sec.subs.forEach((sb, k) => { if (sb.ex && tabs[k]) { const d = sb.ex.every(i => DONE[i]); const old = tabs[k].querySelector('i'); if (d && !old) tabs[k].insertAdjacentHTML('beforeend', '<i>✓</i>'); } });
}
function show(s, t) {

  $('#hi').textContent = sec.icon; $('#ttl').textContent = sec.title + (sec.vi ? ' · ' + sec.vi : ''); $('#dsc').textContent = sec.desc;
  $('#subnav').innerHTML = sec.subs.length > 1 ? sec.subs.map((x, k) => `<button class="stab ${k === cur.t ? 'on' : ''}" onclick="show(${s},${k})">${x.label}${x.ex && x.ex.every(i => DONE[i]) ? '<i>✓</i>' : ''}</button>`).join('') : '';
  $('#subnav').style.display = sec.subs.length > 1 ? '' : 'none';
  const b = $('#body'); b.className = 'body' + (sub.split ? ' split' : ''); b.innerHTML = sub.render(); b.scrollTop = 0;
  hydrate(); if (sub.after) sub.after(); navRender(); try { speechSynthesis.cancel(); } catch (e) {} LS.playing = false;
}
function showObjectives() {

    <div class="vright"><div class="vm" onclick="this.classList.add('rev')">${v.vi}</div><div class="ven">${hl(v.en)} ${spk(v.en)}</div><div class="vvi" onclick="this.classList.add('rev')">${v.ev}</div></div></div>`;
}
function vocList() {
  return `<div class="tools"><input class="search" placeholder="🔍  Tìm từ hoặc nghĩa tiếng Việt…" oninput="vocFilter(this.value)"><button class="btn" id="hidebtn" onclick="vocHide()">${VS.hide ? '👁 Hiện nghĩa' : '🙈 Ẩn nghĩa để tự kiểm tra'}</button><span class="muted">${VOC.length} từ</span></div>

}
function vocFilter(q) { q = q.toLowerCase().trim(); document.querySelectorAll('.vrow').forEach(r => { r.style.display = !q || r.dataset.s.includes(q) ? '' : 'none'; }); }
function vocHide() {
  VS.hide = !VS.hide; $('#vlist').classList.toggle('hide-mean', VS.hide); $('#hidebtn').textContent = VS.hide ? '👁 Hiện nghĩa' : '🙈 Ẩn nghĩa để tự kiểm tra';
  document.querySelectorAll('#vlist .rev').forEach(e => e.classList.remove('rev'));
}
/* flashcards with known / not-known */
const FC = { deck: null, known: [], i: 0, back: false };
function fcInit() { if (!FC.deck) { FC.deck = VOC.map((_, i) => i); FC.known = []; FC.i = 0; FC.back = false; } }
function fcView() {
  fcInit(); return `<div class="fcwrap"><div class="fcnav"><span class="chip-s" id="fc-n"></span><span class="muted">Bấm vào thẻ để lật · “Đã thuộc” sẽ bỏ thẻ khỏi vòng ôn</span><button class="btn sm" onclick="fcReset()">↺ Học lại từ đầu</button></div>
    <div class="fcdots" id="fc-d"></div><div id="fc" class="fcard" onclick="fcFlip()"></div>
    <div class="fcbtns"><button class="btn" onclick="fcMark(false)">😅 Chưa thuộc</button><button class="btn" onclick="fcSay()">🔊 Nghe</button><button class="btn solid" onclick="fcFlip()">Lật thẻ</button><button class="btn" onclick="fcMark(true)">😎 Đã thuộc</button></div></div>`;
}
function fcRender() {
  const el = $('#fc'); if (!el) return; fcInit();
  if (!FC.deck.length) { el.className = 'fcard back'; el.onclick = null; el.innerHTML = `<div class="fc-em">🏆</div><div class="fc-m">Bạn đã thuộc cả ${VOC.length} từ!</div><div class="fc-hint">Bấm “Học lại từ đầu” để ôn thêm</div>`; $('#fc-n').textContent = `Còn 0/${VOC.length} từ`; return; }
  el.onclick = fcFlip;
  const v = VOC[FC.deck[FC.i]];
  el.className = 'fcard' + (FC.back ? ' back' : '');
  el.innerHTML = FC.back
    ? `<div class="fc-m">${v.vi}</div>${v.pos ? `<span class="pos ${posCls(v.pos)}">${v.pos}</span>` : ''}<div class="fc-e">${hl(v.en)}</div><div class="fc-v">${v.ev}</div>`
    : `<div class="fc-em">${v.em}</div><div class="fc-w">${v.w}</div><div class="fc-p">${v.p}</div>${v.pos ? `<span class="pos ${posCls(v.pos)}">${v.pos}</span>` : ''}<div class="fc-hint">Bấm để xem nghĩa</div>`;
  $('#fc-n').textContent = `Còn ${FC.deck.length}/${VOC.length} từ`;
  $('#fc-d').innerHTML = VOC.map((_, i) => `<i class="${FC.known.includes(i) ? 'k' : ''} ${FC.deck[FC.i] === i ? 'cur' : ''}"></i>`).join('');
}
function fcFlip() { FC.back = !FC.back; fcRender(); }
function fcSay() { if (FC.deck.length) say(VOC[FC.deck[FC.i]].w); }
function fcMark(k) {
  if (!FC.deck.length) return; const idx = FC.deck[FC.i];
  if (k) { FC.known.push(idx); FC.deck.splice(FC.i, 1); if (FC.i >= FC.deck.length) FC.i = 0; } else FC.i = (FC.i + 1) % FC.deck.length;
  FC.back = false; fcRender(); if (k && !FC.deck.length) confetti();
}
function fcReset() { FC.deck = null; fcInit(); fcRender(); }
