 diễn tả ý đồng tình với câu khẳng định“My grandmother loves folk music” (Bà tôi thích nhạc dân gian), ta dùng “too”.", "Dịch nghĩa: My grandmother loves folk music, and I like it too. (Bà tôi thích nhạc dân gian, và tôi cũng thích nó.)", "2.Đáp án: either", "Giải thích: Để diễn tả ý đồng tình với câu phủ định “My father doesn’t enjoy pop music” (Bố tôi không thích nhạc pop), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng trợ động từ ở dạng phủ định là “doesn’t” và sau cùng là “either”.", "Dịch nghĩa: My father doesn’t enjoy pop music, and my mother doesn’t either. (Bố tôi không thích nhạc pop, và mẹ tôi cũng vậy.)", "3.Đáp án: too", "Giải thích: Để diễn tả ý bổ sung vào câu khẳng định “I love country music” (Tôi yêu thích nhạc đồng quê), ta dùng “too”.", "Dịch nghĩa: I love country music, and I like modern music too. (Tôi yêu thích nhạc đồng quê, và tôi cũng thích nhạc hiện đại.)", "4.Đáp án: too", "Giải thích: Để diễn tả ý đồng tình với câu khẳng định “Her friends want to go to the opera” (Bạn bè của cô ấy muốn đi xem kịch), ta dùng “too”.", "Dịch nghĩa: Her friends want to see an opera and she does too. (Bạn bè của cô ấy muốn đi xem kịch và cô ấy cũng vậy.)", "5.Đáp án: either", "Giải thích: Để diễn tả ý đồng tình với câu phủ định “We don’t eat meat” (Chúng tôi không ăn thịt), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng trợ động từ ở dạng phủ định là “don’t” và sau cùng là “either”.", "Dịch nghĩa: We don’t eat meat and they don’t either. (Chúng tôi không ăn thịt và họ cũng vậy.)", "6.Đáp án: either", "Giải thích: Để diễn tả ý đồng tình với câu phủ định I’ve never been to the States.” (Tôi chưa bao giờ đến Hoa Kỳ.), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng trợ động từ dạng phủ định ở thì hiện tại hoàn thành là “haven’t” và sau cùng là “either”.", "Dịch nghĩa: - I’ve never been to the States. - I haven’t either. (- Tôi chưa bao giờ đến Hoa Kỳ. - Tôi cũng chưa đến đó.)", "7.Đáp án: too", "Giải thích: Để diễn tả ý đồng tình với câu khẳng định “She is very good at speaking English” (Cô ấy nói tiếng Anh rất giỏi), ta dùng “too”.", "Dịch nghĩa: She is very good at speaking English and her children are too. (Cô ấy nói tiếng Anh rất giỏi và các con của cô cũng vậy.)", "8.Đáp án: either", "Giải thích: Để diễn tả ý bổ sung vào câu phủ địnhTm not allowed to eat another piece of cake” (Tôi không được phép ăn một miếng bánh nào nữa), ta dùng “either”.", "Dịch nghĩa: I’m not allowed to eat another piece of cake, so you’re not either! (Tôi không được phép ăn một miếng bánh nào nữa, vì vậy bạn cũng không được ăn!)", "9.Đáp án: too", "Giải thích: Để diễn tả ý đồng tình với câu khẳng định “My younger brother hates watching that movie” (Em trai tôi ghét xem phim đó), ta dùng “too”.", "Dịch nghĩa: My younger brother hates watching that movie, and I do too. (Em trai tôi ghét xem bộ phim đó, và tôi cũng vậy.)", "10. Đáp án: either", "Giải thích: Để diễn tả ý đồng tình với câu phủ định “His team can’t finish the project on time” (Nhóm của anh ấy không thể hoàn thành dự án đúng hạn), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng động từ khuyết thiếu ở dạng phủ định là “can’t” và sau cùng là “either”.", "Dịch nghĩa: His team can’t finish the project on time, and my team can’t either. (Nhóm của anh ấy không thể hoàn thành dự án đúng hạn và nhóm của tôi cũng vậy.)", "11. Đáp án: either", "Giải thích: Để diễn tả ý đồng tình với câu phủ định “My father doesn’t like listening to rock music.” (Bố tôi không thích nghe nhạc rock.), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng trự động từ ở dạng phủ định là “doesn’t” và sau cùng là “either”.", "Dịch nghĩa: Jack: My father doesn’t like listening to rock music. (Bố tôi không thích nghe nhạc rock.)", "Jill: My father doesn’t either. (Bố tôi cũng vậy.)", "12. Đáp án: too", "Giải thích: Để diễn tả ý đồng tình với điều khẳng định “She loves playing the guitar” (Cô ấy thích chơi đàn ghi ta) trước đó, ta dùng “too”.", "Dịch nghĩa: She loves playing the guitar and her daughter loves it too. (Cô ấy thích chơi đàn ghi ta và con gái cô ấy cũng vậy.)", "13. Đáp án: either", "Giải thích: Để diễn tả ý bổ sung “he doesn’t” (anh ấy không tin tôi) vào câu phủ định “They don’t believe me” (Họ không tin tôi), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng trợ động từ ở dạng phủ định là “doesn’t” và sau cùng là “either”.", "Dịch nghĩa: They don’t believe me, and he doesn’t either. (Họ không tin tôi, và anh ta cũng vậy.)", "14. Đáp án: too", "Giải thích: Để diễn tả ý bổ sung “Dung can do it” (Dũng có thể làm điều đó) vào câu khẳng định “Hoa can control the puppets” (Hoa có thể điều khiển những con rối), ta dùng “too”.", "Dịch nghĩa: Hoa can control the puppets and Dung can do it too. (Hoa có thể điều khiển những con rối và Dũng cũng có thể làm điều đó.)", "15. Đáp án: either", "Giải thích: Để diễn tả ý đồng tình với câu phủ định “He doesn’t want to watch that movie again” (Anh ấy không muốn xem lại bộ phim đó), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng trợ động từ ở dạng phủ định là “don’t” và sau cùng là “either”.", "Dịch nghĩa: He doesn’t want to watch that movie again, and I don’t either. (Anh ấy không muốn xem lại bộ phim đó, và tôi cũng vậy.)", "16. Đáp án: too", "Giải thích: Để diễn tả ý đồng tình với câu khẳng định“I love rock ‘n roll.” (Tôi yêu thích nhạc rock ‘n roll.), ta dùng “too”.", "Dịch nghĩa: - I love rock ‘n roll. - I love it too. (Tôi yêu thích nhạc rock ‘n roll. - Tôi cũng thích nó.)", "17. Đáp án: either", "Giải thích: Để diễn tả ý đòng tình với câu phủ định “Jessica doesn’t enjoy watching documentaries” (Jessica không thích xem phim tài liệu), ta dùng “either”. Đây là câu đòng tình rút gọn nên chúng ta chỉ cần sử dụng trự động từ ở dạng phủ định là “doesn’t” và sau cùng là “either”.", "Dịch nghĩa: Jessica doesn’t enjoy watching documentaries, and my brother doesn’t either. (Jessica không thích xem phim tài liệu, và anh trai tôi cũng vậy.)", "18. Đáp án: too", "Giải thích: Để diễn tả ý đồng tình với câu khẳng định “Mai is interested in seeing water puppet shows” (Mai thích xem các chương trình múa rối nước), ta dùng “too”.", "Dịch nghĩa: Mai is interested in seeing water puppet shows and I am too. (Mai thích xem các chương trình múa rối nước và tôi cũng vậy.)", "19. Đáp án: too", "Giải thích: Để diễn tả ý đồng tình với câu khẳng định “Michael likes collecting modern sculpture” (Michael thích sưu tập các tác phẩm điêu khắc hiện đại), ta dùng “too”.", "Dịch nghĩa: Michael likes collecting modern sculpture and Simon does too. (Michael thích sưu tập các tác phẩm điêu khắc hiện đại và Simon cũng vậy.)", "20. Đáp án: either", "Giải thích: Để diễn tả ý bổ sung “it doesn’t fit you” (chiếc váy không vừa với bạn) vào câu phủ định “This dress isn’t beautiful” (Chiếc váy này không đẹp) trước đó, ta dùng “either”.", "Dịch nghĩa: This dress isn’t beautiful and it doesn’t fit you either! (Chiếc váy này không đẹp và cũng không vừa với bạn!)"]}, "R_I": {"ents": [{"n": 1, "ans": "roots", "expl": "", "tr": "roots (the origins of something or someone): nguồn gốc (nguồn gốc của một cái gì đó hoặc ai đó)", "raw": "Dịch nghĩa: roots (the origins of something or someone): nguồn gốc (nguồn gốc của một cái gì đó hoặc ai đó)"}, {"n": 2, "ans": "appealing", "expl": "", "tr": "appealing (interesting or attractive): hấp dẫn (thú vị hoặc thu hút)", "raw": "Dịch nghĩa: appealing (interesting or attractive): hấp dẫn (thú vị hoặc thu hút)"}, {"n": 3, "ans": "genres", "expl": "", "tr": "genres (type or style of music, art, or literature): thể loại (loại hoặc phong cách âm nhạc, nghệ thuật hoặc văn học)", "raw": "Dịch nghĩa: genres (type or style of music, art, or literature): thể loại (loại hoặc phong cách âm nhạc, nghệ thuật hoặc văn học)"}, {"n": 4, "ans": "preserve", "expl": "", "tr": "preserve (to make sure that something is kept): bảo tồn (đảm bảo rằng một cái gì đó được giữ gìn)", "raw": "Dịch nghĩa: preserve (to make sure that something is kept): bảo tồn (đảm bảo rằng một cái gì đó được giữ gìn)"}, {"n": 5, "ans": "capture", "expl": "", "tr": "capture (to record in order to preserve it): ghi lại (thu lại âm thanh để bảo tồn nó) Part 2: Decide whether the statements below are TRUE (T) or FALSE (F).", "raw": "Dịch nghĩa: capture (to record in order to preserve it): ghi lại (thu lại âm thanh để bảo tồn nó)\nPart 2: Decide whether the statements below are TRUE (T) or FALSE (F)."}, {"n": 1, "ans": "True", "expl": "Thông tin ở câu thứ ba của đoạn 1: “Traditional, or folk music is collected over decades.” Nhạc truyền thống được tập hợp qua nhiều thập kỷ, mà mỗi thập kỷ là 10 năm, tức là qua nhiều năm.", "tr": "Nhạc truyền thống được tập hợp qua nhiều năm.", "raw": "Dịch nghĩa câu hỏi: Nhạc truyền thống được tập hợp qua nhiều năm.\nGiải thích: Thông tin ở câu thứ ba của đoạn 1: “Traditional, or folk music is collected over decades.” Nhạc truyền thống được tập hợp qua nhiều thập kỷ, mà mỗi thập kỷ là 10 năm, tức là qua nhiều năm."}, {"n": 2, "ans": "False", "expl": "Thông tin ở câu cuối của đoạn 1: “Younger generations learn these songs from their elders through practice and repetition.”", "tr": "Những người trẻ tuổi không thể học nhạc truyền thống vì không ai dạy họ.", "raw": "Dịch nghĩa câu hỏi: Những người trẻ tuổi không thể học nhạc truyền thống vì không ai dạy họ.\nGiải thích: Thông tin ở câu cuối của đoạn 1: “Younger generations learn these songs from their elders through practice and repetition.”"}, {"n": 3, "ans": "True", "expl": "Thông tin ở câu thứ 2 của đoạn 2: “Also, younger generations may not find such music very appealing, so once older generations pass away, the music may die out with them.”", "tr": "Thế hệ trẻ ít quan tâm đến các bài hát và nhạc truyền thống như thế hệ cha ông.", "raw": "Dịch nghĩa câu hỏi: Thế hệ trẻ ít quan tâm đến các bài hát và nhạc truyền thống như thế hệ cha ông.\nGiải thích: Thông tin ở câu thứ 2 của đoạn 2: “Also, younger generations may not find such music very appealing, so once older generations pass away, the music may die out with them.”"}, {"n": 4, "ans": "True", "expl": "Thông tin ở câu cuối của bài: “Others try to write out the music so that it can be studied and played by modern musicians.”", "tr": "Mục đích của việc viết lại các bản nhạc trên giấy là để truyền lại cho các ca sĩ hiện đại.", "raw": "Dịch nghĩa câu hỏi: Mục đích của việc viết lại các bản nhạc trên giấy là để truyền lại cho các ca sĩ hiện đại.\nGiải thích: Thông tin ở câu cuối của bài: “Others try to write out the music so that it can be studied and played by modern musicians.”"}], "lines": ["Dịch nghĩa toàn bài:", "Phần lớn âm nhạc chúng ta nghe ngày nay là sự pha trộn của các phong cách từ các quốc gia và thời kỳ khác nhau. Rất nhiều bản nhạc bắt nguồn từ những bài hát truyền thống xưa cũ ở nhiều quốc gia khác nhau trên thế giới. Nhạc truyền thống, hoặc nhạc dân gian, được tập hợp qua nhiều thập kỷ. Các thế hệ trẻ học những bài hát này thông qua việc luyện tập và bắt chước những người lớn tuổi.", "Nhiều người lo ngại rằng các loại nhạc truyền thống và xưa cũ đang dần biến mất, một phần vì chúng ít có khả năng được viết ra hoặc ghi lại. Ngoài ra, thế hệ trẻ có thể không cảm thấy những loại nhạc như vậy hấp dẫn, vì vậy một khi thế hệ cũ ra đi, âm nhạc có thể chết theo họ. Toàn bộ các thể loại âm nhạc có thể bị mai một.", "Hiện nay, ngày càng có nhiều nỗ lực nhằm bảo tồn âm nhạc dưới nhiều hình thức. Một số nhà nghiên cứu tạo ra các bản thu âm hiện trường để ghi lại các buổi biểu diễn trực tiếp. Những người khác cố gắng viết lại các bản nhạc trên giấy để nó có thể được các ca sĩ hiện đại nghiên cứu và biểu diễn.", "Part 1: Find the words in bold which mean:", "1.Đáp án: roots", "Dịch nghĩa: roots (the origins of something or someone): nguồn gốc (nguồn gốc của một cái gì đó hoặc ai đó)", "2.Đáp án: appealing", "Dịch nghĩa: appealing (interesting or attractive): hấp dẫn (thú vị hoặc thu hút)", "3.Đáp án: genres", "Dịch nghĩa: genres (type or style of music, art, or literature): thể loại (loại hoặc phong cách âm nhạc, nghệ thuật hoặc văn học)", "4.Đáp án: preserve", "Dịch nghĩa: preserve (to make sure that something is kept): bảo tồn (đảm bảo rằng một cái gì đó được giữ gìn)", "5.Đáp án: capture", "Dịch nghĩa: capture (to record in order to preserve it): ghi lại (thu lại âm thanh để bảo tồn nó)", "Part 2: Decide whether the statements below are TRUE (T) or FALSE (F).", "1.Đáp án: True", "Dịch nghĩa câu hỏi: Nhạc truyền thống được tập hợp qua nhiều năm.", "Giải thích: Thông tin ở câu thứ ba của đoạn 1: “Traditional, or folk music is collected over decades.” Nhạc truyền thống được tập hợp qua nhiều thập kỷ, mà mỗi thập kỷ là 10 năm, tức là qua nhiều năm.", "2.Đáp án: False", "Dịch nghĩa câu hỏi: Những người trẻ tuổi không thể học nhạc truyền thống vì không ai dạy họ.", "Giải thích: Thông tin ở câu cuối của đoạn 1: “Younger generations learn these songs from their elders through practice and repetition.”", "3.Đáp án: True", "Dịch nghĩa câu hỏi: Thế hệ trẻ ít quan tâm đến các bài hát và nhạc truyền thống như thế hệ cha ông.", "Giải thích: Thông tin ở câu thứ 2 của đoạn 2: “Also, younger generations may not find such music very appealing, so once older generations pass away, the music may die out with them.”", "4.Đáp án: True", "Dịch nghĩa câu hỏi: Mục đích của việc viết lại các bản nhạc trên giấy là để truyền lại cho các ca sĩ hiện đại.", "Giải thích: Thông tin ở câu cuối của bài: “Others try to write out the music so that it can be studied and played by modern musicians.”"]}, "R_II": {"ents": [{"n": 1, "ans": "C. Benefits of music", "expl": "Thông tin trong toàn bái nói về lợi ích của âm nhạc đối với giấc ngủ nên phương án C phù hợp nhất.", "tr": "Ý chính của đoạn văn là gì? A. cách nghe nhạcB. khi nào thì nghe nhạc C. lợi ích của âm nhạcD. âm nhạc và chứng mất ngủ", "raw": "Dịch nghĩa câu hỏi: Ý chính của đoạn văn là gì?\nA. cách nghe nhạcB. khi nào thì nghe nhạc\nC. lợi ích của âm nhạcD. âm nhạc và chứng mất ngủ\nGiải thích: Thông tin trong toàn bái nói về lợi ích của âm nhạc đối với giấc ngủ nên phương án C phù hợp nhất."}, {"n": 2, "ans": "B. flexible", "expl": "Thông tin có ở câu: “[...] research has demonstrated that listening to relaxing classical music can be a safe, effective, and affordable remedy.”", "tr": "Điều nào sau đây KHÔNG được đề cập đến như là một lợi ích của liệu pháp âm nhạc? A. an toànB. linh hoạtC. hiệu quảD. giá cả phải chăng", "raw": "Dịch nghĩa câu hỏi: Điều nào sau đây KHÔNG được đề cập đến như là một lợi ích của liệu pháp âm nhạc?\nA. an toànB. linh hoạtC. hiệu quảD. giá cả phải chăng\nGiải thích: Thông tin có ở câu: “[...] research has demonstrated that listening to relaxing classical music can be a safe, effective, and affordable remedy.”"}, {"n": 3, "ans": "D. effects of music on sleep quality", "expl": "Thông tin có ở câu: “Researchers assessed sleep quality both before and after the intervention.”", "tr": "Mục đích của nghiên cứu nhằm vào sinh viên đại học là để hiểu về_________. A. Sở thích âm nhạc của sinh viên B. âm nhạc cổ điển và sinh viên C. âm nhạc khi đi ngủ D. ảnh hưởng của âm nhạc đến chất lượng giấc ngủ", "raw": "Dịch nghĩa câu hỏi: Mục đích của nghiên cứu nhằm vào sinh viên đại học là để hiểu về_________.\nA. Sở thích âm nhạc của sinh viên\nB. âm nhạc cổ điển và sinh viên\nC. âm nhạc khi đi ngủ\nD. ảnh hưởng của âm nhạc đến chất lượng giấc ngủ\nGiải thích: Thông tin có ở câu: “Researchers assessed sleep quality both before and after the intervention.”"}, {"n": 4, "ans": "B. participants who listened to music", "expl": "Thông tin có ở câu: “The study found that participants who had listened to music had significantly better sleep quality than those who had listened to the audiobook or received no intervention.”", "tr": "Nghiên cứu tìm ra đối tượng nào có chất lượng giấc ngủ tốt hơn đáng kể? A. nhà nghiên cứuB. người tham gia nghe nhạc C. người tham gia nghe sách âm thanhD. người tham gia không can thiệp", "raw": "Dịch nghĩa câu hỏi: Nghiên cứu tìm ra đối tượng nào có chất lượng giấc ngủ tốt hơn đáng kể?\nA. nhà nghiên cứuB. người tham gia nghe nhạc\nC. người tham gia nghe sách âm thanhD. người tham gia không can thiệp\nGiải thích: Thông tin có ở câu: “The study found that participants who had listened to music had significantly better sleep quality than those who had listened to the audiobook or received no intervention.”"}, {"n": 5, "ans": "A. music", "expl": "Thông tin có ở câu: “Since music is an effective treatment for sleeping problems, it could be used as an easy and safe strategy for treating insomnia.” Đại từ “it” thay cho danh từ “music” đã dùng trước đó.", "tr": "Từ mà “it” có nghĩa là gì? A. âm nhạcB. điều trịC. vấn đềD. chiến lược", "raw": "Dịch nghĩa câu hỏi: Từ mà “it” có nghĩa là gì?\nA. âm nhạcB. điều trịC. vấn đềD. chiến lược\nGiải thích: Thông tin có ở câu: “Since music is an effective treatment for sleeping problems, it could be used as an easy and safe strategy for treating insomnia.” Đại từ “it” thay cho danh từ “music” đã dùng trước đó."}], "lines": ["Dịch nghĩa toàn bài:", "Mất ngủ là một vấn đề nghiêm trọng ảnh hưởng đến mọi người ở mọi lứa tuổi. Mặc dù có nhiều cách tiếp cận để điều trị vấn đề này cũng như các bệnh về giấc ngủ phổ biến khác, nghiên cứu đã chứng minh rằng nghe nhạc cổ điển thư giãn có thể là một phương thuốc an toàn, hiệu quả và giá cả phải chăng.", "Trong một nghiên cứu nhằm vào các sinh viên đại học, những người tham gia nghiên cứu này nghe nhạc cổ điển, một cuốn sách âm thanh hoặc không có gì cả. Một nhóm nghe nhạc cổ điển thư giãn 45 phút trong khi một nhóm khác nghe sách âm thanh khi đi ngủ trong ba tuần. Các nhà nghiên cứu đánh giá chất lượng giấc ngủ cả trước và sau khi áp dụng hai kiểu trên.", "Nghiên cứu cho thấy những người tham gia nghe nhạc có chất lượng giấc ngủ tốt hơn đáng kể so với những người đã nghe sách âm thanh hoặc không nhận được sự can thiệp nào.", "Vì âm nhạc là một phương pháp điều trị hiệu quả cho các vấn đề về giấc ngủ, nó có thể được sử dụng như một chiến lược dễ dàng và an toàn để điều trị chứng mất ngủ.", "1.Đáp án: C. Benefits of music", "Dịch nghĩa câu hỏi: Ý chính của đoạn văn là gì?", "A. cách nghe nhạcB. khi nào thì nghe nhạc", "C. lợi ích của âm nhạcD. âm nhạc và chứng mất ngủ", "Giải thích: Thông tin trong toàn bái nói về lợi ích của âm nhạc đối với giấc ngủ nên phương án C phù hợp nhất.", "2.Đáp án: B. flexible", "Dịch nghĩa câu hỏi: Điều nào sau đây KHÔNG được đề cập đến như là một lợi ích của liệu pháp âm nhạc?", "A. an toànB. linh hoạtC. hiệu quảD. giá cả phải chăng", "Giải thích: Thông tin có ở câu: “[...] research has demonstrated that listening to relaxing classical music can be a safe, effective, and affordable remedy.”", "3.Đáp án: D. effects of music on sleep quality", "Dịch nghĩa câu hỏi: Mục đích của nghiên cứu nhằm vào sinh viên đại học là để hiểu về_________.", "A. Sở thích âm nhạc của sinh viên", "B. âm nhạc cổ điển và sinh viên", "C. âm nhạc khi đi ngủ", "D. ảnh hưởng của âm nhạc đến chất lượng giấc ngủ", "Giải thích: Thông tin có ở câu: “Researchers assessed sleep quality both before and after the intervention.”", "4.Đáp án: B. participants who listened to music", "Dịch nghĩa câu hỏi: Nghiên cứu tìm ra đối tượng nào có chất lượng giấc ngủ tốt hơn đáng kể?", "A. nhà nghiên cứuB. người tham gia nghe nhạc", "C. người tham gia nghe sách âm thanhD. người tham gia không can thiệp", "Giải thích: Thông tin có ở câu: “The study found that participants who had listened to music had significantly better sleep quality than those who had listened to the audiobook or received no intervention.”", "5.Đáp án: A. music", "Dịch nghĩa câu hỏi: Từ mà “it” có nghĩa là gì?", "A. âm nhạcB. điều trịC. vấn đềD. chiến lược", "Giải thích: Thông tin có ở câu: “Since music is an effective treatment for sleeping problems, it could be used as an easy and safe strategy for treating insomnia.” Đại từ “it” thay cho danh từ “music” đã dùng trước đó."]}, "L_-": {"ents": [], "lines": ["Listen to the information about two famous artists and do the tasks below.", "Audio script:", "Kazuo Shiraga was an artist from the Gutai art group, which emerged in Japan after World War II. He didn’t paint in the traditional way, with a paintbrush. Instead, he created his paintings using his hands and feet. He wanted to communicate the idea of movement and action in his art. For example, he created “mud paintings” by using his whole body to leave impressions in wet mud.", "Claude Monet was a famous French painter. In the mid-1800s, he helped develop a new style of painting called Impressionism. Monet was famous for his outdoor scenes of lakes and the oceans. He also painted pictures of common objects, such as fruit and flowers. He didn’t mix colours together but made small dots of pure colour.", "Kazuo Shiraga là một họa sĩ đên từ nhóm nghệ thuật Gutai, nổi lên ở Nhật Bản sau Thế chiến thứ II. Ông không vẽ tranh theo cách truyền thống bằng cọ vẽ. Mà thay vào đó, ông đã vẽ những bức tranh của mình bằng tay và chân, ông muốn truyền đạt ý tưởng về sự chuyển động và hành động trong nghệ thuật của mình. Chẳng hạn, ông đã tạo ra những bức tranh trên bùn bằng cách sử dụng toàn bộ cơ thể của mình để tạo hình trong bùn ướt.", "Claude Monet là một họa sĩ nổi tiếng người Pháp. Vào giữa những năm 1800, ông đã giúp phát triển một phong cách hội họa mới gọi là Trường phái ấn tượng. Monet nổi tiếng với các bức tranh về phong cảnh ngoài trời của hồ và đại dương, ông cũng vẽ tranh về các vật thể thông thường, như trái cây và hoa. Ông không pha màu như thông thường mà chấm trực tiếp lên tranh bằng các màu cơ bản."]}, "L_I": {"ents": [{"n": 1, "ans": "traditional", "expl": "Thông tin ở câu sau: “He didn’t paint in the traditional way, with a paintbrush.”", "tr": "Kazuo Shiraga không vẽ theo cá bằng cách_________ sử dụng cọ vẽ.", "raw": "Dịch nghĩa câu hỏi: Kazuo Shiraga không vẽ theo cá bằng cách_________  vẻ và thoải mái hơn vì nó có nhịp điệu lôi cuốn, lời bài hát tuyệt vời và phong cách âm nhạc dễ tiếp cận. Ngoài ra, nó cũng giúp tôi lạc quan và tích cực hơn để tôi có thể làm việc tốt hơn."]}, "W_I": {"ents": [{"n": 1, "ans": "I’m very happy to hear that you are in Viet Nam again.", "expl": "", "tr": "Tôi rất vui khi biết bạn lại đến thăm Việt Nam.", "raw": "Dịch nghĩa: Tôi rất vui khi biết bạn lại đến thăm Việt Nam."}, {"n": 2, "ans": "I want to invite you to see an exhibition of modern sculptures.", "expl": "", "tr": "Tôi muốn mời bạn xem triển lãm các tác phẩm điêu khắc hiện đại.", "raw": "Dịch nghĩa: Tôi muốn mời bạn xem triển lãm các tác phẩm điêu khắc hiện đại."}, {"n": 3, "ans": "Is Sunday morning suitable for you?", "expl": "", "tr": "Sáng Chủ nhật có phù hợp cho bạn không?", "raw": "Dịch nghĩa: Sáng Chủ nhật có phù hợp cho bạn không?"}, {"n": 4, "ans": "The exhibition begins at 9 a.m., so let’s meet at 8.45 a.m. outside the Arts Centre.", "expl": "", "tr": "Triển lãm bắt đầu lúc 9 giờ sáng, vì vậy chúng ta hãy gặp nhau lúc 8 giờ 45 phút ở ngoài Trung tâm Nghệ thuật nhé.", "raw": "Dịch nghĩa: Triển lãm bắt đầu lúc 9 giờ sáng, vì vậy chúng ta hãy gặp nhau lúc 8 giờ 45 phút ở ngoài Trung tâm Nghệ thuật nhé."}, {"n": 5, "ans": "I hope we will have a happy time there.", "expl": "", "tr": "Tôi mong chúng ta sẽ có khoảng thời gian vui vẻ ở đó.", "raw": "Dịch nghĩa: Tôi mong chúng ta sẽ có khoảng thời gian vui vẻ ở đó."}], "lines": ["1.Đáp án: I’m very happy to hear that you are in Viet Nam again.", "Dịch nghĩa: Tôi rất vui khi biết bạn lại đến thăm Việt Nam.", "2.Đáp án: I want to invite you to see an exhibition of modern sculptures.", "Dịch nghĩa: Tôi muốn mời bạn xem triển lãm các tác phẩm điêu khắc hiện đại.", "3.Đáp án: Is Sunday morning suitable for you?", "Dịch nghĩa: Sáng Chủ nhật có phù hợp cho bạn không?", "4.Đáp án: The exhibition begins at 9 a.m., so let’s meet at 8.45 a.m. outside the Arts Centre.", "Dịch nghĩa: Triển lãm bắt đầu lúc 9 giờ sáng, vì vậy chúng ta hãy gặp nhau lúc 8 giờ 45 phút ở ngoài Trung tâm Nghệ thuật nhé.", "5.Đáp án: I hope we will have a happy time there.", "Dịch nghĩa: Tôi mong chúng ta sẽ có khoảng thời gian vui vẻ ở đó."]}, "W_II": {"ents": [], "lines": ["Dịch nghĩa câu hỏi:", "Viết một thư mời (60-80 từ) cho một trong những người bạn của bạn.", "Bạn có thể sử dụng các câu hỏi sau đây làm gợi ý:", "• Bạn muốn mời bạn của mình tham gia sự kiện nào?", "• Sự kiện diễn ra ở đâu?", "• Khi nào sự kiện bắt đầu?", "• Thời gian tốt nhất để bạn và bạn mình gặp nhau là khi nào?", "Gợi ý trả lời:", "MAIN IDEAS (Ý chính)", "Event (Sự kiện đó là gì)", "- traditional music show (n. phr.) (buổi biểu diễn âm nhạc truyền thống)", "- opera (n.) (vở nhạc kịch)", "- exhibition of art (n. phr.) (triển lãm nghệ thuật)", "- water puppet show (n. phr.) (chương trình múa rối nước)", "Time (Thời gian diễn ra)", "- at 7 p.m., Sunday night (prep. phr.) (7 giờ tối Chủ Nhật)", "- at 8 p.m., Friday night (prep. phr.) (8 giờ tối Thứ Sáu)", "- at 9 a.m., Saturday morning (prep. phr.) (9 giờ sáng Thứ Bảy)", "- at 6 p.m., Tuesday night (prep. phr.) (6 giờ tối Thứ Ba)", "Place (Nơi tổ chức)", "- Hanoi Walking Street (n. phr) (Phố đi bộ Hà Nội)", "- Hanoi Opera House (n. phr.) (Nhà hát lớn Hà Nội)", "- Arts Centre (n. phr.) (Trung tâm Nghệ thuật)", "- Water Puppet Theater (n. phr.) (Nhà hát múa rối nước)", "Time to meet (Thời gian hẹn gặp)", "- at 6.45 p.m. (prep. phr.) 6 giờ 45 phút tối)", "- at 7.45 p.m. (prep. phr.) (7 giờ 45 phút tối)", "- at 8.45 a.m. (prep. phr.) (8 giờ 45 phút sáng)", "- at 5.30 p.m. (prep. phr.) (5 giờ 30 phút chiều)", "Bài mẫu:", "10 Duong Quang Ham Rd. Cau Giay Dist. Ha Noi", "June 6, 2019", "Dear Linda,", "I’m very excited to hear that you are going to visit Ha Noi again next weekend. This time, I want to invite you to a traditional music show on Hanoi Walking street. I think you will definitely love it is Sunday night convenient for you? The concert begins at 7 p.m., so let's meet at 6.45 p.m. on Dinh Tien Hoang street. I hope we'll have fun together.", "I'm looking forward to hearing from you soon.", "Have a good day!", "Best wishes,", "Hoa", "Số 10 đường Dương Quảng Hàm, quận Cầu Giấy, Hà Nội Ngày 6 tháng 6 năm 2019", "Linda thân mến,", "Tớ rất vui mừng khi biết rằng cậu sẽ đến thăm Hà Nội một lần nữa vào cuối tuần tới. Lần này, tớ muốn mời cậu tham dự một buổi biểu diễn âm nhạc truyền thống trên phố đi bộ ở Hà Nội. Tớ nghĩ cậu chắc chắn sẽ thích nó. Tối chủ nhật có thuận tiện cho cậu không? Buổi hòa nhạc sẽ bắt đầu lúc 7 giờ tối, vì vậy chúng ta hãy gặp nhau lúc 6 giờ 45 phút ở phố Đình Tiên Hoàng nhé. Tớ hy vọng chúng ta sẽ có khoảng thời gian vui vẻ cùng nhau.", "Mong nhận được thư từ cậu sớm.", "Chúc cậu ngày mới tốt lành!", "Chúc cậu mọi điều tốt đẹp nhất,", "Hoa"]}}, "mcq": {"V_I": [{"n": 1, "q": "Puppets are________by strings and poles.", "o": ["controlled", "guided", "directed", "instructed"], "a": 0, "m": ["(v.). điều khiển", "(v.). hướng dẫn, chỉ đạo", "(v.): hướng dẫn, chỉ thị", "(v.): chỉ dẫn, đào tạo Xét về nghĩa, phương án A phù hợp nhất"], "note": "", "tr": "Puppets are controlled by strings and poles. (Con rối được điều khiển bằng dây và sào.)", "expl": "A. controlled (v.). điều khiểnB. guided (v.). hướng dẫn, chỉ đạo C. directed (v.): hướng dẫn, chỉ thịD. instructed (v.): chỉ dẫn, đào tạo Xét về nghĩa, phương án A phù hợp nhất."}, {"n": 2, "q": "He used music and lighting to create a romantic________.", "o": ["environment", "atmosphere", "climate", "condition"], "a": 1, "m": ["(n.): môi trường", "(n.): không khí", "(n.): khí hậu, thời tiết", "(n.): điều kiện, hoàn cảnh"], "note": "", "tr": "He used music and lighting to create a romantic atmosphere. (Anh ấy đã dùng âm nhạc và ánh sáng để tạo ra một bầu không khí lãng mạn.)", "expl": "A. environment (n.): môi trườngB. atmosphere (n.): không khí C. climate (n.): khí hậu, thời tiếtD. condition (n.): điều kiện, hoàn cảnh Xét về nghĩa, phương án B phù hợp nhất."}, {"n": 3, "q": "The________of ervention.”"}, {"n": 4, "q": "Who did the study find to have significantly better sleep quality?", "o": ["researchers", "participants who listened to music", "participants who listened to audiobook", "participants with no intervention"], "a": 1, "m": null, "note": "", "tr": "Nghiên cứu tìm ra đối tượng nào có chất lượng giấc ngủ tốt hơn đáng kể? A. nhà nghiên cứuB. người tham gia nghe nhạc C. người tham gia nghe sách âm thanhD. người tham gia không can thiệp", "expl": "Thông tin có ở câu: “The study found that participants who had listened to music had significantly better sleep quality than those who had listened to the audiobook or received no intervention.”"}, {"n": 5, "q": "What does the word “it” refer to?", "o": ["music", "treatment", "problem", "strategy"], "a": 0, "m": null, "note": "", "tr": "Từ mà “it” có nghĩa là gì? A. âm nhạcB. điều trịC. vấn đềD. chiến lược", "expl": "Thông tin có ở câu: “Since music is an effective treatment for sleeping problems, it could be used as an easy and safe strategy for treating insomnia.” Đại từ “it” thay cho danh từ “music” đã dùng trước đó."}]}, "pm": {"P_II": [{"n": 1, "o": ["essen<u>t</u>ial", "condi<u>t</u>ion", "fantas<u>t</u>ic", "sta<u>t</u>ion"], "a": 2, "expl": "Giải thích: fantas<u>t</u>ic /fænˈtæstɪk/ có “t” được phát âm là /t/, các phương án còn lạị có “t” được phát âm là /ʃ/.\nA. essen<u>t</u>ial /ɪˈsenʃl/ B. condi<u>t</u>ion /kənˈdɪʃn/ D. sta<u>t</u>ion /ˈsteɪʃn/"}, {"n": 2, "o": ["ma<u>ch</u>ine", "<u>ch</u>ildren", "kit<u>ch</u>en", "<u>ch</u>air"], "a": 0, "expl": "Giải thích: ma<u>ch</u>ine /məˈʃiːn/ có “ch” được phát âm là /ʃ/, các phương án còn lại có “ch” được phát âm là /tʃ/.\nB. <u>ch</u>ildren /tʃaɪld/ C. kit<u>ch</u>en /ˈkɪtʃɪn/  D. <u>ch</u>air /tʃeə(r)/"}, {"n": 3, "o": ["mea<u>s</u>ure", "occa<u>s</u>ion", "mu<u>s</u>ical", "u<u>s</u>ual"], "a": 2, "expl": "Giải thích: mu<u>s</u>ical /ˈmjuːzɪkl/ có “s” được phát âm là /z/, các phương án còn lại có “s” được phát âm là /ʒ/.\nA. mea<u>s</u>ure /ˈme ndar", "edu<u>c</u>ate", "musi<u>c</u>ian"], "a": 3, "expl": "Giải thích: musi<u>c</u>ian /mjuˈzɪʃn/ có “c” được phát âm là /ʃ/, các phương án còn lại có “c” được phát âm là /k/.\nA. de<u>c</u>orate /ˈdekəreɪt/B. <u>c</u>alendar /ˈkælɪndə(r)/C. edu<u>c</u>ate /ˈedʒukeɪt/"}]}, "sk": {"R_I_pas": ["Much of the music we listen to today is a mixture of styles from various countries and time periods. A lot of music has roots in older traditional songs heard in many different countries around the world. Traditional, or folk music is collected over decades. Younger generations learn these songs from their elders through practice and repetition.", "Many people fear that traditional and older types of music are slowly disappearing, partly because they are less likely to be written down or recorded. Also, younger generations may not find such music very appealing, so once older generations pass away, the music may die out with them. Whole genres of music may go extinct.", "Nowadays, there is a growing effort to preserve music in its many forms. Some researchers create field recordings to capture live performances, others try to write out the music so that it can be studied and played by modem musicians.", "(Active skills for reading 2)"], "R_I_vi": ["Phần lớn âm nhạc chúng ta nghe ngày nay là sự pha trộn của các phong cách từ các quốc gia và thời kỳ khác nhau. Rất nhiều bản nhạc bắt nguồn từ những bài hát truyền thống xưa cũ ở nhiều quốc gia khác nhau trên thế giới. Nhạc truyền thống, hoặc nhạc dân gian, được tập hợp qua nhiều thập kỷ. Các thế hệ trẻ học những bài hát này thông qua việc luyện tập và bắt chước những người lớn tuổi.", "Nhiều người lo ngại rằng các loại nhạc truyền thống và xưa cũ đang dần biến mất, một phần vì chúng ít có khả năng được viết ra hoặc ghi lại. Ngoài ra, thế hệ trẻ có thể không cảm thấy những loại nhạc như vậy hấp dẫn, vì vậy một khi thế hệ cũ ra đi, âm nhạc có thể chết theo họ. Toàn bộ các thể loại âm nhạc có thể bị mai một.", "Hiện nay, ngày càng có nhiều nỗ lực nhằm bảo tồn âm nhạc dưới nhiều hình thức. Một số nhà nghiên cứu tạo ra các bản thu âm hiện trường để ghi lại các buổi biểu diễn trực tiếp. Những người khác cố gắng viết lại các bản nhạc trên giấy để nó có thể được các ca sĩ hiện đại nghiên cứu và biểu diễn."], "R_II_pas": ["Insomnia is a serious problem that affects people of all age groups. While there are many approaches to treating this problem as well as other common sleep disorders, research has demonstrated that listening to relaxing classical music can be a safe, effective, and affordable remedy.", "In a study looking at college students, participants listened to classical music, an audio book, or nothing at all. One group listened to 45 minutes of relaxing classical music while another group listened to an audiobook at bedtime for three weeks. Researchers assessed sleep quality both before and after the intervention.", "The study found that participants who had listened to music had significantly better sleep quality than those who had listened to the audiobook or received no intervention.", "Since music is an effective treatment for sleeping problems, it could be used as an easy and safe strategy for treating insomnia."], "R_II_vi": ["Mất ngủ là một vấn đề nghiêm trọng ảnh hưởng đến mọi người ở mọi lứa tuổi. Mặc dù có nhiều cách tiếp cận để điều trị vấn đề này cũng như các bệnh về giấc ngủ phổ biến khác, nghiên cứu đã chứng minh rằng nghe nhạc cổ điển thư giãn có thể là một phương thuốc an toàn, hiệu quả và giá cả phải chăng.", "Trong một nghiên cứu nhằm vào các sinh viên đại học, những người tham gia nghiên cứu này nghe nhạc cổ điển, một cuốn sách âm thanh hoặc không có gì cả. Một nhóm nghe nhạc cổ điển thư giãn 45 phút trong khi một nhóm khác nghe sách âm thanh khi đi ngủ trong ba tuần. Các nhà nghiên cứu đánh giá chất lượng giấc ngủ cả trước và sau khi áp dụng hai kiểu trên.", "Nghiên cứu cho thấy những người tham gia nghe nhạc có chất lượng giấc ngủ tốt hơn đáng kể so với những người đã nghe sách âm thanh hoặc không nhận được sự can thiệp nào.", "Vì âm nhạc là một phương pháp điều trị hiệu quả cho các vấn đề về giấc ngủ, nó có thể được sử dụng như một chiến lược dễ dàng và an toàn để điều trị chứng mất ngủ."], "L_en": ["Kazuo Shiraga was an artist from the Gutai art group, which emerged in Japan after World War II. He didn’t paint in the traditional way, with a paintbrush. Instead, he created his paintings using his hands and feet. He wanted to communicate the idea of movement and action in his art. For example, he created “mud paintings” by using his whole body to leave impressions in wet mud.", "Claude Monet was a famous French painter. In the mid-1800s, he helped develop a new style of painting called Impressionism. Monet was famous for his outdoor scenes of lakes and the oceans. He also painted pictures of common objects, such as fruit and flowers. He didn’t mix colours together but made small dots of pure colour."], "L_vi": ["Kazuo Shiraga là một họa sĩ đên từ nhóm nghệ thuật Gutai, nổi lên ở Nhật Bản sau Thế chiến thứ II. Ông không vẽ tranh theo cách truyền thống bằng cọ vẽ. Mà thay vào đó, ông đã vẽ những bức tranh của mình bằng tay và chân, ông muốn truyền đạt ý tưởng về sự chuyển động và hành động trong nghệ thuật của mình. Chẳng hạn, ông đã tạo ra những bức tranh trên bùn bằng cách sử dụng toàn bộ cơ thể của mình để tạo hình trong bùn ướt.", "Claude Monet là một họa sĩ nổi tiếng người Pháp. Vào giữa những năm 1800, ông đã giúp phát triển một phong cách hội họa mới gọi là Trường phái ấn tượng. Monet nổi tiếng với các bức tranh về phong cảnh ngoài trời của hồ và đại dương, ông cũng vẽ tranh về các vật thể thông thường, như trái cây và hoa. Ông không pha màu như thông thường mà chấm trực tiếp lên tranh bằng các màu cơ bản."], "SP_-": {"q_vi": ["• Bạn thích thể loại nhạc nào?", "• Bạn nghe nó khi nào và có thường nghe không?", "• Tại sao bạn thích nó?"], "ideas": ["Kind of music (Loại nhạc)", "- country music (n. phr.) (nhạc đồng quê)", "- folk music (n. phr.) (nhạc dân gian)", "- Jazz (n.) (nhạc Jazz)", "- pop music (n. phr.) (nhạc pop)", "When to listen (Nghe khi nào)", "- when I'm sad (adv. cl.) (khi buồn)", "- when I have free time (adv. cl.) (khi có thời gian rảnh)", "- before going to bed (adv. phr.) (trước khi đi ngủ)", "- when I'm tired (adv. cl.) (khi mệt mỏi)", "Reasons (Lí do yêu thích)", "- amazing lyrics and catchy beats (n. phr.) (lời bài hát tuyệt vời và nhịp điệu hấp dẫn)", "- calm down and sleep better (v. phr.) (thư giãn và ngủ ngon hơn)", "- express myself (v. phr.) (thể hiện bản thân mình)", "- happier and more comfortable (adj.phr.) (vui vẻ và thoải mái hơn)"], "en": ["I am very fond of music. I listen to many types of music, but my favourite one is pop music. I listen to it whenever I have free time, especially when I’m tired. Listening to pop music helps me feel happy and more comfortable because it has an engaging rhythm, amazing lyrics, and an approachable musical style. In addition, it makes me more positive and active so that I can work better."], "vi": ["Tôi rất thích âm nhạc. Tôi nghe nhiều loại nhạc, nhưng loại nhạc yêu thích của tôi là nhạc pop. Tôi nghe nó bất cứ khi nào tôi có thời gian rảnh, đặc biệt là khi tôi mệt mỏi. Nghe nhạc pop giúp tôi cảm thấy vui vẻ và thoải mái hơn vì nó có nhịp điệu lôi cuốn, lời bài hát tuyệt vời và phong cách âm nhạc dễ tiếp cận. Ngoài ra, nó cũng giúp tôi lạc quan và tích cực hơn để tôi có thể làm việc tốt hơn."]}, "W_II": {"q_vi": ["• Bạn muốn mời bạn của mình tham gia sự kiện nào?", "• Sự kiện diễn ra ở đâu?", "• Khi nào sự kiện bắt đầu?", "• Thời gian tốt nhất để bạn và bạn mình gặp nhau là khi nào?"], "ideas": ["Event (Sự kiện đó là gì)", "- traditional music show (n. phr.) (buổi biểu diễn âm nhạc truyền thống)", "- opera (n.) (vở nhạc kịch)", "- exhibition of art (n. phr.) (triển lãm nghệ thuật)", "- water puppet show (n. phr.) (chương trình múa rối nước)", "Time (Thời gian diễn ra)", "- at 7 p.m., Sunday night (prep. phr.) (7 giờ tối Chủ Nhật)", "- at 8 p.m., Friday night (prep. phr.) (8 giờ tối Thứ Sáu)", "- at 9 a.m., Saturday morning (prep. phr.) (9 giờ sáng Thứ Bảy)", "- at 6 p.m., Tuesday night (prep. phr.) (6 giờ tối Thứ Ba)", "Place (Nơi tổ chức)", "- Hanoi Walking Street (n. phr) (Phố đi bộ Hà Nội)", "- Hanoi Opera House (n. phr.) (Nhà hát lớn Hà Nội)", "- Arts Centre (n. phr.) (Trung tâm Nghệ thuật)", "- Water Puppet Theater (n. phr.) (Nhà hát múa rối nước)", "Time to meet (Thời gian hẹn gặp)", "- at 6.45 p.m. (prep. phr.) 6 giờ 45 phút tối)", "- at 7.45 p.m. (prep. phr.) (7 giờ 45 phút tối)", "- at 8.45 a.m. (prep. phr.) (8 giờ 45 phút sáng)", "- at 5.30 p.m. (prep. phr.) (5 giờ 30 phút chiều)"], "en": ["10 Duong Quang Ham Rd. Cau Giay Dist. Ha Noi", "June 6, 2019", "Dear Linda,", "I’m very excited to hear that you are going to visit Ha Noi again next weekend. This time, I want to invite you to a traditional music show on Hanoi Walking street. I think you will definitely love it is Sunday night convenient for you? The concert begins at 7 p.m., so let's meet at 6.45 p.m. on Dinh Tien Hoang street. I hope we'll have fun together.", "I'm looking forward to hearing from you soon.", "Have a good day!", "Best wishes,", "Hoa"], "vi": ["Số 10 đường Dương Quảng Hàm, quận Cầu Giấy, Hà Nội Ngày 6 tháng 6 năm 2019", "Linda thân mến,", "Tớ rất vui mừng khi biết rằng cậu sẽ đến thăm Hà Nội một lần nữa vào cuối tuần tới. Lần này, tớ muốn mời cậu tham dự một buổi biểu diễn âm nhạc truyền thống trên phố đi bộ ở Hà Nội. Tớ nghĩ cậu chắc chắn sẽ thích nó. Tối chủ nhật có thuận tiện cho cậu không? Buổi hòa nhạc sẽ bắt đầu lúc 7 giờ tối, vì vậy chúng ta hãy gặp nhau lúc 6 giờ 45 phút ở phố Đình Tiên Hoàng nhé. Tớ hy vọng chúng ta sẽ có khoảng thời gian vui vẻ cùng nhau.", "Mong nhận được thư từ cậu sớm.", "Chúc cậu ngày mới tốt lành!", "Chúc cậu mọi điều tốt đẹp nhất,", "Hoa"]}, "SP_ex": ["Talk about your favourite kind of music.", "You can use the following questions as cues:", "•What kind of music do you like?", "•When and how often do you listen to it?", "• Why do you like it?", "Useful languages:", "Useful vocabulary", "Useful structures", "•country music, folk music, Jazz, pop music", "•when I’m sad, before going to bed, when I have free time, when I’m tired", "•amazing lyrics and catchy beats, calm down and sleep better, express myself, be happy and more comfortable", "• I am very fond of...", "•I like...very much", "•I listen to..., but...", "•I listen to it when...", "•I often listen to it in...", "•Listening to...helps me...because...", "•It makes me...", "•I feel...when listening to...", "Complete the notes:", "Structures of the talk", "Your notes", "What kind of music do you like?", "__________________________________________", "__________________________________________", "__________________________________________", "When and how often do you listen to it?", "__________________________________________", "__________________________________________", "__________________________________________", "Why do you like it?", "__________________________________________", "__________________________________________", "__________________________________________", "Now you try!", "Give your answer using the following cues. You should speak for 1-2 minutes.", "1. I am very fond of...", "2. I listen to..., but...", "3. I listen to it when...", "4. Listening to...helps me...because...", "5. It makes me...", "Now you tick!", "Did you ...", "❑ answer all the questions in the task?", "❑ give some details to each main point?", "❑ speak slowly and fluently with only some hesitation?", "❑ use vocabulary wide enough to talk about the topic?", "❑ use various sentence structures (simple, compound, complex) accurately?", "❑ pronounce correctly (vowels, consonants, stress, intonation)?", "Let’s compare!", "Finally, compare with the sample answer on page 180."]}, "know": ["BENEFITS OF MUSIC", "•Listening to music can be entertaining and some research suggests that it might even make you healthier.", "•Music can be a source of pleasure and contentment, but there are many other psychological benefits as well.", "•The notion that music can influence your thoughts, feelings, and behaviors probably does not come as much of a surprise.", "• If you’ve ever felt pumped up while listening to your favorite fast-paced rock anthem or been moved to tears by a tender live performance, then you easily understand the power of music to impact moods and even inspire action."]};
const PV=D.vocab;
/* ===== shared library for English units 4, 5, 6 (data comes from JSON const D, vocabulary from PV) ===== */
const WC_RANGE = [60, 80];
const ents = k => (D.key[k] ? D.key[k].ents : []);
const entOf = (k, n) => ents(k).find(e => e.n === n) || {};
const exLines = k => D.ex[k] || [];
const stripU = s => String(s || '').replace(/<\/?u>/g, '');
const expHtml = e => `<p>${e.expl || ''}</p>${e.tr ? `<p class="fb-tr">🇻🇳 ${e.tr}</p>` : ''}`;
const fixT = s => String(s || '').replace(/ ?([,.!?])/g, '$1').trim();
const blk = t => t.replace(/_{2,}/g, ' ___ ').replace(/\s+/g, ' ').replace(/\s+([.,?!])/g, '$1').trim();
const cleanAns = a => stripU(a).replace(/^[A-D]\.\s*/, '').trim();

/* numbered exercise lines (merging continuation lines that have no number) */
function numItems(k, merge) {
  const L = exLines(k), out = [];
  L.forEach(l => { const m = l.match(/^\s*(\d+)\s*\.\s*(.*)$/); if (m) out.push({ n: +m[1], text: m[2] }); else if (out.length && merge && merge(l)) out[out.length - 1].text += ' ' + l.trim(); });
  return out;
}
/* fill items from blanks + key */
function fillItemsK(k, fix) {
  return numItems(k).map(x => { const e = entOf(k, x.n); const a = cleanAns(e.ans || ''); return { q: blk(x.text), a: (fix && fix[x.n]) || [a], exp: e.expl, tr: e.tr }; });
}
function tfK(k) { return tfItems(exLines(k), ents(k)); }
function boxWords(k, stopRe) { const o = []; for (const l of exLines(k)) { if (stopRe.test(l)) break; o.push(l.trim()); } return o; }

/* ideas groups from key lines: header + "- en (pos) (vi)" */
function ideaGroups(lines) {

      { label: "🗂️ Phân loại từ", ex: ["pr1"], render: () => sorter('pr1', { title: "I. Put the words in the correct columns", cols: [{ k: 'sh', label: '/ʃ/', ph: true }, { k: 'zh', label: '/ʒ/', ph: true }], words: PR_WORDS, note: "Bấm một từ rồi bấm vào cột /ʃ/ hoặc /ʒ/. E.g.: <b>measure</b> /ˈmeʒə(r)/ → /ʒ/" }) },
      { label: "❓ Chọn từ khác âm", ex: ["pr2"], render: () => quiz('pr2', { title: "II. Choose the word which has the underlined part pronounced differently", items: PR_MCQ, note: "E.g.: A. en<u>s</u>ure B. clo<u>s</u>et C. noi<u>s</u>e D. sea<u>s</u>on → <b>A</b>" }) },
      { label: "🖍️ Tô màu từ trong câu", ex: ["pr3"], render: () => tagger('pr3', { title: "III. Find the words with /ʃ/ (gạch chân) and /ʒ/ (khoanh tròn)", classes: [{ k: 'sh', label: '/ʃ/' }, { k: 'zh', label: '/ʒ/' }], items: PR_TAG, note: "Bấm vào từ: 1 lần = /ʃ/, 2 lần = /ʒ/, 3 lần = bỏ chọn." }) }] },

  secSpeaking("Nói về loại nhạc mà bạn yêu thích. Bạn có thể dùng 3 câu hỏi gợi ý bên dưới.", "Nói về loại nhạc yêu thích của em"),
  { title: "Skills 1", nav: "Skills 1", vi: "Đọc & Nghe", icon: "📖", desc: "Đọc về âm nhạc truyền thống, âm nhạc và giấc ngủ; nghe về hai họa sĩ nổi tiếng", ex: ["rd1a", "rd1b", "rd2", "lsf", "lst"],
    subs: [{ label: "💡 Do you know?", render: knowCard },
      { label: "📖 Reading 1 · Traditional music", ex: ["rd1a", "rd1b"], split: true, render: () => `<div><div class="colh">Read the passage</div><div class="passage">${R1_PAS}</div><details class="tr"><summary>🇻🇳 Xem bản dịch</summary><p>${R1_VI}</p></details></div><div>${fill('rd1a', { title: "Part 1: Find the words that mean…", bank: R1A.slice().sort(), items: R1A_ITEMS, note: "Chọn từ in đậm trong bài đọc." })}${quiz('rd1b', { title: "Part 2: TRUE or FALSE?", tf: true, labels: ['T', 'F'], items: R1B })}</div>` },
      { label: "😴 Reading 2 · Music & sleep", ex: ["rd2"], split: true, render: () => `<div><div class="colh">Read the passage</div><div class="passage">${R2_PAS}</div><details class="tr"><summary>🇻🇳 Xem bản dịch</summary><p>${R2_VI}</p></details></div><div>${quiz('rd2', { title: "Choose the best answer", items: R2_MCQ })}</div>` },
      { label: "🎧 Listening · Two artists", ex: ["lsf", "lst"], split: true, render: () => `<div>${lsPlayer('Two famous artists')}<details class="tr"><summary>📜 Audio script (xem sau khi làm bài)</summary><p>${scriptHtml(LSCRIPT)}</p></details><details class="tr"><summary>🇻🇳 Bản dịch script</summary><p>${viHtml(D.sk.L_vi)}</p></details></div>
        <div>${fill('lsf', { title: "I. Fill in the blanks with ONE word", items: LS_FILL })}${quiz('lst', { title: "II. TRUE or FALSE?", tf: true, labels: ['T', 'F'], items: LS_TF })}</div>` }] },
  secWriting({ desc: "Viết câu và thư mời", task: "Write a letter of invitation (60–80 words) to one of your friends", cues: "• What event do you want to invite your friend to? • Where does it take place? • When does it start? • When is the best time for you and your friend to meet?", ph: "Dear Linda, I’m very excited to hear that…", tip: "Thư mời gồm: lời chào → lí do viết → sự kiện, địa điểm, thời gian → hẹn gặp → lời kết. Dùng <b>Is … suitable for you?</b> và <b>let’s meet at…</b>." }),

];

$('.logo .lg').textContent=UNIT.icon;$('.logo b').textContent='UNIT '+UNIT.no;$('.logo small').textContent=UNIT.name;document.title='Unit '+UNIT.no+' - '+UNIT.name;
show(0, 0);
</script>
