<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 4</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1e1b4b;--mut:#6b7280;--p:#4f46e5;--p2:#7c3aed;--pk:#db2777;--ok:#059669;--okbg:#ecfdf5;--bad:#dc2626;--badbg:#fef2f2;--am:#b45309;--ambg:#fffbeb;--line:#e4e6f7;--bg:#f3f4ff;--ph:"Doulos SIL","Charis SIL","Lucida Sans Unicode","Segoe UI",Arial,sans-serif}
html,body{height:469px;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:469px;max-width:1128px;margin:0 auto;background:var(--bg)}

/* sidebar */
.side{width:206px;flex:none;background:linear-gradient(175deg,#2e2a86 0%,#4f46e5 58%,#7c3aed 100%);color:#fff;display:flex;flex-direction:column;padding:12px 10px 10px;position:relative;overflow:hidden}
.side:before{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.logo{display:flex;align-items:center;gap:9px;padding:0 4px 9px;cursor:pointer;position:relative}
.logo .lg{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px}
.logo b{display:block;font-size:14px;letter-spacing:.05em}
.logo small{font-size:11px;opacity:.85}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;min-height:0;position:relative}
.ni{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:none;background:none;color:#e0e7ff;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;width:100%;transition:.15s}
.ni:hover{background:rgba(255,255,255,.13)}
.ni .n{width:18px;height:18px;flex:none;border-radius:50%;background:rgba(255,255,255,.2);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ni .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.on{background:#fff;color:#3730a3;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.ni.on .n{background:var(--p);color:#fff}
.ni.done .n{background:#34d399;color:#064e3b}
.ni.soon{opacity:.62}
.prog{padding:8px 4px 0;position:relative}
.pbar{height:7px;background:rgba(255,255,255,.22);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#34d399);border-radius:8px;transition:width .4s}
.prog small{display:flex;justify-content:space-between;font-size:10.5px;margin-top:4px;opacity:.9}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:11px;padding:11px 18px 2px}
.head .hi{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#c026d3);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 5px 14px rgba(99,102,241,.35);flex:none}
.head h1{font-size:18px;line-height:1.15;color:#312e81}
.head p{font-size:12px;color:var(--mut);margin-top:1px}
.subnav{display:flex;gap:6px;padding:8px 18px 7px;overflow-x:auto;flex:none}
.stab{flex:none;border:1px solid #d6dafc;background:#fff;color:#4338ca;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.stab:hover{background:#eef2ff;transform:translateY(-1px)}
.stab.on{background:linear-gradient(90deg,#4f46e5,#7c3aed);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.stab i{font-style:normal;margin-left:5px;font-size:10px;background:#34d399;color:#064e3b;border-radius:999px;padding:0 5px}
.body{flex:1;overflow:auto;padding:2px 18px 16px;min-height:0;animation:fade .25s}
.body.split{overflow:hidden;padding-bottom:12px}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* generic */
.btn{border:1px solid #c7d2fe;background:#fff;color:#4338ca;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;transition:.15s}
.btn:hover{background:#eef2ff;transform:translateY(-1px)}
.btn.solid{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(79,70,229,.28)}
.btn.solid:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:11px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.chip-s{display:inline-flex;align-items:center;gap:3px;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800}
.chip-s.ok{background:#d1fae5;color:#065f46}
.chip{display:inline-block;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:700}
.muted{color:var(--mut);font-size:12px}
.note{font-size:12.5px;background:#f5f3ff;border-left:3px solid #8b5cf6;border-radius:8px;padding:6px 10px;margin:6px 0;line-height:1.5}
.note.am{background:var(--ambg);border-color:#f59e0b}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 3px 12px rgba(67,56,202,.06)}
.card h3{font-size:14px;color:#312e81;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
mark{background:#fde68a;color:#78350f;border-radius:4px;padding:0 3px;font-weight:800;box-shadow:inset 0 -2px 0 #f59e0b}
u{text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:#e11d48}
.spk{border:none;background:#eef2ff;border-radius:7px;cursor:pointer;font-size:11px;padding:2px 6px;vertical-align:middle}
.spk:hover{background:#c7d2fe}
.ph{font-family:var(--ph)}
details.tr{margin-top:8px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.6}
details.tr summary{cursor:pointer;color:var(--p);font-weight:700}
details.tr p{margin-top:5px;color:#374151}
.kw{background:linear-gradient(transparent 55%,#fde68a 55%);font-weight:700;cursor:help}
.passage{font-size:13.5px;line-height:1.75;background:#fffdf5;border:1px solid #fde68a;border-radius:12px;padding:11px 14px;color:#1f2937}
.colh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7c3aed;margin:2px 0 6px}
.split>div{overflow:auto;height:100%;padding:0 2px 6px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* coming soon */
.soonbox{height:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--mut)}
.soonbox .big{font-size:54px;animation:float 3s ease-in-out infinite}
.soonbox b{font-size:18px;color:#312e81}
.soonbox span{font-size:13px;max-width:380px;line-height:1.5}
@keyframes float{50%{transform:translateY(-8px)}}

/* vocabulary */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.search{flex:1;border:1.5px solid #d6dafc;border-radius:10px;padding:7px 12px;font-size:12.5px;outline:none;background:#fff}
.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.vrow{display:grid;grid-template-columns:42px 34% 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:7px;transition:.15s}
.vrow:hover{border-color:#a5b4fc;box-shadow:0 5px 16px rgba(99,102,241,.14);transform:translateX(2px)}
.vem{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#eef2ff,#faf5ff);display:flex;align-items:center;justify-content:center;font-size:22px}
.vw{font-size:16px;font-weight:800;color:#312e81;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pos{font-size:10.5px;font-style:italic;font-weight:800;border-radius:999px;padding:1px 8px}
.pos-n{background:#dbeafe;color:#1d4ed8}.pos-v{background:#dcfce7;color:#15803d}.pos-adj{background:#ffedd5;color:#c2410c}.pos-idiom{background:#f3e8ff;color:#7e22ce}.pos-phr{background:#e0f2fe;color:#0369a1}
.vp{font-family:var(--ph);font-size:12.5px;color:var(--mut);margin-top:2px}
.vm{font-size:14px;font-weight:800;color:var(--ok)}
.ven{font-size:12.8px;line-height:1.5;margin-top:2px}
.vvi{font-size:12px;color:var(--mut);font-style:italic}
.hide-mean .vm:not(.rev),.hide-mean .vvi:not(.rev){filter:blur(6px);cursor:pointer;user-select:none}
.fcwrap{max-width:620px;margin:0 auto}
.fcnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.fcdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.fcdots i{width:9px;height:9px;border-radius:50%;background:#e0e7ff}
.fcdots i.k{background:#34d399}.fcdots i.cur{background:#6366f1;transform:scale(1.35)}
.fcard{min-height:176px;border-radius:20px;background:linear-gradient(135deg,#eef2ff,#faf5ff);border:2px solid #c7d2fe;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 24px;cursor:pointer;gap:6px;transition:.2s;box-shadow:0 10px 26px rgba(99,102,241,.14)}
.fcard.back{background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border-color:#6ee7b7}
.fcard:hover{transform:translateY(-2px)}
.fc-em{font-size:34px}.fc-w{font-size:30px;font-weight:900;color:#312e81}
.fc-p{font-family:var(--ph);font-size:16px;color:var(--mut)}
.fc-hint{font-size:11px;color:#9ca3af;margin-top:4px}
.fc-m{font-size:24px;font-weight:900;color:var(--ok)}
.fc-e{font-size:14px;line-height:1.5}.fc-v{font-size:12.5px;color:var(--mut);font-style:italic}
.fcbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

/* match game */
.mg-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.mc{border:2px solid #d6dafc;background:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;transition:.15s;min-height:40px;color:#312e81}
.mc:hover:not(.lock){border-color:#6366f1;background:#eef2ff;transform:scale(1.015)}
.mc.sel{border-color:#4f46e5;background:#e0e7ff;box-shadow:0 0 0 3px rgba(79,70,229,.2)}
.mc.lock{background:var(--okbg);border-color:#6ee7b7;color:#065f46;cursor:default;animation:pop .35s}
.mc.err{border-color:#f87171;background:var(--badbg);animation:shake .4s}
.mc.vi{font-weight:600;color:#374151}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* quiz */
.qz-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qz-title{font-size:13.5px;font-weight:800;color:#312e81;flex:1}
.qz-bar{height:6px;background:#e0e7ff;border-radius:8px;overflow:hidden;margin-bottom:10px}
.qz-bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#c026d3);border-radius:8px;transition:width .4s}
.qz-main{display:grid;grid-template-columns:1.08fr 1fr;gap:14px;align-items:start}
.qz-q{font-size:15px;line-height:1.55;font-weight:600;margin-bottom:10px;color:#1f2937}
.blank{display:inline-block;min-width:70px;border-bottom:3px dotted #6366f1;margin:0 2px}
.fillw{display:inline-block;background:#d1fae5;color:#065f46;border-radius:6px;padding:0 7px;font-weight:800}
.bigw{font-size:30px;font-weight:900;color:#312e81;letter-spacing:.02em;margin:2px 0}
.qz-opts{display:flex;flex-direction:column;gap:7px}
.qz-opts.tf{flex-direction:row}.qz-opts.tf .qo{flex:1;justify-content:center}
.qo{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid #d6dafc;background:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;cursor:pointer;transition:.15s;color:#1f2937}
.qo b{width:24px;height:24px;border-radius:8px;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.qo:hover:not(.lock){border-color:#6366f1;background:#f5f6ff;transform:translateX(3px)}
.qo.lock{cursor:default}
.qo.ok{border-color:#34d399;background:var(--okbg);color:#064e3b;font-weight:700;animation:pop .35s}
.qo.ok b{background:#10b981;color:#fff}
.qo.bad{border-color:#f87171;background:var(--badbg);color:#7f1d1d;animation:shake .4s}
.qo.bad b{background:#ef4444;color:#fff}
.fb{border-radius:14px;padding:10px 12px;font-size:12.8px;line-height:1.55;max-height:270px;overflow:auto;position:sticky;top:0}
.fb.idle{background:#f8faff;border:2px dashed #c7d2fe;text-align:center;color:var(--mut);padding:26px 14px}
.fb.idle .idle-i{font-size:30px}
.fb.ok{background:var(--okbg);border:1.5px solid #6ee7b7}
.fb.bad{background:var(--badbg);border:1.5px solid #fca5a5}
.fb-h{font-weight:900;font-size:14px;margin-bottom:5px}
.fb.ok .fb-h{color:#047857}.fb.bad .fb-h{color:#b91c1c}
.fb-h small{display:block;font-size:12px;font-weight:600;color:#374151;margin-top:1px}
.fb-b{color:#1f2937}
.fb-tr{margin-top:6px;background:rgba(255,255,255,.7);border-radius:8px;padding:5px 8px;color:#374151}
.fb-note{margin-top:5px;color:#4338ca;font-weight:600}
.fb-n{margin-top:9px;width:100%}
table.mt{width:100%;border-collapse:collapse;font-size:12.3px;margin-top:3px}
table.mt td{padding:2px 5px;border-bottom:1px dashed rgba(0,0,0,.1);vertical-align:top}
table.mt tr.hit td{background:rgba(16,185,129,.16);font-weight:700}
.qz-res{text-align:center;padding:6px 0}
.ring{width:96px;height:96px;border-radius:50%;margin:4px auto 8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#312e81;background:conic-gradient(#10b981 var(--pct),#e0e7ff 0);position:relative}
.ring:before{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}
.ring span{position:relative}
.qz-res h3{font-size:18px;color:#312e81}
.qz-res .acts{display:flex;gap:8px;justify-content:center;margin:10px 0}
.wl{text-align:left;margin-top:6px}
.wl details{background:#fff;border:1px solid #fecaca;border-radius:10px;padding:5px 10px;margin-bottom:5px;font-size:12.5px}
.wl summary{cursor:pointer;font-weight:700;color:#991b1b}
.wl .fb-b{margin-top:5px}
.confetti{position:fixed;top:-12px;font-size:18px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(500px) rotate(540deg);opacity:0}}

/* fill */
.fl-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.fl-top .t{font-size:13.5px;font-weight:800;color:#312e81;flex:1;min-width:200px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0;padding:8px 10px;background:#fff;border:2px dashed #c7d2fe;border-radius:12px}
.bk{border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px rgba(99,102,241,.3);transition:.15s}
.bk:hover:not(.used){transform:translateY(-2px)}
.bk.used{background:#e5e7eb;color:#9ca3af;box-shadow:none;cursor:default;text-decoration:line-through}
.fx{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:14px;line-height:2}
.fx .n{width:22px;height:22px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.fi{width:104px;border:none;border-bottom:2.5px dotted #6366f1;background:#f5f6ff;padding:1px 6px;font-size:14px;text-align:center;outline:none;border-radius:6px 6px 0 0;color:#1e1b4b;font-weight:700}
.fi:focus{background:#e0e7ff;border-bottom-style:solid}
.fi.good,.slot.good{border-bottom:2.5px solid #10b981;background:var(--okbg);color:#065f46}
.fi.bad,.slot.bad{border-bottom:2.5px solid #ef4444;background:var(--badbg);color:#991b1b}
.slot{min-width:104px;border:none;border-bottom:2.5px dotted #6366f1;background:#f5f6ff;padding:1px 8px;font-size:14px;font-weight:800;cursor:pointer;border-radius:6px 6px 0 0;color:#4338ca;height:26px}
.slot.act{background:#e0e7ff;border-bottom-style:solid;box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.fxfb{flex-basis:100%;font-size:12.5px;line-height:1.55;border-radius:10px;padding:5px 10px;margin:0 0 2px 28px}
.fxfb.ok{background:var(--okbg);border-left:3px solid #10b981;color:#064e3b}
.fxfb.bad{background:var(--badbg);border-left:3px solid #ef4444;color:#7f1d1d}
.fxfb .tr{display:block;color:#4b5563;font-style:italic}

/* sentence builder */
.bd-line{min-height:56px;border:2px dashed #a5b4fc;border-radius:14px;background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.bd-line.ok{border-color:#34d399;background:var(--okbg);border-style:solid}
.bd-line.bad{border-color:#f87171;background:var(--badbg);border-style:solid}
.bd-pool{display:flex;flex-wrap:wrap;gap:7px;min-height:44px;padding:4px}
.wd{border:none;background:#fff;border:2px solid #c7d2fe;color:#3730a3;border-radius:10px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 2px 0 #c7d2fe}
.wd:hover{transform:translateY(-2px);border-color:#6366f1}
.wd.in{background:#eef2ff}
.bd-hint{color:#9ca3af;font-size:12.5px}

/* signals */
.sg{display:flex;flex-wrap:wrap;gap:2px 1px;align-items:center;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:14.5px;line-height:1.9}
.sg .n{width:22px;height:22px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:3px}
.tok{padding:0 4px;border-radius:7px;cursor:pointer;transition:.12s}
.tok:hover{background:#e0e7ff}
.tok.sig{background:#fde68a;color:#78350f;font-weight:800;box-shadow:inset 0 -3px 0 #f59e0b;cursor:default}
.tok.err{background:#fee2e2;animation:shake .35s}
.sgnote{margin-left:6px;font-size:11.5px;background:#ede9fe;color:#5b21b6;border-radius:999px;padding:1px 9px;font-weight:700}

/* grammar theory */
.gc{border-radius:14px;padding:10px 13px;background:#fff;border:1px solid var(--line);border-top:5px solid #6366f1}
.gc.t2{border-top-color:#db2777}.gc.t3{border-top-color:#0d9488}
.gc .ic{font-size:24px}.gc h3{font-size:14px;margin:2px 0 4px;color:#312e81}
.gc p{font-size:12.8px;line-height:1.55}
.gex{margin-top:6px;background:#f5f3ff;border-radius:9px;padding:6px 9px;font-size:13px;line-height:1.5}
.gex i{display:block;color:#6b7280;font-size:12px}
.scale{display:flex;gap:6px;align-items:stretch;margin:6px 0}
.sc{flex:1;border-radius:11px;padding:7px 4px;text-align:center;color:#fff;font-size:12.5px;font-weight:800;line-height:1.3}
.sc small{display:block;font-weight:600;font-size:10.5px;opacity:.92}
.sc.a{background:#4f46e5}.sc.b{background:#6366f1}.sc.c{background:#8b5cf6}.sc.d{background:#a78bfa}.sc.e{background:#c4b5fd;color:#4c1d95}
.fm{display:inline-block;font-weight:800;color:#3730a3;background:#e0e7ff;border-radius:8px;padding:1px 9px;margin-bottom:3px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;line-height:1.5;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.t th{background:linear-gradient(90deg,#eef2ff,#faf5ff);color:#312e81;padding:7px 10px;text-align:left}
table.t td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.t i{color:#6b7280;display:block;font-size:12px}

/* pronunciation */

<script>/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normA = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,!?;:"“”]/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hl = s => s.replace(/\{\{(.+?)\}\}/g, '<mark>$1</mark>');
const plain = s => s.replace(/\{\{|\}\}/g, '').replace(/<[^>]+>/g, '');
function say(t, rate) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = rate || .9; speechSynthesis.speak(u); } catch (e) {} }
function sayEl(el) { say(el.dataset.w); }
const spk = w => `<button class="spk" data-w="${esc(plain(w))}" onclick="sayEl(this)" title="Nghe">🔊</button>`;
function confetti() {
  const em = ['🎉', '✨', '⭐', '🎊', '💜', '🌟'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = (10 + Math.random() * 80) + '%'; s.style.animationDelay = (Math.random() * .5) + 's'; s.style.fontSize = (14 + Math.random() * 14) + 'px';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2400);
  }
}

/* ================= component registry & progress ================= */
const COMP = {}, DONE = {};
function markDone(id, s, t) { DONE[id] = { s, t }; navRender(); }
function hydrate() { document.querySelectorAll('.comp').forEach(el => { const c = COMP[el.dataset.id]; if (c) c.render(el); }); }
function rerender(id) { const el = document.querySelector(`.comp[data-id="${id}"]`); if (el) COMP[id].render(el); }
const slot = id => `<div class="comp" data-id="${id}"></div>`;

/* ================= QUIZ (one question at a time, explanation panel) ================= */
function fillQ(q, txt) {
  const parts = txt.split(' - '); let k = 0;
  return q.replace(/_{3,}/g, () => `<span class="fillw">${parts[Math.min(k++, parts.length - 1)]}</span>`);
}
function quiz(id, cfg) {
  const prev = COMP[id];
  const st = prev ? prev.st : { i: 0, score: 0, sel: null, res: [], fin: false };
  if (prev) cfg.items = prev.cfg.items; else if (cfg.regen) cfg.items = cfg.regen();
  COMP[id] = { st, cfg, render: el => qzRender(id, el) };
  return slot(id);
}
function qzRender(id, el) {
  const { st, cfg } = COMP[id], items = cfg.items, n = items.length;
  if (st.fin) { el.innerHTML = qzResult(id); return; }
  const it = items[st.i], L = cfg.labels || ['A', 'B', 'C', 'D'], ans = st.sel !== null, ok = ans && st.sel === it.a;
  const opts = it.opts.map((o, j) => {
    let c = 'qo'; if (ans) { c += ' lock'; if (j === it.a) c += ' ok'; else if (j === st.sel) c += ' bad'; }
    return `<button class="${c}" onclick="qzPick('${id}',${j})"><b>${L[j]}</b><span>${o}</span></button>`;
  }).join('');

/* ================= FILL (typing or tap-to-fill word bank) ================= */

      <span class="chip-s ok" ${st.checked ? '' : 'style="display:none"'}>★ ${st.score}/${items.length}</span>
      <button class="btn solid" onclick="flCheck('${id}')">✔ Kiểm tra</button><button class="btn" onclick="flReveal('${id}')">💡 Xem đáp án</button><button class="btn" onclick="flReset('${id}')">↺ Làm lại</button></div>
    ${cfg.note ? `<div class="note">${cfg.note}</div>` : ''}
    ${bank ? `<div class="bank">${bank.map(w => `<button class="bk${used.includes(w) ? ' used' : ''}" onclick="flPut('${id}',this.dataset.w)" data-w="${esc(w)}">${w}</button>`).join('')}</div>` : ''}

function flKey(e, id) {

/* ================= SENTENCE BUILDER ================= */
function builder(id, cfg) {

  el.innerHTML = `<div class="qz-top"><span class="qz-title">${cfg.title}</span><span class="chip-s">Câu ${st.i + 1}/${n}</span><span class="chip-s ok">★ ${st.score}</span></div>

    <div class="bd-line ${st.checked ? (st.ok ? 'ok' : 'bad') : ''}">${st.placed.length ? st.placed.map(x => `<button class="wd in" onclick="bdBack('${id}',${x})">${words[x]}</button>`).join('') : '<span class="bd-hint">Câu của bạn sẽ hiện ở đây…</span>'}</div>
    <div class="bd-pool">${pool.map(x => `<button class="wd" onclick="bdAdd('${id}',${x})">${words[x]}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">

    </div>
    ${st.checked ? `<div class="fb ${st.ok ? 'ok' : 'bad'}" style="margin-top:8px;position:static"><div class="fb-h">${st.ok ? '🎉 Chính xác!' : '❌ Chưa đúng'}<small>Câu đúng: <b>${words.join(' ')}</b></small></div><div class="fb-b">${it.exp || ''}<p class="fb-tr">🇻🇳 ${it.vi}</p></div></div>` : ''}`;

function bdAdd(id, x) { const { st } = COMP[id]; if (st.checked) return; st.placed.push(x); rerender(id); }

/* ================= MATCH GAME ================= */
function matchGame(id, pool) {
  const prev = COMP[id];
  const st = prev ? prev.st : { round: null, sel: null, done: [], moves: 0, err: null, rounds: 0 };

/* ================= SIGNAL FINDER (grammar) ================= */

const LS = { sents: [], idx: 0, playing: false, rate: 1 };
function lsPlay(script) {

  LS.sents = script.match(/[^.!?]+[.!?]+/g) || [script]; LS.playing = true; lsUi();
  LS.sents.forEach((s, i) => {

/* ================= TAGGER: click words in sentences to mark their sound ================= */

const SOUNDNAME = s => s === '∅' ? '(âm câm)' : '/' + s + '/';

  const out = [], dropped = [], diff = [];
  raw.forEach((it, i) => {
    const tk = (groups[i] || '').trim().split(/\s+/); if (tk.length !== 4) { dropped.push(it.n); return; }
    const cnt = {}; tk.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
    const ks = Object.keys(cnt), odd = ks.length === 2 && ks.some(k => cnt[k] === 1) && ks.some(k => cnt[k] === 3) ? tk.indexOf(ks.find(k => cnt[k] === 1)) : -1;
    if (odd < 0) { dropped.push(it.n); return; }
    const kl = keys && keys[i]; let note = (notes && notes[i]) || '';
    if (kl && 'ABCD'.indexOf(kl) !== odd) { diff.push(it.n); note += `<p class="fb-note">⚠️ Đáp án trong tài liệu gốc ghi <b>${kl}</b>, nhưng theo phiên âm từ điển thì đáp án đúng là <b>${'ABCD'[odd]}</b>.</p>`; }
    const rows = it.o.map((o, j) => `<tr class="${j === odd ? 'hit' : ''}"><td>${'ABCD'[j]}. <b>${o}</b></td><td class="ph">${mode === 'sound' ? SOUNDNAME(tk[j]) : 'trọng âm âm tiết ' + tk[j]}</td></tr>`).join('');
    const why = mode === 'sound' ? `Ba từ còn lại đọc là <b class="ph">${SOUNDNAME(ks.find(k => cnt[k] === 3))}</b>, riêng <b>${it.o[odd].replace(/<[^>]+>/g, '')}</b> đọc là <b class="ph">${SOUNDNAME(tk[odd])}</b>.`
      : `Ba từ còn lại có trọng âm ở âm tiết <b>${ks.find(k => cnt[k] === 3)}</b>, riêng <b>${it.o[odd].replace(/<[^>]+>/g, '')}</b> ở âm tiết <b>${tk[odd]}</b>.`;
    out.push({ q: mode === 'sound' ? 'Chọn từ có phần gạch chân phát âm khác các từ còn lại.' : 'Chọn từ có trọng âm chính rơi vào âm tiết khác các từ còn lại.', opts: it.o, a: odd, exp: `<table class="mt">${rows}</table><p>${why}</p>${note}` });
  });

    const q = c.parts.map(([kind, t]) => { if (kind === 'u') { const L = 'ABCD'[k++]; segs.push(t.trim()); return `<span class="seg"><sup>${L}</sup>${t}</span>`; } return t; }).join('');

/* passage mistakes -> tagger items. marks: [{s:'start of the sentence', w:'go', n:1, f:'went', why:'…'}] */
function passageItems(text, marks) {
  const sents = text.split(/(?<=[.!?])\s+/).filter(Boolean);
  return sents.map(sen => {
    const toks = sen.split(' '), sets = { x: [] };
    marks.filter(m => sen.startsWith(m.s)).forEach(m => {
      let c = 0, idx = -1; toks.forEach((t, i) => { if (idx < 0 && tgClean(t) === tgClean(m.w)) { c++; if (c === (m.n || 1)) idx = i; } });
      if (idx >= 0) sets.x.push([m.w, m.f, idx, m.why]);
    });
    return { text: sen, sets, vi: '' };
  });
}
const fmtFix = p => `<b>${p[0]}</b> → <b>${p[1]}</b>${p[3] ? ' <span class="muted">(' + p[3] + ')</span>' : ''}`;

/* ---------- poll chart (project) ---------- */
function pollChart(id, cfg) {
  const prev = COMP[id]; const st = prev ? prev.st : { v: cfg.items.map(() => 0), who: '' };
  COMP[id] = { st, cfg, render: el => pcartRender(id, el) }; return slot(id);
}
function pcartRender(id, el) {
  const { st, cfg } = COMP[id], tot = st.v.reduce((a, b) => a + b, 0), max = Math.max(1, ...st.v);
  const top = st.v.indexOf(Math.max(...st.v)), low = st.v.indexOf(Math.min(...st.v));
  el.innerHTML = `<div class="grid2"><div><div class="colh">${cfg.title}</div>
      ${cfg.items.map((it, i) => `<div class="poll"><span class="pl">${it}</span><button class="btn sm" onclick="pcartAdd('${id}',${i},-1)">−</button><b class="pn2">${st.v[i]}</b><button class="btn sm" onclick="pcartAdd('${id}',${i},1)">＋</button>
        <div class="pbar2"><i style="width:${st.v[i] / max * 100}%"></i></div><span class="pp2">${tot ? Math.round(st.v[i] / tot * 100) : 0}%</span></div>`).join('')}
      <div class="muted" style="margin-top:6px">Tổng số bạn được hỏi: <b>${tot}</b> · bấm ＋ mỗi khi một bạn chọn mục đó.</div></div>
      <div><div class="colh">Báo cáo tự động</div><div class="out" style="font-size:13.5px">${tot ? cfg.report(cfg.items, st.v, tot, top, low) : 'Hãy nhập kết quả khảo sát ở bên trái để xem câu báo cáo mẫu.'}</div>
      ${tot ? `<div style="margin-top:8px"><button class="btn solid" onclick="say(document.querySelector('.out').textContent,.9)">🔊 Nghe báo cáo</button></div>` : ''}</div></div>`;
}

/* word counter with a configurable target range (WC_RANGE defined by each unit) */
function wcUpdate() {
  const t = document.getElementById('wr2t'); if (!t) return; WR2.text = t.value;
  const R = (typeof WC_RANGE !== 'undefined') ? WC_RANGE : [60, 80];
  const n = (t.value.trim().match(/\S+/g) || []).length, bar = document.getElementById('wcb'), lab = document.getElementById('wcn');
  bar.style.width = Math.min(100, n / R[1] * 100) + '%';
  const ok = n >= R[0] && n <= R[1]; bar.style.background = ok ? '#10b981' : n > R[1] ? '#ef4444' : '#f59e0b';
  lab.textContent = n + ' từ' + (ok ? ' ✓' : n > R[1] ? ' (quá dài)' : ` (cần ${R[0]}–${R[1]})`); lab.style.color = ok ? '#047857' : n > R[1] ? '#b91c1c' : '#b45309';
  if (ok && !DONE.wr2) markDone('wr2', n, n);
}

/* ---------- rate: self-assessment with 5 faces ---------- */
const FACES = ['😕', '🙁', '😐', '🙂', '😄'], FACE_T = ['Chưa biết', 'Biết ít', 'Tạm được', 'Khá tự tin', 'Rất tự tin'];
function rate(id, cfg) {
  const prev = COMP[id], st = prev ? prev.st : { v: [] };
  COMP[id] = { st, cfg, render: el => rtRender(id, el) }; return slot(id);
}
function rtRender(id, el) {
  const { st, cfg } = COMP[id], n = cfg.items.length, done = st.v.filter(x => x).length;
  const avg = done ? st.v.reduce((a, b) => a + (b || 0), 0) / done : 0;
  const msg = done < n ? '' : avg >= 4 ? cfg.high : avg >= 3 ? cfg.mid : cfg.low;
  el.innerHTML = `<div class="fl-top"><span class="t">${cfg.title}</span><span class="chip-s">${done}/${n} mục</span></div>${cfg.note ? `<div class="note">${cfg.note}</div>` : ''}
    ${cfg.items.map((t, i) => `<div class="rt"><span class="rtq">${t}</span><span class="rtb">${[1, 2, 3, 4, 5].map(v => `<button class="face ${st.v[i] === v ? 'on' : ''}" title="${FACE_T[v - 1]}" onclick="rtSet('${id}',${i},${v})">${FACES[v - 1]}</button>`).join('')}</span></div>`).join('')}
    ${msg ? `<div class="note" style="background:#ecfdf5;border-color:#10b981">${msg}</div>` : ''}`;
}
function rtSet(id, i, v) { const { st, cfg } = COMP[id]; st.v[i] = v; if (st.v.filter(x => x).length === cfg.items.length) markDone(id, 1, 1); rerender(id); }

function picker(id, cfg) {
  const prev = COMP[id], st = prev ? prev.st : { sel: [], show: false };

function pkRender(id, el) {
  const { st, cfg } = COMP[id];

}
function pkTog(id, x) { const { st, cfg } = COMP[id]; const i = st.sel.indexOf(x); if (i >= 0) st.sel.splice(i, 1); else if (st.sel.length < cfg.max) st.sel.push(x); st.show = false; rerender(id); }
function pkMake(id) { const { st } = COMP[id]; st.show = true; markDone(id, 1, 1); rerender(id); }

/* ---------- drawBox: random card ---------- */
function drawBox(id, cfg) {
  const prev = COMP[id], st = prev ? prev.st : { cur: null, hist: [], spin: false };
  COMP[id] = { st, cfg, render: el => dbRender(id, el) }; return slot(id);
}
function dbRender(id, el) {
  const { st, cfg } = COMP[id], c = st.cur === null ? null : cfg.cards[st.cur];
  el.innerHTML = `<div class="fl-top"><span class="t">${cfg.title}</span><span class="chip-s">Đã bốc: ${st.hist.length}</span></div>${cfg.note ? `<div class="note">${cfg.note}</div>` : ''}
    <div class="drawcard ${st.spin ? 'spin' : ''}">${c ? `<div class="dc-t">${c.t}</div>${c.sub ? `<div class="dc-s">${c.sub}</div>` : ''}` : '<div class="dc-t" style="opacity:.5">?</div><div class="dc-s">Bấm “Bốc thăm” để nhận thẻ</div>'}</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="btn solid" onclick="dbDraw('${id}')" ${st.spin ? 'disabled' : ''}>🎲 ${cfg.btn || 'Bốc thăm'}</button>${c ? `<button class="btn" onclick="say(document.querySelector('.drawcard').innerText.replace(/\\n+/g,'. '),.9)">🔊 Đọc to</button>` : ''}</div>`;
}
function dbDraw(id) {
  const { st, cfg } = COMP[id]; if (st.spin) return; st.spin = true; let k = 0;
  const tick = () => { st.cur = Math.floor(Math.random() * cfg.cards.length); rerender(id); if (++k < 8) setTimeout(tick, 70 + k * 15); else { st.spin = false; let f; do { f = Math.floor(Math.random() * cfg.cards.length); } while (cfg.cards.length > 1 && f === st.cur); st.cur = f; st.hist.push(f); markDone(id, 1, 1); rerender(id); } };
  tick();
}

const TM = {};
function timerBox(id, cfg) { TM[id] = TM[id] || { left: cfg.seconds, run: false, int: null }; return `<div class="timerbox" id="tm-${id}"><div class="tm-l">${cfg.label || 'Đồng hồ'}</div><div class="tm-t" id="tmt-${id}">${tmFmt(TM[id].left)}</div>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn solid" onclick="tmToggle('${id}',${cfg.seconds})" id="tmb-${id}">${TM[id].run ? '⏸ Tạm dừng' : '▶ Bắt đầu'}</button><button class="btn" onclick="tmReset('${id}',${cfg.seconds})">↺ Đặt lại</button></div></div>`; }
const tmFmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
function tmToggle(id, secs) {
  const t = TM[id]; if (t.run) { clearInterval(t.int); t.run = false; } else {
    if (t.left <= 0) t.left = secs; t.run = true;
    t.int = setInterval(() => { const el = document.getElementById('tmt-' + id); if (!el) { clearInterval(t.int); t.run = false; return; } t.left--; el.textContent = tmFmt(Math.max(0, t.left)); if (t.left <= 0) { clearInterval(t.int); t.run = false; el.textContent = '00:00 ⏰'; const b = document.getElementById('tmb-' + id); if (b) b.textContent = '▶ Bắt đầu'; try { say('Hết giờ!', 1); } catch (e) {} } }, 1000);
  }
  const b = document.getElementById('tmb-' + id); if (b) b.textContent = t.run ? '⏸ Tạm dừng' : '▶ Bắt đầu';
}
function tmReset(id, secs) { const t = TM[id]; clearInterval(t.int); t.run = false; t.left = secs; const el = document.getElementById('tmt-' + id); if (el) el.textContent = tmFmt(secs); const b = document.getElementById('tmb-' + id); if (b) b.textContent = '▶ Bắt đầu'; }

unce", "16. The competition gave the young________her first opportunity to write for a full orchestra.", "A. workerB. firefighterC. composerD. reporter"], "V_II": ["performs", "supports", "photography", "sculpture", "orginates", "Tic Tac Toe", "Water puppetry", "rural", "E.g.: Crops are often in __rural__areas.", "1. She composes and________her own music.", "2. The gallery is playing host to an exhibition of________.", "3. A large rod________the puppet under the water and is used by the puppeteers.", "4. ________is a form of folk arts originating in the Red River Delta in the north of Vietnam.", "5. You can play________any time and anywhere as long as you have a piece of paper, a pencil, and an", "opponent.", "6. Did you see the film Antarctica? The________was superb!"], "P_I": ["share", "usual", "action", "leisure", "vision", "Asia", "national", "musician", "measure", "wish", "television", "competition", "/ʃ/", "/ʒ/", "share,"], "P_II": ["Eg.: A. en<u>s</u>ureB. clo<u>s</u>etC. noi<u>s</u>eD. sea<u>s</u>on", "1. A. essen<u>t</u>ialB. condi<u>t</u>ionC. fantas<u>t</u>icD. sta<u>t</u>ion", "2. A. ma<u>ch</u>ineB. <u>ch</u>ildrenC. kit<u>ch</u>enD. <u>ch</u>air", "3. A. mea<u>s</u>ureB. occa<u>s</u>ionC. mu<u>s</u>icalD. u<u>s</u>ual", "4. A. lei<u>s</u>ureB. <u>s</u>ureC. plea<u>s</u>ureD. clo<u>s</u>ure", "5. A. musi<u>c</u>ianB. spe<u>c</u>ialC. ex<u>c</u>itingD. o<u>c</u>ean", "6. A. na<u>t</u>ionB. educa<u>t</u>ionC. crea<u>t</u>iveD. air-condi<u>t</u>ioner", "7. A. clo<u>s</u>ureB. <u>s</u>ugarC. vi<u>s</u>ionD. lei<u>s</u>ure", "8. A. in<u>c</u>onvenientB. <u>c</u>ountryC. barbe<u>c</u>ueD. deli<u>c</u>ious", "9. A. <u>ch</u>aracterB. s<u>ch</u>eduleC. ma<u>ch</u>ineD. s<u>ch</u>ool", "10. A. de<u>c</u>orateB. <u>c</u>alendarC. edu<u>c</u>ateD. musi<u>c</u>ian"], "P_III": ["E.g.: I’ve never seen her worried or <u>anxious</u> in any way.", "1. Car exhaust is the main reason for the city’s pollution.", "2. It is a great pleasure to welcome you all here this evening.", "3. We met on several occasions to discuss the issue.", "4. We have a clear view of the ocean from our hotel window.", "5. He was too shy to ask her to dance with him."], "G_I": ["E.g.: Your apartment is as big __as__mine.", "1. Today it’s not as cold_________yesterday.", "2. This watch is the same_________the one my father gave me on my last birthday.", "3. I think reading books isn’t as interesting_________watching movies.", "4. This song is as great_________the one I listened to last night.", "5. The requirements of this job are totally different_________my qualification."], "G_II": ["A", "B", "E.g.: Mont Blanc is not as high", "a. from that in the countryside.", "1. Life in the city is quite different", "b. as her brother.", "2. The price of gold is the same", "c. as it was yesterday.", "3. Mary is not as successful", "d. from those in yours.", "4. The questions in my test were different", "e. as Mount Everest.", "5. Playing video games is not as healthy", "f. as the one I lost yesterday", "6.That diamond necklace is the same", "g. as exercising."], "G_III": ["E.g.: Mr. Johnson is as old as my father (same)", "→ Mr. Johnson is the same age as my father.", "1. Your daughter is as heavy as my son. (same)", "→ Your daughter____________________________________", "2. This outfit is not the same as the one you usually wear (different)", "→ This outfit____________________________________", "3. Your elder sister is smarter than Jennifer (as...as)", "→ Jennifer____________________________________", "4. Your mother is the same as she was three years ago. (beautiful - as)", "→ Your mother____________________________________", "5. Country music is different from folk music (same)", "→ Country music____________________________________", "6. Life in the country is more peaceful than life in the city. (as...as)", "→ Life in the city____________________________________", "7. American English is not the same as British English (different)", "→ American English____________________________________", "8. The price of petrol is as high as it was two weeks ago. (same)", "→ The price of petrol____________________________________", "9. This apple pie was as good as the one my grandmother used to make (same)", "→ The taste of this apple pie____________________________________", "10. Sophie is the same height as her sister (tall)", "→ Sophie____________________________________", "11. He is as young as my brother (same)", "→ He____________________________________", "12. The weather this summer is better than last year. (as...as)", "→ The weather last summer____________________________________", "13. Today, my village is not the same as it was ten years ago. (different)", "→ Today, my village____________________________________", "14. The blue dress is more expensive than the red one. (as...as)", "→ The red dress____________________________________", "15. The scenery was not the same as what we expected (different)", "→ The scenery____________________________________"], "G_IV": ["E.g.: Linda doesn’t go to school today and I don’t __either__.", "1. My grandmother loves folk music, and I like it___________.", "2. My father doesn’t enjoy pop music, and my mother doesn’t___________.", "3. I love country music, and I like modem music ___________.", "4. Her friends want to see an opera and she does___________.", "5. We don’t eat meat and they don’t___________.", "6. - I’ve never been to the States. - I haven’t___________.", "7. She is very good at speaking English and her children are___________.", "8. I’m not allowed to eat another piece of cake, so you’re not___________!", "9. My younger brother hates watching that movie, and I do___________.", "10. His team can’t finish the project on time, and my team can’t___________.", "11. Jack: My father doesn’t like listening to rock music.", "Jill: My father doesn’t___________.", "12. She loves playing the guitar and her daughter loves it___________.", "13. They don’t believe me, and he doesn’t___________.", "14. Hoa can control the puppets and Dung can do it___________.", "15. He doesn’t want to watch that movie again, and I don’t___________.", "16. - I love rock ‘n’ roll. - I love it___________.", "17. Jessica doesn’t enjoy watching documentaries, and my brother doesn’t___________.", "18. Mai is interested in seeing water puppet shows and I am___________.", "19. Michael likes collecting modem sculptures and Simon does___________.", "20. This dress isn’t beautiful and it doesn’t fit you___________!"], "R_I": ["Much of the music we listen to today is a mixture of styles from various countries and time periods. A lot of music has roots in older traditional songs heard in many different countries around the world. Traditional, or folk music is collected over decades. Younger generations learn these songs from their elders through practice and repetition.", "Many people fear that traditional and older types of music are slowly disappearing, partly because they are less likely to be written down or recorded. Also, younger generations may not find such music very appealing, so once older generations pass away, the music may die out with them. Whole genres of music may go extinct.", "Nowadays, there is a growing effort to preserve music in its many forms. Some researchers create field recordings to capture live performances, others try to write out the music so that it can be studied and played by modem musicians.", "(Active skills for reading 2)", "Part 1: Find the words in bold which mean:", "1. the origins of something or someone____________.", "2. interesting or attractive____________", "3. type or style of music, art, or literature____________", "4. to make sure that something is kept____________", "5. to record in order to preserve it____________", "Part 2: Decide whether the statements below are TRUE (T) or FALSE (F).", "1. Traditional music is collected over many years.", "2. Young people can’t learn traditional music because no one teaches them.", "3. Younger generations are less likely to care about traditional songs and music than older generations.", "4. The purpose of writing out music is to pass it down to modern musicians.", "❑", "❑", "❑", "❑", "❑"], "R_II": ["Insomnia is a serious problem that affects people of all age groups. While there are many approaches to treating this problem as well as other common sleep disorders, research has demonstrated that listening to relaxing classical music can be a safe, effective, and affordable remedy.", "In a study looking at college students, participants listened to classical music, an audio book, or nothing at all. One group listened to 45 minutes of relaxing classical music while another group listened to an audiobook at bedtime for three weeks. Researchers assessed sleep quality both before and after the intervention.", "The study found that participants who had listened to music had significantly better sleep quality than those who had listened to the audiobook or received no intervention.", "Since music is an effective treatment for sleeping problems, it could be used as an easy and safe strategy for treating insomnia.", "1. What is the main idea of the passage?", "A. Ways to listen to musicB. Points in time to listen to music", "C. Benefits of musicD. Music and insomnia", "2. Which of the following is NOT mentioned as a benefit of music remedy?", "A. safeB. flexibleC. effectiveD. affordable", "3. The purpose of the study looking at college students is to understand________.", "A. students’ hobby of musicB. classical music and students", "C. music at bedtimeD. effects of music on sleep quality", "4. Who did the study find to have significantly better sleep quality?", "A. researchersB. participants who listened to music", "C. participants who listened to audiobookD. participants with no intervention", "5. What does the word “it” refer to?", "A. musicB. treatmentC. problemD. strategy"], "L_-": ["Listen to the information about two famous artists and do the tasks below."], "L_I": ["1. Kazuo Shiraga didn’t paint in the___________way by using a paintbrush.", "2. Shiraga used his whole body in wet___________to create his paintings.", "3. Claude Monet painted pictures in___________colour, not mixing colours together."], "L_II": ["1. Kazuo Shiraga’s paintings communicate the idea of movement.", "2. Impressionist paintings emerged in the mid-1800s.", "3. Claude Monet only painted pictures of lakes and the oceans.", "❑", "❑", "❑"], "SP_-": ["Talk about your favourite kind of music.", "You can use the following questions as cues:", "•What kind of music do you like?", "•When and how often do you listen to it?", "• Why do you like it?", "Useful languages:", "Useful vocabulary", "Useful structures", "•country music, folk music, Jazz, pop music", "•when I’m sad, before going to bed, when I have free time, when I’m tired", "•amazing lyrics and catchy beats, calm down and sleep better, express myself, be happy and more comfortable", "• I am very fond of...", "•I like...very much", "•I listen to..., but...", "•I listen to it when...", "•I often listen to it in...", "•Listening to...helps me...because...", "•It makes me...", "•I feel...when listening to...", "Complete the notes:", "Structures of the talk", "Your notes", "What kind of music do you like?", "__________________________________________", "__________________________________________", "__________________________________________", "When and how often do you listen to it?", "__________________________________________", "__________________________________________", "__________________________________________", "Why do you like it?", "__________________________________________", "__________________________________________", "__________________________________________", "Now you try!", "Give your answer using the following cues. You should speak for 1-2 minutes.", "1. I am very fond of...", "2. I listen to..., but...", "3. I listen to it when...", "4. Listening to...helps me...because...", "5. It makes me...", "Now you tick!", "Did you ...", "❑ answer all the questions in the task?", "❑ give some details to each main point?", "❑ speak slowly and fluently with only some hesitation?", "❑ use vocabulary wide enough to talk about the topic?", "❑ use various sentence structures (simple, compound, complex) accurately?", "❑ pronounce correctly (vowels, consonants, stress, intonation)?", "Let’s compare!", "Finally, compare with the sample answer on page 180."], "W_I": ["1.I/ very/ happy/ hear/ that/ you/ be/ Viet Nam/ again.", "→ ________________________________________________________", "2.I/ want/ invite/ you/ see/ an exhibition/ modern sculptures.", "→ ________________________________________________________", "3.Be/ Sunday morning/ suitable/ you?", "→ ________________________________________________________", "4.The exhibition/ begin/ 9 a.m./ so/ let’s meet/ 8.45 a.m./ outside the Arts Centre.", "→ ________________________________________________________", "5.I/ hope/ we/ have/ a happy time/ there.", "→ ________________________________________________________"], "W_II": ["You can use the following questions as cues:", "• What event do you want to invite your friend to?", "• Where does the event take place?", "• When does the event start?", "• When is the best time for you and your friend to meet?", "__________________________________________________________________", "__________________________________________________________________", "__________________________________________________________________", "__________________________________________________________________", "__________________________________________________________________", "__________________________________________________________________", "__________________________________________________________________", "__________________________________________________________________", "__________________________________________________________________"]}, "key": {"V_I": {"ents": [{"n": 1, "ans": "A. c ơi trò chơi điện tử không tốt cho sức khỏe như tập thể dục.)"}, {"n": 6, "ans": "f", "expl": "Ta có cấu trúc: the same as... (giống với...). Dựa vào nghĩa của câu, phương án f là phù hợp nhất.", "tr": "That diamond necklace is the same as the one I lost yesterday. (Chiếc vòng cổ kim cương đó giống hệt chiếc tôi đã đánh mất vào ngày hôm qua.)", "raw": "Giải thích: Ta có cấu trúc: the same as... (giống với...). Dựa vào nghĩa của câu, phương án f là phù hợp nhất.\nDịch nghĩa: That diamond necklace is the same as the one I lost yesterday. (Chiếc vòng cổ kim cương đó giống hệt chiếc tôi đã đánh mất vào ngày hôm qua.)"}], "lines": ["1.Đáp án: a", "Giải thích: Ta có cấu trúc: different from sth (khác biệt với cái gì). Dựa vào nghĩa của câu, phương án a là phù hợp nhất.", "Dịch nghĩa: Life in the city is quite different from that in the countryside. (Cuộc sống ở thành phố khá khác biệt so với ở nông thôn.)", "2.Đáp án: c", "Giải thích: Ta có cấu trúc: the same as... (giống với...). Dựa vào nghĩa của câu, phương án c là phù hợp nhất.", "Dịch nghĩa: The price of gold is the same as it was yesterday. (Giá vàng vẫn như ngày hôm qua.)", "3.Đáp án: b", "Giải thích: vế đầu của câu kết thúc là “not as successful” nên theo cấu trúc so sánh “as + tính từ + as”, vế sau cần bắt đầu bằng “as”. Dựa vào nghĩa của câu, phương án b là phù hợp nhất.", "Dịch nghĩa: Mary is not as successful as her brother. (Mary không thành công như anh trai mình.)", "4.Đáp án: d", "Giải thích: vế đầu của câu kết thúc là “different” nên theo cấu trúc diễn tả sự so sánh khác nhau “different from”, vế sau cần bắt đầu bằng “from”. Dựa vào nghĩa của câu, phương án d là phù hợp nhất.", "Dịch nghĩa: The questions in my test were different from those in yours. (Các câu hỏi trong bài kiềm tra của tôi khác với những câu hỏi trong bài của bạn.)", "5.Đáp án: g", "Giải thích: vế đầu của câu kết thúc là “as healthy” nên theo cấu trúc so sánh “as + tính từ + as”, vế sau cần bắt đầu bằng “as”. Dựa vào nghĩa của câu, phương án g là phù hợp nhất.", "Dịch nghĩa: Playing video games is not as healthy as exercising. (Chơi trò chơi điện tử không tốt cho sức khỏe như tập thể dục.)", "6.Đáp án: f", "Giải thích: Ta có cấu trúc: the same as... (giống với...). Dựa vào nghĩa của câu, phương án f là phù hợp nhất.", "Dịch nghĩa: That diamond necklace is the same as the one I lost yesterday. (Chiếc vòng cổ kim cương đó giống hệt chiếc tôi đã đánh mất vào ngày hôm qua.)"]}, "G_III": {"ents": [{"n": 1, "ans": "Your daughter is the same weight as my son.", "expl": "Your daughter is as heavy as my son. (Con gái bạn nặng như con trai tôi.) Cấu trúc “as + adj + as” có thể được viết lại bằng cấu trúc “the same + danh từ + as”. Tính từ “heavy” có danh từ tương ứng là “weight”.", "tr": "Con gái của bạn có cùng cân nặng với con trai tôi.", "raw": "Giải thích: Your daughter is as heavy as my son. (Con gái bạn nặng như con trai tôi.)\nCấu trúc “as + adj + as” có thể được viết lại bằng cấu trúc “the same + danh từ + as”. Tính từ “heavy” có danh từ tương ứng là “weight”.\nDịch nghĩa: Con gái của bạn có cùng cân nặng với con trai tôi."}, {"n": 2, "ans": "This outfit is different from the one you usually wear.", "expl": "This outfit is not the same as the one you usually wear. (Bộ trang phục này không giống với trang phục bạn thường mặc.) Cấu trúc “not the same + as” có thể được viết lại bằng cấu trúc diễn tả sự so sánh khác nhau “different + from”.", "tr": "Bộ trang phục này khác với những trang phục bạn thường mặc.", "raw": "Giải thích: This outfit is not the same as the one you usually wear. (Bộ trang phục này không giống với trang phục bạn thường mặc.)\nCấu trúc “not the same + as” có thể được viết lại bằng cấu trúc diễn tả sự so sánh khác nhau “different + from”.\nDịch nghĩa: Bộ trang phục này khác với những trang phục bạn thường mặc."}, {"n": 3, "ans": "Jennifer is not as smart as your elder sister.", "expl": "Your elder sister is smarter than Jennifer. (Chị gái của bạn thông minh hơn Jennifer.) Cấu trúc so sánh hơn “A + be + tính từ ngắn+-er + than B” có thể được viết lại bằng cấu trúc “B + be not as + tính từ + as + A”.", "tr": "Jennifer không thông minh như chị gái của bạn.", "raw": "Giải thích: Your elder sister is smarter than Jennifer. (Chị gái của bạn thông minh hơn Jennifer.)\nCấu trúc so sánh hơn “A + be + tính từ ngắn+-er + than B” có thể được viết lại bằng cấu trúc “B + be not as + tính từ + as + A”.\nDịch nghĩa: Jennifer không thông minh như chị gái của bạn."}, {"n": 4, "ans": "Your mother is as beautiful as she was three years ago.", "expl": "Your mother is the same as she was three years ago. (Mẹ của bạn vẫn giống như ba năm trước.) Cấu trúc “the same + as” có thể được viết lại bằng cấu trúc so sánh ngang bằng “as + tính từ + as”.", "tr": "Mẹ bạn vẫn xinh đẹp như ba năm trước.", "raw": "Giải thích: Your mother is the same as she was three years ago. (Mẹ của bạn vẫn giống như ba năm trước.) Cấu trúc “the same + as” có thể được viết lại bằng cấu trúc so sánh ngang bằng “as + tính từ + as”.\nDịch nghĩa: Mẹ bạn vẫn xinh đẹp như ba năm trước."}, {"n": 5, "ans": "Country music is not the same as folk music.", "expl": "Country music is different from folk music. (Nhạc đồng quê khác với nhạc dân gian.) Cấu trúc diễn tả sự so sánh khác nhau “different + from” có thể được viết lại bằng cấu trúc “not the same + as”.", "tr": "Nhạc đồng quê không giống với nhạc dân gian.", "raw": "Giải thích: Country music is different from folk music. (Nhạc đồng quê khác với nhạc dân gian.)\nCấu trúc diễn tả sự so sánh khác nhau “different + from” có thể được viết lại bằng cấu trúc “not the same + as”.\nDịch nghĩa: Nhạc đồng quê không giống với nhạc dân gian."}, {"n": 6, "ans": "Life in the city isn’t as peaceful as life in the country.", "expl": "Life in the country is more peaceful than life in the city. (Cuộc sống ở nông thôn yên bình hơn ở thành phố.) Cấu trúc “A + be + more + tính từ dài + than B” có thể được viết lại bằng cấu trúc “B + be + not as + tính từ + as A”.", "tr": "Cuộc sống ở thành phố không yên bình như cuộc sống ở nông thôn.", "raw": "Giải thích: Life in the country is more peaceful than life in the city. (Cuộc sống ở nông thôn yên bình hơn ở thành phố.)\nCấu trúc “A + be + more + tính từ dài + than B” có thể được viết lại bằng cấu trúc “B + be + not as + tính từ + as A”.\nDịch nghĩa: Cuộc sống ở thành phố không yên bình như cuộc sống ở nông thôn."}, {"n": 7, "ans": "American English is different from British English.", "expl": "American English is not the same as British English. (Tiếng Anh Mỹ không giống như tiếng Anh Anh.) Cấu trúc “not the same + as” có thể được viết lại bằng cấu trúc diễn tả sự so sánh khác nhau “different from”.", "tr": "Tiếng Anh Mỹ khác với tiếng Anh Anh.", "raw": "Giải thích: American English is not the same as British English. (Tiếng Anh Mỹ không giống như tiếng Anh Anh.)\nCấu trúc “not the same + as” có thể được viết lại bằng cấu trúc diễn tả sự so sánh khác nhau “different from”.\nDịch nghĩa: Tiếng Anh Mỹ khác với tiếng Anh Anh."}, {"n": 8, "ans": "The price of petrol is the same height as it was two weeks ago.", "expl": "The price of petrol is as high as it was two weeks ago. (Giá xăng dầu cao bằng hai tuần trước.) Cấu trúc “as + tính từ + as” có thể được viết lại bằng cấu trúc so sánh giống nhau “the same + as”.", "tr": "The price of petrol is the same height as it was two weeks ago. (Giá xáng dầu vẫn cao giống như hai tuần trước.)", "raw": "Giải thích: The price of petrol is as high as it was two weeks ago. (Giá xăng dầu cao bằng hai tuần trước.) Cấu trúc “as + tính từ + as” có thể được viết lại bằng cấu trúc so sánh giống nhau “the same + as”.\nDịch nghĩa: The price of petrol is the same height as it was two weeks ago. (Giá xáng dầu vẫn cao giống như hai tuần trước.)"}, {"n": 9, "ans": "The taste of this apple pie was the same as the one my grandmother used to make.", "expl": "This apple pie was as good as the one my grandmother used to make. (Chiếc bánh táo này ngon như chiếc bánh mà bà tôi đã làm cho tôi. ) Cấu trúc so sánh giống nhau “as + tính từ + as” có thể được viết lại bằng cấu trúc so sánh giống nhau “the same + as”.", "tr": "Hương vị của chiếc bánh táo này giống như chiếc mà bà tôi đã làm cho tôi.", "raw": "Giải thích: This apple pie was as good as the one my grandmother used to make. (Chiếc bánh táo này ngon như chiếc bánh mà bà tôi đã làm cho tôi. )\nCấu trúc so sánh giống nhau “as + tính từ + as” có thể được viết lại bằng cấu trúc so sánh giống nhau “the same + as”.\nDịch nghĩa: Hương vị của chiếc bánh táo này giống như chiếc mà bà tôi đã làm cho tôi."}, {"n": 10, "ans": "Sophie is as tall as her sister.", "expl": "Sophie is the same height as her sister. (Sophie có cùng chiều cao với chị gái mình.) Cấu trúc “the same + danh từ + as” có thể được viết lại bằng cấu trúc “as + adj + as”. Danh từ “height” có tính từ tương ứng là “tall”.", "tr": "Sophie cao bằng chị gái mình.", "raw": "Giải thích: Sophie is the same height as her sister. (Sophie có cùng chiều cao với chị gái mình.)\nCấu trúc “the same + danh từ + as” có thể được viết lại bằng cấu trúc “as + adj + as”. Danh từ “height” có tính từ tương ứng là “tall”.\nDịch nghĩa: Sophie cao bằng chị gái mình."}, {"n": 11, "ans": "He is the same age as my brother.", "expl": "He is as young as my brother. (Cậu ấy trẻ như em trai tôi.) Cấu trúc “as + adj + as” có thể được viết lại bằng cấu trúc “the same + danh từ + as”. Tính từ “young” nói về tuổi tác nên có danh từ tương ứng là “age”.", "tr": "Cậu ấy bằng tuổi anh trai tôi.", "raw": "Giải thích: He is as young as my brother. (Cậu ấy trẻ như em trai tôi.)\nCấu trúc “as + adj + as” có thể được viết lại bằng cấu trúc “the same + danh từ + as”. Tính từ “young” nói về tuổi tác nên có danh từ tương ứng là “age”.\nDịch nghĩa: Cậu ấy bằng tuổi anh trai tôi."}, {"n": 12, "ans": "The weather last summer was not as good as this year.", "expl": "The weather this summer is better than last year. (Thời tiết mùa hè năm nay dễ chịu hơn mùa hè năm ngoái.) Cấu trúc s ong cảnh thật khác với những gì chúng ta mong đợi."]}, "G_IV": {"ents": [{"n": 1, "ans": "too", "expl": "Để diễn tả ý đồng tình với câu khẳng định“My grandmother loves folk music” (Bà tôi thích nhạc dân gian), ta dùng “too”.", "tr": "My grandmother loves folk music, and I like it too. (Bà tôi thích nhạc dân gian, và tôi cũng thích nó.)", "raw": "Giải thích: Để diễn tả ý đồng tình với câu khẳng định“My grandmother loves folk music” (Bà tôi thích nhạc dân gian), ta dùng “too”.\nDịch nghĩa: My grandmother loves folk music, and I like it too. (Bà tôi thích nhạc dân gian, và tôi cũng thích nó.)"}, {"n": 2, "ans": "either", "expl": "Để diễn tả ý đồng tình với câu phủ định “My father doesn’t enjoy pop music” (Bố tôi không thích nhạc pop), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng trợ động từ ở dạng phủ định là “doesn’t” và sau cùng là “either”.", "tr": "My father doesn’t enjoy pop music, and my mother doesn’t either. (Bố tôi không thích nhạc pop, và mẹ tôi cũng vậy.)", "raw": "Giải thích: Để diễn tả ý đồng tình với câu phủ định “My father doesn’t enjoy pop music” (Bố tôi không thích nhạc pop), ta dùng “either”. Đây là câu đồng tình rút gọn nên chúng ta chỉ cần sử dụng trợ động từ ở dạng phủ định là “doesn’t” và sau cùng là “either”.\nDịch nghĩa: My father doesn’t enjoy pop music, and my mother doesn’t either. (Bố tôi không thích nhạc pop, và mẹ tôi cũng vậy.)"}, {"n": 3, "ans": "too", "expl": "Để diễn tả ý bổ sung vào câu khẳng định “I love country music” (Tôi yêu thích nhạc đồng quê), ta dùng “too”.", "tr": "I love country music, and I like modern music too. (Tôi yêu thích nhạc đồng quê, và tôi cũng thích nhạc hiện đại.)", "raw": "Giải thích: Để diễn tả ý bổ sung vào câu khẳng định “I love country music” (Tôi yêu thích nhạc đồng quê), ta dùng “too”.\nDịch nghĩa: I love country music, and I like modern music too. (Tôi yêu thích nhạc đồng quê, và tôi cũng thích nhạc hiện đại.)"}, {"n": 4, "ans": "too", "expl": "Để diễn tả ý đồng tình với câ
