</i>.): đỗ xe<b>B</b>. flew (<i>v</i>.): bay</p><p><b>C</b>. obeyed (<i>v</i>.): tuân thủ<b>D</b>. reversed (<i>v</i>.): quay đầu xe</p><p>Xét về nghĩa, phương án A phù hợp nhất</p><p><b>Dịch nghĩa</b>: The drunk taxi driver parked in the middle of the small road, other vehicles couldn’t go through. (<i>Người tài xế taxi say rượu đỗ xe ở giữa con đường nhỏ. Những phương tiện khác không thể đi qua được. )</i></p>"}, {"q": "Travellers often pay more to be sure of travelling___. ", "opts": ["importantly", "quietly", "safely", "illegally"], "a": 2, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. importantly (<i>adv</i>.): quan trọng<b>B.</b> quietly (<i>adv</i>.): yên tĩnh</p><p><b>C</b>. safely (<i>adv</i>.): an toàn<b>D</b>. illegally (<i>adv.</i>): bất hợp pháp</p><p>Xét về nghĩa, phương án C phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Travellers often pay more to be sure of travelling safely. (<i>Hành khách thường chi trả nhiều tiền hơn để đảm bảo việc đi lại an toàn.)</i></p>"}, {"q": "A___has one wheel at the front and two wheels at the back. ", "opts": ["tricycle", "bike", "ship", "boat"], "a": 0, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. tricycle (<i>n</i>.): xe ba bánh<b>B</b>. bike (<i>n</i>.): xe đạp</p><p><b>C</b>. ship (<i>n</i>.): tàu thủy<b>D</b>. boat (<i>n.</i>): thuyền</p><p>Xét về nghĩa, phương án A phù hợp nhất.</p><p><b>Dịch nghĩa</b>: A tricycle has one wheel at the front and two wheels at the back. <i>(Xe ba bánh có một bánh phía trước và hai bánh phía sau.)</i></p>"}, {"q": "You can find trains to almost every domestic destination at your local ___ ", "opts": ["pavement", "railway station", "traffic sign", "cycle lane"], "a": 1, "exp": "<p><b>Giải thích</b>:</p><p><b>A</b>. pavement (<i>n</i>.) vỉa hè<b>B</b>. railway station (<i>n</i>.): ga tàu</p><p><b>C</b>. traffic sign (<i>n</i>.): biển báo giao thông<b>D</b>. cycle lane (<i>n</i>.): làn đường dành cho xe đạp</p><p>Xét về nghĩa, phương án B phù hợp nhất.</p><p><b>Dịch nghĩa</b>: You can find train to almost every domestic destination at your local railway station. <i>(Bạn có thể tìm thấy các chuyến tàu đi hầu hết các địa điểm nội địa ở ga tàu địa phương.)</i></p>"}, {"q": "Are you sure that the triangle___over there means “school ahead”? ", "opts": ["traffic sign", "traffic rule", "traffic light", "traffic jam"], "a": 2, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. traffic sign (<i>n</i>.): biển báo giao thông<b>B</b>. traffic rule (<i>n</i>.): luật giao thông</p><p><b>C</b>. traffic light (<i>n</i>.) đèn giao thông<b>D</b>. traffic jam (<i>n</i>.): sự tắc đường</p><p>Xét về nghĩa, phương án A phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Are you sure that the triangle traffic sign over there means “school ahead”? (<i>Bạn có chắc rằng biển báo giao thông hình tam giác đằng kia có nghĩa là trường học ở phía trước không?)</i></p>"}, {"q": "I think there should be a___that new drivers must be accompanied by a tutor within their first week driving on the road. ", "opts": ["vehicle", "safety", "traffic law", "traffic sign"], "a": 2, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. vehicle (<i>n</i>.). phương tiện<b>B</b>. safety (<i>n.</i>): sự an toàn</p><p><b>C</b>. traffic law (<i>n</i>.): luật giao thông<b>D</b>. traffic sign (<i>n.</i>): biển báo giao thông</p><p>Xét về nghĩa, phương án c phù hợp nhất.</p><p><b>Dịch nghĩa</b>: I think there should be a traffic law that new drivers must be accompanied by a tutor within their first week driving on the road. (<i>Tôi nghĩ nên có một luật lệ giao thông là các tài xế mới phải có người hướng dẫn đi kèm trong tuần đầu tiên họ lái xe trên đường)</i></p>"}, {"q": "It is___to turn on your headlight while moving inside the city center at night. You may be fined for that. ", "opts": ["important", "necessary", "safe", "prohibitive"], "a": 3, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. important (<i>adj.</i>): quan trọng<b>B</b>. necessary (<i>adj</i>. ): thiết yếu</p><p><b>C</b>. safe (<i>adj</i>. ): an toàn<b>D</b>. prohibitive (<i>adj</i>.) bị cấm</p><p>Xét về nghĩa, phương án D phù hợp nhất.</p><p><b>Dịch nghĩa</b>: It is prohibitive to turn on your headlight while moving inside the city center at night. You may be fined for that. <i>(Bật đèn pha khi di chuyển trong trung tâm thành phố vào buổi tối là bị cấm. Bạn có thể bị phạt vì điều đó.)</i></p>"}], "before": "<div class=\"note\">I – Choose the best option to complete each of the following sentences.</div>"}, {"id": "v2", "label": "II · Điền từ", "kind": "fill", "items": [{"q": "Driving a car which is not registered and insured is___.", "a": ["illegal"], "exp": "<p><b>Giải thích</b>: Vì sau động từ “to be” là một tính từ và xét về nghĩa, tính từ “illegal” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Driving a car which is not registered and insured is illegal. (<i>Lái một chiếc ô tô chưa được đăng kí và mua bảo hiểm là bất hợp pháp.)</i></p>"}, {"q": "I was stuck in a___for nearly an hour on the way home from work.", "a": ["traffic jam"], "exp": "<p><b>Giải thích:</b> Sau mạo từ “a” là một danh từ và xét về nghĩa, danh từ “traffic jam” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: I was stuck in a traffic jam for nearly an hour on the way home from work. (<i>Tôi đã bị tắc đường gần một tiếng đồng hồ trên đường từ chỗ làm về nhà.)</i></p>"}, {"q": "Don’t worry! There is a seat and a___for every child in our rental vehicles.", "a": ["seatbelt"], "exp": "<p><b>Giải thích</b>: Sau mạo từ “a” là một danh từ và xét về nghĩa, danh từ “seatbelt” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Don’t worry! There is a seat and a seatbelt for every child in our rental vehicles. (<i>Đừng lo! Có ghế ngồi và dây an toàn cho mỗi bạn nhỏ trong các phương tiện cho thuê của chúng tôi.)</i></p>"}, {"q": "My friends called to let me know that they arrived___.", "a": ["safely"], "exp": "<p><b>Giải thích</b>: Vì sau động từ “arrive” phải là một trạng từ nên điền “safely” là phù hợp nhất.</p><p><b>Dịch nghĩa:</b> My friends called to let me know that they arrived safely. (<i>Những người bạn của tôi đã gọi để báo cho tôi biết là họ đã đến nơi một cách an toàn.)</i></p>"}, {"q": "They caught a taxi to the___and waited for the train to Manchester Airport.", "a": ["railway station"], "exp": "<p><b>Giải thích</b>: Vì sau mạo từ “the” là một danh từ và xét về nghĩa, ta cần điền một danh từ chỉ nơi chốn, vì vậy “railway station” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: They caught a taxi to the railway station and waited for the train to Manchester Airport. <i>(Họ đã bắt một chiếc taxi ra ga tàu và đợi lên tàu đến sân bay Manchester.)</i></p>"}, {"q": "Her parents were extremely worried for her___when she came home late last night.", "a": ["safety"], "exp": "<p><b>Giải thích</b>: Vì sau tính từ sở hữu “her” là danh từ và xét về nghĩa, danh từ “safety” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Her parents were extremely worried for her safety when she came home late last night. <i>(Bố mẹ của cô ấy đã vô cùng lo lắng cho sự an toàn của cô ấy khi cô ấy về nhà muộn tối qua.)</i></p>"}, {"q": "Do you think that ___are the same in every country around the world?", "a": ["traffic signs"], "exp": "<p><b>Giải thích</b>: Vì vị trí cần điền thiếu một danh từ làm chủ ngữ và xét về mặt nghĩa, danh từ “traffic signs” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Do you think that traffic signs are the same In every country around the world<i>? (Bạn có nghĩ rằng biển báo giao thông giống nhau ở mọi nước trên thế giới không?)</i></p>"}, {"q": "The first___was designed by Igor Sikorsky and took flight at Stratford in 1939.", "a": ["helicopter"], "exp": "<p><b>Giải thích</b>: Vì sau từ hạn định “the first” phải là một danh từ và xét về nghĩa, danh từ “helicopter” là phù hợp nhất. </p><p><b>Dịch nghĩa</b>: The first helicopter was designed by Igor Sikorsky and took flight at Stratford in 1939. <i>(Chiếc trực thăng đầu tiên được thiết kế bởiIgor Sikorsky và cất cánh ở Stratford vào năm 1939.)</i></p>"}, {"q": "Electric___are usually energy-saving and friendly to the environment.", "a": ["vehicles"], "exp": "<p><b>Giải thích</b>: Vì sau tính từ “electric” phải là một danh từ và xét về nghĩa, danh từ “vehicles” là phù hợp nhất. </p><p><b>Dịch nghĩa</b>: Electric vehicles are usually energy-saving and friendly to the environment. (<i>Các phương tiện sử dụng điện thường tiết kiệm năng lượng và thân thiện với môi trường.)</i></p>"}, {"q": "My little brother hopes to be given a___on his birthday.", "a": ["tricycle"], "exp": "<p><b>Giải thích</b>: Vì sau mạo từ “a” phải là một danh từ và xét về nghĩa, danh từ “tricyle” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: My little brother hopes to be given a tricycle on his birthday. (<i>Em trai bé bỏng của tôi hi vọng được tặng một chiếc xe ba bánh vào ngày sinh nhật của em ấy.)</i></p>"}], "before": "<div class=\"note\">II - Complete the following sentences using the given words in the box. There is ONE extra word or phrase.</div><div class=\"source\"><p><b>II - Complete the following sentences using the given words in the box. There is ONE extra word or phrase.</b></p><div class=\"tablewrap\"><table><tr><td><p>reverse</p></td><td><p>seatbelt</p></td><td><p>illegal</p></td><td><p>traffic jam</p></td><td><p>helicopter</p></td><td><p>safely</p></td></tr><tr><td><p>boat</p></td><td><p>tricycle</p></td><td><p>railway station</p></td><td><p>vehicles</p></td><td><p>traffic signs</p></td><td><p>safety</p></td></tr></table></div><p><i>E.g.: Are you travelling by__boat__or by air?</i></p></div>"}]}, {"title": "Pronunciation · Ngữ âm", "icon": "🎧", "desc": "Unit 7 · Traffic", "subs": [{"label": "Lý thuyết", "html": "<div class=\"source\"><p><b>NGỮ ÂM</b></p><p>Pronunciation</p><p><b>1. NGUYÊN ÂM ĐƠN /e/</b></p><div class=\"tablewrap\"><table><tr><td><p><b>CÁCH PHÁT ÂM</b></p></td><td><p><b>CÁC DẠNG CHÍNH TẢ PHỔ BIẾN</b></p></td><td><p><b>VÍ DỤ</b></p></td></tr><tr><td><p>Cuống họng xuống một chút</p></td><td><p><b>e</b></p></td><td><p>• project /ˈprɒdʒekt/ (<i>n</i>.): dự án</p><p>• check /tʃek/ (<i>v</i>.): kiểm tra</p></td></tr><tr><td></td><td><p><b>ea</b></p></td><td><p>• head /hed/ (<i>n</i>.): cái đầu</p><p>• bread /bred/ (<i>n</i>.): bánh mì</p></td></tr><tr><td><p>Gần giống như phát âm /ɪ/, nhưng khoảng cách môi trên-dưới mở rộng hơn, vị trí lưỡi thấp hơn.</p></td><td><p><b>a</b></p></td><td><p>• any /ˈeni/ (<i>adj.</i>): bất kỳ</p><p>• many /ˈmeni/ (<i>adj.</i>): nhiều</p></td></tr></table></div><p><b>2. NGUYÊN ÂM ĐÔI /eɪ/</b></p><div class=\"tablewrap\"><table><tr><td><p><b>CÁCH PHÁT ÂM</b></p></td><td><p><b>CÁC DẠNG CHÍNH TẢ PHỔ BIẾN</b></p></td><td><p><b>VÍ DỤ</b></p></td></tr><tr><td><p>Cuống họng xuống một chút</p><p>Phát âm hơi kéo dài từ /e/ dần dần chuyển đến và kết thúc tại /ɪ/. Âm /ɪ/ phát âm rất ngắn và nhanh.</p></td><td><p><b>ea</b></p></td><td><p>* great /ɡreɪt/ (<i>adj.</i>): tuyệt vời</p><p>* break /breɪk/ (<i>v</i>.): làm vỡ</p></td></tr><tr><td></td><td><p><b>ai</b></p></td><td><p>* train /treɪn/ (<i>n</i>.): tàu hỏa</p><p>* rain /reɪn/ (<i>v</i>.): mưa</p></td></tr><tr><td></td><td><p><b>ay</b></p></td><td><p>* play /pleɪ/ (<i>v</i>.): chơi</p><p>* way /weɪ/ (<i>n</i>.) con đường</p></td></tr><tr><td></td><td><p><b>ei</b></p></td><td><p>* eight /eɪt/: số 8</p><p>* neighbour /ˈneɪbə(r)/ (<i>n</i>.) người hàng xóm</p></td></tr><tr><td></td><td><p><b>ey</b></p></td><td><p>* obey /əˈbeɪ/ (<i>v</i>.): tuân theo</p><p>* they /ðeɪ/ (<i>pro.</i>): họ, chúng</p></td></tr></table></div><p><b></b></p></div>"}, {"id": "p1", "label": "I · Chọn âm khác", "kind": "quiz", "items": [{"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["g<u>a</u>te", "n<u>a</u>tion", "am<u>a</u>zing", "m<u>a</u>ny"], "a": 3, "exp": "<p><b>Giải thích</b>: m<u>a</u>ny /ˈmeni/ có “a” được phát âm là /e/, các phương án còn lại có “a” phát âm là /eɪ/.</p><p><b>A</b>. g<u>a</u>te /ɡeɪt/<b>B</b>. n<u>a</u>tion /ˈneɪʃn/<b>C</b>. am<u>a</u>zing /əˈmeɪzɪŋ/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["d<u>e</u>licious", "r<u>e</u>gard", "t<u>e</u>mple", "blank<u>e</u>t"], "a": 2, "exp": "<p><b>Giải thích</b>: t<u>e</u>mple /ˈtempl/ có “e” được phát âm là /e/, các phương án còn lại có “e” phát âm là /ɪ/.</p><p><b>A</b>.d<u>e</u>licious /dɪˈlɪʃəs/<b>B</b>. r<u>e</u>gard /rɪˈɡɑːd/<b>D</b>. blanket /ˈblæŋk<u>ɪ</u>t/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["<u>a</u>nyone", "<u>a</u>lien", "Asian", "t<u>a</u>ke"], "a": 0, "exp": "<p><b>Giải thích</b>: <u>a</u>nyone /ˈeniwʌn/ có “a” phát âm là /e/, các phương án khác có “a” phát âm là /eɪ/.</p><p><b>B</b>.<u>a</u>lien /ˈeɪliən/<b>C</b>. <u>A</u>sian /ˈeɪʒn/<b>D</b>. t<u>a</u>ke /teɪk/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["b<u>e</u>tween", "d<u>e</u>partment", "<u>e</u>xciting", "m<u>e</u>ssy"], "a": 3, "exp": "<p><b>Giải thích</b>: m<u>e</u>ssy /ˈmesi/ có “e” phát âm là /e/, các phương án khác có “e” phát âm là /ɪ/.</p><p><b>A</b>. b<u>e</u>tween /bɪˈtwiːn/ <b>B</b>. d<u>e</u>partment /dɪˈpɑːtmənt/<b>C</b>. <u>e</u>xciting /ɪkˈsaɪtɪŋ/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["br<u>ea</u>k", "gr<u>ea</u>t", "d<u>ea</u>d", "st<u>ea</u>k"], "a": 2, "exp": "<p><b>Giải thích</b>: d<u>ea</u>d /ded/ có có “ea” phát âm là /e/, các phương án khác có “ea” phát âm là /eɪ/.</p><p><b>A.</b> br<u>ea</u>k /breɪk/<b>B.</b> gr<u>ea</u>t /greɪt/<b>D</b>. st<u>ea</u>k /steɪk/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["p<u>a</u>vement", "s<u>a</u>fety", "pl<u>a</u>ne", "<u>a</u>ny"], "a": 3, "exp": "<p><b>Giải thích</b>: <u>a</u>ny /ˈeni/ có “a” được phát âm là /e/, các phương án còn lại có “a” phát âm là /eɪ/.</p><p><b>A</b>.p<u>a</u>vement /ˈpeɪvmənt/<b>B</b>. s<u>a</u>fety /ˈseɪfti/<b>C.</b> pl<u>a</u>ne /pleɪn/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["<u>e</u>xpert", "depr<u>e</u>ssion", "v<u>e</u>hicle", "seatb<u>e</u>lt"], "a": 2, "exp": "<p><b>Giải thích</b>: v<u>e</u>hicle /ˈviːəkl/ có “e” được phát âm là /i:/, các phương án còn lại có “e” phát âm là /e/.</p><p><b>A</b>. <u>e</u>xpert /ˈekspɜːt/ / <b>B</b>. depr<u>e</u>ssion /dɪˈpreʃn/<b>D</b>. seatb<u>e</u>lt /ˈsiːt belt/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["s<u>ai</u>d", "p<u>ai</u>nkiller", "m<u>ai</u>n", "Sp<u>ai</u>n"], "a": 0, "exp": "<p><b>Giải thích</b>: s<u>ai</u>d /sed/ có “ai” phát âm là /e/, các phương án khác có “ai” phát âm là /eɪ/.</p><p><b>B</b>.p<u>ai</u>nkiller /ˈpeɪnkɪlə(r)/ <b>C</b>. m<u>ai</u>n /meɪn/<b>D</b>. Sp<u>ai</u>n /speɪn/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["l<u>e</u>tter", "pr<u>e</u>serve", "m<u>e</u>lody", "<u>e</u>ggshell"], "a": 1, "exp": "<p><b>Giải thích</b>: pr<u>e</u>serve /prɪˈzɜːv/ có “e” phát âm là /ɪ/, các phương án khác có “e” phát âm là /e/.</p><p><b>A</b>. l<u>e</u>tter /ˈletə(r)/<b>C</b>. m<u>el</u>ody /ˈmelədi/ <b>D</b>. <u>e</u>ggshell /ˈeɡʃel/ </p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["eng<u>a</u>ge", "<u>a</u>ge", "herit<u>a</u>ge", "p<u>a</u>ge"], "a": 2, "exp": "<p><b>Giải thích</b>: herit<u>a</u>ge /ˈherɪtɪdʒ/ có “a” phát âm là /ɪ/, các phương án khác có “a” phát âm là /eɪ/.</p><p><b>A</b>. eng<u>a</u>ge /ɪnˈɡeɪdʒ/  <b>B</b>. <u>a</u>ge /eɪdʒ/<b>D</b>. p<u>a</u>ge /peɪdʒ/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["surv<u>ey</u>", "th<u>ey</u>", "mon<u>ey</u>", "ob<u>ey</u>"], "a": 2, "exp": "<p><b>Giải thích</b>: mon<u>ey</u> /ˈmʌni/ có “ey” được phát âm là /i/, các phương án còn lại có “ey” phát âm là /eɪ/.</p><p><b>A</b>. surv<u>ey</u> /ˈsɜːveɪ/<b>B</b>. th<u>ey</u> /ðeɪ/<b>D</b>. ob<u>ey</u> /əˈbeɪ/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["st<u>ay</u>s", "pl<u>ay</u>s", "s<u>ay</u>s", "pr<u>ay</u>s"], "a": 2, "exp": "<p><b>Giải thích</b>: s<u>ay</u>s /sez/ có “ay” được phát âm là /e/, các phương án còn lại có “ay” phát âm là /eɪ/.</p><p><b>A</b>. st<u>ay</u>s /steɪz/<b>B</b>. pl<u>ay</u>s /pleɪz/<b>D</b>. pr<u>ay</u>s /preɪz/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["journ<u>ey</u>", "gr<u>ey</u>", "hon<u>ey</u>", "monk<u>ey</u>"], "a": 1, "exp": "<p><b>Giải thích</b>: gr<u>ey</u> /greɪ/ có “ey” phát âm là/eɪ/, các phương án khác có “ey” phát âm là /i/.</p><p><b>A</b>. journ<u>ey</u> /ˈdʒɜːni/ <b>C</b>. hon<u>ey</u> /ˈhʌni/<b>D</b>. monk<u>ey</u> /ˈmʌŋki/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["gr<u>ea</u>t", "h<u>ea</u>lth", "d<u>ea</u>th", "spr<u>ea</u>d"], "a": 0, "exp": "<p><b>Giải thích</b>: gr<u>ea</u>t /ɡreɪt/ có “ea” phát âm là /eɪ/, các phương án khác có “ea” phát âm là /e/.</p><p><b>B</b>. h<u>ea</u>lth /helθ/<b>C</b>. d<u>ea</u>th /deθ/<b>D.</b> spr<u>ea</u>d /spred/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["sh<u>a</u>pe", "p<u>a</u>per", "<u>a</u>ny", "shoel<u>a</u>ce"], "a": 2, "exp": "<p><b>Giải thích</b>: <u>a</u>ny /ˈeni/ có “a” phát âm là /e/, các phương án khác có “a” phát âm là /eɪ/.</p><p><b>A</b>. sh<u>a</u>pe /ʃeɪp/<b>B.</b> p<u>a</u>per /ˈpeɪpə(r)/ <b>D</b>. shoel<u>a</u>ce /ˈʃuːleɪs/ </p>"}], "before": "<div class=\"note\">I- Choose the word that has the underlined part pronounced differently.</div>"}, {"id": "p2", "label": "II · Phân loại âm", "kind": "quiz", "items": [{"q": "spend", "opts": ["/e/", "/eɪ/"], "a": 0, "exp": "Đáp án: /e/"}, {"q": "better", "opts": ["/e/", "/eɪ/"], "a": 0, "exp": "Đáp án: /e/"}, {"q": "get", "opts": ["/e/", "/eɪ/"], "a": 0, "exp": "Đáp án: /e/"}, {"q": "temples", "opts": ["/e/", "/eɪ/"], "a": 0, "exp": "Đáp án: /e/"}, {"q": "express", "opts": ["/e/", "/eɪ/"], "a": 0, "exp": "Đáp án: /e/"}, {"q": "take", "opts": ["/e/", "/eɪ/"], "a": 1, "exp": "Đáp án: /eɪ/"}, {"q": "ways", "opts": ["/e/", "/eɪ/"], "a": 1, "exp": "Đáp án: /eɪ/"}, {"q": "longtail", "opts": ["/e/", "/eɪ/"], "a": 1, "exp": "Đáp án: /eɪ/"}, {"q": "Skytrain", "opts": ["/e/", "/eɪ/"], "a": 1, "exp": "Đáp án: /eɪ/"}, {"q": "way", "opts": ["/e/", "/eɪ/"], "a": 1, "exp": "Đáp án: /eɪ/"}, {"q": "famous", "opts": ["/e/", "/eɪ/"], "a": 1, "exp": "Đáp án: /eɪ/"}], "before": "<div class=\"note\">II - Find all the words with /e/ and /eɪ/ sounds in the passage to complete the table below.</div><div class=\"source\"><p><b>II - Find all the words with /e/ and /eɪ/ sounds in the passage to complete the table below.</b></p><p>Bangkok’s traffic can be a nightmare. Sure, you can easily take a taxi - if you want to spend hours stuck in traffic jams - but there are two much better ways to get around the city. To explore the temples and historical sites, catch an express boat river taxi or a longtail boat along the Chao Phraya river and the canals. For the modern part of the city, the Skytrain is a fast, cheap way to travel from the river to the shopping malls and nightlife of Sukhumvit, and the famous Chatuchak street market.</p></div>"}]}, {"title": "Grammar · Ngữ pháp", "icon": "🧩", "desc": "Unit 7 · Traffic", "subs": [{"label": "Lý thuyết", "html": "<div class=\"source\"><p><b>NGỮ PHÁP</b></p><p>Grammar</p><p><b>1. “IT” CHỈ KHOẢNG CÁCH. </b>(&quot;IT&quot; INDICATING DISTANCE)</p><p>Chúng ta thường dùng chủ ngữ “<b>it</b>” để nói về khoảng cách.</p><div class=\"tablewrap\"><table><tr><td><p><b>Cấu trúc</b></p></td><td><p><b>Ví dụ</b></p></td></tr><tr><td><p>• How far is <b>it</b> from A to B?</p><p>• <b>It </b>is (about) + number + kilometre(s)/ metre(s)/ mile(s).</p></td><td><p>• How far is <b>it</b> from the bus stop to your school? <i>(Khoảng cách từ trạm xe buýt đến trường bạn là bao xa?)</i></p><p>• <b>It</b> is about three kilometres. (<i>Khoảng ba cây số.)</i></p></td></tr><tr><td><p><b>It</b> is (about) + number + kilometre(s)/ metre(s)/ mile(s) + from A to B.</p></td><td><p><b>It</b> is about 500 metres from my house to the museum. (<i>Khoảng cách từ nhà tôi đến bảo tàng là khoảng 500 mét.)</i></p></td></tr></table></div><p><b>2. “USED TO” NÓI VỀ THÓI QUEN HOẶC TÌNH TRẠNG TRONG QUÁ KHỨ </b>(&quot;USED TO FOR PAST HABITS OR STATES)</p><p><b>a. Cách dùng</b></p><div class=\"tablewrap\"><table><tr><td><p>“Used to” được sử dụng khi nói về một thói quen hoặc tình trạng trong quá khứ mà đến nay không còn nữa.</p></td><td><p><b>Ví dụ:</b></p><p>When I was a child, I <b>used to eat</b> a lot of candies.</p><p>(<i>Khi tôi còn là một đứa trẻ, tôi đã từng ăn rất nhiều kẹo.)</i></p></td></tr></table></div><p><b>b. Cấu trúc</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Dạng khẳng định</b></p><p>(Affirmative form)</p></td><td><p><b>S + used to + bare-V</b></p></td><td><p>I <b>used to live</b> in Ho Chi Minh city.</p><p>(<i>Tôi đã từng sống ở Thành phố Hồ Chí</i> <i>Minh.)</i></p></td></tr><tr><td><p><b>Dạng phủ định</b></p><p>(Negative form)</p></td><td><p><b>S + did not + use to + bare-V</b></p><p>did not = didn’t</p></td><td><p>My brother <b>didn’t use to drink</b> coffee. <i>(Trước đây anh trai tôi không uống cà phê.)</i></p></td></tr><tr><td><p><b>Dạng nghi vấn</b></p><p>(Interrogative form)</p></td><td><p><b>Did + S + use to + bare-V?</b></p></td><td><p><b>Did they use to go</b> to that restaurant every weekend?</p><p>(<i>Có phải trước đây họ đã từng đến nhà hàng này vào mỗi cuối tuần không?)</i></p></td></tr><tr><td><p><b>Trả lời câu hỏi Có/</b></p><p><b>Không</b></p><p>(Yes/ No response)</p></td><td><p><b>Yes, S + did. </b></p><p><b>No, S + didn’t.</b></p></td><td><p>Yes, they did. (<i>Vâng, đúng vậy.)</i></p><p>No, they didn’t. (<i>Không, không phải vậy.)</i></p></td></tr></table></div><p><b></b></p></div>"}]}, {"title": "Grammar practice", "icon": "📝", "desc": "Unit 7 · Traffic", "subs": [{"id": "g1", "label": "I · Chọn đáp án", "kind": "quiz", "items": [{"q": "How___is it from Hanoi to Tokyo? - It’s about 3,700 kilometres. ", "opts": ["much", "long", "far", "old"], "a": 2, "exp": "<p><b>Giải thích</b>: Câu hỏi về khoảng cách bắt đầu bằng “How far”.</p><p><b>Dịch nghĩa</b>: How far is it from Hanoi to Tokyo? - It’s about 3,700 kilometres. (<i>Khoảng cách từ Hà Nội đến Tokyo là bao xa? - Khoảng 3,700km.)</i></p>"}, {"q": "Minh___a smart phone, but his father has just bought him a brand-new one this morning. ", "opts": ["used to have", "didn’t use to have c. use to have", "didn’t used to have"], "a": 1, "exp": "<p><b>Giải thích</b>: Dạng phủ định của cấu trúc diễn tả một thói quen hoặc trạng thái trong quá khứ là “S + didn’t use to + V (infinitive)”.</p><p><b>Dịch nghĩa</b>: Minh didn’t use to have a smart phone, but his father has just bought him a brand-new one this morning. (<i>Minh đã từng không dùng điện thoại thông minh nhưng bố của anh ấy mới mua cho anh ấy một chiếc mới toanh sáng nay.)</i></p>"}, {"q": "It’s only 3 kilometers___the company___my house. ", "opts": ["between - and", "of - and", "to – from", "from - to"], "a": 3, "exp": "<p><b>Giải thích:</b> Trong câu hỏi về khoảng cách, ta dùng giới từ “from... to ...” (từ... đến ...) trước hai địa điểm.</p><p><b>Dịch nghĩa</b>: It’s only 3 kilometres from the company to my house. <i>(Khoảng cách từ công ty đến nhà tôi chỉ có 3km.)</i></p>"}, {"q": "Did you___talk to Hung when he sat next to you in the class? ", "opts": ["use to", "used to", "use", "used to be"], "a": 0, "exp": "<p><b>Giải thích</b>: Dạng nghi vấn của cấu trúc diễn tả một thói quen hoặc trạng thái trong quá khứ là “Did + S + use to + V(infinitive)?”.</p><p><b>Dịch nghĩa</b>: Did you use to talk to Hung when he sat next to you in the class? (<i>Bạn có từng nói chuyện với Hùng khi cậu ấy ngồi cạnh bạn trong lớp không?)</i></p>"}, {"q": "When I was a child, I___afraid of ghosts. ", "opts": ["used to be", "used to", "use to be", "use to"], "a": 0, "exp": "<p><b>Giải thích</b>: Dạng khẳng định của cấu trúc diễn tả một thói quen hoặc trạng thái trong quá khứ là “S + used to + V (infinitive)”. Vì “afraid” là tính từ nên phải dùng “used to be”.</p><p><b>Dịch nghĩa</b>: When I was a child, I used to be afraid of ghosts. (<i>Khi tôi còn là một đứa trẻ, tôi đã từng sợ ma.)</i></p>"}, {"q": "My brother didn’t___ yoga before the doctor advised him to do so. ", "opts": ["used to do", "use to do", "used to. used to doing"], "a": 1, "exp": "<p><b>Giải thích</b>: Dạng phủ định của cấu trúc diễn tả một thói quen hoặc trạng thái trong quá khứ là “S + didn’t use to + V (infinitive)”.</p><p><b>Dịch nghĩa</b>: My brother didn’t use to do yoga before the doctor advised him to do so. (<i>Anh trai của tôi đã từng không tập yoga trước khi bác sĩ khuyên anh ấy làm như vậy.)</i></p>"}, {"q": "I___as a doctor in that hospital a couple of years ago, but I don’t work there now. ", "opts": ["am working", "will work", "work", "used to work"], "a": 3, "exp": "<p><b>Giải thích</b>: Dạng khẳng định của cấu trúc diễn tả một thói quen hoặc trạng thái trong quá khứ là “S + used to + V (infinitive)”.</p><p><b>Dịch nghĩa</b>: I used to work as a a doctor in that hospital a couple of years ago, but I don’t work there now. (<i>Tôi đã từng làm bác sĩ ở bệnh viện đó vài năm trước, nhưng bây giờ tôi không làm việc ở đó nữa.)</i></p>"}, {"q": "Did they___with their parents before they moved to this city? ", "opts": ["used to live", "used to lived", "use to live", "use to lived"], "a": 2, "exp": "<p><b>Giải thích</b>: Dạng nghỉ vấn của cấu trúc diễn tả một thói quen hoặc trạng thái trong quá khứ là “Did + S + use to + V (infinitive)?”.</p><p><b>Dịch nghĩa</b>: Did they use to live with their parents before they moved to this city? (<i>Họ có từng sống với bố mẹ trước khi chuyển đến thành phố này không?)</i></p>"}], "before": "<div class=\"note\">I - Choose the best option to complete each of the following sentences.</div>"}, {"id": "g2", "label": "II · Tìm lỗi sai", "kind": "quiz", "items": [{"q": "I <u>think</u> it is not very <u>far</u> <u>from</u> your house <u>and</u> Noi Bai International Airport. ", "opts": ["think", "far", "from", "and"], "a": 3, "exp": "<p><b>Giải thích</b>: Trong cấu trúc nói về khoảng cách, dùng cụm giới từ “from ... to” để diễn tả khoảng cách từ địa điểm này đến địa điểm kia.</p><p><b>Dịch nghĩa</b>: I think it is not far from your house to Noi Bai International Airport. <i>(Tôi nghĩ rằng từ nhà bạn đến Sân bay Quốc tế Nội Bài không xa lắm.)</i></p>"}, {"q": "How <u>long</u> is it <u>from</u> the bus stop <u>to</u> My Dinh stadium? - It’s <u>over</u> three kilometers. ", "opts": ["long", "from", "to", "over"], "a": 0, "exp": "<p><b>Giải thích</b>: Câu hỏi về khoảng cách bắt đầu bằng “How far”.</p><p><b>Dịch nghĩa</b>: How far is it from the bus stop to My Dinh stadium? - It’s over three kilometnes. (<i>Hơn 3 km.) (Từ bến xe buýt đến sân vận động Mỹ Đình là bao xa?)</i></p>"}, {"q": "Is it <u>far</u> <u>between</u> Keangnam Landmark Tower <u>to</u> Dong Xuan market? - It’s <u>over</u> 10 kilometres. ", "opts": ["far", "between", "to", "over"], "a": 1, "exp": "<p><b>Giải thích</b>: Trong cấu trúc nói về khoảng cách, dùng cụm giới từ “from ... to” để diễn tả khoảng cách từ địa điểm này đến địa điểm kia.</p><p><b>Dịch nghĩa</b>: Is it far from Keangnam Landmark Tower to Dong Xuan market? - I think it’s over 10 kilometres. (<i>Từ tòa nhà Keangnam Landmark đến chợ Đồng Xuân có xa không? - Tôi nghĩ là khoảng hơn 10km.)</i></p>"}, {"q": "It’s <u>about</u> 6 kilometers <u>from</u> my house <u>and</u> the railway station. I often go there <u>by</u> taxi. ", "opts": ["about", "from", "and", "by"], "a": 2, "exp": "<p><b>Giải thích</b>: Trong cấu trúc nói về khoảng cách, dùng cụm giới từ “from ... to” để diễn tả khoảng cách từ địa điểm này đến địa điểm kia.</p><p><b>Dịch nghĩa</b>: It’s about 6 kilometres from my house to the railway station. I often go there by taxi. (<i>Từ nhà tôi đến ga tàu là khoảng 6km. Tôi thường đi đến đó bằng taxi.)</i></p>"}, {"q": "How <u>far</u> <u>it is</u> <u>from</u> the outskirts of Hanoi <u>to</u> the shopping mall in the city centre? ", "opts": ["far", "it is", "from", "to"], "a": 1, "exp": "<p><b>Giải thích</b>: cấu trúc câu hỏi khoảng cách là “How far is it from ... to ...?”</p><p><b>Dịch nghĩa</b>: How far is it from the outskirts of Hanoi to the shopping mall in the city centre? (<i>Khoảng cách từ ngoại thành Hà Nội đến trung tâm mua sắm ở trung tâm thành phố là bao xa?)</i></p>"}, {"q": "<u>Let’s</u> take a walk. I’m <u>sure</u> that it’s not too <u>long</u> from the restaurant <u>to</u> the cinema. ", "opts": ["Let’s", "sure", "long", "to"], "a": 2, "exp": "<p><b>Giải thích</b>: Xét về nghĩa, khi đề cập đến khoảng cách từ đâu tới đâu, ta dùng từ “far”.</p><p><b>Dịch nghĩa</b>: Let’s take a walk. I’m sure that it’s not too far from the restaurant to the cinema. (<i>Chúng ta hãy đi bộ đi. Tớ chắc chắn đi từ nhà hàng đến rạp chiếu phim không quá xa.)</i></p>"}], "before": "<div class=\"note\">II - Choose the underlined part which needs correction.</div>"}, {"id": "g3", "label": "III · Viết câu", "kind": "write", "items": [{"c": "not very far/ aquarium/ night market.", "a": "It is not very far from the aquarium to the night market.", "vi": "  Giải thích : Khi nói về khoảng cách giữa 2 địa điểm ta dùng cấu trúc “It is (about)... from ... to ...”    Dịch nghĩa : Khoảng cách từ viện hải dương học đến chợ đêm là không quá xa. "}, {"c": "2 kilometers/ my house/ Ha Long Park.", "a": "It is 2 kilometres from my house to Ha Long Park.", "vi": "  Giải thích : Khi nói về khoảng cách giữa 2 địa điểm ta dùng cấu trúc “It is (about)... from ... to ...”   Dịch nghĩa: Khoảng cách từ nhà tôi đến Công viên Hạ Long là khoảng 2km. "}, {"c": "How far/Trang Tien Bridge/Thien Mu Pagoda?", "a": "How far is it from Trang Tien Bridge to Thien Mu Pagoda?", "vi": "  Giải thích : Khi hỏi về khoảng cách ta dùng cấu trúc “How far is it from ... to ...?”.   Dịch nghĩa : Khoảng cách từ cầu Tràng Tiền đến Chùa Thiên Mụ là bao xa? "}, {"c": "How far/ pet shop/ amusement park?", "a": "How far is it from the pet shop to the amusement park?", "vi": "  Giải thích : Khi hỏi về khoảng cách ta dùng cấu trúc “How far is it from ... to ...?”.    Dịch nghĩa : Khoảng cách từ cửa hàng thú cưng đến công viên giải trí là bao xa? "}, {"c": "17 kilometres/ your place/ city centre.", "a": "It’s 17 kilometres from your place to the city centre.", "vi": "  Giải thích : Khi nói về khoảng cách giữa 2 địa điểm ta dùng cấu trúc “It Is (about)... from ... to ...”    Dịch nghĩa : Từ chỗ của bạn đến trung tâm thành phố là 17km. "}, {"c": "140 thousand miles/ Earth/ Mars.", "a": "It is 140 thousand miles from the Earth to Mars?", "vi": "  Giải thích : Khi nói về khoảng cách giữa 2 địa điểm ta dùng cấu trúc “It is (about)... from ... to ...”    Dịch nghĩa : Khoảng cách từ Trái Đất đến Sao Hỏa là khoảng 140 nghìn dặm. "}, {"c": "How far/ cable car station/ Fansipan Summit?", "a": "How far is It from the cable car station to Fansipan Summit?", "vi": "  Giải thích : Khi hỏi về khoảng cách ta dùng cấu trúc “How far is it from ... to ...?”.   Dịch nghĩa : Khoảng cách từ trạm xe cáp treo đến đỉnh Fan-xi-păng là bao xa? "}, {"c": "300 metres/ super market/ railway station.", "a": "It is 300 metres from the super market to the railway station.", "vi": "  Giải thích : Khi nói về khoảng cách giữa 2 địa điểm ta dùng cấu trúc “It is (about)... from ... to ...”    Dịch nghĩa : Khoảng cách từ siêu thị đến ga tàu là 300m. "}], "before": "<div class=\"note\">III - Comptete each of the following sentences using the cues given. You can change the cues and use other words in addition to the cues to complete the sentences.</div>"}, {"id": "g4", "label": "IV · Khoảng cách", "kind": "write", "items": [{"c": "What is the distance between Ha Noi and Sa Pa?", "a": "How far is it from Hanoi to Sa Pa?", "vi": "  Giải thích : Khi hỏi về khoảng cách ta dùng cấu trúc “How far is it from ... to ...?”   Dịch nghĩa : Khoảng cách từ Hà Nội đến Sa Pa là bao xa? "}, {"c": "What is the distance between the toy store and the local market?", "a": "How far is it from the toy store to the local market?", "vi": "  Giải thích : Khi hỏi về khoảng cách ta dùng cấu trúc “How far is it from ... to ...?”    Dịch nghĩa : Từ cửa hàng đồ chơi đến chợ địa phương là bao xa? "}, {"c": "The distance between the cinema and the zoo is about 700 metres.", "a": "It is about 700 metres from the cinema to the zoo.", "vi": "  Giải thích : Khi nói về khoảng cách giữa 2 địa điểm ta dùng cấu trúc “It is (about)... from ... to ...”    Dịch nghĩa : Khoảng cách từ rạp chiếu phim đến sở thú là 700m. "}, {"c": "The distance between Paris and London is about 470 kilometres.", "a": "It is 470 kilometres from Paris to London.", "vi": "  Giải thích : Khi nói về khoảng cách giữa 2 địa điểm ta dùng cấu trúc “It is (about)... from ... to ...”   Dịch nghĩa : Từ Paris đến London là khoảng 470km. "}, {"c": "What is the distance between the National Conference Center and the hotel?", "a": "How far is it from National Conference Center to the hotel?", "vi": "  Giải thích : Khi hỏi về khoảng cách ta dùng cấu trúc “How far is it from ... to ...?”    Dịch nghĩa : Từ trung tâm hội nghị Quốc gia đến khách sạn là bao xa? "}, {"c": "What is the distance between the festival location and the car park?", "a": "How far is it from the festival location to the car park?", "vi": "  Giải thích:  Khi hỏi về khoảng cách ta dùng cấu trúc “How far is it from ... to ...?”.   Dịch nghĩa : Khoảng cách từ địa điểm lễ hội đến bãi gửi xe là bao xa? "}, {"c": "What is the distance between the bank and the post office?", "a": "How far is st from the bank to the post office?", "vi": "  Giải thích : Khi hỏi về khoảng cách ta dùng cấu trúc “How far is it from ... to ...?”.   Dịch nghĩa : Khoảng cách từ ngân hàng đồ chơi đến bưu điện là bao xa? "}, {"c": "The distance between my office and the hospital is not very far.", "a": "It is not very far from my office to the hospital.", "vi": "  Giải thích : Khi nói về khoảng cách giữa hai địa điểm ta dùng cấu trúc “It is (about)... from ... to ....”.   Dịch nghĩa : Khoảng cách từ văn phòng của tôi đến hiệu thuốc không xa lắm. "}, {"c": "The distance between my house and Hoan Kiem Lake is over 10 kilometres.", "a": "It is over 10 kilometres from my house to Hoan Kiem Lake.", "vi": "  Giải thích : Khi nói về khoảng cách giữa hai địa điểm ta dùng cấu trúc “It is (about)... from ... to ....”.   Dịch nghĩa : Khoảng cách từ nhà tôi đến Hồ Hoàn Kiếm là hơn 10km. "}, {"c": "The distance between Barcelona and Madrid is about 500 kilometres.", "a": "It’s about 500 kilometres from Barcelona to Madrid.", "vi": "  Giải thích : Khi nói về khoảng cách giữa hai địa điểm ta dùng cấu trúc “It is (about)... from ... to ....”.  Dịch nghĩa:  Khoảng cách từ Barcelona đến Madrid là khoảng 500km. "}], "before": "<div class=\"note\">IV - Rewrite the following sentences, using “it” to indicate distance.</div>"}, {"id": "g5", "label": "V · Used to", "kind": "write", "items": [{"c": "My father started smoking last year.", "a": "My father didn’t use to smoke.", "vi": "  Giải thích : cấu trúc “S + didn’t use to + V (infinitive)” dùng để diễn tả hành động đã không xảy ra trong quá khứ.    Dịch nghĩa : Bố tôi đã từng không hút thuốc. "}, {"c": "My sister stopped playing badminton after she had a traffic accident.", "a": "My sister used to play badminton before she had a traffic accident.", "vi": "  Giải thích : cấu trúc “S + used to + V (infinitive)” dùng để diễn tả thói quen, trạng thái trong quá khứ.   Dịch nghĩa:  Chị của tôi đã từng chơ! cầu lông trước khi chị ấy bị tai nạn giao thông. "}, {"c": "They started to go to the fitness centre after they gained weight.", "a": "They didn’t used to go to the fitness centre before they gained weight.", "vi": "  Giải thích : cấu trúc “S + didn’t use to + V (infinitive)” dùng để diễn tả hành động đã không xảy ra trong quá khứ.   Dịch nghĩa:  Họ đã từng không đến trung tâm thể hình trước khi họ tăng cân. "}, {"c": "When I was young, I believed in magic.", "a": "When I was young, I used to believe in magic.", "vi": "  Giải thích : cấu trúc “S + used to + V (infinitive)” dùng để diễn tả thói quen, trạng thái trong quá khứ.   Dịch nghĩa : Khi tôi còn nhỏ, tôi đã từng tin vào phép thuật. "}, {"c": "Did you walk to school when you lived with your grandparents?", "a": "Did you use to walk to school when you lived with your grandparents?", "vi": "  Giải thích : cấu trúc “Did + S + use to + V (infinitive)?” dùng để hỏi về một hành động có từng xảy ra trong quá khứ hay không.   Dịch nghĩa : Bạn có từng đi bộ đến trường khi bạn sống với ông bà không? "}, {"c": "She was very nervous before every geography exam.", "a": "She used to be very nervous before every geography exam.", "vi": "  Giải thích : cấu trúc “S + used to + V (infinitive)” dùng để diễn tả thói quen, trạng thái trong quá khứ.  Dịch nghĩa : Cô ấy đã từng rất lo lắng trước mọi bài thi môn Địa lý. "}, {"c": "When he was a little boy, he dreamed of being a superman.", "a": "When he was a little boy, he used to dream of being a superman.", "vi": "  Giải thích : cấu trúc “S + used to + V (infinitive)” dùng để diễn tả thói quen, trạng thái trong quá khứ.   Dịch nghĩa : Khi anh ấy còn nhỏ, anh ấy từng mơ làm siêu nhân. "}, {"c": "She is not able to dance as well as she did in the past.", "a": "She used to dance very well.", "vi": "  Giải thích : cấu trúc “S + used to + V (infinitive)” dùng để diễn tả thói quen, trạng thái trong quá khứ.   Dịch nghĩa : Cô ấy đã từng nhảy rất giỏi. "}, {"c": "Did you go to the English for Kids Club when you were at primary school?", "a": "Did you use to go to the English for Kids Club when you were at primary school?", "vi": "  Giải thích : cấu trúc “Did + S + use to + V (infinitive)?” dùng để hỏi về một hành động có từng xảy ra trong quá khứ hay không.   Dịch nghĩa : Bạn có từng đến Câu lạc bộ Tiếng anh Trẻ em khi bạn học tiểu học không? "}, {"c": "My sister did not have long hair when she was a teenager.", "a": "My sister didn’t use to have long hair when she was a teenager.", "vi": "  Giải thích:  cấu trúc “S + didn’t use to + V (infinitive)” dùng để diễn tả hành động đã không xảy ra trong quá khứ.   Dịch nghĩa : Chị gái của tôi không để tóc dài khi chị ấy còn niên thiếu. "}], "before": "<div class=\"note\">V - Rewrite each sentence using ‘used to’ so that the new sentence has a similar meaning to the orig inal one.</div>"}]}, {"title": "Reading · Đọc hiểu", "icon": "📖", "desc": "Unit 7 · Traffic", "subs": [{"label": "Do you know?", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p><b>DO YOU KNOW?</b></p><p><b>STRANGE TRAFFIC LAWS FROM AROUND THE WORLD</b></p><p>•It’s illegal to eat or drink while driving in Cyprus.</p><p>•In South Africa, animals have the same right to the roads as motorists do. Drivers face heavy fines of up to $500 if they do not slow or stop for passing livestock.</p><p>•Road safety officials in Denmark have made it a legal requirement for drivers to check for children hiding beneath the vehicle before starting the engine.</p><p>•In Moscow, it’s all about cleanliness - police impose fines on anyone with a dirty car.</p><p>•In Jasper Gates, Canada, a dumb law forbids drivers from going faster than a horse or carriage</p></td></tr></table></div></div>"}, {"id": "r1", "label": "I · Bus journeys", "kind": "quiz", "items": [{"q": "What is the main idea of the passage? ", "opts": ["Buses in the UK are very convenient.", "Bus journeys are different in the UK and in Latin America.", "Bus journeys in the UK are boring.", "Films are shown on long-distance buses in Latin America."], "a": 1, "exp": "<p><b>Dịch nghĩa</b>: Ý chính của cả bài văn là gì?</p><p><b>A</b>.Xe bus ở Vương quốc Anh rất tiện lợi.</p><p><b>B</b>.Những chuyến đi bằng xe buýt khác nhau ở Vương quốc Anh và Mỹ Latinh.</p><p><b>C</b>. Hành trình xe buýt ở Vương quốc Anh rất tẻ nhạt.</p><p><b>D</b>. Phim được chiếu trên xe buýt đường dài ở Mỹ Latinh.</p><p><b>Giải thích</b>: Các đoạn văn trong bài làm rõ sự khác biệt giữa việc đi xe buýt ở Vương quốc Anh và Mỹ Latin. Các phương án khác chỉ là những ý nhỏ trong bài.</p>"}, {"q": "Public transport in the UK is convenient because you can avoid___. ", "opts": ["traffic accidents", "policemen", "traffic jams", "bus lanes"], "a": 2, "exp": "<p><b>Dịch nghĩa</b>: Phương tiện di chuyển công cộng ở Vương quốc Anh thuận tiện vì bạn có thể tránh được________.</p><p><b>A</b>. tai nạn giao thông <b>B</b>. cảnh sát<b>C</b>. tắc đường<b>D</b>. làn đường cho xe buýt</p><p><b>Giải thích</b>: Thông tin tìm thấy ở dòng thứ 2-3 “[...] as you can avoid traffic jams by moving very quickly in the bus lanes [...]”</p>"}, {"q": "The word “tedious” in line 3 means___. ", "opts": ["not interesting", "exciting", "wonderful", "important"], "a": 0, "exp": "<p><b>Dịch nghĩa</b>: Từ “tedious” ở dòng thứ 3 có nghĩa là:</p><p><b>A</b>. không thú vị<b>B</b>. hào hứng<b>C.</b> tuyệt vời<b>D</b>. quan trọng</p><p><b>Giải thích</b>: Dựa vào ngữ cảnh trong đoạn văn thứ nhất và thông tin ở dòng 4-5 “[...] taking the bus is just a necessary and tedious part of life: you board the bus, pay the driver and sit down or find a place to stand. Very boring.” thì đáp án A phù hợp nhất về mặt nghĩa.</p>"}, {"q": "The phrasal verb “put on” in the first sentence of the second paragraph can be replaced with “___”. ", "opts": ["close", "wear", "play", "open"], "a": 2, "exp": "<p>Dịch nghĩa: Cụm động từ “put on” ở dòng đầu tiên trong đoạn văn thứ hai có thể được thay thế bằng “_________”.</p><p><b>A</b>. đóng<b>B</b>. mặc<b>C.</b> chơi<b>D</b>. mở</p><p><b>Giải thích</b>: Xét về mặt nghĩa, đáp án C phù hợp nhất.</p>"}, {"q": "Which of the following statements is NOT MENTIONED about bus journeys in Latin America? ", "opts": ["Passengers can entertain during their trip by watching films.", "Drivers play new styles of music on the radio.", "They are more exciting than bus trips in the UK.", "They are more expensive than bus trips in the UK."], "a": 3, "exp": "<p><b>Dịch nghĩa</b>: Khẳng định nào sau đây KHÔNG ĐƯỢC ĐỀ CẬP ĐẾN về các chuyến đi bằng xe buýt ở Mỹ Latinh?</p><p><b>A</b>.Hành khách có thể giải trí trong hành trình của họ bằng việc xem phim.</p><p><b>B</b>.Những người tài xế bật các bài hát có phong cách nhạc mới trên đài phát thanh.</p><p><b>C</b>. Chúng thú vị hơn những chuyến xe bus ở Vương quốc Anh.</p><p><b>D</b>. Chúng đắt hơn những chuyến xe bus ở Vương quốc Anh.</p><p><b>Giải thích</b>: Đáp án A tìm thấy ở dòng thứ 5-6 “[...] you have entertainment for at least some of the journey, đáp án B tìm thấy ở dòng thứ 7-8 “[...] but drivers usually switch on the radio and that can be a great way to hear new songs and new styles of music. “, đáp án c tìm thấy ở dòng thứ 9 “[...] it is much more exciting than any UK bus journey. “, chỉ có đáp án D là không có trong bài.</p>"}], "before": "<div class=\"source\"><p><b>I- Read the passage and choose the best option to answer each of the following questions.</b></p><p>In the UK, bus journeys are just boring and simply a necessity. This public means of transportation is often convenient when you live or work in the city centre, as you can avoid traffic jams by moving very quickly in the bus lanes, and do not have to pay to park the car. After all, though, taking the bus is just a necessary and <b>tedious</b> part of life: you board the bus, pay the driver and sit down or find a place to stand. Very boring.</p><p>In Latin America, however, bus trips can be very lively. For a start, long-distance buses <b>put on</b> films so that you have entertainment for at least some of the journey. Naturally, local transport does not show films but drivers usually switch on the radio and that can be a great way to hear new songs and new styles of music. Therefore, taking the bus doesn’t sound like fun but it is much more exciting than any UK bus journey.</p><p><i>(British Council) </i></p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p>Ở Anh, những chuyến đi bằng xe buýt nhàm chán và đơn giản chỉ ỉà một nhu cầu thiết yếu. Phương tiện di chuyển công cộng này thường thuận tiện khi bạn sống hoặc làm việc trong trung tâm thành phố, vì bạn có thể tránh ùn tắc giao thông bằng cách di chuyển rất nhanh trong làn đường dành riêng cho xe buýt và không phải trả tiền để đỗ xe. Tuy nhiên, cuối cùng thì đi xe buýt chỉ là một phần cần thiết và tẻ nhạt của cuộc sống: bạn lên xe buýt, trả tiền cho tài xế và ngồi xuống hoặc tìm một chỗ đứng. Rất nhàm chán.</p><p>Tuy nhiên, ở Mỹ Latinh, các chuyến xe buýt có thể rất sống động. Khi bắt đầu, xe buýt đường dài phát các bộ phim để bạn ít nhất có thể giải trí phần nào đó trong suốt hành trình. Đương nhiên, xe buýt địa phương không chiếu phim nhưng tài xế thường bật đài và đó có thể là một cách tuyệt vời để nghe các bài hát mới và phong cách âm nhạc mới. Do đó, đi xe buýt tuy không hẳn là vui nhưng nó thú vị hơn nhiều so với bất kỳ hành trình xe buýt nào ở Anh.</p></div></details>"}, {"id": "r2", "label": "II · Traffic jams", "kind": "quiz", "items": [{"q": "What is the passage mainly about? ", "opts": ["the causes of traffic jams in Viet Nam", "the effects of traffic jams in Viet Nam", "the reality of traffic jams in Viet Nam", "the solutions to reduce traffic jams in Viet Nam"], "a": 2, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Bài văn chủ yếu nói về điều gì?</p><p><b>A</b>.nguyên nhân gây ùn tắc giao thông ở Việt Nam</p><p><b>B</b>.ảnh hưởng của ùn tắc giao thông ở Việt Nam</p><p><b>C</b>. thực trạng ùn tắc giao thông ở Việt Nam</p><p><b>D</b>. các giải pháp giảm ùn tắc giao thông ở Việt Nam</p><p><b>Giải thích</b>: Các đoạn văn trong bài nói về thực trạng ùn tắc giao thông ở Việt Nam, bao gồm địa điểm, thời điểm thường xảy ra ùn tắc giao thông và cách mọi người phản ứng với nó.</p>"}, {"q": "When is traffic congestion in Viet Nam the worst? ", "opts": ["when everyone goes to work", "between 9 a.m. to 10 a.m.", "between 3 p.m. to 4 p.m.", "at the weekend"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Giao thông ở Việt Nam tắc nghẽn nhất khi nào?</p><p><b>A</b>. khi mọi người đi làm<b>B</b>. từ 9 giờ sáng đến 10 giờ sáng</p><p><b>C</b>. từ 3 giờ chiều đến 4 giờ chiều<b>D</b>. vào cuối tuần</p><p><b>Giải thích</b>: Thông tin ở câu 2 đoạn 2: “But it is worst during the rush hour when everyone is in a hurry to get to work or come back home.”</p>"}, {"q": "It’s difficult to catch a___during the downpour. ", "opts": ["bus", "taxi", "train", "motorbike"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Rất khó để bắt__________khi trời đang mưa như trút.</p><p><b>A</b>. xe buýt<b>B</b>. xe tắc xi<b>C</b>. tàu<b>D</b>. xe máy</p><p><b>Giải thích</b>: Thông tin ở câu cuối đoạn 2: “Taxis are extremely hard to catch or wave during the downpour.”</p>"}], "before": "<div class=\"source\"><p><b>II - Read the passage and do the tasks below.</b></p><p>Traffic jams in Viet Nam frequently take place in big cities, such as Ha Noi and Ho Chi Minh City.</p><p>There is no fixed rule for the time a traffic jam to happen. But It is worst during the rush hour when everyone is in a hurry to get to work or come back home. Apart from peak hours, the time between 9 a.m. to 10 a.m. and between 3 p.m. to 4 p.m. also witnesses long lines of vehicles, mainly motorbikes. When it rains, the traffic jam gets more terrible. Taxis are extremely hard to catch or wave during the downpour.</p><p>However, the most annoying thing about the traffic jam is the way people react to it. Most road users ride their motorbikes on the pavement rather than waiting calmly. Moreover, they constantly use their horns to hasten riders in the front, even shouting at them from time to time.</p><p><b>Part 1: Choose the best answer to each of the following questions.</b></p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p>Ở Việt Nam, ùn tắc giao thông thường xảy ra ở các thành phố lớn, như Hà Nội và Thành phố Hồ Chí Minh.</p><p>Không có quy tắc cố định nào về thời gian xảy ra ùn tắc giao thông. Nhưng tắc nhất là vào giờ cao điểm khi mọi người đang vội vã đi làm hoặc trở về nhà. Ngoài giờ cao điểm, thời gian từ 9 giờ sáng đến 10 giờ sáng và từ 3 giờ chiều đến 4 giờ chiều cũng chứng kiến những hàng dài xe cộ, chủ yếu là xe máy. Khi trời mưa, tắc đường trở nên khủng khiếp hơn. Thật khó để bắt hoặc vẫy xe tắc xi trong khi trời đang mưa như trút nước.</p><p>Tuy nhiên, điều khó chịu nhất về ùn tắc giao thông là cách mọi người phản ứng lại với nó. Hầu hết những người điều khiển xe máy đều đi xe lên vỉa hè thay vì bình tĩnh chờ đợi. Hơn nữa, họ liên tục bấm còi xe để giục những người ở phía trước mình đi nhanh lên, thậm chí đôi khi còn hét vào mặt họ.</p></div></details>"}, {"id": "r3", "label": "II · Đúng / sai", "kind": "quiz", "items": [{"q": "There is a certain time for traffic congestion in Viet Nam.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Có thời gian cố định xảy ra tắc nghẽn giao thông ở Việt Nam.</p><p><b>Giải thích</b>: Thông tin ở câu đầu đoạn 2: “There is no fixed rule for the time a traffic jam to happen.”</p>"}, {"q": "The traffic jam becomes more serious when it rains.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Sự ùn tắc giao thông trở nên nghiêm trọng hơn khi trời mưa.</p><p><b>Giải thích</b>: Thông tin ở câu 4 đoạn 2: “When it rains, the traffic jam gets more terrible.”</p>"}, {"q": "To get through a traffic jam, road users usually break traffic rules.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi:</b> Để thoát ra khỏi điểm tắc nghẽn, người tham gia giao thông thường vi phạm luật lệ giao thông.</p><p><b>Giải thích</b>: Thông tin ở câu 2 đoạn 3: “Most road users ride their motorbikes on the pavement rather than waiting calmly.” Việc những người điều khiển xe máy đi xe lên vỉa hè khi tắc đường là vi phạm luật giao thông. </p>"}], "before": "<div class=\"source\"><p>Traffic jams in Viet Nam frequently take place in big cities, such as Ha Noi and Ho Chi Minh City.</p><p>There is no fixed rule for the time a traffic jam to happen. But It is worst during the rush hour when everyone is in a hurry to get to work or come back home. Apart from peak hours, the time between 9 a.m. to 10 a.m. and between 3 p.m. to 4 p.m. also witnesses long lines of vehicles, mainly motorbikes. When it rains, the traffic jam gets more terrible. Taxis are extremely hard to catch or wave during the downpour.</p><p>However, the most annoying thing about the traffic jam is the way people react to it. Most road users ride their motorbikes on the pavement rather than waiting calmly. Moreover, they constantly use their horns to hasten riders in the front, even shouting at them from time to time.</p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p>Ở Việt Nam, ùn tắc giao thông thường xảy ra ở các thành phố lớn, như Hà Nội và Thành phố Hồ Chí Minh.</p><p>Không có quy tắc cố định nào về thời gian xảy ra ùn tắc giao thông. Nhưng tắc nhất là vào giờ cao điểm khi mọi người đang vội vã đi làm hoặc trở về nhà. Ngoài giờ cao điểm, thời gian từ 9 giờ sáng đến 10 giờ sáng và từ 3 giờ chiều đến 4 giờ chiều cũng chứng kiến những hàng dài xe cộ, chủ yếu là xe máy. Khi trời mưa, tắc đường trở nên khủng khiếp hơn. Thật khó để bắt hoặc vẫy xe tắc xi trong khi trời đang mưa như trút nước.</p><p>Tuy nhiên, điều khó chịu nhất về ùn tắc giao thông là cách mọi người phản ứng lại với nó. Hầu hết những người điều khiển xe máy đều đi xe lên vỉa hè thay vì bình tĩnh chờ đợi. Hơn nữa, họ liên tục bấm còi xe để giục những người ở phía trước mình đi nhanh lên, thậm chí đôi khi còn hét vào mặt họ.</p></div></details>"}]}, {"title": "Listening · Nghe", "icon": "🔊", "desc": "Unit 7 · Traffic", "subs": [{"id": "l1", "label": "Nghe & làm bài", "kind": "quiz", "items": [{"q": "Transportation has changed a lot in the past 100 years.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Giao thông vận tải đã thay đổi nhiều trong 100 năm qua.</p><p><b>Giải thích</b>: Thông tin tìm thấy ở câu đầu tiên “Transportation hasn’t really changed a lot in the past 100 years.</p>"}, {"q": "Airplanes are now faster than in the past.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Máy bay bây giờ nhanh hơn trong quá khứ.</p><p><b>Giải thích</b>: Thông tin tìm thấy ở câu thứ 3 “OK, cars, trains and airplanes are faster, but they’re not so different than they were 50 years ago.”</p>"}, {"q": "Air travel has got worse.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu</b> hỏi: Di chuyển bằng đường hàng không đã trở nên tệ hơn.</p><p><b>Giải thích</b>: Thông tin tìm thấy ở câu thứ 5 ì think air travel has got worse.”</p>"}, {"q": "The cars from fifty years ago looked uglier than today’s ones.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Xe ô tô từ 50 năm trước xấu hơn xe ô tô bây giờ.</p><p><b>Giải thích</b>: Thông tin tìm thấy ở câu thứ 8 “The cars from fifty years ago look nicer than today’s ones.”</p>"}, {"q": "Cars in the past also used petrol.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Xe ô tô trong quá khứ cũng sử dụng xăng.</p><p><b>Giải thích</b>: Thông tin tìm thấy ở câu thứ 9 “They still had four wheels, used petrol and had a steering wheel”. </p>"}], "before": "<div class=\"note\">Giọng đọc tổng hợp từ lời thoại trong tài liệu.</div><button class=\"btn solid\" onclick=\"say(LISTEN)\">▶ Nghe</button> <button class=\"btn\" onclick=\"speechSynthesis.cancel()\">■ Dừng</button>"}, {"label": "Lời thoại & bản dịch", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p>Transportation hasn&#x27;t really changed a lot in the past 100 years. When you think about changes in other areas of our life, transportation is pretty much the same as it was years ago.</p><p>OK, cars, trains and airplanes are fast, but they&#x27;re not so different than they were 50 years ago. Take airplanes, for example. I think air travel has got worse. Fifty years ago, people flew and were given great service.</p><p>Today, you are like sardines in a can. And look at cars. The cars from fifty years ago looked nicer than today&#x27;s ones. They still had four wheels, used petrol and had a steering wheel. I think transportation will really only change when it becomes more personal. I&#x27;m waiting for my own mini copter.</p></td><td><p>Giao thông vận tải không thực sự thay đổi nhiều trong 100 năm qua. Khi bạn nghĩ về những thay đổi ở các lĩnh vực khác trong cuộc sống của chúng ta, giao thông vận tải vẫn gần giống như những năm trước đây.</p><p>Tốt thôi, ô tô, xe lửa và máy bay nhanh hơn, nhưng chúng không quá khác biệt so với 50 năm trước. Ví dụ như đi máy bay. Tôi nghĩ du lịch hàng không đã trở nên tệ hơn. Năm mươi năm trước, mọi người đã bay và được cung cấp dịch vụ tuyệt vời.</p><p>Giờ đây, bạn giống như cá mòi trong một cái hộp. Và hãy nhìn vào xe ô tô. Những chiếc xe từ năm mươi năm trước trông đẹp hơn những chiếc xe ngày nay. Chúng vẫn có bốn bánh, sử dụng xăng và có tay lái. Tôi nghĩ rằng giao thông vận tải sẽ thực sự thay đổi khi nó mang tính cá nhân hơn. Tôi đang chờ đợi bộ máy bay phản lực mini của riêng mình</p></td></tr></table></div></div>"}]}, {"title": "Speaking · Nói", "icon": "💬", "desc": "Unit 7 · Traffic", "subs": [{"label": "Đề bài & hướng dẫn", "html": "<div class=\"source\"><p><b>Talk about your favorite means of transportation</b></p><p>You can use the following questions as cues:</p><p>• What is your favourite means of transportation?</p><p>• How often do you use it?</p><p>• Where do you usually go?</p><p>• Why do you like it?</p><p><b>Useful languages:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Useful vocabulary</b></p></td><td><p><b>Useful structures</b></p></td></tr><tr><td><p>•bicycle</p><p>• car</p><p>• helicopter</p><p>•boat</p><p>•convenient</p><p>•cheap</p><p>•safe</p><p>•environmentally friendly</p><p>•healthy</p></td><td><p>•My favourite means of transportation is ...</p><p>• ... is my favourite means of transportation.</p><p>• I ride a bike/ sail on a boat/ fly every day/  every weekend ...</p><p>• I ride a bike/ sail on a boat/ fly to ...</p><p>• I really like this vehicle because ....</p><p>•I love this vehicle because of its + N</p></td></tr></table></div><p><b>Complete the notes:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Structures of the talk</b></p></td><td><p><b>Your notes</b></p></td></tr><tr><td><p>What is your favourite means of transportation?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>How often do you use it?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>Where do you usually go?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>Why do you like it?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr></table></div><p><b>Now you try!</b></p><p><b>Give your answer using the following cues. You should speak for 1-2 minutes.</b></p><p>1. My favourite means of transportation is ...</p><p>2. I ride a bike/ sail on a boat/ fly by plane ...</p><p>3. I ride a bike/ sail on a boat/ fly by plane to ...</p><p>4. I really like this vehicle because ....</p><p><b>Now you tick!</b></p><p><b>Did you ...</b></p><p> answer all the questions in the task?</p><p> give some details to each main point?</p><p> speak slowly and fluently with only some hesitation?</p><p> use vocabulary wide enough to talk about the topic?</p><p> use various sentence structures (simple, compound, complex) accurately?</p><p> pronounce correctly (vowels, consonants, stress, intonation)?</p><p><b> </b><b>Let’s compare!</b></p><p>Finally, compare with the sample answer on page 138.</p></div>"}, {"label": "Ghi chú luyện nói", "kind": "notes"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>Talk about your favorite means of transportation. </b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Nói về phương tiện đi lại yêu thích của bạn.</p><p>Bạn có thể sử dụng các câu hỏi sau đây làm gợi ý:</p><p>• Phương tiện đi lại yêu thích của bạn là gì?</p><p>• Bạn sử dụng nó thường xuyên như thế nào?</p><p>• Bạn sử dụng nó để đi những nơi nào?</p><p>• Tại sao bạn thích nó?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Vehicle (Phương tiện)</b></p><p>- bicycle (<i>n</i>.) (xe đạp)</p><p>- car (<i>n</i>.) (ô tô)</p><p>- plane (<i>n</i>.) (máy bay)</p><p>- train (<i>n</i>.) (tàu)</p><p><b>Frequency (Tần suất)</b></p><p>- almost everyday <i>(adv.</i>) (mỗi ngày)</p><p>- twice a week (<i>adv</i>.) (hai lần một tuần)</p><p>- quite often (<i>adv.)</i> (khá thường xuyên)</p><p>- sometimes (<i>adv.</i>) (thỉnh thoảng)</p><p><b>Purposes (Mục đích)</b></p><p>- go to school (<i>v. phr</i>.) (đi học)</p><p>- travel (<i>v. phr</i>.) (đi du lịch)</p><p>- go out (<i>v. phr</i>.) (đi chơi)</p><p>- visit friends (<i>v. phr.)</i> (thăm bạn)</p><p><b>Reasons (Lí do)</b></p><p>- cheap and convenient (<i>adj. phr</i>.) (rẻ và thuận tiện)</p><p>- environmentally friendly (<i>adj. phr</i>.) (thân thiện với môi trường)</p><p>- good for health <i>(adj.phr</i>.) (tốt cho sức khỏe)</p><p>- fast and safe (<i>adj. phr</i>.) (nhanh và an toàn)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>A bicycle is my favourite means of transportation. It is not too far from my house to my school, so I ride my bicycle almost every day to go there. Sometimes, I also ride my bike to visit my friends at weekends.</p><p>I like the bicycle for several reasons. It helps me avoid crowded buses in the morning. Besides, riding a bike is good for health because it’s like doing physical exercise. And finally, I think a bicycle is the most environmentally friendly means of transportation.</p></td><td><p>Xe đạp là phương tiện đi lại yêu thích của tôi. Khoảng cách từ nhà tôi đến trường học không xa lắm, vì vậy tôi đạp xe đến trường hầu như mỗi ngày. Thỉnh thoảng tôi còn đi xe đạp để đến thăm bạn tôi vào cuối tuần.</p><p>Tôi thích xe đạp vì một vài lí do. Nó giúp tôi tránh được những chiếc xe buýt đông đúc vào buổi sáng. Bên cạnh đó, đạp xe tốt cho sức khỏe bởi vì nó giống như những bài tập thể dục. Và cuối cùng, tôi nghĩ rằng xe đạp là phương tiện thân thiện với môi trường nhất.</p></td></tr></table></div></div>"}]}, {"title": "Writing · Viết", "icon": "✍️", "desc": "Unit 7 · Traffic", "subs": [{"id": "w1", "label": "I · Viết câu", "kind": "write", "items": [{"c": "have/ trip/ hometown/ brother/ two days ago.", "a": "I had a trip to my hometown with my brother two days ago.", "vi": "  Dịch nghĩa : Tôi đã có một chuyến đi về quê cùng với em trai của tôi hai ngày trước. "}, {"c": "15 kilometres/ my place/ my hometown.", "a": "It is 15 kilometres from my place to my hometown.", "vi": "  Dịch nghĩa : Khoảng cách từ nơi tôi ở đến quê hương tôi là 15km. "}, {"c": "go/ there/ train/ and/ it/ comfortable.", "a": "We went there by train and it was very comfortable.", "vi": "  Dịch nghĩa:  Chúng tôi đã đi đến đó bằng tàu và nó rất thoải mái. "}, {"c": "there/ a lot of/ vehicles/ road.", "a": "There were a lot of vehicles on the road.", "vi": "  Dịch nghĩa : Đã có rất nhiều phương tiện giao thông trên đường. "}, {"c": "trip/ exciting/ meaningful.", "a": "The trip was very exciting and meaningful.", "vi": "  Dịch nghĩa:  Chuyến đi đó rất là thú vị và ý nghĩa. "}], "before": ""}, {"label": "II · Viết đoạn văn", "kind": "writing", "html": "<div class=\"source\"><p><b>II- Write a short paragraph (60-80 words) describing a trip to your hometown</b>.</p><p>You can answer some of the following questions:</p><p>• Where is your hometown?</p><p>• How did you get there?</p><p>• Who did you go with?</p><p>• How was the traffic?</p></div>"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>II - Write a short paragraph (60-80 words) describing a trip to your hometown.</b></p><p>Viết một đoạn văn ngắn (60-80 từ) miêu tả một chuyến đi về quê của bạn.</p><p>Bạn có thể sử dụng các câu hỏi sau đây làm gợi ý:</p><p>• Quê hương bạn ở đâu?</p><p>• Bạn đã đến đó bằng phương tiện gì?</p><p>• Ai đã đi cùng bạn?</p><p>• Tình hình giao thông ở đó thế nào?</p><p>• Bạn có thích chuyến đi đó không?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Vehicle (Phương tiện)</b></p><p>- coach (<i>n</i>.) (xe khách đường dài)</p><p>- car (<i>n</i>.) (xe ô tô)</p><p>- train (<i>n</i>.) (tàu)</p><p>- plane (<i>n</i>.) (máy bay)</p><p><b>Location (Địa điểm)</b></p><p>- in the countryside (<i>prep. phr</i>.) (ở vùng nông thôn)</p><p>- in the mountainous area (<i>prep. phr</i>.) (ở vùng núi)</p><p>- near the beach <i>(prep. Phr</i>.) (gần biển)</p><p>- in the island (<i>prep. Phr</i>.) (ở đảo)</p><p><b>People (Người)</b></p><p>- parents (<i>n</i>.) (bố mẹ)</p><p>- alone (<i>n</i>.) (một mình)</p><p>- siblings (<i>n</i>.) (anh chị em)</p><p>- family (<i>n</i>.) (gia đình)</p><p><b>Traffic (Giao thông)</b></p><p>- a lot of vehicles (<i>n. phr</i>.) (rất nhiều phương tiện)</p><p>- traffic jams (<i>n. phr</i>.) (ùn tắc giao thông)</p><p>- few vehicles <i>(n. phr</i>.) (ít phương tiện)</p><p>- accidents (<i>n. phr</i>.) (tai nạn)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>Last month, I had a trip to my hometown with my family. My hometown is in Ha Long, a beautiful city near the beach. It is about 200 kilometres from Hanoi to my hometown. We went there by car. We set off very early in the morning; therefore, we were not stuck in a traffic jam. We talked to each other a lot and looked forward to seeing our grandparents. It was such a happy and exciting trip of my family.</p></td><td><p>Tháng trước, tôi đã có một chuyến về thăm quê hương cùng với gia đình thôi. Quê hương tôi ở Hạ Long, một thành phố xinh đẹp ở gần biển. Từ Hà Nội đến quê tôi là khoảng 200km. Chúng tôi đi bằng xe của gia đình. Chúng tôi bắt đầu đi từ sáng sớm nên không bị tắc đường. Chúng tôi nói chuyện với nhau rất nhiều trên chuyến đi và rất háo hức mong gặp lại ông bà. Đó thực sự là một chuyến đi vui vẻ của gia đình tôi.</p></td></tr></table></div></div>"}]}, {"title": "Objectives · Mục tiêu", "icon": "🎯", "desc": "Unit 7 · Traffic", "subs": [{"label": "Mục tiêu", "html": "<div class=\"source\"><p><b></b></p><p><b>UNIT </b><b>7</b><b> </b></p><p><b>TRAFFIC</b></p><p>Giao thông</p><p><b>MỤC TIÊU – Objectives</b></p><p>* <b>TỪ VỰNG</b> – Vocabulary</p><p>sử dụng từ vựng liên quan đến phương tiện giao thông và luật giao thông</p><p>* <b>NGỮ ÂM</b> – Pronunciation</p><p>phát âm chính xác nguyên âm đơn /<b>e</b>/ và nguyên âm đôi /<b>eɪ</b>/</p><p>* <b>NGỮ PHÁP</b> – Grammar</p><p>chủ ngữ “<b>i</b><b>t</b>” chỉ khoảng cách</p><p>sử dụng “<b>used </b><b>to</b>” để nói về thói quen hoặc tình trạng trong quá khứ</p><p><b>* KỸ NĂNG ĐỌC</b> – Reading skills</p><p>đọc tìm thông tin cụ thể về luật giao thông</p><p>* <b>KỸ NĂNG NÓI</b> – Speaking skills</p><p>thảo luận về việc chấp hành luật lệ giao thông và cách bảo vệ an toàn khi tham gia giao thông</p><p>* <b>KỸ NĂNG NGHE</b> – Listening Skills</p><p>nghe để lấy thông tin về các vấn đề giao thông ở những thành phố lớn</p><p>* <b>KỸ NĂNG VIẾT</b> – Writing skills</p><p>viết một đoạn văn để cung cấp thông tin về các vấn đề giao thông trong một thành phố hay khu vực </p><p><b>A – NGÔN NGỮ</b></p></div>"}]}];
const V12=[{"w": "boat", "p": "/bəʊt/", "pos": "n.", "vi": "con thuyền", "ex": "The fishing boats go out to the sea early in the morning. (Đoàn thuyền đánh cá ra khơi lúc sáng sớm)"}, {"w": "circle", "p": "/ˈsɜːkl/", "pos": "n.", "vi": "vòng tròn", "ex": "Anna is drawing circles with her crayons. (Anna đang vẽ những hình tròn bằng sáp màu của em ấy)"}, {"w": "fly", "p": "/flaɪ/", "pos": "v.", "vi": "lái máy bay, đi trên máy bay", "ex": "Her brother is going to fly to London to attend her graduation. (Anh trai cô ấy sẽ bay đến Luân Đôn để tham dự lễ tốt nghiệp của cô ấy)"}, {"w": "helicopter", "p": "/ˈhelɪkɒptə(r)/", "pos": "n.", "vi": "máy bay trực thăng", "ex": "Suddenly, we heard the sound of a helicopter overhead. (Đột nhiên, chúng tôi đã nghe thấy âm thanh của một chiếc trực thăng trên đầu)"}, {"w": "illegal", "p": "/ɪˈliːɡl/", "pos": "adj.", "vi": "bất hợp pháp", "ex": "In Vietnam, driving on the left is illegal. (Ở Việt Nam, lái xe ở bên trái là bất hợp pháp)"}, {"w": "park", "p": "/pɑːk/", "pos": "v.", "vi": "đỗ xe", "ex": "We decided to go home because we couldn’t find a place to park. (Chúng tôi đã quyết định về nhà vì không thể tìm được chỗ đỗ xe)"}, {"w": "pavement", "p": "/ˈpeɪvmənt/", "pos": "n.", "vi": "vỉa hè (cho người đi bộ)", "ex": "Walking on the pavement can help you avoid traffic accidents. (Đi bộ trên vỉa hè có thể giúp bạn tránh được tai nạn giao thông)"}, {"w": "prohibitive", "p": "/prəˈhɪbətɪv/", "pos": "adj.", "vi": "cấm", "ex": "Motorbikes are prohibitive in highways. (Xe máy bị cấm trên đường cao tốc)"}, {"w": "railway station", "p": "/ˈreɪlweɪ ˈsteɪʃn/", "pos": "n.", "vi": "nhà ga xe lửa", "ex": "She is waiting for me at the railway station (Cô ấy đang đợi tôi ở ga tàu)"}, {"w": "reverse", "p": "/rɪˈvɜːs/", "pos": "v.", "vi": "quay đầu xe", "ex": "She reversed the car into the parking space. (Cô ấy quay đầu xe vào nơi đỗ xe)"}, {"w": "road sign/ traffic sign", "p": "/ˈrəʊd saɪn// /ˈtræfɪk saɪn/", "pos": "n.", "vi": "biển báo giao thông", "ex": "He was stopped by the police because he did not follow the road sign/ traffic sign. (Anh ta bị cảnh sát chặn lại vì không tuân thủ biển báo giao thông)"}, {"w": "roof", "p": "/ruːf/", "pos": "n.", "vi": "nóc xe, mái nhà", "ex": "There is a bird on the roof of my car. (Có một con chim trên nóc xe của tôi)"}, {"w": "seatbelt", "p": "/ˈsiːt belt/", "pos": "n.", "vi": "dây an toàn", "ex": "Don’t forget to fasten your seatbelt! (Đừng quên thắt dây an toàn nhé!)"}, {"w": "safely", "p": "/ˈseɪfli/", "pos": "adv.", "vi": "an toàn", "ex": "The plane landed safely in the storm. (Máy bay đã hạ cánh an toàn trong cơn bão)"}, {"w": "safety", "p": "/ˈseɪfti/", "pos": "n.", "vi": "sự an toàn", "ex": "Fasstening your seatbelt will ensure your safety. (Thắt dây an toàn sẽ đảm bảo sự an toàn của bạn)"}, {"w": "ship", "p": "/ʃɪp/", "pos": "n.", "vi": "tàu thủy", "ex": "Mary is on the ship to Australia. (Mary đang trên tàu đến Úc)"}, {"w": "traffic rule/ law", "p": "/ˈtræfɪk ruːl// lɔː/", "pos": "n.", "vi": "luật giao thông", "ex": "England is one of the countries where the traffic rule/law is to keep to the left. (Nước Anh là một trong những nước có luật giao thông quy định đi bên trái)"}, {"w": "traffic jam", "p": "/ˈtræfɪk dʒæm/", "pos": "n.", "vi": "tắc đường", "ex": "The snow storm caused traffic jams all over the city. (Cơn bão tuyết đã gây ra tắc đường khắp thành phố)"}, {"w": "obey", "p": "/əˈbeɪ/", "pos": "v.", "vi": "tuân theo", "ex": "Every citizen should obey the traffic rule/ traffic law (Mọi công dân nên tuân thủ luật lệ giao thông)"}, {"w": "train", "p": "/treɪn/", "pos": "n.", "vi": "tàu hỏa", "ex": "She missed the train to the airport. (Cô ấy đã lỡ chuyến tàu đến sân bay)"}, {"w": "triangle", "p": "/ˈtraɪæŋɡl/", "pos": "n.", "vi": "tam giác", "ex": "A triangle is a shape with three sides. (Tam giác là hình có ba cạnh)"}, {"w": "tricycle", "p": "/ˈtraɪsɪkl/", "pos": "n.", "vi": "xe đạp ba bánh", "ex": "She bought her four – year – old son a new tricycle. (Cô ấy đã mau cho cậu con trai bốn tuổi của mình một chiếc xe ba bánh)"}, {"w": "vehicle", "p": "/ˈviːəkl/", "pos": "n.", "vi": "xe cộ, phương tiện giao thông", "ex": "There are a lot of vehicles on my way to school every moring. (Có rất nhiều phương tiện giao thông trên đường tôi đến trường vào mỗi buổi sáng)"}];
const LISTEN="Transportation hasn't really changed a lot in the past 100 years. When you think about changes in other areas of our life, transportation is pretty much the same as it was years ago. OK, cars, trains and airplanes are fast, but they're not so different than they were 50 years ago. Take airplanes, for example. I think air travel has got worse. Fifty years ago, people flew and were given great service. Today, you are like sardines in a can. And look at cars. The cars from fifty years ago looked nicer than today's ones. They still had four wheels, used petrol and had a steering wheel. I think transportation will really only change when it becomes more personal. I'm waiting for my own mini copter. ";

 if(s.kind==='vocab')return `<div class="tools"><input class="search" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt…" oninput="document.getElementById('words12').innerHTML=vocab12(this.value)"></div><div id="words12">${vocab12()}</div>`;

 if(!s.id)return s.html;

}
