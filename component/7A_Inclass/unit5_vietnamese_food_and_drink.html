câu, tính từ “sweet” (ngọt) là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: My son prefers salty snacks to sweet ones. (<i>Con trai tôi thích đồ ăn vặt mặn hơn là đồ ăn vặt ngọt.)</i></p>"}, {"q": "___is a liquid food made by boiling meat and vegetables in water.", "a": ["Soup"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là động từ to be nên ta cần một danh từ đứng đầu câu giữ chức năng chủ ngữ. Dựa vào nghĩa của câu, danh từ “soup” (súp) là phù hợp nhất.</p><p><b>Dịch nghĩa: </b>Soup is a liquid food made by boiling meat and vegetables in water. <i>(Súp là một loại đồ ăn lỏng được làm bằng cách đun sôi thịt và rau trong nước.)</i></p>"}, {"q": "We can make a tasty omelette from these___and nutritious eggs.", "a": ["delicious"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là liên từ “and” và tính từ “nutritious” nên theo cấu trúc song song ta cần một tính từ. Dựa vào nghĩa của câu, tính từ “delicious” (ngon) là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: We can make a tasty omelette from these delicious and nutritious eggs. (<i>Chúng ta có thể làm món trứng tráng ngon lành từ những quả trứng ngon và bổ dưỡng này.)</i></p>"}, {"q": "My mother often follows a___to know the ingredients and the way to cook a dish exactly.", "a": ["recipe"], "exp": "<p><b>Giải thích</b>: Sau mạo từ “a” ta cần một danh từ. Dựa vào nghĩa của câu, danh từ “recipe” (công thức) là phù hợp nhất.</p><p><b>Dịch nghĩa:</b> My mother often follows a recipe to know the ingredients and the way to cook a dish exactly. <i>(Mẹ tôi thường làm theo công thức nấu ăn để biết chính xác nguyên liệu và cách chế biến.)</i></p>"}, {"q": "They___a wonderful meal to more than fifty guests.", "a": ["served"], "exp": "<p><b>Giải thích</b>: Trước vị trí cần điền là đại từ nhân xưng “they”, và sau nó là cụm danh từ “a wonderful meal” nên ở đây ta cần một động từ cho câu. Dựa vào nghĩa của câu, động từ “served” (phục vụ) là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: They served a wonderful meal to more than fifty guests. (<i>Họ phục vụ một bữa ăn tuyệt vời cho hơn năm mươi khách.)</i></p>"}, {"q": "___may protect your brain in old age, lowering your risk of Alzheimer’s.", "a": ["Green tea"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là động từ “protect” nên ta cần một danh từ đứng đầu câu giữ chức năng chủ ngữ. Dựa vào nghĩa của câu, danh từ “green tea” (trà xanh) là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Green tea may protect your brain in old age, lowering your risk of Alzheimer’s. <i>(Trà xanh có thể bảo vệ não của bạn khi về già, giảm nguy cơ mắc bệnh Alzheimer.)</i></p>"}], "before": "<div class=\"note\">II - Complete the following sentences using the given words in the box. There is one extra word.</div><div class=\"source\"><p><b>II - Complete the following sentences using the given words in</b> the box. There is one extra word.</p><div class=\"tablewrap\"><table><tr><td><p>poured</p></td><td><p>green tea</p></td><td><p>sweet</p></td><td><p>salty</p></td><td><p>folded</p></td></tr><tr><td><p>recipe</p></td><td><p>pork</p></td><td><p>delicious</p></td><td><p>served</p></td><td><p>soup</p></td></tr></table></div><p><i>E.g.: Eating too much__salty__food is not a healthy way of eating.</i></p></div>"}]}, {"title": "Pronunciation · Ngữ âm", "icon": "🎧", "desc": "Unit 5 · Vietnamese Food and Drink", "subs": [{"label": "Lý thuyết", "html": "<div class=\"source\"><p><b>NGỮ ÂM</b></p><p>Pronunciation</p><p><b>1. PHỤ ÂM /</b><b>ɒ</b><b>/</b></p><div class=\"tablewrap\"><table><tr><td><p><b>CÁCH PHÁT ÂM</b></p></td><td><p><b>VÍ DỤ</b></p></td></tr><tr><td></td><td><p>* <b>mop</b> /m<u><b>ɒ</b></u>p/ n. (chổi lau nhà)</p><p>* <b>hot</b> /h<u><b>ɒ</b></u>t/ adj. (nóng)</p></td></tr><tr><td><p>Hạ hàm dưới xuống, môi tròn thư giãn</p><p>Đầu lưỡi hạ xuống</p><p>Đẩy hơi ra. Dây thanh rung lên</p><p>Âm /<b>ɒ</b><b>/</b> là nguyên âm ngắn, bạn phải phát âm nhanh và gọn</p></td><td></td></tr></table></div><p><b>2. PHỤ ÂM /</b><b>ɔ:</b><b>/</b></p><div class=\"tablewrap\"><table><tr><td><p><b>CÁCH PHÁT ÂM</b></p></td><td><p><b>VÍ DỤ</b></p></td></tr><tr><td></td><td><p>* <b>fork</b> /f<u><b>ɔ</b></u>:k/ <i>n. (đĩa)</i></p><p>* <b>pork</b> /pɔːk/ <i>n. (thịt lợn)</i></p></td></tr><tr><td><p>Hạ quai hàm, môi rất tròn</p><p>Đầu lưỡi hạ xuống</p><p>Đẩy hơi ra. Dây thanh rung lên</p><p>Âm /<b>ɔ:</b><b>/ </b>là nguyên âm dài, bạn sẽ phải kéo dài âm ra</p></td><td></td></tr></table></div></div>"}, {"id": "p1", "label": "I · Chọn âm khác", "kind": "quiz", "items": [{"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["<u>o</u>besity", "br<u>o</u>th", "comp<u>o</u>se", "ph<u>o</u>to"], "a": 1, "exp": "<p><b>Giải thích</b>: br<u>o</u>th /brɒθ/ có “o” được phát âm là /ɒ/, các phương án còn lại có “o” được phát âm là /əʊ/.</p><p><b>A</b>.<u>o</u>besity /əʊˈbiːsəti/ <b>C</b>. c<u>o</u>mpose /kəmˈpəʊz/ <b>D</b>. ph<u>o</u>to /ˈfəʊtəʊ/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["r<u>o</u>bot", "sl<u>ot</u>", "c<u>o</u>ncentrate", "<u>o</u>pera"], "a": 0, "exp": "<p><b>Giải thích</b>: robot /ˈrəʊbɒt/ có “o” được phát âm là /əʊ/, các phương án còn lại có “o” được phát âm là /ɒ/.</p><p><b>B.</b>sl<u>o</u>t /slɒt/ <b>C</b>. c<u>o</u>ncentrate /ˈkɒnsntreɪt/ <b>D.</b> <u>o</u>pera /ˈɒprə/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["sl<u>au</u>ghter", "<u>au</u>dience", "h<u>au</u>nt", "<u>au</u>nt"], "a": 3, "exp": "<p><b>Giải thích</b>: <u>au</u>nt /ɑːnt/ có “au” được phát âm là /ɑ:/, các phương án còn lại có “au” được phát âm là /ɔ:/.</p><p><b>A</b>. sl<u>au</u>ghter /ˈslɔːtə(r)/<b>B</b>. <u>au</u>dience /ˈɔːdiəns/<b>C</b>. h<u>au</u>nt /hɔːnt/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["sh<u>or</u>tage", "perf<u>or</u>m", "f<u>or</u>give", "h<u>or</u>n"], "a": 2, "exp": "<p><b>Giải thích</b>: forgive /fəˈɡɪv/ có “or” được phát âm là /ə/, các phương án còn lại có “or” được phát âm là /ɔ:/.</p><p><b>A</b>.sh<u>or</u>tage /ˈʃɔːtɪdʒ/ <b>B</b>. perf<u>or</u>m /pəˈfɔːm/<b>D</b>. h<u>or</u>n /hɔːn/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["sm<u>o</u>g", "expl<u>o</u>sion", "metr<u>o</u>", "sl<u>o</u>gan"], "a": 0, "exp": "<p><b>Giải thích</b>: sm<u>o</u>g /smɒɡ/ có “o” được phát âm là /ɒ/, các phương án còn lại có “o” được phát âm là /əʊ/.</p><p><b>B.</b>expl<u>o</u>sion /ɪkˈspləʊʒn/<b>C.</b> metr<u>o</u> /ˈmetrəʊ/<b>D</b>. sl<u>o</u>gan /ˈsləʊɡən/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["sh<u>o</u>w", "<u>o</u>pen", "cl<u>o</u>thes", "cl<u>o</u>th"], "a": 3, "exp": "<p><b>Giải thích</b>: cloth /klɒθ/ có “o” được phát âm là /ɒ/, các phương án còn lại có “o” được phát âm là /əʊ/.</p><p><b>A</b>. sh<u>o</u>w /ʃəʊ/<b>B</b>. <u>o</u>pen /ˈəʊpən/<b>C</b>. cl<u>o</u>thes /kləʊðz/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["cl<u>o</u>ck", "h<u>o</u>le", "sh<u>o</u>ck", "pl<u>o</u>t"], "a": 1, "exp": "<p><b>Giải thích</b>: h<u>o</u>le /həʊl/ có “o” được phát âm là /əʊ/, các phương án còn lại có “o” được phát âm là /ɒ/.</p><p><b>A</b>.cl<u>o</u>ck /klɒk/<b>C</b>. sh<u>o</u>ck /ʃɒk/<b>D</b>. pl<u>o</u>t /plɒt/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["fl<u>o</u>ppy", "sh<u>o</u>vel", "gl<u>o</u>ve", "l<u>o</u>ve"], "a": 0, "exp": "<p><b>Giải thích</b>: fl<u>o</u>ppy /ˈflɒpi/ có “o” được phát âm là /ɒ/, các phương án còn lại có “o” được phát âm là /ʌ/.</p><p><b>B</b>.sh<u>o</u>vel /ˈʃʌvl/<b>C</b>. gl<u>o</u>ve /ɡlʌv/<b>D</b>. l<u>o</u>ve /lʌv/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["h<u>o</u>t", "h<u>o</u>bby", "sl<u>o</u>pe", "t<u>o</u>p"], "a": 2, "exp": "<p><b>Giải thích</b>: sl<u>o</u>pe /sləʊp/ có “o” được phát âm là /əʊ/, các phương án còn lại có “o” được phát âm là /ɒ/.</p><p><b>A</b>. h<u>o</u>t /hɒt/<b>B</b>. h<u>o</u>bby /ˈhɒbi/<b>D</b>. t<u>o</u>p /tɒp/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["c<u>oa</u>l", "r<u>oa</u>r", "fl<u>oa</u>t", "l<u>oa</u>d"], "a": 1, "exp": "<p><b>Giải thích</b>: r<u>oa</u>r /rɔː(r)/ có “oa” được phát âm là /ɔ:/, các phương án còn lại có “oa” được phát âm là /əʊ/.</p><p><b>A</b>. c<u>oa</u>l /kəʊl/ <b>C</b>. fl<u>oa</u>t /fləʊt/<b>D</b>. l<u>oa</u>d /ləʊd/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["v<u>o</u>lunteer", "d<u>o</u>cumentary", "hydr<u>o</u>", "fl<u>o</u>p"], "a": 2, "exp": "<p><b>Giải thách</b>: hydr<u>o</u> /ˈhaɪdrəʊ/ có “o” được phát âm là /əʊ/, các phương án còn lại có “o” được phát âm là /ɒ/. </p><p><b>A</b>. v<u>o</u>lunteer /ˌvɒlənˈtɪə(r)/<b>B</b>. d<u>o</u>cumentary /ˌdɒkjuˈmentri/ <b>D</b>. fl<u>o</u>p /flɒp/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["ph<u>o</u>ne", "can<u>o</u>n", "h<u>o</u>me", "st<u>o</u>ne"], "a": 1, "exp": "<p><b>Giải thích</b>: can<u>o</u>n /ˈkænən/ có “o” được phát âm là /ə/, cácphương án còn lại có “o” được phát âm là /əʊ/.</p><p><b>A</b>. ph<u>o</u>ne /fəʊn/<b>C</b>. h<u>o</u>me /həʊm/<b>D</b>. st<u>o</u>ne /stəʊn/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["c<u>o</u>mpass", "s<u>o</u>fa", "p<u>o</u>em", "<u>o</u>verseas"], "a": 0, "exp": "<p><b>Giải thích</b>: c<u>o</u>mpass /ˈkʌmpəs/ có “o” được phát âm là /ʌ/,các phương áncòn lại có “o” được phát âm là /əʊ/.</p><p><b>B</b>. s<u>o</u>fa /ˈsəʊfə/<b>C</b>. p<u>o</u>em /ˈpəʊɪm/<b>D</b>. <u>o</u>verseas /ˌəʊvəˈsiːz/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["c<u>o</u>medy", "apric<u>o</u>t", "w<u>o</u>rkshop", "jud<u>o</u>"], "a": 3, "exp": "<p><b>Giải thích</b>: jud<u>o</u> /ˈdʒuːdəʊ/ có “o” được phát âm là /əʊ/, các phương án còn lại có “o” được phát âm là /ɒ/.</p><p><b>A</b>.c<u>o</u>medy /ˈkɒmədi/<b>B.</b> apric<u>o</u>t /ˈeɪprɪkɒt/<b>C</b>. worksh<u>o</u>p /ˈwɜːkʃɒp/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["m<u>o</u>ve", "c<u>o</u>nvenient", "micr<u>o</u>wave", "c<u>o</u>nditioner"], "a": 0, "exp": "<p><b>Giải thích</b>: m<u>o</u>ve /mu:v/ có “o” được phát âm là /u:/, các phương án còn lại có “o” được phát âm là /ə/.</p><p><b>B</b>.c<u>o</u>nvenient /kənˈviːniənt/<b>C</b>. micr<u>o</u>wave /ˈmaɪkrəweɪv/<b>D</b>. c<u>o</u>nditioner /kənˈdɪʃənə(r)/</p>"}], "before": "<div class=\"note\">I - Choose the word which has the underlined part pronounced differently.</div>"}, {"id": "p2", "label": "II · Phân loại âm", "kind": "quiz", "items": [{"q": "poverty", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "flop", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "gridlocked", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "hover", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "fossil", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "love", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 1, "exp": "Đáp án: /ʌ/"}, {"q": "money", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 1, "exp": "Đáp án: /ʌ/"}, {"q": "company", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 1, "exp": "Đáp án: /ʌ/"}, {"q": "other", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 1, "exp": "Đáp án: /ʌ/"}, {"q": "become", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 1, "exp": "Đáp án: /ʌ/"}, {"q": "automated", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 2, "exp": "Đáp án: /ə/"}, {"q": "prohibitive", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 2, "exp": "Đáp án: /ə/"}, {"q": "consist", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 2, "exp": "Đáp án: /ə/"}, {"q": "recognise", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 2, "exp": "Đáp án: /ə/"}, {"q": "locate", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 3, "exp": "Đáp án: /əʊ/"}, {"q": "explosion", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 3, "exp": "Đáp án: /əʊ/"}, {"q": "metro", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 3, "exp": "Đáp án: /əʊ/"}, {"q": "slogan", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 3, "exp": "Đáp án: /əʊ/"}, {"q": "control", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 3, "exp": "Đáp án: /əʊ/"}, {"q": "hydro", "opts": ["/ɒ/", "/ʌ/", "/ə/", "/əʊ/"], "a": 3, "exp": "Đáp án: /əʊ/"}], "before": "<div class=\"note\">II - Put the words given in the box to the correct column according to the pronunciation of the underlined letter.</div><div class=\"source\"><p><b>II - Put the words given in the box to the correct column according to the pronunciation of the underlined letter.</b></p><div class=\"tablewrap\"><table><tr><td><p>l<u>o</u>cate</p></td><td><p>l<u>o</u>ve</p></td><td><p>p<u>o</u>verty</p></td><td><p>aut<u>o</u>mated</p></td><td><p>m<u>o</u>ney</p></td></tr><tr><td><p>expl<u>o</u>sion</p></td><td><p>fl<u>o</u>p</p></td><td><p>pr<u>o</u>hibitive</p></td><td><p>c<u>o</u>mpany</p></td><td><p>metr<u>o</u></p></td></tr><tr><td><p>gridl<u>o</u>cked</p></td><td><p>c<u>o</u>nsist</p></td><td><p>h<u>o</u>ver</p></td><td><p>sl<u>o</u>gan</p></td><td><p>rec<u>o</u>gnise</p></td></tr><tr><td><p><u>o</u>ther</p></td><td><p>c<u>o</u>ntrol</p></td><td><p>f<u>o</u>ssil</p></td><td><p>hydr<u>o</u></p></td><td><p>bec<u>o</u>me</p></td></tr></table></div></div>"}, {"id": "p3", "label": "III · /ɒ/ và /ɔː/", "kind": "quiz", "items": [{"q": "poverty", "opts": ["/ɒ/", "/ɔː/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "block", "opts": ["/ɒ/", "/ɔː/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "shock", "opts": ["/ɒ/", "/ɔː/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "concentrate", "opts": ["/ɒ/", "/ɔː/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "goggle", "opts": ["/ɒ/", "/ɔː/"], "a": 0, "exp": "Đáp án: /ɒ/"}, {"q": "organise", "opts": ["/ɒ/", "/ɔː/"], "a": 1, "exp": "Đáp án: /ɔː/"}, {"q": "warm", "opts": ["/ɒ/", "/ɔː/"], "a": 1, "exp": "Đáp án: /ɔː/"}, {"q": "salt", "opts": ["/ɒ/", "/ɔː/"], "a": 1, "exp": "Đáp án: /ɔː/"}, {"q": "support", "opts": ["/ɒ/", "/ɔː/"], "a": 1, "exp": "Đáp án: /ɔː/"}, {"q": "water", "opts": ["/ɒ/", "/ɔː/"], "a": 1, "exp": "Đáp án: /ɔː/"}], "before": "<div class=\"note\">III - Put the words given in the box to the correct row according to the pronunciation of the underlined letter.</div><div class=\"source\"><p><b>III - Put the words given in the box to the correct row according to the pronunciation of the underlined letter.</b></p><div class=\"tablewrap\"><table><tr><td><p><u>or</u>ganise</p></td><td><p>w<u>ar</u>m</p></td><td><p>p<u>o</u>verty</p></td><td><p>s<u>a</u>lt</p></td><td><p>bl<u>o</u>ck</p></td></tr><tr><td><p>sh<u>o</u>ck</p></td><td><p>supp<u>o</u>rt</p></td><td><p>c<u>o</u>ncentrate</p></td><td><p>g<u>o</u>ggle</p></td><td><p>w<u>at</u>er</p></td></tr></table></div></div>"}]}, {"title": "Grammar · Ngữ pháp", "icon": "🧩", "desc": "Unit 5 · Vietnamese Food and Drink", "subs": [{"label": "Lý thuyết", "html": "<div class=\"source\"><p><b>NGỮ PHÁP</b></p><p>Grammar</p><p><b>1. DANH TỪ ĐẾM ĐƯỢC VÀ KHÔNG ĐẾM ĐƯỢC </b>(COUNTABLE AND UNCOUNTABLE NOUNS)</p><div class=\"tablewrap\"><table><tr><td><p><b>Danh từ đếm được </b></p><p><b>(Countable nouns)</b></p></td><td><p><b>Danh từ không đếm được </b></p><p><b>(Uncountable nouns)</b></p></td></tr><tr><td><p>Danh từ đếm được chỉ đối tượng có thể đếm được.</p></td><td><p>Danh từ không đếm được chỉ đối tượng <b>không</b> đếm được. Đối với danh từ không đếm được, ta có thể sử dụng các lượng từ đi trước để xác định số lượng, khối lượng của chúng.</p></td></tr><tr><td><p>a baby (<i>một em bé</i>), two cars (<i>hai xe hơi</i>), three sausages (<i>ba cái xúc xích</i>), four shrimps (<i>bốn con tôm)</i></p><p><i>bánh mì)</i></p></td><td><p>a glass of water (<i>một cốc nước</i>), a piece of cake (<i>một miếng bánh</i>), a kilo of beef (<i>một cân thịt bò</i>), a loaf of bread (<i>một ổ bánh mì</i>)</p></td></tr></table></div><p><b>2. A/ AN/ SOME/ ANY (A/ AN/ SOME/ ANY)</b></p><p><b>a. Danh từ đếm được</b></p><div class=\"tablewrap\"><table><tr><td></td><td><p><b>Số ít</b></p></td><td><p><b>Số nhiều</b></p></td></tr><tr><td><p><b>Khẳng định</b></p></td><td><p><b>a</b></p></td><td><p>This is <u><b>a</b></u> cake.</p><p><i>(Đây là một cái bánh.)</i></p></td><td><p><b>some</b></p></td><td><p>I have <u><b>some</b></u> vegetables. </p><p>(<i>Tôi có một ít rau củ.)</i></p></td></tr><tr><td><p><b>Phủ định</b></p></td><td><p><b>a</b></p></td><td><p>This isn’t <u><b>a</b></u> cake.</p><p>(<i>Đây không phải là một cái bánh.)</i></p></td><td><p><b>any</b></p></td><td><p>I don’t have <u><b>any </b></u>vegetables. (<i>Tôi không có rau củ.)</i></p></td></tr><tr><td><p><b>Nghi vấn</b></p></td><td><p><b>a</b></p></td><td><p>Is this <u><b>a</b></u> cake?</p><p>(<i>Đây là một cái bánh ư?)</i></p></td><td><p><b>any</b></p></td><td><p>Do vou have <u><b>any</b></u> vegetables?</p><p>(<i>Bạn có rau củ không?)</i></p></td></tr></table></div><p><b>b. Danh từ không đếm được</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Khẳng định</b></p></td><td><p><b>some</b></p></td><td><p>You need <u><b>some </b></u>fish sauce for this dish. </p><p>(<i>Bạn cần chút nước mắm cho món ăn này</i>.)</p></td></tr><tr><td><p><b>Phủ định</b></p></td><td><p><b>any</b></p></td><td><p>You don’t need <u><b>any</b></u> fish sauce for this dish. </p><p>(<i>Bạn không cần nước mắm cho món ăn này</i>.)</p></td></tr><tr><td><p><b>Nghi vấn</b></p></td><td><p><b>any</b></p></td><td><p>Do you need <u><b>any</b></u> fish sauce for this dish?</p><p>(<i>Bạn có cần nước mắm cho món ăn này không?)</i></p></td></tr></table></div><div class=\"tablewrap\"><table><tr><td><p><b>Chú ý: some</b> có thể được sử dụng trong câu yêu cầu hoặc đề nghị.</p></td><td><p><b>Ví dụ: </b></p><p>Can I take <b>some</b> sausages?</p><p>(<i>Tôi có thể lấy vài cái xúc xích được không?)</i> Would you like <b>some</b> more soup? </p><p>(<i>Bạn có muốn thêm súp không?)</i></p></td></tr></table></div><p><b>3. BAO NHIÊU?</b> (HOW MANY?/ HOW MUCH?)</p><div class=\"tablewrap\"><table><tr><td><p><b>How many</b></p></td><td><p><b>How much</b></p></td></tr><tr><td><p><b>How many?</b> được dùng để hỏi về số lượng của danh từ đếm được số nhiều.</p></td><td><p><b>How much?</b> được dùng để hỏi về số lượng của danh từ không đếm được.</p></td></tr><tr><td><p>How many eggs did you crack?</p><p>(<i>Cậu đã đập bao nhiêu quả trứng rồi?)</i></p><p>How many egg did you crack?</p><p><i>(Cậu đã đập bao nhiêu quả trứng rồi?)</i></p></td><td><p>How much green tea do you want?</p><p>(<i>Bạn cần bao nhiêu chè xanh?)</i></p><p>How many green tea leaves do you want?</p><p><i>(</i><i>Bạn muốn bao nhiêu lá chè xanh?)</i></p></td></tr></table></div></div>"}]}, {"title": "Grammar practice", "icon": "📝", "desc": "Unit 5 · Vietnamese Food and Drink", "subs": [{"id": "g1", "label": "I · How much / How many", "kind": "fill", "items": [{"q": "___sugar did you use to make this cake?", "a": ["How much"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “sugar” nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much sugar did you use to make this cake<i>? (Bạn đã dùng bao nhiêu đường để làm chiếc bánh ngọt này?)</i></p>"}, {"q": "___days did you spend in Paris last summer?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “days” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many days did you spend in Paris last summer? <i>(Bạn đã dành bao nhiêu ngày ở Paris mùa hè năm ngoái?)</i></p>"}, {"q": "___letters are there in the English alphabet?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “letters” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many letters are there in the English alphabet? <i>(Có bao nhiêu chữ cái trong bảng chữ cái tiếng Anh?)</i></p>"}, {"q": "___information did you get from them?", "a": ["How much"], "exp": "<p><b>Giải thích:</b> Sau vị trí cần điền là danh từ không đếm được “information” nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much information did you get from them? (<i>Bạn đã nhận được bao nhiêu thông tin từ họ?)</i></p>"}, {"q": "___pencils does Lan have in the box?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “pencils” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many pencils does Lan have in the box? (<i>Lan có bao nhiêu cây bút chì trong hộp?)</i></p>"}, {"q": "___food do you feed the dog every day?", "a": ["How much"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “food” nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much food do you feed the dog every day? (<i>Bạn cho chó ăn bao nhiêu thức ăn mỗi ngày?)</i></p>"}, {"q": "___butter is there in the fridge?", "a": ["How much"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “butter” nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much butter is there in the fridge? (<i>Có bao nhiêu bơ trong tủ lạnh?)</i></p>"}, {"q": "___children do people in your country often have?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “children” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many children do people in your country often have? (<i>Người dân nước bạn thường có mấy đứa con?)</i></p>"}, {"q": "___time have you spent doing this exercise?", "a": ["How much"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “time” nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much time have you spent doing this exercise? <i>(Bạn đã dành bao nhiêu thời gian để làm bài tập này?)</i></p>"}, {"q": "___websites did you visit to search for this information?", "a": ["How many"], "exp": "<p><b>Giải thích:</b> Sau vị trí cần điền là danh từ đếm được “websites” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many websites did you visit to search for this information? (<i>Bạn đã truy cập bao nhiêu trang mạng để tìm kiếm thông tin này?)</i></p>"}, {"q": "___water does your family use every month?", "a": ["How much"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “water” nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much water does your family use every month? (<i>Gia đình bạn sử dụng bao nhiêu nước mỗi tháng?)</i></p>"}, {"q": "___people came to the party last night?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “people” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many people came to the party last night? (<i>Có bao nhiêu người đã đến bữa tiệc tối qua?)</i></p>"}, {"q": "___mobile phones have you used so far?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “mobile phones” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many mobile phones have you used so far? <i>(Cho đến nay bạn đã sử dụng bao nhiêu cái điện thoại di dộng rồi?)</i></p>"}, {"q": "___salt did you put into the noodle soup?", "a": ["How much"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “salt” nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much salt did you put into the noodle soup? (<i>Bạn đã cho bao nhiêu muối vào phở thế?)</i></p>"}, {"q": "___times have you visited London?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “times” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many times have you visited London? (<i>Bạn đã đến thăm Luân Đôn bao nhiêu lần rồi?)</i></p>"}, {"q": "___computers does your school have?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “computers” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many computers does your school have? (<i>Trường học của bạn có bao nhiêu máy tính?)</i></p>"}, {"q": "___butter do we need for this recipe?", "a": ["How much"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “butter” nên ta điền “How much”.</p><p><b>Dịch nghĩa:</b> How much butter do we need for this recipe? (<i>Chúng ta cần bao nhiêu bơ cho công thức này?)</i></p>"}, {"q": "___spring rolls did your sister make yesterday?", "a": ["How many"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ đếm được “spring rolls” nên ta điền “How many”.</p><p><b>Dịch nghĩa</b>: How many spring rolls did your sister make yesterday? (<i>Hôm qua chị gái bạn đã làm được bao nhiêu chiếc nem?)</i></p>"}, {"q": "___bacon is there left in the fridge?", "a": ["How much"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “bacon” nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much bacon is there left in the fridge? (<i>Còn lại bao nhiêu thịt lợn muối xông khói trong tủ lạnh vậy?)</i></p>"}, {"q": "___beef do I have to buy to make 3 bowls of noodlesoup?", "a": ["How much"], "exp": "<p><b>Giải thích:</b> Sau vị trí cần điền là danh từ không đếm được “beef’ nên ta điền “How much”.</p><p><b>Dịch nghĩa</b>: How much beef do I have to buy to make 3 bowls of noodle soup? <i>(Tôi phải mua bao nhiêu thịt bò để làm 3 bát phở?)</i></p>"}], "before": "<div class=\"note\">I - Complete the following sentences by filling in “How much” or “How many”.</div>"}, {"id": "g2", "label": "II · Tìm lỗi sai", "kind": "quiz", "items": [{"q": "There is <u>an</u> university <u>near</u> <u>my house</u> <u>in</u> this street. ", "opts": ["an", "near", "my house", "in"], "a": 0, "exp": "<p><b>Giải thích</b>: university /ˌjuːnɪˈvɜːsəti/ bắt đầu bằng âm phụ âm /j/ nên ta dùng mạo từ “a”.</p><p><b>Dịch nghĩa</b>: There is a university near my house in this street. <i>(Có một trường đại học gần nhà tôi ở con phố này.)</i></p>"}, {"q": "I’m <u>afraid</u> I <u>don’t</u> <u>have some</u> money left <u>to lend</u> you. ", "opts": ["afraid", "don’t", "have some", "to lend"], "a": 2, "exp": "<p><b>Giải thích:</b> Ta dùng “any” trong câu phủ định và câu hỏi.</p><p><b>Dịch nghĩa</b>: I’m afraid I don’t have any money left to lend you. <i>(Tôi e rằng tôi không còn tiền để cho bạn mượn.)</i></p>"}, {"q": "<u>Please</u> see Peter! He <u>has</u> <u>any</u> good news <u>to inform</u> you. ", "opts": ["Please", "has", "any", "to inform"], "a": 2, "exp": "<p><b>Giải thích</b>: Ta dùng “some” trong câu khẳng định.</p><p><b>Dịch nghĩa</b>: Please see Peter! He has some good news to inform you. <i>(Xin vui lòng gặp Peter. Anh ấy có một vài tin tốt để thông báo cho bạn.)</i></p>"}, {"q": "<u>How many</u> equipment <u>has</u> <u>the company</u> given to <u>your office</u>? ", "opts": ["How many", "has", "the company", "your office"], "a": 0, "exp": "<p><b>Giải thích</b>: “equipment” là danh từ không đếm được nên ta phải dùng “how much”.</p><p><b>Dịch nghĩa</b>: How much equipment has the company given to your office? (<i>Công ty đã cung cấp bao nhiêu thiết bị cho văn phòng của bạn?)</i></p>"}, {"q": "<u>How much</u> <u>pairs</u> of high heels <u>does</u> your mother <u>have</u>? ", "opts": ["How much", "pairs", "does", "have"], "a": 0, "exp": "<p><b>Giải thích</b>: “pairs” là danh từ đếm được nên ta phải dùng “How many”.</p><p><b>Dịch nghĩa</b>: How many pairs of high heels does your mother have? (<i>Mẹ cậu có bao nhiêu đôi giày cao gót thế?)</i></p>"}], "before": "<div class=\"note\">II - Choose the underlined part which needs correction.</div>"}, {"id": "g3", "label": "III · Chọn đáp án", "kind": "quiz", "items": [{"q": "- We don’t have___cheese in the fridge. - OK, I’ll go to the grocery to buy some ", "opts": ["a", "an", "any", "some"], "a": 2, "exp": "<p><b>Giải thích</b>: Ta dùng “any” cho câu phủ định.</p><p><b>Dịch nghĩa</b>: - We don’t have any cheese in the fridge. - OK, I’ll go to the grocery to buy some. <i>(- Chúng ta chẳng có chút pho mai nào trong tủ lạnh cả. - Được, để mình đến cửa hàng tạp hóa mua một chút.)</i></p>"}, {"q": "Would you like___more water? ", "opts": ["some", "any", "∅", "a"], "a": 0, "exp": "<p><b>Giải thích</b>: Ta dùng “some” cho câu mời mọc.</p><p><b>Dịch nghĩa</b>: Would you like some more water? (<i>Bạn có muốn uống thêm chút nước không?)</i></p>"}, {"q": "Do you have___brother or sister to share the childhood with you? ", "opts": ["a lot", "∅", "many", "any"], "a": 3, "exp": "<p><b>Giải thích:</b> Ta dùng “any” cho câu nghi vấn.</p><p><b>Dịch nghĩa:</b> Do you have any brother or sister to share the childhood with you? <i>(Bạn có anh chị em nào để chia sẻ tuổi thơ với bạn không?)</i></p>"}, {"q": "Have you bought___new notebook for me yet? ", "opts": ["a", "an", "some", "∅"], "a": 0, "exp": "<p><b>Giải thích</b>: Cụm danh từ “new notebook” bắt đầu bằng âm phụ âm “n” nên ta dùng mạo từ “a”.</p><p><b>Dịch nghĩa</b>: Have you bought a new notebook for me yet? (<i>Bạn đã mua một cuốn sổ mới cho tôi chưa?)</i></p>"}, {"q": "I didn’t get___new email from the boss today. ", "opts": ["some", "any", "all", "∅"], "a": 1, "exp": "<p><b>Giải thích</b>: Ta dùng “any” cho câu phủ định.</p><p><b>Dịch nghĩa</b>: I didn’t get any new email from the boss today. (<i>Tôi không nhận được bất kỳ thư điện tử mới nào từ ông chủ ngày hôm nay.)</i></p>"}, {"q": "He never gives her___flowers these days. ", "opts": ["a", "an", "some", "any"], "a": 3, "exp": "<p><b>Giải thích</b>: Do có từ “never” nên đây là câu phủ định. Ta dùng “any” cho câu phủ định.</p><p><b>Dịch nghĩa:</b> He never gives her any flowers these days. (<i>Gần đây anh ấy không bao giờ tặng hoa cho cô ấy.)</i></p>"}, {"q": "Did your borrow___umbrella from her last week? ", "opts": ["any", "an", "some", "a"], "a": 1, "exp": "<p><b>Giải thích</b>: Danh từ “umbrella” bắt đầu bằng nguyên âm “u” được phát âm là /ʌ/ nên ta dùng mạo từ “an”. </p><p><b>Dịch nghĩa</b>: Did your borrow an umbrella from her last week? (<i>Bạn đã mượn cô ấy một chiếc ô tuần trước phải không?)</i></p>"}, {"q": "There___boxes of ice-cream in the fridge. ", "opts": ["are some", "is some", "are any", "is any"], "a": 0, "exp": "<p><b>Giải thích</b>: Sau chỗ trống là danh từ số nhiều “boxes” nên động từ to be là “are”. Đây là câu khẳng định nên ta dùng “some”.</p><p><b>Dịch nghĩa</b>: There are some boxes of ice-cream in the fridge. (<i>Có một vài hộp kem trong tủ lạnh</i>.)</p>"}, {"q": "I ate___loaf of bread for breakfast this morning. ", "opts": ["∅", "some", "a", "an"], "a": 2, "exp": "<p><b>Giải thích</b>: Danh từ “loaf bắt đầu bằng phụ âm nên ta dùng mạo từ “a”.</p><p><b>Dịch nghĩa:</b> I ate a loaf of bread for breakfast this morning. (<i>Tôi đã ăn một ổ bánh mì cho bữa sáng nay</i>.)</p>"}, {"q": "They have___information for you. ", "opts": ["a", "any", "a lot", "some"], "a": 3, "exp": "<p><b>Giải thích</b>: Đây là câu khẳng định và sau chỗ trống là danh từ không đếm được nên ta dùng “some”. Ta không dùng được “a lot” vì cần phải có giới từ “of’ ở phía sau.</p><p><b>Dịch nghĩa</b>: They have some information for you. (<i>Họ có một vài tin tức cho bạn.)</i></p>"}, {"q": "Did you buy___bottle of milk for me yesterday? ", "opts": ["a", "an", "some", "∅"], "a": 0, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là một danh từ đếm được số ít “bottle” bắt đầu bằng phụ âm “b” nên ta điền mạo từ “a”.</p><p><b>Dịch nghĩa</b>: Did you buy a bottle of milk for me yesterday? (<i>Hôm qua bạn đã mua cho tôi một chai sữa phải không?)</i></p>"}, {"q": "There___milk left in the fridge. ", "opts": ["aren’t any", "aren’t some", "isn’t any", "isn’t s"], "a": 2, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là một danh từ không đếm được “milk” nên động từ to be là “is”. Đây là câu phủ định nên ta dùng với “any”.</p><p><b>Dịch nghĩa</b>: There isn’t any milk left in the fridge. (<i>Không có tý sữa nào còn lại trong tủ lạnh.)</i></p>"}, {"q": "She drinks___cup of coffee every morning. ", "opts": ["a", "an", "any", "a lot"], "a": 0, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là một danh từ đếm được số ít “cup” bắt đầu bằng phụ âm “c” nên ta điền mạo từ “a”.</p><p><b>Dịch nghĩa</b>: She drinks a cup of coffee every morning. (<i>Cô ấy uống một tách cà phê mỗi sáng.)</i></p>"}, {"q": "___supermarket near your house? ", "opts": ["Are there some", "Are there any", "Is there some", "Is there a"], "a": 3, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là một danh từ đếm được, ở dạng số ít “supermarket” nên động từ to be là “is”. </p><p><b>Dịch nghĩa:</b> Is there a supermarket near your house? (<i>Có siêu thị nào gần nhà bạn không?)</i></p>"}, {"q": "___photos did you take with your classmates last summer? ", "opts": ["How much", "How many", "How long", "How far"], "a": 1, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là một danh từ đếm được số nhiều “photos” nên ta điền “How many” (bao nhiêu). “How much” dùng với danh từ không đếm được. Các phương án còn lại không hợp nghĩa và không được theo sau bởi một danh từ.</p><p><b>Dịch nghĩa</b>: How many photos did you take with your classmates last summer? (<i>Cậu đã chụp bao nhiêu bức ảnh với bạn cùng lớp vào hè năm ngoái vậy?)</i></p>"}, {"q": "I have___apples for you in the fridge. ", "opts": ["some", "any", "a lot", "∅"], "a": 0, "exp": "<p><b>Giải thích</b>: Đây là câu khẳng định nên ta dùng “some”. Các phương án khác không phù hợp về nghĩa.</p><p><b>Dịch nghĩa</b>: I have some apples for you in the fridge. (<i>Tôi có một vài quả táo cho bạn trong tủ lạnh.)</i></p>"}, {"q": "There___cheese left for me. ", "opts": ["isn’t some", "isn’t any", "aren’t some", "aren’t any"], "a": 1, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “cheese” nên động từ to be ở thể phủ định phải là “isn’t”. Đây là câu phủ định nên ta dùng “any”.</p><p><b>Dịch nghĩa</b>: There isn’t any cheese left for me. <i>(Không còn ít pho mát nào sót lại cho tôi.)</i></p>"}, {"q": "You should drink___glass of water before each meal to lose weight. ", "opts": ["a", "an", "some", "any"], "a": 0, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ số ít, bắt đầu bằng phụ âm “glass” nên ta dùng mạo từ “a”.</p><p><b>Dịch nghĩa</b>: You should drink a glass of water before each meal to lose weight. (<i>Bạn nên uống một cốc nước trước mỗi bữa ăn để giảm cân.)</i></p>"}, {"q": "I need___avocado to make a smoothie for my little daughter. ", "opts": ["a", "an", "all", "a lot"], "a": 1, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ số ít “avocado” bắt đầu bằng nguyên âm “a” nên ta dùng mạo từ “an”.</p><p><b>Dịch nghĩa:</b> I need an avocado to make a smoothie for my little daughter. <i>(Tôi cần một quả bơ để làm sinh tố cho đứa con gái bé bỏng của tôi.)</i></p>"}, {"q": "Do you need___help to finish that work in time? ", "opts": ["a", "an", "some", "any"], "a": 3, "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “help” nên không dùng mạo từ “a/an”. Đây là câu nghi vấn nên ta dùng “any”.</p><p><b>Dịch nghĩa</b>: Do you need any help to finish that work in time? <i>(Bạn có cần giúp đỡ để hoàn thành công việc đó đúng hạn không?)</i></p>"}], "before": "<div class=\"note\">III - Choose the best optton to complete each of the following sentences.</div>"}, {"id": "g4", "label": "IV · a / an / some / any", "kind": "fill", "items": [{"q": "My sister will make___spring rolls for dinner this evening.", "a": ["some"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ số nhiều “spring rolls” nên ta không dùng mạo từ “a/ an”. Đây là câu khẳng định nên ta dùng “some”.</p><p><b>Dịch nghĩa</b>: My sister will make some spring rolls for dinner this evening. (<i>Chị tôi sẽ làm vài chiếc nem cho bữa tối này.)</i></p>"}, {"q": "There isn’t___vermicelli and cooking oil left in the kitchen.", "a": ["any"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ không đếm được “vemicelli” và “cooking oil” nên ta không dùng mạo từ “a/an”. Đây là câu phủ định nên ta dùng “any”.</p><p><b>Dịch nghĩa</b>: There isn’t any vermicelli and cooking oil left in the kitchen. (<i>Không còn ít miến và dầu ăn nào trong bếp.)</i></p>"}, {"q": "She went to the supermarket to buy some vermicelli and___bottle of cooking oil.", "a": ["a"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ số ít “bottle” bắt đầu bằng phụ âm “b” nên ta dùng mạo từ “a”.</p><p><b>Dịch nghĩa</b>: She went to the supermarket to buy some vermicelli and a bottle of cooking oil. (<i>Cô ấy đi siêu thị mua một ít miến và một chai dầu ăn.)</i></p>"}, {"q": "My mother came home from work and gave me___apple yesterday evening.", "a": ["an"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ số ít “apple” bắt đầu bằng nguyên âm “a” nên ta dùng mạo từ “an”. </p><p><b>Dịch nghĩa</b>: My mother came home from work and gave me an apple yesterday evening. <i>(Mẹ tôi đi làm về và đưa cho tôi một quả táo vào tối hôm qua.)</i></p>"}, {"q": "There weren’t___interesting programmes on TV during lunch yesterday.", "a": ["any"], "exp": "<p><b>Giải thích</b>: Sau vị trí cần điền là danh từ số nhiều “interesting programmes” nên ta không dùng mạo từ “a/ an”. Đây là câu phủ định nên ta dùng “any”.</p><p><b>Dịch nghĩa</b>: There weren’t any interesting programmes on TV during lunch yesterday. <i>(Không có bất kỳ chương trình thú vị nào trên TV trong suốt bữa trưa ngày hôm qua.)</i></p>"}], "before": "<div class=\"note\">IV- Complete the following sentences by filling in the blank with a, an, some or any.</div>"}]}, {"title": "Reading · Đọc hiểu", "icon": "📖", "desc": "Unit 5 · Vietnamese Food and Drink", "subs": [{"label": "Do you know?", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p><b>DO YOU KNOW?</b></p><p><b>BUN CHA</b></p><p>• Pho might be Vietnam’s most famous dish, but bun cha is the top choice when it comes to lunchtime in the capital.</p><p>• Just look for the clouds of meaty smoke after 11 a.m. when street-side restaurants start grilling up small balls of seasoned pork and slices of marinated pork belly over a charcoal fire.</p><p>• Once they’re charred and crispy the pieces of pork are served with a large bowl of a fish sauce-heavy broth, a basket of herbs and a helping of rice noodles.</p></td></tr></table></div></div>"}, {"id": "r1", "label": "I · Bun cha", "kind": "quiz", "items": [{"q": "Bun cha has become more well-known since President Barack Obama’s visit.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Bún chả trở nên nổi tiếng hơn sau chuyến thăm của Tổng thống Barack Obama.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Bun cha became an international attention overnight after US President Barack Obama and [...]”</p>"}, {"q": "Bun cha has been a specialty of Hanoi for years.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Bún chả đã là một đặc sản của Hà Nội trong nhiều năm qua.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Their choice of this dish [...] has been one of the city’s signature dishes for hundreds of years.”</p>"}, {"q": "Minced pork shouldn’t be marinated in advance to keep it fresh.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi:</b> Thịt lợn băm không nên được ướp trước để giữ tươi</p><p><b>Giải thích</b>: Thông tin có ở câu: “minced pork must be marinated overnight to fully absorb the flavor of herbs and shaped into balls [...]”</p>"}, {"q": "The sauce is an important thing to make Bun cha more special.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Nước chấm là một thứ quan trọng để làm cho Bún chả trở nên đặc biệt hơn.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The sauce is what makes the dish spectacular; a good sauce will give a balance between the sweetness of the meat and the saltiness of the fish sauce.”</p>"}, {"q": "Tourists can always find a place which serves this traditional dish at any time in a day.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Bạn có thể tìm được món ăn truyền thống này để ăn bất cứ lúc nào trong ngày.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The Hanoi traditional dish is served only at lunchtime [...]” (Món ăn truyền thống này của Hà Nội chỉ được phục vụ vào giờ ăn trưa</p>"}], "before": "<div class=\"source\"><p><b>I</b> <b>- Read the passage and decide whether the statements are True (T) or False (F).</b></p><p><i>Bun cha</i> became an international attention overnight after US President Barack Obama and celebrity chef Anthony Bourdain were pictured eating the dish together in Hanoi. Their choice of this dish is now surprise as bun cha originated from the Old Quarter in Hanoi and has been one of the city’s signature dishes for hundreds of years. What makes this dish special is the intense preparation involved in making it; minced pork must be marinated overnight to fully absorb the flavor of herbs and shaped into balls, keeping attention to make sure the meat is tender and juicy. The sauce is what makes the dish spectacular; a good sauce will give a balance between the sweetness of the meat and the saltiness of the fish sauce. The Hanoi traditional dish is served only at lunchtime and comes with rice vermicelli, fresh vegies and herbs such as basils, coriander.</p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p>Bún chả trở thành món ăn gây sự chú ý của quốc tế chỉ sau một đêm sau khi Tổng thống Mỹ Barack Obama và đầu bếp nổi tiếng Anthony Bourdain chụp ảnh đang cùng nhau ăn món này tại Hà Nội. Việc lựa chọn món ăn này của họ hiện tại thật đáng ngạc nhiên khi bún chả bắt nguồn từ khu Phố cổ ở Hà Nội và là một trong những món ăn đặc trưng của thành phố trong hàng trăm năm qua. Điều làm cho món ăn này trở nên đặc biệt là cho việc chế biến rất nghiêm ngặt; thịt lợn băm phải được ướp qua đêm để ngấm hoàn toàn hương vị của các loại gia vị và được nặn thành viên, chú ý đảm bảo thịt mềm và ngon ngọt. Nước chấm là thứ làm cho món ăn này trở nên tuyệt vời; nước chấm chuẩn sẽ có sự cân bằng giữa độ ngọt của thịt và độ mặn của nước mắm. Món ăn truyền thống này của Hà Nội chỉ được phục vụ vào giờ ăn trưa và ăn kèm với bún, rau tươi và các loại rau thơm như húng quế, rau mùi.</p></div></details>"}, {"id": "r2", "label": "II · Egg coffee", "kind": "write", "items": [{"c": "Who invented egg coffee?", "a": "It was invented by Nguyen Giang in 1946.", "vi": "  Dịch nghĩa câu hỏi:  Ai đã phát minh ra cà phê trứng?   Giải thích : Thông tin có ở câu: “Egg coffee, called Cà Phê Trứng in Vietnamese, was first invented by Nguyen Giang in 1946.” "}, {"c": "Why did Nguyen Giang add whisked eggs to his coffee?", "a": "Because there was a shortage of milk in Hanoi due to the French War.", "vi": "  Dịch nghĩa câu hỏi : Tại sao Nguyễn Giang lại thêm trứng đánh vào cà phê của mình?   Dịch nghĩa câu hỏi : Thông tin có ở câu: There was a shortage of milk in Hanoi due to the French War. Mr. Giang got creative and began adding whisked eggs to his coffee instead.” "}, {"c": "What is the recipe to make egg coffee nowadays?", "a": "No one knows the recipe for sure since it’s a secret recipe.", "vi": "  Dịch nghĩa câu hỏi : Công thức để làm cà phê trứng ngày nay là gì?   Giải thích : Thông tin có ở câu: “No one knows the recipe for sure since it’s a secret recipe.” "}, {"c": "What does egg coffee taste like?", "a": "It’s incredibly thick and rich and creamy.", "vi": "  Dịch nghĩa câu hỏi : Cà phê trứng có vị như thế nào?   Giải thích : Thông tin có ở câu: “Well it’s incredibly thick and rich and creamy. Closer to a dessert than a beverage.” "}, {"c": "Where can we buy this type of coffee? ", "a": "We can buy it at Nguyen Giang café or coffee shops all over Hanoi.", "vi": "  Dịch nghĩa câu hỏi : Chúng ta có thể mua loại cà phê này ở đâu?   Giải thích : Thông tin có ở câu: “Nguyen Giang still has a café where you can try his famous recipe, or you can grab a cup of Egg Coffee at dozens of coffee shops all over Hanoi.” "}], "before": "<div class=\"source\"><p><b>II - Read the passage and answer the following questions.</b></p><p>Egg coffee, called <i>Cà Phê Trứng</i> in Vietnamese, was first invented by Nguyen Giang in 1946. There was a shortage of milk in Hanoi due to the French War. Mr. Nguyen creatively began adding whisked eggs to his coffee instead.</p><p>The original version was a bit, well, eggy. But over time the recipe was modified with the addition of sugar, condensed milk, and even Laughing Cow cheese. No one knows the recipe for sure since it’s a secret recipe. These days Egg Coffee is a staple of Hanoi coffee culture and a must-try while in Hanoi!</p><p>What does it taste like? Well it’s incredibly thick and rich and creamy. Closer to a dessert than a beverage. Liquid tiramisu is the most accurate description we’ve heard.</p><p>Nguyen Giang still has a café where you can try his famous recipe, or you can grab a cup of Egg Coffee at dozens of coffee shops all over Hanoi.</p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p>Cà phê trứng, được gọi là Cà Phê Trứng trong tiếng việt, được Nguyễn Giảng phát minh lần đầu tiên vào năm 1946. Ở Hà Nội, thiếu sữa do Chiến tranh với Pháp. Thay vào đó, ông Giảng đã sáng tạo và bắt đầu thêm trứng đánh vào cà phê.</p><p>Phiên bản gốc hơi nhiều vị trứng. Nhưng theo thời gian, công thức đã được sửa đổi với việc bổ sung đường, sữa đặc và thậm chí cả phô mai bò cười. Không ai biết công thức chắc chắn vì nó là điều bí mật. Ngày nay, Cà phê trứng là một nét chính của văn hóa cà phê Hà Nội và nhất định phải thử khi ở Hà Nội!</p><p>Vị nó như thế nào? Vâng, nó cực kỳ đặc, nhiều chất và giống kem. Gần giống một món tráng miệng hơn là một đồ uống. Tiramisu lỏng là mô tả chính xác nhất mà chúng tôi nghe thấy.</p><p>Nguyễn Giảng vẫn có một quán cà phê, nơi bạn có thể thử công thức nổi tiếng của ông, hoặc bạn có thể mua một tách Cà phê trứng tại hàng chục quán cà phê trên khắp Hà Nội.</p></div></details>"}]}, {"title": "Listening · Nghe", "icon": "🔊", "desc": "Unit 5 · Vietnamese Food and Drink", "subs": [{"id": "l1", "label": "Nghe & làm bài", "kind": "fill", "items": [{"q": "The___simple banh my is more popular than any thing early In the morning in Vietnam.", "a": ["fantastically"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Bánh mỳ đơn giản_________phổ biến hơn bất kỳ thứ gì vào sáng sớm ở Việt Nam.</p><p><b>Giải thích: </b>Thông tin có ở câu: “Driving through the streets in Vietnam early in the morning, there is one dish you will see more than anything - the fantastically simple banh my.”</p>"}, {"q": "Even the roots of the name can be___to French colonial period.", "a": ["traced back"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Ngay cả nguồn gốc của cái tên cũng được_________thời Pháp thuộc.</p><p><b>Giải thích:</b> Thông tin có ở câu: “This sandwich can also be traced back to the French colonial period, even through the roots of the name; [...]”</p>"}, {"q": "Firstly, this kind of bread was only available in___.", "a": ["expensive bakeries"], "exp": "<p><b>Dịch nghĩa câu hỏi:</b> Ban đầu loại bánh mì này chỉ có sẵn trong các_________.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Initially this dish was imported and only sold by expensive bakeries [...]”</p>"}, {"q": "The___of the dish were changed, so that it became more accessible.", "a": ["ingredients"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>:_________của món ăn đã được thay đổi, để nó trở nên dễ tiếp cận hơn.</p><p><b>Giải thích</b>: Thông tin có ở câu: “[...] however it began to spread to the masses when the Vietnamese working class discovered ways to change the ingredients and make it more accessible.”</p>"}, {"q": "Banh my is a favourite meal of many people because of its fusion of Vietnamese and French___.", "a": ["flavours"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Bánh mỳ là bữa ăn yêu thích của nhiều người do sự hợp nhất của__________Việt Nam và Pháp.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The fusion of flavours between the Vietnamese fillings and French baguette makes this delicious meal a favourite of many.”</p>"}], "before": "<div class=\"note\">Giọng đọc tổng hợp từ lời thoại trong tài liệu.</div><button class=\"btn solid\" onclick=\"say(LISTEN)\">▶ Nghe</button> <button class=\"btn\" onclick=\"speechSynthesis.cancel()\">■ Dừng</button>"}, {"label": "Lời thoại & bản dịch", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p>Driving through the streets in Vietnam early in the morning, there is one dish you will see more than anything - the fantastically simple banh my. This sandwich can also be traced back to the French colonial period, even through the roots of the name; banh is pronounced similarly to the French word for bread (pain) and literally translates into “bread made from wheat.” Initially this dish was imported and only sold by expensive bakeries; however it began to spread to the masses when the Vietnamese working class discovered ways to change the ingredients and make it more accessible. Today the typical Vietnamese banh my consists of mayonnaise, pâté, sliced ham and pork, pickled vegetables, coriander, and hot sauce. The fusion of flavours between the Vietnamese fillings and French baguette makes this delicious meal a favourite of many.</p></td><td><p>Lái xe qua đường phố ở Việt Nam vào sáng sớm, có một món mà bạn sẽ thấy nhiều hơn bất cứ thứ gì - món bánh mỳ đơn giản đến tuyệt vời. Loại bánh này cũng có thể được bắt nguồn từ thời Pháp thuộc, thậm chí thông qua nguồn gốc cái tên của nó; “Bánh” được phát âm tương tự như từ chỉ bánh mỳ trong tiếng Pháp (pain) và dịch theo nghĩa đen là “bánh làm từ lúa mì”. Ban đầu món ăn này được nhập khẩu và chỉ được bán bởi các tiệm bánh đắt tiền, tuy nhiên nó bắt đầu lan rộng ra toàn dân khi tầng lớp lao động Việt Nam phát hiện ra cách để thay đổi các thành phần và làm cho nó dễ tiếp cận hơn. Ngày nay, món bánh mỳ đặc trưng của Việt Nam bao gồm sốt ma-don-ne, pa- tê, giăm bông và thịt lợn, rau muối, rau mùi và nước sốt nóng. Sự hợp nhất của các hương vị giữa các chất phụ gia của Việt Nam và bánh mỳ Pháp khiến nó trở thành món ăn ngon của nhiều người.</p></td></tr></table></div></div>"}]}, {"title": "Speaking · Nói", "icon": "💬", "desc": "Unit 5 · Vietnamese Food and Drink", "subs": [{"label": "Đề bài & hướng dẫn", "html": "<div class=\"source\"><p><b>Talk about the your favourite Vietnamese food.</b></p><p>You can use the following questions as cues:</p><p>•What is that Vietnamese food?</p><p>•What are the ingredients?</p><p>•When do people eat this food?</p><p><b>Useful languages:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Useful vocabulary</b></p></td><td><p><b>Useful structures</b></p></td></tr><tr><td><p>• noodle soup, steamed rice cake, Chung cake, spring rolls</p><p>• beef, rice powder, pork, vermicelli</p><p>• breakfast, any occasion, Tet holiday, family reunion</p></td><td><p>• Vietnam has so many...and my favourite one is...</p><p>•People can eat...at..., but...</p><p>• We can eat this food at/in...</p><p>•Its ingredients include...</p><p>•...is made from...</p><p>•can be made with...</p><p>•... is prepared by...</p><p>•... makes the food...</p><p>• ...give the taste of...</p><p>•I like...very much, and I often eat it...</p></td></tr></table></div><p><b>Complete the notes:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Structures of the talk</b></p></td><td><p><b>Your notes</b></p></td></tr><tr><td><p>What is that Vietnamese food?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>What are the ingredients?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>When do people eat this food?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr></table></div><p><b>Now you try!</b></p><p><b>Give your answer using the following cues. You should speak for 1-2 minutes.</b></p><p>1. Vietnam has so many...and my favourite one is...</p><p>2. People can eat...at..., but...</p><p>3. Its ingredients include...</p><p>4. ...is made from...</p><p>5. ... is prepared by...</p><p>6. ... makes the food...</p><p>7. I like...very much, and I often eat it...</p><p><b>Now you tick!</b></p><p><b>Did you ...</b></p><p> answer all the questions in the task?</p><p> give some details to each main point?</p><p> speak slowly and fluently with only some hesitation?</p><p> use vocabulary wide enough to talk about the topic?</p><p> use various sentence structures (simple, compound, complex) accurately?</p><p> pronounce correctly (vowels, consonants, stress, intonation)?</p><p><b> </b><b>Let’s compare!</b></p><p>Finally, compare with the sample answer on page 193.</p></div>"}, {"label": "Ghi chú luyện nói", "kind": "notes"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>Talk about the your favourite Vietnamese food.</b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Nói về món ăn Việt Nam yêu thích của bạn.</p><p>Bạn có thể sử dụng các câu hỏi sau đây như gợi ý:</p><p>• Món ăn Việt Nam đó là gì?</p><p>• Các thành phần là gì?</p><p>• Khi nào mọi người ăn thực phẩm này?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Foods (Đồ ăn)</b></p><p>- noodle soup <i>(n.phr</i>.) (phở)</p><p>- steamed rice cake <i>(n.phr</i>.) (bánh cuốn)</p><p>- Chung cake (<i>n.phr</i>.) (bánh Chưng)</p><p>- spring rolls (<i>n.phr</i>.) (nem rán)</p><p><b>Ingredients (Nguyên liệu)</b></p><p>- beef (<i>n</i>.) (thịt bò)</p><p>- rice powder (<i>n.phr</i>.) (bột gạo)</p><p>- pork (<i>n</i>.) (thịt lợn)</p><p>- vermicelli <i>(n</i>.) (miến)</p><p><b>When to eat (Ăn khi nào)</b></p><p>- for breakfast (<i>prep. phr.</i>) (ăn sáng)</p><p>- on any occasion (<i>prep. phr</i>.) (bất cứ dịp nào)</p><p>- for family reunion (<i>prep. phr</i>.) (sum họp gia đình)</p><p>- on Tet holiday (<i>prep. phr</i>.)(Tết)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>Vietnam has so many delicious foods, and my favourite one is &quot;Pho&quot;. People can eat noodle soup at any time, but it’s most popular in the morning. Sts ingredients include rice noodle, pig bones, pork or chicken and herbs. Rice noodle, made from rice powder, is soft and white. The broth is prepared in advance by stewing pig bones. The fusion of sweet flavour of meat and soup makes the food unforgettably tasty. I like &quot;Pho&quot; very much, and I often eat this food in the morning before going to school.</p></td><td><p>Việt Nam có rất nhiều món ăn ngon và món ăn Việt mà em yêu thích là phở. Người ta có thể ăn phở vào bất cứ thời gian nào trong ngày nhưng phổ biến nhất là vào buổi sáng. Nguyên liệu bao gồm bánh phở, xương lợn, thịt lợn hoặc thịt gà và các loại rau thơm. Bánh phở làm từ bột gạo, mềm và trắng. Nước dùng được chuẩn bị trước bằng cách ninh xương lợn. Vị ngọt của thịt hòa quyện với hương thơm nước dùng khiến món án càng thêm đậm đà, khó quên. Em rất thích phở và thường ăn mỗi sáng trước trước khi đi học.</p></td></tr></table></div></div>"}]}, {"title": "Writing · Viết", "icon": "✍️", "desc": "Unit 5 · Vietnamese Food and Drink", "subs": [{"id": "w1", "label": "I · Viết câu", "kind": "write", "items": [{"c": "There/ be/ many/ tasty drink/ Vietnam/ like/ fresh coconut/ sugar cane juice.", "a": "There are many tasty drinks in Vietnam like fresh coconut and sugar cane juice.", "vi": "  Dịch nghĩa : Có nhiều đồ uống ngon ở Việt Nam như dừa tươi và nước mía. "}, {"c": "These drinks/ be/ cool/ it/ be/ good/ drink/ hot days.", "a": "These drinks are cool and it is good to drink on hot days.", "vi": "  Dịch nghĩa : Những đồ uống này rất mát và rất tốt để uống trong những ngày nóng. "}, {"c": "It/ be/ also easy/ make/ these drinks/ coconut/ sugar cane.", "a": "It is also easy to make these drinks with coconut and sugar cane.", "vi": "  Dịch nghĩa : Cũng dễ dàng để làm những đò uống này từ dừa và mía. "}, {"c": "cool/ tasty flavour/ make/ drinkers/ refresh quickly.", "a": "The cool and tasty flavour make drinkers refresh quickly.", "vi": "  Dịch nghĩa:  Hương vị mát và ngon làm cho người uống tỉnh táo nhanh chóng. "}, {"c": "Many people/ drink/ coconut/ sugar cane juice/ regularly.", "a": "Many people drink coconut and sugar cane juice regularly.", "vi": "  Dịch nghĩa : Nhiều người uống nước dừa và nước mía thường xuyên. "}], "before": ""}, {"label": "II · Viết 60–80 từ", "kind": "writing", "html": "<div class=\"source\"><p><b>II - Write a short paragraph (60 - 80 words) about your favourite Vietnamese drink. You can use the following questions as cues:</b></p><p><b>• </b>What is your favourite drink?</p><p>• What are the ingredients?</p><p>• When do you drink it?</p><p>__________________________________________________________________</p><p>__________________________________________________________________</p></div>"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>II - Write a short paragraph (60-80 words) about your favourite Vietnamese drink.</b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Viết một đoạn văn ngắn (60-80 từ) về đồ uống Việt Nam yêu thích của em.</p><p>Em có thể trả lời một số câu hỏi sau:</p><p>• Thức uống yêu thích của em là gì?</p><p>• Các thành phần của nó là gì?</p><p>• Khi nào nên uống?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Drinks (Đồ uống)</b></p><p>- lemonade (<i>n</i>.) (nước chanh)</p><p>- sugar cane juice (<i>n. phr</i>.) (nước mía)</p><p>- beer (<i>n.</i>) (bia)</p><p>- freshcoconut (<i>n.phr.)</i> (nước dừa)</p><p><b>Ingredients (Nguyên liệu)</b></p><p>- water (<i>n</i>.) (nước)</p><p>- lemon (<i>n</i>.) (chanh)</p><p>- sugar (<i>n</i>.) (đường)</p><p>- sugar cane (<i>n. phr</i>.) (mía)</p><p><b>When (Khi nào)</b></p><p>- after breakfast (<i>pre. phr</i>.) (sau bữa sáng)</p><p>- after school (<i>pre. phr</i>.) (sau giờ học)</p><p>- after doing sports (<i>pre. phr</i>.) (sau khi tập thể thao)</p><p>- before bedtime (<i>pre. phr</i>.) (trước khi đi ngủ)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>There are many tasty and nutrient drinks in Vietnam, and I like lemonade the best. This is a cool and cheap drink. This drink is good to cool your body, so it is very suitable to drink it on hot days of summer. The way to make it is also very simple with water, sugar, lemon and ice. What we have to do is to dissolve sugar in water, squeeze lemon into the solution and add some ice. Cool taste, flavour of lemon and cool ice make drinkers refresh immerdiately. I often drink lemonade after doing sports, and I think this is the best drink for me.</p></td><td><p>Có nhiều đồ uống ngon và bổ dưỡng nhưng đồ uống mà em yêu thích nhất là nước chanh. Đây là loại nước giải khát mát và rẻ. Đồ uống này có tác dụng giải nhiệt tốt nên rất thích hợp uống vào những ngày hè nóng nực. Cách pha cũng hết sức đơn giản với các nguyên liệu như nước, đường, chanh và đá. Chỉ cần hòa đường với nước, sau đó vắt chanh vào và thêm đá. Vị thanh mát và hương thơm của chanh cùng với cảm giác mát lạnh của đá khiến người uống như tỉnh táo trở lại ngay lập tức. Em thường uống nước chanh mỗi khi chơi thể thao xong và cảm thấy đây là thức uống tuyệt vời nhất với em.</p></td></tr></table></div></div>"}]}, {"title": "Objectives · Mục tiêu", "icon": "🎯", "desc": "Unit 5 · Vietnamese Food and Drink", "subs": [{"label": "Mục tiêu", "html": "<div class=\"source\"><p><b>UNIT </b><b>5</b><b> </b></p><p><b>VIETNAMESE FOOD AND DRINK</b></p><p>Đồ ăn và thức uống Việt Nam</p><p><b>MỤC TIÊU – Objectives</b></p><p>* <b>TỪ VỰNG</b> – Vocabulary</p><p>Sử dụng các từ vựng liên quan đến chủ đề “Đồ ăn và thức uống Việt Nam”</p><p>* <b>NGỮ ÂM</b> – Pronunciation</p><p>Phát âm chính xác các âm nguyên âm /<b>ɒ</b>/ và /<b>ɔ:</b>/ đứng riêng lẻ và trong ngữ cảnh</p><p>* <b>NGỮ PHÁP</b> – Grammar</p><p>Phân biệt danh từ đếm được và danh từ không đếm được</p><p>Sử dụng <i><b>a/an, some/any</b></i> và <i><b>How much</b></i> và <i><b>How many</b></i> để hỏi và nói về số lượng.</p><p><b>* KỸ NĂNG ĐỌC</b> – Reading skills</p><p>Đọc để biết thông tin cụ thể về thực phẩm và đồ uống truyền thống điển hình</p><p>* <b>KỸ NĂNG NÓI</b> – Speaking skills</p><p>Nói về cách làm một loại thức ăn / đồ uống</p><p>* <b>KỸ NĂNG NGHE</b> – Listening Skills</p><p>Nghe thông tin cụ thể về các loại thực phẩm và đồ uống truyền thống</p><p>* <b>KỸ NĂNG VIẾT</b> – Writing skills</p><p>Viết một lá thư mô tả một người nào đó thức ăn / thức uống địa phương</p><p><b>A – NGÔN NGỮ</b></p></div>"}]}];
const V12=[{"w": "beat", "p": "/biːt/", "pos": "v.", "vi": "khuấy trộn, đánh trộn", "ex": "To make an omelette, you first beat the eggs. (Để làm món trứng tráng, trước hết bạn hãy đánh trứng)"}, {"w": "beef", "p": "/biːf/", "pos": "n.", "vi": "thịt bò", "ex": "I’m wondering whether to have the first or the beef. (Tôi đang suy nghĩ không biết nên ăn cá hay thịt bò)"}, {"w": "bitter", "p": "/ˈbɪtə(r)/", "pos": "adj.", "vi": "đắng", "ex": "Bitter melon is bitter because it has quinine. (Mướp đắng có vị đắng vì nó có chứa chất Quinin)"}, {"w": "broth", "p": "/brɒθ/", "pos": "n.", "vi": "nước xuýt", "ex": "The broth is the most important element of Vietnamese “pho”. (Nước xuýt là thành phần quan trọng nhất trong món phở Việt Nam)"}, {"w": "delicious", "p": "/dɪˈlɪʃəs/", "pos": "adj.", "vi": "ngon, thơm ngon", "ex": "I’ve had such a delicous meal. (Tôi đã có một bữa ăn tuyệt ngon)"}, {"w": "eel", "p": "/iːl/", "pos": "n.", "vi": "con lươn", "ex": "Eel soup is good for your health as it’s rich in vitamins. (Súp lươn tốt cho sức khỏe của bạn vì nó giàu vi-ta-min)"}, {"w": "flour", "p": "/ˈflaʊə(r)/", "pos": "n.", "vi": "bột", "ex": "I need three more cups of flour. (Tôi cần thêm ba chén bột nữa)"}, {"w": "fold", "p": "/fəʊld/", "pos": "v.", "vi": "gấp, gập", "ex": "I know how to fold clothes quickly. (Tôi biết cách gấp quần áo nhanh)"}, {"w": "fragrant", "p": "/ˈfreɪɡrənt/", "pos": "adj.", "vi": "thơm, thơm phức", "ex": "The dish is fragrant and elegant. (Món ăn này thơm và tinh tế)"}, {"w": "green tea", "p": "/ˌɡriːn ˈtiː/", "pos": "n.", "vi": "chè xanh", "ex": "Many people in Japan drink five cups of green tea a day. (Nhiều người ở Nhật Bản uống 5 cốc chè xanh mỗi ngày)"}, {"w": "ham", "p": "/hæm/", "pos": "n.", "vi": "giăm bông", "ex": "Would you like another slice of ham? (Bạn có muốn một lát giăm bông nữa không?)"}, {"w": "noodles", "p": "/ˈnuːdl/", "pos": "n.", "vi": "mì, mì sợi", "ex": "You shouln’t eat instant noodles regularly. (Bạn không nên ăn mì ăn liền thường xuyên)"}, {"w": "omelette", "p": "/ˈɒmlət/", "pos": "n.", "vi": "trứng tráng", "ex": "Mum made me an omelette for breakfast. (Mẹ đã làm cho tôi món trứng tráng cho bữa sáng)"}, {"w": "pancake", "p": "/ˈpænkeɪk/", "pos": "n.", "vi": "bánh kếp", "ex": "He poured some syrup on his stack of pancakes. (Anh rưới chút xi-ro lên chồng bánh kếp)"}, {"w": "pepper", "p": "/ˈpepə(r)/", "pos": "n.", "vi": "hạt tiêu", "ex": "The waiter ground a little black pepper over my pizza. (Người phục vụ nghiền một ít hạt tiêu đen lên trên bánh pizza của tôi)"}, {"w": "pork", "p": "/pɔːk/", "pos": "n.", "vi": "thịt lợn", "ex": "We can make various dishes out of pork. (Ta có thể làm nhiều món ăn từ thịt lợn)"}, {"w": "pour", "p": "/pɔː(r)/", "pos": "v.", "vi": "rót, đồ", "ex": "Pour 500ml of warm water into the bowl. (Hãy rót 500ml nước ấm vào bát)"}, {"w": "recipe", "p": "/ˈresəpi/", "pos": "n.", "vi": "công thức làm món ăn", "ex": "He never reveals his recipe to other people. (Anh ta không bao giờ tiết lộ công thức nấu ăn của mình cho người khác)"}, {"w": "salt", "p": "/sɔːlt/", "pos": "n.", "vi": "muối", "ex": "You need to add more salt to this salad. (Bạn cần thêm muối vào món sa-lát này)"}, {"w": "salty", "p": "/ˈsɔːlti/", "pos": "adj.", "vi": "mặn, có nhiều muối", "ex": "It’s surprising this drink is salty. (Thật ngạc nhiên là đồ uống này lại mặn)"}, {"w": "sandwich", "p": "/ˈsænwɪtʃ/", "pos": "n.", "vi": "bánh xăng-đuých", "ex": "What would you like in your sandwich? (Bạn muốn cho gì vào bánh xăng-đuých của bạn?)"}, {"w": "sauce", "p": "/sɔːs/", "pos": "n.", "vi": "nước xốt", "ex": "Don’t forget to add some tomato sauce to your spaghette! (Đừng quên thêm nước xốt cà chua vào món mỳ Ý nhé!)"}, {"w": "sausage", "p": "/ˈsɒsɪdʒ/", "pos": "n.", "vi": "xúc xích", "ex": "He loves to eat sausages with rice and beans. (Anh ấy thích ăn xúc xích với món cơm đậu)"}, {"w": "serve", "p": "/sɜːv/", "pos": "v.", "vi": "múc/ xới/ gắp ra để ăn", "ex": "I’ll serve the broth for you. (Tôi sẽ múc nước xuýt cho bạn)"}, {"w": "shrimp", "p": "/ʃrɪmp/", "pos": "n.", "vi": "con tôm", "ex": "Cook the shrimps until they turn bright pink (Nấu tôm cho tới khi chúng chuyển sang màu hồng sáng)"}, {"w": "slice", "p": "/slaɪs/", "pos": "n.", "vi": "miếng mỏng, lát mỏng", "ex": "She cut the cucumber into slices. (Cô ấy cắt quả dưa chuột thành các lát mỏng)"}, {"w": "soup", "p": "/suːp/", "pos": "n.", "vi": "xúp, canh, cháo", "ex": "You’ll feel better with this bowl of hot soup. (Bạn sẽ cảm thấy khỏe hơn sau khi ăn bát canh nóng này)"}, {"w": "sour", "p": "/ˈsaʊə(r)/", "pos": "adj.", "vi": "chua", "ex": "I love the sour flavour of this cake. (Tôi thích vị chua của chiếc bánh này)"}, {"w": "spicy", "p": "/ˈspaɪsi/", "pos": "adj.", "vi": "cay, nồng", "ex": "My parents cannot eat spicy food. (Bố mẹ tôi không ăn được đồ cay)"}, {"w": "spring rolls", "p": "/ˌsprɪŋ ˈrəʊlz/", "pos": "n.", "vi": "nem rán", "ex": "Many foreign tourists are into Vietnamese spring rolls. (Nhiều du khách nước ngoài thích mê nem rán của Việt Nam)"}, {"w": "sweet", "p": "/swiːt/", "pos": "adj.", "vi": "ngọt", "ex": "These candies are too sweet for me. (Những cái kẹo này quá ngọt đối với tôi)"}, {"w": "sweet soup", "p": "/swiːt suːp/", "pos": "n.", "vi": "chè", "ex": "Sweet soup is our favourite food in the summer. (Chè là món ăn yêu thích của chúng tôi vào mùa hạ)"}, {"w": "tasty", "p": "/ˈteɪsti/", "pos": "adj.", "vi": "đầy hương vị, ngon", "ex": "Her food is always tasty! (Đồ ăn của cô ấy luôn rất ngon)"}];
const LISTEN="Driving through the streets in Vietnam early in the morning, there is one dish you will see more than anything - the fantastically simple banh my. This sandwich can also be traced back to the French colonial period, even through the roots of the name; banh is pronounced similarly to the French word for bread (pain) and literally translates into “bread made from wheat.” Initially this dish was imported and only sold by expensive bakeries; however it began to spread to the masses when the Vietnamese working class discovered ways to change the ingredients and make it more accessible. Today the typical Vietnamese banh my consists of mayonnaise, pâté, sliced ham and pork, pickled vegetables, coriander, and hot sauce. The fusion of flavours between the Vietnamese fillings and French baguette makes this delicious meal a favourite of many. ";
