ng âm nhấn vào âm tiết thứ nhất.</p><p><b>A</b>. recipe /ˈresəpi/<b>B</b>. triangle /ˈtraɪæŋɡl/  <b>D</b>. plentiful /ˈplentɪfl/ </p><p><b>6.Đáp án: B</b>. effect</p><p><b>Giải thích</b>: effect /ɪˈfekt/ có trọng âm nhấn vào âm tiết thứ hai, các phương án còn lại có trọng âm nhấn vào âm tiết thứ nhất.</p><p><b>A</b>. omelette /ˈɒmlət/ <b>C</b>. anthem /ˈænθəm/ <b>D</b>. statue /ˈstætʃuː/</p><p><b>7.Đáp án</b>: D. tuna</p><p><b>Giải thích</b>: tuna /ˈtjuːnə/ có trọng âm nhấn vào âm tiết thứ nhất, các phương án còn lại có trọng âm nhấn vào âm tiết thứ hai.</p><p><b>A</b>.regard /rɪˈɡɑːd/<b>B</b>. compose compose<b>C</b>. affect /əˈfekt/</p><p><b>8.Đáp án: A</b>. diverse</p><p><b>Giải thích</b>: diverse /daɪˈvɜːs/ có trọng âm nhấn vào âm tiết thứ hai, các phương án còn lại có trọng âm nhấn vào âm tiết thứ nhất.</p><p><b>B</b>.sporty /ˈspɔːti/<b>C</b>. athlete /ˈæθliːt/ <b>D</b>. metro /ˈmetrəʊ/</p><p><b>9.Đáp án: B</b>. explosion</p><p><b>Giải thích</b>: explosion /ɪkˈspləʊʒn/ có trọng âm nhấn vào âm tiết thứ hai, các phương án còn lại có trọng âm nhấn vào âm tiết thứ nhất.</p><p><b>A</b>. educate /ˈedʒukeɪt/<b>C</b>. ice-skating /ˈaɪs skeɪtɪŋ/<b>D</b>. driverless /ˈdraɪvələs/</p><p><b>10. Đáp án: D</b>. marathon</p><p><b>Giải thích</b>: marathon /ˈmærəθən/ có trọng âm nhấn vào âm tiết thứ nhất, các phương án còn lại có trọng âm nhấn vào âm tiết thứ hai.</p><p><b>A</b>. apartment /əˈpɑːtmənt/ <b>B</b>. museum /mjuˈziːəm/<b>C</b>. exhausted /ɪɡˈzɔːstɪd/</p><p><b>11. Đáp án: B</b>. rooster</p><p><b>Giải thích</b>: rooster /ˈruːstə(r)/ có trọng âm nhấn vào âm tiết thứ nhất, các phương án còn lại có trọng âm nhấn vào âm tiết thứ hai.</p><p><b>A</b>. support /səˈpɔːt/<b>C</b>. compose /kəmˈpəʊz/ <b>D</b>. hi-tech /ˌhaɪ ˈtek/</p><p><b>12. Đáp án: D</b>. construct</p><p><b>Giải thích</b>: construct /kənˈstrʌkt/ có trọng âm nhấn vào âm tiết thứ hai, các phương án còn lại có trọng âm nhấn vào âm tiết thứ nhất.</p><p><b>A</b>. science /ˈsaɪəns/<b>B</b>. safely /ˈseɪfli/<b>C</b>. spicy /ˈspaɪsi/</p><p><b>13. Đáp án: A</b>. market</p><p><b>Giải thích</b>: market /ˈmɑːkɪt/ có trọng âm nhấn vào âm tiết thứ nhất, các phương án còn lại có trọng âm nhấn vào âm tiết thứ hai.</p><p><b>B</b>. affect /əˈfekt/<b>C.</b> surround /səˈraʊnd/  <b>D</b>. unique /juˈniːk/</p><p><b>14. Đáp án: B</b>. recommend</p><p><b>Giải thích</b>: recommend /ˌrekəˈmend/ có trọng âm nhấn vào âm tiết thứ ba, các phương án còn lại có trọng âm nhấn vào âm tiết thứ nhất.</p><p><b>A</b>. poverty /ˈpɒvəti/ <b>C</b>. biogas /ˈbaɪəʊɡæs/  <b>D</b>. cultural /ˈkʌltʃərəl/</p><p><b>15. Đáp án: C</b>. unusual</p><p><b>Giải thích</b>: unusual /ʌnˈjuːʒuəl/ có trọng âm nhấn vào âm tiết thứ hai, các phương án còn lại có trọng âm nhấn vào âm tiết thứ nhất.</p><p><b>A</b>. density /ˈdensəti/<b>B</b>. seasonal /ˈsiːzənl/<b>D.</b> recognise /ˈrekəɡnaɪz/</p></div>"}]}, {"title": "Grammar · Ngữ pháp", "icon": "🧩", "desc": "Unit 12 · An overcrowded world", "subs": [{"label": "More / less / fewer", "html": "<div class=\"source\"><p><b>1. SO SÁNH VỀ SỐ LƯỢNG VỚI </b><i><b>MORE, LESS/ FEWER</b></i><b> </b>(COMPARISONS OF QUANTIFIERS: <i>MORE, LESS/ FEWER</i>) </p><p><i><b>a. So sánh nhiều hơn với more</b></i></p><div class=\"tablewrap\"><table><tr><td><p>* Cấu trúc 1:</p><div class=\"tablewrap\"><table><tr><td><p><i><b>more</b></i></p></td><td><p>Danh từ không đếm được</p></td><td><p><b>than</b></p></td></tr><tr><td><p><b></b></p></td><td><p>Food</p><p>(<i>đồ ăn</i>)</p></td><td><p>Traffic</p><p>(<i>giao thông</i>)</p></td><td><p>Pollution</p><p>(<i>ô nhiễm</i>)</p></td><td></td></tr></table></div></td><td><p><b>Ví dụ:</b></p><p>Children in wealthy areas have <b>more food than</b> those in the slums.</p><p>(<i>Trẻ em ở những nơi giàu sang có nhiều đồ ăn hơn những đứa trẻ sống trong khu ổ chuột.)</i></p></td></tr><tr><td><p>* Cấu trúc 2:</p><div class=\"tablewrap\"><table><tr><td><p><i><b>more</b></i></p></td><td><p>Danh từ đếm được số nhiều</p></td><td><p><b>than</b></p></td></tr><tr><td><p><b></b></p></td><td><p>Problems</p><p>(<i>vấn đề</i>)</p></td><td><p>criminals</p><p>(<i>tội phạm</i>)</p></td><td><p>diseases</p><p>(<i>bệnh tật</i>)</p></td><td></td></tr></table></div></td><td><p><b>Ví dụ:</b></p><p>A big city has <b>more problems than</b> the countryside.</p><p>(<i>Một thành phố lớn có nhiều vấn đề hơn ở nông thôn.)</i></p></td></tr></table></div><p><i><b>b. So sánh ít hơn với less/ fewer</b></i></p><div class=\"tablewrap\"><table><tr><td><p>* Cấu trúc 1:</p><div class=\"tablewrap\"><table><tr><td><p><i><b>less</b></i></p></td><td><p>Danh từ không đếm được</p></td><td><p><b>than</b></p></td></tr><tr><td><p><b></b></p></td><td><p>money</p><p>(<i>tiền</i>)</p></td><td><p>Clean water</p><p>(<i>nước sạch</i>)</p></td><td><p>nutrition</p><p>(<i>dinh dưỡng</i>)</p></td><td></td></tr></table></div></td><td><p><b>Ví dụ:</b></p><p>People living in the countryside earn <b>less money than</b> those in the megacities.</p><p>(<i>Những người sống ở nông thôn kiếm được ít tiền hơn so với những người sống ở siêu đô thị.)</i></p></td></tr><tr><td><p>* Cấu trúc 2:</p><div class=\"tablewrap\"><table><tr><td><p><i><b>fewer</b></i></p></td><td><p>Danh từ đếm được số nhiều</p></td><td><p><b>than</b></p></td></tr><tr><td><p><b></b></p></td><td><p>slums</p><p>(<i>khu ổ chuột</i></p></td><td><p>causes</p><p>(<i>nguyên nhân</i>)</p></td><td><p>solutions</p><p>(<i>giải pháp</i>)</p></td><td></td></tr></table></div></td><td><p><b>Ví dụ:</b></p><p>In my country, there are <b>fewer slums</b> now <b>than</b> ten years ago.</p><p>(<i>Bây giờ đất nước tôi có ít khu ổ chuột hơn so với mười năm trước.)</i></p></td></tr></table></div></div>"}, {"label": "Câu hỏi đuôi", "html": "<div class=\"source\"><p><b>2. CÂU HỎI ĐUÔI</b> (TAG QUESTIONS)</p><p><b>a. Định nghĩa</b></p><div class=\"tablewrap\"><table><tr><td><p>Câu hỏi đuôi là câu hỏi gồm một mệnh đề chính và phần láy đuôi được đặt ở cuối câu (sau dấu phẩy) để xác minh xem thông tin là đúng hay không hoặc khi muốn người nghe hồi đáp về điều gì đó.</p><div class=\"tablewrap\"><table><tr><td><p><b>Mệnh đề chính</b></p><p>(Main clause)</p></td><td><p>,</p></td><td><p><b>Phần láy đuôi</b></p><p>(Question tag)</p></td></tr></table></div></td><td><p><b>Ví dụ:</b></p><p><u>You haven’t finished your homework, have you?</u></p><p>(<i>Con vẫn chưa hoàn thành bài tập về nhà, phải không?)</i></p></td></tr></table></div><p><b>Chú ý:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>MỆNH ĐỀ CHÍNH KHẲNG ĐỊNH (+)</b></p></td><td><p><b>PHẦN LÁY ĐUÔI PHỦ ĐỊNH (-)</b></p></td></tr><tr><td><p>She <u><b>is </b></u>a scientist,</p><p>(<i>Cô ấy là một nhà khoa học,</i></p></td><td><p><u><b>isn’t </b></u>she? </p><p><i>phải không?)</i></p></td></tr><tr><td><p>His father <u><b>works</b></u> for this company</p><p>(<i>Bố anh ấy làm việc cho công ty này,</i></p></td><td><p><u><b>doesn’t</b></u> he? </p><p><i>phải không?)</i></p></td></tr><tr><td><p><b>MỆNH ĐỀ CHÍNH PHỦ ĐỊNH (-)</b></p></td><td><p><b>PHẦN LÁY ĐUÔI KHẲNG ĐỊNH (+)</b></p></td></tr><tr><td><p>She <u><b>isn’t</b></u> a scientist,</p></td><td><p><u><b>is</b></u> she?</p></td></tr><tr><td><p><i>(Cô ấy không phải là một nhà khoa học</i>,</p></td><td><p><i>phải không?)</i></p></td></tr><tr><td><p>His father <u><b>doesn’t works</b></u> for this company,</p></td><td><p><u><b>does</b></u> he?</p></td></tr><tr><td><p><i>(Bố anh ấy không làm việc cho công ty này</i>,</p></td><td><p><i>phải không?)</i></p></td></tr></table></div><p><b>b. Các dạng câu hỏi đuôi</b></p><div class=\"tablewrap\"><table><tr><td><p>* Dạng 1:</p><div class=\"tablewrap\"><table><tr><td><p><b>Mệnh đề chính</b></p></td><td><p><b></b></p></td><td><p><b>Phần láy đuôi</b></p></td></tr><tr><td><p>Chủ ngữ</p></td><td><p>Động từ thường</p></td><td><p>,</p></td><td><p>Trợ động từ</p></td><td><p>đại từ</p></td></tr></table></div></td><td><p><b>Ví dụ:</b></p><p>Hoa <b>likes</b> pizza, <u><b>doesn’t</b></u> she? (<i>Hoa thích pizza, phải không?)</i></p></td></tr><tr><td><p>* Dạng 2:</p><div class=\"tablewrap\"><table><tr><td><p><b>Mệnh đề chính</b></p></td><td><p><b></b></p></td><td><p><b>Phần láy đuôi</b></p></td></tr><tr><td><p>Chủ ngữ</p></td><td><p>Động từ to be</p></td><td><p>,</p></td><td><p>động từ to be</p></td><td><p>đại từ</p></td></tr></table></div></td><td><p><b>Ví dụ:</b></p><p>Your son <b>is</b> an actor, <u><b>isn’t</b></u> he?</p><p>(<i>Con trai bạn là một diễn viên, phải không</i>?)</p></td></tr><tr><td><p>* Dạng 3:</p><div class=\"tablewrap\"><table><tr><td><p><b>Mệnh đề chính</b></p></td><td><p><b></b></p></td><td><p><b>Phần láy đuôi</b></p></td></tr><tr><td><p>Chủ ngữ</p></td><td><p>Động từ khuyết thiếu</p></td><td><p>,</p></td><td><p>động từ khuyết thiếu</p></td><td><p>đại từ</p></td></tr></table></div></td><td><p><b>Ví dụ:</b></p><p>You <b>can </b>speak English very well, <u><b>can’t</b></u> you? <i>(Bạn có thể nói tiếng Anh rất tốt, phải không?)</i></p></td></tr></table></div><p><b>c. Cách thành lập phần láy đuôi</b></p><div class=\"tablewrap\"><table><tr><td><p><b>CÁC BƯỚC LÀM</b></p></td><td><p><b>VÍ DỤ</b></p><p>Your sister sings very beautifully, ....</p></td></tr><tr><td><p>1. Xác định <b>động từ</b> được sử dụng trong mệnh đề chính và <b>thì</b> của nó</p></td><td><p><i>Mệnh đề chính</i>: <i>động từ thường &quot;sings&quot; được chia ở thì hiện đơn</i></p></td></tr><tr><td><p>2.Từ đó suy ra <b>trợ động từ/ to be/ động từ</b> <b>khuyết thiếu</b> ở phần láy đuôi <b>phù hợp với thì</b> </p><p>của động từ <b>và chủ ngữ</b> ở mệnh đề chính.</p></td><td><p><i>Phần láy đuôi: trợ động từ ở thì hiện tại đơn chia theo chủ ngữ số ít “Your sister”: does/ doesn’t</i></p></td></tr><tr><td><p>3.Xác định mệnh đề chính ở dạng <b>khẳng định</b> </p><p><b>hay phủ định.</b></p><div class=\"tablewrap\"><table><tr><td><p>Mệnh đề chính</p></td><td><p>Phần láy đuôi</p></td></tr><tr><td><p>Khẳng định (+)</p></td><td><p>Phủ định (-)</p></td></tr><tr><td><p>Phủ định (-)</p></td><td><p>Khẳng định (+)</p></td></tr></table></div></td><td><p><i>Mệnh đề chính: dạng khẳng định</i></p><p><i>→ </i><i>Phần láy đuôi: dạng phủ định: doesn’t</i></p></td></tr><tr><td><p>4.Chọn <b>đại từ</b> ở phần láy đuôi tương ứng với <b>chủ ngữ </b>ở mệnh đề chính.</p></td><td><p>Mệnh đề chính: chủ ngữ số ít &quot;your sister&quot; giới tính nữ</p><p>→ Phần láy đuôi: đại từ: she</p><p><b>Câu hỏi đuôi:</b></p><p>Your sister sings very beautifully, <b>doesn’t she</b>?</p><p><i>(Chị gái bạn hát rất hay, phải không?)</i></p></td></tr></table></div><p><b>d. Câu hỏi đuôi ở một số thì đã học</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Hiện tại đơn</b></p></td><td><p><u>She</u> <b>is</b> your teacher, <b>isn’t</b> <u>she</u>?</p><p>(<i>Cô ấy là cô giáo của bạn phải không?)</i></p><p><u>Your parents </u><b>don’t</b> go to work on Saturday, <b>do</b> <u>they</u>? </p><p>(<i>Bố mẹ cậu không đi làm vào thứ Bảy phải không?)</i></p></td></tr><tr><td><p><b>Hiện tại tiếp diễn</b></p></td><td><p>Her daughter <b>is harvesting</b> carrots, <b>isn’t</b> <u>she</u>?</p><p>(<i>Con gái cô ấy đang thu hoạch cà rốt phải không?)</i></p><p><u>Linda and Simon </u><b>aren’t sleeping</b> at the moment, <b>are</b> <u>they</u>?</p><p>(<i>Linda và Simon giờ đang không ngủ phải không?)</i></p></td></tr><tr><td><p><b>Hiện tại hoàn thành</b></p></td><td><p><u>He</u> <b>has joined</b> this non-profit organisation for two years, <b>hasn’t</b> <u>he</u>?</p><p><i>(Anh ấy đã tham gia tổ chức phi lợi nhuận này được hai năm rồi, phải không?)</i></p><p><u>We</u> <b>haven’t met</b> her before, <b>have</b> <u>we</u>?</p><p>(<i>Chúng ta chưa từng gặp cô ấy trước đây phải không?)</i></p></td></tr><tr><td><p><b>Quá khứ đơn</b></p></td><td><p><u>They</u> <b>weren’t</b> at school yesterday, <b>were </b><u>they</u>?</p><p>(<i>Hôm qua họ đã không đi học, đúng không?)</i></p><p><u>She</u> <b>bought</b> this car last year, <b>didn’t</b> <u>she</u>?</p><p>(<i>Cô ấy đã mua chiếc xe ỗ tô này vào năm ngoái phải không?)</i></p></td></tr><tr><td><p><b>Tương lai đơn</b></p></td><td><p><u>It</u> <b>won’t rain</b> tomorrow, <b>will</b> <u>it</u>?</p><p>(<i>Ngày mai trời sẽ không mưa, phải không</i>?)</p><p><u>Peter</u> <b>will pick</b> us up at the airport, <b>won’t </b><u>he</u>?</p><p>(<i>Peter sẽ đón chúng ta tại sân bay phải không?)</i></p></td></tr><tr><td><p><b>Tương lai tiếp diễn</b></p></td><td><p><u>You</u> <b>will be visiting</b> Ha Long Bay at this time next week, <b>won’t </b><u>you</u>?</p><p>(<i>Bạn sẽ đang đến thăm Vịnh Hạ Long vào thời điểm này của tuần tới phải không?)</i></p><p><u>They</u> <b>won’t be studying</b> History at 8 a.m. tomorrow, <b>will</b> <u>they</u>?</p><p>(<i>Họ sẽ không học môn Lịch sử vào lúc 8 giờ sáng ngày mai phải không?)</i></p></td></tr></table></div></div>"}]}, {"title": "Grammar practice", "icon": "📝", "desc": "Unit 12 · An overcrowded world", "subs": [{"label": "I · Đúng / sai", "id": "g1", "kind": "quiz", "items": [{"q": "I have decided to spend fewer time on watching TV", "opts": ["Correct", "Incorrect"], "a": 1, "exp": "<p><b>Giải thích</b>: Ta có: “less + danh từ không đếm được”</p><p><b>Dịch nghĩa</b>: I have decided to spend less time on watching TV. (<i>Tôi đã quyết định dành ít thời gian để xem tivi hơn.)</i></p>"}, {"q": "She has less books than her sister.", "opts": ["Correct", "Incorrect"], "a": 1, "exp": "<p><b>Giải thích</b>: Ta có: “fewer + danh từ đếm được”</p><p><b>Dịch nghĩa</b>: She has fewer books than her sister. (Cô ấy có ít sách hơn chị gái cô ấy.)</p>"}, {"q": "You should pay more attention to the lecture every day.", "opts": ["Correct", "Incorrect"], "a": 0, "exp": "<p><b>Giải thích</b>: Ta có: “more + danh từ đếm được/ danh từ không đếm được”</p><p><b>Dịch nghĩa</b>: You should pay more attention to the lecture every day. (<i>Bạn nên chú ý hơn đến bài giảng mỗi ngày.)</i></p>"}, {"q": "People read less books and newspaper nowadays than they used to.", "opts": ["Correct", "Incorrect"], "a": 1, "exp": "<p><b>Giải thích</b>: có: “fewer + danh từ đếm được số nhiều”</p><p><b>Dịch nghĩa</b>: People read fewer books and newspaper nowadays than they used to. (<i>Ngày nay mọi người đọc ít sách và báo hơn so với trước đây.)</i></p>"}, {"q": "I think cities have more pollution problems than the countryside does.", "opts": ["Correct", "Incorrect"], "a": 0, "exp": "<p><b>Giải thích</b>: Ta có: “more + danh từ đếm được/ danh từ không đếm được”</p><p><b>Dịch nghĩa</b>: I think cities have more pollution problems than the countryside does. (<i>Tôi nghĩ thành phố có nhiều vấn đề về ô nhiễm hơn nông thôn.)</i></p>"}, {"q": "Humans had to face less diseases in the past than they do now", "opts": ["Correct", "Incorrect"], "a": 1, "exp": "<p><b>Giải thích:</b> Ta có: “fewer + danh từ đếm được số nhiều”</p><p><b>Dịch nghĩa</b>: Humans had to face fewer diseases in the past than they do now. (<i>Con người trước đây phải đối mặt với ít bệnh tật hơn so với hiện tại.)</i></p>"}]}, {"label": "II · So sánh số lượng", "id": "g2", "kind": "fill", "items": [{"q": "We need___people to move that heavy wardrobe.", "a": ["more"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ đếm được “people” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “more” (nhiều hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: We need more people to move that heavy wardrobe. (<i>Chúng tôi cần nhiều người hơn để di chuyển chiếc tủ quần áo nặng đó.)</i></p>"}, {"q": "___tourists came to that beach due to the polluted water.", "a": ["Fewer"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ đếm được “tourists” nên ta có thể sử dụng “more” hoặc “fewer”. Dựa vào nghĩa của câu, “fewer” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: Fewer tourists came to that beach due to the polluted water. <i>(Ít khách du lịch đến bãi biển đó do nước bị ô nhiễm.)</i></p>"}, {"q": "If you don’t work overtime, you will get___money.", "a": ["less"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ không đếm được “money” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “less” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: If you don’t work overtime, you will get less money. (<i>Nếu bạn không làm việc ngoài giờ thì bạn sẽ nhận được ít tiền hơn.)</i></p>"}, {"q": "There’s very little oil left. She needs some___oil to make the cake.", "a": ["more"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ không đếm được “oil” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “more” (nhiều hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: There’s very little Oil left. She needs some more oil to make the cake. (<i>Còn ít dầu quá. Cô ấy cần thêm một chút dầu để làm bánh.)</i></p>"}, {"q": "He is not interested in his job, and he has shown___responsibility for the project.", "a": ["less"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ không đếm được “responsibility” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “less” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: He is not interested in his job, and he has shown less responsibility for the project. <i>(Anh ấy không thích công việc của mình và anh ấy đã thể hiện ít trách nhiệm hơn đối với dự án.)</i></p>"}, {"q": "Nowadays, people are having___children than in the past.", "a": ["fewer"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ đếm được “children” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “fewer” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: Nowadays, people are having fewer children than in the past. (<i>Ngày nay, mọi người đang sinh ít con hơn trước.)</i></p>"}, {"q": "I need___milk to feed the baby. There is only little in the fridge.", "a": ["more"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ không đếm được “milk” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “more” (nhiều hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: I need more milk to feed the baby. There is only little in the fridge. (<i>Tôi cần nhiều sữa hơn để cho em bé ăn. Chỉ còn một ít trong tủ lạnh.)</i></p>"}, {"q": "Peter is not very sociable, so he has___friends than me.", "a": ["fewer"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ đếm được “friends” nên ta có thể sử dụng “more” hoặc “fewer”. Dựa vào nghĩa của câu, “fewer” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: Peter is not very sociable, so he has fewer friends than me. (<i>Peter không hòa đồng lắm, nên anh ấy có ít bạn hơn tôi.)</i></p>"}, {"q": "Unskilled workers usually earn___money than skilled workers.", "a": ["less"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ không đếm được “money” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “less” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: Unskilled workers usually earn less money than skilled workers. (<i>Lao động phổ thông thì thường kiếm được ít tiền hơn lao động lành nghề.)</i></p>"}, {"q": "Almost everyone in Vietnam likes football, and___people like volleyball.", "a": ["fewer"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ đếm được “people” nên ta có thể sử dụng “more” hoặc “fewer”. Dựa vào nghĩa của câu, “fewer” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: Almost everyone in Vietnam likes football, and fewer people like volleyball. <i>(Hầu như tất cả mọi người ở Việt Nam đều thích bóng đá, và người thích bóng chuyền thì ít hơn.)</i></p>"}, {"q": "Mark has got good marks as he spent___time studying than me.", "a": ["more"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ không đếm được “time” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “more” (nhiều hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: Mark has got good marks as he spent more time studying than me<i>. (Mark đã đạt điểm cao vì anh ấy dành nhiều thời gian học tập hơn tôi.)</i></p>"}, {"q": "___money is needed to build a new bridge over the river.", "a": ["More"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ không đếm được “money” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “more” (nhiều hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: More money is needed to build a new bridge over the river. (<i>Cần nhiều tiền hơn để xây dựng một cây cầu mới qua sông.)</i></p>"}, {"q": "People in Vietnam has___children than they used to.", "a": ["fewer"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ đếm được “children” nên ta có thể sử dụng “more” hoặc “fewer”. Dựa vào nghĩa của câu, “fewer” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: People in Vietnam has fewer children than they used to. (<i>Người dân ở Việt Nam có ít con hơn trước đây.)</i></p>"}, {"q": "I take part in many English speaking clubs. I have___friends than he does.", "a": ["more"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ đếm được “friends” nên ta có thể sử dụng “more” hoặc “fewer”. Dựa vào nghĩa của câu, “more” (nhiều hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: I take part in many English speaking clubs. I have more friends than he does. (<i>Tôi tham gia nhiều câu lạc bộ nói tiếng Anh. Tôi có nhiều bạn hơn anh ấy.)</i></p>"}, {"q": "A hybrid car consumes___petrol than a normal one.", "a": ["less"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ không đếm được “petrol” nên ta có thể sử dụng “more” hoặc “less”. Dựa vào nghĩa của câu, “less” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: A hybrid car consumes less petrol than a normal one. (<i>Một chiếc xe hybrid tiêu thụ ít xăng hơn so với bình thường.)</i></p>"}, {"q": "Understanding smoking is dangerous, ___people smoke now.", "a": ["fewer"], "exp": "<p><b>Giải thích</b>: Sau chỗ trống cần điền là danh từ đếm được “people” nên ta có thể sử dụng “more” hoặc “fewer”. Dựa vào nghĩa của câu, “fewer” (ít hơn) phù hợp hơn.</p><p><b>Dịch nghĩa</b>: Understanding smoking is dangerous, fewer people smoke now. <i>(Hiểu được việc hút thuốc là nguy hiểm, giờ đây ít người hút thuốc hơn.)</i></p>"}]}, {"label": "III · Chọn câu hỏi đuôi", "id": "g3", "kind": "quiz", "items": [{"q": "You have some tickets for Kong - Skull Islands, ___?", "opts": ["don’t you", "do you", "won’t you", "will you"], "a": 0, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “You” và động từ thường “have” ở thì hiện tại đơn, thể khẳng định (have) nên phần đuôi mượn trợ động từ “do” ở thể phủ định (don’t) và đặt lên trước đại từ nhân xưng “you” (don’t you). </p><p><b>Dịch nghĩa</b>: You have some tickets for Kong - Skull Islands, don’t you? (<i>Bạn có vé đi xem phim Kong - Đảo đầu lâu phải không?)</i></p>"}, {"q": "Your younger brother can swim very well, ___?", "opts": ["doesn’t he", "won’t he", "isn’t he", "can’t he"], "a": 3, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “Your younger brother” và trợ động từ “can” ở thể khẳng định (can swim) nên phần đuôi dùng chính trợ động từ “can” ở thể phủ định (can’t) và đặt lên trước đại từ nhân xưng “he” (can’t he). </p><p><b>Dịch nghĩa</b>: Your younger brother can swim very well, can’t he? (<i>Em trai bạn biết bơi rất giỏi phải không?)</i></p>"}, {"q": "You haven’t done your homework, ___?", "opts": ["can you", "have you", "will you", "did you"], "a": 1, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “You” và động từ “haven’t done” nên phần đuôi dùng chính trợ động từ “have” ở thể khẳng định (have) và đặt lên trước đại từ nhân xưng “you” (have you).</p><p><b>Dịch nghĩa</b>: You haven’t done your homework, have you? (<i>Bạn chưa làm bài tập về nhà phải không?)</i></p>"}, {"q": "It is noisier and more crowded in the city than in the countryside, ___?", "opts": ["will it", "can it", "isn’t it", "does it"], "a": 2, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “It” và động từ to be “is” nên phần đuôi dùng chính động từ to be “is” ở thể phủ định (isn’t) và đặt lên trước đại từ nhân xưng “it” (isn’t it).</p><p><b>Dịch nghĩa</b>: It is noisier and more crowded in the city than in the countryside, isn’t it? <i>(ở thành phố ồn ào và đông đúc hơn ở nông thôn phải không?)</i></p>"}, {"q": "I believe you can pass the exam. You won’t let me down, ___?", "opts": ["can’t you", "can you", "won’t you", "will you"], "a": 3, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “You” và động từ “won’t let” nên phần đuôi dùng chính trợ động từ “will” ở thể khẳng định (will) và đặt lên trước đại từ nhân xưng “you” (will you).</p><p><b>Dịch nghĩa</b>: I believe you can pass the exam. You won’t let me down, will you? <i>(Tớ tin cậu có thể thi đỗ mà. Cậu sẽ không làm mình thất vọng chứ?)</i></p>"}, {"q": "She never goes to school by bus, ___?", "opts": ["can he", "did he", "does she", "will he"], "a": 2, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “She” và động từ “never goes” ở thì hiện tại đơn dạng phủ định với trạng từ “never” nên phần đuôi mượn trợ động từ “does” ở thể khẳng định (does) và đặt lên trước đại từ nhân xưng “she” (does she).</p><p><b>Dịch nghĩa</b>: She never goes to school by bus, does she? (<i>Cô ấy không bao giờ đi học bằng xe buýt phải không?)</i></p>"}, {"q": "Your mother will cook a good meal for you, ___?", "opts": ["will she", "won’t she", "can she", "can’t she"], "a": 1, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “Your mother” và động từ “will cook” ở thì tương lai đơn dạng khẳng định nên phần đuôi dùng chính trợ động từ “will” ở thể phủ định (won’t) và đặt lên trước đại từ nhân xưng “she” (won’t she).</p><p><b>Dịch nghĩa:</b> Your mother will cook a good meal for you, won’t she? (<i>Mẹ bạn sẽ nấu một bữa ăn ngon cho bạn phải không?)</i></p>"}, {"q": "You have never been to the U.S, ___?", "opts": ["can’t you", "haven’t you", "can you", "have you"], "a": 3, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “You” và động từ “have never been” ở thì hiện tại hoàn thành dạng phủ định với trạng từ “never” nên phần đuôi dùng chính trợ động từ “have” ở thể khẳng định (have) và đặt lên trước đại từ nhân xưng “you” (have you).</p><p><b>Dịch nghĩa</b>: You have never been to the U.S, have you? (<i>Bạn chưa bao giờ đến Mỹ phải không?)</i></p>"}, {"q": "Your son and his friends are playing football, ___?", "opts": ["aren’t they", "won’t they", "don’t they", "haven’t they"], "a": 0, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “Your son and his friends” và động từ “are playing” ở thì hiện tại tiếp diễn dạng khẳng định nên phần đuôi dùng chính trợ động từ to be “are” ở thể phủ định (aren’t) và đặt lên trước đại từ nhân xưng “they” (aren’t they).</p><p><b>Dịch nghĩa</b>: Your son and his friends are playing football, aren’t they? <i>(Con trai bạn và bạn bè của nó đang chơi bóng đá phải không?)</i></p>"}, {"q": "Man can’t run faster than tigers, ___?", "opts": ["are they", "do they", "can they", "will they"], "a": 2, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “Men” và động từ “can’t run” nên phần đuôi dùng chính trợ động từ “can” ở thể khẳng định (can) và đặt lên trước đại từ nhân xưng “they” (can they).</p><p><b>Dịch nghĩa</b>: Man can’t run faster than tigers, can they? <i>(Con người không thể chạy nhanh hơn hổ phải không?)</i></p>"}]}, {"label": "IV · Viết câu", "id": "g4", "kind": "write", "items": [{"c": "You know the answer to this tough question.", "a": "You know the answer to this tough question, don’t you?", "vi": "  Giải thích : You know the answer to this tough question. (Bạn biết câu trả lời cho câu hỏi hóc búa này.) vế trước có chủ ngữ là “You” và động từ thường “know” ở thì hiện tại đơn, thể khẳng định (know) nên phần đuôi mượn trợ động từ “do” ở thể phủ định (don’t) và đặt lên trước đại từ nhân xưng “you” (don’t you).   Dịch nghĩa : Bạn biết câu trả lời cho câu hỏi hóc búa này phải không? "}, {"c": "He can’t tell the difference between the two products.", "a": "He can’t tell the difference between the two products, can he?", "vi": "  Giải thích:  He can’t tell the difference between the two products. (Anh ta không thể phân biệt được hai sản phẩm.)  vế trước có chủ ngữ là “He” và trợ động từ “can’t tell” nên phần đuôi dùng chính trợ động từ “can” ở thể khẳng định (can) và đặt lên trước đại từ nhân xưng “he” (can he).   Dịch nghĩa:  Anh ta không thể phân biệt được hai sản phẩm phải không? "}, {"c": "They have been to England twice.", "a": "They have been to England twice, haven’t they?", "vi": "  Giải thích : They have been to England twice. (Họ đã đến Anh hai lần.)  vế trước có chủ ngữ là “They” và động từ “have been” ở thì hiện tại hoàn thành nên phần đuôi dùng chính trợ động từ “have” ở thể phủ định (haven’t) và đặt lên trước đại từ nhân xưng “they” (haven’t they).   Dịch nghĩa : Họ đã đến Anh hai lần rồi phải không? "}, {"c": "The government is working hard to solve the financial problems.", "a": "The government is working hard to solve the financial problems, isn’t it?", "vi": "  Giải thích : The government is working hard to solve the financial problems. (Chính phủ đang nỗ lực để giải quyết các vấn đề tài chính.)  vế trước có chủ ngữ là “The governoment” và động từ “is working” nên phần đuôi dùng chính trợ động từ “is” ở thể phủ định (isn’t) và đặt lên trước đại từ nhân xưng “it” (isn’t it).   Dịch nghĩa : Chính quyền đang làm việc tích cực để giải quyết các vấn đề tài chính phải không? "}, {"c": "There will be a new KFC restaurant in our building.", "a": "There will be a new KFC restaurant in our building, won’t there?", "vi": "  Giải thích : There will be a new KFC restaurant in our building. (Sẽ có một nhà hàng KFC mới trong tòa nhà của chúng ta.)  vế trước có chủ ngữ là “There” và động từ to be “will be” ở thì tương lai đơn nên phần đuôi dùng chính trợ động từ “will” ở thể phủ định (won’t) và đặt lên trước đại từ chỉ định “there” (won’t there).   Dịch nghĩa : Sẽ có một nhà hàng KFC mới trong tòa nhà của chúng ta phải không? "}, {"c": "She has many foreign friends here.", "a": "She has many foreign friends here, doesn’t she?", "vi": "  Giải thích : She has many foreign friends here. (Cô ấy có nhiều bạn nước ngoài ở đây.) vế trước có chủ ngữ là “She” và động từ “has” ở thì hiện tại đơn nên phần đuôi mượn trợ động từ “does” ở thể phủ định (doesn’t) và đặt lên trước đại từ nhân xưng “she” (doesn’t she).   Dịch nghĩa : Cô ấy có nhiều bạn người ở đây phải không? "}, {"c": "You can run fast and play football very well.", "a": "You can run fast and play football very well, can’t you?", "vi": "  Giải thích:  You can run fast and play football very well. (Bạn có thể chạy nhanh và chơi đá bóng rất giỏi.) vế trước có chủ ngữ là “You” và trợ động từ “can” ở thể khẳng định nên phần đuôi dùng chính trợ động từ “can” ở thể phủ định (can’t) và đặt lên trước đại từ nhân xưng “you” (can’t you).   Dịch nghĩa : Bạn có thể chạy nhanh và đá bóng rất giỏi phải không? "}, {"c": "Her son hasn’t learnt any foreign language yet.", "a": "Her son hasn’t learnt any foreign language yet, has he?", "vi": "  Giải thích : Her son hasn’t learnt any foreign language yet (Con trai cô ấy chưa học ngoại ngữ.) vế trước có chủ ngữ là “Her son” và động từ “hasn’t learnt” ở thì hiện tại hoàn thành thể phủ định nên phần đuôi dùng chính trợ động từ “has” ở thể khẳng định (has) và đặt lên trước đại từ nhân xưng “he” (has he).    Dịch nghĩa : Con trai cô ấy chưa học ngoại ngữ phải không? "}, {"c": "Pizza isn’t hot and delicious anymore.", "a": "Pizza isn’t hot and delicious anymore, is it?", "vi": "  Giải thích : Pizza isn’t hot and delicious anymore. (Bánh pizza không còn nóng và ngon nữa.) vế trước có chủ ngữ là “Pizza” và động từ to be “isn’t” ở thì hiện tại đơn thể phủ định nên phần đuôi dùng chính động từ “to be” ở thể khẳng định (is) và đặt lên trước đại từ nhân xưng “it” (is it).   Dịch nghĩa : Bánh pizza không còn nóng và ngon nữa phải không? "}, {"c": "Peter did his homework last night.", "a": "Peter did his homework last night, didn’t he?", "vi": "  Giải thích : Peter did his homework last night. (Peter đã làm bài tập về nhà tối qua.)  vế trước có chủ ngữ là “Peter” và động từ “did” ở thì quá khứ đơn dạng khẳng định nên phần đuôi mượn trự động từ “did” ở thể phủ định (didn’t) và đặt lên trước đại từ nhân xưng “he” (didn’t he).   Dịch nghĩa : Tối qua Peter đã làm bài tập về phải không? "}]}, {"label": "V · Ghép đuôi", "id": "g5", "kind": "quiz", "items": [{"q": "We have walked such a long way,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 2, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “we”, động từ “have walked” ở thì hiện tại hoàn thành dạng khẳng định nên phần đuôi “haven’t we” là phù hợp nhất</p><p><b>Dịch nghĩa</b>: We have walked such a long way, haven’t we? (<i>Chúng ta đã đi một chặng đường dài như vậy phải không?)</i></p>"}, {"q": "She will apply for a job in Samsung company,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 8, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “she”, động từ “will apply” ở thì tương lai đơn dạng khẳng định nên phần đuôi “won’t she” là phù hợp nhất.</p><p><b>Dịch nghĩa:</b> She will apply for a job in Samsung company, won’t she? (<i>Cô ấy sẽ xin việc ở công ty Samsung phải không?)</i></p>"}, {"q": "They are going to plant many new trees in the park,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 0, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “they”, động từ “are going to plant” ở thì tương lai gần dạng khẳng định nên phần đuôi “aren’t they” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: They are going to plant many new trees in the park, aren’t they? (<i>Họ sẽ trồng nhiều cây mới trong công viên phải không?)</i></p>"}, {"q": "His daughter didn’t go to her friend’s birthday party yesterday, ", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 6, "exp": "<p><b>Giải thích:</b> vế trước có chủ ngữ là “his daughter”, động từ “didn’t go” ở thì quá khứ đơn dạng phủ định nên phần đuôi “did she” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: His daughter didn’t go to her friend’s birthday party yesterday, did she? <i>(Hôm qua con gái của anh ấy đã không đến dự tiệc sinh nhật của bạn cô ấy phải không?)</i></p>"}, {"q": "It isn’t easy to finish the project in time,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 10, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “it”, động từ to be “isn’t” ở thì hiện tại đơn dạng phủ định nên phần đuôi “is it” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: It isn’t easy to finish the project in time, is it? (<i>Hoàn thành dự án đúng hạn không dễ phải không?)</i></p>"}, {"q": "We don’t know exactly the causes of the breakdown,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 9, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “we”, động từ “don’t know” thì hiện tại đơn dạng phủ định nên phần đuôi “do we” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: We don’t know exactly the causes of the breakdown, do we? (<i>Chúng ta không biết chính xác nguyên nhân của sự cố phải không?)</i></p>"}, {"q": "Minh often finishes her exercises quickly,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 1, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “Minh”, động từ “finishes” ở thì hiện tại dạng khẳng định nên phần đuôi “doesn’t she” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Minh often finishes her exercises quickly, doesn’t she? (<i>Minh thường hoàn thành bài tập của mình một cách nhanh chóng phải không?)</i></p>"}, {"q": "She is listening to music in the room,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 5, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “she”, động từ “is listening” ở thì hiện tại tiếp diễn nên phần đuôi “isn’t she” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: She is listening to music in the room, isn’t she? (<i>Cô ấy đang nghe nhạc trong phòng phải không?)</i></p>"}, {"q": "You will never go abroad alone,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 7, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “you”, động từ “will never go” ở thì tương lai đơn phủ định với trạng từ “never” nên phần đuôi “will you” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: You will never go abroad alone, will you? (<i>Bạn sẽ không bao giờ đi ra nước ngoài một mình phải không?)</i></p>"}, {"q": "Your daughter hasn’t been married yet,", "opts": ["aren’t they?", "doesn’t she?", "haven’t we?", "didn’t you?", "has she?", "isn’t she?", "did she?", "will you?", "won’t she?", "do we?", "is it?"], "a": 4, "exp": "<p><b>Giải thích</b>: vế trước có chủ ngữ là “Your daughter”, động từ “hasn’t got” ở thì hiện tại hoàn thành dạng phủ định nên phần đuôi “has she” là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Your daughter hasn’t been married yet, has she? <i>(Con gái của bạn vẫn chưa kết hôn phải không?)</i></p>"}]}, {"label": "Đề bài đầy đủ", "html": "<div class=\"source\"><p><b>I - Decide if each of the following sentences is correct (C) or incorrect (I).</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Sentences</b></p></td><td><p><b>Correct (C)</b></p></td><td><p><b>Incorrect (I)</b></p></td></tr><tr><td><p>E.g.: Less people learn Russian now than in the past.</p></td><td></td><td><p><i>Less → Fewer</i></p></td></tr><tr><td><p>1. I have decided to spend fewer time on watching TV</p></td><td></td><td></td></tr><tr><td><p>2. She has less books than her sister.</p></td><td></td><td></td></tr><tr><td><p>3. You should pay more attention to the lecture every day.</p></td><td></td><td></td></tr><tr><td><p>4. People read less books and newspaper nowadays than they used to.</p></td><td></td><td></td></tr><tr><td><p>5. I think cities have more pollution problems than the countryside does.</p></td><td></td><td></td></tr><tr><td><p>6. Humans had to face less diseases in the past than they do now</p></td><td></td><td></td></tr></table></div><p><b>II - Fill in the blank a suitable comparison form on quantifiers (</b><i><b>more/ less/ fewer</b></i><b>).</b></p><p><i>E.g.: That flagship mobile is so expensive. I need to save__more__money to buy it.</i></p><p>1. We need_________people to move that heavy wardrobe.</p><p>2. _________tourists came to that beach due to the polluted water.</p><p>3. If you don’t work overtime, you will get_________money.</p><p>4. There’s very little oil left. She needs some_________oil to make the cake.</p><p>5. He is not interested in his job, and he has shown_________responsibility for the project.</p><p>6. Nowadays, people are having_________children than in the past.</p><p>7. I need_________milk to feed the baby. There is only little in the fridge.</p><p>8. Peter is not very sociable, so he has_________friends than me.</p><p>9. Unskilled workers usually earn_________money than skilled workers.</p><p>10. Almost everyone in Vietnam likes football, and_________people like volleyball.</p><p>11. Mark has got good marks as he spent_________time studying than me.</p><p>12. _________money is needed to build a new bridge over the river.</p><p>13. People in Vietnam has_________children than they used to.</p><p>14. I take part in many English speaking clubs. I have_________friends than he does.</p><p>15. A hybrid car consumes_________petrol than a normal one.</p><p>16. Understanding smoking is dangerous, _________people smoke now.</p><p><b>III - Choose the best option to complete the following tag questions.</b></p><p>1. You have some tickets for Kong - <i>Skull Islands</i>, ________?</p><p><b>A</b>. don’t you<b>B</b>. do you<b>C</b>. won’t you<b>D</b>. will you</p><p>2. Your younger brother can swim very well, ________?</p><p><b>A</b>. doesn’t he<b>B</b>. won’t he<b>C</b>. isn’t he<b>D</b>. can’t he</p><p>3. You haven’t done your homework, ________?</p><p><b>A</b>. can you<b>B</b>. have you<b>C</b>. will you<b>D</b>. did you</p><p>4. It is noisier and more crowded in the city than in the countryside, ________?</p><p><b>A.</b> will it<b>B</b>. can it<b>C</b>. isn’t it<b>D</b>. does it</p><p>5. I believe you can pass the exam. You won’t let me down, ________?</p><p><b>A</b>. can’t you<b>B</b>. can you<b>C</b>. won’t you<b>D</b>. will you</p><p>6. She never goes to school by bus, ________?</p><p><b>A</b>. can he<b>B.</b> did he<b>C</b>. does she<b>D</b>. will he</p><p>7. Your mother will cook a good meal for you, ________?</p><p><b>A</b>. will she<b>B</b>. won’t she<b>C</b>. can she<b>D</b>. can’t she</p><p>8. You have never been to the U.S, ________?</p><p><b>A</b>. can’t you<b>B</b>. haven’t you<b>C</b>. can you<b>D</b>. have you</p><p>9. Your son and his friends are playing football, ________?</p><p><b>A</b>. aren’t they<b>B</b>. won’t they<b>C</b>. don’t they<b>D</b>. haven’t they</p><p>10. Man can’t run faster than tigers, ________?</p><p><b>A</b>. are they<b>B</b>. do they<b>C</b>. can they<b>D</b>. will they</p><p><b>IV - Change the following statements into tag questions.</b></p><p><i>E.g.: They have bought a new apartment in the city centre.</i></p><p><i>→ </i><i>They have bought a new apartment in the city centre, haven’t they?</i></p><p>1. You know the answer to this tough question.</p><p>____________________________________________</p><p>2. He can’t tell the difference between the two products.</p><p>____________________________________________</p><p>3. They have been to England twice.</p><p>____________________________________________</p><p>4. The government is working hard to solve the financial problems.</p><p>____________________________________________</p><p>5. There will be a new KFC restaurant in our building.</p><p>____________________________________________</p><p>6. She has many foreign friends here.</p><p>____________________________________________</p><p>7. You can run fast and play football very well.</p><p>____________________________________________</p><p>8. Her son hasn’t learnt any foreign language yet.</p><p>____________________________________________</p><p>9. Pizza isn’t hot and delicious anymore.</p><p>____________________________________________</p><p>10. Peter did his homework last night.</p><p>____________________________________________</p><p><b>V</b> - Match the tag with the statement to have correct tag questions.</p><div class=\"tablewrap\"><table><tr><td><p><i>E.g.: You watched the final football match last night,</i></p></td><td><p>a. aren’t they?</p></td></tr><tr><td><p>1. We have walked such a long way,</p></td><td><p>b. doesn’t she?</p></td></tr><tr><td><p>2. She will apply for a job in Samsung company,</p></td><td><p>c. haven’t we?</p></td></tr><tr><td><p>3. They are going to plant many new trees in the park,</p></td><td><p><i>d. didn’t you?</i></p></td></tr><tr><td><p>4. His daughter didn’t go to her friend’s birthday party yesterday, </p></td><td><p>e. has she?</p></td></tr><tr><td><p>5. It isn’t easy to finish the project in time,</p></td><td><p>f. isn’t she?</p></td></tr><tr><td><p>6. We don’t know exactly the causes of the breakdown,</p></td><td><p>g. did she?</p></td></tr><tr><td><p>7. Minh often finishes her exercises quickly,</p></td><td><p>h. will you?</p></td></tr><tr><td><p>8. She is listening to music in the room,</p></td><td><p>i. won’t she?</p></td></tr><tr><td><p>9. You will never go abroad alone,</p></td><td><p>j. do we?</p></td></tr><tr><td><p>10. Your daughter hasn’t been married yet,</p></td><td><p>k. is it?</p></td></tr></table></div></div>"}]}, {"title": "Reading · Đọc hiểu", "icon": "📖", "desc": "Unit 12 · An overcrowded world", "subs": [{"label": "Population facts", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p><b>DO YOU KNOW?</b></p><p><b>POPULATION FACTS</b></p><p><b>•</b>The world’s population totals 7.6 billion people and is expected to grow to nearly 10 billion by the middle of this century.</p><p>•More people live in urban than rural areas, with 55 percent residing in urban areas in 2018. By 2050 this proportion is expected to reach nearly 70 percent.</p><p>•A total of 50.4 percent of the world’s population is male, and 49.6 percent is female.</p><p>•China has the world’s largest population (1.42 billion), followed by India (1.35 billion).</p><p>•The largest city in the world by population is Tokyo, Japan, with a population of nearly 38 million.</p></td></tr></table></div></div>"}, {"label": "I · Ecosystems", "id": "r1", "kind": "fill", "items": [{"q": "The increased loss of the___are highly influenced by overpopulation.", "a": ["ecosystems"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Sự mất mát ngày càng tăng của các__________bị ảnh hưởng rất nhiều bởi dân số</p><p>quá đông.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The increased loss of the ecosystems including [...] are highly influenced by overpopulation.”</p>"}, {"q": "Excessive agriculture has become more and more___.", "a": ["intensive"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Hoạt động nông nghiệp quá mức đã trở nên ngày càng__________.</p><p><b>Giải thích</b>: Thông tin có ở câu: “[...] activities such as excessive agriculture, environmental pollution, and extensive land development have become more and more intensive.”</p>"}, {"q": "___of the entire earth’s surface was originally covered by rainforests.", "a": ["14%"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: __________toàn bộ bề mặt Trái đất ban đầu được bao phủ bởi rừng mưa nhiệt đới.</p><p><b>Giải thích:</b> Thông tin có ở câu: “For example, rainforests originally covered 14% of the entire earth’s surface.”</p>"}, {"q": "Rainforests may cover less than 6% of the earth’s surface in the next___.", "a": ["four decades"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Rừng mưa nhiệt đới có thể che phủ ít hơn 6% bề mặt Trái đất trong__________tới.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Today, rainforests only cover about 6% of the earth’s surface and scientists forecast it may even become less in the next four decades [...]”</p>"}, {"q": "Acidification and___have made 30% of the ocean reefs disappear since 1980.", "a": ["global warming"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Axit hóa và__________đã khiến 30% các rạn san hô đại dương biến mất kể từ năm 1980.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Besides, due to environmental pollution, 30% of the ocean reefs have been lost because of acidification and global warming since 1980.”</p>"}], "before": "<div class=\"source\"><p><b>I- Read the passage and complete the following sentences with ONE or TWO words. </b></p><p>The increased loss of the ecosystems including wetlands, wildlife, rainforests, coral reefs, aquatic life forms, and grasslands are highly influenced by overpopulation. It is out of overpopulation that activities such as excessive agriculture, environmental pollution, and extensive land development have become more and more intensive.</p><p>For example, rainforests originally covered 14% of the entire earth’s surface. Today, rainforests only cover about 6% of the earth’s surface and scientists forecast it may even become less in the next four decades judged by the current rate of vegetation removal, logging, and deforestation. Besides, due to environmental pollution, 30% of the ocean reefs have been lost because of acidification and global warming since 1980. Also, more than half of the original wetlands have been lost.</p></div><details class=\"tr\"><summary>Bản dịch</summary><div class=\"source\"><p>Sự biến mất của các hệ sinh thái ngày càng tăng bao gồm vùng đất ngập nước, động vật hoang dã, rừng mưa nhiệt đới, rạn san hô, các dạng sống dưới nước và đồng cỏ là do chịu ảnh hưởng rất lớn từ sự bùng nổ dân số. Ngoài vấn đề dân số quá đông thì các hoạt động như sản xuất nông nghiệp quá mức, ô nhiễm môi trường và phát triển đất đai cũng ngày càng trở nên nguy hại.</p><p>Ví dụ, rừng mưa ban đầu bao phủ 14% toàn bộ bề mặt Trái đất. Ngày nay, rừng mưa nhiệt đới chỉ chiếm khoảng 6% diện tích mặt đất và các nhà khoa học dự báo rừng thậm chí có thể càng ngày càng biến mất trong bốn thập kỷ tới được đánh giá theo tỷ lệ biến mất của thảm thực vật, khai thác và phá rừng hiện nay. Ngoài ra, do ô nhiễm môi trường, 30% các rạn san hô đại dương đã bị mất đi do axit hóa và sự nóng lên toàn cầu kể từ năm 1980. Ngoài ra, hơn một nửa các vùng đất ngập nước ban đầu cũng không còn tòn tại nữa.</p></div></details>"}, {"label": "II · World population", "id": "r2", "kind": "quiz", "items": [{"q": "In Europe, young couples usually have more than two children.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Ở châu Âu, các cặp vợ chồng trẻ thường có nhiều hơn hai con.</p><p><b>Giải thích</b>: Thông tin ở câu sau đoạn 1: “The birth rate is low because many young people have only one child or none at all.”</p>"}, {"q": "Old people in many European countries don’t save enough money for their retirement.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Những người cao tuổi ở nhiều nước châu Âu không tiết kiệm đủ tiền khi nghỉ hưu.</p><p><b>Giải thích</b>: Thông tin ở câu cuối đoạn 1: “After retirement, they feel lonely and often very poor because they don’t save enough money.”</p>"}, {"q": "The population of Africa has increased rapidly.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Dân số châu Phi đã tăng nhanh.</p><p><b>Giải thích</b>: Thông tin ở câu 2 đoạn 2: “The population has grown rapidly over the last 40 years and it has a relatively young population.”</p>"}, {"q": "Asia has the highest population growth rate in the world.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Châu Á có tỷ lệ tăng dân số cao nhất thế giới.</p><p><b>Giải thích</b>: Thông tin ở câu 2 đoạn 3: “It also has the highest population growth rate today, [...].”</p>"}, {"q": "The population of Asia will decrease in the next few years.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Dân số châu Á sẽ giảm trong vài năm tới.</p><p><b>Giải thích</b>: Thông tin ở câu cuối đoạn 3: “Asian population will <u>continue to grow</u>, increasing pressure on the region’s natural resources.”</p>"}], "before": "<div class=\"source\"><p><b>WORLD POPULATION</b></p><p>Population problems are different in different parts of the world. For example, in many European countries, the population is getting older. The birth rate is low because many young people have only one child or none at all. After retirement, they feel lonely and often very poor because they don’t save enough money.</p><p>In Africa, the population problems are very different. The population has grown rapidly over the last 40 years and it has a relatively young population. Many families continue to have large numbers of children to look after older people and to help on the land.</p><p>Asia is the largest and most populous of earth’s continents. It also has the highest population growth rate today, and its population almost quadrupled during the 20th century. Asian population will continue to grow, increasing pressure on the region’s natural resources.</p></div><details class=\"tr\"><summary>Bản dịch</summary><div class=\"source\"><p><b>DÂN SỐ THẾ GIỚI</b></p><p>Mỗi nước có một vấn đề về dân số riêng. Ví dụ, ở nhiều nước châu Âu, dân số đang già đi. Tỷ lệ sinh thấp vì nhiều người trẻ chỉ sinh một con hoặc không sinh con. Sau khi nghỉ hưu, họ cảm thấy cô đơn và thường rất nghèo vì không tiết kiệm đủ tiền.</p><p>Ở Châu Phi, các vấn đề về dân số lại rất khác. Dân số đã tăng nhanh trong 40 năm qua và cơ cấu dân số tương đối trẻ. Nhiều gia đình liên tục sinh nhiều con để có người chăm sóc người già và phụ giúp các công việc.</p><p>Châu Á là châu lục lớn nhất và đông dân nhất trên Trái đất. Châu Á cũng có tốc độ tăng dân số cao nhất hiện nay và dân số tăng gần gấp bốn lần trong thế kỷ thứ 20. Dân số châu Á sẽ tiếp tục tăng, gây áp lực lên nguồn tài nguyên thiên nhiên của khu vực.</p></div></details>"}]}, {"title": "Listening · Nghe", "icon": "🔊", "desc": "Unit 12 · An overcrowded world", "subs": [{"label": "Nghe & trả lời", "id": "l1", "kind": "quiz", "items": [{"q": "The world population is predicted to grow more in a short period of time.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Dân số thế giới được dự báo sẽ gia tăng trong một khoảng thời gian ngắn.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Curently there are seven billion people on the planet and this number is projected to grow in a short period of time.”</p>"}, {"q": "Overpopulation is not considered an environmental challenges.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Dân số quá đông không được coi là một thách thức về môi trường.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Of all of the environmental challenges facing the planet today, overpopulation is sometimes neglected.”</p>"}, {"q": "More attention has been paid to pollution, climate change and water shortages.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Nhiều sự chú ý hơn được dành cho ô nhiễm, biến đổi khí hậu và thiếu nước.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Issues like pollution, climate change and water shortages all seem to take precedence, [...]”</p>"}, {"q": "Overpopulation will not make environmental issues widespread.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Dân số quá đông sẽ không làm cho vấn đề về môi trường trở nên phổ biến.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Overpopulation will place great demands on resources and land, leading to widespread environmental issues [...]”</p>"}, {"q": "There is some misunderstanding about the causes and effects of overpopulation.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Có một số hiểu lầm về nguyên nhân và ảnh hưởng của dân số quá đông.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The issue is compounded by the difficulty in providing solutions for this problem and misunderstanding of the causes and effects of overpopulation.”</p>"}], "before": "<div class=\"note\">Giọng đọc tổng hợp từ lời thoại trong tài liệu.</div><button class=\"btn solid\" onclick=\"say(LISTEN)\">▶ Nghe bài</button> <button class=\"btn\" onclick=\"speechSynthesis.cancel()\">■ Dừng</button>"}, {"label": "Lời thoại & bản dịch", "html": "<div class=\"source\"><p>Audio script:</p><div class=\"tablewrap\"><table><tr><td><p>Over the last half century the population of the world has exploded. Currently there are seven billion people on the planet and this number is projected to grow in a short period of time. Of all of the environmental challenges facing the planet today, overpopulation is sometimes neglected. Issues like pollution, climate change and water shortages all seem to take precedence, but overpopulation is one of the main contributors to many other environmental issues. Overpopulation will place great demands on resources and land, leading to widespread environmental issues in addition to impacting global economies and standards of living. The issue is compounded by the difficulty in providing solutions for this problem and misunderstanding of the causes and effects of overpopulation.</p></td><td><p>Trong nửa thế kỷ qua, dân số thế giới đã bùng nổ. Hiện có bảy tỷ người trên hành tinh và con số này được dự đoán sẽ tăng lên trong một khoảng thời gian ngắn. Trong tất cả các thách thức môi trường đối với hành tinh ngày nay, dân số quá đông là một trong những điều đôi khi không được chú ý đến. Các vấn đề như ô nhiễm, biến đổi khí hậu và thiếu nước dường như được ưu tiên, nhưng dân số quá đông là một trong những đóng góp chính cho nhiều vấn đề môi trường khác. Dân số quá đông sẽ đặt ra yêu cầu lớn đối với tài nguyên và đất đai, dẫn đến các vấn đề môi trường phổ biến bên cạnh việc tác động đến nền kinh tế và mức sống toàn cầu. Vấn đề được kết hợp bởi những khó khăn trong việc cung cấp giải pháp cho vấn đề này và sự hiểu lầm về nguyên nhân và ảnh hưởng của dân số quá mức.</p></td></tr></table></div></div>"}]}, {"title": "Speaking · Nói", "icon": "💬", "desc": "Unit 12 · An overcrowded world", "subs": [{"label": "Đề bài & gợi ý", "html": "<div class=\"source\"><p><b>Talk about the causes and effects of an overcrowded world.</b></p><p>You can use the following questions as cues:</p><p>•What are the causes of an overcrowded world?</p><p>•What are the effects of an overcrowded world?</p><p><b>Useful languages:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Useful vocabulary</b></p></td><td><p><b>Useful structures</b></p></td></tr><tr><td><p>• high fertility rates</p><p>•scientific advancement</p><p>• no policty to control</p><p>•high unemployment</p><p>•traffic and air pollution</p><p>• poverty</p><p>• health problems</p><p>• crime</p></td><td><p>•Two main reasons for an overcrowded world are …</p><p>• An overcrowded world causes many problems like ...</p><p>•There are some effects of an overcrowded world. For example, ...</p></td></tr></table></div><p><b>Complete the notes:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Structures of the talk</b></p></td><td><p><b>Your notes</b></p></td></tr><tr><td><p>What are the causes of overcrowded world?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>What are the effects of overcrowded world?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr></table></div><p><b>Now you try!</b></p><p><b>Give your answer using the following cues. You should speak for 1-2 minutes.</b></p><p>1. Two main reasons for an overcrowded world are ...</p><p>2. There are some effects of an overcrowded world. For example, ...</p><p><b>Now you tick!</b></p><p><b>Did you ...</b></p><p> answer all the questions in the task?</p><p> give some details to each main point?</p><p> speak slowly and fluently with only some hesitation?</p><p> use vocabulary wide enough to talk about the topic?</p><p> use various sentence structures (simple, compound, complex) accurately?</p><p> pronounce correctly (vowels, consonants, stress, intonation)?</p><p><b> </b><b>Let’s compare!</b></p><p>Finally, compare with the sample answer on page 214.</p></div>"}, {"label": "Ghi chú của bạn", "kind": "notes"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>Talk about the causes and effects of an overcrowded world.</b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Hãy nói về nguyên nhân và ảnh hưởng của một thế giới quá đông đúc.</p><p>Em có thể sử dụng các câu hỏi sau đây như gợi ý:</p><p>• Nguyên nhân của thế giới quá đông đúc là gì?</p><p>• Những ảnh hưởng của thế giới quá đông đúc là gì?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Causes (Nguyên nhân)</b></p><p>- high fertility rates (<i>n. phr.)</i> (tỷ lệ sinh cao)</p><p>- good healthcare (<i>n. phr</i>.) (chăm sóc tốt)</p><p>- scientific advancement (<i>n. phr.)</i> (tiến bộ khoa học)</p><p>- no policty to control (<i>n. phr.)</i> (không có chính sách)</p><p><b>Effects (Tác động)</b></p><p>- unemployment (<i>n.</i>) (thất nghiệp)</p><p>- pollution <i>(n</i>.) (ô nhiễm)</p><p>- international conflict (<i>n. phr</i>.) (xung đột quốc tế)</p><p>- poverty (<i>n</i>.) (nghèo)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>The world’s population has increased by 6 billion during the last 100 years. Two of causes for this are the high birth rate and low death rate. Better economy and living conditions allow people to have more children. Advanced science and technology play a role in reducing the death rate. Many diseases, previously untreatable, can be treated, and the patients’ life can be saved. An overcrowded population makes unemployment, poverty and crime more serious, and causes instability. I think it’s high time countries in the world took measures to control population before it is too late.</p></td><td><p>Dân số thế giới đã tăng khoảng 6 tỷ người trong hơn 100 năm qua. Hai nguyên nhân trong số đó là tỷ lệ sinh cao và tỷ lệ tử thấp. Kinh tế và điều kiện sống tốt hơn khiến con người sinh thêm con. Khoa học, kỹ thuật tiến bộ góp phần làm tỷ lệ tử giảm. Nhiều bệnh trước đây không cứu chữa được nhưng nay người bệnh có thể được cứu sống. Dân số quá đông khiến tình trạng thất nghiệp, nghèo đói và tội phạm gia tăng, gây nhiều bất ổn. Em nghĩ đã đến lúc các quốc gia trên thế giới cần có biện pháp để hạn chế tỷ lệ tăng dân số trước khi quá muộn.</p></td></tr></table></div></div>"}]}, {"title": "Writing · Viết", "icon": "✍️", "desc": "Unit 12 · An overcrowded world", "subs": [{"label": "I · Viết câu", "id": "w1", "kind": "write", "items": [{"c": "Overpopulation/ bring/ many problems/ like/ crimes/ unemployment.", "a": "Overpopulation brings about many problems like crimes and unemployment.", "vi": "  Dịch nghĩa : Dân số quá đông gây ra nhiều vấn đề như tội phạm và thất nghiệp. "}, {"c": "Every country/ should do/ something/ control/ population.", "a": "Every country should do something to control its population.", "vi": "  Dịch nghĩa : Mỗi quốc gia nên làm gì đó để kiểm soát dân số của mình. "}, {"c": "Some/ measure/ should/ empower/ laws.", "a": "Some measures should be empowered by laws.", "vi": "  Dịch nghĩa:  Một số biện pháp nên được cụ thể hóa bởi pháp luật. "}, {"c": "People/ must/ aware/ effects/ overpopulation.", "a": "People must be aware of the effects caused by overpopulation.", "vi": "  Dịch nghĩa : Mọi người phải nhận thức được những tác động do dân số quá đông gây ra. "}, {"c": "Methods/ to control/ population/ should/ carry out/ soon.", "a": "Methods to control the population should be carried out soon.", "vi": "  Dịch nghĩa : Các phương pháp kiểm soát dân số cần được tiến hành sớm. "}]}, {"label": "II · Đoạn văn 60–80 từ", "kind": "writing", "html": "<div class=\"source\"><p><b>II- Write a short paragraph (60-80 words) about disadvantages of life in crowded cities like Hanoi or Ho Chi Minh City.</b></p><p>You can answer some of the following questions:</p><p>* What are the disadvantages of living in an overcrowded city?</p><p>* What are the ways to solve those problems?</p></div>"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>II - Write a short paragraph (60-80 words) about disadvantages of life in crowded cities like Hanoi or Ho Chi Minh City</b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Viết một đoạn văn ngắn (60-80 từ) về bất lợi của cuộc sống ở thành phố đông đúc như Hà Nội hay Thành phố Hồ Chí Minh.</p><p>Em có thể trả lời một số câu hỏi sau:</p><p>* Những bất lợi đó là gì?</p><p>* Những giải pháp là gì?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Disadvantages (Bất lợi)</b></p><p>- Noisy (ồn ào)</p><p>- Cramped (chật chội)</p><p>- Dusty (bụi bặm)</p><p>- Polluted (ô nhiễm)</p><p><b>Solutions (Giải pháp)</b></p><p>- decreasing vehicles (giảm xe cộ)</p><p>- building more houses (xây thêm nhà cửa)</p><p>- controlling migrants (quản lý người nhập cư)</p><p>- cleaning houses (dọn dẹp nhà)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>Life in a crowded city like Hanoi has many advantages, but it also brings about many disadvantages. Life here is too noisy and dusty. There are too many vehicles on the roads and streets. Many other activities like construction and traffic make it very noisy. More people mean there is more waste which makes pollution more serious. The government should take measures to reduce personal vehicles. It’s also important to control and observe the number of migrants closely so that we can reduce disadvantages of life in the city.</p></td><td><p>Cuộc sống ở một thành phố đông đúc như Hà Nội có nhiều thuận lợi, nhưng nó cũng mang lại nhiều bất lợi. Cuộc sống ở đây là quá ồn ào và bụi bặm. Có quá nhiều phương tiện trên đường phố. Nhiều hoạt động khác như xây dựng và giao thông làm cho không gian rất ồn ào. Nhiều người hơn có nghĩa là có nhiều chất thải làm cho vấn đề ô nhiễm nghiêm trọng hơn. Chính phủ nên có biện pháp giảm phương tiện cá nhân. Việc kiểm soát và theo dõi sát sao số lượng người nhập cư cũng rất quan trọng để chúng ta có thể giảm bớt những bất lợi của cuộc sống trong thành phố.</p></td></tr></table></div></div>"}]}, {"title": "Objectives · Mục tiêu", "icon": "🎯", "desc": "Unit 12 · An overcrowded world", "subs": [{"label": "Mục tiêu theo tài liệu", "html": "<div class=\"source\"><p><b>UNIT </b><b>12</b><b> </b></p><p><b>AN OVERCROWDED WORLD</b></p><p>Một thế giới quá đông dân</p><p><b>MỤC TIÊU – Objectives</b></p><p>* <b>TỪ VỰNG</b> – Vocabulary</p><p>sử dụng từ vựng liên quan đến chủ điểm &quot;thế giới đông dân cư&quot;</p><p>* <b>NGỮ ÂM</b> – Pronunciation</p><p>đánh trọng âm và phát âm chính xác các từ có hai và ba âm tiết</p><p>* <b>NGỮ PHÁP</b> – Grammar</p><p>sử dụng chính xác so sánh về số lượng với <i>more, less/ fewer</i></p><p>sử dụng thành thạo câu hỏi đuôi</p><p><b>* KỸ NĂNG ĐỌC</b> – Reading skills</p><p>đọc tìm thông tin cụ thể về sự bùng nổ dân số</p><p>* <b>KỸ NĂNG NÓI</b> – Speaking skills</p><p>nói về những bất lợi khi sống ở một nơi quá đông đúc</p><p>* <b>KỸ NĂNG NGHE</b> – Listening Skills</p><p>nghe lấy thông tin cụ thể về một bài phê bình phim</p><p>* <b>KỸ NĂNG VIẾT</b> – Writing skills</p><p>viết một đoạn văn ngắn về sự gia tăng dân số của một khu vực</p></div>"}]}];
const V12=[{"w": "affect", "p": "/əˈfekt/", "pos": "v.", "vi": "tác động, ảnh hưởng", "ex": "In my city, overcrowding seriously affected people’s lives. (Ở thành phố tôi ở, tình trạng quá tải dân số đã ảnh hưởng nghiêm trọng đến cuộc sống của người dân)"}, {"w": "block", "p": "/blɒk/", "pos": "v.", "vi": "gây ùn tắc", "ex": "Traffic blocks roads in most big cities during peak hours. (Giao thông ùn tắc ở hầu hết các thành phố lớn trong giờ cao điểm)"}, {"w": "cheat", "p": "/tʃiːt/", "pos": "v.", "vi": "lừa đảo", "ex": "The company has cheated its consumers in many ways. (Công ty ấy đã lừa đảo người tiêu dùng bằng nhiều cách)"}, {"w": "crime", "p": "/kraɪm/", "pos": "n.", "vi": "tội phạm", "ex": "One of the common issues with living in a city is crime. (Một trong những vấn đề phổ biến khi sống ở thành phố là tội phạm)"}, {"w": "criminal", "p": "/ˈkrɪmɪnl/", "pos": "n.", "vi": "kẻ tội phạm", "ex": "A policeman has the power to arrest a criminal (Cảnh sát có quyền bắt giữ kẻ phạm tội)"}, {"w": "density", "p": "/ˈdensəti/", "pos": "n.", "vi": "mật độ", "ex": "The population density in this city is very high. (Mật độ dân số ở thành phố này rất cao)"}, {"w": "diverse", "p": "/daɪˈvɜːs/", "pos": "adj.", "vi": "đa dạng", "ex": "New York is a very culturally diverse city. (New York là một thành phố rất đa dạng về văn hóa)"}, {"w": "effect", "p": "/ɪˈfekt/", "pos": "n.", "vi": "kết quả, tác động", "ex": "Overpopulation has negative effects on the environment. (Dân số quá đông có tác động tiêu cực đến môi trường)"}, {"w": "explosion", "p": "/ɪkˈspləʊʒn/", "pos": "n.", "vi": "bùng nổ", "ex": "Water pollution is one of the serious problems due to the population explosion. (Ô nhiễm nguồn nước là một trong những vấn đề nghiêm trọng do độ bùng nổ dân số gây ra)"}, {"w": "flea market", "p": "/ˈfliː mɑːkɪt/", "pos": "n.", "vi": "chợ trời", "ex": "There’s a flea market every Sunday in my neighbourhood. (Chợ trời họp vào mỗi Chủ nhật ở khu phố của tôi)"}, {"w": "hunger", "p": "/ˈhʌŋɡə(r)/", "pos": "n.", "vi": "sự đói khát", "ex": "I think the main cause of hunger is the rapid population growth. (Tôi nghĩ rằng nguyên nhân chính gây ra nạn đói là do tốc độ gia tăng dân số nhanh chóng)"}, {"w": "major", "p": "/ˈmeɪdʒə(r)/", "pos": "adj.", "vi": "chính, chủ yếu, lớn", "ex": "Rising living costs is the major effect of overpopulation (Chi phí sinh hoạt tăng là do dân số quá đông đúc gây ra)"}, {"w": "malnutrition", "p": "/ˌmælnjuˈtrɪʃn/", "pos": "n.", "vi": "bệnh suy dinh dưỡng", "ex": "Malnutrition is a leading cause of death for children in my country. (Bệnh suy dinh dưỡng là nguyên nhân chính gây tử vong cho trẻ em ở đất nước tôi)"}, {"w": "megacity", "p": "/ˈmeɡəsɪti/", "pos": "n.", "vi": "thành phố lớn, siêu đô thị", "ex": "Shanghai is one of the largest megacities in the world (Thượng Hải là một trong những siêu đô thị lớn nhất thế giới)"}, {"w": "overcrowded", "p": "/ˌəʊvəˈkraʊdɪd/", "pos": "adj.", "vi": "quá đông đúc", "ex": "Overcrowded slums are breeding grounds for crime. (Khu ổ chuột quá đông đúc là nơi “sản sinh” ra tội phạm)"}, {"w": "poverty", "p": "/ˈpɒvəti/", "pos": "n.", "vi": "sự nghèo đói", "ex": "Poverty is still a big problem in the world today. (Nghèo đói vẫn là một vấn đề lớn trên thế giới hiện nay)"}, {"w": "slum", "p": "/slʌm/", "pos": "n.", "vi": "khu ổ chuột", "ex": "The disease has spread fast among people living in the slums. (Căn bệnh lây lan nhanh sang những người sống trong khu ổ chuột)"}, {"w": "slumdog", "p": "/slʌmdɒɡ/", "pos": "n.", "vi": "kẻ sống ở khu ổ chuột", "ex": "Is he a slumdog? (Cậu ấy có phải là người sống ở khu ổ chuột không?)"}, {"w": "space", "p": "/speɪs/", "pos": "n.", "vi": "không gian", "ex": "The city has little space for elderly people to exercise. (Thành phố ấy có ít không gian cho người cao tuổi tập thể dục)"}, {"w": "spacious", "p": "/ˈspeɪʃəs/", "pos": "adj.", "vi": "rộng rãi", "ex": "They have moved to a more spacious apartment. (Họ đã chuyển đến một căn hộ rộng rãi hơn)"}];
const LISTEN="Over the last half century the population of the world has exploded. Currently there are seven billion people on the planet and this number is projected to grow in a short period of time. Of all of the environmental challenges facing the planet today, overpopulation is sometimes neglected. Issues like pollution, climate change and water shortages all seem to take precedence, but overpopulation is one of the main contributors to many other environmental issues. Overpopulation will place great demands on resources and land, leading to widespread environmental issues in addition to impacting global economies and standards of living. The issue is compounded by the difficulty in providing solutions for this problem and misunderstanding of the causes and effects of overpopulation.";
