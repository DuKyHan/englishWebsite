ừ “a” và trước động từ “is” ta cần điền một danh từ. Dựa vào nghĩa của câu, danh từ “pagoda” (ngôi chùa) là phù hợp nhất.</p><p><b>Dịch nghĩa:</b> A pagoda is a place purely for Buddhism. (<i>Chùa là một nơi chỉ hoàn toàn dành cho Phật giáo.)</i></p>"}, {"q": "During the dig, the archaeological team found some___from the stone Age.", "a": ["relics"], "exp": "<p><b>Giải thích</b>: Sau lượng từ “some” và trước giới từ “from” ta cần điền một danh từ. Dựa vào nghĩa của câu, danh từ “relic” (di vật) là phù hợp nhất. Do “relic” là danh từ đếm được nên sau lượng từ “some” ta phải chia ở dạng số nhiều là “relics”.</p><p><b>Dịch nghĩa</b>: During the dig, the archaeological team found some relics from the stone Age. <i>(Trong quá trình đào bới, đội khảo cổ đã tìm thấy một vài cổ vật từ thời Đồ Đá.)</i></p>"}, {"q": "Her parents always___her the smartest of their children.", "a": ["regard"], "exp": "<p><b>Giải thích</b>: Sau chủ ngữ số nhiều “Her parents” ta cần điền một động từ. Dựa vào nghĩa của câu, động từ “regard” (đánh giá) là phù hợp nhất. Trong câu có trạng từ “always” diễn tả sự việc thường xuyên diễn ra ở thời điểm hiện tại nên ta sử dụng thì hiện tại đơn.</p><p><b>Dịch nghĩa</b>: Her parents always regard her the smartest of their children. <i>(Cha mẹ cô ấy luôn đánh giá cô ấy là đứa thông minh nhất trong những đứa con của họ.)</i></p>"}, {"q": "Military engineers have hurriedly___a bridge across the river.", "a": ["constructed"], "exp": "<p><b>Giải thích</b>: Dựa vào nghĩa của câu, động từ “construct” (xây dựng) là phù hợp nhất. Vị trí cần điền ở phía sau động từ “have” trong cấu trúc câu thì hiện tại hoàn thành nên ta chia động từ ở dạng p.p. là “constructed”.</p><p><b>Dịch nghĩa</b>: Military engineers have hurriedly constructed a bridge across the river. (<i>Các kỹ sư quân độị đã nhanh chóng xây dựng một cây cầu bắc qua sông.)</i></p>"}, {"q": "Have you ever___a career in the police force?", "a": ["considered"], "exp": "<p><b>Giải thích:</b> Dựa vào nghĩa của câu, động từ “consider” (cân nhắc) là phù hợp nhất. Vị trí cần điền ở phía sau động từ “have” trong cấu trúc câu thì hiện tại hoàn thành nên ta chia động từ ở dạng p.p. là “considered”.</p><p><b>Dịch nghĩa</b>: Have you ever considered a career in the police force? <i>(Bạn đã bao giờ từng suy nghĩ về việc làm việc trong lực lượng cảnh sát chưa?)</i></p>"}, {"q": "A___was erected to glorify the country’s national heroes.", "a": ["statue"], "exp": "<p><b>Giải thích</b>: Sau mạo từ “a” và trước động từ “was” ta cần điền một danh từ. Dựa vào nghĩa của câu, danh từ “statue” (bức tượng) là phù hợp nhất.</p><p><b>Dịch nghĩa</b>: A statue was erected to glorify the country’s national heroes<i>. (Một bức tượng đã được dựng lên để vinh danh những anh hùng dân tộc của đất nước.)</i></p>"}, {"q": "Snow-capped mountains___the city.", "a": ["surround"], "exp": "<p><b>Giải thích</b>: Sau chủ ngữ số nhiều “Snow-capped mountains” ta cần điền một động từ. Dựa vào nghĩa của câu, động từ “surround” (bao quanh) là phù hợp nhất. Nội dung trong câu diễn tả một sự việc xảy ra ở thời điểm hiện tại nên ta sử dụng thì hiện tại đơn.</p><p><b>Dịch nghĩa</b>: Snow-capped mountains surround the city. <i>(Những đỉnh núi phủ đầy tuyết bao bọc quanh thành phố.)</i></p>"}, {"q": "The villagers___coffee and avocados to sell in the market.", "a": ["grow"], "exp": "<p><b>Giải thích</b>: Sau chủ ngữ số nhiều “The villagers” ta cần điền một động từ. Dựa vào nghĩa của câu, động từ “grow” (trồng) là phù hợp nhất. Nội dung trong câu diễn tả một sự việc xảy ra ở thời điểm Nện tại nên ta sử dụng thì hiện tại đơn.</p><p><b>Dịch nghĩa</b>: The villagers grow coffee and avocados to sell in the market. (<i>Dân làng trồng cà phê và bơ để bán ở chợ.)</i></p>"}], "before": "<div class=\"note\">Part 2: Use the words you have found to complete the following sentences.</div>"}, {"id": "v2", "label": "II · Từ khác nhóm", "kind": "quiz", "items": [{"q": "Circle one odd word.", "opts": ["well", "gate", "blanket", "pavillion"], "a": 2, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. well (<i>n</i>): giếng nước<b>B</b>. gate (<i>n</i>.): cổng</p><p><b>C</b>. blanket (<i>n</i>.): chăn<b>D</b>. pavillion (<i>n</i>.): lầu, các</p><p>Phương án C là danh từ chỉ đồ vật trong gia đình, các phương án còn lại đều là về cơ sở vật chất.</p>"}, {"q": "Circle one odd word.", "opts": ["tent", "pagoda", "umbrella", "compass"], "a": 1, "exp": "<p><b>Giải thích</b>:</p><p><b>A</b>. tent (<i>n</i>.): chiếc lều<b>B</b>. pagoda (<i>n.</i>): ngôi chùa</p><p><b>C</b>. umbrella (<i>n</i>.): cái ô<b>D</b>. compass (<i>n</i>.): la bàn</p><p>Phương án B là danh từ chỉ nơi chốn, các phương án còn lại đều là danh từ chỉ vật dụng.</p>"}, {"q": "Circle one odd word.", "opts": ["pagoda", "temple", "shrine", "university"], "a": 3, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. pagoda (<i>n</i>.): chùa<b>B</b>. temple (<i>n</i>.): đền, đình</p><p><b>C</b>. shrine (<i>n</i>.): miếu<b>D</b>. university (<i>n</i>.): trường đại học</p><p>Phương án D là danh từ chỉ nơi chốn cho việc dạy và học, các phương án còn lại đều là danh từ chỉ nơi chốn cho việc thờ cúng.</p>"}, {"q": "Circle one odd word.", "opts": ["imperial", "royal", "poor", "noble"], "a": 2, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. imperial (<i>adj.</i>): thuộc về hoàng đế<b>B</b>. royal (<i>adj</i>.): thuộc về hoàng gia</p><p><b>C</b>. poor (<i>adj.</i>): nghèo khổ<b>D</b>. noble (<i>adj</i>.): quý tộc</p><p>Phương án C là tính từ chỉ tính chất, các phương án còn lại đều là tính từ liên quan đến hoàng gia.</p>"}, {"q": "Circle one odd word.", "opts": ["fame", "talent", "recognition", "location"], "a": 3, "exp": "<p><b>Giải thích</b>:</p><p><b>A</b>. fame (<i>n.</i>): danh tiếng<b>B</b>. talent (<i>n</i>.): tài năng</p><p><b>C</b>. recognition (<i>n</i>.): sự công nhận<b>D</b>. location (<i>n</i>.): địa điểm</p><p>Phương án D là danh từ cụ thể, các phương án còn lại đều là danh từ trừu tượng.</p>"}], "before": "<div class=\"note\">II - Circle one odd word A, B, C or D.</div>"}, {"id": "v3", "label": "III · Chọn đáp án", "kind": "quiz", "items": [{"q": "A___has been built to commemorate the 100th anniversary of Leo Tolstoy’s birthday. ", "opts": ["statue", "painting", "picture", "drawing"], "a": 0, "exp": "<p><b>Giải thích</b>:</p><p><b>A</b>. statue (<i>n.</i>): bức tượng<b>B</b>. painting (<i>n</i>.): bức tranh</p><p><b>C</b>. picture (<i>n</i>.): bức ảnh<b>D</b>. drawing (<i>n</i>.): bản vẽ</p><p>Xét về nghĩa, phương án A phù hợp nhất.</p><p><b>Dịch nghĩa</b>: A statue has been built to commemorate the 100th anniversary of Leo Tolstoy’s birthday. <i>(Một bức tượng đã được xây dựng để kỷ niệm sinh nhật lần thứ 100 của Leo Tolstoy.)</i></p>"}, {"q": "These monuments are parts of the cultural___of South America. ", "opts": ["science", "fashion", "heritage", "model"], "a": 2, "exp": "<p><b>Giải thích</b>:</p><p><b>A</b>. science (<i>n</i>.): khoa học <b>B</b>. fashion (<i>n</i>.). thời trang</p><p><b>C</b>. heritage (<i>n</i>.): di sản <b>D</b>. model (<i>n</i>.): hình mẫu</p><p>Xét về nghĩa, phương án C phù hợp nhất.</p><p><b>Dịch nghĩa</b>: These monuments are parts of the cultural heritage of South America. (<i>Những tượng đài này thuộc về di sản văn hóa của Nam Mỹ.)</i></p>"}, {"q": "The pipeline was___to transport oil across Alaska to ports on the coast. ", "opts": ["surrounded", "constructed", "consisted", "bottled"], "a": 1, "exp": "<p><b>Giải thích</b>:</p><p><b>A</b>. surrounded (<i>v</i>.): bao bọc <b>B</b>. constructed (<i>v</i>.). xây dựng</p><p><b>C</b>. consisted (<i>v</i>.). bao gồm <b>D</b>. bottled (<i>v</i>.). đóng chai</p><p>Xét về nghĩa, phương án B phù hợp nhất.</p><p><b>Dịch nghĩa</b>: The pipeline was constructed to transport oil across Alaska to ports on the coast. <i>(Đường ống dẫn đã được xây dựng để vận chuyển dầu vượt qua Alaska để tới các cảng trên bờ biển.)</i></p>"}, {"q": "All passengers for flight LH103 please proceed to___16. ", "opts": ["tent", "well", "pavillion", "gate"], "a": 3, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. tent (n): cái lều <b>B.</b> well (n.): giếng</p><p><b>C</b>. pavillion (n.): lầu, các <b>D</b>. gate (n.): cổng</p><p>Xét về nghĩa, phương án D phù hợp nhất.</p><p><b>Dịch nghĩa</b>: All passengers for flight LH103 please proceed to gate 16. <i>(Tất cả các hành khách đi chuyến bay LH103 xin vui lòng đi tới cổng số 16.)</i></p>"}, {"q": "This___is a place of great holiness for the religion’s followers. ", "opts": ["academy", "temple", "university", "palace"], "a": 1, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. academy (<i>n</i>.): học viện <b>B</b>. temple (<i>n</i>.): đền, đình</p><p><b>C</b>. university (<i>n</i>.): trường đại học <b>D</b>. palace (<i>n</i>.): cung điện</p><p>Xét về nghĩa, phương án B phù hợp nhất.</p><p><b>Dịch nghĩa:</b> This temple is a place of great holiness for the religion’s followers. <i>(Ngồi đền này là một nơi hết sức linh thiêng với những người theo tôn giáo.)</i></p>"}, {"q": "The hotel is___by perfectly manicured gardens. ", "opts": ["surrounded", "constructed", "consisted", "bottled"], "a": 0, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. surrounded (<i>v</i>.): bao bọc <b>B</b>. constructed (<i>v</i>.): xây dựng</p><p><b>C</b>. consisted (<i>v</i>.): bao gồm <b>D</b>. bottled (<i>v</i>.): đóng chai</p><p>Xét về nghĩa, phương án A phù hợp nhất.</p><p><b>Dịch nghĩa</b>: The hotel is surrounded by perfectly manicured gardens. <i>(Khách sạn đó đã được bao quanh bởi những khu vườn được chăm sóc một cách hoàn hảo.)</i></p>"}, {"q": "Sinking more___is the best way of supplying the population with clean drinking water. ", "opts": ["compasses", "wells", "blankets", "tents"], "a": 1, "exp": "<p><b>Giải thích</b>:</p><p><b>A</b>. compasses (<i>pl. n</i>.): la bàn <b>B</b>. wells (<i>pl. n</i>.): giếng nước</p><p><b>C</b>. blankets (<i>pl. n.).</i> chăn <b>D</b>. tents (<i>pl. n.):</i> lều</p><p>Xét về nghĩa, phương án B phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Sinking more wells is the best way of supplying the population with clean drinking water. <i>(Đào thêm nhiều giếng nước là cách tốt nhất để cung cấp nước sạch cho người dân.)</i></p>"}, {"q": "Michelle’s being___for a position in the New York City Police Department. ", "opts": ["regarded", "considered", "recognised", "constructed"], "a": 1, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. regarded (<i>v</i>.): đánh giá<b>B</b>. considered <i>(v</i>.): xem xét</p><p><b>C</b>. recognised (<i>v</i>.): nhận ra, công nhận<b>D</b>. constructed (<i>v</i>.): xây dựng</p><p>Xét về nghĩa, phương án B phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Michelle’s being considered fora position in the New York City Police Department. <i>(Michelle dang được xem xét vào một vị trí trong Sở Cảnh Sát Thành phố New York.)</i></p>"}, {"q": "Ella complained that the company never gave her any___for her contribution. ", "opts": ["location", "relic", "literature", "recognition"], "a": 3, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. location (<i>n</i>.): địa điểm<b>B</b>. relic (<i>n.</i>): di tích</p><p><b>C</b>. literature (<i>n</i>.): văn học<b>D</b>. recognition (n.): sự công nhận</p><p>Xét về nghĩa, phương án D phù hợp nhất.</p><p><b>Dịch nghĩa</b>: Ella complained that the company never gave her any recognition for her contribution. <i>(Ella đã than phiền rằng công ty chẳng bao giờ đưa ra bất kỳ sự công nhận nào đối với cống hiến của cô ấy cả.)</i></p>"}, {"q": "The crowd___of college kids and office workers. ", "opts": ["regards", "erects", "consists", "recognises"], "a": 2, "exp": "<p><b>Giải thích:</b></p><p><b>A</b>. regards (<i>v</i>.): đánh giá<b>B</b>. erects (<i>v</i>.): dựng lên</p><p><b>C</b>. consists <i>(v</i>.): bao gồm<b>D</b>. recognises (<i>v</i>.): nhận ra, công nhận</p><p>Xét về nghĩa, phương án C phù hợp nhất.</p><p><b>Dịch nghĩa</b>: The crowd consists of college kids and office workers. (<i>Đám đông bao gồm mấy sinh viên cao đẳng và dân văn phòng.)</i></p>"}], "before": "<div class=\"note\">III - Choose the best option to complete each of the following sentences.</div>"}]}, {"title": "Pronunciation · Ngữ âm", "icon": "🎧", "desc": "Unit 6 · The first university in Viet Nam", "subs": [{"label": "Lý thuyết", "html": "<div class=\"source\"><p><b>NGỮ ÂM</b></p><p>Pronunciation</p><p><b>1. PHỤ ÂM /</b><b>tʃ</b><b>/</b></p><div class=\"tablewrap\"><table><tr><td><p><b>CÁCH PHÁT ÂM</b></p></td><td><p><b>VÍ DỤ</b></p></td></tr><tr><td></td><td><p>* <u><b>ch</b></u><b>ur</b><u><b>ch</b></u> /<u><b>tʃ</b></u>ɜː<u><b>tʃ</b></u>/ <i>n. (nhà thờ)</i></p><p>* <b>arm</b><u><b>ch</b></u><b>air</b> /ˈɑːm<u><b>tʃ</b></u>eə(r)/ <i>n. (ghế bành)</i></p></td></tr><tr><td></td><td></td></tr></table></div><p><b>2. PHỤ ÂM /</b><b>dʒ</b><b>/</b></p><div class=\"tablewrap\"><table><tr><td><p><b>CÁCH PHÁT ÂM</b></p></td><td><p><b>VÍ DỤ</b></p></td></tr><tr><td></td><td><p>* <u><b>j</b></u><b>am</b> /<u><b>dʒ</b></u>æm/ <i>n. mứt</i></p><p>* <b>messa</b><u><b>g</b></u><b>e</b> /ˈmesɪ<u><b>dʒ</b></u>/ <i>n. tin nhắn</i></p></td></tr><tr><td></td><td></td></tr></table></div></div>"}, {"id": "p1", "label": "I · Hoàn thành từ", "kind": "fill", "items": [{"q": "chea- → ___", "a": ["cheap"], "exp": "Âm /tʃ/"}, {"q": "--ildren → ___", "a": ["children"], "exp": "Âm /tʃ/"}, {"q": "ques--on → ___", "a": ["question"], "exp": "Âm /tʃ/"}, {"q": "architec--re → ___", "a": ["architecture"], "exp": "Âm /tʃ/"}, {"q": "wat-- → ___", "a": ["watch"], "exp": "Âm /tʃ/"}, {"q": "-ob → ___", "a": ["job"], "exp": "Âm /dʒ/"}, {"q": "-uice → ___", "a": ["juice"], "exp": "Âm /dʒ/"}, {"q": "oran-- → ___", "a": ["orange"], "exp": "Âm /dʒ/"}, {"q": "-ym → ___", "a": ["gym"], "exp": "Âm /dʒ/"}, {"q": "--ant → ___", "a": ["giant"], "exp": "Âm /dʒ/"}], "before": "<div class=\"note\">I - Make words with the sound /tʃ/ and /dʒ/. Then read them aloud</div>"}, {"id": "p2", "label": "II · Phân loại âm", "kind": "quiz", "items": [{"q": "teacher", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "cultural", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "nature", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "cherry", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "chicken", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "achievement", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "researcher", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "challenger", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "approach", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "suggestion", "opts": ["/tʃ/", "/dʒ/"], "a": 0, "exp": "Đáp án: /tʃ/"}, {"q": "village", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "heritage", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "jeans", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "luggage", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "engineer", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "jam", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "engine", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "average", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "imagine", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "origin", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "ginger", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "region", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}, {"q": "advantage", "opts": ["/tʃ/", "/dʒ/"], "a": 1, "exp": "Đáp án: /dʒ/"}], "before": "<div class=\"note\">II - Put the following words into the correct columns according to the pronunciation of the underlined parts.</div><div class=\"source\"><p><b>II - Put the following words into the correct columns according to the pronunciation of the underlined parts.</b></p><div class=\"tablewrap\"><table><tr><td><p>tea<u>ch</u>er</p></td><td><p>villa<u>ge</u></p></td><td><p>cul<u>tu</u>ral</p></td><td><p>herita<u>g</u>e</p></td><td><p><u>j</u>eans</p></td><td><p>lugga<u>g</u>e</p></td></tr><tr><td><p>en<u>gi</u>neer</p></td><td><p>na<u>t</u>ure</p></td><td><p><u>ch</u>erry</p></td><td><p><u>j</u>am</p></td><td><p><u>ch</u>icken</p></td><td><p>en<u>gi</u>ne</p></td></tr><tr><td><p>a<u>ch</u>ievement</p></td><td><p>resear<u>ch</u>er</p></td><td><p><u>ch</u>allenger</p></td><td><p>approa<u>ch</u></p></td><td><p>sugges<u>t</u>ion</p></td><td><p>avera<u>g</u>e</p></td></tr><tr><td><p>ima<u>g</u>ine</p></td><td><p>ori<u>gi</u>n</p></td><td><p><u>g</u>inger</p></td><td><p>re<u>g</u>ion</p></td><td><p>advanta<u>g</u>e</p></td><td></td></tr></table></div></div>"}, {"id": "p3", "label": "III · Chọn âm khác", "kind": "quiz", "items": [{"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["resear<u>ch</u>er", "<u>ch</u>allenger", "ar<u>ch</u>itect", "a<u>chi</u>evement"], "a": 2, "exp": "<p><b>Giải thích</b>: ar<u>ch</u>itect /ˈɑːkɪtekt/ có “ch” được phát âm là /k/, các phương án còn lại có “ch” được phát âm là /tʃ/. </p><p><b>A</b>. resear<u>ch</u>er /rɪˈsɜːtʃə(r)/ <b>B.</b> <u>ch</u>allenger /ˈtʃælɪndʒə(r)/ <b>D</b>. a<u>ch</u>ievement /əˈtʃiːvmənt/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["<u>ch</u>eapness", "ex<u>ch</u>ange", "approa<u>ch</u>", "bro<u>ch</u>ure"], "a": 3, "exp": "<p><b>Giải thích</b>: bro<u>ch</u>ure /ˈbrəʊʃə(r)/ có “ch” được phát âm là /ʃ/, các phương án còn lại có “ch” được phát âm là /tʃ/. </p><p><b>A</b>. <u>ch</u>eapness /ˈtʃiːpnəs/<b>B</b>. ex<u>c</u>hange /ɪksˈtʃeɪndʒ/<b>C</b>. approa<u>ch</u> /əˈprəʊtʃ/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["tradi<u>t</u>ion", "condi<u>ti</u>on", "loca<u>ti</u>on", "sugges<u>t</u>ion"], "a": 3, "exp": "<p><b>Giải thích</b>: sugges<u>t</u>ion /səˈdʒestʃən/ có “t” được phát âm là /tʃ/, các phương án còn lại có “t” được phát âm là /ʃ/. </p><p><b>A</b>. tradi<u>t</u>ion /trəˈdɪʃn/ <b>B</b>. condi<u>t</u>ion /kənˈdɪʃn/ <b>C</b>. loca<u>t</u>ion /ləʊˈkeɪʃn/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["avera<u>g</u>e", "herita<u>g</u>e", "to<u>g</u>ether", "advanta<u>g</u>e"], "a": 2, "exp": "<p><b>Giải thích</b>: together /təˈ<u>ɡ</u>eðə(r)/ có “g” được phát âm là /ɡ/, các phương án còn lại có “g” được phát âm là /dʒ/.</p><p><b>A</b>.avera<u>g</u>e /ˈævərɪdʒ/ <b>B</b>. herita<u>g</u>e /ˈherɪtɪdʒ/ <b>D</b>. advanta<u>g</u>e /ədˈvɑːntɪdʒ/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["en<u>g</u>ineer", "ima<u>g</u>ine", "ori<u>g</u>in", "be<u>g</u>inner"], "a": 3, "exp": "<p><b>Giải thích</b>: be<u>g</u>inner /bɪˈɡɪnə(r)/ có “g” được phát âm là /ɡ/, các phương án còn lại có “g” được phát âm là /dʒ/. </p><p><b>A</b>. en<u>g</u>ineer /ˌendʒɪˈnɪə(r)/<b>B</b>. ima<u>g</u>ine /ɪˈmædʒɪn/<b>C</b>. ori<u>g</u>in /ˈɒrɪdʒɪn/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["<u>ch</u>ildren", "<u>ch</u>emist", "an<u>ch</u>or", "s<u>ch</u>ool"], "a": 0, "exp": "<p><b>Giải thích</b>: <u>ch</u>ildren /tʃaɪld/ có “ch” được phát âm là /tʃ/, các phương án còn lại có “ch” được phát âm là /k/.</p><p><b>B</b>.<u>ch</u>emist /ˈkemɪst/ <b>C</b>. an<u>ch</u>or /ˈæŋkə(r)/<b>D</b>. s<u>ch</u>ool /skuːl/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["<u>ch</u>icken", "<u>ch</u>erry", "tea<u>ch</u>er", "ma<u>ch</u>ine"], "a": 3, "exp": "<p><b>Giải thích</b>: ma<u>ch</u>ine /məˈʃiːn/ có “ch” được phát âm là /ʃ/, các phương án còn lại có “ch” được phát âm là /tʃ/.</p><p><b>A</b>.<u>ch</u>icken /ˈtʃɪkɪn/ <b>B</b>. <u>ch</u>erry /ˈtʃeri/<b>C</b>. tea<u>ch</u>er /ˈtiːtʃə(r)/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["ques<u>t</u>ion", "na<u>t</u>ion", "op<u>t</u>ion", "ac<u>t</u>ion"], "a": 0, "exp": "<p><b>Giải thích</b>: ques<u>t</u>ion /ˈkwestʃən/  có “t” được phát âm là /tʃ/, các phương án còn lại có “ti” được phát âm là /ʃ/.</p><p><b>B</b>.na<u>t</u>ion /ˈneɪʃn/<b>C</b>. op<u>t</u>ion /ˈɒpʃn/<b>D</b>. ac<u>t</u>ion /ˈækʃn/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["tar<u>g</u>et", "villa<u>g</u>e", "oran<u>g</u>e", "lugga<u>g</u>e"], "a": 0, "exp": "<p><b>Giải thích</b>: tar<u>g</u>et /ˈtɑːɡɪt/ có “g” được phát âm là /ɡ/, các phương án còn lại có “g” được phát âm là /dʒ/.</p><p><b>B</b>. villa<u>g</u>e /ˈvɪlɪdʒ/<b>C</b>. oran<u>g</u>e /ˈɒrɪndʒ/<b>D</b>. lugga<u>g</u>e /ˈlʌɡɪdʒ/</p>"}, {"q": "Chọn từ có phần gạch chân phát âm khác.", "opts": ["en<u>g</u>ine", "be<u>g</u>in", "gin<u>g</u>er", "re<u>g</u>ion"], "a": 1, "exp": "<p><b>Giải thích</b>: be<u>g</u>in /bɪˈɡɪn/ có “g” được phát âm là /ɡ/, các phương án còn lại có “g” được phát âm là /dʒ/.</p><p><b>A</b>. en<u>g</u>ine /ˈendʒɪn/<b>C</b>. <u>g</u>in<u>g</u>er /ˈdʒɪndʒə(r)/<b>D</b>. re<u>g</u>ion /ˈriːdʒən/</p>"}], "before": "<div class=\"note\">III - Find the word which is pronounced differently in the part underlined.</div>"}]}, {"title": "Grammar · Ngữ pháp", "icon": "🧩", "desc": "Unit 6 · The first university in Viet Nam", "subs": [{"label": "Lý thuyết", "html": "<div class=\"source\"><p><b>NGỮ PHÁP</b></p><p>Grammar</p><p><b>CÂU BỊ ĐỘNG </b>(PASSIVE SENTENCES)</p><div class=\"tablewrap\"><table><tr><td><p><b>a. Cách dùng</b></p><p>• Câu bị động được sử dụng khi hành động quan trọng hơn chủ thể của hành động.</p></td><td><p><b>Ví dụ:</b></p><p>The guitar <b>is played</b> by Susan every day. <i>(Cây ghi-ta được Susan chơi mỗi ngày.)</i></p></td></tr></table></div><p>b. Cấu trúc</p><div class=\"tablewrap\"><table><tr><td></td><td><p><b>Câu bị động ở thì hiện tại đơn </b></p><p><b>(The present simple passive)</b></p></td><td><p><b>Câu bị động ở thì quá khứ đơn </b></p><p><b>(The past simple passive)</b></p></td></tr><tr><td><p><b>Khẳng định</b></p></td><td><p><b>S + am/ is/ are + pp</b></p><p>The plants <b>are grown</b> in a Greenhouse.</p><p><i>(Cây được trồng trong nhà kính.)</i></p></td><td><p><b>S + was/ were + pp</b></p><p>The building <b>was built</b> last year.</p><p><i>(Tòa nhà được xây vào năm ngoái.)</i></p></td></tr><tr><td><p><b>Phủ định</b></p></td><td><p><b>S am/ is/ are + not + pp</b></p><p>The plants <b>aren’t grown</b> in a greenhouse.</p><p><i>(Cây không được trồng trong nhà kính.)</i></p></td><td><p><b>S was/ were + not + pp</b></p><p>The building <b>wasn’t built</b> last year.</p><p><i>(Tòa nhà không được xây vào năm ngoái.)</i></p></td></tr><tr><td><p><b>Nghi vấn</b></p></td><td><p><b>Am/ Is/ Are S + pp</b></p><p><b>Are</b> the plants <b>grown</b> in a greenhouse? <i>(Cây được trồng trong nhà kính phải không?)</i></p></td><td><p><b>Was/ Were + S + pp</b></p><p><b>Was t</b>he building <b>built l</b>ast year?</p><p><i>(Tòa nhà được xây vào năm ngoái phải không?)</i></p></td></tr></table></div><p><b>c. Chú ý:</b></p><div class=\"tablewrap\"><table><tr><td><p>• Trong câu bị động, chủ thể của hành động thường được đặt ở cuối câu.</p><p>• Câu bị động thường được dùng trong văn viết hơn văn nói.</p></td><td><p><b>Ví dụ:</b></p><p>Dinner was made by <b>Anna.</b></p><p>(<i>Bữa tối đã được nấu bởi Anna.)</i></p></td></tr></table></div></div>"}]}, {"title": "Grammar practice", "icon": "📝", "desc": "Unit 6 · The first university in Viet Nam", "subs": [{"id": "g1", "label": "I · Dạng động từ", "kind": "fill", "items": [{"q": "General George Washington was___for his wisdom and courage.", "a": ["known"], "exp": "<p><b>Dịch nghĩa</b>: General George Washington was known for his wisdom and courage. <i>(Tướng George Washington đã rất nổi tiếng vì trí tuệ và lòng can đảm của mình.)</i></p>"}, {"q": "James was___a huge fortune for his invention.", "a": ["paid"], "exp": "<p><b>Dịch nghĩa</b>: James was paid a huge fortune for his invention. <i>(James đã được trả một gia tài khổng lồ nhờ vào phát minh của mình.)</i></p>"}, {"q": "The examination papers were___out at nine o’clock.", "a": ["given"], "exp": "<p><b>Dịch nghĩa</b>: The examination papers were given out at nine o’clock. (<i>Đề thi đã được phát ra vào lúc chín giờ.)</i></p>"}, {"q": "The statue of King Hupugarta was___of gold and jewelry.", "a": ["made"], "exp": "<p><b>Dịch nghĩa</b>: The statue of King Hupugarta was made of gold and jewelry. <i>(Bức tượng của Vua Hupugarta đã được làm bằng vàng và đá quý.)</i></p>"}, {"q": "My watch is___. I don’t know what time it is now.", "a": ["broken"], "exp": "<p><b>Dịch nghĩa</b>: My watch is broken. I don’t know what time it is now. (<i>Đồng hồ đeo tay của tôi bị hỏng. Tôi không biết bây giờ là mấy giờ.)</i></p>"}, {"q": "Over 10 million dollars was___on the SpaceX project last year.", "a": ["spent"], "exp": "<p><b>Dịch nghĩa</b>: Over 10 million dollars was spent on the SpaceX project last year. (<i>Hơn 10 triệu đô la Mỹ đã được chi vào dự án SpaceX trong năm ngoái.)</i></p>"}, {"q": "“A Hard Day’s Night” was___by The Beatles.", "a": ["written"], "exp": "<p><b>Dịch nghĩa</b>: “A Hard Day’s Night” was written by The Beatles. <i>(“A Hard Day’s Night” đã được viết bởi nhóm The Beatles.)</i></p>"}, {"q": "The Royal Palace of Bucharest was___in 1937.", "a": ["built"], "exp": "<p><b>Dịch nghĩa</b>: The Royal Palace of Bucharest was built in 1937. <i>(Cung điện Hoàng gia của thành phố Bucharest đã được xây dựng vào năm 1937.)</i></p>"}], "before": "<div class=\"note\">I - Complete the following sentences using the correct form of the verbs in the box. There is one EXTRA verb.</div><div class=\"source\"><p><b>I - Complete the following sentences using the correct form of the verbs in the box. There i</b>s one EXTRA verb.</p><div class=\"tablewrap\"><table><tr><td><p>pay</p></td><td><p>break</p></td><td><p>catch</p></td><td><p>make</p></td><td><p>build</p></td></tr><tr><td><p>give</p></td><td><p>spend</p></td><td><p>write</p></td><td><p>know</p></td><td><p>teach</p></td></tr></table></div><p><i>E.g.: Adam was__caught__on security camera shoplifting clothes.</i></p></div>"}, {"id": "g2", "label": "II · Chọn đáp án", "kind": "quiz", "items": [{"q": "“Harry Potter and the Goblet of Fire” ___by J. K. Rowling 20 years ago. ", "opts": ["was written", "were written", "are written", "is written"], "a": 0, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “20 years ago” (20 năm về trước) diễn tả sự việc xảy ra ở trong quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “Harry Potter and the Goblet of Fire” (tên tác phẩm) chịu tác động của hành động “write” nên động từ được chia ở dạng bị động là “was written”.</p><p><b>Dịch nghĩa</b>: “Harry Potter and the Goblet of Fire” was written by J. K. Rowling 20 years ago. <i>(“Harry Potter và chiếc cốc lửa” đã được viết bởi J. K. Rowling 20 năm về trước.)</i></p>"}, {"q": "At the trial yesterday, Noah___to five years in prison for robbery. ", "opts": ["sentences", "are sentenced", "sentenced", "was sentenced"], "a": 3, "exp": "<p><b>Giải thích:</b> Trong câu có trạng từ chỉ thời gian “yesterday” (ngày hôm qua) diễn tả sự việc xảy ra ở trong quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “Noah” chịu tác động của hành động “sentence” nên động từ được chia ở dạng bị động là “was sentenced”.</p><p><b>Dịch nghĩa</b>: At the trial yesterday, Noah was sentenced to five years in prison for robbery. (<i>Trong phiên tòa ngày hôm qua, Noah đã bị kết án năm năm tù giam vì tội trộm cắp tài sản.)</i></p>"}, {"q": "Volkswagen cars___in Germany and the Czech Republic. ", "opts": ["are made", "is made", "makes", "make"], "a": 0, "exp": "<p><b>Giải thích</b>: Nội dung trong câu dùng để diễn tả một sự thật hiển nhiên diễn ra ở thời điểm hiện tại, nên ta sử dụng thì hiện tại đơn. Chủ ngữ “Volkswagen cars” là chịu tác động của hành động “make” nên động từ được chia ở dạng bị động là “are made”.</p><p><b>Dịch nghĩa</b>: Volkswagen cars are made in Germany and the Czech Republic. (<i>Những chiếc ô tô của hãng Volkswagen được sản xuất tại Đức và Cộng hòa Séc.)</i></p>"}, {"q": "Coal miners___gold in a cave near the top of the mountain. ", "opts": ["were discovered", "was discovered", "discovered", "have been discovered"], "a": 2, "exp": "<p><b>Giải thích</b>: Chủ ngữ “Coal miners” là chủ thể của hành động “discover” nên động từ phải được chia ở dạng chủ động, c là phương án chính xác duy nhất.</p><p><b>Dịch nghĩa</b>: Coal miners discovered gold in a cave near the top of the mountain. <i>(Những người thợ mỏ than đã phát hiện ra vàng trong một cái hang gần đỉnh núi.)</i></p>"}, {"q": "A million dollars in cash___from the Bank of East Asia last week. ", "opts": ["were stolen", "was stolen", "stole", "stolen"], "a": 1, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “last week” (tuần trước) diễn tả sự việc xảy ra trong quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “A million dollars in cash” chịu tác động của hành động “steal” nên động từ được chia ở dạng bị động là “was stolen”.</p><p><b>Dịch nghĩa</b>: A million dollars in cash was stolen from the Bank of East Asia last week. (<i>Một triệu đô la tiền mặt đã bị lấy trộm từ Ngân hàng Đông Á trong tuần trước.)</i></p>"}, {"q": "Nowadays, most experts___that the painting is fake. ", "opts": ["believe", "believed", "is believed", "were believed"], "a": 0, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “Nowadays” (ngày nay) diễn tả sự việc xảy ra ở thời điểm hiện tại nên ta dùng thì hiện tại đơn. Chủ ngữ “most experts” là chủ thể của hành động “believe” nên động từ được chia ở dạng chủ động là “believe”.</p><p><b>Dịch nghĩa</b>: Nowadays, most experts believe that the painting is fake. (<i>Ngày nay, phần lớn các chuyên gia tin rằng bức tranh này là giả.)</i></p>"}, {"q": "The council___to postpone the next meeting until the end of the month. ", "opts": ["has decided", "is decided", "was decided", "will be decided"], "a": 0, "exp": "<p><b>Giải thích</b>: Chủ ngữ “The council” là chủ thể của hành động “decide” nên động từ phải được chia ở dạng chủ động, A là phương án chính xác duy nhất.</p><p><b>Dịch nghĩa</b>: The council has decided to postpone the next meeting until the end of the month. (<i>Hội đồng đã quyết định hoãn buổi họp tiếp theo tới tận cuối tháng.)</i></p>"}, {"q": "The National Museum of Thailand___at 4.30 p.m. every day. ", "opts": ["closes", "closed", "is closed", "was closed"], "a": 0, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “every day” (hàng ngày) diễn tả sự việc thường xuyên xảy ra ở thời điểm hiện tại nên ta dùng thì hiện tại đơn. Chủ ngữ “The National Museum of Thailand” là chủ thể của hành động “close” nên động từ được chia ở dạng chủ động là “closes”.</p><p><b>Dịch nghĩa</b>: The National Museum of Thailand closes at 4.30 p.m. every day. (<i>Bảo tàng Quốc gia Thái Lan đóng cửa vào 4:30 chiều mỗi ngày.)</i></p>"}, {"q": "In 2018, 88 outstanding university graduates___at a ceremony at Van Mieu - Quoc Tu Giam. ", "opts": ["honoured", "had honoured", "was honoured", "were honoured"], "a": 3, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “In 2018” (vào năm 2018) diễn tả sự việc xảy ra ở thời điểm quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “88 outstanding university graduates” chịu tác động của hành động “honour” nên động từ được chia ở dạng bị động là “were honoured”.</p><p><b>Dịch nghĩa</b>: In 2018, 88 outstanding universities graduates were honoured at a ceremony at Van Mleu - Quoc Tu Giam. (<i>Trong năm 2018, 88 sinh viên đại học tốt nghiệp đặc biệt xuất sắc đã được vinh danh trong một buổi lễ tại Văn Miếu - Quốc Tử Giám.)</i></p>"}, {"q": "When Tony started his business, he___a financial advisor to help him manage the company. ", "opts": ["hired", "hires", "hire", "was hired"], "a": 0, "exp": "<p><b>Giải thích</b>: Trong ngữ cảnh có sử dụng thì quá khứ đơn “When Tony started his business ...” diễn tả sự việc đã xảy ra trong quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “he” là chủ thể của hành động “hire” nên động từ được chia ở dạng chủ động là “hired”.</p><p><b>Dịch nghĩa</b>: When Tony started his business, he hired a financial advisor to help him manage the company. (<i>Khi Tony bắt đầu khởi nghiệp, anh ấy đã thuê một cố vấn tài chính để giúp mình quản lý công ty.)</i></p>"}, {"q": "- “What a beautiful dress you’re wearing!” - “Thank you. It___by a very talented tailor.” ", "opts": ["is made", "will make", "made", "was made"], "a": 3, "exp": "<p><b>Giải thích</b>: Nội dung trong câu dùng để diễn tả một sự việc đã xảy ra trong quá khứ, nên ta sử dụng thì quá khứ đơn. Chủ ngữ “It” chịu tác động của hành động “make” nên động từ được chia ở dạng bị động là “was made”.</p><p><b>Dịch nghĩa</b>: - “What a beautiful dress you’re wearing!” - “Thank you. It was made by a very talented tailor.” (-“<i>Chiếc váy bạn mặc đẹp quá!” - “Cảm ơn bạn. Nó được một thợ may rất giỏi làm đấy.”)</i></p>"}, {"q": "- “Where did you get these old dresses?” - “I___them in the old trunk.” ", "opts": ["found", "was found", "am found", "find"], "a": 0, "exp": "<p><b>Giải thích</b>: Trong ngữ cảnh có sử dụng thì quá khứ đơn “Where did you get...” diễn tả sự việc đã xảy ra ở thời điểm quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “I” là chủ thể của hành động “find” nên động từ được chia ở dạng chủ động là “found”.</p><p><b>Dịch nghĩa:</b> - “Where did you get these old dresses?” - “I found them in the old trunk.” <i>(- “Bạn lấy mấy cái váy cũ này ở đâu ra thế?” - “Tôi đã tìm thấy chúng trong cái hòm cũ.”)</i></p>"}, {"q": "- “Do you know that the new secretary___at 100 words per minute?” - “Wow, that’s amazing!” ", "opts": ["can type", "can be typed", "could type", "could be typed"], "a": 0, "exp": "<p><b>Giải thích</b>: Nội dung trong câu dùng để diễn tả một sự thật hiển nhiên diễn ra ở thời điểm hiện tại, nên ta sử dụng thì hiện tại đơn. Chủ ngữ “the new secretary” là chủ thể của hành động “type” nên động từ được chia ở dạng chủ động là “can type”.</p><p><b>Dịch nghĩa</b>: - “Do you know that the new secretary can type at 100 words per minute?” - “Wow, that’s amazing!” <i>(- “Bạn biết là cô thư ký mới có thể đánh máy được 100 từ một phút không?” - “Wow, đáng nể thật!”)</i></p>"}, {"q": "A young girl___to hospital after she broke her leg. ", "opts": ["had taken", "were taken", "took", "was taken"], "a": 3, "exp": "<p><b>Giải thích</b>: Trong ngữ cảnh có sử dụng thì quá khứ đơn “she broke her leg ...” diễn tả sự việc đã xảy ra ở thời điểm quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “A young girl” chịu tác động của hành động “take” nên động từ được chia ở dạng bị động là “was taken”.</p><p><b>Dịch nghĩa</b>: A young girl was taken to hospital after she broke her leg. (<i>Một cô gái trẻ đã được đưa tới bệnh viện sau khi cô bị gãy chân.)</i></p>"}, {"q": "America___by Columbus in 1492. ", "opts": ["has been discovered", "was discovered", "discovered", "had discovered"], "a": 1, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “in 1492” (trong năm 1492) diễn tả sự việc xảy ra ờ trong quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “America” chịu tác động của hành động “discover” nên động từ được chia ở dạng bị động là “was discovered”.</p><p><b>Dịch nghĩa</b>: America was discovered by Columbus in 1492. (<i>Châu Mỹ đã được phát hiện bởi Columbus năm 1492.) </i>Giaoandethitienganh.info sưu tầm</p><p><i></i></p>"}, {"q": "The old shopping mall___so that a new supermarket could be built. ", "opts": ["were demolished", "has demolished", "was demolished", "have demolished"], "a": 2, "exp": "<p><b>Giải thích</b>: Trong ngữ cảnh có sử dụng thì quá khứ đơn “... a new supermarket could be built.” diễn tả sự việc đã xảy ra trong quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “The old shopping mall” chịu tác động của hành động “demolish” nên động từ được chia ở dạng bị động là “was demolished”.</p><p><b>Dịch nghĩa</b>: The old shopping mall was demolished so that a new supermarket could be built. (<i>Trung tâm thương mại cũ đã bị phá dỡ để cho một siêu thị mới có thể được xây dựng.)</i></p>"}, {"q": "When Brandon Communication first opened, the sales department___by Mr. Johnson. ", "opts": ["was run", "is run", "ran", "runs"], "a": 0, "exp": "<p><b>Giải thích:</b> Trong ngữ cảnh có sử dụng thì quá khứ đơn “When Brandon Communication first opened ...” diễn tả sự việc đã xảy ra trong quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “the sales department” chịu tác động của hành động “run” nên động từ được chia ở dạng bị động là “was run”.</p><p><b>Dịch nghĩa:</b> When Brandon Communication first opened, the sales department was run by Mr. Johnson. <i>(Khi công ty truyền thông Brandon mới được thành lập, bộ phận kinh doanh do ông Johnson điều hành.)</i></p>"}, {"q": "Wind speeds___ninety miles an hour in some places during the storm last night. ", "opts": ["were reached", "reached", "has reached", "have reached"], "a": 1, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “last night” (đêm qua) diễn tả sự việc xảy ra trong quá khứ nên ta dùng thì quá khứ đơn. Chủ ngữ “Wind speeds” là chủ thể của hành động “reach” nên động từ được chia ở dạng chủ động là “reached”.</p><p><b>Dịch nghĩa</b>: Wind speeds reached ninety miles an hour in some places during the storm last night<i>. (Tốc độ gió đã đạt tới 90 dặm một giờ ở một vài địa điểm trong cơn bão tối hôm qua.)</i></p>"}, {"q": "In the U.S, 350 slices of pizza___every second. ", "opts": ["are eaten", "were eaten", "have eaten", "eat"], "a": 0, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “Nowadays” (ngày nay) diễn tả sự việc xảy ra ở thời điểm hiện tại nên ta dùng thì hiện tại đơn. Chủ ngữ “350 slices of pizza” chịu tác động của hành động “eat” nên động từ được chia ở dạng bị động là “are eaten”.</p><p><b>Dịch nghĩa</b>: In the U.S, 350 slices of pizza are eaten every second. (<i>Ở nước Mỹ, 350 miếng bánh pizza được ăn mỗi giây.)</i></p>"}, {"q": "More than 10,000 students___from univesities in Vietnam every year. ", "opts": ["are graduated", "graduated", "had graduated", "graduate"], "a": 3, "exp": "<p><b>Giải thích</b>: Trong câu có trạng từ chỉ thời gian “every year” (hàng năm) diễn tả sự việc xảy ra ở thời điểm hiện tại nên ta dùng thì hiện tại đơn. Chủ ngữ “more than 10,000 students” là chủ thể của hành động “graduate” nên động từ được chia ở dạng chủ động là “graduate”.</p><p><b>Dịch nghĩa</b>: More than 10,000 students graduate from univesities in Vietnam every year. (<i>Hàng năm, hơn 10.000 sinh viên tốt nghiệp từ các trường đại học ở Việt Nam.)</i></p>"}], "before": "<div class=\"note\">II- Choose the best option to complete each of the following sentences.</div>"}, {"id": "g3", "label": "III · Câu bị động", "kind": "write", "items": [{"c": "I didn’t do my homework yesterday.", "a": "My homework wasn’t done (by me) yesterday.", "vi": "  Giải thích : I didn’t do my homework yesterday. (Tôi đã không làm bài tập về nhà ngày hôm qua.)  Cấu trúc bị động của câu phủ định ở thì quá khứ đơn là “S + wasn’t/ weren’t + p.p. ”. Động từ “do” được chia theo chủ ngữ số ít (danh từ không đếm được) “my homework” là “wasn’t done”.   Dịch nghĩa : Bài tập về nhà của tôi đã không được làm (bởi tôi) ngày hôm qua. "}, {"c": "Did Joana clean up her room?", "a": "Was Joana’s room cleaned (by her)?", "vi": "  Giải thích : Did Joana clean up her room? (Joana đã dọn phòng cô ấy chưa?)  Cấu trúc bị động của câu nghi vấn ở thì quá khứ đơn là “Was/ Were + S + p.p.?”. Động từ “clean” được chia theo chủ ngữ số ít “Joana’s room” là “Was ... cleaned”.   Dịch nghĩa : Phòng của Joana đã được dọn (bởi cô ấy) phải không? "}, {"c": "John painted the house With blue and white paint last week.", "a": "The house was painted blue and white by John last week.", "vi": "  Giải thích : John painted the house blue and white last week. (John đã sơn ngôi nhà với sơn màu lam và màu trắng vào tuần trước.)  Cấu trúc bị động của câu khẳng định ở thì quá khứ đơn là “S + was/ were + p.p. ”. Động từ “paint” được chia theo chủ ngữ số ít “John” là “was painted”.   Dịch nghĩa : Ngôi nhà đã được John sơn bằng màu lam và màu trắng vào tuần trước. "}, {"c": "People usually drink champagne on New Year’s Eve.", "a": "Champagne is usually drunk on New Year’s Eve.", "vi": "  Giải thích : People usually drink champagne on New Year’s Eve. (Mọi người thường uống rượu sâm-panh vào đêm Giao thừa.)  Cấu trúc bị động của câu khẳng định ở thì hiện tại đơn là “S + is/ are + p.p. ”. Động từ “drink” được chia theo chủ ngữ số ít “Champagne” là “is drunk”.   Dịch nghĩa : Rượu sâm-panh thường được uống vào đêm Giao thừa. "}, {"c": "The head chef uses these machines to mix all the ingredients.", "a": "These machines are used by the head chef to mix all the ingredients.", "vi": "  Giải thích : The head chef uses these machines to mix all the ingredients, (ông bếp trưởng sử dụng những chiếc máy này để trộn các loại nguyên liệu.)  Cấu trúc bị động của câu khẳng định ở thì hiện tại đơn là “S + isn’t/ aren’t + p.p. ”. Động từ “use” được chia theo chủ ngữ số nhiều “These machines” là “are used”.   Dịch nghĩa : Những chiếc máy này được sử dụng bởi bếp trưởng để trộn tất cả các loại nguyên liệu. "}, {"c": "English students don’t consider French a difficult language.", "a": "French isn’t considered a difficult language by English students.", "vi": "  Giải thích:  English students don’t consider French a difficult language. (Các học sinh người Anh không coi tiếng Pháp là một ngôn ngữ khó.)  cấu trúc bị động của câu phủ định ở thì hiện tại đơn là “S + isn’t/ aren’t + p.p. ”. Động từ “consider” được chia theo chủ ngữ số ít “French” là “isn’t considered”.   Dịch nghĩa : Tiếng Pháp không được các học sinh người Anh coi là một ngôn ngữ khó. "}, {"c": "Do people speak English in Vietnam?", "a": "Is English spoken in Vietnam?", "vi": "  Giải thích : Do people speak English in Vietnam? (Người ta có nói tiếng Anh ở Việt Nam không?)  Cấu trúc bị động của câu nghi vấn ở thì hiện tại đơn là “Is/ Are + S + + p.p.?”. Động từ “speak” được chia theo chủ ngữ số ít “English” là “Is ... spoken”.   Dịch nghĩa : Tiếng Anh có được nói ở Việt Nam không? "}, {"c": "Manchester United paid Alexis Sanchez 300,000 pounds per week in 2018.", "a": "Alexis Sanchez was paid 300,000 pounds per week by Manchester United in 2018.", "vi": "  Giải thích : Manchester United paid Alexis Sanchez 300,000 pounds per week in 2018. (Manchester United đã trả cho Alexis Sanchez 300.000 bảng mỗi tuần trong năm 2018.)  Cấu trúc bị động của câu khẳng định ở thì quá khứ đơn là “S + was/ were + p.p.”. Động từ “pay” được chia theo chủ ngữ số ít “Alexis Sanchez” là “was paid”.   Dịch nghĩa : Alexis Sanchez đã được trả 300.000 bảng mỗi tuần bởi Manchester United trong năm 2018. "}], "before": "<div class=\"note\">III - Rewrite the following sentences using the correct passive voice.</div>"}]}, {"title": "Reading · Đọc hiểu", "icon": "📖", "desc": "Unit 6 · The first university in Viet Nam", "subs": [{"label": "Do you know?", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p><b>DO YOU KNOW?</b></p><p><b>THE TEMPLE OF LITERATURE</b></p><p>*The Temple of Literature or Temple of Culture is a Temple of Confucius in Hanoi, northern Vietnam.</p><p>* The temple hosts the Imperial Academy, Vietnam’s first national university. The temple was built in 1070 at the time of Emperor Ly Thanh Tong.</p><p>* It is one of several temples in Vietnam which is dedicated to Confucius, sages and scholars. The temple Is located to the south of the Imperial Citadel of Thang Long.</p><p>* The various pavilions, halls, statues and stelae of doctors are places where offering ceremonies, study sessions and the strict exams of the Dai Viet took place.</p></td></tr></table></div></div>"}, {"id": "r1", "label": "I · Imperial Academy of Hue", "kind": "quiz", "items": [{"q": "The Impreial Academy of Hue was built following Emperor Minh Mang’s order.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi:</b> Trường Quốc Tử Giám thành phố Huế đã được xây dựng theo lệnh của Hoàng đế Minh Mạng.</p><p><b>Giải thích</b>: Thông tin ở câu 1 đoạn 1: “Under the reign of Emperor Gia Long, [...] , an Imperial Academy was built to replace the Imperial Academy in Thang Long.”</p>"}, {"q": "As of 1826, the Imperial Academy had been renovated twice.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Tính đến năm 1826, trường Quốc Tử Giám đã được cải tạo hai lần.</p><p><b>Giải thích</b>: Thông tin ở câu 3 và câu 4 đoạn 1: “In 1821, an auditorium and three rows of houses for student residence were additionally constructed. In 1825, yet another row of 20 apartments were added.”</p>"}, {"q": "There were accomodations for students inside the Academy.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Đã có các công trình nhà ở, lưu trú dành cho sĩ tử bên trong Trường Quốc Tử Giám.</p><p><b>Giải thích</b>: Thông tin ở câu 3 và câu 4 đoạn 1: “In 1821, an auditorium and three rows of houses for student residence were additionally constructed. In 1825, yet another row of 20 apartments were added.”</p>"}, {"q": "In 1908, it was relocated into its modern-day location.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Năm 1908, trường đã được di dời tới địa điểm như ngày nay.</p><p><b>Giải thích</b>: Thông tin ở câu 1 đoạn 2: “In 1908, in the reign of Duy Tan, the Imperial Academy was moved to its present-day site in the Forbidden City.”</p>"}, {"q": "The Imperial Academy of Hue is the oldest tertiary training insitutions in Viet Nam.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Trường Quốc Tử Giám của thành phố Huế là cơ sở đào tạo đại học lâu đời nhất ở Việt Nam.</p><p><b>Giải thích</b>: Thông tin ở câu 1 đoạn 1: “[...] , an Imperial Academy was built to replace the Imperial Academy in Thang Long.”</p>"}], "before": "<div class=\"source\"><p><b>I</b> <b>- Read the passage and decide whether the statements are True (T) or False (F).</b></p><p><b>THE IMPERIAL ACADEMY OF HUE</b></p><p>Under the reign of Emperor Gia Long, along with the construction of the Temple of Literature In the new capital, an Imperial Academy was built to replace the Imperial Academy in Thang Long. By that time, the number of students was increasing each day, which required the expansion of the Academy. In 1821, an auditorium and three rows of houses for student residence were additionally constructed. In 1825, yet another row of 20 apartments were added.</p><p>In 1908, in the reign of Duy Tan, the Imperial Academy was moved to its present-day site in the Forbidden City. The Imperial Academy consists of Di Luan Mansion, located in the center and two rows of classrooms on either side. Behind the Academy stands the Tan Tho Museum (Imperial Fine Arts Museum) and the former houses of principals and vice-principals to either side. The Imperial Academy, a historic and cultural vestige of remarkable value, is one of the two oldest tertiary training insitutions of the monarchist regime in our country.</p><p>(www. huefestival, com)</p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p><b>TRƯỜNG QUỐC TỬ GIÁM THÀNH PHỐ HUẾ</b></p><p>Dưới triều Hoàng đế Gia Long, cùng với việc xây dựng Văn Miếu (Văn Miếu thành phố Huế) ở kinh đô mới, trường Quốc Tử Giám (Quốc Tử Giám Huế) đã được xây dựng để thay thế trường Quốc Tử Giám thành Thăng Long. Thời kỳ đó, số lượng sĩ tử đang tăng lên mỗi ngày, đòi hỏi sự mở rộng của trường Quốc Tử Giám. Năm 1821, một tòa giảng đường và ba dãy nhà ở cho sĩ tử lưu trú đã được xây dựng thêm. Năm 1825, thêm một dãy 20 gian nhà cũng được bổ sung.</p><p>Năm 1908, dưới đời vua Duy Tân, trường Quốc Tử Giám đã được di dời tới địa điểm hiện tại bên trong Tử Cấm Thành. Quốc Tử Giám gồm có tòa Di Luân Đường, nằm ở trung tâm và có hai dãy phòng học ở hai bên. Phía sau trường Quốc Tử Giám là Tân Thơ Viện (Bảo tàng Mỹ thuật Cung đình) và những gian nhà cũ của các quan Tế Tửu (hiệu trưởng) và Tư Nghiệp (hiệu phó) nằm ở hai bên. Trường Quốc Tử Giám, một di tích lịch sử và văn hóa có những giá trị đặc biệt, là một trong hai cơ sở đào tạo đại học cổ xưa nhất dưới các triều đại quân chủ của đất nước ta.</p></div></details>"}, {"id": "r2", "label": "II · Temple of Literature", "kind": "fill", "items": [{"q": "The complex of the Temple of Literature___an area of 54,000 square meters.", "a": ["sprawls across"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Khu phức hợp Văn Miếu_________diện tích 54.000 mét vuông.</p><p><b>Giải thích</b>: Thông tin có ở câu: “Sprawling across an area of 54,000 square meters, the complex of the Temple of Literature comprises of Van lake, Giam park, and five interior courtyards.”</p>"}, {"q": "The authentic Vietnamese style___is perfectly preserved.", "a": ["architecture"], "exp": "<p><b>Dịch nghĩa câu hỏi: </b>_________phong cách Việt Nam đích thực đưọ’c bảo tồn hoàn hảo.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The authentic Vietnamese style architecture of it resembles the temples in China, set in a perfectly preserved state.”</p>"}, {"q": "Each of the courtyards in the temple unfolds___for every master of beauty and art.", "a": ["surprises"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Mỗi sân trong văn miếu mở ra những_________cho mọi người sành lịch sử về vẻ đẹp và nghệ thuật.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The courtyards in the temple are edged with brick walls and each of these unfolds surprises for every history buff or a connoisseur of beauty and art.”</p>"}, {"q": "There is a large pond in the third courtyard, which was___as the Well of Heavenly Clarity.", "a": ["christened"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Có một cái ao lớn trong sân thứ ba, được__________là Giếng Thiên Quang.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The third courtyard surrounds a large pond which was christened as the Well of Heavenly Clarity.”</p>"}, {"q": "Thai Hoc that features a bell tower and a large drum is in the___courtyard", "a": ["fifth"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Thái Học có tháp chuông và trống lớn ở sân__________.</p><p><b>Giải thích</b>: Thông tin có ở câu: “The fourth courtyard is marked by the statue of Confucius and a house of ceremonies, and finally, the fifth courtyard, famous as Thai Hoc, features a bell tower and a large drum.”</p>"}], "before": "<div class=\"source\"><p><b>II - Read the passage and fill in the blank ONE or TWO words to complete the statements.</b></p><p>Sprawling across an area of 54,000 square meters, the complex of the Temple of Literature comprises of Van lake, Giam park, and five interior courtyards. The authentic Vietnamese style architecture of it resembles the temples in China, set in a perfectly preserved state.</p><p>The courtyards in the temple are edged with brick walls and each of these unfolds surprises for every history expert or a master of beauty and art. The first two courtyards are decorated with perfectly manicured gardens posing against a backdrop of majestic landscapes. The third courtyard surrounds a large pond which was chris¬tened as the Well of Heavenly Clarity. The fourth courtyard is marked by the statue of Confucius and a house of ceremonies, and finally, the fifth courtyard, famous as Thai Hoc, features a bell tower and a large drum.</p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p>Trải dài trên diện tích 54.000 mét vuông, khu phức hợp Văn Miếu bao gồm hồ Văn, vườn Giám và năm sân trong. Kiến trúc theo phong cách Việt Nam đích thực của nó giống như những ngôi đền ở Trung Quốc, được đặt trong một trạng thái được bảo tồn hoàn hảo.</p><p>Các sân trong đền được bao quanh bằng những bức tường gạch và mỗi bức tường này lại mở ra những bất ngờ cho người yêu thích lịch sử hoặc một người sành về vẻ đẹp và nghệ thuật. Hai sân đầu tiên được trang trí với những khu vườn được cắt tỉa hoàn hảo tạo dáng trên nền của những cảnh quan hùng vĩ. Khoảng sân thứ ba bao gồm một cái ao lớn được đặt tên là Giếng Thiên Quang. Khoảng sân thứ tư được chú ý bởi tượng Khổng Tử và một ngôi nhà để thực hiện nghi lễ, và cuối cùng, sân thứ năm, nổi tiếng là Thái Học, có một tháp chuông và một cái trống lớn.</p></div></details>"}]}, {"title": "Listening · Nghe", "icon": "🔊", "desc": "Unit 6 · The first university in Viet Nam", "subs": [{"id": "l1", "label": "Nghe & làm bài", "kind": "quiz", "items": [{"q": "Emperor Le Thanh Tong was the___emperor of the Le dynasty. ", "opts": ["3rd", "4th", "5th", "6th"], "a": 2, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Vua Lê Thánh Tông là vị vua_________của triều nhà Lê.</p><p><b>A</b>. thứ ba<b>B</b>. thứ tư <b>C</b>. thứ năm<b>D</b>. thứ sáu</p><p><b>Giải thích</b>: Thông tin được đưa ra ở câu: “Emperor Lê Thanh Tong was the 5th emperor of the Kingdom of Dai Viet during the Le dynasty, [...]”</p>"}, {"q": "He was born in___. ", "opts": ["1414", "1442", "1460", "1463"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi:</b> Ông được sinh ra vào_________.</p><p><b>A</b>. năm 1414<b>B</b>. năm 1442 <b>C</b>. năm 1460<b>D</b>. năm 1463</p><p><b>Giải thích:</b> Thông tin được đưa ra ở câu: “He was born in 1442.”</p>"}, {"q": "He ordered___to be erected across the country. ", "opts": ["Imperial academies", "temples of literature", "Buddhist pagodas", "All are correct."], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Ông đã ra lệnh cho___________được dựng lên trên khắp đất nước.</p><p><b>A</b>. trường Quốc Tử Giám<b>B</b>. Văn Miếu</p><p><b>C</b>. chùa Phật Giáo<b>D</b>. Tất cả đều đúng.</p><p><b>Giải thích</b>: Thông tin được đưa ra ở câu: “He had “temples of literature” built in many provinces.”</p>"}, {"q": "He set up Doctor’s stone tablets in the Temple of Literature - the Imperial Academy to___. ", "opts": ["praise the laureates", "record the examination process", "Inspire other students", "All are correct."], "a": 3, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Ông đã lập ra bia đá Tiến sĩ ở Văn Miếu - Quốc Tử Giám để__________.</p><p><b>A</b>. khen ngợi những thí sinh đỗ đạt<b>B</b>. ghi lại quá trình thi cử</p><p><b>C</b>. truyền cảm hứng cho các sĩ tử khác<b>D</b>. Tất cả đều đúng.</p><p><b>Giải thích:</b> Thông tin được đưa ra ở đoạn 3: “Later, in order to honour the laureates and encourage other students [...] Emperor Le Thanh Tong ordered to build Doctor’s stone tablets in the Temple of Literature - the Imperial Academy in 1484. The information of each examination was engraved on the tablets.”</p>"}, {"q": "He passed away in___. ", "opts": ["1467", "1474", "1484", "1497"], "a": 3, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Ông đã qua đời vào__________.</p><p><b>A</b>. năm 1467<b>B</b>. năm 1474<b>C</b>. năm 1484<b>D</b>. năm 1497</p><p><b>Giải thích: </b>Thông tin được đưa ra ở câu: “The emperor died in 1497.”</p>"}], "before": "<div class=\"note\">Giọng đọc tổng hợp từ lời thoại trong tài liệu.</div><button class=\"btn solid\" onclick=\"say(LISTEN)\">▶ Nghe</button> <button class=\"btn\" onclick=\"speechSynthesis.cancel()\">■ Dừng</button>"}, {"label": "Lời thoại & bản dịch", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p>Emperor Le Thanh Tong was the 5th emperor of the Kingdom of Dai Viet during the Le dynasty, and he is one of the greatest monarchs in Vietnamese feudal history.</p><p>He was born in 1442. He was the son of Emperor Le Thai Tong. After succeeding to the throne in 1460, he encouraged the spread of Confucianism throughout Dai Viet. He had “temples of literature” built in many provinces. He revived the examination process to recruit top scholars into the government. The Imperial exams were held every three years since the first examination in 1463.</p><p>Later, in order to honour the laureates and encourage other students to serve the realm in similar manner, Emperor Le Thanh Tong ordered to build Doctor’s stone tablets in the Temple of Literature - the Imperial Academy in 1484. The information of each examination was engraved on the tablets.</p><p>The emperor died in 1497. Nowadays, many scholars consider him to be one of the pioneers in the development of Vietnamese education.</p></td><td><p>Vua Lê Thánh Tông là vị vua thứ 5 của nước Đại Việt dưới thời nhà Lê, và ông là một trong những vị vua vĩ đại nhất trong lịch sử phong kiến Việt Nam.</p><p>Ông sinh năm 1442. ông là con trai của vua Lê Thái Tông. Sau khi lên ngôi vào năm 1460, ông đã khuyến khích sự truyền bá Nho giáo trên toàn cõi Đại Việt. Ông cho xây dựng “văn miếu” ở rất nhiều tỉnh thành trên cả nước, ông đã cho khôi phục chế độ khoa bảng để tuyển mộ các học giả ưu tú vào bộ máy quan lại. Khoa thi Đình được tổ chức ba năm một lần kể từ khoa thi đầu tiên vào năm 1463.</p><p>Sau này, nhằm mục đích vinh danh các sĩ tử thi đỗ và khuyến khích các sĩ tử khác theo đó mà cống hiến cho quê hương, vua Lê Thánh Tông đã lệnh cho xây dựng bia đá Tiến Sĩ tại Văn Miếu - Quốc Tử Giám vào năm 1484. Thông tin của mỗi kỳ thi đều được khắc lên trên các bia đá.</p><p>Nhà vua đã qua đời năm 1497. Ngày nay, rất nhiều học giả đánh giá ông là một trong những nhân vật then chốt trong quá trình phát triển của nền giáo dục Việt Nam.</p></td></tr></table></div></div>"}]}, {"title": "Speaking · Nói", "icon": "💬", "desc": "Unit 6 · The first university in Viet Nam", "subs": [{"label": "Đề bài & hướng dẫn", "html": "<div class=\"source\"><p><b>Talk about a historical place in your hometown.</b></p><p>You can use the following questions as cues.</p><p>•What is the name and location of the place?</p><p>• When was it built?</p><p>•What are its attractions?</p><p>• What do people often do when visiting it?</p><p><b>Useful languages:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Useful vocabulary</b></p></td><td><p><b>Useful structures</b></p></td></tr><tr><td><p>• Perfume pagoda, Hue Imperial City, Independence Palace, Notre-Dame cathedral</p><p>•under the reign of, 19th century, 60 years ago, French colonial era</p><p>•natural landscape, Meridian Gate, President’s Office, Virgin Mary statue</p><p>•religious festival, going sightseeing, taking pictures, praying</p></td><td><p>• ...is located in...</p><p>• ...is in..., and it... Many people say that it...</p><p>• It actually consists of..., and...</p><p>• There are..., and...</p><p>• ... are natural beauty, for...</p><p>• From...to..., thousands of people come there to...</p></td></tr></table></div><p><b>Complete the notes:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Structures of the talk</b></p></td><td><p><b>Your notes</b></p></td></tr><tr><td><p>What is the name and location of the place?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>When was it built?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>What are its attractions?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>What do people often do when visiting it?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr></table></div><p><b>Now you try!</b></p><p><b>Give your answer using the following cues. You should speak for 1-2 minutes.</b></p><p>1. The Perfume pagoda is located in...</p><p>2. Many people say that it...</p><p>3. It actually consists of..., and...</p><p>4. ...are natural beauty, for...</p><p>5. From...to..., thousands of people come there to...</p><p><b>Now you tick!</b></p><p><b>Did you ...</b></p><p> answer all the questions in the task?</p><p> give some details to each main point?</p><p> speak slowly and fluently with only some hesitation?</p><p> use vocabulary wide enough to talk about the topic?</p><p> use various sentence structures (simple, compound, complex) accurately?</p><p> pronounce correctly (vowels, consonants, stress, intonation)?</p><p><b> </b><b>Let’s compare!</b></p><p>Finally, compare with the sample answer on page 209.</p></div>"}, {"label": "Ghi chú luyện nói", "kind": "notes"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>Talk about a historical place in your hometown. </b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Nói về một địa danh lịch sử ở quê hương bạn.</p><p>Bạn có thể sử dụng các câu hỏi sau đây làm gợi ý:</p><p>• Tên và địa điểm của địa danh đó là gì?</p><p>• Nó đã được xây dựng khi nào?</p><p>• Nó có những yếu tố gì hấp dẫn?</p><p>• Mọi người thường làm gì khi ghé thăm nó?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Historical places (Di tích lịch sử)</b></p><p>- Perfume pagoda <i>(n. phr</i>.) (chùa Hương)</p><p>- Independence Palace (<i>n. phr.)</i> (dinh Độc Lập)</p><p>- Hue Imperial City (<i>n. phr</i>.) (Kinh thành Huế)</p><p>- Notre-Dame cathedral <i>(n. phr.)</i> (nhà Đức Bà)</p><p><b>First built (Được xây lần đầu)</b></p><p>- under the reign of <i>(pre. phr</i>.) (dưới triều đại của)</p><p>- 60 years ago (<i>prep. phr</i>.) (60 năm trước)</p><p>- in 19th century (<i>prep. phr</i>.) (thế kỷ 19)</p><p>- in French colonial era (<i>prep. phr</i>.) (thời Pháp thuộc)</p><p><b>Attractions (Điểm hấp dẫn)</b></p><p>- natural landscape (<i>n. phr</i>.) (cảnh quan tự nhiên)</p><p>- President’s Office (<i>n. phr</i>.) (văn phòng Tổng Thống)</p><p>- Meridian Gate (<i>n. phr</i>.) (cổng Ngọ Môn)</p><p>- Virgin Mary statue (<i>n. phr.)</i> (tượng Đức Mẹ)</p><p><b>Activities (Các hoạt động)</b></p><p>- religious festival <i>(n. phr</i>.) (lễ hội tôn giáo)</p><p>- taking pictures (<i>n. phr</i>.) (chụp ảnh)</p><p>- going sightseeing (<i>n. phr</i>.) (đi ngắm cảnh)</p><p>- praying (<i>n. phr</i>.) (cầu nguyện)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>The Perfume pagoda is located in the Huong Tich mountains, Hanoi. Many people say that it has been there since the reign of King Le Thanh Tong 500 years ago. it actually consists of many small temples, and the main temple is inside the Huong Tich Cave. All the mountain footpaths are natural beauty, for they are surrounded with streams, plants and flowers. Every year, from January to March on the Lunar Calendar, thousands of people come there to join a religious festival and pray for blessing</p></td><td><p>Chùa Hương nằm ở dãy núi Hương Tích, Hà Nội. Có nhiều người cho rằng chùa đã có ở đó từ thời Vua Lê Thánh Tông 500 năm về trước. Thực tế thì chùa gồm có rất nhiều chùa nhỏ, và chùa chính thì nằm ở trong Động Hương Tích. Mọi con đường mòn dẫn lên núi đều là những cảnh đẹp tự nhiên, bởi chúng được bao quanh bởi những con suối, cỏ cây và hoa lá. Hàng năm, từ tháng Một tới tháng Ba Âm lịch, hàng ngàn người tới đó để tham gia lễ hội tôn giáo và cầu xin được ban phước lành</p></td></tr></table></div></div>"}]}, {"title": "Writing · Viết", "icon": "✍️", "desc": "Unit 6 · The first university in Viet Nam", "subs": [{"id": "w1", "label": "I · Viết câu", "kind": "write", "items": [{"c": "Thien Mu pagoda/ regard/ as/ symbol/ Hue city.", "a": "Thien Mu pagoda is regarded as the symbol of Hue city.", "vi": "  Dịch nghĩa : Chùa Thiên Mụ được xem là biểu tượng của thành phố Huế. "}, {"c": "Notre-Dame Cathedral of Saigon/ cathedral/ locate/ downtown/ Ho Chi Minh City.", "a": "Notre-Dame Cathedral of Saigon is a cathedral located in the downtown of Ho Chi Minh city. ", "vi": " Nhà thờ Đức Bà Sài Gòn là một nhà thờ nằm ở khu trung tâm thành phố Hồ Chí Minh."}, {"c": "The Temple of Literature/ first/ build/ 1070/ and/ reconstruct/ during/ Tran dynasty.", "a": "The Temple of Literature was first built in 1070 and was reconstructed during the Tran dynasty.", "vi": "  Dịch nghĩa : Văn Miếu đã được xây dựng lần đầu vào năm 1070 và sau đó được xây dựng lại dưới thời nhà Trần. "}, {"c": "The Perfume pagoda/ huge/ complex/ Buddhist/ temples.", "a": "The Perfume pagoda is a huge complex of Buddhist temples.", "vi": "  Dịch nghĩa : Chùa Hương là một tổ hợp khổng lồ của các ngôi chùa Phật giáo. "}, {"c": "Hung/ King/ Temple/ Festival/ hold/ commemoration/ Kinh Duong Vuong.", "a": "Hung King Temple Festival is held in commemoration of Kinh Duong Vuong.", "vi": "  Dịch nghĩa : Lễ hội Đền Hùng được tổ chức để tưởng nhớ Kinh Dương Vương. "}], "before": ""}, {"label": "II · Viết 60–80 từ", "kind": "writing", "html": "<div class=\"source\"><p><b>II- Write an e-mail (60-80 words) to a friend and remind him/ her about preparing for your next trip. </b></p><p>You can use the following questions as cues:</p><p>• Where do you plan to go?</p><p>• What should you and your friends bring along?</p><p>• Why do you need it?</p><p>__________________________________________________________________</p><p>__________________________________________________________________</p></div>"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>II - Write an email (60 - 80 words) to a friend and remind him/ her about preparing for your next trip.</b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Viết một bức thư điện tử (60-80 từ) gửi tới một người bạn và nhắc anh ấy/ cô ấy chuẩn bị cho chuyến đi sắp tới. Bạn có thể sử dụng các câu hỏi sau đây làm gợi ý.</p><p>• Bạn sắp sửa tới địa điểm nào?</p><p>• Các bạn nên mang theo những gì?</p><p>• Tại sao các bạn lại cần nó?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Destinations (Điểm đến)</b></p><p>- Hue Imperial City (<i>n. phr</i>.) (Kinh thành Huế)</p><p>- Temple of Literature (<i>n.phr</i>) (Văn Miếu)</p><p>- Phu Quoc Island (<i>n. phr</i>.) (đảo Phú Quốc)</p><p>- Thien Mu pagoda (<i>n. phr.)</i> (chùa Thiên Mụ)</p><p><b>Items (Đồ đạc)</b></p><p>- umbrella (<i>n</i>.) (Ô)</p><p>- swimsuit (<i>n</i>.) (đồ bơi)</p><p>- camera (<i>n</i>.) (máy ảnh)</p><p>- long pants (<i>n</i>.) (quần dài)</p><p><b>Reasons (Lý do)</b></p><p>- rainy (<i>adj</i>.) (có mưa)</p><p>- go swimming (đi bơi)</p><p>- taking pictures (<i>n. phr</i>.) (chụp ảnh)</p><p>- dress code (<i>n. phr</i>.) (quy định trang phục)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>To: huyenthu2289@gmail.com</p><p>Subject: Our upcoming trip to Hue</p><p>Dear Huyen,</p><p>It’s only five days left to our excursion to the Imperial City. Have you prepared anything for it yet? Here are the things that we should definitely bring along.</p><p>There are a lot of attractions in the Royal Palace, and they’re great subjects for our photographs. Sadly, since my camera is broken, we only have your camera to rely on. Please remember to take it with you.</p><p>Besides, you should also bring your umbrella. As our teacher has said it is always rainy during this time of the year in Hue, so bringing it with us is surely not a bad idea.</p><p>Yours,</p><p>Ly</p></td><td><p>Tới: huyenthu2289@gmail.com</p><p>Chủ đề: Chuyến đi sắp tới của chúng ta đến Huế.</p><p>Huyền thân mến,</p><p>Chỉ còn năm ngày nữa là tới chuyến tham quan của bọn mình tới Hoàng Thành. Bạn đã chuẩn bị được gì chưa? Đây là những thứ chúng ta nhất định phải mang theo.</p><p>Có rất nhiều địa điểm thú vị ở Cung điện Hoàng gia, và đó là những nơi tuyệt vời để bọn mình chụp ảnh. Tiếc là, vì cái máy ảnh của mình bị hỏng rồi, nên chúng ta chỉ còn trông chờ vào cái máy của bạn thôi. Làm ơn nhớ mang nó đi cùng nhé.</p><p>Ngoài ra, bạn cũng nên mang theo ô nhé. Vì cô giáo bọn mình đã nói là khoảng thời gian này trong năm thì ở Huế lúc nào cũng có mưa, nên mang theo ô chắc chắn là ý tưởng không tồi.</p><p>Bạn của bạn,</p><p>Ly</p></td></tr></table></div><p>Giaoandethitienganh.info sưu tầm</p></div>"}]}, {"title": "Objectives · Mục tiêu", "icon": "🎯", "desc": "Unit 6 · The first university in Viet Nam", "subs": [{"label": "Mục tiêu", "html": "<div class=\"source\"><p><b>UNIT </b><b>6</b><b> </b></p><p><b>THE FIRST UNIVERSITY IN VIET NAM</b></p><p>Trường đại học đầu tiên ở Việt Nam</p><p><b>MỤC TIÊU – Objectives</b></p><p>* <b>TỪ VỰNG</b> – Vocabulary</p><p>Sử dụng các từ vựng liên quan đến các địa điểm và sự việc lịch sử, và sự sắp xếp cho một chuyến đi</p><p>* <b>NGỮ ÂM</b> – Pronunciation</p><p>Phát âm chính xác các âm phụ âm <b>/tʃ</b>/ và /<b>dʒ</b>/ đứng riêng lẻ và trong ngữ cảnh</p><p>* <b>NGỮ PHÁP</b> – Grammar</p><p>Sử dụng câu bị động để nhấn mạnh hành động hoặc sự việc</p><p><b>* KỸ NĂNG ĐỌC</b> – Reading skills</p><p>Đọc để biết thông tin cụ thể về lịch sử của Văn Miếu - Quốc Tử Giám</p><p>* <b>KỸ NĂNG NÓI</b> – Speaking skills</p><p>Nói về việc sắp xếp cho một chuyến đi đến Văn Miếu</p><p>* <b>KỸ NĂNG NGHE</b> – Listening Skills</p><p>Nghe thông tin cụ thể về tiểu sử của một giáo viên nổi tiếng nhất</p><p>* <b>KỸ NĂNG VIẾT</b> – Writing skills</p><p>Viết về một địa điểm lịch sử</p><p><b>A – NGÔN NGỮ</b></p></div>"}]}];

 located near a school. (Cửa hàng của tôi nằm gần một trường học)"}, {"w": "pagoda", "p": "/pəˈɡəʊdə/", "pos": "n.", "vi": "chùa", "ex": "My family went to a holy pagoda in Hue last year. (Gia đình tôi đã tới một ngôi chùa linh thiêng ở Huế vào năm ngoái)"}, {"w": "recognise", "p": "/ˈrekəɡnaɪz/", "pos": "v.", "vi": "hiểu ra, thừa nhận", "ex": "You must recognise the seriousness of the problem we are facing. (Bạn phải hiểu ra tính nghiêm trọng của vấn đề mà chúng ta đang đối mặt)"}, {"w": "regard", "p": "/rɪˈɡɑːd/", "pos": "v.", "vi": "đánh giá", "ex": "Jane is highly regarded by her teachers. (Jane được giáo viên của mình đánh giá cao)"}, {"w": "relic", "p": "/ˈrelɪk/", "pos": "n.", "vi": "di tích", "ex": "The ship was a relic of the Spanish – American War. (Con thuyền này là di tích của cuộc chiến Tây Ban Nha – Mĩ)"}, {"w": "site", "p": "/saɪt/", "pos": "n.", "vi": "địa điểm", "ex": "You shouldn’t enter the construciton site. (Bạn không nên đi vào công trường xây dựng)"}, {"w": "statue", "p": "/ˈstætʃuː/", "pos": "n.", "vi": "tượng", "ex": "The Merlion statue is Singapore’s national icon. (Tượng Merlion là biểu tượng quốc gia của Xin-ga-po)"}, {"w": "surround", "p": "/səˈraʊnd/", "pos": "v.", "vi": "bao quanh, vây quanh", "ex": "The police surrounded the thief. (Cảnh sát đã bao vây tên trộm)"}, {"w": "take care of", "p": "/teɪk keə(r) əv/", "pos": "n.", "vi": "trông nom, chăm sóc", "ex": "My mum alwas takes care of me and my brother. (Mẹ luôn chăm sóc tôi và anh trai tôi)"}, {"w": "temple of Literature", "p": "/ˈtempl əv ˈlɪtrətʃə(r)/", "pos": "n.", "vi": "Văn Miếu", "ex": "The Temple of Literature honours VietNam’s finest scholars. (Văn Miếu tôn vinh những học giả ưu tú nhất của Việt Nam)"}, {"w": "World Heritage", "p": "/ˌwɜːld ˈherɪtɪdʒ/", "pos": "n.", "vi": "di sản thế giới", "ex": "Ha Long Bay was recognised as a UNESCO World Heritage Site in 1994. (Vịnh Hạ Long được UNESCO công nhận là Di sản Thế giới vào năm 1994)"}];
const LISTEN="Emperor Le Thanh Tong was the 5th emperor of the Kingdom of Dai Viet during the Le dynasty, and he is one of the greatest monarchs in Vietnamese feudal history. He was born in 1442. He was the son of Emperor Le Thai Tong. After succeeding to the throne in 1460, he encouraged the spread of Confucianism throughout Dai Viet. He had “temples of literature” built in many provinces. He revived the examination process to recruit top scholars into the government. The Imperial exams were held every three years since the first examination in 1463. Later, in order to honour the laureates and encourage other students to serve the realm in similar manner, Emperor Le Thanh Tong ordered to build Doctor’s stone tablets in the Temple of Literature - the Imperial Academy in 1484. The information of each examination was engraved on the tablets. The emperor died in 1497. Nowadays, many scholars consider him to be one of the pioneers in the development of Vietnamese education. ";

function puzzleRender(){return `<div class="card"><h3>Tìm 12 từ theo hàng ngang hoặc cột dọc</h3><p>Bấm chữ đầu, rồi bấm chữ cuối của từ.</p><div style="overflow:auto;margin:10px 0"><div style="display:grid;grid-template-columns:repeat(${PUZZLE[0].length},28px);gap:2px">${PUZZLE.flatMap((r,i)=>r.map((c,j)=>`<button class="btn sm" style="padding:3px;background:${puzzleState.cells.includes(i+','+j)?'#bbf7d0':puzzleState.start?.join()===[i,j].join()?'#fde68a':'white'}" onclick="puzzlePick(${i},${j})">${esc(c)}</button>`)).join('')}</div></div><p>Đã tìm ${puzzleState.found.length}/12: ${puzzleState.found.join(', ')}</p><button class="btn" onclick="puzzleState.start=null;puzzleState.found=[];puzzleState.cells=[];show(cur.s,cur.t)">Làm lại</button><p id="puzzlemsg"></p></div>`}
function puzzlePick(r,c){if(!puzzleState.start){puzzleState.start=[r,c];show(cur.s,cur.t);return;}const[a,b]=puzzleState.start;puzzleState.start=null;if(r!==a&&c!==b){show(cur.s,cur.t);return;}let cells=[],word='',dr=Math.sign(r-a),dc=Math.sign(c-b),len=Math.max(Math.abs(r-a),Math.abs(c-b));for(let k=0;k<=len;k++){let x=a+k*dr,y=b+k*dc;cells.push(x+','+y);word+=PUZZLE[x][y];}word=word.toLowerCase();if(!puzzleWords.includes(word))word=[...word].reverse().join('');if(puzzleWords.includes(word)&&!puzzleState.found.includes(word)){puzzleState.found.push(word);puzzleState.cells.push(...cells);if(puzzleState.found.length===12)markDone('puzzle',12,12);}show(cur.s,cur.t);}

 const cfg={title:s.label,items:s.items,labels:s.items[0].opts?s.items[0].opts.map((_,i)=>String.fromCharCode(65+i)):undefined};
 return (s.before||'')+(s.kind==='quiz'?quiz(s.id,cfg):s.kind==='fill'?fill(s.id,cfg):writeSent(s.id,s.items));
}
