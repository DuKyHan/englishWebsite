<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1e1b4b;--mut:#6b7280;--p:#4f46e5;--p2:#7c3aed;--pk:#db2777;--ok:#059669;--okbg:#ecfdf5;--bad:#dc2626;--badbg:#fef2f2;--am:#b45309;--ambg:#fffbeb;--line:#e4e6f7;--bg:#f3f4ff;--ph:"Doulos SIL","Charis SIL","Lucida Sans Unicode","Segoe UI",Arial,sans-serif}
html,body{height:469px;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:469px;max-width:1128px;margin:0 auto;background:var(--bg)}

/* sidebar */
.side{width:206px;flex:none;background:linear-gradient(175deg,#2e2a86 0%,#4f46e5 58%,#7c3aed 100%);color:#fff;display:flex;flex-direction:column;padding:12px 10px 10px;position:relative;overflow:hidden}
.side:before{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.logo{display:flex;align-items:center;gap:9px;padding:0 4px 9px;cursor:pointer;position:relative}
.logo .lg{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:20px}
.logo b{display:block;font-size:14px;letter-spacing:.05em}
.logo small{font-size:11px;opacity:.85}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;min-height:0;position:relative}
.ni{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:none;background:none;color:#e0e7ff;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;width:100%;transition:.15s}
.ni:hover{background:rgba(255,255,255,.13)}
.ni .n{width:18px;height:18px;flex:none;border-radius:50%;background:rgba(255,255,255,.2);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ni .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni.on{background:#fff;color:#3730a3;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.ni.on .n{background:var(--p);color:#fff}
.ni.done .n{background:#34d399;color:#064e3b}
.ni.soon{opacity:.62}
.prog{padding:8px 4px 0;position:relative}
.pbar{height:7px;background:rgba(255,255,255,.22);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#fde68a,#34d399);border-radius:8px;transition:width .4s}
.prog small{display:flex;justify-content:space-between;font-size:10.5px;margin-top:4px;opacity:.9}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:11px;padding:11px 18px 2px}
.head .hi{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#c026d3);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 5px 14px rgba(99,102,241,.35);flex:none}
.head h1{font-size:18px;line-height:1.15;color:#312e81}
.head p{font-size:12px;color:var(--mut);margin-top:1px}
.subnav{display:flex;gap:6px;padding:8px 18px 7px;overflow-x:auto;flex:none}
.stab{flex:none;border:1px solid #d6dafc;background:#fff;color:#4338ca;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.stab:hover{background:#eef2ff;transform:translateY(-1px)}
.stab.on{background:linear-gradient(90deg,#4f46e5,#7c3aed);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.stab i{font-style:normal;margin-left:5px;font-size:10px;background:#34d399;color:#064e3b;border-radius:999px;padding:0 5px}
.body{flex:1;overflow:auto;padding:2px 18px 16px;min-height:0;animation:fade .25s}
.body.split{overflow:hidden;padding-bottom:12px}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* generic */
.btn{border:1px solid #c7d2fe;background:#fff;color:#4338ca;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;transition:.15s}
.btn:hover{background:#eef2ff;transform:translateY(-1px)}
.btn.solid{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(79,70,229,.28)}
.btn.solid:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:11px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.chip-s{display:inline-flex;align-items:center;gap:3px;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800}
.chip-s.ok{background:#d1fae5;color:#065f46}
.chip{display:inline-block;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:700}
.muted{color:var(--mut);font-size:12px}
.note{font-size:12.5px;background:#f5f3ff;border-left:3px solid #8b5cf6;border-radius:8px;padding:6px 10px;margin:6px 0;line-height:1.5}
.note.am{background:var(--ambg);border-color:#f59e0b}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 3px 12px rgba(67,56,202,.06)}
.card h3{font-size:14px;color:#312e81;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
mark{background:#fde68a;color:#78350f;border-radius:4px;padding:0 3px;font-weight:800;box-shadow:inset 0 -2px 0 #f59e0b}
u{text-decoration-thickness:2px;text-underline-offset:2px;text-decoration-color:#e11d48}
.spk{border:none;background:#eef2ff;border-radius:7px;cursor:pointer;font-size:11px;padding:2px 6px;vertical-align:middle}
.spk:hover{background:#c7d2fe}
.ph{font-family:var(--ph)}
details.tr{margin-top:8px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.6}
details.tr summary{cursor:pointer;color:var(--p);font-weight:700}
details.tr p{margin-top:5px;color:#374151}
.kw{background:linear-gradient(transparent 55%,#fde68a 55%);font-weight:700;cursor:help}
.passage{font-size:13.5px;line-height:1.75;background:#fffdf5;border:1px solid #fde68a;border-radius:12px;padding:11px 14px;color:#1f2937}
.colh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7c3aed;margin:2px 0 6px}
.split>div{overflow:auto;height:100%;padding:0 2px 6px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* coming soon */
.soonbox{height:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--mut)}
.soonbox .big{font-size:54px;animation:float 3s ease-in-out infinite}
.soonbox b{font-size:18px;color:#312e81}
.soonbox span{font-size:13px;max-width:380px;line-height:1.5}
@keyframes float{50%{transform:translateY(-8px)}}

/* vocabulary */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.search{flex:1;border:1.5px solid #d6dafc;border-radius:10px;padding:7px 12px;font-size:12.5px;outline:none;background:#fff}
.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.vrow{display:grid;grid-template-columns:42px 34% 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:7px;transition:.15s}
.vrow:hover{border-color:#a5b4fc;box-shadow:0 5px 16px rgba(99,102,241,.14);transform:translateX(2px)}
.vem{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#eef2ff,#faf5ff);display:flex;align-items:center;justify-content:center;font-size:22px}
.vw{font-size:16px;font-weight:800;color:#312e81;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pos{font-size:10.5px;font-style:italic;font-weight:800;border-radius:999px;padding:1px 8px}
.pos-n{background:#dbeafe;color:#1d4ed8}.pos-v{background:#dcfce7;color:#15803d}.pos-adj{background:#ffedd5;color:#c2410c}.pos-idiom{background:#f3e8ff;color:#7e22ce}.pos-phr{background:#e0f2fe;color:#0369a1}
.vp{font-family:var(--ph);font-size:12.5px;color:var(--mut);margin-top:2px}
.vm{font-size:14px;font-weight:800;color:var(--ok)}
.ven{font-size:12.8px;line-height:1.5;margin-top:2px}
.vvi{font-size:12px;color:var(--mut);font-style:italic}
.hide-mean .vm:not(.rev),.hide-mean .vvi:not(.rev){filter:blur(6px);cursor:pointer;user-select:none}
.fcwrap{max-width:620px;margin:0 auto}
.fcnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.fcdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.fcdots i{width:9px;height:9px;border-radius:50%;background:#e0e7ff}
.fcdots i.k{background:#34d399}.fcdots i.cur{background:#6366f1;transform:scale(1.35)}
.fcard{min-height:176px;border-radius:20px;background:linear-gradient(135deg,#eef2ff,#faf5ff);border:2px solid #c7d2fe;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 24px;cursor:pointer;gap:6px;transition:.2s;box-shadow:0 10px 26px rgba(99,102,241,.14)}
.fcard.back{background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border-color:#6ee7b7}
.fcard:hover{transform:translateY(-2px)}
.fc-em{font-size:34px}.fc-w{font-size:30px;font-weight:900;color:#312e81}
.fc-p{font-family:var(--ph);font-size:16px;color:var(--mut)}
.fc-hint{font-size:11px;color:#9ca3af;margin-top:4px}
.fc-m{font-size:24px;font-weight:900;color:var(--ok)}
.fc-e{font-size:14px;line-height:1.5}.fc-v{font-size:12.5px;color:var(--mut);font-style:italic}
.fcbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}

/* match game */
.mg-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px 28px}
.mc{border:2px solid #d6dafc;background:#fff;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;transition:.15s;min-height:40px;color:#312e81}
.mc:hover:not(.lock){border-color:#6366f1;background:#eef2ff;transform:scale(1.015)}
.mc.sel{border-color:#4f46e5;background:#e0e7ff;box-shadow:0 0 0 3px rgba(79,70,229,.2)}
.mc.lock{background:var(--okbg);border-color:#6ee7b7;color:#065f46;cursor:default;animation:pop .35s}
.mc.err{border-color:#f87171;background:var(--badbg);animation:shake .4s}
.mc.vi{font-weight:600;color:#374151}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* quiz */
.qz-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qz-title{font-size:13.5px;font-weight:800;color:#312e81;flex:1}
.qz-bar{height:6px;background:#e0e7ff;border-radius:8px;overflow:hidden;margin-bottom:10px}
.qz-bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#c026d3);border-radius:8px;transition:width .4s}
.qz-main{display:grid;grid-template-columns:1.08fr 1fr;gap:14px;align-items:start}
.qz-q{font-size:15px;line-height:1.55;font-weight:600;margin-bottom:10px;color:#1f2937}
.blank{display:inline-block;min-width:70px;border-bottom:3px dotted #6366f1;margin:0 2px}
.fillw{display:inline-block;background:#d1fae5;color:#065f46;border-radius:6px;padding:0 7px;font-weight:800}
.bigw{font-size:30px;font-weight:900;color:#312e81;letter-spacing:.02em;margin:2px 0}
.qz-opts{display:flex;flex-direction:column;gap:7px}
.qz-opts.tf{flex-direction:row}.qz-opts.tf .qo{flex:1;justify-content:center}
.qo{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid #d6dafc;background:#fff;border-radius:12px;padding:8px 12px;font-size:13.5px;cursor:pointer;transition:.15s;color:#1f2937}
.qo b{width:24px;height:24px;border-radius:8px;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.qo:hover:not(.lock){border-color:#6366f1;background:#f5f6ff;transform:translateX(3px)}
.qo.lock{cursor:default}
.qo.ok{border-color:#34d399;background:var(--okbg);color:#064e3b;font-weight:700;animation:pop .35s}
.qo.ok b{background:#10b981;color:#fff}
.qo.bad{border-color:#f87171;background:var(--badbg);color:#7f1d1d;animation:shake .4s}
.qo.bad b{background:#ef4444;color:#fff}
.fb{border-radius:14px;padding:10px 12px;font-size:12.8px;line-height:1.55;max-height:270px;overflow:auto;position:sticky;top:0}
.fb.idle{background:#f8faff;border:2px dashed #c7d2fe;text-align:center;color:var(--mut);padding:26px 14px}
.fb.idle .idle-i{font-size:30px}
.fb.ok{background:var(--okbg);border:1.5px solid #6ee7b7}
.fb.bad{background:var(--badbg);border:1.5px solid #fca5a5}
.fb-h{font-weight:900;font-size:14px;margin-bottom:5px}
.fb.ok .fb-h{color:#047857}.fb.bad .fb-h{color:#b91c1c}
.fb-h small{display:block;font-size:12px;font-weight:600;color:#374151;margin-top:1px}
.fb-b{color:#1f2937}
.fb-tr{margin-top:6px;background:rgba(255,255,255,.7);border-radius:8px;padding:5px 8px;color:#374151}
.fb-note{margin-top:5px;color:#4338ca;font-weight:600}
.fb-n{margin-top:9px;width:100%}
table.mt{width:100%;border-collapse:collapse;font-size:12.3px;margin-top:3px}
table.mt td{padding:2px 5px;border-bottom:1px dashed rgba(0,0,0,.1);vertical-align:top}
table.mt tr.hit td{background:rgba(16,185,129,.16);font-weight:700}
.qz-res{text-align:center;padding:6px 0}
.ring{width:96px;height:96px;border-radius:50%;margin:4px auto 8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#312e81;background:conic-gradient(#10b981 var(--pct),#e0e7ff 0);position:relative}
.ring:before{content:"";position:absolute;inset:9px;background:#fff;border-radius:50%}
.ring span{position:relative}
.qz-res h3{font-size:18px;color:#312e81}
.qz-res .acts{display:flex;gap:8px;justify-content:center;margin:10px 0}
.wl{text-align:left;margin-top:6px}
.wl details{background:#fff;border:1px solid #fecaca;border-radius:10px;padding:5px 10px;margin-bottom:5px;font-size:12.5px}
.wl summary{cursor:pointer;font-weight:700;color:#991b1b}
.wl .fb-b{margin-top:5px}
.confetti{position:fixed;top:-12px;font-size:18px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(500px) rotate(540deg);opacity:0}}

/* fill */
.fl-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.fl-top .t{font-size:13.5px;font-weight:800;color:#312e81;flex:1;min-width:200px}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0;padding:8px 10px;background:#fff;border:2px dashed #c7d2fe;border-radius:12px}
.bk{border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px rgba(99,102,241,.3);transition:.15s}
.bk:hover:not(.used){transform:translateY(-2px)}
.bk.used{background:#e5e7eb;color:#9ca3af;box-shadow:none;cursor:default;text-decoration:line-through}
.fx{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:14px;line-height:2}
.fx .n{width:22px;height:22px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.fi{width:104px;border:none;border-bottom:2.5px dotted #6366f1;background:#f5f6ff;padding:1px 6px;font-size:14px;text-align:center;outline:none;border-radius:6px 6px 0 0;color:#1e1b4b;font-weight:700}
.fi:focus{background:#e0e7ff;border-bottom-style:solid}
.fi.good,.slot.good{border-bottom:2.5px solid #10b981;background:var(--okbg);color:#065f46}
.fi.bad,.slot.bad{border-bottom:2.5px solid #ef4444;background:var(--badbg);color:#991b1b}
.slot{min-width:104px;border:none;border-bottom:2.5px dotted #6366f1;background:#f5f6ff;padding:1px 8px;font-size:14px;font-weight:800;cursor:pointer;border-radius:6px 6px 0 0;color:#4338ca;height:26px}
.slot.act{background:#e0e7ff;border-bottom-style:solid;box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.fxfb{flex-basis:100%;font-size:12.5px;line-height:1.55;border-radius:10px;padding:5px 10px;margin:0 0 2px 28px}
.fxfb.ok{background:var(--okbg);border-left:3px solid #10b981;color:#064e3b}
.fxfb.bad{background:var(--badbg);border-left:3px solid #ef4444;color:#7f1d1d}
.fxfb .tr{display:block;color:#4b5563;font-style:italic}

/* sentence builder */
.bd-line{min-height:56px;border:2px dashed #a5b4fc;border-radius:14px;background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.bd-line.ok{border-color:#34d399;background:var(--okbg);border-style:solid}
.bd-line.bad{border-color:#f87171;background:var(--badbg);border-style:solid}
.bd-pool{display:flex;flex-wrap:wrap;gap:7px;min-height:44px;padding:4px}
.wd{border:none;background:#fff;border:2px solid #c7d2fe;color:#3730a3;border-radius:10px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 2px 0 #c7d2fe}
.wd:hover{transform:translateY(-2px);border-color:#6366f1}
.wd.in{background:#eef2ff}
.bd-hint{color:#9ca3af;font-size:12.5px}

/* signals */
.sg{display:flex;flex-wrap:wrap;gap:2px 1px;align-items:center;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:14.5px;line-height:1.9}
.sg .n{width:22px;height:22px;border-radius:50%;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:3px}
.tok{padding:0 4px;border-radius:7px;cursor:pointer;transition:.12s}
.tok:hover{background:#e0e7ff}
.tok.sig{background:#fde68a;color:#78350f;font-weight:800;box-shadow:inset 0 -3px 0 #f59e0b;cursor:default}
.tok.err{background:#fee2e2;animation:shake .35s}
.sgnote{margin-left:6px;font-size:11.5px;background:#ede9fe;color:#5b21b6;border-radius:999px;padding:1px 9px;font-weight:700}

/* grammar theory */
.gc{border-radius:14px;padding:10px 13px;background:#fff;border:1px solid var(--line);border-top:5px solid #6366f1}
.gc.t2{border-top-color:#db2777}.gc.t3{border-top-color:#0d9488}
.gc .ic{font-size:24px}.gc h3{font-size:14px;margin:2px 0 4px;color:#312e81}
.gc p{font-size:12.8px;line-height:1.55}
.gex{margin-top:6px;background:#f5f3ff;border-radius:9px;padding:6px 9px;font-size:13px;line-height:1.5}
.gex i{display:block;color:#6b7280;font-size:12px}
.scale{display:flex;gap:6px;align-items:stretch;margin:6px 0}
.sc{flex:1;border-radius:11px;padding:7px 4px;text-align:center;color:#fff;font-size:12.5px;font-weight:800;line-height:1.3}
.sc small{display:block;font-weight:600;font-size:10.5px;opacity:.92}
.sc.a{background:#4f46e5}.sc.b{background:#6366f1}.sc.c{background:#8b5cf6}.sc.d{background:#a78bfa}.sc.e{background:#c4b5fd;color:#4c1d95}
.fm{display:inline-block;font-weight:800;color:#3730a3;background:#e0e7ff;border-radius:8px;padding:1px 9px;margin-bottom:3px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;line-height:1.5;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.t th{background:linear-gradient(90deg,#eef2ff,#faf5ff);color:#312e81;padding:7px 10px;text-align:left}
table.t td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.t i{color:#6b7280;display:block;font-size:12px}

/* pronunciation */

<body>
<div class="app">
  <aside class="side">
    <div class="logo" onclick="showObjectives()" title="Xem mục tiêu bài học">
      <div class="lg">🎯</div><div><b>UNIT 1</b><small>My Hobbies</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="prog"><div class="pbar"><i id="pbar"></i></div><small id="ptxt"></small></div>
  </aside>
  <main class="main">
    <header class="head"><div class="hi" id="hi"></div><div><h1 id="ttl"></h1><p id="dsc"></p></div></header>
    <div class="subnav" id="subnav"></div>
    <div class="body" id="body"></div>
  </main>
</div>
<script>/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normA = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[.,!?;:"“”]/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hl = s => s.replace(/\{\{(.+?)\}\}/g, '<mark>$1</mark>');
const plain = s => s.replace(/\{\{|\}\}/g, '').replace(/<[^>]+>/g, '');
function say(t, rate) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = rate || .9; speechSynthesis.speak(u); } catch (e) {} }
function sayEl(el) { say(el.dataset.w); }
const spk = w => `<button class="spk" data-w="${esc(plain(w))}" onclick="sayEl(this)" title="Nghe">🔊</button>`;
function confetti() {
  const em = ['🎉', '✨', '⭐', '🎊', '💜', '🌟'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = (10 + Math.random() * 80) + '%'; s.style.animationDelay = (Math.random() * .5) + 's'; s.style.fontSize = (14 + Math.random() * 14) + 'px';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2400);
  }
}

/* ================= component registry & progress ================= */
const COMP = {}, DONE = {};
function markDone(id, s, t) { DONE[id] = { s, t }; navRender(); }
function hydrate() { document.querySelectorAll('.comp').forEach(el => { const c = COMP[el.dataset.id]; if (c) c.render(el); }); }
function rerender(id) { const el = document.querySelector(`.comp[data-id="${id}"]`); if (el) COMP[id].render(el); }
const slot = id => `<div class="comp" data-id="${id}"></div>`;

/* ================= QUIZ (one question at a time, explanation panel) ================= */
function fillQ(q, txt) {
  const parts = txt.split(' - '); let k = 0;
  return q.replace(/_{3,}/g, () => `<span class="fillw">${parts[Math.min(k++, parts.length - 1)]}</span>`);
}
function quiz(id, cfg) {
  const prev = COMP[id];
  const st = prev ? prev.st : { i: 0, score: 0, sel: null, res: [], fin: false };
  if (prev) cfg.items = prev.cfg.items; else if (cfg.regen) cfg.items = cfg.regen();
  COMP[id] = { st, cfg, render: el => qzRender(id, el) };
  return slot(id);
}
function qzRender(id, el) {
  const { st, cfg } = COMP[id], items = cfg.items, n = items.length;
  if (st.fin) { el.innerHTML = qzResult(id); return; }
  const it = items[st.i], L = cfg.labels || ['A', 'B', 'C', 'D'], ans = st.sel !== null, ok = ans && st.sel === it.a;
  const opts = it.opts.map((o, j) => {
    let c = 'qo'; if (ans) { c += ' lock'; if (j === it.a) c += ' ok'; else if (j === st.sel) c += ' bad'; }
    return `<button class="${c}" onclick="qzPick('${id}',${j})"><b>${L[j]}</b><span>${o}</span></button>`;
  }).join('');
  const q = ans ? fillQ(it.q, it.opts[it.a]) : it.q.replace(/_{3,}/g, '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  const fb = ans
    ? `<div class="fb ${ok ? 'ok' : 'bad'}"><div class="fb-h">${ok ? '🎉 Chính xác!' : '❌ Chưa đúng'}<small>Đáp án đúng: <b>${L[it.a]}. ${it.opts[it.a]}</b></small></div><div class="fb-b">${it.exp || ''}</div></div>
       <button class="btn solid fb-n" onclick="qzNext('${id}')">${st.i === n - 1 ? 'Xem kết quả →' : 'Câu tiếp theo →'}</button>`
    : `<div class="fb idle"><div class="idle-i">💡</div><p>Chọn một đáp án.<br>Giải thích và nghĩa sẽ hiện ở đây.</p></div>`;
  el.innerHTML = `<div class="qz">
    <div class="qz-top"><span class="qz-title">${cfg.title}</span><span class="chip-s">Câu ${st.i + 1}/${n}</span><span class="chip-s ok">★ ${st.score}</span></div>
    <div class="qz-bar"><i style="width:${(st.i + (ans ? 1 : 0)) / n * 100}%"></i></div>
    ${cfg.note ? `<div class="note">${cfg.note}</div>` : ''}
    <div class="qz-main"><div><div class="qz-q">${q}</div><div class="qz-opts ${cfg.tf ? 'tf' : ''}">${opts}</div></div><div>${fb}</div></div></div>`;
}
function qzPick(id, j) {
  const { st, cfg } = COMP[id]; if (st.sel !== null) return;
  st.sel = j; st.res[st.i] = j; if (j === cfg.items[st.i].a) st.score++;
  rerender(id);
}
function qzNext(id) {
  const { st, cfg } = COMP[id]; st.sel = null; st.i++;
  if (st.i >= cfg.items.length) { st.fin = true; markDone(id, st.score, cfg.items.length); if (st.score === cfg.items.length) confetti(); }
  rerender(id);
}
function qzRestart(id) {
  const c = COMP[id]; Object.assign(c.st, { i: 0, score: 0, sel: null, res: [], fin: false });
  if (c.cfg.regen) c.cfg.items = c.cfg.regen();
  rerender(id);
}
function qzResult(id) {
  const { st, cfg } = COMP[id], n = cfg.items.length, pct = Math.round(st.score / n * 100), L = cfg.labels || ['A', 'B', 'C', 'D'];
  const msg = pct === 100 ? 'Xuất sắc! 🏆' : pct >= 80 ? 'Rất tốt! 👏' : pct >= 50 ? 'Khá ổn, cố thêm chút nữa! 💪' : 'Đừng nản, thử lại nhé! 🌱';
  const wrong = cfg.items.map((it, i) => ({ it, i })).filter(x => st.res[x.i] !== x.it.a);
  return `<div class="qz-res"><div class="ring" style="--pct:${pct}%"><span>${st.score}/${n}</span></div><h3>${msg}</h3>
    <p class="muted">${esc(plain(cfg.title))}</p>
    <div class="acts"><button class="btn solid" onclick="qzRestart('${id}')">↺ Làm lại</button></div>
    ${wrong.length ? `<div class="wl"><div class="colh">Các câu cần xem lại (${wrong.length})</div>${wrong.map(({ it, i }) => `<details><summary>Câu ${i + 1}: ${fillQ(it.q, it.opts[it.a])}</summary><div class="fb-b">Bạn chọn: <b>${L[st.res[i]]}. ${it.opts[st.res[i]]}</b> · Đáp án: <b>${L[it.a]}. ${it.opts[it.a]}</b><br>${it.exp || ''}</div></details>`).join('')}</div>` : '<p class="muted">Bạn đã trả lời đúng tất cả các câu 🎯</p>'}</div>`;
}
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  const m = document.querySelector('.comp .qz-main'); if (!m) return;
  const id = m.closest('.comp').dataset.id, { st, cfg } = COMP[id], k = e.key.toLowerCase();
  if (st.sel === null) {
    const labs = (cfg.labels || ['A', 'B', 'C', 'D']).map(x => x.toLowerCase());
    let j = labs.indexOf(k); if (j < 0) j = ['1', '2', '3', '4'].indexOf(k);
    if (j >= 0 && j < cfg.items[st.i].opts.length) qzPick(id, j);
  } else if (['enter', 'arrowright', ' '].includes(k)) { e.preventDefault(); qzNext(id); }
});
function meanExp(opts, mean, a, tr, note) {
  return `<table class="mt">${opts.map((o, j) => `<tr class="${j === a ? 'hit' : ''}"><td>${'ABCD'[j]}. <b>${o}</b></td><td>${mean[j]}</td></tr>`).join('')}</table>${note ? `<p class="fb-note">${note}</p>` : ''}${tr ? `<p class="fb-tr">🇻🇳 ${tr}</p>` : ''}`;
}
const ruleExp = (rule, tr) => `<p>${rule}</p>${tr ? `<p class="fb-tr">🇻🇳 ${tr}</p>` : ''}`;

/* ================= FILL (typing or tap-to-fill word bank) ================= */
function fill(id, cfg) {
  const prev = COMP[id];
  const st = prev ? prev.st : { vals: {}, checked: false, res: [], active: null, score: 0 };
  COMP[id] = { st, cfg, render: el => flRender(id, el) };
  return slot(id);
}
function flRender(id, el) {
  const { st, cfg } = COMP[id], bank = cfg.bank, items = cfg.items;
  const used = Object.values(st.vals);
  const rows = items.map((it, i) => {
    let k = 0;
    const q = it.q.replace(/___/g, () => {
      const key = i + '-' + k, v = st.vals[key] || '', kk = k++;
      const cls = st.checked ? (st.res[i] && st.res[i][kk] ? ' good' : ' bad') : '';
      if (bank) return `<button class="slot${st.active === key ? ' act' : ''}${cls}" onclick="flSlot('${id}','${key}')">${v || '&nbsp;'}</button>`;
      return `<input class="fi${cls}" data-key="${key}" value="${esc(v)}" autocomplete="off" spellcheck="false" oninput="COMP['${id}'].st.vals['${key}']=this.value" onkeydown="flKey(event,'${id}')">`;
    });
    let fb = '';
    if (st.checked) {
      const ok = st.res[i] && st.res[i].every(Boolean);
      fb = `<div class="fxfb ${ok ? 'ok' : 'bad'}">${ok ? '✓ Đúng.' : '✗ Đáp án: <b>' + it.a.map(x => x.split('/')[0]).join(' … ') + '</b>.'} ${it.exp || ''}${it.tr ? `<span class="tr">🇻🇳 ${it.tr}</span>` : ''}</div>`;
    }
    return `<div class="fx"><span class="n">${i + 1}</span><span>${q}</span>${fb}</div>`;
  }).join('');
  el.innerHTML = `<div class="fl-top"><span class="t">${cfg.title}</span>

    if (i === LS.sents.length - 1) u.onend = () => { LS.playing = false; lsUi(); document.querySelectorAll('.ss').forEach(e => e.classList.remove('now')); };

/* ================= TAGGER: click words in sentences to mark their sound ================= */

taying in__________.", "opt": " <b>A</b>. shape<b>B</b>. format<b>C</b>. body<b>D</b>. frame", "opts": ["shape", "format", "body", "frame"]}, "vII_key": [{"n": 1, "ans": "itchy", "expl": "Trước vị trí cần điền là động từ to be “are” và cụm danh từ “my arms” (cánh tay của tôi) nên ta cần điền một tính từ để bổ nghĩa cho danh từ này. Xét về nghĩa, tính từ “itchy” (ngứa) là phù hợp nhất.", "tr": "I have been bitten by mosquitoes, so my arms are itchy now. (Tôi bị muỗi đốt nên giờ hai cánh tay tôi đang rất ngứa.)"}, {"n": 2, "ans": "sickness", "expl": "Trước vị trí cần điền là giới từ “of’ nên ta cần điền một danh từ ở vị trí này. Xét về nghĩa, danh từ “sickness” (ốm) là phù hợp nhất.", "tr": "Lina has been absent from class for a week because of sickness. (Lina đã nghỉ học một tuần vì bị ốm.)"}, {"n": 3, "ans": "depression", "expl": "Trước vị trí cần điền là giới từ “of’ nên ta cần điền một danh từ ở vị trí này. Xét về nghĩa, danh từ “depression” (sự chán nản, trầm cảm) là phù hợp nhất.", "tr": "Tiredness, loss of appetite, and sleeping problems are symptoms of depression. (Mệt mỏi, chán ăn và khó ngủ là triệu chứng của bệnh trầm cảm.)"}, {"n": 4, "ans": "essential", "expl": "Trước vị trí cần điền là động từ to be “are” và cụm danh từ “Fresh fruits and vegetables” (Trái cây và rau tươi) nên ta cần điền một tính từ để bổ nghĩa cho danh từ này. Xét về nghĩa, tính từ “essential” (thiết yếu) là phù hợp nhất.", "tr": "Fresh fruits and vegetables are essential parts of a healthy diet. (Trái cây và rau tươi là những phần thiết yếu của một chế độ ăn lành mạnh.)"}, {"n": 5, "ans": "vegetarian", "expl": "Trước vị trí cần điền là tính từ “strict” (nghiêm ngặt) nên ta cần điền một danh từ ở vị trí này. Xét về nghĩa, danh từ “vegetarian” (người án chay) là phù hợp nhất.", "tr": "Molly is a strict vegetarian and she refuses to eat any meat or fish. (Molly là một người ăn chay nghiêm ngặt và cô từ chối không ăn bất kì loại thịt hoặc cá nào.)"}, {"n": 6, "ans": "Triathlon", "expl": "Vì vị trí cần điền đứng ở đầu câu đóng vai trò làm chủ ngữ nên ta cần điền một danh từ ở vị trí này. Xét về nghĩa, danh từ “triathlon” (cuộc thi thể thao ba môn phối hợp) là phù hợp nhất.", "tr": "Triathlon is a competition in which the contestants must swim, ride a bike and run. (Cuộc thi thể thao ba môn phối hợp là cuộc thi mà các thí sinh phải bơi, đạp xe và chạy.)"}, {"n": 7, "ans": "junk food", "expl": "Vì vị trí cần điền đứng ở đầu câu đóng vai trò làm chủ ngữ nên ta cần điền một (cụm) danh từ ở vị trí này. Xét về nghĩa, cụm danh từ “junk food” (đồ ăn vặt) là phù hợp nhất.", "tr": "Junk food like snacks and crisps is harmful to our health. (Đồ ăn vặt như bim bim và khoai tây chiên có hại cho sức khỏe của chúng ta.)"}], "vII_lines": ["depression", "essential", "vegetarian", "itchy", "spots", "triathlon", "sickness", "junk food", "E.g.: Staying up late frequently may cause a lot of __spots__on your face.", "1. I have been bitten by mosquitoes, so my arms are__________now.", "2. Lina has been absent from class for a week because of__________.", "3. Tiredness, loss of appetite, and sleeping problems are symptoms of__________.", "4. Fresh fruits and vegetables are__________parts of a healthy diet.", "5. Molly is a strict__________and she refuses to eat any meat or fish.", "6. __________is a competition in which the contestants must swim, ride a bike and run.", "7. __________like snacks and crisps is harmful to our health."], "gI_key": [{"n": 1, "ans": "more", "expl": "", "tr": "Spend more time doing exercise every day. Going jogging is a great choice. (Hãy dành nhiều thời gian hơn để tập thể dục hàng ngày. Đi bộ là một lựa chọn tuyệt vời.)"}, {"n": 2, "ans": "more", "expl": "", "tr": "Take up more sports like swimming, badminton or yoga to keep fit. (Hãy tham gia nhiều môn thể thao hơn như bơi lội, cầu lông hay yoga để giữ dáng.)"}, {"n": 3, "ans": "less", "expl": "", "tr": "Eat less food that contains a lot of fat, salt and cholesterol. (Hãy ăn ít đồ ăn chứa nhiều chất béo, muối và cholesterol hơn.)"}, {"n": 4, "ans": "less - more", "expl": "", "tr": "If you are obese, eat less and exercise more. (Nếu bạn bị béo phì, hãy ăn ít hơn và tập thể dục nhiều hơn.)"}, {"n": 5, "ans": "more", "expl": "", "tr": "Sleep more at night to let internal organs work effectively. (Hãy ngủ nhiều hơn vào ban đêm để các cơ quan nội tạng hoạt động hiệu quả.)"}, {"n": 6, "ans": "less", "expl": "", "tr": "Add less sugar into your dishes in order to avoid obesity and heart disease. (Hãy nêm ít đường hơn vào các món ăn của bạn để tránh bệnh béo phì và bệnh tim.)"}, {"n": 7, "ans": "less", "expl": "", "tr": "Spend less time playing computer games or your eyes will be tired. (Hãy dành ít thời gian chơi điện tử hơn hoặc mắt cậu sẽ mỏi đó.)"}, {"n": 8, "ans": "more", "expl": "", "tr": "Eat more food that contains a lot of fibre, such as fruit, vegetables and bread. (Hãy ăn nhiều thực phẩm có chứa nhiều chất xơ, chẳng hạn như trái cây, rau củ và bánh mì.)"}, {"n": 9, "ans": "less", "expl": "", "tr": "Drink less cold water to avoid sore throat. (Hãy uống ít nước lạnh hơn để tránh viêm họng.)"}, {"n": 10, "ans": "more", "expl": "", "tr": "Do more physical activities to keep fit. (Hãy tham gia nhiều hoạt động thể chất hơn để giữ dáng.)"}, {"n": 11, "ans": "less", "expl": "", "tr": "Eat less junk food or you will be obese. (Hãy ăn ít đồ ăn vặt đi, nếu không bạn sẽ bị béo phì đấy.)"}, {"n": 12, "ans": "more", "expl": "", "tr": "Drink more water to prevent kidney damage. (Hãy uống nhiều nước hơn để ngăn ngừa tổn thương thận.)"}, {"n": 13, "ans": "less", "expl": "", "tr": "Drink less alcohol in order to protect your liver. (Hãy uống ít rượu hơn để bảo vệ gan của bạn.)"}, {"n": 14, "ans": "more", "expl": "", "tr": "Wash your hands more regularly to prevent common bacterial and viral infections. (Hãy rửa tay thường xuyên hơn để ngán ngừa lây nhiễm do các loại vi khuẩn và vi rút thông thường.)"}, {"n": 15, "ans": "less", "expl": "", "tr": "Buy less snacks whenever you go to the supermarket. (Hãy mua ít đồ ăn vặt hơn mỗi khi bạn đi siêu thị.)"}], "gI_lines": ["E.g.: Let your eyes rest __more__ by using computers __less__.", "1. Spend_________time doing exercise every day. Going jogging is a great choice.", "2. Take up_________sports like swimming, badminton or yoga to keep fit.", "3. Eat_________food that contains a lot of fat, salt and cholesterol.", "4. If you are obese, eat_________and exercise.", "5. Sleep_________at night to let internal organs work effectively.", "6. Add_________sugar into your dishes in order to avoid obesity and heart disease.", "7. Spend_________time playing computer games or your eyes will be tired.", "8. Eat_________food that contains a lot of fibre, such as fruit, vegetables and bread.", "9. Drink_________cold water to avoid sore throat.", "10. Do_________physical activities to keep fit.", "11. Eat_________junk food or you will be obese.", "12. Drink_________water to prevent kidney damage.", "13. Drink_________alcohol in order to protect your liver.", "14. Wash your hands_________regularly to prevent common bacterial and viral infections.", "15. Buy_________snacks whenever you go to the supermarket."], "gII_key": [{"n": 1, "ans": "and", "expl": "Vì việc “cô ấy tập thể dục buổi sáng mỗi ngày” được thêm vào việc “cô ấy án nhiều trái cây và rau củ” để diễn tả thói quen nên ta dùng liên từ “and” để nối hai mệnh đề này với nhau.", "tr": "My sister eats a lot of fruits and vegetables, and she does morning exercise every day. (Chị gái tôi ăn rất nhiều trái cây và rau củ, và chị ấy tập thể dục buổi sáng hàng ngày.)"}, {"n": 2, "ans": "because", "expl": "Vì việc “Harry rất mập” là kết quả của việc “cậu ấy lúc nào cũng ăn đồ ngọt” nên ta dùng liên từ “because” để nối hai mệnh đề này với nhau.", "tr": "Harry is very fat, because he eats sweet food all the time. (Harry rất mập vì lúc nào cậu ấy cũng ăn đồ ngọt.)"}, {"n": 3, "ans": "so", "expl": "Vì việc “họ làm vài chiếc bánh mì kẹp” là kết quả của việc “họ đói” nên ta dùng liên từ “so” để nối hai mệnh đề này với nhau.", "tr": "They were hungry, so they made some sandwiches. (Họ đói bụng, vì vậy họ đã làm vài chiếc bánh mì kẹp.)"}, {"n": 4, "ans": "but", "expl": "Vì việc “bà ấy trông trẻ hơn nhiều so với tuổi thật của mình” tương phản với việc “bà ấy hơn 50 tuổi” nên ta dùng liên từ “but” để nối hai mệnh đề này với nhau.", "tr": "She is over 50 years old, but she looks much younger than her real age. (Bà ấy đã hơn 50 tuổi nhưng bà trông trẻ hơn nhiều so với tuổi thật của mình.)"}, {"n": 5, "ans": "so", "expl": "Vì việc “cô ấy cảm thấy thực sự mệt mỏi suốt cả buổi sáng” là kết quả của việc “đêm qua cô ấy thức quá khuya” nên ta dùng liên từ “so” để nối hai mệnh đề này với nhau.", "tr": "Linda stayed up too late last night, so she felt really tired during this morning. (Đêm qua Linda thức quá khuya, vì vậy cô ấy cảm thấy thực sự mệt mỏi suốt cả buổi sáng nay.)"}, {"n": 6, "ans": "but", "expl": "Vì việc “cậu bé từ chối không uống thuốc” tương phản với việc “cậu bé bị cúm” nên ta dùng liên từ “but” để nối hai mệnh đề này với nhau.", "tr": "My son has a flu, but he refuses to take medicine. (Con trai tôi bị cúm, nhưng thằng bé không chịu uống thuốc.)"}, {"n": 7, "ans": "or", "expl": "“bệnh sẽ trở nên nặng hơn” là hậu quả nếu hành động “kiểm tra sức khỏe thường xuyên” không được thực hiện nên ta dùng liên từ “or” trong trường hợp này.", "tr": "You should have a health check regularly, or your disease will get worse. (Bạn nên đi kiểm tra sức khỏe thường xuyên, nếu không bệnh của bạn sẽ nặng hơn đó.)"}, {"n": 8, "ans": "and", "expl": "Vì việc “anh ấy bị ho” được thêm vào việc “anh ấy bị đau đầu” để diễn tả các triệu chứng bệnh nên ta dùng liên từ “and” để nối hai mệnh đề này với nhau.", "tr": "Martin has a headache, and he has a cough, too. (Martin bị đau đầu, và anh ấy cũng bị ho nữa.)"}, {"n": 9, "ans": "so", "expl": "Vì việc “tôi thường gặp vấn đề với mụn nhọt” là kết quả của việc “tôi có làn da dầu” nên ta dùng liên từ “so” để nối hai mệnh đề này với nhau.", "tr": "I have oily skin, so I usually have problems with spots. (Tôi có làn da dầu, vì vậy tôi thường gặp vấn đề với mụn nhọt.)"}, {"n": 10, "ans": "or", "expl": "“sẽ mất nhiều thời gian để lành vết thương” là hậu quả nếu hành động “ăn thịt bò khi có vết thương” được thực hiện nên ta dùng liên từ “or” trong trường hợp này.", "tr": "You shouldn’t eat beef when you have a wound, or it will take much time for the wound to heal. (Bạn không nên ăn thịt bò khi có vết thương, nếu không sẽ mất nhiều thời gian để vết thương lành lại.)"}], "gII_lines": ["E.g.: I like sport programs, <u>but</u>/ so/ or my sister like movies.", "1. My sister eats a lot of fruits and vegetables, so/ or/ and she does morning exercise every day.", "2. Harry is very fat because/ so/ or he eats sweet food all the time.", "3. They were hungry, but/ or/ so they made some sandwiches.", "4. She is over 50 years old, but/ and/ or she looks much younger than her real age.", "5. Linda stayed up too late last night, and/ so/ but she felt really tired during this morning.", "6. My son has a flu, and/ so/ but he refuses to take medicine.", "7. You should have a health check regularly, but/ or/ and your disease will get worse.", "8. Martin has a headache, and/ but/ so he has a cough, too.", "9. I have oily skin, or/ so/ but I usually have problems with spots.", "10. You shouldn’t eat beef when you have a wound, and/ so/ or it will take much time for the wound to heal."], "gIII_key": [{"n": 1, "ans": "It was very sunny and hot last Saturday, so we went to the beach.", "expl": "Vì việc “chúng tôi đến bãi biển” là kết quả của việc “trời nắng và nóng” nên ta dùng liên từ “so” để nối hai mệnh đề này với nhau.", "tr": "Thứ Bảy tuần trước trời rất nắng và nóng, vì vậy chúng tôi đã đến bãi biển."}, {"n": 2, "ans": "Helen likes adding sugar into her coffee, but she doesn’t like adding milk into it.", "expl": "Vì việc “cô ấy không thích thêm sữa vào cà phê” tương phản với việc “Helen thích thêm đường vào cà phê” nên ta dùng liên từ “but” để nối hai mệnh đề này với nhau.", "tr": "Helen thích thêm đường vào cà phê, nhưng cô ấy không thích thêm sữa vào."}, {"n": 3, "ans": "You should eat more, or you will make yourself ill.", "expl": "Người nói đưa ra hai sự lựa chọn, một là “ăn nhiều hơn”, hai là “tự làm mình bị ốm” nên ta dùng liên từ “or” để nối hai mệnh đề này với nhau.", "tr": "Bạn nên ăn nhiều hơn, nếu không bạn sẽ tự làm mình ốm đấy."}, {"n": 4, "ans": "Lucy was tired, so she went to bed early.", "expl": "Vì việc “cô ấy đi ngủ sớm” là kết quả của việc “Lucy mệt” nên ta dùng liên từ “so” để nối hai mệnh đề này với nhau.", "tr": "Lucy bị mệt, vì vậy cô ấy đã đi ngủ sớm"}, {"n": 5, "ans": "My name is Mark, and I’m your new teacher.", "expl": "Vì việc giới thiệu “thầy là giáo viên mới của các em” được thêm vào việc giới thiệu “thầy tên là Mark” nên ta dùng liên từ “and” để nối hai mệnh đề này với nhau.", "tr": "Thầy tên là Mark, và thầy là giáo viên mới của các em."}, {"n": 6, "ans": "I will buy 2 bottles of wine, and we will drink together tonight.", "expl": "Vì việc “tối nay chúng ta sẽ uống cùng nhau” được thêm vào việc “Tôi sẽ mua hai chai rượu” để diễn tả về một kế hoạch nên ta dùng liên từ “and” để nối hai mệnh đề này với nhau.", "tr": "Tôi sẽ mua hai chai rượu và tối nay chúng ta sẽ uống cùng nhau."}, {"n": 7, "ans": "The restaurant service is not very good, but the food is delicious.", "expl": "Vì việc “đồ ăn ngon” tương phản với việc “Phục vụ của nhà hàng không được tốt cho lắm” nên ta dùng liên từ “but” để nối hai mệnh đề này với nhau.", "tr": "Cách phục vụ của nhà hàng này không được tốt cho lắm, nhưng đò ăn thì rất ngon."}, {"n": 8, "ans": "You can fly from Vancouver to Victoria, or you can take a ferry instead.", "expl": "Người nói đưa ra hai sự lựa chọn, một là “đi phà”, hai là “đi máy bay” nên ta dùng liên từ “or” để nối hai mệnh đề này với nhau.", "tr": "Bạn có thể đi máy bay từ Vancouver đến Victoria, hoặc là thay vào đó bạn có thể đi phà."}, {"n": 9, "ans": "Jollie was always on time, but she was an hour late tonight.", "expl": "Vì việc “tối nay cô ấy muộn một giờ đồng hồ” tương phản với việc “Jollie luôn đúng giờ” nên ta dùng liên từ “but” để nối hai mệnh đề này với nhau.", "tr": "Jollie luôn đúng giờ, nhưng tối nay cô ấy đã đến muộn một giờ đồng hồ."}, {"n": 10, "ans": "You had better hurry, or you will miss the train.", "expl": "“sẽ muộn tàu” là hậu quả nếu hành động “nhanh lên” không được thực hiện nên ta dùng liên từ “or” trong trường hợp này.", "tr": "Bạn nên nhanh lên, nếu không bạn sẽ bị nhỡ tàu đấy."}, {"n": 11, "ans": "Emily goes to the gym every day, so she looks really beautiful and fit.", "expl": "Vì việc “cô ấy trông thật xinh đẹp và cân đối” là kết quả của việc “cô ấy đến phòng tập thể hình hàng ngày” nên ta dùng liên từ “so” để nối hai mệnh đề này với nhau.", "tr": "Emily đến phòng tập hàng ngày, vì vậy cô ấy trông thật xinh đẹp và cân đối."}, {"n": 12, "ans": "I have a sore throat, but I want to eat an ice cream.", "expl": "Vì việc “tôi bị viêm họng” tương phản với việc “tôi muốn ăn kem” nên ta dùng liên từ “but” để nối hai mệnh đề này với nhau.", "tr": "Tôi bị đau họng nhưng tôi lại muốn ăn kem."}, {"n": 13, "ans": "Mark usually eats fast food, and he likes drinking Coca-Cola.", "expl": "Vì việc “cậu ấy thích uống Coca-Cola” được thêm vào việc “cậu ấy thường ăn đồ ăn nhanh” để diễn tả sở thích và thói quen của Mark nên ta dùng liên từ “and” để nối hai mệnh đề này với nhau.", "tr": "Mark thường xuyên ăn đồ ăn nhanh, và cậu ấy thích uống Coca-Cola."}, {"n": 14, "ans": "You shouldn’t sit in front of the computer or television for so long, or you will get short-sighted.", "expl": "“Bạn sẽ bị cận thị” là hậu quả nếu hành động “ngồi trước máy tính hoặc tivi quá lâu” được thực hiện nên ta dùng liên từ “or” trong trường hợp này.", "tr": "Bạn không nên ngồi trước máy tính hoặc tivi quá lâu, nếu không bạn sẽ bị cận thị đấy."}, {"n": 15, "ans": "My son didn’t wash the apple before eating, so he got a terrible stomachache.", "expl": "Vì việc “cậu bé bị đau bụng” là kết quả của Việc “cậu bé không rửa táo trước khi ăn” nên ta dùng liên từ “so” để nối hai mệnh đề này với nhau.", "tr": "Con trai tôi đã không rửa táo trước khi ăn, vì vậy cậu bé bị đau bụng dữ dội."}, {"n": 16, "ans": "You shouldn’t drive when you are drunk, or you will cause an accident.", "expl": "“Bạn sẽ gây tai nạn” là hậu quả nếu hành động “lái xe khi say rượu” được thực hiện nên ta dùng liên từ “or” trong trường hợp này. Người nói đưa ra hai sự lựa chọn, một là, hai là nên ta dùng liên từ “or” để nối hai mệnh đề này với nhau.", "tr": "Bạn không nên lái xe khi say rượu, nếu không bạn sẽ gây ra tai nạn đấy."}, {"n": 17, "ans": "One of my teeth is hurt, so I will go to the dentist tomorrow.", "expl": "Vì việc “ngày mai tôi sẽ đến gặp nha sĩ’ là kết quả của việc “một chiếc răng của tôi bị đau” nên ta dùng liên từ “so” để nối hai mệnh đề này với nhau.", "tr": "Một chiếc răng của tôi bị đau, vì vậy ngày mai tôi sẽ đến gặp nha sĩ."}, {"n": 18, "ans": "We were very tired after the trip to Los Angeles, but we were really happy.", "expl": "Vì việc “chúng tôi thực sự rất vui” tương phản với việc “chúng tôi rất mệt sau chuyến đi đến Los Angeles” nên ta dùng liên từ “but” để nối hai mệnh đề này với nhau.", "tr": "Chúng tôi đã rất mệt mỏi sau chuyến đi đến Los Angeles, nhưng chúng tôi thực sự rất vui."}, {"n": 19, "ans": "You can register for this English course via the Internet, or you can go directly to the center.", "expl": "Người nói đưa ra hai sự lựa chọn, một là “đăng kí khóa học tiếng Anh qua mạng”, hai là “đến trực tiếp trung tâm” nên ta dùng liên từ “or” để nối hai mệnh đề này với nhau.", "tr": "Bạn có thể đăng ký khóa học tiếng Anh này qua Internet, hoặc bạn có thể đến trực tiếp trung tâm."}, {"n": 20, "ans": "The vegetarians don’t eat meat, and they don’t eat fish, either.", "expl": "Vì việc “không ăn cá” được thêm vào việc “không ăn thịt” để diễn tả đặc điểm của người ăn chay nên ta dùng liên từ “and” để nối hai mệnh đề này với nhau.", "tr": "Những người ăn chay không ăn thịt, và họ cũng không ăn cá."}], "gIII_lines": ["E.g.: I like football. I like basketball too.", "→ I like football, and I like basketball too.", "1. It was very sunny and hot last Saturday. We went to the beach.", "→ ____________________________________________________", "2. Helen likes adding sugar into her coffee. She doesn’t like adding milk into it.", "→ ____________________________________________________", "3. You should eat more. You will make yourself ill.", "→ ____________________________________________________", "4. Lucy was tired. She went to bed early.", "→ ____________________________________________________", "5. My name is Mark. I’m your new teacher.", "→ ____________________________________________________", "6. I will buy 2 bottles of wine. We will drink together tonight.", "→ ____________________________________________________", "7. The restaurant service is not very good. The food is delicious.", "→ ____________________________________________________", "8. You can fly from Vancouver to Victoria. You can take a ferry instead.", "→ ____________________________________________________", "9. Jollie was always on time. She was an hour late tonight.", "→ ____________________________________________________", "10. You had better hurry. You will miss the train.", "→ ____________________________________________________", "11. Emily goes to the gym every day. She looks really beautiful and fit.", "→ ____________________________________________________", "12. I have a sore throat. I want to eat an ice cream.", "→ ____________________________________________________", "13. Mark usually eats fast food. He likes drinking Coca-Cola.", "→ ____________________________________________________", "14. You shouldn’t sit in front of the computer or television for so long. You will get short-sighted.", "→ ____________________________________________________", "15. My son didn’t wash the apple before eating. He got a terrible stomachache.", "→ ____________________________________________________", "16. You shouldn’t drive when you are drunk. You will cause an accident.", "→ ____________________________________________________", "17. One of my teeth is hurt. I will go to the dentist tomorrow.", "→ ____________________________________________________", "18. We were very tired after the trip to Los Angeles. We were really happy.", "→ ____________________________________________________", "19. You can register for this English course via the Internet. You can go directly to the center.", "→ ____________________________________________________", "20. The vegetarians don’t eat meat. They don’t eat fish, either.", "→ ____________________________________________________"], "pII_key": [{"n": 1, "ans": "", "expl": "", "tr": "There is a football match on television this evening (Có một trận bóng đá trên ti vi vào tối nay.)"}, {"n": 2, "ans": "", "expl": "", "tr": "Fire crews arrived and began to fight the flame. (Đội cứu hỏa đến và bắt đầu chiến đấu với ngọn lửa.)"}, {"n": 3, "ans": "", "expl": "", "tr": "The book offers a Vision of the future. (Cuốn sách đưa ra một viễn cảnh về tương lai.)"}, {"n": 4, "ans": "", "expl": "", "tr": "I have received a lovely gift from a French friend. (Tôi đã nhận được một món quà dễ thương từ 1 một người bạn Pháp.)"}, {"n": 5, "ans": "", "expl": "", "tr": "We believe our service will make our customers satisfied. (Chúng tôi tin rằng dịch vụ của chúng tôi sẽ khiến khách hàng của chúng tôi hài lòng.)"}, {"n": 6, "ans": "", "expl": "", "tr": "My father put his valuable vase on the shelf in the living room. (Bố tôi đã đặt chiếc bình quý của ông lên kệ trong phòng khách.)"}, {"n": 7, "ans": "", "expl": "", "tr": "I love playing volleyball with my friends after school. (Tôi thích chơi bóng chuyền với bạn bè sau khi tan học.)"}, {"n": 8, "ans": "", "expl": "", "tr": "I often visit my grandfather’s farm during the summer vacation. (Tôi thường đến thăm nông trại của ông tôi vào kì nghỉ hè.)"}, {"n": 9, "ans": "", "expl": "", "tr": "Luke often leaves his office at seven every day. (Luke thường rời văn phòng vào lúc bảy giờ hàng ngày.)"}, {"n": 10, "ans": "", "expl": "", "tr": "We have finished the vocabulary exercise of unit four in the textbook. (Chúng tôi đã hoàn thành bài tập từ vựng của bài bốn trong sách giáo khoa.)"}, {"n": 11, "ans": "", "expl": "", "tr": "You should review difficult lessons several times before the exam. (Bạn nên xem lại những bài học khó vài lần trước khi thi.)"}, {"n": 12, "ans": "", "expl": "", "tr": "The couple finally got married and lived happily ever after. (Cuối cùng hai người đã kết hôn và sống hạnh phúc mãi về sau.)"}, {"n": 13, "ans": "", "expl": "", "tr": "Karen laughs a lot whenever she watches that movie. (Karen cười rất nhiều mỗi khi cô ấy xem bộ phim đó.)"}, {"n": 14, "ans": "", "expl": "", "tr": "I never feel safe to leave my house at night. (Tôi không bao giờ cảm thấy an toàn khi ra khỏi nhà vào ban đêm.)"}, {"n": 15, "ans": "", "expl": "", "tr": "Did he offer any explanation for his violent behaviour? (Anh ta có đưa ra bất kỳ lời giải thích nào cho hành vi bạo lực của mình không?)"}], "pI_lines": ["/v/", "/f/", "advise /ədˈvaɪz/, guava /ˈɡwɑːvə/, avoid /əˈvɔɪd/, heavy /ˈhevi/, volcano /vɒlˈkeɪnəʊ/", "photo /ˈfəʊtəʊ/, awful /ˈɔːfl/, butterfly /ˈbʌtəflaɪ/, feedback /ˈfiːdbæk/, buffalo /ˈbʌfələʊ/"], "rI": [{"n": 1, "q": "What could be another title for this reading?", "o": ["“Drink Water, Not Soft Drinks”", "“Drink During Meals”", "“Drink Between Meals”", "“Drink Enough Water”"], "a": 3, "m": null, "note": "", "tr": "Câu nào có thể là một tiêu đề khác cho bài đọc này? A. “Uống nước, nhưng không phải nước ngọt” B. “Uống nước trong các bữa ăn” C. “Uống nước giữa các bữa ăn”D. “Uống đủ nước”", "expl": "Tất cả các câu trong bài đọc đều hướng về một thông điệp chung là khuyên mọi người uống đủ nước, nên uống nước vào lúc nào, do đó “Drink Enough Water” (“Uống đủ nước”) có thể là một tiêu đề khác cho bài đọc này."}, {"n": 2, "q": "Why is it helpful to drink water in the morning?", "o": ["Your kidneys will work harder.", "Your intestines will work well", "Your juices will be diluted.", "Your urine will be pale yellow."], "a": 1, "m": null, "note": "", "tr": "Tại sao uống nước mỗi buổi sáng lại có lợi? A. Thận của bạn sẽ làm việc chăm chỉ hơn. B. Ruột của bạn sẽ hoạt động tốt. C. Dịch vị của bạn sẽ bị pha loãng. D. Nước tiểu của bạn sẽ có màu vàng nhạt.", "expl": "Thông tin ở câu thứ 4 của đoạn 2: “Water can also help your intestines work better.”"}, {"n": 3, "q": "Which of the following is NOT a reason to drink water?", "o": ["To enable your intestines work well", "To get more nutrients", "To clean out your kidneys", "To dilute your stomach juices"], "a": 3, "m": null, "note": "", "tr": "Điều nào sau đây KHÔNG phải là một lý do để uống nước? A. Khiến ruột của bạn hoạt động tốt hơnB. Để có thêm chất dinh dưỡng C. Để làm sạch thận của bạnD. Để làm loãng dịch vị của bạn", "expl": "Thông tin ở câu thứ 4 và 5 của đoạn 3: “Some people think it’s better to drink between meals and not during meals. They think water dilutes the juices produced in our stomachs.”. Trong câu này, tác giả muốn khuyên chúng ta không nên uống nước trong các bữa ăn vì nó sẽ làm loãng dịch vị trong dạ dày của chúng ta. Do đó, đây là lý do để không uống nước trong các bữa ăn chứ không phải lý do để uống nước. - Phương án A là một lý do để uống nước: thông tin ở câu “Water can also help your intestines work better.” - Phương án B là một lý do để uống nước: thông tin ở câu “After drinking water, the intestines can more easily take out nutrients from our food.” - Phương án C là một lý do để uống nước: thông tin ở câu “It helps clean out your kidneys.”"}, {"n": 4, "q": "Why is it better to drink between meals?", "o": ["You eat enough food.", "You don’t dilute stomach juices.", "Your urine will not smell bad.", "You don’t overwork your kidneys."], "a": 1, "m": null, "note": "", "tr": "Tại sao uống nước giữa các bữa ăn lại tốt hơn? A.Bạn ăn đủ thức ăn. B.Bạn không làm loãng dịch vị dạ dày. C. Nước tiểu của bạn sẽ không có mùi hôi. D. Bạn không khiến thận của bạn làm việc quá sức.", "expl": "Thông tin ở câu thứ 4 và 5 của đoạn 3: “Some people think it’s better to drink between meals and not during meals. They think water dilutes the juices produced in our stomachs.”"}, {"n": 5, "q": "Why is dark-colored urine a sign to drink more water?", "o": ["It shows our body is healthy.", "It means our kidneys are working too hard.", "Less water makes the color darker.", "It is the same color as our digestive juices."], "a": 2, "m": null, "note": "", "tr": "Tại sao nước tiểu có màu sẫm là dấu hiệu để uống nhiều nước hơn? A.Điều đó cho thấy cơ thể của chúng ta khỏe mạnh. B.Điều đó có nghĩa là thận của chúng ta đang làm việc quá sức. C. ít nước hơn khiến màu đậm hơn. D. Nó cùng màu với dịch vị của chúng ta.", "expl": "Thông tin ở câu thứ 3 và 4 của đoạn 4: “If it is light yellow, you are probably drinking enough. If your urine is very dark yellow, you probably need to drink more water.”. Nước tiểu màu vàng nhạt có nghĩa là đã uống đủ nước, còn nước tiểu màu vàng đậm thì cần uống nhiều nước hơn chứng tỏ uống ít nước hơn sẽ khiến màu nước tiểu đậm hơn."}], "rII_key": [{"n": 1, "ans": "False", "expl": "Thông tin có ở câu: “Mental health is as important as physical health to a full, active lifestyle.”", "tr": "Sức khỏe tinh thần thậm chí còn quan trọng hơn sức khỏe thể chất."}, {"n": 2, "ans": "True", "expl": "Thông tin có ở câu: “It is harder to define mental health than physical health, because, in many cases, diagnosis depends on the individual’s perception of their experience.”", "tr": "Chẩn đoán sức khỏe tâm thần phụ thuộc vào nhận thức về kinh nghiệm."}, {"n": 3, "ans": "False", "expl": "Thông tin có ở câu: “With improvements in testing, however, some signs of some types of mental illness are now becoming “visible” in CT scans and genetic testing.”", "tr": "Bệnh tâm thần phức tạp đến mức xét nghiệm di truyền không thể xác định dấu hiệu của nó."}, {"n": 4, "ans": "True", "expl": "Thông tin có ở câu: “Physical and mental health are linked. If chronic illness affects a person’s ability to complete their regular tasks, this may lead to depression and stress, for example, due to money problems.”", "tr": "Nhiệm vụ thường xuyên không hoàn thành có thể dẫn đến trầm cảm và căng thẳng."}, {"n": 5, "ans": "True", "expl": "Thông tin có ở câu: “A mental illness such as depression or anorexia nervosa can affect body weight and function. It Is important to approach “health” as a whole, rather than its different types.”", "tr": "Mọi người nên tiếp cận sức khỏe với các loại khác nhau."}], "rII_lines": ["Mental health refers to a person’s emotional, social, and psychological well-being. Mental health is as important as physical health to a full, active lifestyle. It is harder to define mental health than physical health, because, in many cases, diagnosis depends on the individual’s perception of their experience.", "With improvements in testing, however, some signs of some types of mental illness are now becoming “visible” in CT scans and genetic testing. Mental health is not only the absence of depression, anxiety, or another disorder. It also depends on the ability to enjoy life, bounce back after difficult experiences, achieve balance...etc.", "Physical and mental health are linked. If chronic illness affects a person’s ability to complete their regular tasks, this may lead to depression and stress, for example, due to money problems. A mental illness such as depression or anorexia nervosa can affect body weight and function. It is Important to approach “health” as a whole, rather than its different types.", "1. Mental health is even more important than physical health.", "2. Diagnosis of mental health depends on perception of experience.", "3. Mental illness is so complex that genetic testing cannot identify its signs.", "4. Uncompleted regular tasks may lead to depression and stress.", "5. People shouldn’t approach health by understanding its different types."], "L_key": [{"n": 1, "ans": "relaxed", "expl": "Thông tin nằm ở câu nói: “Can you give me something to make me feel more relaxed?”", "tr": "Emily cần một số loại thuốc khiến cô ấy có thể cảm thấy_________hơn."}, {"n": 2, "ans": "lifestyle", "expl": "Thông tin ở câu nói: “Well, I’m not the kind of doctor who will prescribe drugs for something that just requires a change in lifestyle.”", "tr": "Bác sĩ nói rằng một sự thay đổi trong_________có thể giải quyết vấn đề của Emily."}, {"n": 3, "ans": "overeat", "expl": "Thông tin ở câu nói: “No. But I watch my weight. I don’t overeat.”", "tr": "Mặc dù Emily không tập thể dục thường xuyên nhưng cô ấy không_________."}, {"n": 4, "ans": "clear", "expl": "Thông tin ở câu nói: “It helps you to clear your mind.”", "tr": "Mục đích chính của việc tập thể dục là để giúp Emily_________tâm trí của mình."}, {"n": 5, "ans": "30", "expl": "Thông tin ở câu nói: “So, what I want you to do for the next week is do at least 30 minutes of physical activity every day.”", "tr": "Bác sĩ khuyên Emily nên tập thể dục ít nhất_________phút mỗi ngày."}], "L_lines": ["Listen to the dialogue between Emily and her doctor and complete each sentences with ONE appropriate word or number.", "1. Emily needs some drugs that can make her feel more_________.", "2. The doctor says that a change in_________can solve the Emily’s problem.", "3. Although Emily doesn’t get much exercise, she doesn’t_________.", "4. The main purpose of exercising is to help Emily_________her mind.", "5. The doctor advises Emily to do exercise at least_________minutes every day."], "W_key": [{"n": 1, "ans": "I usually put a wet towel on my forehead when I have a fever.", "expl": "", "tr": "Tôi thường đắp khăn ướt lên trán mỗi khi bị sốt."}, {"n": 2, "ans": "You should cycle or go jogging at least 30 minutes a day to keep fit.", "expl": "", "tr": "Bạn nên đạp xe hoặc chạy bộ ít nhất 30 phút mỗi ngày để giữ dáng."}, {"n": 3, "ans": "Molly feels tired today because she couldn’t sleep last night.", "expl": "", "tr": "Hôm nay Molly cảm thấy mệt mỏi vì đêm qua cô ấy không thể nào ngủ được."}, {"n": 4, "ans": "Vitamins are essential for our health.", "expl": "", "tr": "Các loại vitamin rất cần thiết cho sức khỏe của chúng ta."}, {"n": 5, "ans": "Give up smoking right now to protect your lungs.", "expl": "", "tr": "Hãy bỏ thuốc lá ngay bây giờ để bảo vệ phổi của bạn."}], "pII": [{"n": 1, "text": "There is a football match on television this evening", "vi": "Có một trận bóng đá trên ti vi vào tối nay.", "f": [["Football", "ˈfʊtbɔːl"]], "v": [["Television", "ˈtelɪvɪʒn"], ["evening", "ˈiːvnɪŋ"]]}, {"n": 2, "text": "Fire crews arrived and began to fight the flame.", "vi": "Đội cứu hỏa đến và bắt đầu chiến đấu với ngọn lửa.", "f": [["Fire", "ˈfaɪə(r)"], ["fight", "faɪt"], ["flame", "fleɪm"]], "v": [["Arrived", "əˈraɪvd"]]}, {"n": 3, "text": "The book offers a Vision of the future.", "vi": "Cuốn sách đưa ra một viễn cảnh về tương lai.", "f": [["Offers", "ˈɒfə(r)z"], ["future", "ˈfjuːtʃə(r)"]], "v": [["Vision", "ˈvɪʒn"]]}, {"n": 4, "text": "I have received a lovely gift from a French friend.", "vi": "Tôi đã nhận được một món quà dễ thương từ 1 một người bạn Pháp.", "f": [["Gift", "ɡɪft"], ["from", "frəm"], ["French", "frentʃ"], ["friend", "frend"]], "v": [["Have", "həv"], ["received", "rɪˈsiːvd"], ["lovely", "ˈlʌvli"]]}, {"n": 5, "text": "We believe our service will make our customers satisfied.", "vi": "Chúng tôi tin rằng dịch vụ của chúng tôi sẽ khiến khách hàng của chúng tôi hài lòng.", "f": [["Satisfied", "ˈsætɪsfaɪd"]], "v": [["believe", "bɪˈliːv"], ["service", "ˈsɜːvɪs"]]}, {"n": 6, "text": "My father put his valuable vase on the shelf in the living room.", "vi": "Bố tôi đã đặt chiếc bình quý của ông lên kệ trong phòng khách.", "f": [["Father", "ˈfɑːðə(r)"], ["shelf", "ʃelf"]], "v": [["valuable", "ˈvæljuəbl"], ["vase", "vɑːz"], ["living", "ˈlɪvɪŋ"]]}, {"n": 7, "text": "I love playing volleyball with my friends after school.", "vi": "Tôi thích chơi bóng chuyền với bạn bè sau khi tan học.", "f": [["friends", "frendz"], ["after", "ˈɑːftə(r)"]], "v": [["love", "lʌv"], ["volleyball", "ˈvɒlibɔːl"]]}, {"n": 8, "text": "I often visit my grandfather’s farm during the summer vacation.", "vi": "Tôi thường đến thăm nông trại của ông tôi vào kì nghỉ hè.", "f": [["often", "ˈɒfn"], ["grandfather", "ˈɡrænfɑːðə(r)"], ["farm", "fɑːm"]], "v": [["Visit", "ˈvɪzɪt"], ["vacation", "veɪˈkeɪʃn"]]}, {"n": 9, "text": "Luke often leaves his office at seven every day.", "vi": "Luke thường rời văn phòng vào lúc bảy giờ hàng ngày.", "f": [["Often", "ˈɒfn"], ["office", "ˈɒfɪs"]], "v": [["Leaves", "liːvz"], ["seven", "ˈsevn"], ["every", "ˈevri"]]}, {"n": 10, "text": "We have finished the vocabulary exercise of unit four in the textbook.", "vi": "Chúng tôi đã hoàn thành bài tập từ vựng của bài bốn trong sách giáo khoa.", "f": [["finished", "ˈfɪnɪʃt"], ["four", "fɔː(r)"]], "v": [["have", "həv"], ["vocabulary", "vəˈkæbjələri"], ["of", "əv"]]}, {"n": 11, "text": "You should review difficult lessons several times before the exam.", "vi": "Bạn nên xem lại những bài học khó vài lần trước khi thi.", "f": [["difficult", "ˈdɪfɪkəlt"], ["before", "bɪˈfɔː(r)"]], "v": [["review", "rɪˈvjuː"], ["several", "ˈsevrəl"], ["living", "ˈlɪvɪŋ"]]}, {"n": 12, "text": "The couple finally got married and lived happily ever after.", "vi": "Cuối cùng hai người đã kết hôn và sống hạnh phúc mãi về sau.", "f": [["finally", "ˈfaɪnəli"], ["after", "ˈɑːftə(r)"]], "v": [["Lived", "lɪv"], ["ever", "ˈevə(r)"]]}, {"n": 13, "text": "Karen laughs a lot whenever she watches that movie.", "vi": "Karen cười rất nhiều mỗi khi cô ấy xem bộ phim đó.", "f": [["Laughs", "lɑːfz"]], "v": [["whenever", "wenˈevə(r)"], ["movie", "ˈmuːvi"]]}, {"n": 14, "text": "I never feel safe to leave my house at night.", "vi": "Tôi không bao giờ cảm thấy   { title: "A Closer Look 2", nav: "A Closer Look 2", icon: "🔬", desc: "Đang cập nhật", subs: [{ label: "", render: soon("🔬", "A Closer Look 2") }], soon: true },
  { title: "Communication", nav: "Communication", vi: "Nói", icon: "🗣️", desc: "Mô tả một lần bạn bị ốm", ex: ["spk"],
    subs: [
      { label: "🎯 Đề bài & ý tưởng", render: () => `<div class="note" style="margin-top:0;font-size:13.5px"><b>Describe a time when you were ill.</b><br><span class="muted">Hãy miêu tả một lần khi bạn bị ốm.</span></div>
          <div class="grid2"><div class="cue"><b>1</b><div>When were you ill?<br><span class="muted">Bạn đã bị ốm khi nào?</span></div></div><div class="cue"><b>2</b><div>What were your symptoms?<br><span class="muted">Các triệu chứng của bạn là gì?</span></div></div><div class="cue"><b>3</b><div>What did you do to cure it?<br><span class="muted">Bạn đã làm gì để chữa trị?</span></div></div><div class="cue"><b>4</b><div>How long did the illness last?<br><span class="muted">Trận ốm kéo dài bao lâu?</span></div></div></div>
          <div class="grid2" style="margin-top:10px"><div class="card"><h3>⏰ When</h3>${WHEN.map(x => `<span class="chip" style="margin:2px">${x.k}</span>`).join('')}<h3 style="margin-top:8px">🤒 Symptoms</h3>${SYM.map(x => `<span class="chip" style="margin:2px">${x.k}</span>`).join('')}</div><div class="card"><h3>💊 Cure</h3>${CURE.map(x => `<span class="chip" style="margin:2px">${x.k}</span>`).join('')}<h3 style="margin-top:8px">📅 How long</h3>${LONG.map(x => `<span class="chip" style="margin:2px">${x.k}</span>`).join('')}</div></div>
          <div class="colh" style="margin-top:12px">Useful structures</div><div class="grid3">${["The last time I was ill was…", "I was ill when…", "… caused me…", "I couldn’t…, so I had to…", "It’s impossible for me to…", "The doctor advised me to…", "I also had to…", "Finally after… days, I felt better and…", "It took me… days to recover and…"].map(x => `<div class="gex" style="margin:0">${x}</div>`).join('')}</div>` },
      { label: "🪄 Tạo bài nói", render: () => `<div class="grid2"><div>
          <div class="colh">1 · Khi nào?</div>${chipRow('w', WHEN)}<div class="colh">2 · Triệu chứng?</div>${chipRow('s', SYM)}
          <div class="colh">3 · Chữa trị thế nào?</div>${chipRow('c', CURE)}<div class="colh">4 · Kéo dài bao lâu?</div>${chipRow('l', LONG)}</div>
          <div><div class="colh">Bài nói của bạn</div><div class="out" id="spkout"></div><div style="margin-top:8px"><button class="btn solid" onclick="say(SPK_TEXT(),.85)">🔊 Nghe đọc mẫu</button></div>
          <div class="note" style="margin-top:10px">🎤 Đọc to bài nói trong <b>1–2 phút</b>, thêm chi tiết của riêng bạn rồi sang tab “Tự đánh giá”.</div></div></div>`, after: spkRender },
      { label: "✅ Tự đánh giá & bài mẫu", ex: ["spk"], render: () => `<div class="grid2"><div>${ckBox()}</div><div><div class="colh">Let’s compare! · Bài mẫu</div><div class="passage" style="font-size:13px">${SP_SAMPLE}</div><details class="tr"><summary>🇻🇳 Xem bản dịch</summary><p>${SP_VI}</p></details><div style="margin-top:8px">${spk(SP_SAMPLE)} <span class="muted">nghe bài mẫu</span></div></div></div>` }
    ] },
  { title: "Skills 1", nav: "Skills 1", vi: "Đọc & Nghe", icon: "📖", desc: "Đọc để biết thông tin cụ thể về sức khỏe và nghe lời khuyên của bác sĩ", ex: ["rd1", "rd2", "ls"],
    subs: [
      { label: "☠️ Do you know?", render: () => `<div class="card" style="max-width:760px;margin:0 auto"><h3 style="font-size:18px">☠️ TOXIC THINGS</h3>
          <p class="txt2">Many things people put in their bodies are downright toxic. Some, such as cigarettes, alcohol and abusive drugs, are also highly addictive, making it hard for people to give them up or avoid them.</p>
          <p class="txt2">If you have a problem with one of these substances, then diet and exercise are the least of your worries.</p>
          <p class="txt2">While alcohol is fine in moderation for those who can tolerate it, tobacco and abusive drugs are bad for everyone.</p>
          <p class="txt2">But an even more common problem today is eating unhealthy, disease-promoting junk foods. If you want to gain optimal health, you need to minimize your consumption of these foods.</p></div>` },
      { label: "💧 Reading 1 · Water", ex: ["rd1"], split: true, render: () => `<div><div class="colh">THE IMPORTANCE OF WATER</div><div class="passage">${R1_TEXT}</div><details class="tr"><summary>🇻🇳 Xem bản dịch</summary><p>${R1_VI}</p></details></div><div>${quiz('rd1', { title: "Choose the best answer to each question", items: R1_MCQ })}</div>` },
      { label: "🧠 Reading 2 · Mental health", ex: ["rd2"], split: true, render: () => `<div><div class="colh">Read the passage</div><div class="passage">${R2_TEXT}</div><details class="tr"><summary>🇻🇳 Xem bản dịch</summary><p>${R2_VI}</p></details></div><div>${quiz('rd2', { title: "TRUE or FALSE?", tf: true, labels: ['T', 'F'], items: R2_TF })}</div>` },
      { label: "🎧 Listening · At the doctor", ex: ["ls"], split: true, render: () => `<div>${lsPlayer('Emily and her doctor')}
          <details class="tr"><summary>📜 Audio script (xem sau khi làm bài)</summary><p>${scriptHtml(LSCRIPT)}</p></details>
          <details class="tr"><summary>🇻🇳 Bản dịch script</summary><p>${LS_VI}</p></details></div>
          <div>${fill('ls', { title: "Listen and complete each sentence with ONE word or number", items: LS_FILL })}</div>` }
    ] },
  { title: "Skills 2", nav: "Skills 2", vi: "Viết", icon: "✍️", desc: "Viết câu và đoạn văn về lời khuyên sức khỏe", ex: ["wr1"],
    subs: [
      { label: "✏️ Viết câu theo gợi ý", ex: ["wr1"], render: () => writeSent('wr1', WR1) },
      { label: "📝 Viết đoạn văn", ex: ["wr2"], split: true, render: () => `<div><div class="colh">Write a short paragraph (60–80 words) about things we should do to have a healthy life</div>${WR2_TASK}
          <textarea class="ta" id="wr2t" oninput="wcUpdate()" placeholder="${WR2_PH}">${esc(WR2.text)}</textarea>
          <div class="wc"><div class="wcbar"><i id="wcb" style="width:0"></i></div><span class="wcn" id="wcn">0 từ</span></div>
          <div class="colh">Gợi ý ý chính · bấm để chèn vào bài</div>${writingIdeas(WR2_IDEAS)}</div>
          <div><div class="colh">Sample paragraph · bài mẫu</div><div class="passage">${WR2_SAMPLE}</div><details class="tr"><summary>🇻🇳 Xem bản dịch</summary><p>${WR2_VI}</p></details>
          <div class="note am" style="margin-top:8px">✨ Mẹo: dùng <b>Firstly / Secondly / Finally</b> để chia ý, <b>should</b> để đưa lời khuyên, và <b>more / less</b> trong câu mệnh lệnh.</div></div>`, after: wcUpdate }
    ] },
  { title: "Looking back", nav: "Looking back", icon: "🔁", desc: "Đang cập nhật", subs: [{ label: "", render: soon("🔁", "Looking back") }], soon: true },
  { title: "Project", nav: "Project", icon: "🎨", desc: "Đang cập nhật", subs: [{ label: "", render: soon("🎨", "Project") }], soon: true }
];

$('.logo .lg').textContent=UNIT.icon;$('.logo b').textContent='UNIT '+UNIT.no;$('.logo small').textContent=UNIT.name;document.title='Unit '+UNIT.no+' - '+UNIT.name;
show(0, 0);
</script>
