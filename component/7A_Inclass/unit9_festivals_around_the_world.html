div>"}, {"id": "r1", "label": "I · Ice & Snow Festival", "kind": "quiz", "items": [{"q": "The world’s biggest snow and ice festival is held in Heilongjiang, China.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Lễ hội băng tuyết lớn nhất thế giới được tổ chức tại Hắc Long Giang, Trung Quốc.</p><p><b>Giải thích</b>: Thông tin có ở đoạn: “Set in Heilongjiang Province in northern China, it’s the world’s biggest snow and ice festival and [...]”</p>"}, {"q": "The festival takes place every year for one month.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Lễ hội diễn ra hàng năm trong một tháng.</p><p><b>Giải thích</b>: Thông tin có ở đoạn: “The annual festival officially runs from January 5 to February 5 but [...]”</p>"}, {"q": "ice used in the festival is carried to China from the North Pole.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Băng được sử dụng trong lễ hội được mang đến Trung Quốc từ Bắc Cực.</p><p><b>Giải thích</b>: Thông tin có ở đoạn: “[...] including the most popular of them all - the Harbin Ice and Snow World, made with ice blocks pulled from the nearby Songhua River.”</p>"}, {"q": "There are 600 landmarks in the Harbin ice and Snow World this year.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Có 600 địa danh trong Thế giới băng tuyết Cáp Nhĩ Tân năm nay.</p><p><b>Giải thích</b>: Thông tin có ở đoạn: “This year, the Harbin Ice and Snow World spans over 600,000 square meters and includes more than 100 landmarks.”</p>"}, {"q": "People use about 4,500 square cubic meters of snow to make Buddha statue. ", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Người ta sử dụng khoảng 4.500 mét khối tuyết để làm tượng Phật.</p><p><b>Giải thích:</b> Thông tin có ở đoạn: “[...] an exquisite snow Buddha statue made of more than 4,500 square cubic meters of snow [...]”</p>"}], "before": "<div class=\"source\"><p><b>I- Read the passage and decide whether the statements are True (T) or False (F).</b></p><p>If you think suffering teeth-chattering cold is part of the fun when you travel, then the Harbin International Ice and Snow Sculpture Festival is the carnival for you. Set in Heilongjiang Province in northern China, it’s the world’s biggest snow and ice festival and has plenty of spectacular works and activities.</p><p>The annual festival officially runs from January 5 to February 5 but some attractions open to visitors before the opening ceremony, including the most popular of them all - the Harbin Ice and Snow World, made with ice blocks pulled from the nearby Songhua River.</p><p>This year, the Harbin Ice and Snow World spans over 600,000 square meters and includes more than 100 landmarks. In addition to walking up the huge shining ice castles, other highlights include an exquisite snow Buddha statue made of more than 4,500 square cubic meters of snow, a 3D light show and the 340-meter-long Northern Lights-themed ice slides.</p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p>Nếu bạn nghĩ việc chịu đựng cái rét run cầm cập là một thú vui khi đi du lịch thì Lễ hội điêu khắc băng và tuyết quốc tế Cáp Nhĩ Tân là lễ hội dành cho bạn. Tổ chức tại tỉnh Hắc Long Giang ở miền bắc Trung Quốc, đây là lễ hội băng tuyết lớn nhất thế giới và có nhiều hoạt động và nghệ thuật sắp đặt ngoạn mục.</p><p>Lễ hội hàng năm chính thức diễn ra từ ngày 5 tháng 1 đến ngày 5 tháng 2 nhưng một số điểm tham quan mở cửa cho du khách trước lễ khai mạc, bao gồm điểm tham quan phổ biến nhất trong số đó - Thế giới băng tuyết Cáp Nhĩ Tân, được làm bằng những khối băng được kéo về từ sông Tùng Hoa gần đó.</p><p>Năm nay, Thế giới băng và tuyết Cáp Nhĩ Tân trải rộng trên 600.000 mét vuông và bao gồm hơn 100 địa danh. Ngoài việc đi bộ lên các lâu đài bàng khổng lồ được chiếu sáng, các điểm nổi bật khác bao gồm một bức tượng Phật bằng tuyết tinh xảo được làm từ hơn 4.500 mét khối tuyết, một màn trình diễn ánh sáng 3D và các đường trượt băng theo chủ đề Ánh sáng phương Bắc dài 340 mét.</p></div></details>"}, {"id": "r2", "label": "II · Canadian festivals", "kind": "quiz", "items": [{"q": "How many grey whales swim near Vancouver Island every year? ", "opts": ["15,000", "16,000", "20,000", "No one knows."], "a": 2, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Có bao nhiêu con cá voi xám bơi gần đảo Vancouver mỗi năm?</p><p><b>A</b>.15.000</p><p><b>B</b>.16.000</p><p><b>C</b>. 20.000</p><p><b>D</b>. Không ai biết.</p><p><b>Giải thích</b>: Thông tin ở câu đầu tiên của đoạn 1: “Every year, about 20,000 grey whales swim past the west coast of Vancouver Island.”</p>"}, {"q": "Where do the grey whales start their annual trip? ", "opts": ["Vancouver Island", "the Arctic", "somewhere in the open ocean", "Mexico"], "a": 3, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Những con cá voi xám bắt đầu chuyến đi hàng năm của chúng ở đâu?</p><p><b>A</b>.Đảo Vancouver</p><p><b>B</b>.Bắc Cực</p><p><b>C</b>. ở đâu đó trong đại dương bao la</p><p><b>D</b>. Mexico</p><p><b>Giải thích</b>: Thông tin ở câu 2 đoạn 1: “The whales travel from Mexico to the Arctic and back again.”</p>"}, {"q": "According to the reading, why is it easy for people to see the whales? ", "opts": ["The people use binoculars.", "The whales swim close to land.", "The people are also swimming in the water.", "They fly over the whales in helicopters."], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi:</b> Theo bài đọc, tại sao mọi người dễ dàng nhìn thấy cá voi?</p><p><b>A</b>.Người dân dùng ống nhòm.</p><p><b>B</b>.Cá voi bơi sát đất liền.</p><p><b>C</b>. Người dân cũng đang bơi dưới nước.</p><p><b>D</b>. Mọi người sử dụng máy bay trực thăng bay qua những con cá voi.</p><p><b>Giải thích</b>: Thông tin ở hai câu cuối đoạn 1: “The whales travel very close to the shore as they swim north. This allows people to gather together to watch the whales from land and from boats.”</p>"}, {"q": "Where does the Nanaimo Bathtub Race happen? ", "opts": ["Far off the north coast of Vancouver Island.", "On the South Shore of Vancouver Island.", "On the west side of Vancouver Island.", "On the east side of Vancouver Island."], "a": 3, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Cuộc đua bồn tắm Nanaimo xảy ra ở đâu?</p><p><b>A</b>.Xa bờ biển phía bắc Đảo Vancouver.</p><p><b>B</b>.Trên bờ Nam của Đảo Vancouver.</p><p><b>C</b>. ở phía tây của Đảo Vancouver.</p><p><b>D</b>. Ở phía đông của đảo Vancouver.</p><p><b>Giải thích</b>: Thông tin ở câu đầu tiên của đoạn 2: “On the east coast of Vancouver Island, you can see people moving through the water in a strange type of boat.”</p>"}, {"q": "What is special about every boat in the race? ", "opts": ["Each boat can carry three people.", "Every boat is made from a bathtub.", "Every boat gets a safety inspection.", "All the boats have sails."], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Điều gì đặc biệt về mỗi chiếc thuyền trong cuộc đua?</p><p><b>A</b>.Mỗi thuyền có thể chở ba người.</p><p><b>B</b>.Mỗi chiếc thuyền được làm từ bồn tắm.</p><p><b>C</b>. Mỗi thuyền được kiểm tra an toàn.</p><p><b>D</b>. Tất cả các thuyền đều có buồm.</p><p><b>Giải thích</b>: Thông tin ở câu 2 đoạn 2: “In the Nanaimo Bathtub Race, all the boats are made from bathtubs.” </p>"}], "before": "<div class=\"source\"><p><b>II - Read the passage and choose the best answer to each of the following questions.</b></p><p><b>The Pacific Rim Whale Festival</b></p><p>Every year, about 20,000 grey whales swim past the west coast of Vancouver Island. The whales travel from Mexico to the Arctic and back again. The whole trip is about 16,000 kilometres. Every March, the people who live around the Pacific Rim National Park have a festival to celebrate the whales’ journey. The festival is the Pacific Rim Whale Festival. The whales travel very close to the shore as they swim north. This allows people to gather together to watch the whales from land and from boats.</p><p><b>Nanaimo Bathtub Race</b></p><p>On the east coast of Vancouver Island, you can see people moving through the water in a strange type of boat. In the Nanaimo Bathtub Race, all the boats are made from bathtubs. The city of Nanaimo is home to the oldest and most famous bathtub boat race in the world. Today, Nanaimo World Championship Bathtub Race is a serious sport that attracts many racers and visitors from around the world.</p></div><details class=\"tr\"><summary>🇻🇳 Bản dịch bài đọc</summary><div class=\"source\"><p><b>Lễ hội cá voi Paciffic Rim</b></p><p>Hàng năm, có khoảng 20.000 con cá voi xám bơi qua bờ biển phía tây của Đảo Vancouver. Những con cá voi bơi từ Mexico đến Bắc Cực và sau đó bơi trở lại. Toàn bộ chuyến đi khoảng 16.000 km. Cứ vào tháng Ba, những người sống xung quanh Vườn Quốc gia Pacific Rim có một lễ hội để kỷ niệm hành trình của cá voi. Lễ hội có tên là Lễ hội cá voi Pacific Rim. Những con cá voi di chuyển vào rất gần bờ khi chúng bơi về phía bắc. Điều này cho phép mọi người có thể tụ tập xem cá voi từ đất liền và trên thuyền.</p></div></details>"}]}, {"title": "Listening · Nghe", "icon": "🔊", "desc": "Unit 9 · Festivals around the World", "subs": [{"id": "l1", "label": "Nghe & làm bài", "kind": "fill", "items": [{"q": "Songkran is Thailand’s___at the beginning of the traditional Thai New Year.", "a": ["water festival"], "exp": "<p><b>Dịch nghĩa câu hỏi:</b> Songkran là________của Thái Lan vào đầu năm mới truyền thống của Thái Lan.</p><p><b>Giải thích</b>: Thông tin ở câu: “An important event on the Buddhist calendar, this water festival marks the beginning of the traditional Thai New Year.”</p>"}, {"q": "“Songkran” means “passing” or “___”, and the festival is held annually in April.", "a": ["approaching"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: “Songkran” có nghĩa là “đi ngang qua” hoặc “_________”, và lễ hội được tổ chức hàng năm vào tháng Tư.</p><p><b>Giải thích</b>: Thông tin ở câu: “The name Songkran comes from a Sanskrit word meaning ‘passing’ or ‘approaching’.”</p>"}, {"q": "The festival takes place from the 13th to the 15th in___every year.", "a": ["April"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Lễ hội diễn ra từ ngày 13 đến ngày 15 trong_________hàng năm.</p><p><b>Giải thích</b>: Thông tin ở câu: Songkran Festival takes place in April every year, from the 13th to the 15th.</p>"}, {"q": "An important part of the festival is___to other people.", "a": ["throwing water"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Một phần quan trọng của lễ hội là_________vào những người khác.</p><p><b>Giải thích</b>: Thông tin ở câu: “Water is an important element of Songkran, especially in more recent times when the throwing of water has become a huge part of the annual celebrations.”</p>"}, {"q": "Pouring water on___is a way to show respect.", "a": ["Buddha images"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Đổ nước vào_________Phật là một cách để thề hiện sự tôn trọng.</p><p><b>Giải thích:</b> Thông tin ở câu: “Buddhists also visit temples throughout Songkran where water is poured on Buddha images and on the hands of Buddhist monks as a mark of respect.”</p>"}], "before": "<div class=\"note\">Giọng đọc tổng hợp từ lời thoại trong tài liệu.</div><button class=\"btn solid\" onclick=\"say(LISTEN)\">▶ Nghe</button> <button class=\"btn\" onclick=\"speechSynthesis.cancel()\">■ Dừng</button>"}, {"label": "Lời thoại & bản dịch", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p>Songkran is Thailand’s most famous festival. An important event in the Buddhist calendar, this water festival marks the beginning of the traditional Thai New Year. The name Songkran comes from a Sanskrit word meaning ‘passing’ or ‘approaching’. Songkran Festival takes place in April every year, from the 13th to the 15th. Water is an important element of Songkran, especially in more recent times when the throwing of water has become a huge part of the annual celebrations. If you’re visiting Thailand during this festival, prepare to get splashed! Crowds of people roam around throwing buckets of water, using water pistols and just generally soaking anyone in the vicinity. Buddhists also visit temples throughout Songkran where water is poured on Buddha images and on the hands of Buddhist monks as a mark of respect.</p></td><td><p>Songkran là lễ hội nổi tiếng nhất Thái Lan. Một sự kiện quan trọng trong lịch Phật giáo, lễ hội té nước này đánh dấu sự khởi đầu của năm mới truyền thống của Thái Lan. Cái tên Songkran xuất phát từ một từ tiếng Phạn có nghĩa là “đi ngang qua” hoặc “tiếp cận”. Lễ hội Songkran diễn ra vào tháng 4 hàng năm, từ ngày 13 đến ngày 15. Nước là một yếu tố quan trọng trong lễ Songkran, đặc biệt là thời gian gần đây khi việc té nước đã trở thành một phần rất quan trọng trong các lễ kỷ niệm hàng năm. Nếu bạn đến thăm Thái Lan trong thời gian diễn ra lễ hội này, hãy chuẩn bị tinh thần bị ướt! Rất đông người dân lang thang khắp nơi, hắt xô nước, sử dụng súng nước và làm ướt bất cứ ai đứng xung quanh họ. Phật tử cũng đến thăm các ngôi đền trong suốt lễ hội Songkran, ở đó nước được té vào hình Phật và đổ vào tay của các nhà sư Phật giáo như một cách thể hiện sự tôn trọng.</p></td></tr></table></div></div>"}]}, {"title": "Speaking · Nói", "icon": "💬", "desc": "Unit 9 · Festivals around the World", "subs": [{"label": "Đề bài & hướng dẫn", "html": "<div class=\"source\"><p><b>Talk about the festival of a foreign country you are most interested in.</b></p><p>You can use the following questions as cues:</p><p>• What and where is the festival?</p><p>•When is the festival held?</p><p>•What are the main activities of the festival?</p><p>• Why are you most interested in that festival?</p><p><b>Useful languages:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Useful vocabulary</b></p></td><td><p><b>Useful structures</b></p></td></tr><tr><td><p>• Harbin Ice Festival</p><p>• Lantern Festival</p><p>• Easter</p><p>• Thanksgiving</p><p>• Jan-Feb</p><p>• 15/12 lunar year</p><p>• seeing lanterns</p><p>• seeing ice castles</p><p>• exciting</p><p>• entertaining</p></td><td><p>• My favourite festival is ... in ...</p><p>• This festival is held ...</p><p>• Participating the festival, people can ...</p><p>• During the festival, people ...</p><p>• I&#x27;m most interested in that festival because ...</p></td></tr></table></div><p><b>Complete the notes:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Structures of the talk</b></p></td><td><p><b>Your notes</b></p></td></tr><tr><td><p>What and where is the festival?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>When is the festival held?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>What are the main activities of the festival?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>Why are you most interested in that festival?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr></table></div><p><b>Now you try!</b></p><p><b>Give your answer using the following cues. You should speak for 1-2 minutes.</b></p><p>1. My favourite festival is ... In ...</p><p>2. This festival is held ...</p><p>3. Participating the festival, people can ...</p><p>4. I’m most interested in that festival because ...</p><p><b>Now you tick!</b></p><p><b>Did you ...</b></p><p> answer all the questions in the task?</p><p> give some details to each main point?</p><p> speak slowly and fluently with only some hesitation?</p><p> use vocabulary wide enough to talk about the topic?</p><p> use various sentence structures (simple, compound, complex) accurately?</p><p> pronounce correctly (vowels, consonants, stress, intonation)?</p><p><b> </b><b>Let’s compare!</b></p><p>Finally, compare with the sample answer on page 170.</p></div>"}, {"label": "Ghi chú luyện nói", "kind": "notes"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>Talk about the festival of a foreign country you are most interested in.</b></p><p><b>Dịch nghĩa câu hỏi</b> :</p><p>Nói về lễ hội của một quốc gia nước ngoài mà em quan tâm nhất.</p><p>Bạn có thể sử dụng các câu hỏi sau đây như gợi ý:</p><p>• Lễ hội gì và ở đâu?</p><p>• Khi nào lễ hội được tổ chức?</p><p>• Các hoạt động chính của lễ hội là gì?</p><p>• Tại sao bạn quan tâm nhất đến lễ hội đó?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Festivals (Lễ hội)</b></p><p>- Oktoberfest (<i>n</i>.) (Lễ hội bia)</p><p>- Harbin Ice Festival (<i>n</i>.) (Lễ hội băng)</p><p>- Songkran (<i>n</i>.) (Lễ té nước)</p><p>- Lantern Festival (<i>n</i>.) (Lễ hội đèn lồng)</p><p><b>Time (Thời gian)</b></p><p>- Sep-Oct (Tháng 9-10)</p><p>- April 13M 5th (13-15 tháng Tư)</p><p>- 15/12 lunar year (15/12 Âm lịch)</p><p>- Jan-Feb (Tháng 1-2)</p><p><b>Activities (Hoạt động)</b></p><p>- drinking good beer (uống bia ngon)</p><p>- seeing ice castles (ngắm lâu đài băng)</p><p>- throwing water (té nước)</p><p>- seeing lanterns (xem đèn lồng)</p><p><b>Reasons (Lí do thích)</b></p><p>- being fond of beer (thích bia)</p><p>- enjoying ice (thích thú băng)</p><p>- exciting (vui vẻ)</p><p>- interesting (thú vị)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>My favourite festival is Oktoberfest in Munich, Germany. This festival is held from the end of September to the beginning of October every year. Coming to this festival, people have a chance to enjoy the greatest and freshest beer. That’s the biggest beer festival in Germany and in the world in general. Participating in the festival, people can have a drink, relax and make friends. In addition, the participants can experience German culture, history, fun games, good food and great beer during the festival. It will be great if one day I have a chance to participate in this festival.</p></td><td><p>Lễ hội mà em yêu thích nhất là Oktoberfest diễn ra ở thành phố Munich, nước Đức từ cuối tháng Chín đến đầu tháng Mười hàng năm. Đến với lễ hội này mọi người có cơ hội được thưởng thức những cốc bia ngon và tươi nhất. Đó là lễ hội bia lớn nhất ở Đức nói riêng và thế giới nói chung. Tham gia lễ hội giúp mọi người có dịp được giải khát, thư giãn và kết bạn với nhau. Lễ hội còn cho phép người tham gia trải nghiệm văn hóa, lịch sử, các trò chơi vui nhộn, đồ ăn ngon và các loại bia hảo hạng của Đức. Sẽ thật tuyệt vời nếu có một ngày em được tham gia lễ hội nổi tiếng và hấp dẫn này.</p></td></tr></table></div></div>"}]}, {"title": "Writing · Viết", "icon": "✍️", "desc": "Unit 9 · Festivals around the World", "subs": [{"id": "w1", "label": "I · Viết câu", "kind": "write", "items": [{"c": "She/ participate/ Boryeong Mud Festival/ three/ year/ ago.", "a": "She participated in Boryeong Mud Festival three years ago.", "vi": "  Dịch nghĩa : Cô ấy đã tham gia lễ hội bùn Boryeong vào ba năm trước. "}, {"c": "Mud Festival/ take place/ July/ every year/ Boryeong town, Korea.", "a": "The Mud Festival takes place in July every year in Boryeong town, Korea.", "vi": "  Dịch nghĩa : Lễ hội bùn diễn ra vào tháng 7 hàng năm tại thị trấn Boryeong, Hàn Quốc. "}, {"c": "It/ be/ originally/ provide people/ cosmetics/ use/ mud/ area.", "a": "It was originally to provide people with cosmetics using the mud from the area.", "vi": "  Dịch nghĩa : Ban đầu là để cung cấp cho mọi người mỹ phẩm làm từ bùn trong khu vực. "}, {"c": "Participate/ festival, people/ have/ great excuse/ get dirty/ have fun.", "a": "Participating in the festival, people have a great excuse to get dirty and have fun.", "vi": "  Dịch nghĩa : Tham gia lễ hội, mọi người có cái cớ tuyệt vời để bị bẩn và có niềm vui. "}, {"c": "Participants/ immerse themselves/ nutrient-rich mud/ mud pool.", "a": "Participants can immerse themselves in nutrient-rich mud in the mud pool.", "vi": "  Dịch nghĩa : Người tham gia có thể đắm mình trong bùn giàu chất dinh dưỡng tại bể bùn. "}, {"c": "People/ often have/ much fun/ when/ play/ colored mud.", "a": "People often have much fun when they play with coloured mud.", "vi": "  Dịch nghĩa : Mọi người thường có nhiều niềm vui khi chơi với bùn màu. "}], "before": ""}, {"label": "II · Viết đoạn văn", "kind": "writing", "html": "<div class=\"source\"><p><b>II - Write a short paragraph (about 60-80 words) about the festival you experienced and remembered the best.</b></p><p>You can answer some of the following questions:</p><p>• What is the festival?</p><p>• When is the festival held?</p><p>• What are the main activities of the festival?</p><p>• What is the most impressive to you?</p><p>__________________________________________________________________</p></div>"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>II - Write a short paragraph (about 60-80 words) about the festival you experienced and remembered the best.</b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Viết một đoạn văn ngắn (khoảng 60-80 từ) về lễ hội mà bạn đã tham dự và nhớ nhất.</p><p>Bạn có thể trả lời một số câu hỏi sau:</p><p>• Đó là lễ hội gì?</p><p>• Khi nào lễ hội được tổ chức?</p><p>• Các hoạt động chính của lễ hội là gì?</p><p>• Điều gì ấn tượng nhất với bạn?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Festivals (Lễ hội)</b></p><p>- Harbin Ice Festival (Lễ hội băng Cáp Nhĩ Tân)</p><p>- Holi Festival (Lễ hội Holi)</p><p>- Carnival of Venice (Lễ hội Venice)</p><p>- Rio Carnival (Lễ hội Rio)</p><p><b>Time (Thời gian)</b></p><p>- in Jan and Feb <i>(prep. phr</i>.) (trong tháng 1 và 2)</p><p>- 40 days before Easter (<i>prep. phr</i>.) (trước lễ Phục sinh 40 ngày)</p><p>- in Feb and Mar (<i>prep. phr.)</i> (trong tháng 2 và 3)</p><p>- on Fri-Ash Wed (<i>prep. phr</i>.) (vào thứ Sáu - thứ Tư Lễ Tro)</p><p><b>Locations (Địa điểm)</b></p><p>- in Harbin, China <i>(prep. phr</i>.) (Cáp Nhĩ Tân, Trung Quốc)</p><p>- in India <i>(prep. phr</i>.) (Ấn Độ)</p><p>- in Venice, Italy (<i>prep. Phr</i>.) (Venice, Ý)</p><p>- in Rio de Janeiro, Brazil <i>(prep. Phr.)</i> (Rio de Janeiro, Bra-xin)</p><p><b>Activities (Hoạt động)</b></p><p>- see ice castles (<i>v. phr</i>.) (ngắm lâu đài băng)</p><p>- sing and dance (<i>v. phr</i>.) (hát và nhảy múa)</p><p>- wear costumes and masks (<i>v. phr</i>.) (trang phục và mặt nạ)</p><p>- Samba dance (<i>v. phr</i>.) (nhảy Samba)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>The festival I participated and remembered the best is Holi Festival in India. It took place at the end of February last year. The festival is to welcome spring and to fight against the evils. Participating in the festival, I had a chance to play, dance and sing. The local people and I threw colourful powder to one another, and danced under water sprinklers. I had a wonderful vacation there. If having a chance, I still choose to go to India and enjoy the Holi Festival once again.</p></td><td><p>Lễ hội mà em đã tham gia và nhớ nhất là lễ hội Holi ở Ấn Độ. Lễ hội này diễn ra vào cuối tháng Hai năm ngoái. Lễ hội được tổ chức để chào đón mùa xuân và chống lại cái ác. Tham gia vào lễ hội, em đã có cơ hội vui chơi, nhảy múa và ca hát. Em cùng người dân địa phương ném bột nhiều màu sắc vào nhau và nhảy múa dưới vòi phun nước. Em đã có một kỳ nghỉ tuyệt vời ở đó. Nếu có cơ hội, em vẫn chọn đến Ấn Độ và tận hưởng lễ hội Holi một lần nữa</p></td></tr></table></div></div>"}]}, {"title": "Objectives · Mục tiêu", "icon": "🎯", "desc": "Unit 9 · Festivals around the World", "subs": [{"label": "Mục tiêu", "html": "<div class=\"source\"><p><b>UNIT </b><b>9</b><b> </b></p><p><b>FESTIVALS AROUND THE WORLD</b></p><p>Các lễ hội trên thế giới</p><p><b>MỤC TIÊU – Objectives</b></p><p>* <b>TỪ VỰNG</b> – Vocabulary</p><p>sử dụng từ vựng liên quan đến chủ đề “Các lễ hội trên thế giới”</p><p>* <b>NGỮ ÂM</b> – Pronunciation</p><p>phát âm các từ có hai âm tiết với trọng âm chính xác khi đứng riêng lẻ và trong ngữ cảnh</p><p>* <b>NGỮ PHÁP</b> – Grammar</p><p>sử dụng cụm trạng ngữ một cách chính xác và phù hợp</p><p>đặt câu và trả lời đúng các câu hỏi có từ để hỏi</p><p><b>* KỸ NĂNG ĐỌC</b> – Reading skills</p><p>đọc tìm thông tin cụ thể về một lễ hội kỳ lạ</p><p>* <b>KỸ NĂNG NÓI</b> – Speaking skills</p><p>thảo luận về các lễ hội khác nhau</p><p>* <b>KỸ NĂNG NGHE</b> – Listening Skills</p><p>nghe lấy thông tin cụ thể về một lễ hội âm nhạc</p><p>* <b>KỸ NĂNG VIẾT</b> – Writing skills</p><p>viết đoạn văn kể về một lễ hội mà bạn đã tham gia</p><p><b>A – NGÔN NGỮ</b></p></div>"}]}];
const V12=[{"w": "cannon", "p": "/ˈkænən/", "pos": "n.", "vi": "súng thần công, đại bác", "ex": "There’s a cannon in front of the City Hall. (Có một khẩu súng thần công trước tòa thị chính)"}, {"w": "celebrate", "p": "/ˈselɪbreɪt/", "pos": "v.", "vi": "kỉ niệm, làm lễ kỉ niệm", "ex": "We should celebrate this memorable trip. (Chúng ta nên kỉ niệm chuyến đi đáng nhớ này)"}, {"w": "celebration", "p": "/ˌselɪˈbreɪʃn/", "pos": "n.", "vi": "sự/ lễ kỉ niệm, chúc mừng", "ex": "They planned a special celebration for her homecoming. (Họ đã lên kế hoạch cho một buổi liên hoan đặc biệt mừng cô ấy trở về)"}, {"w": "celebratory", "p": "/ˌseləˈbreɪtəri/", "pos": "adj.", "vi": "mang tính kỉ niệm", "ex": "“Pride Day” is a celebratory occasion for us. (“Pride Day” là một dịp mang tính kỉ niệm đối với chúng tôi)"}, {"w": "chaos", "p": "/ˈkeɪɒs/", "pos": "n.", "vi": "sự hỗn loạn, sự lộn xộn", "ex": "My room is in complete chaos at the moment (Phòng tôi bây giờ đang hoàn toàn lộn xộn)"}, {"w": "cultural", "p": "/ˈkʌltʃərəl/", "pos": "adj.", "vi": "mang tính văn hóa, thuộc về văn hóa", "ex": "You have to respect the cultural diversity in your school. (Bạn phải tôn trọng sự đa dạng văn hóa ở trường học)"}, {"w": "culture", "p": "/ˈkʌltʃə(r)/", "pos": "n.", "vi": "văn hóa, nền văn hóa", "ex": "She’s learnt Japanese language and culture since 2017. (Cô ấy đã học ngôn ngữ và văn hóa Nhật Bản từ năm 2017)"}, {"w": "Easter", "p": "/ˈiːstə(r)/", "pos": "n.", "vi": "lễ Phục sinh", "ex": "I get two weeks off school at Easter. (Tôi được nghỉ học hai tuần vào lễ Phục sinh)"}, {"w": "festival", "p": "/ˈfestɪvl/", "pos": "n.", "vi": "lễ hội", "ex": "There’s many impressive festivals in this country. (Có nhiều lễ hội ấn tượng ở đất nước này)"}, {"w": "festive", "p": "/ˈfestɪv/", "pos": "adj.", "vi": "mang tính lễ hội, thuộc về lễ hội", "ex": "The festive atmosphere makes everyone cheerful. (Không khí lễ hội khiến ai cũng vui tươi)"}, {"w": "goggles", "p": "/ˈɡɒɡlz/", "pos": "n.", "vi": "kính bảo hộ", "ex": "Don’t forget to wear goggles to protect your eyes. (Đừng quên đeo kính bảo hộ để bảo vệ mắt)"}, {"w": "greasy", "p": "/ˈɡriːsi/", "pos": "adj.", "vi": "trơn, nhờn", "ex": "Her hair has become greasy after using that bottle of shampoo. (Tóc cô ấy đã trở nên mượt mà sau khi sử dụng chai dầu gội kia)"}, {"w": "harvest", "p": "/ˈhɑːvɪst/", "pos": "n.", "vi": "mùa màng", "ex": "We had a good harvest this year. (Năm nay chúng tôi đã có một vụ mùa bội thu)"}, {"w": "highlight", "p": "/ˈhaɪlaɪt/", "pos": "n.", "vi": "điểm nhấn", "ex": "The highlight of her presentation is some beautiful illustrations. (Điểm nhấn của bài thuyết trình của cô ấy là một số hình minh họa đẹp)"}, {"w": "host", "p": "/həʊst/", "pos": "v.", "vi": "đăng cai tổ chức", "ex": "Russia was selected to host the 2018 FIFA World Cup. (Nước Nga đã được chọn để đăng cai tổ chức Giải vô địch bóng đá thế giới vào năm 2018)"}, {"w": "jet", "p": "/dʒet/", "pos": "n.", "vi": "tia, vòi", "ex": "The whale blew a jet of water into the air. (Cá voi phun một tia nước vào không trung)"}, {"w": "perform", "p": "/pəˈfɔːm/", "pos": "v.", "vi": "biểu diễn, trình diễn", "ex": "She performed well in the show. (Cô ấy đã trình diễn tốt trong buổi diễn đó)"}, {"w": "performance", "p": "/pəˈfɔːməns/", "pos": "n.", "vi": "sự trình diễn, buổi biểu diễn", "ex": "It was an impressive performance by a famous band. (Đó là một buổi biểu diễn ấn tượng do một ban nhạc nổi tiếng trình diễn)"}, {"w": "performer", "p": "/pəˈfɔːmə(r)/", "pos": "n.", "vi": "người biểu diễn", "ex": "They are not great singers but excellent performers (Họ không phải là những ca sĩ giỏi nhưng là những người biểu diễn xuất sắc)"}, {"w": "project", "p": "/ˈprɒdʒekt/", "pos": "n.", "vi": "dự án", "ex": "We’re working really hard on a new project. (Chúng tôi đang làm việc rất chăm chỉ cho một dự án mới)"}, {"w": "religious", "p": "/rɪˈlɪdʒəs/", "pos": "adj.", "vi": "mang tính tôn giáo, thuộc về tôn giáo", "ex": "They shouldn’t impose their religious beliefs on their children. (Họ không nên áp đặt niềm tin tôn giáo của mình lên con gái của họ)"}, {"w": "seasonal", "p": "/ˈsiːzənl/", "pos": "adj.", "vi": "thuộc về mùa", "ex": "This restaurant serves seasonal vegetables. (Nhà hàng này phục vụ rau củ theo mùa)"}, {"w": "serious", "p": "/ˈsɪəriəs/", "pos": "adj.", "vi": "nghiêm túc", "ex": "This is a serious meeting so you must dress formally. (Đây là cuộc họp nghiêm túc nên bạn phải ăn mặc một cách trang trọng)"}, {"w": "steep", "p": "/stiːp/", "pos": "adj.", "vi": "dốc", "ex": "They climbed up a steep mountain yesterday. (Họ đã leo lên một ngọn núi dốc vào hôm qua)"}, {"w": "superstitious", "p": "/ˌsuːpəˈstɪʃəs/", "pos": "adj.", "vi": "mang tính mê tín", "ex": "Some people are superstitious about black cats. (Một số người rất mê tín về mèo đen)"}, {"w": "take place", "p": "/teɪk pleɪs/", "pos": "v.", "vi": "diễn ra, xảy ra", "ex": "The concert takes place next Thursday. (Buổi hòa nhạc diễn ra vào thứ Năm tới)"}, {"w": "thanksgiving", "p": "/ˌθæŋksˈɡɪvɪŋ/", "pos": "n.", "vi": "lễ Tạ ơn", "ex": "My family members always gather to celebrate Thanksgiving together. (Các thành viên gia đình tôi luôn sum họp để kỉ niệm lễ Tạ ơn cùng nhau.)"}];
const LISTEN="Songkran is Thailand’s most famous festival. An important event in the Buddhist calendar, this water festival marks the beginning of the traditional Thai New Year. The name Songkran comes from a Sanskrit word meaning ‘passing’ or ‘approaching’. Songkran Festival takes place in April every year, from the 13th to the 15th. Water is an important element of Songkran, especially in more recent times when the throwing of water has become a huge part of the annual celebrations. If you’re visiting Thailand during this festival, prepare to get splashed! Crowds of people roam around throwing buckets of water, using water pistols and just generally soaking anyone in the vicinity. Buddhists also visit temples throughout Songkran where water is poured on Buddha images and on the hands of Buddhist monks as a mark of respect. ";
