______.</p><p>7. That is their beautiful house. → That beautiful house is_________.</p><p>8. These are Tom’s toys. → These toys are.</p><p>9. It’s her hat and glasses. → The hat and glasses are_________.</p><p>10. Those are our classrooms. → Those classrooms are_________.</p><p><b>IV - Give the correct form of the verb in the brackets with “will” to complete the following sentences.</b></p><p><i>E.g.: I (become) __will become__a teacher in the future.</i></p><p>1. _________they (win) _________their match today?</p><p>2. Do you think she (come) _________soon?</p><p>3. Who do you think (get) _________the job?</p><p>4. I think it (not snow) _________during this Christmas.</p><p>5. I think she (pass) _________the exam this June.</p><p>6. _________scientists (find) _________out the cure for HIV/AIDS?</p><p>7. A gentleman (hold) _________the door for ladies.</p><p>8. _________he (give) _________me a lift if I ask him?</p><p>9. I know her parents (not let) _________ her go to the party.</p><p>10. Man (not go) _________to Jupiter before the 22nd century.</p><p>11.  Mark (arrive) _________on time. He is always very punctual.</p><p>12. Lunch time today (be) _________10 minutes longer than usual.</p><p><b>V- Choose the underlined part which needs correction.</b></p><p><i>E.g.: </i><u><i>Where</i></u><i> will you </i><u><i>to live</i></u><i> if you have </i><u><i>a lot of </i></u><i>money, and </i><u><i>don’t </i></u><i>have to work?</i></p><p><i><b>A</b></i><i>. Where</i><i><b>B</b></i><i>. to live</i><i><b>C</b></i><i>. a lot of</i><i><b>D</b></i><i>. don’t</i></p><p>1. You <u>will pass</u> your exams <u>if</u> you don’t start <u>working</u> <u>harder.</u></p><p><b>A</b>. will pass<b>B</b>. if<b>C</b>. working<b>D</b>. harder</p><p>2. <u>Salty</u> water will <u>to freeze</u> at a <u>lower</u> temperature than <u>pure water</u>.</p><p><b>A</b>. Salty<b>B</b>. to freeze<b>C</b>. lower<b>D</b>. pure water</p><p>3. In <u>the year</u> 2050, <u>all</u> students <u>will having </u>their own computers <u>at </u>school.</p><p><b>A</b>. the year<b>B</b>. all<b>C</b>. will having<b>D</b>. at</p><p>4. He <u>will have </u>any trouble <u>at</u> his job interview <u>today</u>. He <u>feels</u> very confident!</p><p><b>A</b>. will have<b>B</b>. at<b>C</b>. today<b>D</b>. feels</p><p>5. I <u>think</u> they <u>will have </u>a romantic <u>relationship</u>. Maybe they <u>get </u>married someday!</p><p><b>A</b>. think<b>B</b>. will have<b>C</b>. relationship<b>D</b>. get</p></div>"}]}, {"title": "Reading · Đọc hiểu", "icon": "📖", "desc": "Unit 11 · Travelling in the future", "subs": [{"label": "Smart roads", "html": "<div class=\"source\"><div class=\"tablewrap\"><table><tr><td><p><b>DO YOU KNOW?</b></p><p><b>SMART ROADS</b></p><p>Over a million people are killed in road traffic accidents every year, with tens of millions injured. The development of smart roads connected to the Internet of things can greatly help to reduce road deaths. Because road sensors can communicate with smart cars about the best ways to avoid dangers or bad road conditions. In the future, wireless battery chargers will be found underneath roads. This helps to reduce the level of air pollution and the need for fossil fuels to power cars.</p></td></tr></table></div></div>"}, {"label": "I · Future transport", "id": "r1", "kind": "fill", "items": [{"q": "Most of new technologies over the years are to reduce our___and ensure an improved life.", "a": ["daily stress"], "exp": "<p><b>Dịch nghĩa câu</b> <b>hỏi</b>: Hầu hết công nghệ mới trong những năm qua là để giảm căng thẳng_________cho</p><p>chúng ta và đảm bảo cuộc sống được cải thiện.</p><p><b>Giải thích</b>: Thông tin có ở câu: “[...] most of this development is as a result of inventing and creating new ways to reduce our daily stress and live an Improved life.”</p>"}, {"q": "New technological advancement takes place in the___as well.", "a": ["transportation industry"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Tiến bộ công nghệ mới cũng diễn ra trong_________.</p><p><b>Giải thích:</b> Thông tin có ở câu: “The transportation industry is one of the important areas where new technological advancement takes place.”</p>"}, {"q": "A new “hyperloop” train can run at the speed of___per hour.", "a": ["800 miles"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Một tàu cao tốc “hyperloop” mới có thể chạy với tốc độ__________một giờ.</p><p><b>Giải thích</b>: Thông tin có ở câu: “An amazing new “hyperloop” train that will speed 800 miles per hour.”</p>"}, {"q": "Some of these innovations have already support our___.", "a": ["transporting"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Một số trong những thay đổi này đã phục vụ_________của chúng.</p><p><b>Giải thích</b>: Thông tin có ở câu: “All these innovations are not just a form of illusion, they are set to happen within the next coming years or have already started transporting us.”</p>"}, {"q": "The level of vehicle transport companies and car shipping carriers has been___.", "a": ["increased"], "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Trình độ của các công ty vận tải bằng xe và hãng giao hàng bằng ô tô đã được_________.</p><p><b>Giải thích:</b> Thông tin có ở câu: “This has increased the level of some industries like vehicle transport companies and car shipping carriers.”</p>"}], "before": "<div class=\"source\"><p><b>I- Read the passage and complete the following sentences with ONE or TWO words. </b></p><p>The re-occurrence of new technology over the years has helped us change the way we live and do daily activities. Most of this development is as a result of inventing and creating new ways to reduce our daily stress and live an improved life. The transportation industry is one of the important areas where new technological advancement takes place. We now see cars that drive themselves along predetermined routes. Trains that will use new magnetic rail systems. An amazing new “hyperloop” train that will speed 800 miles per hour. All these innovations are not just a form of illusion, they are set to happen within the next coming years or have already started transporting us. This has increased the level of some industries like vehicle transport companies and car shipping carriers. It has also made truck production company, and fleet management more efficient.</p></div><details class=\"tr\"><summary>Bản dịch</summary><div class=\"source\"><p>Sự xuất hiện trở lại của công nghệ mới trong những năm qua đã giúp thay đổi lối sống và hoạt động hàng ngày của chúng ta. Sự thay đổi này chủ yếu xuất phát từ việc phát minh và tạo ra những phương pháp mới để giảm căng thẳng hàng ngày và sống một cuộc sống tốt đẹp hơn. Ngành giao thông vận tải là một trong những lĩnh vực quan trọng đã chứng kiến nhiều tiền bộ công nghệ mới. Giờ đây chúng ta có thể thấy những chiếc xe tự lái dọc theo các tuyến đường đã được định trước. Xe lửa sẽ sử dụng hệ thống đường sắt từ tính mới. Tàu cao tốc “hyperloop” tuyệt vời và mới mẻ sẽ chạy với tốc độ 800 dặm một giờ. Tất cả những phương tiện mới này không phải là ảo tưởng, chúng được dự kiến hoạt động trong những năm tới hoặc là đã bắt đầu hoạt động. Điều này giúp nâng cao trình độ của một số ngành công nghiệp như các công ty vận tải và hãng giao hàng bằng ô tô. Nó cũng làm cho các công ty sản xuất xe tải và việc quản lý đội tàu trở nên hiệu quả hơn.</p></div></details>"}, {"label": "II · Flying cars", "id": "r2", "kind": "quiz", "items": [{"q": "The Transition has room for four passengers.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Chiếc xe ô tô bay Transition có chỗ cho bốn hành khách.</p><p><b>Giải thích</b>: Thông tin ở sau: “The vehicle has <u>two seats</u>, four wheels and wings that fold up, so it can be driven like a car.”</p>"}, {"q": "Terrafugia has worked on the Transition since 2006.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Hãng Terrafugia đã sản xuất chiếc xe Transition từ năm 2006.</p><p><b>Giải thích</b>: Thông tin ở sau: “Terrafugia first began to work on the Transition in 2006</p>"}, {"q": "The flying car uses special tires and glass.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Chiếc xe ô tô bay sử dụng lốp và kính đặc biệt.</p><p><b>Giải thích</b>: Thông tin ở sau: “The company uses special tires and glass that are lighter than normal automotive ones, which makes it easier for the vehicle to fly.”</p>"}, {"q": "All drivers of the Transition will only have to pass a test to get a license.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Tất cả những người lái chiếc xe Transition sẽ chỉ phải vượt qua bài kiểm tra để lấy giấy phép. </p><p><b>Giải thích</b>: Thông tin ở sau: “An owner needs to <u>pass a test</u> and <u>complete 20 hours of flying time</u> to be able to fly the Transition.”</p>"}, {"q": "The Transition will go faster in the air than on the road.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Chiếc xe Transition sẽ bay trên không nhanh hơn so với đi trên đường bộ.</p><p><b>Giải thích</b>: Thông tin ở sau: “The Transition can reach around 70 miles per hour (mph) on the road and 115 mph in the air.”</p>"}], "before": "<div class=\"source\"><p><b>II - Read the passage and decide whether the statements are TRUE (T) or FALSE (F).</b></p><p>Flying cars aren’t just science fiction anymore. Terrafugia, based in the United States, is developing a readable aircraft called the Transition. The vehicle has two seats, four wheels and wings that fold up, so it can be driven like a car. Terrafugia first began to work on the Transition in 2006 and has come closer than anyone to making the flying car a reality. The company uses special tires and glass that are lighter than normal automotive ones, which makes it easier for the vehicle to fly. An owner needs to pass a test and complete 20 hours of flying time to be able to fly the Transition. The Transition can reach around 70 miles per hour (mph) on the road and 115 mph in the air. On the ground, it gets 35 miles per gallon.</p></div><details class=\"tr\"><summary>Bản dịch</summary><div class=\"source\"><p>Ô tô bay không còn là khoa học viễn tưởng nữa. Terrafugia, có trụ sở tại Hoa Kỳ, đang phát triển một chiếc máy bay có thể chạy trên đường bộ lẫn cất cánh trên không gọi là Transition. Chiếc xe có hai chỗ ngồi, bốn bánh xe và đôi cánh gấp lại để có thể lái như một chiếc xe hơi. Hãng Terrafugia bắt đầu sản xuất chiếc xe Transition vào năm 2006 và đã đến gần hơn bất kỳ hãng nào trong việc biến chiếc xe ô tô bay thành hiện thực. Công ty sử dụng lốp và kính đặc biệt nhẹ hơn so với ô tô bình thường, giúp xe dễ bay hơn. Chủ sở hữu cần phải vượt qua một bài kiểm tra và hoàn thành 20 giờ bay để có thể lái chiếc xe Transition. Chiếc xe ô tô bay Transition có thể đạt khoảng 70 dặm một giờ (mph) trên đường bộ và 115 dặm một giờ trong không khí. Trên mặt đất, nó chạy được 35 dặm cho mỗi gallon.</p></div></details>"}]}, {"title": "Listening · Nghe", "icon": "🔊", "desc": "Unit 11 · Travelling in the future", "subs": [{"label": "Space holiday", "id": "l1", "kind": "quiz", "items": [{"q": "Dennis Tito was the first “space tourist” by paying 20 million us dollars.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi:</b> Dennis Tito là “khách du lịch vũ trụ” đầu tiên trên thế giới bằng cách trả 20 triệu đô la Mỹ. </p><p><b>Giải thích</b>: Thông tin có ở câu: “Italian-American engineering tycoon Dennis Tito became the first “space tourist” by paying a reported US$20 million [...]”</p>"}, {"q": "Virgin Galactic is one of many companies which offer travellers the chance to be space tourists.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Virgin Galactic là một trong nhiều công ty mang đến cơ hội trở thành khách du lịch vũ trụ. </p><p><b>Giải thích</b>: Thông tin có ở câu: “Now, companies like Virgin Galactic, XCOR Aerospace and Space Adventures offer the chance for other wannabe space tourists too.”</p>"}, {"q": "Travelers can fly along a sub-orbital route this year.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Du khách có thể bay dọc theo một tuyến đường quỹ đạo phụ trong năm nay.</p><p><b>Giải thích:</b> Thông tin có ở câu: “They are already accepting reservations to fly travelers along a sub-orbital route as early as next year.”</p>"}, {"q": "5,000 people worldwide have signed up for space visits.", "opts": ["True", "False"], "a": 1, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: 5.000 người trên toàn thế giới đã đăng ký tham quan không gian.</p><p><b>Giải thích</b>: Thông tin có ở câu: “So far, 500 people worldwide have signed up for space Visits, according to Hong Kong’s accredited space travel agent, Miramar Travel.”</p>"}, {"q": "Space will become a future holiday destination for only a few.", "opts": ["True", "False"], "a": 0, "exp": "<p><b>Dịch nghĩa câu hỏi</b>: Du lịch vũ trụ sẽ trở thành một điểm đến của những kỳ nghỉ trong tương lai nhưng chỉ cho một số ít.</p><p><b>Giải thích</b>: Thông tin có ở câu: “It’s believed that space tourism will become a future holiday destination, but “only for a few.””</p>"}], "before": "<div class=\"note\">Giọng đọc tổng hợp từ lời thoại trong tài liệu.</div><button class=\"btn solid\" onclick=\"say(LISTEN)\">▶ Nghe bài</button> <button class=\"btn\" onclick=\"speechSynthesis.cancel()\">■ Dừng</button>"}, {"label": "Lời thoại & bản dịch", "html": "<div class=\"source\"><p>Audio script:</p><div class=\"tablewrap\"><table><tr><td><p>For the wealthy, a trip to space is already possible. Italian-American engineering tycoon Dennis Tito became the first “space tourist” by reportedly paying US$20 million to tag along with a Russian mission to the International Space station in 2001.</p><p>Now, companies like Virgin Galactic, XCOR Aerospace and Space Adventures offer the chance for other wanna be space tourists too. They are already accepting reservations to fly travelers along a sub-orbital route as early as next year.</p><p>So far, 500 people worldwide have signed up for space visits, according to Hong Kong’s accredited space travel agent, Miramar Travel. It costs US$200,000 for a seat on Vigin Galactic’s spaceship. It’s believed that space tourism will become a future holiday destination, but “only for a few.”</p></td><td><p>Đối với những người giàu có, một chuyến đi vào vũ trụ giờ có thể thực hiện được, ông trùm kỹ thuật người Mỹ gốc Ý, Dennis Tito, trở thành “du khách không gian” đầu tiên được cho là đã trả 20 triệu đô la Mỹ để đi cùng với một nhiệm vụ của Nga đến Trạm vũ trụ quốc tế vào năm 2001.</p><p>Giờ đây, các công ty như Virgin Galactic, XCOR Aerospace và Space Adventures cũng mang đến cơ hội cho những khách du lịch không gian khác. Họ đã nhận đặt chỗ đưa khách du lịch bay dọc theo quỹ đạo phụ sớm nhất là vào năm tới.</p><p>Theo công ty lữ hành vũ trụ được công nhận của Hồng Kông, Miramar Travel, hiện nay, 500 người trên toàn thế giới đã đăng ký tham quan không gian. Nó có giá 200.000 đô la Mỹ cho một chỗ ngòi trên tàu vũ trụ của Vigin Galactic. Người ta tin rằng du lịch vũ trụ sẽ trở thành một điểm đến trong tương lai, nhưng chỉ dành cho một số ít.</p></td></tr></table></div></div>"}]}, {"title": "Speaking · Nói", "icon": "💬", "desc": "Unit 11 · Travelling in the future", "subs": [{"label": "Đề bài & gợi ý", "html": "<div class=\"source\"><p><b>Talk about the benefits of self-driving cars.</b></p><p>You can use the following questions as cues:</p><p>•What are the benefits of self-driving cars?</p><p>•Which benefits are you most interested in? Why?</p><p><b>Useful languages:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Useful vocabulary</b></p></td><td><p><b>Useful structures</b></p></td></tr><tr><td><p>• fewer accidents</p><p>• reducing traffic congestion and pollution</p><p>• saving space</p><p>• saving fuel</p><p>• better life</p><p>•saving time</p><p>•saving money</p><p>•convenient</p></td><td><p>• Self-driving cars have many benefits. First,... Second, …..</p><p>• Self-driving cars can help ...</p><p>• ... is the benefit that I&#x27;m most interested in because</p><p>• These benefits can improve our life like ...</p></td></tr></table></div><p><b>Complete the notes:</b></p><div class=\"tablewrap\"><table><tr><td><p><b>Structures of the talk</b></p></td><td><p><b>Your notes</b></p></td></tr><tr><td><p>What are the benefits of self-driving cars?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>Which benefits are you most interested in? Why?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr><tr><td><p>How can these benefits improve human’s life?</p></td><td><p>__________________________________________</p><p>__________________________________________</p><p>__________________________________________</p></td></tr></table></div><p><b>Now you try!</b></p><p><b>Give your answer using the following cues. You should speak for 1-2 minutes.</b></p><p>1. Self-driving cars can help ...</p><p>2. ... is the benefit that I&#x27;m most interested in because ...</p><p>3. These benefits can improve our life like ...</p><p><b>Now you tick!</b></p><p><b>Did you ...</b></p><p> answer all the questions in the task?</p><p> give some details to each main point?</p><p> speak slowly and fluently with only some hesitation?</p><p> use vocabulary wide enough to talk about the topic?</p><p> use various sentence structures (simple, compound, complex) accurately?</p><p> pronounce correctly (vowels, consonants, stress, intonation)?</p><p><b> </b><b>Let’s compare!</b></p><p>Finally, compare with the sample answer on page 199.</p></div>"}, {"label": "Ghi chú của bạn", "kind": "notes"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>Talk about the benefits of self-driving cars.</b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Hãy nói về lợi ích của xe tự lái.</p><p>Em có thể sử dụng các câu hỏi sau đây như gợi ý:</p><p>• Những lợi ích của xe tự lái là gì?</p><p>• Em quan tâm nhất đến lợi ích nào?</p><p>• Những lợi ích này cải thiện cuộc sống của con người như thế nào?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Benefits (Lợi ích)</b></p><p>- fewer accidents (<i>n. phr</i>.) (ít tai nạn hơn)</p><p>- saving space (<i>n. phr</i>.) (tiết kiệm không gian)</p><p>- fewer traffic jams (<i>n. phr</i>.) (ít tắc đường hơn)</p><p>- saving fuels (<i>n. phr</i>.) (tiết kiệm nhiên liệu)</p><p><b>Improvement (Cải thiện)</b></p><p>- better life (<i>n. phr</i>.) (cuộc sống tốt hơn)</p><p>- more efficient (<i>adj. phr.)</i> (hiệu quả hơn)</p><p>- saving time (<i>n. phr</i>.) (tiết kiệm thời gian)</p><p>- saving money (<i>n. phr</i>.) (tiết kiệm tiền)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>With the advancement of science and technology, humans have invented many modem means of transport, and one of them is self-driving cars. Self¬driving cars will help reduce traffic accidents thanks to the intelligence and precision of techonology. Humans will have to pay less to solve problems caused by traffic accidents. Artificial intelligence can identify the status of roads and streets, so it will choose the suitable route to avoid traffic jams. Therefore, travellers can save time and minimize tiredness on the way. I hope modern self-driving cars will be popular in the near future.</p></td><td><p>Với sự tiến bộ của khoa học và công nghệ, con người đã phát minh ra những phương tiện giao thông hiện đại và một trong số đó là ô tô tự lái. Ô tô tự lái sẽ giúp giảm số vụ tai nạn giao thông nhờ sự thông minh và tính chính xác của công nghệ. Con người sẽ phải chi ít tiền hơn để khắc phục hậu quả của những vụ tai nạn giao thông. Trí thông minh nhân tạo có thể xác định trình trạng đường xá, từ đó tìm ra lộ trình phù hợp để tránh kẹt xe. Do đó, giúp người ngồi trên xe tiết kiệm thời gian và giảm sự mệt mỏi khi đi trên đường. Em rất hi vọng những chiếc xe tự lái hiện đại sẽ phổ biến trong tương lai gần</p></td></tr></table></div></div>"}]}, {"title": "Writing · Viết", "icon": "✍️", "desc": "Unit 11 · Travelling in the future", "subs": [{"label": "I · Viết câu", "id": "w1", "kind": "write", "items": [{"c": "Modern/ means of transport/ be/ very strange/ me.", "a": "Modern means of transport are very strange to me.", "vi": "  Dịch nghĩa : Tôi chưa quen với các phương tiện giao thông hiện đại. "}, {"c": "I/ be/ most interested/ hyperloop/ skytrain.", "a": "I am most interested in hyperloops and skytrains.", "vi": "  Dịch nghĩa : Tôi quan tâm nhất đến tàu cao tốc và tàu trên cao. "}, {"c": "It/ be/ wonderful/ travel/ such/ modern/ means of transport.", "a": "It is wonderful to travel in such modern means of transport.", "vi": "  Dịch nghĩa : Thật tuyệt vời khi di chuyển trên các phương tiện giao thông hiện đại như vậy. "}, {"c": "These/ modern/ means of transport/ help/ save/ much time/ travelling.", "a": "These modern means of transport help save much time of travelling.", "vi": "  Dịch nghĩa : Những phương tiện giao thông hiện đại này giúp tiết kiệm nhiều thời gian đi lại. "}, {"c": "It/ be/ fantastic/ if/ these/ means of transport/ be/ available/ future.", "a": "It will be fantastic if these means of transport are available in the future.", "vi": "  Dịch nghĩa : Sẽ thật tuyệt vời nếu những phương tiện giao thông này có sẵn trong tương lai. "}]}, {"label": "II · Đoạn văn 60–80 từ", "kind": "writing", "html": "<div class=\"source\"><p><b>II- Write a short paragraph (about 60-80 words) about means of transport of the future you are most interested in.</b></p><p>You can answer some of the following questions:</p><p>• What is that means of transport?</p><p>• Why are you most interested in it?</p><p>• What are the benefits of that means of transport?</p></div>"}, {"label": "Gợi ý & bài mẫu", "html": "<div class=\"source\"><p><b>II - Write a shod paragraph (60-80 words) about means of transport of the future you are most interested in. </b></p><p><b>Dịch nghĩa câu hỏi:</b></p><p>Viết một đoạn văn ngắn (60-80 từ) về phương tiện giao thông trong tương lai mà bạn quan tâm nhất. </p><p>Bạn có thể trả lời một số câu hỏi sau:</p><p>• Phương tiện giao thông đó là gì?</p><p>• Tại sao em quan tâm nhất đến nó?</p><p>• Những lợi ích của phương tiện giao thông đó là gì?</p><p><b>Gợi ý trả lời:</b></p><p><b>MAIN IDEAS (Ý chính)</b></p><p><b>Means (Phương tiện)</b></p><p>- flying cars (<i>n</i>.) (ô tô bay)</p><p>- hoverbikes (<i>n</i>.) (xe mô tô bay)</p><p>- windowless plane (<i>n</i>.) (máy bay không cửa sổ)</p><p>- hyperloop (<i>n</i>.) (tàu cao tốc)</p><p><b>Reasons (Lý do)</b></p><p>- convenient (<i>adj</i>.) (tiện lợi)</p><p>- beautiful (<i>adj</i>.) (đẹp)</p><p>- wonderful (<i>adj.)</i> (tuyệt vời)</p><p>- breakthrough <i>(adj</i>.) (đột phá)</p><p><b>Benefits (Lợi ích)</b></p><p>- time-saving <i>(adj</i>.) (tiết kiệm thời gian)</p><p>- better entertainment (<i>n. phr</i>.) (giải trí tốt hơn)</p><p>- no traffic jam (<i>n. phr</i>.) (không tắc đường)</p><p>- money-saving (<i>adj.</i>) (tiết kiệm tiền)</p><p>Bài mẫu:</p><div class=\"tablewrap\"><table><tr><td><p>Modern means of transport for the future are very impressive to me, and I am most interested in flying cars. It is so fantastic to drive such a wonderful vehicle because it can move like a normal one, but fly in the air when there are traffic jams or bad roads. It is also extremely convenient to drive the flying car to anywhere though there are no roads to that place. Flying cars help save time of travelling, and the traffic jam is no longer a big problem. It will be wonderful if flying cars are widely used in the coming decades.</p></td><td><p>Em rất ấn tượng với những phương tiện giao thông hiện đại của tương lai và phương tiện mà em thích nhất là ô tô bay. Sẽ thật tuyệt vời khi được điều khiển một phương tiện có thể di chuyển như ô tô thường nhưng cũng có thể bay lên khi kẹt xe hoặc đường xá có vấn đề. Thật tiện lợi khi có thể điều khiển ô tô bay đến bất cứ địa điểm nào kể cả khi chưa có đường đến đó. Ô tô bay giúp tiết kiệm thời gian di chuyển trên đường và kẹt xe sẽ không còn là vấn đề lớn nữa. Sẽ thật tuyệt nếu ô tô bay được sử dụng rộng rãi trong những thập kỷ tới.</p></td></tr></table></div><p>Giaoandethitienganh.info sưu tầm</p></div>"}]}, {"title": "Objectives · Mục tiêu", "icon": "🎯", "desc": "Unit 11 · Travelling in the future", "subs": [{"label": "Mục tiêu theo tài liệu", "html": "<div class=\"source\"><p><b>UNIT </b><b>11</b><b> </b></p><p><b>TRAVELLING IN THE FUTURE</b></p><p>Đi lại trong tương lai</p><p><b>MỤC TIÊU – Objectives</b></p><p>* <b>TỪ VỰNG</b> – Vocabulary</p><p>sử dụng từ vựng liên quan đến các phương tiện giao thông trong tương lai</p><p>* <b>NGỮ ÂM</b> – Pronunciation</p><p>xác định giọng điệu lên hoặc xuống đối với câu hỏi</p><p>* <b>NGỮ PHÁP</b> – Grammar</p><p>biết cách sử dụng “<b>will</b>” để dự đoán về tương lai</p><p>tự tin sử dụng đại từ sở hữu</p><p><b>* KỸ NĂNG ĐỌC</b> – Reading skills</p><p>đọc tìm thông tin cụ thể về các phát minh về phương tiện giao thông trong tương lai </p><p>* <b>KỸ NĂNG NÓI</b> – Speaking skills</p><p>thuyết trình về một loại phương tiện</p><p>* <b>KỸ NĂNG NGHE</b> – Listening Skills</p><p>nghe lấy thông tin cụ thể về các phương tiện giao thông trong tương lai</p><p>* <b>KỸ NĂNG VIẾT</b> – Writing skills</p><p>viết một đoạn văn nói về các phương tiện giao thông trong tương lai</p></div>"}]}];
const V12=[{"w": "automated", "p": "/ˈɔːtəmeɪtɪd/", "pos": "adj.", "vi": "tự động", "ex": "Automated driving systems can reduce fuel use and carbon emissions. (Hệ thống lái xe tự động có thể giảm việc sử dụng nhiên liệu và lượng khí thải các-bon)"}, {"w": "crash", "p": "/kræʃ/", "pos": "v.", "vi": "va chạm", "ex": "A truck crashed into the back of a bus. (Một chiếc xe tải đã đâm vào phía sau xe buýt)"}, {"w": "driverless", "p": "/ˈdraɪvələs/", "pos": "adj.", "vi": "không người lái (tự động)", "ex": "Driverless cars may help ease traffic congestion and lower pollution. (Ô tô không người lái có thể giúp giảm bớt tắc nghẽn giao thông và ô nhiễm môi trường)"}, {"w": "environmentally- friendly", "p": "/ɪnˌvaɪrənmentəli ˈfrendli/", "pos": "adj.", "vi": "thân thiện với môi trường", "ex": "Environmentally- friendly cars use less toxic fuels. (Ô tô thân thiện với môi trường sử dụng ít nhiên liệu độc hại hơn)"}, {"w": "eco-friendly", "p": "/ˌiːkəʊ ˈfrendli/", "pos": "adj.", "vi": "thân thiện với hệ sinh thái/ thân thiện với môi trường", "ex": "Eco-friendly transport helps reduce harmful effects on the environment. (Các phương tiện giao thông thân thiện với môi trường giúp giảm tác hại đối với môi trường)"}, {"w": "float", "p": "/fləʊt/", "pos": "v.", "vi": "nổi", "ex": "This car can float on water. (Chiếc xe này có thể nổi trên mặt nước)"}, {"w": "flop", "p": "/flɒp/", "pos": "v.", "vi": "thất bại", "ex": "Although his transport invention was unique, it flopped. (Mặc dù phát minh phương tiện của ông ấy độc đáo nhưng nó vẫn thất bại)"}, {"w": "flying car", "p": "/ˌflaɪɪŋ kɑː(r)/", "pos": "n.", "vi": "một loại xe kết hợp giữa ô tô và máy bay/ xe ô tô bay", "ex": "Will flying cars ease traffic congestion? (Ô tô bay sẽ làm giảm bớt tắc nghẽn giao thông phải không?)"}, {"w": "gridlocked", "p": "/ˈɡrɪdlɒkt/", "pos": "adj.", "vi": "(giao thông) tắc nghẽn", "ex": "Traffic in Ha Noi was gridlocked this morning. (Giao thông ở Hà Nội đã bị tắc nghẽn vào sáng nay)"}, {"w": "high –speed", "p": "/ˌhaɪ ˈspiːd/", "pos": "adj.", "vi": "tốc độ cao, siêu tốc", "ex": "There are many different types of high-speed trains in the world. (Có nhiều loại tàu cao tốc khác nhau trên thế giới)"}, {"w": "hover scooter", "p": "/ˈhɒvə(r) ˈskuːtə(r) /", "pos": "n.", "vi": "xe trượt thăng bằng", "ex": "My son really likes his new hover scooter (Con trai tôi thực sự thích chiếc xe trượt thăng bằng mới của mình)"}, {"w": "jet pack", "p": "/ˈdʒetpæk/", "pos": "n.", "vi": "thiết bị bay cá nhân (đeo trên vai) dùng động cơ phản lực", "ex": "I love using a jet pack to fly in the sky (Tôi thích sử dụng thiết bị dùng động cơ phản lực để bay trên bầu trời)"}, {"w": "metro", "p": "/ˈmetrəʊ/", "pos": "n.", "vi": "tàu ngầm (trong thành phố)", "ex": "There is a modern metro system in my city. (Có một hệ thống tàu điện ngầm hiện đại trong thành phố của tôi)"}, {"w": "monowheel", "p": "/ˈmɒnəʊ wiːl/", "pos": "n.", "vi": "một loại xe đạp có một bánh", "ex": "This is the first time I have ridden a monowheel (Đây là lần đầu tiên tôi lái chiếc xe đạp có một bánh)"}, {"w": "pedal", "p": "/ˈpedl/", "pos": "v., n", "vi": "bàn đạp", "ex": "I couldn’t reach the pedals on her bike (Tôi không thể với tới bàn đạp của chiếc xe đạp của cô ấy)"}, {"w": "segway", "p": "/ˈseɡweɪ/", "pos": "n.", "vi": "phương tiện di chuyển bằng cách đẩy chân để chạy bánh xe trên mặt đất", "ex": "The Segway is very easy to control by moving the handlebars forward or backward. (Xe Segway rất dễ điều khiển bằng cách di chuyển tay lái về phía trước hoặc phía sau)"}, {"w": "skycycling tube", "p": "/skaɪ ˈsaɪklɪŋ tjuːb/", "pos": "n.", "vi": "khoang của loại tàu skycycling", "ex": "I think skycycling tubes will be environmentally-friendly. (Tôi nghĩ khoang của loại tàu skycycling sẽ thân thiện; với môi trường)"}, {"w": "skytrain", "p": "/skaɪtreɪn/", "pos": "n.", "vi": "tàu trên không (trong thành phố)", "ex": "Most big cities have a metro system or skytrain (Hầu hết các thành phố lớn đều có hệ thống tàu điện ngầm hoặc tàu trên không)"}, {"w": "solar – powered", "p": "/ˌsəʊlə ˈpaʊə(r)d/", "pos": "adj.", "vi": "dùng năng lượng mặt trời", "ex": "We believe that trains will be solar-powered in the near future. (Chúng tôi tin rằng tàu hỏa sẽ dùng năng lượng mặt trời trong tương lai gần)"}, {"w": "supersonic", "p": "/ˌsuːpəˈsɒnɪk/", "pos": "adj.", "vi": "tốc độ siêu thanh", "ex": "These planes travel at supersonic speeds. (Những chiếc máy bay này di chuyển với tốc độ siêu thanh)"}, {"w": "teleporter", "p": "/ˈtelɪpɔːtər/", "pos": "n.", "vi": "hình thức dịch chuyển tức thời", "ex": "Teleporters may be the best method of transportation in the future. (Hình thức dịch chuyển tức thời có thể là phương thức đi lại tốt nhất trong tương lai)"}];
