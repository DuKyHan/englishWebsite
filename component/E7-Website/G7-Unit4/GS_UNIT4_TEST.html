<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 4 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 4 · Music and Arts</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["musi<u>ci</u>an", "televi<u>si</u>on", "<u>sh</u>ow", "na<u>ti</u>on"], "answer": 1, "explanation": "\"television\" có \"si\" phát âm /ʒ/ (hữu thanh), ba từ còn lại phần gạch chân phát âm /ʃ/.", "vi": null, "ipas": ["/mjuˈzɪʃn/", "/ˈtelɪvɪʒn/", "/ʃəʊ/", "/ˈneɪʃn/"], "vis": ["nhạc sĩ", "truyền hình", "buổi biểu diễn", "quốc gia"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["plea<u>s</u>ure", "u<u>s</u>ual", "deci<u>si</u>on", "spe<u>ci</u>al"], "answer": 3, "explanation": "\"special\" có \"ci\" phát âm /ʃ/, ba từ còn lại phần gạch chân phát âm /ʒ/.", "vi": null, "ipas": ["/ˈpleʒə/", "/ˈjuːʒuəl/", "/dɪˈsɪʒn/", "/ˈspeʃl/"], "vis": ["niềm vui", "thường lệ", "quyết định", "đặc biệt"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["<u>ph</u>oto", "lau<u>gh</u>", "<u>v</u>ery", "<u>ph</u>one"], "answer": 2, "explanation": "\"very\" có \"v\" phát âm /v/ (hữu thanh), ba từ còn lại phần gạch chân phát âm /f/.", "vi": null, "ipas": ["/ˈfəʊtəʊ/", "/lɑːf/", "/ˈveri/", "/fəʊn/"], "vis": ["bức ảnh", "cười", "rất", "điện thoại"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["watch<u>ed</u>", "work<u>ed</u>", "need<u>ed</u>", "help<u>ed</u>"], "answer": 2, "explanation": "\"needed\" có đuôi \"-ed\" phát âm /ɪd/, ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/wɒtʃt/", "/wɜːkt/", "/ˈniːdɪd/", "/helpt/"], "vis": ["đã xem", "đã làm việc", "đã cần", "đã giúp"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["b<u>ir</u>d", "g<u>ir</u>l", "w<u>or</u>d", "ab<u>ou</u>t"], "answer": 3, "explanation": "\"about\" có \"ou\" phát âm /aʊ/, ba từ còn lại phần gạch chân phát âm /ɜː/.", "vi": null, "ipas": ["/bɜːd/", "/ɡɜːl/", "/wɜːd/", "/əˈbaʊt/"], "vis": ["con chim", "cô gái", "từ", "về"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["exhibi<u>ti</u>on", "clo<u>s</u>ure", "so<u>ci</u>al", "o<u>ce</u>an"], "answer": 1, "explanation": "\"closure\" có \"s\" phát âm /ʒ/, ba từ còn lại phần gạch chân phát âm /ʃ/.", "vi": null, "ipas": ["/ˌeksɪˈbɪʃn/", "/ˈkləʊʒə/", "/ˈsəʊʃl/", "/ˈəʊʃn/"], "vis": ["triển lãm", "sự đóng cửa", "thuộc xã hội", "đại dương"], "image": null}]}, {"key": "stress0", "title": "Stressed syllable", "emoji": "🎯", "vi": "Trọng âm", "items": [{"id": "STR1", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["anthem", "artist", "affect", "colour"], "answer": 2, "explanation": "\"affect\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈænθəm/", "/ˈɑːtɪst/", "/əˈfekt/", "/ˈkʌlə/"], "vis": ["bài ca ngợi, quốc ca", "nghệ sĩ", "ảnh hưởng", "màu sắc"], "image": null}, {"id": "STR2", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["carpenter", "celebrate", "exhibit", "educate"], "answer": 2, "explanation": "\"exhibit\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkɑːpəntə/", "/ˈselɪbreɪt/", "/ɪɡˈzɪbɪt/", "/ˈedʒukeɪt/"], "vis": ["thợ mộc", "ăn mừng", "trưng bày", "giáo dục"], "image": null}, {"id": "STR3", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["compel", "critic", "music", "famous"], "answer": 0, "explanation": "\"compel\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/kəmˈpel/", "/ˈkrɪtɪk/", "/ˈmjuːzɪk/", "/ˈfeɪməs/"], "vis": ["ép buộc", "nhà phê bình", "âm nhạc", "nổi tiếng"], "image": null}, {"id": "STR4", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["rural", "parade", "puppet", "photo"], "answer": 1, "explanation": "\"parade\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈrʊərəl/", "/pəˈreɪd/", "/ˈpʌpɪt/", "/ˈfəʊtəʊ/"], "vis": ["thuộc nông thôn", "cuộc diễu hành", "con rối", "bức ảnh"], "image": null}, {"id": "STR5", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["portrait", "famous", "prefer", "critic"], "answer": 2, "explanation": "\"prefer\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈpɔːtreɪt/", "/ˈfeɪməs/", "/prɪˈfɜː/", "/ˈkrɪtɪk/"], "vis": ["chân dung", "nổi tiếng", "thích hơn", "nhà phê bình"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "The Louvre is one of the most famous ______ in the world.", "options": ["museums", "puppets", "parades", "anthems"], "answer": 0, "explanation": "Louvre là bảo tàng (museum) nổi tiếng.", "vi": "Louvre là một trong những bảo tàng nổi tiếng nhất thế giới.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ2", "type": "mcq", "q": "The orchestra will ______ at the concert hall tonight.", "options": ["paint", "perform", "exhibit", "choose"], "answer": 1, "explanation": "Dàn nhạc biểu diễn (perform).", "vi": "Dàn nhạc sẽ biểu diễn tại phòng hòa nhạc tối nay.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ3", "type": "mcq", "q": "Van Cao was a great Vietnamese ______ and composer.", "options": ["artist", "carpenter", "critic", "puppet"], "answer": 0, "explanation": "Văn Cao là nghệ sĩ (artist) và nhà soạn nhạc.", "vi": "Văn Cao là một nghệ sĩ và nhà soạn nhạc vĩ đại của Việt Nam.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ4", "type": "mcq", "q": "The little girl's ______ of her kitten is very beautiful.", "options": ["drawing", "music", "parade", "anthem"], "answer": 0, "explanation": "\"drawing of\" = bức vẽ về.", "vi": "Bức vẽ chú mèo con của cô bé rất đẹp.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ5", "type": "mcq", "q": "Water puppetry is a traditional art ______ in Viet Nam.", "options": ["form", "colour", "photo", "plan"], "answer": 0, "explanation": "\"art form\" = loại hình nghệ thuật.", "vi": "Múa rối nước là một loại hình nghệ thuật truyền thống ở Việt Nam.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ6", "type": "mcq", "q": "My sister prefers classical music ______ pop music.", "options": ["with", "to", "from", "as"], "answer": 1, "explanation": "\"prefer A to B\" = thích A hơn B.", "vi": "Chị tôi thích nhạc cổ điển hơn nhạc pop.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ7", "type": "mcq", "q": "This painting is ______ colourful as that one.", "options": ["as", "more", "different", "same"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Bức tranh này nhiều màu sắc như bức kia.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ8", "type": "mcq", "q": "The new concert hall is not ______ large as the old one.", "options": ["so", "than", "more", "same"], "answer": 0, "explanation": "Phủ định so sánh bằng: not so/as + adj + as.", "vi": "Phòng hòa nhạc mới không lớn bằng phòng cũ.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ9", "type": "mcq", "q": "My guitar is different ______ yours.", "options": ["with", "from", "to", "as"], "answer": 1, "explanation": "\"different from\" = khác với.", "vi": "Cây ghi-ta của tôi khác với của bạn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ10", "type": "mcq", "q": "Lan has the same music taste ______ her brother.", "options": ["than", "as", "from", "to"], "answer": 1, "explanation": "\"the same ... as\" = giống như.", "vi": "Lan có gu âm nhạc giống anh trai.", "ipas": null, "vis": null, "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "The singer has a very ______ voice.", "options": ["beauty", "beautiful", "beautifully", "beautify"], "answer": 1, "explanation": "Tính từ bổ nghĩa cho \"voice\": beautiful.", "vi": "Ca sĩ có một giọng hát rất đẹp.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ12", "type": "mcq", "q": "The Dan Bau is a traditional Vietnamese musical ______.", "options": ["instrument", "portrait", "gallery", "critic"], "answer": 0, "explanation": "\"musical instrument\" = nhạc cụ.", "vi": "Đàn bầu là một nhạc cụ truyền thống của Việt Nam.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ13", "type": "mcq", "q": "The art club will ______ students' paintings next Friday.", "options": ["exhibit", "celebrate", "compel", "prefer"], "answer": 0, "explanation": "\"exhibit paintings\" = trưng bày tranh.", "vi": "Câu lạc bộ nghệ thuật sẽ trưng bày tranh của học sinh thứ Sáu tới.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ14", "type": "mcq", "q": "The audience clapped loudly after the excellent ______.", "options": ["performance", "origin", "fame", "curriculum"], "answer": 0, "explanation": "\"performance\" = buổi biểu diễn.", "vi": "Khán giả vỗ tay lớn sau buổi biểu diễn xuất sắc.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ15", "type": "mcq", "q": "A ______ is a person who gives opinions about works of art, music or films.", "options": ["critic", "artist", "carpenter", "composer"], "answer": 0, "explanation": "\"critic\" = nhà phê bình.", "vi": "Nhà phê bình là người đưa ra ý kiến về các tác phẩm nghệ thuật, âm nhạc hoặc phim.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ16", "type": "mcq", "q": "The school is planning a music ______ for the end of the term.", "options": ["concert", "photo", "colour", "origin"], "answer": 0, "explanation": "\"music concert\" = buổi hòa nhạc.", "vi": "Nhà trường đang lên kế hoạch cho một buổi hòa nhạc vào cuối học kỳ.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ17", "type": "mcq", "q": "The room is very ______, so we can hear every small sound.", "options": ["quiet", "loud", "famous", "recent"], "answer": 0, "explanation": "Nghe được mọi âm thanh nhỏ → phòng rất yên tĩnh (quiet).", "vi": "Căn phòng rất yên tĩnh, nên chúng tôi nghe được mọi âm thanh nhỏ.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ18", "type": "mcq", "q": "This year's festival is ______ from last year's festival.", "options": ["different", "same", "similar", "as"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Lễ hội năm nay khác với lễ hội năm ngoái.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ19", "type": "mcq", "q": "Her picture is ______ beautiful as mine.", "options": ["as", "than", "more", "most"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Bức tranh của cô ấy đẹp như của tôi.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ20", "type": "mcq", "q": "Pop music is not ______ exciting as rock music for Nam.", "options": ["as", "than", "the", "more"], "answer": 0, "explanation": "Phủ định so sánh bằng: not as + adj + as.", "vi": "Với Nam, nhạc pop không thú vị bằng nhạc rock.", "ipas": null, "vis": null, "image": null}]}, {"key": "mcq2", "title": "Vocabulary & Grammar (21-30)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ21", "type": "mcq", "q": "The museum has a large collection of modern ______.", "options": ["art", "artist", "artistic", "artists"], "answer": 0, "explanation": "\"modern art\" = nghệ thuật hiện đại (danh từ không đếm được).", "vi": "Bảo tàng có một bộ sưu tập lớn về nghệ thuật hiện đại.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ22", "type": "mcq", "q": "We watched the talent show ______ on television.", "options": ["live", "lively", "living", "life"], "answer": 0, "explanation": "\"live on television\" = trực tiếp trên truyền hình.", "vi": "Chúng tôi xem chương trình tài năng trực tiếp trên TV.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ23", "type": "mcq", "q": "The school ______ its 50th anniversary with a music show last month.", "options": ["celebrated", "considered", "compelled", "preferred"], "answer": 0, "explanation": "\"celebrate an anniversary\" = kỷ niệm.", "vi": "Trường đã kỷ niệm 50 năm thành lập bằng một chương trình ca nhạc tháng trước.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ24", "type": "mcq", "q": "She wants to ______ the red dress because it looks better on stage.", "options": ["choose", "appear", "educate", "originate"], "answer": 0, "explanation": "\"choose\" = chọn.", "vi": "Cô ấy muốn chọn chiếc váy đỏ vì nó trông đẹp hơn trên sân khấu.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ25", "type": "mcq", "q": "The students painted a ______ of their English teacher.", "options": ["portrait", "puppet", "parade", "anthem"], "answer": 0, "explanation": "\"portrait\" = bức chân dung.", "vi": "Các học sinh đã vẽ một bức chân dung của giáo viên tiếng Anh.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ26", "type": "mcq", "q": "The concert was a great success because the musicians played ______.", "options": ["well", "good", "best", "better"], "answer": 0, "explanation": "Trạng từ bổ nghĩa cho \"played\": well.", "vi": "Buổi hòa nhạc thành công rực rỡ vì các nhạc công chơi rất hay.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ27", "type": "mcq", "q": "This photo is not the same ______ the one in the book.", "options": ["as", "from", "to", "with"], "answer": 0, "explanation": "\"the same as\" = giống như.", "vi": "Bức ảnh này không giống với bức trong sách.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ28", "type": "mcq", "q": "Her school bag has the same colour ______ mine.", "options": ["as", "from", "than", "like"], "answer": 0, "explanation": "\"the same + N + as\".", "vi": "Cặp sách của cô ấy cùng màu với của tôi.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ29", "type": "mcq", "q": "My brother can play the guitar ______ well as his friend.", "options": ["as", "so", "more", "much"], "answer": 0, "explanation": "So sánh bằng với trạng từ (câu khẳng định): as + adv + as.", "vi": "Anh tôi có thể chơi ghi-ta hay như bạn của anh ấy.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ30", "type": "mcq", "q": "Traditional music is an important part of our cultural ______.", "options": ["heritage", "traffic", "disease", "shopping"], "answer": 0, "explanation": "\"cultural heritage\" = di sản văn hóa.", "vi": "Âm nhạc truyền thống là một phần quan trọng của di sản văn hóa chúng ta.", "ipas": null, "vis": null, "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "The school has a new art ________________ this month. (exhibit)", "answer": "exhibition", "explanation": "Sau \"a new art\" cần danh từ: exhibition (triển lãm).", "vi": "Trường có một triển lãm nghệ thuật mới trong tháng này."}, {"id": "WF2", "type": "fill", "q": "Mozart was a very famous ________________. (music)", "answer": "musician", "explanation": "Danh từ chỉ người: musician (nhạc sĩ).", "vi": "Mozart là một nhạc sĩ rất nổi tiếng."}, {"id": "WF3", "type": "fill", "q": "Her dance ________________ was excellent. (perform)", "answer": "performance", "explanation": "Danh từ ghép: dance performance (buổi biểu diễn múa).", "vi": "Màn biểu diễn múa của cô ấy thật xuất sắc."}, {"id": "WF4", "type": "fill", "q": "The children were excited about the ________________ puppet show. (tradition)", "answer": "traditional", "explanation": "Tính từ bổ nghĩa cho \"puppet show\": traditional.", "vi": "Bọn trẻ hào hứng với buổi múa rối truyền thống."}, {"id": "WF5", "type": "fill", "q": "This singer became ________________ after winning the competition. (fame)", "answer": "famous", "explanation": "Sau \"became\" dùng tính từ: famous.", "vi": "Ca sĩ này trở nên nổi tiếng sau khi thắng cuộc thi."}, {"id": "WF6", "type": "fill", "q": "Photography is a popular form of ________________. (art)", "answer": "art", "explanation": "\"form of art\" = loại hình nghệ thuật.", "vi": "Nhiếp ảnh là một loại hình nghệ thuật phổ biến."}, {"id": "WF7", "type": "fill", "q": "The concert was really ________________. (excite)", "answer": "exciting", "explanation": "Tính từ -ing chỉ tính chất sự vật: exciting.", "vi": "Buổi hòa nhạc thực sự thú vị."}, {"id": "WF8", "type": "fill", "q": "We received an ________________ to the school music festival. (invite)", "answer": "invitation", "explanation": "Sau \"an\" cần danh từ: invitation (lời mời).", "vi": "Chúng tôi nhận được lời mời đến lễ hội âm nhạc của trường."}, {"id": "WF9", "type": "fill", "q": "The two paintings are completely ________________ from each other. (differ)", "answer": "different", "explanation": "\"be different from\" = khác với.", "vi": "Hai bức tranh hoàn toàn khác nhau."}, {"id": "WF10", "type": "fill", "q": "The students listened ________________ to the classical music. (quiet)", "answer": "quietly", "explanation": "Trạng từ bổ nghĩa cho \"listened\": quietly.", "vi": "Các học sinh lặng lẽ lắng nghe nhạc cổ điển."}, {"id": "WF11", "type": "fill", "q": "The art teacher praised her ________________ picture. (colour)", "answer": "colourful", "explanation": "Tính từ bổ nghĩa cho \"picture\": colourful.", "vi": "Giáo viên mỹ thuật khen bức tranh nhiều màu sắc của cô ấy."}, {"id": "WF12", "type": "fill", "q": "The museum has many ________________ works of art. (value)", "answer": "valuable", "explanation": "Tính từ bổ nghĩa cho \"works of art\": valuable (giá trị).", "vi": "Bảo tàng có nhiều tác phẩm nghệ thuật giá trị."}, {"id": "WF13", "type": "fill", "q": "He is an ____________ young painter. (excellence)", "answer": "excellent", "explanation": "Tính từ bổ nghĩa cho \"painter\": excellent.", "vi": "Anh ấy là một họa sĩ trẻ xuất sắc."}, {"id": "WF14", "type": "fill", "q": "The band gave a wonderful ________________ last night. (perform)", "answer": "performance", "explanation": "Sau \"a wonderful\" cần danh từ: performance.", "vi": "Ban nhạc đã có một buổi biểu diễn tuyệt vời tối qua."}, {"id": "WF15", "type": "fill", "q": "She plays the piano very ________________. (beautiful)", "answer": "beautifully", "explanation": "Trạng từ bổ nghĩa cho \"plays\": beautifully.", "vi": "Cô ấy chơi piano rất hay."}]}, {"key": "readingA", "title": "Music Tastes", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "(1) James says his ______ type of music ranges from Rap to Hard Rock.", "options": ["favourite", "fame", "recent", "quiet"], "answer": 0, "explanation": "\"favourite type of music\" = thể loại nhạc yêu thích.", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "(2) He thinks it is a ______ thing to have a wide taste in music.", "options": ["good", "loud", "rural", "necessary"], "answer": 0, "explanation": "Có gu âm nhạc rộng là điều tốt (good thing).", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "(3) If a song comes on the ______ and catches his attention...", "options": ["radio", "portrait", "gallery", "puppet"], "answer": 0, "explanation": "\"a song comes on the radio\" = bài hát phát trên đài.", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "(4) Then he ______ the song and saves it.", "options": ["downloads", "paints", "performs", "celebrates"], "answer": 0, "explanation": "\"download the song and save it\" = tải bài hát và lưu lại.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "(5) What he listens to in his ______ time.", "options": ["spare", "academic", "live", "folk"], "answer": 0, "explanation": "\"spare time\" = thời gian rảnh.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "(6) Both boys enjoy music, ______ their tastes are not exactly the same.", "options": ["but", "so", "because", "or"], "answer": 0, "explanation": "Ý tương phản → but.", "vi": null}], "passage": "James says his <span class='blank-tag'>(1)</span> ______ type of music ranges from Rap and R&B to Punk and even Hard Rock. The only kind of music he does not really care for is Country. He thinks it is a <span class='blank-tag'>(2)</span> ______ thing to have a wide taste in music. Joongih, however, does not have one favourite type. If a song comes on the <span class='blank-tag'>(3)</span> ______ and catches his attention, he finds out the name of the artist or group. Then he <span class='blank-tag'>(4)</span> ______ the song and saves it. After some time, songs from many different genres become part of what he listens to in his <span class='blank-tag'>(5)</span> ______ time. Both boys enjoy music, <span class='blank-tag'>(6)</span> ______ their tastes are not exactly the same."}, {"key": "tfA", "title": "The Beatles", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "The Beatles were famous in the 1960s.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"In the 1960s, The Beatles were one of the most famous pop groups\" → Đúng.", "vi": "The Beatles nổi tiếng vào những năm 1960."}, {"id": "TFA2", "type": "mcq", "q": "All four members had formal music training.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"none of them had formal training in music\" → Sai.", "vi": "Cả bốn thành viên đều được đào tạo âm nhạc bài bản."}, {"id": "TFA3", "type": "mcq", "q": "At first, they performed songs by black American musicians.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"At first, they performed and recorded songs written by black American musicians\" → Đúng.", "vi": "Ban đầu, họ biểu diễn các bài hát của nhạc sĩ người Mỹ da đen."}, {"id": "TFA4", "type": "mcq", "q": "They became more popular after writing their own songs.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"they became much more popular when they started writing their own music\" → Đúng.", "vi": "Họ trở nên nổi tiếng hơn sau khi tự sáng tác."}, {"id": "TFA5", "type": "mcq", "q": "Where did the members of The Beatles come from?", "options": ["the north of England", "the south of England", "the USA", "Australia"], "answer": 0, "explanation": "Bài đọc: \"came from the north of England\".", "vi": "Các thành viên The Beatles đến từ đâu?"}, {"id": "TFA6", "type": "mcq", "q": "What became more common after The Beatles became successful?", "options": ["Groups wrote their own songs.", "Groups stopped performing live.", "Singers studied painting.", "Musicians avoided pop music."], "answer": 0, "explanation": "Bài đọc: \"it became much more common for groups and singers to write the songs they performed themselves\".", "vi": "Điều gì trở nên phổ biến hơn sau thành công của The Beatles?"}], "passage": "In the 1960s, The Beatles were one of the most famous pop groups in the world. The four members came from the north of England, and none of them had formal training in music. At first, they performed and recorded songs written by black American musicians. They had some success with these songs, but they became much more popular when they started writing their own music. Their success helped change pop music. After The Beatles, it became much more common for groups and singers to write the songs they performed themselves."}, {"key": "transform0", "title": "Sentence Transformation (Part 1)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>Japanese / well / Lan / as / learns / as / he / does.</b>", "starter": "", "answer": "Lan learns Japanese as well as he does.", "accepted": null, "explanation": "S + V + O + as + adv + as + S + auxiliary.", "vi": "Lan học tiếng Nhật giỏi như cậu ấy.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR2", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>Nha Trang / as / city / is / as / not / Hue. / cold</b>", "starter": "", "answer": "Nha Trang city is not as cold as Hue.", "accepted": null, "explanation": "S + be + not + as + adj + as + O.", "vi": "Thành phố Nha Trang không lạnh bằng Huế.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR3", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>not / music / Pop / is / roll. / exciting / as / rock / and / as</b>", "starter": "", "answer": "Pop music is not as exciting as rock and roll.", "accepted": null, "explanation": "S + be + not + as + adj + as + O.", "vi": "Nhạc pop không thú vị bằng rock and roll.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR4", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>one. / This / is / novel / same / as / that / the</b>", "starter": "", "answer": "This novel is the same as that one.", "accepted": null, "explanation": "N1 + be + the same as + N2.", "vi": "Cuốn tiểu thuyết này giống cuốn kia.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR5", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>Her / is / different / lifestyle / from / yours.</b>", "starter": "", "answer": "Her lifestyle is different from yours.", "accepted": null, "explanation": "N1 + be + different from + N2.", "vi": "Lối sống của cô ấy khác với của bạn.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR6", "type": "sentence", "q": "This painting is more colourful than that one.", "starter": "That painting is not", "answer": "as colourful as this one", "accepted": ["as colourful as this one", "so colourful as this one", "as colorful as this one"], "explanation": "A hơn B = B không bằng A: not as + adj + as.", "vi": "Bức tranh kia không nhiều màu sắc bằng bức này.", "note": "A + be + more + adj + than + B → B + be + not as + adj + as + A"}, {"id": "TR7", "type": "sentence", "q": "My guitar and Nam's guitar have the same colour.", "starter": "My guitar has the same", "answer": "colour as Nam's guitar", "accepted": ["colour as Nam's guitar", "colour as Nam's", "color as Nam's guitar"], "explanation": "\"the same + N + as\".", "vi": "Cây ghi-ta của tôi cùng màu với cây ghi-ta của Nam.", "note": "A and B have the same N → A has the same N as B"}, {"id": "TR8", "type": "sentence", "q": "The concert hall in our town is smaller than the city concert hall.", "starter": "The concert hall in our town is not", "answer": "as big as the city concert hall", "accepted": ["as big as the city concert hall", "as large as the city concert hall", "so big as the city concert hall", "so large as the city concert hall"], "explanation": "smaller than = not as big/large as.", "vi": "Phòng hòa nhạc ở thị trấn chúng tôi không lớn bằng phòng hòa nhạc thành phố.", "note": "A + be + smaller than + B → A + be + not as big/large as + B"}, {"id": "TR9", "type": "sentence", "q": "Lan's music taste is different from mine.", "starter": "My music taste is not", "answer": "the same as Lan's", "accepted": ["the same as Lan's", "the same as Lan's music taste"], "explanation": "different from = not the same as.", "vi": "Gu âm nhạc của tôi không giống của Lan.", "note": "A + be + different from + B → B + be + not the same as + A"}, {"id": "TR10", "type": "sentence", "q": "This year's puppet show is as interesting as last year's.", "starter": "This year's puppet show is the same", "answer": "as last year's", "accepted": null, "explanation": "as ... as = the same as.", "vi": "Buổi múa rối năm nay giống như năm ngoái.", "note": "A + be + as + adj + as + B → A + be + the same as + B"}]}, {"key": "transform1", "title": "Sentence Transformation (Part 2)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR11", "type": "sentence", "q": "My sister's piano is different from my piano.", "starter": "My sister's piano is not the", "answer": "same as my piano", "accepted": ["same as my piano", "same as mine"], "explanation": "different from = not the same as.", "vi": "Đàn piano của chị tôi không giống đàn piano của tôi.", "note": "A + be + different from + B → A + be + not the same as + B"}, {"id": "TR12", "type": "sentence", "q": "The red portrait and the blue portrait are the same.", "starter": "The red portrait is the same", "answer": "as the blue portrait", "accepted": ["as the blue portrait", "as the blue one"], "explanation": "A and B are the same = A is the same as B.", "vi": "Bức chân dung đỏ giống bức chân dung xanh.", "note": "A and B are the same → A is the same as B"}, {"id": "TR13", "type": "sentence", "q": "The red portrait and the blue portrait are the same.", "starter": "The red portrait is similar", "answer": "to the blue portrait", "accepted": ["to the blue portrait", "to the blue one"], "explanation": "the same = similar to.", "vi": "Bức chân dung đỏ tương tự bức chân dung xanh.", "note": "A and B are the same → A is similar to B"}, {"id": "TR14", "type": "sentence", "q": "Rock music is more exciting than classical music for Tom.", "starter": "Classical music is not", "answer": "as exciting as rock music for Tom", "accepted": ["as exciting as rock music for Tom", "so exciting as rock music for Tom"], "explanation": "A hơn B = B không bằng A.", "vi": "Với Tom, nhạc cổ điển không thú vị bằng nhạc rock.", "note": "A + be + more + adj + than + B → B + be + not as + adj + as + A"}, {"id": "TR15", "type": "sentence", "q": "Mai's dress is similar to Hoa's dress.", "starter": "Mai's dress looks", "answer": "like Hoa's dress", "accepted": ["like Hoa's dress", "like Hoa's"], "explanation": "similar to = look like.", "vi": "Váy của Mai trông giống váy của Hoa.", "note": "A + be + similar to + B → A + look(s) like + B"}, {"id": "TR16", "type": "sentence", "q": "This photo is different from the photo in the book.", "starter": "This photo is not", "answer": "the same as the photo in the book", "accepted": ["the same as the photo in the book", "the same as the one in the book"], "explanation": "different from = not the same as.", "vi": "Bức ảnh này không giống bức ảnh trong sách.", "note": "A + be + different from + B → A + be + not the same as + B"}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"performance\"] A. The school is holding a music ________________ next Friday.", "answer": "performance", "explanation": "Dựa vào ví dụ: music performance.", "vi": "Trường sẽ tổ chức buổi biểu diễn âm nhạc vào thứ Sáu tới."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"performance\"] B. We watched an amazing puppet ________________ at the festival.", "answer": "performance", "explanation": "Dựa vào ví dụ: puppet performance.", "vi": "Chúng tôi đã xem một buổi biểu diễn rối tuyệt vời tại lễ hội."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"exhibition\"] A. The art ________________ attracted thousands of visitors last month.", "answer": "exhibition", "explanation": "Dựa vào ví dụ: The art exhibition attracted thousands of visitors.", "vi": "Triển lãm nghệ thuật đã thu hút hàng nghìn du khách tháng trước."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"exhibition\"] B. We visited a photography ________________ at the museum yesterday.", "answer": "exhibition", "explanation": "Dựa vào ví dụ: a photography exhibition.", "vi": "Hôm qua chúng tôi đã thăm một triển lãm nhiếp ảnh tại bảo tàng."}]}, {"key": "pictures", "title": "Pictures & Signs", "emoji": "🚦", "vi": "Biển báo", "items": [{"id": "PIC1", "type": "mcq", "q": "What activity does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🏃</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["cycling", "swimming", "playing volleyball", "jogging"], "answer": 3, "explanation": "Hình một người đang chạy bộ → jogging.", "vi": null}, {"id": "PIC2", "type": "mcq", "q": "What does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🎭🪆</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["a paint palette", "a puppet theatre", "a concert hall", "a camera"], "answer": 1, "explanation": "Hình sân khấu với những con rối → nhà hát múa rối (puppet theatre).", "vi": null}, {"id": "PIC3", "type": "mcq", "q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🎟️</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">SOLD OUT</p></div>", "options": ["There are no tickets left.", "Tickets are sold outside.", "Please go out to buy your tickets.", "You can eat and drink here."], "answer": 0, "explanation": "\"SOLD OUT\" = đã bán hết vé.", "vi": null}]}, {"key": "extra0_0", "title": "GP1: as...as", "emoji": "🧩", "vi": "Grammar Practice 1: Comparison of equality (as ... as)", "items": [{"id": "EX0_1", "type": "fill", "q": "This cake is ______________ that cake. (sweet)", "answer": "as sweet as", "accepted": null, "explanation": "So sánh bằng: as + sweet + as.", "vi": "Cái bánh này ngọt như cái bánh kia."}, {"id": "EX0_2", "type": "fill", "q": "My laptop is ______________ yours. (expensive)", "answer": "as expensive as", "accepted": null, "explanation": "So sánh bằng: as + expensive + as.", "vi": "Laptop của tôi đắt như của bạn."}, {"id": "EX0_3", "type": "fill", "q": "This actress acts ______________ that one. (excellently)", "answer": "as excellently as", "accepted": null, "explanation": "So sánh bằng: as + excellently + as.", "vi": "Nữ diễn viên này diễn xuất sắc như nữ diễn viên kia."}, {"id": "EX0_4", "type": "fill", "q": "Does a tiger run ______________ a cheetah? (fast)", "answer": "as fast as", "accepted": null, "explanation": "So sánh bằng: as + fast + as.", "vi": "Hổ có chạy nhanh như báo không?"}, {"id": "EX0_5", "type": "fill", "q": "Simon is ______________ his brother. (brave)", "answer": "as brave as", "accepted": null, "explanation": "So sánh bằng: as + brave + as.", "vi": "Simon dũng cảm như anh trai."}, {"id": "EX0_6", "type": "fill", "q": "Is an elephant ______________ a whale? (heavy)", "answer": "as heavy as", "accepted": null, "explanation": "So sánh bằng: as + heavy + as.", "vi": "Voi có nặng như cá voi không?"}, {"id": "EX0_7", "type": "fill", "q": "Emma is ______________ Judy. (studious)", "answer": "as studious as", "accepted": null, "explanation": "So sánh bằng: as + studious + as.", "vi": "Emma chăm học như Judy."}, {"id": "EX0_8", "type": "fill", "q": "Did he do the test ______________ you? (badly)", "answer": "as badly as", "accepted": null, "explanation": "So sánh bằng: as + badly + as.", "vi": "Anh ấy có làm bài kiểm tra tệ như bạn không?"}, {"id": "EX0_9", "type": "fill", "q": "I slept ______________ my mother last night. (well)", "answer": "as well as", "accepted": null, "explanation": "So sánh bằng: as + well + as.", "vi": "Tối qua tôi ngủ ngon như mẹ tôi."}, {"id": "EX0_10", "type": "fill", "q": "Ben cooks ______________ his friend, John. (badly)", "answer": "as badly as", "accepted": null, "explanation": "So sánh bằng: as + badly + as.", "vi": "Ben nấu ăn dở như bạn của cậu ấy, John."}]}, {"key": "extra1_0", "title": "GP2: not as...as", "emoji": "🧩", "vi": "Grammar Practice 2: Inequality (not as / so ... as)", "items": [{"id": "EX1_1", "type": "fill", "q": "She is not ______________ her sister. (charming)", "answer": "as charming as", "accepted": ["as charming as", "so charming as"], "explanation": "Phủ định so sánh bằng: not as/so + charming + as.", "vi": "Cô ấy không quyến rũ bằng chị gái."}, {"id": "EX1_2", "type": "fill", "q": "My car isn't running ______________ that one. (fast)", "answer": "as fast as", "accepted": ["as fast as", "so fast as"], "explanation": "Phủ định so sánh bằng: not as/so + fast + as.", "vi": "Xe của tôi không chạy nhanh bằng chiếc kia."}, {"id": "EX1_3", "type": "fill", "q": "A bird is not ______________ a butterfly. (colourful)", "answer": "as colourful as", "accepted": ["as colourful as", "so colourful as"], "explanation": "Phủ định so sánh bằng: not as/so + colourful + as.", "vi": "Chim không sặc sỡ bằng bướm."}, {"id": "EX1_4", "type": "fill", "q": "A wolf is not ______________ a puppy. (friendly)", "answer": "as friendly as", "accepted": ["as friendly as", "so friendly as"], "explanation": "Phủ định so sánh bằng: not as/so + friendly + as.", "vi": "Sói không thân thiện bằng chó con."}, {"id": "EX1_5", "type": "fill", "q": "Fast food isn't ______________ salad. (healthy)", "answer": "as healthy as", "accepted": ["as healthy as", "so healthy as"], "explanation": "Phủ định so sánh bằng: not as/so + healthy + as.", "vi": "Đồ ăn nhanh không lành mạnh bằng sa-lát."}, {"id": "EX1_6", "type": "fill", "q": "Those shoes aren't ______________ these ones. (loose)", "answer": "as loose as", "accepted": ["as loose as", "so loose as"], "explanation": "Phủ định so sánh bằng: not as/so + loose + as.", "vi": "Đôi giày kia không rộng bằng đôi này."}, {"id": "EX1_7", "type": "fill", "q": "We don't work ______________ him. (hard)", "answer": "as hard as", "accepted": ["as hard as", "so hard as"], "explanation": "Phủ định so sánh bằng: not as/so + hard + as.", "vi": "Chúng tôi không làm việc chăm chỉ bằng anh ấy."}, {"id": "EX1_8", "type": "fill", "q": "I didn't leave home ______________ them. (early)", "answer": "as early as", "accepted": ["as early as", "so early as"], "explanation": "Phủ định so sánh bằng: not as/so + early + as.", "vi": "Tôi không rời nhà sớm bằng họ."}, {"id": "EX1_9", "type": "fill", "q": "She doesn't take care of babies ______________ my mom. (carefully)", "answer": "as carefully as", "accepted": ["as carefully as", "so carefully as"], "explanation": "Phủ định so sánh bằng: not as/so + carefully + as.", "vi": "Cô ấy không chăm em bé cẩn thận bằng mẹ tôi."}, {"id": "EX1_10", "type": "fill", "q": "A computer isn't ______________ a book. (light)", "answer": "as light as", "accepted": ["as light as", "so light as"], "explanation": "Phủ định so sánh bằng: not as/so + light + as.", "vi": "Máy tính không nhẹ bằng một cuốn sách."}]}, {"key": "extra2_0", "title": "GP3: different/same", "emoji": "🧩", "vi": "Grammar Practice 3: different or the same", "items": [{"id": "EX2_1", "type": "mcq", "q": "Your house looks __________ from my house.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Nhà bạn trông khác nhà tôi."}, {"id": "EX2_2", "type": "mcq", "q": "John has __________ job as my brother.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "John có cùng công việc với anh tôi."}, {"id": "EX2_3", "type": "mcq", "q": "His ideas are little __________ from those of his friends.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Ý tưởng của anh ấy hơi khác với của bạn bè."}, {"id": "EX2_4", "type": "mcq", "q": "The book's __________ from the last time I read it.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Cuốn sách khác so với lần trước tôi đọc."}, {"id": "EX2_5", "type": "mcq", "q": "My opinion is __________ from yours.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Ý kiến của tôi khác với của bạn."}, {"id": "EX2_6", "type": "mcq", "q": "Ann's salary is __________ as mine.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Lương của Ann bằng của tôi."}, {"id": "EX2_7", "type": "mcq", "q": "Your motorbike has __________ weight as my motorbike.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Xe máy của bạn có cùng trọng lượng với xe của tôi."}, {"id": "EX2_8", "type": "mcq", "q": "Humans are __________ from other animals.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Con người khác với các loài động vật khác."}, {"id": "EX2_9", "type": "mcq", "q": "This apple has __________ flavor as that apple.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Quả táo này có cùng hương vị với quả táo kia."}, {"id": "EX2_10", "type": "mcq", "q": "The apple is __________ weight as the orange.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Quả táo có cùng trọng lượng với quả cam."}]}, {"key": "extra3_0", "title": "GP4: Chọn đúng", "emoji": "🧩", "vi": "Grammar Practice 4: Circle the correct answers", "items": [{"id": "EX3_1", "type": "mcq", "q": "My younger brother has as many toys (as / from) me.", "options": ["as", "from"], "answer": 0, "explanation": "as many + N + as.", "vi": "Em trai tôi có nhiều đồ chơi như tôi."}, {"id": "EX3_2", "type": "mcq", "q": "No other island in the world is (as large as / different large from) Greenland.", "options": ["as large as", "different large from"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Không hòn đảo nào trên thế giới lớn bằng Greenland."}, {"id": "EX3_3", "type": "mcq", "q": "The cake tastes (different / the same) as chocolate.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\"; \"different\" đi với \"from\".", "vi": "Cái bánh có vị giống sô-cô-la."}, {"id": "EX3_4", "type": "mcq", "q": "I have (different / as) much money as my older brother.", "options": ["different", "as"], "answer": 1, "explanation": "as much + N + as.", "vi": "Tôi có nhiều tiền như anh trai tôi."}, {"id": "EX3_5", "type": "mcq", "q": "Life in the city is (different / the same) from life in the countryside.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\".", "vi": "Cuộc sống ở thành phố khác với ở nông thôn."}, {"id": "EX3_6", "type": "mcq", "q": "My book is (same / as) interesting as yours.", "options": ["same", "as"], "answer": 1, "explanation": "as + adj + as.", "vi": "Sách của tôi thú vị như của bạn."}, {"id": "EX3_7", "type": "mcq", "q": "His house is different (from / as) my house.", "options": ["from", "as"], "answer": 0, "explanation": "\"different from\".", "vi": "Nhà anh ấy khác nhà tôi."}, {"id": "EX3_8", "type": "mcq", "q": "No other writer in English (is / are) as famous as Shakespeare.", "options": ["is", "are"], "answer": 0, "explanation": "Chủ ngữ \"No other writer\" số ít → is.", "vi": "Không nhà văn tiếng Anh nào nổi tiếng như Shakespeare."}, {"id": "EX3_9", "type": "mcq", "q": "No other metal is as (use / useful) as iron.", "options": ["use", "useful"], "answer": 1, "explanation": "Giữa as ... as cần tính từ: useful.", "vi": "Không kim loại nào hữu ích như sắt."}, {"id": "EX3_10", "type": "mcq", "q": "Your hat (look / looks) the same as Mary's.", "options": ["look", "looks"], "answer": 1, "explanation": "Chủ ngữ số ít \"Your hat\" → looks.", "vi": "Cái mũ của bạn trông giống của Mary."}]}, {"key": "extra4_0", "title": "GP5: Trắc nghiệm (1-10)", "emoji": "🧩", "vi": "Grammar Practice 5: Circle the best answers", "items": [{"id": "EX4_1", "type": "mcq", "q": "No one else in the class plays the guitar ______ John.", "options": ["as well", "as far as", "so well as", "as soon as"], "answer": 2, "explanation": "So sánh bằng với trạng từ trong câu phủ định (No one): as/so + well + as.", "vi": "Không ai khác trong lớp chơi ghi-ta hay như John."}, {"id": "EX4_2", "type": "mcq", "q": "The Brit School is the most famous ______ arts school in Britain.", "options": ["performing", "performance", "perform", "performed"], "answer": 0, "explanation": "\"performing arts\" = nghệ thuật biểu diễn.", "vi": "Trường Brit là trường nghệ thuật biểu diễn nổi tiếng nhất nước Anh."}, {"id": "EX4_3", "type": "mcq", "q": "Jane is not ______ her brother.", "options": ["more intelligent as", "intelligent as", "so intelligent as", "so intelligent that"], "answer": 2, "explanation": "Phủ định so sánh bằng: not so + adj + as.", "vi": "Jane không thông minh bằng anh trai."}, {"id": "EX4_4", "type": "mcq", "q": "Since the 1970s, the festival in Glastonbury has taken ______ almost every year and has grown in size.", "options": ["part", "place", "note", "notice"], "answer": 1, "explanation": "\"take place\" = diễn ra.", "vi": "Từ những năm 1970, lễ hội ở Glastonbury diễn ra hầu như mỗi năm và ngày càng lớn."}, {"id": "EX4_5", "type": "mcq", "q": "He drives as ______ his father does.", "options": ["careful as", "more carefully", "the most careful", "carefully as"], "answer": 3, "explanation": "So sánh bằng với trạng từ: as + carefully + as.", "vi": "Anh ấy lái xe cẩn thận như bố anh ấy."}, {"id": "EX4_6", "type": "mcq", "q": "Dong Ho paintings are made on ______ paper with beautiful ______ colors.", "options": ["traditional - nature", "tradition – natural", "tradition - nature", "traditional – natural"], "answer": 3, "explanation": "Cần hai tính từ bổ nghĩa cho danh từ: traditional paper, natural colors.", "vi": "Tranh Đông Hồ được làm trên giấy truyền thống với màu sắc tự nhiên đẹp mắt."}, {"id": "EX4_7", "type": "mcq", "q": "I'll be there ______ I can.", "options": ["sooner as", "no sooner as", "as soon as", "soonest as"], "answer": 2, "explanation": "\"as soon as\" = ngay khi.", "vi": "Tôi sẽ có mặt ngay khi có thể."}, {"id": "EX4_8", "type": "mcq", "q": "My village is not ______ it was ten years ago.", "options": ["the same as", "the same to", "same as", "the same"], "answer": 0, "explanation": "\"the same as\" = giống như.", "vi": "Làng tôi không còn như mười năm trước."}, {"id": "EX4_9", "type": "mcq", "q": "The villagers are ______ they were years ago. There is no change at all.", "options": ["differently from", "not as friendly as", "as friend as", "as friendly as"], "answer": 3, "explanation": "Không có gì thay đổi → vẫn thân thiện như xưa: as friendly as.", "vi": "Dân làng vẫn thân thiện như nhiều năm trước. Không có gì thay đổi cả."}, {"id": "EX4_10", "type": "mcq", "q": "Water puppetry ______ in the 11th century in the villages of the Red River Delta of North Viet Nam.", "options": ["originated", "formed", "started", "began"], "answer": 0, "explanation": "\"originate in\" = bắt nguồn từ.", "vi": "Múa rối nước bắt nguồn từ thế kỷ 11 ở các làng thuộc đồng bằng sông Hồng, miền Bắc Việt Nam."}]}, {"key": "extra4_1", "title": "GP5: Trắc nghiệm (11-20)", "emoji": "🧩", "vi": "Grammar Practice 5: Circle the best answers", "items": [{"id": "EX4_11", "type": "mcq", "q": "The puppet shows present ______ themes of Vietnamese villages.", "options": ["city", "urban", "village", "rural"], "answer": 3, "explanation": "\"rural themes\" = chủ đề nông thôn.", "vi": "Các buổi múa rối thể hiện những chủ đề nông thôn của làng quê Việt Nam."}, {"id": "EX4_12", "type": "mcq", "q": "No one in my class is ______ beautiful ______ her.", "options": ["as - as", "more - as", "as - than", "the – more"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Không ai trong lớp tôi đẹp như cô ấy."}, {"id": "EX4_13", "type": "mcq", "q": "The group is ______ for their albums and tours around the world.", "options": ["well-knows", "know-how", "well-prepared", "well-known"], "answer": 3, "explanation": "\"be well-known for\" = nổi tiếng về.", "vi": "Nhóm nhạc nổi tiếng với các album và chuyến lưu diễn khắp thế giới."}, {"id": "EX4_14", "type": "mcq", "q": "Going by train isn't ______ convenient as going by car.", "options": ["so", "as", "more", "A & B are correct."], "answer": 3, "explanation": "Phủ định so sánh bằng dùng được cả not as/so ... as.", "vi": "Đi tàu không tiện bằng đi ô tô."}, {"id": "EX4_15", "type": "mcq", "q": "The performance of puppetry show ______ in the countryside and ______.", "options": ["everyday life – folk rock", "every day life – folk people", "everyday life – folktales", "every day life – folk stories"], "answer": 2, "explanation": "\"everyday life\" (tính từ ghép) và \"folktales\" (truyện dân gian).", "vi": "Buổi múa rối thể hiện cuộc sống thường ngày ở nông thôn và các câu chuyện dân gian."}, {"id": "EX4_16", "type": "mcq", "q": "Classical music is not ______ as pop music.", "options": ["exciting", "more excited", "as exciting", "as excited"], "answer": 2, "explanation": "not as + adj (exciting: tính từ chỉ sự vật) + as.", "vi": "Nhạc cổ điển không thú vị bằng nhạc pop."}, {"id": "EX4_17", "type": "mcq", "q": "The test is not ______ difficult ______ it was last month.", "options": ["as - as", "so - as", "more - as", "A & B are correct."], "answer": 3, "explanation": "Phủ định so sánh bằng: not as/so ... as.", "vi": "Bài kiểm tra không khó như tháng trước."}, {"id": "EX4_18", "type": "mcq", "q": "This year's musical festival is not ______ it was last year.", "options": ["different from", "worse", "as good as", "as well as"], "answer": 2, "explanation": "Sau \"is not\" cần tính từ so sánh bằng: as good as.", "vi": "Lễ hội âm nhạc năm nay không hay bằng năm ngoái."}, {"id": "EX4_19", "type": "mcq", "q": "He works ______ we do.", "options": ["harder", "as hard as", "harder", "so hard as"], "answer": 1, "explanation": "Câu khẳng định dùng as + adv + as.", "vi": "Anh ấy làm việc chăm chỉ như chúng tôi."}, {"id": "EX4_20", "type": "mcq", "q": "Marie is not ______ intelligent ______ her sister.", "options": ["more-as", "so-so", "so-as", "the-of"], "answer": 2, "explanation": "Phủ định so sánh bằng: not so + adj + as.", "vi": "Marie không thông minh bằng chị gái."}]}], "total": 151, "examPapers": [[{"id": "EX4_10", "type": "mcq", "q": "Water puppetry ______ in the 11th century in the villages of the Red River Delta of North Viet Nam.", "options": ["originated", "formed", "started", "began"], "answer": 0, "explanation": "\"originate in\" = bắt nguồn từ.", "vi": "Múa rối nước bắt nguồn từ thế kỷ 11 ở các làng thuộc đồng bằng sông Hồng, miền Bắc Việt Nam."}, {"id": "EX2_1", "type": "mcq", "q": "Your house looks __________ from my house.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Nhà bạn trông khác nhà tôi."}, {"id": "EX0_5", "type": "fill", "q": "Simon is ______________ his brother. (brave)", "answer": "as brave as", "accepted": null, "explanation": "So sánh bằng: as + brave + as.", "vi": "Simon dũng cảm như anh trai."}, {"id": "EX1_5", "type": "fill", "q": "Fast food isn't ______________ salad. (healthy)", "answer": "as healthy as", "accepted": ["as healthy as", "so healthy as"], "explanation": "Phủ định so sánh bằng: not as/so + healthy + as.", "vi": "Đồ ăn nhanh không lành mạnh bằng sa-lát."}, {"id": "WF5", "type": "fill", "q": "This singer became ________________ after winning the competition. (fame)", "answer": "famous", "explanation": "Sau \"became\" dùng tính từ: famous.", "vi": "Ca sĩ này trở nên nổi tiếng sau khi thắng cuộc thi."}, {"id": "MCQ27", "type": "mcq", "q": "This photo is not the same ______ the one in the book.", "options": ["as", "from", "to", "with"], "answer": 0, "explanation": "\"the same as\" = giống như.", "vi": "Bức ảnh này không giống với bức trong sách.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ3", "type": "mcq", "q": "Van Cao was a great Vietnamese ______ and composer.", "options": ["artist", "carpenter", "critic", "puppet"], "answer": 0, "explanation": "Văn Cao là nghệ sĩ (artist) và nhà soạn nhạc.", "vi": "Văn Cao là một nghệ sĩ và nhà soạn nhạc vĩ đại của Việt Nam.", "ipas": null, "vis": null, "image": null}, {"id": "TR1", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>Japanese / well / Lan / as / learns / as / he / does.</b>", "starter": "", "answer": "Lan learns Japanese as well as he does.", "accepted": null, "explanation": "S + V + O + as + adv + as + S + auxiliary.", "vi": "Lan học tiếng Nhật giỏi như cậu ấy.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "WF14", "type": "fill", "q": "The band gave a wonderful ________________ last night. (perform)", "answer": "performance", "explanation": "Sau \"a wonderful\" cần danh từ: performance.", "vi": "Ban nhạc đã có một buổi biểu diễn tuyệt vời tối qua."}, {"id": "MCQ30", "type": "mcq", "q": "Traditional music is an important part of our cultural ______.", "options": ["heritage", "traffic", "disease", "shopping"], "answer": 0, "explanation": "\"cultural heritage\" = di sản văn hóa.", "vi": "Âm nhạc truyền thống là một phần quan trọng của di sản văn hóa chúng ta.", "ipas": null, "vis": null, "image": null}, {"id": "EX1_10", "type": "fill", "q": "A computer isn't ______________ a book. (light)", "answer": "as light as", "accepted": ["as light as", "so light as"], "explanation": "Phủ định so sánh bằng: not as/so + light + as.", "vi": "Máy tính không nhẹ bằng một cuốn sách."}, {"id": "EX4_16", "type": "mcq", "q": "Classical music is not ______ as pop music.", "options": ["exciting", "more excited", "as exciting", "as excited"], "answer": 2, "explanation": "not as + adj (exciting: tính từ chỉ sự vật) + as.", "vi": "Nhạc cổ điển không thú vị bằng nhạc pop."}, {"id": "MCQ19", "type": "mcq", "q": "Her picture is ______ beautiful as mine.", "options": ["as", "than", "more", "most"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Bức tranh của cô ấy đẹp như của tôi.", "ipas": null, "vis": null, "image": null}, {"id": "EX0_6", "type": "fill", "q": "Is an elephant ______________ a whale? (heavy)", "answer": "as heavy as", "accepted": null, "explanation": "So sánh bằng: as + heavy + as.", "vi": "Voi có nặng như cá voi không?"}, {"id": "EX3_1", "type": "mcq", "q": "My younger brother has as many toys (as / from) me.", "options": ["as", "from"], "answer": 0, "explanation": "as many + N + as.", "vi": "Em trai tôi có nhiều đồ chơi như tôi."}, {"id": "TR7", "type": "sentence", "q": "My guitar and Nam's guitar have the same colour.", "starter": "My guitar has the same", "answer": "colour as Nam's guitar", "accepted": ["colour as Nam's guitar", "colour as Nam's", "color as Nam's guitar"], "explanation": "\"the same + N + as\".", "vi": "Cây ghi-ta của tôi cùng màu với cây ghi-ta của Nam.", "note": "A and B have the same N → A has the same N as B"}, {"id": "TFA4", "type": "mcq", "q": "They became more popular after writing their own songs.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"they became much more popular when they started writing their own music\" → Đúng.", "vi": "Họ trở nên nổi tiếng hơn sau khi tự sáng tác.", "passage": "In the 1960s, The Beatles were one of the most famous pop groups in the world. The four members came from the north of England, and none of them had formal training in music. At first, they performed and recorded songs written by black American musicians. They had some success with these songs, but they became much more popular when they started writing their own music. Their success helped change pop music. After The Beatles, it became much more common for groups and singers to write the songs they performed themselves."}, {"id": "EX4_12", "type": "mcq", "q": "No one in my class is ______ beautiful ______ her.", "options": ["as - as", "more - as", "as - than", "the – more"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Không ai trong lớp tôi đẹp như cô ấy."}, {"id": "EX2_6", "type": "mcq", "q": "Ann's salary is __________ as mine.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Lương của Ann bằng của tôi."}, {"id": "TR15", "type": "sentence", "q": "Mai's dress is similar to Hoa's dress.", "starter": "Mai's dress looks", "answer": "like Hoa's dress", "accepted": ["like Hoa's dress", "like Hoa's"], "explanation": "similar to = look like.", "vi": "Váy của Mai trông giống váy của Hoa.", "note": "A + be + similar to + B → A + look(s) like + B"}, {"id": "EX3_5", "type": "mcq", "q": "Life in the city is (different / the same) from life in the countryside.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\".", "vi": "Cuộc sống ở thành phố khác với ở nông thôn."}, {"id": "TFA2", "type": "mcq", "q": "All four members had formal music training.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"none of them had formal training in music\" → Sai.", "vi": "Cả bốn thành viên đều được đào tạo âm nhạc bài bản.", "passage": "In the 1960s, The Beatles were one of the most famous pop groups in the world. The four members came from the north of England, and none of them had formal training in music. At first, they performed and recorded songs written by black American musicians. They had some success with these songs, but they became much more popular when they started writing their own music. Their success helped change pop music. After The Beatles, it became much more common for groups and singers to write the songs they performed themselves."}, {"id": "READINGA1", "type": "mcq", "q": "(1) James says his ______ type of music ranges from Rap to Hard Rock.", "options": ["favourite", "fame", "recent", "quiet"], "answer": 0, "explanation": "\"favourite type of music\" = thể loại nhạc yêu thích.", "vi": null, "passage": "James says his <span class='blank-tag'>(1)</span> ______ type of music ranges from Rap and R&B to Punk and even Hard Rock. The only kind of music he does not really care for is Country. He thinks it is a <span class='blank-tag'>(2)</span> ______ thing to have a wide taste in music. Joongih, however, does not have one favourite type. If a song comes on the <span class='blank-tag'>(3)</span> ______ and catches his attention, he finds out the name of the artist or group. Then he <span class='blank-tag'>(4)</span> ______ the song and saves it. After some time, songs from many different genres become part of what he listens to in his <span class='blank-tag'>(5)</span> ______ time. Both boys enjoy music, <span class='blank-tag'>(6)</span> ______ their tastes are not exactly the same."}, {"id": "MCQ14", "type": "mcq", "q": "The audience clapped loudly after the excellent ______.", "options": ["performance", "origin", "fame", "curriculum"], "answer": 0, "explanation": "\"performance\" = buổi biểu diễn.", "vi": "Khán giả vỗ tay lớn sau buổi biểu diễn xuất sắc.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ15", "type": "mcq", "q": "A ______ is a person who gives opinions about works of art, music or films.", "options": ["critic", "artist", "carpenter", "composer"], "answer": 0, "explanation": "\"critic\" = nhà phê bình.", "vi": "Nhà phê bình là người đưa ra ý kiến về các tác phẩm nghệ thuật, âm nhạc hoặc phim.", "ipas": null, "vis": null, "image": null}, {"id": "TR14", "type": "sentence", "q": "Rock music is more exciting than classical music for Tom.", "starter": "Classical music is not", "answer": "as exciting as rock music for Tom", "accepted": ["as exciting as rock music for Tom", "so exciting as rock music for Tom"], "explanation": "A hơn B = B không bằng A.", "vi": "Với Tom, nhạc cổ điển không thú vị bằng nhạc rock.", "note": "A + be + more + adj + than + B → B + be + not as + adj + as + A"}, {"id": "EX4_1", "type": "mcq", "q": "No one else in the class plays the guitar ______ John.", "options": ["as well", "as far as", "so well as", "as soon as"], "answer": 2, "explanation": "So sánh bằng với trạng từ trong câu phủ định (No one): as/so + well + as.", "vi": "Không ai khác trong lớp chơi ghi-ta hay như John."}, {"id": "EX0_10", "type": "fill", "q": "Ben cooks ______________ his friend, John. (badly)", "answer": "as badly as", "accepted": null, "explanation": "So sánh bằng: as + badly + as.", "vi": "Ben nấu ăn dở như bạn của cậu ấy, John."}, {"id": "EX4_6", "type": "mcq", "q": "Dong Ho paintings are made on ______ paper with beautiful ______ colors.", "options": ["traditional - nature", "tradition – natural", "tradition - nature", "traditional – natural"], "answer": 3, "explanation": "Cần hai tính từ bổ nghĩa cho danh từ: traditional paper, natural colors.", "vi": "Tranh Đông Hồ được làm trên giấy truyền thống với màu sắc tự nhiên đẹp mắt."}, {"id": "STR4", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["rural", "parade", "puppet", "photo"], "answer": 1, "explanation": "\"parade\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈrʊərəl/", "/pəˈreɪd/", "/ˈpʌpɪt/", "/ˈfəʊtəʊ/"], "vis": ["thuộc nông thôn", "cuộc diễu hành", "con rối", "bức ảnh"], "image": null}, {"id": "PIC1", "type": "mcq", "q": "What activity does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🏃</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["cycling", "swimming", "playing volleyball", "jogging"], "answer": 3, "explanation": "Hình một người đang chạy bộ → jogging.", "vi": null}, {"id": "WF10", "type": "fill", "q": "The students listened ________________ to the classical music. (quiet)", "answer": "quietly", "explanation": "Trạng từ bổ nghĩa cho \"listened\": quietly.", "vi": "Các học sinh lặng lẽ lắng nghe nhạc cổ điển."}, {"id": "STR2", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["carpenter", "celebrate", "exhibit", "educate"], "answer": 2, "explanation": "\"exhibit\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈkɑːpəntə/", "/ˈselɪbreɪt/", "/ɪɡˈzɪbɪt/", "/ˈedʒukeɪt/"], "vis": ["thợ mộc", "ăn mừng", "trưng bày", "giáo dục"], "image": null}, {"id": "MCQ22", "type": "mcq", "q": "We watched the talent show ______ on television.", "options": ["live", "lively", "living", "life"], "answer": 0, "explanation": "\"live on television\" = trực tiếp trên truyền hình.", "vi": "Chúng tôi xem chương trình tài năng trực tiếp trên TV.", "ipas": null, "vis": null, "image": null}, {"id": "WF1", "type": "fill", "q": "The school has a new art ________________ this month. (exhibit)", "answer": "exhibition", "explanation": "Sau \"a new art\" cần danh từ: exhibition (triển lãm).", "vi": "Trường có một triển lãm nghệ thuật mới trong tháng này."}, {"id": "TR11", "type": "sentence", "q": "My sister's piano is different from my piano.", "starter": "My sister's piano is not the", "answer": "same as my piano", "accepted": ["same as my piano", "same as mine"], "explanation": "different from = not the same as.", "vi": "Đàn piano của chị tôi không giống đàn piano của tôi.", "note": "A + be + different from + B → A + be + not the same as + B"}, {"id": "EX1_2", "type": "fill", "q": "My car isn't running ______________ that one. (fast)", "answer": "as fast as", "accepted": ["as fast as", "so fast as"], "explanation": "Phủ định so sánh bằng: not as/so + fast + as.", "vi": "Xe của tôi không chạy nhanh bằng chiếc kia."}, {"id": "READINGA3", "type": "mcq", "q": "(3) If a song comes on the ______ and catches his attention...", "options": ["radio", "portrait", "gallery", "puppet"], "answer": 0, "explanation": "\"a song comes on the radio\" = bài hát phát trên đài.", "vi": null, "passage": "James says his <span class='blank-tag'>(1)</span> ______ type of music ranges from Rap and R&B to Punk and even Hard Rock. The only kind of music he does not really care _____ mine.", "options": ["as", "from", "than", "like"], "answer": 0, "explanation": "\"the same + N + as\".", "vi": "Cặp sách của cô ấy cùng màu với của tôi.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ11", "type": "mcq", "q": "The singer has a very ______ voice.", "options": ["beauty", "beautiful", "beautifully", "beautify"], "answer": 1, "explanation": "Tính từ bổ nghĩa cho \"voice\": beautiful.", "vi": "Ca sĩ có một giọng hát rất đẹp.", "ipas": null, "vis": null, "image": null}, {"id": "EX2_4", "type": "mcq", "q": "The book's __________ from the last time I read it.", "options": ["different", "the same"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Cuốn sách khác so với lần trước tôi đọc."}, {"id": "EX4_8", "type": "mcq", "q": "My village is not ______ it was ten years ago.", "options": ["the same as", "the same to", "same as", "the same"], "answer": 0, "explanation": "\"the same as\" = giống như.", "vi": "Làng tôi không còn như mười năm trước."}, {"id": "WF15", "type": "fill", "q": "She plays the piano very ________________. (beautiful)", "answer": "beautifully", "explanation": "Trạng từ bổ nghĩa cho \"plays\": beautifully.", "vi": "Cô ấy chơi piano rất hay."}, {"id": "MCQ7", "type": "mcq", "q": "This painting is ______ colourful as that one.", "options": ["as", "more", "different", "same"], "answer": 0, "explanation": "So sánh bằng: as + adj + as.", "vi": "Bức tranh này nhiều màu sắc như bức kia.", "ipas": null, "vis": null, "image": null}, {"id": "EX3_10", "type": "mcq", "q": "Your hat (look / looks) the same as Mary's.", "options": ["look", "looks"], "answer": 1, "explanation": "Chủ ngữ số ít \"Your hat\" → looks.", "vi": "Cái mũ của bạn trông giống của Mary."}, {"id": "PRON2", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["plea<u>s</u>ure", "u<u>s</u>ual", "deci<u>si</u>on", "spe<u>ci</u>al"], "answer": 3, "explanation": "\"special\" có \"ci\" phát âm /ʃ/, ba từ còn lại phần gạch chân phát âm /ʒ/.", "vi": null, "ipas": ["/ˈpleʒə/", "/ˈjuːʒuəl/", "/dɪˈsɪʒn/", "/ˈspeʃl/"], "vis": ["niềm vui", "thường lệ", "quyết định", "đặc biệt"], "image": null}], [{"id": "EX4_3", "type": "mcq", "q": "Jane is not ______ her brother.", "options": ["more intelligent as", "intelligent as", "so intelligent as", "so intelligent that"], "answer": 2, "explanation": "Phủ định so sánh bằng: not so + adj + as.", "vi": "Jane không thông minh bằng anh trai."}, {"id": "EX2_10", "type": "mcq", "q": "The apple is __________ weight as the orange.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Quả táo có cùng trọng lượng với quả cam."}, {"id": "STR4", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["rural", "parade", "puppet", "photo"], "answer": 1, "explanation": "\"parade\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈrʊərəl/", "/pəˈreɪd/", "/ˈpʌpɪt/", "/ˈfəʊtəʊ/"], "vis": ["thuộc nông thôn", "cuộc diễu hành", "con rối", "bức ảnh"], "image": null}, {"id": "TR13", "type": "sentence", "q": "The red portrait and the blue portrait are the same.", "starter": "The red portrait is similar", "answer": "to the blue portrait", "accepted": ["to the blue portrait", "to the blue one"], "explanation": "the same = similar to.", "vi": "Bức chân dung đỏ tương tự bức chân dung xanh.", "note": "A and B are the same → A is similar to B"}, {"id": "EX1_9", "type": "fill", "q": "She doesn't take care of babies ______________ my mom. (carefully)", "answer": "as carefully as", "accepted": ["as carefully as", "so carefully as"], "explanation": "Phủ định so sánh bằng: not as/so + carefully + as.", "vi": "Cô ấy không chăm em bé cẩn thận bằng mẹ tôi."}, {"id": "WF12", "type": "fill", "q": "The museum has many ________________ works of art. (value)", "answer": "valuable", "explanation": "Tính từ bổ nghĩa cho \"works of art\": valuable (giá trị).", "vi": "Bảo tàng có nhiều tác phẩm nghệ thuật giá trị."}, {"id": "WF3", "type": "fill", "q": "Her dance ________________ was excellent. (perform)", "answer": "performance", "explanation": "Danh từ ghép: dance performance (buổi biểu diễn múa).", "vi": "Màn biểu diễn múa của cô ấy thật xuất sắc."}, {"id": "EX1_1", "type": "fill", "q": "She is not ______________ her sister. (charming)", "answer": "as charming as", "accepted": ["as charming as", "so charming as"], "explanation": "Phủ định so sánh bằng: not as/so + charming + as.", "vi": "Cô ấy không quyến rũ bằng chị gái."}, {"id": "EX4_1", "type": "mcq", "q": "No one else in the class plays the guitar ______ John.", "options": ["as well", "as far as", "so well as", "as soon as"], "answer": 2, "explanation": "So sánh bằng với trạng từ trong câu phủ định (No one): as/so + well + as.", "vi": "Không ai khác trong lớp chơi ghi-ta hay như John."}, {"id": "MCQ8", "type": "mcq", "q": "The new concert hall is not ______ large as the old one.", "options": ["so", "than", "more", "same"], "answer": 0, "explanation": "Phủ định so sánh bằng: not so/as + adj + as.", "vi": "Phòng hòa nhạc mới không lớn bằng phòng cũ.", "ipas": null, "vis": null, "image": null}, {"id": "EX2_7", "type": "mcq", "q": "Your motorbike has __________ weight as my motorbike.", "options": ["different", "the same"], "answer": 1, "explanation": "\"the same as\" = giống như.", "vi": "Xe máy của bạn có cùng trọng lượng với xe của tôi."}, {"id": "EX4_2", "type": "mcq", "q": "The Brit School is the most famous ______ arts school in Britain.", "options": ["performing", "performance", "perform", "performed"], "answer": 0, "explanation": "\"performing arts\" = nghệ thuật biểu diễn.", "vi": "Trường Brit là trường nghệ thuật biểu diễn nổi tiếng nhất nước Anh."}, {"id": "EX4_13", "type": "mcq", "q": "The group is ______ for their albums and tours around the world.", "options": ["well-knows", "know-how", "well-prepared", "well-known"],
