<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 3 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 3 · Community Service</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["provid<u>ed</u>", "lov<u>ed</u>", "want<u>ed</u>", "visit<u>ed</u>"], "answer": 1, "explanation": "\"loved\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại (kết thúc bằng /t/, /d/) có đuôi \"-ed\" phát âm /ɪd/.", "vi": null, "ipas": ["/prəˈvaɪdɪd/", "/lʌvd/", "/ˈwɒntɪd/", "/ˈvɪzɪtɪd/"], "vis": ["đã cung cấp", "đã yêu", "đã muốn", "đã thăm"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["lik<u>ed</u>", "stay<u>ed</u>", "liv<u>ed</u>", "play<u>ed</u>"], "answer": 0, "explanation": "\"liked\" có đuôi \"-ed\" phát âm /t/ (sau âm vô thanh /k/), ba từ còn lại phát âm /d/.", "vi": null, "ipas": ["/laɪkt/", "/steɪd/", "/lɪvd/", "/pleɪd/"], "vis": ["đã thích", "đã ở lại", "đã sống", "đã chơi"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["plant<u>ed</u>", "flood<u>ed</u>", "paint<u>ed</u>", "clean<u>ed</u>"], "answer": 3, "explanation": "\"cleaned\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /ɪd/.", "vi": null, "ipas": ["/ˈplɑːntɪd/", "/ˈflʌdɪd/", "/ˈpeɪntɪd/", "/kliːnd/"], "vis": ["đã trồng", "bị ngập lụt", "đã sơn", "đã dọn dẹp"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["prepar<u>ed</u>", "stay<u>ed</u>", "book<u>ed</u>", "lov<u>ed</u>"], "answer": 2, "explanation": "\"booked\" có đuôi \"-ed\" phát âm /t/, ba từ còn lại phát âm /d/.", "vi": null, "ipas": ["/prɪˈpeəd/", "/steɪd/", "/bʊkt/", "/lʌvd/"], "vis": ["đã chuẩn bị", "đã ở lại", "đã đặt (vé, phòng)", "đã yêu"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["want<u>ed</u>", "visit<u>ed</u>", "need<u>ed</u>", "open<u>ed</u>"], "answer": 3, "explanation": "\"opened\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /ɪd/.", "vi": null, "ipas": ["/ˈwɒntɪd/", "/ˈvɪzɪtɪd/", "/ˈniːdɪd/", "/ˈəʊpənd/"], "vis": ["đã muốn", "đã thăm", "đã cần", "đã mở"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["wash<u>ed</u>", "practic<u>ed</u>", "clos<u>ed</u>", "jump<u>ed</u>"], "answer": 2, "explanation": "\"closed\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/wɒʃt/", "/ˈpræktɪst/", "/kləʊzd/", "/dʒʌmpt/"], "vis": ["đã rửa", "đã luyện tập", "đã đóng", "đã nhảy"], "image": null}]}, {"key": "stress0", "title": "Stressed syllable", "emoji": "🎯", "vi": "Trọng âm", "items": [{"id": "STR1", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["benefit", "charity", "environment", "government"], "answer": 2, "explanation": "\"environment\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbenɪfɪt/", "/ˈtʃærəti/", "/ɪnˈvaɪrənmənt/", "/ˈɡʌvənmənt/"], "vis": ["lợi ích", "việc từ thiện", "môi trường", "chính phủ"], "image": null}, {"id": "STR2", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["tutor", "sponsor", "shelter", "maintain"], "answer": 3, "explanation": "\"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈtjuːtə/", "/ˈspɒnsə/", "/ˈʃeltə/", "/meɪnˈteɪn/"], "vis": ["gia sư", "nhà tài trợ", "mái ấm", "duy trì"], "image": null}, {"id": "STR3", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["donate", "people", "mural", "public"], "answer": 0, "explanation": "\"donate\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/dəʊˈneɪt/", "/ˈpiːpl/", "/ˈmjʊərəl/", "/ˈpʌblɪk/"], "vis": ["quyên góp", "mọi người", "tranh tường", "công cộng"], "image": null}, {"id": "STR4", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["homeless", "culture", "exact", "provide"], "answer": 2, "explanation": "Lưu ý: câu này trong tài liệu có hai từ nhấn âm 2 (exact /ɪɡˈzækt/ và provide /prəˈvaɪd/); \"homeless\", \"culture\" nhấn âm 1. Đáp án gợi ý: exact.", "vi": null, "ipas": ["/ˈhəʊmləs/", "/ˈkʌltʃə/", "/ɪɡˈzækt/", "/prəˈvaɪd/"], "vis": ["vô gia cư", "văn hóa", "chính xác", "cung cấp"], "image": null}, {"id": "STR5", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["volunteer", "government", "charity", "decorate"], "answer": 0, "explanation": "\"volunteer\" trọng âm rơi vào âm tiết 3, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˌvɒlənˈtɪə/", "/ˈɡʌvənmənt/", "/ˈtʃærəti/", "/ˈdekəreɪt/"], "vis": ["tình nguyện viên", "chính phủ", "việc từ thiện", "trang trí"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "We ______ old textbooks to children in rural areas.", "options": ["see", "play", "buy", "donate"], "answer": 3, "explanation": "\"donate sth to sb\" = quyên góp cho ai.", "vi": "Chúng tôi quyên góp sách giáo khoa cũ cho trẻ em ở vùng nông thôn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ2", "type": "mcq", "q": "She ______ the letter and then read it.", "options": ["opened", "opens", "will open", "is opening"], "answer": 0, "explanation": "Hành động trong quá khứ nối tiếp \"read\" (quá khứ) → opened.", "vi": "Cô ấy mở lá thư rồi đọc nó.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ3", "type": "mcq", "q": "He ______ an English song at the party last Wednesday.", "options": ["sings", "is singing", "sang", "to sing"], "answer": 2, "explanation": "\"last Wednesday\" → quá khứ đơn: sang.", "vi": "Anh ấy hát một bài hát tiếng Anh ở bữa tiệc thứ Tư tuần trước.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ4", "type": "mcq", "q": "Three years ago, my sister and I ______ to Phong Nha Cave with my family.", "options": ["go", "will go", "went", "are going"], "answer": 2, "explanation": "\"Three years ago\" → quá khứ đơn: went.", "vi": "Ba năm trước, chị tôi và tôi đã đi động Phong Nha cùng gia đình.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ5", "type": "mcq", "q": "Mr Buong ______ some apples for the party three weeks ago.", "options": ["buys", "will buy", "bought", "buy"], "answer": 2, "explanation": "\"three weeks ago\" → quá khứ đơn: bought.", "vi": "Ông Buông đã mua vài quả táo cho bữa tiệc ba tuần trước.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ6", "type": "mcq", "q": "Nam and his sister ______ English in class this morning.", "options": ["didn't speak", "don't speak", "aren't speaking", "won't speak"], "answer": 0, "explanation": "\"this morning\" (đã qua) → quá khứ đơn phủ định: didn't speak.", "vi": "Nam và chị gái đã không nói tiếng Anh trong lớp sáng nay.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ7", "type": "mcq", "q": "There ______ ten boys at the party last week.", "options": ["had", "were", "was", "are"], "answer": 1, "explanation": "\"last week\" + danh từ số nhiều → There were.", "vi": "Có mười cậu bé ở bữa tiệc tuần trước.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ8", "type": "mcq", "q": "They often ______ small children in their village.", "options": ["tutor", "tutored", "will tutor", "tutoring"], "answer": 0, "explanation": "\"often\" → hiện tại đơn: tutor (dạy kèm).", "vi": "Họ thường dạy kèm trẻ nhỏ trong làng.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ9", "type": "mcq", "q": "Miss Lien ______ a new car two years ago.", "options": ["has", "had", "is having", "will have"], "answer": 1, "explanation": "\"two years ago\" → quá khứ đơn: had.", "vi": "Cô Liên có một chiếc xe mới hai năm trước.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ10", "type": "mcq", "q": "Nam ______ to class late four weeks ago.", "options": ["went", "is going", "will go", "goes"], "answer": 0, "explanation": "\"four weeks ago\" → quá khứ đơn: went.", "vi": "Nam đã đến lớp muộn bốn tuần trước.", "ipas": null, "vis": null, "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "Tom and his friends ______ the plants in their neighbourhood every weekend.", "options": ["water", "clean", "donate", "pick up"], "answer": 0, "explanation": "\"water the plants\" = tưới cây.", "vi": "Tom và bạn bè tưới cây trong khu phố mỗi cuối tuần.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ12", "type": "mcq", "q": "Be a Buddy has ______ education for street children.", "options": ["given", "spent", "provided", "helped"], "answer": 2, "explanation": "\"provide education for sb\" = cung cấp giáo dục cho ai.", "vi": "Be a Buddy đã cung cấp giáo dục cho trẻ em đường phố.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ13", "type": "mcq", "q": "Mr Buong ______ books for poor children for years.", "options": ["has collected", "collects", "is collecting", "collected"], "answer": 0, "explanation": "\"for years\" → hiện tại hoàn thành: has collected.", "vi": "Ông Buông đã thu thập sách cho trẻ em nghèo trong nhiều năm.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ14", "type": "mcq", "q": "I ______ to work as a volunteer three years ago.", "options": ["started", "was started", "starting", "starts"], "answer": 0, "explanation": "\"three years ago\" → quá khứ đơn: started.", "vi": "Tôi bắt đầu làm tình nguyện viên ba năm trước.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ15", "type": "mcq", "q": "Last year, I ______ to visit a children's village in Yen Bai with my teachers and friends.", "options": ["go", "to go", "goes", "went"], "answer": 3, "explanation": "\"Last year\" → quá khứ đơn: went.", "vi": "Năm ngoái, tôi đã đi thăm một làng trẻ em ở Yên Bái cùng thầy cô và bạn bè.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ16", "type": "mcq", "q": "Last year, our school ______ hundreds of books to children in a rural village.", "options": ["has donated", "donated", "donates", "to donate"], "answer": 1, "explanation": "\"Last year\" → quá khứ đơn: donated.", "vi": "Năm ngoái, trường chúng tôi đã quyên góp hàng trăm cuốn sách cho trẻ em ở một ngôi làng nông thôn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ17", "type": "mcq", "q": "My friends and I ______ the streets in our neighbourhood every summer when we were small.", "options": ["cleaned", "have cleaned", "were cleaning", "cleans"], "answer": 0, "explanation": "\"when we were small\" (thói quen trong quá khứ) → quá khứ đơn: cleaned.", "vi": "Tôi và bạn bè dọn đường phố trong khu phố mỗi mùa hè khi còn nhỏ.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ18", "type": "mcq", "q": "A group of volunteers ______ food to patients in our hospital for three weeks last month.", "options": ["offered", "offer", "has offered", "offering"], "answer": 0, "explanation": "\"last month\" → quá khứ đơn: offered.", "vi": "Một nhóm tình nguyện viên đã phát thức ăn cho bệnh nhân ở bệnh viện chúng tôi trong ba tuần tháng trước.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ19", "type": "mcq", "q": "She became a member of the Peace Corps ______.", "options": ["for two years", "since two years", "two years now", "two years ago"], "answer": 3, "explanation": "\"became\" (quá khứ đơn) đi với \"ago\": two years ago.", "vi": "Cô ấy trở thành thành viên của Peace Corps hai năm trước.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ20", "type": "mcq", "q": "The last time he donated blood ______ ten years ago.", "options": ["am", "is", "were", "was"], "answer": 3, "explanation": "Chủ ngữ số ít \"The last time\" + \"ten years ago\" → was.", "vi": "Lần cuối anh ấy hiến máu là mười năm trước.", "ipas": null, "vis": null, "image": null}]}, {"key": "mcq2", "title": "Vocabulary & Grammar (21-30)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ21", "type": "mcq", "q": "We often ______ clothes and books to homeless people.", "options": ["donate", "establish", "interview", "exchange"], "answer": 0, "explanation": "\"donate sth to sb\" = quyên góp.", "vi": "Chúng tôi thường quyên góp quần áo và sách cho người vô gia cư.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ22", "type": "mcq", "q": "The students joined a ______ activity after the storm.", "options": ["board game", "clean-up", "traffic jam", "coupon"], "answer": 1, "explanation": "\"clean-up activity\" = hoạt động dọn dẹp (sau bão).", "vi": "Các học sinh tham gia hoạt động dọn dẹp sau cơn bão.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ23", "type": "mcq", "q": "Volunteers visited the ______ home to talk with elderly people.", "options": ["nursing", "mountain", "private", "rural"], "answer": 0, "explanation": "\"nursing home\" = viện dưỡng lão.", "vi": "Các tình nguyện viên đến thăm viện dưỡng lão để trò chuyện với người cao tuổi.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ24", "type": "mcq", "q": "A person who gives time freely to help other people is a ______.", "options": ["sponsor", "mentor", "volunteer", "teenager"], "answer": 2, "explanation": "\"volunteer\" = tình nguyện viên.", "vi": "Người dành thời gian giúp đỡ người khác một cách tự nguyện là tình nguyện viên.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ25", "type": "mcq", "q": "The charity provides food and clothes for ______ people.", "options": ["exact", "homeless", "public", "proud"], "answer": 1, "explanation": "\"homeless people\" = người vô gia cư.", "vi": "Tổ chức từ thiện cung cấp thức ăn và quần áo cho người vô gia cư.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ26", "type": "mcq", "q": "Students can ______ trees in the school yard to make it greener.", "options": ["serve", "plant", "sort", "force"], "answer": 1, "explanation": "\"plant trees\" = trồng cây.", "vi": "Học sinh có thể trồng cây trong sân trường để sân xanh hơn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ27", "type": "mcq", "q": "Our club wants to ______ money for children in need.", "options": ["raise", "pay", "relate", "flood"], "answer": 0, "explanation": "\"raise money\" = gây quỹ.", "vi": "Câu lạc bộ chúng tôi muốn gây quỹ cho trẻ em khó khăn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ28", "type": "mcq", "q": "A non-profit organization does not work mainly for ______.", "options": ["culture", "population", "profit", "dirt"], "answer": 2, "explanation": "non-profit = phi lợi nhuận → không vì lợi nhuận (profit).", "vi": "Tổ chức phi lợi nhuận không hoạt động chủ yếu vì lợi nhuận.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ29", "type": "mcq", "q": "Community service helps students develop useful ______.", "options": ["skills", "coupons", "statistics", "blankets"], "answer": 0, "explanation": "\"develop skills\" = phát triển kỹ năng.", "vi": "Dịch vụ cộng đồng giúp học sinh phát triển các kỹ năng hữu ích.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ30", "type": "mcq", "q": "We should ______ the books before giving them to children.", "options": ["sponsor", "provide", "sort", "establish"], "answer": 2, "explanation": "\"sort\" = phân loại.", "vi": "Chúng ta nên phân loại sách trước khi trao cho trẻ em.", "ipas": null, "vis": null, "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "Students do lots of ________________ activities to help poor families. (effect)", "answer": "effective", "explanation": "Tính từ bổ nghĩa cho \"activities\": effective (hiệu quả).", "vi": "Học sinh làm nhiều hoạt động hiệu quả để giúp các gia đình nghèo."}, {"id": "WF2", "type": "fill", "q": "The shelter received a large ________________ of clothes from local people. (donate)", "answer": "donation", "explanation": "Sau \"a large\" cần danh từ: donation (khoản quyên góp).", "vi": "Mái ấm nhận được một khoản quyên góp quần áo lớn từ người dân địa phương."}, {"id": "WF3", "type": "fill", "q": "She works for a big ________________ in our city. (organize)", "answer": "organization", "explanation": "Sau \"a big\" cần danh từ: organization (tổ chức).", "vi": "Cô ấy làm việc cho một tổ chức lớn ở thành phố chúng tôi."}, {"id": "WF4", "type": "fill", "q": "There is a ________________ between Jack and Sue. (differ)", "answer": "difference", "explanation": "Sau \"a\" cần danh từ: difference (sự khác biệt).", "vi": "Có một sự khác biệt giữa Jack và Sue."}, {"id": "WF5", "type": "fill", "q": "Be _____________ when you cross the streets. (care)", "answer": "careful", "explanation": "Sau \"Be\" cần tính từ: careful.", "vi": "Hãy cẩn thận khi băng qua đường."}, {"id": "WF6", "type": "fill", "q": "The students cleaned the school yard ________________. (care)", "answer": "carefully", "explanation": "Trạng từ bổ nghĩa cho \"cleaned\": carefully.", "vi": "Các học sinh dọn sân trường một cách cẩn thận."}, {"id": "WF7", "type": "fill", "q": "Many teenagers take part in ________________ work at weekends. (volunteer)", "answer": "voluntary", "explanation": "Tính từ bổ nghĩa cho \"work\": voluntary (tình nguyện); cũng chấp nhận \"volunteer work\".", "vi": "Nhiều thanh thiếu niên tham gia công việc tình nguyện vào cuối tuần."}, {"id": "WF8", "type": "fill", "q": "Charitable activity is very ________________ to street children. (help)", "answer": "helpful", "explanation": "Tính từ sau \"very\": helpful (hữu ích).", "vi": "Hoạt động từ thiện rất hữu ích với trẻ em đường phố."}, {"id": "WF9", "type": "fill", "q": "Our book ________________ grew quickly after the school campaign. (collect)", "answer": "collection", "explanation": "Danh từ ghép: book collection (bộ sưu tập sách).", "vi": "Bộ sưu tập sách của chúng tôi tăng nhanh sau chiến dịch của trường."}, {"id": "WF10", "type": "fill", "q": "Community service helps the personal ________________ of young people. (develop)", "answer": "development", "explanation": "Sau tính từ \"personal\" cần danh từ: development (sự phát triển).", "vi": "Dịch vụ cộng đồng giúp cho sự phát triển cá nhân của người trẻ."}, {"id": "WF11", "type": "fill", "q": "The club works for environmental ________________. (protect)", "answer": "protection", "explanation": "Sau tính từ \"environmental\" cần danh từ: protection (sự bảo vệ).", "vi": "Câu lạc bộ hoạt động vì việc bảo vệ môi trường."}, {"id": "WF12", "type": "fill", "q": "The clean-up campaign was very ________________ in our neighbourhood. (effect)", "answer": "effective", "explanation": "Tính từ sau \"very\": effective.", "vi": "Chiến dịch dọn dẹp rất hiệu quả ở khu phố chúng tôi."}, {"id": "WF13", "type": "fill", "q": "Some students give food to ________________ people in the city. (home)", "answer": "homeless", "explanation": "Tính từ bổ nghĩa cho \"people\": homeless (vô gia cư).", "vi": "Một số học sinh phát thức ăn cho người vô gia cư trong thành phố."}, {"id": "WF14", "type": "fill", "q": "A lot of people volunteer to ________________ the environment. (protect)", "answer": "protect", "explanation": "Sau \"to\" cần động từ nguyên thể: protect.", "vi": "Nhiều người tình nguyện bảo vệ môi trường."}, {"id": "WF15", "type": "fill", "q": "We learned about ________________ differences through the project. (culture)", "answer": "cultural", "explanation": "Tính từ bổ nghĩa cho \"differences\": cultural (thuộc văn hóa).", "vi": "Chúng tôi học về những khác biệt văn hóa qua dự án."}]}, {"key": "readingA", "title": "Passage 1: Blood Donation", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "(1) Millions of people ______ blood after accidents.", "options": ["need", "needs", "needed", "needing"], "answer": 0, "explanation": "Chủ ngữ số nhiều \"Millions of people\" + hiện tại đơn → need.", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "(2) Donors do not ask for any ______.", "options": ["reward", "skill", "culture", "coupon"], "answer": 0, "explanation": "Hiến máu tự nguyện → không đòi phần thưởng (reward).", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "(3) Science can make many medicines, ______ it cannot manufacture human blood.", "options": ["and", "but", "so", "or"], "answer": 1, "explanation": "Ý tương phản → but.", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "(4) People who need blood must receive it ______ other people.", "options": ["at", "on", "from", "with"], "answer": 2, "explanation": "\"receive sth from sb\" = nhận từ ai.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "(5) It can save the ______ of patients.", "options": ["lives", "life", "living", "alive"], "answer": 0, "explanation": "\"save the lives of patients\" = cứu mạng sống (số nhiều) của các bệnh nhân.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "(6) A generous way to ______ others.", "options": ["help", "helps", "helping", "helped"], "answer": 0, "explanation": "Sau \"to\" cần động từ nguyên thể: help.", "vi": null}], "passage": "Blood donation is one of the most valuable forms of community service. Millions of people <span class='blank-tag'>(1)</span> ______ blood after accidents, burns, or operations. Voluntary blood donors give their blood freely and do not ask for any <span class='blank-tag'>(2)</span> ______. Their donations help hospitals keep a safe blood supply for emergencies. Modern science can make many medicines, <span class='blank-tag'>(3)</span> ______ it cannot manufacture human blood in a laboratory. For this reason, people who need blood must receive it <span class='blank-tag'>(4)</span> ______ other people. Donating blood is generally safe for healthy donors, and it can save the <span class='blank-tag'>(5)</span> ______ of patients. A person who donates today may need blood in the future, so blood donation is a social responsibility and a generous way to <span class='blank-tag'>(6)</span> ______ others."}, {"key": "readingB", "title": "Passage 2: The Peace Corps", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGB1", "type": "mcq", "q": "(1) The Peace Corps ______ one of the most famous volunteer organizations.", "options": ["is", "does", "are", "were"], "answer": 0, "explanation": "Chủ ngữ số ít (tên tổ chức) + hiện tại đơn → is.", "vi": null}, {"id": "READINGB2", "type": "mcq", "q": "(2) People who work in this ______ are called volunteers.", "options": ["organization", "orphanage", "shelter", "government"], "answer": 0, "explanation": "Peace Corps là một tổ chức (organization).", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "(3) They share useful ______ with local communities.", "options": ["skills", "coupons", "blankets", "profits"], "answer": 0, "explanation": "\"share useful skills\" = chia sẻ kỹ năng hữu ích.", "vi": null}, {"id": "READINGB4", "type": "mcq", "q": "(4) Some volunteers work as ______ at schools.", "options": ["teachers", "sponsors", "patients", "donors"], "answer": 0, "explanation": "Làm việc ở trường học → giáo viên (teachers).", "vi": null}, {"id": "READINGB5", "type": "mcq", "q": "(5) People from different countries ______ cultures.", "options": ["but", "because", "and", "so"], "answer": 2, "explanation": "Liệt kê: countries and cultures.", "vi": null}, {"id": "READINGB6", "type": "mcq", "q": "(6) A better understanding ______ the people they met.", "options": ["of", "for", "at", "from"], "answer": 0, "explanation": "\"understanding of\" = sự hiểu biết về.", "vi": null}], "passage": "The Peace Corps <span class='blank-tag'>(1)</span> ______ one of the most famous volunteer organizations in the world. It was established in 1961 in the United States. People who work in this <span class='blank-tag'>(2)</span> ______ are called volunteers. They live and work in other countries for a period of time and share useful <span class='blank-tag'>(3)</span> ______ with local communities. Some volunteers work as <span class='blank-tag'>(4)</span> ______ at schools, while others help protect the environment, improve health, or support farmers. The Peace Corps also helps build understanding between people from different countries <span class='blank-tag'>(5)</span> ______ cultures. When volunteers return home, they often bring back new experiences and a better understanding <span class='blank-tag'>(6)</span> ______ the people they met."}, {"key": "tfA", "title": "Passage 1: Young Volunteers", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "Some students volunteer in hospitals, orphanages, or homes for the elderly.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly\" → Đúng.", "vi": "Một số học sinh làm tình nguyện ở bệnh viện, trại trẻ mồ côi hoặc viện dưỡng lão."}, {"id": "TFA2", "type": "mcq", "q": "Young volunteers only read books to the people they help.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: họ còn thăm hỏi, chơi trò chơi, lắng nghe... → không chỉ đọc sách → Sai.", "vi": "Tình nguyện viên trẻ chỉ đọc sách cho những người họ giúp."}, {"id": "TFA3", "type": "mcq", "q": "Big Brothers helps some boys who do not have fathers.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"For boys who do not have fathers, an organization called Big Brothers helps them\" → Đúng.", "vi": "Big Brothers giúp một số cậu bé không có cha."}, {"id": "TFA4", "type": "mcq", "q": "Clubs never use students as volunteers.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"These clubs often use student volunteers\" → Sai.", "vi": "Các câu lạc bộ không bao giờ dùng học sinh làm tình nguyện viên."}, {"id": "TFA5", "type": "mcq", "q": "What can volunteers do in the homes of people who are sick or old?", "options": ["Clean or repair their houses.", "Sell them tickets.", "Teach them to drive.", "Build new schools."], "answer": 0, "explanation": "Bài đọc: \"They paint, clean up, or repair houses\".", "vi": "Tình nguyện viên có thể làm gì tại nhà của người ốm hoặc già?"}, {"id": "TFA6", "type": "mcq", "q": "Why do many clubs use students as volunteers?", "options": ["They have no homework.", "They understand younger children.", "They are paid well.", "They own the clubs."], "answer": 1, "explanation": "Bài đọc: \"because young volunteers can understand the problems of younger children\".", "vi": "Tại sao nhiều câu lạc bộ dùng học sinh làm tình nguyện viên?"}], "passage": "Each country has many good people who take care of others. In the United States, some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly. They read books to people, visit them, play games with them, or listen to their problems. Other young volunteers work in the homes of people who are sick or old. They paint, clean up, or repair houses and do the shopping. For boys who do not have fathers, an organization called Big Brothers helps them by taking them to basketball games or on fishing trips. Many cities also have clubs where boys and girls can play games, watch films, or take short trips. These clubs often use student volunteers because young volunteers can understand the problems of younger children."}, {"key": "tfB", "title": "Passage 2: Community Service and Students", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFB1", "type": "mcq", "q": "Students often do community service as volunteers.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Students who choose community service usually work as volunteers\" → Đúng.", "vi": "Học sinh thường làm dịch vụ cộng đồng với tư cách tình nguyện viên."}, {"id": "TFB2", "type": "mcq", "q": "Community service can help students develop useful skills.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"It can help them develop useful skills\" → Đúng.", "vi": "Dịch vụ cộng đồng có thể giúp học sinh phát triển kỹ năng hữu ích."}, {"id": "TFB3", "type": "mcq", "q": "No students choose to volunteer their free time through community service.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nói nhiều học sinh chọn làm tình nguyện → Sai.", "vi": "Không học sinh nào chọn làm tình nguyện qua dịch vụ cộng đồng."}, {"id": "TFB4", "type": "mcq", "q": "Joining a non-profit organization is the only way to do community service.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"There are many ways for students to volunteer\" → không phải cách duy nhất → Sai.", "vi": "Tham gia tổ chức phi lợi nhuận là cách duy nhất để làm dịch vụ cộng đồng."}, {"id": "TFB5", "type": "mcq", "q": "Which is one way students can do community service?", "options": ["Join a non-profit organization.", "Avoid other people.", "Stay home all day.", "Stop all school activities."], "answer": 0, "explanation": "Bài đọc: \"They can join a non-profit organization\".", "vi": "Đâu là một cách học sinh có thể làm dịch vụ cộng đồng?"}, {"id": "TFB6", "type": "mcq", "q": "What can students learn from community service?", "options": ["Responsibility.", "How to make a profit.", "How to avoid work.", "How to spend more money."], "answer": 0, "explanation": "Bài đọc: \"students can learn responsibility\".", "vi": "Học sinh có thể học được gì từ dịch vụ cộng đồng?"}], "passage": "Community service is work that people do for free to help the public or their community. Students who choose community service usually work as volunteers because they want to help others. Community service can have many positive effects on students. It can help them develop useful skills, meet new people, and improve the quality of life of others. There are many ways for students to volunteer. They can join a non-profit organization, work with a community group, or create their own service project. Volunteer work can be simple, such as helping coach a school football team, or more difficult, such as starting a project to support homeless people. Whatever activity they choose, students can learn responsibility and understand their community better."}, {"key": "transform0", "title": "Sentence Transformation", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>this Sunday./ should/ for/ old people/ We/ clean the house/</b>", "starter": "", "answer": "We should clean the house for old people this Sunday.", "accepted": null, "explanation": "S + should + V + O + for sb + time.", "vi": "Chúng ta nên dọn nhà cho người già vào Chủ nhật này.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR2", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>the streets/ Last week,/ my class/ volunteered/ in our neighbourhood./ to clean/</b>", "starter": "", "answer": "Last week, my class volunteered to clean the streets in our neighbourhood.", "accepted": null, "explanation": "Time, S + volunteered to + V + O + place.", "vi": "Tuần trước, lớp tôi đã tình nguyện dọn đường phố trong khu phố của chúng tôi.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR3", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>should/ and hungry/ We/ people./ cold/ help/</b>", "starter": "", "answer": "We should help cold and hungry people.", "accepted": null, "explanation": "S + should + help + adj + N.", "vi": "Chúng ta nên giúp những người đang lạnh và đói.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR4", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>homeless people./ We/ cook meals/ and bring them to/ can/</b>", "starter": "", "answer": "We can cook meals and bring them to homeless people.", "accepted": null, "explanation": "S + can + V1 + and + V2 + O.", "vi": "Chúng ta có thể nấu ăn và mang đến cho người vô gia cư.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR5", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>old books and clothes/ Every year,/ we/ to help/ collect/ poor children./</b>", "starter": "", "answer": "Every year, we collect old books and clothes to help poor children.", "accepted": null, "explanation": "Time, S + V + O + to V (mục đích).", "vi": "Mỗi năm, chúng tôi thu gom sách và quần áo cũ để giúp trẻ em nghèo.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"donate\"] A. Every winter, our class ________________ warm clothes to homeless people.", "answer": "donates", "explanation": "Dựa vào ví dụ: donates. Chủ ngữ \"our class\" số ít.", "vi": "Mỗi mùa đông, lớp chúng tôi quyên góp quần áo ấm cho người vô gia cư."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"donate\"] B. After the flood, many volunteers ________________ food and blankets to the victims.", "answer": "donated", "explanation": "Dựa vào ví dụ, thì quá khứ: donated.", "vi": "Sau trận lũ, nhiều tình nguyện viên đã quyên góp thức ăn và chăn màn cho các nạn nhân."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"volunteer\"] A. Every Saturday, she ________________ at the local nursing home.", "answer": "volunteers", "explanation": "Dựa vào ví dụ: volunteers at the animal shelter.", "vi": "Mỗi thứ Bảy, cô ấy tình nguyện ở viện dưỡng lão địa phương."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"volunteer\"] B. Last month, hundreds of ________________ helped clean up the river.", "answer": "volunteers", "explanation": "Dựa vào ví dụ: Hundreds of volunteers.", "vi": "Tháng trước, hàng trăm tình nguyện viên đã giúp dọn dẹp con sông."}]}, {"key": "pictures", "title": "Pictures & Signs", "emoji": "🚦", "vi": "Biển báo", "items": [{"id": "PIC1", "type": "mcq", "q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-green-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🌱🌳</div><p class=\"text-[11px] font-black text-center text-green-700 leading-tight\">PLANT MORE TREES</p></div>", "options": ["We should plant more trees.", "We should sell more trees.", "We should use more trees.", "We should buy more trees."], "answer": 0, "explanation": "Biển có hình cây xanh và bàn tay trồng cây → kêu gọi trồng thêm cây.", "vi": null}, {"id": "PIC2", "type": "mcq", "q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🏍️🚫</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO MOTORBIKES</p></div>", "options": ["Mustn't ride a motorbike.", "Mustn't use a vehicle.", "Mustn't drive a car.", "Mustn't ride a bike."], "answer": 0, "explanation": "Biển có hình xe máy bị gạch chéo → cấm đi xe máy.", "vi": null}, {"id": "PIC3", "type": "mcq", "q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">👨‍👧</div><p class=\"text-[11px] font-black text-center text-amber-700 leading-tight\">CHILDREN MUST BE WITH AN ADULT</p></div>", "options": ["Children can't play in this area.", "Children can enter this area with their parents.", "Only children can enter this place.", "Children can enter this place alone."], "answer": 1, "explanation": "Biển có hình người lớn nắm tay trẻ em → trẻ em phải đi cùng bố mẹ.", "vi": null}]}, {"key": "extra0_0", "title": "Quá khứ đơn (1-10)", "emoji": "🧩", "vi": "Past Simple: Chia động từ", "items": [{"id": "EX0_1", "type": "fill", "q": "Our class __________ the park last Sunday. (clean)", "answer": "cleaned", "accepted": null, "explanation": "\"last Sunday\" → quá khứ đơn: cleaned.", "vi": "Lớp chúng tôi đã dọn công viên Chủ nhật tuần trước."}, {"id": "EX0_2", "type": "fill", "q": "The students __________ some new trees in the school yard last week. (plant)", "answer": "planted", "accepted": null, "explanation": "\"last week\" → quá khứ đơn: planted.", "vi": "Các học sinh đã trồng vài cây mới trong sân trường tuần trước."}, {"id": "EX0_3", "type": "fill", "q": "We __________ old books and clothes for poor children last month. (collect)", "answer": "collected", "accepted": null, "explanation": "\"last month\" → quá khứ đơn: collected.", "vi": "Chúng tôi đã thu gom sách và quần áo cũ cho trẻ em nghèo tháng trước."}, {"id": "EX0_4", "type": "fill", "q": "We __________ at the nursing home last Saturday. (be)", "answer": "were", "accepted": null, "explanation": "Chủ ngữ \"We\" + quá khứ → were.", "vi": "Chúng tôi đã ở viện dưỡng lão thứ Bảy tuần trước."}, {"id": "EX0_5", "type": "fill", "q": "Miss Nga __________ at school yesterday. (not be)", "answer": "wasn't", "accepted": ["wasn't", "was not"], "explanation": "Chủ ngữ số ít, phủ định quá khứ → wasn't.", "vi": "Cô Nga đã không ở trường hôm qua."}, {"id": "EX0_6", "type": "fill", "q": "Our club __________ elderly people with their housework last weekend. (help)", "answer": "helped", "accepted": null, "explanation": "\"last weekend\" → quá khứ đơn: helped.", "vi": "Câu lạc bộ chúng tôi đã giúp người cao tuổi làm việc nhà cuối tuần trước."}, {"id": "EX0_7", "type": "fill", "q": "My class __________ an orphanage two weeks ago. (visit)", "answer": "visited", "accepted": null, "explanation": "\"two weeks ago\" → quá khứ đơn: visited.", "vi": "Lớp tôi đã thăm một trại trẻ mồ côi hai tuần trước."}, {"id": "EX0_8", "type": "fill", "q": "They __________ up trash around their school two days ago. (pick)", "answer": "picked", "accepted": null, "explanation": "\"two days ago\" → quá khứ đơn: picked (up).", "vi": "Họ đã nhặt rác quanh trường hai ngày trước."}, {"id": "EX0_9", "type": "fill", "q": "Nam __________ to the community centre yesterday. (go)", "answer": "went", "accepted": null, "explanation": "\"yesterday\" → quá khứ đơn bất quy tắc: go → went.", "vi": "Nam đã đến trung tâm cộng đồng hôm qua."}, {"id": "EX0_10", "type": "fill", "q": "My mother __________ meals for homeless people last Sunday. (cook)", "answer": "cooked", "accepted": null, "explanation": "\"last Sunday\" → quá khứ đơn: cooked.", "vi": "Mẹ tôi đã nấu ăn cho người vô gia cư Chủ nhật tuần trước."}]}, {"key": "extra0_1", "title": "Quá khứ đơn (11-15)", "emoji": "🧩", "vi": "Past Simple: Chia động từ", "items": [{"id": "EX0_11", "type": "fill", "q": "We __________ money for the charity last month. (not collect)", "answer": "didn't collect", "accepted": ["didn't collect", "did not collect"], "explanation": "Phủ định quá khứ đơn: didn't + V nguyên thể.", "vi": "Chúng tôi đã không quyên tiền cho tổ chức từ thiện tháng trước."}, {"id": "EX0_12", "type": "fill", "q": "Lan __________ the nursing home yesterday. (not visit)", "answer": "didn't visit", "accepted": ["didn't visit", "did not visit"], "explanation": "Phủ định quá khứ đơn: didn't + V nguyên thể.", "vi": "Lan đã không thăm viện dưỡng lão hôm qua."}, {"id": "EX0_13", "type": "fill", "q": "__________ your class __________ to the orphanage last weekend? (go)", "answer": "Did ... go", "accepted": ["Did ... go", "did go"], "explanation": "Câu hỏi quá khứ đơn: Did + S + V nguyên thể? (nhập: Did / go)", "vi": "Lớp bạn có đi đến trại trẻ mồ côi cuối tuần trước không?"}, {"id": "EX0_14", "type": "fill", "q": "__________ they at the community centre yesterday? (be)", "answer": "Were", "accepted": null, "explanation": "Câu hỏi với to be quá khứ, chủ ngữ \"they\" → Were.", "vi": "Hôm qua họ có ở trung tâm cộng đồng không?"}, {"id": "EX0_15", "type": "fill", "q": "__________ Mai __________ meals for homeless people last Sunday? (cook)", "answer": "Did ... cook", "accepted": ["Did ... cook", "did cook"], "explanation": "Câu hỏi quá khứ đơn: Did + S + V nguyên thể? (nhập: Did / cook)", "vi": "Mai có nấu ăn cho người vô gia cư Chủ nhật tuần trước không?"}]}], "total": 107, "examPapers": [[{"id": "TFB4", "type": "mcq", "q": "Joining a non-profit organization is the only way to do community service.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"There are many ways for students to volunteer\" → không phải cách duy nhất → Sai.", "vi": "Tham gia tổ chức phi lợi nhuận là cách duy nhất để làm dịch vụ cộng đồng.", "passage": "Community service is work that people do for free to help the public or their community. Students who choose community service usually work as volunteers because they want to help others. Community service can have many positive effects on students. It can help them develop useful skills, meet new people, and improve the quality of life of others. There are many ways for students to volunteer. They can join a non-profit organization, work with a community group, or create their own service project. Volunteer work can be simple, such as helping coach a school football team, or more difficult, such as starting a project to support homeless people. Whatever activity they choose, students can learn responsibility and understand their community better."}, {"id": "READINGA2", "type": "mcq", "q": "(2) Donors do not ask for any ______.", "options": ["reward", "skill", "culture", "coupon"], "answer": 0, "explanation": "Hiến máu tự nguyện → không đòi phần thưởng (reward).", "vi": null, "passage": "Blood donation is one of the most valuable forms of community service. Millions of people <span class='blank-tag'>(1)</span> ______ blood after accidents, burns, or operations. Voluntary blood donors give their blood freely and do not ask for any <span class='blank-tag'>(2)</span> ______. Their donations help hospitals keep a safe blood supply for emergencies. Modern science can make many medicines, <span class='blank-tag'>(3)</span> ______ it cannot manufacture human blood in a laboratory. For this reason, people who need blood must receive it <span class='blank-tag'>(4)</span> ______ other people. Donating blood is generally safe for healthy donors, and it can save the <span class='blank-tag'>(5)</span> ______ of patients. A person who donates today may need blood in the future, so blood donation is a social responsibility and a generous way to <span class='blank-tag'>(6)</span> ______ others."}, {"id": "PRON2", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["lik<u>ed</u>", "stay<u>ed</u>", "liv<u>ed</u>", "play<u>ed</u>"], "answer": 0, "explanation": "\"liked\" có đuôi \"-ed\" phát âm /t/ (sau âm vô thanh /k/), ba từ còn lại phát âm /d/.", "vi": null, "ipas": ["/laɪkt/", "/steɪd/", "/lɪvd/", "/pleɪd/"], "vis": ["đã thích", "đã ở lại", "đã sống", "đã chơi"], "image": null}, {"id": "MCQ27", "type": "mcq", "q": "Our club wants to ______ money for children in need.", "options": ["raise", "pay", "relate", "flood"], "answer": 0, "explanation": "\"raise money\" = gây quỹ.", "vi": "Câu lạc bộ chúng tôi muốn gây quỹ cho trẻ em khó khăn.", "ipas": null, "vis": null, "image": null}, {"id": "TFA3", "type": "mcq", "q": "Big Brothers helps some boys who do not have fathers.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"For boys who do not have fathers, an organization called Big Brothers helps them\" → Đúng.", "vi": "Big Brothers giúp một số cậu bé không có cha.", "passage": "Each country has many good people who take care of others. In the United States, some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly. They read books to people, visit them, play games with them, or listen to their problems. Other young volunteers work in the homes of people who are sick or old. They paint, clean up, or repair houses and do the shopping. For boys who do not have fathers, an organization called Big Brothers helps them by taking them to basketball games or on fishing trips. Many cities also have clubs where boys and girls can play games, watch films, or take short trips. These clubs often use student volunteers because young volunteers can understand the problems of younger children."}, {"id": "PRON5", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["want<u>ed</u>", "visit<u>ed</u>", "need<u>ed</u>", "open<u>ed</u>"], "answer": 3, "explanation": "\"opened\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /ɪd/.", "vi": null, "ipas": ["/ˈwɒntɪd/", "/ˈvɪzɪtɪd/", "/ˈniːdɪd/", "/ˈəʊpənd/"], "vis": ["đã muốn", "đã thăm", "đã cần", "đã mở"], "image": null}, {"id": "PRON6", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["wash<u>ed</u>", "practic<u>ed</u>", "clos<u>ed</u>", "jump<u>ed</u>"], "answer": 2, "explanation": "\"closed\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/wɒʃt/", "/ˈpræktɪst/", "/kləʊzd/", "/dʒʌmpt/"], "vis": ["đã rửa", "đã luyện tập", "đã đóng", "đã nhảy"], "image": null}, {"id": "MCQ6", "type": "mcq", "q": "Nam and his sister ______ English in class this morning.", "options": ["didn't speak", "don't speak", "aren't speaking", "won't speak"], "answer": 0, "explanation": "\"this morning\" (đã qua) → quá khứ đơn phủ định: didn't speak.", "vi": "Nam và chị gái đã không nói tiếng Anh trong lớp sáng nay.", "ipas": null, "vis": null, "image": null}, {"id": "EX0_4", "type": "fill", "q": "We __________ at the nursing home last Saturday. (be)", "answer": "were", "accepted": null, "explanation": "Chủ ngữ \"We\" + quá khứ → were.", "vi": "Chúng tôi đã ở viện dưỡng lão thứ Bảy tuần trước."}, {"id": "TFA4", "type": "mcq", "q": "Clubs never use students as volunteers.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"These clubs often use student volunteers\" → Sai.", "vi": "Các câu lạc bộ không bao giờ dùng học sinh làm tình nguyện viên.", "passage": "Each country has many good people who take care of others. In the United States, some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly. They read books to people, visit them, play games with them, or listen to their problems. Other young volunteers work in the homes of people who are sick or old. They paint, clean up, or repair houses and do the shopping. For boys who do not have fathers, an organization called Big Brothers helps them by taking them to basketball games or on fishing trips. Many cities also have clubs where boys and girls can play games, watch films, or take short trips. These clubs often use student volunteers because young volunteers can understand the problems of younger children."}, {"id": "WF14", "type": "fill", "q": "A lot of people volunteer to ________________ the environment. (protect)", "answer": "protect", "explanation": "Sau \"to\" cần động từ nguyên thể: protect.", "vi": "Nhiều người tình nguyện bảo vệ môi trường."}, {"id": "TFB6", "type": "mcq", "q": "What can students learn from community service?", "options": ["Responsibility.", "How to make a profit.", "How to avoid work.", "How to spend more money."], "answer": 0, "explanation": "Bài đọc: \"students can learn responsibility\".", "vi": "Học sinh có thể học được gì từ dịch vụ cộng đồng?", "passage": "Community service is work that people do for free to help the public or their community. Students who choose community service usually work as volunteers because they want to help others. Community service can have many positive effects on students. It can help them develop useful skills, meet new people, and improve the quality of life of others. There are many ways for students to volunteer. They can join a non-profit organization, work with a community group, or create their own service project. Volunteer work can be simple, such as helping coach a school football team, or more difficult, such as starting a project to support homeless people. Whatever activity they choose, students can learn responsibility and understand their community better."}, {"id": "READINGA3", "type": "mcq", "q": "(3) Science can make many medicines, ______ it cannot manufacture human blood.", "options": ["and", "but", "so", "or"], "answer": 1, "explanation": "Ý tương phản → but.", "vi": null, "passage": "Blood donation is one of the most valuable forms of community service. Millions of people <span class='blank-tag'>(1)</span> ______ blood after accidents, burns, or operations. Voluntary blood donors give their blood freely and do not ask for any <span class='blank-tag'>(2)</span> ______. Their donations help hospitals keep a safe blood supply for emergencies. Modern science can make many medicines, <span class='blank-tag'>(3)</span> ______ it cannot manufacture human blood in a laboratory. For this reason, people who need blood must receive it <span class='blank-tag'>(4)</span> ______ other people. Donating blood is generally safe for healthy donors, and it can save the <span class='blank-tag'>(5)</span> ______ of patients. A person who donates today may need blood in the future, so blood donation is a social responsibility and a generous way to <span class='blank-tag'>(6)</span> ______ others."}, {"id": "MCQ15", "type": "mcq", "q": "Last year, I ______ to visit a children's village in Yen Bai with my teachers and friends.", "options": ["go", "to go", "goes", "went"], "answer": 3, "explanation": "\"Last year\" → quá khứ đơn: went.", "vi": "Năm ngoái, tôi đã đi thăm một làng trẻ em ở Yên Bái cùng thầy cô và bạn bè.", "ipas": null, "vis": null, "image": null}, {"id": "EX0_7", "type": "fill", "q": "My class __________ an orphanage two weeks ago. (visit)", "answer": "visited", "accepted": null, "explanation": "\"two weeks ago\" → quá khứ đơn: visited.", "vi": "Lớp tôi đã thăm một trại trẻ mồ côi hai tuần trước."}, {"id": "WF2", "type": "fill", "q": "The shelter received a large ________________ of clothes from local people. (donate)", "answer": "donation", "explanation": "Sau \"a large\" cần danh từ: donation (khoản quyên góp).", "vi": "Mái ấm nhận được một khoản quyên góp quần áo lớn từ người dân địa phương."}, {"id": "TR1", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>this Sunday./ should/ for/ old people/ We/ clean the house/</b>", "starter": "", "answer": "We should clean the house for old people this Sunday.", "accepted": null, "explanation": "S + should + V + O + for sb + time.", "vi": "Chúng ta nên dọn nhà cho người già vào Chủ nhật này.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "MCQ11", "type": "mcq", "q": "Tom and his friends ______ the plants in their neighbourhood every weekend.", "options": ["water", "clean", "donate", "pick up"], "answer": 0, "explanation": "\"water the plants\" = tưới cây.", "vi": "Tom và bạn bè tưới cây trong khu phố mỗi cuối tuần.", "ipas": null, "vis": null, "image": null}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"donate\"] B. After the flood, many volunteers ________________ food and blankets to the victims.", "answer": "donated", "explanation": "Dựa vào ví dụ, thì quá khứ: donated.", "vi": "Sau trận lũ, nhiều tình nguyện viên đã quyên góp thức ăn và chăn màn cho các nạn nhân."}, {"id": "MCQ14", "type": "mcq", "q": "I ______ to work as a volunteer three years ago.", "options": ["started", "was started", "starting", "starts"], "answer": 0, "explanation": "\"three years ago\" → quá khứ đơn: started.", "vi": "Tôi bắt đầu làm tình nguyện viên ba năm trước.", "ipas": null, "vis": null, "image": null}, {"id": "STR2", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["tutor", "sponsor", "shelter", "maintain"], "answer": 3, "explanation": "\"maintain\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈtjuːtə/", "/ˈspɒnsə/", "/ˈʃeltə/", "/meɪnˈteɪn/"], "vis": ["gia sư", "nhà tài trợ", "mái ấm", "duy trì"], "image": null}, {"id": "TFB5", "type": "mcq", "q": "Which is one way students can do community service?", "options": ["Join a non-profit organization.", "Avoid other people.", "Stay home all day.", "Stop all school activities."], "answer": 0, "explanation": "Bài đọc: \"They can join a non-profit organization\".", "vi": "Đâu là một cách học sinh có thể làm dịch vụ cộng đồng?", "passage": "Community service is work that people do for free to help the public or their community. Students who choose community service usually work as volunteers because they want to help others. Community service can have many positive effects on students. It can help them develop useful skills, meet new people, and improve the quality of life of others. There are many ways for students to volunteer. They can join a non-profit organization, work with a community group, or create their own service project. Volunteer work can be simple, such as helping coach a school football team, or more difficult, such as starting a project to support homeless people. Whatever activity they choose, students can learn responsibility and understand their community better."}, {"id": "MCQ29", "type": "mcq", "q": "Community service helps students develop useful ______.", "options": ["skills", "coupons", "statistics", "blankets"], "answer": 0, "explanation": "\"develop skills\" = phát triển kỹ năng.", "vi": "Dịch vụ cộng đồng giúp học sinh phát triển các kỹ năng hữu ích.", "ipas": null, "vis": null, "image": null}, {"id": "EX0_2", "type": "fill", "q": "The students __________ some new trees in the school yard last week. (plant)", "answer": "planted", "accepted": null, "explanation": "\"last week\" → quá khứ đơn: planted.", "vi": "Các học sinh đã trồng vài cây mới trong sân trường tuần trước."}, {"id": "EX0_13", "type": "fill", "q": "__________ your class __________ to the orphanage last weekend? (go)", "answer": "Did ... go", "accepted": ["Did ... go", "did go"], "explanation": "Câu hỏi quá khứ đơn: Did + S + V nguyên thể? (nhập: Did / go)", "vi": "Lớp bạn có đi đến trại trẻ mồ côi cuối tuần trước không?"}, {"id": "TR4", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>homeless people./ We/ cook meals/ and bring them to/ can/</b>", "starter": "", "answer": "We can cook meals and bring them to homeless people.", "accepted": null, "explanation": "S + can + V1 + and + V2 + O.", "vi": "Chúng ta có thể nấu ăn và mang đến cho người vô gia cư.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "MCQ19", "type": "mcq", "q": "She became a member of the Peace Corps ______.", "options": ["for two years", "since two years", "two years now", "two years ago"], "answer": 3, "explanation": "\"became\" (quá khứ đơn) đi với \"ago\": two years ago.", "vi": "Cô ấy trở thành thành viên của Peace Corps hai năm trước.", "ipas": null, "vis": null, "image": null}, {"id": "WF4", "type": "fill", "q": "There is a ________________ between Jack and Sue. (differ)", "answer": "difference", "explanation": "Sau \"a\" cần danh từ: difference (sự khác biệt).", "vi": "Có một sự khác biệt giữa Jack và Sue."}, {"id": "PIC3", "type": "mcq", "q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-amber-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">👨‍👧</div><p class=\"text-[11px] font-black text-center text-amber-700 leading-tight\">CHILDREN MUST BE WITH AN ADULT</p></div>", "options": ["Children can't play in this area.", "Children can enter this area with their parents.", "Only children can enter this place.", "Children can enter this place alone."], "answer": 1, "explanation": "Biển có hình người lớn nắm tay trẻ em → trẻ em phải đi cùng bố mẹ.", "vi": null}, {"id": "WF9", "type": "fill", "q": "Our book ________________ grew quickly after the school campaign. (collect)", "answer": "collection", "explanation": "Danh từ ghép: book collection (bộ sưu tập sách).", "vi": "Bộ sưu tập sách của chúng tôi tăng nhanh sau chiến dịch của trường."}, {"id": "TFA1", "type": "mcq", "q": "Some students volunteer in hospitals, orphanages, or homes for the elderly.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly\" → Đúng.", "vi": "Một số học sinh làm tình nguyện ở bệnh viện, trại trẻ mồ côi hoặc viện dưỡng lão.", "passage": "Each country has many good people who take care of others. In the United States, some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly. They read books to people, visit them, play games with them, or listen to their problems. Other young volunteers work in the homes of people who are sick or old. They paint, clean up, or repair houses and do the shopping. For boys who do not have fathers, an organization called Big Brothers helps them by taking them to basketball games or on fishing trips. Many cities also have clubs where boys and girls can play games, watch films, or take short trips. These clubs often use student volunteers because young volunteers can understand the problems of younger children."}, {"id": "MCQ12", "type": "mcq", "q": "Be a Buddy has ______ education for street children.", "options": ["given", "spent", "provided", "helped"], "answer": 2, "explanation": "\"provide education for sb\" = cung cấp giáo dục cho ai.", "vi": "Be a Buddy đã cung cấp giáo dục cho trẻ em đường phố.", "ipas": null, "vis": null, "image": null}, {"id": "EX0_8", "type": "fill", "q": "They __________ up trash around their school two days ago. (pick)", "answer": "picked", "accepted": null, "explanation": "\"two days ago\" → quá khứ đơn: picked (up).", "vi": "Họ đã nhặt rác quanh trường hai ngày trước."}, {"id": "WF15", "type": "fill", "q": "We learned about ________________ differences through the project. (culture)", "answer": "cultural", "explanation": "Tính từ bổ nghĩa cho \"differences\": cultural (thuộc văn hóa).", "vi": "Chúng tôi học về những khác biệt văn hóa qua dự án."}, {"id": "MCQ7", "type": "mcq", "q": "There ______ ten boys at the party last week.", "options": ["had", "were", "was", "are"], "answer": 1, "explanation": "\"last week\" + danh từ số nhiều → There were.", "vi": "Có mười cậu bé ở bữa tiệc tuần trước.", "ipas": null, "vis": null, "image": null}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"volunteer\"] B. Last month, hundreds of ________________ helped clean up the river.", "answer": "volunteers", "explanation": "Dựa vào ví dụ: Hundreds of volunteers.", "vi": "Tháng trước, hàng trăm tình nguyện viên đã giúp dọn dẹp con sông."}, {"id": "READINGB1", "type": "mcq", "q": "(1) The Peace Corps ______ one of the most famous volunteer organizations.", "options": ["is", "does", "are", "were"], "answer": 0, "explanation": "Chủ ngữ số ít (tên tổ chức) + hiện tại đơn → is.", "vi": null, "passage": "The Peace Corps <span class='blank-tag'>(1)</span> ______ one of the most famous volunteer organizations in the world. It was established in 1961 in the United States. People who work in this <span class='blank-tag'>(2)</span> ______ are called volunteers. They live and work in other countries for a period of time and share useful <span class='blank-tag'>(3)</span> ______ with local communities. Some volunteers work as <span class='blank-tag'>(4)</span> ______ at schools, while others help protect the environment, improve health, or support farmers. The Peace Corps also helps build understanding between people from different countries <span class='blank-tag'>(5)</span> ______ cultures. When volunteers return home, they often bring back new experiences and a better understanding <span class='blank-tag'>(6)</span> ______ the people they met."}, {"id": "MCQ23", "type": "mcq", "q": "Volunteers visited the ______ home to talk with elderly people.", "options": ["nursing", "mountain", "private", "rural"], "answer": 0, "explanation": "\"nursing home\" = viện dưỡng lão.", "vi": "Các tình nguyện viên đến thăm viện dưỡng lão để trò chuyện với người cao tuổi.", "ipas": null, "vis": null, "image": null}, {"id": "STR1", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["benefit", "charity", "environment", "government"], "answer": 2, "explanation": "\"environment\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbenɪfɪt/", "/ˈtʃærəti/", "/ɪnˈvaɪrənmənt/", "/ˈɡʌvənmənt/"], "vis": ["lợi ích", "việc từ thiện", "môi trường", "chính phủ"], "image": null}, {"id": "WF10", "type": "fill", "q": "Community service helps the personal ________________ of young people. (develop)", "answer": "development", "explanation": "Sau tính từ \"personal\" cần danh từ: development (sự phát triển).", "vi": "Dịch vụ cộng đồng giúp cho sự phát triển cá nhân của người trẻ."}, {"id": "EX0_14", "type": "fill", "q": "__________ they at the community centre yesterday? (be)", "answer": "Were", "accepted": null, "explanation": "Câu hỏi với to be quá khứ, chủ ngữ \"they\" → Were.", "vi": "Hôm qua họ có ở trung tâm cộng đồng không?"}, {"id": "READINGA5", "type": "mcq", "q": "(5) It can save the ______ of patients.", "options": ["lives", "life", "living", "alive"], "answer": 0, "explanation": "\"save the lives of patients\" = cứu mạng sống (số nhiều) của các bệnh nhân.", "vi": null, "passage": "Blood donation is one of the most valuable forms of community service. Millions of people <span class='blank-tag'>(1)</span> ______ blood after acci "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>should/ and hungry/ We/ people./ cold/ help/</b>", "starter": "", "answer": "We should help cold and hungry people.", "accepted": null, "explanation": "S + should + help + adj + N.", "vi": "Chúng ta nên giúp những người đang lạnh và đói.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TFB6", "type": "mcq", "q": "What can students learn from community service?", "options": ["Responsibility.", "How to make a profit.", "How to avoid work.", "How to spend more money."], "answer": 0, "explanation": "Bài đọc: \"students can learn responsibility\".", "vi": "Học sinh có thể học được gì từ dịch vụ cộng đồng?", "passage": "Community service is work that people do for free to help the public or their community. Students who choose community service usually work as volunteers because they want to help others. Community service can have many positive effects on students. It can help them develop useful skills, meet new people, and improve the quality of life of others. There are many ways for students to volunteer. They can join a non-profit organization, work with a community group, or create their own service project. Volunteer work can be simple, such as helping coach a school football team, or more difficult, such as starting a project to support homeless people. Whatever activity they choose, students can learn responsibility and understand their community better."}, {"id": "PRON6", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["wash<u>ed</u>", "practic<u>ed</u>", "clos<u>ed</u>", "jump<u>ed</u>"], "answer": 2, "explanation": "\"closed\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại phát âm /t/.", "vi": null, "ipas": ["/wɒʃt/", "/ˈpræktɪst/", "/kləʊzd/", "/dʒʌmpt/"], "vis": ["đã rửa", "đã luyện tập", "đã đóng", "đã nhảy"], "image": null}, {"id": "MCQ4", "type": "mcq", "q": "Three years ago, my sister and I ______ to Phong Nha Cave with my family.", "options": ["go", "will go", "went", "are going"], "answer": 2, "explanation": "\"Three years ago\" → quá khứ đơn: went.", "vi": "Ba năm trước, chị tôi và tôi đã đi động Phong Nha cùng gia đình.", "ipas": null, "vis": null, "image": null}, {"id": "PRON1", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["provid<u>ed</u>", "lov<u>ed</u>", "want<u>ed</u>", "visit<u>ed</u>"], "answer": 1, "explanation": "\"loved\" có đuôi \"-ed\" phát âm /d/, ba từ còn lại (kết thúc bằng /t/, /d/) có đuôi \"-ed\" phát âm /ɪd/.", "vi": null, "ipas": ["/prəˈvaɪdɪd/", "/lʌvd/", "/ˈwɒntɪd/", "/ˈvɪzɪtɪd/"], "vis": ["đã cung cấp", "đã yêu", "đã muốn", "đã thăm"], "image": null}, {"id": "WF11", "type": "fill", "q": "The club works for environmental ________________. (protect)", "answer": "protection", "explanation": "Sau tính từ \"environmental\" cần danh từ: protection (sự bảo vệ).", "vi": "Câu lạc bộ hoạt động vì việc bảo vệ môi trường."}, {"id": "TFA3", "type": "mcq", "q": "Big Brothers helps some boys who do not have fathers.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"For boys who do not have fathers, an organization called Big Brothers helps them\" → Đúng.", "vi": "Big Brothers giúp một số cậu bé không có cha.", "passage": "Each country has many good people who take care of others. In the United States, some students spend many hours as volunteers in hospitals, orphanages, or homes for the elderly. They read books to people, visit them, play games with them, or listen to their problems. Other young volunteers work in the homes of people who are sick or old. They paint, clean up, or repair houses and do the shopping. For boys who do not have fathers, an organization called Big Brothers helps them by taking them to basketball games or on fishing trips. Many cities also have clubs where boys and girls can play games, watch films, or take le last Sunday. (cook)", "answer": "cooked", "accepted": null, "explanation": "\"last Sunday\" → quá khứ đơn: cooked.", "vi": "Mẹ tôi đã nấu ăn cho người vô gia cư Chủ nhật tuần trước."}, {"id": "EX0_12", "type": "fill", "q": "Lan __________ the nursing home yesterday. (not visit)", "answer": "didn't visit", "accepted": ["didn't visit", "did not visit"], "explanation": "Phủ định quá khứ đơn: didn't + V nguyên thể.", "vi": "Lan đã không thăm viện dưỡng lão hôm qua."}, {"id": "WF7", "type": "fill", "q": "Many teenagers take part in ________________ work at weekends. (volunteer)", "answer": "voluntary", "explanation": "Tính từ bổ nghĩa cho \"work\": voluntary (tình nguyện); cũng chấp nhận \"volunteer work\".", "vi": "Nhiều thanh thiếu niên tham gia công việc tình nguyện vào cuối tuần."}, {"id": "MCQ24", "type": "mcq", "q": "A person who gives time freely to help other people is a ______.", "options": ["sponsor", "mentor", "volunteer", "teenager"], "answer": 2, "explanation": "\"volunteer\" = tình nguyện viên.", "vi": "Người dành thời gian giúp đỡ người khác một cách tự nguyện là tình nguyện viên.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ23", "type": "mcq", "q": "Volunteers visited the ______ home to talk with elderly people.", "options": ["nursing", "mountain", "private", "rural"], "answer": 0, "explanation": "\"nursing home\" = viện dưỡng lão.", "vi": "Các tình nguyện viên đến thăm viện dưỡng lão để trò chuyện với người cao tuổi.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ28", "type": "mcq", "q": "A non-profit organization does not work mainly for ______.", "options": ["culture", "population", "profit", "dirt"], "answer": 2, "explanation": "non-profit = phi lợi nhuận → không vì lợi nhuận (profit).", "vi": "Tổ chức phi lợi nhuận không hoạt động chủ yếu vì lợi nhuận.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ12", "type": "mcq", "q": "Be a Buddy has ______ education for street children.", "options": ["given", "spent", "provided", "helped"], "answer": 2, "explanation": "\"provide education for sb\" = cung cấp giáo dục cho ai.", "vi": "Be a Buddy đã cung cấp giáo dục cho trẻ em đường phố.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ29", "type": "mcq", "q": "Community service helps students develop useful ______.", "options": ["skills", "coupons", "statistics", "blankets"], "answer": 0, "explanation": "\"develop skills\" = phát triển kỹ năng.", "vi": "Dịch vụ cộng đồng giúp học sinh phát triển các kỹ năng hữu ích.", "ipas": null, "vis": null, "image": null}, {"id": "STR1", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["benefit", "charity", "environment", "government"], "answer": 2, "explanation": "\"environment\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbenɪfɪt/", "/ˈtʃærəti/", "/ɪnˈvaɪrənmənt/", "/ˈɡʌvənmənt/"], "vis": ["lợi ích", "việc từ thiện", "môi trường", "chính phủ"], "image": null}, {"id": "TFB3", "type": "mcq", "q": "No students choose to volunteer their free time through community service.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nói nhiều học sinh chọn làm tình nguyện → Sai.", "vi": "Không học sinh nào chọn làm tình nguyện qua dịch vụ cộng đồng.", "passage": "Community service is work that people do for free to help the public or their community. Students who choose community service usually work as volunteers because they want to help others. Community service can have many positive effects on students. It can help them develop useful skills, meet new people, and improve the quality of life of others. There are many ways for students to volunteer. They can join a non-profit organization, work with a community group, or create their own service project. Volunteer work can be simple, such as helping coach a school football team, or more difficult, such as starting a project to support homeless people. Whatever activity they choose, students can learn responsibility and understand their community better."}, {"id": "WF13", "type": "fill", "q": "Some students give food to ________________ people in the city. (home)", "answer": "homeless", "explanation": "Tính từ bổ nghĩa cho \"people\": homeless (vô gia cư).", "vi": "Một số học sinh phát thức ăn cho người vô gia cư trong thành phố."}, {"id": "PIC1", "type": "mcq", "q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-green-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🌱🌳</div><p class=\"text-[11px] font-black text-center text-green-700 leading-tight\">PLANT MORE TREES</p></div>", "options": ["We should plant more trees.", "We should sell more trees.", "We should use more trees.", "We should buy more trees."], "answer": 0, "explanation": "Biển có hình cây xanh và bàn tay trồng cây → kêu gọi trồng thêm cây.", "vi": null}, {"id": "TFB2", "type": "mcq", "q": "Community service can help students develop useful skills.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"It can help them develop useful skills\" → Đúng.", "vi": "Dịch vụ cộng đồng có thể giúp học sinh phát triển kỹ năng hữu ích.", "passage": "Community service is work that people do for free to help the public or their community. Students who choose community service usually work as volunteers because they want to help others. Community service can have many positive effects on students. It can help them develop useful skills, meet new people, and improve the quality of life of others. There are many ways for students to volunteer. They can join a non-profit organization, work with a community group, or create their own service project. Volunteer work can be simple, such as helping coach a school football team, or more difficult, such as starting a project to support homeless people. Whatever activity they choose, students can learn responsibility and understand their community better."}, {"i
