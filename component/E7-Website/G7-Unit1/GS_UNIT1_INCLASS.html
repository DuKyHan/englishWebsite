<title>Unit 1 - In-class Practice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{ --accent:#1d4ed8; --accent2:#0891b2; }
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#f5f3ff; }
  .hero-gradient{ background: linear-gradient(135deg, #7c2d12 0%, #ea580c 55%, #f59e0b 100%); }
  .tab-btn{ transition: all .2s ease; }
  .tab-btn.active{ background: linear-gradient(135deg, #7c2d12, #f59e0b); color:#fff; box-shadow:0 4px 14px rgba(124,45,18,.35); transform:translateY(-1px); }
  .task-card{ transition: box-shadow .2s, transform .2s; }
  .task-card:hover{ transform: translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  .mcq-detail-hidden{ display:none; }
  .show-mcq-detail .mcq-detail-hidden{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:var(--accent); }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .voice-ok{ color:#16a34a; } .voice-warn{ color:#d97706; }

  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
  table.border-collapse td, table.border-collapse th{ border:1px solid #e2e8f0; }
</style>

<script>
const DATA = {"unit": 1, "sections": [{"roman": "", "navLabel": "Lý thuyết", "title": "Từ vựng - Ngữ pháp - Hướng dẫn Word Form", "icon": "lightbulb", "type": "info", "info": "<div class='mb-5'><p class=\"text-sm text-slate-500 italic mb-3\">Ôn lại từ vựng, ngữ pháp trọng tâm và cách làm dạng bài Word Form trước khi luyện tập.</p></div><div class='bg-white rounded-2xl shadow-md p-5'><p class='font-extrabold text-indigo-900 mb-3'><i class=\"fa-solid fa-book mr-1\"></i>Bảng từ vựng (xem chi tiết &amp; luyện tập đầy đủ trong file VOCAB)</p><div class='grid sm:grid-cols-2 gap-x-6 gap-y-1 text-sm'><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>1. hobby</span><span class='text-slate-400 text-xs'>(n) /ˈhɒbi/</span><span class='text-slate-500 text-xs ml-auto'>sở thích</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>2. collect</span><span class='text-slate-400 text-xs'>(v) /kəˈlekt/</span><span class='text-slate-500 text-xs ml-auto'>sưu tầm, thu thập</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>3. stamp</span><span class='text-slate-400 text-xs'>(n) /stæmp/</span><span class='text-slate-500 text-xs ml-auto'>con tem</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>4. chess</span><span class='text-slate-400 text-xs'>(n) /tʃes/</span><span class='text-slate-500 text-xs ml-auto'>cờ vua</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>5. garden</span><span class='text-slate-400 text-xs'>(n, v) /ˈɡɑːdn/</span><span class='text-slate-500 text-xs ml-auto'>khu vườn; làm vườn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>6. guitar</span><span class='text-slate-400 text-xs'>(n) /ɡɪˈtɑː/</span><span class='text-slate-500 text-xs ml-auto'>đàn ghi-ta</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>7. piano</span><span class='text-slate-400 text-xs'>(n) /piˈænəʊ/</span><span class='text-slate-500 text-xs ml-auto'>đàn piano</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>8. photo</span><span class='text-slate-400 text-xs'>(n) /ˈfəʊtəʊ/</span><span class='text-slate-500 text-xs ml-auto'>ảnh chụp</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>9. paint</span><span class='text-slate-400 text-xs'>(v) /peɪnt/</span><span class='text-slate-500 text-xs ml-auto'>vẽ tranh, sơn</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>10. painting</span><span class='text-slate-400 text-xs'>(n) /ˈpeɪntɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>bức tranh</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>11. model</span><span class='text-slate-400 text-xs'>(n) /ˈmɒdl/</span><span class='text-slate-500 text-xs ml-auto'>mô hình</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>12. camping</span><span class='text-slate-400 text-xs'>(n) /ˈkæmpɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>cắm trại</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>13. fishing</span><span class='text-slate-400 text-xs'>(n) /ˈfɪʃɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>câu cá</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>14. yoga</span><span class='text-slate-400 text-xs'>(n) /ˈjəʊɡə/</span><span class='text-slate-500 text-xs ml-auto'>yoga</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>15. doll</span><span class='text-slate-400 text-xs'>(n) /dɒl/</span><span class='text-slate-500 text-xs ml-auto'>búp bê</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>16. video</span><span class='text-slate-400 text-xs'>(n) /ˈvɪdiəʊ/</span><span class='text-slate-500 text-xs ml-auto'>đoạn phim, video</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>17. badminton</span><span class='text-slate-400 text-xs'>(n) /ˈbædmɪntən/</span><span class='text-slate-500 text-xs ml-auto'>cầu lông</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>18. skateboarding</span><span class='text-slate-400 text-xs'>(n) /ˈskeɪtbɔːdɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>trượt ván</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>19. horse-riding</span><span class='text-slate-400 text-xs'>(n) /ˈhɔːs raɪdɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>cưỡi ngựa</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>20. amazing</span><span class='text-slate-400 text-xs'>(adj) /əˈmeɪzɪŋ/</span><span class='text-slate-500 text-xs ml-auto'>tuyệt vời, kinh ngạc</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>21. favourite</span><span class='text-slate-400 text-xs'>(adj) /ˈfeɪvərɪt/</span><span class='text-slate-500 text-xs ml-auto'>yêu thích nhất</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>22. popular</span><span class='text-slate-400 text-xs'>(adj) /ˈpɒpjələ/</span><span class='text-slate-500 text-xs ml-auto'>phổ biến</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>23. dislike</span><span class='text-slate-400 text-xs'>(v) /dɪsˈlaɪk/</span><span class='text-slate-500 text-xs ml-auto'>không thích</span></div><div class='flex items-baseline gap-1 border-b border-slate-100 py-1'><span class='font-bold text-indigo-800'>24. prefer</span><span class='text-slate-400 text-xs'>(v) /prɪˈfɜː/</span><span class='text-slate-500 text-xs ml-auto'>thích hơn</span></div></div></div>\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Thì hiện tại đơn (Present Simple)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Diễn tả thói quen, hành động lặp lại, sự thật hiển nhiên, lịch trình cố định.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + V(-s/-es) [ngôi 3 số ít]</td><td class=\"border px-2 py-1 italic\">He plays chess every day. <span class=\"not-italic text-slate-500\">— Cậu ấy chơi cờ vua mỗi ngày.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + don't/doesn't + V</td><td class=\"border px-2 py-1 italic\">She doesn't like fishing. <span class=\"not-italic text-slate-500\">— Cô ấy không thích câu cá.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Nghi vấn</td><td class=\"border px-2 py-1\">Do/Does + S + V?</td><td class=\"border px-2 py-1 italic\">Does he collect stamps? <span class=\"not-italic text-slate-500\">— Cậu ấy có sưu tầm tem không?</span></td></tr>\n    </table>\n    </div>\n    <p class=\"text-xs text-slate-500 mt-2\">💡 Trạng từ tần suất (always, usually, often, sometimes, never) đứng TRƯỚC động từ thường nhưng SAU động từ \"to be\": He usually goes camping. / He is usually busy.</p>\n  </div>\n\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-heart mr-1\"></i>2. Diễn đạt sở thích (Expressing likes/dislikes)</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">like/love/enjoy + V-ing</td><td class=\"border px-2 py-1 italic\">I enjoy collecting stamps. <span class=\"not-italic text-slate-500\">— Tôi thích sưu tầm tem.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">be interested in + V-ing</td><td class=\"border px-2 py-1 italic\">She's interested in painting. <span class=\"not-italic text-slate-500\">— Cô ấy thích vẽ tranh.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">be fond of / keen on + V-ing</td><td class=\"border px-2 py-1 italic\">He's keen on playing chess. <span class=\"not-italic text-slate-500\">— Cậu ấy mê chơi cờ vua.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">hate / dislike + V-ing = don't like + V-ing</td><td class=\"border px-2 py-1 italic\">I hate washing dishes. <span class=\"not-italic text-slate-500\">— Tôi ghét rửa bát.</span></td></tr>\n    </table>\n    </div>\n  </div>\n\n  \n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-users mr-1\"></i>Chủ ngữ SỐ ÍT và SỐ NHIỀU — vì sao động từ chia khác nhau</p>\n  <p class=\"text-sm text-slate-700 mb-3\">Trong tiếng Anh, dạng của động từ (to be, to do, hay động từ thường thêm \"-s/-es\") phụ thuộc vào chủ ngữ là SỐ ÍT hay SỐ NHIỀU. Đây là quy tắc SỐNG CÒN cần nắm chắc trước khi học bất kỳ thì nào.</p>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Chủ ngữ</th><th class=\"border px-2 py-1\">Số ít hay số nhiều?</th><th class=\"border px-2 py-1\">to be</th><th class=\"border px-2 py-1\">to do</th><th class=\"border px-2 py-1\">Động từ thường (hiện tại đơn)</th></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">I</td><td class=\"border px-2 py-1\">số ít <span class=\"text-slate-400\">(nhưng chia đặc biệt)</span></td><td class=\"border px-2 py-1 font-bold\">am</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, không thêm gì)</td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">You</td><td class=\"border px-2 py-1\">số ít HOẶC số nhiều <span class=\"text-slate-400\">(luôn chia như số nhiều)</span></td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu)</td></tr>\n    <tr class=\"bg-amber-50\"><td class=\"border px-2 py-1 font-bold\">He / She / It<br><span class=\"font-normal text-xs\">(và danh từ số ít: a boy, my sister, the dog...)</span></td><td class=\"border px-2 py-1 font-bold\">SỐ ÍT</td><td class=\"border px-2 py-1 font-bold\">is</td><td class=\"border px-2 py-1 font-bold\">does</td><td class=\"border px-2 py-1 font-bold\">V + s/es <span class=\"font-normal\">(plays, watches, goes...)</span></td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">We</td><td class=\"border px-2 py-1 font-bold\">SỐ NHIỀU</td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, KHÔNG thêm s/es)</td></tr>\n    <tr><td class=\"border px-2 py-1 font-bold\">They<br><span class=\"font-normal text-xs\">(và danh từ số nhiều: boys, my parents, the dogs...)</span></td><td class=\"border px-2 py-1 font-bold\">SỐ NHIỀU</td><td class=\"border px-2 py-1 font-bold\">are</td><td class=\"border px-2 py-1 font-bold\">do</td><td class=\"border px-2 py-1 italic\">V (nguyên mẫu, KHÔNG thêm s/es)</td></tr>\n  </table>\n  </div>\n  <div class=\"mt-3 space-y-1.5 text-sm text-slate-700\">\n    <p>💡 <b>Chỉ có \"He / She / It\" (ngôi thứ 3 số ít) và danh từ số ít mới thêm \"-s/-es\" vào động từ thường</b> ở thì hiện tại đơn. Mọi chủ ngữ khác (I, You, We, They) giữ nguyên động từ ở dạng nguyên mẫu.</p>\n    <p>💡 Cách nhận biết danh từ số ít/số nhiều nhanh: số ít thường có \"a/an/the/my/his...\" + danh từ KHÔNG có \"-s\" (a student); số nhiều thường có danh từ CÓ \"-s\" hoặc từ chỉ số lượng >1 (students, two students, many students).</p>\n    <p>💡 Với \"to be\" ở thì QUÁ KHỨ: số ít dùng <b>was</b> (I was, he/she/it was), số nhiều dùng <b>were</b> (we/you/they were).</p>\n  </div>\n</div>\n\n<div class=\"bg-rose-50 border border-rose-200 rounded-2xl p-5\">\n    <p class=\"font-extrabold text-rose-800 mb-2\"><i class=\"fa-solid fa-triangle-exclamation mr-1\"></i>DON'T MAKE THESE MISTAKES</p>\n    <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n      <li><s>He like playing chess.</s> ❌ → <b>He likes playing chess.</b> ✅ — chủ ngữ số ít cần thêm \"-s\".</li>\n      <li><s>She don't like fishing.</s> ❌ → <b>She doesn't like fishing.</b> ✅ — chủ ngữ số ít dùng \"doesn't\".</li>\n      <li><s>I'm interested to collect stamps.</s> ❌ → <b>I'm interested in collecting stamps.</b> ✅ — cần giới từ \"in\" + V-ing.</li>\n      <li><s>He usually is busy.</s> ❌ → <b>He is usually busy.</b> ✅ — trạng từ tần suất đứng SAU \"to be\".</li>\n    </ol>\n  </div>\n\n  <div class=\"grid sm:grid-cols-2 gap-3\">\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"S + be interested in + V-ing = S + like/love/enjoy + V-ing\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 1</p>\n      <p class=\"text-sm text-slate-700\">S + be interested in + V-ing<br>= S + like/love/enjoy + V-ing</p>\n    </div>\n    <div class=\"bg-indigo-50 border border-indigo-200 rounded-xl p-4 relative\">\n      <button onclick=\"copyNote(this)\" data-copy=\"It's good to V = S + should + V\" class=\"absolute top-3 right-3 text-xs text-indigo-600\"><i class=\"fa-solid fa-copy\"></i></button>\n      <p class=\"font-bold text-indigo-800 text-sm mb-1\">📒 Công thức 2</p>\n      <p class=\"text-sm text-slate-700\">It's good to V<br>= S + should + V</p>\n    </div>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-spell-check mr-1\"></i>Hướng dẫn làm dạng bài WORD FORM (Word Formation)</p>\n  <ol class=\"list-decimal ml-5 space-y-1.5 text-sm text-slate-700\">\n    <li><b>Bước 1 - Xác định gốc từ (root word)</b> trong ngoặc và nghĩa của nó.</li>\n    <li><b>Bước 2 - Nhìn vào \"họ từ\" (word family)</b> của gốc từ đó — nó có những dạng danh từ, động từ, tính từ, trạng từ nào.</li>\n    <li><b>Bước 3 - Xác định từ loại cần điền</b> dựa vào vị trí trong câu (đây là \"manh mối ngữ pháp\" — grammatical clue):\n      <ul class=\"list-disc ml-5 mt-1 text-slate-600\">\n        <li>Sau <b>a/an/the/tính từ sở hữu (my, his...)</b>, trước động từ, làm chủ ngữ → cần <b>DANH TỪ (N)</b></li>\n        <li>Sau <b>to be (am/is/are/was/were)</b>, <b>look/feel/seem/become</b>, sau <b>very/so/too</b> → cần <b>TÍNH TỪ (adj)</b></li>\n        <li>Bổ nghĩa cho động từ → cần <b>TRẠNG TỪ (adv)</b>, thường có đuôi <b>-ly</b></li>\n        <li>Làm vị ngữ chính của câu, sau chủ ngữ, sau modal verb (can/should...), sau \"to\" → cần <b>ĐỘNG TỪ (V)</b>, chia đúng thì/ngôi</li>\n      </ul>\n    </li>\n    <li><b>Bước 4 - Nhận diện đuôi (hậu tố) thường gặp:</b>\n      <div class=\"overflow-x-auto mt-1\">\n      <table class=\"w-full text-xs border-collapse\">\n        <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Từ loại</th><th class=\"border px-2 py-1\">Hậu tố phổ biến</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Danh từ (N)</td><td class=\"border px-2 py-1\">-tion/-sion, -ment, -ity/-ty, -ness, -er/-or, -ance/-ence, -ing</td><td class=\"border px-2 py-1 italic\">connection, entertainment, popularity, comedian, snowboarding</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Tính từ (adj)</td><td class=\"border px-2 py-1\">-ful, -less, -able/-ible, -ive, -ing/-ed, -al, -ous</td><td class=\"border px-2 py-1 italic\">comfortable, entertaining, surprised/surprising</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Trạng từ (adv)</td><td class=\"border px-2 py-1\">adj + -ly</td><td class=\"border px-2 py-1 italic\">actively, comfortably, surprisingly</td></tr>\n        <tr><td class=\"border px-2 py-1 font-bold\">Động từ (V)</td><td class=\"border px-2 py-1\">-ize/-ise, -en, -ify, -ate</td><td class=\"border px-2 py-1 italic\">popularize, strengthen, activate</td></tr>\n      </table>\n      </div>\n    </li>\n    <li><b>Bước 5 - Chú ý tính từ đuôi -ing / -ed:</b> chủ ngữ là NGƯỜI mang cảm xúc → dùng <b>-ed</b> (surprised); chủ ngữ là VẬT/SỰ VIỆC gây ra cảm xúc → dùng <b>-ing</b> (surprising, entertaining).</li>\n    <li><b>Bước 6 - Đọc kỹ nghĩa câu</b> để chọn đúng từ trong \"họ từ\" — nhiều từ cùng gốc nhưng nghĩa khác nhau (VD: comedy ≠ comedian ≠ comical).</li>\n    <li><b>Bước 7 - Đọc lại cả câu</b> sau khi điền để kiểm tra hợp nghĩa và đúng ngữ pháp.</li>\n  </ol>\n</div>\n"}, {"roman": "I", "navLabel": "Phát âm", "title": "Phát âm", "icon": "ear-listen", "instructions": "Chọn từ có phần gạch chân được phát âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["st<u>a</u>mp", "gl<u>a</u>ss", "n<u>a</u>me", "h<u>a</u>t"], "answer": 2, "explanation": "\"name\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"a\" phát âm ngắn (/æ/ hoặc /ɑː/).", "ipas": ["/stæmp/", "/ɡlɑːs/", "/neɪm/", "/hæt/"], "vis": ["con tem", "cái ly, thủy tinh", "tên", "cái mũ"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["pl<u>a</u>y", "l<u>a</u>te", "m<u>a</u>ke", "g<u>a</u>rden"], "answer": 3, "explanation": "\"garden\" có \"a\" phát âm /ɑː/, ba từ còn lại có \"a\" phát âm /eɪ/.", "ipas": ["/pleɪ/", "/leɪt/", "/meɪk/", "/ˈɡɑːdn/"], "vis": ["chơi", "muộn", "làm", "khu vườn"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["p<u>a</u>rk", "g<u>a</u>me", "c<u>a</u>r", "m<u>a</u>rket"], "answer": 1, "explanation": "\"game\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"ar\" phát âm /ɑː/.", "ipas": ["/pɑːk/", "/ɡeɪm/", "/kɑː/", "/ˈmɑːkɪt/"], "vis": ["công viên", "trò chơi", "xe hơi", "chợ"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["b<u>ur</u>n", "h<u>ur</u>t", "b<u>ir</u>th", "sing<u>er</u>"], "answer": 3, "explanation": "\"singer\" có \"er\" phát âm /ə/ (âm yếu), ba từ còn lại phát âm /ɜː/.", "ipas": ["/bɜːn/", "/hɜːt/", "/bɜːθ/", "/ˈsɪŋə/"], "vis": ["đốt cháy", "làm đau", "sự ra đời", "ca sĩ"]}, {"q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["moth<u>er</u>", "badmint<u>o</u>n", "l<u>ear</u>n", "pict<u>ure</u>"], "answer": 2, "explanation": "\"learn\" có \"ear\" phát âm /ɜː/ (âm mạnh), ba từ còn lại phần gạch chân là âm yếu /ə/.", "ipas": ["/ˈmʌðə/", "/ˈbædmɪntən/", "/lɜːn/", "/ˈpɪktʃə/"], "vis": ["mẹ", "cầu lông", "học", "bức tranh"]}]}, {"roman": "II", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "Which word has a different stress pattern from that of the others?", "options": ["guitar", "model", "garden", "hobby"], "answer": 0, "explanation": "\"guitar\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ɡɪˈtɑː/", "/ˈmɒdl/", "/ˈɡɑːdn/", "/ˈhɒbi/"], "vis": ["đàn ghi-ta", "mô hình", "khu vườn", "sở thích"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["cycling", "swimming", "painting", "collecting"], "answer": 3, "explanation": "\"collecting\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈsaɪklɪŋ/", "/ˈswɪmɪŋ/", "/ˈpeɪntɪŋ/", "/kəˈlektɪŋ/"], "vis": ["đạp xe", "bơi lội", "vẽ tranh", "sưu tầm"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["beautiful", "favourite", "popular", "exciting"], "answer": 3, "explanation": "\"exciting\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈbjuːtɪfl/", "/ˈfeɪvərɪt/", "/ˈpɒpjələ/", "/ɪkˈsaɪtɪŋ/"], "vis": ["đẹp", "yêu thích", "phổ biến", "thú vị"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["dislike", "prefer", "enjoy", "collect"], "answer": 0, "explanation": "Theo đáp án tài liệu: \"dislike\" (đặc biệt khi là danh từ /ˈdɪslaɪk/) trọng âm âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "ipas": ["/ˈdɪslaɪk/", "/prɪˈfɜː/", "/ɪnˈdʒɔɪ/", "/kəˈlekt/"], "vis": ["không thích", "thích hơn", "thích thú", "sưu tầm"]}, {"q": "Which word has a different stress pattern from that of the others?", "options": ["amazing", "excellent", "wonderful", "dangerous"], "answer": 0, "explanation": "\"amazing\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/əˈmeɪzɪŋ/", "/ˈeksələnt/", "/ˈwʌndəfl/", "/ˈdeɪndʒərəs/"], "vis": ["tuyệt vời", "xuất sắc", "tuyệt diệu", "nguy hiểm"]}]}, {"roman": "III", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "We sometimes play __________ at school.", "options": ["stamps", "photos", "glasses", "chess"], "answer": 3, "explanation": "\"play chess\" = chơi cờ vua.", "vi": "Thỉnh thoảng chúng tôi chơi cờ vua ở trường.", "tags": ["vocab"]}, {"q": "My sister enjoys ___________ pictures of her favorite singers.", "options": ["playing", "cooking", "collecting", "listening"], "answer": 2, "explanation": "\"collect pictures\" = sưu tầm ảnh.", "vi": "Chị tôi thích sưu tầm ảnh của các ca sĩ yêu thích.", "tags": ["vocab"]}, {"q": "My brother wants to _________ roses and orchids in the garden.", "options": ["watch", "make", "take", "plant"], "answer": 3, "explanation": "\"plant flowers\" = trồng hoa.", "vi": "Anh tôi muốn trồng hoa hồng và hoa lan trong vườn.", "tags": ["vocab"]}, {"q": "What kind of music do you like _________ to?", "options": ["listening", "watching", "playing", "hearing"], "answer": 0, "explanation": "\"listen to music\" = nghe nhạc; like + V-ing.", "vi": "Bạn thích nghe thể loại nhạc nào?", "tags": ["grammar"]}, {"q": "Paul thinks _________ soccer cards is an interesting hobby.", "options": ["picking", "collecting", "playing", "having"], "answer": 1, "explanation": "\"collecting cards\" = sưu tầm thẻ.", "vi": "Paul nghĩ sưu tầm thẻ bóng đá là một sở thích thú vị.", "tags": ["vocab"]}, {"q": "Mr. Kelvin: What do you often do in your spare time? – Trân: ______________________.", "options": ["I don't like it.", "I'm hungry now.", "I go camping.", "I usually eat vegetables."], "answer": 2, "explanation": "Hỏi về hoạt động lúc rảnh rỗi → trả lời bằng một hoạt động: I go camping.", "vi": "Ông Kelvin: Bạn thường làm gì lúc rảnh? – Trân: Mình đi cắm trại.", "tags": ["vocab"]}, {"q": "He won't _________ the wall in contrasting colours.", "options": ["make", "take", "paint", "watch"], "answer": 2, "explanation": "\"paint the wall\" = sơn tường.", "vi": "Anh ấy sẽ không sơn tường bằng những màu tương phản.", "tags": ["vocab"]}, {"q": "She loves playing the ___________ in her free time.", "options": ["dolls", "bottles", "piano", "garden"], "answer": 2, "explanation": "\"play the piano\" = chơi đàn piano (nhạc cụ đi với \"the\").", "vi": "Cô ấy thích chơi piano lúc rảnh.", "tags": ["vocab"]}, {"q": "Jimmy loves taking _________ and posting them on websites.", "options": ["paintings", "photos", "videos", "music"], "answer": 1, "explanation": "\"take photos\" = chụp ảnh.", "vi": "Jimmy thích chụp ảnh và đăng lên các trang web.", "tags": ["vocab"]}, {"q": "_________ fish is the most interesting part of fishing.", "options": ["Going", "Catching", "Doing", "Making"], "answer": 1, "explanation": "\"catch fish\" = bắt cá; V-ing làm chủ ngữ.", "vi": "Bắt được cá là phần thú vị nhất của việc câu cá.", "tags": ["grammar"]}, {"q": "My sister enjoys _________ stamps in her free time.", "options": ["collecting", "making", "doing", "taking"], "answer": 0, "explanation": "\"collect stamps\" = sưu tầm tem; enjoy + V-ing.", "vi": "Chị tôi thích sưu tầm tem lúc rảnh.", "tags": ["grammar"]}, {"q": "Playing chess is my favourite ________.", "options": ["hobby", "lesson", "subject", "festival"], "answer": 0, "explanation": "\"hobby\" = sở thích.", "vi": "Chơi cờ vua là sở thích yêu thích của tôi.", "tags": ["vocab"]}, {"q": "My father often ______ photos of beautiful flowers.", "options": ["takes", "does", "makes", "goes"], "answer": 0, "explanation": "\"take photos\" = chụp ảnh.", "vi": "Bố tôi thường chụp ảnh những bông hoa đẹp.", "tags": ["vocab"]}, {"q": "Lan spends two hours ______ English every evening.", "options": ["studying", "collecting", "planting", "watching"], "answer": 0, "explanation": "\"spend time + V-ing\"; hợp nghĩa: studying English.", "vi": "Lan dành hai tiếng học tiếng Anh mỗi tối.", "tags": ["grammar"]}, {"q": "My brother likes ______ model cars.", "options": ["making", "reading", "cooking", "washing"], "answer": 0, "explanation": "\"make models\" = làm mô hình.", "vi": "Anh tôi thích làm mô hình ô tô.", "tags": ["vocab"]}, {"q": "I often share my hobby ______ my friends.", "options": ["with", "at", "on", "in"], "answer": 0, "explanation": "\"share sth with sb\" = chia sẻ với ai.", "vi": "Tôi thường chia sẻ sở thích của mình với bạn bè.", "tags": ["vocab"]}, {"q": "Collecting old coins is an interesting ______.", "options": ["hobby", "game", "job", "sport"], "answer": 0, "explanation": "Sưu tầm tiền xu cũ là một sở thích (hobby).", "vi": "Sưu tầm tiền xu cũ là một sở thích thú vị.", "tags": ["vocab"]}, {"q": "Gardening helps my grandmother ______ after work.", "options": ["relax", "relaxing", "relaxed", "relaxes"], "answer": 0, "explanation": "\"help sb + V (nguyên thể)\" → relax.", "vi": "Làm vườn giúp bà tôi thư giãn sau giờ làm.", "tags": ["vocab"]}, {"q": "Tâm: Do you like going fishing? – Hải: _______________.", "options": ["Yes, I do.", "See you again.", "Sorry. I'm busy.", "It's a great idea."], "answer": 0, "explanation": "Câu hỏi Yes/No với \"Do you...?\" → Yes, I do.", "vi": "Tâm: Bạn có thích đi câu cá không? – Hải: Có, mình thích.", "tags": ["grammar"]}, {"q": "My hobby is different ______ my sister's.", "options": ["from", "with", "of", "by"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Sở thích của tôi khác với sở thích của chị tôi.", "tags": ["vocab"]}, {"q": "Doing yoga _________ one of her hobbies.", "options": ["is", "are", "being", "be"], "answer": 0, "explanation": "Chủ ngữ là V-ing (Doing yoga) → động từ số ít: is.", "vi": "Tập yoga là một trong những sở thích của cô ấy.", "tags": ["grammar"]}, {"q": "What's your hobby, Charlie? – __________________.", "options": ["I'm twelve.", "It's drawing.", "I love that.", "It's very funny."], "answer": 1, "explanation": "Hỏi sở thích → trả lời tên sở thích: It's drawing.", "vi": "Sở thích của bạn là gì, Charlie? – Là vẽ tranh.", "tags": ["mixed"]}, {"q": "Hannah and Sara _________ badminton twice a week.", "options": ["are playing", "doesn't play", "plays", "play"], "answer": 3, "explanation": "Chủ ngữ số nhiều + hiện tại đơn (thói quen: twice a week) → play.", "vi": "Hannah và Sara chơi cầu lông hai lần một tuần.", "tags": ["grammar"]}, {"q": "Are you free this afternoon, Ngân? – ___________________.", "options": ["Great.", "Thanks a lot.", "No, I hate it.", "Yes, I am."], "answer": 3, "explanation": "Câu hỏi \"Are you...?\" → Yes, I am.", "vi": "Chiều nay bạn có rảnh không, Ngân? – Có, mình rảnh.", "tags": ["grammar"]}, {"q": "Every year they _________ to Singapore for two weeks.", "options": ["travels", "doesn't travel", "travel", "not travel"], "answer": 2, "explanation": "\"they\" + hiện tại đơn (every year) → travel.", "vi": "Mỗi năm họ đi Singapore hai tuần.", "tags": ["mixed"]}, {"q": "My younger sister _________ with dolls very much.", "options": ["is liking to play", "likes play", "likes to playing", "likes playing"], "answer": 3, "explanation": "like + V-ing → likes playing.", "vi": "Em gái tôi rất thích chơi với búp bê.", "tags": ["grammar"]}, {"q": "Emily _________ every day at seven, regular as clockwork.", "options": ["arrived", "arrives", "is arriving", "will arrive"], "answer": 1, "explanation": "Thói quen hằng ngày (every day) → hiện tại đơn: arrives.", "vi": "Emily đến lúc 7 giờ mỗi ngày, đều đặn như đồng hồ.", "tags": ["grammar"]}, {"q": "_________ she _________ the English exams with high marks?", "options": ["Do ... often pass", "Does ... often pass", "Does ... pass often", "Do ... pass often"], "answer": 1, "explanation": "Câu hỏi hiện tại đơn với \"she\" → Does; trạng từ tần suất đứng trước động từ chính: often pass.", "vi": "Cô ấy có thường đậu các kỳ thi tiếng Anh với điểm cao không?", "tags": ["mixed"]}, {"q": "When the weather is good, he _________ camping in the mountain.", "options": ["usually goes", "goes usually", "usually go", "go usually"], "answer": 0, "explanation": "Trạng từ tần suất đứng trước động từ thường; chủ ngữ \"he\" → usually goes.", "vi": "Khi thời tiết đẹp, anh ấy thường đi cắm trại trên núi.", "tags": ["grammar"]}, {"q": "I think horse-riding _________ to learn, and it's not popular here.", "options": ["be easy", "easy", "is not easy", "not easy"], "answer": 2, "explanation": "Cần động từ to be chia: horse-riding is not easy to learn.", "vi": "Tôi nghĩ cưỡi ngựa không dễ học, và nó không phổ biến ở đây.", "tags": ["vocab"]}]}, {"roman": "IV", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống. Xem lại 'họ từ' (word family) bên dưới mỗi câu để ghi nhớ.", "type": "fill", "questions": [{"q": "Science books are very ________________ for our study of the world.", "hint": "(use)", "answer": "useful", "explanation": "Tính từ: use → useful (có ích).", "vi": "Sách khoa học rất hữu ích cho việc tìm hiểu thế giới của chúng ta.", "family": ["use (v): sử dụng", "user (n): người sử dụng", "useful (adj): có ích", "useless (adj): vô ích"]}, {"q": "Ba is a football sticker _______________. He has a big _______________ of stickers.", "hint": "(collect)", "answer": "collector - collection", "explanation": "Danh từ chỉ người: collector; danh từ chỉ vật: collection (bộ sưu tập).", "vi": "Ba là một người sưu tầm hình dán bóng đá. Cậu ấy có một bộ sưu tập hình dán lớn.", "family": ["collect (v): sưu tầm, thu thập", "collector (n): người sưu tầm", "collection (n): bộ sưu tập"]}, {"q": "The most popular after-school ______________ in Viet Nam are football and badminton.", "hint": "(act)", "answer": "activities", "explanation": "Danh từ số nhiều (động từ \"are\"): act → activities.", "vi": "Các hoạt động sau giờ học phổ biến nhất ở Việt Nam là bóng đá và cầu lông.", "family": ["act (v/n): hành động", "actor (n): diễn viên", "activity (n): hoạt động", "active (adj): năng động", "actress (n): diễn viên nữ", "action (n): hành động"]}, {"q": "My mother loves flowers because they are _________________.", "hint": "(beauty)", "answer": "beautiful", "explanation": "Tính từ sau \"are\": beauty → beautiful (đẹp).", "vi": "Mẹ tôi yêu hoa vì chúng rất đẹp.", "family": ["beauty (n): vẻ đẹp", "beautiful (adj): đẹp", "beautifully (adv): một cách đẹp đẽ"]}, {"q": "Our soccer team has many talented ________________.", "hint": "(play)", "answer": "players", "explanation": "Danh từ chỉ người, số nhiều (many): play → players.", "vi": "Đội bóng đá của chúng tôi có nhiều cầu thủ tài năng.", "family": ["play (v): chơi", "player (n): người chơi, cầu thủ", "playful (adj): vui đùa"]}, {"q": "Tom Holland is very famous ________________.", "hint": "(act)", "answer": "actor", "explanation": "Danh từ chỉ người: act → actor (diễn viên).", "vi": "Tom Holland là một diễn viên rất nổi tiếng.", "family": ["act (v/n): hành động", "actor (n): diễn viên", "activity (n): hoạt động", "active (adj): năng động", "actress (n): diễn viên nữ", "action (n): hành động"]}, {"q": "They learn to play a ________________ instrument.", "hint": "(music)", "answer": "musical", "explanation": "Tính từ bổ nghĩa cho danh từ \"instrument\": music → musical.", "vi": "Họ học chơi một nhạc cụ.", "family": ["music (n): âm nhạc", "musical (adj): thuộc về âm nhạc", "musician (n): nhạc sĩ"]}, {"q": "English is an _________________ and important subject.", "hint": "(interest)", "answer": "interesting", "explanation": "Tính từ -ing (chỉ tính chất của sự vật): interesting (hay, thú vị).", "vi": "Tiếng Anh là một môn học thú vị và quan trọng.", "family": ["interest (n): sở thích, sự quan tâm", "interesting (adj): thú vị (sự vật)", "interested (adj): cảm thấy thích (người)", "uninteresting (adj): không thú vị"]}, {"q": "You look tired after hard work, you should _______________ now.", "hint": "(relaxing)", "answer": "relax", "explanation": "Sau \"should\" cần động từ nguyên thể: relax.", "vi": "Bạn trông mệt sau khi làm việc vất vả, bạn nên thư giãn ngay bây giờ.", "family": ["relax (v): thư giãn", "relaxed (adj): cảm thấy thư giãn", "relaxing (adj): giúp thư giãn", "relaxation (n): sự thư giãn"]}, {"q": "We are really ______________ in playing chess in our free time.", "hint": "(interest)", "answer": "interested", "explanation": "\"be interested in\" = thích, quan tâm đến.", "vi": "Chúng tôi thực sự thích chơi cờ vua lúc rảnh.", "family": ["interest (n): sở thích, sự quan tâm", "interesting (adj): thú vị (sự vật)", "interested (adj): cảm thấy thích (người)", "uninteresting (adj): không thú vị"]}, {"q": "I can't use this basket anymore. It's ______________.", "hint": "(use)", "answer": "useless", "explanation": "Không dùng được nữa → vô ích: useless.", "vi": "Tôi không thể dùng cái giỏ này nữa. Nó vô dụng rồi.", "family": ["use (v): sử dụng", "user (n): người sử dụng", "useful (adj): có ích", "useless (adj): vô ích"]}, {"q": "Listening to music helps me feel ______________ after studying.", "hint": "(relax)", "answer": "relaxed", "explanation": "Tính từ -ed chỉ cảm giác của người (feel + adj): relaxed.", "vi": "Nghe nhạc giúp tôi cảm thấy thư giãn sau khi học.", "family": ["relax (v): thư giãn", "relaxed (adj): cảm thấy thư giãn", "relaxing (adj): giúp thư giãn", "relaxation (n): sự thư giãn"]}, {"q": "My sister sings very _____________, so everyone likes listening to her.", "hint": "(beautiful)", "answer": "beautifully", "explanation": "Trạng từ bổ nghĩa cho động từ \"sings\": beautifully.", "vi": "Chị tôi hát rất hay, nên ai cũng thích nghe.", "family": ["beauty (n): vẻ đẹp", "beautiful (adj): đẹp", "beautifully (adv): một cách đẹp đẽ"]}, {"q": "I think you shouldn't read this book because it's _________________.", "hint": "(interest)", "answer": "uninteresting", "explanation": "Không nên đọc vì nó không hay → uninteresting.", "vi": "Tôi nghĩ bạn không nên đọc cuốn sách này vì nó không hay.", "family": ["interest (n): sở thích, sự quan tâm", "interesting (adj): thú vị (sự vật)", "interested (adj): cảm thấy thích (người)", "uninteresting (adj): không thú vị"]}, {"q": "Reading is one of the most _______________ hobbies for students.", "hint": "(use)", "answer": "useful", "explanation": "Tính từ bổ nghĩa cho \"hobbies\": useful (có ích).", "vi": "Đọc sách là một trong những sở thích có ích nhất cho học sinh.", "family": ["use (v): sử dụng", "user (n): người sử dụng", "useful (adj): có ích", "useless (adj): vô ích"]}]}, {"roman": "V", "navLabel": "Đọc điền từ A", "title": "Reading: Choose the best answer (A)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "Passage 1: My Favourite Hobby", "html": "Everyone has a hobby that they enjoy in their free time. My favourite hobby is collecting stamps. I started this hobby when I was ten years old because my grandfather gave me some old stamps from different countries. Since then, I have collected hundreds of stamps. This hobby helps me <span class='blank-tag'>(1)</span> ______ about different cultures and countries around the world. I usually put my stamps in special books and organize them <span class='blank-tag'>(2)</span> ______ country. Collecting stamps is not only interesting but also educational. It teaches me patience because I need time to find rare stamps. Sometimes, I exchange stamps <span class='blank-tag'>(3)</span> ______ my friends who have the same hobby. I think collecting stamps is a great hobby because it makes my life more <span class='blank-tag'>(4)</span> ______. Although some people think collecting stamps is boring, I really enjoy it. I will continue this hobby <span class='blank-tag'>(5)</span> ______ I can learn more about the world. In the future, I hope to have a large <span class='blank-tag'>(6)</span> ______ of valuable stamps.", "vi": "Ai cũng có một sở thích để tận hưởng lúc rảnh rỗi. Sở thích yêu thích của tôi là sưu tầm tem. Tôi bắt đầu sở thích này năm mười tuổi vì ông tôi tặng tôi vài con tem cũ từ các nước khác nhau. Từ đó, tôi đã sưu tầm được hàng trăm con tem. Sở thích này giúp tôi (1) tìm hiểu về các nền văn hóa và quốc gia trên thế giới. Tôi thường đặt tem vào những cuốn sách đặc biệt và sắp xếp chúng (2) theo quốc gia. Sưu tầm tem không chỉ thú vị mà còn mang tính giáo dục. Nó dạy tôi tính kiên nhẫn vì tôi cần thời gian để tìm những con tem hiếm. Đôi khi, tôi trao đổi tem (3) với những người bạn có cùng sở thích. Tôi nghĩ sưu tầm tem là một sở thích tuyệt vời vì nó làm cuộc sống của tôi (4) thú vị hơn. Dù một số người cho rằng sưu tầm tem thật nhàm chán, tôi thực sự thích nó. Tôi sẽ tiếp tục sở thích này (5) vì tôi có thể tìm hiểu thêm về thế giới. Trong tương lai, tôi hy vọng có một (6) bộ sưu tập lớn những con tem giá trị."}, "questions": [{"q": "(1) This hobby helps me ______ about different cultures...", "options": ["learn", "learns", "learned", "learning"], "answer": 0, "explanation": "\"help sb + V (nguyên thể)\" → learn.", "vi": null, "vis": ["học (nguyên thể)", "học (ngôi 3 số ít)", "đã học", "đang học"]}, {"q": "(2) I organize them ______ country.", "options": ["by", "on", "at", "from"], "answer": 0, "explanation": "\"organize by country\" = sắp xếp theo quốc gia.", "vi": null, "vis": ["theo, bởi", "trên", "tại", "từ"]}, {"q": "(3) I exchange stamps ______ my friends.", "options": ["with", "for", "about", "in"], "answer": 0, "explanation": "\"exchange sth with sb\" = trao đổi với ai.", "vi": null, "vis": ["với", "cho", "về", "trong"]}, {"q": "(4) It makes my life more ______.", "options": ["boring", "interesting", "difficult", "expensive"], "answer": 1, "explanation": "Sở thích tuyệt vời → làm cuộc sống thú vị hơn: interesting.", "vi": null, "vis": ["nhàm chán", "thú vị", "khó khăn", "đắt đỏ"]}, {"q": "(5) I will continue this hobby ______ I can learn more about the world.", "options": ["because", "but", "or", "so"], "answer": 0, "explanation": "Nêu lý do tiếp tục sở thích → because.", "vi": null, "vis": ["bởi vì", "nhưng", "hoặc", "vì vậy"]}, {"q": "(6) I hope to have a large ______ of valuable stamps.", "options": ["collection", "collect", "collecting", "collected"], "answer": 0, "explanation": "Sau \"a large\" cần danh từ: collection (bộ sưu tập).", "vi": null, "vis": ["bộ sưu tập (n)", "sưu tầm (v)", "đang sưu tầm", "đã sưu tầm"]}]}, {"roman": "VI", "navLabel": "Đọc điền từ B", "title": "Reading: Choose the best answer (B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "Passage 2: Healthy Hobbies", "html": "Hobbies are activities that people do in their free time. One of my favourite hobbies is gardening. I usually spend two hours <span class='blank-tag'>(1)</span> ______ plants and flowers in my garden every weekend. Gardening is good for both my body and mind. It helps me stay active and feel relaxed after a busy week at school. I enjoy growing vegetables because they are fresh and <span class='blank-tag'>(2)</span> ______. My family often uses the vegetables from my garden to prepare meals. I think we should choose activities that are suitable <span class='blank-tag'>(3)</span> ______ our interests and abilities. Besides gardening, I also like reading books and listening <span class='blank-tag'>(4)</span> ______ music. These activities help me reduce stress and improve my <span class='blank-tag'>(5)</span> ______ skills. In the future, I hope to make my garden bigger and grow more kinds of <span class='blank-tag'>(6)</span> ______.", "vi": "Sở thích là những hoạt động mọi người làm lúc rảnh rỗi. Một trong những sở thích yêu thích của tôi là làm vườn. Tôi thường dành hai tiếng (1) chăm sóc cây và hoa trong vườn vào mỗi cuối tuần. Làm vườn tốt cho cả cơ thể lẫn tinh thần của tôi. Nó giúp tôi năng động và cảm thấy thư giãn sau một tuần bận rộn ở trường. Tôi thích trồng rau vì chúng tươi và (2) tốt cho sức khỏe. Gia đình tôi thường dùng rau từ vườn để nấu ăn. Tôi nghĩ chúng ta nên chọn những hoạt động phù hợp (3) với sở thích và khả năng của mình. Ngoài làm vườn, tôi cũng thích đọc sách và nghe (4) nhạc. Những hoạt động này giúp tôi giảm căng thẳng và cải thiện kỹ năng (5) giao tiếp. Trong tương lai, tôi hy vọng mở rộng khu vườn và trồng thêm nhiều loại (6) hoa."}, "questions": [{"q": "(1) I usually spend two hours ______ plants and flowers.", "options": ["take care of", "taking care of", "took care of", "takes care of"], "answer": 1, "explanation": "\"spend time + V-ing\" → taking care of.", "vi": null, "vis": ["chăm sóc (nguyên thể)", "chăm sóc (V-ing)", "đã chăm sóc", "chăm sóc (ngôi 3)"]}, {"q": "(2) They are fresh and ______.", "options": ["healthy", "health", "healthily", "unhealthy"], "answer": 0, "explanation": "Tính từ song song với \"fresh\": healthy.", "vi": null, "vis": ["tốt cho sức khỏe (adj)", "sức khỏe (n)", "một cách lành mạnh (adv)", "không lành mạnh"]}, {"q": "(3) Activities that are suitable ______ our interests and abilities.", "options": ["with", "from", "for", "to"], "answer": 2, "explanation": "\"suitable for\" = phù hợp với.", "vi": null, "vis": ["với", "từ", "cho (suitable for)", "đến"]}, {"q": "(4) I like reading books and listening ______ music.", "options": ["at", "in", "to", "for"], "answer": 2, "explanation": "\"listen to music\" = nghe nhạc.", "vi": null, "vis": ["tại", "trong", "đến (listen to)", "cho"]}, {"q": "(5) These activities improve my ______ skills.", "options": ["communicate", "communication", "communicating", "communicated"], "answer": 1, "explanation": "Danh từ ghép: communication skills (kỹ năng giao tiếp).", "vi": null, "vis": ["giao tiếp (v)", "sự giao tiếp (n)", "đang giao tiếp", "đã giao tiếp"]}, {"q": "(6) Grow more kinds of ______.", "options": ["flower", "flowers", "flowering", "flowered"], "answer": 1, "explanation": "\"kinds of + danh từ số nhiều\" → flowers.", "vi": null, "vis": ["hoa (số ít)", "hoa (số nhiều)", "đang nở hoa", "đã nở hoa"]}]}, {"roman": "VII", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Passage 1: Tâm's hobby", "html": "My name is Tâm and my hobby is reading. I often read story books, magazines, newspapers and any kind of material that I find interesting, especially knowledgeable books in my free time. I really love reading. Reading helps me discover new things. Books give me with so much information and many facts. They have certainly helped me in my daily life. Libraries are the source from which I get the books I need. My relatives and my friends also give me books on special occasions. I will certainly continue my reading hobby. It is a good hobby.", "vi": "Tôi tên là Tâm và sở thích của tôi là đọc sách. Tôi thường đọc truyện, tạp chí, báo và bất kỳ tài liệu nào tôi thấy thú vị, đặc biệt là những cuốn sách bổ ích, lúc rảnh rỗi. Tôi thực sự yêu việc đọc. Đọc sách giúp tôi khám phá những điều mới. Sách mang lại cho tôi rất nhiều thông tin và sự thật. Chúng chắc chắn đã giúp tôi trong cuộc sống hằng ngày. Thư viện là nguồn tôi lấy những cuốn sách mình cần. Người thân và bạn bè cũng tặng tôi sách vào những dịp đặc biệt. Tôi chắc chắn sẽ tiếp tục sở thích đọc sách. Đó là một sở thích tốt."}, "questions": [{"q": "Tâm's hobby is reading.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"my hobby is reading\" → Đúng.", "vi": "Sở thích của Tâm là đọc sách.", "vis": ["Đúng", "Sai"]}, {"q": "He reads only story books and magazines.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: đọc cả báo và bất kỳ tài liệu nào thú vị → không chỉ truyện và tạp chí → Sai.", "vi": "Cậu ấy chỉ đọc truyện và tạp chí.", "vis": ["Đúng", "Sai"]}, {"q": "He gets the books from the library.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Libraries are the source from which I get the books\" → Đúng.", "vi": "Cậu ấy lấy sách từ thư viện.", "vis": ["Đúng", "Sai"]}, {"q": "He will not continue his reading hobby.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"I will certainly continue my reading hobby\" → Sai.", "vi": "Cậu ấy sẽ không tiếp tục sở thích đọc sách.", "vis": ["Đúng", "Sai"]}, {"q": "Reading __________ Tâm discover new things.", "options": ["helps", "helper", "helped", "helping"], "answer": 0, "explanation": "Bài đọc: \"Reading helps me discover new things\"; chủ ngữ V-ing → helps.", "vi": "Đọc sách giúp Tâm khám phá những điều mới.", "vis": ["giúp (v, ngôi 3)", "người giúp đỡ (n)", "đã giúp", "đang giúp"]}, {"q": "Books give him with so much ____________ and many facts.", "options": ["games", "information", "lessons", "food and drink"], "answer": 1, "explanation": "Bài đọc: \"Books give me with so much information and many facts\".", "vi": "Sách mang lại cho cậu ấy rất nhiều thông tin và sự thật.", "vis": ["trò chơi", "thông tin", "bài học", "đồ ăn thức uống"]}]}, {"roman": "VIII", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Passage 2: Kien's swimming", "html": "Every day, Kien usually goes swimming after school. He practices swimming five times a week. His swimming pool is very good. The pool is 25 metres long and has six lanes. The swimming lessons last 45 minutes, but he usually trains for an hour and a half. During the lesson he swims about two kilometers. His favourite swimming styles are crawl and backstroke. He practices a lot to improve his swimming skills. He wants to achieve good results. Last month he participated in a swimming competition. Ten swimmers from three schools took part in the competition. He won first prize. Swimming is his favourite sport. Swimming is interesting and pleasant, and it helps him to keep fit.", "vi": "Mỗi ngày, Kiên thường đi bơi sau giờ học. Cậu ấy tập bơi năm lần một tuần. Hồ bơi của cậu ấy rất tốt. Hồ dài 25 mét và có sáu làn. Buổi học bơi kéo dài 45 phút, nhưng cậu ấy thường tập một tiếng rưỡi. Trong buổi học cậu ấy bơi khoảng hai ki-lô-mét. Kiểu bơi yêu thích của cậu là bơi sải và bơi ngửa. Cậu tập nhiều để cải thiện kỹ năng bơi. Cậu muốn đạt kết quả tốt. Tháng trước cậu tham gia một cuộc thi bơi. Mười vận động viên từ ba trường tham gia cuộc thi. Cậu giành giải nhất. Bơi là môn thể thao yêu thích của cậu. Bơi thú vị, dễ chịu và giúp cậu giữ dáng."}, "questions": [{"q": "Kien goes home after school every day.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Kien usually goes swimming after school\" (đi bơi, không phải về nhà) → Sai.", "vi": "Kiên về nhà sau giờ học mỗi ngày.", "vis": ["Đúng", "Sai"]}, {"q": "He practices swimming five times a month.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"five times a week\" (một tuần, không phải một tháng) → Sai.", "vi": "Cậu ấy tập bơi năm lần một tháng.", "vis": ["Đúng", "Sai"]}, {"q": "The swimming lessons last 45 minutes.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The swimming lessons last 45 minutes\" → Đúng.", "vi": "Buổi học bơi kéo dài 45 phút.", "vis": ["Đúng", "Sai"]}, {"q": "Kiên won the first prize in the swimming competition.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"He won first prize\" → Đúng.", "vi": "Kiên giành giải nhất trong cuộc thi bơi.", "vis": ["Đúng", "Sai"]}, {"q": "What is the correct ordinal number for first?", "options": ["1st", "2nd", "3rd", "10th"], "answer": 0, "explanation": "first = thứ nhất = 1st.", "vi": "Số thứ tự đúng của \"first\" là gì?", "vis": ["thứ nhất", "thứ hai", "thứ ba", "thứ mười"]}, {"q": "Swimming is an ____________ and pleasant activity.", "options": ["dangerous", "boring", "bad", "interesting"], "answer": 3, "explanation": "Bài đọc: \"Swimming is interesting and pleasant\".", "vi": "Bơi là một hoạt động thú vị và dễ chịu.", "vis": ["nguy hiểm", "nhàm chán", "tệ", "thú vị"]}]}, {"roman": "IX", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc. Dùng đúng từ gợi ý ở đầu câu.", "type": "sentence", "instant": true, "questions": [{"q": "R1.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>My/ likes/ mother/ to/ music/. / listening</b>", "starter": "", "answer": "My mother likes listening to music.", "accepted": null, "explanation": "S + likes + V-ing: My mother likes listening to music.", "vi": "Mẹ tôi thích nghe nhạc.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R2.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>his/ car/. / Ana's dad/ washing/ hates</b>", "starter": "", "answer": "Ana's dad hates washing his car.", "accepted": null, "explanation": "S + hates + V-ing + O.", "vi": "Bố của Ana ghét rửa xe của ông ấy.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R3.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>traveling/ father's friend/ by/ loves/ My/ plane/. /</b>", "starter": "", "answer": "My father's friend loves traveling by plane.", "accepted": null, "explanation": "S + loves + V-ing + by plane.", "vi": "Bạn của bố tôi thích đi du lịch bằng máy bay.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R4.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>emails/. / writing/ I/ long/ hate</b>", "starter": "", "answer": "I hate writing long emails.", "accepted": null, "explanation": "S + hate + V-ing + O.", "vi": "Tôi ghét viết những email dài.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "R5.", "original": "<span class='text-slate-500'>Sắp xếp:</span> <b>watching/ enjoy/ action films/ She/ TV/. / on</b>", "starter": "", "answer": "She enjoys watching action films on TV.", "accepted": null, "explanation": "S + enjoys + V-ing + O + on TV.", "vi": "Cô ấy thích xem phim hành động trên TV.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"q": "T1.", "original": "I'm interested in collecting stamps.", "starter": "I", "answer": "like collecting stamps", "accepted": ["like collecting stamps", "love collecting stamps", "enjoy collecting stamps"], "explanation": "be interested in + V-ing = like/love/enjoy + V-ing.", "vi": "Tôi thích sưu tầm tem.", "note": "S + be interested in + V-ing → S + like/love/enjoy + V-ing"}, {"q": "T2.", "original": "Miss Linh enjoys playing chess with her son in her free time.", "starter": "Miss Linh is", "answer": "interested in playing chess with her son in her free time", "accepted": ["interested in playing chess with her son in her free time", "fond of playing chess with her son in her free time", "keen on playing chess with her son in her free time", "into playing chess with her son in her free time"], "explanation": "enjoy + V-ing = be interested in / fond of / keen on + V-ing.", "vi": "Cô Linh thích chơi cờ vua với con trai lúc rảnh.", "note": "S + enjoy + V-ing → S + be interested in / fond of / keen on + V-ing"}, {"q": "T3.", "original": "Do you like playing board games?", "starter": "Are you", "answer": "interested in playing board games", "accepted": ["interested in playing board games", "fond of playing board games", "keen on playing board games", "into playing board games"], "explanation": "like + V-ing = be interested in / fond of / keen on + V-ing.", "vi": "Bạn có thích chơi các trò chơi trên bàn cờ không?", "note": "Do you like + V-ing? → Are you interested in / fond of / keen on + V-ing?"}, {"q": "T4.", "original": "I hate watching TV programs for children.", "starter": "I don't", "answer": "like watching TV programs for children", "accepted": null, "explanation": "hate + V-ing = don't like + V-ing.", "vi": "Tôi ghét xem các chương trình TV dành cho trẻ em.", "note": "S + hate + V-ing → S + don't like + V-ing"}, {"q": "T5.", "original": "I hate watching TV programs for children.", "starter": "I'm not", "answer": "interested in watching TV programs for children", "accepted": ["interested in watching TV programs for children", "fond of watching TV programs for children", "keen on watching TV programs for children"], "explanation": "hate + V-ing = be not interested in / not fond of / not keen on + V-ing.", "vi": "Tôi ghét xem các chương trình TV dành cho trẻ em.", "note": "S + hate + V-ing → S + be not interested in / fond of / keen on + V-ing"}, {"q": "T6.", "original": "They are interested in drinking tea after meals.", "starter": "They like", "answer": "drinking tea after meals", "accepted": null, "explanation": "be interested in + V-ing = like + V-ing.", "vi": "Họ thích uống trà sau bữa ăn.", "note": "S + be interested in + V-ing → S + like + V-ing"}, {"q": "T7.", "original": "Our grandmother loves cooking and sewing. (be interested)", "starter": "", "answer": "Our grandmother is interested in cooking and sewing.", "accepted": null, "explanation": "love + V-ing = be interested in + V-ing.", "vi": "Bà của chúng tôi thích nấu ăn và may vá.", "note": "S + love + V-ing → S + be interested in + V-ing"}, {"q": "T8.", "original": "How about going to see a volleyball game together?", "starter": "Why don't we", "answer": "go to see a volleyball game together", "accepted": null, "explanation": "How about + V-ing? = Why don't we + V?", "vi": "Chúng ta cùng đi xem một trận bóng chuyền nhé?", "note": "How about + V-ing? → Why don't we + V (nguyên thể)?"}, {"q": "T9.", "original": "It's good that we do exercise regularly.", "starter": "We should", "answer": "do exercise regularly", "accepted": null, "explanation": "It's good that we + V = We should + V.", "vi": "Chúng ta nên tập thể dục thường xuyên.", "note": "It's good that S + V → S + should + V"}, {"q": "T10.", "original": "It's very good to eat healthy food.", "starter": "We should", "answer": "eat healthy food", "accepted": null, "explanation": "It's good to + V = We should + V.", "vi": "Chúng ta nên ăn thực phẩm lành mạnh.", "note": "It's good to + V → S + should + V"}, {"q": "T11.", "original": "It's not good to stay up so late to listen to music.", "starter": "You shouldn't", "answer": "stay up so late to listen to music", "accepted": null, "explanation": "It's not good to + V = You shouldn't + V.", "vi": "Bạn không nên thức khuya như vậy để nghe nhạc.", "note": "It's not good to + V → S + shouldn't + V"}]}, {"roman": "X", "navLabel": "Từ điển 1", "title": "Tra từ điển \"hobby\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "hobby", "ipa": "/ˈhɒbi/", "pos": "noun", "senses": [{"def": "an activity that you do for pleasure when you are not working", "examples": ["Her hobbies include reading and playing tennis.", "Gardening is a popular hobby among older people.", "He took up photography as a hobby.", "What are your hobbies and interests?"]}], "vi": "<b>hobby</b> /ˈhɒbi/ (danh từ)<br>hoạt động bạn làm để giải trí khi không phải làm việc.<br>• Sở thích của cô ấy gồm đọc sách và chơi tennis.<br>• Làm vườn là sở thích phổ biến ở người lớn tuổi.<br>• Anh ấy theo đuổi nhiếp ảnh như một sở thích.<br>• Sở thích và mối quan tâm của bạn là gì?"}, "questions": [{"q": "A. Photography __________ for him since he was a teenager.", "answer": "took up", "explanation": "Dựa vào ví dụ: took up (theo đuổi/bắt đầu làm).", "vi": "Nhiếp ảnh đã trở thành điều anh ấy theo đuổi từ khi còn thiếu niên."}, {"q": "B. Reading and playing badminton are among her _______________.", "answer": "hobbies", "explanation": "Dựa vào ví dụ: hobbies.", "vi": "Đọc sách và chơi cầu lông là những sở thích của cô ấy."}]}, {"roman": "XI", "navLabel": "Từ điển 2", "title": "Tra từ điển \"relax\"", "icon": "book-bookmark", "instructions": "Dựa vào mục từ điển, hoàn thành câu.", "type": "fill", "dict": {"word": "relax", "ipa": "/rɪˈlæks/", "pos": "verb", "senses": [{"def": "to rest while you are awake, especially after work or effort, by doing something enjoyable", "examples": ["I spent the weekend relaxing at home.", "Try to relax and enjoy the trip.", "Listening to music helps me relax after a long day.", "Take a few days off to relax and recover."]}], "vi": "<b>relax</b> /rɪˈlæks/ (động từ)<br>nghỉ ngơi khi còn thức, đặc biệt sau khi làm việc/gắng sức, bằng cách làm điều gì thú vị.<br>• Tôi đã dành cả cuối tuần thư giãn ở nhà.<br>• Hãy cố gắng thư giãn và tận hưởng chuyến đi.<br>• Nghe nhạc giúp tôi thư giãn sau một ngày dài.<br>• Nghỉ vài ngày để thư giãn và hồi phục."}, "questions": [{"q": "A. After a stressful exam, she just wants to stay home and ________________.", "answer": "relax", "explanation": "Dựa vào ví dụ: relax.", "vi": "Sau kỳ thi căng thẳng, cô ấy chỉ muốn ở nhà và thư giãn."}, {"q": "B. ________________ to music helps me relax after a long day at school.", "answer": "Listening", "explanation": "Dựa vào ví dụ: Listening to music helps me relax.", "vi": "Nghe nhạc giúp tôi thư giãn sau một ngày dài ở trường."}]}, {"roman": "XII", "navLabel": "Biển báo", "title": "Pictures and Signs", "icon": "traffic-light", "instructions": "Đọc biển báo/thông báo và chọn ý đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">📵</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO MOBILE PHONES</p></div>", "options": ["You can take photos here.", "You must turn on your phone.", "You can make a phone call here.", "You mustn't use mobile phones here."], "answer": 3, "explanation": "Biển có hình điện thoại bị gạch chéo → cấm sử dụng điện thoại di động.", "vis": ["Bạn có thể chụp ảnh ở đây.", "Bạn phải bật điện thoại.", "Bạn có thể gọi điện ở đây.", "Bạn không được dùng điện thoại di động ở đây."]}, {"q": "What activity does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🛹</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["playing basketball", "cycling", "skateboarding", "playing chess"], "answer": 2, "explanation": "Hình một người đang trượt ván → skateboarding.", "vis": ["chơi bóng rổ", "đạp xe", "trượt ván", "chơi cờ vua"]}, {"q": "What activity does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🧘</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["playing chess", "doing yoga", "playing football", "cooking"], "answer": 1, "explanation": "Hình một người đang ngồi thiền/tập yoga → doing yoga.", "vis": ["chơi cờ vua", "tập yoga", "chơi bóng đá", "nấu ăn"]}]}, {"roman": "", "navLabel": "Hiện tại đơn", "title": "Present Simple: Chia động từ", "icon": "pen", "instructions": "Chia động từ trong ngoặc ở thì hiện tại đơn (nhấn Enter để kiểm tra từng câu).", "type": "fill", "instant": true, "questions": [{"q": "She ____________ to put all of her dolls in her dollhouse.", "answer": "wants", "explanation": "Chủ ngữ \"She\" + hiện tại đơn → wants.", "hint": "(want)", "vi": "Cô ấy muốn đặt tất cả búp bê vào ngôi nhà búp bê."}, {"q": "This ____________ the first horse riding programme in our city.", "answer": "is", "explanation": "\"This\" số ít → is.", "hint": "(be)", "vi": "Đây là chương trình cưỡi ngựa đầu tiên ở thành phố chúng tôi."}, {"q": "My uncle ____________ exercise at the park every morning.", "answer": "does", "explanation": "\"My uncle\" số ít → does.", "hint": "(do)", "vi": "Chú tôi tập thể dục ở công viên mỗi sáng."}, {"q": "Stacy _____________ playing the guitar three times a week.", "answer": "practices", "explanation": "\"Stacy\" số ít → practices.", "hint": "(practice)", "vi": "Stacy luyện chơi ghi-ta ba lần một tuần.", "accepted": ["practices", "practises"]}, {"q": "Our neighbour ____________ a very healthy hobby.", "answer": "doesn't have", "explanation": "Phủ định, chủ ngữ số ít → doesn't have.", "hint": "(not have)", "vi": "Hàng xóm của chúng tôi không có một sở thích lành mạnh cho lắm.", "accepted": ["doesn't have", "does not have"]}, {"q": "Her friends ____________ doing yoga in their free time.", "answer": "like", "explanation": "Chủ ngữ số nhiều → like.", "hint": "(like)", "vi": "Bạn bè của cô ấy thích tập yoga lúc rảnh."}, {"q": "The concert tickets ____________ cheap.", "answer": "aren't", "explanation": "Chủ ngữ số nhiều, phủ định → aren't.", "hint": "(not be)", "vi": "Vé hòa nhạc không rẻ.", "accepted": ["aren't", "are not"]}, {"q": "__________ the school bus ____________ at six o'clock?", "answer": "Does ... leave", "explanation": "Câu hỏi, chủ ngữ số ít → Does ... leave? (nhập: Does / leave)", "hint": "(leave)", "vi": "Xe buýt trường có khởi hành lúc sáu giờ không?", "accepted": ["Does ... leave", "does leave"]}, {"q": "They ____________ much in the evenings but watch television.", "answer": "don't do", "explanation": "Phủ định, chủ ngữ số nhiều → don't do.", "hint": "(not do)", "vi": "Buổi tối họ không làm gì nhiều ngoài xem TV.", "accepted": ["don't do", "do not do"]}, {"q": "______________________ football with his friends every weekend?", "answer": "Does John play", "explanation": "Câu hỏi hiện tại đơn, chủ ngữ số ít → Does John play...?", "hint": "(John play)", "vi": "John có chơi bóng đá với bạn bè mỗi cuối tuần không?"}]}, {"roman": "", "navLabel": "📌 Tổng hợp kiến thức", "title": "Kiến thức cần nhớ — Unit 1", "icon": "graduation-cap", "type": "info", "info": "<p class=\"text-sm text-slate-500 italic mb-3\">Tổng hợp lại toàn bộ kiến thức trọng tâm của Unit 1 để ôn tập — có mẹo ghi nhớ và vài câu trắc nghiệm áp dụng ngay theo từng dạng.</p>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-s / -es</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Nghe thấy âm \"rít/xì\" cuối từ (s, z, sh, ch, ge/dge) → đọc <b>/ɪz/</b> (thêm hẳn 1 âm tiết). Còn lại: âm \"nhẹ không rung dây thanh\" (p, t, k, f, th) → đọc <b>/s/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/z/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ/danh từ</th><th class=\"border px-2 py-1\">Phát âm đuôi -s/-es</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/s/, /z/, /ʃ/, /ʒ/, /tʃ/, /dʒ/ (âm rít/xát)</td><td class=\"border px-2 py-1 font-bold\">/ɪz/</td><td class=\"border px-2 py-1 italic\">watches, buses, brushes</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh: /p/, /t/, /k/, /f/, /θ/</td><td class=\"border px-2 py-1 font-bold\">/s/</td><td class=\"border px-2 py-1 italic\">pictures (tʃ→ khác nhóm), laughs, walks</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/z/</td><td class=\"border px-2 py-1 italic\">plays, loves, goes</td></tr>\n  </table>\n  </div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-ear-listen mr-1\"></i>Quy tắc phát âm đuôi <b>-ed</b></p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Động từ đã tận cùng bằng chính \"t\" hoặc \"d\" thì mới đọc <b>/ɪd/</b> (không thể ghép liền phụ âm giống nhau). Còn lại: âm \"nhẹ không rung\" (k, p, s, sh, ch, f) → đọc <b>/t/</b>; mọi trường hợp khác (rung dây thanh + nguyên âm) → đọc <b>/d/</b>.</p></div>\n  <div class=\"overflow-x-auto\">\n  <table class=\"w-full text-sm border-collapse\">\n    <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Âm cuối động từ nguyên mẫu</th><th class=\"border px-2 py-1\">Phát âm đuôi -ed</th><th class=\"border px-2 py-1\">Ví dụ</th></tr>\n    <tr><td class=\"border px-2 py-1\">/t/ hoặc /d/</td><td class=\"border px-2 py-1 font-bold\">/ɪd/</td><td class=\"border px-2 py-1 italic\">needed, wanted, decided</td></tr>\n    <tr><td class=\"border px-2 py-1\">Phụ âm vô thanh khác: /k/, /p/, /s/, /ʃ/, /tʃ/, /f/</td><td class=\"border px-2 py-1 font-bold\">/t/</td><td class=\"border px-2 py-1 italic\">worked, watched, walked</td></tr>\n    <tr><td class=\"border px-2 py-1\">Nguyên âm và phụ âm hữu thanh còn lại</td><td class=\"border px-2 py-1 font-bold\">/d/</td><td class=\"border px-2 py-1 italic\">played, loved, cleaned</td></tr>\n  </table>\n  </div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -s/-es</p>\n  <div id=\"miniquiz-sEs\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-sEs\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Phát âm đuôi -ed</p>\n  <div id=\"miniquiz-ed\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-ed\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-bullseye mr-1\"></i>Mẹo nhận biết trọng âm từ 2 âm tiết</p>\n  <div class=\"bg-amber-50 border-2 border-amber-300 rounded-xl px-4 py-3 my-2\"><p class=\"text-sm text-amber-900\"><b>🧠 Mẹo ghi nhớ:</b> Với từ có 2 âm tiết: DANH TỪ và TÍNH TỪ thường nhấn âm tiết ĐẦU (VD: PICture, HAPpy); ĐỘNG TỪ thường nhấn âm tiết THỨ HAI (VD: enJOY, reLAX). Đây là xu hướng phổ biến, vẫn có một số từ ngoại lệ (VD: open, answer).</p></div>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-emerald-800 mb-3\"><i class=\"fa-solid fa-bolt mr-1\"></i>Áp dụng ngay — Trọng âm</p>\n  <div id=\"miniquiz-stress\" class=\"space-y-3\"></div>\n  <span id=\"miniquiz-score-stress\" class=\"text-xs font-extrabold text-emerald-600\"></span>\n</div>\n\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Phát âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-slate-500'>st<u>a</u>mp</b> <span class='text-slate-400'>/stæmp/</span> · <b class='text-slate-500'>gl<u>a</u>ss</b> <span class='text-slate-400'>/ɡlɑːs/</span> · <b class='text-emerald-700'>n<u>a</u>me</b> <span class='text-slate-400'>/neɪm/</span> · <b class='text-slate-500'>h<u>a</u>t</b> <span class='text-slate-400'>/hæt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"name\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"a\" phát âm ngắn (/æ/ hoặc /ɑː/).</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>pl<u>a</u>y</b> <span class='text-slate-400'>/pleɪ/</span> · <b class='text-slate-500'>l<u>a</u>te</b> <span class='text-slate-400'>/leɪt/</span> · <b class='text-slate-500'>m<u>a</u>ke</b> <span class='text-slate-400'>/meɪk/</span> · <b class='text-emerald-700'>g<u>a</u>rden</b> <span class='text-slate-400'>/ˈɡɑːdn/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"garden\" có \"a\" phát âm /ɑː/, ba từ còn lại có \"a\" phát âm /eɪ/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>p<u>a</u>rk</b> <span class='text-slate-400'>/pɑːk/</span> · <b class='text-emerald-700'>g<u>a</u>me</b> <span class='text-slate-400'>/ɡeɪm/</span> · <b class='text-slate-500'>c<u>a</u>r</b> <span class='text-slate-400'>/kɑː/</span> · <b class='text-slate-500'>m<u>a</u>rket</b> <span class='text-slate-400'>/ˈmɑːkɪt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"game\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"ar\" phát âm /ɑː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-slate-500'>b<u>ur</u>n</b> <span class='text-slate-400'>/bɜːn/</span> · <b class='text-slate-500'>h<u>ur</u>t</b> <span class='text-slate-400'>/hɜːt/</span> · <b class='text-slate-500'>b<u>ir</u>th</b> <span class='text-slate-400'>/bɜːθ/</span> · <b class='text-emerald-700'>sing<u>er</u></b> <span class='text-slate-400'>/ˈsɪŋə/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"singer\" có \"er\" phát âm /ə/ (âm yếu), ba từ còn lại phát âm /ɜː/.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-slate-500'>moth<u>er</u></b> <span class='text-slate-400'>/ˈmʌðə/</span> · <b class='text-slate-500'>badmint<u>o</u>n</b> <span class='text-slate-400'>/ˈbædmɪntən/</span> · <b class='text-emerald-700'>l<u>ear</u>n</b> <span class='text-slate-400'>/lɜːn/</span> · <b class='text-slate-500'>pict<u>ure</u></b> <span class='text-slate-400'>/ˈpɪktʃə/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"learn\" có \"ear\" phát âm /ɜː/ (âm mạnh), ba từ còn lại phần gạch chân là âm yếu /ə/.</p></div></div>\n</div>\n<div class=\"bg-white rounded-2xl shadow-md p-5\">\n  <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-list-check mr-1\"></i>Bảng ví dụ Trọng âm trong Unit này (đáp án đúng in đậm)</p>\n  <div><div class='border-b border-slate-100 py-2'><p class='text-sm'>1. <b class='text-emerald-700'>guitar</b> <span class='text-slate-400'>/ɡɪˈtɑː/</span> · <b class='text-slate-500'>model</b> <span class='text-slate-400'>/ˈmɒdl/</span> · <b class='text-slate-500'>garden</b> <span class='text-slate-400'>/ˈɡɑːdn/</span> · <b class='text-slate-500'>hobby</b> <span class='text-slate-400'>/ˈhɒbi/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"guitar\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>2. <b class='text-slate-500'>cycling</b> <span class='text-slate-400'>/ˈsaɪklɪŋ/</span> · <b class='text-slate-500'>swimming</b> <span class='text-slate-400'>/ˈswɪmɪŋ/</span> · <b class='text-slate-500'>painting</b> <span class='text-slate-400'>/ˈpeɪntɪŋ/</span> · <b class='text-emerald-700'>collecting</b> <span class='text-slate-400'>/kəˈlektɪŋ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"collecting\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>3. <b class='text-slate-500'>beautiful</b> <span class='text-slate-400'>/ˈbjuːtɪfl/</span> · <b class='text-slate-500'>favourite</b> <span class='text-slate-400'>/ˈfeɪvərɪt/</span> · <b class='text-slate-500'>popular</b> <span class='text-slate-400'>/ˈpɒpjələ/</span> · <b class='text-emerald-700'>exciting</b> <span class='text-slate-400'>/ɪkˈsaɪtɪŋ/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"exciting\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>4. <b class='text-emerald-700'>dislike</b> <span class='text-slate-400'>/ˈdɪslaɪk/</span> · <b class='text-slate-500'>prefer</b> <span class='text-slate-400'>/prɪˈfɜː/</span> · <b class='text-slate-500'>enjoy</b> <span class='text-slate-400'>/ɪnˈdʒɔɪ/</span> · <b class='text-slate-500'>collect</b> <span class='text-slate-400'>/kəˈlekt/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 Theo đáp án tài liệu: \"dislike\" (đặc biệt khi là danh từ /ˈdɪslaɪk/) trọng âm âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.</p></div><div class='border-b border-slate-100 py-2'><p class='text-sm'>5. <b class='text-emerald-700'>amazing</b> <span class='text-slate-400'>/əˈmeɪzɪŋ/</span> · <b class='text-slate-500'>excellent</b> <span class='text-slate-400'>/ˈeksələnt/</span> · <b class='text-slate-500'>wonderful</b> <span class='text-slate-400'>/ˈwʌndəfl/</span> · <b class='text-slate-500'>dangerous</b> <span class='text-slate-400'>/ˈdeɪndʒərəs/</span></p><p class='text-xs text-blue-700 mt-0.5'>💡 \"amazing\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.</p></div></div>\n</div>\n\n<div class=\"space-y-5\">\n  <div class=\"bg-white rounded-2xl shadow-md p-5\">\n    <p class=\"font-extrabold text-indigo-900 mb-2\"><i class=\"fa-solid fa-chalkboard mr-1\"></i>1. Thì hiện tại đơn (Present Simple)</p>\n    <p class=\"text-sm text-slate-700 mb-2\">Diễn tả thói quen, hành động lặp lại, sự thật hiển nhiên, lịch trình cố định.</p>\n    <div class=\"overflow-x-auto\">\n    <table class=\"w-full text-sm border-collapse\">\n      <tr class=\"bg-slate-100\"><th class=\"border px-2 py-1\">Dạng</th><th class=\"border px-2 py-1\">Cấu trúc</th><th class=\"border px-2 py-1\">Ví dụ - Nghĩa</th></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Khẳng định</td><td class=\"border px-2 py-1\">S + V(-s/-es) [ngôi 3 số ít]</td><td class=\"border px-2 py-1 italic\">He plays chess every day. <span class=\"not-italic text-slate-500\">— Cậu ấy chơi cờ vua mỗi ngày.</span></td></tr>\n      <tr><td class=\"border px-2 py-1 font-bold\">Phủ định</td><td class=\"border px-2 py-1\">S + don't/doesn't + V</td><td class=\"border px-2 py-1 italic\">She doesn't like fishing. <span class=\"not-italic text-slate-500\">— Cô ấy không thích câu cá.</span></td></tr>\n      <tr><td
