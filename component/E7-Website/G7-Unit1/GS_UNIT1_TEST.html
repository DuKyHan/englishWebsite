<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<title>Unit 1 - Full Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#fef2f2; }
  .hero-gradient{ background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 55%, #f97316 100%); }
  .screen{ display:none; } .screen.active{ display:block; }
  .stage-card{ transition:.2s; cursor:pointer; }
  .stage-card:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.12); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:#dc2626; background:#fef2f2; }
  .option-label.selected{ border-color:#7f1d1d; background:#fee2e2; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  input.answer-input{ border:2px solid #cbd5e1; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:#dc2626; }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .progress-dot{ width:7px;height:7px;border-radius:50%;background:#fecaca; }
  .progress-dot.done{ background:#dc2626; }
  
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

  .badge-pill{ background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
  #auditBanner{ display:none; }
  #auditBanner.show{ display:block; }
</style>
</head>
<body class="min-h-screen">
<div class="confetti-wrap" id="confettiWrap"></div>
<div id="auditBanner" class="bg-rose-600 text-white text-sm font-bold text-center py-2 px-4"></div>
<header class="hero-gradient text-white py-7 px-4 text-center shadow-xl">
  <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">Unit 1 · Hobbies</p>
  <h1 class="font-['Baloo_2'] text-3xl md:text-5xl font-extrabold drop-shadow-lg">🏆 Full Unit Test</h1>
  <p class="mt-2 text-base opacity-90 font-semibold"><span id="stageCountHeader"></span> chặng · <span id="totalCountHeader"></span> câu — TOÀN BỘ nội dung Unit</p>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 pb-20">

<section id="screen-home" class="screen active">
  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">TỔNG ĐIỂM XP</p><p class="text-2xl font-black text-red-700" id="xpDisplay">0 XP</p></div>
    <div class="bg-white rounded-2xl shadow-md p-4"><p class="text-xs text-slate-400 font-bold">STREAK</p><p class="text-2xl font-black text-orange-600" id="streakDisplay">🔥 0 ngày</p></div>
  </div>
  <div class="mb-5">
    <p class="text-sm font-bold text-slate-500 mb-2">📝 Đề kiểm tra tổng hợp (4 đề — gộp lại chứa đủ mọi câu trong Unit)</p>
    <div class="grid sm:grid-cols-2 gap-3" id="examGrid"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
    <p class="text-xs text-slate-400 font-bold mb-1">TIẾN ĐỘ TOÀN BÀI (<span id="totalCount"></span> câu)</p>
    <div class="bg-slate-100 rounded-full h-3 overflow-hidden"><div id="overallBar" class="bg-gradient-to-r from-red-700 to-orange-500 h-3" style="width:0%"></div></div>
    <p class="text-xs text-slate-500 mt-1" id="overallText"></p>
  </div>
  <div id="badgesWrap" class="flex flex-wrap gap-2 mb-5"></div>
  <p class="text-sm font-bold text-slate-500 mb-2">Luyện theo từng dạng bài</p>
  <div id="stageGrid" class="grid sm:grid-cols-2 gap-4"></div>
  <button onclick="confirmReset()" class="mt-6 text-xs text-slate-400 underline">Reset toàn bộ tiến độ</button>
</section>

<section id="screen-play" class="screen">
  <div class="flex justify-between items-center mb-3">
    <button onclick="quitStage()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <div class="flex flex-wrap gap-1 max-w-[55%] justify-center" id="progressDots"></div>
    <span class="text-sm font-bold text-red-700" id="playCounter"></span>
  </div>
  <div id="playPassage" class="hidden bg-white border border-slate-200 rounded-xl p-4 mb-3 text-sm leading-relaxed text-slate-700"></div>
  <div class="bg-white rounded-2xl shadow-lg p-6" id="playCard"></div>
</section>

<section id="screen-exam" class="screen">
  <div class="flex justify-between items-center mb-3 sticky top-0 bg-red-50/95 backdrop-blur py-2 z-10 -mx-4 px-4">
    <button onclick="quitExam()" class="text-slate-400 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Thoát</button>
    <span class="text-sm font-black text-red-800" id="examTitleBar">📝 Đề 1</span>
    <span class="text-lg font-black text-red-700"><i class="fa-solid fa-stopwatch mr-1"></i><span id="examTimer">0:00</span></span>
  </div>
  <p class="text-xs font-bold text-slate-400 text-right mb-2"><span id="examAnsweredCount">0</span>/<span id="examTotalCount">0</span> đã chọn</p>
  <div id="examItemsWrap"></div>
  <div id="examSubmitBar" class="flex justify-center py-4">
    <button onclick="submitExam()" class="bg-gradient-to-r from-red-800 to-orange-500 text-white font-bold px-8 py-3 rounded-full shadow-xl text-base"><i class="fa-solid fa-paper-plane mr-1"></i>Nộp bài</button>
  </div>
  <div id="examResultBar" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center mt-4 mb-6">
    <div class="text-5xl mb-2" id="examResultEmoji">🎉</div>
    <p class="text-xl font-extrabold text-red-800 mb-2" id="examResultText"></p>
    <div class="flex flex-wrap justify-center gap-3 mt-3">
      <button onclick="retryExamWrong()" id="examRetryBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="retryExamSamePaper()" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🆕 Làm lại đề này (xáo trộn lại)</button>
      <button onclick="quitExam()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="bg-white rounded-3xl shadow-xl p-8 text-center">
    <div class="text-6xl mb-3" id="resultEmoji">🎉</div>
    <h3 class="text-2xl font-extrabold text-red-800 mb-1" id="resultTitle"></h3>
    <p class="text-4xl font-black text-red-700 my-3" id="resultScore"></p>
    <p class="text-slate-500 mb-5" id="resultAccuracy"></p>
    <div class="flex flex-wrap justify-center gap-3">
      <button onclick="showReview(false)" class="bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔍 Xem lại tất cả</button>
      <button onclick="showReview(true)" id="reviewWrongBtn" class="hidden bg-rose-600 text-white font-bold px-5 py-2.5 rounded-full text-sm">❌ Xem câu sai</button>
      <button onclick="retryWrongInStage()" id="retryWrongBtn" class="hidden bg-amber-500 text-white font-bold px-5 py-2.5 rounded-full text-sm">🔄 Làm lại câu sai</button>
      <button onclick="goHome()" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm">Về trang chủ</button>
    </div>
  </div>
  <div id="reviewWrap" class="mt-5 space-y-3"></div>
</section>

</main>

<script>
const STAGES_RAW = {"stages": [{"key": "pron0", "title": "Pronunciation", "emoji": "🔊", "vi": "Phát âm", "items": [{"id": "PRON1", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["st<u>a</u>mp", "gl<u>a</u>ss", "n<u>a</u>me", "h<u>a</u>t"], "answer": 2, "explanation": "\"name\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"a\" phát âm ngắn (/æ/ hoặc /ɑː/).", "vi": null, "ipas": ["/stæmp/", "/ɡlɑːs/", "/neɪm/", "/hæt/"], "vis": ["con tem", "cái ly, thủy tinh", "tên", "cái mũ"], "image": null}, {"id": "PRON2", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["pl<u>a</u>y", "l<u>a</u>te", "m<u>a</u>ke", "g<u>a</u>rden"], "answer": 3, "explanation": "\"garden\" có \"a\" phát âm /ɑː/, ba từ còn lại có \"a\" phát âm /eɪ/.", "vi": null, "ipas": ["/pleɪ/", "/leɪt/", "/meɪk/", "/ˈɡɑːdn/"], "vis": ["chơi", "muộn", "làm", "khu vườn"], "image": null}, {"id": "PRON3", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["p<u>a</u>rk", "g<u>a</u>me", "c<u>a</u>r", "m<u>a</u>rket"], "answer": 1, "explanation": "\"game\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"ar\" phát âm /ɑː/.", "vi": null, "ipas": ["/pɑːk/", "/ɡeɪm/", "/kɑː/", "/ˈmɑːkɪt/"], "vis": ["công viên", "trò chơi", "xe hơi", "chợ"], "image": null}, {"id": "PRON4", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["b<u>ur</u>n", "h<u>ur</u>t", "b<u>ir</u>th", "sing<u>er</u>"], "answer": 3, "explanation": "\"singer\" có \"er\" phát âm /ə/ (âm yếu), ba từ còn lại phát âm /ɜː/.", "vi": null, "ipas": ["/bɜːn/", "/hɜːt/", "/bɜːθ/", "/ˈsɪŋə/"], "vis": ["đốt cháy", "làm đau", "sự ra đời", "ca sĩ"], "image": null}, {"id": "PRON5", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["moth<u>er</u>", "badmint<u>o</u>n", "l<u>ear</u>n", "pict<u>ure</u>"], "answer": 2, "explanation": "\"learn\" có \"ear\" phát âm /ɜː/ (âm mạnh), ba từ còn lại phần gạch chân là âm yếu /ə/.", "vi": null, "ipas": ["/ˈmʌðə/", "/ˈbædmɪntən/", "/lɜːn/", "/ˈpɪktʃə/"], "vis": ["mẹ", "cầu lông", "học", "bức tranh"], "image": null}]}, {"key": "stress0", "title": "Stressed syllable", "emoji": "🎯", "vi": "Trọng âm", "items": [{"id": "STR1", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["guitar", "model", "garden", "hobby"], "answer": 0, "explanation": "\"guitar\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ɡɪˈtɑː/", "/ˈmɒdl/", "/ˈɡɑːdn/", "/ˈhɒbi/"], "vis": ["đàn ghi-ta", "mô hình", "khu vườn", "sở thích"], "image": null}, {"id": "STR2", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["cycling", "swimming", "painting", "collecting"], "answer": 3, "explanation": "\"collecting\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈsaɪklɪŋ/", "/ˈswɪmɪŋ/", "/ˈpeɪntɪŋ/", "/kəˈlektɪŋ/"], "vis": ["đạp xe", "bơi lội", "vẽ tranh", "sưu tầm"], "image": null}, {"id": "STR3", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["beautiful", "favourite", "popular", "exciting"], "answer": 3, "explanation": "\"exciting\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈbjuːtɪfl/", "/ˈfeɪvərɪt/", "/ˈpɒpjələ/", "/ɪkˈsaɪtɪŋ/"], "vis": ["đẹp", "yêu thích", "phổ biến", "thú vị"], "image": null}, {"id": "STR4", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["dislike", "prefer", "enjoy", "collect"], "answer": 0, "explanation": "Theo đáp án tài liệu: \"dislike\" (đặc biệt khi là danh từ /ˈdɪslaɪk/) trọng âm âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈdɪslaɪk/", "/prɪˈfɜː/", "/ɪnˈdʒɔɪ/", "/kəˈlekt/"], "vis": ["không thích", "thích hơn", "thích thú", "sưu tầm"], "image": null}, {"id": "STR5", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["amazing", "excellent", "wonderful", "dangerous"], "answer": 0, "explanation": "\"amazing\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/əˈmeɪzɪŋ/", "/ˈeksələnt/", "/ˈwʌndəfl/", "/ˈdeɪndʒərəs/"], "vis": ["tuyệt vời", "xuất sắc", "tuyệt diệu", "nguy hiểm"], "image": null}]}, {"key": "mcq0", "title": "Vocabulary & Grammar (1-10)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ1", "type": "mcq", "q": "We sometimes play __________ at school.", "options": ["stamps", "photos", "glasses", "chess"], "answer": 3, "explanation": "\"play chess\" = chơi cờ vua.", "vi": "Thỉnh thoảng chúng tôi chơi cờ vua ở trường.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ2", "type": "mcq", "q": "My sister enjoys ___________ pictures of her favorite singers.", "options": ["playing", "cooking", "collecting", "listening"], "answer": 2, "explanation": "\"collect pictures\" = sưu tầm ảnh.", "vi": "Chị tôi thích sưu tầm ảnh của các ca sĩ yêu thích.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ3", "type": "mcq", "q": "My brother wants to _________ roses and orchids in the garden.", "options": ["watch", "make", "take", "plant"], "answer": 3, "explanation": "\"plant flowers\" = trồng hoa.", "vi": "Anh tôi muốn trồng hoa hồng và hoa lan trong vườn.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ4", "type": "mcq", "q": "What kind of music do you like _________ to?", "options": ["listening", "watching", "playing", "hearing"], "answer": 0, "explanation": "\"listen to music\" = nghe nhạc; like + V-ing.", "vi": "Bạn thích nghe thể loại nhạc nào?", "ipas": null, "vis": null, "image": null}, {"id": "MCQ5", "type": "mcq", "q": "Paul thinks _________ soccer cards is an interesting hobby.", "options": ["picking", "collecting", "playing", "having"], "answer": 1, "explanation": "\"collecting cards\" = sưu tầm thẻ.", "vi": "Paul nghĩ sưu tầm thẻ bóng đá là một sở thích thú vị.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ6", "type": "mcq", "q": "Mr. Kelvin: What do you often do in your spare time? – Trân: ______________________.", "options": ["I don't like it.", "I'm hungry now.", "I go camping.", "I usually eat vegetables."], "answer": 2, "explanation": "Hỏi về hoạt động lúc rảnh rỗi → trả lời bằng một hoạt động: I go camping.", "vi": "Ông Kelvin: Bạn thường làm gì lúc rảnh? – Trân: Mình đi cắm trại.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ7", "type": "mcq", "q": "He won't _________ the wall in contrasting colours.", "options": ["make", "take", "paint", "watch"], "answer": 2, "explanation": "\"paint the wall\" = sơn tường.", "vi": "Anh ấy sẽ không sơn tường bằng những màu tương phản.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ8", "type": "mcq", "q": "She loves playing the ___________ in her free time.", "options": ["dolls", "bottles", "piano", "garden"], "answer": 2, "explanation": "\"play the piano\" = chơi đàn piano (nhạc cụ đi với \"the\").", "vi": "Cô ấy thích chơi piano lúc rảnh.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ9", "type": "mcq", "q": "Jimmy loves taking _________ and posting them on websites.", "options": ["paintings", "photos", "videos", "music"], "answer": 1, "explanation": "\"take photos\" = chụp ảnh.", "vi": "Jimmy thích chụp ảnh và đăng lên các trang web.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ10", "type": "mcq", "q": "_________ fish is the most interesting part of fishing.", "options": ["Going", "Catching", "Doing", "Making"], "answer": 1, "explanation": "\"catch fish\" = bắt cá; V-ing làm chủ ngữ.", "vi": "Bắt được cá là phần thú vị nhất của việc câu cá.", "ipas": null, "vis": null, "image": null}]}, {"key": "mcq1", "title": "Vocabulary & Grammar (11-20)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ11", "type": "mcq", "q": "My sister enjoys _________ stamps in her free time.", "options": ["collecting", "making", "doing", "taking"], "answer": 0, "explanation": "\"collect stamps\" = sưu tầm tem; enjoy + V-ing.", "vi": "Chị tôi thích sưu tầm tem lúc rảnh.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ12", "type": "mcq", "q": "Playing chess is my favourite ________.", "options": ["hobby", "lesson", "subject", "festival"], "answer": 0, "explanation": "\"hobby\" = sở thích.", "vi": "Chơi cờ vua là sở thích yêu thích của tôi.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ13", "type": "mcq", "q": "My father often ______ photos of beautiful flowers.", "options": ["takes", "does", "makes", "goes"], "answer": 0, "explanation": "\"take photos\" = chụp ảnh.", "vi": "Bố tôi thường chụp ảnh những bông hoa đẹp.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ14", "type": "mcq", "q": "Lan spends two hours ______ English every evening.", "options": ["studying", "collecting", "planting", "watching"], "answer": 0, "explanation": "\"spend time + V-ing\"; hợp nghĩa: studying English.", "vi": "Lan dành hai tiếng học tiếng Anh mỗi tối.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ15", "type": "mcq", "q": "My brother likes ______ model cars.", "options": ["making", "reading", "cooking", "washing"], "answer": 0, "explanation": "\"make models\" = làm mô hình.", "vi": "Anh tôi thích làm mô hình ô tô.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ16", "type": "mcq", "q": "I often share my hobby ______ my friends.", "options": ["with", "at", "on", "in"], "answer": 0, "explanation": "\"share sth with sb\" = chia sẻ với ai.", "vi": "Tôi thường chia sẻ sở thích của mình với bạn bè.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ17", "type": "mcq", "q": "Collecting old coins is an interesting ______.", "options": ["hobby", "game", "job", "sport"], "answer": 0, "explanation": "Sưu tầm tiền xu cũ là một sở thích (hobby).", "vi": "Sưu tầm tiền xu cũ là một sở thích thú vị.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ18", "type": "mcq", "q": "Gardening helps my grandmother ______ after work.", "options": ["relax", "relaxing", "relaxed", "relaxes"], "answer": 0, "explanation": "\"help sb + V (nguyên thể)\" → relax.", "vi": "Làm vườn giúp bà tôi thư giãn sau giờ làm.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ19", "type": "mcq", "q": "Tâm: Do you like going fishing? – Hải: _______________.", "options": ["Yes, I do.", "See you again.", "Sorry. I'm busy.", "It's a great idea."], "answer": 0, "explanation": "Câu hỏi Yes/No với \"Do you...?\" → Yes, I do.", "vi": "Tâm: Bạn có thích đi câu cá không? – Hải: Có, mình thích.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ20", "type": "mcq", "q": "My hobby is different ______ my sister's.", "options": ["from", "with", "of", "by"], "answer": 0, "explanation": "\"different from\" = khác với.", "vi": "Sở thích của tôi khác với sở thích của chị tôi.", "ipas": null, "vis": null, "image": null}]}, {"key": "mcq2", "title": "Vocabulary & Grammar (21-30)", "emoji": "📚", "vi": "Từ vựng & Ngữ pháp", "items": [{"id": "MCQ21", "type": "mcq", "q": "Doing yoga _________ one of her hobbies.", "options": ["is", "are", "being", "be"], "answer": 0, "explanation": "Chủ ngữ là V-ing (Doing yoga) → động từ số ít: is.", "vi": "Tập yoga là một trong những sở thích của cô ấy.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ22", "type": "mcq", "q": "What's your hobby, Charlie? – __________________.", "options": ["I'm twelve.", "It's drawing.", "I love that.", "It's very funny."], "answer": 1, "explanation": "Hỏi sở thích → trả lời tên sở thích: It's drawing.", "vi": "Sở thích của bạn là gì, Charlie? – Là vẽ tranh.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ23", "type": "mcq", "q": "Hannah and Sara _________ badminton twice a week.", "options": ["are playing", "doesn't play", "plays", "play"], "answer": 3, "explanation": "Chủ ngữ số nhiều + hiện tại đơn (thói quen: twice a week) → play.", "vi": "Hannah và Sara chơi cầu lông hai lần một tuần.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ24", "type": "mcq", "q": "Are you free this afternoon, Ngân? – ___________________.", "options": ["Great.", "Thanks a lot.", "No, I hate it.", "Yes, I am."], "answer": 3, "explanation": "Câu hỏi \"Are you...?\" → Yes, I am.", "vi": "Chiều nay bạn có rảnh không, Ngân? – Có, mình rảnh.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ25", "type": "mcq", "q": "Every year they _________ to Singapore for two weeks.", "options": ["travels", "doesn't travel", "travel", "not travel"], "answer": 2, "explanation": "\"they\" + hiện tại đơn (every year) → travel.", "vi": "Mỗi năm họ đi Singapore hai tuần.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ26", "type": "mcq", "q": "My younger sister _________ with dolls very much.", "options": ["is liking to play", "likes play", "likes to playing", "likes playing"], "answer": 3, "explanation": "like + V-ing → likes playing.", "vi": "Em gái tôi rất thích chơi với búp bê.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ27", "type": "mcq", "q": "Emily _________ every day at seven, regular as clockwork.", "options": ["arrived", "arrives", "is arriving", "will arrive"], "answer": 1, "explanation": "Thói quen hằng ngày (every day) → hiện tại đơn: arrives.", "vi": "Emily đến lúc 7 giờ mỗi ngày, đều đặn như đồng hồ.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ28", "type": "mcq", "q": "_________ she _________ the English exams with high marks?", "options": ["Do ... often pass", "Does ... often pass", "Does ... pass often", "Do ... pass often"], "answer": 1, "explanation": "Câu hỏi hiện tại đơn với \"she\" → Does; trạng từ tần suất đứng trước động từ chính: often pass.", "vi": "Cô ấy có thường đậu các kỳ thi tiếng Anh với điểm cao không?", "ipas": null, "vis": null, "image": null}, {"id": "MCQ29", "type": "mcq", "q": "When the weather is good, he _________ camping in the mountain.", "options": ["usually goes", "goes usually", "usually go", "go usually"], "answer": 0, "explanation": "Trạng từ tần suất đứng trước động từ thường; chủ ngữ \"he\" → usually goes.", "vi": "Khi thời tiết đẹp, anh ấy thường đi cắm trại trên núi.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ30", "type": "mcq", "q": "I think horse-riding _________ to learn, and it's not popular here.", "options": ["be easy", "easy", "is not easy", "not easy"], "answer": 2, "explanation": "Cần động từ to be chia: horse-riding is not easy to learn.", "vi": "Tôi nghĩ cưỡi ngựa không dễ học, và nó không phổ biến ở đây.", "ipas": null, "vis": null, "image": null}]}, {"key": "wordform", "title": "Word Form", "emoji": "🔤", "vi": "Word Form", "items": [{"id": "WF1", "type": "fill", "q": "Science books are very ________________ for our study of the world. (use)", "answer": "useful", "explanation": "Tính từ: use → useful (có ích).", "vi": "Sách khoa học rất hữu ích cho việc tìm hiểu thế giới của chúng ta."}, {"id": "WF2", "type": "fill", "q": "Ba is a football sticker _______________. He has a big _______________ of stickers. (collect)", "answer": "collector - collection", "explanation": "Danh từ chỉ người: collector; danh từ chỉ vật: collection (bộ sưu tập).", "vi": "Ba là một người sưu tầm hình dán bóng đá. Cậu ấy có một bộ sưu tập hình dán lớn."}, {"id": "WF3", "type": "fill", "q": "The most popular after-school ______________ in Viet Nam are football and badminton. (act)", "answer": "activities", "explanation": "Danh từ số nhiều (động từ \"are\"): act → activities.", "vi": "Các hoạt động sau giờ học phổ biến nhất ở Việt Nam là bóng đá và cầu lông."}, {"id": "WF4", "type": "fill", "q": "My mother loves flowers because they are _________________. (beauty)", "answer": "beautiful", "explanation": "Tính từ sau \"are\": beauty → beautiful (đẹp).", "vi": "Mẹ tôi yêu hoa vì chúng rất đẹp."}, {"id": "WF5", "type": "fill", "q": "Our soccer team has many talented ________________. (play)", "answer": "players", "explanation": "Danh từ chỉ người, số nhiều (many): play → players.", "vi": "Đội bóng đá của chúng tôi có nhiều cầu thủ tài năng."}, {"id": "WF6", "type": "fill", "q": "Tom Holland is very famous ________________. (act)", "answer": "actor", "explanation": "Danh từ chỉ người: act → actor (diễn viên).", "vi": "Tom Holland là một diễn viên rất nổi tiếng."}, {"id": "WF7", "type": "fill", "q": "They learn to play a ________________ instrument. (music)", "answer": "musical", "explanation": "Tính từ bổ nghĩa cho danh từ \"instrument\": music → musical.", "vi": "Họ học chơi một nhạc cụ."}, {"id": "WF8", "type": "fill", "q": "English is an _________________ and important subject. (interest)", "answer": "interesting", "explanation": "Tính từ -ing (chỉ tính chất của sự vật): interesting (hay, thú vị).", "vi": "Tiếng Anh là một môn học thú vị và quan trọng."}, {"id": "WF9", "type": "fill", "q": "You look tired after hard work, you should _______________ now. (relaxing)", "answer": "relax", "explanation": "Sau \"should\" cần động từ nguyên thể: relax.", "vi": "Bạn trông mệt sau khi làm việc vất vả, bạn nên thư giãn ngay bây giờ."}, {"id": "WF10", "type": "fill", "q": "We are really ______________ in playing chess in our free time. (interest)", "answer": "interested", "explanation": "\"be interested in\" = thích, quan tâm đến.", "vi": "Chúng tôi thực sự thích chơi cờ vua lúc rảnh."}, {"id": "WF11", "type": "fill", "q": "I can't use this basket anymore. It's ______________. (use)", "answer": "useless", "explanation": "Không dùng được nữa → vô ích: useless.", "vi": "Tôi không thể dùng cái giỏ này nữa. Nó vô dụng rồi."}, {"id": "WF12", "type": "fill", "q": "Listening to music helps me feel ______________ after studying. (relax)", "answer": "relaxed", "explanation": "Tính từ -ed chỉ cảm giác của người (feel + adj): relaxed.", "vi": "Nghe nhạc giúp tôi cảm thấy thư giãn sau khi học."}, {"id": "WF13", "type": "fill", "q": "My sister sings very _____________, so everyone likes listening to her. (beautiful)", "answer": "beautifully", "explanation": "Trạng từ bổ nghĩa cho động từ \"sings\": beautifully.", "vi": "Chị tôi hát rất hay, nên ai cũng thích nghe."}, {"id": "WF14", "type": "fill", "q": "I think you shouldn't read this book because it's _________________. (interest)", "answer": "uninteresting", "explanation": "Không nên đọc vì nó không hay → uninteresting.", "vi": "Tôi nghĩ bạn không nên đọc cuốn sách này vì nó không hay."}, {"id": "WF15", "type": "fill", "q": "Reading is one of the most _______________ hobbies for students. (use)", "answer": "useful", "explanation": "Tính từ bổ nghĩa cho \"hobbies\": useful (có ích).", "vi": "Đọc sách là một trong những sở thích có ích nhất cho học sinh."}]}, {"key": "readingA", "title": "Passage 1: My Favourite Hobby", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGA1", "type": "mcq", "q": "(1) This hobby helps me ______ about different cultures...", "options": ["learn", "learns", "learned", "learning"], "answer": 0, "explanation": "\"help sb + V (nguyên thể)\" → learn.", "vi": null}, {"id": "READINGA2", "type": "mcq", "q": "(2) I organize them ______ country.", "options": ["by", "on", "at", "from"], "answer": 0, "explanation": "\"organize by country\" = sắp xếp theo quốc gia.", "vi": null}, {"id": "READINGA3", "type": "mcq", "q": "(3) I exchange stamps ______ my friends.", "options": ["with", "for", "about", "in"], "answer": 0, "explanation": "\"exchange sth with sb\" = trao đổi với ai.", "vi": null}, {"id": "READINGA4", "type": "mcq", "q": "(4) It makes my life more ______.", "options": ["boring", "interesting", "difficult", "expensive"], "answer": 1, "explanation": "Sở thích tuyệt vời → làm cuộc sống thú vị hơn: interesting.", "vi": null}, {"id": "READINGA5", "type": "mcq", "q": "(5) I will continue this hobby ______ I can learn more about the world.", "options": ["because", "but", "or", "so"], "answer": 0, "explanation": "Nêu lý do tiếp tục sở thích → because.", "vi": null}, {"id": "READINGA6", "type": "mcq", "q": "(6) I hope to have a large ______ of valuable stamps.", "options": ["collection", "collect", "collecting", "collected"], "answer": 0, "explanation": "Sau \"a large\" cần danh từ: collection (bộ sưu tập).", "vi": null}], "passage": "Everyone has a hobby that they enjoy in their free time. My favourite hobby is collecting stamps. I started this hobby when I was ten years old because my grandfather gave me some old stamps from different countries. Since then, I have collected hundreds of stamps. This hobby helps me <span class='blank-tag'>(1)</span> ______ about different cultures and countries around the world. I usually put my stamps in special books and organize them <span class='blank-tag'>(2)</span> ______ country. Collecting stamps is not only interesting but also educational. It teaches me patience because I need time to find rare stamps. Sometimes, I exchange stamps <span class='blank-tag'>(3)</span> ______ my friends who have the same hobby. I think collecting stamps is a great hobby because it makes my life more <span class='blank-tag'>(4)</span> ______. Although some people think collecting stamps is boring, I really enjoy it. I will continue this hobby <span class='blank-tag'>(5)</span> ______ I can learn more about the world. In the future, I hope to have a large <span class='blank-tag'>(6)</span> ______ of valuable stamps."}, {"key": "readingB", "title": "Passage 2: Healthy Hobbies", "emoji": "📖", "vi": "Đọc điền từ", "items": [{"id": "READINGB1", "type": "mcq", "q": "(1) I usually spend two hours ______ plants and flowers.", "options": ["take care of", "taking care of", "took care of", "takes care of"], "answer": 1, "explanation": "\"spend time + V-ing\" → taking care of.", "vi": null}, {"id": "READINGB2", "type": "mcq", "q": "(2) They are fresh and ______.", "options": ["healthy", "health", "healthily", "unhealthy"], "answer": 0, "explanation": "Tính từ song song với \"fresh\": healthy.", "vi": null}, {"id": "READINGB3", "type": "mcq", "q": "(3) Activities that are suitable ______ our interests and abilities.", "options": ["with", "from", "for", "to"], "answer": 2, "explanation": "\"suitable for\" = phù hợp với.", "vi": null}, {"id": "READINGB4", "type": "mcq", "q": "(4) I like reading books and listening ______ music.", "options": ["at", "in", "to", "for"], "answer": 2, "explanation": "\"listen to music\" = nghe nhạc.", "vi": null}, {"id": "READINGB5", "type": "mcq", "q": "(5) These activities improve my ______ skills.", "options": ["communicate", "communication", "communicating", "communicated"], "answer": 1, "explanation": "Danh từ ghép: communication skills (kỹ năng giao tiếp).", "vi": null}, {"id": "READINGB6", "type": "mcq", "q": "(6) Grow more kinds of ______.", "options": ["flower", "flowers", "flowering", "flowered"], "answer": 1, "explanation": "\"kinds of + danh từ số nhiều\" → flowers.", "vi": null}], "passage": "Hobbies are activities that people do in their free time. One of my favourite hobbies is gardening. I usually spend two hours <span class='blank-tag'>(1)</span> ______ plants and flowers in my garden every weekend. Gardening is good for both my body and mind. It helps me stay active and feel relaxed after a busy week at school. I enjoy growing vegetables because they are fresh and <span class='blank-tag'>(2)</span> ______. My family often uses the vegetables from my garden to prepare meals. I think we should choose activities that are suitable <span class='blank-tag'>(3)</span> ______ our interests and abilities. Besides gardening, I also like reading books and listening <span class='blank-tag'>(4)</span> ______ music. These activities help me reduce stress and improve my <span class='blank-tag'>(5)</span> ______ skills. In the future, I hope to make my garden bigger and grow more kinds of <span class='blank-tag'>(6)</span> ______."}, {"key": "tfA", "title": "Passage 1: Tâm's hobby", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFA1", "type": "mcq", "q": "Tâm's hobby is reading.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"my hobby is reading\" → Đúng.", "vi": "Sở thích của Tâm là đọc sách."}, {"id": "TFA2", "type": "mcq", "q": "He reads only story books and magazines.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: đọc cả báo và bất kỳ tài liệu nào thú vị → không chỉ truyện và tạp chí → Sai.", "vi": "Cậu ấy chỉ đọc truyện và tạp chí."}, {"id": "TFA3", "type": "mcq", "q": "He gets the books from the library.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Libraries are the source from which I get the books\" → Đúng.", "vi": "Cậu ấy lấy sách từ thư viện."}, {"id": "TFA4", "type": "mcq", "q": "He will not continue his reading hobby.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"I will certainly continue my reading hobby\" → Sai.", "vi": "Cậu ấy sẽ không tiếp tục sở thích đọc sách."}, {"id": "TFA5", "type": "mcq", "q": "Reading __________ Tâm discover new things.", "options": ["helps", "helper", "helped", "helping"], "answer": 0, "explanation": "Bài đọc: \"Reading helps me discover new things\"; chủ ngữ V-ing → helps.", "vi": "Đọc sách giúp Tâm khám phá những điều mới."}, {"id": "TFA6", "type": "mcq", "q": "Books give him with so much ____________ and many facts.", "options": ["games", "information", "lessons", "food and drink"], "answer": 1, "explanation": "Bài đọc: \"Books give me with so much information and many facts\".", "vi": "Sách mang lại cho cậu ấy rất nhiều thông tin và sự thật."}], "passage": "My name is Tâm and my hobby is reading. I often read story books, magazines, newspapers and any kind of material that I find interesting, especially knowledgeable books in my free time. I really love reading. Reading helps me discover new things. Books give me with so much information and many facts. They have certainly helped me in my daily life. Libraries are the source from which I get the books I need. My relatives and my friends also give me books on special occasions. I will certainly continue my reading hobby. It is a good hobby."}, {"key": "tfB", "title": "Passage 2: Kien's swimming", "emoji": "✅", "vi": "Đúng/Sai", "items": [{"id": "TFB1", "type": "mcq", "q": "Kien goes home after school every day.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Kien usually goes swimming after school\" (đi bơi, không phải về nhà) → Sai.", "vi": "Kiên về nhà sau giờ học mỗi ngày."}, {"id": "TFB2", "type": "mcq", "q": "He practices swimming five times a month.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"five times a week\" (một tuần, không phải một tháng) → Sai.", "vi": "Cậu ấy tập bơi năm lần một tháng."}, {"id": "TFB3", "type": "mcq", "q": "The swimming lessons last 45 minutes.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The swimming lessons last 45 minutes\" → Đúng.", "vi": "Buổi học bơi kéo dài 45 phút."}, {"id": "TFB4", "type": "mcq", "q": "Kiên won the first prize in the swimming competition.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"He won first prize\" → Đúng.", "vi": "Kiên giành giải nhất trong cuộc thi bơi."}, {"id": "TFB5", "type": "mcq", "q": "What is the correct ordinal number for first?", "options": ["1st", "2nd", "3rd", "10th"], "answer": 0, "explanation": "first = thứ nhất = 1st.", "vi": "Số thứ tự đúng của \"first\" là gì?"}, {"id": "TFB6", "type": "mcq", "q": "Swimming is an ____________ and pleasant activity.", "options": ["dangerous", "boring", "bad", "interesting"], "answer": 3, "explanation": "Bài đọc: \"Swimming is interesting and pleasant\".", "vi": "Bơi là một hoạt động thú vị và dễ chịu."}], "passage": "Every day, Kien usually goes swimming after school. He practices swimming five times a week. His swimming pool is very good. The pool is 25 metres long and has six lanes. The swimming lessons last 45 minutes, but he usually trains for an hour and a half. During the lesson he swims about two kilometers. His favourite swimming styles are crawl and backstroke. He practices a lot to improve his swimming skills. He wants to achieve good results. Last month he participated in a swimming competition. Ten swimmers from three schools took part in the competition. He won first prize. Swimming is his favourite sport. Swimming is interesting and pleasant, and it helps him to keep fit."}, {"key": "transform0", "title": "Sentence Transformation (Part 1)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR1", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>My/ likes/ mother/ to/ music/. / listening</b>", "starter": "", "answer": "My mother likes listening to music.", "accepted": null, "explanation": "S + likes + V-ing: My mother likes listening to music.", "vi": "Mẹ tôi thích nghe nhạc.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR2", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>his/ car/. / Ana's dad/ washing/ hates</b>", "starter": "", "answer": "Ana's dad hates washing his car.", "accepted": null, "explanation": "S + hates + V-ing + O.", "vi": "Bố của Ana ghét rửa xe của ông ấy.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR3", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>traveling/ father's friend/ by/ loves/ My/ plane/. /</b>", "starter": "", "answer": "My father's friend loves traveling by plane.", "accepted": null, "explanation": "S + loves + V-ing + by plane.", "vi": "Bạn của bố tôi thích đi du lịch bằng máy bay.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR4", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>emails/. / writing/ I/ long/ hate</b>", "starter": "", "answer": "I hate writing long emails.", "accepted": null, "explanation": "S + hate + V-ing + O.", "vi": "Tôi ghét viết những email dài.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR5", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>watching/ enjoy/ action films/ She/ TV/. / on</b>", "starter": "", "answer": "She enjoys watching action films on TV.", "accepted": null, "explanation": "S + enjoys + V-ing + O + on TV.", "vi": "Cô ấy thích xem phim hành động trên TV.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TR6", "type": "sentence", "q": "I'm interested in collecting stamps.", "starter": "I", "answer": "like collecting stamps", "accepted": ["like collecting stamps", "love collecting stamps", "enjoy collecting stamps"], "explanation": "be interested in + V-ing = like/love/enjoy + V-ing.", "vi": "Tôi thích sưu tầm tem.", "note": "S + be interested in + V-ing → S + like/love/enjoy + V-ing"}, {"id": "TR7", "type": "sentence", "q": "Miss Linh enjoys playing chess with her son in her free time.", "starter": "Miss Linh is", "answer": "interested in playing chess with her son in her free time", "accepted": ["interested in playing chess with her son in her free time", "fond of playing chess with her son in her free time", "keen on playing chess with her son in her free time", "into playing chess with her son in her free time"], "explanation": "enjoy + V-ing = be interested in / fond of / keen on + V-ing.", "vi": "Cô Linh thích chơi cờ vua với con trai lúc rảnh.", "note": "S + enjoy + V-ing → S + be interested in / fond of / keen on + V-ing"}, {"id": "TR8", "type": "sentence", "q": "Do you like playing board games?", "starter": "Are you", "answer": "interested in playing board games", "accepted": ["interested in playing board games", "fond of playing board games", "keen on playing board games", "into playing board games"], "explanation": "like + V-ing = be interested in / fond of / keen on + V-ing.", "vi": "Bạn có thích chơi các trò chơi trên bàn cờ không?", "note": "Do you like + V-ing? → Are you interested in / fond of / keen on + V-ing?"}, {"id": "TR9", "type": "sentence", "q": "I hate watching TV programs for children.", "starter": "I don't", "answer": "like watching TV programs for children", "accepted": null, "explanation": "hate + V-ing = don't like + V-ing.", "vi": "Tôi ghét xem các chương trình TV dành cho trẻ em.", "note": "S + hate + V-ing → S + don't like + V-ing"}, {"id": "TR10", "type": "sentence", "q": "I hate watching TV programs for children.", "starter": "I'm not", "answer": "interested in watching TV programs for children", "accepted": ["interested in watching TV programs for children", "fond of watching TV programs for children", "keen on watching TV programs for children"], "explanation": "hate + V-ing = be not interested in / not fond of / not keen on + V-ing.", "vi": "Tôi ghét xem các chương trình TV dành cho trẻ em.", "note": "S + hate + V-ing → S + be not interested in / fond of / keen on + V-ing"}]}, {"key": "transform1", "title": "Sentence Transformation (Part 2)", "emoji": "✍️", "vi": "Viết lại câu", "items": [{"id": "TR11", "type": "sentence", "q": "They are interested in drinking tea after meals.", "starter": "They like", "answer": "drinking tea after meals", "accepted": null, "explanation": "be interested in + V-ing = like + V-ing.", "vi": "Họ thích uống trà sau bữa ăn.", "note": "S + be interested in + V-ing → S + like + V-ing"}, {"id": "TR12", "type": "sentence", "q": "Our grandmother loves cooking and sewing. (be interested)", "starter": "", "answer": "Our grandmother is interested in cooking and sewing.", "accepted": null, "explanation": "love + V-ing = be interested in + V-ing.", "vi": "Bà của chúng tôi thích nấu ăn và may vá.", "note": "S + love + V-ing → S + be interested in + V-ing"}, {"id": "TR13", "type": "sentence", "q": "How about going to see a volleyball game together?", "starter": "Why don't we", "answer": "go to see a volleyball game together", "accepted": null, "explanation": "How about + V-ing? = Why don't we + V?", "vi": "Chúng ta cùng đi xem một trận bóng chuyền nhé?", "note": "How about + V-ing? → Why don't we + V (nguyên thể)?"}, {"id": "TR14", "type": "sentence", "q": "It's good that we do exercise regularly.", "starter": "We should", "answer": "do exercise regularly", "accepted": null, "explanation": "It's good that we + V = We should + V.", "vi": "Chúng ta nên tập thể dục thường xuyên.", "note": "It's good that S + V → S + should + V"}, {"id": "TR15", "type": "sentence", "q": "It's very good to eat healthy food.", "starter": "We should", "answer": "eat healthy food", "accepted": null, "explanation": "It's good to + V = We should + V.", "vi": "Chúng ta nên ăn thực phẩm lành mạnh.", "note": "It's good to + V → S + should + V"}, {"id": "TR16", "type": "sentence", "q": "It's not good to stay up so late to listen to music.", "starter": "You shouldn't", "answer": "stay up so late to listen to music", "accepted": null, "explanation": "It's not good to + V = You shouldn't + V.", "vi": "Bạn không nên thức khuya như vậy để nghe nhạc.", "note": "It's not good to + V → S + shouldn't + V"}]}, {"key": "dictionary", "title": "Dictionary", "emoji": "📖", "vi": "Từ điển", "items": [{"id": "DIC1_1", "type": "fill", "q": "[Từ điển \"hobby\"] A. Photography __________ for him since he was a teenager.", "answer": "took up", "explanation": "Dựa vào ví dụ: took up (theo đuổi/bắt đầu làm).", "vi": "Nhiếp ảnh đã trở thành điều anh ấy theo đuổi từ khi còn thiếu niên."}, {"id": "DIC1_2", "type": "fill", "q": "[Từ điển \"hobby\"] B. Reading and playing badminton are among her _______________.", "answer": "hobbies", "explanation": "Dựa vào ví dụ: hobbies.", "vi": "Đọc sách và chơi cầu lông là những sở thích của cô ấy."}, {"id": "DIC2_1", "type": "fill", "q": "[Từ điển \"relax\"] A. After a stressful exam, she just wants to stay home and ________________.", "answer": "relax", "explanation": "Dựa vào ví dụ: relax.", "vi": "Sau kỳ thi căng thẳng, cô ấy chỉ muốn ở nhà và thư giãn."}, {"id": "DIC2_2", "type": "fill", "q": "[Từ điển \"relax\"] B. ________________ to music helps me relax after a long day at school.", "answer": "Listening", "explanation": "Dựa vào ví dụ: Listening to music helps me relax.", "vi": "Nghe nhạc giúp tôi thư giãn sau một ngày dài ở trường."}]}, {"key": "pictures", "title": "Pictures & Signs", "emoji": "🚦", "vi": "Biển báo", "items": [{"id": "PIC1", "type": "mcq", "q": "What does the sign mean?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-red-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">📵</div><p class=\"text-[11px] font-black text-center text-red-700 leading-tight\">NO MOBILE PHONES</p></div>", "options": ["You can take photos here.", "You must turn on your phone.", "You can make a phone call here.", "You mustn't use mobile phones here."], "answer": 3, "explanation": "Biển có hình điện thoại bị gạch chéo → cấm sử dụng điện thoại di động.", "vi": null}, {"id": "PIC2", "type": "mcq", "q": "What activity does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🛹</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["playing basketball", "cycling", "skateboarding", "playing chess"], "answer": 2, "explanation": "Hình một người đang trượt ván → skateboarding.", "vi": null}, {"id": "PIC3", "type": "mcq", "q": "What activity does the picture show?", "image": "<div class=\"inline-flex flex-col items-center w-48 bg-white border-2 border-slate-300 rounded-xl p-3 shadow-sm\"><div class=\"text-5xl mb-1\">🧘</div><p class=\"text-[11px] font-black text-center text-slate-900 leading-tight\">?</p></div>", "options": ["playing chess", "doing yoga", "playing football", "cooking"], "answer": 1, "explanation": "Hình một người đang ngồi thiền/tập yoga → doing yoga.", "vi": null}]}, {"key": "extra0_0", "title": "Hiện tại đơn", "emoji": "🧩", "vi": "Present Simple: Chia động từ", "items": [{"id": "EX0_1", "type": "fill", "q": "She ____________ to put all of her dolls in her dollhouse. (want)", "answer": "wants", "accepted": null, "explanation": "Chủ ngữ \"She\" + hiện tại đơn → wants.", "vi": "Cô ấy muốn đặt tất cả búp bê vào ngôi nhà búp bê."}, {"id": "EX0_2", "type": "fill", "q": "This ____________ the first horse riding programme in our city. (be)", "answer": "is", "accepted": null, "explanation": "\"This\" số ít → is.", "vi": "Đây là chương trình cưỡi ngựa đầu tiên ở thành phố chúng tôi."}, {"id": "EX0_3", "type": "fill", "q": "My uncle ____________ exercise at the park every morning. (do)", "answer": "does", "accepted": null, "explanation": "\"My uncle\" số ít → does.", "vi": "Chú tôi tập thể dục ở công viên mỗi sáng."}, {"id": "EX0_4", "type": "fill", "q": "Stacy _____________ playing the guitar three times a week. (practice)", "answer": "practices", "accepted": ["practices", "practises"], "explanation": "\"Stacy\" số ít → practices.", "vi": "Stacy luyện chơi ghi-ta ba lần một tuần."}, {"id": "EX0_5", "type": "fill", "q": "Our neighbour ____________ a very healthy hobby. (not have)", "answer": "doesn't have", "accepted": ["doesn't have", "does not have"], "explanation": "Phủ định, chủ ngữ số ít → doesn't have.", "vi": "Hàng xóm của chúng tôi không có một sở thích lành mạnh cho lắm."}, {"id": "EX0_6", "type": "fill", "q": "Her friends ____________ doing yoga in their free time. (like)", "answer": "like", "accepted": null, "explanation": "Chủ ngữ số nhiều → like.", "vi": "Bạn bè của cô ấy thích tập yoga lúc rảnh."}, {"id": "EX0_7", "type": "fill", "q": "The concert tickets ____________ cheap. (not be)", "answer": "aren't", "accepted": ["aren't", "are not"], "explanation": "Chủ ngữ số nhiều, phủ định → aren't.", "vi": "Vé hòa nhạc không rẻ."}, {"id": "EX0_8", "type": "fill", "q": "__________ the school bus ____________ at six o'clock? (leave)", "answer": "Does ... leave", "accepted": ["Does ... leave", "does leave"], "explanation": "Câu hỏi, chủ ngữ số ít → Does ... leave? (nhập: Does / leave)", "vi": "Xe buýt trường có khởi hành lúc sáu giờ không?"}, {"id": "EX0_9", "type": "fill", "q": "They ____________ much in the evenings but watch television. (not do)", "answer": "don't do", "accepted": ["don't do", "do not do"], "explanation": "Phủ định, chủ ngữ số nhiều → don't do.", "vi": "Buổi tối họ không làm gì nhiều ngoài xem TV."}, {"id": "EX0_10", "type": "fill", "q": "______________________ football with his friends every weekend? (John play)", "answer": "Does John play", "accepted": null, "explanation": "Câu hỏi hiện tại đơn, chủ ngữ số ít → Does John play...?", "vi": "John có chơi bóng đá với bạn bè mỗi cuối tuần không?"}]}], "total": 112, "examPapers": [[{"id": "STR4", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["dislike", "prefer", "enjoy", "collect"], "answer": 0, "explanation": "Theo đáp án tài liệu: \"dislike\" (đặc biệt khi là danh từ /ˈdɪslaɪk/) trọng âm âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈdɪslaɪk/", "/prɪˈfɜː/", "/ɪnˈdʒɔɪ/", "/kəˈlekt/"], "vis": ["không thích", "thích hơn", "thích thú", "sưu tầm"], "image": null}, {"id": "WF5", "type": "fill", "q": "Our soccer team has many talented ________________. (play)", "answer": "players", "explanation": "Danh từ chỉ người, số nhiều (many): play → players.", "vi": "Đội bóng đá của chúng tôi có nhiều cầu thủ tài năng."}, {"id": "MCQ16", "type": "mcq", "q": "I often share my hobby ______ my friends.", "options": ["with", "at", "on", "in"], "answer": 0, "explanation": "\"share sth with sb\" = chia sẻ với ai.", "vi": "Tôi thường chia sẻ sở thích của mình với bạn bè.", "ipas": null, "vis": null, "image": null}, {"id": "WF15", "type": "fill", "q": "Reading is one of the most _______________ hobbies for students. (use)", "answer": "useful", "explanation": "Tính từ bổ nghĩa cho \"hobbies\": useful (có ích).", "vi": "Đọc sách là một trong những sở thích có ích nhất cho học sinh."}, {"id": "READINGB2", "type": "mcq", "q": "(2) They are fresh and ______.", "options": ["healthy", "health", "healthily", "unhealthy"], "answer": 0, "explanation": "Tính từ song song với \"fresh\": healthy.", "vi": null, "passage": "Hobbies are activities that people do in their free time. One of my favourite hobbies is gardening. I usually spend two hours <span class='blank-tag'>(1)</span> ______ plants and flowers in my garden every weekend. Gardening is good for both my body and mind. It helps me stay active and feel relaxed after a busy week at school. I enjoy growing vegetables because they are fresh and <span class='blank-tag'>(2)</span> ______. My family often uses the vegetables from my garden to prepare meals. I think we should choose activities that are suitable <span class='blank-tag'>(3)</span> ______ our interests and abilities. Besides gardening, I also like reading books and listening <span class='blank-tag'>(4)</span> ______ music. These activities help me reduce stress and improve my <span class='blank-tag'>(5)</span> ______ skills. In the future, I hope to make my garden bigger and grow more kinds of <span class='blank-tag'>(6)</span> ______."}, {"id": "EX0_2", "type": "fill", "q": "This ____________ the first horse riding programme in our city. (be)", "answer": "is", "accepted": null, "explanation": "\"This\" số ít → is.", "vi": "Đây là chương trình cưỡi ngựa đầu tiên ở thành phố chúng tôi."}, {"id": "READINGA4", "type": "mcq", "q": "(4) It makes my life more ______.", "options": ["boring", "interesting", "difficult", "expensive"], "answer": 1, "explanation": "Sở thích tuyệt vời → làm cuộc sống thú vị hơn: interesting.", "vi": null, "passage": "Everyone has a hobby that they enjoy in their free time. My favourite hobby is collecting stamps. I started this hobby when I was ten years old because my grandfather gave me some old stamps from different countries. Since then, I have collected hundreds of stamps. This hobby helps me <span class='blank-tag'>(1)</span> ______ about different cultures and countries around the world. I usually put my stamps in special books and organize them <span class='blank-tag'>(2)</span> ______ country. Collecting stamps is not only interesting but also educational. It teaches me patience because I need time to find rare stamps. Sometimes, I exchange stamps <span class='blank-tag'>(3)</span> ______ my friends who have the same hobby. I think collecting stamps is a great hobby because it makes my life more <span class='blank-tag'>(4)</span> ______. Although some people think collecting stamps is boring, I really enjoy it. I will continue this hobby <span class='blank-tag'>(5)</span> ______ I can learn more about the world. In the future, I hope to have a large <span class='blank-tag'>(6)</span> ______ of valuable stamps."}, {"id": "PRON3", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["p<u>a</u>rk", "g<u>a</u>me", "c<u>a</u>r", "m<u>a</u>rket"], "answer": 1, "explanation": "\"game\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"ar\" phát âm /ɑː/.", "vi": null, "ipas": ["/pɑːk/", "/ɡeɪm/", "/kɑː/", "/ˈmɑːkɪt/"], "vis": ["công viên", "trò chơi", "xe hơi", "chợ"], "image": null}, {"id": "MCQ28", "type": "mcq", "q": "_________ she _________ the English exams with high marks?", "options": ["Do ... often pass", "Does ... often pass", "Does ... pass often", "Do ... pass often"], "answer": 1, "explanation": "Câu hỏi hiện tại đơn với \"she\" → Does; trạng từ tần suất đứng trước động từ chính: often pass.", "vi": "Cô ấy có thường đậu các kỳ thi tiếng Anh với điểm cao không?", "ipas": null, "vis": null, "image": null}, {"id": "TR16", "type": "sentence", "q": "It's not good to stay up so late to listen to music.", "starter": "You shouldn't", "answer": "stay up so late to listen to music", "accepted": null, "explanation": "It's not good to + V = You shouldn't + V.", "vi": "Bạn không nên thức khuya như vậy để nghe nhạc.", "note": "It's not good to + V → S + shouldn't + V"}, {"id": "TR5", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>watching/ enjoy/ action films/ She/ TV/. / on</b>", "starter": "", "answer": "She enjoys watching action films on TV.", "accepted": null, "explanation": "S + enjoys + V-ing + O + on TV.", "vi": "Cô ấy thích xem phim hành động trên TV.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TFA1", "type": "mcq", "q": "Tâm's hobby is reading.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"my hobby is reading\" → Đúng.", "vi": "Sở thích của Tâm là đọc sách.", "passage": "My name is Tâm and my hobby is reading. I often read story books, magazines, newspapers and any kind of material that I find interesting, especially knowledgeable books in my free time. I really love reading. Reading helps me discover new things. Books give me with so much information and many facts. They have certainly helped me in my daily life. Libraries are the source from which I get the books I need. My relatives and my friends also give me books on special occasions. I will certainly continue my reading hobby. It is a good hobby."}, {"id": "EX0_10", "type": "fill", "q": "______________________ football with his friends every weekend? (John play)", "answer": "Does John play", "accepted": null, "explanation": "Câu hỏi hiện tại đơn, chủ ngữ số ít → Does John play...?", "vi": "John có chơi bóng đá với bạn bè mỗi cuối tuần không?"}, {"id": "WF1", "type": "fill", "q": "Science books are very ________________ for our study of the world. (use)", "answer": "useful", "explanation": "Tính từ: use → useful (có ích).", "vi": "Sách khoa học rất hữu ích cho việc tìm hiểu thế giới của chúng ta."}, {"id": "EX0_8", "type": "fill", "q": "__________ the school bus ____________ at six o'clock? (leave)", "answer": "Does ... leave", "accepted": ["Does ... leave", "does leave"], "explanation": "Câu hỏi, chủ ngữ số ít → Does ... leave? (nhập: Does / leave)", "vi": "Xe buýt trường có khởi hành lúc sáu giờ không?"}, {"id": "READINGB4", "type": "mcq", "q": "(4) I like reading books and listening ______ music.", "options": ["at", "in", "to", "for"], "answer": 2, "explanation": "\"listen to music\" = nghe nhạc.", "vi": null, "passage": "Hobbies are activities that people do in their free time. One of my favourite hobbies is gardening. I usually spend two hours <span class='blank-tag'>(1)</span> ______ plants and flowers in my garden every weekend. Gardening is good for both my body and mind. It helps me stay active and feel relaxed after a busy week at school. I enjoy growing vegetables because they are fresh and <span class='blank-tag'>(2)</span> ______. My family often uses the vegetables from my garden to prepare meals. I think we should choose activities that are suitable <span class='blank-tag'>(3)</span> ______ our interests and abilities. Besides gardening, I also like reading books and listening <span class='blank-tag'>(4)</span> ______ music. These activities help me reduce stress and improve my <span class='blank-tag'>(5)</span> ______ skills. In the future, I hope to make my garden bigger and grow more kinds of <span class='blank-tag'>(6)</span> ______."}, {"id": "TFB2", "type": "mcq", "q": "He practices swimming five times a month.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"five times a week\" (một tuần, không phải một tháng) → Sai.", "vi": "Cậu ấy tập bơi năm lần một tháng.", "passage": "Every day, Kien usually goes swimming after school. He practices swimming five times a week. His swimming pool is very good. The pool is 25 metres long and has six lanes. The swimming lessons last 45 minutes, but he usually trains for an hour and a half. During the lesson he swims about two kilometers. His favourite swimming styles are crawl and backstroke. He practices a lot to improve his swimming skills. He wants to achieve good results. Last month he participated in a swimming competition. Ten swimmers from three schools took part in the competition. He won first prize. Swimming is his favourite sport. Swimming is interesting and pleasant, and it helps him to keep fit."}, {"id": "WF9", "type": "fill", "q": "You look tired after hard work, you should _______________ now. (relaxing)", "answer": "relax", "explanation": "Sau \"should\" cần động từ nguyên thể: relax.", "vi": "Bạn trông mệt sau khi làm việc vất vả, bạn nên thư giãn ngay bây giờ."}, {"id": "PRON5", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["moth<u>er</u>", "badmint<u>o</u>n", "l<u>ear</u>n", "pict<u>ure</u>"], "answer": 2, "explanation": "\"learn\" có \"ear\" phát âm /ɜː/ (âm mạnh), ba từ còn lại phần gạch chân là âm yếu /ə/.", "vi": null, "ipas": ["/ˈmʌðə/", "/ˈbædmɪntən/", "/lɜːn/", "/ˈpɪktʃə/"], "vis": ["mẹ", "cầu lông", "học", "bức tranh"], "image": null}, {"id": "TR7", "type": "sentence", "q": "Miss Linh enjoys playing chess with her son in her free time.", "starter": "Miss Linh is", "answer": "interested in playing chess with her son in her free time", "accepted": ["interested in playing chess with her son in her free time", "fond of playing chess with her son in her free time", "keen on playing chess with her son in her free time", "into playing chess with her son in her free time"], "explanation": "enjoy + V-ing = be interested in / fond of / keen on + V-ing.", "vi": "Cô Linh thích chơi cờ vua với con trai lúc rảnh.", "note": "S + enjoy + V-ing → S + be interested in / fond of / keen on + V-ing"}, {"id": "STR2", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["cycling", "swimming", "painting", "collecting"], "answer": 3, "explanation": "\"collecting\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "vi": null, "ipas": ["/ˈsaɪklɪŋ/", "/ˈswɪmɪŋ/", "/ˈpeɪntɪŋ/", "/kəˈlektɪŋ/"], "vis": ["đạp xe", "bơi lội", "vẽ tranh", "sưu tầm"], "image": null}, {"id": "TR9", "type": "sentence", "q": "I hate watching TV programs for children.", "starter": "I don't", "answer": "like watching TV programs for children", "accepted": null, "explanation": "hate + V-ing = don't like + V-ing.", "vi": "Tôi ghét xem các chương trình TV dành cho trẻ em.", "note": "S + hate + V-ing → S + don't like + V-ing"}, {"id": "MCQ30", "type": "mcq", "q": "I think horse-riding _________ to learn, and it's not popular here.", "options": ["be easy", "easy", "is not easy", "not easy"], "answer": 2, "explanation": "Cần động từ to be chia: horse-riding is not easy to learn.", "vi": "Tôi nghĩ cưỡi ngựa không dễ học, và nó không phổ biến ở đây.", "ipas": null, "vis": null, "image": null}, {"id": "TR1", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>My/ likes/ mother/ to/ music/. / listening</b>", "starter": "", "answer": "My mother likes listening to music.", "accepted": null, "explanation": "S + likes + V-ing: My mother likes listening to music.", "vi": "Mẹ tôi thích nghe nhạc.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TFA3", "type": "mcq", "q": "He gets the books from the library.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Libraries are the source from which I get the books\" → Đúng.", "vi": "Cậu ấy lấy sách từ thư viện.", "passage": "My name is Tâm and my hobby is reading. I often read story books, magazines, newspapers and any kind of material that I find interesting, especially knowledgeable books in my free time. I really love reading. Reading helps me discover new things. Books give me with so much information and many facts. They have certainly helped me in my daily life. Libraries are the source from which I get the books I need. My relatives and my friends also give me books on special occasions. I will certainly continue my reading hobby. It is a good hobby."}, {"id": "TFB1", "type": "mcq", "q": "Kien goes home after school every day.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"Kien usually goes swimming after school\" (đi bơi, không phải về nhà) → Sai.", "vi": "Kiên về nhà sau giờ học mỗi ngày.", "passage": "Every day, Kien usually goes swimming after school. He practices swimming five times a week. His swimming pool is very good. The pool is 25 metres long and has six lanes. The swimming lessons last 45 minutes, but he usually trains for an hour and a half. During the lesson he swims about two kilometers. His favourite swimming styles are crawl and backstroke. He practices a lot to improve his swimming skills. He wants to achieve good results. Last month he participated in a swimming competition. Ten swimmers from three schools took part in the competition. He won first prize. Swimming is his favourite sport. Swimming is interesting and pleasant, and it helps him to keep fit."}, {"id": "MCQ19", "type": "mcq", "q": "Tâm: Do you like going fishing? – Hải: _______________.", "options": ["Yes, I do.", "See you again.", "Sorry. I'm busy.", "It's a great idea."], "answer": 0, "explanation": "Câu hỏi Yes/No với \"Do you...?\" → Yes, I do.", "vi": "Tâm: Bạn có thích đi câu cá không? – Hải: Có, mình thích.", "ipas": null, "vis": null, "image": null}, {"id": "TR8", "type": "sentence", "q": "Do you like playing board games?", "starter": "Are you", "answer": "interested in playing board games", "accepted": ["interested in playing board games", "fond of playing board games", "keen on playing board games", "into playing board games"], "explanation": "like + V-ing = be interested in / fond of / keen on + V-ing.", "vi": "Bạn có thích chơi các trò chơi trên bàn cờ không?", "note": "Do you like + V-ing? → Are you intereste tag'>(1)</span> ______ plants and flowers in my garden every weekend. Gardening is good for both my body and mind. It helps me stay active and feel relaxed after a busy week at school. I enjoy growing vegetables because they are fresh and <span class='blank-tag'>(2)</span> ______. My family often uses the vegetables from my garden to prepare meals. I think we should choose activities that are suitable <span class='blank-tag'>(3)</span> ______ our interests and abilities. Besides gardening, I also like reading books and listening <span class='blank-tag'>(4)</span> ______ music. These activities help me reduce stress and improve my <span class='blank-tag'>(5)</span> ______ skills. In the future, I hope to make my garden bigger and grow more kinds of <span class='blank-tag'>(6)</span> ______."}, {"id": "MCQ15", "type": "mcq", "q": "My brother likes ______ model cars.", "options": ["making", "reading", "cooking", "washing"], "answer": 0, "explanation": "\"make models\" = làm mô hình.", "vi": "Anh tôi thích làm mô hình ô tô.", "ipas": null, "vis": null, "image": null}, {"id": "MCQ11", "type": "mcq", "q": "My sister enjoys _________ stamps in her free time.", "options": ["collecting", "making", "doing", "taking"], "answer": 0, "explanation": "\"collect stamps\" = sưu tầm tem; enjoy + V-ing.", "vi": "Chị tôi thích sưu tầm tem lúc rảnh.", "ipas": null, "vis": null, "image": null}, {"id": "TFA2", "type": "mcq", "q": "He reads only story books and magazines.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: đọc cả báo và bất kỳ tài liệu nào thú vị → không chỉ truyện và tạp chí → Sai.", "vi": "Cậu ấy chỉ đọc truyện và tạp chí.", "passage": "My name is Tâm and my hobby is reading. I often read story books, magazines, newspapers and any kind of material that I find interesting, especially knowledgeable books in my free time. I really love reading. Reading helps me discover new things. Books give me with so much information and many facts. They have certainly ssage": "My name is Tâm and my hobby is reading. I often read story books, magazines, newspapers and any kind of material that I find interesting, especially knowledgeable books in my free time. I really love reading. Reading helps me discover new things. Books give me with so much information and many facts. They have certainly helped me in my daily life. Libraries are the source from which I get the books I need. My relatives and my friends also give me books on special occasions. I will certainly continue my reading hobby. It is a good hobby."}, {"id": "TR12", "type": "sentence", "q": "Our grandmother loves cooking and sewing. (be interested)", "starter": "", "answer": "Our grandmother is interested in cooking and sewing.", "accepted": null, "explanation": "love + V-ing = be interested in + V-ing.", "vi": "Bà của chúng tôi thích nấu ăn và may vá.", "note": "S + love + V-ing → S + be interested in + V-ing"}, {"id": "PRON1", "type": "mcq", "q": "Which word has the underlined part pronounced differently from that of the others?", "options": ["st<u>a</u>mp", "gl<u>a</u>ss", "n<u>a</u>me", "h<u>a</u>t"], "answer": 2, "explanation": "\"name\" có \"a\" phát âm /eɪ/, ba từ còn lại có \"a\" phát âm ngắn (/æ/ hoặc /ɑː/).", "vi": null, "ipas": ["/stæmp/", "/ɡlɑːs/", "/neɪm/", "/hæt/"], "vis": ["con tem", "cái ly, thủy tinh", "tên", "cái mũ"], "image": null}, {"id": "EX0_6", "type": "fill", "q": "Her friends ____________ doing yoga in their free time. (like)", "answer": "like", "accepted": null, "explanation": "Chủ ngữ số nhiều → like.", "vi": "Bạn bè của cô ấy thích tập yoga lúc rảnh."}, {"id": "EX0_3", "type": "fill", "q": "My uncle ____________ exercise at the park every morning. (do)", "answer": "does", "accepted": null, "explanation": "\"My uncle\" số ít → does.", "vi": "Chú tôi tập thể dục ở công viên mỗi sáng."}, {"id": "TFA1", "type": "mcq", "q": "Tâm's hobby is reading.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"my hobby is reading\" → Đúng.", "vi": "Sở thích của Tâm là đọc sách.", "passage": "My name is Tâm and my hobby is reading. I often read story books, magazines, newspapers and any kind of material that I find interesting, especially knowledgeable books in my free time. I really love reading. Reading helps me discover new things. Books give me with so much information and many facts. They have certainly helped me in my daily life. Libraries are the source from which I get the books I need. My relatives and my friends also give me books on special occasions. I will certainly continue my reading hobby. It is a good hobby."}, {"id": "MCQ6", "type": "mcq", "q": "Mr. Kelvin: What do you often do in your spare time? – Trân: ______________________.", "options": ["I don't like it.", "I'm hungry now.", "I go camping.", "I usually eat vegetables."], "answer": 2, "explanation": "Hỏi về hoạt động lúc rảnh rỗi → trả lời bằng một hoạt động: I go camping.", "vi": "Ông Kelvin: Bạn thường làm gì lúc rảnh? – Trân: Mình đi cắm trại.", "ipas": null, "vis": null, "image": null}, {"id": "EX0_4", "type": "fill", "q": "Stacy _____________ playing the guitar three times a week. (practice)", "answer": "practices", "accepted": ["practices", "practises"], "explanation": "\"Stacy\" số ít → practices.", "vi": "Stacy luyện chơi ghi-ta ba lần một tuần."}, {"id": "STR4", "type": "mcq", "q": "Which word has a different stress pattern from that of the others?", "options": ["dislike", "prefer", "enjoy", "collect"], "answer": 0, "explanation": "Theo đáp án tài liệu: \"dislike\" (đặc biệt khi là danh từ /ˈdɪslaɪk/) trọng âm âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "vi": null, "ipas": ["/ˈdɪslaɪk/", "/prɪˈfɜː/", "/ɪnˈdʒɔɪ/", "/kəˈlekt/"], "vis": ["không thích", "thích hơn", "thích thú", "sưu tầm"], "image": null}, {"id": "EX0_7", "type": "fill", "q": "The concert tickets ____________ cheap. (not be)", "answer": "aren't", "accepted": ["aren't", "are not"], "explanation": "Chủ ngữ số nhiều, phủ định → aren't.", "vi": "Vé hòa nhạc không rẻ."}, {"id": "MCQ1", "type": "mcq", "q": "We sometimes play __________ at school.", "options": ["stamps", "photos", "glasses", "chess"], "answer": 3, "explanation": "\"play chess\" = chơi cờ vua.", "vi": "Thỉnh thoảng chúng tôi chơi cờ vua ở trường.", "ipas": null, "vis": null, "image": null}, {"id": "WF7", "type": "fill", "q": "They learn to play a ________________ instrument. (music)", "answer": "musical", "explanation": "Tính từ bổ nghĩa cho danh từ \"instrument\": music → musical.", "vi": "Họ học chơi một nhạc cụ."}, {"id": "TFB6", "type": "mcq", "q": "Swimming is an ____________ and pleasant activity.", "options": ["dangerous", "boring", "bad", "interesting"], "answer": 3, "explanation": "Bài đọc: \"Swimming is interesting and pleasant\".", "vi": "Bơi là một hoạt động thú vị và dễ chịu.", "passage": "Every day, Kien usually goes swimming after school. He practices swimming five times a week. His swimming pool is very good. The pool is 25 metres long and has six lanes. The swimming lessons last 45 minutes, but he usually trains for an hour and a half. During the lesson he swims about two kilometers. His favourite swimming styles are crawl and backstroke. He practices a lot to improve his swimming skills. He wants to achieve good results. Last month he participated in a swimming competition. Ten swimmers from three schools took part in the competition. He won first prize. Swimming is his favourite sport. Swimming is interesting and pleasant, and it helps him to keep fit."}, {"id": "TR2", "type": "sentence", "q": "<span class='text-slate-500'>Sắp xếp:</span> <b>his/ car/. / Ana's dad/ washing/ hates</b>", "starter": "", "answer": "Ana's dad hates washing his car.", "accepted": null, "explanation": "S + hates + V-ing + O.", "vi": "Bố của Ana ghét rửa xe của ông ấy.", "note": "Sắp xếp các từ/cụm từ cho sẵn thành câu hoàn chỉnh, đúng ngữ pháp."}, {"id": "TFB3", "type": "mcq", "q": "The swimming lessons last 45 minutes.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"The swimming lessons last 45 minutes\" → Đúng.", "vi": "Buổi học bơi kéo dài 45 phút.", "passage": "Every day, Kien usually goes swimming after school. He practices swimming five times a week. His swimming pool is very good. The pool is 25 metres long and has six lanes. The swimming lessons last 45 minutes, but he usually trains for an hour and a half. During the lesson he swims about two kilometers. His favourite swimming styles are crawl and backstroke. He practices a lot to improve his swimming skills. He wants to achieve good results. Last month he participated in a swimming competition. Ten swimmers from three schools took part in the competition. He won first prize. Swimming is his favourite sport. Swimming is interesting and pleasant, and it helps him to keep fit."}, {"id": "TR14", "type": "sentence", "q": "It's good that we do exercise regularly.", "starter": "We should", "answer": "do exercise regularly", "accepted": null, "explanation": "It's good that we + V = We should + V.", "vi": "Chúng ta nên tập thể dục thường xuyên.", "note": "It's good that S + V → S + should + V"}, {"id": "MCQ10", "type": "mcq", "q": "_________ fish is the most interesting part of fishing.", "options": ["Going", "Catching", "Doing", "Making"], "answer": 1, "explanation": "\"catch fish\" = bắt cá; V-ing làm chủ ngữ.", "vi": "Bắt được cá là phần thú vị nhất của việc câu cá.", "ipas": null, "vis": null, "image": null}, {"id": "READINGB5", "type": "mcq", "q": "(5) These activities improve my ______ skills.", "options": ["communicate", "communication", "communicating", "communicated"], "answer": 1, "explanation": "Danh từ ghép: communication skills (kỹ năng giao tiếp).", "vi": null, "passage": "Hobbies are activities that people do in their free time. One of my favourite hobbies is gardening. I usually spend two hours <span class='blank-tag'>(1)</span> ______ plants and flowers in my garden every weekend. Gardening is good for both my body and
