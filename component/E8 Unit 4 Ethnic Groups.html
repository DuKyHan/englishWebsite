      const o = shuffle([it].concat(wrong));
      return { t:'mc', kind:'phr', dir: vi2en ? 'vi2en' : 'en2vi', item:it, q: vi2en ? it.vi : it.en,
        o: o.map(x => x[field]), a: o.indexOf(it), full: it.en.replace(/<b>/g, '[[').replace(/<\/b>/g, ']]'),
        vi: it.vi, f: it.note ? 'Ghi nhớ: ' + it.note : '', e: '' };
    });
  }
  if (lesson.mix) {
    const pool = ['wh','voc','wf','trmc1','trmc2','tr1','tr2a','tr2b','pron','stress','readA','readB','readC','readD','sign','dict'].flatMap(k => I[k]);
    return shuffle(pool).slice(0, 20);
  }
  return lesson.items.slice();
}
function startLesson(lesson) {
  const q = buildQueue(lesson);
  L = { lesson, queue:q, total:q.length, pos:0, correct:0, hearts:5, firstTry:0, wrongSet:new Set(), mistakes:[], start:Date.now(), state:'answer', cur:null, answer:null };
  $('#home').hidden = true; $('#lesson').hidden = false;
  nextQ();
}
function quit() { L = null; $('#lesson').hidden = true; $('#home').hidden = false; if (canSpeak) speechSynthesis.cancel(); renderHome(); window.scrollTo(0, 0); }
$('#quitBtn').onclick = quit;
function drawAuto() {
  const on = S.autoRead !== false, b = $('#autoBtn');
  b.setAttribute('aria-pressed', on); b.title = on ? 'Đang bật tự đọc – chạm để tắt' : 'Đang tắt tự đọc – chạm để bật';
  b.style.color = on ? 'var(--sky)' : 'var(--muted)';
  b.innerHTML = on ? ICON.speak : '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>';
}
$('#autoBtn').onclick = () => { S.autoRead = S.autoRead === false; save(); drawAuto(); if (S.autoRead) speak('Auto read on'); };
drawAuto();
document.addEventListener('click', e => { const b = e.target.closest('.exsay'); if (b) speak(b.dataset.say); });

function setProgress() { $('#pFill').style.width = (L.correct / L.total * 100) + '%'; $('#hCount').textContent = L.hearts; }
function resetFoot() {
  const f = $('#lfoot'); f.className = 'lfoot'; $('#fb').innerHTML = '';
  $('#btnRow').innerHTML = '<button class="btn ghost" id="hintBtn" type="button">Gợi ý</button><button class="btn wide" id="checkBtn" type="button" disabled>Kiểm tra</button>';
  $('#checkBtn').onclick = check; $('#hintBtn').onclick = showHint;
}
function nextQ() {
  if (L.pos >= L.queue.length) return finish();
  L.cur = L.queue[L.pos]; L.answer = null; L.state = 'answer'; L.hinted = false;
  resetFoot(); setProgress(); render(L.cur);
  $('#lbody').scrollTop = 0;
}
function ready(v) { L.answer = v; $('#checkBtn').disabled = v == null || v === '' || (Array.isArray(v) && !v.length); }

/* renderers */
function headHtml(q) {
  const k = q.t === 'chips' ? 'chips' : q.t === 'type' ? 'type' : (q.kind || 'mc');
  return `<div class="kind">${KINDLBL[k]}${q.n != null ? ' · Câu ' + q.n : ''}</div>`;
}
function passageHtml(letter, n) {
  const paras = DATA.passages[letter];
  const body = paras.map((p, i) => letter === 'D' && i === 0 ? `<p><strong>${esc(p)}</strong></p>` :
    `<p>${esc(p).replace(/\((\d)\)_+/g, (m, d) => +d === n ? `<mark>(${d}) _____</mark>` : `<span class="bl">(${d}) _____</span>`)}</p>`).join('');
  const vi = DATA.passVi[letter].split('\n').map(t => `<p>${esc(t)}</p>`).join('');
  return `<details class="passage" open><summary>${ICON.read.replace('<svg', '<svg class="i"')} Bài đọc ${letter}</summary>
    <div class="ptxt">${body}</div><button class="vitoggle" type="button" id="viT">Xem bản dịch</button><div class="vitext" id="viX" hidden>${vi}</div></details>`;
}
function entryHtml(key) {
  const e = DATA.entries[key];
  return `<div class="entry"><span class="hw">${esc(e.head)}</span> <span class="ipa">${esc(e.ipa)} · ${esc(e.pos)}</span>
    <ol>${e.senses.map(s => `<li>${s.bolddef ? '<b>' + esc(s.def) + '</b>' : esc(s.def)}<ul>${s.ex.map(x => `<li>${richB(x)} <button class="saybtn exsay" type="button" data-say="${esc(stripB(x.replace(/\*\*/g, '')))}" aria-label="Nghe ví dụ">${ICON.speak}</button></li>`).join('')}</ul></li>`).join('')}</ol></div>`;
}
function render(q) {
  const st = $('#stage');
  if (q.t === 'match') return renderMatch(q);
  $('#hintBtn').hidden = !q.hint;
  if (q.t === 'mc') {
    let top = headHtml(q), title = '';
    if (q.passage) top += passageHtml(q.passage, q.kind === 'cloze' ? q.n : 0);
    if (q.kind === 'sign') top += `<img class="signimg" src="${q.img}" alt="Biển báo câu ${q.n}">`;
    if (q.kind === 'phr') title = q.dir === 'en2vi'
      ? `<div class="qtitle">Cụm từ này nghĩa là gì?</div><div class="phrase"><button class="saybtn big" type="button" id="sayQ" aria-label="Nghe">${ICON.speak}</button><span>${richB(q.q)}</span></div>`
      : `<div class="qtitle">Chọn cụm tiếng Anh đúng nghĩa</div><div class="phrase vi"><span>${esc(q.q)}</span></div>`;
    else if (q.kind === 'pron' || q.kind === 'stress') title = `<div class="qtitle">${esc(q.q)}</div>`;
    else if (q.kind === 'tf') title = `<div class="qtitle">True hay False?</div><div class="qtext">${esc(q.q)}</div>`;
    else title = `<div class="qtext">${esc(q.q).replace(/_{3,}/g, '<span class="gap"></span>')}</div>`;
    const sayable = !(q.kind === 'phr' && q.dir === 'en2vi');   // đáp án tiếng Anh → tự đọc khi chọn
    const opts = q.o.map((o, i) => `<button class="opt" data-i="${i}" type="button"><span class="k">${q.kind === 'tf' ? (i ? 'F' : 'T') : 'ABCD'[i]}</span><span>${q.kind === 'pron' ? o.replace(/<(?!\/?u>)/g, '&lt;') : q.kind === 'phr' ? richB(o) : esc(o)}</span>${sayable && !VN.test(stripB(o)) ? `<span class="say" aria-hidden="true">${ICON.speak}</span>` : ''}</button>`).join('');
    st.innerHTML = top + title + `<div class="opts ${q.kind === 'tf' ? 'two' : ''}" id="opts">${opts}</div>`;
    st.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (L.state !== 'answer') return;
      st.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); ready(+b.dataset.i);
      const said = stripB(q.o[+b.dataset.i]).replace(/<\/?u>/g, '');
      if (sayable && !VN.test(said)) speak(said, true);
    });
    const sq = $('#sayQ'); if (sq) { sq.onclick = () => speak(stripB(q.q)); speak(stripB(q.q), true); }
  } else if (q.t === 'type') {
    const top = headHtml(q) + (q.entry ? entryHtml(q.entry) : '');
    st.innerHTML = top + `<div class="qtitle">${q.base ? 'Viết dạng đúng của từ' : 'Điền cụm từ đúng (xem từ điển)'}</div>
      ${q.base ? `<div><span class="basew">${esc(q.base)}</span></div>` : ''}
      <div class="qtext">${esc(q.q).replace(/_{3,}/g, '<span class="gap"></span>')}</div>
      <div class="typebox"><input id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ câu trả lời…"></div>`;
    const inp = $('#typeIn'); inp.oninput = () => ready(inp.value.trim()); inp.focus({ preventScroll:true });
  } else if (q.t === 'chips') {
    st.innerHTML = headHtml(q) + `<div class="qtitle">Viết lại câu, nghĩa không đổi</div>
      ${q.group ? `<div class="groupnote">${esc(q.group)}: ${esc(q.hint)}</div>` : ''}
      <div class="orig">${esc(q.org)} <button class="saybtn" type="button" id="sayOrg" aria-label="Nghe câu gốc">${ICON.speak}</button></div>
      <div class="writebox"><span class="pre">→ ${esc(q.pre)}</span>
        <textarea id="writeIn" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gõ tiếp phần còn lại của câu…"></textarea></div>
      <div class="writetip">Gõ phần còn lại sau chữ in đậm. Không cần viết hoa; dấu chấm cuối câu có hay không đều được. Nhấn Enter để kiểm tra.</div>`;
    const w = $('#writeIn'); w.oninput = () => ready(w.value.trim()); w.focus({ preventScroll:true });
    $('#sayOrg').onclick = () => speak(q.org);
  }
  const vb = $('#viT'); if (vb) vb.onclick = () => { const x = $('#viX'); x.hidden = !x.hidden; vb.textContent = x.hidden ? 'Xem bản dịch' : 'Ẩn bản dịch'; };
}
function renderMatch(q) {
  $('#hintBtn').hidden = true;
  const left = shuffle(q.words), right = shuffle(q.words);
  $('#stage').innerHTML = `<div class="kind">Từ vựng</div><div class="qtitle">Ghép từ với nghĩa đúng</div>
    <div class="match"><div class="col">${left.map(w => `<button class="opt" data-w="${esc(w.w)}" data-s="L" type="button">${esc(w.w)}</button>`).join('')}</div>
    <div class="col">${right.map(w => `<button class="opt" data-w="${esc(w.w)}" data-s="R" type="button">${esc(w.vi)}</button>`).join('')}</div></div>`;
  let pick = { L:null, R:null }, left_ = q.words.length, errs = 0;
  $('#stage').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (b.classList.contains('gone')) return;
    const s = b.dataset.s;
    if (pick[s]) pick[s].classList.remove('sel');
    pick[s] = b; b.classList.add('sel');
    if (s === 'L') { const w = q.words.find(x => x.w === b.dataset.w); speak(w.w, true); }
    if (pick.L && pick.R) {
      const a = pick.L, z = pick.R; pick = { L:null, R:null };
      if (a.dataset.w === z.dataset.w) {
        [a, z].forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); });
        tone(true);
        setTimeout(() => [a, z].forEach(x => { x.classList.remove('ok'); x.classList.add('gone'); x.disabled = true; }), 280);
        if (--left_ === 0) {
          L.correct++; L.firstTry += errs ? 0 : 1; setProgress();
          setTimeout(() => { L.pos++; nextQ(); }, 550);
        }
      } else {
        errs++; tone(false);
        const w = q.words.find(x => x.w === a.dataset.w);
        if (!L.mistakes.find(m => m.w === w.w)) L.mistakes.push({ w:w.w, html:`<b>${esc(w.w)}</b> ${esc(w.ipa)} = ${esc(w.vi)}` });
        [a, z].forEach(x => { x.classList.remove('sel'); x.classList.add('bad', 'shake'); setTimeout(() => x.classList.remove('bad', 'shake'), 400); });
      }
    }
  });
  $('#btnRow').innerHTML = '<div style="flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:14px">Chạm một từ bên trái, rồi chạm nghĩa bên phải. Chạm từ tiếng Anh để nghe.</div>';
}

/* checking */
/* chấm câu viết lại: bỏ hoa/thường, dấu chấm cuối, ngoặc; chấp nhận travelling/traveling, gõ lại cả phần đầu câu */
const wnorm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[()]/g, ' ').replace(/[.,!?;:]/g, ' ')
  .replace(/\btravell/g, 'travel').replace(/\bit is\b/g, "it's").replace(/\bdo not\b/g, "don't").replace(/\bdoes not\b/g, "doesn't")
  .replace(/\s+/g, ' ').trim();
function writeVariants(q) {
  const full = q.ans.join(' ');
  const v = [full];
  if (q.n === 1) v.push(full.replace(/\.$/, '') + ' or not');
  return v.map(wnorm);
}
function writeOk(q, a) {
  let x = wnorm(a); const pre = wnorm(q.pre);
  if (x.startsWith(pre + ' ')) x = x.slice(pre.length + 1);
  return writeVariants(q).includes(x);
}
/* tô các từ em viết sai / thiếu (so khớp dãy con chung dài nhất) */
function diffHtml(user, right) {
  const a = wnorm(user).split(' ').filter(Boolean), b = right.split(/\s+/);
  const bn = b.map(wnorm);
  const m = a.length, n = b.length, d = Array.from({ length:m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) d[i][j] = a[i] === bn[j] ? d[i + 1][j + 1] + 1 : Math.max(d[i + 1][j], d[i][j + 1]);
  const keep = new Set(); let i = 0, j = 0;
  while (i < m && j < n) { if (a[i] === bn[j]) { keep.add(j); i++; j++; } else if (d[i + 1][j] >= d[i][j + 1]) i++; else j++; }
  const userKeep = new Set(); i = 0; j = 0;
  while (i < m && j < n) { if (a[i] === bn[j]) { userKeep.add(i); i++; j++; } else if (d[i + 1][j] >= d[i][j + 1]) i++; else j++; }
  return { user: a.map((w, k) => userKeep.has(k) ? esc(w) : `<s>${esc(w)}</s>`).join(' ') || '<s>(để trống)</s>',
           right: b.map((w, k) => keep.has(k) ? esc(w) : `<b>${esc(w)}</b>`).join(' ') };
}
const norm = s => s.toLowerCase().replace(/[’‘]/g, "'").replace(/[.,!?;:]+$/g, '').replace(/\s+/g, ' ').trim();
function isRight(q, a) {
  if (q.t === 'mc') return a === q.a || (q.alts || []).includes(a);
  if (q.t === 'type') return q.acc.some(x => norm(x) === norm(a));
  if (q.t === 'chips') return writeOk(q, a);
  return false;
}
function check() {
  if (L.state !== 'answer' || L.answer == null) return;
  const q = L.cur, ok = isRight(q, L.answer);
  L.state = 'feedback'; tone(ok);
  if (q.t === 'mc') {
    const b = [...document.querySelectorAll('#opts .opt')];
    b.forEach(x => x.disabled = true);
    b[ok ? L.answer : q.a].classList.add('ok'); if (!ok) b[L.answer].classList.add('bad');
    if (q.kind === 'stress') b.forEach((x, i) => { x.querySelector('span:nth-child(2)').textContent = q.marks[i]; });
  } else if (q.t === 'type') { const inp = $('#typeIn'); inp.disabled = true; inp.classList.add(ok ? 'ok' : 'bad'); }
  else if (q.t === 'chips') { const w = $('#writeIn'); w.disabled = true; w.classList.add(ok ? 'ok' : 'bad'); }
  if (ok) {
    L.correct++; if (!L.wrongSet.has(q)) L.firstTry++;
  } else {
    L.hearts--; L.wrongSet.add(q);
    if (!L.mistakes.includes(q)) L.mistakes.push(q);
    L.queue.push(q); // làm lại cuối bài
  }
  setProgress();
  const f = $('#lfoot'); f.className = 'lfoot ' + (ok ? 'ok' : 'bad');
  let full = q.t === 'chips' ? `→ ${esc(q.pre)} <b>${esc(q.ans.join(' '))}</b>` : markAns(q.full);
  if (q.t === 'chips' && !ok) {
    const df = diffHtml(L.answer, q.ans.join(' '));
    full = `<span class="yours">Em viết: → ${esc(q.pre)} ${df.user}</span><br>Đáp án đúng: → ${esc(q.pre)} <span class="rightans">${df.right}</span>`;
    q.lastWrong = L.answer;
  }
  const enText = q.t === 'chips' ? q.pre + ' ' + q.ans.join(' ') : (q.kind === 'pron' || q.kind === 'stress' ? '' : plain(q.full).replace(/\s*→.*$/, '').replace(/\s*\([A-Z]+\)$/, ''));
  const enSay = VN.test(enText) ? '' : enText;
  $('#fb').innerHTML = `<h3>${ok ? ICON.check + ' Chính xác!' : ICON.cross + ' Chưa đúng'}</h3>
    <div class="more">
      <div class="full">${ok || q.t === 'chips' ? '' : 'Đáp án đúng: '}${full} ${enSay && canSpeak ? `<button class="saybtn" id="sayFull" type="button">${ICON.speak} Nghe</button>` : ''}</div>
      <div class="row vi"><strong>${q.kind === 'phr' ? 'Nghĩa' : 'Dịch'}:</strong> ${esc(q.vi)}</div>
      ${q.f ? `<div class="row fx"><strong>${q.kind === 'phr' ? '' : 'Công thức: '}</strong>${esc(q.f)}</div>` : ''}
      ${q.e ? `<div class="row"><strong>Giải thích:</strong> ${esc(q.e)}</div>` : ''}
    </div>`;
  const sb = $('#sayFull'); if (sb) sb.onclick = () => speak(enSay);
  $('#btnRow').innerHTML = `<button class="btn wide ${ok ? '' : 'red'}" id="contBtn" type="button">${L.hearts <= 0 ? 'Xem kết quả' : 'Tiếp tục'}</button>`;
  $('#contBtn').onclick = cont; $('#contBtn').focus({ preventScroll:true });
}
function cont() { if (L.hearts <= 0) return finish(true); L.pos++; nextQ(); }
function showHint() {
  const q = L.cur; if (!q || !q.hint || L.hinted) return; L.hinted = true;
  const d = document.createElement('div'); d.className = 'hintbox';
  d.innerHTML = `<strong>Công thức gợi ý:</strong> ${esc(q.hint)}`;
  $('#stage').appendChild(d); d.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

/* results */
function finish(outOfHearts) {
  const lesson = L.lesson, secs = Math.round((Date.now() - L.start) / 1000);
  const acc = Math.round(L.firstTry / L.total * 100);
  const xp = outOfHearts ? 0 : L.firstTry * 2 + (acc === 100 ? 5 : 0) + 5;
  if (!outOfHearts) {
    S.done[lesson.id] = Math.max(S.done[lesson.id] || 0, acc);
    S.xp += xp; if (!S.days.includes(today())) S.days.push(today()); save();
  }
  const mm = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  const mistakes = L.mistakes.map(m => m.html ? `<div class="m">${m.html}</div>` :
    `<div class="m">${markAns(m.full || ('→ ' + m.pre + ' [[' + m.ans.join(' ') + ']]'))}<br><span style="color:var(--muted)">${esc(m.f)}</span></div>`).join('');
  $('#pFill').style.width = outOfHearts ? $('#pFill').style.width : '100%';
  $('#hintBtn') && ($('#hintBtn').hidden = true);
  $('#lfoot').className = 'lfoot'; $('#fb').innerHTML = '';
  $('#stage').innerHTML = `<div class="result">
    <svg class="trophy" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 8h28v14a14 14 0 0 1-28 0z" fill="var(--gold)"/><path d="M18 12H8v4a10 10 0 0 0 10 10M46 12h10v4a10 10 0 0 1-10 10" fill="none" stroke="var(--gold-deep)" stroke-width="4"/><rect x="28" y="36" width="8" height="10" fill="var(--gold-deep)"/><rect x="18" y="46" width="28" height="8" rx="3" fill="var(--gold-deep)"/><path d="M32 13l2.4 5 5.4.6-4 3.7 1.1 5.3-4.9-2.7-4.9 2.7 1.1-5.3-4-3.7 5.4-.6z" fill="#fff"/></svg>
    <h2>${outOfHearts ? 'Hết tim rồi!' : acc === 100 ? 'Hoàn hảo!' : 'Hoàn thành bài học!'}</h2>
    <div>${outOfHearts ? 'Xem lại công thức các câu sai bên dưới rồi làm lại nhé.' : esc(lesson.name)}</div>
    <div class="tiles">
      <div class="tile"><div class="t">XP</div><div class="v">+${xp}</div></div>
      <div class="tile g"><div class="t">Đúng ngay</div><div class="v">${acc}%</div></div>
      <div class="tile b"><div class="t">Thời gian</div><div class="v">${mm}</div></div>
    </div>
    ${mistakes ? `<div class="mist"><h3>Câu cần ôn lại (${L.mistakes.length})</h3>${mistakes}</div>` : ''}
  </div>`;
  $('#btnRow').innerHTML = `<button class="btn ghost" id="againBtn" type="button">Làm lại</button><button class="btn wide" id="homeBtn" type="button">Về lộ trình</button>`;
  $('#againBtn').onclick = () => startLesson(lesson);
  $('#homeBtn').onclick = quit;
  L.state = 'done';
  $('#lbody').scrollTop = 0;
}

/* keyboard */
document.addEventListener('keydown', e => {
  if (!L || $('#lesson').hidden) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    if (L.state === 'answer') check(); else if (L.state === 'feedback') cont();
    return;
  }
  if (L.state === 'answer' && L.cur && L.cur.t === 'mc' && document.activeElement.tagName !== 'INPUT') {
    const k = { '1':0, '2':1, '3':2, '4':3, a:0, b:1, c:2, d:3, t:0, f:1 }[e.key.toLowerCase()];
    const b = document.querySelectorAll('#opts .opt')[k]; if (b) b.click();
  }
});
if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
renderHome();
</script>
