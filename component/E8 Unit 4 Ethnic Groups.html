<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>E8 Unit 4 Ethnic Groups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one 600px column — a lesson path of round nodes (home) and a full-screen lesson with a sticky check bar and a sliding feedback sheet. */
:root{
  --bg:#F5F7F0; --surface:#FFFFFF; --surface-2:#EEF2E6; --line:#D9E0CF; --line-strong:#C3CDB5;
  --fg:#22301F; --muted:#66735E;
  --leaf:#3E9B4F; --leaf-deep:#2C7A3B; --leaf-soft:#E2F2DF;
  --brocade:#3B4CA8; --brocade-soft:#E6E9F8;
  --gold:#E9A52B; --gold-deep:#C2841A; --gold-soft:#FCF0D6;
  --red:#D2453A; --red-deep:#A8332A; --red-soft:#FBE3E0;
  --sky:#2F86C9; --sky-soft:#E1EFFA;
  --display:"Baloo 2", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151B14; --surface:#1E261C; --surface-2:#253023; --line:#33402F; --line-strong:#465641;
  --fg:#E7EEE1; --muted:#A3B09A;
  --leaf:#5CBB6C; --leaf-deep:#3E8F4D; --leaf-soft:#22382A;
  --brocade:#8F9CF0; --brocade-soft:#262B4A;
  --gold:#F0B545; --gold-deep:#B9861F; --gold-soft:#3A3020;
  --red:#EE6A5E; --red-deep:#B94A40; --red-soft:#3E2422;
  --sky:#6BB3EA; --sky-soft:#1E3142; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151B14; --surface:#1E261C; --surface-2:#253023; --line:#33402F; --line-strong:#465641;
  --fg:#E7EEE1; --muted:#A3B09A;
  --leaf:#5CBB6C; --leaf-deep:#3E8F4D; --leaf-soft:#22382A;
  --brocade:#8F9CF0; --brocade-soft:#262B4A;
  --gold:#F0B545; --gold-deep:#B9861F; --gold-soft:#3A3020;
  --red:#EE6A5E; --red-deep:#B94A40; --red-soft:#3E2422;
  --sky:#6BB3EA; --sky-soft:#1E3142; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:22px;height:22px;flex:none}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;color:var(--leaf-deep);margin-right:auto;white-space:nowrap}
:root[data-theme="dark"] .brand{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand{color:var(--leaf)}}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.fire{color:var(--gold-deep)} .stat.gem{color:var(--sky)} .stat.done{color:var(--leaf-deep)}

/* ---------- banner ---------- */
.banner{margin-top:18px;border-radius:var(--r);background:var(--leaf);color:#fff;overflow:hidden;box-shadow:0 4px 0 var(--leaf-deep)}
.banner .inner{padding:16px 18px 14px}
.banner .eyebrow{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.banner h1{font-size:26px;margin-top:2px;color:#fff}
.banner p{margin:4px 0 0;font-weight:600;opacity:.95;font-size:15px}
.brocade{height:14px;background:
  linear-gradient(135deg,transparent 25%,#F2C14E 25% 37%,transparent 37% 63%,#F2C14E 63% 75%,transparent 75%) 0 0/14px 14px,
  linear-gradient(45deg,#D2453A 25%,transparent 25% 75%,#D2453A 75%) 0 0/14px 14px,
  #2B3A8F}
.overall{display:flex;align-items:center;gap:10px;margin-top:12px}
.bar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s}
.overall b{font-variant-numeric:tabular-nums}

/* ---------- path ---------- */
.section{margin-top:28px}
.sec-head{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px dashed var(--line)}
.sec-head .tag{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--brocade);background:var(--brocade-soft);border-radius:8px;padding:1px 8px;white-space:nowrap}
.sec-head h2{font-size:20px}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 4px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:150px}
.node .disc{width:72px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-deep);transition:transform .1s,box-shadow .1s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--leaf-deep)}
.node .disc svg{width:32px;height:32px}
.node.done .disc{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep)}
.node.next .disc{outline:5px solid var(--leaf-soft);outline-offset:4px}
.node .lbl{font-weight:800;font-size:14px;line-height:1.25;text-align:center}
.node .sub{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:-4px;font-variant-numeric:tabular-nums}
.node .flag{position:absolute;top:-30px;background:var(--surface);border:2px solid var(--line);color:var(--leaf-deep);font-weight:800;font-size:13px;padding:2px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.node .flag::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.nodes .node:nth-child(4n+2){transform:translateX(-70px)}
.nodes .node:nth-child(4n+4){transform:translateX(70px)}
@media (max-width:420px){.nodes .node:nth-child(4n+2){transform:translateX(-50px)}.nodes .node:nth-child(4n+4){transform:translateX(50px)}}
.foot{padding-block:28px 40px;color:var(--muted);font-size:13.5px;text-align:center}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:700}

/* ---------- lesson ---------- */
#lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lhead .wrap{display:flex;align-items:center;gap:14px;padding-block:14px 6px}
.iconbtn{background:none;border:0;padding:4px;color:var(--muted);display:grid;place-items:center;border-radius:10px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.25)}
.hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-variant-numeric:tabular-nums}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lbody .wrap{padding-block:12px 28px;display:flex;flex-direction:column;gap:16px}
.kind{font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--brocade)}
.qtitle{font-family:var(--display);font-size:24px;font-weight:700}
.qtext{font-size:19px;font-weight:700;line-height:1.45}
.qtext .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--line-strong);margin:0 2px}
.basew{display:inline-block;font-weight:800;color:var(--brocade);background:var(--brocade-soft);padding:1px 10px;border-radius:8px;font-size:15px;letter-spacing:.04em}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;font-weight:700;font-size:17px;min-height:54px;transition:background .1s,border-color .1s}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--sky);background:var(--sky-soft)}
.opt.sel .k{border-color:var(--sky);color:var(--sky)}
.opt.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.opt u{text-decoration-thickness:2.5px;text-underline-offset:4px;text-decoration-color:var(--red)}
.opt .say{margin-left:auto;color:var(--sky);display:grid;place-items:center}

.typebox{display:flex;flex-direction:column;gap:8px}
.typebox input{font:inherit;font-size:18px;font-weight:700;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.typebox input:focus{border-color:var(--sky);outline:none}
.typebox input.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.typebox input.bad{border-color:var(--red);background:var(--red-soft)}

/* chips */
.orig{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:17px}
.answer-line{min-height:110px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px 2px;border-bottom:2px solid var(--line);
  background-image:linear-gradient(var(--line) 2px,transparent 2px);background-size:100% 54px;background-position:0 52px}
.pre{font-weight:800;font-size:17px;align-self:center;padding:0 4px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.chip{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:6px 12px;font-weight:700;font-size:16.5px}
.chip.ghost{color:transparent;background:var(--line);border-color:var(--line);pointer-events:none}
.groupnote{font-weight:700;color:var(--brocade);font-size:14px}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{justify-content:center;text-align:center;font-size:16px;padding:10px}
.match .opt.gone{opacity:.35;border-color:var(--line);background:var(--surface-2)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* reading + dictionary + sign */
details.passage{background:var(--surface);border:2px solid var(--line);border-radius:14px}
details.passage summary{cursor:pointer;padding:10px 14px;font-weight:800;color:var(--brocade);list-style:none;display:flex;align-items:center;gap:8px}
details.passage summary::-webkit-details-marker{display:none}
details.passage .ptxt{padding:0 14px 12px;font-size:15.5px;line-height:1.6;max-height:42vh;overflow-y:auto}
.ptxt p{margin:0 0 8px}
.ptxt mark{background:var(--gold-soft);color:var(--fg);border-radius:4px;padding:0 3px;font-weight:800;outline:2px solid var(--gold)}
.ptxt .bl{font-weight:800;color:var(--muted)}
.vitoggle{margin:0 14px 12px;background:var(--surface-2);border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--muted)}
.vitext{padding:0 14px 12px;font-size:14.5px;color:var(--muted);font-style:italic}
.entry{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--brocade);border-radius:14px;padding:12px 14px;font-size:15px}
.entry .hw{font-family:var(--display);font-size:22px;font-weight:800;color:var(--brocade)}
.entry .ipa{color:var(--muted);font-weight:600}
.entry ol{margin:6px 0 0;padding-left:20px}
.entry ul{margin:4px 0 6px;padding-left:16px;color:var(--muted)}
.entry li{margin:2px 0}
.signimg{display:block;max-width:100%;max-height:240px;margin:0 auto;border-radius:12px;border:2px solid var(--line);background:#fff}

.phrase{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:21px;font-weight:700;line-height:1.4}
.phrase b{color:var(--brocade)}
.phrase.vi{font-size:19px;color:var(--fg)}
.saybtn.big{width:48px;height:48px;flex:none;border-radius:14px;background:var(--sky);color:#fff;justify-content:center;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 70%,#000)}
.saybtn.big svg{width:26px;height:26px}
.opt b{color:var(--brocade)}
.entry b{color:var(--fg)}
.entry ul b{color:var(--brocade)}
.exsay{vertical-align:middle;opacity:.8}
.exsay svg{width:18px;height:18px}
.writebox{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.writebox:focus-within{border-color:var(--sky)}
.writebox textarea{font:inherit;font-size:18px;font-weight:700;border:0;background:transparent;color:var(--fg);resize:none;width:100%;padding:0;line-height:1.45}
.writebox textarea:focus{outline:none}
.writebox textarea.ok{color:var(--leaf-deep)}
.writebox textarea.bad{color:var(--red)}
.writebox .pre{padding:0;color:var(--brocade)}
.writetip{font-size:13.5px;color:var(--muted);font-weight:600}
.orig .saybtn{vertical-align:middle}
.fb .full s{color:var(--red);text-decoration-thickness:2px}
.fb .full .yours{font-weight:600;color:var(--muted)}
.fb .full .rightans b{color:var(--leaf-deep);background:var(--leaf-soft);border-radius:4px;padding:0 2px;text-decoration:none}
/* bottom bar + feedback */
.lfoot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s,border-color .2s}
.lfoot .wrap{display:flex;gap:12px;align-items:center;padding-block:14px}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-deep)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-strong);cursor:default;transform:none}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-deep)}
.btn.ghost{background:var(--surface);color:var(--muted);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.wide{flex:1}
.fb{display:none;flex-direction:column;gap:6px;flex:1;min-width:0}
.lfoot.ok{background:var(--leaf-soft);border-color:transparent}
.lfoot.bad{background:var(--red-soft);border-color:transparent}
.lfoot.ok .fb,.lfoot.bad .fb{display:flex}
.lfoot.ok .wrap,.lfoot.bad .wrap{flex-direction:column;align-items:stretch}
.fb h3{font-size:22px;display:flex;align-items:center;gap:8px}
.lfoot.ok h3{color:var(--leaf-deep)} .lfoot.bad h3{color:var(--red)}
:root[data-theme="dark"] .lfoot.ok h3{color:var(--leaf)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lfoot.ok h3{color:var(--leaf)}}
.fb .full{font-weight:700;font-size:16px}
.fb .full b{color:var(--red);text-decoration:underline;text-underline-offset:3px}
.lfoot.ok .fb .full b{color:var(--leaf-deep)}
.fb .row{font-size:14.5px;line-height:1.45}
.fb .row strong{font-weight:800}
.fb .row.vi{font-style:italic;color:var(--muted)}
.fb .row.fx{color:var(--brocade);font-weight:700}
.fb .more{max-height:30vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.hintbox{background:var(--sky-soft);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;color:var(--fg)}
.hintbox strong{color:var(--sky)}
.saybtn{background:none;border:0;color:var(--sky);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:0}

/* results */
.result{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:28px}
.result h2{font-size:30px;color:var(--gold-deep)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--gold);border-radius:14px;overflow:hidden}
.tile .t{background:var(--gold);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px}
.tile .v{font-family:var(--display);font-size:24px;font-weight:800;padding:8px 4px;font-variant-numeric:tabular-nums}
.tile.g{border-color:var(--leaf)} .tile.g .t{background:var(--leaf)}
.tile.b{border-color:var(--sky)} .tile.b .t{background:var(--sky)}
.mist{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.mist h3{font-size:18px}
.mist .m{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.mist .m b{color:var(--red)}
.trophy{width:96px;height:96px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="lesson" hidden>
  <div class="lhead"><div class="wrap">
    <button class="iconbtn" id="quitBtn" type="button" aria-label="Thoát bài"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<script>
const DATA = {"items": {"wh": [{"t": "mc", "n": 1, "q": "_____ do you usually eat lunch? – At noon.", "o": ["Which", "When", "What", "How"], "a": 1, "hint": "Wh + do / does + S + V? · Câu trả lời “At noon” chỉ THỜI GIAN → chọn từ hỏi thời gian.", "full": "[[When]] do you usually eat lunch? – At noon.", "vi": "Bạn thường ăn trưa lúc nào? – Lúc giữa trưa.", "f": "When + do / does + S + V? → hỏi thời gian", "e": "“At noon” (lúc giữa trưa) là thời gian → When. Which = cái nào, What = cái gì, How = như thế nào."}, {"t": "mc", "n": 2, "q": "_____ do you wash clothes? – Every week.", "o": ["Which", "Who", "What", "How often"], "a": 3, "hint": "Wh + do / does + S + V? · Câu trả lời “Every week” chỉ TẦN SUẤT (bao lâu một lần).", "full": "[[How often]] do you wash clothes? – Every week.", "vi": "Bạn giặt quần áo bao lâu một lần? – Mỗi tuần.", "f": "How often + do / does + S + V? → hỏi tần suất", "e": "“Every week” (mỗi tuần) trả lời cho câu hỏi “bao lâu một lần” → How often. Dấu hiệu khác: always, usually, once / twice a week."}, {"t": "mc", "n": 3, "q": "_____ does your father work? – At City Hall.", "o": ["Where", "Who", "What", "How"], "a": 0, "hint": "Wh + does + S + V? · Câu trả lời “At City Hall” chỉ NƠI CHỐN.", "full": "[[Where]] does your father work? – At City Hall.", "vi": "Bố bạn làm việc ở đâu? – Ở tòa thị chính.", "f": "Where + do / does + S + V? → hỏi nơi chốn", "e": "“At City Hall” (ở tòa thị chính) là nơi chốn → Where."}, {"t": "mc", "n": 4, "q": "_____ usually gets up the earliest in your family?", "o": ["Which", "Who", "What", "How"], "a": 1, "hint": "Từ hỏi làm CHỦ NGỮ: Wh + V(s/es)…? (không có do / does). Câu hỏi về NGƯỜI trong gia đình.", "full": "[[Who]] usually gets up the earliest in your family?", "vi": "Ai thường dậy sớm nhất trong gia đình bạn?", "f": "Who + V(s/es) + …? → Who làm chủ ngữ, hỏi người", "e": "Sau chỗ trống là động từ đã chia “gets” → thiếu chủ ngữ. Người dậy sớm nhất trong gia đình → Who. Không dùng “does” vì Who đã là chủ ngữ."}, {"t": "mc", "n": 5, "q": "_____ do you think of this hotel? – It's pretty good.", "o": ["Which", "Why", "What", "How"], "a": 2, "hint": "Cấu trúc hỏi ý kiến: ___ do you think of + N? (Bạn nghĩ gì về…?)", "full": "[[What]] do you think of this hotel? – It's pretty good.", "vi": "Bạn nghĩ gì về khách sạn này? – Nó khá tốt.", "f": "What do you think of + N? = Bạn nghĩ gì về…?", "e": "“think of” đi với What để hỏi ý kiến; trả lời “It’s pretty good”. How đi với cấu trúc khác: How do you like…? / How is…?"}, {"t": "mc", "n": 6, "q": "_____ do you work at that company? – Because it's near my house.", "o": ["Which", "Who", "Why", "When"], "a": 2, "hint": "Wh + do + S + V? · Câu trả lời bắt đầu bằng “Because” → hỏi LÝ DO.", "full": "[[Why]] do you work at that company? – Because it's near my house.", "vi": "Tại sao bạn làm việc ở công ty đó? – Vì nó gần nhà tôi.", "f": "Why + do / does + S + V? – Because + S + V", "e": "Câu trả lời “Because it’s near my house” nêu lý do → Why."}, {"t": "mc", "n": 7, "q": "_____ dances the best in your family?", "o": ["Which", "Who", "What", "How"], "a": 1, "hint": "Từ hỏi làm CHỦ NGỮ: Wh + V(s/es)…? · Hỏi NGƯỜI múa giỏi nhất.", "full": "[[Who]] dances the best in your family?", "vi": "Ai nhảy giỏi nhất trong gia đình bạn?", "f": "Who + V(s/es) + …? → hỏi người (chủ ngữ)", "e": "Sau chỗ trống là “dances” (động từ chia số ít) → từ hỏi làm chủ ngữ, hỏi người → Who."}, {"t": "mc", "n": 8, "q": "_____ is it from the centre to the Museum of Ethnology? – It's about seven kilometres.", "o": ["How long", "How far", "How often", "How much"], "a": 1, "hint": "How ___ is it from A to B? · Câu trả lời “about seven kilometres” chỉ KHOẢNG CÁCH.", "full": "[[How far]] is it from the centre to the Museum of Ethnology? – It's about seven kilometres.", "vi": "Từ trung tâm đến Bảo tàng Dân tộc học bao xa? – Khoảng bảy cây số.", "f": "How far is it from A to B? – It’s (about) + số + km / m", "e": "“seven kilometres” là khoảng cách → How far. How long = bao lâu (thời gian) / dài bao nhiêu; How often = tần suất; How much = bao nhiêu (giá, lượng)."}, {"t": "mc", "n": 9, "q": "_____ can I buy some milk? – At the supermarket.", "o": ["Which", "Who", "Where", "How"], "a": 2, "hint": "Wh + can + S + V? · Câu trả lời “At the supermarket” chỉ NƠI CHỐN.", "full": "[[Where]] can I buy some milk? – At the supermarket.", "vi": "Tôi có thể mua sữa ở đâu? – Ở siêu thị.", "f": "Where + can + S + V? → hỏi nơi chốn", "e": "“At the supermarket” (ở siêu thị) là nơi chốn → Where."}, {"t": "mc", "n": 10, "q": "_____ much do you weigh?", "o": ["Which", "Who", "What", "How"], "a": 3, "hint": "___ much + do + S + V? · Ghép với “much” để hỏi BAO NHIÊU (cân nặng, giá, lượng).", "full": "[[How]] much do you weigh?", "vi": "Bạn nặng bao nhiêu (cân)?", "f": "How much + do / does + S + V? → hỏi lượng / giá / cân nặng", "e": "Chỉ “How” ghép được với “much”: How much do you weigh? = Bạn nặng bao nhiêu?"}, {"t": "mc", "n": 11, "q": "_____ hat is this? – It's my brother's.", "o": ["Which", "Whose", "What", "How"], "a": 1, "hint": "___ + N + is this? – It’s + sb’s (của ai). Câu trả lời có sở hữu cách ’s → hỏi SỞ HỮU.", "full": "[[Whose]] hat is this? – It's my brother's.", "vi": "Cái mũ này của ai? – Của anh trai tôi.", "f": "Whose + N + is this / are these? – It’s + sb’s", "e": "“It’s my brother’s” (của anh tôi) là sở hữu → Whose. Whose đứng ngay trước danh từ (Whose hat)."}, {"t": "mc", "n": 12, "q": "_____ do you like your tea? – I like it with cream and sugar.", "o": ["Which", "Who", "What", "How"], "a": 3, "hint": "___ do you like + N? – I like it + with… (cách thức) → hỏi THÍCH NHƯ THẾ NÀO.", "full": "[[How]] do you like your tea? – I like it with cream and sugar.", "vi": "Bạn thích uống trà như thế nào? – Tôi thích trà có kem và đường.", "f": "How do you like + N? = Bạn thích… như thế nào?", "e": "Trả lời “with cream and sugar” là cách thức → How. Khác với What do you think of…? (hỏi ý kiến)."}, {"t": "mc", "n": 13, "q": "_____ picture do you prefer, this one or that one?", "o": ["Which", "Who", "What", "How"], "a": 0, "hint": "___ + N + do you prefer, A or B? · Có sẵn các LỰA CHỌN (this one or that one).", "full": "[[Which]] picture do you prefer, this one or that one?", "vi": "Bạn thích bức tranh nào hơn, bức này hay bức kia?", "f": "Which + N + do you prefer, A or B? → chọn trong số có giới hạn", "e": "Có 2 lựa chọn cụ thể “this one or that one” → Which. What dùng khi không có sẵn lựa chọn."}, {"t": "mc", "n": 14, "q": "_____ is that woman? – I think she is a teacher.", "o": ["Which", "Who", "When", "How"], "a": 1, "hint": "___ is + người? – She is a teacher. · Hỏi người đó LÀ AI.", "full": "[[Who]] is that woman? – I think she is a teacher.", "vi": "Người phụ nữ kia là ai? – Tôi nghĩ cô ấy là giáo viên.", "f": "Who is + sb? → hỏi danh tính người", "e": "Câu hỏi về “that woman”, trả lời “she is a teacher” → Who. Which / When / How không hỏi danh tính."}, {"t": "mc", "n": 15, "q": "Do you know _____ language is spoken in Kenya?", "o": ["which", "who", "what", "how"], "a": 0, "hint": "Câu hỏi gián tiếp: Do you know + wh + N + V? · Hỏi NGÔN NGỮ NÀO (trong số các ngôn ngữ).", "full": "Do you know [[which]] language is spoken in Kenya?", "vi": "Bạn có biết ngôn ngữ nào được nói ở Kenya không?", "f": "Do you know + which / what + N + (is) V3? → câu hỏi gián tiếp", "e": "Từ hỏi đứng trước danh từ “language” → which (hoặc what). Đáp án theo đề: A. which. Who / how không đứng trước danh từ.", "alts": [0, 2]}], "voc": [{"t": "mc", "n": 16, "q": "My Son sanctuary has been recognized by UNESCO as a world _____.", "o": ["ethnic minorities", "open-air market", "heritage site", "terraced field"], "a": 2, "hint": "Collocation: a world ___ site · Nơi UNESCO công nhận (My Son).", "full": "My Son sanctuary has been recognized by UNESCO as a world [[heritage site]].", "vi": "Thánh địa Mỹ Sơn đã được UNESCO công nhận là di sản thế giới.", "f": "a world heritage site = di sản thế giới", "e": "UNESCO công nhận Thánh địa Mỹ Sơn là di sản thế giới → world heritage site. Các phương án khác không đi với “world … recognized by UNESCO”."}, {"t": "mc", "n": 17, "q": "If you go to Sapa, you can distinguish people from different ethnic groups by their _____.", "o": ["costumes", "livestock", "highlands", "staircases"], "a": 0, "hint": "distinguish sb by their + N (nhận ra ai nhờ …) · Thứ người ta MẶC.", "full": "If you go to Sapa, you can distinguish people from different ethnic groups by their [[costumes]].", "vi": "Nếu đến Sa Pa, bạn có thể phân biệt người các dân tộc khác nhau qua trang phục của họ.", "f": "distinguish sb by their + N = phân biệt ai qua…", "e": "Phân biệt người các dân tộc qua trang phục → costumes. livestock = gia súc, highlands = cao nguyên, staircases = cầu thang."}, {"t": "mc", "n": 18, "q": "Xoe and Sap are _____ of Thai ethnic minority people.", "o": ["modern dances", "jazz dances", "lion dances", "folk dances"], "a": 3, "hint": "Xoe and Sap are ___ dances · Múa truyền thống của dân tộc Thái → múa DÂN GIAN.", "full": "Xoe and Sap are [[folk dances]] of Thai ethnic minority people.", "vi": "Xòe và Sạp là những điệu múa dân gian của người dân tộc thiểu số Thái.", "f": "folk + N = thuộc dân gian (folk dance, folk song)", "e": "Xòe và Sạp là các điệu múa dân gian của người Thái → folk dances. modern / jazz / lion dances không phải múa của dân tộc Thái."}, {"t": "mc", "n": 19, "q": "We spent hours in _____ house to talk with local people.", "o": ["terraced", "close", "communal", "awesome"], "a": 2, "hint": "___ house · Ngôi nhà CỘNG ĐỒNG để nói chuyện với dân địa phương.", "full": "We spent hours in [[communal]] house to talk with local people.", "vi": "Chúng tôi dành hàng giờ ở nhà rông để trò chuyện với người dân địa phương.", "f": "communal house = nhà rông, nhà sinh hoạt cộng đồng", "e": "Nơi mọi người tụ họp, trò chuyện → communal house. terraced đi với fields, không đi với house."}, {"t": "mc", "n": 20, "q": "She wore a _____ costume of bright pink silk.", "o": ["peaceful", "ethnic", "musical", "traditional"], "a": 3, "hint": "a ___ costume · Chú ý mạo từ “a” (đứng trước phụ âm) và nghĩa TRUYỀN THỐNG.", "full": "She wore a [[traditional]] costume of bright pink silk.", "vi": "Cô ấy mặc một bộ trang phục truyền thống bằng lụa màu hồng tươi.", "f": "a + adj + N: a traditional costume = trang phục truyền thống", "e": "“a” đứng trước phụ âm → traditional (“a ethnic” sai, phải là “an ethnic”). peaceful (yên bình), musical (thuộc âm nhạc) không hợp nghĩa."}, {"t": "mc", "n": 21, "q": "You can visit Gia Lai to enjoy the gong _____.", "o": ["special", "different", "communal", "festival"], "a": 3, "hint": "the gong ___ · Gia Lai (Tây Nguyên) nổi tiếng với LỄ HỘI cồng chiêng.", "full": "You can visit Gia Lai to enjoy the gong [[festival]].", "vi": "Bạn có thể đến Gia Lai để thưởng thức lễ hội cồng chiêng.", "f": "the + N + N: the gong festival = lễ hội cồng chiêng", "e": "Sau “the gong” cần danh từ → festival. special, different, communal là tính từ."}, {"t": "mc", "n": 22, "q": "Some _____ farmers keep ducks and geese in their farms.", "o": ["feature", "post", "soil", "poultry"], "a": 3, "hint": "___ farmers + keep ducks and geese · Vịt, ngỗng là GIA CẦM.", "full": "Some [[poultry]] farmers keep ducks and geese in their farms.", "vi": "Một số người nuôi gia cầm nuôi vịt và ngỗng trong trang trại.", "f": "poultry farmer = người nuôi gia cầm", "e": "Dấu hiệu “ducks and geese” (vịt, ngỗng) → poultry (gia cầm). feature = đặc điểm, post = cột, soil = đất."}, {"t": "mc", "n": 23, "q": "We can _____ the sea from here.", "o": ["raise", "overlook", "enrich", "weave"], "a": 1, "hint": "We can ___ the sea from here · Động từ nghĩa NHÌN RA.", "full": "We can [[overlook]] the sea from here.", "vi": "Từ đây chúng ta có thể nhìn ra biển.", "f": "overlook + nơi chốn = nhìn ra, hướng ra", "e": "Từ đây có thể nhìn ra biển → overlook. raise = nuôi, enrich = làm giàu, weave = dệt."}, {"t": "mc", "n": 24, "q": "Viet Nam has 54 ethnic _____.", "o": ["groups", "levels", "turkeys", "fields"], "a": 0, "hint": "54 ethnic ___ · Danh từ số nhiều chỉ CÁC NHÓM dân tộc.", "full": "Viet Nam has 54 ethnic [[groups]].", "vi": "Việt Nam có 54 dân tộc.", "f": "ethnic group(s) = (các) nhóm dân tộc", "e": "Việt Nam có 54 dân tộc → 54 ethnic groups. levels = cấp độ, turkeys = gà tây, fields = cánh đồng."}, {"t": "mc", "n": 25, "q": "The Nung mostly live in _____ though they also live in earthen houses.", "o": ["bamboo flute", "wooden statue", "stilt houses", "travel brochure"], "a": 2, "hint": "live in + loại NHÀ · So sánh với “earthen houses” (nhà đất).", "full": "The Nung mostly live in [[stilt houses]] though they also live in earthen houses.", "vi": "Người Nùng chủ yếu sống trong nhà sàn, mặc dù họ cũng sống trong nhà đất.", "f": "live in + N (nơi ở): stilt house = nhà sàn", "e": "“though they also live in earthen houses” → chỗ trống cũng là một loại nhà → stilt houses. flute (sáo), statue (tượng), brochure (tờ quảng cáo) không phải nhà."}, {"t": "mc", "n": 27, "q": "Sa Pa is famous for the _____ located in the mountainous area.", "o": ["stilt houses", "heritage site", "terraced fields", "wooden statue"], "a": 2, "hint": "be famous for + N · Thứ nổi tiếng ở VÙNG NÚI Sa Pa (ruộng…).", "full": "Sa Pa is famous for the [[terraced fields]] located in the mountainous area.", "vi": "Sa Pa nổi tiếng với những thửa ruộng bậc thang nằm ở vùng núi.", "f": "be famous for + N; terraced field = ruộng bậc thang", "e": "Sa Pa nổi tiếng với ruộng bậc thang ở vùng núi → terraced fields."}, {"t": "mc", "n": 28, "q": "Lahu, Mang, and Brau are _____ minorities in Viet Nam.", "o": ["traditional", "ethnic", "awesome", "natural"], "a": 1, "hint": "___ minorities · Collocation: dân tộc THIỂU SỐ.", "full": "Lahu, Mang, and Brau are [[ethnic]] minorities in Viet Nam.", "vi": "La Hủ, Mảng và Brâu là các dân tộc thiểu số ở Việt Nam.", "f": "ethnic minority = dân tộc thiểu số", "e": "Lahu, Mảng, Brâu là các dân tộc thiểu số → ethnic minorities."}, {"t": "mc", "n": 29, "q": "The goods in the open-air market are _____. You can find almost everything there.", "o": ["diverse", "similar", "unlike", "like"], "a": 0, "hint": "be + adj · Dấu hiệu “You can find almost everything” → hàng hóa ĐA DẠNG.", "full": "The goods in the open-air market are [[diverse]]. You can find almost everything there.", "vi": "Hàng hóa ở chợ ngoài trời rất đa dạng. Bạn có thể tìm thấy gần như mọi thứ ở đó.", "f": "be + adj: diverse = đa dạng", "e": "Tìm được gần như mọi thứ → hàng hóa đa dạng → diverse. similar = giống nhau (trái nghĩa); like / unlike là giới từ, không đứng một mình sau be."}, {"t": "mc", "n": 26, "q": "The Lunar New Year festival is important _____ the Kinh.", "o": ["to", "with", "for", "of"], "a": 0, "hint": "be important ___ sb (quan trọng ĐỐI VỚI ai).", "full": "The Lunar New Year festival is important [[to]] the Kinh.", "vi": "Tết Nguyên đán rất quan trọng đối với người Kinh.", "f": "be important to sb = quan trọng đối với ai", "e": "Tết Nguyên đán quan trọng đối với người Kinh → important to."}, {"t": "mc", "n": 30, "q": "Most ethnic minority peoples are good _____ farming techniques.", "o": ["at", "for", "to", "on"], "a": 0, "hint": "be good ___ + N / V-ing (GIỎI về…).", "full": "Most ethnic minority peoples are good [[at]] farming techniques.", "vi": "Hầu hết các dân tộc thiểu số đều giỏi kỹ thuật canh tác.", "f": "be good at + N / V-ing = giỏi về…", "e": "Giỏi về kỹ thuật canh tác → good at farming techniques."}], "wf": [{"t": "type", "n": 1, "q": "Vietnam is one of the most _____ diverse countries in South East Asia.", "base": "ETHNIC", "acc": ["ethnically"], "hint": "the most + ___ + adj (diverse) + N → từ bổ nghĩa cho TÍNH TỪ là trạng từ (-ly).", "full": "Vietnam is one of the most [[ethnically]] diverse countries in South East Asia.", "vi": "Việt Nam là một trong những quốc gia đa dạng về dân tộc nhất Đông Nam Á.", "f": "adv + adj: ethnic (adj) → ethnically (adv)", "e": "Chỗ trống đứng trước tính từ “diverse” → cần trạng từ. ethnically diverse = đa dạng về dân tộc."}, {"t": "type", "n": 2, "q": "The Pa Then believe that the god of fire brings them _____ and prosperity.", "base": "PEACEFUL", "acc": ["peace"], "hint": "bring sb + ___ + and + N (prosperity) → “and” nối hai từ CÙNG LOẠI → danh từ.", "full": "The Pa Then believe that the god of fire brings them [[peace]] and prosperity.", "vi": "Người Pà Thẻn tin rằng thần lửa mang lại cho họ hòa bình và thịnh vượng.", "f": "bring sb + N; N and N: peaceful (adj) → peace (n)", "e": "“and prosperity” (sự thịnh vượng – danh từ) → chỗ trống cũng là danh từ → peace (hòa bình)."}, {"t": "type", "n": 3, "q": "The Tay community practice _____ religious beliefs including ancestor worship.", "base": "TRADITION", "acc": ["traditional"], "hint": "practice + ___ + religious beliefs (N) → từ đứng trước danh từ là TÍNH TỪ.", "full": "The Tay community practice [[traditional]] religious beliefs including ancestor worship.", "vi": "Cộng đồng người Tày theo các tín ngưỡng truyền thống, trong đó có thờ cúng tổ tiên.", "f": "adj + N: tradition (n) → traditional (adj)", "e": "Đứng trước cụm danh từ “religious beliefs” → tính từ → traditional religious beliefs (tín ngưỡng truyền thống)."}, {"t": "type", "n": 4, "q": "The population of Vietnam contains a rich _____ of ethnic groups.", "base": "DIVERSE", "acc": ["diversity"], "hint": "a + adj (rich) + ___ + of → sau a + tính từ là DANH TỪ.", "full": "The population of Vietnam contains a rich [[diversity]] of ethnic groups.", "vi": "Dân số Việt Nam gồm nhiều dân tộc rất đa dạng, phong phú.", "f": "a + adj + N + of: diverse (adj) → diversity (n)", "e": "“a rich ___ of” → danh từ → a rich diversity of ethnic groups (sự đa dạng phong phú)."}, {"t": "type", "n": 5, "q": "Each time I returned I was struck by the _____ of Sapa and its people.", "base": "UNIQUE", "acc": ["uniqueness"], "hint": "the + ___ + of → sau “the”, trước “of” là DANH TỪ (đuôi -ness).", "full": "Each time I returned I was struck by the [[uniqueness]] of Sapa and its people.", "vi": "Mỗi lần quay lại, tôi đều ấn tượng bởi sự độc đáo của Sa Pa và con người nơi đây.", "f": "the + N + of: unique (adj) → uniqueness (n)", "e": "“the ___ of Sapa” → danh từ → uniqueness (sự độc đáo). unique + -ness."}, {"t": "type", "n": 6, "q": "Vietnam is a country of great cultural _____ with 54 ethnic groups.", "base": "DIVERSE", "acc": ["diversity"], "hint": "adj (cultural) + ___ → sau tính từ là DANH TỪ.", "full": "Vietnam is a country of great cultural [[diversity]] with 54 ethnic groups.", "vi": "Việt Nam là đất nước có sự đa dạng văn hóa lớn với 54 dân tộc.", "f": "adj + N: diverse (adj) → diversity (n)", "e": "“great cultural ___” → danh từ → cultural diversity (sự đa dạng văn hóa)."}, {"t": "type", "n": 7, "q": "The museum collects and preserves many _____ artifacts of ethnic cultures.", "base": "HISTORY", "acc": ["historical"], "hint": "many + ___ + N (artifacts) → từ đứng trước danh từ là TÍNH TỪ.", "full": "The museum collects and preserves many [[historical]] artifacts of ethnic cultures.", "vi": "Bảo tàng sưu tầm và bảo quản nhiều hiện vật lịch sử của văn hóa các dân tộc.", "f": "adj + N: history (n) → historical (adj)", "e": "Đứng trước danh từ “artifacts” → tính từ → historical artifacts (hiện vật lịch sử)."}, {"t": "type", "n": 8, "q": "The Cham people once boasted a _____ culture early in history.", "base": "FLOURISH", "acc": ["flourishing"], "hint": "a + ___ + N (culture) → TÍNH TỪ đứng trước danh từ (tính từ đuôi -ing).", "full": "The Cham people once boasted a [[flourishing]] culture early in history.", "vi": "Người Chăm từng có một nền văn hóa hưng thịnh từ rất sớm trong lịch sử.", "f": "a + adj + N: flourish (v) → flourishing (adj)", "e": "“a ___ culture” → tính từ → a flourishing culture (nền văn hóa hưng thịnh)."}, {"t": "type", "n": 9, "q": "A number of ethnic minorities have _____ mastered farming techniques.", "base": "SUCCESS", "acc": ["successfully"], "hint": "have + ___ + V3 (mastered) → từ bổ nghĩa cho ĐỘNG TỪ là trạng từ (-ly).", "full": "A number of ethnic minorities have [[successfully]] mastered farming techniques.", "vi": "Một số dân tộc thiểu số đã làm chủ thành công kỹ thuật canh tác.", "f": "have + adv + V3: success (n) → successful (adj) → successfully (adv)", "e": "Chỗ trống nằm giữa “have” và “mastered” → trạng từ bổ nghĩa cho động từ → successfully."}, {"t": "type", "n": 10, "q": "The exhibition of traditional costumes was _____ beautiful.", "base": "IMPRESS", "acc": ["impressively"], "hint": "be + ___ + adj (beautiful) → từ bổ nghĩa cho TÍNH TỪ là trạng từ (-ly).", "full": "The exhibition of traditional costumes was [[impressively]] beautiful.", "vi": "Buổi triển lãm trang phục truyền thống đẹp một cách ấn tượng.", "f": "be + adv + adj: impress (v) → impressive (adj) → impressively (adv)", "e": "Đứng trước tính từ “beautiful” → trạng từ → impressively beautiful (đẹp một cách ấn tượng)."}], "dict": [{"t": "type", "n": 35, "q": "For the museum's opening night, the staff wore _____ from the 18th century.", "entry": "costume", "acc": ["historical costumes", "historical costume"], "hint": "wore + adj + N (số nhiều vì “the staff” là nhiều người) · “from the 18th century” → trang phục thời xưa (xem ví dụ thứ 3).", "full": "For the museum's opening night, the staff wore [[historical costumes]] from the 18th century.", "vi": "Trong đêm khai trương bảo tàng, nhân viên mặc trang phục lịch sử từ thế kỷ 18.", "f": "wear + adj + costume(s); historical costume = trang phục lịch sử", "e": "“from the 18th century” (từ thế kỷ 18) → trang phục lịch sử. Lấy từ ví dụ “an elaborate historical costume”. Nhiều nhân viên → costumes (số nhiều)."}, {"t": "type", "n": 36, "q": "At the international cultural fair, each participant proudly wears their _____.", "entry": "costume", "acc": ["national costume", "traditional costume", "traditional national costume"], "hint": "wears their + adj + N · “international cultural fair” → mỗi người mặc trang phục của QUỐC GIA mình (ví dụ thứ 5).", "full": "At the international cultural fair, each participant proudly wears their [[national costume]].", "vi": "Tại hội chợ văn hóa quốc tế, mỗi người tham gia tự hào mặc quốc phục của mình.", "f": "wear one’s + national / traditional costume = mặc quốc phục", "e": "Hội chợ văn hóa quốc tế → mỗi người mặc quốc phục của nước mình → national costume (chấp nhận traditional costume)."}, {"t": "type", "n": 37, "q": "The festival celebrates the traditional music and dance of various _____ in the region.", "entry": "minority", "acc": ["ethnic minorities", "minorities"], "hint": "various + N số nhiều · Nói về âm nhạc, điệu múa truyền thống → nghĩa 2 (nhóm người khác biệt về dân tộc).", "full": "The festival celebrates the traditional music and dance of various [[ethnic minorities]] in the region.", "vi": "Lễ hội tôn vinh âm nhạc và điệu múa truyền thống của nhiều dân tộc thiểu số trong vùng.", "f": "various + N (số nhiều); ethnic minority = dân tộc thiểu số", "e": "“traditional music and dance” → các dân tộc → dùng nghĩa 2 → ethnic minorities (chấp nhận minorities)."}, {"t": "type", "n": 38, "q": "The survey showed that only _____ of people prefer working from home full-time.", "entry": "minority", "acc": ["a small minority", "a minority"], "hint": "only + ___ + of + people · “chỉ một PHẦN NHỎ” → nghĩa 1 (ít hơn một nửa).", "full": "The survey showed that only [[a small minority]] of people prefer working from home full-time.", "vi": "Cuộc khảo sát cho thấy chỉ một số ít người thích làm việc tại nhà toàn thời gian.", "f": "only + a (small) minority + of + N = chỉ một số ít", "e": "Khảo sát cho thấy chỉ một số ít người thích làm ở nhà → nghĩa 1. Theo ví dụ “Only a small minority of students…” → a (small) minority."}], "tr1": [{"t": "chips", "n": 1, "org": "It is not a problem to me whether I have to pick her up to the cinema or not.", "pre": "I don't mind", "ans": ["picking", "her", "up", "to", "the", "cinema."], "dis": ["to", "pick"], "hint": "It is not a problem to me … → S + don’t mind + V-ing.", "vi": "Tôi không ngại việc (có phải) đón cô ấy đến rạp chiếu phim (hay không).", "f": "It is not a problem to sb to V → S + don’t mind + V-ing", "e": "“không phải vấn đề” = không phiền → don’t mind; pick → picking."}, {"t": "chips", "n": 2, "org": "John cannot bear listening to such kind of noisy music.", "pre": "John dislikes", "ans": ["listening", "to", "such", "kind", "of", "noisy", "music."], "dis": ["to", "listen"], "hint": "cannot bear + V-ing (không chịu nổi) → dislike + V-ing.", "vi": "John không thích (không chịu nổi) nghe loại nhạc ồn ào như thế.", "f": "S + cannot bear + V-ing → S + dislike(s) + V-ing", "e": "Chủ ngữ John số ít → dislikes; giữ nguyên listening."}, {"t": "chips", "n": 3, "org": "Watching historical films is very interesting to my younger brother.", "pre": "My younger brother enjoys", "ans": ["watching", "historical", "films."], "dis": ["to", "watch"], "hint": "V-ing … is very interesting to sb → sb + enjoy(s) + V-ing.", "vi": "Em trai tôi thích xem phim lịch sử.", "f": "V-ing is interesting to sb → sb + enjoy(s) + V-ing", "e": "Đưa “my younger brother” lên làm chủ ngữ; số ít → enjoys."}, {"t": "chips", "n": 4, "org": "She cannot bear talking with him about what he likes.", "pre": "She hates", "ans": ["talking", "with", "him", "about", "what", "he", "likes."], "dis": ["to", "talk"], "hint": "cannot bear + V-ing → hate + V-ing.", "vi": "Cô ấy ghét nói chuyện với anh ta về những thứ anh ta thích.", "f": "S + cannot bear + V-ing → S + hate(s) + V-ing", "e": "She số ít → hates; giữ nguyên talking."}, {"t": "chips", "n": 5, "org": "The thing that I hate most is motor racing, and I will never do it in my life.", "pre": "I detest", "ans": ["motor", "racing,", "and", "I", "will", "never", "do", "it", "in", "my", "life."], "dis": ["to", "hating"], "hint": "The thing that I hate most is + N → I detest + N / V-ing.", "vi": "Tôi cực kỳ ghét đua xe máy và sẽ không bao giờ làm điều đó trong đời.", "f": "The thing S hate most is + iting; giữ nguyên vế “when we have leisure time”."}, {"t": "chips", "n": 10, "org": "I don't like to get up early and prepare breakfast in the cold winter days.", "pre": "I hate", "ans": ["getting", "up", "early", "and", "preparing", "breakfast", "in", "the", "cold", "winter", "days."], "dis": ["to", "get"], "hint": "don’t like + to V → hate + V-ing (hai động từ nối bằng “and” đều V-ing).", "vi": "Tôi ghét dậy sớm và chuẩn bị bữa sáng vào những ngày đông lạnh giá.", "f": "don’t like to V → hate + V-ing (and + V-ing)", "e": "get up → getting up; prepare → preparing (song song sau and)."}, {"t": "chips", "n": 11, "org": "It took us 30 minutes to rehearse the song.", "pre": "We spent", "ans": ["30", "minutes", "rehearsing", "the", "song."], "dis": ["to", "rehearse"], "hint": "It took sb + time + to V → S + spent + time + V-ing (took là quá khứ → spent).", "vi": "Chúng tôi mất 30 phút để tập bài hát.", "f": "It took sb + time + to V → S + spent + time + V-ing", "e": "us → We (chủ ngữ); took → spent; to rehearse → rehearsing."}, {"t": "chips", "n": 12, "org": "It took Tom one hour to travel to his hometown last week.", "pre": "Tom spent", "ans": ["one", "hour", "travelling", "to", "his", "hometown", "last", "week."], "dis": ["to", "travel"], "hint": "It took sb + time + to V → S + spent + time + V-ing.", "vi": "Tuần trước Tom mất một tiếng để đi về quê.", "f": "It took sb + time + to V → S + spent + time + V-ing", "e": "to travel → travelling (Anh – Anh gấp đôi l; Anh – Mỹ: traveling)."}, {"t": "chips", "n": 13, "org": "It took him 30 minutes to watch the play.", "pre": "He spent", "ans": ["30", "minutes", "watching", "the", "play."], "dis": ["to", "watch"], "hint": "It took sb + time + to V → S + spent + time + V-ing.", "vi": "Anh ấy mất 30 phút để xem vở kịch.", "f": "It took sb + time + to V → S + spent + time + V-ing", "e": "him → He; to watch → watching."}, {"t": "chips", "n": 14, "org": "He likes swimming and sunbathing.", "pre": "He is interested", "ans": ["in", "  2, "hint": "Đuôi -tion → nhấn âm ngay TRƯỚC -tion.", "full": "A. in-vi-TA-tion   B. cel-e-BRA-tion   [[C. tra-DI-tion]]   D. in-for-MA-tion", "vi": "lời mời – lễ kỷ niệm – truyền thống – thông tin", "f": "-tion → nhấn âm liền trước", "e": "tra-DI-tion nhấn âm 2; in-vi-TA-tion, cel-e-BRA-tion, in-for-MA-tion nhấn âm 3."}, {"t": "mc", "kind": "stress", "n": 8, "q": "Chọn từ có trọng âm khác với 3 từ còn lại:", "o": ["custom", "invite", "greeting", "manner"], "marks": ["CUS-tom", "in-VITE", "GREET-ing", "MAN-ner"], "a": 1, "hint": "Danh từ 2 âm tiết → âm 1; động từ 2 âm tiết → âm 2.", "full": "A. CUS-tom   [[B. in-VITE]]   C. GREET-ing   D. MAN-ner", "vi": "phong tục – mời – lời chào – cách cư xử", "f": "động từ 2 âm tiết → âm 2", "e": "in-VITE (động từ) nhấn âm 2; CUS-tom, GREET-ing, MAN-ner nhấn âm 1."}, {"t": "mc", "kind": "stress", "n": 9, "q": "Chọn từ có trọng âm khác với 3 từ còn lại:", "o": ["woman", "detest", "balloon", "police"], "marks": ["WO-man", "de-TEST", "bal-LOON", "po-LICE"], "a": 0, "hint": "Động từ 2 âm tiết → âm 2; đuôi -oon, -ice → nhấn vào chính nó; danh từ 2 âm tiết → âm 1.", "full": "[[A. WO-man]]   B. de-TEST   C. bal-LOON   D. po-LICE", "vi": "phụ nữ – rất ghét – bóng bay – cảnh sát", "f": "danh từ 2 âm tiết → âm 1", "e": "WO-man nhấn âm 1; de-TEST (động từ), bal-LOON (-oon), po-LICE nhấn âm 2."}, {"t": "mc", "kind": "stress", "n": 10, "q": "Chọn từ có trọng âm khác với 3 từ còn lại:", "o": ["refuse", "enter", "deny", "delay"], "marks": ["re-FUSE", "EN-ter", "de-NY", "de-LAY"], "a": 1, "hint": "Động từ 2 âm tiết → âm 2; NGOẠI LỆ: động từ đuôi -er, -en, -ish → âm 1.", "full": "A. re-FUSE   [[B. EN-ter]]   C. de-NY   D. de-LAY", "vi": "từ chối – đi vào – phủ nhận – trì hoãn", "f": "động từ đuôi -er → âm 1 (ngoại lệ)", "e": "EN-ter nhấn âm 1; re-FUSE, de-NY, de-LAY nhấn âm 2."}], "readA": [{"t": "mc", "kind": "cloze", "passage": "A", "n": 1, "q": "First, there is not enough land to _____ crops or raise livestock.", "o": ["collect", "grow", "feed", "upload"], "a": 1, "hint": "___ crops or raise livestock · Collocation: TRỒNG trọt / chăn nuôi.", "full": "First, there is not enough land to [[grow]] crops or raise livestock.", "vi": "Trước hết, không có đủ đất để trồng trọt hay chăn nuôi gia súc.", "f": "grow crops = trồng trọt; raise livestock = chăn nuôi", "e": "Không đủ đất để trồng trọt → grow crops. collect = thu gom, feed = cho ăn, upload = tải lên."}, {"t": "mc", "kind": "cloze", "passage": "A", "n": 2, "q": "Building houses is also difficult _____ the land is not flat.", "o": ["because", "when", "so", "although"], "a": 0, "hint": "Liên từ + S + V · Vế sau “the land is not flat” là LÝ DO khiến xây nhà khó.", "full": "Building houses is also difficult [[because]] the land is not flat.", "vi": "Việc xây nhà cũng khó khăn vì đất không bằng phẳng.", "f": "because + S + V = bởi vì (chỉ lý do)", "e": "Xây nhà khó VÌ đất không bằng phẳng → because. when = khi, so = vì vậy (kết quả), although = mặc dù."}, {"t": "mc", "kind": "cloze", "passage": "A", "n": 3, "q": "_____ these challenges, people around the world have lived and worked in mountainous areas for centuries.", "o": ["Although", "But", "Despite", "Because"], "a": 2, "hint": "___ + cụm danh từ (these challenges), … · Liên từ nhượng bộ đi với DANH TỪ.", "full": "[[Despite]] these challenges, people around the world have lived and worked in mountainous areas for centuries.", "vi": "Bất chấp những thử thách này, con người khắp thế giới đã sống và làm việc ở vùng núi hàng thế kỷ.", "f": "Despite + N / V-ing, S + V = Mặc dù…", "e": "Sau chỗ trống là cụm danh từ “these challenges” → Despite. Although / Because + mệnh đề (S + V); But không đứng đầu câu kiểu này."}, {"t": "mc", "kind": "cloze", "passage": "A", "n": 4, "q": "There are _____ health benefits of living in the mountains.", "o": ["a lot", "many", "a little", "a few"], "a": 1, "hint": "There are + ___ + N số nhiều (benefits) · Ý nghĩa: NHIỀU lợi ích.", "full": "There are [[many]] health benefits of living in the mountains.", "vi": "Sống ở vùng núi có nhiều lợi ích cho sức khỏe.", "f": "many + N đếm được số nhiều", "e": "benefits là danh từ số nhiều, đoạn sau liệt kê nhiều lợi ích → many. a lot phải có “of”; a little + N không đếm được; a few = một vài (ít)."}, {"t": "mc", "kind": "cloze", "passage": "A", "n": 5, "q": "There are places where you cannot drive a car or a motorbike, so you _____ walk.", "o": ["cannot", "should", "mustn't", "have to"], "a": 3, "hint": "___ + V · Không thể lái xe nên BẮT BUỘC phải đi bộ (do hoàn cảnh).", "full": "There are places where you cannot drive a car or a motorbike, so you [[have to]] walk.", "vi": "Có những nơi bạn không thể đi ô tô hay xe máy, vì vậy bạn phải đi bộ.", "f": "have to + V = phải (bắt buộc do hoàn cảnh)", "e": "Không đi xe được → phải đi bộ → have to walk. cannot = không thể, should = nên, mustn’t = cấm."}, {"t": "mc", "kind": "cloze", "passage": "A", "n": 6, "q": "Finally, mountain people are quite simple and _____.", "o": ["friend", "unfriend", "friendly", "unfriendly"], "a": 2, "hint": "simple and + ___ · “and” nối hai TÍNH TỪ cùng loại, nghĩa tích cực.", "full": "Finally, mountain people are quite simple and [[friendly]].", "vi": "Cuối cùng, người miền núi khá giản dị và thân thiện.", "f": "adj and adj; friendly = thân thiện (tính từ đuôi -ly)", "e": "“simple” là tính từ → chỗ trống là tính từ, mang nghĩa tốt → friendly. friend là danh từ; unfriendly trái nghĩa với “peaceful life”."}], "readB": [{"t": "mc", "kind": "cloze", "passage": "B", "n": 1, "q": "…who love finding out the culture of ethnic _____ groups like the Tay, the Hmong, etc.", "o": ["village", "minority", "country", "highland"], "a": 1, "hint": "ethnic ___ groups · Collocation: dân tộc THIỂU SỐ (Tày, H’Mông…).", "full": "…who love finding out the culture of ethnic [[minority]] groups like the Tay, the Hmong, etc.", "vi": "…những người thích tìm hiểu văn hóa của các nhóm dân tộc thiểu số như Tày, H'Mông…", "f": "ethnic minority groups = các nhóm dân tộc thiểu số", "e": "Tày, H’Mông là dân tộc thiểu số → ethnic minority groups."}, {"t": "mc", "kind": "cloze", "passage": "B", "n": 2, "q": "…due to the inconvenience of long _____ between neighbouring communities.", "o": ["direction", "roads", "ways", "distances"], "a": 3, "hint": "long ___ between communities · KHOẢNG CÁCH xa giữa các cộng đồng.", "full": "…due to the inconvenience of long [[distances]] between neighbouring communities.", "vi": "…do sự bất tiện vì khoảng cách xa giữa các cộng đồng lân cận.", "f": "long distances between A and B = khoảng cách xa", "e": "Chợ họp một lần một tuần vì khoảng cách xa → long distances. direction = hướng; roads, ways không đi với “long … between communities”."}, {"t": "mc", "kind": "cloze", "passage": "B", "n": 3, "q": "Hence, on the market days, these places are quite bustling _____ trade activities.", "o": ["with", "of", "about", "at"], "a": 0, "hint": "be bustling ___ + N · Giới từ đi sau “bustling”.", "full": "Hence, on the market days, these places are quite bustling [[with]] trade activities.", "vi": "Vì thế, vào ngày họp chợ, những nơi này khá nhộn nhịp với các hoạt động buôn bán.", "f": "be bustling with + N = nhộn nhịp với", "e": "Nhộn nhịp với hoạt động buôn bán → bustling with trade activities."}, {"t": "mc", "kind": "cloze", "passage": "B", "n": 4, "q": "It's also a special occasion for the ethnic people to _____ dressed in nice colourful clothes…", "o": ["wash", "wear", "get", "put on"], "a": 2, "hint": "___ dressed in + quần áo · Cụm cố định nghĩa MẶC ĐỒ.", "full": "It's also a special occasion for the ethnic people to [[get]] dressed in nice colourful clothes…", "vi": "Đây cũng là dịp đặc biệt để người dân tộc mặc những bộ quần áo sặc sỡ, đẹp đẽ…", "f": "get dressed in + clothes = mặc quần áo", "e": "Cụm cố định: get dressed in. wear / put on + quần áo trực tiếp (wear clothes), không đi với “dressed”; wash = giặt."}, {"t": "mc", "kind": "cloze", "passage": "B", "n": 5, "q": "What's more, _____ exciting cultural events also happen at the fairs…", "o": ["a lot", "many", "much", "a little"], "a": 1, "hint": "___ + adj + N số nhiều (events) · Từ chỉ số lượng NHIỀU.", "full": "What's more, [[many]] exciting cultural events also happen at the fairs…", "vi": "Hơn nữa, nhiều sự kiện văn hóa thú vị cũng diễn ra tại các phiên chợ…", "f": "many + N đếm được số nhiều", "e": "events là danh từ số nhiều → many. much / a little + N không đếm được; a lot thiếu “of”."}, {"t": "mc", "kind": "cloze", "passage": "B", "n": 6, "q": "…to serve the locals _____ tourists.", "o": ["and", "but", "so", "nor"], "a": 0, "hint": "the locals ___ tourists · Nối hai danh từ, THÊM ý (người dân và du khách).", "full": "…to serve the locals [[and]] tourists.", "vi": "…để phục vụ người dân địa phương và du khách.", "f": "N and N = … và …", "e": "Phục vụ cả người dân địa phương và du khách → and. but = nhưng (đối lập), so = vì vậy, nor đi với neither."}], "readC": [{"t": "mc", "kind": "tf", "passage": "C", "n": 1, "q": "Ha Long Bay is located in Quang Ninh Province, in the northeast of Viet Nam.", "o": ["True", "False"], "a": 0, "hint": "Tìm “Quang Ninh province, in the northeast” trong câu đầu đoạn 1.", "full": "Ha Long Bay is located in Quang Ninh Province, in the northeast of Viet Nam. → [[True]]", "vi": "Vịnh Hạ Long nằm ở tỉnh Quảng Ninh, phía đông bắc Việt Nam.", "f": "So khớp chi tiết: nơi chốn", "e": "Bài viết: “Ha Long Bay … in Quang Ninh province, in the northeast of Viet Nam” → đúng."}, {"t": "mc", "kind": "tf", "passage": "C", "n": 2, "q": "Cua Van is the only ancient floating fishing village that remains in Ha Long Bay.", "o": ["True", "False"], "a": 0, "hint": "Tìm từ “only … remains” ở đoạn 1.", "full": "Cua Van is the only ancient floating fishing village that remains in Ha Long Bay. → [[True]]", "vi": "Cửa Vạn là làng chài nổi cổ duy nhất còn lại ở vịnh Hạ Long.", "f": "only … remains = chỉ còn lại", "e": "Bài viết: “only Cua Van floating village remains” → Cửa Vạn là làng chài nổi cổ duy nhất còn lại → đúng."}, {"t": "mc", "kind": "tf", "passage": "C", "n": 3, "q": "The villagers usually buy fish from the mainland and sell it to other people.", "o": ["True", "False"], "a": 1, "hint": "Đọc kỹ AI làm gì: dân làng MANG cá đi đổi hay MUA cá?", "full": "The villagers usually buy fish from the mainland and sell it to other people. → [[False]]", "vi": "Dân làng thường mua cá từ đất liền rồi bán cho người khác. (Sai)", "f": "Bẫy hành động: trade their fish ≠ buy fish", "e": "Bài viết: “they sail to the mainland to trade their fish for food…” → dân làng mang cá vào đất liền đổi lấy đồ dùng, không phải mua cá → sai."}, {"t": "mc", "kind": "tf", "passage": "C", "n": 4, "q": "Most children in Cua Van floating village attend floating schools.", "o": ["True", "False"], "a": 0, "hint": "Tìm “Most children go to …” ở đoạn 2.", "full": "Most children in Cua Van floating village attend floating schools. → [[True]]", "vi": "Hầu hết trẻ em ở làng nổi Cửa Vạn học ở trường nổi.", "f": "attend = go to (đồng nghĩa)", "e": "Bài viết: “Most children go to floating schools” → đúng."}, {"t": "mc", "kind": "rq", "passage": "C", "n": 5, "q": "The passage is mainly about:", "o": ["How Ha Long bay became a UNESCO World Heritage.", "The beauty of nature in Ha Long bay.", "The life of people in Cua Van ancient village.", "The geographical features of Ha Long bay."], "a": 2, "hint": "Ý chính: chọn ý BAO QUÁT cả bài, không chọn chi tiết nhỏ.", "full": "The passage is mainly about: [[C. The life of people in Cua Van ancient village.]]", "vi": "Bài đọc chủ yếu nói về: C. Cuộc sống của người dân ở làng cổ Cửa Vạn. (A. Vịnh Hạ Long trở thành di sản UNESCO như thế nào · B. Vẻ đẹp thiên nhiên của vịnh Hạ Long · D. Đặc điểm địa lý của vịnh Hạ Long)", "f": "Ý chính = nội dung xuyên suốt cả bài", "e": "Cả bài nói về cuộc sống người dân làng Cửa Vạn (đánh cá, đi học, bảo vệ vịnh) → C. A, D không được nói tới; B chỉ là chi tiết nhỏ."}, {"t": "mc", "kind": "rq", "passage": "C", "n": 6, "q": giúp mẹ làm việc nhà.", "f": "S + don't / doesn't mind + V-ing", "e": "Sau mind luôn dùng V-ing → helping. “to help”, “help”, “helped” đều sai dạng."}, {"t": "mc", "kind": "struct", "n": 2, "q": "My brother enjoys _____ historical films.", "o": ["watching", "to watch", "watch", "watches"], "a": 0, "hint": "S + enjoy(s) + V-ing", "full": "My brother enjoys [[watching]] historical films.", "vi": "Em trai tôi thích xem phim lịch sử.", "f": "S + enjoy(s) + V-ing", "e": "enjoy + V-ing → watching. Không dùng enjoy + to V."}, {"t": "mc", "kind": "struct", "n": 3, "q": "She cannot bear talking with him. = She _____ talking with him.", "o": ["likes", "hates", "enjoys", "fancies"], "a": 1, "hint": "cannot bear + V-ing = hate / dislike + V-ing", "full": "She [[hates]] talking with him.", "vi": "Cô ấy ghét nói chuyện với anh ta.", "f": "cannot bear + V-ing = hate / dislike + V-ing", "e": "cannot bear = không chịu nổi → nghĩa là ghét → hates. likes, enjoys, fancies đều là THÍCH, ngược nghĩa."}, {"t": "mc", "kind": "struct", "n": 4, "q": "It took us two days _____ Ha Giang.", "o": ["visiting", "to visit", "visit", "visited"], "a": 1, "hint": "It took sb + time + to V", "full": "It took us two days [[to visit]] Ha Giang.", "vi": "Chúng tôi mất hai ngày để tham quan Hà Giang.", "f": "It took sb + time + to V", "e": "Với cấu trúc It took… dùng to V → to visit."}, {"t": "mc", "kind": "struct", "n": 5, "q": "We spent two days _____ Ha Giang.", "o": ["to visit", "visit", "visiting", "visited"], "a": 2, "hint": "S + spent + time + V-ing", "full": "We spent two days [[visiting]] Ha Giang.", "vi": "Chúng tôi dành hai ngày để tham quan Hà Giang.", "f": "S + spent + time + V-ing", "e": "spend + thời gian + V-ing → visiting. Nhớ: It took … to V, nhưng spent … V-ing."}, {"t": "mc", "kind": "struct", "n": 6, "q": "It's very interesting _____ about the culture of ethnic groups.", "o": ["learning", "to learn", "learn", "learned"], "a": 1, "hint": "It's + adj + to V", "full": "It's very interesting [[to learn]] about the culture of ethnic groups.", "vi": "Tìm hiểu văn hóa các dân tộc rất thú vị.", "f": "It's + adj + to V", "e": "Chủ ngữ giả It + tính từ → theo sau là to V → to learn."}, {"t": "mc", "kind": "struct", "n": 7, "q": "Minh is interested _____ learning about the Cham people.", "o": ["on", "at", "in", "with"], "a": 2, "hint": "be interested in + V-ing", "full": "Minh is interested [[in]] learning about the Cham people.", "vi": "Minh thích tìm hiểu về người Chăm.", "f": "be interested in + V-ing", "e": "Giới từ cố định: interested in. (good at, important to là các cụm khác.)"}, {"t": "mc", "kind": "struct", "n": 8, "q": "He fancies _____ with his music teacher about jazz.", "o": ["talk", "talking", "to talk", "talks"], "a": 1, "hint": "S + fancy / fancies + V-ing", "full": "He fancies [[talking]] with his music teacher about jazz.", "vi": "Anh ấy thích nói chuyện với thầy dạy nhạc về nhạc jazz.", "f": "S + fancy / fancies + V-ing", "e": "fancy (thích) + V-ing → talking."}, {"t": "mc", "kind": "struct", "n": 9, "q": "Lan _____ walking to school every day.", "o": ["don't mind", "doesn't mind", "not mind", "isn't mind"], "a": 1, "hint": "S số ít + doesn't mind + V-ing", "full": "Lan [[doesn't mind]] walking to school every day.", "vi": "Lan không ngại đi bộ đến trường mỗi ngày.", "f": "S số ít + doesn't mind + V-ing", "e": "Lan là chủ ngữ số ít → doesn't mind. “don't” dùng cho I / you / we / they; “isn't mind”, “not mind” sai ngữ pháp."}, {"t": "mc", "kind": "struct", "n": 10, "q": "My grandmother _____ two hours a day looking after her chickens.", "o": ["spends", "spend", "takes", "uses"], "a": 0, "hint": "S + spend(s) + time + V-ing", "full": "My grandmother [[spends]] two hours a day looking after her chickens.", "vi": "Bà tôi dành hai tiếng mỗi ngày để chăm sóc đàn gà.", "f": "S + spend(s) + time + V-ing", "e": "Sau chỗ trống là “looking” (V-ing) → spends. My grandmother số ít → thêm s. takes / uses phải đi với to V."}, {"t": "mc", "kind": "struct", "n": 11, "q": "I detest _____ up early on Sundays.", "o": ["get", "got", "to get", "getting"], "a": 3, "hint": "S + detest + V-ing / N", "full": "I detest [[getting]] up early on Sundays.", "vi": "Tôi cực kỳ ghét dậy sớm vào Chủ nhật.", "f": "S + detest + V-ing / N", "e": "detest (rất ghét) + V-ing → getting."}, {"t": "mc", "kind": "struct", "n": 12, "q": "They dislike _____ for the bus in the rain.", "o": ["waiting", "to wait", "wait", "waited"], "a": 0, "hint": "S + dislike + V-ing", "full": "They dislike [[waiting]] for the bus in the rain.", "vi": "Họ không thích chờ xe buýt dưới mưa.", "f": "S + dislike + V-ing", "e": "dislike + V-ing → waiting."}], "trmc2": [{"t": "mc", "kind": "struct2", "n": 1, "q": "Chọn câu gần nghĩa nhất: “It is not a problem to me to stay in a stilt house.”", "o": ["I don't mind staying in a stilt house.", "I don't like staying in a stilt house.", "I mind to stay in a stilt house.", "I have a problem staying in a stilt house."], "a": 0, "hint": "It is not a problem to sb to V → S + don't mind + V-ing", "full": "[[I don't mind staying in a stilt house.]]", "vi": "Tôi không ngại ở nhà sàn.", "f": "It is not a problem to sb to V → S + don't mind + V-ing", "e": "“không phải vấn đề” = không ngại → don't mind + V-ing. B đổi nghĩa (không thích); C sai dạng (mind to stay); D ngược nghĩa."}, {"t": "mc", "kind": "struct2", "n": 2, "q": "Chọn câu gần nghĩa nhất: “Weaving brocade is very interesting to Thai women.”", "o": ["Thai women hate weaving brocade.", "Thai women enjoy weaving brocade.", "Thai women enjoy to weave brocade.", "Weaving brocade is boring to Thai women."], "a": 1, "hint": "V-ing is interesting to sb → sb + enjoy + V-ing", "full": "[[Thai women enjoy weaving brocade.]]", "vi": "Phụ nữ Thái thích dệt thổ cẩm.", "f": "V-ing is interesting to sb → sb + enjoy + V-ing", "e": "“thú vị đối với ai” = ai đó thích → enjoy + V-ing. C sai dạng (enjoy to weave); A, D ngược nghĩa."}, {"t": "mc", "kind": "struct2", "n": 3, "q": "Chọn câu gần  reading books about ethnic minorities in her free time.", "Hoa enjoys to read books about ethnic minorities in her free time.", "Hoa detests reading books about ethnic minorities in her free time.", "Hoa is interested on reading books about ethnic minorities in her free time."], "a": 0, "hint": "S + usually + V → S + enjoy(s) + V-ing", "full": "[[Hoa enjoys reading books about ethnic minorities in her free time.]]", "vi": "Hoa thích đọc sách về các dân tộc thiểu số lúc rảnh.", "f": "S + usually + V → S + enjoy(s) + V-ing", "e": "Việc thường làm lúc rảnh = việc thích làm → enjoys reading. B sai dạng; C ngược nghĩa; D sai giới từ (interested in)."}, {"t": "mc", "kind": "struct2", "n": 7, "q": "Câu “I detest motor racing.” nghĩa là gì?", "o": ["Tôi rất thích đua xe máy.", "Tôi cực kỳ ghét đua xe máy.", "Tôi không ngại đua xe máy.", "Tôi đang học đua xe máy."], "a": 1, "hint": "detest = rất ghét (mạnh hơn hate)", "full": "I detest motor racing. → [[Tôi cực kỳ ghét đua xe máy.]]", "vi": "Tôi cực kỳ ghét đua xe máy.", "f": "detest = rất ghét (mạnh hơn hate)", "e": "detest mang nghĩa ghét nhất, rất ghét → B."}, {"t": "mc", "kind": "struct2", "n": 8, "q": "Câu “He fancies trying local food in Sa Pa.” nghĩa là gì?", "o": ["Anh ấy ghét thử món ăn địa phương ở Sa Pa.", "Anh ấy thích thử món ăn địa phương ở Sa Pa.", "Anh ấy mất nhiều thời gian nấu món ăn Sa Pa.", "Anh ấy không được thử món ăn ở Sa Pa."], "a": 1, "hint": "fancy + V-ing = thích làm gì", "full": "He fancies trying local food in Sa Pa. → [[Anh ấy thích thử món ăn địa phương ở Sa Pa.]]", "vi": "Anh ấy thích thử món ăn địa phương ở Sa Pa.", "f": "fancy + V-ing = thích làm gì", "e": "fancy = thích, muốn → B."}, {"t": "mc", "kind": "struct2", "n": 9, "q": "Câu “My mother spent an hour cooking dinner.” nghĩa là gì?", "o": ["Mẹ tôi mất một tiếng để nấu bữa tối.", "Mẹ tôi ghét nấu bữa tối.", "Mẹ tôi nấu bữa tối mỗi giờ.", "Mẹ tôi không ngại nấu bữa tối."], "a": 0, "hint": "spend + time + V-ing = dành / mất bao lâu để làm gì", "full": "My mother spent an hour cooking dinner. → [[Mẹ tôi mất một tiếng để nấu bữa tối.]]", "vi": "Mẹ tôi mất một tiếng để nấu bữa tối.", "f": "spend + time + V-ing = dành / mất bao lâu để làm gì", "e": "spent an hour cooking = mất một tiếng để nấu → A."}, {"t": "mc", "kind": "struct2", "n": 10, "q": "Cấu trúc nào có nghĩa “KHÔNG NGẠI làm gì”?", "o": ["S + don't mind + V-ing", "S + dislike + V-ing", "S + detest + V-ing", "S + be interested in + V-ing"], "a": 0, "hint": "don't mind + V-ing = không ngại / không phiền", "full": "[[S + don't mind + V-ing]] = không ngại làm gì", "vi": "không ngại làm gì", "f": "don't mind + V-ing = không ngại / không phiền", "e": "dislike = không thích; detest = rất ghét; be interested in = thích, quan tâm → chỉ don't mind là “không ngại”."}, {"t": "mc", "kind": "struct2", "n": 11, "q": "Cấu trúc nào dùng để nói “MẤT bao nhiêu thời gian để làm gì”?", "o": ["It took sb + time + to V", "S + fancy + V-ing", "It's + adj + to V", "S + don't mind + V-ing"], "a": 0, "hint": "It took sb + time + to V = S + spent + time + V-ing", "full": "[[It took sb + time + to V]] = S + spent + time + V-ing", "vi": "Ai đó mất bao lâu để làm gì", "f": "It took sb + time + to V = S + spent + time + V-ing", "e": "Hai cấu trúc chỉ thời gian: It took… to V và spent… V-ing. Các cấu trúc khác nói về sở thích hoặc nhận xét."}, {"t": "mc", "kind": "struct2", "n": 12, "q": "Câu nào ĐÚNG ngữ pháp?", "o": ["My parents are interested in visit ethnic villages.", "My parents are interested in visiting ethnic villages.", "My parents are interesting in visiting ethnic villages.", "My parents interested in visiting ethnic villages."], "a": 1, "hint": "S + am / is / are + interested in + V-ing", "full": "[[My parents are interested in visiting ethnic villages.]]", "vi": "Bố mẹ tôi thích đi thăm các bản làng dân tộc.", "f": "S + am / is / are + interested in + V-ing", "e": "Người cảm thấy thích → interested (không phải interesting). Sau in dùng V-ing. D thiếu “are”; A sai “visit”."}]}, "phr": {"wh": [{"en": "<b>When<\/b> do you usually eat lunch? – At noon.", "vi": "Bạn thường ăn trưa lúc nào? – Lúc giữa trưa.", "note": "When = khi nào"}, {"en": "<b>How often<\/b> do you wash clothes? – Every week.", "vi": "Bạn giặt quần áo bao lâu một lần? – Mỗi tuần.", "note": "every week → How often"}, {"en": "<b>Where<\/b> does your father work? – At City Hall.", "vi": "Bố bạn làm việc ở đâu? – Ở tòa thị chính.", "note": "Where = ở đâu"}, {"en": "<b>Who<\/b> usually gets up the earliest in your family?", "vi": "Ai thường dậy sớm nhất trong nhà bạn?", "note": "Who + V(s/es), không có does"}, {"en": "<b>What<\/b> do you think of this hotel?", "vi": "Bạn nghĩ gì về khách sạn này?", "note": "hỏi ý kiến"}, {"en": "<b>Why<\/b> do you work at that company? – Because it's near my house.", "vi": "Tại sao bạn làm ở công ty đó? – Vì nó gần nhà tôi.", "note": "Why – Because"}, {"en": "<b>Who<\/b> dances the best in your family?", "vi": "Ai nhảy giỏi nhất trong nhà bạn?", "note": "Who + V(s/es)"}, {"en": "<b>How far<\/b> is it from the centre to the Museum? – About seven kilometres.", "vi": "Từ trung tâm đến bảo tàng bao xa? – Khoảng bảy cây số.", "note": "kilometres → How far"}, {"en": "<b>Where<\/b> can I buy some milk? – At the supermarket.", "vi": "Tôi có thể mua sữa ở đâu? – Ở siêu thị.", "note": "at the supermarket → Where"}, {"en": "<b>How much<\/b> do you weigh?", "vi": "Bạn nặng bao nhiêu (cân)?", "note": "How much + weigh"}, {"en": "<b>Whose<\/b> hat is this? – It's my brother's.", "vi": "Cái mũ này của ai? – Của anh trai tôi.", "note": "Whose + danh từ"}, {"en": "<b>How<\/b> do you like your tea? – With cream and sugar.", "vi": "Bạn thích uống trà như thế nào? – Có kem và đường.", "note": "How do you like…?"}, {"en": "<b>Which<\/b> picture do you prefer, this one or that one?", "vi": "Bạn thích bức tranh nào hơn, bức này hay bức kia?", "note": "có sẵn các lựa chọn"}, {"en": "<b>Who<\/b> is that woman? – She is a teacher.", "vi": "Người phụ nữ kia far from pollution. The air you breathe is fresher. There are places where you cannot drive a car or a motorbike, so you (5)______ walk. Travelling up and down hills and mountains on foot helps keep you active. Finally, mountain people are quite simple and (6)______. They live a peaceful life."], "B": ["Hill tribal markets are a distinctive feature in northern mountainous provinces in Viet Nam. Every year, these unique markets attract millions of holidaymakers who love finding out the culture of ethnic (1)______ groups like the Tay, the Hmong, etc. Most flea markets take place once a week, from early morning till noon due to the inconvenience of long (2)______ between neighbouring communities. Hence, on the market days, these places are quite bustling (3)______ trade activities. Visitors can watch and buy a lot of local specialties including corn wine, soy bean as well as five-colour sticky rice. It's also a special occasion for the ethnic people to (4)______ dressed in nice colourful clothes woven by skilled women, which motivates tourists to purchase brocatelle products for their own use. What's more, (5)______ exciting cultural events also happen at the fairs to serve the locals (6)______ tourists."], "C": ["There is an ethnic group living in Ha Long Bay which is a UNESCO World Heritage site in Quang Ninh province, in the northeast of Viet Nam. It has got over 1,600 islands and islets. Among the many ancient fishing villages in Ha Long Bay, only Cua Van floating village remains. All the houses and buildings in the village float on huge wooden rafts.", "The villagers spend their days fishing and looking after the sea life. Then they sail to the mainland to trade their fish for things like food, drinking water or clothes. Most children go to floating schools and then spend the rest of their time learning important skills like swimming and fishing. They also help out their parents as much as they can. Their lifestyle may seem strange to many people, but it's so wonderful to live among such natural beauty and know you are protecting it. The villagers are able to help preserve their beautiful bay because they live directly on the water."], "D": ["Ethnic Groups in Vietnam", "Vietnam is a multi-ethnic country with 54 ethnic groups. The Viet (Kinh) people account for 87% of the country's population and mainly inhabit the Red River Delta, the central coastal delta, the Mekong Delta, and major cities. The other 53 ethnic minority groups, totaling over 8 million people, are scattered over mountain areas spreading from the North to the South.", "Among ethnic minorities, the most populated are Tay, Thai, Muong, Hoa, Khmer, and Nung, with a population of around 1 million each. Meanwhile, the least populated are Brau, Roman, and Odu, with several hundred people each.", "The main economic activity of most ethnic peoples is wet rice cultivation. Some ethnic minorities have mastered farming techniques, growing rice plants in flooded paddy fields and carrying out irrigation. Others go hunting, fishing, collecting, and live a semi-nomadic life. Each group has its own diverse and special culture. Beliefs and religions among Vietnamese ethnic minority groups are also different from one another."]}, "passVi": {"A": "Sống ở vùng núi có thể rất vất vả. Trước hết, không có đủ đất để trồng trọt hay chăn nuôi gia súc. Việc xây nhà cũng khó khăn vì đất không bằng phẳng. Không khí ở vùng núi là một vấn đề khác. Càng lên cao, không khí càng loãng. Điều này có nghĩa là có ít ô-xi hơn, khiến việc thở khó khăn hơn. Bất chấp những thử thách này, con người khắp thế giới đã sống và làm việc ở vùng núi hàng thế kỷ. Sống ở vùng núi có nhiều lợi ích cho sức khỏe. Sống trên đỉnh núi giúp bạn tránh xa ô nhiễm. Không khí bạn hít thở trong lành hơn. Có những nơi bạn không thể đi ô tô hay xe máy, vì vậy bạn phải đi bộ. Việc đi bộ lên xuống đồi núi giúp bạn luôn năng động. Cuối cùng, người miền núi khá giản dị và thân thiện. Họ sống một cuộc sống yên bình.", "B": "Chợ phiên vùng cao là một nét đặc trưng ở các tỉnh miền núi phía Bắc Việt Nam. Hằng năm, những phiên chợ độc đáo này thu hút hàng triệu du khách yêu thích tìm hiểu văn hóa của các nhóm dân tộc thiểu số như Tày, H'Mông… Hầu hết các phiên chợ họp mỗi tuần một lần, từ sáng sớm đến trưa, do sự bất tiện vì khoảng cách xa giữa các cộng đồng lân cận. Vì thế, vào ngày họp chợ, những nơi này khá nhộn nhịp với các hoạt động buôn bán. Du khách có thể xem và mua nhiều đặc sản địa phương như rượu ngô, đậu tương và xôi ngũ sắc. Đây cũng là dịp đặc biệt để người dân tộc mặc những bộ quần áo sặc sỡ do những người phụ nữ khéo tay dệt, điều này khuyến khích du khách mua các sản phẩm thổ cẩm để sử dụng. Hơn nữa, nhiều sự kiện văn hóa thú vị cũng diễn ra tại các phiên chợ để phục vụ người dân địa phương và du khách.", "C": "Có một cộng đồng sinh sống ở vịnh Hạ Long – di sản thế giới được UNESCO công nhận, thuộc tỉnh Quảng Ninh, phía đông bắc Việt Nam. Vịnh có hơn 1.600 hòn đảo lớn nhỏ. Trong số nhiều làng chài cổ ở vịnh Hạ Long, chỉ còn lại làng nổi Cửa Vạn. Tất cả nhà cửa và công trình trong làng đều nổi trên những chiếc bè gỗ lớn.\nDân làng dành cả ngày để đánh cá và chăm sóc sinh vật biển. Sau đó họ (they) chèo thuyền vào đất liền để đổi cá lấy những thứ như thức ăn, nước uống hay quần áo. Hầu hết trẻ em học ở trường nổi, thời gian còn lại các em học những kỹ năng quan trọng như bơi lội và đánh cá. Các em cũng giúp đỡ cha mẹ nhiều nhất có thể. Lối sống của họ có vẻ lạ lẫm với nhiều người, nhưng thật tuyệt vời khi được sống giữa vẻ đẹp thiên nhiên như vậy và biết rằng mình đang bảo vệ nó. Dân làng có thể góp phần gìn giữ vịnh biển xinh đẹp vì họ sống ngay trên mặt nước.", "D": "Việt Nam là một quốc gia đa dân tộc với 54 dân tộc. Người Việt (Kinh) chiếm 87% dân số cả nước, sống chủ yếu ở đồng bằng sông Hồng, đồng bằng ven biển miền Trung, đồng bằng sông Cửu Long và các thành phố lớn. 53 dân tộc thiểu số còn lại, tổng cộng hơn 8 triệu người, sống rải rác ở các vùng núi trải dài từ Bắc vào let AC = null;
function tone(ok) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, AC.currentTime + i * 0.11);
      g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.06, AC.currentTime + i * 0.11 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + i * 0.11 + 0.16);
      o.connect(g).connect(AC.destination); o.start(AC.currentTime + i * 0.11); o.stop(AC.currentTime + i * 0.11 + 0.18);
    });
  } catch (e) {}
}
const canSpeak = 'speechSynthesis' in window;
let VOICE = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
if (canSpeak) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
function speak(text, auto) {
  if (!canSpeak || !text) return;
  if (auto && S.autoRead === false) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/_+/g, ' blank '));
    u.lang = 'en-GB'; u.rate = 0.9;
    if (!VOICE) pickVoice();
    if (VOICE) { u.voice = VOICE; u.lang = VOICE.lang; }
    speechSynthesis.speak(u);
  } catch (e) {}
}
