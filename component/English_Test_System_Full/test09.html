<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
:root{ --accent:#4f46e5; --accent2:#0891b2; }
* { box-sizing: border-box; }
body { font-family:'Nunito',sans-serif; background:#f5f3ff; margin:0; }
.font-baloo{ font-family:'Baloo 2','Nunito',sans-serif; }

.hero-gradient{ background: linear-gradient(135deg, #312e81 0%, #6d28d9 55%, #db2777 100%); }

/* ---------- Buttons ---------- */
.primary-btn, .secondary-btn, .success-btn, .danger-btn, .ghost-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:0.92rem;
  padding:11px 22px; border-radius:999px; border:none; cursor:pointer;
  text-decoration:none; transition: transform .15s ease, filter .15s ease, opacity .15s ease;
  user-select:none;
}
.primary-btn:active,.secondary-btn:active,.success-btn:active,.danger-btn:active,.ghost-btn:active{ transform: translateY(1px) scale(0.98); }
.primary-btn:disabled,.secondary-btn:disabled,.success-btn:disabled,.danger-btn:disabled,.ghost-btn:disabled{ opacity:0.4; cursor:not-allowed; }
.primary-btn{ background: linear-gradient(135deg,#4f46e5,#a21caf); color:#fff; box-shadow:0 6px 16px rgba(79,70,229,.35); }
.primary-btn:hover:not(:disabled){ filter:brightness(1.07); transform: translateY(-2px); }
.secondary-btn{ background:#fff; color:#4338ca; border:2px solid #c7d2fe; }
.secondary-btn:hover:not(:disabled){ background:#eef2ff; transform: translateY(-2px); }
.success-btn{ background: linear-gradient(135deg,#059669,#34d399); color:#fff; box-shadow:0 6px 16px rgba(5,150,105,.3); }
.success-btn:hover:not(:disabled){ filter:brightness(1.06); transform: translateY(-2px); }
.danger-btn{ background: linear-gradient(135deg,#e11d48,#fb7185); color:#fff; box-shadow:0 6px 16px rgba(225,29,72,.3); }
.ghost-btn{ background:transparent; color:#4338ca; border:2px dashed #c7d2fe; }
.ghost-btn:hover:not(:disabled){ background:#eef2ff; }

/* ---------- Cards ---------- */
.task-card{ transition: box-shadow .2s, transform .2s; border:1px solid #e9e5ff; }
.task-card:hover{ box-shadow:0 10px 30px rgba(79,70,229,.10); }

/* ---------- Stat boxes ---------- */
.stat-box{ text-align:center; padding:14px 8px; border-radius:14px; background:#eef2ff; }
.stat-box .num{ font-family:'Baloo 2','Nunito',sans-serif; font-size:1.5rem; font-weight:800; color:#3730a3; }
.stat-box .label{ font-size:0.78rem; color:#6b7280; font-weight:700; margin-top:2px; }

/* ---------- Chips ---------- */
.chip-purple, .chip-green, .chip-orange, .chip-red, .chip-blue{
  display:inline-flex; align-items:center; gap:6px; padding:5px 13px; border-radius:999px;
  font-weight:800; font-size:0.8rem; font-family:'Baloo 2','Nunito',sans-serif;
}
.chip-purple{ background:#eef0ff; color:#4338ca; }
.chip-green{ background:#dcfce7; color:#15803d; }
.chip-orange{ background:#fff3d6; color:#9a5b00; }
.chip-red{ background:#ffe4e6; color:#be123c; }
.chip-blue{ background:#dbeafe; color:#1d4ed8; }

/* ---------- Options / inputs ---------- */
.option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; background:#fff; }
.option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
.option-label.selected{ border-color:#4338ca; background:#eef2ff; box-shadow:0 3px 10px rgba(79,70,229,.15); }
.option-label .opt-letter{ flex-shrink:0; width:28px; height:28px; border-radius:50%; background:#e2e8f0; color:#64748b; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.85rem; }
.option-label.selected .opt-letter{ background:#4338ca; color:#fff; }
.option-label.correct-opt, .option-label.correct{ border-color:#22c55e !important; background:#f0fdf4 !important; }
.option-label.correct-opt .opt-letter, .option-label.correct .opt-letter{ background:#22c55e; color:#fff; }
.option-label.wrong-opt, .option-label.incorrect{ border-color:#ef4444 !important; background:#fef2f2 !important; }
.option-label.wrong-opt .opt-letter, .option-label.incorrect .opt-letter{ background:#ef4444; color:#fff; }

input.answer-input, textarea.answer-input, input[type="text"].answer-input{
  border:2px solid #cbd5e1; outline:none; transition:border .18s; background:#fff; font-family:inherit;
}
input.answer-input:focus, textarea.answer-input:focus{ border-color:var(--accent); }
input.correct-input, .answer-input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
input.incorrect-input, .answer-input.incorrect-input{ border-color:#ef4444 !important; background:#fef2f2; }

.blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:2px 8px; display:inline-block; }
.wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.6rem .85rem; font-size:.78rem; color:#9a3412; line-height:1.6; width:100%; margin-top:8px; }

.dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.92rem; color:#334155; }
.passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.92rem; color:#334155; }

/* ---------- Timer ---------- */
.timer-chip{ font-family:'Baloo 2','Nunito',sans-serif; font-weight:800; font-size:0.95rem; padding:7px 16px; border-radius:999px; background:#fff; border:2px solid #c7d2fe; color:#4338ca; display:flex; align-items:center; gap:7px; }
.timer-chip.low-time{ border-color:#ef4444; color:#dc2626; animation: pulseTimer 1s infinite; }
@keyframes pulseTimer{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }

/* ---------- Question nav grid ---------- */
.qnav-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap:7px; }
.qnav-btn{ aspect-ratio:1/1; border-radius:9px; border:2px solid #e2e8f0; background:#fff; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.8rem; transition: all .15s ease; color:#94a3b8; position:relative; }
.qnav-btn.answered{ background:#f0fdf4; border-color:#22c55e; color:#15803d; }
.qnav-btn.current{ background:#4338ca; border-color:#4338ca; color:#fff; transform:scale(1.08); }
.qnav-btn.marked::after{ content:"★"; position:absolute; top:-6px; right:-4px; font-size:0.7rem; color:#f59e0b; }

/* ---------- Status pills ---------- */
.status-pill{ font-weight:800; padding:4px 12px; border-radius:999px; font-size:0.82rem; display:inline-flex; align-items:center; gap:5px; }
.status-correct{ background:#dcfce7; color:#15803d; }
.status-incorrect{ background:#ffe4e6; color:#be123c; }
.status-unanswered{ background:#fff3d6; color:#9a5b00; }

/* ---------- Explanation box ---------- */
.explanation-box{ display:none; margin-top:10px; padding:12px 15px; border-radius:12px; background:#eff6ff; border-left:4px solid #3b82f6; font-size:0.88rem; color:#1e40af; animation: fadeSlide .3s ease forwards; }
.explanation-box.show{ display:block; }
@keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
.explanation-box b{ color:#1d4ed8; }

/* ---------- Speak button ---------- */
.speak-btn{ cursor:pointer; width:26px; height:26px; border-radius:50%; background:#eef2ff; color:#4338ca; display:inline-flex; align-items:center; justify-content:center; border:none; transition: all .15s; flex-shrink:0; }
.speak-btn:hover{ background:#e0e7ff; transform:scale(1.1); }
.speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; background:#c7d2fe; }
@keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }

/* ---------- Score circle / badge ---------- */
.score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
@keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
.score-circle{ width:170px; height:170px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; position:relative; background:conic-gradient(#10b981 calc(var(--pct,0)*1%), #eef0ff 0); }
.score-circle::before{ content:""; position:absolute; inset:11px; background:#fff; border-radius:50%; }
.score-circle .score-inner{ position:relative; text-align:center; }
.score-circle .score-num{ font-family:'Baloo 2','Nunito',sans-serif; font-size:1.7rem; font-weight:800; color:#312e81; }
.score-circle .score-pct{ font-size:0.9rem; color:#6b7280; font-weight:700; }

/* ---------- Confetti ---------- */
.confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
.confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
@keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }

.progress-bar-fill{ transition: width .5s ease; }
@keyframes fadeInUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
.fade-in{ animation: fadeInUp .35s ease; }

/* ---------- Vocabulary cards ---------- */
.vocab-card{ background:#fff; border-radius:18px; border:1px solid #e9e5ff; box-shadow:0 4px 16px rgba(79,70,229,.08); padding:18px; position:relative; overflow:hidden; }

      explanation: "Từ điển cho ví dụ \"The town is famous for its <b>picturesque streets</b> lined with colorful flowers.\" — khớp với việc du khách chụp ảnh ở khu phố cổ."
    },
    { id: 36, section: "VI", type: "fillblank", passage: "picturesqueEntry",
      prompt: "We spent our weekend in a ____________________ surrounded by green hills and fresh air.",
      accepted: ["picturesque village", "picturesque cottage"], correct: "picturesque village / picturesque cottage",
      explanation: "Từ điển cho ví dụ \"The guide showed us a <b>picturesque village</b> nestled in the valley.\" hoặc \"They stayed in a <b>picturesque cottage</b> by the lake...\" — cả hai đều phù hợp với ngữ cảnh \"surrounded by green hills\"."
    },

    // ---------------- SECTION VII (37-40) — sentence rewriting ----------------
    { id: 37, section: "VII", type: "rewrite",
      prompt: "Nam is a more attractive story teller than Mai.",
      starter: "Nam tells stories",
      accepted: ["nam tells stories more attractively than mai"],
      correct: "Nam tells stories more attractively than Mai.",
      explanation: "Tính từ so sánh hơn \"more attractive\" (adj) chuyển thành trạng từ so sánh hơn \"<b>more attractively</b>\" (adv) để bổ nghĩa cho động từ \"tells\".<br>→ <i>Nam tells stories more attractively than Mai.</i>"
    },
    { id: 38, section: "VII", type: "rewrite",
      prompt: "Ronaldo plays better than anybody in the team.",
      starter: "No one",
      accepted: [
        "no one in the team plays better than ronaldo",
        "no one in the team plays as well as ronaldo"
      ],
      correct: "No one in the team plays better than Ronaldo. / No one in the team plays as well as Ronaldo.",
      explanation: "\"X plays better than anybody\" (X chơi hay hơn bất kỳ ai) có thể chuyển thành \"<b>No one plays better than X</b>\" (Không ai chơi hay hơn X) — cùng khẳng định X giỏi nhất.<br>→ <i>No one in the team plays better than Ronaldo.</i>"
    },
    { id: 39, section: "VII", type: "rewrite",
      prompt: "Life in the city is more crowded than life in the countryside.",
      starter: "Life in the countryside isn't",
      accepted: ["life in the countryside isn't as crowded as life in the city"],
      correct: "Life in the countryside isn't as crowded as life in the city.",
      explanation: "So sánh hơn \"more crowded than\" chuyển thành so sánh bằng phủ định \"<b>isn't as crowded as</b>\" — cùng diễn tả thành phố đông đúc hơn nông thôn.<br>→ <i>Life in the countryside isn't as crowded as life in the city.</i>"
    },
    { id: 40, section: "VII", type: "rewrite",
      prompt: "Children often ride bicycles through the fields in their free time.",
      starter: "Children often spend",
      accepted: ["children often spend their free time riding bicycles through the fields"],
      correct: "Children often spend their free time riding bicycles through the fields.",
      explanation: "\"ride bicycles ... in their free time\" chuyển thành \"<b>spend + time + V-ing</b>\" (dành thời gian làm gì).<br>→ <i>Children often spend their free time riding bicycles through the fields.</i>"
    }
  ]
};

</script>
<script>
/* ============================================================
   TEST ENGINE v2 — Tailwind-styled, data-driven test runner.
   Reads a global `TEST` object (see testXX-data.js) and renders:
   start screen -> question flow -> scoring -> answer review.
   Core state/grading logic is unchanged from the v1 engine —
   only the rendered markup/classes changed to the Tailwind-based
   design system (task-card / option-label / dict-box / passage-box
   / speak-btn / confetti / score-badge) matching the sample file.
   ============================================================ */
(function(){
  "use strict";

  const app = document.getElementById("app");
  const LS_KEY = "ets_mistakes_" + TEST.id;
  const LS_RESULT_KEY = "ets_result_" + TEST.id;

  let state = {
    started: false,
    submitted: false,
    current: 0,
    answers: {},
    flagged: new Set(),
    timeLeft: TEST.duration * 60,
    timerId: null
  };

  // ---------------------------------------------------------
  // Helpers (unchanged logic from v1)
  // ---------------------------------------------------------
  function normalize(s){
    if(s === undefined || s === null) return "";
    return s.toString()
      .toLowerCase()
      .replace(/[’‘]/g,"'")
      .replace(/[^\w\s']/g,"")
      .replace(/\s+/g," ")
      .trim();
  }

  function isCorrect(q){
    const ans = state.answers[q.id];
    if(ans === undefined || ans === null || ans === "") return false;
    if(q.type === "mcq" || q.type === "truefalse"){
      return ans === q.correct;
    }
    if(q.type === "fillblank" || q.type === "rewrite"){
      const accepted = (q.accepted || []).map(normalize);
      return accepted.includes(normalize(ans));
    }
    return false;
  }

  function answeredCount(){
    return TEST.questions.filter(q => {
      const a = state.answers[q.id];
      return a !== undefined && a !== null && a.toString().trim() !== "";
    }).length;
  }

  function fmtTime(sec){
    const m = Math.floor(sec/60).toString().padStart(2,"0");
    const s = Math.floor(sec%60).toString().padStart(2,"0");
    return m+":"+s;
  }

  function esc(s){
    return (s===undefined||s===null) ? "" : s.toString().replace(/"/g,"&quot;");
  }

  // ---------------------------------------------------------
  // Text-to-speech (used in Answer Review)
  // ---------------------------------------------------------
  function speak(text, btn){
    try{
      if(!("speechSynthesis" in window)){ alert("Trình duyệt của em không hỗ trợ phát âm. Hãy thử trên Chrome/Edge."); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.9;
      const voices = window.speechSynthesis.getVoices();
      const en = voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
      if(en) u.voice = en;
      if(btn){ btn.classList.add("speaking"); u.onend=()=>btn.classList.remove("speaking"); u.onerror=()=>btn.classList.remove("speaking"); }
      window.speechSynthesis.speak(u);
    }catch(e){ console.warn("TTS not available", e); }
  }
  window.__testSpeak = speak;

  function passageHtml(q){
    if(!q.passage) return "";
    const p = TEST.passages[q.passage];
    if(!p) return "";
    if(typeof p === "object" && p !== null && p.word){
      return `<div class="dict-box mb-4">
        <p class="font-extrabold text-amber-800 mb-1"><i class="fa-solid fa-book-bookmark mr-1"></i>${p.word} <span class="font-normal italic">${p.ipa||""}</span> <span class="font-normal">(${p.pos||""})</span></p>
        <p class="mb-1">✱ ${p.def}</p>
        ${(p.examples||[]).map(e=>`<p class="ml-4 italic text-slate-600">• ${e}</p>`).join("")}
      </div>`;
    }
    let text = p;
    text = text.replace(/\((\d+)\)\s*______/g, (m, n) => {
      const cur = (q.blankNum && parseInt(n) === q.blankNum);
      return `<span class="blank-tag ${cur?'':'opacity-70'}" style="margin:0 2px;">(${n}) ${cur? '?' : '···'}</span>`;
    });
    return `<div class="passage-box mb-4">${text}</div>`;
  }

  function imageHtml(q){
    if(!q.image) return "";
    const src = TEST.images[q.image];
    return `<div class="text-center mb-4"><img src="${src}" alt="sign" class="inline-block max-w-[280px] w-full rounded-2xl shadow-md"/></div>`;
  }

  // ---------------------------------------------------------
  // START SCREEN
  // ---------------------------------------------------------
  function renderStart(){
    app.innerHTML = `
    <header class="hero-gradient text-white py-10 px-4 text-center shadow-xl relative overflow-hidden">
      <div class="absolute inset-0 opacity-10 pointer-events-none">
        <div class="absolute top-4 left-8 text-6xl">📘</div>
        <div class="absolute top-2 right-12 text-5xl">✏️</div>
        <div class="absolute bottom-2 left-1/3 text-4xl">🎯</div>
        <div class="absolute bottom-4 right-1/4 text-5xl">⏱️</div>
      </div>
      <p class="text-sm font-bold uppercase tracking-widest opacity-80 mb-1">${TEST.grade}</p>
      <h1 class="font-baloo text-3xl md:text-5xl font-extrabold drop-shadow-lg">📘 ${TEST.unit}</h1>
      <p class="mt-2 text-base md:text-lg opacity-90 font-bold">${TEST.title}</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 pb-16">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="stat-box"><div class="num">${TEST.questions.length}</div><div class="label">Questions</div></div>
        <div class="stat-box"><div class="num">${TEST.duration}'</div><div class="label">Minutes</div></div>
        <div class="stat-box"><div class="num">${TEST.totalPoints}</div><div class="label">Points</div></div>
        <div class="stat-box"><div class="num">${TEST.sections.length}</div><div class="label">Sections</div></div>
      </div>

      <div class="task-card bg-white rounded-2xl shadow-md p-5 md:p-7">
        <h3 class="text-lg font-extrabold text-indigo-900 mb-2"><i class="fa-solid fa-clipboard-list mr-1 text-amber-500"></i> Instructions</h3>
        <ul class="list-disc pl-5 space-y-1.5 text-slate-700 text-sm md:text-base">
          ${TEST.instructions.map(i=>`<li>${i}</li>`).join("")}
        </ul>

        <h3 class="text-lg font-extrabold text-indigo-900 mt-6 mb-3"><i class="fa-solid fa-layer-group mr-1 text-amber-500"></i> Sections</h3>
        <div class="space-y-2">
          ${TEST.sections.map(s=>`
            <div class="flex justify-between items-center px-3.5 py-2.5 bg-indigo-50 rounded-xl text-sm">
              <span class="font-semibold text-slate-700"><b>${s.id}.</b> ${s.title}</span>
              <span class="chip-green">${s.points}</span>
            </div>`).join("")}
        </div>

        <div class="text-center mt-8">
          <button id="startBtn" class="bg-gradient-to-r from-indigo-700 to-fuchsia-600 text-white font-extrabold text-lg px-10 py-4 rounded-full shadow-lg hover:scale-105 active:scale-95 transition">🚀 START TEST</button>
        </div>
      </div>

      <div class="text-center mt-6 flex gap-3 justify-center flex-wrap">
        <a href="index.html" class="ghost-btn">← Back to Dashboard</a>
        <a href="${TEST.reviewPage}" class="ghost-btn">📚 Knowledge Review</a>
      </div>
    </main>`;
    document.getElementById("startBtn").addEventListener("click", startTest);
  }

  function startTest(){
    state.started = true;
    state.timeLeft = TEST.duration * 60;
    state.timerId = setInterval(tick, 1000);
    renderQuestion();
  }

  function tick(){
    state.timeLeft--;
    const el = document.getElementById("timerVal");
    if(el){
      el.textContent = fmtTime(state.timeLeft);
      const wrap = document.getElementById("timerChip");
      if(state.timeLeft <= 60 && wrap) wrap.classList.add("low-time");
    }
    if(state.timeLeft <= 0){
      clearInterval(state.timerId);
      submitTest(true);
    }
  }

  // ---------------------------------------------------------
  // QUESTION SCREEN
  // ---------------------------------------------------------
  function renderQuestion(){
    const q = TEST.questions[state.current];
    const total = TEST.questions.length;
    const pct = Math.round(((state.current+1)/total)*100);

    let body = "";
    body += passageHtml(q);
    body += imageHtml(q);
    if(q.context) body += `<div class="passage-box mb-3.5">${q.context}</div>`;
    body += `<p class="font-bold text-slate-800 mb-3 text-[1.05rem]"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${q.id}</span>${q.prompt}</p>`;

    if(q.type === "mcq" || q.type === "truefalse"){
      const opts = q.type === "truefalse" ? {True:"True", False:"False"} : q.display;
      body += `<div id="optionsWrap" class="grid sm:grid-cols-2 gap-2">`;
      Object.keys(opts).forEach(key=>{
        const selected = state.answers[q.id] === key ? "selected" : "";
        body += `<label class="option-label rounded-xl px-3.5 py-2.5 text-sm font-semibold flex items-center gap-2 ${selected}" data-key="${key}">
            <span class="opt-letter">${q.type==="truefalse" ? (key==="True"?"T":"F") : key}</span>
            <span>${opts[key]}</span>
          </label>`;
      });
      body += `</div>`;
    } else if(q.type === "fillblank"){
      const val = state.answers[q.id] || "";
      body += `<input type="text" id="fillInput" class="answer-input w-full px-3.5 py-2.5 rounded-xl text-sm font-semibold" placeholder="Type your answer..." value="${esc(val)}" autocomplete="off" spellcheck="false"/>`;
      if(q.wordGiven) body += `<div class="mt-2"><span class="blank-tag text-xs">given word: ${q.wordGiven}</span></div>`;
    } else if(q.type === "rewrite"){
      const val = state.answers[q.id] || "";
      body += `<div class="mb-2 text-slate-600 font-bold text-sm">→ ${q.starter} ...</div>`;
      body += `<textarea id="rewriteInput" rows="2" class="answer-input w-full px-3.5 py-2.5 rounded-xl text-sm font-semibold" placeholder="Write the full rewritten sentence...">${val}</textarea>`;
    }

    app.innerHTML = `
    <div class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
      <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
        <div class="font-extrabold text-indigo-900 text-sm md:text-base flex items-center gap-2"><i class="fa-solid fa-book-open text-amber-500"></i> ${TEST.title}</div>
        <div id="timerChip" class="timer-chip"><i class="fa-solid fa-clock"></i><span id="timerVal">${fmtTime(state.timeLeft)}</span></div>
      </div>
      <div class="max-w-3xl mx-auto px-4 pb-2">
        <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
          <span>Question ${state.current+1}/${total}</span>
          <span>Section ${q.section} · ${answeredCount()}/${total} answered</span>
        </div>
        <div class="w-full bg-indigo-100 rounded-full h-2.5 overflow-hidden">
          <div class="bg-gradient-to-r from-indigo-600 to-fuchsia-500 h-2.5 rounded-full progress-bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
    </div>

    <main class="max-w-3xl mx-auto px-4 py-5 pb-28">
      <div class="task-card bg-white rounded-2xl shadow-md p-4 md:p-6 fade-in">
        ${body}
        <div class="mt-4">
          <button id="flagBtn" class="text-xs font-bold px-3 py-1.5 rounded-full border-2 ${state.flagged.has(q.id)?'border-amber-400 bg-amber-50 text-amber-700':'border-slate-200 text-slate-500'}">${state.flagged.has(q.id)?'🚩 Flagged':'🚩 Flag for review'}</button>
        </div>
      </div>

      <div class="task-card bg-white rounded-2xl shadow-md p-4 mt-4">
        <div class="text-xs font-extrabold text-slate-500 mb-2"><i class="fa-solid fa-grip mr-1"></i> Question list</div>
        <div class="qnav-grid" id="qnavGrid"></div>
      </div>
    </main>

    <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200 px-4 py-3 flex justify-between items-center gap-3 z-40">
      <button id="prevBtn" class="ghost-btn" ${state.current===0?"disabled":""}>← Previous</button>
      ${state.current === total-1
        ? `<button id="submitBtn" class="success-btn">✅ SUBMIT TEST</button>`
        : `<button id="nextBtn" class="primary-btn">Next →</button>`}
    </div>`;

    if(q.type === "mcq" || q.type === "truefalse"){
      document.querySelectorAll("#optionsWrap .option-label").forEach(el=>{
        el.addEventListener("click", ()=>{
          state.answers[q.id] = el.dataset.key;
          renderQuestion();
        });
      });
    } else if(q.type === "fillblank"){
      const inp = document.getElementById("fillInput");
      inp.addEventListener("input", e=>{ state.answers[q.id] = e.target.value; });
    } else if(q.type === "rewrite"){
      const inp = document.getElementById("rewriteInput");
      inp.addEventListener("input", e=>{ state.answers[q.id] = e.target.value; });
    }

    document.getElementById("flagBtn").addEventListener("click", ()=>{
      if(state.flagged.has(q.id)) state.flagged.delete(q.id); else state.flagged.add(q.id);
      renderQuestion();
    });

    const prevBtn = document.getElementById("prevBtn");
    if(prevBtn) prevBtn.addEventListener("click", ()=>{ state.current--; renderQuestion(); });
    const nextBtn = document.getElementById("nextBtn");
    if(nextBtn) nextBtn.addEventListener("click", ()=>{ state.current++; renderQuestion(); });
    const submitBtn = document.getElementById("submitBtn");
    if(submitBtn) submitBtn.addEventListener("click", confirmSubmit);

    renderQnavGrid();
  }

  function renderQnavGrid(){
    const grid = document.getElementById("qnavGrid");
    if(!grid) return;
    grid.innerHTML = TEST.questions.map((q,i)=>{
      const a = state.answers[q.id];
      const answered = a !== undefined && a !== null && a.toString().trim() !== "";
      const cls = ["qnav-btn"];
      if(answered) cls.push("answered");
      if(i === state.current) cls.push("current");
      if(state.flagged.has(q.id)) cls.push("marked");
      return `<div class="${cls.join(" ")}" data-idx="${i}" title="Question ${q.id}">${q.id}</div>`;
    }).join("");
    grid.querySelectorAll(".qnav-btn").forEach(el=>{
      el.addEventListener("click", ()=>{ state.current = parseInt(el.dataset.idx); renderQuestion(); });
    });
  }

  // ---------------------------------------------------------
  // SUBMIT / SCORING (logic unchanged from v1)
  // ---------------------------------------------------------
  function confirmSubmit(){
    const total = TEST.questions.length;
    const answered = answeredCount();
    const unanswered = total - answered;
    if(unanswered > 0){
      showModal(
        "⚠️",
        "Are you sure you want to submit?",
        `You still have <b>${unanswered}</b> unanswered question${unanswered>1?"s":""}.`,
        [
          {label:"Keep working", cls:"ghost-btn", action:closeModal},
          {label:"Submit anyway", cls:"danger-btn", action:()=>{closeModal(); submitTest(false);}}
        ]
      );
    } else {
      submitTest(false);
    }
  }

  function showModal(emoji, title, msg, buttons){
    const overlay = document.createElement("div");
    overlay.className = "fixed inset-0 z-[200] bg-black/55 flex items-center justify-center p-5";
    overlay.id = "modalOverlay";
    overlay.innerHTML = `<div class="bg-white rounded-3xl p-7 max-w-sm w-full text-center shadow-2xl score-badge">
      <div class="text-4xl mb-2">${emoji}</div>
      <h3 class="text-lg font-extrabold text-indigo-900 mb-1">${title}</h3>
      <p class="text-slate-500 text-sm">${msg}</p>
      <div class="flex gap-2.5 justify-center mt-5 flex-wrap">
        ${buttons.map((b,i)=>`<button class="${b.cls}" data-i="${i}">${b.label}</button>`).join("")}
      </div>
    </div>`;
    document.body.appendChild(overlay);
    buttons.forEach((b,i)=>{
      overlay.querySelector(`[data-i="${i}"]`).addEventListener("click", b.action);
    });
  }
  function closeModal(){
    const el = document.getElementById("modalOverlay");
    if(el) el.remove();
  }

  function submitTest(timeUp){
    if(state.timerId) clearInterval(state.timerId);
    state.submitted = true;

    const total = TEST.questions.length;
    let correct = 0, incorrect = 0, unanswered = 0;
    const mistakes = [];

    TEST.questions.forEach(q=>{
      const a = state.answers[q.id];
      const hasAnswer = a !== undefined && a !== null && a.toString().trim() !== "";
      if(!hasAnswer){ unanswered++; mistakes.push(mistakeRecord(q,"(no answer)")); return; }
      if(isCorrect(q)) correct++;
      else { incorrect++; mistakes.push(mistakeRecord(q, a)); }
    });

    const pct = Math.round((correct/total)*100);
    const score10 = (correct * (TEST.totalPoints/total)).toFixed(2).replace(/\.00$/,"").replace(/(\.\d)0$/,"$1");

    try{
      localStorage.setItem(LS_KEY, JSON.stringify(mistakes));
      localStorage.setItem(LS_RESULT_KEY, JSON.stringify({correct, incorrect, unanswered, pct, score10, date: new Date().toISOString()}));
    }catch(e){ /* localStorage unavailable */ }

    renderResult({correct, incorrect, unanswered, pct, score10, timeUp});
  }

  function mistakeRecord(q, studentAnswer){
    let yourAnswerText = studentAnswer;
    if((q.type === "mcq" || q.type === "truefalse") && studentAnswer !== "(no answer)"){
      yourAnswerText = studentAnswer + ". " + (q.display ? q.display[studentAnswer] : studentAnswer);
    }
    let correctAnswerText = q.correct;
    if(q.type === "mcq" && q.display) correctAnswerText = q.correct + ". " + q.display[q.correct];
    return {
      id: q.id, section: q.section, prompt: q.prompt, context: q.context || "",
      yourAnswer: yourAnswerText, correctAnswer: correctAnswerText, explanation: q.explanation
    };
  }

  function resultCategory(pct){
    if(pct >= 90) return {msg:"Excellent!", emoji:"🌟"};
    if(pct >= 80) return {msg:"Great job!", emoji:"🎉"};
    if(pct >= 65) return {msg:"Good! Keep practicing!", emoji:"💪"};
    if(pct >= 50) return {msg:"Almost there!", emoji:"📚"};
    return {msg:"Let's review together!", emoji:"❤️"};
  }

  // ---------------------------------------------------------
  // Confetti (adapted from the sample file)
  // ---------------------------------------------------------
  function fireConfetti(){
    let wrap = document.getElementById("confettiWrap");
    if(!wrap){
      wrap = document.createElement("div");
      wrap.id = "confettiWrap";
      wrap.className = "confetti-wrap";
      document.body.appendChild(wrap);
    }
    wrap.innerHTML = "";
    const colors = ["#4f46e5","#7c3aed","#ec4899","#f59e0b","#06b6d4","#10b981"];
    for(let i=0;i<100;i++){
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.cssText = `left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
      wrap.appendChild(p);
    }
    setTimeout(()=>{ wrap.innerHTML=""; }, 4200);
  }

  function renderResult(r){
    const total = TEST.questions.length;
    const cat = resultCategory(r.pct);
    if(r.pct >= 65) setTimeout(fireConfetti, 250);
    app.innerHTML = `
    <div class="max-w-xl mx-auto px-4 py-10 fade-in">
      <div class="task-card bg-white rounded-3xl shadow-lg p-7 md:p-9 text-center score-badge">
        <h2 class="text-xl font-extrabold text-indigo-900 mb-1">🎯 SCORE</h2>
        ${r.timeUp ? `<div class="chip-red inline-block mb-2">⏰ Time's up — your test was submitted automatically</div>` : ""}
        <div class="score-circle mx-auto my-3" style="--pct:${r.pct};">
          <div class="score-inner">
            <div class="score-num">${r.correct}/${total}</div>
            <div class="score-pct">${r.pct}%</div>
          </div>
        </div>
        <div class="text-2xl font-extrabold font-baloo text-indigo-900">${cat.emoji} ${cat.msg}</div>
        <div class="text-slate-500 mt-1">Converted score: <b class="text-indigo-700">${r.score10}/${TEST.totalPoints}</b></div>

        <div class="grid grid-cols-3 gap-3 my-6">
          <div class="stat-box"><div class="num text-emerald-600">${r.correct}</div><div class="label">✅ Correct</div></div>
          <div class="stat-box"><div class="num text-rose-500">${r.incorrect}</div><div class="label">❌ Incorrect</div></div>
          <div class="stat-box"><div class="num text-amber-500">${r.unanswered}</div><div class="label">➖ Unanswered</div></div>
        </div>

        <div class="flex gap-2.5 justify-center flex-wrap">
          <button id="reviewBtn" class="primary-btn">📝 REVIEW ANSWERS</button>
          <button id="retakeBtn" class="secondary-btn">🔄 Retake Test</button>
        </div>
        <div class="flex gap-2.5 justify-center flex-wrap mt-2.5">
          <a class="success-btn" href="${TEST.reviewPage}">📚 Go to Knowledge Review</a>
          <a class="ghost-btn" href="index.html">🏠 Dashboard</a>
        </div>
      </div>
    </div>`;
    document.getElementById("reviewBtn").addEventListener("click", renderAnswerReview);
    document.getElementById("retakeBtn").addEventListener("click", ()=>{
      state = { started:true, submitted:false, current:0, answers:{}, flagged:new Set(), timeLeft: TEST.duration*60, timerId:null };
      state.timerId = setInterval(tick, 1000);
      renderQuestion();
    });
  }

  function renderAnswerReview(){
    const total = TEST.questions.length;
    let html = `<header class="hero-gradient text-white py-8 px-4 text-center shadow-xl">
        <h1 class="font-baloo text-2xl md:text-3xl font-extrabold">📝 Answer Review</h1>
        <p class="mt-1 opacity-90 text-sm md:text-base">Xem lại toàn bộ ${total} câu, đáp án của em, đáp án đúng và giải thích chi tiết.</p>
      </header>
      <main class="max-w-3xl mx-auto px-4 py-6 pb-16 space-y-4">`;

    TEST.questions.forEach(q=>{
      const a = state.answers[q.id];
      const hasAnswer = a !== undefined && a !== null && a.toString().trim() !== "";
      const correct = hasAnswer && isCorrect(q);
      let statusHtml, yourAnswerHtml, correctAnswerHtml;

      if(!hasAnswer){
        statusHtml = `<span class="status-pill status-unanswered">➖ Unanswered</span>`;
        yourAnswerHtml = `<i>(no answer)</i>`;
      } else if(correct){
        statusHtml = `<span class="status-pill status-correct">✅ Correct</span>`;
      } else {
        statusHtml = `<span class="status-pill status-incorrect">❌ Incorrect</span>`;
      }

      if(q.type === "mcq" || q.type === "truefalse"){
        if(hasAnswer){
          const label = q.type === "truefalse" ? a : (a + ". " + (q.display ? q.display[a] : ""));
          yourAnswerHtml = label;
        }
        const cLabel = q.type === "truefalse" ? q.correct : (q.correct + ". " + (q.display ? q.display[q.correct] : ""));
        correctAnswerHtml = cLabel;
      } else {
        if(hasAnswer) yourAnswerHtml = a;
        correctAnswerHtml = q.correct;
      }

      html += `<div class="task-card bg-white rounded-2xl shadow-md p-4 md:p-5">
        <div class="flex justify-between items-center flex-wrap gap-2 mb-2">
          <span class="chip-purple">Question ${q.id} · Section ${q.section}</span>
          ${statusHtml}
        </div>
        ${passageHtml(q)}
        ${imageHtml(q)}
        ${q.context ? `<div class="passage-box mb-2">${q.context}</div>` : ""}
        <div class="font-bold text-slate-800 mb-2">${q.prompt}</div>
        <div class="text-sm text-slate-700"><b>Your answer:</b> ${yourAnswerHtml}</div>
        <div class="text-sm text-slate-700"><b>Correct answer:</b> ${correctAnswerHtml}</div>
        <div class="explanation-box show mt-2"><b>💡 Explanation:</b><br>${q.explanation}</div>
      </div>`;
    });

    html += `<div class="text-center pt-4">
      <a class="success-btn" href="${TEST.reviewPage}">📚 Go to Knowledge Review</a>
      <a class="ghost-btn" href="index.html">🏠 Dashboard</a>
    </div></main>`;
    app.innerHTML = html;
    window.scrollTo({top:0});
  }

  // ---------------------------------------------------------
  renderStart();
})();

</script>
</body>
</html>
