<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Unit 1 - Tự kiểm tra - Tieng Anh 8</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');
  :root{ --accent:#1d4ed8; --accent2:#0891b2; }
  * { box-sizing: border-box; }
  body { font-family:'Nunito',sans-serif; background:#f5f3ff; }
  .hero-gradient{ background: linear-gradient(135deg, #7c2d12 0%, #ea580c 55%, #f59e0b 100%); }
  .tab-btn{ transition: all .2s ease; }
  .tab-btn.active{ background: linear-gradient(135deg, #7c2d12, #f59e0b); color:#fff; box-shadow:0 4px 14px rgba(124,45,18,.35); transform:translateY(-1px); }
  .task-card{ transition: box-shadow .2s, transform .2s; }
  .task-card:hover{ transform: translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.10); }
  .option-label{ cursor:pointer; transition: all .18s; border:2px solid #e2e8f0; }
  .option-label:hover{ border-color:var(--accent); background:#f5f3ff; }
  .option-label.selected{ border-color:#1e1b4b; background:#eef2ff; }
  .option-label.correct-opt{ border-color:#22c55e !important; background:#f0fdf4 !important; }
  .option-label.wrong-opt{ border-color:#ef4444 !important; background:#fef2f2 !important; }
  .mcq-detail-hidden{ display:none; }
  .show-mcq-detail .mcq-detail-hidden{ display:block; }
  .speak-btn{ cursor:pointer; }
  .speak-btn.speaking{ animation: pulseSpeak .7s ease-in-out infinite; }
  @keyframes pulseSpeak{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.18);} }
  .vi-hidden{ display:none; }
  .explanation-box{ display:none; animation: fadeSlide .3s ease forwards; }
  .explanation-box.show{ display:block; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  input.answer-input{ border:2px solid #cbd5e1; transition:border .18s; outline:none; background:#fff; }
  input.answer-input:focus{ border-color:var(--accent); }
  input.correct-input{ border-color:#22c55e !important; background:#f0fdf4; }
  input.wrong-input{ border-color:#ef4444 !important; background:#fef2f2; }
  .score-badge{ animation: popIn .35s cubic-bezier(.36,1.6,.6,1) forwards; }
  @keyframes popIn{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  .confetti-wrap{ position:fixed; inset:0; pointer-events:none; z-index:9999; }
  .confetti-piece{ position:absolute; width:10px; height:10px; border-radius:2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(100vh) rotate(720deg); opacity:0;} }
  .progress-bar-fill{ transition: width .6s ease; }
  .section-page{ display:none; }
  .section-page.active{ display:block; }
  #completionBanner{ display:none; }
  #completionBanner.show{ display:flex; }
  .passage-box{ background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:1rem 1.25rem; line-height:1.9; font-size:.95rem; color:#334155; }
  .dict-box{ background:#fef9c3; border:1px solid #fde68a; border-radius:1rem; padding:1rem 1.25rem; font-size:.9rem; color:#334155; }
  .blank-tag{ background:#ffedd5; color:#9a3412; font-weight:800; border-radius:.4rem; padding:0 .35rem; }
  .wordfam-box{ background:#fff7ed; border:1px solid #fed7aa; border-radius:.6rem; padding:.5rem .75rem; font-size:.75rem; color:#9a3412; line-height:1.6; width:100%; }
</style>
</head>

e"], "answer": 3, "explanation": "\"include\" có \"u\" phát âm /uː/, ba từ còn lại phát âm /ʊ/.", "ipas": ["/ˈpʊdɪŋ/", "/pʊʃ/", "/ˈkʊʃn/", "/ɪnˈkluːd/"], "vis": ["bánh pudding", "đẩy", "đệm, gối tựa", "bao gồm"]}, {"q": "8. Which word has the underlined part pronounced differently from that of the others?", "options": ["finish", "find", "tired", "dislike"], "answer": 0, "explanation": "\"finish\" có \"i\" phát âm /ɪ/, ba từ còn lại có \"i\" phát âm /aɪ/.", "ipas": ["/ˈfɪnɪʃ/", "/faɪnd/", "/ˈtaɪərd/", "/dɪsˈlaɪk/"], "vis": ["hoàn thành", "tìm thấy", "mệt mỏi", "không thích"]}, {"q": "9. Which word has the underlined part pronounced differently from that of the others?", "options": ["wood", "moon", "soon", "loose"], "answer": 0, "explanation": "\"wood\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "ipas": ["/wʊd/", "/muːn/", "/suːn/", "/luːs/"], "vis": ["gỗ", "mặt trăng", "sớm", "lỏng lẻo"]}, {"q": "10. Which word has the underlined part pronounced differently from that of the others?", "options": ["choose", "look", "spoon", "food"], "answer": 1, "explanation": "\"look\" có \"oo\" phát âm /ʊ/, ba từ còn lại phát âm /uː/.", "ipas": ["/tʃuːz/", "/lʊk/", "/spuːn/", "/fuːd/"], "vis": ["chọn", "nhìn", "cái thìa", "thức ăn"]}]}, {"roman": "III", "navLabel": "Trọng âm", "title": "Trọng âm", "icon": "ear-listen", "instructions": "Chọn từ có trọng âm khác với các từ còn lại.", "type": "mcq", "instant": true, "questions": [{"q": "1. Which word has a different stress pattern from that of the others?", "options": ["leisure", "puzzle", "enjoy", "message"], "answer": 2, "explanation": "\"enjoy\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈliːʒər/", "/ˈpʌzl/", "/ɪnˈdʒɔɪ/", "/ˈmesɪdʒ/"], "vis": ["thời gian rảnh", "trò chơi xếp hình", "thích thú", "tin nhắn"]}, {"q": "2. Which word has a different stress pattern from that of the others?", "options": ["enjoy", "dislike", "relax", "muscle"], "answer": 3, "explanation": "\"muscle\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "ipas": ["/ɪnˈdʒɔɪ/", "/dɪsˈlaɪk/", "/rɪˈlæks/", "/ˈmʌsl/"], "vis": ["thích thú", "không thích", "thư giãn", "cơ bắp"]}, {"q": "3. Which word has a different stress pattern from that of the others?", "options": ["balance", "muscle", "improve", "fancy"], "answer": 2, "explanation": "\"improve\" trọng âm rơi vào âm tiết 2, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˈbæləns/", "/ˈmʌsl/", "/ɪmˈpruːv/", "/ˈfænsi/"], "vis": ["sự cân bằng", "cơ bắp", "cải thiện", "thích, muốn"]}, {"q": "4. Which word has a different stress pattern from that of the others?", "options": ["home-made", "snowboarding", "puzzle", "balance"], "answer": 0, "explanation": "\"home-made\" trọng âm rơi vào âm tiết \"made\", ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˌhoʊmˈmeɪd/", "/ˈsnoʊbɔːrdɪŋ/", "/ˈpʌzl/", "/ˈbæləns/"], "vis": ["tự làm tại nhà", "trượt ván tuyết", "trò chơi xếp hình", "sự cân bằng"]}, {"q": "5. Which word has a different stress pattern from that of the others?", "options": ["do puzzle", "detest", "leisure", "improve"], "answer": 0, "explanation": "\"do puzzle\" là cụm động từ gồm hai từ nên có kiểu nhấn âm khác so với các từ đơn còn lại.", "ipas": ["/duː ˈpʌzl/", "/dɪˈtest/", "/ˈliːʒər/", "/ɪmˈpruːv/"], "vis": ["chơi xếp hình", "ghét cay ghét đắng", "thời gian rảnh", "cải thiện"]}, {"q": "6. Which word has a different stress pattern from that of the others?", "options": ["resort", "do puzzle", "adore", "leisure"], "answer": 1, "explanation": "\"do puzzle\" là cụm động từ gồm hai từ nên có kiểu nhấn âm khác so với ba từ đơn còn lại.", "ipas": ["/rɪˈzɔːrt/", "/duː ˈpʌzl/", "/əˈdɔːr/", "/ˈliːʒər/"], "vis": ["khu nghỉ dưỡng", "chơi xếp hình", "rất thích, mê", "thời gian rảnh"]}, {"q": "7. Which word has a different stress pattern from that of the others?", "options": ["connect", "activate", "create", "surprise"], "answer": 1, "explanation": "\"activate\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "ipas": ["/kəˈnekt/", "/ˈæktɪveɪt/", "/kriˈeɪt/", "/səˈpraɪz/"], "vis": ["kết nối", "kích hoạt", "tạo ra", "làm ngạc nhiên"]}, {"q": "8. Which word has a different stress pattern from that of the others?", "options": ["entertain", "popularize", "activate", "leisure"], "answer": 0, "explanation": "\"entertain\" trọng âm rơi vào âm tiết cuối, ba từ còn lại trọng âm rơi vào âm tiết 1.", "ipas": ["/ˌentərˈteɪn/", "/ˈpɒpjələraɪz/", "/ˈæktɪveɪt/", "/ˈliːʒər/"], "vis": ["giải trí", "phổ biến hóa", "kích hoạt", "thời gian rảnh"]}, {"q": "9. Which word has a different stress pattern from that of the others?", "options": ["adore", "enjoy", "prefer", "listen"], "answer": 3, "explanation": "\"listen\" trọng âm rơi vào âm tiết 1, ba từ còn lại trọng âm rơi vào âm tiết 2.", "ipas": ["/əˈdɔːr/", "/ɪnˈdʒɔɪ/", "/prɪˈfɜːr/", "/ˈlɪsn/"], "vis": ["rất thích, mê", "thích thú", "thích hơn", "lắng nghe"]}, {"q": "10. Which word has a different stress pattern from that of the others?", "options": ["detest", "message friends", "folding", "fancy"], "answer": 0, "explanation": "\"detest\" trọng âm rơi vào âm tiết 2, ba từ/cụm từ còn lại trọng âm chính rơi vào âm tiết 1.", "ipas": ["/dɪˈtest/", "/ˈmesɪdʒ frendz/", "/ˈfoʊldɪŋ/", "/ˈfænsi/"], "vis": ["ghét cay ghét đắng", "nhắn tin cho bạn bè", "gấp", "thích, muốn"]}]}, {"navLabel": "Ngữ pháp", "title": "Grammar Exercise: Verbs of liking/disliking + Gerund/Infinitive", "icon": "chalkboard", "instructions": "Chọn dạng đúng của động từ trong ngoặc.", "type": "mcq", "instant": true, "questions": [{"q": "1. Most adults don't like (watch / to watch) cartoons.", "options": ["watch", "to watch"], "answer": 1, "explanation": "\"like\" có thể theo sau bởi V-ing hoặc to-V; đáp án chọn là to watch.", "vi": "Hầu hết người lớn không thích xem phim hoạt hình.", "vis": ["xem (V nguyên thể)", "xem (to V)"]}, {"q": "2. Her little kid (detests / likes) all vegetables. He doesn't eat any kinds of vegetables.", "options": ["detests", "likes"], "answer": 0, "explanation": "Không ăn bất kỳ loại rau nào → detests (ghét cay ghét đắng), không phải likes.", "vi": "Đứa con nhỏ của cô ấy ghét tất cả các loại rau. Cậu bé không ăn bất kỳ loại rau nào cả.", "vis": ["ghét cay ghét đắng", "thích"]}, {"q": "3. Does she fancy (messaging / to message) her friends?", "options": ["messaging", "to message"], "answer": 0, "explanation": "\"fancy\" chỉ theo sau bởi danh động từ (V-ing): messaging.", "vi": "Cô ấy có thích nhắn tin cho bạn bè không?", "vis": ["nhắn tin (V-ing)", "nhắn tin (to V)"]}, {"q": "4. My sister loves origami. She often (folds / folding) paper into attractive shapes.", "options": ["folds", "folding"], "answer": 0, "explanation": "Đây là động từ chính của câu (thì hiện tại đơn), không phải động từ theo sau \"love\" → folds.", "vi": "Chị tôi rất thích origami. Chị ấy thường gấp giấy thành những hình dạng hấp dẫn.", "vis": ["gấp (hiện tại đơn)", "đang gấp (V-ing, sai vị trí)"]}, {"q": "5. They (fancy / don't like) drinking coffee because it is too bitter.", "options": ["fancy", "don't like"], "answer": 1, "explanation": "Cà phê quá đắng → không thích uống: don't like drinking coffee.", "vi": "Họ không thích uống cà phê vì nó quá đắng.", "vis": ["thích, muốn", "không thích"]}, {"q": "6. He always (stays / staying) at home on holidays.", "options": ["stays", "staying"], "answer": 0, "explanation": "Động từ chính của câu, thì hiện tại đơn, chủ ngữ số ít → stays.", "vi": "Anh ấy luôn ở nhà vào những ngày nghỉ lễ.", "vis": ["ở nhà (hiện tại đơn)", "đang ở (V-ing, sai vị trí)"]}, {"q": "7. I'm into playing sport, especially table tennis. I (play / to play) table tennis almost every afternoon.", "options": ["play", "to play"], "answer": 0, "explanation": "Động từ chính của câu, thì hiện tại đơn → play.", "vi": "Tôi rất thích chơi thể thao, đặc biệt là bóng bàn. Tôi chơi bóng bàn hầu như mỗi buổi chiều.", "vis": ["chơi (hiện tại đơn)", "chơi (to V, sai vị trí)"]}, {"q": "8. My sister adores (to make / making) paper flowers.", "options": ["to make", "making"], "answer": 1, "explanation": "\"adore\" chỉ theo sau bởi danh động từ (V-ing): making.", "vi": "Chị tôi rất thích làm hoa giấy.", "vis": ["làm (to V)", "làm (V-ing)"]}], "roman": "IV", "theory": {"title": "Ghi nhớ: Verbs of liking/disliking + Gerund/Infinitive", "html": "<b>1. Chỉ theo sau bởi danh động từ (V-ing):</b> adore, enjoy, fancy, dislike, detest.<br><i>Ex: Thomas adores snowboarding. Linda detests doing puzzles.</i><br><br><b>2. Theo sau bởi cả V-ing và to-V (nghĩa không đổi nhiều):</b> like, love, hate, prefer.<br><i>Ex: We love going/to go to the cinema. He hates getting up/to get up early.</i><br><br><b>3. Một số động từ đổi nghĩa theo dạng theo sau:</b><br>❶ remember / forget / regret + V-ing (việc đã xảy ra) khác với + to-V (việc chưa xảy ra).<br><i>Ex: I remember meeting you some times before. / Remember to do your homework!</i><br>❷ stop + V-ing (dừng làm việc gì) khác với stop + to-V (dừng lại để làm việc khác).<br><i>Ex: We stopped talking when the teacher came in. / I stopped to talk with him.</i><br>❸ try + V-ing (thử làm) khác với try + to-V (cố gắng làm).<br><i>Ex: He tried pressing Esc key, but the computer didn't respond. / He tried to finish the test on time.</i>", "vi": null}}, {"roman": "V", "navLabel": "Từ vựng & Ngữ pháp", "title": "Choose the best answer or phrase", "icon": "list-check", "instructions": "Chọn đáp án (A, B, C hoặc D) đúng nhất.", "type": "mcq", "instant": true, "questions": [{"q": "1. About 16% of them love ________ swimming.", "options": ["to go", "go", "going", "went"], "answer": 2, "explanation": "“love + V-ing/to-V” đều đúng ngữ pháp, nhưng đáp án chọn là going.", "vi": "Khoảng 16% trong số họ rất thích bơi lội.", "vis": ["đi (to V)", "đi (nguyên mẫu, sai)", "đi (V-ing)", "đã đi (quá khứ, sai)"]}, {"q": "2. My father likes _________ books and _________ in the pool.", "options": ["reading - swim", "to read - swimming", "read - swim", "reading - swimming"], "answer": 3, "explanation": "Hai động từ song song sau “likes” phải cùng dạng V-ing: reading - swimming.", "vi": "Bố tôi thích đọc sách và bơi trong hồ bơi.", "vis": ["đọc - bơi (sai cấu trúc song song)", "đọc(to V) - bơi(V-ing), không song song", "đọc - bơi (nguyên mẫu, sai)", "đọc - bơi (V-ing - V-ing, đúng)"]}, {"q": "3. A lot of young families in Viet Nam prefer _______ time doing outdoor activities together.", "options": ["spending", "spend", "spent", "to spend"], "answer": 0, "explanation": "Cấu trúc “prefer + V-ing”; đồng thời đây là cấu trúc “spend time V-ing”.", "vi": "Nhiều gia đình trẻ ở Việt Nam thích dành thời gian cùng nhau làm các hoạt động ngoài trời.", "vis": ["dành (V-ing, đúng)", "dành (nguyên mẫu, sai)", "dành (quá khứ, sai)", "dành (to V, sai)"]}, {"q": "4. My sister hates ______ up early to do exercise.", "options": ["getting", "get", "gets", "to get"], "answer": 0, "explanation": "“hate” có thể theo sau bởi V-ing hoặc to-V; đáp án chọn là getting.", "vi": "Chị tôi ghét việc dậy sớm để tập thể dục.", "vis": ["dậy (V-ing, đúng)", "dậy (nguyên mẫu, sai)", "dậy (chia sai chủ ngữ)", "dậy (to V, sai)"]}, {"q": "5. Nam usually _________ football with his friends after school.", "options": ["plays", "playing", "play", "to play"], "answer": 0, "explanation": "Chủ ngữ số ít “Nam” ở thì hiện tại đơn, dùng plays.", "vi": "Nam thường chơi bóng đá với bạn bè sau giờ học.", "vis": ["chơi (số ít, hiện tại đơn, đúng)", "chơi (V-ing, sai)", "chơi (nguyên mẫu, sai chủ ngữ)", "chơi (to V, sai)"]}, {"q": "6. ________ helps to improve physical health and sometimes gives us a chance to make friends.", "options": ["Messaging", "Playing computer games", "Surfing the net", "Playing sports"], "answer": 3, "explanation": "Chơi thể thao giúp cải thiện sức khỏe thể chất và có cơ hội kết bạn.", "vi": "Chơi thể thao giúp cải thiện sức khỏe thể chất và đôi khi cho chúng ta cơ hội kết bạn.", "vis": ["Nhắn tin", "Chơi trò chơi điện tử", "Lướt mạng", "Chơi thể thao"]}, {"q": "7. Mark spends a lot of time ________ the internet. He visits one website after another just to watch short videos.", "options": ["doing", "taking", "surfing", "knitting"], "answer": 2, "explanation": "“surf the internet” nghĩa là lướt mạng.", "vi": "Mark dành nhiều thời gian lướt mạng. Cậu ấy vào hết trang web này đến trang web khác chỉ để xem các video ngắn.", "vis": ["làm", "lấy, mang", "lướt (mạng)", "đan len"]}, {"q": "8. Our cousins detest ________ books and _________ .", "options": ["reading / draw", "reading / drawing", "to read / to draw", "read/ draw"], "answer": 1, "explanation": "Hai động từ song song sau “detest” phải cùng dạng V-ing: reading / drawing.", "vi": "Anh chị em họ của chúng tôi rất ghét đọc sách và vẽ.", "vis": ["đọc / vẽ (không song song, sai)", "đọc / vẽ (V-ing - V-ing, đúng)", "đọc / vẽ (to V - to V, sai)", "đọc / vẽ (nguyên mẫu, sai)"]}, {"q": "9. Alice spends a lot of time _______ her own; she always exercises regularly and does what she enjoys.", "options": ["on", "in", "about", "for"], "answer": 0, "explanation": "“spend time on your own” nghĩa là dành thời gian một mình.", "vi": "Alice dành nhiều thời gian ở một mình; cô ấy luôn tập thể dục đều đặn và làm những gì mình thích.", "vis": ["trên (sai giới từ)", "trong (sai giới từ)", "về (sai giới từ)", "một mình (spend time on your own, đúng)"]}, {"q": "10. _______ is a design that you use to make something.", "options": ["Pattern", "Pastime", "Needles", "A and B are correct"], "answer": 0, "explanation": "“pattern” nghĩa là mẫu, khuôn thiết kế dùng để tạo ra vật gì đó.", "vi": "Mẫu (pattern) là một thiết kế mà bạn dùng để làm ra thứ gì đó.", "vis": ["Mẫu, khuôn thiết kế", "Thú vui, sở thích", "Kim (đan, khâu)", "Cả A và B đều đúng"]}, {"q": "11. _________ do you do with your friends in your free time?", "options": ["What", "How", "Who", "When"], "answer": 0, "explanation": "Câu hỏi về hoạt động, dùng What.", "vi": "Bạn làm gì với bạn bè trong thời gian rảnh?", "vis": ["Cái gì", "Như thế nào", "Ai", "Khi nào"]}, {"q": "12. _______ is small circles of wool made around knitting needles.", "options": ["Stitches", "Magical", "Pastime", "Pattern"], "answer": 0, "explanation": "“stitches” nghĩa là các mũi đan (vòng len nhỏ quanh que đan).", "vi": "Các mũi đan là những vòng len nhỏ được tạo quanh que đan.", "vis": ["Mũi đan/khâu", "Kỳ diệu, huyền bí", "Thú vui", "Mẫu, khuôn"]}, {"q": "13. Origami is the art of paper _________.", "options": ["fold", "folding", "to fold", "folds"], "answer": 1, "explanation": "“paper folding” nghĩa là nghệ thuật gấp giấy (danh từ ghép).", "vi": "Origami là nghệ thuật gấp giấy.", "vis": ["gấp (nguyên mẫu, sai)", "gấp giấy (danh từ ghép, đúng)", "gấp (to V, sai)", "gấp (số nhiều/ngôi 3, sai)"]}, {"q": "14. About favorite leisure activities, she and I share many things in _______.", "options": ["similarity", "general", "common", "the same"], "answer": 2, "explanation": "“have things in common” nghĩa là có nhiều điểm chung.", "vi": "Về các hoạt động giải trí yêu thích, cô ấy và tôi có nhiều điểm chung.", "vis": ["sự giống nhau (danh từ, sai cụm)", "chung chung (sai cụm)", "có điểm chung (in common, đúng)", "giống hệt nhau (sai cụm)"]}, {"q": "15. It rained hard. ______, my father went to work.", "options": ["Therefore", "However", "Because", "A and B are correct"], "answer": 1, "explanation": "Ý tương phản, trời mưa to nhưng bố vẫn đi làm, dùng However.", "vi": "Trời mưa to. Tuy nhiên, bố tôi vẫn đi làm.", "vis": ["Vì vậy (sai, không tương phản)", "Tuy nhiên (đúng, ý tương phản)", "Bởi vì (sai, không hợp lý)", "Cả A và B đều đúng (sai)"]}, {"q": "16. It was cold and wet, ______ Bob still went to the beach.", "options": ["therefore", "so", "but", "because"], "answer": 2, "explanation": "Ý tương phản, trời lạnh và ướt nhưng Bob vẫn đi biển, dùng but.", "vi": "Trời lạnh và ẩm ướt, nhưng Bob vẫn đi biển.", "vis": ["vì vậy (sai)", "vì vậy, nên (sai)", "nhưng (đúng, ý tương phản)", "bởi vì (sai)"]}, {"q": "17. _______ is something that you enjoy doing when you are not working", "options": ["Pastime", "Pattern", "Magical", "Stitches"], "answer": 0, "explanation": "“pastime” nghĩa là thú vui, việc bạn thích làm khi không phải làm việc.", "vi": "Thú vui (pastime) là điều bạn thích làm khi không phải làm việc.", "vis": ["Thú vui (đúng)", "Mẫu, khuôn (sai)", "Kỳ diệu (sai)", "Mũi đan/khâu (sai)"]}, {"q": "18. Visiting _______ increases my knowledge about cultures in the past.", "options": ["museums", "cinemas", "hometown", "city"], "answer": 0, "explanation": "Thăm bảo tàng giúp tăng hiểu biết về văn hóa trong quá khứ.", "vi": "Việc thăm các bảo tàng giúp tôi tăng thêm hiểu biết về các nền văn hóa trong quá khứ.", "vis": ["bảo tàng (đúng)", "rạp chiếu phim (sai)", "quê hương (sai)", "thành phố (sai, chung chung)"]}, {"q": "19. ________ is having a special quality that makes something seem different from ordinary things.", "options": ["Stitches", "Similarity", "Magical", "similarity"], "answer": 2, "explanation": "“magical” nghĩa là có phẩm chất đặc biệt khiến thứ gì đó khác biệt so với những điều bình thường.", "vi": "Từ “magical” chỉ việc có một phẩm chất đặc biệt khiến điều gì đó có vẻ khác so với những thứ bình thường.", "vis": ["Mũi đan/khâu (sai)", "Sự giống nhau (gần nghĩa nhưng sai từ loại)", "Kỳ diệu, khác biệt (đúng)", "sự giống nhau (viết thường, sai)"]}, {"q": "20. Last school year, my students were very keen on ________. They decorated and repaired the classroom by themselves.", "options": ["cooking", "doing origami", "doing DIY", "playing sports"], "answer": 2, "explanation": "Trang trí và sửa chữa lớp học tự tay, dùng doing DIY.", "vi": "Năm học trước, học sinh của tôi rất say mê làm đồ tự chế (DIY). Các em đã tự trang trí và sửa chữa lớp học.", "vis": ["nấu ăn (sai)", "gấp giấy nghệ thuật (sai)", "làm đồ tự chế (đúng)", "chơi thể thao (sai)"]}, {"q": "21. ________ is an increasingly popular method of communicating over the internet. People often send short messages using a mobile phone or computer.", "options": ["Messaging", "Volunteering", "Snowboarding", "Knitting"], "answer": 0, "explanation": "Gửi tin nhắn ngắn qua điện thoại hoặc máy tính, dùng Messaging.", "vi": "Nhắn tin là một phương thức giao tiếp qua internet ngày càng phổ biến. Mọi người thường gửi tin nhắn ngắn bằng điện thoại di động hoặc máy tính.", "vis": ["Nhắn tin (đúng)", "Làm tình nguyện (sai)", "Trượt ván tuyết (sai)", "Đan len (sai)"]}, {"q": "22. Minh ______ to play football, and so does his brother.", "options": ["likes", "enjoys", "fancies", "detest"], "answer": 0, "explanation": "“like to V” đúng ngữ pháp và hợp nghĩa, đáp án chọn là likes.", "vi": "Minh thích chơi bóng đá, và anh trai cậu ấy cũng vậy.", "vis": ["thích (đúng, like to V)", "thích thú (enjoy + V-ing, sai cấu trúc)", "thích, muốn (fancy + V-ing, sai cấu trúc)", "ghét (detest, sai chia động từ)"]}, {"q": "23. She loves going out _______ her friends.", "options": ["for", "with", "between", "in"], "answer": 1, "explanation": "“go out with sb” nghĩa là đi chơi cùng ai.", "vi": "Cô ấy rất thích đi chơi cùng bạn bè.", "vis": ["cho (sai giới từ)", "với, cùng (go out with, đúng)", "giữa (sai giới từ)", "trong (sai giới từ)"]}, {"q": "24. Ms. Janny loves _________ very much. There are a lot of beautiful flowers and fresh vegetables in her garden.", "options": ["doing gardening", "to doing garden", "to do garden", "do gardening"], "answer": 0, "explanation": "“do gardening” ở dạng V-ing sau “loves”: doing gardening.", "vi": "Cô Janny rất thích làm vườn. Trong vườn của cô có rất nhiều hoa đẹp và rau tươi.", "vis": ["làm vườn (V-ing, đúng)", "làm vườn (sai cấu trúc)", "làm vườn (sai cấu trúc)", "làm vườn (thiếu to/-ing, sai)"]}, {"q": "25. I'm so thirsty after a long run. I would like _________ a full glass of orange juice.", "options": ["drink", "to drink", "drank", "drinking"], "answer": 1, "explanation": "“would like to V” nghĩa là muốn làm gì.", "vi": "Tôi khát nước quá sau khi chạy một quãng dài. Tôi muốn uống một ly nước cam đầy.", "vis": ["uống (nguyên mẫu, sai)", "uống (to V, đúng - would like to V)", "đã uống (quá khứ, sai)", "uống (V-ing, sai)"]}, {"q": "26. My grandparents love ______ very much. There are a lot of beautiful flowers and fresh vegetables in their garden.", "options": ["doing garden", "doing gardening", "do gardening", "to do garden"], "answer": 1, "explanation": "“do gardening” ở dạng V-ing sau “love”: doing gardening.", "vi": "Ông bà tôi rất thích làm vườn. Trong vườn của ông bà có rất nhiều hoa đẹp và rau tươi.", "vis": ["làm vườn (thiếu -ing, sai)", "làm vườn (V-ing, đúng)", "làm vườn (sai cấu trúc)", "làm vườn (sai cấu trúc)"]}, {"q": "27. You should avoid ______ too much TV. It's not good for your eyes.", "options": ["seeing", "looking", "watching", "glancing"], "answer": 2, "explanation": "“avoid + V-ing”; “watch TV” là collocation đúng.", "vi": "Bạn nên tránh xem TV quá nhiều. Điều đó không tốt cho mắt của bạn.", "vis": ["nhìn thấy (sai, không phải collocation)", "nhìn (sai, không phải collocation)", "xem (TV) (đúng, watch TV)", "liếc nhìn (sai, không phải collocation)"]}, {"q": "28. Most people now enjoy shorter working hours and more _______.", "options": ["message friends", "paper folding", "leisure time", "muscle strength"], "answer": 2, "explanation": "“leisure time” nghĩa là thời gian rảnh rỗi, hợp nghĩa với giờ làm việc ngắn hơn.", "vi": "Hầu hết mọi người hiện nay có giờ làm việc ngắn hơn và nhiều thời gian rảnh hơn.", "vis": ["nhắn tin cho bạn bè (sai)", "gấp giấy (sai)", "thời gian rảnh rỗi (đúng)", "sức mạnh cơ bắp (sai)"]}]}, {"roman": "VI", "navLabel": "Word Form", "title": "Cho dạng đúng của từ trong ngoặc", "icon": "spell-check", "instructions": "Điền dạng đúng của từ trong ngoặc vào chỗ trống.", "type": "fill", "questions": [{"q": "1. The most popular leisure _____________ in Britain is going for a walk.", "answer": "activity", "explanation": "Danh từ: act → activity (hoạt động).", "vi": "Hoạt động giải trí phổ biến nhất ở Anh là đi bộ.", "family": ["act (v): hành động, đóng vai", "activity (n): hoạt động", "active (adj): năng động, hoạt bát", "actively (adv): một cách năng động"]}, {"q": "2. To play video games, these computers must be used over a Wi-Fi internet ____________.", "answer": "connection", "explanation": "Danh từ: connect → connection (sự kết nối).", "vi": "Để chơi trò chơi điện tử, những chiếc máy tính này phải được kết nối qua Wi-Fi.", "family": ["connect (v): kết nối", "connection (n): sự kết nối", "connected (adj): được kết nối, có liên quan", "connecting (adj): đang kết nối"]}, {"q": "3. I think badminton is an easy sport which helps to improve my muscle ______________.", "answer": "strength", "explanation": "Danh từ: strong → strength (sức mạnh).", "vi": "Tôi nghĩ cầu lông là một môn thể thao dễ giúp cải thiện sức mạnh cơ bắp của tôi.", "family": ["strengthen (v): củng cố, làm cho mạnh hơn", "strength (n): sức mạnh, điểm mạnh", "strong (adj): mạnh mẽ", "strongly (adv): một cách mạnh mẽ"]}, {"q": "4. It is very _______________ to watch these movies. I think you should watch them.", "answer": "entertaining", "explanation": "Tính từ: entertain + ing → entertaining (mang tính giải trí, thú vị).", "vi": "Xem những bộ phim này rất thú vị. Tôi nghĩ bạn nên xem chúng.", "family": ["entertain (v): giải trí, chiêu đãi", "entertainment (n): sự giải trí, ngành giải trí", "entertaining (adj): mang tính giải trí, thú vị", "entertainer (n): người làm giải trí"]}, {"q": "5. I like doing DIY because it helps me to save money and increase my ____________ as well.", "answer": "creativity", "explanation": "Danh từ: create → creativity (sự sáng tạo, khả năng sáng tạo).", "vi": "Tôi thích làm đồ tự chế vì nó giúp tôi tiết kiệm tiền và tăng khả năng sáng tạo của mình nữa.", "family": ["create (v): tạo ra, sáng tạo", "creation (n): sự sáng tạo, tác phẩm", "creativity (n): sự sáng tạo (khả năng)", "creative (adj): sáng tạo"]}, {"q": "6. Little John is keen on acting at school shows, and he wants to be a __________ in the future.", "answer": "comedian", "explanation": "Danh từ chỉ người: comedy → comedian (diễn viên hài).", "vi": "Cậu bé John rất say mê diễn kịch ở các buổi biểu diễn của trường, và cậu ấy muốn trở thành một diễn viên hài trong tương lai.", "family": ["comedy (n): hài kịch, sự hài hước", "comedian (n): diễn viên hài, người kể chuyện cười", "comic (adj): hài hước (cũng là danh từ: truyện tranh)", "comical (adj): khôi hài, buồn cười"]}, {"q": "7. _____________ improves my overall health and balance, so I practice the sport every weekend.", "answer": "Snowboarding", "explanation": "Danh từ: snowboard → snowboarding (môn trượt ván tuyết).", "vi": "Trượt ván tuyết giúp cải thiện sức khỏe tổng thể và sự cân bằng của tôi, vì vậy tôi tập môn thể thao này mỗi cuối tuần.", "family": ["snowboard (v): trượt ván tuyết", "snowboarding (n): môn trượt ván tuyết", "snowboarder (n): người trượt ván tuyết"]}, {"q": "8. Messaging has won ______________ among students nowadays.", "answer": "popularity", "explanation": "Danh từ: popular → popularity (sự phổ biến).", "vi": "Nhắn tin đã trở nên phổ biến trong giới học sinh ngày nay.", "family": ["popularize (v): phổ biến hóa", "popularity (n): sự phổ biến", "popular (adj): phổ biến", "popularly (adv): một cách phổ biến"]}, {"q": "9. Having leisure activities is one of the best ways to make you feel _________.", "answer": "comfortable", "explanation": "Tính từ: comfort → comfortable (thoải mái, dễ chịu).", "vi": "Có các hoạt động giải trí là một trong những cách tốt nhất để khiến bạn cảm thấy thoải mái.", "family": ["comfort (v/n): an ủi, làm cho thoải mái; sự thoải mái", "comfortable (adj): thoải mái, dễ chịu", "comfortably (adv): một cách thoải mái", "uncomfortable (adj): không thoải mái"]}, {"q": "10. My dad was _______________ when I could repair my own bike.", "answer": "surprised", "explanation": "Tính từ đuôi -ed: surprise → surprised (ngạc nhiên, chỉ người).", "vi": "Bố tôi đã rất ngạc nhiên khi tôi có thể tự sửa xe đạp của mình.", "family": ["surprise (v/n): làm ngạc nhiên; sự ngạc nhiên", "surprised (adj): ngạc nhiên (khi một người cảm thấy)", "surprising (adj): đáng ngạc nhiên (khi một điều gì đó gây ra)", "surprisingly (adv): một cách đáng ngạc nhiên"]}]}, {"roman": "VII", "navLabel": "Đọc điền từ", "title": "Reading: Choose the best answer (Cloze passages)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "A) Mountain climbing", "html": "There are a lot of pastimes that young people like, and one of ___(1)___ is mountain climbing. It is an activity that people can do either indoors or outdoors. If you go climbing outdoors, it is a great way to ___(2)___ your strength and enjoy nature at the same time. You can even set up your own climbing wall in your backyard or ___(3)___ your home. This way you don't have to go out and still can ___(4)___ fit and enjoy the activity. So how can you start mountain climbing? Many people take a class to learn how to climb and use their equipment ___(5)___. Others join climbing clubs to make new friends with the same interest and go climb together. If you are an active person and like outdoor activities, ___(6)___ don't you try this activity?", "vi": "Có rất nhiều thú vui mà giới trẻ yêu thích, và một trong số đó là leo núi. Đây là một hoạt động mà mọi người có thể thực hiện trong nhà hoặc ngoài trời. Nếu bạn leo núi ngoài trời, đó là một cách tuyệt vời để (2) ___ sức mạnh của bạn và tận hưởng thiên nhiên cùng lúc. Bạn thậm chí có thể tự dựng một bức tường leo núi trong sân sau hoặc (3) ___ nhà mình. Bằng cách này, bạn không cần phải ra ngoài mà vẫn có thể (4) ___ khỏe mạnh và tận hưởng hoạt động này. Vậy làm thế nào để bắt đầu leo núi? Nhiều người tham gia một lớp học để học cách leo núi và sử dụng thiết bị (5) ___. Những người khác tham gia câu lạc bộ leo núi để kết bạn mới có cùng sở thích và cùng nhau đi leo núi. Nếu bạn là người năng động và thích các hoạt động ngoài trời, (6) ___ không thử hoạt động này nhỉ?"}, "questions": [{"q": "1.", "options": ["them", "they", "theirs", "their"], "answer": 0, "explanation": "\"one of them\" = một trong số chúng, đại từ tân ngữ sau \"of\".", "vis": ["họ, chúng (tân ngữ)", "họ, chúng (chủ ngữ)", "của họ (đại từ sở hữu)", "của họ (tính từ sở hữu)"], "vi": "một trong (1) ___ là leo núi."}, {"q": "2.", "options": ["decrease", "reduce", "increase", "raise"], "answer": 2, "explanation": "\"increase your strength\" = tăng cường sức mạnh của bạn.", "vis": ["giảm bớt, giảm dần", "giảm bớt, thu nhỏ", "tăng cường, gia tăng", "nâng lên, tăng (tiền lương...)"], "vi": "leo núi là một cách tuyệt vời để (2) ___ sức mạnh của bạn."}, {"q": "3.", "options": ["indoor", "inside", "within", "among"], "answer": 1, "explanation": "\"inside your home\" = bên trong nhà bạn.", "vis": ["trong nhà (tính từ)", "bên trong (giới từ)", "trong vòng, trong phạm vi", "giữa, trong số"], "vi": "bạn có thể tự dựng bức tường leo núi trong sân sau hoặc (3) ___ nhà mình."}, {"q": "4.", "options": ["keep", "stay", "go", "give"], "answer": 1, "explanation": "\"stay fit\" = giữ dáng, giữ sức khỏe tốt.", "vis": ["giữ (nghĩa chung)", "giữ (ở trạng thái nào, stay fit)", "đi", "cho, đưa"], "vi": "bạn vẫn có thể (4) ___ khỏe mạnh và tận hưởng hoạt động này."}, {"q": "5.", "options": ["effective", "effect", "effectively", "effectivenes"], "answer": 2, "explanation": "Trạng từ bổ nghĩa cho động từ \"use\": effectively (một cách hiệu quả).", "vis": ["hiệu quả (tính từ)", "hiệu quả, tác động (danh từ)", "một cách hiệu quả (trạng từ)", "tính hiệu quả (danh từ, sai chính tả)"], "vi": "học cách leo núi và sử dụng thiết bị (5) ___."}, {"q": "6.", "options": ["what", "when", "how", "why"], "answer": 3, "explanation": "\"why don't you...?\" = sao bạn không...? (lời đề nghị).", "vis": ["cái gì", "khi nào", "như thế nào", "tại sao, sao (why don't you...?)"], "vi": "sao bạn (6) ___ không thử hoạt động này nhỉ?"}]}, {"roman": "VIII", "navLabel": "Đọc điền từ 2", "title": "Reading: Choose the best answer (Cloze passage B)", "icon": "file-lines", "instructions": "Đọc đoạn văn và chọn đáp án đúng để hoàn thành chỗ trống.", "type": "mcq", "instant": true, "passage": {"title": "B) Leisure time with family", "html": "Some teenagers enjoy ___(1)___ free time with their friends. Others prefer doing leisure activities with their family members. I love spending time with my family because it is a great way to connect ___(2)___ them. At the weekend, we usually go for a bike ride. We cycle to some nearby villages to enjoy the ___(3)___. We take photos and look at them later. My big brother and I are also into cooking. My brother looks for easy recipes. After that, we prepare the ingredients and cook. Sometimes the food is good, but sometimes it is not; nevertheless, we love whatever we cook. The leisure activity I like the most is doing DIY projects with my mum. She teaches me to make my own dresses and doll clothes. On special occasions, we make special dresses together. Once I won the first prize in a costume contest at my school.", "vi": "Một số thanh thiếu niên thích dành (1) ___ thời gian rảnh với bạn bè. Những người khác lại thích làm các hoạt động giải trí cùng gia đình. Tôi thích dành thời gian với gia đình mình vì đó là cách tuyệt vời để gắn kết (2) ___ họ. Vào cuối tuần, chúng tôi thường đi đạp xe. Chúng tôi đạp xe đến vài ngôi làng gần đó để tận hưởng (3) ___. Chúng tôi chụp ảnh và xem lại sau đó. Anh trai tôi và tôi cũng rất thích nấu ăn. Anh tôi tìm những công thức đơn giản. Sau đó, chúng tôi chuẩn bị nguyên liệu và nấu ăn. Đôi khi món ăn ngon, nhưng đôi khi lại không; tuy nhiên, chúng tôi vẫn thích bất cứ món gì mình nấu. Hoạt động giải trí tôi thích nhất là làm các dự án tự chế (DIY) cùng mẹ. Mẹ dạy tôi cách tự may váy và quần áo búp bê của mình. Vào những dịp đặc biệt, chúng tôi cùng nhau may những chiếc váy đặc biệt. Có một lần tôi đã giành giải nhất trong cuộc thi trang phục ở trường mình."}, "questions": [{"q": "7.", "options": ["spending", "to spend", "spend", "spends"], "answer": 0, "explanation": "\"enjoy + V-ing\" = thích thú làm gì.", "vis": ["dành (V-ing, sau enjoy)", "dành (to-V, sai cấu trúc)", "dành (nguyên thể, sai cấu trúc)", "dành (số ít, sai chủ ngữ)"], "vi": "Một số thanh thiếu niên thích (7) ___ thời gian rảnh với bạn bè."}, {"q": "8.", "options": ["to", "with", "from", "on"], "answer": 1, "explanation": "\"connect with sb\" = kết nối, gắn kết với ai.", "vis": ["đến (giới từ, sai)", "với, cùng (connect with)", "từ (giới từ, sai)", "trên, vào (giới từ, sai)"], "vi": "Đó là cách tuyệt vời để gắn kết (8) ___ họ."}, {"q": "9.", "options": ["air pollution", "water pollution", "environmental pollution", "fresh air"], "answer": 3, "explanation": "Đạp xe đến làng quê để tận hưởng không khí trong lành → fresh air.", "vis": ["ô nhiễm không khí", "ô nhiễm nước", "ô nhiễm môi trường", "không khí trong lành"], "vi": "Chúng tôi đạp xe đến vài ngôi làng gần đó để tận hưởng (9) ___."}]}, {"roman": "IX", "navLabel": "Đúng/Sai A", "title": "Reading: Choose True or False (A)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Teenagers' leisure activities", "html": "Nowadays, teenagers often have various leisure activities. Some prefer indoor activities like playing video games, surfing the internet, or doing DIYs. Others enjoy outdoor activities such as sports, cycling, or hanging out with friends. Teenagers can be called a “technology generation” because they spend much of their free time on devices like smartphones and computers. However, joining clubs or doing craft kits are also popular choices. These activities help them relax and develop new skills.", "vi": "Ngày nay, thanh thiếu niên thường có nhiều hoạt động giải trí khác nhau. Một số thích các hoạt động trong nhà như chơi trò chơi điện tử, lướt mạng, hoặc làm đồ tự chế (DIY). Những người khác lại thích các hoạt động ngoài trời như thể thao, đạp xe, hoặc đi chơi cùng bạn bè. Thanh thiếu niên có thể được gọi là “thế hệ công nghệ” vì họ dành phần lớn thời gian rảnh cho các thiết bị như điện thoại thông minh và máy tính. Tuy nhiên, việc tham gia câu lạc bộ hoặc làm bộ dụng cụ thủ công cũng là những lựa chọn phổ biến. Những hoạt động này giúp các em thư giãn và phát triển những kỹ năng mới."}, "questions": [{"q": "1. Teenagers nowadays only prefer indoor activities in their free time.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc nêu cả hoạt động trong nhà lẫn ngoài trời, không chỉ trong nhà → Sai.", "vis": ["Đúng", "Sai"], "vi": "Thanh thiếu niên ngày nay chỉ thích các hoạt động trong nhà vào thời gian rảnh."}, {"q": "2. Teenagers are called a “technology generation” because they spend a lot of time on devices.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"Teenagers can be called a 'technology generation' because they spend much of their free time on devices\" → Đúng.", "vis": ["Đúng", "Sai"], "vi": "Thanh thiếu niên được gọi là 'thế hệ công nghệ' vì họ dành nhiều thời gian cho các thiết bị."}, {"q": "3. Joining clubs and doing craft kits are unpopular choices for teenagers.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"joining clubs or doing craft kits are also popular choices\" → Sai.", "vis": ["Đúng", "Sai"], "vi": "Tham gia câu lạc bộ và làm bộ dụng cụ thủ công là những lựa chọn không phổ biến đối với thanh thiếu niên."}, {"q": "4. Leisure activities only help teenagers relax but do not help them develop skills.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"These activities help them relax and develop new skills\" → Sai.", "vis": ["Đúng", "Sai"], "vi": "Các hoạt động giải trí chỉ giúp thanh thiếu niên thư giãn chứ không giúp phát triển kỹ năng."}, {"q": "5. _______ with friends are considered outdoor activities.", "options": ["Cycling and hanging out", "Joining clubs and doing craft kits", "Leisure activities", "Surfing and doing DIYs"], "answer": 0, "explanation": "Bài đọc: \"outdoor activities such as sports, cycling, or hanging out with friends\".", "vis": ["Đạp xe và đi chơi", "Tham gia câu lạc bộ và làm bộ dụng cụ thủ công", "Các hoạt động giải trí", "Lướt mạng và làm đồ tự chế"], "vi": "_______ cùng bạn bè được coi là các hoạt động ngoài trời."}, {"q": "6. Other teenagers like outdoor activities such as _________ with friends.", "options": ["sports", "cycling", "hanging out", "A, B and C are correct"], "answer": 3, "explanation": "Bài đọc liệt kê cả ba: sports, cycling, hanging out with friends.", "vis": ["thể thao", "đạp xe", "đi chơi", "Cả A, B và C đều đúng"], "vi": "Những thanh thiếu niên khác thích các hoạt động ngoài trời như _________ cùng bạn bè."}]}, {"roman": "X", "navLabel": "Đúng/Sai B", "title": "Reading: Choose True or False (B)", "icon": "book-open", "instructions": "Đọc đoạn văn, xác định Đúng/Sai và chọn đáp án đúng.", "type": "mcq", "instant": true, "passage": {"title": "Nam's DIY hobby", "html": "My name is Nam. In my free time, I enjoy doing DIYs with my old friends. Last week, my sister and I made a small paper house, which took us 3 hours. It doesn't cost much, but it requires a lot of patience. My mother also taught me how to knit. Now, I can knit a small scarf for myself. Besides, I love surfing the Internet to find new recipes for baking. Sometimes I bake cakes for my family on Sunday afternoons. Doing these things helps me relax and stay away from screen time.", "vi": "Tôi tên là Nam. Trong thời gian rảnh, tôi thích làm đồ tự chế (DIY) cùng những người bạn cũ. Tuần trước, chị gái tôi và tôi đã làm một ngôi nhà giấy nhỏ, mất 3 tiếng đồng hồ. Việc này không tốn nhiều tiền, nhưng đòi hỏi rất nhiều kiên nhẫn. Mẹ tôi cũng dạy tôi cách đan len. Bây giờ, tôi có thể tự đan một chiếc khăn quàng nhỏ cho mình. Bên cạnh đó, tôi thích lướt mạng Internet để tìm những công thức nướng bánh mới. Thỉnh thoảng tôi nướng bánh cho gia đình vào chiều Chủ nhật. Làm những việc này giúp tôi thư giãn và tránh xa thời gian nhìn màn hình."}, "questions": [{"q": "1. Nam and his sister made a paper house in three hours.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"my sister and I made a small paper house, which took us 3 hours\" → Đúng.", "vis": ["Đúng", "Sai"], "vi": "Nam và chị gái đã làm một ngôi nhà giấy trong ba tiếng đồng hồ."}, {"q": "2. Making a paper house is very expensive.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"It doesn't cost much\" → Sai.", "vis": ["Đúng", "Sai"], "vi": "Việc làm một ngôi nhà giấy rất tốn kém."}, {"q": "3. Nam's mother showed him how to knit.", "options": ["True", "False"], "answer": 0, "explanation": "Bài đọc: \"My mother also taught me how to knit\" → Đúng.", "vis": ["Đúng", "Sai"], "vi": "Mẹ của Nam đã chỉ cho cậu ấy cách đan len."}, {"q": "4. Nam can knit a large blanket.", "options": ["True", "False"], "answer": 1, "explanation": "Bài đọc: \"I can knit a small scarf\" (khăn quàng nhỏ), không phải chăn lớn → Sai.", "vis": ["Đúng", "Sai"], "vi": "Nam có thể đan một chiếc chăn lớn."}, {"q": "5. Nam enjoys _____ the Internet for new baking recipes.", "options": ["searching", "knitting", "banking", "surfing"], "answer": 3, "explanation": "Bài đọc: \"I love surfing the Internet to find new recipes for baking\".", "vis": ["tìm kiếm", "đan len", "(không phải từ đúng ngữ cảnh)", "lướt (mạng)"], "vi": "Nam thích _____ mạng Internet để tìm công thức nướng bánh mới."}, {"q": "6. Doing DIYs and baking makes Nam feel ____________.", "options": ["enjoyable", "pleased", "tired", "happy"], "answer": 0, "explanation": "Theo đáp án gốc của tài liệu: enjoyable (thú vị, đáng tận hưởng).", "vis": ["thú vị, đáng tận hưởng", "hài lòng", "mệt mỏi", "hạnh phúc"], "vi": "Làm đồ tự chế và nướng bánh khiến Nam cảm thấy ____________."}]}, {"roman": "XI", "navLabel": "Viết lại câu", "title": "Sentence Transformation", "icon": "pen-to-square", "instructions": "Viết lại câu, giữ nguyên nghĩa với câu gốc.", "type": "sentence", "instant": true, "questions": [{"q": "1.", "original": "It took us 30 minutes to rehearse the song. It took Tom one hour to travel to his hometown last week.", "starter": "Tom spent", "answer": "one hour travelling to his hometown last week", "explanation": "It took sb + time + to V = S + spent + time + V-ing.", "vi": "Việc đi về quê của Tom mất một tiếng đồng hồ vào tuần trước.", "note": "It took Tom + time + to travel... → Tom spent + time + travelling...<br>Nghĩa đáp án: Tom đã dành một tiếng đồng hồ để đi về quê vào tuần trước."}, {"q": "2.", "original": "It is really interesting for him to talk with his music teacher about jazz.", "starter": "He fancies", "answer": "talking with his music teacher about jazz", "explanation": "It is interesting for sb to V = sb fancies + V-ing.", "vi": "Việc trò chuyện với giáo viên âm nhạc về nhạc jazz thực sự rất thú vị đối với cậu ấy.", "note": "It is interesting for sb to V → sb + fancies + V-ing<br>Nghĩa đáp án: Cậu ấy rất thích trò chuyện với giáo viên âm nhạc của mình về nhạc jazz."}, {"q": "3.", "original": "Watching historical films is very interesting to my younger brother.", "starter": "My younger brother enjoys", "answer": "watching historical films", "explanation": "be interesting to sb = sb + enjoys + V-ing.", "vi": "Xem phim lịch sử rất thú vị đối với em trai tôi.", "note": "V-ing... + be interesting to sb → sb + enjoys + V-ing<br>Nghĩa đáp án: Em trai tôi rất thích xem phim lịch sử."}, {"q": "4.", "original": "We usually visit museums when we have leisure time.", "starter": "We enjoy", "answer": "visiting museums when we have leisure time", "explanation": "usually V = enjoy + V-ing.", "vi": "Chúng tôi thường đi thăm bảo tàng khi có thời gian rảnh.", "note": "S + usually + V → S + enjoy + V-ing<br>Nghĩa đáp án: Chúng tôi thích thăm bảo tàng khi có thời gian rảnh."}, {"q": "5.", "original": "He likes const completedTasks = new Set();
const scores = {};
const TOTAL_TASKS = DATA.sections.filter(s=>s.type!=='vocab').length;
const wrongBank = new Map(); // key "idx_i" -> {idx,i}
let attemptCount = 1;

function trackResult(idx, i, ok){
  const key = idx+'_'+i;
  if(ok){ wrongBank.delete(key); }
  else { wrongBank.set(key, {idx, i}); }
  updateWrongFab();
  if(!document.getElementById('wrongOverlay').classList.contains('hidden')) renderWrongPanel();
}

function updateWrongFab(){
  const fab=document.getElementById('wrongFab');
  const cnt=document.getElementById('wrongCount');
  cnt.textContent = wrongBank.size;
  if(wrongBank.size>0){ fab.classList.remove('hidden'); fab.classList.add('flex'); }
  else { fab.classList.add('hidden'); fab.classList.remove('flex'); }
}

function openWrongPanel(){
  document.getElementById('wrongOverlay').classList.remove('hidden');
  renderWrongPanel();
}
function closeWrongPanel(){
  document.getElementById('wrongOverlay').classList.add('hidden');
}

function renderWrongPanel(){
  const body=document.getElementById('wrongPanelBody');
  if(wrongBank.size===0){
    body.innerHTML = `<div class="text-center py-10"><div class="text-5xl mb-2">🎉</div><p class="font-bold text-slate-600">Không còn câu nào sai! Bạn đã ôn xong hết.</p></div>`;
    return;
  }
  let html='';
  wrongBank.forEach(({idx,i})=>{
    const s=DATA.sections[idx], q=s.questions[i];
    html += `<div class="task-card bg-white border-2 border-rose-100 rounded-2xl p-4" id="wp_block_${idx}_${i}">
      <p class="text-[11px] font-bold text-rose-400 uppercase tracking-wide mb-1">${s.roman}. ${s.navLabel} · Câu ${i+1}</p>`;
    if(q.image) html += `<div class="mb-2">${q.image}</div>`;
    html += `<p class="font-bold text-slate-800 mb-2">${q.q}</p>`;
    if(s.type==='mcq'){
      html += `<div class="grid sm:grid-cols-2 gap-2">`;
      q.options.forEach((opt,j)=>{
        html += `<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="wp_opt_${idx}_${i}_${j}" onclick="selectWrongMcq(${idx},${i},${j})">
          <span class="font-black text-indigo-700">${optionLetter(j)}.</span> <span>${opt}</span>
        </label>`;
      });
      html += `</div>`;
    } else {
      const w = widthFor(q.answer);
      html += `<input type="text" id="wp_inp_${idx}_${i}" class="answer-input ${s.type==='sentence'?'w-full':w} px-3 py-1.5 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false">
      <button onclick="gradeWrongInput(${idx},${i})" class="ml-2 bg-indigo-900 text-white font-bold px-3 py-1.5 rounded-full text-xs">Kiểm tra</button>`;
    }
    html += `<div class="explanation-box mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm text-blue-800" id="wp_fb_${idx}_${i}"></div>`;
    html += `</div>`;
  });
  body.innerHTML = html;
}

function selectWrongMcq(idx,i,j){
  const s=DATA.sections[idx], q=s.questions[i];
  document.querySelectorAll(`[id^="wp_opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected','correct-opt','wrong-opt'));
  const ok = j===q.answer;
  q.options.forEach((o,k)=>{
    const el=document.getElementById(`wp_opt_${idx}_${i}_${k}`);
    if(k===q.answer) el.classList.add('correct-opt');
    else if(k===j) el.classList.add('wrong-opt');
  });
  const answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
  const fb=document.getElementById(`wp_fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
  fb.classList.add('show');
  trackResult(idx,i,ok);
  // also sync the original section's UI so progress stays consistent
  const mainOpt=document.getElementById(`opt_${idx}_${i}_${j}`);
  if(mainOpt){ selectMcq(idx,i,j); }
  if(ok) setTimeout(()=>{ const b=document.getElementById(`wp_block_${idx}_${i}`); if(b) b.style.opacity='.4'; },400);
}

function gradeWrongInput(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const inp=document.getElementById(`wp_inp_${idx}_${i}`);
  const fb=document.getElementById(`wp_fb_${idx}_${i}`);
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = val!=='' && acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
  trackResult(idx,i,ok);
  const mainInp=document.getElementById(`inp_${idx}_${i}`);
  if(mainInp){ mainInp.value = inp.value; }
  if(ok) setTimeout(()=>{ const b=document.getElementById(`wp_block_${idx}_${i}`); if(b) b.style.opacity='.4'; },400);
}

function restartAll(){
  DATA.sections.forEach((s,idx)=>resetSection(idx));
  wrongBank.clear();
  updateWrongFab();
  closeWrongPanel();
  attemptCount++;
  document.getElementById('attemptText').textContent = `Lượt làm bài: ${attemptCount}`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function normalize(str){
  return (str||'').trim().toLowerCase()
    .replace(/[‘’]/g,"'")
    .replace(/["“”]/g,'')
    .replace(/[.,!?;:]/g,'')
    .replace(/\s+/g,' ');
}
function widthFor(ref){ const l=(ref||'').length; return l<7?'w-24':l<16?'w-40':'w-full'; }

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }
function speak(text, btn){
  try{
    if(!('speechSynthesis' in window)){ alert('Trình duyệt của bạn không hỗ trợ phát âm tự động. Hãy thử Chrome, Edge hoặc Safari.'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    const voices=window.speechSynthesis.getVoices();
    const en=voices.find(v=>/en[-_]?(us|gb)/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    if(btn){ btn.classList.add('speaking'); u.onend=()=>btn.classList.remove('speaking'); u.onerror=()=>btn.classList.remove('speaking'); }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function buildNav(){
  const nav=document.getElementById('navWrap');
  nav.innerHTML = DATA.sections.map((s,i)=>
    `<button class="tab-btn text-sm font-bold px-3 py-2 rounded-full text-slate-600${i===0?' active':''}" id="navbtn_${i}" onclick="showTab(${i})">${s.roman}. ${s.navLabel}</button>`
  ).join('');
}

function optionLetter(i){ return ['A','B','C','D'][i]; }

function renderPassage(p, idx){
  if(!p) return '';
  const viBlock = p.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-indigo-200 text-indigo-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-indigo-200 italic text-slate-500">${p.vi}</p>` : '';
  return `<div class="passage-box mb-4"><p class="font-extrabold text-indigo-900 mb-2"><i class="fa-solid fa-book mr-1"></i>${p.title||''}</p><p id="passage_en_${idx}">${p.html}</p>${viBlock}</div>`;
}
function renderDict(d, idx){
  if(!d) return '';
  const viBlock = d.vi ? `<button onclick="togglePassageVI(${idx})" class="text-xs font-bold bg-white border border-amber-300 text-amber-700 px-3 py-1 rounded-full hover:scale-105 transition mt-2"><i class="fa-solid fa-language mr-1"></i>Dịch tiếng Việt</button>
    <p id="passage_vi_${idx}" class="vi-hidden mt-2 pt-2 border-t border-amber-300 text-slate-600">${d.vi}</p>` : '';
  return `<div class="dict-box mb-4"><p class="font-extrabold text-amber-800 mb-1"><i class="fa-solid fa-book-bookmark mr-1"></i>${d.word} <span class="font-normal italic">${d.ipa||''}</span> <span class="font-normal">(${d.pos||''})</span></p>${d.senses.map(x=>`<p class="mb-1">✱ ${x.def}</p>${(x.examples||[]).map(e=>`<p class="ml-4 italic text-slate-600">• ${e}</p>`).join('')}`).join('')}${viBlock}</div>`;
}

function renderTheory(t){
  if(!t) return '';
  return `<div class="dict-box mb-4"><p class="font-extrabold text-amber-800 mb-1"><i class="fa-solid fa-lightbulb mr-1"></i>${t.title||''}</p><p>${t.html}</p></div>`;
}

function renderVocabSection(s, idx){
  let inner = `<h2 class="text-xl md:text-2xl font-extrabold text-indigo-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'book'} text-amber-400"></i> ${s.roman}. ${s.title}</h2>`;
  if(s.instructions) inner += `<p class="text-sm text-slate-500 mb-3 italic">${s.instructions}</p>`;
  inner += `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">`;
  (s.words||[]).forEach((w,i)=>{
    inner += `<div class="task-card bg-white rounded-2xl shadow-md p-4 flex items-start gap-3">
      <button type="button" data-w="${w.word.replace(/"/g,'&quot;')}" onclick="speak(this.dataset.w,this)" class="speak-btn w-9 h-9 shrink-0 rounded-full bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:scale-110 transition flex items-center justify-center" title="Nghe phát âm" aria-label="Nghe phát âm ${w.word}"><i class="fa-solid fa-volume-high text-sm"></i></button>
      <div class="min-w-0">
        <p class="font-extrabold text-slate-800">${i+1}. ${w.word} <span class="font-normal text-xs text-slate-400">${w.pos||''}</span></p>
        <p class="text-xs text-teal-600 font-semibold">${w.ipa||''}</p>
        <p class="text-sm text-emerald-600 italic">${w.vi||''}</p>
      </div>
    </div>`;
  });
  inner += `</div>`;
  return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">${inner}</section>`;
}

function renderSection(s, idx){
  if(s.type==='vocab') return renderVocabSection(s, idx);
  let inner = `<h2 class="text-xl md:text-2xl font-extrabold text-indigo-900 flex items-center gap-2 mb-1"><i class="fa-solid fa-${s.icon||'circle-check'} text-amber-400"></i> ${s.roman}. ${s.title}</h2>`;
  if(s.instructions) inner += `<p class="text-sm text-slate-500 mb-3 italic">${s.instructions}</p>`;
  inner += renderTheory(s.theory);
  inner += renderPassage(s.passage, idx);
  inner += renderDict(s.dict, idx);

  inner += `<div class="space-y-4">`;
  s.questions.forEach((q,i)=>{
    inner += `<div class="task-card bg-white rounded-2xl shadow-md p-4" id="qblock_${idx}_${i}">`;
    if(q.image) inner += `<div class="mb-3">${q.image}</div>`;
    inner += `<p class="font-bold text-slate-800 mb-2"><span class="bg-slate-100 text-slate-600 text-xs font-black px-2 py-1 rounded-lg mr-2">${i+1}</span>${q.q}</p>`;
    if(s.type==='mcq'){
      inner += `<div class="grid sm:grid-cols-2 gap-2">`;
      q.options.forEach((opt,j)=>{
        const ipa = q.ipas ? q.ipas[j] : null;
        const optVi = q.vis ? q.vis[j] : null;
        const cleanWord = opt.replace(/<[^>]+>/g,'');
        const wordBlock = (ipa || optVi)
          ? `<span class="flex flex-col leading-tight"><span>${opt}</span>${ipa?`<span class="text-[10px] text-slate-400 font-normal mcq-detail-hidden">${ipa}</span>`:''}${optVi?`<span class="text-[10px] text-emerald-500 font-normal italic mcq-detail-hidden">${optVi}</span>`:''}</span>
             <button type="button" data-w="${cleanWord}" onclick="event.stopPropagation();event.preventDefault();speak(this.dataset.w,this)" class="speak-btn w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:scale-110 transition flex items-center justify-center ml-auto shrink-0 mcq-detail-hidden" title="Nghe phát âm" aria-label="Nghe phát âm ${cleanWord}"><i class="fa-solid fa-volume-high text-[10px]"></i></button>`
          : `<span>${opt}</span>`;
        inner += `<label class="option-label rounded-xl px-3 py-2 text-sm font-semibold flex items-center gap-2" id="opt_${idx}_${i}_${j}" onclick="selectMcq(${idx},${i},${j})">
          <input type="radio" name="mcq_${idx}_${i}" class="accent-indigo-700" style="display:none">
          <span class="font-black text-indigo-700">${optionLetter(j)}.</span> ${wordBlock}
        </label>`;
      });
      inner += `</div>`;
    } else if(s.type==='fill'){
      const w = widthFor(q.answer);
      const famBlock = q.family ? `<div class="wordfam-box mt-2">${q.family.map(f=>`<div>• ${f}</div>`).join('')}</div>` : '';
      inner += `<div class="flex items-center gap-2 flex-wrap">`;
      if(q.hint) inner += `<span class="blank-tag text-xs">${q.hint}</span>`;
      inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input ${w} px-3 py-1.5 rounded-lg text-sm font-semibold" placeholder="Nhập đáp án..." autocomplete="off" spellcheck="false"></div>${famBlock}`;
    } else if(s.type==='sentence'){
      const instantAttr = s.instant ? ` oninput="gradeOneSentence(${idx},${i})"` : '';
      if(q.starter){
        inner += `<p class="text-slate-700 text-sm mb-2">${q.original}</p>
        <div class="flex items-center gap-3 w-full flex-wrap">
          <span class="text-slate-800 font-extrabold text-base whitespace-nowrap">${q.starter}</span>
          <input type="text" id="inp_${idx}_${i}" class="answer-input flex-1 min-w-[180px] px-3 py-2 rounded-lg text-sm font-semibold" placeholder="..." autocomplete="off" spellcheck="false"${instantAttr}>
        </div>`;
      } else {
        inner += `<input type="text" id="inp_${idx}_${i}" class="answer-input w-full px-3 py-2 rounded-lg text-sm font-semibold" placeholder="Viết câu trả lời..." autocomplete="off" spellcheck="false"${instantAttr}>`;
      }
    }
    inner += `<div class="explanation-box mt-2 bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-sm text-blue-800" id="fb_${idx}_${i}"></div>`;
    inner += `</div>`;
  });
  inner += `</div>`;

  inner += `<div class="flex flex-wrap gap-2 mt-5">
    <button onclick="checkSection(${idx})" class="bg-gradient-to-r from-indigo-900 to-pink-600 text-white font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-check mr-1"></i>Kiểm tra</button>
    <button onclick="revealSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-eye mr-1"></i>Xem đáp án</button>
    <button onclick="resetSection(${idx})" class="bg-white border-2 border-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-full text-sm"><i class="fa-solid fa-rotate-left mr-1"></i>Làm lại</button>
    <span id="score_${idx}" class="hidden ml-auto self-center font-extrabold text-emerald-600 text-sm score-badge"></span>
  </div>`;

  return `<section id="tab-${idx}" class="section-page${idx===0?' active':''} space-y-4">${inner}</section>`;
}

function buildMain(){
  const main=document.getElementById('mainWrap');
  main.innerHTML = DATA.sections.map((s,i)=>renderSection(s,i)).join('');
}

function togglePassageVI(idx){ const el=document.getElementById(`passage_vi_${idx}`); if(el) el.classList.toggle('vi-hidden'); }
function selectMcq(idx,i,j){
  const q=DATA.sections[idx].questions[i];
  document.querySelectorAll(`[id^="opt_${idx}_${i}_"]`).forEach(el=>el.classList.remove('selected'));
  document.getElementById(`opt_${idx}_${i}_${j}`).classList.add('selected');
  document.getElementById(`opt_${idx}_${i}_${j}`).dataset.chosen = j;
  if(DATA.sections[idx].instant){ gradeOneMcq(idx,i); }
}

function gradeOneMcq(idx,i){
  const s=DATA.sections[idx], q=s.questions[i];
  const qblock=document.getElementById(`qblock_${idx}_${i}`);
  if(qblock) qblock.classList.add('show-mcq-detail');
  const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
  const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
  const ok = chosen === q.answer;
  const answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
  q.options.forEach((o,j)=>{
    const el=document.getElementById(`opt_${idx}_${i}_${j}`);
    el.classList.remove('correct-opt','wrong-opt');
    if(j===q.answer) el.classList.add('correct-opt');
    else if(j===chosen) el.classList.add('wrong-opt');
  });
  const fb=document.getElementById(`fb_${idx}_${i}`);
  fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
  fb.classList.add('show');
  trackResult(idx,i,ok);
}

function gradeOneSentence(idx,i){
  const q=DATA.sections[idx].questions[i];
  const inp=document.getElementById(`inp_${idx}_${i}`);
  const fb=document.getElementById(`fb_${idx}_${i}`);
  if(!inp || !fb) return;
  const raw=inp.value.trim();
  if(raw===''){
    inp.classList.remove('correct-input','wrong-input');
    fb.classList.remove('show'); fb.innerHTML='';
    return;
  }
  const val=normalize(inp.value);
  const acc=(q.accepted||[q.answer]).map(normalize);
  const ok = acc.includes(val);
  inp.classList.remove('correct-input','wrong-input');
  inp.classList.add(ok?'correct-input':'wrong-input');
  fb.innerHTML = feedbackHTML(ok, q.answer, q.explanation, q.vi, q.note);
  fb.classList.add('show');
  trackResult(idx,i,ok);
}

function feedbackHTML(ok, answerLabel, explanation, vi, note){
  const okLine = ok? `<span class="text-emerald-700 font-bold">✅ Chính xác!</span>` : `<span class="text-rose-600 font-bold">❌ Chưa đúng.</span> Đáp án đúng: <b>${answerLabel}</b>`;
  const expLine = explanation? `<br><span class="text-blue-700">💡 ${explanation}</span>` : '';
  const viLine = vi? `<span class="text-slate-500">📖 Nghĩa: <i>${vi}</i></span>` : '';
  const noteLine = note? `<br><span class="text-violet-600">📐 Công thức: <b>${note}</b></span>` : '';
  if(note){
    return (viLine?viLine+'<br>':'') + okLine + expLine + noteLine;
  }
  return okLine + expLine + (viLine?'<br>'+viLine:'') + noteLine;
}

function checkSection(idx){
  const s=DATA.sections[idx];
  let correct=0;
  s.questions.forEach((q,i)=>{
    let ok=false, answerLabel='';
    const fb=document.getElementById(`fb_${idx}_${i}`);
    if(s.type==='mcq'){
      const chosenEl=document.querySelector(`#tab-${idx} [id^="opt_${idx}_${i}_"].selected`);
      const chosen = chosenEl ? parseInt(chosenEl.dataset.chosen) : -1;
      ok = chosen === q.answer;
      answerLabel = `${optionLetter(q.answer)}. ${q.options[q.answer]}`;
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
        else if(j===chosen) el.classList.add('wrong-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      const val=normalize(inp.value);
      const acc=(q.accepted||[q.answer]).map(normalize);
      ok = val!=='' && acc.includes(val);
      inp.classList.remove('correct-input','wrong-input');
      inp.classList.add(ok?'correct-input':'wrong-input');
      answerLabel = q.answer;
    }
    if(ok) correct++;
    fb.innerHTML = feedbackHTML(ok, answerLabel, q.explanation, q.vi, q.note);
    fb.classList.add('show');
    trackResult(idx,i,ok);
  });
  const total=s.questions.length;
  scores[idx]={correct,total};
  const scoreEl=document.getElementById(`score_${idx}`);
  scoreEl.textContent = `🏆 Điểm: ${correct}/${total}`;
  scoreEl.classList.remove('hidden');
  completedTasks.add(idx);
  updateProgress();
  if(completedTasks.size===TOTAL_TASKS) setTimeout(showCompletion,500);
}

function revealSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    const fb=document.getElementById(`fb_${idx}_${i}`);
    let answerLabel = s.type==='mcq' ? `${optionLetter(q.answer)}. ${q.options[q.answer]}` : q.answer;
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt');
        if(j===q.answer) el.classList.add('correct-opt');
      });
      const qblock=document.getElementById(`qblock_${idx}_${i}`);
      if(qblock) qblock.classList.add('show-mcq-detail');
    }
    fb.innerHTML = `👁️ Đáp án: <b>${answerLabel}</b>` + (q.explanation?`<br><span class="text-blue-700">💡 ${q.explanation}</span>`:'') + (q.vi?`<br><span class="text-slate-500">📖 Nghĩa: <i>${q.vi}</i></span>`:'') + (q.note?`<br><span class="text-violet-600">📐 Công thức: <b>${q.note}</b></span>`:'');
    fb.classList.add('show');
  });
}

function resetSection(idx){
  const s=DATA.sections[idx];
  s.questions.forEach((q,i)=>{
    if(s.type==='mcq'){
      q.options.forEach((o,j)=>{
        const el=document.getElementById(`opt_${idx}_${i}_${j}`);
        el.classList.remove('correct-opt','wrong-opt','selected');
        delete el.dataset.chosen;
      });
    } else {
      const inp=document.getElementById(`inp_${idx}_${i}`);
      if(inp){ inp.value=''; inp.classList.remove('correct-input','wrong-input'); }
    }
    const qblock=document.getElementById(`qblock_${idx}_${i}`);
    if(qblock) qblock.classList.remove('show-mcq-detail');
    const fb=document.getElementById(`fb_${idx}_${i}`);
    fb.classList.remove('show'); fb.innerHTML='';
  });
  const scoreEl=document.getElementById(`score_${idx}`); scoreEl.classList.add('hidden');
  completedTasks.delete(idx); delete scores[idx]; updateProgress();
  s.questions.forEach((q,i)=>wrongBank.delete(idx+'_'+i));
  updateWrongFab();
}

function showTab(idx){
  document.querySelectorAll('.section-page').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active'); b.classList.add('text-slate-600');});
  document.getElementById(`tab-${idx}`).classList.add('active');
  const btn=document.getElementById(`navbtn_${idx}`);
  btn.classList.add('active'); btn.classList.remove('text-slate-600');
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const done=completedTasks.size;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL_TASKS} phần`;
  document.getElementById('progressBar').style.width = `${(done/TOTAL_TASKS)*100}%`;
}

function showCompletion(){
  fireConfetti();
  const banner=document.getElementById('completionBanner');
  banner.classList.remove('hidden'); banner.classList.add('show');
  let c=0,t=0; Object.values(scores).forEach(s=>{c+=s.correct; t+=s.total;});
  document.getElementById('finalScoreDisplay').textContent = `🎯 ${c} / ${t} câu đúng`;
}
function closeBanner(){ const b=document.getElementById('completionBanner'); b.classList.remove('show'); b.classList.add('hidden'); }
function fireConfetti(){
  const wrap=document.getElementById('confettiWrap'); wrap.innerHTML='';
  const colors=['#7c2d12','#ea580c','#f59e0b','#fbbf24','#0891b2','#6366f1'];
  for(let i=0;i<90;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    wrap.appendChild(p);
  }
  setTimeout(()=>{wrap.innerHTML='';},4000);
}

buildNav();
buildMain();
updateProgress();
updateWrongFab();
</script>
</body>
</html>
